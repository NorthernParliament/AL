chapter1:
  rows:
  - text:
      - "В полутемной комнате под стеклянным куполом парил кристалл, излучающий бледно-голубое свечение."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Так это и есть тот самый «образец минерала», который вы собрали?.."
      - "Почему его размер так сильно отличается от того, что упоминалось в отчетах?"
  - char: "tallinn"
    side: "right"
    text:
      - "Когда мы только их собрали, образцы действительно представляли собой разрозненные мелкие кристаллики."
      - "Однако в ходе последующих экспериментов мы обнаружили, что при определенных условиях они способны сливаться воедино."
      - "И после слияния их свойства становятся еще сильнее..."
      - "Так что... после множества таких слияний мы и получили этот конечный продукт."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "...Удивительное явление. Могу я подойти поближе?"
  - char: "tallinn"
    side: "right"
    text:
      - "Ты имеешь в виду... Я поняла."
      - "Без проблем, но чтобы наше присутствие не помешало тебе испытать явление резонанса, мы с Полтавой пока выйдем."
      - "Затем я открою контейнер, и ты сможешь свободно осмотреть его, трогать тоже разрешается."
      - "Мы уже всё проверили, это абсолютно безопасно."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Хорошо, спасибо."

chapter2:
  rows:
  - text:
      - "После того как Таллин и Полтава ушли, стеклянный купол, накрывавший образец минерала, опустился."
      - "Советский Союз медленно подошла и начала внимательно его рассматривать."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "(Внешне похоже на драгоценный камень... но абсолютно чистый, без каких-либо примесей.)"
      - "(...Скорее, похоже на кусок льда? Он излучает слабое голубое сияние... Неужели это как-то связано с материалами, из которых создают Кубы Мудрости?)"
  - text:
      - "Некоторые ассоциации, вызванные наблюдением, всплыли в сознании у Советский Союз."
      - "Но помимо этого..."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "(В отличие от того, что описывалось в отчетах, я не чувствую «явления резонанса» при приближении.)"
      - "(Неужели... мой Куб Мудрости и правда имеет дефект, которого нет у других?..)"
  - text:
      - "Советский Союз на мгновение заколебалась, но затем приняла решение."
      - "Шаг, два, три. Наконец, кристалл оказался на расстоянии вытянутой руки."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "(Похоже, придется убедиться во всем прямым прикосновением...)"
      - "(......Что ж, попробуем.)"
  - text:
      - "Советский Союз протянула правую руку. Кончиками пальцев она почувствовала лёгкое прикосновение."

chapter3:
  rows:
  - text:
      - "В белом пространстве безмолвно стояла дверь."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "...Дверь?"
      - "...Пожалуй, зайду и посмотрю."

chapter4:
  rows:
  - char: "anzeel???"
    side: "left"
    text:
      - "Вау... качество связи отличное, к тому же решена проблема с прослушкой."
      - "Это решение д-ра Аосте и правда весьма неплохо..."
  - char: "sophia???"
    side: "right"
    text:
      - "Как бы это сказать, ты тоже молодец, раз согласилась предоставить свой частный самолет для этой затеи..."
  - char: "anzeel???"
    side: "left"
    text:
      - "Хе-хе, нужно же использовать вещи по максимуму."
  - char: "collet???"
    side: "right"
    text:
      - "И поэтому... я вынуждена отправиться в командировку? У меня ведь и так полно своей работы..."
  - char: "anzeel???"
    side: "left"
    text:
      - "Тебе всё равно рано или поздно пришлось бы ехать в эту командировку, а со мной ты хотя бы наслаждаешься полетом на частном самолете!"
      - "Разве это не лучше, чем условия, которые предлагает Торговый союз~"
      - "К тому же д-р Аосте забрал моего ассистента, так что в пути мне нужен хоть какой-то помощник!"
  - char: "collet???"
    side: "right"
    text:
      - "Эх..."
  - char: "sophia???"
    side: "left"
    text:
      - "Ладно-ладно~ Раз уж оказалась на этом судне, смирись со своей участью."
      - "До того как мы покинем зону действия сигнала, у нас есть около двух часов на разговор."
      - "Время ограничено, так что давайте перейдем к делу, наша «госпожа Творец»~"
  - char: "anzeel???"
    side: "right"
    text:
      - "Что еще за «госпожа Творец»... Хватит перенимать дурные привычки д-ра Аосте!"
  - char: "sophia???"
    side: "left"
    text:
      - "Хм? А мне почему-то смутно помнится, что кое-кто сама первой использовала это слово на прошлом совещании."
      - "Тогда, когда мы обсуждали проблему внедрения и закрепления концепций, ты сказала: раз уж имя и образ могут какое-то время существовать независимо друг от друга, то..."
  - char: "anzeel???"
    side: "right"
    text:
      - "Ва-а-а-а-а!.."
  - char: "sophia???"
    side: "left"
    text:
      - "Вспомнила?"
  - char: "anzeel???"
    side: "right"
    text:
      - "Я ж-же тогда сказала! Это были просто мысли вслух, не бери в голову!"
      - "И зачем ты вообще это запомнила..."
      - "Ладно-ладно, давайте лучше вернемся к нашей главной теме — Советский Союз."
      - "К тому самому военному кораблю, что оставил свое имя в памяти людей, но так и не был по-настоящему достроен..."

chapter5:
  rows:
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "То, что только что всплыло в моей памяти..."
      - "Ух..!"
  - text:
      - "В месте прикосновения кончиков пальцев сила притяжения неожиданно стала возрастать."
      - "Словно пытаясь затянуть прикоснувшегося прямо внутрь кристалла."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Это чувство... не к добру."
      - "Нужно как можно скорее разорвать контакт!.."
  - text:
      - "Советский Союз развернула оснастку, изо всех сил сопротивляясь исходящей из кристалла мощи, которая, казалось, начала поглощать все ее тело."

chapter6:
  rows:
  - text:
      - "Прошли секунды, минуты, или, быть может, часы."
      - "Мучительные ощущения притупили чувство времени."
      - "Наконец, сила, сокрытая в минерале, казалось, иссякла."
      - "Ослепительный свет внезапно погас, сросшийся кристалл рассыпался на куски, и в лабораторном блоке вновь воцарилась тишина."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Ха-а... ха-а..."
      - "Наконец-то..."
      - "Всё закончилось?.."
      - "В отчетах не упоминалось..."
      - "Что может возникнуть столь опасная ситуация..."
      - "...Стоп!.."
      - "...Что с моей оснасткой?!.."
  - text:
      - "В тот миг, когда Советский Союз осознала это, из глубины её души поднялась дрожь."
      - "В ушах стоял грохот и рев гигантских механизмов."
      - "Этот рев, подобный рыку живого существа, словно возвещал о перерождении, прорвавшемся сквозь толщу льда и кристальный кокон."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Оснастка?.. Моя?!"
      - "Это... как такое возможно."
      - "Характеристики этой экипировки превосходят даже новейшую модель... оснастку товарища Чкалов?!"
      - "Это влияние минерала?.. Но сам минерал при этом не израсходовался..."
      - "Значит, на меня повлияла та сила, что таилась внутри минерала?.."
      - "И затем из ниоткуда... нет, не из ниоткуда."
      - "Эта сила, следуя каким-то своим законам, просто перестроила оснастку прямо на мне?.."
      - "...Я чувствую эту силу, которая сейчас исходит от оснастки и растекается по всему моему телу."
      - "Эта сила, кажется, заполняет некоторые... «пустоты», которые раньше существовали в моем Кубе Мудрости."
      - "...Делая «тело» более завершенным?.."
      - "Странно... почему у меня возникает такое чувство..."
      - "И что это были за образы, только что всплывшие в моей голове, почему они появились именно тогда, когда я коснулась кристалла..."
      - "Кто были те люди? Ведь то, о чем они говорили, кажется, было связано с «моим» рождением..."
      - "Нет... тех знаний, которыми я сейчас располагаю, совершенно недостаточно, чтобы объяснить то, что со мной происходит."
      - "Мне нужно больше информации..."

chapter7:
  rows:
  - char: "tallinn_rad"
    side: "right"
    text:
      - "Прости, товарищ Союз, что беспокою тебя в такой момент."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Ничего страшного, мои тесты здесь уже завершены."
      - "Что-то случилось?"
  - char: "tallinn_rad"
    side: "right"
    text:
      - "Да. Пока ты проводила тесты, мы получили донесение из крепости Железной Крови."
      - "«В прилегающем районе неопознанные враждебные силы атакуют нашу исследовательскую группу»."
      - "В соответствии с соглашением, они уведомили нас об этом и посоветовали повысить бдительность."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Нападение неопознанных сил... Флот Союза Орла явно собирался не просто так."
      - "Отправь сообщение Железной Крови, запроси подробности нападения, а затем передай информацию об этом инциденте Союзу Орла."
      - "Заодно спроси, не «знают» ли они чего-нибудь о силах, совершивших нападение."
  - char: "ognevoy_rad"
    side: "right"
    text:
      - "Как же так... Неужели в Антарктике и правда появился враг!"
  - char: "svirepy_rad"
    side: "left"
    text:
      - "Хм, похоже, наше недавнее патрулирование станции и правда было совершенно необходимо!"
  - char: "poltava"
    side: "right"
    text:
      - "Вы заметили что-нибудь необычное во время патруля?"
  - char: "pamiat_merkuria_rad"
    side: "left"
    text:
      - "Вовсе нет, на исследовательской станции всё в полном порядке."
  - char: "poltava"
    side: "right"
    text:
      - "Отлично, тогда теперь нам остается лишь повысить бдительность и ждать дальнейших новостей..."
  - char: "pamiat_merkuria_rad"
    side: "left"
    text:
      - "Подождите, крепость Железной Крови ведь находится рядом с «зоной таяния снегов», верно?"
      - "Разве это не на одном маршруте с нашим пунктом назначения?"
      - "Не кажется ли вам, что просто сидеть и ждать новостей — это слишком пассивно?"
      - "Нам всё равно нужно в «зону таяния снегов», как насчет того, чтобы зайти по пути и помочь?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "В этом есть смысл. Если ситуация в Антарктике обостряется, мы должны успеть выполнить все цели нашей поездки до того, как всё окончательно выйдет из-под контроля."
      - "Таллин, ты остаешься на базе, отвечаешь за оборону и сбор информации. Мы же отправимся в крепость Железной Крови для тщательного расследования этого инцидента."
  - char: "tallinn_rad"
    side: "left"
    text:
      - "Без проблем. В Антарктике суровые условия, так что будьте осторожны в пути."
