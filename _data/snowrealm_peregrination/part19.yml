chapter1:
  rows:
  - text:
      - "За секунду красные точки, обозначающие вражеские цели, усеяли весь экран."
      - "Ситуация в Антарктике, до сих пор остававшаяся спокойной и стабильной, начала стремительно ухудшаться."
  - char: "memphis_rad"
    side: "right"
    text:
      - "Командир, судя по идентификации, враги, появившиеся повсюду в Антарктике, это... Дирои."
  - char: "commander"
    side: "left"
    text:
      - "Дирои? Приспешники Иерофант из инцидента с «Царством Божьим»?.."
      - "...Неужели этот инцидент связан с ней."
  - char: "memphis_rad"
    side: "right"
    text:
      - "Если это так, она хочет превратить Антарктику во второе «Царство Божье»?!"
      - "Но чтобы Иерофант смогла сойти в наш мир, ей как минимум нужен «проводник», верно?"
      - "В прошлый раз её проводником стала Марко Поло, кто же им будет на этот раз?"
      - "Неужели... Советский Союз?"
  - char: "commander"
    side: "left"
    text:
      - "Это абсолютно невозможно."
      - "И Советский Союз, и Саратога прибыли в Антарктику совсем недавно."
      - "Тот, кто расставил фигуры вместо Иерофант... это совершенно точно кто-то другой."
  - char: "helena_rad"
    side: "right"
    text:
      - "Командир, флот операции «Ледяной ангел» вступил в бой с Дироями."
      - "Хотя их скорость и снизилась, они продолжают продвигаться к «зоне таяния снегов»."
      - "Действия флота Северного Парламента прямо противоположны. Они... покидают «зону таяния снегов» и направляются в сторону береговой линии."
  - char: "memphis_rad"
    side: "left"
    text:
      - "...И в такой ситуации Саратога предпочла продолжить путь к «зоне таяния снегов»?!"
      - "Командир, это слишком опасно, мы должны скорее её остановить."
  - char: "commander"
    side: "right"
    text:
      - "Да, мы так и сделаем. Но не стоит действовать вслепую, нам всё еще не хватает кое-какой ключевой информации."
      - "...Похоже, пришло время напрямую вмешаться в ситуацию в Антарктике."

chapter2:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Брешь пробита, товарищи, за мной в атаку!"
      - "Даже если ранены, не останавливайтесь, направляемся прямиком к подводной лодке!"
  - char: "all"
    side: "right"
    text:
      - "Есть!"
  - char: "communicator"
    side: "left"
    text:
      - "*Пип... пи-пип...*"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Входящий вызов?"
      - "Командир?!"
  - char: "poltava"
    side: "left"
    text:
      - "А?! Товарищ Командир?!"
      - "Разве Кёнигсберг не говорила, что вся внешняя связь в Антарктике глушится?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "К тому же, выйти на связь в такой критический момент... Неужели..."
      - "Верно, похоже, товарищ Командир издалека наблюдает за ситуацией в Антарктике и готов действовать."
      - "Выйти на связь сейчас... должно быть, чтобы получить информацию прямо с передовой."
      - "Хе-хе... что ж, давай сражаться плечом к плечу, товарищ Командир."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "...Фальшивые кристаллы минерала... План Обсервер с призывом о помощи."
      - "...Бункер Судного дня Северного Парламента, а также... Память Меркурия META, управляющая Дироями."
      - "...Теперь все зацепки сложились воедино."
      - "Оказывается, Мейнфрейм Обсервер, который все так долго искали, находится в океане под ледяным панцирем континента Антарктика."
      - "А построенный здесь Северным Парламентом бункер Судного дня «Кольцо Мудрости» — это искусственное сооружение, физически расположенное ближе всего к её Мейнфрейму."
      - "Опираясь на поддержку Иерофант, Память Меркурия META использовала этот комплекс, чтобы вычислить местоположение Мейнфрейма Обсервер, и каким-то образом заманила её в ловушку."
      - "Оказавшись в безвыходном положении, Обсервер могла рассчитывать только на ближайшее к ней «Кольцо Мудрости»."
      - "Заставив его произвести «особый минерал», она использовала его как приманку, чтобы завлечь сюда флоты различных фракций."
      - "Получив эти сведения, Саратога, должно быть, каким-то образом распознала кроющуюся за ними опасность."
      - "Поэтому при подготовке к операции она и собрала столь масштабный боевой флот."
      - "Затем Хелена МЕТА решила передать эти сведения мне. Потому что она хорошо знает не только Память Меркурия META, но и меня."
      - "Как и ожидалось... получив эти сведения, я принял решение направить в Антарктику силы различных фракций одновременно, включая Северный Парламент, чтобы сорвать планы Обсервер."
      - "А возглавила этот флот Северного Парламента, что совершенно не удивительно, Советский Союз, оснастка которой имела неисправности."
      - "Появление Советский Союз, как и ожидалось, пробудило интерес Памяти Меркурия META..."
      - "Поэтому она не стала раскрывать себя сразу же и препятствовать флотам, направляющимся в Антарктику."
      - "Вместо этого она решила сыграть в поддавки, позволив Советскому Союзу провести расследование, чтобы подготовить почву и склонить её на свою сторону."
      - "Разумеется, план по переманиванию Советский Союз провалился, что было вполне ожидаемо... Более того, в процессе Советский Союз смогла собрать достаточно разведывательных данных."
      - "А затем... стоило мне решиться связаться с Союз и взять управление боем на себя, как эта информация естественным образом оказалась у меня, и картина происходящего прояснилась."
      - "Стоило мне решиться..."
      - "«Хотела подтолкнуть меня сделать шаг вперед»... вот как."
      - "Хелена..."
  - char: "memphis_rad"
    side: "right"
    text:
      - "Командир, вы закончили свой разговор? Что нам делать дальше?"
  - char: "commander"
    side: "left"
    text:
      - "Да, теперь текущая ситуация предельно ясна."
      - "Во-первых, свяжись с Клемансо и передай ей, что я хочу позаимствовать её здание Трибунала под командный центр."
      - "Заодно попроси её организовать мне встречу с Бисмарк, чуть позже я проведу с ней совещание."
      - "Затем вы тоже отправляйтесь прямиком в здание Трибунала. Я улажу кое-какие дела и присоединюсь к вам."
  - char: "memphis_rad"
    side: "right"
    text:
      - "А?.. Э? Подождите... Вы хотите сказать... А?"
  - char: "commander"
    side: "left"
    text:
      - "Ты всё правильно расслышала, выполняй приказ. Как только прибудете в Трибунал, я вам всё объясню."
  - char: "memphis_rad"
    side: "right"
    text:
      - "Есть... Вас поняла!"
      - "Сейчас же займусь этим, Мемфис конец связи."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "..."
      - "А теперь... пришло время связаться с Саратогой."
