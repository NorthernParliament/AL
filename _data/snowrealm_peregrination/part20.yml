chapter1:
  rows:
  - text:
      - "Приведя мысли в порядок, я вызвал Саратогу через приватный канал."
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "...Саратога на связи."
  - char: "commander"
    side: "left"
    text:
      - "Это я."
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "...А? Э! Ах... К-Командир... это ты, что-то случилось?"
      - "О-очень не вовремя. Сестренка Сара сейчас очень занята..."
  - char: "commander"
    side: "left"
    text:
      - "Занята операцией «Ледяной ангел»?"
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "Э..."
      - "...А я-то думала, что мы отлично всё засекретили. Как и ожидалось, от тебя ничего не скрыть."
      - "Откуда ты узнал?"
      - "К тому же... тебе не помешали помехи, накрывшие Антарктику, чтобы вызвать меня..."
      - "...Ладно, забудь."
      - "Раз ты смог это сделать, то, должно быть, прекрасно осведомлен о текущей ситуации в Антарктике."
  - char: "commander"
    side: "left"
    text:
      - "Да... Внезапно появились Дирои, и вы уже втянуты в тяжелый бой."
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "............"
  - char: "commander"
    side: "left"
    text:
      - "С твоими источниками информации ты должна прекрасно знать истинное происхождение имеющихся у нас «Кубов Мудрости»."
      - "В то же время, ты также должна прекрасно понимать, чем именно Сирены могут манипулировать из тени и какими методами они это делают."
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "...Ты даже это выяснил."
  - char: "commander"
    side: "left"
    text:
      - "...Так почему же ты так поступаешь?"
      - "Так называемый минерал, способный резонировать с оснасткой, — это очевидная ловушка. Неужели с твоим умом ты этого не разглядела?"
      - "То же самое касается и тех радикальных испытаний в Море Звёзд, которые ты поручила провести Констеллейшн в обход всех правил безопасности."
      - "Подобные решения, ставящие под угрозу себя и своих товарищей... совсем не похожи на ту Саратогу, которую я знаю."
      - "...Зачем ты это делаешь?"
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "...По крайней мере, сейчас ты в Европе."
      - "...В безопасном месте, вдали от Моря Звёзд и Антарктики, не так ли?.."
      - "Да, ты прав. Еще до того, как отправиться в Антарктику, я знала, что в этот раз мы обязательно столкнемся с опасностью."
      - "Поэтому я приложила все усилия и задействовала свои связи, чтобы собрать для операции «Ледяной ангел» флот масштаба целой военной кампании."
      - "...То, что это ловушка, было очевидно с первого взгляда. Кубы Мудрости не делают из особых минералов."
      - "Но даже если минерал — фальшивка, как насчет технологии, способной наделить обычный камень столь удивительными свойствами?.. Эта технология существует на самом деле."
      - "Вылечить сестру... Для нас это невероятно сложная задача..."
      - "Но для Сирен и тех, кто прячется в тени, это, возможно, сущий пустяк, не так ли?.."
      - "Раз они используют это как приманку, то почему бы не попробовать?.."
      - "В любом случае, хуже уже не будет..."
  - char: "commander"
    side: "left"
    text:
      - "...Саратога, Лексингтон не только твоя сестра."
      - "Еще во время моей учебы в военной академии она была моим преподавателем."
      - "Когда я отправился в Союз Орла в качестве Командира Лазурного пути, она всё время была рядом со мной."
      - "Она — мой боевой товарищ и дорогой мне человек... С какими бы трудностями я ни столкнулся, я обязательно её спасу."
      - "Моя решимость никогда не колебалась, разве ты мне не веришь?.."
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "...Конечно, верю."
      - "Просто... времени уже не осталось."
  - char: "commander"
    side: "left"
    text:
      - "Состояние Лексингтон сейчас стабильно. Поверь мне, я обязательно найду способ вылечить её вовремя."
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "Но солнце... нет, ничего."
      - "...Эх, раз уж всё так обернулось, признаю: появление армии Дироев действительно не входило в мои планы."
      - "Судя по текущей ситуации в антарктической зоне боевых действий, всё это вышло за пределы возможностей флота операции «Ледяной ангел»."
      - "Командир, ты еще помнишь содержание «Договора об Антарктике», о котором сестра рассказывала на занятиях?.."
      - "Удаленное командование — это тоже командование. Возможно, нам стоит воспользоваться этим правилом?.."
  - char: "commander"
    side: "left"
    text:
      - "Спасибо за доверие."
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "Говорю же... я всегда тебе верила!..."
      - "Ладно~ Настоящим я официально передаю командование операцией «Ледяной ангел» тебе."
      - "В этот раз делай всё так, как сочтешь нужным, Командир~"
