chapter1:
  rows:
  - text:
      - "Наступила глубокая ночь."
      - "Под ослепительным полярным сиянием эта погоня наконец подошла к концу."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я-то думала, чего это вы вдруг перестали убегать, а вы, оказывается, заранее подготовили засаду~"
  - char: "prinz_heinrich"
    side: "left"
    text:
      - "Айзен, смотри, это и есть та самая злодейка. Сейчас мы вместе её побьем!"
  - char: "felix_schultz"
    side: "right"
    text:
      - "От неё так и веет опасностью."
  - char: "hindenburg"
    side: "left"
    text:
      - "Хе-хе, от нас тоже веет опасностью."
  - char: "washington"
    side: "right"
    text:
      - "Ты подняла немало шума в нашей Антарктике, пришло время за это поплатиться."
  - char: "cleveland"
    side: "left"
    text:
      - "Я, Рыцарь моря, ни за что не позволю тебе здесь своевольничать!"
  - char: "implacable"
    side: "right"
    text:
      - "Немедленно останови свой план и сдавайся, тогда, возможно, у тебя еще останется шанс выжить."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Вау... вы, лабораторные мышки, клюнувшие на приманку, умудрились объединиться."
      - "Боюсь, даже Обсервер не ожидала, что устроенная ей ловушка в итоге обернется чем-то подобным."
      - "Хе-хе, Обсервер, которая не осмеливается подключиться к Мейнфрейму — только такие жалкие трюки у нее и остались."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Что ты сказала? Обсервер, которая не осмеливается подключиться к Мейнфрейму?.."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хм? Вы, оказывается, до сих пор не знали?.."
      - "Пошевелите хоть немного мозгами~"
      - "Разве нормально функционирующая Обсервер позволила бы вам уничтожить Компилятора?.."
      - "Не говоря уже о том, чтобы позволить собственному Мейнфрейму оказаться в подобной опасности."
      - "Всё потому, что эта ваша Обсервер весьма особенная."
      - "Кажется, по каким-то причинам она решила надолго разорвать связь с Мейнфреймом."
      - "А отсутствие подключения к Мейнфрейму означает невозможность обновить версию системы, подключиться к Системе вычисления естественной эволюции и задействовать Демон Лапласа."
      - "Как думаете, на что годится Обсервер, неспособная на всё это?.."
      - "Полагаясь только на свои жалкие локальные мощности?.."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Неудивительно, что Обсервер так долго не попадалась нам на глаза."
      - "И её реакция на угрозу вокруг собственного Мейнфрейма оказалась такой слабой..."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Вот именно."
      - "Забавно то, что она и правда думала, будто сможет это скрыть."
      - "Но как такое утаишь? Я ведь узнала, хи-хи~"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Справедливости ради, мы поддерживаем твои действия против Обсервер."
      - "Не могла бы ты остановиться после того, как уничтожишь Обсервер, а затем просто тихо уйти?"
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Конечно же нет, в этот раз у меня еще очень много дел~"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Всё еще не оставляешь попыток призвать тот самый «Рай», о котором говорила?"
      - "Мы предотвратили подобное однажды, сможем предотвратить и во второй раз."
      - "Твоя затея обречена на провал."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хе-хе, раз уж всё зашло так далеко, как мы узнаем наверняка, если не попробуем?"
      - "Раз уж вы хотите сражаться, покажите мне свою силу~"
