chapter1:
  rows:
  - text:
      - "Некоторое время спустя пеленгация благополучно завершилась без каких-либо помех."
      - "Группа последовала за Советский Союз ко входу на объект, по пути они не заметили ни малейших следов врага."

chapter2:
  rows:
  - text:
      - "Под скрежет шестеренок тяжелые стальные ворота медленно разъехались в стороны."
      - "Однако внутри не оказалось ни широких транспортных туннелей, по которым могли бы проехать танки, ни головокружительно сложных конструкций, ни даже достойных упоминания высоких технологий."
      - "Их взору предстала лишь самая обычная, к тому же давно пустующая и покрытая слоем пыли комната отдыха."
  - char: "svirepy"
    side: "left"
    text:
      - "Э-э... Обычнее некуда."
      - "Это и есть наш бункер судного дня?"
      - "Он выглядит... прямо как любое обычное военное здание."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Я знаю~ Держу пари, всё так и задумано!"
      - "Здесь всё так обычно и непримечательно, что если кто-то непосвященный и доберется сюда с расследованием, то решит, что это просто очередной секретный аванпост Северного Парламента."
      - "Но это лишь часть маскировки! Тут скрыто двойное дно, я ведь права~!.."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Верно, это место — всего лишь маскировка для входа на верхнем уровне."
      - "Что же касается настоящего входа... хе-хе, следуйте за мной."

chapter3:
  rows:
  - text:
      - "Как и положено по законам жанра, книжный шкаф медленно отъехал в сторону, открывая проход в потайную комнату."
      - "И лишь после прохождения через еще несколько тяжелых взрывозащищенных дверей перед ними, наконец, предстал лифт, ведущий в подземный комплекс."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Мы официально окажемся внутри комплекса, только когда спустимся на этом лифте на нужный этаж."
  - char: "ognevoy"
    side: "right"
    text:
      - "...На нужный этаж? А что будет, если мы приедем не на тот?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Хе-хе, тебе лучше этого не знать."
  - char: "svirepy"
    side: "right"
    text:
      - "Не слишком ли это... чрезмерные меры безопасности."
      - "Это ведь Антарктика — сплошная глушь, да еще и с многоуровневой маскировкой. Неужели кто-то и правда смог бы сюда добраться?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Смог. И этот кто-то не только успешно добрался сюда, но и активировал наш объект."
      - "Разве вы не заметили, как изменилась температура, когда мы вошли в комнату?"
  - char: "ognevoy"
    side: "right"
    text:
      - "Температура... и правда тепло, ощущения в точности такие же, как когда мы зашли на исследовательскую станцию."
  - char: "svirepy"
    side: "left"
    text:
      - "А ведь точно, как вошли, сразу перестало быть холодно... Я даже не осознала этого."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Ни холодно, ни жарко... Это означает, что отопление стабильно работает уже какое-то время. Очевидно, что его запустили очень давно."
      - "И «зона таяния снегов» — тоже дело рук этого неизвестного... В штатном режиме комплексу совершенно нет нужды отводить наружу столько тепла."
      - "Кто-то с какой-то целью активировал определенные системы объекта — это всё, что нам известно на данный момент."
      - "Когда спустимся, слушайте мои приказы и не разбегайтесь. Сначала мы отправимся в диспетчерскую систем безопасности первого уровня, чтобы осмотреться."
  - char: "all"
    side: "left"
    text:
      - "Принято!"

chapter4:
  rows:
  - text:
      - "С виду «старый» лифт с неожиданной скоростью и бесшумностью доставил группу внутрь бункера."
  - char: "ognevoy"
    side: "left"
    text:
      - "Ух ты, какой этот лифт быстрый~!"
  - char: "svirepy"
    side: "right"
    text:
      - "Э-э... Это немного отличается от того, что я себе представляла. Я думала, что это будет классический бункер с допотопным оборудованием."
  - char: "poltava"
    side: "left"
    text:
      - "Как ни крути, но это всё-таки бункер судного дня, построенный из соображений практичности. Даже если в его интерьере и прослеживаются личные предпочтения проектировщика."
      - "Но оборудование здесь в любом случае используется самое новое и лучшее. С чего бы им намеренно устанавливать какую-то допотопную технику?"
  - char: "svirepy"
    side: "right"
    text:
      - "Логично... Значит, сейчас мы находимся под километровой толщей льда?"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Не совсем, пока мы спустились на глубину примерно двадцати этажей. Похоже, здесь предусмотрена система пересадок на другой лифт."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Да, основные строения бункера действительно находятся под толщей льда, но помимо них существует еще множество промежуточных зон."
      - "Нам нужно будет пройти еще через несколько таких зон безопасности и сменить пару лифтов, прежде чем мы по-настоящему попадем в основную часть «Кольца Мудрости»."
      - "Перед нами как раз первая из них."
      - "В диспетчерской зоны безопасности можно получить нужную мне информацию. Подождите немного, я пойду проверю."

chapter5:
  rows:
  - text:
      - "Спустя больше времени, чем ожидалось, Советский Союз наконец вернулась из диспетчерской."
  - char: "poltava"
    side: "left"
    text:
      - "Ты там довольно долго была. Что-то пошло не так?.."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Расследование прошло успешно, системы безопасности и правда зафиксировали кое-что интересное..."
      - "Вот только... сама эта информация вызывает недоумение."
      - "Записи показывают, что бункер был активирован уже очень давно, задолго до того, как началось таяние снегов."
      - "Помимо основных систем, также был запущен один из производственных блоков. Производимая там продукция в системе не зарегистрирована, так что придется отправиться туда и провести расследование на месте."
      - "Кроме того, система управления базой непрерывно выполняла циклические задачи по разведке — и продолжает делать это прямо сейчас. Накопленных отчетов с данными хватит, чтобы сложить целую гору."
      - "Однако при попытке отследить источник выяснилось, что человека, «отдавшего приказ», не существует."
      - "Камеры наблюдения также не зафиксировали ничего необычного, а система сигнализации... разумеется, никак не отреагировала."
      - "Похоже... кто-то, кто досконально знает устройство бункера, тщательно спланировал эту операцию."
      - "Этот человек обладает достаточно высоким уровнем доступа и способен замести все следы своих действий."
  - char: "poltava"
    side: "left"
    text:
      - "...Почему это звучит так, будто нарушитель — один из наших собственных агентов, который прекрасно знает это место?.."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Это абсолютно невозможно. Я никому не выдавала права на удаление записей, в данный момент это могу сделать только я."
  - char: "poltava"
    side: "left"
    text:
      - "Значит, кто-то взломал нашу систему, а затем..."
      - "Растопил лед и начал проводить разведку... Неужели он использует нашу базу для поиска минерала?!"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Звучит как вполне разумное предположение, теперь нам нужно собрать доказательства."
      - "Судя по имеющейся информации, в бункере есть две зоны, которые стоит исследовать в первую очередь."
      - "Первая — это активированный производственный цех, а вторая — центр обработки данных, где можно получить доступ к отчетам о разведке."
      - "Обе они находятся на нижних уровнях..."
      - "Будем продвигаться осторожно и осмотрим их по очереди."
