chapter1:
  rows:
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Ну вот, можно сказать, благополучно добралась."
      - "Пришлось, конечно, повозиться."
      - "Уж не знаю, что там задумали Арбитры, раз установили такую плотную защиту на периметре..."
      - "Судя по всему, с этим миром пока всё в порядке..."
      - "Неужели «она» уже была уничтожена Арбитрами?"
      - "Если это так, то это здорово упрощает дело."
      - "Впрочем... есть вероятность, что она просто еще не начала действовать."
      - "Лучше сначала собрать разведданные, понаблюдать немного, а там видно будет..."
      - "Хм?.. Здесь Гигантский Медведь, а не Двуглавый Орел..."
      - "Может, взглянуть поближе?.."
      - "...Хотя нет, не стоит."
      - "Верно ведь, товарищи?.."
      - "...Солнце вступило в активную фазу."
      - "...Нужно поскорее закончить здесь дела и уходить."
