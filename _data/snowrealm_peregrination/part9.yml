chapter1:
  rows:
  - char: "ognevoy"
    side: "left"
    text:
      - "Послушайте, оттуда доносится шум воды, да?~"
  - char: "svirepy"
    side: "right"
    text:
      - "...Это что, горные водопады?! И даже не один?!"
      - "...Это место и правда Антарктика?!"
  - char: "poltava"
    side: "left"
    text:
      - "Вдалеке уже даже показались горные склоны..."
      - "Как и говорила Таллин, «зона таяния снегов» полностью оправдывает свое название."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Склоны начали оттаивать, а тепло исходит изнутри наружу... И правда, значит, это из-за системы охлаждения."
      - "Осторожно, лед и снег здесь рыхлые."
      - "Смотрите под ноги, мы выдвигаемся к твердым скалам."

chapter2:
  rows:
  - char: "ognevoy"
    side: "left"
    text:
      - "Наша экспедиция по снежным равнинам превратилась в альпинизм..."
  - char: "svirepy"
    side: "right"
    text:
      - "Ха-а... ха-а..."
      - "Горные операции... вообще-то не для кораблей!"
  - char: "ognevoy"
    side: "left"
    text:
      - "Смотрите скорее, те сверкающие штуки — это ведь и есть те самые кристаллы минерала?"
  - text:
      - "На черных скалах синие друзы кристаллов, окруженные снегом, выделялись особенно ярко."
  - char: "poltava"
    side: "left"
    text:
      - "Синие кристаллы... верно, точно такие же, как образец в лабораторном блоке, хотя и намного меньше."
  - char: "svirepy"
    side: "right"
    text:
      - "Ого... Снег вокруг этих друз совсем не растаял. Неужели этот минерал обладает еще и охлаждающим эффектом?"
  - char: "ognevoy"
    side: "left"
    text:
      - "Хе-хе... Звучит так, будто из него можно сделать портативный холодильник."
      - "Тогда можно будет носить его везде с собой~ И есть мороженое или пить холодные напитки когда захочешь~"
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Если добыть побольше и разложить в холодильных камерах, можно неплохо сэкономить на электричестве."
  - char: "poltava"
    side: "left"
    text:
      - "Подождите... Использовать такие удивительные кристаллы для подобных вещей — это же просто пустая трата их потенциала!"
      - "Вы только посмотрите на новую оснастку товарища Союз... Если мы досконально изучим этот минерал, возможно, он приведет к новой революции в области оснастки!"
  - char: "svirepy"
    side: "right"
    text:
      - "Революция в оснастке... звучит заманчиво."
      - "Если я прямо сейчас тоже прикоснусь к этому удивительному минералу, может, моя оснастка тоже чудесным образом изменится?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Подожди..."
  - text:
      - "Не успела Советский Союз договорить, как Свирепый схватила кристалл размером с кулак и сжала его в ладонях."
  - char: "ognevoy"
    side: "left"
    text:
      - "Н-ну, и как?!"
  - char: "svirepy"
    side: "right"
    text:
      - "Ой... какой холодный!"
      - "Больше никаких ощущений... Ничего не произошло."
  - char: "poltava"
    side: "left"
    text:
      - "Логично, если бы одно лишь прикосновение могло улучшить оснастку, Таллин бы уже давно это обнаружила."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Может, он недостаточно большой? Или требуются какие-то особые условия... Совершенно ничего не понятно."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Боюсь, одни мы не сможем найти ответ, так что давайте пока оставим эти кристаллы в покое."
      - "Масштабы таяния льда и снега оказались куда серьезнее, чем я ожидала."
      - "Мы должны как можно скорее проникнуть внутрь «Кольца Мудрости» и провести расследование."
  - char: "svirepy"
    side: "right"
    text:
      - "Э-э... Насколько я помню, «Кольцо Мудрости» — это бункер, но мы всё это время лезем в горы..."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Горы прочные и служат отличным ориентиром, это лучшее место для размещения входа в бункер."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Но из-за таяния льдов здешний ландшафт сильно изменился. Ты еще помнишь, где конкретно находится вход?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Сейчас его уже не узнать."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Э-э~ Нам что, теперь придется визуально осматривать каждую гору одну за другой?!"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "В этом нет необходимости... У входа в бункер установлено устройство опознавания, его местоположение можно отследить с помощью специального прибора."
      - "Охраняйте периметр и следите, нет ли поблизости подозрительных целей."
      - "Мне нужно немного времени, чтобы запеленговать вход на объект."
