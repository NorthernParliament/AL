chapter1:
  rows:
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хе-хе, ты почти угадала одну из моих целей~"
  - text:
      - "Противостояние на ледяной пустоши всё еще продолжалось."
      - "Заметив, что Советский Союз кое о чем догадалась, девушка в черном без стеснения признала свою цель."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Раз так, тогда..."

chapter2:
  rows:
  - text:
      - "С оглушительным грохотом лед раскололся, и в двух шагах от них возник гигантский механизм."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Дирой."
      - "Как я и думала... твоя цель — «Царство Божье»?.."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Оно так не называется."
      - "«Рай»... «Вечная земля обетованная»... «Утопия»... Я придумала парочку названий, но ни одно из них меня полностью не устроило."
      - "Как думаешь, какое подошло бы лучше всего?"
  - text:
      - "То гнев, то веселье. Настроение девушки в черном было столь переменчивым, что Советский Союз никак не могла её разгадать."
      - "Однако Союз смутно чувствовала: слова девушки расходятся с делом, и то, что она говорит, вовсе не является её истинным намерением."
      - "И самое главное — ни в коем случае нельзя было играть по её правилам."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Думаю, тебе лучше отказаться от этой затеи."
      - "Как бы ты это ни назвала, сути это не изменит."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Эх~ Как скучно... Похоже, время нашей приятной беседы подошло к концу."
      - "Видимо, в конце концов нам всё же придется сказать последнее слово с помощью силы."
  - text:
      - "После этих слов девушки противостояние, казалось, наконец приблизилось к своей кульминации."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что ж... мне нужно немного подготовиться, поэтому я покину вас."
      - "А пока пусть они хорошенько с вами поиграют..."
      - "Удачи вам~ Пока-пока~"

chapter3:
  rows:
  - text:
      - "Длинный стол, черноволосая девушка и находившийся в двух шагах Дирой исчезли."
      - "Неподалеку её товарищи продолжали заниматься тем же, чем и мгновение назад."
      - "Похоже, всё, что произошло во время банкета, пронеслось для них в мгновение ока."
  - char: "poltava"
    side: "left"
    text:
      - "Мы немедленно возвращаемся на исследовательскую станцию, а затем сразу же эвакуируемся, верно?"
      - "...Товарищ Союз?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Да, верно."
      - "В то же время отправьте сообщение Железной Крови и всем остальным фракциям, предупредите их о надвигающейся угрозе и порекомендуйте немедленно отступить."
  - char: "poltava"
    side: "left"
    text:
      - "Поняла... Но о какой конкретно угрозе их предупредить?"
  - text:
      - "Глядя на озадаченные лица своих товарищей, которые не пережили то же видение, Советский Союз немного успокоилась."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Дирои. Антарктика подвергнется нападению Дироев."
  - char: "svirepy"
    side: "left"
    text:
      - "...Д-Дирои?! Разве это не те, что раньше были в Средиземном море..."
  - text:
      - "БАБАХ!!!"
      - "Оглушительный грохот раздался со всех сторон одновременно. Сопровождаемые летящими во все стороны глыбами льда, гигантские механизмы медленно показались в поле зрения группы."
  - char: "ognevoy"
    side: "left"
    text:
      - "Это и правда... Дирои."
  - char: "svirepy"
    side: "right"
    text:
      - "Их так много... Они заранее спрятались под толщей льда?!"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Они появились слишком быстро."
      - "Похоже, времени на подробные объяснения нет. Немедленно начинаем отступление!"
  - char: "all"
    side: "right"
    text:
      - "Есть!"
