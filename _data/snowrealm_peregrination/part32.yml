chapter1:
  rows:
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "«Отчет об Антарктической операции»... Имплакабл."
      - "Так вот ради какого отчета Белфаст специально примчалась сюда, чтобы передать его тебе?.."
      - "Ого, а вы и правда провернули кое-что интересное, да?"
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Хм-хм, наконец-то он взял себя в руки."
      - "Вот теперь он хоть немного похож на того Командира, каким я его себе представляю."
      - "Я уже поручила Белфаст по возвращении оказывать Командиру полное содействие в любых его действиях."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "А дальше?"
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "...Что значит «а дальше»?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Э-э..."
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Что это еще за недовольное выражение лица!.."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я просто думаю... и долго ты еще собираешься у меня торчать?"
      - "Хотя изначально я сама пригласила тебя сюда..."
      - "Но ты уже и с «мисс D» встретилась, и все свои вопросы задала..."
      - "Эх... а я-то понадеялась, что та горничная пришла, чтобы забрать тебя обратно."
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Хм~ Раз уж я здесь, то, разумеется, останусь до тех пор, пока сама не пожелаю уйти."
      - "Как насчет того, чтобы взять меня с собой на твою следующую «охоту»?"
