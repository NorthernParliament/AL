chapter1:
  rows:
  - char: "poltava"
    side: "left"
    text:
      - "Товарищ Союз, припасы готовы, мы можем отправляться в любой момент."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Это было быстро. Спасибо за работу, Полтава."
  - char: "sovetskaya_belorussiya_rad"
    side: "left"
    text:
      - "«Быстро»?.. В итоге ты всё же выбрала вариант с военным самолетом снабжения?"
  - char: "kronshtadt_rad"
    side: "right"
    text:
      - "Верно. Воздушное пространство от Черного моря до базы на Сокотре относительно безопасно, к тому же там регулярно курсируют грузовые самолеты, так что к этому маршруту приковано не так много глаз."
      - "После приземления на Сокотре товарищ Союз сразу же пересядет на субмарину."
      - "Вторая половина пути пройдет полностью под водой."
  - char: "kirov_rad"
    side: "left"
    text:
      - "Хорошо, что у нас есть свободные подводные лодки в Индийском океане."
      - "А что насчет перевалочного пункта в Порт-Луи? Если весь путь пройдет под водой, как быть с пополнением припасов?"
  - char: "kronshtadt_rad"
    side: "right"
    text:
      - "Не волнуйся, пополнение будет проходить на подводной базе субмарин, скрытой под обычным надводным портом."
      - "Припасы туда доставляются под видом грузов для дальних надводных маршрутов."
  - char: "sovetskaya_rossiya_rad"
    side: "left"
    text:
      - "Это и правда в полной мере гарантирует скрытность операции..."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Верно. Кронштадт лично спланировала маршрут, так что вам не о чем беспокоиться."
  - char: "sovetskaya_rossiya_rad"
    side: "left"
    text:
      - "...Но эта безопасность ограничивается лишь самим путешествием, не так ли? Что будет, когда ты прибудешь в Антарктику?"
      - "Я не могу перестать волноваться из-за того, что ради скрытности ты берешь с собой так мало охраны... В любом случае, мы должны учитывать непредвиденные обстоятельства."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Я отправляюсь лишь для того, чтобы изучить тот особый минерал, который, как утверждают, способен резонировать с оснасткой. Это не боевая миссия."
      - "В Антарктике всегда было спокойно. Атак Сирен там происходило даже меньше, чем стычек между фракциями."
      - "Учитывая, что вопрос об «объединении альянсов» уже вынесен на стол переговоров, ни одна из фракций не захочет сейчас провоцировать конфликт."
      - "К тому же, у нас там есть Таллин и флот серийных кораблей в резерве, плюс Полтава и остальные. Даже если что-то пойдет не так, сил для ответа будет достаточно."
      - "Вам не стоит переживать за меня, лучше сосредоточьтесь на своих собственных задачах."
      - "Россия, Белоруссия, Киров — до моего возвращения все мои дела на флоте я оставляю на вас троих. Принимайте решения сообща."
  - char: "kirov_rad"
    side: "left"
    text:
      - "Без проблем, предоставь это нам."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Дипломатические вопросы на собрании Ирис будут решаться по заранее утвержденному плану. Аврора, Память Меркурия, Ворошилов — поручаю это вам троим."
      - "У вас есть полномочия принимать решения на месте, распорядитесь ими с умом."
  - char: "voroshilov_rad"
    side: "left"
    text:
      - "Без проблем, мелкие вопросы мы решим сами, а более крупные будем отправлять на родину и решать вместе с Киров."
  - char: "avrora_rad"
    side: "right"
    text:
      - "Конечно. Судя по текущей ситуации, на самом собрании вряд ли возникнут какие-либо волнения."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "И не забывайте следить за передвижениями товарища Командира."
  - char: "kronshtadt_rad"
    side: "right"
    text:
      - "Эх... В столице Ириса, находящейся под контролем Трибунала, работать и правда сложновато, но я сделаю всё возможное."
  - char: "pamiat_merkuria_rad"
    side: "left"
    text:
      - "Ничего страшного, у меня есть секретный прием."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Секретный прием?.."
  - char: "pamiat_merkuria_rad"
    side: "left"
    text:
      - "В крайнем случае, я просто «продам» себя — приду к нему в гости, чтобы бесплатно поесть, выпить, а заодно и поживу там пару дней~"
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Хе-хе, только ты могла до такого додуматься."
      - "Что ж, товарищи, мне пора отправляться."
  - char: "sovetskaya_rossiya_rad"
    side: "left"
    text:
      - "Попутного ветра, сестра. Мы будем ждать от тебя хороших новостей."

chapter2:
  rows:
  - char: "memphis_rad"
    side: "right"
    text:
      - "Командир, леди Клемансо передала через доверенное лицо сообщение — «Снежный кролик» начал действовать."
  - char: "commander"
    side: "left"
    text:
      - "«Снежный кролик»?.. Не ожидал, что Советский Союз решит отправиться туда лично."
      - "Эта новость привлекла её куда сильнее, чем ожидалось... Похоже, слухи о серьезных проблемах с её оснасткой оказались правдой."
      - "А что насчет «Ледяного ангела»?"
  - char: "memphis_rad"
    side: "right"
    text:
      - "Флот для операции «Ледяной ангел» в данный момент собирается и готовится к отплытию в порту PH."
      - "Эскадра, участвующая в этой операции, в основном состоит из кораблей, которых Саратога перебросила из различных зон боевых действий и флотов обороны метрополии. Их много, и они из самых разных мест."
      - "«Логистический кошмар»... как-то так это называется. Ожидается, что им потребуется еще около полунедели, прежде чем они смогут официально отбыть."
  - char: "helena_rad"
    side: "left"
    text:
      - "Командир, Железная Кровь и Королевский Флот тоже пришли в движение."
      - "Мы подтвердили, что небольшая эскадра Железной Крови покинула комплекс плавучих островных крепостей в море Бисмарка... Направление неизвестно."
      - "нтарктический флот Королевского Флота также отправил отряд, который покинул штаб в Сиднее... Направление тоже неизвестно."
      - "Предположительно... оба этих флота направляются в Антарктику."
      - "Судя по времени, эскадра Королевского Флота, возможно, прибудет туда первой из четырех фракций."
  - char: "commander"
    side: "right"
    text:
      - "Как и ожидалось от Королевского Флота... Даже если им заранее ничего не сообщать, они все равно не пропустят такое событие."
      - "Таким образом, все фракции обратили внимание на появление в Антарктике этого уникального минерала..."
      - "План Сирен, направленный на то, чтобы посеять раскол между фракциями, позволив Союзу Орла монополизировать этот ресурс, по-видимому, провалился."
      - "Только... здесь всё ещё есть кое-что странное."
  - char: "helena_rad"
    side: "left"
    text:
      - "...Странное?"
  - char: "commander"
    side: "right"
    text:
      - "Да... Будь то Северный Парламент, Железная Кровь или Королевский Флот, их первой реакцией на эту новость стала отправка небольшого флота для расследования ситуации."
      - "И лишь Саратога решила собрать огромную боевую армаду."
      - "Ради этого она, в последнее время уделявшая столько внимания скорости, вплоть до злоупотребления своими полномочиями и самовольных действий, неожиданно выбрала вариант медленного сбора флота для совместной отправки."
      - "Даже несмотря на то, что это решение может свести на нет её преимущество первенства перед остальными фракциями."
  - char: "memphis_rad"
    side: "left"
    text:
      - "Это и правда очень странно. Неужели... у Саратоги есть какая-то эксклюзивная информация, о которой мы не знаем?"
  - char: "commander"
    side: "right"
    text:
      - "Возможно... Антарктика далеко не так безопасна, как мы думаем."
      - "А причина, по которой Саратога так спешит с этой операцией... не так проста, как кажется на первый взгляд."
      - "Мемфис, Хелена, продолжайте внимательно следить за действиями всех фракций."
      - "А мне нужно отправляться... и подготовить кое-что на случай «непредвиденных обстоятельств»."
