chapter1:
  rows:
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Хм... Нет худа без добра, удаленные данные подлежат восстановлению."
  - char: "poltava"
    side: "right"
    text:
      - "Это просто замечательно! Удалось что-нибудь выяснить?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Да, наши прежние догадки насчет «зоны таяния снегов» и «образцов минерала» получили точное подтверждение."
      - "«Минерал» действительно производился в блоке RF-17-36 и доставлялся на поверхность через логистическую систему крепости."
      - "Когда скопление минерала на поверхности достигло нужных масштабов, систему охлаждения перенастроили и направили в сторону поверхности, чтобы растопить покрывавший их снег и лед."
      - "Всё было обставлено так, словно этот особый минерал обнажился из-под толщи льда только после того, как растаяли снега."
  - char: "poltava"
    side: "right"
    text:
      - "Столько сложных манипуляций только ради того, чтобы выдать это за природное явление..."
      - "...В чем же тогда смысл и конечная цель всего этого?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Пока неясно. Возможно, планировалось использовать минерал в качестве приманки, чтобы остальные фракции обнаружили секретный бункер Северного Парламента в Антарктике, тем самым спровоцировав новую волну хаоса."
      - "Что касается разведывательных задач, я тоже кое-что выяснила."
      - "Во-первых, вопреки нашим первоначальным предположениям, разведывательная миссия началась раньше, чем производство минерала."
      - "Суть миссии заключалась в исследовании этого подледного океана, для чего было запущено большое количество беспилотных подводных аппаратов."
      - "Из графиков видно, что аппараты исправно выполняли свою задачу и регулярно отправляли обратно весьма объемные пакеты данных."
      - "Вплоть до момента... когда один из подводных аппаратов перестал передавать данные."
      - "Затем, с течением времени, данные стало присылать всё меньше и меньше аппаратов, пока они не перестали поступать вовсе."
  - char: "poltava"
    side: "right"
    text:
      - "Что-то... напало на эти подводные аппараты?"
      - "Но ведь этот океан оказался скрыт под ледяным панцирем миллионы лет назад..."
  - char: "svirepy"
    side: "left"
    text:
      - "Неужели там и правда водятся доисторические глубоководные монстры..."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Р-р-р-р-р!!!!"
  - char: "svirepy"
    side: "left"
    text:
      - "Ва-а-а-а-а!"
  - char: "ognevoy"
    side: "right"
    text:
      - "Ва-а-а-а-а!"
      - "Товарищ Память Меркурия, пугать вот так внезапно нехорошо!"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Хе-хе-хе, вы просто такие милые, я не удержалась~"
  - char: "svirepy"
    side: "right"
    text:
      - "Кого это ты назвала милой, сейчас получишь!"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Не злись, не злись, хочешь обниму~?"
  - char: "ognevoy"
    side: "right"
    text:
      - "Хочу~"
  - char: "svirepy"
    side: "left"
    text:
      - "А я ни за что!"
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Аха-ха-ха~"

chapter2:
  rows:
  - text:
      - "Шутки Памяти Меркурия успешно разрядили напряженную атмосферу."
      - "Тем временем поиски Полтавы привели к неожиданной находке."
  - char: "poltava"
    side: "left"
    text:
      - "Товарищ Союз... Я нашла планшет со следами использования, он лежал отдельно на столе."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Планшет?.. Кроме нас здесь был только тот незваный гость, дай-ка посмотрю."

chapter3:
  rows:
  - text:
      - "Как и ожидалось, планшет был заблокирован предыдущим пользователем, но это не имело никакого значения."
      - "Советский Союз взяла планшет и разблокировала его с помощью своего уровня доступа."
      - "А затем..."

chapter4:
  rows:
  - text:
      - "В одно мгновение всё вокруг изменилось."
      - "Для Советский Союз подобное сегодня происходило уже не в первый раз."
      - "С тех пор, как закончился резонанс с минералом, эти видения ни на миг её не покидали."
      - "Однако то, что она увидела сейчас, сильно её потрясло."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Это... Мейнфрейм... Сирен?!"
  - text:
      - "Вдалеке виднелся город, целиком состоящий из механизмов."
      - "То и дело появлялись точки света, плывущие по определенным траекториям и исчезающие вдали, в пустоте, которую язык не поворачивался назвать небом."
      - "После завершения кампании по уничтожению Компилятора, Северный Парламент также получил данные о Мейнфреймах Сирен."
      - "Поэтому Советский Союз была абсолютно уверена, что находится где-то внутри Мейнфрейма Сирен."
      - "Но еще больше её шокировало то, что предстало прямо перед ней..."

chapter5:
  rows:
  - text:
      - "Перед ней стояла беловолосая девушка, окруженная массивной оснасткой."
      - "Её щупальца хищно потянулись к Советскому Союзу и туго обвились вокруг неё, полностью сковав любые движения."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Нападение... Обсервер?!"
  - text:
      - "Удушающее чувство давления нахлынуло со всех сторон. Советский Союз попыталась сопротивляться, но поняла, что больше не контролирует свою оснастку."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Не могу открыть огонь... даже... пошевелиться не могу..."
      - "Это и есть... способность Обсервер к созданию помех?.."

chapter6:
  rows:
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Плохо, сжимает всё сильнее, зрение начинает... затуманиваться..."

chapter7:
  rows:
  - text:
      - "За мгновение до того, как её сознание поглотила тьма, Советский Союз вгляделась в лицо Обсервер."
      - "Это было лицо, скрытое в тени щупалец и искаженное от невыносимой боли."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Невыносимой боли?"
  - text:
      - "Кроваво-красный сигнал SOS на экране планшета, казалось, раскрывал некую совершенно немыслимую правду."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Обсервер... молит о помощи?"

chapter8:
  rows:
  - text:
      - "Спустя время свет вернулся."
      - "Неподалеку Полтава с улыбкой протягивала ей планшет."
      - "Похоже, время, проведенное в видении, никак не отразилось на реальности."

chapter9:
  rows:
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Я вернулась?"
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Вернулась?"
      - "Откуда вернулась?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "А... Не обращай внимания."
  - char: "poltava"
    side: "right"
    text:
      - "Товарищ Союз, ты внезапно так побледнела. Снова видения?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Да... но ничего страшного, мне просто нужно немного отдохнуть."

chapter10:
  rows:
  - text:
      - "Присев на кресло, Союз начала прокручивать в голове картины, увиденные в видении."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Хех, хотя во время нашего сотрудничества с Фридрих дер Гроссе я тоже не выложила все свои истинные намерения как на духу."
      - "Но то, что она согласилась на сотрудничество... теперь кажется, что в этом крылся и иной смысл..."
      - "...Увиденное мной только что... похоже, это и есть Мейнфрейм самой таинственной Обсервер."
      - "Выходит... Мейнфрейм Обсервер, вероятно, скрыт в океане под льдами Антарктики."
      - "Всё это — план, подстроенный Обсервер."
      - "И цель этого плана... мольба о помощи?.."
      - "...Нет, это невозможно."
      - "С чего бы это Обсервер выбрала именно меня для призыва о помощи..."
      - "...Сюда заманили не одну фракцию, но лишь Союз Орла прислал столь масштабный флот."
      - "Неужели Обсервер изначально планировала заманить сюда Союз Орла..."
      - "А поскольку я прибыла первой, и она находится в столь ужасном состоянии, у неё просто не осталось выбора?.."
      - "До этого момента всё кажется логичным."
      - "Однако... даже если минералы и таяние снегов были приманкой Обсервер... какова цель проведения разведки местности?.."
      - "Если под льдами и находится Мейнфрейм Обсервер, зачем ей самой понадобилось проводить разведку с помощью аппаратов."
      - "Разве что... разведку проводил кто-то другой!..."
      - "Разведывательная миссия началась раньше, чем запустилась производственная линия... Вот оно что!..."
      - "Помимо Обсервер, был кто-то еще, кто воспользовался «Кольцом Мудрости»..."
      - "И этот кто-то... обладает силой, способной загнать Обсервер в угол, поэтому она и составила этот наспех скроенный и рискованный план..."
      - "...Нет, кем бы ни был этот кукловод, стоящий за нынешним кризисом, этот уровень угроз нам уже не по зубам."
      - "Нужно немедленно уходить и всё тщательно обдумать."

chapter11:
  rows:
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Полтава!"
  - char: "poltava"
    side: "right"
    text:
      - "Товарищ Союз, ты... что то случилось?.."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Я всё поняла, это ловушка!"
      - "Всем немедленно отступать, мы покидаем бункер, мы уходим из Антарктики!"
