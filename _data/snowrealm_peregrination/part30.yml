chapter1:
  rows:
  - char: "avrora"
    side: "left"
    text:
      - "Спасибо, что пришел, товарищ Командир."
  - char: "commander"
    side: "right"
    text:
      - "Я слышал, у Советский Союз есть ко мне какое-то важное дело?"
  - char: "avrora"
    side: "left"
    text:
      - "Верно, оно касается того объекта подо льдами Антарктики."
      - "Информация, которую товарищ Союз предоставила во время боя, была достоверной, но неполной."
      - "На этот раз она попросила меня передать тебе полные сведения об этом объекте."
  - char: "commander"
    side: "right"
    text:
      - "...Полные сведения."
      - "То есть этот объект, помимо научной станции и бункера на случай конца света, скрывает в себе еще какие-то секреты?"
  - char: "avrora"
    side: "left"
    text:
      - "Именно. Его истинная функция... связана с геомагнитным полем."
      - "Подробные материалы находятся здесь, можешь ознакомиться с ними в полном объеме."
      - "Однако, пожалуйста, не выноси эти материалы за пределы и никому не рассказывай о них, кроме меня и товарища Союз."
  - char: "commander"
    side: "right"
    text:
      - "...Об этом даже внутри Северного Парламента почти никто не знает?"
  - char: "avrora"
    side: "left"
    text:
      - "Да."
  - char: "commander"
    side: "right"
    text:
      - "Я понял."
  - char: "avrora"
    side: "left"
    text:
      - "Благодарю за понимание и сотрудничество, товарищ Командир."