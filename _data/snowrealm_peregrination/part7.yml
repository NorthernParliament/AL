chapter1:
  rows:
  - text:
      - "Группа Северного Парламента прибыла к крепости Железной Крови, которая уже находилась в состоянии повышенной боевой готовности."
      - "Благодаря предварительному сообщению от Таллин, после проверки личностей все беспрепятственно вошли внутрь."

chapter2:
  rows:
  - char: "königsberg"
    side: "left"
    text:
      - "Я отвечаю за эту крепость Железной Крови, моё имя Кёнигсберг."
      - "Госпожа Советский Союз и друзья из Северного Парламента, благодарю вас за то, что пришли на помощь после получения сообщения."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Не стоит благодарности, госпожа Кёнигсберг. Какова сейчас обстановка в крепости?"
  - char: "königsberg"
    side: "left"
    text:
      - "Раз уж вы заметили неладное и пришли на подмогу, я не стану ничего от вас скрывать."
      - "Честно говоря, дела в крепости обстоят не лучшим образом."

chapter3:
  rows:
  - char: "ognevoy"
    side: "right"
    text:
      - "Заметили неладное и пришли на подмогу? Разве мы не собирались..."
  - char: "svirepy"
    side: "left"
    text:
      - "Тшш! Пусть и дальше так думает!"

chapter4:
  rows:
  - char: "königsberg"
    side: "left"
    text:
      - "Как упоминалось в предыдущем сообщении, мы потеряли связь с исследовательской группой, отправившейся в «зону таяния снегов»."
      - "В их последнем сообщении говорилось, что они вступили в бой с какой-то «враждебной целью»."
      - "К сожалению, из-за помех связи мы больше не получали от них никакой полезной информации."
      - "В то же время мы уже несколько дней не можем связаться с базой поддержки в море Бисмарка, и причина тому — всё те же аномальные помехи."
      - "Одно наложилось на другое... Очевидно, что Антарктика больше не так безопасна, как прежде."
      - "Никак не ожидала, что в такое время госпожа Советский Союз из Северного Парламента лично проделает путь в тысячи миль и прибудет сюда."
      - "Да еще и с такой передовой оснасткой..."
      - "Ты прибыла специально ради образцов минерала из «зоны таяния снегов»?"
      - "Северный Парламент и правда отлично проинформирован."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "(О чем она говорит... Ведь я сначала получила сообщение, отправленное Трибуналу, а уже потом...)"
      - "Кхм... Отчасти из-за минерала, а отчасти из-за самой «зоны таяния снегов»."
      - "Посреди бескрайней ледяной пустыни сначала появилась аномальная «зона таяния снегов»."
      - "А вслед за ней один за другим объявились аномальные кристаллы минерала и неизвестные «враждебные цели»."
      - "Всё это наводит на определенные мысли..."
      - "Какие у тебя планы на дальнейшие действия?"
  - char: "königsberg"
    side: "left"
    text:
      - "Я планирую сначала дождаться новостей от поисково-спасательного отряда, а затем, основываясь на полученной информации, решить, что делать дальше."
      - "А вы?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Мы планируем отправиться в «зону таяния снегов» для проведения расследования на месте."
      - "Раз уж и минерал, и враги связаны с «зоной таяния снегов»."
      - "То стоит нам лишь выяснить причину возникновения аномалии в этом районе, и, возможно, обе эти загадки разрешатся сами собой."
  - char: "königsberg"
    side: "left"
    text:
      - "...Поистине смелый поступок."
      - "Сейчас обстановка снаружи неясна, неизвестно, какой именно враг затаился в этой белизне."
      - "Раз вы собираетесь отправиться туда лично, будьте предельно осторожны."
      - "Я также буду делиться с вами любой новой информацией."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Большое спасибо, госпожа Кёнигсберг. Если нам удастся что-то узнать, мы тоже свяжемся с тобой."
      - "И еще, у меня есть одно предложение."
      - "Континент Антарктика находится на отшибе, и силы фракций здесь ограниченны и разбросаны."
      - "Если действительно разразится кризис, нам лучше объединить все силы, чтобы противостоять ему вместе."
      - "Мы систематизируем имеющуюся информацию и от лица Железной Крови и Северного Парламента отправим ее Королевскому Флоту и Союзу Орла, призвав их действовать с нами заодно."
      - "Что скажешь?"
  - char: "königsberg"
    side: "left"
    text:
      - "Думаю, это хорошая идея."
      - "Честно говоря, я и раньше думала об этом, но побоялась, что они не поверят, и отказалась от этой затеи..."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "И еще, хотя у Северного Парламента нет военной крепости в Антарктике, у нас есть огромная субмарина, способная безопасно эвакуировать весь персонал и оборудование."
      - "Как насчет того, чтобы подготовить два варианта действий?"
      - "Если после расследования окажется, что ситуация в Антарктике не так уж и серьезна, мы объединим силы и, опираясь на крепость Железной Крови, уничтожим врага."
      - "Если же ситуация и правда окажется опасной, вы отправитесь на нашу исследовательскую станцию и эвакуируетесь вместе с нашими людьми."
  - char: "königsberg"
    side: "left"
    text:
      - "...Благодарю за твою щедрость, госпожа Союз."
      - "Эта крепость в основном полагается на автоматизированные системы вооружения... Я единственный корабль, оставшийся на страже."
      - "Сейчас, когда связь с тыловой базой потеряна, стоять насмерть — далеко не лучшая стратегия."
      - "Я согласна на твой план."
      - "Пока ситуация не прояснится, я останусь в крепости и буду готовиться к бою."
      - "Если же ситуация действительно выйдет из-под контроля, я немедленно соберу людей и отправлюсь на станцию «Мирный»."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Без проблем, когда придет время, мы будем готовы вас встретить."
      - "Что ж, время не терпит, мы продолжаем путь в «зону таяния снегов» для расследования."
  - char: "königsberg"
    side: "left"
    text:
      - "Еще раз спасибо. Госпожа Союз, желаю вам всем попутного ветра."
