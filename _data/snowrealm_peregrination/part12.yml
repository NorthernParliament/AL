chapter1:
  rows:
  - text:
      - "Лифт плавно сбросил скорость и мягко остановился на нужном этаже."
      - "Но это вовсе не означало, что они прибыли к месту назначения — это было лишь началом очередного повторяющегося «цикла»."
      - "Единственным отличием между этими зонами были лишь цифры, нарисованные краской на стенах."
      - "Впрочем, стереотипы на то и стереотипы, что рано или поздно разбиваются о непредвиденные факты."
      - "На этот раз всё, казалось, было несколько иначе."
  - char: "ognevoy"
    side: "left"
    text:
      - "Вау... в этой зоне даже наклеены золотистые обои!"
  - char: "svirepy"
    side: "right"
    text:
      - "А еще ковры, люстры и мебель, которая выглядит очень дорогой..."
  - char: "poltava"
    side: "left"
    text:
      - "Товарищ Союз, здешняя мебель и картины выглядят очень ценными."
      - "Мы что, попали в зону хранения произведений искусства этого бункера?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Поскольку это бункер судного дня, в его проекте действительно предусмотрена зона для хранения ценных произведений искусства."
      - "Однако... она находится не здесь, и уж тем более они не выставлялись бы напоказ."
      - "К тому же, бункер даже не был введен в эксплуатацию, так что на самом деле сюда не было перевезено ни единого произведения искусства... по идее."
  - text:
      - "Длинный коридор уходил вдаль. Обе его стены были увешаны разнообразными картинами, отчего это место больше напоминало роскошную галерею."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Эти картины повесили прямо на нашем пути."
      - "Раз уж мы здесь, может, заодно и полюбуемся ими~?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Почему бы и нет, всё равно нам их не обойти."
      - "Я немного разбираюсь в искусстве. Например, шкаф справа — это оригинал, вероятно, середины или конца эпохи династии Романовых."
      - "Но вот эти картины, хоть они и выглядят не менее бесценными, мне совершенно не знакомы."
      - "Возможно, в них кроется некий замысел их «организатора»."
      - "Поняв этот замысел... возможно, я смогу составить психологический портрет нашего незваного гостя."
      - "Давайте посмотрим."

chapter2:
  rows:
  - text:
      - "Группа вошла в галерею."
      - "В первой секции, названной «Рассвет», располагались четыре картины..."

chapter3:
  rows:
  - text:
      - "Осмотреть «Решающий момент»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Эта картина маслом изображает подписание соглашения о перемирии странами-участницами войны»."
      - "«Вагон, в котором было подписано соглашение, произведен на Санкт-Петербургском вагоностроительном заводе и считается символом победы»."
  - char: "poltava"
    side: "left"
    text:
      - "Соглашение о перемирии... Интересно, какое именно событие здесь запечатлено."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Похоже на произведение, изображающее эпоху Российской империи..."
      - "Но на моей памяти не было событий, соответствующих тому, что описано на этой картине."

chapter4:
  rows:
  - text:
      - "Осмотреть «Звезда Империи»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Эта картина маслом изображает прибытие скоростного поезда Звезда Империи»."
      - "«Композиция основана на всем известной классической старой фотографии, и благодаря мастерству художника зритель словно возвращается в тот сияющий миг»."
  - char: "svirepy"
    side: "left"
    text:
      - "...«Основана на всем известной классической старой фотографии»?"
      - "Что это за фотография, ты припоминаешь?"
  - char: "ognevoy"
    side: "right"
    text:
      - "Совершенно не припоминаю."
      - "И вообще, что еще за Звезда Империи! У нас и в помине нет скоростного поезда с таким названием!"

chapter5:
  rows:
  - text:
      - "Осмотреть «Новый Альянс и Новый Порядок»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Эта картина маслом изображает формирование нового мирового альянса.»"
      - "«На полотне развеваются десятки флагов, среди которых на самом видном месте находится золотой двуглавый орёл.»"
  - char: "svirepy"
    side: "left"
    text:
      - "...Эта картина немного раздражает."

chapter6:
  rows:
  - text:
      - "Осмотреть «Память о победе»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Эта картина маслом изображает зал Музея Победы»."
      - "«В зале представлено множество экспонатов, включая осьминогоподобную оснастку Обсервер»."
  - char: "poltava"
    side: "left"
    text:
      - "Я ведь даже вживую никогда не видела эту осьминогоподобную оснастку Обсервер среди экспонатов..."
      - "Неужели этот музей посвящен... победе над Сиренами?.."

chapter7:
  rows:
  - text:
      - "Группа двинулась дальше и перешла в следующую секцию галереи."
      - "Во второй секции под названием «Закат» также были выставлены четыре картины..."

chapter8:
  rows:
  - text:
      - "Осмотреть «Хромой гигант»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Эта картина маслом изображает жителей городка, совершающих праздничные покупки»."
      - "«Перед пекарней выстроилась длинная очередь, толпа людей собралась здесь в ожидании хлеба и водки»."
  - char: "ognevoy"
    side: "left"
    text:
      - "А эта картина и правда кажется немного знакомой..."
  - char: "poltava"
    side: "right"
    text:
      - "Да... однако в последние два года, благодаря налаживанию морских путей и улучшению военной обстановки."
      - "Сейчас поставки продовольствия стали куда стабильнее, и подобную картину можно увидеть всё реже."

chapter9:
  rows:
  - text:
      - "Осмотреть «Стоит быть начеку»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Эта картина маслом изображает зал суда»."
      - "«Подсудимый — военно-морской офицер, пытавшийся направить военный корабль на Санкт-Петербург»."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Направить военный корабль на Санкт-Петербург... Похоже, исход этого суда уже предрешен."
  - char: "poltava"
    side: "right"
    text:
      - "...На картине всё так же изображено событие, о котором мы никогда не слышали."
      - "Обычный военный корабль, а не кансен... Сложно понять эпоху и контекст создания этого произведения."

chapter10:
  rows:
  - text:
      - "Осмотреть «Изолированный гигант»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Эта картина представляет собой абстракцию, перерисованную в причудливом стиле»."
      - "«Изображенный на полотне хаотичными линиями представитель Северного Парламента резко контрастирует с толпой, нарисованной аккуратными штрихами»."
  - char: "poltava"
    side: "left"
    text:
      - "Использовать подобный способ художественного самовыражения..."
      - "Надо сказать, абстракция получилась что надо..."

chapter11:
  rows:
  - text:
      - "Осмотреть «Тихая рождественская ночь»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Это простой рисунок, на котором, судя по всему, изображено, как под покровом ночи на неком здании медленно спускают флаг»."
      - "«Поскольку рисунок детский, детали прорисованы нечетко, но он всё равно позволяет прочувствовать заложенную в нём торжественность»."
  - char: "svirepy"
    side: "left"
    text:
      - "...Это еще что такое, с каких пор в галерее выставляют даже детские рисунки."
  - char: "ognevoy"
    side: "right"
    text:
      - "Хоть деталей и не разобрать, но при взгляде на эту картину мне становится как-то необъяснимо не по себе..."
  - char: "svirepy"
    side: "left"
    text:
      - "Согласна, от одного взгляда на неё так и закипает беспричинный гнев!"

chapter12:
  rows:
  - text:
      - "Группа продолжила путь и перешла в следующую секцию галереи."
      - "В последней секции под названием «Утопия» всё так же были выставлены четыре картины..."

chapter13:
  rows:
  - text:
      - "Осмотреть «Великий город»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Это длинное полотно, на котором изображен бескрайний город»."
      - "«В толпе можно заметить бесчисленное множество знакомых лиц»."
      - "«После долгих скитаний, в конце концов, вы и все ваши товарищи снова оказываетесь здесь, словно никто никуда и не уходил»."

chapter14:
  rows:
  - text:
      - "Осмотреть «Истинный идеал»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Это длинное полотно, на котором запечатлен момент подписания исторического договора»."
      - "«Композиция картины разворачивается по горизонтали, все участники подписания договора прорисованы на ней четко и во всех деталях»."
      - "«Среди развевающихся флагов можно разглядеть золотого двуглавого орла и огромного белого медведя»."
      - "«В самом верху полотна начертано: отныне и вовеки — вечный мир»."

chapter15:
  rows:
  - text:
      - "Осмотреть «Нескончаемый пир»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Это длинное полотно, на котором изображен пир, растянувшийся на многие километры»."
      - "«В мире не бывает нескончаемых пиров — похоже, эта древняя поговорка и правда безнадежно устарела»."
      - "«Обладая неисчерпаемыми ресурсами, вы, естественно, способны сделать так, чтобы этот пир никогда не заканчивался»."

chapter16:
  rows:
  - text:
      - "Осмотреть «Обычный урок»"
  - char: "exibition_lable"
    side: "right"
    text:
      - "«Это набросок, изображающий уголок учебного класса в академии»."
      - "«Вы замечаете, что учитель на этом уроке — Сирена»."
      - "«Разумеется, в этом нет ничего необычного. Раз уж с Сиренами удалось достичь мирного сосуществования, почему бы им не работать учителями?»"

chapter17:
  rows:
  - char: "poltava"
    side: "left"
    text:
      - "На всех картинах в этой секции изображены идеализированные картины будущего... Вполне оправдывает название «Утопия»."
  - char: "ognevoy"
    side: "right"
    text:
      - "Это немного похоже на ту цель, ради которой мы все сражаемся."
  - char: "svirepy"
    side: "left"
    text:
      - "Э-э... Но там есть сюжет про мирное сосуществование с Сиренами, а это в наши цели точно не входит."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Осмотрев всё это, что скажешь, товарищ Союз?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Хм... Видно, что у автора есть свое видение, а качество исполнения позволяет назвать их настоящими произведениями искусства, включая даже те несколько набросков."
      - "Послания, заложенные в этих работах, в одних случаях служат предостережением, а в других — кажутся просто полетом фантазии."
      - "Впрочем, художественное творчество должно быть свободным, так что я не хочу судить слишком строго."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "А помимо этого?.."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Помимо этого?.."
      - "Ох... Так вот, касательно замыслов их «организатора», у меня пока нет никаких догадок."
      - "Возможно, мы сможем прояснить эти вопросы только после того, как обследуем центр обработки данных."
      - "Давайте двигаться дальше."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "...Подожди..."
      - "Эх~ Ладно! Выдвигаемся~"