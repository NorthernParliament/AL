chapter1:
  rows:
  - text:
      - "В тот миг, когда двери лифта открылись, все с нетерпением бросились наружу."
      - "В конце концов, никто не мог устоять перед очарованием подлёдного океана."
      - "Взглянув вдаль сквозь стекло, за окном они увидели бескрайнюю водную гладь и совершенно невообразимые, диковинные ландшафты."
      - "Всё было в точности так, как они и ожидали."
  - char: "ognevoy"
    side: "left"
    text:
      - "Какой прекрасный вид..."
  - char: "svirepy"
    side: "right"
    text:
      - "Скорее, какой странный вид!.. Причем странно всё — и вода, и камни."
      - "Эти горы, эта вода, эти скалы... и туман вдалеке... Это место вообще не похоже на подземелье!"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Если быть точной, это место находится подо льдом."
      - "Верно, вот она — истинная Антарктика, скрытая под толщей льда."
      - "Суша и океан."
  - char: "ognevoy"
    side: "right"
    text:
      - "Товарищ Союз, а ты знаешь, что там, за туманом?"
  - char: "svirepy"
    side: "left"
    text:
      - "И под водой тоже! Насколько глубоко это море и что скрывается на дне?"
      - "Там есть какие-нибудь доисторические существа, гигантские жуткие рыбы или вроде того?!"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Мне это неизвестно."
      - "Поскольку база всё это время находилась в спящем режиме, исследовательские программы по изучению окрестностей, разумеется, тоже никогда не запускались."
      - "Однако... тот незваный гость провел здесь немало разведывательных работ."
      - "Если данные не были стерты полностью, мы, возможно, сможем что-нибудь из них почерпнуть."
      - "Сейчас мы находимся в секторе «Кольцо», а центр обработки данных расположен в отдельном здании на комплексной платформе впереди. Давайте поторопимся."
  - char: "svirepy"
    side: "left"
    text:
      - "Хе-хе, интересно, каково это — мчаться по поверхности моря под километровой толщей льда!"
      - "Жду не дождусь!"
