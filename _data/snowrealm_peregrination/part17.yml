chapter1:
  rows:
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Кто ты такая?"
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Хе-хе, разве ты уже не догадалась?"
  - text:
      - "В золотом зале стоявшая поодаль девушка провозгласила:"
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Я — Память Меркурия, явившаяся из очень далекой истории."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Что ты сделала с той Памятью Меркурия, которая прибыла вместе со мной?"
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Ах... Кажется, последствия помех еще не до конца рассеялись."
      - "Теперь, когда всё зашло так далеко, нет смысла и дальше притворяться."
      - "Во дворце немного душно, как насчет того, чтобы проветриться?"

chapter2:
  rows:
  - text:
      - "Длинный стол, уставленный изысканными яствами, теперь стоял посреди белоснежной равнины."
      - "Пронизывающий ледяной ветер разогнал туман, и Советский Союз почувствовала, как её разум постепенно проясняется."
      - "Она начала вспоминать всё, что произошло по пути сюда..."
      - "...И наконец, осознала самую главную несостыковку."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Товарищ Память Меркурия с самого начала не покидала Европу..."
      - "«Она» появилась на борту подводной лодки из ниоткуда лишь в тот момент, когда мы вошли в Антарктический океан..."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хм-хм~ Верно, с самого начала это была я."
      - "Вы довольно забавные, я отлично повеселилась."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Я так не считаю."
      - "Какова твоя цель? Что ты сделала с моими товарищами?!"
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Эй~ Не кипятись."
      - "Твое отношение к друзьям и ко всем остальным слишком уж отличается, как скучно."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Не «ко всем остальным», а к «врагам»."
      - "Я не в настроении болтать с тобой. Отвечай на вопрос."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Эй-эй, ну что за упрямство!"
      - "То, что я не та Память Меркурия, которую ты знаешь, еще не значит, что я твой враг."
      - "Успокойся, с твоими товарищами всё в порядке."
      - "Я просто пригласила тебя в свой замок."
      - "Что же до моих целей... в этот раз я прибыла сюда с тремя целями."
      - "Одна из них — главная, а две другие — сопутствующие."
      - "Но я не собираюсь говорить тебе о них прямо. Почему бы тебе не попробовать угадать?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Раз так, у меня есть дела, и я не стану тратить на тебя время."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Подожди..."
      - "Те картины, что мы видели в галерее... они и правда не вызвали у тебя никаких чувств?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Так это ты разместила те картины..."
      - "Похоже, именно ты запустила разведку в бункере Судного дня."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хе-хе, совершенно верно~"
      - "В этот раз на приманку Обсервер клюнуло немало рыбешек, но я впустила только тебя."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Почему?"
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Потому что мне было очень любопытно."
      - "Всю дорогу я слушала, как ты рассуждаешь о своих идеалах и убеждениях, но это лишь выводы, сделанные в условиях информационной изоляции."
      - "Но что, если я скажу тебе, что всё изображенное на тех картинах — «реальность» какого-то из миров?"
      - "Всё это я видела своими глазами и слышала собственными ушами. Что ты почувствуешь, узнав об этом?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Похоже, твой жизненный опыт и впрямь весьма богат."
      - "К какому же из них принадлежит твой мир? К процветающему или разрушенному?"
      - "Кажется, я начинаю понимать твои мотивы..."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Правда? Тогда я с нетерпением жду твоего ответа."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Как скучно."
      - "Стремительный поток истории неумолимо движется вперед, порождая новый мир и безжалостно смывая старый."
      - "...Какая скучная мысль, я должна была догадаться раньше."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "«Стремительный поток истории движется вперед» лишь потому, что он не в силах выбирать, куда ему течь."
      - "Но что, если бы мы могли выбирать?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "И что дальше? Ты бы выбрала пойти против течения? Повторить уже совершенные ошибки прошлого?"
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "По крайней мере, прошлое нам известно, оно уже предопределено."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "А также безнадежно и лишено всякого смысла."
      - "Смотреть вперед, двигаться навстречу будущему — вот что мы должны делать."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Двигаться навстречу будущему..."
      - "По интонации ты очень напоминаешь одного моего «заклятого врага»."
      - "Но что плохого в предопределенном прошлом?"
      - "Потеря будущего означает лишь потерю неизвестности, а разве неизвестность непременно несет в себе надежду?"
      - "В своем долгом путешествии я многое узнала... Российская империя, Северный Парламент, Революционный фронт."
      - "Все они могли быть невероятно могущественными в свое время, но все они обратились в прах в том самом будущем, о котором ты так мечтаешь."
      - "«Династии» не вечны, и, взглянув на историю от древности до наших дней, разве ты не признаешь этот факт?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Однако мое сердце знает, кому принадлежит. Я выбрала Северный Парламент и твердо решила посвятить всю свою жизнь борьбе за него."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...У тебя есть свои убеждения и принципы, как и у меня."
      - "Но я знаю, что в конце того пути, которого ты упорно держишься, в том будущем, о котором ты мечтаешь — лишь сплошная пустота."
      - "Прямо как эта бескрайняя белая пустошь."
      - "Так что же плохого в выборе предопределенного прошлого?"
      - "По крайней мере, в прошлом всегда можно создать период прекрасного времени, не так ли?"
      - "Разве не чудесно было бы зажить райской жизнью вместе с товарищами в эти предопределенные счастливые времена?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "«Райской»?"
      - "Ты имеешь в виду жизнь, подобную лабораторным мышам в клетке?"
      - "К сожалению, мы вели такую жизнь слишком долго."
      - "Поэтому мы непоколебимо выберем свой собственный путь."
      - "Даже если в конце этого пути нас ждет гибель, по крайней мере мы старались, мы боролись... мы попытались сами стать хозяевами своей судьбы."
      - "То, что даровано другими, в конечном итоге никогда не станет по-настоящему твоим."
      - "Полагаю, мир, в котором ты жила в прошлом, как и наш, был экспериментальным полигоном Сирен?"
      - "Тогда ты должна была это понимать. Какой бы счастливой ни была лабораторная мышь, она всё равно остается лишь мышью."
      - "Избавиться от чужого вмешательства и взять судьбу в свои руки — это единственный выход."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Не бросайся такими громкими словами!"
      - "Мы уже сражались изо всех сил!"
      - "И каков был результат этой битвы?"
      - "Как видишь, выжила только я."
      - "Только я выжила под защитой своих товарищей, неся в себе их неисполненные желания!"
      - "Какое право ты, не пережившая ничего подобного, имеешь отчитывать меня?!"
      - "Разве битва простых смертных способна победить сам рок?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Вот, значит, каким было твое прошлое."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Поэтому, когда я получила шанс сделать выбор снова."
      - "Я решила вернуть свой дом и своих товарищей."
      - "Чтобы они жили вместе со мной в раю, подвластном только мне, целую вечность."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "В раю, подвластном тебе... целую вечность."
      - "...Почему мне кажется, что за последнее время я слышу подобное уже не в первый раз."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хе-хе, ты почти угадала одну из моих целей~"
