chapter1:
  rows:
  - text:
      - "Как и ожидалось, Клемансо с радостью согласилась на мою просьбу провести командование этой военной операцией из здания Трибунала."
      - "Когда я прибыл в здание Трибунала после завершения сеанса связи с Саратогой, всё уже было готово."
  - char: "memphis"
    side: "left"
    text:
      - "Командир, согласно вашему приказу, маршруты отступления флотов Саратоги и Советский Союз были скорректированы."
      - "Эвакуация персонала, размещенного на всех крупных исследовательских станциях, также проводится синхронно. На данный момент всё идет гладко."
  - char: "commander"
    side: "right"
    text:
      - "Отлично, наконец-то можно немного перевести дух..."
  - text:
      - "*хлоп хлоп хлоп*"
  - char: "clemenceau"
    side: "left"
    text:
      - "Разрабатывать стратегию в походном шатре, чтобы одержать победу за тысячи миль."
      - "Я впервые вижу Командира, демонстрирующего подобное мастерство. Кто знает, может быть, у тебя есть неожиданный талант политика?.."
  - char: "commander"
    side: "right"
    text:
      - "...Не стоит меня так перехваливать. Я прекрасно понимаю разницу между тем, чтобы просто удержать позиции, и тем, чтобы одержать победу за тысячи миль."
      - "Если бы я мог, я бы прямо сейчас полетел в Антарктику..."
      - "Как обстоят дела со встречей с Бисмарк?"
  - char: "clemenceau"
    side: "left"
    text:
      - "Как ты и просил, всё уже устроено. Я как раз пришла сообщить тебе об этом."
      - "Встреча пройдет в тайной комнате, мы гарантируем, что никто не услышит содержание вашего разговора."
  - char: "commander"
    side: "right"
    text:
      - "Даже ты не услышишь?"
  - char: "clemenceau"
    side: "left"
    text:
      - "Ну~ угадай."
      - "Госпожа Бисмарк уже ждет на линии. Мне передать ей, чтобы она перенесла время?"
  - char: "commander"
    side: "right"
    text:
      - "В этом нет необходимости, показывай дорогу."
  - char: "clemenceau"
    side: "left"
    text:
      - "Хе-хе, Командир, прошу сюда~"

chapter2:
  rows:
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Приветствую тебя, Командир Лазурного пути."
      - "Фридрих как-то советовала мне поговорить с тобой по душам."
      - "Жаль только, что всё не выпадало подходящего случая."
      - "Никак не ожидала, что наш первый официальный разговор состоится при подобных обстоятельствах."
      - "То, что мы собираемся обсудить на этой встрече, связано с происходящим в Антарктике?"
  - char: "commander"
    side: "left"
    text:
      - "...Клемансо действительно ничего тебе не сказала?"
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Она лишь многозначительно обмолвилась, что у тебя есть разведданные о текущей ситуации в Антарктике, которыми ты хочешь поделиться, и что ты надеешься на мое содействие."
      - "А детали предложила оставить в секрете, чтобы я с нетерпением ждала встречи с тобой."
      - "...Это вполне в её духе."
      - "Что касается Антарктики, на самом деле всё обстоит так..."

chapter3:
  rows:
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Значит, информацию о появлении в Антарктике особого минерала ты намеренно передал мне и Союз?"
      - "А Клемансо с самого начала была твоей сообщницей?"

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Именно! *самодовольно*"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "...Ахаха *нервный смех*"

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "... *промолчать*"

chapter7:
  rows:
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Хе-хе, поистине поразительные методы."
      - "Похоже, мне и правда стоило послушать Фридрих и поговорить с тобой пораньше."
  - char: "commander"
    side: "left"
    text:
      - "Жаль только... я лишь догадывался о наличии заговора в Антарктике, но никак не ожидал, что всё обернется войной."
      - "Армия Дироев бесчинствует на ледяных пустошах... Если пустить всё на самотек, ситуация может стать еще более суровой, чем во время инцидента с «Царством Божьим»."
      - "К счастью, благодаря опыту прошлого раза мы знаем, что сейчас это лишь ранняя стадия «трансформации»."
      - "План Памяти Меркурия META явно не так тщательно проработан, как у Марко Поло. К тому же на безлюдном континенте Антарктики концепция, к которой она взывает, не столь устойчива."
      - "Если мы сплотимся, у нас всё еще есть шанс одержать победу."
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Сплотимся, значит..."
  - char: "commander"
    side: "left"
    text:
      - "Верно, силы всех наших фракций в Антарктике весьма ограничены... Чтобы разрешить этот инцидент, мы должны отбросить предубеждения и действовать сообща."
      - "Я надеюсь, ты позволишь флоту Железной Крови, уже вошедшему в Антарктический океан, присоединиться к предстоящей операции под моим командованием."
      - "...Разумеется, я не откажусь и от подкрепления. У тебя ведь наверняка есть запасной план."
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Обнаружив, что в Антарктике возникли проблемы со связью, я действительно сделала кое-какие приготовления... они должны пригодиться."
      - "Но... как насчет такого варианта."
      - "Что, если в предстоящей битве я напрямую передам командование флотом Железной Крови в твои руки?"
      - "Разве это не лучший вариант как для исхода этого сражения, так и для твоих собственных планов?"
  - char: "commander"
    side: "left"
    text:
      - "Позволишь мне напрямую командовать флотом Железной Крови?.."
      - "...Я не ожидал, что ты примешь такое решение."
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Не стоит благодарности. Приказ подчиняться твоим распоряжениям вскоре будет передан каждому флоту Железной Крови на передовой."
      - "Делай всё так, как сочтешь нужным, Командир."
  - char: "commander"
    side: "left"
    text:
      - "Тогда я не буду отказываться. Большое спасибо."
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Бисмарк, конец связи."

chapter8:
  rows:
  - char: "clemenceau"
    side: "left"
    text:
      - "Разговор оказался короче, чем я ожидала."
      - "Но, судя по твоему лицу, всё прошло гладко?"
      - "К тому же... кажется, ты получил и кое-какую неожиданную выгоду?"

chapter9:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Ты ведь и так всё слышала..."
  - char: "clemenceau"
    side: "left"
    text:
      - "Поэтому я и говорю — угадай, слышала я или нет~"

chapter10:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Какая — же — ты — умная."
  - char: "clemenceau"
    side: "left"
    text:
      - "Хе-хе, спасибо за комплимент."


chapter11:
  rows:
  - char: "clemenceau"
    side: "left"
    text:
      - "Ладно, шутки в сторону. Пока ты разговаривал с Бисмарк, на передовой произошли кое-какие изменения."
      - "Антарктический флот Королевского Флота, похоже, обнаружил присутствие Дироев, и теперь они кружат на месте, видимо, еще не решив, что делать дальше."
      - "Ох~ Похоже, прошлый инцидент явно оставил на них свой отпечаток."
      - "Смотри не забудь про них при планировании своей военной операции~"
      - "«Внимание, флоту Королевского Флота, приписанному к Лазурному пути, говорит Командир»."
      - "«Согласно положениям «Договора об Антарктике», мои полномочия как Командира в антарктической зоне боевых действий безграничны»."
      - "«В связи с этим я требую немедленно передать мне командование вашим флотом, и у вас нет права на отказ»."
      - "Что скажешь... как насчет того, чтобы я отдала этот приказ за тебя?"
  - char: "commander"
    side: "right"
    text:
      - "Приказ я всё же поручу составить Мемфис, так что не утруждай себя..."
  - char: "clemenceau"
    side: "left"
    text:
      - "Какая жалость~"
