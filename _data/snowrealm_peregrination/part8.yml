chapter1:
  rows:
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Пфф..."
      - "Пфф-ахаха... Железная Кровь и правда совсем не в курсе новостей!"
      - "А ведь мы уже успели модернизировать оснастку с помощью образцов минерала..."
      - "А начальник их крепости всё ещё думает, что это мы привезли с собой передовую экипировку для исследования минерала!.."
  - char: "poltava"
    side: "right"
    text:
      - "Судя по её реакции, Кёнигсберг, скорее всего, тоже не знает о том, что Союз Орла уже собрал в Антарктике огромный флот."
      - "Разведка Железной Крови всё так же полностью соответствует стереотипам о ней..."
      - "Ведь именно они первыми обнаружили этот минерал... и всё равно везде отстают на шаг."
      - "...Но раз уж на то пошло, мне стало ещё любопытнее, что за «эксклюзивная информация» оказалась в руках Союза Орла."
      - "Товарищ Союз, у тебя и правда нет никаких идей на этот счёт?.."
      - "Касательно «зоны таяния снегов»... есть ли какая-то информация, о которой ты нам не рассказала?.."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Хм?.. С чего ты взяла что это так?"
  - char: "poltava"
    side: "right"
    text:
      - "Даже если сложить вместе все твои предыдущие доводы, их всё равно недостаточно, чтобы объяснить, почему тебе понадобилось лично отправляться в «зону таяния снегов» именно сейчас."
      - "В том районе скрыто нечто, о чём ты нам не сообщила, верно?.."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Хм~ Да, в этом районе действительно кроется одна тайна."
      - "Но могу с уверенностью сказать, что Союз Орла об этом секрете не знает, и к сбору их флота эта тайна отношения не имеет."
      - "Честно говоря, эту секретную информацию я планировала рассказать вам уже по прибытии на место."
      - "Но раз уж вы и так обо всём догадались, а до цели осталось недалеко, ничего страшного, если я поделюсь ей сейчас."
      - "В прошлом Северный Парламент вместе с Железной Кровью... мы с Фридрих дер Гроссе сотрудничали и построили в Антарктике один секретный объект."
      - "Это бункер судного дня, спрятанный на глубине тысячи метров под толщей льда. Он способен гарантировать выживание находящихся в нём людей при любых катаклизмах на поверхности."
      - "Я назвала его «Кольцо Мудрости»."
      - "И находится «Кольцо Мудрости»... как раз в нынешней «зоне таяния снегов»."
      - "И, возможно, правда о таянии снегов кроется именно в нём."
  - char: "poltava"
    side: "right"
    text:
      - "...А?"
      - "Значит, эта таинственная «зона таяния снегов» появилась из-за нашего собственного объекта?!"
      - "Н-но, это же совместный проект с Железной Кровью, почему тогда Кёнигсберг не в курсе?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Пока я тебе не рассказала, ты ведь тоже ничего не знала? Вот в чем дело."
      - "Учитывая, что этот бункер задумывался как последнее убежище, о нем мало кто знает как в Северном Парламенте, так и в Железной Крови."
  - char: "svirepy"
    side: "right"
    text:
      - "...Никак не ожидала, что правда о таянии снегов окажется такой. А я-то думала, что здесь и правда возникла какая-то неразрешимая загадка."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "К сожалению, за большинством «таинственных событий» чаще всего скрывается вот такая банальная правда~"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Впрочем, всё не так просто."
      - "Хоть мы и построили этот бункер судного дня, сам по себе он должен находиться в спящем режиме."
      - "Если только кто-то намеренно не активировал его и не изменил алгоритмы работы некоторых систем, отводимое им тепло ни за что не растопило бы окружающие льды настолько, чтобы образовалась столь заметная «зона таяния снегов»."
      - "Не говоря уже о минералах и врагах, появившихся вместе с этой «зоной таяния снегов»..."
      - "Возможно, кто-то пытается связать всё это с Северным Парламентом..."
      - "Хотя я и не знаю, кто стоит за этим и каковы его цели... но я чую заговор."
      - "Поэтому в этот раз я должна была отправиться сюда и расследовать всё лично."
