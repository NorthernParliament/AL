chapter1:
  rows:
  - char: "zuikaku"
    side: "left"
    text:
      - "Фух... В этот раз командировка выдалась ну очень долгой..."
      - "Но наконец-то я... вернулась домой!"
      - "Даже не знаю, по какому такому важному делу госпожа Нагато так срочно вызвала меня обратно..."
      - "Впрочем, это даже кстати: у меня накопилось столько открытий, о которых нужно доложить!"
  - text:
      - "*тук тук*"
  - char: "zuikaku"
    side: "left"
    text:
      - "Сестрица, госпожа Нагато, Великий ветеран, я вернулась~"
      - "......"
      - "...Э, никого нет?"
      - "...Это точно поместье Микасы, я не могла ошибиться."
      - "Неужели у всех появились срочные дела и они куда-то ушли?.."
  - char: "communicator"
    side: "right"
    text:
      - "*бип бип*"
  - char: "zuikaku"
    side: "left"
    text:
      - "...А? Связь есть, но никто не берет трубку?.."
      - "...Ч-что вообще происходит?"
