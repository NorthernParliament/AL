chapter1:
  rows:
  - char: "helena_rad"
    side: "left"
    text:
      - "Командир, только что поступило сообщение: флот Северного Парламента благополучно прибыл на исследовательскую станцию в Антарктике."
      - "Однако после этого госпожа Клемансо потеряла связь со своими источниками информации в Антарктике."
  - char: "commander"
    side: "right"
    text:
      - "...Проблемы со связью?"
  - char: "helena_rad"
    side: "left"
    text:
      - "Госпожа Клемансо сказала, что у неё не один источник информации в Антарктике, и то, что они все разом перестали выходить на связь, явно не может быть простой «проблемой со связью»."
      - "Возможно, они подверглись преднамеренному глушению, чтобы внешний мир не смог получать информацию из Антарктики."
  - char: "commander"
    side: "right"
    text:
      - "...Понял, я что-нибудь придумаю со своей стороны."
  - char: "helena_rad"
    side: "left"
    text:
      - "Вас поняла, Хелена конец связи."
  - char: "commander"
    side: "right"
    text:
      - "............"
      - "Искусственно созданные помехи... Учитывая, что мы не можем задействовать силы Союза Орла, остается только обратиться к ней за помощью."

chapter2:
  rows:
  - text:
      - "Перед глазами предстала... ослепительная звездная река."
  - char: "commander"
    side: "left"
    text:
      - "...Тот же самый пейзаж, что я видел раньше."
      - "...Так вот что она называла зашифрованным каналом."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ты начал действовать, Командир."
  - char: "commander"
    side: "left"
    text:
      - "В конце концов, я не могу просто закрыть глаза на заговор, зреющий в Антарктике."
      - "Однако... всё пошло не так, как хотелось, и при выполнении плана возникли проблемы."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ты про помехи, которые отрезали весь континент Антарктики от внешнего мира?.."
  - char: "commander"
    side: "left"
    text:
      - "Именно. Это тоже часть плана Обсервер?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Нет, эти помехи установила не Обсервер."
      - "Но~ я с этим разберусь."
  - char: "commander"
    side: "left"
    text:
      - "...Не Обсервер? Тогда кто?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Скоро ты всё узнаешь."
  - char: "commander"
    side: "left"
    text:
      - "...Что именно тебе известно об этом инциденте в Антарктике?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Многое. Я знаю, кто настоящий кукловод, стоящий за всем этим, знаю, что она уже сделала, и знаю, что она собирается делать дальше."
      - "Но..."
  - char: "commander"
    side: "left"
    text:
      - "Ты пока не можешь мне этого рассказать?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Верно, потому что с этим предстоит разобраться тебе."
  - char: "commander"
    side: "left"
    text:
      - "...В таком случае, ты не могла бы поведать мне способ лечения Лексингтон?"
      - "Если бы мы знали как это сделать, Саратоге не пришлось бы прибегать к столь радикальным действиям."
      - "Если бы я смог отговорить Саратогу, этот заговор было бы куда проще предотвратить."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Какой же ты чурбан."
      - "Я сейчас разозлюсь."
  - char: "commander"
    side: "left"
    text:
      - "...А?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ведь это ты хочешь её спасти, не так ли?"
  - char: "commander"
    side: "left"
    text:
      - "..."
      - "Ты права, это тоже то, с чем предстоит разобраться мне."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Вот и отлично."
      - "Наблюдение за полем боя в Антарктике успешно развернуто."
      - "Тебе пора возвращаться."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "...Хотя Хелена, как обычно, не стала раскрывать всех карт, одну важную проблему мы всё же решили."
      - "«Наблюдение за полем боя успешно развернуто»... Посмотрим на результаты."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Хелена, Мемфис, теперь у нас должен быть прямой доступ к наблюдению за ситуацией всех фракций в зоне боевых действий Антарктики."
      - "Вы получили обновленные разведданные?"
  - char: "helena_rad"
    side: "right"
    text:
      - "П-получили, информация просто льется рекой..."
      - "Мало того, что карта обновляется в реальном времени, к ней еще прилагается сводка разведданных по всем флотам каждой фракции за последние две недели..."
  - char: "memphis_rad"
    side: "left"
    text:
      - "Действия всех фракций просто как на ладони!"
      - "Вся зона боевых действий Антарктики стала для нас словно прозрачной!"
      - "Твоё решение проблемы... Неужели ты обратился к... «ним»?"
  - char: "commander"
    side: "right"
    text:
      - "Верно, в этой операции они выступят в качестве нашей поддержки."
      - "Для начала доложите об обстановке у других фракций."
  - char: "memphis_rad"
    side: "left"
    text:
      - "...Есть! Сейчас посмотрю..."
      - "Хм... Флот Северного Парламента успешно вошел в «зону таяния снегов». Сейчас их сигнал остается на месте — возможно, они проводят расследование."
      - "Со стороны Союза Орла флот операции «Ледяной ангел» под командованием Саратоги уже направляется к «зоне таяния снегов»."
      - "В итоге они всё же на шаг отстали от сил Парламента."
      - "Антарктический флот Королевского Флота, прибывший со стороны Сиднея, как и предполагалось, теперь тоже вошел в Южный океан."
      - "Однако перемещения флота Железной Крови, покинувшего море Бисмарка, выглядят немного странно: они всё время курсируют на границе Южного океана и не высаживаются на берег, будто занимают выжидательную позицию."
      - "Кроме того... судя по записям, антарктическая крепость Железной Крови недавно передавала сигнал о нападении противника. Возможно, действия их флота связаны с этим."
  - char: "commander"
    side: "right"
    text:
      - "Сигнал о нападении противника?.. А что за противник?"
  - char: "memphis_rad"
    side: "left"
    text:
      - "Пока неясно, возможно, сама Железная Кровь тоже находится в полном неведении."
  - char: "commander"
    side: "right"
    text:
      - "Хорошо, продолжайте наблюдение. Соберите как можно больше разведданных до того, как мы начнем действовать."