chapter1:
  rows:
  - char: "poltava"
    side: "left"
    text:
      - "Я не понимаю, товарищ Союз."
      - "Хотя наша станция «Мирный» и является результатом сотрудничества с Железной Кровью."
      - "Но одной лишь этой связи... недостаточно, чтобы мы лично шли на такой риск и отправлялись туда."
      - "Я уверена, что как одна из двух фракций, развернувших военные крепости в Антарктике, Железная Кровь обладает достаточными возможностями, чтобы справиться с любыми непредвиденными обстоятельствами."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Да, в этом я тоже не сомневаюсь."
      - "Им и правда не нужна наша помощь, и сообщение, которое они нам прислали, было предупреждением об опасности, а не просьбой о помощи."
      - "Однако... хе-хе, разве под предлогом спасения мы не сможем совершенно открыто прогуляться по их базе?"
      - "Всё наше сотрудничество с Железной Кровью в Антарктике было начато и реализовано в то время, когда у руля фракции стояла Фридрих дер Гроссе."
      - "А в прошлом, когда Железной Кровью руководила Бисмарк, мы с ними не выстроили никаких особо хороших «взаимоотношений»."
      - "Теперь, когда она снова у руля, продолжит ли она сотрудничать с нами? Разделит ли она дух и устремления Фридрих?"
      - "Сейчас всё это находится под большим вопросом."
      - "Поэтому нам нужно проявить больше инициативы, чтобы напомнить ей о существовании «договоров и сотрудничества»."
      - "Конечно, выяснить, с каким именно врагом они столкнулись, и лучше понять текущую ситуацию в Антарктике — это тоже одна из наших целей."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "К тому же, нам всё равно по пути~"
  - char: "svirepy"
    side: "right"
    text:
      - "Вот оно что, как ни крути, мы в выигрыше. Как и ожидалось от товарища Союз!"
  - char: "ognevoy"
    side: "left"
    text:
      - "Смотрите, та группа зданий впереди — это ведь антарктическая крепость Железной Крови!"

chapter2:
  rows:
  - text:
      - "Проследив за взглядом Огневой, они увидели, как нагромождения зданий Железной Крови, подобно броне, покрывали неизменный белый снег."
  - char: "poltava"
    side: "left"
    text:
      - "По сравнению с нашей исследовательской станцией... это действительно уровень военной крепости."
  - char: "svirepy"
    side: "right"
    text:
      - "Это уже слишком!.."
      - "Неужели в таком безлюдном месте, как Антарктика, и правда было необходимо отстраивать нечто подобное!.."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Очевидно, что первоначальные планы Фридрих на Антарктику не ограничивались лишь научными исследованиями или военной обороной..."
      - "Жаль только, что теперь у нас уже нет возможности это выяснить..."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Союз."
      - "Ты хочешь узнать историю Антарктики?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...М-м? Ты это..."

chapter3:
  rows:
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...о чем?"
      - "...Память Меркурия?"
  - text:
      - "Советский Союз не сдвинулась с места, но пейзаж вокруг нее внезапно начал меняться."
      - "Товарищи исчезли, а на их месте одна за другой выросли уходящие в небо механические башни."
      - "Это явно был стальной мегаполис, по своим масштабам превосходивший даже бескрайние ледники."
      - "В то же время Советский Союз осознала истинную природу того, что было у нее под ногами: это была вовсе не земля, скованная льдом и снегом, а сплошная металлическая поверхность."
      - "В этот самый момент металлическая гладь продолжала стремительно разрастаться и шириться посреди белой снежной равнины."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "(...Вся ледяная пустыня превращается в крепость?)"
      - "(Или же... таков истинный облик этого континента, скрытый подо льдом и снегом?)"
  - text:
      - "Внезапная мысль всплыла в голове у Советский Союз."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "(Невозможно... Как может происходить подобный абсурд.)"

chapter4:
  rows:
  - text:
      - "Однако стремительно меняющийся перед глазами пейзаж не оставил Советскому Союзу времени на раздумья."
      - "В мгновение ока земля запылала, а мегаполис начал рушиться."
      - "В свете ослепительного полярного сияния всё былое величие и великолепие стремительно обращалось в прах."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "(Всё это... и есть истина, суть этого континента... или же его будущее?)"
  - text:
      - "Очередная мысль вновь возникла в сознании у Советский Союз."

chapter5:
  rows:
  - char: "pamiat_merkuria_meta?_d"
    side: "right"
    text:
      - "Это история, которую я знаю, — одна из возможностей этой земли."

chapter6:
  rows:
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "(...Всё вокруг вернулось в норму.)"
      - "(Товарищи никак не отреагировали. То, что я только что видела... снова иллюзия?)"
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "♪~"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Память Меркурия, о какой «истории»... ты только что говорила?"
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "...Истории? О чем ты говоришь?.."
      - "Я только что болтала с Огневой и остальными, может, тебе послышалось?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Хм, мне послышалось?.."
  - char: "poltava"
    side: "right"
    text:
      - "Хм? Товарищ Союз, у тебя слуховые галлюцинации?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Не только слуховые, но и зрительные."
  - char: "poltava"
    side: "right"
    text:
      - "...Галлюцинации?.. Может, последствия недавнего эксперимента с резонансом еще не прошли?"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Очень может быть, ведь нестандартный способ модернизации оснастки накладывает на организм необычайно тяжелую нагрузку."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Возможно... так оно и есть."
  - char: "ognevoy"
    side: "left"
    text:
      - "...Ты в порядке, может, сначала немного отдохнешь?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Ничего страшного. Крепость Железной Крови уже недалеко, продолжаем путь."
