chapter1:
  rows:
  - char: "ognevoy"
    side: "left"
    text:
      - "Фух... Мы успешно вернулись на поверхность."
      - "Не ожидала, что наверх из-под земли будет вести такой прямой проход."
  - char: "poltava"
    side: "right"
    text:
      - "В конце концов, это путь для экстренной эвакуации. Если бы он был извилистым, то не смог бы выполнить свою функцию."
  - char: "svirepy"
    side: "left"
    text:
      - "Тогда почему мы с самого начала не спустились по этому эвакуационному пути?!"
  - char: "poltava"
    side: "right"
    text:
      - "...Потому что этот проход можно открыть только изнутри, иначе нельзя было бы гарантировать безопасность."
  - char: "svirepy"
    side: "left"
    text:
      - "Понятно... Что будем делать дальше, немедленно вернемся на исследовательскую станцию?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Да, дальше..."

chapter2:
  rows:
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Кхм..."
      - "(Только что... снова было видение?..)"
  - char: "poltava"
    side: "left"
    text:
      - "Товарищ Союз?!"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Всё нормально, я в порядке... В любом случае, ситуация критическая."
      - "Мы немедленно возвращаемся на исследовательскую станцию, сейчас же..."

chapter3:
  rows:
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...отступаем..."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Попробуй это блюдо — рябчик, фаршированный трюфелями."
      - "Это одно из моих самых любимых блюд на всех банкетах."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "(...Рябчик, фаршированный трюфелями?..)"
  - text:
      - "Советский Союз обнаружила, что в этот момент сидит во главе длинного стола."
      - "Перед ней стояли изысканные яства. Их аромат витал в воздухе, смешиваясь с мерцанием дворцовых свечей и вызывая легкое головокружение."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "(Это... банкет, проходящий во дворце?..)"
      - "(...Я же должна была быть на пути к эвакуации... почему я здесь...)"
      - "(Хм... эвакуация? Откуда эвакуироваться?..)"
      - "(В голове словно сгущается туман...)"
      - "(Нет... ничего не могу вспомнить...)"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Хм? Почему ты всё время так смотришь, это блюдо не в твоем вкусе?"
      - "В таком случае, как насчет того, чтобы попробовать этот прозрачный суп из черепахи? Он вкусный и освежающий, совсем не жирный~"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Вот как. Тогда я не буду стесняться..."
  - text:
      - "Поразмыслив мгновение, Советский Союз решила подыграть происходящему в этой иллюзии, чтобы посмотреть, что будет дальше."
      - "Поэтому она взяла ложку и сделала глоток супа."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "(...У супа есть вкус.)"
      - "(Это не просто обычная иллюзия... или же... обмануты даже мои чувства.)"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Хе-хе, судя по твоему лицу, ты вполне довольна этим супом?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Это и правда очень вкусный суп."
      - "Память Меркурия, где мы находимся, и что это за банкет?"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Это мой замок~ А банкет, разумеется, устроен в твою честь~"
      - "Ну как, обстановка здесь весьма неплохая, верно?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Да, я... еще никогда не видела подобного... банкета."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Хе-хе, помимо нескончаемого пира, в этом замке возможно еще много чудесных вещей."
      - "Например, прогулки по морю цветов, охота в ледяной тундре или скачки по морскому побережью~"
      - "Ну что, хочешь остаться здесь?"
  - text:
      - "Слова Памяти Меркурия словно ускорили распространение тумана в её разуме."
      - "В полумраке сознания у Советский Союз промелькнула мысль, что реальность — это здесь, а та далекая ледяная пустошь — лишь призрачный сон."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Остаться здесь, почему бы и нет."
      - "Но... как же остальные товарищи?"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Если пожелаешь, ты можешь пригласить их присоединиться, и мы все вместе будем жить в этом вечном раю."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Вечном раю..."
  - text:
      - "Эти слова звучали как музыка небес, так успокаивающе и опьяняюще."
      - "В оцепенении Советский Союз увидела целый мир."
      - "Мир, где не иссякают цветы и вино, где все радостно собираются вместе, невзирая на фракции."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Здесь всё так расслабляет, хочется полностью погрузиться в это..."
      - "И именно поэтому... стоит быть настороже."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "...Быть настороже?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Потому что... такого рая в нынешнем мире просто не существует."
      - "Его существование лишь заставляет выбрать побег — побег от реальности, от опасностей... от всего, за что мы сражаемся."
      - "...Поэтому и стоит быть настороже."

chapter4:
  rows:
  - text:
      - "В этот момент в тумане появилась трещина."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Но разве мир, за который ты сражаешься, не похож на этот рай?"
      - "Какая разница, даже если это не реальность? Что плохого в том, чтобы выбрать побег?"
      - "По крайней мере, ты и те, кто тебе дорог, сможете счастливо жить здесь, вдали от конфликтов и боли, разве нет?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Ты хочешь, чтобы я предала свои идеалы и миссию, прозябая остаток дней в иллюзорном счастье."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Какое еще предательство? Я лишь позволила тебе сразу достичь финала!"
      - "Разве ваши идеалы и миссии не направлены на создание именно такого мира?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Похоже, ты ничего не понимаешь."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "...Да, не понимаю, и никогда не понимала."
      - "...Все вы только и твердите об этом, а затем идете и жертвуете собой..."
      - "Но что приносят эти жертвы?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Даже если жертва не меняет всё в одночасье, она всё равно делает мир еще на один маленький шаг ближе к прекрасному будущему."
      - "К тому же, кто-то ведь должен приносить жертвы, не так ли?"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Но это ведь не обязательно должны быть вы!"
      - "...Почему, в какую бы эпоху вы ни жили, вы всегда поступаете так."
      - "...Жить только для себя, сделать так, чтобы ты и небезразличные тебе люди могли просто выжить — что в этом плохого."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Ты не та Память Меркурия, которую я знаю, верно?"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "............"
      - "Эх~ Как и ожидалось, утаить это не вышло."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Кто ты такая?"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Хе-хе, разве ты уже не догадалась?"

chapter5:
  rows:
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...О моем истинном лице~"
