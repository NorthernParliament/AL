chapter1:
  rows:
  - text:
      - "Мои предчувствия оказались верны: в эту ночь никто так и не уснул."
      - "Радость победы еще не успела угаснуть, как донесения о перемещениях врага посыпались словно снег."
      - "Из акватории Южной Атлантики, Индийского и Тихого океанов поступили сообщения о массовых перебросках флотов Сирен."
      - "Все разведданные указывали на то, что Сирены стягивают силы из близлежащих морей в воды Антарктики."
      - "Похоже, с поражением Памяти Меркурия META оказавшаяся в ловушке Обсервер наконец-то обрела свободу."
      - "И хотя легионы Дироев были всё еще сильны, сомневаюсь, что Обсервер оставит их в покое."
      - "Разумеется, я также не питал иллюзий, что Сирены в этой неразберихе намеренно проявят к нам милосердие."
      - "Поэтому я уже отдал флоту приказ о полномасштабном отступлении."
      - "Объединенный флот должен был в полном составе отойти в безопасные воды, а уже оттуда разойтись по своим базам."
      - "Как только с этими распоряжениями было покончено, я снова связался с Хеленой МЕТА..."

chapter2:
  rows:
  - text:
      - "Моему взору всё так же предстала ослепительная звездная река."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Доброе утро. Пришел задавать вопросы?"
  - char: "commander"
    side: "left"
    text:
      - "От тебя ничего не утаишь."
      - "Значит, ты с самого начала знала, что так называемого «минерала с уникальными свойствами» вообще не существует?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Верно."
  - char: "commander"
    side: "left"
    text:
      - "Тогда что же это были за изменения, произошедшие с Советский Союз после того, как она прикоснулась к образцу минерала?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Обсервер просто сняла некоторые ограничения, которые сама же и установила, только и всего."
  - char: "commander"
    side: "left"
    text:
      - "А как насчет тех внезапных изменений Памяти Меркурия META во время боя?"
      - "Что вообще представляет из себя это явление, которое она назвала «Воссозданием»?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ты когда-нибудь задумывался над одним вопросом: почему МЕТА-морфоза одновременно с увеличением боевой мощи меняет еще и характер?"
      - "Откуда берется эта «информация»? Если найдешь ответ на этот вопрос, то и произошедшие с ней изменения будет нетрудно понять."
      - "Так называемая «Воссоздание»... это лишь особая стадия МЕТА-морфозы. Она нестабильна и очень опасна, и тебе пока не нужно знать о ней слишком много."
  - char: "commander"
    side: "left"
    text:
      - "...Когда Память Меркурия META выпустила ту черную ударную волну, меня в командном центре тоже задело."
      - "Затем я попал в белое пространство и встретил ту, что назвала себя совокупностью концепции Памяти Меркурия."
      - "...А еще я слышал звон колокольчиков."
      - "Я уже не в первый раз попадаю в это пространство, и звон колокольчиков тоже слышу не впервые."
      - "Ты знаешь, что всё это значит?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хм... меня тогда не задело, поэтому я не знаю, что именно ты там видел."
      - "Если представится возможность, давай сходим туда вместе~"
      - "В любом случае, солнечная активность усиливается, так что подобное происходит не в последний раз."
  - char: "commander"
    side: "left"
    text:
      - "Солнце... Саратога, кажется, тоже упоминала солнце."
      - "Что значит это усиление солнечной активности?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "На концептуальном уровне это означает «истончение», а «истончение» способствует возникновению «пересечений»."
      - "Это и опасность, и возможность. Сейчас я могу сказать тебе только это."
      - "Больше не расспрашивай об этом и не пытайся разузнать больше. Когда придет время, я всё тебе расскажу без утайки."
      - "А пока тебе лучше сосредоточиться на насущных проблемах."
      - "Помнишь последнее предупреждение Памяти Меркурия META? Это не просто пустые угрозы."
  - char: "commander"
    side: "left"
    text:
      - "Ты имеешь в виду... что Иерофант скоро нанесет новый удар?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Если прилив еще не отступил, о каком возвращении может идти речь?"
      - "Память Меркурия META упоминала о трех целях, и ты, вероятно, сорвал лишь одну из них."
      - "Ты не задумывался, что она планирует делать с двумя оставшимися?"
      - "Будь внимателен к своему окружению. Этот инцидент еще далеко не окончен."
