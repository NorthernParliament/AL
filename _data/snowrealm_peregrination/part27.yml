chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Кх... Надо же, вы всё еще можете двигаться..."
      - "Не ожидала, что моя атака не причинит вам ни малейшего вреда..."
      - "Как и ожидалось от полигона, сорвавшего один из Ее планов... вашу силу и потенциал... и правда нельзя недооценивать..."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Ты проиграла."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Похоже на то... Время «Воссоздания» тоже вышло..."
      - "В этой битве я проиграла."
      - "Впрочем, я совсем не расстроена. Я удовлетворена тем, что смогла пройти этот путь вместе с вами."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...И такой финал тебя удовлетворяет?"
      - "На самом деле, я всё это время размышляла над твоими словами и поступками на протяжении всего пути."
      - "Думаю... твоим изначальным замыслом было убедить меня... или же взять под контроль, чтобы заставить служить твоим целям."
      - "И, судя по тому, как ты вмешалась в наше восприятие, стоило нам только войти в воды Антарктики, у тебя определенно была на это сила."
      - "Но затем... аргументы, которыми ты пыталась меня убедить, оказались слабы и неубедительны, а вмешательство в восприятие ты сняла по собственной воле."
      - "А в последовавшем за этим бою ты и вовсе по собственной инициативе предоставила мне информацию о проекте «Рассвет»..."
      - "Твои слова противоречат твоим действиям."
      - "В конечном счете... какова твоя истинная цель? Ради чего вообще было всё это путешествие?"
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Может быть, мне просто хотелось с вами повидаться, а может, просто хотелось успокоить собственную душу..."
      - "А может, мне просто хотелось хоть на миг прикоснуться к теплу надежды... кто знает~"
      - "Однако эта победа еще не означает Ее поражения."
      - "Сражение еще далеко не окончено~"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Что ты хочешь этим сказать?"
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Помнишь о «трех целях»?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Ты и правда говорила, что у тебя здесь три цели..."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Тогда удачи в дальнейшем бою~ Если не соберетесь с силами, то и правда можете погибнуть."
      - "Впрочем..."
      - "Если в конечном итоге вам удастся пережить этот кризис и остаться в живых."
      - "Вы встретите ту, кто несет на себе бремя такого же трагичного прошлого, как и я, ту, кто так же опутана надеждами павших."
      - "У нас с ней фундаментальные разногласия... Если уж на то пошло, нас можно назвать «заклятыми врагами»."
      - "Но теперь мне совершенно ясно... ты сможешь ей помочь."
      - "Поэтому... я поручаю это дело тебе."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Назови хоть одну причину, почему я должна тебе помогать."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хм... Ранее я проявила снисхождение к тебе и твоим товарищам, я поделилась с тобой кучей информации, она тоже принадлежит к Северному Парламенту, она очень сильна в бою, ну и наконец — я очень милая."
      - "Уфу-фу, это перевыполнение плана по причинам на целых 400%, знаешь ли. Тебе этого достаточно~?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Хорошо, я обещаю выполнить твою просьбу."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Тогда боритесь изо всех сил."
      - "Ради будущего, о котором ты говоришь, ради Северного Парламента и ради России."
      - "Я буду и дальше наблюдать за вами издалека, а затем..."
      - "В любой момент буду готова воспользоваться вашей слабостью..."
