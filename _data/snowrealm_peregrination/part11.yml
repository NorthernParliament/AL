chapter1:
  rows:
  - text:
      - "Лифт продолжал плавно спускаться."
      - "Никто уже не знал, какой это по счету лифт, равно как они уже сбились со счета, сколько зон безопасности миновали."
      - "Среди них даже было несколько участков, где приходилось пересаживаться на подземные поезда."
      - "После всей этой череды пересадок они наконец добрались до своего первого пункта назначения — ну, или вроде того."
  - char: "svirepy"
    side: "left"
    text:
      - "Надо сказать, здесь всё слишком уж сложно устроено..."
      - "Разделение зон лифтами, многоуровневые проверки... всё это еще можно понять, но рельсовые поезда — это уже как-то чересчур, разве нет?.."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Тут всё просто~ Разумеется, базу не стали бы проектировать так, чтобы она шла строго вертикально вниз."
      - "Иначе можно было бы просто прорыть туннель от входа на поверхности прямиком вниз, и тогда вся эта хваленая многоуровневая система безопасности оказалась бы просто бесполезной декорацией."
      - "После нескольких пересадок на поездах ты уже и сама не можешь понять, как далеко мы сейчас находимся от того самого лифта на входе~"
  - char: "svirepy"
    side: "left"
    text:
      - "И правда... Я уже совершенно потеряла ориентацию."
  - char: "ognevoy"
    side: "right"
    text:
      - "Я впервые забралась так глубоко под землю..."
      - "Здесь всё так давит, я уже немного скучаю по бескрайнему небу..."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Не переживайте, всё, что вы видели по пути, — лишь малая часть этого бункера."
      - "Основная часть комплекса на самом деле расположена на самом нижнем уровне в огромном открытом пространстве."
  - char: "ognevoy"
    side: "right"
    text:
      - "...В огромном открытом пространстве?"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Говорят, что подо льдом толщиной в километр скрывается целый бескрайний океан~"
  - char: "ognevoy"
    side: "right"
    text:
      - "Подо льдом... есть океан?!"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Память Меркурия права."
      - "В прошлом существовала теория, что под льдами Антарктики скрыт океан — но пока её не подтвердили, она так и оставалась лишь теорией."
      - "Поначалу мы и сами сомневались, пока действительно не пробурили лед насквозь."
      - "В общем, когда мы доберемся до самого нижнего сектора «Кольцо», вы всё увидите сами."
      - "А пока нам всё же нужно разобраться с нашей первоочередной задачей."
      - "Впереди производственный цех. Выдвигаемся."

chapter2:
  rows:
  - text:
      - "тот миг, когда двери производственного цеха распахнулись, в лица всем ударил пронизывающий ледяной ветер."
  - char: "svirepy"
    side: "left"
    text:
      - "Как холодно!"
      - "Почему только здесь не включили отопление!"
  - char: "poltava"
    side: "right"
    text:
      - "Производственная линия всё ещё работает... Подумать только, в таком холоде здесь продолжается полностью автоматизированное производство."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "В конце концов, это бункер, построенный на случай конца света. Естественно, такая температура не может остановить его работу."
      - "Но... давайте всё же сначала включим освещение и отопление."

chapter3:
  rows:
  - text:
      - "Теплый свет зажигался ряд за рядом, и скрытое во тьме зрелище постепенно предстало перед всеобщим взором."
      - "Производственный блок RF-17-36 — таково официальное название этого сектора в «Кольце Мудрости»."
      - "Это один из сотен производственных блоков бункера, по своим размерам сопоставимый со стандартным заводом Конструкторского Бюро «Земля»."
      - "По первоначальному плану производственный блок RF-17-36 предназначался для выпуска продукции военного назначения, в частности — наземных транспортных средств для боевых действий в ледяных пустошах."
      - "Однако сейчас «предметы», которые непрерывным потоком сходили с конвейера и отправлялись на верхние уровни бункера, разительно отличались от первоначальных планов..."
  - char: "poltava"
    side: "left"
    text:
      - "Что здесь... во что перерабатывается?.."
      - "На входе лед и обломки породы..."
      - "А на выходе — те самые бледно-голубые кристаллы, которые мы искали?.."
  - char: "svirepy"
    side: "right"
    text:
      - "В голове не укладывается..."
      - "То есть... «зону таяния снегов» создал наш собственный объект... и «особый минерал» тоже производит наш собственный объект?.."
      - "И использует для этого... лед и куски породы?.."
      - "Как из такого мусора можно создать столь чистые кристаллы!"
      - "К тому же, кристаллы ведь действительно работают?!"
  - char: "ognevoy"
    side: "left"
    text:
      - "...Уж не алхимия ли это какая-то."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Система нашей производственной линии была перепрограммирована, что и привело к изменению технологического процесса."
      - "Но, к сожалению, данные уже удалены."
  - char: "poltava"
    side: "left"
    text:
      - "Удалены? Когда?.."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Судя по всему, после того как мы включили свет. В конце концов, это производственный блок низких температур... Включение отопления активировало процедуру аварийной остановки."
      - "А наш противник оказался достаточно хитер, чтобы настроить автоматическую очистку данных при остановке, оставив нас ни с чем."
  - text:
      - "Не успела она договорить, как грохот конвейера внезапно стих."
  - char: "poltava"
    side: "left"
    text:
      - "Пытается таким образом заставить нас почувствовать горечь упущенной возможности?.. Проклятье."
      - "Я всё ещё не в силах осознать то, что происходило на этой производственной линии..."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Я тоже не могу этого понять... но факт остается фактом."
      - "Так называемый минерал искусственно создается из этих двух совершенно обычных материалов."
      - "Как именно это делается и почему он обладает свойством резонанса — нам еще предстоит выяснить."
      - "Дальше мы отправляемся в центр обработки данных... Надеюсь, в этих данных найдутся нужные нам ответы."
