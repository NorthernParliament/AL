chapter1:
  rows:
  - text:
      - "Благодаря помощи от Хелены МЕТА, помехи, установленные Памятью Меркурия META в Антарктике, окончательно перестали действовать."
      - "Стабильные и безопасные каналы связи были восстановлены."
      - "По мере того как отдавались приказы, разрозненные силы в Антарктическом океане постепенно сливались воедино — Объединенный флот вновь был сформирован."
  - char: "commander"
    side: "left"
    text:
      - "Саратога даже вызвала флот Союза Орла, приписанный к Тихоокеанской зоне боевых действий."
      - "Они «совершенно случайно» выполняли задание в соседних водах."
      - "Совершенно случайно... Должно быть, это резерв, который она подготовила для себя заранее."
      - "Как и ожидалось от Саратоги, она даже из Энтерпрайз умудрилась выбить подкрепление..."

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "В данный момент планы эвакуации исследовательских станций всех крупных фракций осуществляются синхронно."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Станции Союза Орла и Королевского Флота находятся относительно далеко от поля боя, и на данный момент весь их персонал под конвоем покинул базу на кораблях."

chapter4:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Железная Кровь, согласно первоначальному плану, направляется к исследовательской станции Северного Парламента, после чего они проведут совместную эвакуацию."

chapter5:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Флоты, приписанные к каждой исследовательской станции, будут сопровождать их на всем пути и не примут участия в боевых действиях до завершения эвакуации."
      - "Согласно отчетам разведки, поступающим отовсюду, в данный момент в Антарктике не появилось «Божественного кокона», способного направить «сошествие» Иерофант, как это было на Всемирной выставке."
      - "Хотя армия Дироев изо всех сил пытается распространить белую субстанцию, её распространение идет медленно и не идет ни в какое сравнение с тем, что было в прошлый раз."
      - "Всё это подтверждало мое первоначальное предположение."
      - "Возможно, Память Меркурия META не разработала полноценный план трансформации, как это сделала Марко Поло, а просто творит произвол и сеет хаос по своему желанию..."
      - "В таком случае, если мы просто уничтожим её, это должно напрямую положить конец нынешнему кризису."
      - "Или, по крайней мере, гарантировать, что ситуация не станет еще хуже."

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "К счастью, Память Меркурия META по-прежнему уделяет огромное внимание флоту Северного Парламента."
      - "Из-за чего полностью отказалась от оценки окружающей обстановки."

chapter7:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Это дало нам возможность заманить её в заданный район для уничтожения."

chapter8:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "В данный момент группа Советский Союз отступает из «зоны таяния снегов» к заранее намеченному району боевых действий."

chapter9:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Союз Орла обеспечит поддержку с воздуха, чтобы отступление прошло более гладко."

chapter10:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Было бы еще лучше, если бы мы смогли разжечь в Памяти Меркурия META дух соперничества и заставить её саму прыгнуть в ловушку."
      - "По словам Союз, её эмоциональное состояние крайне нестабильно."

chapter11:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "В то же время передовой флот Железной Крови под командованием Брюнхильды, в состав которого входят два корабля-прототипа — Гинденбург и Феликс Шульц, уже прибыл в зону засады."

chapter12:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "В их числе линкоры Вашингтон, Норт Кэролайн, Колорадо, Мэриленд, Вест Вирджиния, а также авианосцы Саратога, Рейнджер и Индепенденс."
      - "А также десятки крейсеров и эсминцев..."

chapter13:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Кроме того, Антарктический флот Королевского Флота под командованием Имплакабл, флот подкрепления Железной Крови во главе с Принц Генрих..."

chapter14:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "А также резервный флот Саратоги — часть флота Тихого Океана под командованием Банкер Хилл — будут постепенно прибывать с этого направления."

chapter15:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Именно здесь состоится решающая битва."

chapter16:
  rows:
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "Слышишь меня, Советский Союз? Как у вас сейчас обстановка?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Повреждения в пределах нормы. Ожидаем прибытия в заданный район точно по графику."
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "Поддержка с воздуха уже в пути, обязательно продержитесь!"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Спасибо за поддержку, вот только... боюсь, урон Дироям от обычных авиаударов палубной авиации будет весьма ограниченным."
  - char: "saratoga_kai_rad"
    side: "right"
    text:
      - "Хм-хм~ А кто сказал, что на подмогу летят только палубные самолеты?"
      - "В этот раз я специально подготовила кое-что классное, так что ждите с нетерпением~!"
  - char: "brunhilde_rad"
    side: "left"
    text:
      - "Госпожа Союз, я также привела флот в готовность. Ждем только вашего прибытия."
  - char: "prinz_heinrich_rad"
    side: "right"
    text:
      - "Флот подкрепления мчится на полной — скорости!"
      - "Вжух-вжух~ Вжух-вжух~"
  - char: "bunker_hill_rad"
    side: "left"
    text:
      - "...Тихоокеанский флот Союза Орла, Банкер Хилл. Идём на полной скорости."
  - char: "implacable_rad"
    side: "right"
    text:
      - "Антарктический флот Королевского Флота прибудет в зону боевых действий в течение трех часов. Для меня большая честь сражаться плечом к плечу со всеми вами."
  - char: "ingraham_rad"
    side: "left"
    text:
      - "Говорит Ингрэм. Эвакуация персонала Союза Орла и Королевского Флота практически завершена. Я направляюсь на поле боя, чтобы поддержать вашу операцию."
  - char: "tallinn_rad"
    side: "right"
    text:
      - "Эвакуация  персонала Северного Парламента и Железной Крови всё еще продолжается. Я постараюсь закончить как можно скорее."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Поняла. Вы все отлично потрудились."
      - "Пусть каждая выполнит свой долг. Увидимся на месте решающей битвы."

chapter17:
  rows:
  - char: "poltava"
    side: "left"
    text:
      - "...Никогда бы не подумала, что Командир, находясь в Европе, сможет мобилизовать такие силы."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Верно, развитие ситуации уже давно превзошло все мои ожидания..."
      - "Но ведь именно за это мы так высоко ценим товарища Командира, не так ли?"
      - "...План по заманиванию Памяти Меркурия META в заданный район для её уничтожения мы берем на себя."
