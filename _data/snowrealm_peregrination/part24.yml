chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Под оглушительный грохот была уничтожена еще одна орудийная башня цели."
      - "Бой длился меньше получаса, а преимущество было уже полностью на нашей стороне."
  - char: "ognevoy"
    side: "left"
    text:
      - "Какая она слабая..."
      - "Подумать только, мы полностью подавили её нашей огневой мощью..."
  - char: "svirepy"
    side: "right"
    text:
      - "Разве это не доказывает, что мы очень сильны~"
  - char: "ognevoy"
    side: "left"
    text:
      - "Но... она ведь та, кто собирается вызвать пришествие «Царства Божьего», она не должна быть такой слабой."
  - char: "svirepy"
    side: "right"
    text:
      - "Вспомни, как всё было в прошлый раз в Средиземном море..."
  - char: "ognevoy"
    side: "left"
    text:
      - "Эм... в тот раз, помнится, всё закончилось одним выстрелом из секретного оружия Трибунала?.."
      - "...Э, вроде и правда так..."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "(Всё не так просто... Снаряды попадают в цель лишь потому, что она даже не пытается уворачиваться.)"
      - "(О таком самоубийственном стиле боя когда-то упоминалось в отчете Кронштадт...)"
      - "(О той безумице, которая не боится ранений и использует полученный урон для искажения чужого разума...)"
      - "(Неужели и в этот раз...)"
      - "Зачем ты заходишь так далеко ради своей одержимости прошлым?"
      - "Мы должны не оглядываться назад, закрываясь от всего мира, а уверенно шагать навстречу будущему."
      - "Что бы ни произошло в твоем прошлом, по крайней мере, ты выжила."
      - "А раз выжила, ты должна нести на себе надежды павших и продолжать их борьбу."
      - "Но что ты делаешь сейчас?"
      - "Растаптывая других, ты заодно растаптываешь и всё то, чем когда-то так дорожила."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ха-ха-ха-ха, одержимость? Думаешь, на всё это меня толкнула одержимость?"
      - "То, что превратило меня в это, и есть те самые надежды и идеалы павших, о которых ты говоришь!"
      - "Хе-хе... хе-хе-хе..."
      - "А-ха-ха-ха-ха-ха..."

chapter2:
  rows:
  - text:
      - "Этот смех, казалось, обладал какой-то пронзительной силой, разносясь по коммуникаторам всех присутствующих."
  - char: "ognevoy"
    side: "left"
    text:
      - "Ч-что... что происходит, смех звучит так, словно раздается прямо над ухом."
  - char: "svirepy"
    side: "right"
    text:
      - "Мне как-то холодно... Температура вокруг упала?"
  - char: "poltava"
    side: "left"
    text:
      - "Товарищ Союз, похоже, раны врага затягиваются."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Нет, нельзя давать ей время на восстановление!"
  - text:
      - "БАБАХ!!!"
      - "Советский Союз ответила безумно хохочущей вдалеке девушке артиллерийским залпом."
      - "Но на этот раз снаряды замерзли прямо в воздухе, а затем рухнули в воду."
      - "Затем, начиная от места падения снарядов, поверхность моря начала стремительно замерзать."
      - "В одно мгновение все оказались в ловушке во льдах, потеряв возможность двигаться."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Как я и думала, ты намеренно позволила нам тяжело ранить себя."
      - "...Всё ради этого момента?"
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-purple"
    text:
      - "...Хе-хе, только так я смогла прикоснуться к крупице этой «Сути»..."
      - "Познав Суть, я смогу найти настоящее... прошлое."
      - "Хе-хе... Раньше мои знания о Революционном фронте ограничивались лишь жалкими крохами информации, которые Она мне дала."
      - "Но теперь... всё это ощущается так, словно я сама пережила это."
      - "Хе-хе... Я увидела это в осколках... Вот, значит, как."
      - "Тот комплекс, уходящий глубоко под лед, — это не просто какой-то там бункер Судного дня."
      - "Вы пытаетесь воссоздать некое устройство, следуя восстановленным данным Революционного фронта."
      - "И это истинная причина, по которой ты решила построить этот комплекс в Антарктике, не так ли?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "......"
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-purple"
    text:
      - "А-ха-ха-ха-ха... Как же это иронично."
      - "Говоришь, мои действия продиктованы одержимостью? А как по мне, так это ваши действия продиктованы одержимостью."
      - "Проект «Рассвет» — вот самая великая одержимость!"
      - "Этот проект, который вы считаете лучом надежды... всего лишь адский экспресс, везущий вас прямиком к смерти."
      - "Даже просто приблизившись к нему, вы обрекаете себя на несчастье."
      - "Знаешь, какая участь постигла тех, кто был связан с этим проектом?"
      - "Ничего страшного, если не знаешь, я тебе расскажу."
      - "Инициатор проекта пропал без вести вместе с флотом еще на этапе испытаний экспериментальной установки."
      - "После этого проект заморозили, и постепенно он превратился в придаток другого плана."
      - "Вплоть до того дня, когда он был запущен... Весь наш флот, вместе с нашим последним адмиралом, был принесен в жертву. Не выжил никто."
      - "...Сражались, пока свет не померк."
      - "Они выбрали смерть, оставив шанс на жизнь другим."
      - "Вот что такое проект «Рассвет», вот в чем заключается его наследие."
      - "Теперь этот проект оказался в ваших руках. Неужели вы тоже хотите поступить так же?"
      - "...Эгоистично пожертвовать собой, а затем заставить живых нести ваше бремя."
      - "Посмотри на Антиох, посмотри на Пепел... Все они движимы желаниями павших, барахтаясь в бурном потоке судьбы."
      - "И во что они теперь превратились?"
      - "Этот порочный круг, ведущий лишь к трагедиям... пора разорвать."
      - "Раз уж есть возможность сбежать, почему бы просто не сделать этого?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "...Твое так называемое бегство — это всего лишь передача контроля над своей судьбой в руки других людей, других Сирен."
      - "Ты тоже родом с полигона Сирен. Когда они контролировали тебя, ты наверняка пыталась давать им отпор."
      - "А теперь добровольно склоняешь перед Сиренами голову. Разве это не смешно?"
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Антиохи тоже бывает разным."
      - "Точно так же, как мы не должны судить об окружающих фразами вроде «люди есть люди», к Антиоху тоже следует подходить избирательно."
      - "Эти глупые исследовательские группы действительно подлежат зачистке вместе со своими тестами, но Арбитры — совсем другое дело."
      - "Они очень интересные... в особенности Она — она интереснее всех."
      - "Мы с Ней не госпожа и слуга, мы — партнеры."
      - "Мы признаем друг друга, и в то же время мы вместе ищем ответы."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "«Бегство» — вот ответ, к которому вы пришли?"
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Это всяко лучше, чем добровольно шагнуть в неизвестность — поступок глупый и самоубийственный."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Смелость шагнуть в неизвестность, стремление исследовать новое — это драгоценный дух человечества, причина, по которой люди смогли выжить и эволюционировать до сегодняшнего дня."
      - "Это не глупость и не самоубийство."
      - "Безусловно, исследования не всегда бывают успешными. Но даже в случае неудачи, извлеченный урок может стать фундаментом для успеха будущих поколений."
      - "Точно так же, как создатели проекта «Рассвет» в конечном итоге потерпели неудачу, но сам проект всё же дошел до наших рук."
      - "Мы доработаем этот проект и исправим его конструктивные недостатки."
      - "И даже если мы в конце концов тоже потерпим неудачу, придут другие, кто перешагнет через наши тела и продолжит идти вперед."
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Всё еще твердишь об этом..."
      - "Эта спираль не будет виться бесконечно."
      - "Ваше будущее уже предопределено, и я уже видела его за вас."
      - "В том будущем нет ни крупицы прекрасного."
      - "Прекрасное существует только в прошлом!"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Мы проложим путь в наше будущее своими собственными руками!"
      - "У тебя нет права вершить судьбу нашего будущего!"

chapter3:
  rows:
  - text:
      - "В то же время я использовал зашифрованный канал связи в здании Трибунала."
  - char: "commander"
    side: "left"
    text:
      - "...Хелена."
      - "То, что она только что сказала о проекте «Рассвет»... это правда?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Это лишь воспоминания, которые она увидела, всего лишь одна из версий реальности."
      - "Но реальность не всегда равнозначна истине."
      - "Только та реальность, в которую безоговорочно верят, становится истиной... Сейчас я могу сказать только это."
  - char: "commander"
    side: "left"
    text:
      - "«Только та реальность, в которую безоговорочно верят, становится истиной»..."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ладно, разве сейчас время ломать голову над этими загадками?"
      - "Возвращайся скорее и сосредоточься на командовании боем, исход сражения еще далеко не предрешен."
  - char: "commander"
    side: "left"
    text:
      - "Насчет этого... сейчас на поле боя сложилась весьма непростая ситуация."
      - "Ты ведь когда-то использовала силу какой-то Бошни, чтобы изменить погодные условия на поле боя, верно?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я знаю, к чему ты клонишь."
      - "Однако... во-первых, я задействовала силу «Башни»."
      - "Во-вторых, то, что ты видишь сейчас — лишь фокус. Лед на поверхности моря на самом деле совсем тонкий."
      - "Она не стала такой сильной, как ты себе вообразил, это просто пустая бравада."
      - "Чтобы справиться с этой ситуацией, собранных тобой сил хватит с лихвой."
      - "Отбрось сомнения и продолжай бой, Командир~"
