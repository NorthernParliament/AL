chapter1:
  rows:
  - text:
      - "Благодаря системе управления боем созданной Хеленой МЕТА, даже находясь за тысячи миль, можно было четко видеть все изменения на поле битвы."
      - "Как она и предполагала, столь тонкий слой льда нельзя было назвать даже препятствием."
      - "Пробив лед несколькими залпами, группа быстро перестроила боевые порядки."
      - "Как и говорила Хелена, хотя боевая мощь преобразившейся Памяти Меркурия META и возросла, она всё еще находилась где-то между Шарнхорст МЕТА и Хирю МЕТА."
      - "Хоть справиться с ней было и непросто, ей всё еще было бесконечно далеко до «божества» из «Царства Божьего»."
      - "В этот момент под скоординированными ударами различных флотов обратный отсчет до победы продолжал медленно, но неуклонно приближаться к нулю."
  - char: "commander"
    side: "left"
    text:
      - "(...Но неужели всё и правда будет так просто?)"
      - "(Не покидает чувство... что здесь что-то не так...)"

chapter2:
  rows:
  - char: "pamiat_merkuria_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хе-хе... хе-хе-хе..."
      - "А-ха-ха-ха-ха-ха..."

chapter3:
  rows:
  - text:
      - "Тот смех, что недавно отдавался в ушах, не шёл у меня из головы."
      - "Платформу связи для этой операции предоставила Хелена МЕТА, и ни Сирены, ни прежняя Память Меркурия META не смогли бы вмешаться в её работу."
      - "Однако всего мгновение назад её с легкостью взломали..."
  - char: "commander"
    side: "left"
    text:
      - "(Если теперь она обладает подобными способностями... значит, у неё есть способ парализовать нашу сеть командования.)"
      - "(Нужно быть начеку.)"
  - char: "communicator"
    side: "right"
    text:
      - "Ш-ш... ш-ш-ш..."
  - text:
      - "Хоть и слабый, но слух всё же уловил промелькнувший в канале связи шум."
  - char: "commander"
    side: "left"
    text:
      - "...Как я и думал, она начала попытки заглушить связь."
      - "(Нужно как можно скорее связаться с Хеленой, чтобы противостоять взлому...)"

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Свет... мигнул?"
  - char: "memphis"
    side: "right"
    text:
      - "Как странно... мои приборы начали сбоить."
      - "Мисс Альжери, не могли бы вы помочь выяснить причину неполадки?"
  - char: "algerie"
    side: "left"
    text:
      - "Хм? Оборудование здесь проверяют каждый день, никаких неполадок быть не должно..."

chapter5:
  rows:
  - char: "helena"
    side: "left"
    text:
      - "Смотрите... от оборудования исходит какая-то черная дымка?"
  - char: "clemenceau"
    side: "right"
    text:
      - "...Черная дымка?"
      - "Плохо дело, всем немедленно отойти от этого черного дыма!"
      - "Альжери, нас атакуют."
      - "Немедленно подними тревогу и заблокируй здание!"
  - char: "algerie"
    side: "left"
    text:
      - "Есть!"

chapter6:
  rows:
  - text:
      - "Под вой сирен персонал командного центра начал эвакуацию под руководством Клемансо."
      - "Тем временем черная дымка становилась всё гуще, бесконтрольно расползаясь по комнате."
  - char: "commander"
    side: "left"
    text:
      - "(...Без сомнений, это и правда какая-то атака.)"
      - "(Но мы ведь находимся за тысячи миль от поля боя... как ей вообще это удалось?..)"
  - text:
      - "В глазах начало постепенно темнеть."

chapter7:
  rows:
  - text:
      - "Сквозь затуманенное сознание я смутно уловил... звон колокольчиков."

chapter8:
  rows:
  - text:
      - "В белом пространстве безмолвно возвышалась одинокая дверь."
  - char: "commander"
    side: "left"
    text:
      - "...Это то самое место, куда я уже попадал вместе с Анкоридж."
      - "И во время противостояния с Иерофант я тоже был здесь..."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Товарищ Командир?!"
      - "Это ты там, товарищ Командир?!"
  - char: "commander"
    side: "left"
    text:
      - "Ты..."

chapter9:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Советский Союз, завершившая модернизацию оснастки?"

chapter10:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Советский Союз, сражающаяся в Антарктике?"

chapter11:
  rows:
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Верно, это я! Похоже, ты и правда товарищ Командир!"
      - "Но... что вообще происходит?"
      - "Разве мы не находимся за тысячи миль друг от друга? Как мы могли одновременно оказаться здесь?"
  - char: "commander"
    side: "left"
    text:
      - "Прежде чем попасть сюда, ты столкнулась с чем-нибудь необычным?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Черная ударная волна."
      - "Враг внезапно выпустил невероятную черную ударную волну, которая разбила наш строй и заодно парализовала нашу сеть связи."
  - char: "commander"
    side: "left"
    text:
      - "...Прямо как в командном центре. Там я тоже подвергся некой атаке, связанной с черной дымкой."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...А затем мы вместе очутились здесь."
      - "Это результат той атаки?"
  - char: "commander"
    side: "left"
    text:
      - "Скорее всего, нет. Ты впервые в этом пространстве?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Эм... на самом деле нет."
      - "Я уже бывала в этом белом пространстве, когда только прибыла в Антарктику и прикоснулась к образцу минерала."
      - "А затем за дверью я увидела нечто... чего не смогла понять."
      - "Товарищ Командир тоже здесь не впервые?"
  - char: "commander"
    side: "left"
    text:
      - "Да. Кажется, это место как-то связано с сетью Кубов Мудрости."
      - "Видения, появляющиеся за этой дверью — это хранящиеся здесь фрагменты информации."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "...Фрагменты информации? То есть те видения — это то, что происходило на самом деле?.."
  - char: "commander"
    side: "left"
    text:
      - "События, которые действительно происходили в «каком-то из миров»."
      - "Но для нас это лишь одна из вероятностей."
      - "В конце концов, у нас есть наша собственная реальность, наше прошлое."
      - "А также — наше будущее."
  - char: "commander"
    side: "right"
    text:
      - "Ты прав, товарищ Командир."
      - "А теперь давай вместе поищем способ выбраться отсюда."
  - char: "commander"
    side: "left"
    text:
      - "С этим можно не торопиться. Это место подобно сновидению, и время здесь течет не так, как в реальном мире."
      - "Раз уж мы оказались здесь, нельзя возвращаться с пустыми руками."
      - "Давай вместе заглянем за эту дверь."
