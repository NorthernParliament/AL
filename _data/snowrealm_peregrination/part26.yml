chapter1:
  rows:
  - text:
      - "Вместе с Советский Союз мы открыли стоящую перед нами дверь."
      - "Нашему взору предстал великолепный дворец."

chapter2:
  rows:
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Ля-ля-ля~♪"
      - "Фуа-гра~ Оленина~ Рябчики♪~"
      - "Трюфели~ Ягоды~ Суфле♪~"
  - char: "sevastopol"
    side: "right"
    text:
      - "Би-бип, Память Меркурия, мы вернулись~"
  - char: "gangut"
    side: "left"
    text:
      - "Ого... как вкусно пахнет."
  - char: "avrora"
    side: "right"
    text:
      - "Ты хорошо потрудилась, Память Меркурия, давай мы поможем тебе всё приготовить."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Э~ Не нужно, я уже почти закончила."
      - "Но мне и правда кое в чем нужна ваша помощь."
      - "Я еще не подобрала подходящее вино, не могли бы вы спуститься в винный погреб и посмотреть?"
  - char: "gangut"
    side: "right"
    text:
      - "...Ты боишься не найти вино в Летнем дворце?"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Я же сказала — «подходящее»~"
      - "Сегодня я приготовила кое-какие блюда кухни Ирис, поэтому подумала, что нам стоит немного сменить вкусы."
  - char: "gangut"
    side: "right"
    text:
      - "Лишь бы можно было пить, а остальное — без разницы."
  - char: "sevastopol"
    side: "left"
    text:
      - "Еще как есть разница!..."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Верно, разница огромная~"
      - "Тогда, Севастополь, качество нашего ужина я доверяю тебе~"

chapter3:
  rows:
  - text:
      - "Мы открыли еще одну дверь."
      - "Перед нашими глазами предстала прекрасная степь."

chapter4:
  rows:
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Аврора, ты хорошо потрудилась на задании."
      - "Раз уж ты вернулась, очисти разум и как следует отдохни~"
  - char: "avrora"
    side: "right"
    text:
      - "Фух... Воздух здесь и правда чудесный."
      - "Но для того, кто только что вернулся из долгого путешествия, долгая поездка верхом — не самый подходящий вариант для отдыха."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Хе-хе~ Мы приехали сюда только потому, что здесь никого нет, так мне будет удобнее показать тебе сюрприз~"
  - char: "avrora"
    side: "right"
    text:
      - "...Сюрприз?"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Смотри, что это..."

chapter5:
  rows:
  - char: "pamiat_merkuria_kai_retr"
    side: "left"
    text:
      - "Та-дам!~"
  - char: "avrora"
    side: "right"
    text:
      - "...Модернизация? Эта технология уже доведена до ума?!"
  - char: "pamiat_merkuria_kai_retr"
    side: "left"
    text:
      - "Настоящая, без обмана, самая что ни на есть реальная~"
      - "Как видишь, я — первая, кто прошел модернизацию!"
      - "Уфу-фу~ Здорово, правда~ Здорово ведь~ Круто же!"

chapter6:
  rows:
  - text:
      - "Мы открыли третью дверь."
      - "Нашему взору предстало пылающее море."

chapter7:
  rows:
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Гангут... Севастополь..."
      - "Почему... вас больше нет..."
      - "Почему... выжила только я..."
      - "Почему... вы оставили меня в живых..."
  - text:
      - "Голос девушки уже охрип, а слезы высохли."
      - "Позади нее в ревущем пламени медленно исчезало знамя с двуглавым орлом."
      - "Всё было кончено."

chapter8:
  rows:
  - text:
      - "Мы открыли четвертую дверь."
      - "Нашему взору предстала безмятежная гладь воды."

chapter9:
  rows:
  - text:
      - "В свете луны здесь безмолвно нес дозор одинокий  корабль."
      - "На этот раз я не смог её узнать."
      - "Но я уловил искру тепла, проблеск утешения, а также бесконечный холод и одиночество."

chapter10:
  rows:
  - text:
      - "Затем была пятая дверь."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "То, что мы только что видели... это прошлое Памяти Меркурия META?.."
  - char: "commander"
    side: "right"
    text:
      - "...Похоже на то."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Тогда что же это было за видение за четвертой дверью?.."
  - char: "commander"
    side: "right"
    text:
      - "Я тоже не знаю..."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Мы продолжим смотреть дальше, товарищ Командир?"
  - char: "commander"
    side: "right"
    text:
      - "Продолжим... У меня предчувствие, что это последняя дверь."
      - "Мы вот-вот приблизимся к некой истине."

chapter11:
  rows:
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Т-товарищ Командир... неужели это?.."
  - char: "commander"
    side: "right"
    text:
      - "...Верно. Антарктика под покровом ночи."
  - text:
      - "Зрелище за пятой дверью оказалось неожиданным."
      - "На этот раз мы не попали ни в чьи воспоминания, а очутились прямо на месте Антарктического сражения."
      - "В центре поля боя находилась Память Меркурия  META, окутанная черной дымкой."
      - "А вокруг были разбросаны бесчисленные знакомые силуэты."
      - "Однако всё это застыло в одном мгновении."
      - "Мы парили в воздухе, словно наблюдатели свысока."
  - char: "pamiat_merkuria_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "Вы видите то, что происходит прямо сейчас, поэтому всё и застыло."
  - char: "commander"
    side: "left"
    text:
      - "Ты... та самая, что сейчас находится в центре поля боя?"
  - char: "pamiat_merkuria"
    side: "right"
    status: "is-lightgray"
    text:
      - "Конечно же нет."
  - char: "pamiat_merkuria_kai"
    side: "right"
    status: "is-lightgray"
    text:
      - "Я — «Память Меркурия», но я не она. И я не та Память Меркурия, которую вы уже знаете или которую вам еще предстоит узнать."
  - char: "pamiat_merkuria_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "Это они все вместе оказали на меня влияние и в конечном счете сформировали «меня»."
      - "Так вам понятно?"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Ты... совокупность концепции «Памяти Меркурия»?"
  - char: "pamiat_merkuria_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "Верно, как и ожидалось от тех, кто смог попасть сюда. Вы очень умны."
      - "Правда, я родилась совсем недавно, поэтому я еще не завершена."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Память Меркурия как кансен существует уже давно, почему же «ты» родилась совсем недавно?"
  - char: "pamiat_merkuria"
    side: "right"
    status: "is-lightgray"
    text:
      - "Разве время имеет значение?"
      - "Для рождения требуются определенные условия, это не то, что происходит просто само по себе."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Мне вот теперь любопытно: что произойдет, если мы одолеем тебя прямо здесь?"
  - char: "pamiat_merkuria_kai"
    side: "right"
    status: "is-lightgray"
    text:
      - "Хм... честно говоря, мне и самой интересно."
      - "Но, к сожалению, вам меня здесь не одолеть, как и мне не одолеть вас."
      - "Таковы здешние правила."
  - char: "pamiat_merkuria_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "Впрочем, вам не стоит слишком беспокоиться о битве."
      - "Вы и сами прекрасно видите ситуацию внизу."
      - "Вы загнали её в угол, до победы остался всего один шаг."
      - "Точнее говоря, как только вы вернетесь, то сразу же одержите победу."
      - "Так что можете пока не переживать о том, что там происходит."
      - "Как насчет того, чтобы для начала просто поболтать?"
      - "Наверняка у вас накопилось ко мне немало вопросов, да и мне хочется кое о чем вас спросить."
  - char: "commander"
    side: "left"
    text:
      - "Прежде чем переходить к дружеской беседе, мы должны прояснить один ключевой вопрос."
      - "Ты наш враг?"
  - char: "pamiat_merkuria"
    side: "right"
    status: "is-lightgray"
    text:
      - "Строго говоря, в том конфликте, в котором вы сегодня участвуете, я не занимаю ничью сторону."
      - "А что касается того, что будет после сегодняшнего дня~ У меня действительно есть кое-какие свои планы и замыслы."
      - "Если нам по пути — мы союзники, если будете мешать — враги. Наверное, как-то так?"
      - "А ты, кто ты такой?"
  - char: "commander"
    side: "left"
    text:
      - "...Я? Я Командир Лазурного пути."
  - char: "pamiat_merkuria_kai"
    side: "right"
    status: "is-lightgray"
    text:
      - "Ой~ Я, конечно же, знаю, что сейчас ты Командир Лазурного пути."
      - "Я спрашиваю не о твоей нынешней должности, а о том, кто ты такой на самом деле?"
      - "У меня такое чувство, будто мы знакомы... но я никак не могу вспомнить."
  - char: "pamiat_merkuria_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "Как видишь, хотя сейчас я еще не завершена, я по-прежнему «Память Меркурия»."
      - "То, что такая, как я, может чего-то «не вспомнить», само по себе весьма невероятно, не так ли?"
      - "Судя по твоему нынешнему состоянию, ты, скорее всего, и сам этого не знаешь."
      - "Но как тогда такой, как ты... смог попасть сюда?"
      - "Заранее предупреждаю: это не я перенесла тебя сюда, у меня пока нет таких способностей."
  - char: "commander"
    side: "left"
    text:
      - "...Не ты? Но я точно помню, что после того, как меня окутал черный туман..."
      - "...Подожди, звон  колокольчиков?"
  - char: "pamiat_merkuria_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "Что ты сказал... какой еще звон колокольчиков?"
  - char: "commander"
    side: "left"
    text:
      - "Это..."

chapter12:
  rows:
  - text:
      - "В ушах раздался звон ветряных колокольчиков."
  - char: "commander"
    side: "left"
    text:
      - "Подожди... мой вопрос еще..."

chapter13:
  rows:
  - text:
      - "Сознание уже вернулось, но перед глазами всё ещё маячил ослепительный белый свет..."
  - char: "commander"
    side: "left"
    text:
      - "(Погодите-ка... позади этого белого света виднеется какой-то провод...)"
      - "(Сейчас это уже не белая иллюзия, а просто слепящая лампа?..)"

chapter14:
  rows:
  - char: "memphis"
    side: "right"
    text:
      - "Командир, ты наконец-то очнулся!"
  - char: "vestal"
    side: "left"
    text:
      - "Какое облегчение... Все показатели были в норме, но ты никак не приходил в себя."
      - "Как ты себя чувствуешь сейчас, есть какой-нибудь дискомфорт?"
  - char: "commander"
    side: "right"
    text:
      - "(В этот раз... я действительно потерял сознание?..)"
      - "...Где мы?"
  - char: "helena"
    side: "left"
    text:
      - "В медпункте здания Трибунала."
  - char: "commander"
    side: "right"
    text:
      - "...Как долго я был без сознания?"
  - char: "memphis"
    side: "left"
    text:
      - "Целых полчаса!"
  - char: "commander"
    side: "right"
    text:
      - "Слава богу... не так уж и долго."
  - char: "memphis"
    side: "left"
    text:
      - "Командир... пожалуйста, не шути так!"
  - char: "clemenceau"
    side: "right"
    text:
      - "Раз у тебя еще есть силы шутить, значит, ничего серьезного."
  - char: "commander"
    side: "left"
    text:
      - "Клемансо, как обстановка в командном центре?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Не о чем волноваться, я уже взяла ситуацию под контроль."
  - char: "commander"
    side: "left"
    text:
      - "А что с боем на передовой в Антарктике?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Там тоже всё благополучно завершилось~ Кстати, у меня тут сообщение для тебя от Советский Союз."
  - char: "commander"
    side: "left"
    text:
      - "...По открытому каналу?"
  - char: "clemenceau"
    side: "right"
    text:
      - "На личный терминал~ Держи. И заранее говорю: в этот раз я его правда не читала."

chapter15:
  rows:
  - char: "sovetsky_soyuz_rad"
    side: "left"
    text:
      - "Товарищ Командир, мы победили."
      - "Только благодаря твоей координации, поддержке и командованию на Антарктическом континенте не произошло худшего."
      - "Лишь благодаря этому в нашем походе мы смогли избежать беды."
      - "И я смогла вновь увидеть, как все фракции, сплотившись в едином порыве, сражаются с общим врагом."
      - "От лица Верховного Совета я выражаю тебе самую искреннюю благодарность."
      - "Что бы ни случилось в будущем, какой бы выбор ты ни сделал."
      - "Ты навсегда останешься другом Северного Парламента, и мы будем твердо стоять на твоей стороне."
      - "С нетерпением жду нашей новой встречи на банкете в честь победы..."

chapter16:
  rows:
  - text:
      - "С поражением Памяти Меркурия META эта битва, управляемая за тысячи миль от поля боя, увенчалась окончательной победой."
      - "Таким образом, как и сказала Советский Союз, Антарктический континент избежал наихудшего сценария."
      - "Однако загадки, окружавшие этот инцидент, не исчезли вместе с победой."
      - "Обсервер, отключившаяся от Мейнфрейма, белое пространство, полное записей, обладающая сознанием совокупность концепций..."
      - "А еще тот внезапный звон колокольчиков и истинные замыслы Хелены МЕТА..."
      - "Вопросов, на которые у меня нет ответов, всё еще целая гора..."
      - "Кажется, эта ночь... снова будет бессонной..."
