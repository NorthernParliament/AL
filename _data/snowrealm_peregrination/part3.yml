chapter1:
  rows:
  - text:
      - "Вскоре Память Меркурия принесла дюжину напитков к столу, за которым все ждали."
  - char: "ognevoy"
    side: "left"
    text:
      - "Спасибо~"
  - char: "svirepy"
    side: "right"
    text:
      - "Э-э... Почему сок?"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Естественно. Если мы сейчас напьемся, будет не очень хорошо, правда?"
  - char: "poltava"
    side: "right"
    text:
      - "Верно, мы уже раскрыли свое местоположение, самое время повысить бдительность. Молодец, Память Меркурия."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Хе-хе~ Так что там насчет вопроса Свирепой? Союз, расскажи, пожалуйста, нам всем~"
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Хм... Чтобы ответить на этот вопрос, нужно разделить его на несколько этапов."
  - text:
      - "Советский Союз сделала глоток сока из своего стакана, её мысли, казалось, унеслись куда-то вдаль."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Много лет назад, когда Лазурный путь еще не раскололся, фракции обсуждали вопрос о принадлежности Антарктики."
      - "После затяжных конференций фракции наконец пришли к согласию и вместе подписали «Антарктический договор», который вступил в силу в следующем году."
      - "После вступления договора в силу все заявления о суверенитете и территориальные претензии на Антарктику были немедленно заморожены."
      - "В то же время договор постановил, что антарктическая зона боевых действий не подчиняется ни одному из штабов, а находится в прямом ведении командования Лазурного пути."
      - "Фракциям разрешалось размещать в Антарктике научно-исследовательские станции или необходимые военные базы для войны с Сиренами только после получения разрешения от командования."
      - "Согласно условиям договора, антарктическая зона боевых действий имела особый, независимый статус по сравнению с восемью основными зонами, находившимися в ведении региональных командований."
      - "Разумеется, после отделения Багровой Оси и соответствующих корректировок число региональных командований сократилось до семи."
      - "В этом регионе командование Лазурного пути при любых обстоятельствах обладало властью выше, чем правительства фракций и региональные командования."
      - "Оно могло свободно распоряжаться любыми военными силами в антарктической зоне боевых действий и вмешиваться в любые проводимые там военные операции."
  - char: "svirepy"
    side: "left"
    text:
      - "При любых обстоятельствах... Независимо от того, идет ли война против Сирен?.."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Верно."
  - char: "svirepy"
    side: "left"
    text:
      - "То есть... если товарищ Командир прибудет в Антарктику, его власть будет безграничной?.."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Насчет безграничной власти — это, конечно, преувеличение, однако ситуация в антарктической зоне боевых действий действительно отличается от других зон."
      - "Если бы Командир прибыл сюда, он и правда получил бы здесь гораздо больше автономии."
      - "Но как далеко это может зайти, сказать сложно."
      - "В конце концов, в антарктической зоне не то что крупных военных кампаний, здесь ни разу не случалось даже масштабных столкновений."
      - "Так что всё это больше похоже на результат компромисса, к которому фракции пришли в ходе политических игр."
      - "В то время, под натиском Сирен, прибрежные линии обороны всех стран оказались под угрозой, и стратегическая ценность безжизненного антарктического континента была практически равна нулю."
      - "А если добавить к этому данное правило, вполне логично, что все фракции отложили вопрос Антарктики в долгий ящик."
      - "...Однако всё изменилось после раскола Лазурного пути."
      - "Поскольку Антарктический договор больше не имел силы для фракций, присоединившихся к Багровой Оси, Железная Кровь первой сделала шаг к установлению контроля над континентом."
      - "Опираясь на свою технологическую мощь, которая в то время казалась миру развивающейся «семимильными шагами», они первыми построили военную крепость на этой земле."
      - "Ввиду этих обстоятельств, с разрешения командования, Союз Орла вскоре последовал их примеру, возведя свою военную крепость в Антарктике и отправив туда постоянный флот."
      - "Мы, Королевский Флот и Ирис, по правде говоря, имели схожие планы... Однако, прежде чем мы успели воплотить их в жизнь, разразилась полномасштабная война с Багровой Осью."
      - "Вслед за этим Ирис потерпел поражение и раскололся, навсегда утратив связь с Антарктикой."
      - "Королевский Флот же, стянув свои силы, отказался от идеи содержания военной крепости в Антарктике и отвел свой флот обратно в штаб в Сиднее."
      - "Мы тоже отказались от планов по превращению нашей исследовательской станции в крепость и вновь обратили взоры на столь близкий нам полюс."
      - "После этого между Железной Кровью и Союзом Орла в Антарктике и правда произошло несколько эпизодических стычек, но на этом всё и закончилось."
      - "В конце концов, в то время происходящее на этом континенте было не так уж и важно."
      - "И вот теперь антарктический вопрос перешел в свою третью стадию."
      - "Как вы знаете, Лазурный путь и Багровая Ось достигли соглашения о полном прекращении огня."
      - "Представители обеих сторон в данный момент ведут переговоры об «объединении альянсов» в залах заседаний в столице Ирис."
      - "Одно из условий «объединения альянсов» гласит, что фракции Багровой Оси должны вновь присоединиться ко всем договорам и соглашениям, которые были подписаны до раскола Лазурного пути и действуют по сей день."
      - "В их число, естественно, входит и «Антарктический договор»."
      - "Независимо от того, чем завершится это «объединение альянсов», по крайней мере сейчас, пока у сторон есть желание вести переговоры, расстановка сил в Антарктике не изменится."
      - "То есть, в настоящее время исследовательскими станциями в Антарктике располагают только четыре фракции: Союз Орла, Королевский Флот, Северный Парламент и Железная Кровь."
      - "И лишь Союз Орла и Железная Кровь имеют постройки уровня военных крепостей."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "К слову, наша исследовательская станция была построена так быстро только благодаря соглашению о сотрудничестве с Железной Кровью~"
  - char: "svirepy"
    side: "right"
    text:
      - "...Что, неужели благодаря сотрудничеству с Железной Кровью?!"
  - char: "poltava"
    side: "left"
    text:
      - "Об этом даже я не особо в курсе..."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Память Меркурия права, наша исследовательская станция и правда результат сотрудничества с Железной Кровью."
      - "Об этом мало кто знает, но это и не какая-то великая тайна."
      - "В то время и мы, и Железная Кровь уже знали о существовании сценария Сирен."
      - "Наши с Фридрих стремления совпадали, мы решили разрушить этот миропорядок, выстроенный Сиренами, и именно тогда была согласована целая серия совместных проектов."
      - "И среди них — строительство нашей собственной исследовательской станции в Антарктике."
      - "Война с Сиренами рано или поздно подойдет к концу."
      - "А в этом мире для нас еще слишком много неизведанного."
      - "В будущем нас ждет еще так много возможностей для исследований."
      - "Если мы окончательно превратим нашу цивилизацию и общество в ревущую военную машину..."
      - "То куда эта машина направится после окончания войны?"
      - "Именно поэтому фракции, даже в военное время, продолжают поддерживать работу исследовательских станций."
  - char: "poltava"
    side: "left"
    text:
      - "Вот как... Это и правда очень мудрое решение."
  - char: "svirepy"
    side: "right"
    text:
      - "Кажется, я всё поняла!"
      - "То есть, поскольку в Антарктике почти нет людей, она не привлекала атаки Сирен."
      - "А поскольку атак Сирен не было, то и внимания ей уделяли всё меньше."
      - "А когда кто-то наконец захотел обратить на неё внимание, условия того времени этого уже не позволили."
      - "Когда же условия наконец позволили, этого не позволила сама обстановка..."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Верно, очень точный вывод~"
  - char: "svirepy"
    side: "right"
    text:
      - "Хе-хе, ну это же я~"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Однако, хоть в Антарктике и нет людей, там полно милых зверушек~"
      - "Теперь моя очередь быть учителем~ Давайте-ка я вас проверю. Знаете ли вы, какие милые животные обитают на южном полюсе?"
  - char: "ognevoy"
    side: "right"
    text:
      - "Я знаю, пингвины!"
      - "Они такие пухленькие и кругленькие, ну просто прелесть~"
      - "Когда мы чуть позже сойдем на берег, мы сможем увидеть пингвинов?"
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Сможем, наша исследовательская станция находится недалеко от места их обитания."
  - char: "ognevoy"
    side: "right"
    text:
      - "Здорово~ Хе-хе... М-м? Свирепый, о чем ты думаешь? Чего ты так жутко улыбаешься..."
  - char: "svirepy"
    side: "left"
    text:
      - "Я думаю... Пингвины кругленькие, в них много жирка, наверное, если пустить их на шашлык, будет очень вкусно..."
      - "А еще они несут яйца, так что мясные рулетики с яйцом из них тоже должны выйти неплохие..."
  - char: "ognevoy"
    side: "right"
    text:
      - "...Эй? Пингвины же такие милые... Это... это слишком жестоко!"
  - char: "svirepy"
    side: "left"
    text:
      - "Раз такие милые... значит, точно очень вкусные... хе-хе."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Стоп — отбрось свои опасные мысли!"
      - "К сожалению, в «Антарктическом договоре» четко прописано, что все животные на антарктическом континенте, будь то ходящие по земле или летающие в небе, находятся под защитой."
      - "Их нельзя просто так есть! Абсолютно запрещено!"
  - char: "svirepy"
    side: "left"
    text:
      - "Э-э... какая жалость, а я так хотела устроить веселую охоту..."
  - char: "ognevoy"
    side: "right"
    text:
      - "Фух... теперь я спокойна."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Хе-хе, мы взяли с собой более чем достаточно припасов. Их хватит не только нам, но и для пополнения запасов исследовательской станции."
      - "Голодать ты не будешь, так что оставь милых пингвинов в покое."
  - char: "svirepy"
    side: "right"
    text:
      - "Да я не из-за нехватки еды переживаю..."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "О~ Я поняла!"
      - "Тебе просто обидно, что ты забралась в такую даль, в Антарктику, и не сможешь попробовать никакой местной экзотики, верно?"
  - char: "svirepy"
    side: "right"
    text:
      - "Да-да, именно так!"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Если так посмотреть, в Антарктике всё-таки есть кое-что съедобное... например, то, что плавает в море."
      - "Рыба и креветки, выловленные из моря, не защищены «Антарктическим договором», так что мы можем есть их сколько влезет."
      - "Например, криль — он на самом деле довольно вкусный."
      - "А что до мяса пингвина... если убрать жир и правильно его приготовить, по вкусу оно почти как курица."
      - "Хочешь, я приготовлю тебе жареную курицу по секретному императорскому рецепту, а ты просто представишь, что это пингвин?"
      - "И еще порцию супа с лапшой и крилем. Это блюдо, между прочим, тоже из банкетного меню, так что вкус гарантирую."
      - "Хотя в оригинальном рецепте из меню используется не криль~"
  - char: "svirepy"
    side: "right"
    text:
      - "Вау... звучит так вкусно."
      - "Не ожидала, что товарищ Память Меркурия умеет готовить такие блюда!"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Иногда я берусь за готовку, чтобы воссоздать вкусы из своих воспоминаний~"

chapter2:
  rows:
  - char: "tallinn_rad"
    side: "right"
    text:
      - "Говорит база Северного Парламента, исследовательская станция «Мирный»."
      - "Субмарина «Калинка», проверка пройдена, добро пожаловать в Антарктику."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Давно не виделись, товарищ Таллин."
      - "Мы привезли приветы издалека, а также партию припасов."
  - char: "tallinn_rad"
    side: "right"
    text:
      - "Похоже, сегодня можно будет устроить вкусный ужин в честь вашего прибытия."
      - "И правда, давно не виделись, товарищ Союз. Когда я получила сообщение о том, что ты прибудешь лично, то была немало шокирована."
      - "В любом случае, я отправила вам последние данные об обстановке в этих водах, маршрут уже проложен."
      - "Пожалуйста, следуйте по маршруту, избегая айсбергов. Встретимся в порту."
