chapter1:
  rows:
  - text:
      - "По мере приближения очертания белого континента наконец стали обретать четкость."
      - "Размытая белая пунктирная линия превратилась в угловатые ледники, а черные точки зданий, разбросанные по белоснежной ледяной равнине, показали свои истинные масштабы."
  - char: "svirepy"
    side: "left"
    text:
      - "Так вот она, наша антарктическая исследовательская станция «Мирный»..."
      - "Она намного больше, чем я себе представляла, да и расцветка довольно броская."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Здания ярких цветов становятся самыми заметными ориентирами на ледяных просторах, это облегчает навигацию людям, самолетам и кораблям."
      - "Поэтому здесь, в отличие от маскировки, заботятся о том, как сделать себя максимально заметными для других."
      - "В конце концов, главной угрозой здесь являются не пушки и война, а экстремальные условия окружающей среды~"
  - char: "svirepy"
    side: "left"
    text:
      - "Вот оно что... Совсем как госпитальные суда, которые стараются сделать себя как можно заметнее."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Э-э... На самом деле это немного разные вещи."
  - char: "svirepy"
    side: "left"
    text:
      - "...Правда?.."

chapter2:
  rows:
  - char: "ognevoy"
    side: "left"
    text:
      - "Смотрите, Таллин уже ждет нас на причале~"
      - "Эй, товарищ Таллин~"
  - char: "svirepy"
    side: "right"
    text:
      - "Как она тебя услышит, если ты кричишь из каюты..."
  - char: "ognevoy"
    side: "left"
    text:
      - "А... и правда."
  - char: "poltava"
    side: "right"
    text:
      - "Хе-хе, наберитесь терпения, мы уже почти пришвартовались."
      - "Снаружи царство льда и снега, так что не забудьте хорошенько утеплиться перед тем, как сойти на берег."

chapter3:
  rows:
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Шаг, еще шаг, и третий~"
      - "Хе-хе, вот мы и официально ступили на континент Антарктики~"
  - char: "poltava"
    side: "right"
    text:
      - "Отправившись с базы в Черном море и проделав путь в тысячи миль... Это и правда было долгое путешествие."
      - "К счастью, удача была на нашей стороне, и мы добрались без происшествий."
  - char: "svirepy"
    side: "left"
    text:
      - "Ветер... К-какой сильный ветер!..."
      - "Как же здесь холодно!!!"
  - char: "ognevoy"
    side: "right"
    text:
      - "Я так и знала, что ты это скажешь. Держи, накинь эту куртку~"
  - char: "svirepy"
    side: "left"
    text:
      - "Э-э... Что это за пестрая одежда?"
  - char: "ognevoy"
    side: "right"
    text:
      - "Это пуховик, который я сама украсила. Хе-хе, миленько, да?~"
  - char: "svirepy"
    side: "left"
    text:
      - "Какой ужас!!"
  - char: "ognevoy"
    side: "right"
    text:
      - "Эй... Он ведь такой милый~"
      - "Тогда, может, обнимашки? Если обнимемся, сразу станет тепло!"
  - char: "svirepy"
    side: "left"
    text:
      - "Если я прижмусь к твоей куртке, станет только холоднее!!!"
      - "Ладно... Ничего, я просто включу часть систем обогрева своей оснастки."
  - char: "tallinn"
    side: "right"
    text:
      - "Хе-хе, не ожидала, что после столь долгого пути товарищи останутся такими бодрыми."
      - "Товарищи, добро пожаловать на антарктическую исследовательскую станцию Северного Парламента «Мирный». Я возглавляю эту станцию, моё имя Таллин."
      - "Погрузку и разгрузку припасов предоставьте автоматике причала."
      - "Снаружи суровые условия, так что, пожалуйста, следуйте за мной, поговорим внутри."

chapter4:
  rows:
  - text:
      - "Ревущая метель осталась за тяжелыми дверями, и благодаря исправной работе системы отопления все постепенно начали согреваться."
  - char: "svirepy"
    side: "left"
    text:
      - "Фух... Наконец-то я ожила."
      - "Нас разделяет лишь стена, но внутри и снаружи словно два разных мира."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Снаружи воет ураганный ветер, а мы тут пьем горячий чай..."
      - "Разве не возникает чувство, будто мы находимся в укрытии, а за стенами конца света?"
  - char: "svirepy"
    side: "left"
    text:
      - "Раз ты об этом заговорила... и правда, немного есть такое."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Хе-хе, вовсе не «немного»~"
      - "Силы природы непревзойденны."
      - "Даже такие сильные создания, как мы, перед лицом столь абсолютной мощи быстро падут, если лишатся убежища."
      - "Так что это и есть наше укрытие на случай конца света."
  - char: "svirepy"
    side: "left"
    text:
      - "...Я как-то не задумывалась об этом так глубоко."
  - char: "ognevoy"
    side: "right"
    text:
      - "Но звучит очень логично... Как и ожидалось от нашей многоопытной сестренки Памяти Меркурия~"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Хе-хе~ Союз, тебе ведь с Таллин нужно обсудить важные дела, верно?"
      - "Раз уж малышки уже согрелись и пришли в себя, я пока отведу их на экскурсию по базе, хорошо?.."
  - char: "svirepy"
    side: "right"
    text:
      - "Я вовсе не малышка!"
  - char: "ognevoy"
    side: "left"
    text:
      - "Еще какая~"
  - char: "svirepy"
    side: "right"
    text:
      - "А вот и нет!"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Ладно-ладно~ Не малышка, не малышка~ Пойдемте!"
  - char: "ognevoy"
    side: "right"
    text:
      - "Хе-хе~ Идем исследовать базу, исследовать~"
  - char: "svirepy"
    side: "left"
    text:
      - "Хм, правильнее сказать: патрулировать периметр и устранять угрозы!"
      - "Эй, подождите меня!"

chapter5:
  rows:
  - char: "poltava"
    side: "left"
    text:
      - "Умчались как ураган..."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Полтава, тебе не кажется, что Память Меркурия сегодня ведет себя немного... странно?"
  - char: "poltava"
    side: "left"
    text:
      - "Странно?"
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Слишком сентиментально, что ли... даже не знаю, как это описать."
  - char: "poltava"
    side: "left"
    text:
      - "Я не заметила."
  - char: "tallinn"
    side: "right"
    text:
      - "М-м... Может, это влияние антарктического климата?"
      - "Здесь круглый год всё укрыто белым саваном, а завывания штормовых ветров, кажется, никогда не прекращаются."
      - "Это обычное дело, когда по прибытии сюда чувствительные натуры поддаются меланхолии и становятся более сентиментальными."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Влияние окружающей среды... это и правда возможно."
      - "Что ж, давайте перейдем к делу."
      - "Таллин, какова сейчас обстановка в Антарктике? Есть ли новые сведения об этом аномальном минерале?"
  - char: "tallinn"
    side: "right"
    text:
      - "Да, пока вы были в пути, в Антарктике и правда кое-что изменилось."
      - "В районе, где был обнаружен новый минерал, как упоминалось в предыдущих отчетах, процесс таяния льдов ускоряется."
      - "Сейчас мы называем это место «зоной таяния снегов»."
      - "Мы уже успели собрать дополнительные образцы из разных точек этой «зоны таяния снегов»."
      - "Все образцы продемонстрировали способность вступать в своего рода резонанс с оснасткой."
      - "Причем результаты носят исключительно положительный характер, включая повышение точности, сокращение времени перезарядки и так далее. Вот подробный отчет."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Хм..."
  - char: "tallinn"
    side: "right"
    text:
      - "В то же время Союз Орла тоже активизировался, похоже, они также обнаружили присутствие минерала."
      - "Пока мы проводили расследование, они тоже отправили исследовательскую группу в «зону таяния снегов» для сбора образцов."
      - "Более того, буквально вчера на базу Союза Орла прибыл немалый боевой флот."
      - "Похоже, Союз Орла готовится провести в Антарктике военную операцию масштаба целой кампании."
  - char: "poltava"
    side: "left"
    text:
      - "...Военную операцию масштаба кампании?"
      - "В антарктической зоне боевых действий всегда было очень спокойно, информация о появлении Сирен поступает крайне редко."
      - "Против кого они готовят такую масштабную операцию?.."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Возможно... неужели Союз Орла получил какую-то информацию, о которой мы не знаем."
      - "Похоже, добыча этого минерала усложнится..."
      - "У нас ведь не было стычек с людьми Союза Орла?"
  - char: "tallinn"
    side: "left"
    text:
      - "Разумеется, нет. Еще во время исследований в «зоне таяния снегов» мы контактировали с представителями Союза Орла, и всё прошло абсолютно мирно."
      - "Прибывший вчера флот Союза Орла тоже всё это время оставался в порту и не предпринимал никаких подозрительных действий."
      - "Судя по всему, Союз Орла намеревается осуществлять свои планы без лишнего шума."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Ха, прислать столько людей... и говорить о скрытности."
      - "А Железная Кровь? Согласно нашим источникам, первыми этот минерал должна была обнаружить Железная Кровь."
      - "Какие действия предпринимают они?"
  - char: "tallinn"
    side: "left"
    text:
      - "Во время наших исследований в «зоне таяния снегов» мы не сталкивались с исследовательской группой Железной Крови."
      - "Однако, если судить по расстоянию, крепость Железной Крови находится ближе к «зоне таяния снегов», где появился минерал."
      - "Возможно, они завершили свои исследования задолго до нас и Союза Орла..."
      - "В данный момент можно с уверенностью сказать лишь то, что они пока не стали «повышать ставки» в этом деле."
      - "В отличие от нас и Союза Орла, за последнее время ни один флот Железной Крови не прибывал в Антарктику."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Никто не прибывал?.."
      - "Хм, я поняла."
      - "Ты не могла бы отвести меня посмотреть на эти образцы?"
  - char: "tallinn"
    side: "left"
    text:
      - "Конечно, без проблем. Сейчас все образцы хранятся в лабораторном блоке, пожалуйста, следуйте за мной..."
