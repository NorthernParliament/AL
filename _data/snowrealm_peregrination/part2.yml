chapter1:
  rows:
  - char: "poltava_rad"
    side: "right"
    text:
      - "Товарищ Союз, мы вошли в воды Южного океана."
      - "Однако у нас практически нет данных о подводной обстановке в этих местах."
      - "Учитывая, что здесь почти не бывает людей, может, нам стоит начать всплытие?"
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Да. Как бы скрытно мы ни действовали, по прибытии на исследовательскую станцию нас, скорее всего, всё равно обнаружат."
      - "Мы прибыли достаточно рано. На данном этапе безопасность превыше всего, готовьтесь к всплытию."
  - char: "poltava_rad"
    side: "right"
    text:
      - "Вас поняла, начинаю подготовку к всплытию."
  - char: "ognevoy"
    side: "left"
    text:
      - "Ура, наконец-то посмотрим на местные пейзажи!"
  - char: "svirepy"
    side: "right"
    text:
      - "Хм, это всего лишь заснеженные горы, разве у нас дома их мало?"
      - "Здесь не из-за чего так бурно радоваться, ведешь себя как маленький ребенок..."
  - char: "ognevoy"
    side: "left"
    text:
      - "Но ведь это целый континент, целый континент, покрытый льдом и снегом~!"
      - "Ва-ва-ва! Так жду не дождусь, жду не дождусь~"
  - char: "svirepy"
    side: "right"
    text:
      - "Ладно, ладно... Ладно, я поняла, хватит меня трясти!"
  - char: "ognevoy"
    side: "left"
    text:
      - "Хе-хе, прости..."
  - char: "svirepy"
    side: "right"
    text:
      - "Фух... Ладно уж. Я вполне могу тебя понять."
      - "Всё это время сидеть под водой и правда было до жути скучно..."
  - char: "poltava_rad"
    side: "left"
    text:
      - "Хе-хе, держитесь крепче и потерпите еще немного."
      - "Увеличиваем скорость всплытия!"

chapter2:
  rows:
  - text:
      - "В тот момент, когда рубка прорвалась сквозь толщу воды, перед взорами всех присутствующих предстала безупречная белизна."
  - char: "ognevoy"
    side: "left"
    text:
      - "Так вот он какой, Южный океан... Мы еще даже не приблизились к континенту, а тут уже такие виды!.."
      - "Как красиво... Как же красиво!"
  - char: "svirepy"
    side: "right"
    text:
      - "...Веди себя прилично! Это мало чем отличается от тех пейзажей, что мы видели у нас на севере!"
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Хе-хе, в этом-то и заключается разница, понимаешь?.."
      - "Огромные ледники нашего севера здесь — вполне заурядное явление."
      - "Чем ближе мы будем продвигаться к полюсу, тем более невероятными станут виды."
      - "Пока мы не увидим сам континент, эту мертвую зону, скованную льдом и снегом."
      - "А знаешь ли ты, что площадь Антарктики больше России... больше половины всего Северного Парламента."
  - char: "svirepy"
    side: "right"
    text:
      - "Больше половины... Да это же больше, чем весь Союз Орла!..."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Верно~ И весь этот континент почти целиком погребен под толстым слоем льда и снега."
      - "Единственные следы цивилизации на нем — это редкие исследовательские станции разных фракций."
      - "Хе-хе, мы вот-вот ступим на этот безлюдный, полный тайн белый континент~"
      - "Ну как, чувствуешь, как в тебе разгорается дух авантюризма?.."
  - char: "svirepy"
    side: "right"
    text:
      - "И правда, стало немного... интересно."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Подождите, не нужно так акцентировать внимание на «белом континенте»..."
      - "...Это навевает не самые приятные воспоминания."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Ах да, тебя ведь тоже втянули в тот инцидент с «Божьим Царством»."
      - ": Тебе пришлось с боем прорываться от самой базы в Черном море до территории Всемирной выставки... Ахаха, это был тот еще тяжелый марафон."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Эх... Это точно."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Хорошо еще, что во время битвы с твоей оснасткой ничего не случилось~"
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Счастье в несчастье... хоть она и полностью вышла из строя сразу после окончания сражения."
      - "Надеюсь, на этот раз удастся найти способ окончательно решить эту проблему."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Да, удастся, я верю, что мы обязательно его найдем~"

chapter3:
  rows:
  - text:
      - "Субмарина мчалась по поверхности воды на большой скорости."
      - "Будучи моделью с акцентом на защиту и силовую установку, она не уклонялась от плавучих льдин, а таранила их напролом."
      - "Под череду неритмичных и неприятных слуху ударов первоначальный восторг Свирепой и Огневой постепенно сменился скукой."
  - char: "ognevoy"
    side: "left"
    text:
      - "...Какой пустой и скучный мир, если побыть тут подольше, становится даже жутко..."
  - char: "svirepy"
    side: "right"
    text:
      - "Сама сначала радовалась, а теперь первая же и заскучала..."
  - char: "ognevoy"
    side: "left"
    text:
      - "У-у-у... Всё белым-бело... белым-бело... словно бесконечная сахарная пудра..."
  - char: "svirepy"
    side: "right"
    text:
      - "акое описание звучит даже как-то мило... Жаль только, что от скуки это не спасает..."
      - "Товарищ Союз, можно задать тебе вопрос?"
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Спрашивай. Мне тоже стало немного тоскливо, нужно размять мозги."
  - char: "svirepy"
    side: "right"
    text:
      - "Ты не знаешь, почему такой огромный континент, как Антарктика, так и не был поделен между странами?"
      - "Пусть тут и холодно... в Сибири тоже холодно, но там ведь всё равно живет немало людей."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Хм... Это и правда хороший вопрос, но в то же время и весьма сложный."
      - "Для начала давайте найдем место поудобнее, присядем и спокойно всё обсудим."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "О-о? Начинается мини-урок от Союза? Тогда я пойду принесу что-нибудь выпить~"
