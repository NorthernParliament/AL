chapter1:
  rows:
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хм-хм-хм♪~"
      - "Я же говорила, что сражение еще далеко не окончено~"
      - "Судя по моим ощущениям, её прячут в лабиринте под этим зданием."
      - "...Боюсь, чтобы её найти, придется приложить немало усилий."
  - char: "clemenceau"
    side: "right"
    text:
      - "Прекрасная леди, самовольное проникновение в чужие владения — тяжкое преступление."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Кажется, я припоминаю... ты епископ Трибунала Клемансо?"
      - "Похоже, ты уже догадалась, что я приду сюда."
  - char: "clemenceau"
    side: "right"
    text:
      - "Твою цель угадать было нетрудно, а вот предугадать способ — уже сложнее."
      - "Как я и думала, от тебя не так-то легко избавиться."
      - "Заранее подготовиться было поистине верным решением."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хм? Эта аура..."
  - char: "algerie_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хе-хе, не ожидала, мисс незваная гостья?"
  - char: "la_galissonniere_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Раз уж тебе так хочется побыть нашей гостьей, позволь нам как следует тебя принять прямо здесь!"
