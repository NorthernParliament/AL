chapter1:
  rows:
  - char: "clemenceau"
    side: "left"
    text:
      - "Госпожа Тренто, как вы себя чувствуете сегодня?"
  - char: "trento"
    side: "right"
    text:
      - "Клемансо, благодарю за заботу!"
      - "На самом деле, со вчерашнего дня я больше не испытываю никакого недомогания."
      - "Но на всякий случай сегодня я снова приняла лекарство~"
  - char: "clemenceau"
    side: "left"
    text:
      - "И поступила совершенно верно. Только соблюдая курс лечения, мы сможем гарантировать, что очаг болезни полностью устранен."
  - char: "trento"
    side: "right"
    text:
      - "Есть! Епископ Клемансо."
  - char: "clemenceau"
    side: "left"
    text:
      - "Хи-хи, в конце концов, Трибунал получил эту технологию только «благодаря» вашей Марко Поло, так что не стоит быть такой скованной."
      - "Уверена, Марко Поло была бы счастлива увидеть, как хорошо ты поправляешься."
      - "Тренто, ты ненавидишь ее?"
  - char: "trento"
    side: "right"
    text:
      - "Хм... Честно говоря, всё, что произошло за это время, кажется мне каким-то смутным сном."
      - "А после пробуждения оставшиеся в голове воспоминания... даже менее детальны, чем рассказанная вами история."
      - "Поэтому, по правде сказать... я до сих пор не до конца осознала ситуацию, не говоря уже о какой-то ненависти..."
  - char: "clemenceau"
    side: "left"
    text:
      - "Понятно. Хи-хи, ничего страшного. Очень хорошо, что ты так думаешь."
  - char: "trento"
    side: "right"
    text:
      - "Епископ Клемансо, скажите, как сейчас... дела у госпожи Марко Поло?.."
  - char: "clemenceau"
    side: "left"
    text:
      - "Она... всё ещё спит, но её жизненные показатели стабильны, так что не о чем беспокоиться."
  - char: "trento"
    side: "right"
    text:
      - "Фух... Вот и славно."
  - char: "clemenceau"
    side: "left"
    text:
      - "Кстати, как ты спала последние несколько дней? Тебе не снились странные сны?.."
  - char: "trento"
    side: "right"
    text:
      - "Странные сны... Вроде ничего необычного."
      - "Правда, иногда мне снится один и тот же пейзаж..."
  - char: "clemenceau"
    side: "left"
    text:
      - "И что же там?"
  - char: "trento"
    side: "right"
    text:
      - "Это пространство, полностью покрытое белым цветом. Небо и морская вода — абсолютно белые..."
      - "Во сне я стою на белом песчаном пляже, а вокруг навалены белые раковины мурекса..."
  - char: "clemenceau"
    side: "left"
    text:
      - "Раковины мурекса?.. Твои симптомы МЕТА-морфозы должны были пойти на спад."
      - "Неужели твоя связь с Ним... никак не связана с феноменом МЕТА?.."
      - "Во сне ты слышала что-нибудь?.. Раковины мурекса говорили с тобой?.."
  - char: "trento"
    side: "right"
    text:
      - "Вовсе нет... Епископ Клемансо, а раковины... должны со мной разговаривать?.."
  - char: "clemenceau"
    side: "left"
    text:
      - "...Я и сама не знаю."
      - "Но если... раковины во сне действительно заговорят с тобой, ты должна немедленно сообщить мне."
      - "Безопасность Марко Поло, как и безопасность всех нас."
      - "Полностью зависит от тебя."
