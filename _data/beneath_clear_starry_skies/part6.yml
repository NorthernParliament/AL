chapter1:
  rows:
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Сестра... кхм, товарищ Союз, добро пожаловать в штаб в Санкт-Петербурге."
      - "Как там обстановка в Ирис, всё в порядке?"
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Честно говоря, всё неоднозначно, но в Европе можем со спокойной душой положиться на Аврору и Память Меркурия."
      - "Сейчас нам нужно разобраться с ситуацией на полюсе."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Эх... Кто бы мог подумать, что во время нашей операции в Средиземном море произойдет такое... Хорошо, что ты по счастливому стечению обстоятельств оказалась в Черном море."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Никакое это не стечение обстоятельств, просто мы тоже стали частью чужого плана."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "...Что ты имеешь в виду?"
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Ничего, не бери в голову. Как продвигается операция?"
      - "Помнится, в то же время Курск подавала рапорт об обнаружении на полюсе «МЕТА неизвестной принадлежности», верно?"
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "В ходе дальнейших операций мы уделили особое внимание разведке в этом направлении."
      - "Однако вплоть до самого прорыва обороны крепости на Северном полюсе эта неизвестная МЕТА больше не появлялась."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Странно. Если ее целью было уничтожить силы Сирен раньше нас..."
      - "То время, пока ваша система командования была парализована из-за инцидента с Божественным царством на суше, было бы для нее идеальным моментом для удара."
      - "Почему же она бесследно исчезла?.. Потому что ее цель уже достигнута?.. Или же у нее были иные причины скрыться?.."
      - "Боюсь, всё не так просто."
      - "Передай мне все собранные образцы и отчеты, я сформирую специальную следственную группу для изучения этого вопроса."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Слушаюсь. И еще, товарищ Союз... со вчерашнего дня возникла новая проблема, из-за которой нам пришлось приостановить поиски пространства Мейнфрейма Пьюрифайер."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Хм? Что за проблема?"
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "«Маяк Рассвета» — наше устройство для обнаружения местоположения пространства Мейнфрейма Сирен — внезапно вышел из строя."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Из-за чего?"
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Пока неизвестно... Научный отдел бросил все силы на диагностику. Ожидается, что на выявление причины уйдет от трех до пяти дней."
      - "Однако в тот же момент, когда «Маяк Рассвета» дал сбой, товарищ Киров заметила в акватории маяка несколько высокотехнологичных летательных аппаратов сирен."
      - "По форме они напоминали глазные яблоки, извергали синее пламя из двигателей и передвигались в воздухе с поразительной маневренностью."
      - "Наши радары не смогли их засечь, а палубная авиация и средства ПВО не зафиксировали ни одного успешного попадания."
      - "Мы с Белоруссией предполагаем, что именно эти неизвестные летательные аппараты и стали причиной поломки «Маяка Рассвета»."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "А что с огневой мощью этих аппаратов?"
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Неизвестно, они не открывали ответный огонь, а лишь уклонялись на высокой скорости, пока не скрылись из виду."
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Высокотехнологичные единицы высших сирен появились на полюсе... Они заглушили наши приборы для обнаружения Мейнфрейма сирен, а заодно провели разведку и проверку нашей огневой мощи."
      - "...Плохой знак."
      - "Мы уже захватили крепость на Северном полюсе и сломили сопротивление Пьюрифайер в акватории, так что можно считать, что цель первой фазы операции успешно достигнута..."
      - "Раз уж мы успешно выполнили промежуточную задачу... пора остановиться на достигнутом."
      - "Позже я отдам официальный приказ через штаб об успешном завершении операции."
      - "За исключением секторов K-1 и K-4, мы отказываемся от контроля над всеми территориями внутри бывшей линии обороны Пьюрифайер. Немедленно отзывайте все войска."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Э?.. Мы оставляем даже Северный полюс и Корону?"
  - char: "sovetsky_soyuz_old"
    side: "right"
    text:
      - "Оставляем. Раз Мейнфрейм Пьюрифайер так и не удалось уничтожить, то нет никакого смысла удерживать эти районы силой."
      - "Иначе нас ждет лишь бесконечная война на истощение, прямо как в прошлом в Северной Атлантике."
      - "Обстановка на Европейском континенте кардинально изменилась, и сирены тоже ввели в бой боевые единицы более высокого порядка."
      - "Ситуация неясная, поэтому нам тоже следует перейти от наступления к обороне и спокойно следить за развитием событий."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Я поняла, слушаюсь!"
