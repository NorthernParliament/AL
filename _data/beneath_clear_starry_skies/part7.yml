chapter1:
  rows:
  - text:
      - "Самолет, принадлежащий штабу Нью-Йорка, плавно летел сквозь безоблачную ночную тьму."
      - "Хотя сам борт был небольшим, для двух единственных пассажирок переоборудованный салон казался просторным и невероятно комфортным."
      - "Часы в салоне показывали 1:26 ночи по горному времени Союза Орла."
      - "Одна из пассажирок уже давно погрузилась в сон, тогда как другая всё ворочалась с боку на бок, не в силах сомкнуть глаз..."
  - char: "princeton"
    side: "left"
    text:
      - "...Подумать только, таинственная организация «Море Звёзд» из cуществует на самом деле."
      - "Собрание величайших умов из самых разных областей..."
      - "Технологии, которые, по слухам, опережают весь остальной мир как минимум на тридцать лет..."
      - "А еще... хе-хе-хе..."
      - "Мало того, что семпай Саратога принимала самое активное участие в строительстве «Моря Звёзд»..."
      - "Там же работает и глубокоуважаемая директор Аляска!"
      - "И я, Принстон!"
      - "Тоже получила приказ о переводе в «Море Звёзд»!!"
      - "Какая же... какая невероятная удача!"
      - "<h3>Какое счастье!!!</h3>"
  - char: "laffey"
    side: "right"
    text:
      - "...Принстон, слишком шумно."
  - char: "princeton"
    side: "left"
    text:
      - "Ах, прости-прости, я тебя разбудила?.. Буду вести себя потише!"
  - char: "laffey"
    side: "right"
    text:
      - "...Угу... спокойной ночи... zZZZ"
  - char: "princeton"
    side: "left"
    text:
      - "Спокойной ночи~ Лаффи~!"

chapter2:
  rows:
  - char: "princeton"
    side: "left"
    text:
      - "Фух, фу-ух... хе-хе-хе..."
      - "Семпай Саратога... директор Аляска... и «Сердце Галактики» в «Море Звёзд»..."
      - "Прекрасное будущее... я уже лечу к тебе!"
