chapter1:
  rows:
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "...Укрепление колец с первого по третье завершено."
      - "Теперь приступим к строительству новых секторов..."
  - char: "warspite"
    side: "right"
    text:
      - "Ваше величество... пожалуй, пора бы уже показаться на публике. Приглашения на мероприятия скоро проломят рабочий стол."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Тогда притащите еще один стол!"
      - "У Меня здесь дела поважнее!"
      - "Пока во Вратах Авалона не устранят все скрытые угрозы, Я ни шагу отсюда не сделаю!"
      - "Да! Сказала — не пойду, значит, не пойду! Никуда!"
      - "...На чем Я там остановилась?.. Ах да, нужно установить защитные системы в секторах «Алая роза», «Белая роза» и «Чертополох»..."
  - char: "valiant"
    side: "right"
    text:
      - "...И долго она уже в таком состоянии?"
  - char: "vanguard"
    side: "left"
    text:
      - "С тех самых пор, как услышала новость об объединении Ирис, Ее величество сама не своя."
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Чушь! Ничуть Я не расстроена!"
      - "Тц... А-а-а! Клемансо!.."
      - "Ладно, проехали... Далее новый центральный сектор — «Корона королевы»."
      - "Как только эти сектора будут достроены... оборона Врат Авалона станет безупречной."
      - "Всё-всё, если у вас больше нет дел, нечего тут толпиться."
      - "Всю гору накопившихся бумаг доверяю разобрать вам. Ступайте, ступайте."
  - char: "valiant"
    side: "left"
    text:
      - "Хи-хи-хи, раз уж ты так настойчиво просишь, так и быть, возьму это бремя на себя~"
  - char: "warspite"
    side: "right"
    text:
      - "Эх... Ваше величество, завтра я приду снова."

chapter2:
  rows:
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "О-о~ А этот комплекс защитных систем весьма занятный."
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Они еще далеко не ушли, тебе не опасно подавать голос прямо сейчас?.."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Не опасно, кроме тебя голос Мой никто не услышит."
      - "Подумать только, за считанные недели ты смогла продвинуться настолько далеко..."
      - "Впрочем, перед лицом опасности, с которой вам предстоит столкнуться, этого все равно ничтожно мало."
      - "Должна признать, внешность бывает обманчива: не верилось, что испытательный полигон с вашим уровнем технологий сумеет поднять такую бучу в Средиземном море."
      - "Сияние, пролившееся в пустоту, даже Я разглядела во всех деталях."
      - "Поэтому Я абсолютно уверена: ваш мир теперь на прицеле у сущностей куда опаснее прежних."
      - "Меня, правда, несколько удивляет, почему Сирены медлят и до сих пор не запустили протокол зачистки, хотя должны были сделать это немедленно..."
      - "Но в некотором смысле это сулит еще худший исход. Возможно, они просто решили, что этот мир уже абсолютно безнадежен."
      - "Как Я уже говорила, Мне под силу эвакуировать в безопасный мир всё высшее руководство и ключевые ресурсы Королевского Флота, включая даже ваших союзников."
      - "Чем тратить время впустую здесь, не лучше ли обдумать Мой план эвакуации?.."
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "И думать не стану."
      - "Где это видано, чтобы сдавались до начала битвы?! Я намерена сражаться до самого конца."
      - "Лучше уж ты сама, коль явилась предлагать союз, берись за дело и помогай Мне изо всех сил."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Вообще-то сейчас именно ты просишь Меня об одолжении."
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "О как?.. Неужели?"
