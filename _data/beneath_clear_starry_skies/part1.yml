chapter1:
  rows:
  - text:
      - "Просторное помещение, роскошная мебель, мягкий ковер и аромат свежей выпечки к чаю."
      - "Помещение, которое мне выделили, уместнее было бы назвать роскошными апартаментами для гостей, нежели временным кабинетом."
      - "С тех пор как Ортодоксия Ирис объявила о воссоединении, вопрос о формате её возвращения в Лазурный путь сразу же встал на повестку дня."
      - "Учитывая мои обязанности Командира и настойчивую просьбу стороны Ришелье..."
      - "После церемонии коронации я остался в Ирис в качестве представителя штаба Лазурного пути и нахожусь здесь по сей день."
  - char: "commander"
    side: "left"
    text:
      - "Впрочем, хоть это и называется работой, посещать приходится в основном светские приемы..."
      - "Если подумать, происходящее больше напоминает отпуск..."
      - "Последний раз столь долгий перерыв выпадал мне еще во времена военной академии."
      - "Хотя нет... Даже на академических каникулах мне вряд ли доводилось вот так беззаботно отдыхать..."
      - "Помнится, перед самым началом тех каникул всё выглядело примерно так..."

chapter2:
  rows:
  - char: "saratoga"
    side: "left"
    text:
      - "...На этом вводная часть об оснастке палубной авиации окончена. Хм... До конца урока еще осталось немного времени."
      - "А теперь, класс, откройте учебники на седьмой главе."
      - "Прежде чем перейти к подробному разбору вспомогательного боевого оборудования авианосцев, я хотела бы вкратце рассказать о тактике авианосных соединений."
      - "Будем считать это затравкой на будущее. И не вздумайте забрасывать учебу на каникулах!"
  - char: "commander"
    side: "right"
    text:
      - "«...Авианосец — новый класс боевых кораблей, чей метод ведения боя в корне отличается от концепции тяжелой артиллерии и тяжёлой брони...»"
      - "«...С самого момента своего появления авианосцы негласно провозгласили: отныне морское небо больше не принадлежит исключительно Сиренам...»"
      - "«...Однако в силу специфики авианосцев, гораздо эффективнее, нежели одиночный бой или сосредоточение исключительно авианосных сил...»"
      - "«...Оказывается формирование многоцелевого ордера эскорта во главе с авианосцем. Именно это позволяет раскрыть все его преимущества и добиться синергии, когда один плюс один дают куда больше двух...»"
      - "...И впрямь оружие, определившее новую эпоху."
  - char: "saratoga"
    side: "left"
    text:
      - "Ого-о~ А у кого-то здесь отличный глазомер на тактику~"
      - "Именно так, будущее за авианосцами!"
  - char: "new_jersey"
    side: "right"
    text:
      - "Э-э-э~ А мне вот кажется, что будущее — за броней потолще да калибром побольше~~"
      - "Палуба у авианосца ведь хрупкая, верно?.. А самолеты в воздухе — и того уязвимее."
      - "К тому же, если их собьют, быстро восполнить потери не выйдет, да и пробить толстенную броню Сирен им не под силу... Так что пушки покрупнее и броня покрепче всё же куда надежнее~"
  - char: "saratoga"
    side: "left"
    text:
      - "Ученица Нью-Джерси!.. Ты вообще слушала, о чем я говорила?!"
      - "В наказание пойдешь перечитывать введение и пролог от корки до корки!.."
      - "Ну надо же... Не будь твоя оснастка сейчас на обслцживании, мы бы непременно выяснили всё на полигоне! Уж сестренка Сара тебя проучила бы!"
  - char: "new_jersey"
    side: "right"
    text:
      - "...Но ведь направление модификации моей оснастки как раз и заключается в наращивании брони и установке орудий большего калибра..."
      - "Да и вообще, я же линкор... Зачем мне зубрить тонкости авианосцев?.. Все равно не пригодится..."
  - char: "saratoga"
    side: "left"
    text:
      - "Еще как пригодится, когда будешь командовать собственным флотом!"
      - "В нашей академии готовят офицеров, не забывай, ради чего ты здесь!"
  - char: "new_jersey"
    side: "right"
    text:
      - "Эм-м... Да меня сюда вообще-то не по своей воле занесло... Это все старшая сестрица..."
  - char: "saratoga"
    side: "left"
    text:
      - "Прекрасно! Продолжишь пререкаться — я лично с ней потолкую!!"
  - char: "new_jersey"
    side: "right"
    text:
      - "Нет-нет, только не это! Я буду прилежно учиться, обещаю!"
  - char: "saratoga"
    side: "left"
    text:
      - "Фух... Вот же наказание, столько времени впустую потратили. Итак, вернемся к учебнику..."
  - text:
      - "В этот момент прозвучал звонок возвещающий об окончании урока..."
  - char: "new_jersey"
    side: "right"
    text:
      - "Урок окончен!.. Каникулы-ы!.."
  - char: "saratoga"
    side: "left"
    text:
      - "..Эх, ладно. На этом занятия в текущем семестре подошли к концу."
      - "Можете собирать вещи и наслаждаться заслуженным отдыхом."
  - text:
      - "*Тук-тук-тук*"
  - char: "lexington"
    side: "right"
    text:
      - "Сара, ты еще не освободилась?.."
  - char: "saratoga"
    side: "left"
    text:
      - "Сестренка~ Всё-всё, уже освободилась! Занятие только что закончилось, пошли~"
  - char: "lexington"
    side: "right"
    text:
      - "Хм-хм, перед тем как мы улетим сегодня вечером в Союз Орла, я забронировала столик на ужин в одном превосходном ресторане."
  - char: "saratoga"
    side: "left"
    text:
      - "Ура-а, хочу кушать!.. Но мы на самолет не опоздаем?.."
  - char: "lexington"
    side: "right"
    text:
      - "Пока мы не прибудем, самолет никуда не взлетит. В этом и заключается прелесть спецрейса."
  - char: "saratoga"
    side: "left"
    text:
      - "В этом вся сестренка! Тогда идем скорее!.."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "...Саратога сильно изменилась..."
      - "Всё началось после той битвы в Коралловом море..."
      - "......"
      - "...Поначалу казалось, что благодаря технологии оснастки Типа II и успешному восстановлению Йорктаун, исцеление Лексингтон станет лишь вопросом времени."
      - "Однако... попытки внедрить технологию оснастки Типа II повсеместно до сих пор не принесли никаких успехов."
      - "...Лексингтон и по сей день покоится в холодной капсуле жизнеобеспечения."
      - "...Остается лишь надеяться, что новый этап исследований в Море Звёзд пройдет без осложнений."
      - "...Лексингтон, я непременно спасу тебя."
