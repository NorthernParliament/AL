chapter1:
  rows:
  - char: "musashi"
    side: "left"
    text:
      - "Госпожа Акаги, «инцидент с Великим Священным древом» был благополучно разрешён."
      - "Великий Мудрец нареклась «Ундзэн», скверна внутри древа уничтожена, и... фантом госпожи Амаги успешно явил себя."
      - "Если судить по итогам, результат превзошел ожидания."
  - char: "akagi_rad"
    side: "right"
    text:
      - "Ты забыла упомянуть еще кое-что: госпожа Нагато из-за чрезмерного истощения сил еще долго не сможет нам мешать."
      - "Хи-хи, теперь, когда концепт «Ундзэн» окончательно закрепился, Великий Мудрец утратила контроль над «сетью священных камней»."
      - "В этот самый миг власть над сетью свободна, а Синано нет поблизости ни от одного из Священных древ. Похоже, захват пройдет как по маслу."
  - char: "musashi"
    side: "left"
    text:
      - "...Ты и вправду решилась на это?.."
      - "И Ундзэн, и Синано черпают силу напрямую из священного камня Ватацуми, поэтому они естественным образом связаны с его сетью."
      - "С тобой же все иначе... Пытаться подчинить сеть посредством искусственной модификации — чересчур опасная затея."
      - "Как корабль типа «Ямато», я неразрывно связана со Священным древом. Даже если бы этим занялась я сама, шансов на успех было бы куда больше."
  - char: "akagi_rad"
    side: "right"
    text:
      - "Нет, это дело я должна завершить собственноручно."
      - "Питать священный камень древом, тем самым соединяя их воедино..."
      - "Похоронить сестру у корней Священного древа, чтобы сохранить осколок ее души в межвременье..."
      - "Все делалось ради этой минуты... Поэтому лишь мне суждено исполнить задуманное."
      - "Или госпоже Мусаси жаль Ватацуми?.. Боишься, что без него твое оружие решающей битвы так и не удастся создать?.."
  - char: "musashi"
    side: "left"
    text:
      - "...Так ты уже и об этом проведала."
  - char: "akagi_rad"
    side: "right"
    text:
      - "Разумеется. Разве в землях Империи Сакуры может произойти хоть что-то, о чем бы я не знала?.."
      - "Впрочем, не важно. Если тебе и впрямь удастся довести до ума это супероружие, на которое возлагается столько надежд, выйдет неплохой запасной вариант."
      - "Даже лишившись священного камня, у тебя ведь останется Ундзэн, верно?.."
  - char: "musashi"
    side: "left"
    text:
      - "...Касательно Ундзэн у нас есть свои планы, госпоже Акаги нет нужды беспокоиться."
  - char: "akagi_rad"
    side: "right"
    text:
      - "Я лишь к слову упомянула~ Раз у вас всё схвачено, пусть так и будет."
      - "Хм~ А давай поступим так. Если я потерплю неудачу, вы просто сделаете меня «ядром» оружия решающей битвы взамен священного камня. Что скажешь?.."
  - char: "musashi"
    side: "left"
    text:
      - "...Я бы не хотела, чтобы все зашло настолько далеко."
  - char: "akagi_rad"
    side: "right"
    text:
      - "Человек предполагает, а небеса располагают... Кто знает наверняка?.."
      - "Вот только... разве стрела, сорвавшись с тетивы, летит назад?.."
      - "Мой выбор сделан, и я пойду до самого конца."
      - "Раз уж душа сестры в достаточной мере напиталась силой Священного древа..."
      - "Настала пора переходить к следующему этапу."
  - char: "musashi"
    side: "left"
    text:
      - "...Коль скоро все решено, дерзай, госпожа Акаги."

chapter2:
  rows:
  - char: "jintsuu_meta"
    side: "left"
    text:
      - "Кажется, Акаги ни капли не сомневается в выбранном ею плане."
  - char: "musashi"
    side: "right"
    text:
      - "Потому что этот план — воистину лучшее решение из бесчисленного множества вариантов, которые мы просчитывали за все эти годы."
      - "Тебе кажется, что с ним что-то не так?.."
  - char: "jintsuu_meta"
    side: "left"
    text:
      - "С самим планом проблем нет."
      - "Но вот его фундамент... Та сущность, которую вы считаете душой госпожи Амаги из прошлого, действительно ли она та, за кого вы ее принимаете?.."
      - "В прошлом вы действительно похоронили у корней Священного древа осколок души госпожи Амаги."
      - "Но время идет. Тень Коррозии уже много лет искажала Священное древо, так что сложно ручаться, что осколок души госпожи Амаги остался невредим."
      - "Более того, Священное древо связано со священным камнем... А особенности священного камня тебе прекрасно известны."
      - "То, что вы видели — действительно ли это настоящая госпожа Амаги, или же просто иллюзия, порожденная одними лишь желаниями?.."
  - char: "musashi"
    side: "right"
    text:
      - "...Даже если и так, Акаги уже не отступит."
  - char: "jintsuu_meta"
    side: "left"
    text:
      - "Я знаю. Но в одном Акаги все же была права, насчет Ундзэн..."
  - char: "musashi"
    side: "right"
    text:
      - "Дзинцу, не забывайся."
  - char: "jintsuu_meta"
    side: "left"
    text:
      - "...Прости, больше я этого не упомяну."
      - "...В таком случае, мне продолжать подготовку проекта оружия решающей битвы?.."
  - char: "musashi"
    side: "right"
    text:
      - "...Продолжай."
  - char: "jintsuu_meta"
    side: "left"
    text:
      - "Впереди... нас ждет бушующее пламя..."

chapter3:
  rows:
  - text:
      - "*Грох-грох* (звук катящихся тележек)"
      - "*Грох-грох-грох...* (шум множества тележек)"
  - char: "nagato"
    side: "left"
    text:
      - "...Кавакадзэ, отчего снаружи такой шум?.."
  - char: "kawakaze"
    side: "right"
    text:
      - "Госпожа Нагато, я вижу множество тележек, въезжающих в ворота."
      - "Судя по гербам, это должен быть кортеж госпожи Муцу."
  - char: "nagato"
    side: "left"
    text:
      - "...Муцу?.. Зачем она здесь?.."
      - "А-а... должно быть, Микаса ей всё рассказала."
  - char: "mutsu"
    side: "right"
    text:
      - "Какое счастье, что старшая наставница сообщила мне! Иначе сестренка неизвестно сколько еще скрывала бы всё от меня!"
  - char: "nagato"
    side: "left"
    text:
      - "Говорю же, я не ранена! Просто слегка переутомилась, пара дней покоя — и всё пройдет!"
      - "Микаса в этом не разбирается, так что ее чрезмерная реакция еще понятна. Но ты-то зачем пришла поднимать панику?.."
  - char: "mutsu"
    side: "right"
    text:
      - "Нет! Старшая наставница рассудила абсолютно верно!"
      - "«Слегка переутомилась»?.. Сестренка, ты слишком безрассудна!"
      - "Следующие полгода... нет, год!"
      - "Следующий год сестренка будет послушно сидеть здесь и восстанавливать силы!"
      - "Нет-нет... лучше возвращайся со мной к Священному древу! Местное поместье как раз закончили ремонтировать, там восстановление пойдет куда быстрее!"
  - char: "minazuki"
    side: "left"
    text:
      - "Эм... госпожа Нагато, госпожа Муцу..."
  - char: "nagato"
    side: "right"
    text:
      - "...Минадзуки?.."
      - "Муцу, ты пришла вместе с Минадзуки?.."
  - char: "mutsu"
    side: "left"
    text:
      - "Хм, не то чтобы прямо вместе..."
      - "Мы встретились с Минадзуки на полпути. А так как нам было по пути, я просто подвезла ее. А что такое?.."
  - char: "nagato"
    side: "right"
    text:
      - "Хм... Муцу, ступай пока. У меня с Минадзуки есть важный разговор."
  - char: "mutsu"
    side: "left"
    text:
      - "Сестренка... уж не пытаешься ли ты прикрыться делами, чтобы отвертеться от лечения?.."
  - char: "nagato"
    side: "right"
    text:
      - "Обещаю, план моего восстановления мы с тобой обсудим во всех подробностях чуть позже. А сейчас ступай."
  - char: "mutsu"
    side: "left"
    text:
      - "Слушаюсь, сестренка~"

chapter4:
  rows:
  - char: "minazuki"
    side: "left"
    text:
      - "«Нагато, ты отлично потрудилась во время инцидента с Великим Священным древом»."
  - char: "nagato"
    side: "right"
    text:
      - "Это мой долг как Дитя Богов. Ямато, как сейчас дела у Великого Мудреца?"
  - char: "minazuki"
    side: "left"
    text:
      - "«Где есть обретение, там есть и потеря»."
      - "«Великий Мудрец стала Ундзэн, обретя право свободно ступать по этому миру, но, закономерно, утратила контроль над Ватацуми»."
  - char: "nagato"
    side: "right"
    text:
      - "Я так и думала... Что же с ней будет дальше..."
  - char: "minazuki"
    side: "left"
    text:
      - "«Не тревожься, я уже призвала её к себе, и она уже в пути»."
  - char: "nagato"
    side: "right"
    text:
      - "Отправилась к тебе?.. Так будет лучше всего, теперь я могу быть за нее спокойна."
  - char: "minazuki"
    side: "left"
    text:
      - "«Нагато, дворец может открыться и для тебя. Ты можешь отправиться вместе с ней»."
  - char: "nagato"
    side: "right"
    text:
      - "Прости... В этом мире у меня еще остались незавершенные дела, и я твердо решила больше не убегать."
      - "Погоди... Ямато... ты пытаешься защитить меня?"
      - "Что ты увидела? Что-то должно произойти?"
  - char: "minazuki"
    side: "left"
    text:
      - "«...К сожалению да»."
      - "«Немедленно отзови Дзуйкаку, и пусть Симанто тоже остается подле тебя»."
      - "«Грядет пламя»."
