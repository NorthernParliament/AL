chapter1:
  rows:
  - text:
      - "Перед глазами раскинулась мертвая пустошь."
      - "Под бесконечный мерный лязг механический город безудержно разрастался."
      - "Металлы и неметаллы, природные и искусственные творения, даже сама земля и океан перестраивались по определенному алгоритму."
      - "Некоторые из них становились объектами, бережно сохраняемыми в городе."
      - "Другие же превращались в его неотъемлемую часть."
  - char: "empress"
    side: "left"
    text:
      - "Работа Влюблённых здесь... уже перешла к стадии реорганизации и утилизации."
      - "Кажется, я прибыла как раз вовремя."
      - "С ресурсами целого дополнительного мира в резерве наши шансы на победу должны возрасти..."

chapter2:
  rows:
  - char: "zero"
    side: "left"
    text:
      - "Императрица, испытательный полигон Бета нельзя бросать."
      - "«Системе расчета естественной эволюции» необходимо кое-что проверить на испытательном полигоне Бета. Готовься к оборонительному бою."

chapter3:
  rows:
  - char: "empress"
    side: "left"
    text:
      - "Результаты вычислений показывают, что шансы на победу в этом столкновении ничтожно малы. Это, без всяких сомнений, «ошибочное» решение."
      - "Раз так... неужели замысел Зеро состоит в том, чтобы намеренно совершить ошибку?.."
      - "...В отличие от других моделей Антиоха, Арбитрам позволено совершать «ошибки»."
      - "...Неужели это тоже одна из причин, почему Арбитрам даровали полноценные личности?.."
      - "Хи-хи... На этот вопрос ответа уже не узнать."
  - char: "lovers"
    side: "right"
    text:
      - "Императрица?.. Я прибыла сразу же, как получила твое сообщение."
      - "Дальше мы будем действовать вместе?.."
  - char: "empress"
    side: "left"
    text:
      - "Верно. Тебе предстоит отправиться на внешний периметр испытательного полигона Бета и выстроить линию обороны."
      - "Вместе со мной и местным Исследовательским подразделением мы проведем эксперимент ради Зеро."
  - char: "lovers"
    side: "right"
    text:
      - "Каковы сроки миссии?"
  - char: "empress"
    side: "left"
    text:
      - "Пока Зеро не будет удовлетворена, или пока наши силы не будут полностью уничтожены."
  - char: "lovers"
    side: "right"
    text:
      - "Понятно..."
      - "Хм... Я с превеликой радостью~"
