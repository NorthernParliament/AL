chapter1:
  rows:
  - text:
      - "Незадолго до масштабного хаоса в Тихом Океане, Нагато и её эскорт прибыли в поместье Микасы."
      - "Вокруг царила суета, припасы перетаскивали туда-сюда."
  - char: "kawakaze"
    side: "left"
    text:
      - "Осторожнее, не врежьтесь ни во что. Упакуйте вещи и несите их прямиком на пирс. Убедитесь, что ВСЁ на месте!"
      - "Харуцуки, как продвигаются приготовления? Путь предстоит неблизкий."
  - char: "harutsuki_rad"
    side: "right"
    text:
      - "В-всё хорошо! Корабль, который послала госпожа Мусаси, прибыл и пришвартован у пирса!"
  - char: "kawakaze"
    side: "left"
    text:
      - "Отлично. Спасибо."
  - char: "shoukaku"
    side: "right"
    text:
      - "Это было быстро, учитывая, насколько спешно мы отбываем."
      - "Хотя, возможно, власть имущие это и спланировали."
  - char: "zuikaku"
    side: "left"
    text:
      - "Ауу?.. Госпожа Нагато!"
      - "Эй, Кавакадзэ, не знаешь, где она?"
  - char: "kawakaze"
    side: "right"
    text:
      - "Она в поместье, готовится к путешествию. У тебя к ней дело?"
  - char: "zuikaku"
    side: "left"
    text:
      - "Да, можно и так сказать. Я быстро, обещаю!"

chapter2:
  rows:
  - text:
      - "*тук - тук*"
  - char: "zuikaku"
    side: "left"
    text:
      - "Госпожа Нагато! Это я, Дзуйкаку!"
  - char: "nagato"
    side: "right"
    text:
      - "Дзуйкаку? Входи."

chapter3:
  rows:
  - char: "nagato"
    side: "right"
    text:
      - "Что-то не так с припасами? Полагаю, именно поэтому ты пришла ко мне без предупреждения."
  - char: "zuikaku"
    side: "left"
    text:
      - "Ох, э-э, нет! Я бегло осмотрела пирс, и, кажется, всё в порядке и идёт по графику."
  - char: "nagato"
    side: "right"
    text:
      - "Это хорошо. И? Зачем же ты тогда здесь?"
  - char: "zuikaku"
    side: "left"
    text:
      - "Это по поводу самого путешествия... Тебе не кажется это подозрительным? Оно свалилось как снег на голову."
      - "В Тихом Океане всё идёт своим чередом, но Микаса отправляет тебя и большой флот к Соломоновым островам с кучей припасов."
      - "Если только это не её представление об отпуске, я не понимаю, зачем ей это делать."
  - char: "nagato"
    side: "right"
    text:
      - "Да, мне тоже это кажется странным. Увы, всё, что она мне сказала, это «что-то случилось на Соломонах», и что она хочет, чтобы я немедленно это расследовала."
  - char: "zuikaku"
    side: "left"
    text:
      - "Часть с «немедленно» тоже довольно странная!"
      - "Что, если она знает, что что-то должно произойти на островах Сакуры, и намеренно отсылает тебя подальше?"
      - "Акаги уже делала так однажды, так что это будет не в первый раз."
      - "А ещё был случай, когда мы отправились в Европу, и она выдумала предлог, чтобы заставить меня сделать длинный крюк вокруг мыса Доброй Надежды."
  - char: "nagato"
    side: "right"
    text:
      - "Если бы этот приказ исходил от Мусаси, я бы разделила твои подозрения. Однако Микаса никогда бы не стала вводить нас в заблуждение подобным образом."
      - "Тем не менее, ты можешь быть права в том, что на нашей родине произойдёт нечто важное. Нечто, о чём я остаюсь в неведении."
  - char: "zuikaku"
    side: "left"
    text:
      - "Верно? Вот почему я бы хотела остаться здесь и разобраться в этом!"
  - char: "nagato"
    side: "right"
    text:
      - "Это серьёзная просьба."
  - char: "zuikaku"
    side: "left"
    text:
      - "Я имею в виду, Микаса, по сути, отсылает собственных телохранителей. Кто защитит её, если нас всех не будет?"
  - char: "nagato"
    side: "right"
    text:
      - "Хм..."
  - char: "zuikaku"
    side: "left"
    text:
      - "Плюс, я смогу докладывать тебе напрямую, если замечу что-то подозрительное!"
      - "Пожалуйста! Обещаю, я не буду отлынивать ни минуты!"
  - char: "nagato"
    side: "right"
    text:
      - "...Очень хорошо. В таком случае у меня к тебе будет просьба."
      - "Муцу в последнее время нездоровится. Сходи и навести её от моего имени, прежде чем мы отправимся в путь."
  - char: "zuikaku"
    side: "left"
    text:
      - "А? Э-э, хорошо!"
      - "У меня только один вопрос..."
      - "Сама Муцу знает, что она больна?"
  - char: "nagato"
    side: "right"
    text:
      - "Узнает, когда ты придёшь её навестить. Если нет, подбирай правильные слова, пока она не поймёт намёк."
      - "Если это всё, то тебе пора идти."
  - char: "zuikaku"
    side: "left"
    text:
      - "Поняла! Я тебя не разочарую!"

chapter4:
  rows:
  - char: "nagato"
    side: "right"
    text:
      - "Дерево жаждет покоя, но ветер не утихает..."
      - "Ветеран, я отбываю."
      - "Пожалуйста... не наделай глупостей."
