chapter1:
  rows:
  - text:
      - "Некоторое время спустя Рюдзё вернулась в дом Дзуйхо в компании Хиё и Дзюнъё."
      - "Они играли в игры до глубокой ночи, а затем разошлись по своим спальням."

chapter2:
  rows:
  - text:
      - "Дзуйкаку открыла глаза и увидела запятнанный чернилами стальной пейзаж. Она снова оказалась у Священной Сакуры, когда пыталась пробудить Нагато."
  - char: "kawakaze"
    side: "right"
    status: "is-red"
    text:
      - "Стой! Кто вы такие?!"
  - char: "shoukaku"
    side: "left"
    text:
      - "Мы из Возрождённого Объединённого Флота Империи Сакуры, и мы здесь, чтобы взглянуть на девушку в Священной Сакуре..."
  - char: "zuikaku"
    side: "right"
    text:
      - "(А? Почему я здесь?)"
  - char: "kawakaze"
    side: "left"
    status: "is-red"
    text:
      - "...Покиньте это место. Никто не смеет тревожить сон лисы-хранительницы."
  - char: "mikasa"
    side: "right"
    text:
      - "Кавакадзэ... Значит, ты служишь Амаги."
      - "Мы должны поговорить с ней. Ты нас не пропустишь?"
  - char: "zuikaku"
    side: "left"
    text:
      - "(Погоди... Поговорить с Амаги? Не с госпожей Нагато?)"
  - char: "kawakaze"
    side: "right"
    status: "is-red"
    text:
      - "Лиса-хранительница и так несёт слишком тяжкое бремя."
      - "Я дала ей слово, что никому не позволю тревожить её сон!"
      - "Никому! Даже нашим соотечественницам."
  - char: "shoukaku"
    side: "left"
    text:
      - "Существует такая вещь, как быть СЛИШКОМ упрямой... А что, если мы будем настаивать на встрече с ней?"
  - char: "kawakaze"
    side: "right"
    status: "is-red"
    text:
      - "Если вы пойдёте вперёд вопреки моим предупреждениям, вам лучше приготовиться к бою!"
  - char: "zuikaku"
    side: "left"
    text:
      - "(Что-то здесь не так... Но что?)"
  - char: "shoukaku"
    side: "right"
    text:
      - "Дзуйкаку, сосредоточься! Она атакует!"

chapter3:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "kawakaze"
    side: "right"
    status: "is-red"
    text:
      - "Теперь я вижу, почему вас так почитают и почему у вас столько наград..."
  - char: "mikasa"
    side: "left"
    text:
      - "Ты и сама умелый боец. Я меньшего и не ожидала от помощницы Амаги."
  - char: "shoukaku"
    side: "right"
    text:
      - "*кхе-кхе*... Дзуйкаку, скорее!"
  - char: "kawakaze"
    side: "left"
    status: "is-red"
    text:
      - "Только через мой труп!"
  - char: "zuikaku"
    side: "right"
    text:
      - "Сёкаку! Ветеран!"
      - "(Нет, стоп... Всё было не так!)"
  - text:
      - "БАБАХ!!!"
  - char: "amagi"
    side: "left"
    text:
      - "Кавакадзэ, отступи."
      - "Ты хорошо справилась как мой страж, но я никогда не просила тебя отгонять гостей с такой свирепостью."
      - "Мои искренние извинения всем вам. Кавакадзэ следовало бы лучше сдерживать себя, чтобы не навредить вам."
      - "Пожалуйста, пройдите в моё поместье чуть дальше и займитесь своими ранами."
  - char: "zuikaku"
    side: "right"
    text:
      - "Ты... Ты Амаги, верно?"
      - "Это правда ты?"
  - char: "amagi"
    side: "left"
    text:
      - "Да, это я. Надеюсь, я проспала в Священной Сакуре не настолько долго, чтобы меня все забыли."
  - char: "zuikaku"
    side: "right"
    text:
      - "Ладно, э-э... Приятно познакомиться, наверное..."
      - "Прости, я не могу отделаться от чувства, что что-то не так..."
  - char: "amagi"
    side: "left"
    text:
      - "Не так? Да, теперь, когда ты упомянула об этом, мне тоже кажется, что что-то не сходится."
      - "Что именно, по-твоему, не так?"
  - char: "zuikaku"
    side: "right"
    text:
      - "Это... Кто такая лиса-хранительница..."
      - "И... кто был запечатан здесь..."

chapter4:
  rows:
  - char: "nop"
    side: "left"
    text:
      - "...сыпайся..."
      - "Эй! Просыпайся!"

chapter5:
  rows:
  - char: "zuihou"
    side: "left"
    text:
      - "Наконец-то ты проснулась, соня!"
  - char: "zuikaku"
    side: "right"
    text:
      - "А? Что? Дзуйхо?"
      - "Блин, мне только что приснился самый странный сон на свете... Спасибо, что разбудила меня."
  - char: "zuihou"
    side: "left"
    text:
      - "Если бы сны были единственной странностью прямо сейчас..."
      - "Посмотри в окно! Всё пошло наперекосяк!"
  - char: "zuikaku"
    side: "right"
    text:
      - "Наперекосяк?"
  - text:
      - "Дзуйкаку устремила взгляд на окно. Дзуйхо уже одернула шторы."
      - "Выглянув наружу, она ясно увидела, что происходит."
      - "Деревья съёжились, а все старые здания на улице выглядели совершенно новыми, почти как если бы время пошло вспять."
  - char: "zuikaku"
    side: "right"
    text:
      - "Я ведь... больше не сплю, верно? Почему всё выглядит так, будто мы вернулись в прошлое?"
  - char: "zuihou"
    side: "left"
    text:
      - "Я не знаю, но это не сон! Рюдзё, Хиё и Дзюнъё вышли посмотреть, что случилось, и всё в точности так, как ты сказала!"
  - char: "zuikaku"
    side: "right"
    text:
      - "А как же твой дом? Он тоже вернулся в прошлое?"
  - char: "zuihou"
    side: "left"
    text:
      - "К счастью, нет, потому что  защищён одним из барьеров Ямато."
      - "Видишь ли, дом только что достроили, и Ибуки зашла, чтобы благословить его с..."
  - char: "zuikaku"
    side: "right"
    text:
      - "Кхм."
  - char: "zuihou"
    side: "left"
    text:
      - "Ой, в любом случае, я получила сообщение от Мусаси!"
      - "Очевидно, это иллюзия, и она возникла из-за того, что кто-то проник через Изначальный Барьер."
      - "Она сказала, что скоро всё придёт в норму, и когда это случится, мы должны совершить вылазку и найти нарушителя!"
  - char: "zuikaku"
    side: "right"
    text:
      - "(Ооо! Вот почему Микаса отослала госпожу Нагато так далеко!)"
      - "(Мне нужно быстро собрать разведданные и доложить ей о ситуации!)"
