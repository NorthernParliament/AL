chapter1:
  rows:
  - text:
      - "На Якумояме штурм врага был непрерывным."
  - text:
      - "БАБАХ!!!"
  - char: "ibuki_newyear"
    side: "left"
    text:
      - "Идзумо, все добрались до горы. Закрывай барьер!"
  - char: "izumo"
    side: "right"
    text:
      - "Я не могу! Невозможно запечатать его под таким плотным натиском!"
  - char: "mikasa"
    side: "left"
    text:
      - "Тогда я пойду. Твоя работа станет проще, если я отвлеку их внимание на себя, верно?"
  - char: "izumo"
    side: "right"
    text:
      - "Ветеран Микаса... Ну, да. Снижение плотности атак позволит мне запечатать барьер примерно за 15 минут."
  - char: "mikasa"
    side: "left"
    text:
      - "Поняла!"
      - "Кину, Хатакадзэ, Мацукадзэ, Оитэ. За мной!"

chapter2:
  rows:
  - text:
      - "Группа Микасы устремилась вниз по горной тропе, пронзая орду сущностей из чёрного тумана подобно копью."
  - text:
      - "БАБАХ!!!"
  - char: "matsukaze"
    side: "left"
    text:
      - "Какие странные враги... Они выглядят так, будто сошли прямиком со страниц справочника о ёкаях!"
  - char: "hatakaze"
    side: "right"
    text:
      - "Лисы, кролики, рыбы, утки, даже рогатые демоны..."
      - "Хех. По крайней мере, здесь нет никаких жуков."
  - char: "oite"
    side: "left"
    text:
      - "И хорошо. Если бы тут были жуки такого размера... Угх, от одной мысли об этом меня бросает в дрожь!"
  - char: "kinu"
    side: "right"
    text:
      - "(Они все просто отшучиваются. Я что, единственная серьёзная здесь?)"
  - char: "mikasa"
    side: "left"
    text:
      - "Это навевает воспоминания. Сколько времени прошло с тех пор, как мы в последний раз сражались все вместе?"
  - char: "hatakaze"
    side: "right"
    text:
      - "Излишняя сентиментальность лишь выдаёт твой возраст, Микаса."
      - "Кроме того, мы же сражались вместе во время игры Мусаси, помнишь?"
  - char: "mikasa"
    side: "left"
    text:
      - "Это не в счёт. Мацукадзэ и Оитэ там не было."
  - char: "hatakaze"
    side: "right"
    text:
      - "Ахаха... Справедливо."
  - char: "mikasa"
    side: "left"
    text:
      - "(Если столько врагов атакуют Якумояму...)"
      - "(Должно быть, это означает, что Мусаси выполнила свою часть уговора.)"

chapter3:
  rows:
  - char: "ibuki_newyear_rad"
    side: "left"
    text:
      - "Ветеран Микаса, ритуал запечатывания почти завершён. Немедленно возвращайтесь!"
  - char: "mikasa"
    side: "right"
    text:
      - "Поняла! Я остановлю Акаги, клянусь!"
  - char: "kinu"
    side: "left"
    text:
      - "Гах... Наконец-то всё, да? Они, может, и слабы, но сражаться с таким огромным количеством — задача не из лёгких!"
  - char: "oite"
    side: "right"
    text:
      - "Приближается следующая волна. Ветеран Микаса, давайте поспешно отступим."
  - char: "mikasa"
    side: "left"
    text:
      - "Вы все слишком изранены, чтобы двигаться на полной скорости. Идите вперёд."
      - "Я останусь здесь и прикрою вас."
  - char: "matsukaze"
    side: "right"
    text:
      - "М-Микаса, ты хоть слышишь, что говоришь?!"
  - char: "mikasa"
    side: "left"
    text:
      - "Это приказ! Или вы хотите увидеть, как мы все пойдём ко дну прямо здесь и сейчас?"
  - text:
      - "Микаса бросила взгляд назад на своих раненых подруг, а затем снова сосредоточила внимание на враге."
      - "Затем, с бесстрашной ухмылкой, она бросилась в тёмный поток."

chapter4:
  rows:
  - text:
      - "Орудийный огонь и взрывы пронеслись по полю боя, разметая чёрный туман."
      - "К этому моменту Микаса уже даже не могла сосчитать раны на своём теле и оснастке."
      - "Она продолжала сражаться, движимая лишь силой воли и инстинктами, разрушая ряды вражеской армии изо всех сил."
  - char: "mikasa"
    side: "left"
    text:
      - "(Отчаянная битва. Разница между нашими и их силами просто безумна.)"
      - "(В последний раз я чувствовала нечто подобное... когда впервые сражалась с Сиренами.)"
      - "(Полагаю, теперь всё наоборот, после всех тех раз, когда мне удавалось взять над ними верх...)"
      - "У меня было столько возможностей остановить Акаги силой и уйма шансов переубедить Мусаси...)"
      - "(Но я не стала действовать. Потому что хотела, чтобы всё было по-моему.)"
      - "(Быть ветераном, который из тени поддерживает следующее поколение лидеров Империи Сакуры.)"
      - "(Моим самым большим сожалением была потеря тебя, Амаги.)"
      - "(Я хочу снова увидеть тебя, послушать твои стратегии и поиграть с тобой в игры...)"
      - "(Теперь я понимаю. Вот почему я не остановила Акаги...)"
      - "(Ха-ха-ха... Полагаю, в конце концов, это был закономерный конец.)"
      - "(Барьер Якумоямы теперь запечатан. Боевые силы Империи Сакуры были сохранены настолько, насколько вообще можно было надеяться.)"
      - "(Нагато... Прости, что была таким эгоистичным примером для подражания.)"
      - "(Остальное... всё зависит от тебя.)"

chapter5:
  rows:
  - text:
      - "Прежде чем её зрение поглотила тьма, Микаса увидела стайку бабочек, сиявших подобно утреннему солнцу."
