chapter1:
  rows:
  - char: "zuikaku"
    side: "left"
    text:
      - "Кхе-кхе... Голова кружится..."
      - "Неужели телепортация во владения священного дерева всегда такая неприятная? Кхе..."
      - "Похоже... это, должно быть, круг в центре ритуала."
  - text:
      - "Небо было тёмно-красным, а землю устилало море красных паучьих лилий."
      - "Горный ручей был подобен реке Сандзу, над ним плясали тусклые, призрачно-синие огоньки."
      - "Ощутимая энергия струилась по воздуху и вливалась в огромное иссохшее дерево."
  - char: "zuikaku"
    side: "left"
    text:
      - "Жутко... Лучше поскорее найти Мусаси, и побыстрее!"
  - text:
      - "Дзуйкаку тотчас же выпустила разведывательные самолёты. Среди зарослей лилий она заметила Мусаси."

chapter2:
  rows:
  - char: "zuikaku"
    side: "left"
    text:
      - "Фух, я нашла тебя. Мусаси, позволь мне пойти с тобой!"
  - char: "musashi"
    side: "right"
    text:
      - "...Дзуйкаку? Не думала, что ты придёшь сюда, да ещё и так быстро."
      - "Как тебе это удалось?"
  - char: "zuikaku"
    side: "left"
    text:
      - "С помощью этого талисмана из фрагмента Ватацуми! Дзуйхо сказала, что Симанто дала его ей."
  - char: "musashi"
    side: "right"
    text:
      - "Понятия не имела, что подобная вещь осталась на главном острове..."
      - "Судя по этой слабой золотой ауре вокруг тебя, у тебя, должно быть, есть и то, что Ямато когда-то дала ей."
  - char: "zuikaku"
    side: "left"
    text:
      - "Золотая аура?.."
  - text:
      - "Дзуйкаку наконец обратила внимание на то, что всё её тело излучает золотой свет."
  - char: "musashi"
    side: "right"
    text:
      - "Этот талисман можно использовать лишь однажды. Раз уж ты применила его, чтобы попасть сюда, вернуться домой будет не так просто."
      - "Уверена, ты здесь, чтобы остановить меня, но я не брошу тебя одну ради собственного возвращения."
  - char: "zuikaku"
    side: "left"
    text:
      - "Давай остановим Акаги вместе!"
      - "Не знаю, какие опасности нас ждут, но знаю, что кто-то должен что-то сделать!"
  - char: "musashi"
    side: "right"
    text:
      - "...Очень хорошо. С твоим присутствием мои шансы на успех возросли."
  - char: "zuikaku"
    side: "left"
    text:
      - "Что будем делать дальше?"
  - char: "musashi"
    side: "right"
    text:
      - "Есть два способа остановить ритуал."
      - "Либо мы побеждаем Акаги в центре круга..."
      - "...Либо пробиваем его защитный барьер и открываем его внешнему миру."
      - "Именно так я и собиралась поступить изначально."
  - char: "zuikaku"
    side: "left"
    text:
      - "А? Ты не собиралась останавливать Акаги?"
  - char: "musashi"
    side: "right"
    text:
      - "Ритуал накопил колоссальную мощь. Если мы его не остановим, её сила будет только расти по мере нашего приближения к центру."
      - "Забудь о победе над ней, одно лишь приближение к ней потребует огромных сил."
      - "Хотя прорыв защитного барьера сам по себе не остановит ритуал, он откроет нам новый путь для действий."
      - "Ритуальный барьер слился с Изначальным Барьером, защищающим Империю Сакуры."
      - "Пробив его, мы, по сути, создадим путь наружу."
      - "Это позволит нам объединить силы с нашими союзниками снаружи, но это ещё не всё."
      - "В случае крайней необходимости его также можно будет использовать как путь к отступлению."
  - char: "zuikaku"
    side: "left"
    text:
      - "Тогда позволь мне помочь тебе в бою, Мусаси!"
  - char: "musashi"
    side: "right"
    text:
      - "...Нет. Ты должна отправиться к Акаги."
  - char: "zuikaku"
    side: "left"
    text:
      - "А? Но разве ты только что не сказала, что там она будет сильнее? И что даже просто добраться туда будет очень тяжело?"
  - char: "musashi"
    side: "right"
    text:
      - "Только если она сможет обрушить на тебя всю свою мощь."
      - "Пока я буду занята пробиванием брешей в её барьере, она будет вынуждена сосредоточить своё внимание на мне."
      - "Воспользуйся этой возможностью, чтобы приблизиться к ней."
      - "Благодаря тому, что дали тебе Ямато и остальные, на какое-то время коррозия будет для тебя незначительной."
  - char: "zuikaku"
    side: "left"
    text:
      - "Поняла! Я остановлю Акаги, клянусь!"
  - char: "musashi"
    side: "right"
    text:
      - "Хе-хе. Вот это настрой."

chapter3:
  rows:
  - char: "musashi"
    side: "right"
    text:
      - "«Этим ударом я расчищаю твой путь вперёд»."
  - text:
      - "Фиолетовые молнии вырвались из оружия Мусаси."
      - "Они сформировали шлем, руки, торс, пока не превратилось в гигантские, но пустые доспехи, высотой, возможно, с сотню метров."
  - char: "zuikaku"
    side: "left"
    text:
      - "Что это?!"
  - char: "musashi"
    side: "right"
    text:
      - "...Кхм. Считай это козырем, который я приберегла для сегодняшнего дня."
      - "А теперь, Дзуйкаку, приготовься."
      - "«Грозовая туча в отражении озера, моим небесным клинком, высвободи свою молнию»."
      - "«Рассекай!»"
  - text:
      - "Доспехи взмахнули мечом к небу, рассекая барьер подобно небу и земле."
      - "В ответ на удар Мусаси на горизонте появились бесчисленные демоны."
      - "Орда монстров спустилась как с неба, так и из моря, подобно волне чистого хаоса."
  - char: "zuikaku"
    side: "left"
    text:
      - "Э-э, что это такое?!"
  - char: "musashi"
    side: "right"
    text:
      - "...Они здесь, чтобы не дать тебе приблизиться к Акаги."
      - "Позволь мне нанести ещё один удар и расчистить для тебя путь."
      - "«Тысяча молний, пронзающих звёзды, моим небесным клинком, очистите небеса»."
      - "«Рассекай!»"
  - text:
      - "Её удар рассёк волну демонов надвое, прорубив путь, достаточный для прохода кансен."
  - char: "musashi"
    side: "right"
    text:
      - "Кхе-кхе... Ургх!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Мусаси? Ты в порядке?!"
  - char: "musashi"
    side: "right"
    text:
      - "Забудь обо мне! Ты должна спешить к Акаги!"
  - char: "zuikaku"
    side: "left"
    text:
      - "...Поняла! Удачи, Мусаси!"
