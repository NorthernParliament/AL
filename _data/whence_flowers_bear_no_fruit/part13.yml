chapter1:
  rows:
  - text:
      - "После завершения ритуала разрыв между материальным миром и вечностью должен был быть преодолён."
      - "Но ожидаемое возрождение, долгожданное воссоединение так и не состоялось."
  - char: "akagi"
    side: "left"
    text:
      - "«Когда распустится сакура, Амаги вновь появится из моря цветов»."
      - "Хех. Хе-хе... Ахахаха..."
      - "Ха-ха-ха-ха-ха!"
      - "Ничего не произошло... Совсем ничего."
      - "Я думала, что готова ко всему, но это?.. Такого я не могла и представить..."
      - "Всё, что я возродила, это проклятое дерево, а не моя сестра?.."
      - "О, какой ужас... Хе-хе, хе-ха-ха-ха..."
  - text:
      - "Она сжала в кулаке украшение, оставленное Кагой, так сильно, что рука закровоточила."
  - char: "akagi"
    side: "left"
    text:
      - "Теперь я вспоминаю... Даже тогда, в битве при AF, Амаги защитила меня..."
      - "Вот почему моё исчезло... а Каги всё ещё здесь..."
      - "Снова спасена моей сестрой..."
      - "Потеряла последнее, что она оставила для меня..."
      - "Ахаха... Амаги ушла навсегда. Я больше никогда её не увижу."
      - "Амаги ушла, Кага ушла, они все ушли..."
      - "Никто больше не защитит меня..."
      - "Никто..."
      - "Ахаха... Ахахаха..."
      - "Кага... Ты была такой глупой девочкой."
      - "Я сходила с ума. Почему ты не попыталась остановить меня?"
      - "Я бы даже не заподозрила тебя. Если бы ты хотела остановить меня..."
      - "Это было бы... Это было бы так легко..."
      - "Кага... Ох, Кага..."
      - "Почему это должно было случиться?"
  - text:
      - "Волна монстров из чёрного тумана замаячила на горизонте."
  - char: "akagi"
    side: "left"
    text:
      - "...Я поняла. Я вам больше не нужна, так что вы пришли вынести мусор."
      - "Хорошо. Если я не смогу снова увидеть их в этом мире..."
      - "Кага, Амаги... Я приду повидаться с вами на той стороне."

chapter2:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "akagi"
    side: "left"
    text:
      - "Что?.. Палубная авиация?!"
  - char: "zuikaku"
    side: "right"
    text:
      - "Акаги... Акагиии!.. Ты меня слышишь?!"
      - "Коррозия повсюду! Этот ритуал пойдёт не так, как ты хочешь! Поспеши и останови его!"
  - char: "akagi"
    side: "left"
    text:
      - "Дзуйкаку? Но Мусаси помогла ей сбежать. Почему она..."
  - text:
      - "БАБАХ!!!"
  - text:
      - "Самолёты Дзуйкаку были не единственными. Ещё больше приближалось издалека."
      - "Когда Акаги внимательно посмотрела на угол, под которым они приближались, стало ясно, что они хлынули из разлома, созданного Мусаси."
  - char: "ryuuhou"
    side: "left"
    text:
      - "Акаги! Я привела флот, чтобы спасти тебя! Скажи что-нибудь, Акаги!"
  - char: "akagi"
    side: "right"
    text:
      - "Рюхо?!"
  - char: "communicator"
    side: "left"
    text:
      - "БИП-БИП!"
  - char: "akagi"
    side: "right"
    text:
      - "Рюхо! Зачем ты вернулась?!"
  - char: "ryuuhou_rad"
    side: "left"
    text:
      - "Ох, слава богу, ты в безопасности!"
      - "Госпожа Нагато здесь. И подкрепление из-за границы тоже!"
  - char: "akagi"
    side: "right"
    text:
      - "Нагато? И остальные?"
  - char: "zuikaku_rad"
    side: "left"
    text:
      - "Да! Она вернулась с флотами отовсюду!"
      - "Ещё не поздно! Если мы уничтожим ритуальный круг, то всё ещё сможем всё исправить!"
  - char: "akagi"
    side: "right"
    text:
      - "Исправить? Ха-ха-ха... Нет, слишком поздно... Что теперь исправлять?"
      - "Все мои планы, все мои интриги, вся моя подготовка... ради чего, собственно?"
      - "Я предала свою страну и своих друзей... Что мне теперь остаётся?!"
  - char: "zuikaku_rad"
    side: "left"
    text:
      - "«Что остаётся»?.. Всё! Или ты собираешься махнуть рукой и на живых тоже?!"
  - char: "nagato_rad"
    side: "right"
    text:
      - "Молчать, вы обе! Вы не должны разрушать ритуальный круг!"
  - char: "zuikaku_rad"
    side: "left"
    text:
      - "Госпожа Нагато?!"
  - char: "nagato_rad"
    side: "right"
    text:
      - "Теперь, когда ритуал завершён, Сингулярность Нарака уже проявилась."
      - "Уничтожение круга сейчас лишь сделает всё непоправимым!"
      - "Акаги, ты не ошибаешься. В своём ты была уме или нет, но ты причинила боль Империи Сакуры, своим друзьям и, прежде всего, самой себе."
      - "Да, тобой овладела одержимость, но именно твоя любовь оставила тебе один последний путь."
      - "Ступи на этот путь, и, возможно, ты сможешь сделать больше, чем просто спасти Амаги."
      - "Ты, возможно, сможешь отменить причинённый тобой ущерб и принесённые жертвы."
  - char: "akagi"
    side: "left"
    text:
      - "Ты имеешь в виду... мою... любовь?.."
  - char: "nagato_rad"
    side: "right"
    text:
      - "Конечно. Я не лгу."
      - "И тот, кто открыл нам эту возможность, был не кто иной, как..."
      - "Наш Командир."
