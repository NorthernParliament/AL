chapter1:
  rows:
  - text:
      - "Нагато и её флот отправились к Соломоновым островам в связи с внезапной передислокацией."
      - "Однако прямо перед этим Дзуйкаку навестила Муцу, и та внезапно «заболела»."
      - "Поскольку сестре лисы-хранительницы требовалась сиделка, Дзуйкаку разрешили остаться на родной земле."

chapter2:
  rows:
  - char: "zuikaku"
    side: "left"
    text:
      - "Фух... Теперь, когда госпожа Нагато отправилась в путь, Акаги и её сообщницы, должно быть, ослабили бдительность."
      - "Это даст мне немного времени, чтобы поработать беспрепятственно."
      - "Наконец-то у меня появилась прекрасная возможность как следует расследовать, что они замышляют!"
      - "...А? Это что... Мусаси и её огромный транспортный флот? И Микаса с ними?"
      - "Я знала, что устроить здесь засаду было правильным решением."
      - "Отлично. Если я прослежу за ними, то должна выяснить, куда они направляются!"

chapter3:
  rows:
  - text:
      - "Якумояма издавна славилась как место для осмотра достопримечательностей."
      - "Однако доступ туда был закрыт с тех пор, как объявили священным местом после последней Великой войны."
      - "Дзуйкаку тайно следовала за Мусаси и Микасой по горной тропе, пока те проходили через несколько контрольно-пропускных пунктов по пути."
      - "Затем ей оставалось лишь наблюдать, как их силуэты скрылись вдалеке."
  - char: "zuikaku"
    side: "left"
    text:
      - "Вряд ли кто-то бывал здесь с тех пор, как это место объявили священным..."
      - "По какой причине им здесь находиться? Особенно с таким огромным конвоем..."
      - "Слишком много охранников. Я не смогу идти за ними дальше, чтобы меня не заметили. Полагаю, мне придётся остановиться здесь..."
  - char: "zuihou"
    side: "right"
    text:
      - "Чирик-чирик! Эй ты, прячущаяся в лесу! Выходи! Я знаю, что ты там!"
  - char: "zuikaku"
    side: "left"
    text:
      - "(Чёрт! Это Дзуйхо.)"
      - "(Я так сосредоточилась на конвое, что забыла обратить внимание на то, что происходит у меня за спиной...)"
  - char: "zuihou"
    side: "right"
    text:
      - "Ты меня слышала? Выходи сейчас же, или я позову охрану! У тебя десять секунд!"
  - char: "zuikaku"
    side: "left"
    text:
      - "(Проклятье... У меня ТОЧНО будут неприятности, если она продолжит так кричать!)"
      - "(А, к чёрту. Она всё равно меня уже увидела.)"
      - "(Я могу просто придумать какое-нибудь оправдание для Дзуйхо. Если повезёт, она даже поможет с расследованием.)"

chapter4:
  rows:
  - char: "zuikaku"
    side: "left"
    text:
      - "Тшш! Потише!"
      - "Я не кто-то подозрительный! Это я, Дзуйкаку!"
  - char: "zuihou"
    side: "right"
    text:
      - "Чирик? Дзуйкаку?"
      - "Почему ты пряталась в кустах?"
      - "Нашла там что-то интересное?"
  - char: "zuikaku"
    side: "left"
    text:
      - "В кустах нет ничего интересного, малая. Но я ВЫПОЛНЯЮ интересное задание. Хочешь узнать какое?"
  - char: "zuihou"
    side: "right"
    text:
      - "Ого! Интересное задание! Рассказывай!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Хех. Ну, короче говоря..."

chapter5:
  rows:
  - char: "zuihou"
    side: "right"
    text:
      - "Ооо, я поняла! Ты здесь, чтобы осмотреть достопримечательности вокруг горы!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Это не «осмотр достопримечательностей», это расследование!"
      - "Я выслеживаю Мусаси и Микасу, стараясь оставаться незамеченной. Звучит довольно весело, не так ли?"
  - char: "zuihou"
    side: "right"
    text:
      - "Ага! Ещё как!"
      - "Вот почему ты пряталась в кустах, да? Потому что не могла пробраться на гору?"
  - char: "zuikaku"
    side: "left"
    text:
      - "Угу. Но ты же умная, и все тебя любят, Дзуйхо. Ты должна знать, как туда попасть, верно?"
  - char: "zuihou"
    side: "right"
    text:
      - "Знаю! Сирануи дала мне записку, которая пропускает меня через все КПП, так как я пришла к ней!"
      - "Если хочешь пойти со мной, прячься в повозке. Я провезу тебя втайне!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Ты правда сделаешь это ради меня? Огромное спасибо!"
  - char: "zuihou"
    side: "right"
    text:
      - "Хи-хи! Не за что!"

chapter6:
  rows:
  - text:
      - "Благодаря этому клочку бумаги следить за Микасой и Мусаси для Дзуйкаку стало гораздо проще."
      - "После того как они с Дзуйхо прошли по горной тропе до самого конца, они наткнулись на скромное, но величественное деревянное здание."
  - char: "zuihou"
    side: "left"
    text:
      - "Если Мусаси и Микаса здесь, чтобы поговорить, они, вероятно, делают это вон в том месте."
      - "А теперь мне нужно идти к Сирануи, так что тебе пора вылезать."
      - "Встретимся здесь снова, когда захочешь уйти! Я отвезу тебя обратно с горы!"

chapter7:
  rows:
  - text:
      - "Следуя по пути, который указала Дзуйхо, Дзуйкаку быстро добралась до боковой части здания."
  - char: "zuikaku"
    side: "left"
    text:
      - "Чёрт. Я едва могу разобрать хоть слово, потому что стены плохо проводят звук."
      - "Но это определённо голоса Микасы и Мусаси..."
      - "Если они просто хотели поговорить, зачем им забираться в такую глушь?"
      - "Хм? Там есть кто-то ещё?"
      - "Это... Идзумо?"
      - "Что она сказала? «Работать вместе»? Над чем?"
      - "Угх, я их не слышу... Вот бы пробраться внутрь!"

chapter8:
  rows:
  - char: "nop"
    side: "left"
    text:
      - "Не думай, что я не вижу, как ты подслушиваешь!"
  - text:
      - "Без малейшего предупреждения кто-то сзади закрыл Дзуйкаку глаза."
  - char: "nop"
    side: "left"
    text:
      - "Угадай, кто!"
  - char: "zuikaku"
    side: "right"
    text:
      - "Дзуйхо! Прекрати!"

chapter9:
  rows:
  - char: "zuihou"
    side: "left"
    text:
      - "Чирик! Ты и правда угадала с первой попытки!"
  - char: "zuikaku"
    side: "right"
    text:
      - "Тшш! Потише! И не пугай меня так..."
  - char: "zuihou"
    side: "left"
    text:
      - "Всё в порядке! Изнутри нас не услышат."
      - "Как прошло твое расследование? Узнала что-нибудь?"
  - char: "zuikaku"
    side: "right"
    text:
      - "Узнала КОЕ-ЧТО, но не могу говорить об этом здесь. А что? Ты уже покидаешь гору?"
  - char: "zuihou"
    side: "left"
    text:
      - "Ага! Сирануи сказала, что у неё появились дела, так что она не сможет со мной поиграть. А ты останешься?"
  - char: "zuikaku"
    side: "right"
    text:
      - "Нет, думаю, я тоже уйду. Пойдём."

chapter10:
  rows:
  - char: "zuihou"
    side: "left"
    text:
      - "Идзумо? Та девушка корабль-прототип?"
      - "Не думаю, что её присутствие здесь НАСТОЛЬКО странное."
  - char: "zuikaku"
    side: "right"
    text:
      - "Не думаешь?"
  - char: "zuihou"
    side: "left"
    text:
      - "Я слышала, она посещает религиозные церемонии, а это священная гора, так что..."
  - char: "zuikaku"
    side: "right"
    text:
      - "Хмм. Может быть, она просто оказалась здесь случайно."
  - char: "zuihou"
    side: "left"
    text:
      - "Я бы не заходила так далеко. Возможно, она страж горы или работает здесь."
      - "Потому что Мусаси и Микаса не стали бы забираться в такую даль, если бы её тут не было."
      - "Они могли бы просто позвонить ей или попросить Идзумо навестить их вместо этого, понимаешь?"
  - char: "zuikaku"
    side: "right"
    text:
      - "Верно. Если бы телефонный звонок был исключён, у этих двоих такое высокое положение, что они могли бы просто заставить Идзумо приехать к ним."
      - "Но, если Идзумо по какой-то причине не может покинуть гору, то какое отношение она имеет к тому, что они замышляют?"
  - char: "zuihou"
    side: "left"
    text:
      - "Тшш! Едут ещё повозки!"
  - text:
      - "Дзуйхо подала Дзуйкаку знак спрятаться, а затем быстро побежала поговорить с водителем во главе колонны."
      - "Дзуйкаку наблюдала за проезжающими повозками и заметила маленькие флажки, развевающиеся над их фонарями."
      - "Они были синими и на них красовалась своеобразная эмблема — эмблема Тосы."
  - char: "zuihou"
    side: "left"
    text:
      - "Ладно, я вернулась."
  - char: "zuikaku"
    side: "right"
    text:
      - "Ты видела эти флаги? Это был кортеж Тосы, не так ли?"
  - char: "zuihou"
    side: "left"
    text:
      - "Угу! Насыщенный выдался вечер."
      - "И что с того? Ты ведь не думаешь вернуться и снова подслушивать?"
  - char: "zuikaku"
    side: "right"
    text:
      - "Нет, ни в коем случае. Это вызвало бы слишком много подозрений."
      - "Уже темнеет. Давай выбираться отсюда!"
