chapter1:
  rows:
  - text:
      - "Собрание в гостиной подходило к концу."
  - char: "musashi"
    side: "left"
    text:
      - "Барьер в поместье достигает критического уровня, а коррозия МЕТА только усиливается."
      - "Я понимаю твои чувства, Ветеран Микаса, но у нас не осталось времени на подготовку запасного плана."
  - char: "mikasa"
    side: "right"
    text:
      - "Возможно, и нет, но..."
  - char: "musashi"
    side: "left"
    text:
      - "Изначальный Барьер не пропустит никого внутрь, пока идёт ритуал. Мы... нет, вся наша страна... будет полностью изолирована."
      - "Никакая помощь извне не придёт, пока мы не откроем брешь изнутри."
      - "Ритуальный круг Акаги переместился от Изначальной Сакуры в мою сферу влияния во Дворце Дракона."
      - "Используя связь между Ватацуми и кораблями типа Ямато, я могу переместиться прямо в круг."
      - "Микаса, я доверяю тебе заботу о наших товарищах."
      - "В идеале, я смогу остановить ритуал Акаги сама..."
      - "Но, в случае моей неудачи, я пробью дыру в барьере. И тогда настанет время для тебя осуществить свой план."
      - "А пока терпеливо жди и береги силы."
      - "Что бы со мной ни случилось, у вас есть госпожа Нагато, Синано и множество других способных союзников. Будущее Империи Сакуры сегодня не будет потеряно."
      - "На этом всё."
  - text:
      - "Мусаси единолично приняла решение, встала и ушла."

chapter2:
  rows:
  - char: "zuikaku"
    side: "left"
    text:
      - "Значит, Мусаси была на стороне Акаги, но, полагаю, не она стала причиной всего этого..."
      - "И теперь она хочет остановить безумие Акаги в одиночку?"
      - "...А? Кто-то выходит из комнаты?"
      - "Ой, чёрт!"

chapter3:
  rows:
  - char: "musashi"
    side: "right"
    text:
      - "......"
  - char: "zuikaku"
    side: "left"
    text:
      - "Эмм... Привет, Мусаси..."
  - char: "musashi"
    side: "right"
    text:
      - "Ты хорошо потрудилась сегодня. Продолжай в том же духе."
  - char: "zuikaku"
    side: "left"
    text:
      - "Конечно! Спасибо!"
  - text:
      - "После этого Мусаси ушла, не сказав больше ни слова."
  - char: "zuikaku"
    side: "left"
    text:
      - "Ааа! У меня всё вылетело из головы, когда она вышла... Я забыла, что мне нужно было её остановить!"
      - "Сила скверны, должно быть, наиболее могущественна в ритуальном круге... Я не могу позволить ей пойти туда одной!"
      - "Знаю! Я пойду расскажу всем, и мы придумаем план!"

chapter4:
  rows:
  - text:
      - "Дзуйкаку выбежала из коридора и нашла Дзуйхо, которая дежурила в одной из частей поместья."
      - "Услышав новости, даже жизнерадостная птичка задумалась."
  - char: "zuikaku"
    side: "left"
    text:
      - "В любом случае, нам нужно отправиться в этот Дворец Дракона и остановить Мусаси..."
  - char: "zuihou"
    side: "right"
    text:
      - "Чирик... Круг Акаги находится там, верно?"
      - "О! Однажды Синано подарила мне миниатюрную модель дворца! Надеюсь, это как-то поможет."
      - "А ещё Мусаси сказала, что только корабли типа Ямато могут туда телепортироваться, потому что у них есть связь с Ватацуми, да?"
      - "Хотя я слышала, что госпожа Нагато и Симанто могут делать то же самое..."
      - "О, я знаю! Совсем недавно я спросила Симанто, как телепортироваться во владениях священного дерева, и она дала мне этот талисман!"
      - "Она сказала, что он очень ценный, потому что сделан из фрагмента Ватацуми... Может быть, ты сможешь использовать его, чтобы сделать то же самое!"
      - "Чирик! Хорошо, что я так бережно о нём заботилась. Теперь я действительно могу тебе помочь!"
      - "Держи, Дзуйкаку! Используй его и иди догони её!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Оу, спасибо! Вот только... есть одна проблема."
      - "Просто бежать туда с пустыми руками звучит как плохая затея. В смысле, это место полно всякой дряни. Там даже могут быть враги."
      - "Думаю, мне нужно подготовиться. Оружие, снаряжение, талисманы, всё в таком духе..."
      - "К тому же, это повысит мои шансы на победу, если мне придётся сойтись в бою с Акаги!"
  - char: "zuihou"
    side: "right"
    text:
      - "Чирик! Предоставь это мне!"

chapter5:
  rows:
  - char: "zuihou"
    side: "right"
    text:
      - "Посмотрим... Это от Ундзэн..."

chapter6:
  rows:
  - char: "zuihou"
    side: "right"
    text:
      - "Это я получила от Ибуки..."

chapter7:
  rows:
  - char: "zuihou"
    side: "right"
    text:
      - "А это мне дала Микаса... Это от госпожи Нагато... И Ямато, и Мусаси..."

chapter8:
  rows:
  - char: "zuihou"
    side: "right"
    text:
      - "Это от Акаги... Одно от Каги, одно от Тосы... Хосё..."

chapter9:
  rows:
  - char: "zuihou"
    side: "right"
    text:
      - "Хмм... Хрмм..."

chapter10:
  rows:
  - text:
      - "Одну за другой Дзуйхо достаёт всякую всячину и загромождает ею стол."
  - char: "zuikaku"
    side: "left"
    text:
      - "(Е-есть ли хоть кто-то в стране, кто ничего ей не дарил?)"
      - "(С Дзуйхо определённо стоит считаться!)"
