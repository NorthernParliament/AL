black_scene:
  - "Острова Сакуры"
  - "Поместье Микасы"
  - "23 июля"

black_scene1:
  - "«Бутон прекрасного сна распускается»."
  - "«Точки становятся линиями, линии становятся маской»."
  - "«Сегодня ночью ты наденешь её и войдёшь в сон»."

black_scene2:
  - "«На бескрайнем багровом поле сбиваются в кучу дрейфующие фантомы»."
  - "«Образы потерянных друзей и старые сказки заполняют разум»."
  - "«Амаги, моя дорогая сестра... Ты ведь никогда по-настоящему не уходила, верно?»"

black_scene3:
  - "«Начиная от ядра Священной Сакуры...»"
  - "«Бодрствующий и спящий миры поменяются местами»."
  - "«Амаги, давай расширим наш мир до новых горизонтов»."

black_scene4:
  - "«Клин был вбит, а концепция — закреплена»."
  - "«Круг завершён и готов к началу ритуала»."
  - "«Скоро, моя дорогая сестра. Скоро»."

black_scene5:
  - "«Истина. Ложь»."
  - "«То, что схоже по форме. То, что подобно по духу»."
  - "«Всего один шаг...»"

black_scene6:
  - "«Река Сандзу, цветущие паучьи лилии»."
  - "«Вбери в себя вечность и сожги небеса»."
  - "«Сестра... Наконец-то пора...»"

black_scene7:
  - "В конце ритуала Сингулярность Нарака появилась в мире смертных."
  - "Её мечты и желания были разрушены отчаянием."
  - "Но одна надежда засияла на окровавленном горизонте."
  - "Надежда на то, что усилия могут быть вознаграждены."
  - "Надежда на то, что посеянное наконец-то удастся пожать."
  - "Война, спасение и искупление продолжаются в бесконечном цикле."
  - "И этот далёкий звук продолжает эхом разноситься среди звёзд."

black_scene8:
  - "Продолжение следует"