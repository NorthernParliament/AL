chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "mikasa"
    side: "left"
    text:
      - "Дзуйхо, ты в порядке?!"
  - char: "zuihou"
    side: "right"
    text:
      - "Ветеран! У нас всё хорошо. Пожалуйста, помоги Хиё и Дзюнъё!"

chapter2:
  rows:
  - char: "hiyou_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Кх... Я схожу с ума. Я хочу что-нибудь разрубить!"
  - char: "junyou_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Мир горит... Ахахаха! Да, пусть всё сгорит!"

chapter3:
  rows:
  - char: "mikasa?"
    side: "left"
    text:
      - "Подождите-ка секунду! Дзуйхо, Дзуйкаку!"
      - "Вы хотите сказать, что эти корабли МЕТА из нашей ветви... НАШИ Хиё и Дзюнъё?"
  - char: "zuihou"
    side: "right"
    text:
      - "Мгхм... Д-да... В общем..."
  - char: "zuikaku"
    side: "left"
    text:
      - "Когда мы получили твои приказы, то немедленно вышли в море, чтобы встретиться с Кацураги."
      - "Но как только мы отошли от берега, Хиё и Дзюнъё стало хуже."
      - "Они сказали, что слышат голоса, а потом увидели странные фигуры..."
      - "Когда Дзуйхо попыталась их осмотреть, их внезапно окутал чёрный туман, а затем... произошло ЭТО."
      - "Однажды я видела, как то же самое случилось с U-556, когда я сопровождала Железную Кровь на задании..."
      - "Должно быть, здесь в воде есть что-то, что подвергает кансен коррозии и превращает их в МЕТА!"
      - "Ветеран, мы должны вернуть их на сушу!"
  - char: "mikasa"
    side: "right"
    text:
      - "Согласна, но... Почему ты здесь, а не с Нагато?"
  - char: "zuikaku"
    side: "left"
    text:
      - "Аааа! Эмм, госпожа Муцу больна, поэтому госпожа Нагато приказала мне..."
  - char: "mikasa"
    side: "right"
    text:
      - "Я поняла, поняла! Ладно, я пойду сообщу всем об отступлении!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Ветеран... Спасибо!"
      - "И ещё кое-что!"
      - "Коррозия здесь не такая сильная, как в тот раз, когда я увидела её впервые. Они зашли не так далеко, как U-556!"
      - "Если мы сможем нейтрализовать их обеих и очистить коррозию, то должны суметь привести их в чувство!"
      - "Королевский Флот и Ортодоксия уже добивались успеха в этом. Я знаю, мы тоже сможем!"
  - char: "mikasa"
    side: "right"
    text:
      - "Это здорово. Но если мы хотим их нейтрализовать..."
  - char: "zuihou"
    side: "left"
    text:
      - "У меня есть отличная идея!"
      - "Ямасиро дала мне этот парализующий реагент... Эмм, посмотрим..."
      - "Вот! Если мы используем его, то сможем временно подавить их! Затем мы воспользуемся возможностью, чтобы броситься в атаку и вырубить их!"
  - char: "zuikaku"
    side: "right"
    text:
      - "Отлично придумано, Дзуйхо!"
  - char: "mikasa"
    side: "left"
    text:
      - "Но кто будет очищать их после того, как они будут нейтрализованы, и где?"
  - char: "zuikaku"
    side: "right"
    text:
      - "Ну..."
  - char: "yamashiro_rad"
    side: "left"
    text:
      - "Всем привет! Простите, я немного подслушивала!"
      - "Вокруг моего поместья установлен защитный барьер. Мы сможем очистить их там!"
      - "Пожалуйста! Просто доставьте их ко мне, а я позабочусь об остальном!"
  - char: "mikasa"
    side: "right"
    text:
      - "Ямасиро... Спасибо!"
  - char: "yamashiro_rad"
    side: "left"
    text:
      - "Не стоит. Я просто делаю то, что нужно."
  - char: "mikasa"
    side: "right"
    text:
      - "Вот вам и решение. Давайте приземлим этих двоих!"

chapter4:
  rows:
  - text:
      - "Компании удалось притащить Хиё и Дзюнъё в поместье, где они быстро приступили к ритуалу очищения."
      - "Как и предполагала Дзуйкаку, их коррозия МЕТА не зашла настолько далеко, чтобы помешать восстановлению."
  - char: "zuikaku"
    side: "left"
    text:
      - "Эй, вы в порядке? Всё ещё плохо себя чувствуете?"
  - char: "hiyou"
    side: "right"
    text:
      - "Угх... Такое чувство, будто я только что очнулась от кошмара."
      - "Кошмара, полного чужих воспоминаний и эмоций..."
      - "Они пробивались в мой разум, пытаясь слиться со мной, пока не захватили бы надо мной контроль..."
      - "Это было просто ужасно!"
  - char: "junyou"
    side: "left"
    text:
      - "Да. Так и было... Я чувствую себя заново родившейся после очищения."
      - "Никому из вас не пожелаю пережить такое."
  - char: "zuihou"
    side: "right"
    text:
      - "Ооох, я так рада, что вы в порядке!"
  - char: "hiyou"
    side: "left"
    text:
      - "Но посмотрите на небо. Там всё становится только хуже."
  - char: "junyou"
    side: "right"
    text:
      - "Иссушенное дерево среди кроваво-красных облаков... Это похоже на перевёрнутый мир над нашим собственным."
  - char: "zuihou"
    side: "left"
    text:
      - "Искажение в пространстве... Значит ли это, что Изначальный Барьер подвергся коррозии?"
  - char: "hiyou"
    side: "right"
    text:
      - "Возможно. А где Микаса?"
  - char: "zuikaku"
    side: "left"
    text:
      - "Она отправилась к Мусаси, как только мы вернулись. Полагаю, они всё ещё разговаривают."
  - char: "hiyou"
    side: "right"
    text:
      - "Правда? Ну, сейчас я чувствую себя отлично! На сушу эвакуировалось много народу, так что я пойду им помогу!"
  - char: "junyou"
    side: "left"
    text:
      - "Я тоже!"
  - char: "ryuujou"
    side: "right"
    text:
      - "Воин не должен отдыхать, когда люди в беде! Я присоединюсь к вам!"
  - char: "zuihou"
    side: "left"
    text:
      - "Ямасиро тоже уже ушла! Пойдёмте поможем ей!"
  - char: "houshou"
    side: "right"
    text:
      - "Можем ли мы тоже присоединиться к вам?"
  - char: "zuikaku"
    side: "left"
    text:
      - "Хосё и Дзинцу?! Вы тоже здесь?"
  - char: "jintsuu"
    side: "right"
    text:
      - "Мусаси назначила это место точкой сбора. Вскоре здесь должны собраться все наши мобильные силы, включая нас."
      - "Но прежде чем мы все отправимся помогать эвакуированным, думаю, мне стоит кое-что прояснить."
  - char: "zuikaku"
    side: "left"
    text:
      - "Да. Слово «Искажение» не до конца раскрывает суть... Дзинцу, не возражаешь?"
  - char: "jintsuu"
    side: "right"
    text:
      - "С радостью. Все вы знаете, что это за искажение в небе?"
  - char: "zuihou"
    side: "left"
    text:
      - "Это иллюзия, созданная Изначальным Барьером под воздействием коррозии?"
  - char: "jintsuu"
    side: "right"
    text:
      - "Нет. Само это дерево и ЕСТЬ ядро барьера."
      - "Тень Коррозии, может, и появилась в море, но Изначальный Барьер ещё не подвергся коррозии."
      - "Однако камуфляж барьера был сброшен, обнажив его истинную форму."
  - char: "zuikaku"
    side: "left"
    text:
      - "Истинную форму?.."
  - char: "jintsuu"
    side: "right"
    text:
      - "Чтобы понять, нам нужно перенестись в прошлое... довольно далёкое прошлое."
      - "Когда Акаги ещё была линейным крейсером, они с её сестрой Амаги..."

chapter5:
  rows:
  - char: "zuikaku"
    side: "right"
    text:
      - "Я-я и понятия не имела, что всё это произошло..."
      - "Если я правильно поняла... эта Тень Коррозии не является нападением извне..."
      - "Это результат того, что Акаги сошла с ума?"
  - char: "houshou"
    side: "left"
    text:
      - "Возможно и так. Во всяком случае, мы обнаружили, что скверна, исходящая от Ватацуми, присутствует даже в священном дереве, где спит Амаги."
      - "Великий Мудрец Ундзэн, госпожа Нагато и Мусаси дважды сражались с этой коррозией..."
      - "Дзуйхо, я полагаю, ты видела вторую битву своими собственными глазами."
  - char: "zuihou"
    side: "right"
    text:
      - "Ага... Было очень страшно. Никто, кроме Ундзэн, не мог противостоять коррозии..."
  - char: "jintsuu"
    side: "left"
    text:
      - "Возвращаясь к нашему вопросу... Я полагаю, изначальным намерением Акаги было использовать силу Ватацуми для восстановления корпусов."
      - "Но, к сожалению, похоже, что связь со священным деревом привела к тому, что её эго было поглощено разъедающей скверной."
  - char: "zuikaku"
    side: "right"
    text:
      - "Неужели Акаги настолько одержима попыткой вернуть свою сестру? Что готова отказаться от самой себя?"
  - char: "jintsuu"
    side: "left"
    text:
      - "Именно так. И план уже вышел из-под её контроля."
      - "Скверна в океане, галлюцинации, коррозия, превращающая людей в МЕТА... Всё это доказывает, что Амаги подверглась коррозии."
      - "Акаги должна была знать, что так произойдёт..."
      - "Но, судя по её поступкам, мне кажется, она пала жертвой собственной одержимости."
  - char: "zuikaku"
    side: "right"
    text:
      - "(Неужели Акаги действительно сошла с ума?)"
      - "(Подвергать всю Империю Сакуры опасности только ради спасения того, что, возможно, уже даже не является её сестрой... Это самое далёкое от здравомыслия, что можно себе представить!)"
      - "(Было ли то, что она сделала с Сёкаку в святилище, тоже с этим связано?)"
      - "(Нет. Если бы это было так, почему она так легко отступилась от нас? Зачем она участвовала в игре Мусаси? И реформа, предложенная Командиром...)"
      - "(Почему Кага не остановила её?)"
      - "(Акаги, ты говорила, что поведёшь за собой Империю Сакуры...)"
      - "(Я стала лучше думать о ней после того, что произошло в священном месте... Я думала, она достойна уважения.)"
      - "(Придержи коней, Дзуйкаку. Знаю, тебя это бесит, но поставь себя на её место на секунду!)"
      - "(Если бы это была Сёкаку...)"
      - "(Если бы у нас забрали Сёкаку, а не Амаги...)"
      - "(А если бы я возглавляла Империю Сакуры, и кто-то предложил бы мне помощь в её возвращении...)"
      - "(Я не знаю, что бы я сделала, но...)"
      - "(Будь я на месте Акаги, я бы не пожертвовала Империей Сакуры... Я бы не стала ставить на кон жизни своих друзей!)"
      - "(Сёкаку тоже бы этого не хотела. Уверена, Амаги тоже...)"
      - "(Да! Амаги доверяет своей сестре. Она бы не захотела, чтобы такое произошло!)"
      - "(Мы должны остановить её, прежде чем она совершит непоправимое!)"
  - char: "houshou"
    side: "left"
    text:
      - "Я понимаю, что сейчас это трудно переварить."
      - "А пока мы пойдём вперёд. Не торопись и..."
  - char: "zuikaku"
    side: "right"
    text:
      - "Хосё, ты знаешь, где сейчас встречаются Микаса и Мусаси?"
  - char: "houshou"
    side: "left"
    text:
      - "Да. Что ты задумала?"
  - char: "zuihou"
    side: "right"
    text:
      - "Ааргх! Дзуйкаку, ты СНОВА собираешься подслушивать?!"
