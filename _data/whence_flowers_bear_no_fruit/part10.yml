chapter1:
  rows:
  - text:
      - "Мусаси рухнула на спокойные воды."
  - char: "musashi"
    side: "left"
    text:
      - "Ни единого звука."
      - "Так легко нейтрализовать волну демонов, накрывшую море..."
      - "Дзинцу не преувеличивала. И этот козырь даже ещё не полностью готов..."
      - "Но такое оружие неподвластно контролю одной личности."
      - "К счастью, в этот раз в ядре оказалась я."
      - "Синано бы не... смогла..."
  - text:
      - "По мере того как силы покидали её, а зрение начало затуманиваться, Мусаси почувствовала, как течение времени замедляется."
  - char: "musashi"
    side: "left"
    text:
      - "(Думая, что это поможет ей, я одолжила Акаги свои силы и побудила её возглавить эту империю.)"
      - "(Моё уважение к её человеческим желаниям привело к тому, что я по глупости попыталась их исполнить.)"
      - "(Но я совершенно не подозревала, что ею овладело безумие.)"
      - "(Нет... Я не буду искать оправданий.)"
      - "(То, что наступит такой конец, было вполне естественно. У меня есть сожаления, но я не буду бояться...)"
      - "(Всё живое должно умереть. В этом мире как корабли, так и люди — лишь мимолётные фантомы.)"
      - "Хе-хе..."
      - "Пусть этот последний удар принесёт свет надежды в это запустение..."
      - "«Рассеки пелену вечности, чтобы я могла стать листом, плывущим на другую сторону»."
      - "«Сталь... рази!»"

chapter2:
  rows:
  - text:
      - "Угасающий бронированный исполин наносит свой последний удар."
      - "Его меч раскалывает багровую луну и небо, создавая огромный разлом в барьере, защищающем место проведения ритуала."
  - char: "musashi"
    side: "right"
    text:
      - "Это... всё, что я сейчас могу сделать..."
      - "Микаса, Акаги, Нагато... Остальное я оставляю на вас..."
      - "Ох, какой же долгий выдался день..."
      - "Я истощена... Просто минутку... отдохну..."
  - text:
      - "С закрытыми глазами и нежной улыбкой Мусаси опустила голову на холодные воды."

chapter3:
  rows:
  - text:
      - "В этот момент калейдоскоп сверкающих золотых бабочек озарил мир вокруг неё."

chapter4:
  rows:
  - text:
      - "А затем, так же быстро, как и появились, бабочки исчезли вместе со спящей воительницей."
