chapter1:
  rows:
  - text:
      - "Когда солнце скрылось за горизонтом, Дзуйкаку и Дзуйхо покинули окрестности священной горы."
  - char: "zuihou"
    side: "left"
    text:
      - "Ладно, теперь ты в безопасности."
      - "Надеюсь, тебе понравилась экскурсия по священной горе!"
  - char: "zuikaku"
    side: "right"
    text:
      - "Э-э, да, ахаха... Спасибо за всё!"
  - char: "zuihou"
    side: "left"
    text:
      - "Скоро стемнеет, так что я пойду домой. А ты?"
  - char: "zuikaku"
    side: "right"
    text:
      - "Эмм, я собираюсь..."
      - "Я не могу просто вернуться в поместье Микасы сейчас, так как сбежала из дома Муцу.)"
      - "(Возвращение домой тоже вызовет подозрения, так как Сёкаку на вылазке у Соломоновых островов.)"
      - "(Поблизости нет ни одного порта. И даже если бы был, у меня нет оправданий тому, что я забралась так далеко!)"
      - "(Неужели мне остаётся только спать на улице? Неужели придётся ночевать чёрт-те где?)"
  - text:
      - "Лицо Дзуйкаку становилось всё более нервным. Дзуйхо заметила это и мило улыбнулась."
  - char: "zuihou"
    side: "left"
    text:
      - "Эй, а почему ты всё ещё на материке? Разве флот госпожи Нагато не отбыл раньше?"
      - "Ты сбежала, а теперь поняла, что тебе некуда идти?"
  - char: "zuikaku"
    side: "right"
    text:
      - "Нет, я не сбегала, честно! Просто Муцу заболела, и мне поручили за ней присматривать."
  - char: "zuihou"
    side: "left"
    text:
      - "Ооо, она заболела?"
  - text:
      - "Дзуйхо посмотрела в ту сторону, где находился дом Муцу."
  - char: "zuikaku"
    side: "right"
    text:
      - "В любом случае, это неважно!"
  - char: "zuihou"
    side: "left"
    text:
      - "Придумала! Как насчёт того, чтобы остаться у меня?"
  - char: "zuikaku"
    side: "right"
    text:
      - "Правда? Ты позволишь мне это сделать?"
  - char: "zuihou"
    side: "left"
    text:
      - "Чирик-чирик! Ага! Хосё подарила мне дом, и он очень-очень большой!"
      - "Там много пустых комнат, которые мои друзья используют, когда остаются с ночёвкой. Можешь остаться, без проблем!"
  - char: "zuikaku"
    side: "right"
    text:
      - "Ты моя спасительница. Пожалуйста, показывай дорогу!"

chapter2:
  rows:
  - text:
      - "Луна ярко светила над головой, когда они подошли к дому. Уже с порога было ясно, что это величественное здание."
  - char: "zuihou"
    side: "left"
    text:
      - "Вот мы и пришли!"
  - char: "zuikaku"
    side: "right"
    text:
      - "ТАК выглядит твой дом?! Да он почти такой же большой, как поместье Микасы!"
  - char: "zuihou"
    side: "left"
    text:
      - "Хи-хи. Хосё настаивала, чтобы он был именно таким большим."
      - "Чирик! Посмотри на время. Пойдём внутрь."
      - "Я приготовлю для тебя ужин! Я не могу позволить, чтобы мои гости голодали!"

chapter3:
  rows:
  - text:
      - "Пока Дзуйхо готовила на кухне, Дзуйкаку прогуливалась по саду."
  - char: "zuikaku"
    side: "left"
    text:
      - "(За этим садом хорошо ухаживают. Посмотри на все эти цветы...)"
      - "(Погодите... Почему так много из них завяло? Разве эти сорта не цветут летом?..)"
      - "(Странно... Сад выглядит безупречно, но цветы — нет...)"
  - char: "zuihou"
    side: "right"
    text:
      - "Ужин готов! Как тебе мои цветы? Разве они не прелесть?"
      - "Думаю, они отлично смотрятся как в солнечном, ТАК И в лунном свете!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Э-э, не знаю, заметила ли ты, но..."

chapter4:
  rows:
  - char: "zuihou"
    side: "right"
    text:
      - "Что?! Что случилось с моими цветами? Они цвели ещё вчера!"
      - "Могут ли цветы завянуть так быстро? Не могут ведь, правда?"
  - char: "zuikaku"
    side: "left"
    text:
      - "К слову об этом — я видела много увядших растений там, на горе."
      - "Тогда я не придала этому особого значения. Но теперь... Здесь явно что-то не так."
  - char: "zuihou"
    side: "right"
    text:
      - "Значит, дело не только в моих цветах... Интересно, не случилось ли что-нибудь с Изначальным Барьером."
  - char: "zuikaku"
    side: "left"
    text:
      - "С чем? Что ещё за «Изначальный Барьер»?"
  - char: "zuihou"
    side: "right"
    text:
      - "Это великий, вечный барьер, который покрывает Острова Сакуры и защищает нас!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Хм. Может, я и слышала о нём от госпожи Нагато, но не уверена."
  - char: "zuihou"
    side: "right"
    text:
      - "Чирик. Наверное, у тебя избирательное внимание, но это нормально."
      - "Изначальный Барьер покрывает всю страну, защищая её от внешних угроз."
      - "Я слышала, что его можно настраивать, чтобы изменять погоду, блокировать бури и даже вызывать дождь."
      - "В общем, это супер-пупер важный барьер!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Понятия не имела о его существовании! Это какой-то строжайший секрет?"
  - char: "zuihou"
    side: "right"
    text:
      - "Хмм... Я не знаю. Но я уверена, что Ямасиро и другие её ранга знают о нём."
  - char: "zuikaku"
    side: "left"
    text:
      - "Угу... Тогда откуда ты о нём знаешь?"
  - char: "zuihou"
    side: "right"
    text:
      - "Ямасиро рассказала мне!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Так я и думала..."
      - "Постой, а этот барьер как-то связан с ритуалами, которые госпожа Нагато проводит со Священной Сакурой?"
  - char: "zuihou"
    side: "right"
    text:
      - "Ага. Она ЖЕ лиса-хранительница, сама знаешь. Хотя официально за поддержание Изначального Барьера отвечает Ямато."
  - char: "zuikaku"
    side: "left"
    text:
      - "Официально?"
  - char: "zuihou"
    side: "right"
    text:
      - "Ну, на практике барьером управляет Мусаси, потому что Ямато не может."
      - "Ямато живёт в уединении во Вратах Небес, а все Священные Сакуры, которые поддерживают Изначальный Барьер, расположены СНАРУЖИ Врат Небес!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Ладно, давай отмотаем назад... Ты хочешь сказать, что, по-твоему, цветы завяли из-за повреждения Изначального Барьера?"
  - char: "zuihou"
    side: "right"
    text:
      - "Угу! Он скоро снова будет в рабочем состоянии, так что беспокоиться не о чем."
      - "Хотя мне жаль бедные цветы... Это было их время цвести... Чирик..."
  - text:
      - "*тук-тук*"
  - char: "ryuujou"
    side: "left"
    text:
      - "Дзуйхо, ты дома? Я пришла потусоваться!"
  - char: "zuihou"
    side: "right"
    text:
      - "О, кажется, это Рюдзё."
      - "Тебя ведь здесь быть не должно, верно, Дзуйкаку? Тебе нужно спрятаться."
  - text:
      - "Дзуйкаку ответила тихим кивком, затем отодвинула сёдзи и спряталась в комнате рядом с кухней."
  - char: "zuihou"
    side: "right"
    text:
      - "Я дома! Минуточку!"

chapter5:
  rows:
  - char: "ryuujou"
    side: "left"
    text:
      - "Наконец-то ты вернулась, Дзуйхо! Я ждала тебя весь день."
      - "Тебе понравилось в Якумояме?"
  - char: "zuihou"
    side: "right"
    text:
      - "Там было очень красиво! Хотя и не так уж весело."
      - "...Погоди, ты ждала меня целый день?"
      - "Разве ты не говорила, что у тебя сегодня задание? Что-то о специальных тренировках в море?.."
  - char: "ryuujou"
    side: "left"
    text:
      - "Говорила... Задание отменили в последнюю минуту. Мне лишь сказали, что я не должна выходить в море."
      - "Мне показалось это странным, поэтому я поспрашивала. Оказалось, не только нам, кансен, запретили отплывать — гражданским судам тоже."
      - "Поэтому я сразу же пошла к тебе, чтобы узнать, не знаешь ли ты чего-нибудь!"
      - "Кстати, Дзуйкаку тебя не навещала?"
  - char: "zuihou"
    side: "right"
    text:
      - "Дз-Дзуйкаку? Эмм, э-э..."
  - char: "ryuujou"
    side: "left"
    text:
      - "Я спрашиваю только потому, что видела, как она заходила вместе с тобой внутрь. Она, случайно, не всё ещё здесь?"
  - char: "zuihou"
    side: "right"
    text:
      - "Ч-что? Так, когда ты сказала, что ждала меня весь день, ты имела в виду, что ждала прямо у моего дома?"
  - char: "ryuujou"
    side: "left"
    text:
      - "Точно! Я пряталась в кустах и ждала твоего возвращения!"
  - char: "zuihou"
    side: "right"
    text:
      - "......"
      - "Дзуйкаку, э-э... готовит ужин. Заходи, и мы поговорим за едой!"
      - "И ещё, ты никому не должна рассказывать, что Дзуйкаку здесь!"
  - char: "ryuujou"
    side: "left"
    text:
      - "Поняла!"

chapter6:
  rows:
  - text:
      - "Поскольку её прикрытие было раскрыто, Дзуйкаку ничего не оставалось, кроме как выйти."
      - "Втроём они сели за обеденный стол и за едой обсудили всё, что видели сегодня."
  - char: "zuikaku"
    side: "left"
    text:
      - "Никому не разрешили покидать порт, хах... Я понимаю, почему повреждение Изначального Барьера могло привести к этому."
  - char: "zuihou"
    side: "right"
    text:
      - "Но барьер работал целую вечность, и любые мелкие проблемы с ним сразу же устранялись."
      - "Это никогда не приводило к тому, что всем кораблям запрещали выходить в море."
  - char: "ryuujou"
    side: "left"
    text:
      - "Тогда, возможно, это была не мелкая неисправность, а крупная поломка?"
  - char: "zuihou"
    side: "right"
    text:
      - "Понятия не имею..."
  - char: "zuikaku"
    side: "left"
    text:
      - "Есть ли какой-нибудь способ выяснить, что происходит?"
      - "Думаю, самый быстрый способ — это отправиться туда самим и посмотреть, в чём дело."
  - char: "zuihou"
    side: "right"
    text:
      - "Конечно... Проблема в том, что у меня нет доступа к Изначальному Барьеру."
      - "Нооо... У Ямасиро он есть!"
      - "Она живёт неподалёку, и она, вероятно, не откажет, если мы все вместе её попросим!"
  - char: "zuikaku"
    side: "left"
    text:
      - "(Хмм... Да, если кто и разбирается в барьерах, так это Ямасиро.)"
      - "(Хотя, есть риск, что она проболтается Акаги о том, что я осталась тут...)"
  - char: "zuihou"
    side: "right"
    text:
      - "Дзуйкаку? Что-то не так?"
  - char: "zuikaku"
    side: "left"
    text:
      - "Нет, ничего. Давай поговорим с Ямасиро завтра, раз уж сейчас так поздно."
  - char: "zuihou"
    side: "right"
    text:
      - "Конечно!"
  - char: "ryuujou"
    side: "left"
    text:
      - "Тогда, полагаю, вся ночь в нашем распоряжении!"
      - "Раз мы не можем навестить Ямасиро, мы всё ещё можем поиграть в игры."
      - "Дзуйхо, позвать Хиё и Дзюнъё к нам?"
      - "Мне кажется, они сейчас сидят без дела, а чем больше народу, тем веселее, верно?"
  - char: "zuihou"
    side: "right"
    text:
      - "Отличная идея! Погоди... Ты не против, Дзуйкаку?"
  - char: "zuikaku"
    side: "left"
    text:
      - "Я не против. Когда мы навестим Ямасиро завтра, тайное всё равно станет явным."
      - "К тому же, позже мне может понадобиться их помощь в расследовании. Сейчас самое время с ними подружиться!"
  - char: "ryuujou"
    side: "right"
    text:
      - "Прошу прощения? Что ты имеешь в виду под «тайное станет явным»?"
  - char: "zuihou"
    side: "left"
    text:
      - "Ничего важного! Давай, приглашай их. А я пока выберу игру, в которую мы поиграем."
  - char: "ryuujou"
    side: "right"
    text:
      - "Очень хорошо! Я скоро вернусь!"
