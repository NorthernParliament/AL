chapter1:
  rows:
  - text:
      - "В самом центре барьера, у корней увядающего дерева, продолжался ритуал."
  - char: "akagi_m"
    side: "left"
    status: "is-meta"
    text:
      - "Недостаточно... Этого недостаточно..."
      - "Они всё ещё не цветут..."
      - "Мне нужно больше пищи для её души."
      - "Нет, этот ритуал ещё не окончен. Я не должна позволить ему прерваться."
      - "Даже если всё окончательно выйдет из-под контроля..."
      - "Дорогая сестра... Я знаю, ты сможешь вернуть всё под контроль."
      - "Я не смогла сама возглавить Империю Сакуры, но я знаю, что ты сможешь!"
      - "Тебе суждено было вести за собой Империю. Вести за собой меня..."
      - "Когда ты рядом, всё оборачивается к лучшему."
      - "Даже если завтра всё сгорит дотла... ты всё исправишь. Разве не так, дорогая сестра?"
      - "Конечно так! Ты можешь ВСЁ!"
      - "Поэтому я верну тебя, чего бы мне это ни стоило."
      - "Я так близка... Так близка... Я почти чувствую тебя!"
      - "Но почему? Почему, почему последний шаг так..."
      - "......"
      - "Кага... Ты знаешь её так же хорошо, как и я. Вот почему мы — идеальный обмен за последний фрагмент её души..."
      - "Ты должна понимать. Как только всё закончится, Амаги вернётся к нам."
      - "Так что..."
      - "Просто пойдём со мной, хорошо?"
  - char: "kaga_m"
    side: "right"
    text:
      - "...Хорошо."

chapter2:
  rows:
  - char: "kagabb"
    side: "left"
    text:
      - "Пойдём, Акаги."
      - "К финальной стадии этого ритуала."
  - text:
      - "Перед великим деревом Кага сняла маску и улыбнулась Акаги."
  - char: "kagabb"
    side: "left"
    text:
      - "«Из Нараки, вниз в преисподнюю»."

chapter3:
  rows:
  - text:
      - "Мёртвая ветвь пронзила грудь Каги. Кровь закапала из её рта, окрасив его в яркий багровый цвет."
  - char: "kagabb"
    side: "left"
    status: "is-meta"
    text:
      - "Угх... Я думала, что готова к этому..."
      - "Но это действительно... больно... кхе..."
  - char: "akagi_m"
    side: "right"
    text:
      - "Кага?!"
      - "Почему... Почему у меня украшение, которое дала тебе Амаги?"
      - "Ты никогда не выпускала его из виду... Почему оно сейчас на мне?!"
      - "Почему... Почему ты защитила меня?!"
      - "Ты оставляешь меня одну?! Разве мы не обещали пойти вместе?!"
  - char: "kagabb"
    side: "left"
    status: "is-meta"
    text:
      - "Меня... достаточно одной..."
      - "Это вполне естественно... что я возвращаю то, что дала мне твоя сестра..."
      - "Считай это... тем, что она защищает тебя ещё один раз..."
      - "И вот... я сделала это..."

chapter4:
  rows:
  - char: "amagi"
    side: "left"
    text:
      - "И, пожалуйста, позаботься о моей сестре, Акаги..."

chapter5:
  rows:
  - char: "kagabb"
    side: "left"
    status: "is-meta"
    text:
      - "Я сдержала своё обещание... дорогая сестра..."
      - "Акаги... Я больше не смогу тебя защищать."
      - "Только ты можешь разрушить ту карму, что создала..."
      - "Кто-то важный... о ком ты давно забыла..."
      - "Отныне... Ты будешь одна... в..."
  - text:
      - "Бутоны раскрывались один за другим, рождая кроваво-красные цветы."

chapter6:
  rows:
  - text:
      - "С завершением ритуала мёртвые ветви ожили. И когда Кага исчезла в кроне дерева..."

chapter7:
  rows:
  - text:
      - "Багровые цветы сакуры распустились во всей красе."
