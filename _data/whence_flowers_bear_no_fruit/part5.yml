chapter1:
  rows:
  - text:
      - "Яркая лунная ночь — именно такой она должна была быть сегодня."
      - "Вместо этого в небе сгустились плотные облака, заслонив собой всё, кроме нескольких лунных лучей."
      - "Если присмотреться, в их свете можно было различить тень от ветвей дерева."
  - char: "musashi"
    side: "left"
    text:
      - "Ритуал начался..."
  - char: "akagi_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Как мы и ожидали, по мере проведения ритуала коррозия обретает форму."
      - "Воплощение Тени Коррозии начинает атаковать. Мы должны перехватить их."
  - char: "musashi"
    side: "left"
    text:
      - "Я знаю."
  - text:
      - "Мусаси повесила трубку и отдала приказы кансен под своим командованием."
  - char: "musashi"
    side: "left"
    text:
      - "(Я не сказала им правду о том, откуда взялся этот враг.)"
      - "(Хотя это не имеет значения. Всё, что им нужно сделать — занять позиции и уничтожить его. Откуда он взялся — неважно.)"
      - "(Будем надеяться, что сегодня ночью их больше не появится...)"
  - text:
      - "Она вздохнула и посмотрела вверх."
      - "В небе была полная багровая луна, а ветви и листья Священной Сакуры тянулись к звёздам."

chapter2:
  rows:
  - char: "kii_rad"
    side: "right"
    text:
      - "Мусаси, поступают сообщения об одной за другой визуальных и слуховых галлюцинациях."
      - "Из-за вероятности того, что это вызовет непредвиденные проблемы, я отправила всех обратно в порт. Ожидаю дальнейших приказов."
  - char: "musashi"
    side: "left"
    text:
      - "Я знаю ситуацию. Усильте оборону порта и оставайтесь начеку."
  - char: "kii_rad"
    side: "right"
    text:
      - "Есть!"
  - char: "musashi"
    side: "left"
    text:
      - "(Неожиданно... Галлюцинации не должны были возникнуть, пока коррозия остаётся бесформенной...)"

chapter3:
  rows:
  - char: "mikasa_rad"
    side: "right"
    text:
      - "Мусаси, враг множится. Ситуация складывается не в нашу пользу."
  - char: "tosa_rad"
    side: "left"
    text:
      - "Мой флот прекратил атаку. Мы работаем с укреплениями и готовимся к оборонительному бою."
      - "К тому же, те галлюцинации, о которых ранее докладывала Кии... мой флот тоже их испытывает."
      - "Как долго ты ещё будешь тянуть время, Мусаси?"
  - char: "musashi"
    side: "right"
    text:
      - "...Ещё час."
  - char: "katsuragi_rad"
    side: "left"
    text:
      - "Вынуждена доложить плохие новости, Мусаси!"
      - "Мы с флотом Дзуйхо собирались вместе выйти на задание, но они так и не ответили, несмотря на мои неоднократные попытки связаться, поэтому я отправила разведывательные самолёты всё выяснить..."
      - "И точно, я увидела, что они вступили в бой с МЕТА! Она появилась из ниоткуда!"
  - char: "musashi"
    side: "right"
    text:
      - "МЕТА, говоришь?"
  - char: "mikasa_rad"
    side: "left"
    text:
      - "Передай мне их координаты. Я вышлю подкрепление!"
  - char: "katsuragi_rad"
    side: "right"
    text:
      - "Поняла! Координаты уже отправляю!"
  - char: "tosa_rad"
    side: "left"
    text:
      - "Похоже, тебе всё-таки не придётся ждать целый час."
  - char: "musashi"
    side: "right"
    text:
      - "Похоже на то..."

chapter4:
  rows:
  - text:
      - "Быстро обдумав происходящее, Мусаси открыла канал связи с Акаги."
  - char: "musashi"
    side: "left"
    text:
      - "Как ты можешь видеть, ситуация выходит из-под контроля."
      - "Этого нельзя делать, Акаги."
      - "Пора остановиться."
  - char: "akagi_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Ты, должно быть, шутишь."
      - "Атаки Тени Коррозии и появление этой МЕТА произошли только потому, что показатели коррозии оказались немного выше ожидаемых."
      - "МЕТАморфоза лишь временна. Мы можем использовать наш барьер, чтобы очистить её и обратить процесс вспять."
      - "Более того, ритуальный круг работает. Мы так близки к завершению ритуала. Слишком поздно останавливаться."
      - "И даже если бы было не поздно, я бы этого не сделала."
      - "Всё будет хорошо, если возрождение Амаги увенчается успехом."
      - "Всё, что тебе нужно сделать, это продержаться до тех пор."
      - "Если ты не можешь продержаться... тогда беги."
  - text:
      - "Акаги повесила трубку. Выражение глубокой печали промелькнуло на лице Мусаси."
  - char: "musashi"
    side: "left"
    text:
      - "Я должна была предвидеть, что так произойдёт."
      - "Дзинцу, наше решающее оружие готово?"
  - char: "jintsuu_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Его можно использовать некоторое время, при условии, что ядро надёжно."
      - "Ты уверена, что хочешь это сделать?"
  - char: "musashi"
    side: "left"
    text:
      - "Пламя Акаги горит так ярко только потому, что я оказала ей помощь."
      - "Поэтому моя обязанность — вернуть ситуацию под контроль."
      - "Проведи последнюю проверку."
  - char: "jintsuu_meta_rad"
    side: "right"
    text:
      - "Как скажешь..."
      - "Желаю тебе удачи, Мусаси."
