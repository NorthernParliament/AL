chapter1:
  rows:
  - text:
      - "Тем временем на главном острове Империи Сакуры на улицах начали появляться враги, порождённые чёрным туманом."
      - "БАБАХ!!!"
  - char: "kinu"
    side: "left"
    text:
      - "Без паники! Не оставлять посты!"
      - "Мы не приспособлены к боям на суше, но они тоже!"
      - "Всё, что у них есть — это численное превосходство. Они неразумны и неорганизованны!"
      - "В конце концов, это просто звери. Сражайтесь хладнокровно, и мы сможем перебить их поодиночке!"
  - char: "hatakaze"
    side: "right"
    text:
      - "Ты права, но на войне всё решает численность. Мы не сможем вечно сдерживать их бесконечный поток."
      - "И даже если мы продержимся, того же нельзя сказать о поместье Ямасиро и барьере."
      - "Вы видели, как Хиё и Дзюнъё превратились в МЕТА."
      - "Если барьер будет прорван... нас ждут тяжёлые времена."
  - char: "kinu"
    side: "left"
    text:
      - "Ты права в том, что мы не можем вечно сидеть в обороне... но если уж отступать, то я не уверена, куда..."

chapter2:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "kinu"
    side: "left"
    text:
      - "А? Кто там сражается?"
      - "И что это, чёрт возьми, за золотой свет?"

chapter3:
  rows:
  - char: "ibuki_newyear"
    side: "left"
    text:
      - "Добрый день всем. Я прибыла с Китакадзэ и кансен типа Муцуки, чтобы поддержать вас."
  - char: "mikasa"
    side: "right"
    text:
      - "Ибуки! Как раз вовремя."
      - "Как видишь, сила коррозии только возрастает. Наш барьер дышит на ладан."
      - "Ибуки, вы с девочками типа Муцуки можете что-нибудь сделать с барьером?"
  - char: "ibuki_newyear"
    side: "left"
    text:
      - "И да, и нет..."
      - "По мере проведения ритуала коррозия усиливается. Продолжать защищать это место — не лучший долгосрочный план."
      - "Ветеран Микаса, я предлагаю стратегическое отступление к Якумояме, пока не стало слишком поздно."
      - "Барьер Якумоямы был установлен самой Ямато. Учитывая святилище Идзумо, он может быть даже прочнее, чем Врата Небес."
      - "Единственная дорога, ведущая туда и обратно, — это узкая крутая горная тропа. Идеально для обороны."
  - char: "mikasa"
    side: "right"
    text:
      - "Якумояма, значит... Я говорила Идзумо, что когда-нибудь туда наведаюсь. Но сейчас не время, особенно при таких обстоятельствах..."
  - char: "ibuki_newyear"
    side: "left"
    text:
      - "Ветеран Микаса, мы должны исходить из текущей ситуации. Преодолеем этот кризис, а потом уже будем думать об остальном."
  - char: "mikasa"
    side: "right"
    text:
      - "...Ты права. Но есть ли у нас способ передвигаться за пределами барьера, не подвергаясь коррозии?"
  - char: "ibuki_newyear"
    side: "left"
    text:
      - "Не беспокойтесь. Я уже подготовилась к этому."
      - "Кансен типа Муцуки, стройся!"

chapter4:
  rows:
  - text:
      - "По сигналу Ибуки кансен типа Муцуки выстроились в ряд с ритуальными предметами в руках, создавая круговую зону, которая должна была отражать коррозию."
      - "Внутри этой зоны появился яркий свет. Бесчисленные золотые бабочки запорхали внутри."
  - char: "ibuki_newyear"
    side: "left"
    text:
      - "«Целый мир в этом магическом круге»."
      - "Ветеран Микаса, собирай всех здесь! Мы отступаем к Якумояме!"
