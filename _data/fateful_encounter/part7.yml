chapter1:
  rows:
  - text:
      - "Путь из Ортодоксии Ирис на Королевские острова прошёл без особых происшествий."
      - "Всю дорогу Бон Омм Ричард просто тихо сидела на своём месте, глядя в окно на облака."

chapter2:
  rows:
  - text:
      - "Когда мы прибыли в зону встречи гостей, Куин Элизабет, которую уже заранее известили о нашем визите, тут же принялась внимательно изучать пространство вокруг меня."
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "Давно не виделись, Куин Элизабет!"
  - text:
      - "Ричард приветствует её с радушной улыбкой, однако Куин Элизабет не обращает на неё ни малейшего внимания."
  - char: "commander"
    side: "left"
    text:
      - "(Что ж, это довольно проблематично... Похоже, даже Элизабет не способна её видеть.)"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хм... Скажи, слуга... Бон Омм Ричард уже здесь, не так ли?"
  - char: "commander"
    side: "left"
    text:
      - "Да. Собственно говоря, она как раз пытается поздороваться с тобой."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "В таком случае прошу простить мою грубость. Добро пожаловать на Королевские острова, мисс Ричард."
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "Угу! Уверена, здесь будет очень весело!"
  - char: "commander"
    side: "right"
    text:
      - "Ты правда вообще не ощущаешь её присутствия?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "К сожалению, в текущих обстоятельствах это невозможно."
      - "Возможно, мне удалось бы кое-что прояснить, проведи я «глубокий допрос»... но интуиция подсказывает, что ни тебе, ни мне этого не хочется."
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Я тоже думаю, что это плохая идея."
  - char: "commander"
    side: "left"
    text:
      - "...Похоже, остаётся лишь ждать вестей из Компилирующего Поля."

chapter3:
  rows:
  - char: "communicator"
    side: "left"
    text:
      - "Бип!"
  - text:
      - "Лёгок на помине, коммуникатор внезапно запищал."
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "Командир, мы почти завершили создание стабильного канала между Авалоном и Компилирующим Полем. Осталось лишь доставить оборудование, что займёт примерно полчаса."
  - char: "commander"
    side: "right"
    text:
      - "...Оборудование?"
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "Всё верно! Мы заранее посоветовались с Куин Элизабет и решили остановиться на этом варианте."
      - "Как только канал между Компилирующим Полем и полигоном ES-40111 будет готов, ты сможешь безопасно отправиться туда с полигона бета!"
  - char: "commander"
    side: "right"
    text:
      - "Не думал, что вы согласитесь на план с Авалоном. Я полагал, вы все настроены двигаться через Море Звёзд."
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "Ну, эм... с тех пор как Хелена ушла, наш контроль над Башней начал ослабевать."
      - "Это не значит, что с Морем Звёзд что-то не так!"
      - "Просто, ну... там уже не так безопасно, как раньше."
      - "Тщательно всё обсудив, мы пришли к выводу, что маршрут через Авалон на данный момент, пожалуй, безопаснее..."
      - "Кроме того, насчёт «того самого»..."
      - "Бон Омм Ричард слышит наш разговор прямо сейчас?"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Ещё как слышу~♪"
  - char: "commander"
    side: "left"
    text:
      - "Э-э... говорит, что слышит."
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Эм-м... Прости, Командир. Мы понятия не имеем, в каком она статусе."
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "Ха-ха, не переживай об этом. Я и сама понятия не имею, что я такое~"
  - char: "commander"
    side: "right"
    text:
      - "...Хочешь попробовать поговорить с ней напрямую?"
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "Если она меня не слышит, тут уж ничего не поделаешь~"
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Думаешь, стоит попытаться, Командир? Мне поговорить с мисс Ричард?"
  - char: "commander"
    side: "left"
    text:
      - "Э-э... мои прошлые слова предназначались для Ричард."
      - "Она сказала, что тоже понятия не имеет, что происходит."
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Похоже, эта ситуация всё-таки потребует более тщательного расследования... Командир, мы планируем развернуть временный исследовательский комплекс у Врат Авалона и прямо сейчас перебрасываем туда всё необходимое оборудование и персонал."
      - "Но на это уйдёт какое-то время, так что могу я попросить тебя пока оставаться у Врат Авалона?"
  - char: "commander"
    side: "left"
    text:
      - "Да, без проблем. Я и не собирался уходить, пока не разберусь в происходящем."
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Хорошо. Тогда свяжусь с тобой позже, Командир."
  - char: "commander"
    side: "left"
    text:
      - "Спасибо."
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "До скорого!"

chapter4:
  rows:
  - text:
      - "Пока мы ждали, Бон Омм Ричард потянула меня на смотровую площадку, откуда открывался великолепный вид."
  - char: "commander"
    side: "left"
    text:
      - "(Подумать только: шагнуть внутрь искусственной сингулярности... и просто ничего не делать. Со мной такое определённо впервые...)"
      - "(Если подумать, несмотря на то, сколько раз я здесь бывал, мне так и не довелось всё как следует осмотреть. Может, и впрямь устроить небольшую экскурсию с Мемфис и остальными в ближайшие дни...)"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "А как же я? Мне с вами нельзя?"
  - char: "commander"
    side: "left"
    text:
      - "Не взять тебя с собой было бы просто невозможно."
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Эхе-хе~♪"
      - "Это был риторический вопрос, знаешь ли. Просто хотелось найти повод поболтать с тобой~♪"
  - char: "commander"
    side: "left"
    text:
      - "......"
      - "(Эта девушка... с её типажом мне всегда было нелегко совладать...)"
      - "(И что ещё хуже, она обладает силой, способной в любой миг уничтожить этот мир...)"
  - char: "miss_d"
    side: "right"
    text:
      - "Ого! Ассистент, ты пришёл навестить нас!"
  - text:
      - "Тёмная тень внезапно выскакивает из-за угла."
  - char: "miss_d"
    side: "right"
    text:
      - "Ассистент..."
      - "А? Ричард?!!"
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "...А?"
  - char: "commander"
    side: "right"
    text:
      - "Погоди, Мисс D, ты её видишь?!"
  - char: "miss_d"
    side: "left"
    text:
      - "Видела, ага. Но теперь она исчезла."
  - char: "commander"
    side: "right"
    text:
      - "Она... исчезла?"
  - text:
      - "Я оглядываюсь по сторонам, и правда: Бон Омм Ричард нигде нет."
  - char: "commander"
    side: "right"
    text:
      - "...Что всё это значит?"
  - char: "communicator"
    side: "left"
    text:
      - "Бип!"
  - text:
      - "Внезапно мой коммуникатор начинает пищать. Входящий вызов с неизвестного номера."

chapter5:
  rows:
  - char: "bon_omm_richard2?_rad"
    side: "left"
    text:
      - "Эм-м, Профессор? Ты меня слышишь? Куда ты пропал?"
  - text:
      - "Я слышу неожиданный голос на том конце связи."
  - char: "commander"
    side: "right"
    text:
      - "...Ричард? Где ты?.."
  - char: "bon_omm_richard2?_rad"
    side: "left"
    text:
      - "Я не знаю! Каким-то образом я очутилась посреди тёмного переулка!"
  - char: "commander"
    side: "right"
    text:
      - "...Переулка?"
  - text:
      - "Не успел я опомниться, как Мемфис и Мисс D, которые только что стояли рядом, бесследно исчезли. Пейзаж со смотровой площадки Врат Авалона также совершенно переменился."
      - "Я и сам стою в тускло освещённом переулке."
  - char: "commander"
    side: "right"
    text:
      - "......"
      - "И что на этот раз?.."
