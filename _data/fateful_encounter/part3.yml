chapter1:
  rows:
  - text:
      - "Глубочайшие слои коммуникационного пространства — область, где Арбитры обмениваются важнейшей информацией."
      - "Здесь сходятся бесконечные потоки данных, воплощаясь в бескрайнее звёздное небо."
      - "Здесь бесчисленные звёзды занимают свои заданные позиции, и их мерцающее рождение или величественная гибель никак не влияют на это пространство."
      - "Но прямо сейчас звёздный небосвод мерцает с тревожной частотой."
  - char: "temperance"
    side: "left"
    text:
      - "...Что ты только что сказала?"
      - "...Вы запускаете начальную процедуру создания оснастки для «Солнца»?"
      - "...Разве этот проект не был заморожен из-за чрезмерно высоких расчётных затрат?"
  - text:
      - "Само небо дрогнуло и исказилось, будто отражая аномальность представленной информации и тревогу говорящей."
  - char: "empress"
    side: "left"
    text:
      - "Согласно расчётам с применением новейших технологий переработки, для проекта потребуется сбор ресурсов с 1 254 470 полигонов."
      - "С учётом резервного запаса ресурсов запланировано использовать в общей сложности 1 500 000 полигонов."
      - "На основании этой переоценки Зеро определила, что текущая программа «Антиох» способна реализовать данный проект."
  - char: "temperance"
    side: "right"
    text:
      - "...Полтора миллиона полигонов?"
      - "Хм... Допустим. При условии, что это всё, что нам потребуется."
      - "Но ведь это ещё не конец... Разве не так?"
      - "Этот процесс — лишь предварительное условие для того, что последует дальше..."
      - "Его истинная цель — создание Двигателя пространственного упорядочивания ради «Реординации»..."
      - "Какую цену мы готовы заплатить, чтобы воплотить эту конечную цель в жизнь?"
  - char: "magican"
    side: "left"
    text:
      - "Вероятно, ещё на порядок больше."
      - "Разумеется, эти затраты не лягут на полигоны в рамках программы «Обсервер»."
  - char: "temperance"
    side: "right"
    text:
      - "...Такими темпами мы можем отбросить обозначение «тестовый полигон» и попросту называть их «карьерами для добычи»."
      - "Императрица, Фокусник... Зеро сошла с ума. И вы собираетесь последовать за её безумием?"
  - char: "magican"
    side: "left"
    text:
      - "С моей точки зрения, Умеренность, у этого плана высокий шанс на успех."
      - "А потому я считаю, что попробовать стоит."
  - char: "temperance"
    side: "right"
    text:
      - "Проект Двигателя пространственного упорядочивания изначально был включён в План Магистра как наследие одного из старых проектов Совета."
      - "У него всегда был низкий приоритет. Его невозможно было реализовать на практике. Вот почему его заморозили на самом дне стопки архивных проектов."
      - "Даже если сейчас у нас есть средства для его реализации, как это повлияет на План Магистра в целом?"
      - "Теперь Зеро хочет свернуть трансграничные эксперименты, но при этом намерена перезапустить проект, который обойдётся в два-три раза дороже этих самых экспериментов. Разве это не ставит телегу впереди лошади?"
  - char: "empress"
    side: "left"
    text:
      - "Не забывай, Умеренность: эксперименты — лишь средство для достижения цели."
      - "Ясно одно — Зеро приняла решение."
      - "Проект Двигателя пространственного упорядочивания возглавит Башня."
      - "В её подчинении будут сформированы четыре вспомогательных отдела."
      - "Технический отдел возглавят Повешенный и Колесо Фортуны."
      - "Инженерный отдел возглавит Луна при поддержке Солнца и Силы."
      - "Отдел безопасности возглавит Фокусник при поддержке Звезды и Колесницы."
      - "Отдел интеграции ресурсов возглавит Мир при поддержке Императрицы, Императора и Влюблённых."
  - char: "temperance"
    side: "right"
    text:
      - "...Мир?"
  - char: "empress"
    side: "left"
    text:
      - "Да. Я буду курировать отдел интеграции ресурсов вплоть до возвращения Мира."
      - "И именно по этой причине я связалась с тобой."
  - char: "temperance"
    side: "right"
    text:
      - "...А я-то думала, почему моего имени нет в списке."
      - "Не лучше ли было отправить Справедливость или Суд?"
      - "Как только трансграничные эксперименты будут свёрнуты, у этой парочки появится куча свободного времени."
  - char: "empress"
    side: "left"
    text:
      - "...Ты вообще не проверяла ход четвёртого трансграничного эксперимента?"
  - char: "temperance"
    side: "right"
    text:
      - "Не-а. Мне там делать было нечего. А что, что-то стряслось?"
  - char: "magican"
    side: "left"
    text:
      - "Три системных года назад Справедливость и Суд совместно подали запрос Миру о наложении печати «Чёрного ящика» на весь четвёртый трансграничный эксперимент."
      - "Излишне говорить, что Мир дала согласие."
  - char: "temperance"
    side: "right"
    text:
      - "...Похоже, в итоге я единственная, кто может взяться за эту работу."
      - "Найти подходящий мир, а затем как можно скорее запустить работу отдела интеграции ресурсов. Что-нибудь ещё?"
  - char: "magican"
    side: "left"
    text:
      - "Вообще-то, да. Не могла бы ты заодно приглядывать за Командиром?"
      - "У меня нет неопровержимых доказательств, но вполне возможно, что Мир уже выходила на связь с Командиром через устройство «Мундус». И она может попытаться сделать это снова."
  - char: "temperance"
    side: "right"
    text:
      - "Ясно... В таком случае мне придётся всё тщательно спланировать."
      - "Ах да, и последнее — если этот план провалится, это допустимо?"
  - char: "empress"
    side: "left"
    text:
      - "Конечно. Несмотря на колоссальные затраты ресурсов, это всего лишь один из компонентов Плана Магистра."
      - "А значит, неудача допустима."
      - "Однако ради нашей окончательной победы... провал Плана Магистра недопустим."
  - char: "temperance"
    side: "right"
    text:
      - "...Ради нашей окончательной победы."
