chapter1:
  rows:
  - text:
      - "По мере того как Комета шла на снижение, Киров ясно видела стальные стены, величественно вздымающиеся посреди снега и льда."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Толщина около трёх километров?"
      - "И только видимая часть тянется добрых сто пятьдесят километров..."
  - text:
      - "Бесконечная металлическая стена уходила вглубь морозной дымки."
      - "Сама земля была рассечена надвое этой исполинской конструкцией."
  - char: "ozornoy"
    side: "left"
    text:
      - "Осторожнее, все! Мы заходим на посадку!"
  - char: "gangut_meta"
    side: "right"
    status: "is-meta"
    text:
      - "А, товарищ Киров, мы скоро приземлимся! Перед этим..."
      - "Ой, прости, забыла, что твоя «Комета» более совершенной модели."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ничего страшного. Спасибо за предупреждение."
  - text:
      - "Оглянувшись назад, она отчётливо увидела смоляно-чёрные тучи — гротескную смесь тумана и чёрных частиц."
      - "Всё между морем и небом пожиралось и осквернялось надвигающейся мглой."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "(Похоже, я задержусь здесь на какое-то время...)"

chapter2:
  rows:
  - text:
      - "После того как группа благополучно приземлилась на стену, Озорной отправилась сдавать отчёт об операции, а Гангут осталась в качестве проводника для Киров."
  - char: "gangut_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Товарищ Москва командует из довольно отдалённого сектора, но скоро должна прибыть сюда."
      - "Похоже, ей не терпится поговорить с тобой лично."
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Взаимно. Для меня большая честь встретиться с ней."

chapter3:
  rows:
  - text:
      - "Пока они разговаривали, Киров продолжала разглядывать эту исполинскую крепость, называемую Зимней стеной."
      - "Хотя её и называли «последним рубежом обороны», было очевидно, что строительство всё ещё далеко от завершения."
      - "На этих стенах днём и ночью трудились бесчисленные гигантские строительные машины, а на ветру развевались знамёна самых разных фракций."
      - "Тот миг, когда далёкие темные тучи приблизятся к этим крепостным стенам, и станет крайним сроком для этой титанической стройки."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Значит, вот какая история этого места, да?"
      - "Это определённо навевает воспоминания..."

chapter4:
  rows:
  - text:
      - "Пока они шли по длинному пустому коридору, Киров решила задать вопрос, который не давал ей покоя."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "«Гангут»... Скажи, мы правда сегодня встретились впервые?"
  - char: "gangut_meta"
    side: "right"
    status: "is-meta"
    text:
      - "..А? Я не совсем понимаю, к чему ты клонишь, товарищ Киров."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хоть они и разных моделей, но и у тебя, и у меня есть «Комета». Тебе не кажется это странным?"
  - char: "gangut_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хм... Да не особо? Северный Парламент, из которого ты прибыла, попросту более развит технически, чем наш."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Да, но..."
      - "Полагаю, если ты ничего не знаешь о том, что находится за пределами этого мира, то и обо мне знать не можешь."
      - "И то, что «Вспышка» и «Комета» существуют здесь — лишь совпадение, что они тоже появились на заводах этого мира."
      - "...Если бы всё было так просто."
      - "Скажи мне, «Гангут». Как ты прошла МЕТАморфозу?"
  - char: "gangut_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Это случилось после одного крайне тяжёлого задания."
      - "Прости, товарищ Киров. Я предпочла бы оставить это в прошлом."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ничего страшного. Я лишь хотела убедиться — сколько ты сама знаешь, ты родом с этого полигона и прошла МЕТАморфозу здесь, верно?"
      - "И прежде чем ты ответишь — ты когда-нибудь разбирала свою оснастку или проводила её техобслуживание?"
  - char: "gangut_meta"
    side: "right"
    status: "is-meta"
    text:
      - "За все эти годы мне делали мелкий ремонт, но никакого серьёзного техобслуживания... Товарищ Киров, к чему ты всё-таки клонишь?"
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "По какой-то причине «Вспышка» и «Комета», которыми ты пользуешься... зарегистрированы в моей системе идентификации."
      - "Откуда подобные сигнатуры техобслуживания взялись здесь, на твоей оснастке?"
  - text:
      - "Словно владея этой техникой лучше самой её хозяйки, Киров мгновенно перевела оснастку Гангут в режим техобслуживания."
  - char: "gangut_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Что?! Товарищ Киров, что... ты делаешь?!"
      - "Кто ты вообще такая?! ...Журналы обслуживания... электронные подписи... Что всё это значит?!"
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Сообразительный, Ингрэм. Тебе эти имена о чём-нибудь говорят?"
  - char: "gangut_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я никогда даже не слышала этих имён! Но почему... почему они... прямо здесь, в моих записях об обслуживании?.."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мне и самой хотелось бы узнать ответ, товарищ «Гангут»."

chapter5:
  rows:
  - text:
      - "Внезапно взвыли сирены..."
      - "...резко оборвав этот неловкий разговор."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...На нас напали?"
  - char: "gangut_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ага... К сожалению, преисподняя не станет спокойно смотреть, как мы достраиваем Зимнюю стену."
      - "Впрочем, подобное случается постоянно. Беспокоиться не о чем."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Но те тёмные тучи вдалеке..."
  - text:
      - "Киров продолжала пристально следить за зловещими тучами, но те не подавали никаких признаков изменений. Её системы даже не фиксировали от них подозрительных сигналов."
  - char: "gangut_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хех. Похоже, у нас есть кое-что, чего даже ты ещё не видела."
      - "Уходящие в небеса башни Зимней стены оснащены передовыми детекторами преисподней, способными по малейшим изменениям воздушных потоков предсказывать направление и силу вражеских атак."
      - "История создания этой технологии поистине легендарна, и я с радостью расскажу её тебе после боя!"
      - "...Если, конечно, тебе это интересно."
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Разумеется, мне очень интересно. Но сначала разберёмся с врагами."
  - char: "gangut_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Удержим рубеж ценой собственных жизней! Ни шагу назад!"

chapter6:
  rows:
  - text:
      - "Киров попыталась последовать за рванувшей вперёд Гангут, но каждый шаг давался ей куда тяжелее, чем ожидалось."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "(Учитывая здешнюю обстановку... стоит ли мне запросить помощь у Северного Парламента полигона Бета?)"
      - "(Нет, это исключено.)"
      - "(Этот мир полон тайн. Опасности, что таятся здесь, выходят за рамки человеческого понимания...)"
      - "(Я не должна втягивать в это тех девушек...)"
      - "(Как только мы стабилизируем ситуацию здесь, мы сможем ещё сильнее нарастить производство боевых машин. И тогда...)"
      - "(...шанс на победу перестанет быть лишь фантазией!)"
