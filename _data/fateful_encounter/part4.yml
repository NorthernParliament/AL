chapter1:
  rows:
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Хм-м~♪ Хм-хм-м~♪"
      - "Разве сегодня не прекрасная погода, Профессор?"
  - char: "commander"
    side: "left"
    text:
      - "......"
      - "Да, пожалуй..."
  - text:
      - "И вот Бон Омм Ричард шагнула из моих снов прямо в реальность."
      - "Точнее говоря, Бон Омм Ричард, которую мог видеть только я один, сошла из моих сновидений в реальный мир."
      - "Оставив Марко Поло в Компилирующем Поле и сообщив Ришелье о решении Клемансо, я планировал отправиться в Море Звёзд через гавань Перл Харбор."
      - "Цель состояла в том, чтобы собрать в Море Звёзд исследовательскую группу и наладить стабильный канал связи с полигоном ES-40111."
      - "Однако появление Бон Омм Ричард изменило всё, и я немедленно взял курс на Королевские острова."
      - "Искусственная сингулярность Королевского Флота, Врата Авалона, была ещё одной возможностью создать стабильный канал связи между мирами."
      - "К тому же там находилась Элизабет META."
      - "Если кто и мог разгадать тайну появления Бон Омм Ричард, а также её поразительного миролюбия... то только она."
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Профессор, ты вечно выглядишь так, будто о чём-то слишком много думаешь..."
      - "Знаешь, тебе вовсе не обязательно тащить всё на своих плечах."
      - "Иногда лучше просто позволить вещам идти своим чередом."
  - char: "commander"
    side: "left"
    text:
      - "......"
  - text:
      - "Несмотря на её спокойное поведение, я никак не мог избавиться от ощущения скрывающегося под ним странного напряжения."
      - "Хотя внешне и по поведению она ничем не отличалась от обычного человека, её слова пугающе точно перекликались с моими мыслями, словно у нас был один разум на двоих..."
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Ну, думаю, ничего страшного. Наверное, для профессоров это в порядке вещей."
      - "Если честно, мне даже нравится, когда ты вот так вечно обо всём размышляешь."
      - "Ой... Взгляни на то дерево, Профессор!"
      - "Там собирается стайка птичек! Пойдём посмотрим!"
  - text:
      - "Ричард тянет меня за край одежды так естественно, будто это самое обычное дело, и ведёт к деревьям у обочины дороги."
      - "Мои ноги без малейших колебаний следуют за ней, словно у меня нет права отказаться."
      - "Я не знаю, что произойдёт, если разозлить её. Знаю лишь то, что прямо сейчас её вижу только я, и она ни на шаг не отходит от меня."
      - "И вот я неумолимо подстраиваюсь под её темп, становясь её проводником в этом мире."
  - char: "memphis"
    side: "left"
    text:
      - "Командир, что с тобой? Почему ты так уставился на дерево?.."
  - char: "commander"
    side: "right"
    text:
      - "О, эм... Ричард захотела посмотреть на птиц..."
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "Я собираюсь не просто посмотреть, знаешь ли! Я хочу присоединиться к их посиделкам!"
      - "Они всё это время так громко чирикают. Разве тебе не интересно узнать, о чём они болтают?"

chapter2:
  rows:
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "Ва-а-у... воробьи, синички, горлицы, голуби... и даже зарянка!"
      - "Приветик, птички~ Как ваши дела сегодня?"
  - text:
      - "Может, мне просто кажется, но птичий хор вдруг зазвучал громче."
  - char: "bon_omm_richard2?"
    side: "left"
    text:
      - "Да правда? Ого-ого, понятно!.. А? Вот как?"
  - text:
      - "Ричард кивает в такт, словно понимая, о чём они говорят."
  - char: "commander"
    side: "left"
    text:
      - "...И что же они сказали?"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Хочешь узнать?"
      - "Хе-хе.. Сказали, что сегодня позже пойдёт дождь! А ещё, что им было весело поболтать с нами!"
  - char: "commander"
    side: "left"
    text:
      - "...Они правда всё это сказали?"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Эм-м, наверное?"
      - "Ой, Профессор, замри на секундочку!"
  - text:
      - "Моё тело на миг замирает."
      - "В следующее мгновение чёрно-белый комок со свистом пролетает мимо моей головы и шлёпается на землю, едва не задев поля фуражки."
  - char: "commander"
    side: "left"
    text:
      - "Что это было?"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Хмпф! Похоже, какая-то птичка позавидовала нашей совместной прогулке по саду и решила напакостить!"
      - "Даже не думай, что у тебя что-то выйдет, слышишь?!"
  - char: "commander"
    side: "left"
    text:
      - "Откуда ты знала, что это произойдёт?"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Это мой маленький секрет!"
  - char: "commander"
    side: "left"
    text:
      - "......"
  - char: "memphis"
    side: "right"
    text:
      - "...Командир, ты снова разговариваешь с Ричард?"
  - char: "commander"
    side: "left"
    text:
      - "*вздох* Что ж, для начала мне нужно что-то сделать с этой ситуацией, чтобы не выглядеть сумасшедшим в глазах окружающих."
      - "Тебе удалось организовать мне рейс на Королевские острова?"
  - char: "memphis"
    side: "right"
    text:
      - "Ага. Обо всём позаботились."
      - "Нам подождать, пока Ричард закончит осматривать сад, или..."
  - char: "commander"
    side: "left"
    text:
      - "Э-э, выдвигаемся прямо сейчас."
      - "Мне нужно разобраться в происходящем, иначе я больше сомкнуть глаз не смогу..."
  - char: "memphis"
    side: "right"
    text:
      - "Да... Пойду закончу последние приготовления."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ричард, хочешь теперь отправиться на Королевские острова?"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "А? Ой, конечно! Я за любое твоё решение, Профессор!"
      - "Что ж, пока-пока, птички! Я отправляюсь на Королевские острова вместе с Профессором!"
      - "Эхе-хе~ Не забывайте нас!"
