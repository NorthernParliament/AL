chapter1:
  rows:
  - text:
      - "В залитом светом классе я оказываюсь лицом к лицу с девушкой, которая только что переступила порог."
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "...Профессор?"
  - char: "commander"
    side: "left"
    text:
      - "......"
      - "...Эм, привет?"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Приветик~ Я знала, что это ты, Профессор!"
      - "Давно не виделись! Не против, если я присяду куда-нибудь?"
  - text:
      - "Заметив моё оцепенение, девушка без малейших колебаний заходит в класс."
      - "Она с весёлым видом оглядывает помещение и выбирает место в том же ряду, что и я, всего через одну парту."
      - "Мы смотрим друг на друга, и время словно безмолвно утекает секунда за секундой."
      - "Маленькая девочка, как две капли воды похожая на Зеро, исчезла без следа, будто её здесь никогда и не было."
  - char: "commander"
    side: "left"
    text:
      - "Эм..."
      - "Бон Хомм Ричард?"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Всё верно, это я... Наверное?"
      - "То есть я почти уверена, что это я... но почему-то кажется, что рядом с моим именем стоит вопросительный знак?"
  - char: "commander"
    side: "left"
    text:
      - "...А? Какой ещё вопросительный знак?"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Ты видишь его, Профессор? Если да, значит..."
      - "Ну, а если нет, давай просто сочтём это моим маленьким секретом~♪"
  - text:
      - "Девушка тепло улыбается мне, однако за этим мягким поведением сквозит нечто глубоко тревожное."
  - char: "commander"
    side: "left"
    text:
      - "(Вроде бы выглядит совершенно нормально, но ведь речь идёт о Бон Омм Ричард...)"
      - "(Как ни посмотри, внешне и по голосу — самая обычная девушка...)"
      - "(Даже не знаю, как описать... её речь звучит настолько нормально, что от этого кажется какой-то... ненормальной?)"
      - "(В конце концов, это же САМА Бон Омм Ричард...)"
      - "......"
      - "Слушай, эм... бежать уже поздно?"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Бежать? А зачем тебе это, Профессор?"
  - char: "commander"
    side: "left"
    text:
      - "Ну, потому что передо мной ты, разве нет? В такой ситуации это первое, что следовало бы сделать."
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Хм-м... Вот как?"
      - "Я о многом толком не могу вспомнить."
      - "Знаю лишь то, что когда-то была твоей студенткой..."
      - "Интересно, сможешь ли ты научить меня чему-нибудь ещё?"
  - text:
      - "В её словах кроется странная, притягательная сила. Я почти физически ощущаю, как она подчиняет мои мысли, направляя их в нужное ей русло."
  - char: "commander"
    side: "left"
    text:
      - "(Как и ожидалось от лица флота Федерации по связям с общественностью, да ещё и суперпопулярного идола в придачу...)"
      - "(Мне нужно быть предельно осторожным с ней...)"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Эм, то есть ты хочешь сказать, что потеряла часть воспоминаний?"
      - "Где ты была сегодня раньше? Помнишь, чем занималась до того, как пришла сюда?"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Профессор, ты почему-то так напряжён... и с тебя даже холодный пот градом катится... Ой-ой, тебе нехорошо?"
  - char: "commander"
    side: "left"
    text:
      - "(...)"
      - "Ответь на вопрос, Ричард."
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Окей!"
      - "ы хотел узнать, чем я занималась до того, как пришла в академию, верно? Уж это-то я помню!"
      - "Ну-у-у~ мне только что поручили сверхсекретную миссию по возвращению «Пандоры», и я как раз готовилась к отправлению~"
      - "Мне нужно отправиться, эм... на военно-морскую базу Мейпорт 13-го дивизиона?"
  - char: "commander"
    side: "left"
    text:
      - "Что?!"

chapter3:
  rows:
  - text:
      - "В тёмном океане моих мыслей внезапно начинают всплывать проблески света."

chapter4:
  rows:
  - char: "aoste"
    side: "left"
    text:
      - "Ютопия Савой — полковник военно-морских сил Республики Сардиния, военный советник Океанической Федерации, член Специального следственного комитета и Гарибальди наших дней."
      - "Давно не виделись. Добро пожаловать в Союз Орла."
  - char: "eutopia"
    side: "right"
    text:
      - "...Мы снова встретились с вами двумя."
      - "Я думала, вы прибыли сюда в рамках академического обмена?"
  - char: "aoste"
    side: "left"
    text:
      - "Прости, я всего лишь хотел разрядить обстановку. Не стоит так напрягаться."
  - char: "eutopia"
    side: "right"
    text:
      - "Угу. Это ты придумал прозвище «Гарибальди наших дней»?"
  - char: "aoste"
    side: "left"
    text:
      - "Конечно нет. Неужели ты думаешь, что я дал бы тебе столь банальное прозвище?"
  - char: "eutopia"
    side: "right"
    text:
      - "«Магистр»... «Таинственный»... Да, пожалуй, это на тебя не похоже."
  - char: "aoste"
    side: "left"
    text:
      - "Вот именно. Я бы выбрал что-то вроде «Золотого Ястреба» или «Меченосца»."
  - char: "eutopia"
    side: "right"
    text:
      - "Эм..."
  - char: "aoste"
    side: "left"
    text:
      - "Прости. Это была всего лишь шутка."
      - "В любом случае, догадываешься, почему мы оба здесь?"
  - char: "eutopia"
    side: "right"
    text:
      - "Решил испытать границы дозволенного?"
      - "Я связана подпиской о неразглашении. Даже не надейся, что я стану отвечать на вопросы, касающиеся Специального следственного комитета."
      - "Тем не менее... я могу поделиться личным мнением по некоторым вещам."
      - "Впрочем, я и так никогда не скрывала своего отношения к происходящему."
      - "Итак, о чём вы хотите спросить?"
  - char: "commander"
    side: "left"
    text:
      - "Эм..."
      - "Расскажи о «Пандоре»."
  - char: "eutopia"
    side: "right"
    text:
      - "...Как и намекает название, мы выпустили на волю ужасное чудовище."
      - "Тайны и опасности, сокрытые внутри Кубов Мудрости, уже давно превзошли все наши ожидания."
  - char: "aoste"
    side: "left"
    text:
      - "За исключением моих."
  - char: "eutopia"
    side: "right"
    text:
      - "Верно — превзошли ожидания БОЛЬШИНСТВА из нас."
      - "Я считаю, что необходимо немедленно положить конец этим безумным экспериментам."
  - char: "commander"
    side: "left"
    text:
      - "Эм..."
      - "Что ты можешь рассказать о Джоне Арчере?"
  - char: "eutopia"
    side: "right"
    text:
      - "Я считаю полковника истинным героем."
      - "Его решение спасло жизни многих людей, а уничтожение ящика Пандоры уберегло ещё большее число жизней."
      - "Остаётся лишь надеяться, что теперь этот ящик уничтожен окончательно и бесповоротно..."
      - "Как бы то ни было, я отдаю честь нашему дорогому другу."
  - char: "commander"
    side: "left"
    text:
      - "Эм..."
      - "Я хотел бы узнать о Бон Омм Ричард."
  - char: "eutopia"
    side: "right"
    text:
      - "...Она была хорошей девочкой. Она не должна была встретить такой конец."
      - "Обещаю, Комитет проведёт честное расследование."
      - "Пусть она покоится с миром..."

chapter5:
  rows:
  - text:
      - "Из глубин моей памяти продолжают всплывать обрывки информации, и на этот раз поток воспоминаний длится необычайно долго."
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Хм? Что с тобой, Профессор? Ты уже давно смотришь в одну точку. Вспомнил что-то?"
  - char: "commander"
    side: "left"
    text:
      - "Эм..."
      - "Ричард, держись подальше от «Пандоры»."
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Эм..."
      - "Да, я знаю."
      - "Спасибо, Профессор."

chapter6:
  rows:
  - text:
      - "Динь-дон..."
      - "По всей академии разносится звук последнего звонка."
      - "В тот же миг меня словно накрывает волна сонливости."
  - char: "commander"
    side: "left"
    text:
      - "(Это...)"
      - "(...я впервые слышу, как здесь звонит последний звонок...)"
      - "(Уснуть во сне... значит, скоро я вернусь в реальность...)"

chapter7:
  rows:
  - text:
      - "Тяжёлые веки смыкаются, и окружающий мир медленно погружается во тьму."
      - "Последнее, что я вижу перед тем, как угаснет сознание... это исчезающая из класса Бон Омм Ричард."
      - "Рядом со мной стоит девочка, похожая на Зеро... будто она была здесь всё это время."
  - char: "zero_kid??2"
    side: "left"
    text:
      - "......"
  - text:
      - "А затем осталась лишь тьма..."

chapter8:
  rows:
  - text:
      - "Яркий солнечный свет пробивается сквозь шторы, рассыпая блики по всей комнате."
  - char: "commander"
    side: "left"
    text:
      - "(Какая чудесная погода... Я целую вечность так хорошо не высыпался...)"
      - "(Тот сон прошлой ночью... Неужели я обязан этим прекрасным сном именно ему?..)"
      - "*вздох* Пожалуй, так и есть..."
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "Доброе утро, Профессор."
      - "Если вздыхать с самого утра, вся удача на день улетучится, ты же знаешь~"
  - char: "commander"
    side: "left"
    text:
      - "Утречка, Ричард..."
      - "......"
      - "Эм..."
      - "ЧТО-О-О-О-О?!"
      - "Бон Омм Ричард?! Что ты здесь делаешь...?!"
  - char: "bon_omm_richard2?"
    side: "right"
    text:
      - "М-м-м... Я и сама толком не понимаю."
      - "Проснулась — и оказалась здесь."
      - "Скорее уж мне хотелось бы кое о чём спросить тебя..."
      - "Профессор, где мы?"
