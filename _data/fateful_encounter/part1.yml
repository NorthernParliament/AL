chapter1:
  rows:
  - text:
      - "Сигнал маяка пропал. Когда видимые пространственные искажения рассеялись, Киров оказалась в точке назначения."
      - "Видимость здесь была скверной. Между небом и землёй хаотично кружилась дымка чёрных частиц."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Мерзкое местечко."
      - "Система очистки и защитное снаряжение... Отлично, всё работает исправно."
  - text:
      - "Тщательно проверив экипировку, Киров принялась осматривать местность."
      - "С первого же взгляда стало ясно: эти равнины сначала затопило, а затем сковало льдом."
      - "Толстые пласты мутного льда были пронизаны теми же чёрными частицами, сплетающимися под ногами в зловещие полосы."
      - "Сквозь них едва виднелись бесчисленные обломки каменных и стальных конструкций."
      - "А дальше простиралась лишь зияющая тьма, уходящая в бесконечную даль."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Это не источник сигнала. Похоже, навигатор сингулярности ошибся."
      - "...Может, дело в помехах от чёрных частиц?"
      - "Впрочем, чего ещё ожидать от этого проклятого полигона. Пора бы уже привыкнуть."
      - "И всё же не могу отрицать, что эмоции берут верх..."
      - "Неужели я слишком привыкла к этому миру... или пламенная кровь в моём сердце наконец вновь вскипела?"
  - text:
      - "БАБАХ!!!"
      - "Внезапный обстрел взметнул вихрь чёрного тумана, однако пробить защитный барьер Киров ему не удалось."
      - "Залпы доносились не с одной стороны — отовсюду с пугающей скоростью начали материализоваться искажённые чёрные тени."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Похоже, это руины не какого-то давнего поля боя. Сражение здесь ещё не окончено."
      - "Тем лучше. Заодно быстро оценю уровень угрозы на этом полигоне."
      - "Никого не пощажу. Обратитесь в прах!"

chapter2:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Механические спутники Киров, «Вспышка» и «Комета», в смертоносном танце когтей и клыков создали огромную зону смерти из ветвящихся электрических дуг."
      - "Они быстро расправились с наступающими тенями и развеяли клубящийся чёрный туман."
      - "Казалось, с внезапным нападением врага на какое-то время было покончено..."
      - "Однако разбитые чёрные частицы продолжали оседать слоями на лёд, покрывая его чернильной тьмой."
      - "Затем лёд сублимировался, высвобождая частицы обратно в воздух, где они вновь стремительно превращались в новых врагов."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что?.. Они проявляют свойства сущностей-мимиков?!"
      - "Я не могу позволить себе растратить все силы в этом месте."
      - "Активировать оборудование нейтрализации прямо сейчас или отступить и собрать информацию?.."
  - text:
      - "Пока Киров обдумывала дальнейшие действия, она внезапно засекла сигнал, стремительно приближающийся с большой высоты."
      - "Этот сигнал её прежнее «я» знало слишком хорошо — сигнал, которого здесь попросту не могло существовать."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Союзная «Комета»?"

chapter3:
  rows:
  - char: "gangut_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Товарищ! Товарищ, ты меня слышишь?"
      - "С какого фронта ты отступила? Что с нашими союзниками в Арктике..."
  - char: "ozornoy_rad"
    side: "right"
    text:
      - "Сейчас не время устраивать допрос!"
  - char: "gangut_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "...Прости, дала волю чувствам."
  - char: "ozornoy_rad"
    side: "right"
    text:
      - "...Слушай, товарищ. Эта зона признана поглощённой преисподней. Верховный совет оставил её три дня назад!"
      - "Убирайся оттуда, иначе твоей жизни конец!"
      - "Мы идём на помощь, чтобы подобрать тебя, так что продержись ещё немного!"

chapter4:
  rows:
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Гангут?"
      - "Тот сигнал бедствия... Это ты его отправила?"
      - "Но как?.. Как это могла быть ты?.."

chapter5:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Вскоре после этого Гангут и Озорной спикировали вниз, чтобы оказать поддержку."
      - "Киров не могла скрыть, что её модели «Вспышки» и «Кометы» были гораздо совершеннее, чем у её спасительниц, поэтому она согласилась ответить на их вопросы."
      - "Она сказала им: «Я с другого полигона и поспешила сюда, получив сигнал бедствия»."
      - "Однако они, казалось, ничего не знали об этом сигнале бедствия и предложили сначала покинуть этот район, прежде чем разбираться дальше."
      - "И вот они взмыли ввысь вместе с Киров, словно солдаты, успешно завершившие дерзкую спасательную операцию."

chapter6:
  rows:
  - text:
      - "Вырвавшись из окружения чёрной дымки, Киров открыла глаза и увидела белый мир снега и льда."
      - "Хотя следы войны были более чем очевидны, местность была ей знакома."
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Северный Парламент."
      - "Зима здесь... кажется особенно суровой."
      - "Куда вы меня везёте, товарищ «Гангут»?"
  - char: "gangut_meta"
    side: "right"
    status: "is-meta"
    text:
      - "К последнему, несокрушимому рубежу обороны. Там собраны все наши ресурсы и личный состав."
  - char: "moskva_rad"
    side: "left"
    text:
      - "...К «Зимней стене»."
  - char: "gangut_meta"
    side: "right"
    status: "is-meta"
    text:
      - "А, товарищ Москва! Ты на связи!"
  - char: "moskva_rad"
    side: "left"
    text:
      - "Да. Благодарю за проделанную работу в этой операции, товарищ Гангут и товарищ Озорной."
      - "И, товарищ Киров, я уже получила о тебе базовые сведения."
      - "Признаться, я весьма удивлена."
      - "Впрочем, в этот миг я прежде всего искренне рада."
      - "Нашему товарищу, преодолевшему границу между мирами, чтобы прибыть сюда — от лица Верховного совета выражаю глубочайшее уважение."
      - "Добро пожаловать... в Северный Парламент."
