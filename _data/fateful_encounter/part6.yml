chapter1:
  rows:
  - text:
      - "В тайном убежище, запрятанном в одном из уголков города, Бристоль рассматривала своё новейшее творение."
  - char: "essex_detective"
    side: "left"
    text:
      - "......"
  - char: "bristol_tales"
    side: "right"
    text:
      - "Ну как тебе маскировка? Круто выглядит, а?"
      - "Хочешь верь, хочешь нет, но я и сама в каком-то роде мастер маскировки."
  - char: "essex_detective"
    side: "left"
    text:
      - "...Признаки твоей МЕТАморфозы она скрывает весьма неплохо."
      - "Но ради чего всё это?"
      - "Зачем ты играешь в детектива?"
  - char: "bristol_tales"
    side: "right"
    text:
      - "Этому городу никогда не помешают лишние детективы! Разве не согласна?"
  - char: "essex_detective"
    side: "left"
    text:
      - "Меня это совершенно не заботит."
      - "Так что это вообще за место?"
  - char: "bristol_tales"
    side: "right"
    text:
      - "По сути, это небольшое хранилище расследований, составленных лично мной! Можешь прочесть сколько угодно, если хочешь."
  - char: "essex_detective"
    side: "left"
    text:
      - "Расследований?.. Ты про эти блокноты на столе?"
  - text:
      - "Эссекс взглянула на блокноты, лежащие на столе рядом с ней."
  - char: "essex_detective"
    side: "left"
    text:
      - "«Шок! Реалии ночной жизни в большом городе»..."
      - "«Переулок, из которого невозможно выбраться, пока не сделаешь ЭТО»..."
      - "«Три простых лайфхака, которые помогут понять Правило Крутизны»... «Дело о служащем, который не может уйти с работы»..."
      - "«Мир, родившийся пять минут назад»... «Помогите! Мои питомцы какают драгоценностями»... «Некрономикон»..."
      - "......"
  - char: "bristol_tales"
    side: "right"
    text:
      - "Какие-то проблемы? В смысле, неужели тебе прямо до смерти не хочется узнать, о чём там речь, с такими-то названиями?"
  - char: "essex_detective"
    side: "left"
    text:
      - "...Если в этом городе и есть кто-то подозрительный, то это ты."
      - "Кто ты вообще такая?"
      - "И что ты скрываешь под этой маскировкой?"
  - char: "bristol_tales"
    side: "right"
    text:
      - "Как и ожидалось от великого детектива. Ты смогла сопоставить всё воедино так быстро."

chapter2:
  rows:
  - text:
      - "Тьма, сквозь которую не мог пробиться ни один луч света, начала клубиться по всей комнате."
      - "Прежде чем Эссекс успела атаковать, во тьме засиял фонарь, источая тусклый свет."
  - char: "bristol_meta?"
    side: "left"
    text:
      - "«Словно мотыльки на пламя, притянутые сиянием фонаря»."
  - text:
      - "Затем тьма распалась на бесчисленные фрагменты, которые сгустились в мириады чернильных мотыльков, взмывших в воздух, будто оживлённые неведомой силой."
  - char: "bristol_meta?"
    side: "left"
    text:
      - "«О мотыльки, летящие в чистилище, верните эту путницу туда, откуда она пришла»."
  - text:
      - "Кружащие мотыльки в безумном порыве ринулись к фонарю."
      - "Пламя внутри окрасилось в ярко-алый цвет, поглощая плоть и кровь роя мотыльков, и с яростным треском обращало их тела в пепел."
  - char: "essex_detective"
    side: "left"
    text:
      - "Что... ты сделала?"
  - char: "essex_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Гх... моя голова... только не снова..."
  - char: "essex_detective"
    side: "left"
    text:
      - "Быстрее..."
  - char: "essex_meta?"
    side: "left"
    status: "is-meta"
    text:
      - "«Стоп»."

chapter3:
  rows:
  - text:
      - "Внезапно мотыльки и фонарь растворились в небытии, словно время отмоталось на несколько минут назад."
      - "Эссекс просто стояла в оцепенении, пока Бристоль задумчиво разглядывала её тень."
  - char: "bristol_meta?"
    side: "left"
    text:
      - "Понятно... Значит, ты не просто случайно сюда забрела. Тебя призвали."
      - "Прошу прощения, что слегка перегнула палку. Мой просчёт."
      - "Настоящий детектив ни за что не станет портить улики, верно?"
      - "О, придумала! В знак извинения держи немного припасов."
      - "Удачи, великий детектив. Ещё увидимся!"

chapter4:
  rows:
  - text:
      - "С этими словами Бристоль исчезла, словно мимолётная тень."
      - "Вскоре после этого ход времени в комнате начал возвращаться в норму."
  - char: "essex_detective"
    side: "left"
    text:
      - "...Что сейчас произошло?"
      - "Это же... Точно, моя тайная база..."
      - "Я Эссекс, великий детектив, и я прибыла в этот город, чтобы расследовать череду странных происшествий."
      - "В этом блокноте... должны быть записи моих прошлых расследований, верно?"
      - "Надо взглянуть..."
      - "Ага! Это все документы, которые я собрала раньше, я уверена!"
      - "Так и должно быть!"
      - "Голова всё ещё кружится, но ничего, развеюсь на ходу... В любом случае, пора приниматься за работу!"
