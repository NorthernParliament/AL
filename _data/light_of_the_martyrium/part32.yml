chapter1:
  rows:
  - text:
      - "Два Арбитра, Влюбленные и Императрица, возвели линию обороны, чтобы отразить вторжение Икс."
      - "Это столкновение между неудержимой силой и неподвижным объектом всё ещё продолжалось."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-lightgray"
    text:
      - "Вы меня смешите."
      - "Да ладно вам, может, уже закончим с этим?"
      - "Я всего лишь хочу нанести небольшой визит. А вы тут драму развели."
      - "Посмотрите на себя. Вы выстроили глухую линию обороны, и что толку?"
      - "На тестовом полигоне бета уже творится полная неразбериха, а я туда ещё даже не добралась."
      - "Так какой смысл меня не пускать?"
  - char: "lovers"
    side: "left"
    text:
      - "Твоя логика ошибочна."
      - "Если мы пустим тебя внутрь, то сделаем плохую ситуацию ещё хуже."
      - "Я уже говорила тебе: твое поле боя ЗДЕСЬ."
      - "ы ведь терпелива, не так ли? Тогда покажи нам, насколько."

chapter2:
  rows:
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ах! Солнышко, песок и тропический коктейль!"
      - "Мне был просто необходим этот отпуск."
      - "Если они все хотят суетиться, пусть делают это без меня."
      - "А я просто побуду здесь и расслаблюсь."

chapter3:
  rows:
  - char: "voice_an"
    side: "right"
    text:
      - "*вой сирен*"
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что?! Сигнал воздушной тревоги?!"
      - "Но я же вообще ничего не сделала!"
      - "Это вторжение Сирен, или что?"
      - "Я думала, это задний двор Союза Орла?"
      - "Что происходит?"
      - "...Ох."
