chapter1:
  rows:
  - text:
      - "Стояла кромешная тьма, которую нарушал лишь тусклый свет приборной панели."
      - "Помещение гудело от электрического шума и звуков работающих механизмов — это был какой-то пункт управления."
  - char: "devil"
    side: "left"
    status: "is-red"
    text:
      - "М-да, как-то тут темновато."
  - text:
      - "Девочка сидела среди хаотичного сплетения десятков проводов, полностью поглощенная тем, что находилось прямо перед ней."
  - char: "devil"
    side: "left"
    status: "is-red"
    text:
      - "Если я выполню принудительную загрузку... это заставит энергосистему работать на пределе."
      - "Вместо этого придется сосредоточиться на взломе системы безопасности."
      - "И тогда первым делом я снова включу свет."
      - "Угх... В этом месте чертовски темно."

chapter2:
  rows:
  - char: "sheffield_meta"
    side: "right"
    status: "is-meta"
    text:
      - "......"
      - "Действительно. Здесь И ПРАВДА слишком темно."
