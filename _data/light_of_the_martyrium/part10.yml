chapter1:
  rows:
  - text:
      - "Эльзас, Могадор и Бреннус покидают вагон, в то время как остальные из нас остаются."
      - "Мало-помалу я чувствую, как приближающееся враждебное присутствие становится осязаемым."
  - char: "mogador_rad"
    side: "right"
    text:
      - "Команди-и-ир! Мы вошли в третий вагон, и я кое-что вижу."
      - "Тут... клубится черный туман, и в воздухе парит какая-то белая штуковина."
      - "Ох, ну и мощное же у них присутствие. Теперь я понимаю, почему Мисс D была так напугана."
      - "Если бы у страха был запах, это место провоняло бы им насквозь."
  - char: "brennus_rad"
    side: "left"
    text:
      - "Звук приближающейся смерти. Тихий, но пронзительный шум..."
  - char: "alsace_rad"
    side: "right"
    text:
      - "Я временно отключу свой эмоциональный модуль. Это должно сделать меня, эм, бесстрашной!"

chapter2:
  rows:
  - text:
      - "Несмотря на значительное расстояние между нами, аура смерти ясна как день."
      - "Невыразимое давление просачивается сквозь щели в двери, воздействуя на мое тело, как нечто физическое."
  - char: "commander"
    side: "left"
    text:
      - "(Гнилостный и сырой — вонь всепоглощающей смерти. Да, Могадор, ты попала в самую точку с этими словами.)"
  - char: "miss_d"
    side: "right"
    text:
      - "Мне страшно! Мне стра-а-ашно!"
      - "Нет, нет, не-е-ет! Как что-то настолько пугающее проникло в поезд?!"
  - char: "epee"
    side: "left"
    text:
      - "Я не боюсь, я не боюсь, я не боюсь..."
      - "Мои подруги здесь, поэтому я не боюсь..."
  - char: "miss_d"
    side: "right"
    text:
      - "Не обманывай себя! Ты дрожишь так же сильно, как и все остальные!"
  - char: "epee"
    side: "left"
    text:
      - "Я-я ничего не могу с этим поделать... Мне так страшно, что кажется, будто я сейчас умру!"
  - char: "miss_d"
    side: "right"
    text:
      - "Мне то-о-оже!"
  - char: "fleuret"
    side: "left"
    text:
      - "Что бы там ни приближалось, это плохо. ПЛОХО."
      - "Не знаю, как долго я смогу продержаться против этого... но без боя я не сдамся."
      - "Командир, отступай в шестой вагон! Я как-нибудь удержу оборону!"
  - char: "commander"
    side: "right"
    text:
      - "(Ситуация уже становится угрожающей...)"

chapter3:
  rows:
  - char: "mogador_rad"
    side: "right"
    text:
      - "Эй, Командир, нам уже начинать атаковать?"
  - char: "commander"
    side: "left"
    text:
      - "(Я не сомневаюсь в их боевых способностях, просто мы понесем серьезные потери, если в итоге ввяжемся в драку с Арбитром.)"
      - "(Но какая есть альтернатива? У нас осталось не так уж много вагонов для отступления...)"
  - char: "mogador_rad"
    side: "right"
    text:
      - "Эмм, враг вошел в четвертый вагон. Они нанесут первый удар, если мы сейчас же что-нибудь не предпримем."
  - text:
      - "Я смотрю сквозь стекло межвагонной двери. Там, в четвертом вагоне, я вижу это — нечто, парящее в воздухе, окутанное черным туманом, направляющееся прямо ко мне."

chapter4:
  rows:
  - char: "scythexiii???"
    side: "right"
    status: "is-red"
    text:
      - "Ха-а..."

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Черт возьми. Лучше сделать ХОТЬ ЧТО-ТО, чем просто сидеть здесь.)"
      - "Могадор! Открывай ог–"
  - char: "miss_d"
    side: "right"
    text:
      - "Подожди! Стой, стой, стой!"
  - text:
      - "Прямо перед тем, как я успеваю отдать приказ, Мисс D прыгает передо мной и перебивает меня."
  - char: "miss_d"
    side: "right"
    text:
      - "Теперь я знаю! Я знаю, кто этот нарушитель!"
      - "Самозванка! Она самозванка!"
      - "Самозванка, самозванка, самозванка!"
      - "Она тупая, чертова самозванка!"
  - char: "commander"
    side: "left"
    text:
      - "Успокойся. Что ты имеешь в виду под «самозванкой»?"
  - char: "miss_d"
    side: "right"
    text:
      - "Это всё из-за неё я не смогла поймать кита! И она забралась так далеко только потому, что она самозванка!"
      - "Она не пробивалась в поезд силой! Она сымитировала всю мою концепцию и пробралась внутрь обманом!"
  - char: "mogador_rad"
    side: "left"
    text:
      - "Она... сымитировала твою концепцию? Значит, она, типа, такая же, как ты?"
      - "Так что если ты Арбитр, значит, этот враг тоже... Но как её зовут?"
  - char: "miss_d"
    side: "right"
    text:
      - "Да кому какое дело до её имени?! Важно то, что вы бы погибли, сразись вы со мной, и вы погибнете, если сразитесь с ней!"
      - "Убирайтесь оттуда! Беги-и-ите!"
  - char: "brennus_rad"
    side: "left"
    text:
      - "Мы не можем отказаться от миссии Меченосца. Более того, разве побег — это решение?"
  - char: "epee"
    side: "right"
    text:
      - "Если мы не сможем её остановить, нам придется полностью бросить поезд..."
  - char: "miss_d"
    side: "left"
    text:
      - "Так я о том и говорю! К черту поезд, отправляемся в Мартириум!"
  - char: "fleuret"
    side: "right"
    text:
      - "Нет, ты ведь не серьезно! Как мы вообще туда попадем?"
  - char: "alsace_rad"
    side: "left"
    text:
      - "Я могла бы материализовать свою оснастку, чтобы вы все могли на ней поехать... Однако проходимость этого пространства весьма сомнительна."
      - "Без воздуха мои двигатели не смогут работать — более того, Командир задохнется."
  - char: "miss_d"
    side: "right"
    text:
      - "Не тупи! Я не говорю о том, чтобы выходить ТУДА!"
      - "Мартириум был воплощен с помощью седьмого вагона, помните? Он должен быть соединен с шестым вагоном!"
      - "Мы пройдем через дверь и окажемся там! Давай, возвращайтесь все сюда, живо!"
  - char: "fleuret"
    side: "left"
    text:
      - "Подожди, это так работает?"
  - char: "alsace_rad"
    side: "right"
    text:
      - "Мой мыслительный процессор начинает перегреваться..."
  - char: "mogador_rad"
    side: "left"
    text:
      - "Звучит как натяжка, но, может быть, она права?"
  - char: "miss_d"
    side: "right"
    text:
      - "Нет времени спорить! Ассистент, скажи им отступать ПРЯМО СЕЙЧАС! Давай, давай, давай!"
  - char: "commander"
    side: "left"
    text:
      - "Если вагон ведет прямо в город, почему Элизабет просто не воспользовалась этим путем?"
  - char: "miss_d"
    side: "right"
    text:
      - "Потому что она тупая идиотка, а ты нет!"

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Ситуация уже становится угрожающей...)"

chapter7:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ладно, хорошо!"

chapter8:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Флёре, иди в четвертый вагон и забери команду Эльзас! Мы встретимся в шестом вагоне и отступим через дверь в Мартириум!"
  - char: "miss_d"
    side: "right"
    text:
      - "Вот так! Бежим! Бежим, все!"
