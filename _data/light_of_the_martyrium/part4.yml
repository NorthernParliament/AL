chapter1:
  rows:
  - text:
      - "Мы решаем понаблюдать, не появятся ли еще пространственные колебания — искажения, вызванные огромными источниками энергии."
  - char: "mogador"
    side: "left"
    text:
      - "Итак, Командир... Думаешь, он решил проявить осторожность, потому что его засада провалилась?"
  - char: "fleuret"
    side: "right"
    text:
      - "И он появится снова, если мы притворимся беззащитными?"
  - char: "alsace"
    side: "left"
    text:
      - "А?! В этом есть смысл, но использовать себя в качестве приманки звучит слишком опасно!"
  - char: "brennus"
    side: "right"
    text:
      - "Меченосец, я согласна, что терпение — это ключ к успеху. Мы всё ещё не знаем всей мощи кита. Если мы проявим слабость, это может оказаться фатальным."
  - char: "mogador"
    side: "left"
    text:
      - "Одно дело хотеть, чтобы тобой воспользовались, но чтобы это сделал враг? Ни за что!"
      - "Цель кита — избежать поимки, а не убить нас, верно? Что, если он просто будет прятаться, пока мы не уйдем?"
  - char: "epee"
    side: "right"
    text:
      - "Т-тогда что нам делать?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что, если кит так быстро сбежал из-за недавнего пространственного возмущения?"
  - char: "commander"
    side: "right"
    text:
      - "Хмм... Насколько я помню, сражения с Сиренами вызывают пространственные возмущения. А они, в свою очередь, приводят к пространственным колебаниям?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Верно. Вся эта операция началась с предположения, что кита тянет к пространственным возмущениям."
      - "Если это место подвержено такому же влиянию... Хм, должно быть, это пространственное возмущение было очень сильным."
      - "Эти координаты, должно быть, были экспериментальным полем, где сражались Сирены, или чем-то в этом роде."
      - "Но здесь ничего нет. Пространственное возмущение было настолько интенсивным, что стерло с лица земли всю эту область."
      - "Ммм... По сути, концепция, стертая из материи, вернулась в другое измерение, заставив пространство свернуться внутрь себя и создать в этом измерении особую область."
      - "Например, море, в котором плавал кит. Когда море исчезло, кит последовал за концепцией этого моря и исчез из реальности."
      - "Но как только он покинет мир этой концепции, на этом всё. Это была наша ошибка."
  - char: "miss_d"
    side: "right"
    text:
      - "Что? Если для него нет физической основы, просто создайте новую!"
      - "Возьмите новую основу и закрепите на ней концепцию! Проще простого!"
      - "Если этот кит сейчас уйдет, неизвестно, когда я увижу его снова!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "В этом ты права. Мы будем в беде, если он снова сбежит в концептуальное пространство."
      - "Если так пойдет и дальше, тот, кто сейчас манипулирует китом, может просто получить над ним полный контроль."
      - "В худшем случае эта охота на кита может стать для нас последней."
  - char: "miss_d"
    side: "right"
    text:
      - "Я же ГОВОРИЛА, никто, кроме меня, не может управлять китом! И если я говорю, что никто не может, значит, никто не может!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Но что, если этот кто-то — ты?"
      - "Вы, программы Антиоха, все еще можете функционировать, даже если не целостны. Что, если китом управляет другая Мисс D?"
  - char: "miss_d"
    side: "right"
    text:
      - "Ах..."
      - "АААААААХ!"
      - "Проклятье, проклятье, проклятье! Это и правда вполне возможно!"
      - "Я такая идиотка! Моего кита украду... Я САМА!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что ж, мы рады, что ты понимаешь всю серьезность ситуации."

chapter2:
  rows:
  - char: "alsace"
    side: "left"
    text:
      - "Спасибо, Командир. Мне жаль, что тебе пришлось их успокаивать..."
      - "Но я всё ещё не понимаю, как мы должны вытащить этого кита из укрытия."
  - char: "commander"
    side: "right"
    text:
      - "Нас уже двое. Мне бы точно не помешали дополнительные объяснения."
  - char: "fleuret"
    side: "left"
    text:
      - "Я ВООБЩЕ ничего не понимаю!"
  - char: "epee"
    side: "right"
    text:
      - "Я-я тоже..."
  - char: "brennus"
    side: "left"
    text:
      - "Аналогично, Меченосец."
  - char: "mogador"
    side: "right"
    text:
      - "Кажется, я вроде как поняла... Ммм, но я не уверена..."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Сейчас это слишком сложно объяснить, да вам и не нужно понимать принципы."
      - "Однако мы придумали способ вытащить кита из укрытия. Но это опасно."
      - "Изначально наш план состоял в том, чтобы схватить кита, пока Антиох занят сражением со своим врагом..."
      - "Но ситуация указывает на то, что их враг жив и здоров, и он не враждебен по отношению к киту."
      - "Другими словами, если мы попытаемся вытащить кита, нам, возможно, придется сражаться сразу с двумя фракциями."
      - "В лобовом столкновении у нас не будет и шанса."
      - "Так что план таков... вы все возвращаетесь в бета таймлайн! Мы с Мисс D сами здесь со всем разберемся!"
  - char: "miss_d"
    side: "right"
    text:
      - "Ассистент не может уйти!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что?!"
  - char: "miss_d"
    side: "right"
    text:
      - "Я не знаю почему! Но я это знаю!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мы терпели тебя достаточно долго, но наше терпение на исходе."
      - "Если ты сию же минуту не назовешь нам вескую причину, мы забираем нашего слугу домой!"
  - char: "miss_d"
    side: "right"
    text:
      - "Бу-у-у! Нет значит нет!"
      - "Поддержи меня, ассистент! Я защищу тебя. Только не бросай меня!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Довольно! Мы обещали другой Элизабет, что её слуга вернется целым и невредимым!"
  - char: "miss_d"
    side: "right"
    text:
      - "НЕ-Е-Е-ЕТ!"

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Опять они за свое..."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ладно, девочки, успокойтесь..."

chapter5:
  rows:
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Слуга, тебе есть что добавить?"
  - char: "miss_d"
    side: "left"
    text:
      - "Ассисте-е-ент!"
  - char: "commander"
    side: "right"
    text:
      - "Как по мне, у нас слишком мало времени, чтобы тратить его на споры."
      - "Я прибыл сюда, прекрасно осознавая все риски этой операции."
      - "Если безопасность действительно наш главный приоритет, то сейчас самое время всё бросить и отправиться домой."
      - "Кроме того, есть кое-что, в чем я хочу разобраться."
      - "Помимо кита... Я не могу упустить возможность узнать больше об Антиохе и альфа таймлайне."
      - "Как Командир, я участвовал в бесчисленных сражениях. Каждый раз, когда мы вместе сталкивались со смертельной опасностью, мы её преодолевали."
      - "Я доверяю тем, кто меня защищает, и взамен хочу, чтобы все вы доверяли моей решимости."
  - char: "miss_d"
    side: "left"
    text:
      - "Да, вот так! Я защищу тебя, таинственный ассистент!"
  - char: "alsace"
    side: "right"
    text:
      - "Раз ты так говоришь, Командир... тогда я полна решимости сражаться."
  - char: "mogador"
    side: "left"
    text:
      - "Хе-хе, я никому не позволю и пальцем тебя тронуть, Командир♥"
  - char: "commander"
    side: "right"
    text:
      - "(У меня здесь друзья и союзницы. Надо сначала продумать контрмеры, прежде чем предпринимать что-то радикальное.)"
      - "(Если Мисс D готова стать нашей союзницей, то, возможно, мы даже сможем заручиться поддержкой Хелены.)"
      - "(Я не получил от неё ни единой весточки с тех пор, как покинул конференцию.)"
      - "(Но я знаю её. Даже если наши каналы связи восстановились, она не выйдет на связь, пока в этом не возникнет острая необходимость.)"
      - "(В любом случае, я смогу обсудить это со всеми в другой раз.)"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Твое самообладание выдает недостаток понимания ситуации, Командир."
      - "Даже мы не хотим сражаться с врагом, способным вызвать столь мощное пространственное возмущение."
  - char: "alsace"
    side: "right"
    text:
      - "Тебя пугает военная мощь или сила концепции?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "И то, и другое. Вы нам не верите?"
  - char: "mogador"
    side: "right"
    text:
      - "Мы доверяем Командиру. А Командир доверяет тебе, так что..."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ну хорошо. Похоже, вы не собираетесь отступать."
      - "Что касается того, как создать основу, чтобы закрепить концепцию и вытащить кита..."
      - "В бета таймлайне ведь использовались «якоря концепции», верно? В таком случае..."
  - char: "miss_d"
    side: "right"
    text:
      - "Элизабет, поезд! Используй один из вагонов!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ух... Нам правда обязательно это делать?"
  - char: "miss_d"
    side: "right"
    text:
      - "Конечно! «Свет Королевы» достаточно прочный и плотный! Он идеально подходит для превращения обособленного пространства в основу!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Но наш драгоценный вагон..."
  - char: "commander"
    side: "right"
    text:
      - "(Похоже, она действительно не хочет расставаться с этим вагоном... Наверное, на его постройку ушло астрономическое количество усилий.)"
  - char: "miss_d"
    side: "left"
    text:
      - "Когда мы поймаем кита, ты сможешь просто превратить его обратно в вагон!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ух-х-х... Ладно."
      - "А теперь, какую концепцию мы будем использовать для воплощения кита?"
      - "Может быть, мост?"
      - "Вместе с ним появится река, дав киту место для плавания. Если он сбежит, мы сможем переправиться по нему и пуститься в погоню."
  - char: "commander"
    side: "left"
    text:
      - "(Мне это не нравится. Это лишь означает, что мне снова придется всех оставить.)"
      - "Погодите-ка секунду. Давайте кое-что проясним."
      - "Кит вошел в отдельное, свернутое пространство. Вот почему мы не можем добраться до него из физического мира."
      - "Поэтому нам нужно задать ему концепцию и привязать к ней, чтобы вытащить в наш мир."
      - "Для этого мы используем вашу технологию вагонов из Зеркального моря, чтобы изменить сжатое пространство с концепцией «поезда» на другую концепцию, превратив его в иное пространство."
      - "Если эта концепция сможет соединиться с пространством, где находится кит, он сможет воплотиться здесь."
      - "И затем мы ловим его, прежде чем он успеет сбежать... Пока что я всё правильно понял?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "(Ого... Какой содержательный анализ.)"
      - "Более или менее, всё так."
      - "А теперь, Командир, что ты думаешь насчет концепции? Что с наибольшей вероятностью соединит нас с пространством, в котором находится кит?"
  - char: "commander"
    side: "left"
    text:
      - "Как насчет дверей?"
      - "Может, мы сможем пройти через них и добраться до кита. Двери были во всех воображаемых пространствах, связанных с Арбитрами... и с альфа таймлайном тоже."
      - "(И я уже бывал в этих пространствах несколько раз.)"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "(Командир тоже знает о дверях?..)"
  - char: "miss_d"
    side: "left"
    text:
      - "Нет, нет, не-а! И двери, и мост не подходят!"
      - "Это Смерть! Только Смерть может поймать кита!"
  - char: "commander"
    side: "right"
    text:
      - "(Смерть... Ха? Так вот что означает буква «D» в имени Мисс D (Death = Смерть)  ?)"
      - "(Смерть — это еще и карта таро... Она как-то связана с Арбитрами?)"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты готов рискнуть нашими жизнями из-за слова, которое так легко пришло на ум?"
  - char: "commander"
    side: "right"
    text:
      - "Я доверяю ей. Звучит немного жестоко, но Мисс D знает кита лучше, чем все мы вместе взятые."

chapter6:
  rows:
  - char: "alsace"
    side: "left"
    text:
      - "Командир так быстро принял концепцию смерти! Это было даже быстрее работы моего аналитического модуля!"
  - char: "brennus"
    side: "right"
    text:
      - "Меченосец знает больше нас. Сейчас самое время довериться суждению нашего лидера."
  - char: "mogador"
    side: "left"
    text:
      - "Мне нравится позволять Командиру играть со мной. Да, я просто подожду и посмотрю, что будет."

chapter7:
  rows:
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Закрепление концепции смерти означает, что, ну... Нам придется её представить."
      - "Мы будем управлять поездом, из чего следует, что мы..."
  - char: "miss_d"
    side: "left"
    text:
      - "Никаких МЕТА!"
  - char: "commander"
    side: "right"
    text:
      - "Ладно, тогда позволь мне..."
  - char: "miss_d"
    side: "left"
    text:
      - "И никаких ассистентов тоже! Если у тебя нет этой концепции, то держись от нее подальше!"
      - "Я выберу одну из кансен Ириса! Так будет лучше всего!"
      - "...Эльзас, ты займись этим!"
  - char: "alsace"
    side: "right"
    text:
      - "Хмм? Я должна представить концепцию?.."
      - "Знания о том, как это сделать, отсутствуют в моих журналах памяти... И что теперь?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Не волнуйся. Это просто, мы тебя сейчас научим."
      - "Для начала, расслабься..."
  - char: "alsace"
    side: "right"
    text:
      - "Эльзас, расслабься. Эльзас, не нервничай."
      - "Эмоциональный модуль всё ещё работает, снижая скорость расслабления ниже ожидаемого значения..."
  - char: "fleuret"
    side: "left"
    text:
      - "Эльзас, режим ожидания!"
  - char: "alsace"
    side: "right"
    text:
      - "Поняла! Перехожу в режим ожидания!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Ого."
      - "Кхм. Этого будет достаточно. А теперь представь себе концепцию смерти."
      - "Не момент чьей-либо смерти, а само воплощение смерти, место, символизирующее её... Вообрази это."
  - char: "alsace"
    side: "right"
    text:
      - "Концепция смерти. Воплощенное место, образы, воображение..."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Продолжай в том же духе. Чем детальнее, тем лучше."
      - "Все, садитесь в поезд. Нам почти пора отправляться."
