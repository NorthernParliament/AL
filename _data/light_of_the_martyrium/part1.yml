chapter1:
  rows:
  - text:
      - "Я прохожу через дверь в том белом пространстве. Ослепительная белизна вспыхивает и угасает, сменяясь мягким светом."
      - "Затем меня накрывает непреодолимое чувство усталости, из-за которого я едва не падаю на пол."
      - "Я оглядываюсь. Я снова в месте проведения конференции Ортодоксии — только теперь на улице темно."
  - char: "commander"
    side: "left"
    text:
      - "(Как странно. Каждый раз, когда я разговаривал с Хеленой в этом пространстве, в реальности проходило лишь мгновение, независимо от того, как долго мы общались.)"
      - "(В этот раз кажется, что время в реальности текло своим чередом.)"
      - "(Может быть, поэтому я чувствую такую усталость... Должно быть, я простоял здесь целую вечность.)"
      - "(Меня всё ещё беспокоит источник помех... но я ничего не добьюсь, если не проветрю голову.)"

chapter2:
  rows:
  - char: "miss_d???"
    side: "right"
    text:
      - "А вот и ты, таинственный ассистент! Ты опоздал!"

chapter3:
  rows:
  - char: "miss_d???"
    side: "right"
    text:
      - "Я ждала тебя ЦЕЛУЮ ВЕЧНОСТЬ!"
  - text:
      - "Я открываю дверь в гостевую комнату и вижу тускло освещенное помещение, внутри которого находится девушка в капюшоне."
      - "Она лежит на кровати, ритмично колотя по подушке открытой ладонью."

chapter4:
  rows:
  - char: "miss_d???"
    side: "right"
    text:
      - "Ты самый медлительный копуша из всех копуш на свете!"

chapter5:
  rows:
  - char: "miss_d???"
    side: "right"
    text:
      - "Почему ты так долго уходил с конференции?!"
  - char: "commander"
    side: "left"
    text:
      - "(И кто же это...)"

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Что здесь происходит?"
  - char: "miss_d???"
    side: "right"
    text:
      - "А на что это похоже? Я ЖДУ ТЕБЯ!"

chapter7:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Эмм... А ты кто такая?"
  - char: "miss_d???"
    side: "right"
    text:
      - "Я Мисс D!"

chapter8:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Как ты сюда попала?"
  - char: "miss_d???"
    side: "right"
    text:
      - "Просто вошла! Ваша охрана настолько никудышная, что мне даже не пришлось красться или типа того!"

chapter9:
  rows:
  - char: "miss_d???"
    side: "right"
    text:
      - "О, кстати? Я нашла у тебя брешь в безопасности и исправила её! Ты должен меня благодарить!"
      - "Кто-то шпионил за тобой из внезвездного пространства! Бьюсь об заклад, ты этого не знал, придурок!"
  - char: "commander"
    side: "left"
    text:
      - "«Внезвездное пространство»? И что значит «шпионил за мной»?"
      - "(Она говорит о том пространстве, которое Хелена создала с помощью силы Башни?)"
      - "(Кстати о шпионаже, эта девушка находится в гостевой комнате, о которой упоминала Хелена. И она также знает о наших сеансах связи...)"
      - "(Ох... Её «исправление бреши в безопасности» и вызвало те помехи, из-за которых я застрял в виртуальном пространстве, не так ли?)"
      - "......"

chapter10:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Это всё ТВОЯ вина!"

chapter11:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Эй, насчет того «исправления», которое ты сделала..."

chapter12:
  rows:
  - char: "miss_d"
    side: "right"
    text:
      - "Что? Ты опоздал, потому что моё исправление заперло тебя там?"
      - "Ясно, в чем дело. Вы используете это как место для романтических свиданий. Прошу прощения за это!"
  - char: "commander"
    side: "left"
    text:
      - "(...Я использую для чего?)"
  - char: "miss_d"
    side: "right"
    text:
      - "Но дело в том, что я лишь разорвала канал связи. Я не трогала ничего на твоей стороне!"
      - "Если ты смог войти, почему не смог выйти?"

chapter13:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "......"

chapter14:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Я не знал, КАК выйти."

chapter15:
  rows:
  - char: "miss_d"
    side: "right"
    text:
      - "Значит, ты не смог..."
      - "Если ты не мог выйти, зачем ты туда полез?"

chapter16:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "......"

chapter17:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Я не знал, КАК выйти."

chapter18:
  rows:
  - char: "miss_d"
    side: "right"
    text:
      - "Подожди, так ты вошел туда не по своей воле?"
      - "Ух. Всё становится таким запутанным!"
      - "Забудь! Ты здесь, и это главное! Я и так слишком долго ждала, так что пошли уже!"
  - char: "commander"
    side: "left"
    text:
      - "Ждала чего?"
  - char: "miss_d"
    side: "right"
    text:
      - "Чтобы пойти охотиться на китов!"
  - char: "commander"
    side: "left"
    text:
      - "(Киты? Какое отношение они имеют ко всему этому?)"
      - "(Подожди, нельзя позволять ей сбивать меня с толку. Мне нужно вытянуть из неё кое-какие ответы...)"

chapter19:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Кстати, о каком «таинственном ассистенте» ты говорила?"
  - char: "miss_d"
    side: "right"
    text:
      - "О тебе, конечно! ТЫ и есть таинственный ассистент Аосте!"

chapter20:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Почему ты назвала меня «ассистентом»?"
  - char: "miss_d"
    side: "right"
    text:
      - "Потому что так и есть! Ты — таинственный ассистент Аосте!"

chapter21:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Погоди-ка, так она знает даже о моем «я» из будущего?)"
      - "(Все, кто хоть что-то об этом знает, лишь намекали туманными фразами... а она сказала прямо.)"
      - "(Подыграю ей и посмотрю, к чему это приведет.)"

chapter22:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Почему ты помнишь, кто я?"
  - char: "miss_d"
    side: "right"
    text:
      - "Просто помню и всё! А что я должна сказать?"

chapter23:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Я удивлен. Все остальные забыли, кто я."
  - char: "miss_d"
    side: "right"
    text:
      - "Всё потому, что они глупые! Меня они тоже забыли!"

chapter24:
  rows:
  - char: "miss_d"
    side: "right"
    text:
      - "Слушай, хватит вопросов и ответов! Больше никаких разговоров, пока мы не поймаем кита!"
      - "Я не собираюсь ждать ни минуты! Мы уходим ПРЯМО СЕЙЧАС!"
  - text:
      - "Без всякого предупреждения Мисс Д подходит вплотную ко мне."
      - "Прежде чем я успеваю вставить хоть слово, она демонстрирует невероятную для своих размеров силу и тащит меня на улицу."

chapter25:
  rows:
  - text:
      - "Она ведет меня по городским улицам Ириса, волоча за рукав униформы."
      - "Я иду за ней добровольно, потому что, несмотря на первое впечатление, не чувствую от неё никаких дурных намерений."
  - char: "commander"
    side: "left"
    text:
      - "(А ещё потому, что я должен выяснить, кто эта девушка и что ей от меня нужно.)"
  - char: "miss_d"
    side: "right"
    text:
      - "Пришло время, кит встретил достойного противника! Ля-ля-ля, ля-ля-ля-я-я!"
      - "Уж на этот раз мы точно принесем домой улов! Ля-ля-ля, ля-ля-ля-я-я!"
  - text:
      - "С того момента, как мы вышли из гостевой комнаты, она пребывала в отличном настроении. Она шла по улице вприпрыжку и напевала какую-то мелодию."
      - "Прохожие должны были бы оборачиваться нам вслед... но они этого не делают."
  - char: "commander"
    side: "left"
    text:
      - "(Странно... она буквально напрашивается на внимание, но, кажется, никто этого не замечает.)"
      - "(Да, уже поздно, но на улицах всё ещё есть люди. Почему никто не смотрит в нашу сторону?)"
      - "(Такое чувство, будто нас вообще никто не видит...)"

chapter26:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Мне кажется, или нас никто не видит?"
  - char: "miss_d"
    side: "right"
    text:
      - "Я бы не смогла вывести тебя на улицу, если бы они нас видели, идиот!"

chapter27:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ты нас скрываешь?"
  - char: "miss_d"
    side: "right"
    text:
      - "Я введу тебя в курс дела после того, как мы поймаем кита!"

chapter28:
  rows:
  - text:
      - "Мы продолжаем идти, пока не добираемся до парка, находящегося далеко от главного места проведения конференции."
      - "Девушка всё так же беззаботно напевает и идет вприпрыжку."
  - char: "commander"
    side: "left"
    text:
      - "(Я должен спросить...)"
      - "Куда мы идем?"
  - char: "miss_d"
    side: "right"
    text:
      - "К Вратам Авалона!"
  - char: "commander"
    side: "left"
    text:
      - "А? Ты говоришь о Скапа-Флоу?"
      - "Ты же не предлагаешь нам ИДТИ туда пешком, верно?"
  - char: "miss_d"
    side: "right"
    text:
      - "Если придется!"
  - char: "richelieu"
    side: "left"
    text:
      - "Боюсь, это не очень практично, Мисс D."
      - "Однако, Командир, будь уверен, что есть куда более удобный способ добраться туда."
  - text:
      - "Внезапное появление Ришелье лишает меня дара речи."
  - char: "miss_d"
    side: "right"
    text:
      - "Точно! Поезд! Давай поедем на поезде Лиз!"
  - char: "commander"
    side: "left"
    text:
      - "...Лиз? И о каком «поезде» ты говоришь?"
      - "И... почему ты здесь, Ришелье?"

chapter29:
  rows:
  - char: "richelieu"
    side: "right"
    text:
      - "Я прошу прощения, что использовала такой нестандартный способ вытащить тебя с конференции."
      - "Но к тебе приковано всеобщее внимание. Мисс D была единственной, кто мог незаметно увести тебя."
  - char: "commander"
    side: "left"
    text:
      - "(Судя по тому, насколько серьезен её тон... должно быть, это дело огромной важности.)"
      - "Должно быть, это крайне щекотливая тема, раз уж ты не можешь обсудить её даже в своей собственной столице."
  - char: "richelieu"
    side: "right"
    text:
      - "Да. Никакие меры предосторожности не будут лишними для того, о чем нам предстоит поговорить."
      - "В конце концов, те, кто стремится уничтожить нашу ветвь, повсюду, и мы даже не знаем, сколько ещё их скрывается в тени."
  - char: "commander"
    side: "left"
    text:
      - "(...О чём она?)"
  - char: "richelieu"
    side: "right"
    text:
      - "Позволь мне перейти сразу к делу. Королевский Флот и Ортодоксия в настоящее время готовят совместную операцию."
      - "Но не здесь. Наша цель находится за пределами нашей собственной ветви."
      - "Если мы ничего с этим не сделаем, однажды это приведет к колоссальным последствиям для нашего мира и всего, что мы хотим защитить."
  - char: "commander"
    side: "left"
    text:
      - "И ты хочешь, чтобы я помог, верно?"
  - char: "richelieu"
    side: "right"
    text:
      - "Верно. Нам нужно переместиться в другое место, прежде чем мы сможем рассказать тебе больше. Здесь небезопасно."
      - "Пожалуйста, пойдем со мной к вратам Камелота в Скапа-Флоу."
      - "Куин Элизабет расскажет тебе все подробности, когда мы будем там."
      - "Я должна сразу сказать, что верховное командование не имеет ни малейшего понятия об этой операции, и что она крайне опасна."
      - "Ты сможешь решить, хочешь ли помочь, после того как услышишь, что скажет Куин Элизабет."
      - "Если ты решишь отклонить нашу просьбу, я позабочусь о том, чтобы тебя как можно скорее доставили обратно."
  - text:
      - "Я прищуриваюсь, глядя на Ришелье, и различаю две фигуры, стоящие позади неё — Белфаст и Шеффилд."
  - char: "commander"
    side: "left"
    text:
      - "(Ага. Похоже, операция в Антарктиде сблизила эти фракции как никогда раньше.)"
      - "(Интересно, что они обсуждали. Надо будет спросить об этом позже.)"
  - char: "richelieu"
    side: "right"
    text:
      - "Прежде чем ты поговоришь с Элизабет, позволь мне представить тебе твой эскорт. Они тоже будут участвовать в операции."
  - text:
      - "Ришелье делает жест рукой, и её товарищи из Ириса выходят из укрытия."
  - char: "alsace"
    side: "left"
    text:
      - "Перед тобой линкор Эльзас — Таинство Объединенной Ортодоксии, недостижимая мечта и страж Святого Престола."
  - char: "mogador"
    side: "right"
    text:
      - "Я Могадор, судья Трибунала. Я до смерти хотела показаться тебе. Хе-хе..."
  - char: "brennus"
    side: "left"
    text:
      - "Я Бреннус, крейсер и Рыцарь-храмовник. Рада встрече, Меченосец."
  - char: "fleuret"
    side: "right"
    text:
      - "Меня зовут Флёре, эсминец типа «Ле Арди». Приятно познакомиться, Командир!"
  - char: "epee"
    side: "left"
    text:
      - "Я-я Эпе. Как и сказала Флёре, приятно познакомиться..."
  - char: "richelieu"
    side: "right"
    text:
      - "Все они были тщательно отобраны за их навыки на поле боя и способность защитить тебя."
      - "Возможно, у Трибунала репутация тех, кто действует за кулисами, в отличие от присутствующих сейчас на конференции..."
      - "Но уверяю тебя, на этих леди можно смело положиться в бою."
  - char: "commander"
    side: "left"
    text:
      - "(Святые Рыцари-храмовники, члены Трибунала и даже Эльзас... Команда небольшая, но их мастерство с лихвой это компенсирует.)"
      - "(Соратницы Клемансо здесь, так что можно было бы подумать, что и она сама тоже тут.)"
      - "(Наверное, она решила позволить Ришелье вести переговоры. Это так в духе Клемансо.)"
  - text:
      - "Я обвожу взглядом каждого члена команды, а затем снова смотрю на Ришелье и Королевских горничных."
      - "Ришелье смотрит на меня со всей серьезностью, ожидая ответа, в то время как Белфаст слегка кивает."
      - "А еще Шеффилд. Выражение её глаз так и кричит: «не задавай вопросов, просто иди с нами»."
  - char: "commander"
    side: "left"
    text:
      - "(Элизабет, Ришелье и даже Клемансо — все они в деле.)"
      - "(Более того, их стремление к секретности красноречиво говорит о важности того, о чем пойдет речь.)"
      - "(К тому же есть Мисс D, которая знает, что готовит будущее. Она так о многом могла бы мне рассказать.)"
      - "(Но важнее всего то, что я им нужен. Я должен выслушать, что они хотят сказать.)"
      - "Показывай дорогу."
  - text:
      - "Мисс D взволнованно машет руками, и в лесу появляется поезд."
  - char: "miss_d"
    side: "right"
    text:
      - "Залезай! Мы отправляемся в Камелот, чтобы поймать кита!"
