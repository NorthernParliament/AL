chapter1:
  rows:
  - text:
      - "Мы переходим на площадь, где неожиданно сталкиваемся лицом к лицу с Хатакадзэ META."
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Мы наконец-то встретились, Командир."
      - "Нужно ли мне представляться?"
  - char: "commander"
    side: "left"
    text:
      - "Ты Хатакадзэ META."
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Именно так, да."
  - char: "commander"
    side: "left"
    text:
      - "Ты также та, кто натравил на нас того зверя-мимика IX класса."
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Верно. Его поражение мало что для меня значит. Это была не более чем рябь на озере этого иллюзорного пространства."
      - "Хотя, должна признать, ты меня удивил."
      - "И доставил немало головной боли."
      - "Ты, должно быть, видел её. Ту, что называет себя «Родни», живущую в этой иллюзии."
      - "Если бы она только позволила кокону созреть, она переродилась бы как богиня с огромной властью над этим миром."
      - "Но она отвергла это. Она остановила это."
      - "Она уничтожила кокон и свою собственную судьбу."
      - "Это ты заставил её сделать такой выбор. Я ошибаюсь?"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "......"
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Тебе не нужно отвечать."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Не ошибаешься."
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Я так и думала."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Она имеет право сама принимать решения."
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Так почему же ты заставил её выбрать худшее из возможного?"

chapter5:
  rows:
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Твои действия привели к колоссальной трате ресурсов."
      - "Поэтому я забрала фрагменты кокона и весь этот город смерти, и я выжму из них максимум."
  - text:
      - "С этими словами коррозия, покрывающая базилику, оживает и начинает извиваться."
      - "Тысячи и тысячи белых корней тянутся к небу, воспевая беззвучный гимн."

chapter6:
  rows:
  - text:
      - "Внезапно золотой свет Мартириума приобретает зловещий фиолетовый оттенок."
  - char: "commander"
    side: "left"
    text:
      - "(Даже если я не могу ни с кем связаться, они ТОЧНО увидят это и прибегут сюда.)"
      - "(Но до тех пор... Мисс D не может сражаться в открытую, поэтому мне нужно выиграть нам немного времени!)"
      - "Что это было? Захотелось немного сменить освещение?"
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "×ĚŃřźşÉí"
  - char: "commander"
    side: "left"
    text:
      - "Теперь ты меня игнорируешь?"
      - "(Я никогда не слышал такого языка. Если предположить, что она вообще говорит на человеческом языке.)"
      - "Мисс D, что, черт возьми, она делает?"
  - char: "miss_d"
    side: "right"
    text:
      - "Она пытается захватить контроль над Мартириумом!"
  - char: "commander"
    side: "left"
    text:
      - "Что она говорит? Можешь сказать?"
  - char: "miss_d"
    side: "right"
    text:
      - "Нет! У меня нет функции перевода!"
  - char: "commander"
    side: "left"
    text:
      - "Ты можешь сделать что-нибудь, чтобы остановить её?"
  - char: "miss_d"
    side: "right"
    text:
      - "Я могу попытаться, но кто будет защищать тебя, если мне придется с ней сражаться?"
  - char: "commander"
    side: "left"
    text:
      - "(Хотелось бы мне сказать: «Со мной всё будет в порядке», но на кону слишком многое.)"
  - text:
      - "Хатакадзе продолжает говорить на незнакомом языке, всё это время свирепо глядя на меня."
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "śřşó"
      - "ÓÚ´Ë´ŚŐŔˇĹ°É"

chapter7:
  rows:
  - text:
      - "Она разводит руки в стороны, и мраморные крылья повторяют её движение."
      - "Массивный кристалл испускает импульс света, и с небес спускается белая фигура."
  - char: "commander"
    side: "left"
    text:
      - "А? Родни?!"
      - "Нет, погоди. Она может выглядеть так же, но я чувствую, что это не она!"
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Хи-хи. Как проницательно."
      - "Я использовала фрагменты кокона, чтобы возвести комплекс, а затем с его помощью создать лишь её фальшивую копию."
      - "И всё же, впечатляет — тебе не кажется?"

chapter8:
  rows:
  - text:
      - "От неё исходит настолько мощная аура, что свет вокруг кажется тусклым."
      - "Её лицо ничего не выражает. Руки сложены в молитве. Ветер играет её волосами и поддерживает её мерно взмахивающие крылья."
      - "Родни — существо, чья аура превосходит даже Мартириум — торжественно парит там."

chapter9:
  rows:
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Это не она вызвала событие пространственного удара."
      - "Эта Родни — марионетка. Искусственное тело, рожденное путем насильственного закрепления невидимого."
      - "Тем не менее, она обладает невероятной силой..."
      - "Мы не можем в это поверить... Никто не должен быть способен на то, на что способна она!"

chapter10:
  rows:
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Посмотри на себя, пялишься с отвисшей челюстью. Ты так мало знаешь."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "А ты так мало знаешь о манерах, наглая хамка."
      - "Как ты ускользнула от нашего обнаружения? Кто ты такая?"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Истинная союзница Командира. В отличие от тебя."
      - "Скажи мне, зачем ты привела Командира в такое опасное место? Чего ты пыталась добиться?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Мы не обязаны тебе отвечать."
      - "Однако, если ты союзница Командира, ты потенциально и наша союзница тоже."
      - "Мы скажем тебе вот что: Командир играет ключевую роль в преодолении кризиса, с которым столкнулся тестовый полигон бета, и как таковой, должен был знать об этом месте."
      - "И не просто знать, но и увидеть всё воочию."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Тебе никто никогда не говорил, что знать слишком много — опасно?"
      - "Альфа таймлайн, истинная цель Антиоха, Икс..."
      - "Командир не готов знать обо всех этих вещах! Слишком рано!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "«Слишком рано»?"
      - "Прямо сейчас Ричард и Арбитры сражаются у врат на тестовый полигон бета, а ты думаешь, что «слишком рано»?"
      - "Мы считаем, что ты чересчур его опекаешь."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты ничего не знаешь о «гиперопеке»."
      - "Но наши споры здесь ни к чему не приведут. Я только спрошу тебя вот о чем: это твои подчиненные пытались меня остановить?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Мы бы даже не узнали о твоем существовании, если бы ты сама не показалась. Как бы мы вообще могли что-то против тебя предпринять?"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Ладно."

chapter11:
  rows:
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Это что... Хелена?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Для протокола, не та Хелена, которую ты знаешь."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я и не спрашивала, ну да ладно."
      - "Полагаю, в одном Хирю была права."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Если у тебя есть вопросы, сейчас не время. Я не буду на них отвечать."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Пфф. Как скажешь."
      - "Ты только что прибыла, или как? Ты охотишься за этой штуковиной или за китом?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ни за тем, ни за другим. Я здесь, чтобы защищать Командира."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ла-а-адно..."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я знаю, о чем ты хочешь спросить. Я не отвечу."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ни капельки не изменилась, а?"
      - "Хорошо хоть, нам не придется драться за одну и ту же цель. Мы просто позаботимся о той штуковине вон там. Ты не против?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я не стану тебя останавливать."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Как и мы. Нам нужен только кит, а потом мы отправимся домой."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Командир пойдет со мной."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "И уйдет без всех нас? Мы так не думаем."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "......"

chapter12:
  rows:
  - char: "devil"
    side: "left"
    status: "is-red"
    text:
      - "Добрый вечер, дамы! Надеюсь, за вашим маленьким столиком найдется место еще для одной."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ты!.."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что? Она всё еще здесь?"
  - char: "devil"
    side: "right"
    status: "is-red"
    text:
      - "Ещё бы. Кто уходит, когда шоу вот-вот достигнет своей кульминации?"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты, если тебе дорога жизнь. Проваливай, или мы тебя прикончим."
  - char: "devil"
    side: "right"
    status: "is-red"
    text:
      - "Аха-ха-ха! Ты и какая армия?"
      - "Держу пари, вы не продержитесь и 30 минут против этой Родни."
      - "А даже если и продержитесь, ваш драгоценный Командир к тому времени будет давно мертв."
      - "По крайней мере, ему не придется смотреть, как вы тут падаете замертво одна за другой."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мы защитим нашего слугу. Мы можем на вас рассчитывать?"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я в деле. Кто-то должен преподать этой мелкой дряни урок!"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Ладно. Только в этот раз."
  - char: "devil"
    side: "right"
    status: "is-red"
    text:
      - "Хи-хи. Все заодно, да?"
      - "Отлично. Тогда давайте завершим это шоу с размахом!"
