chapter1:
  rows:
  - text:
      - "Девочки Ириса были перенесены — или, точнее, слились со своими двойниками — в это воспоминание."
      - "Благодаря их силе чаша весов победы снова начинает склоняться в нашу пользу."
      - "Шаг за шагом они оттесняют силы Икс, и всё это время вокруг них сияет ослепительный золотой свет."
      - "Векторная зона оказывается не такой уж неискоренимой, как думалось. Она понемногу тает под светом и пушечным огнем, распадаясь на мелкие белые кристаллы, которые превращаются в пыль."
      - "Наконец, зверь-мимик внутри торнадо издает скорбный вой, прежде чем полностью рассыпаться в прах."
  - char: "brennus"
    side: "left"
    status: "is-sea"
    text:
      - "Ваш суд настал. Да заберут вас нити смерти!"
  - char: "mogador"
    side: "right"
    status: "is-sea"
    text:
      - "Убирайтесь, проклятые вредители!"
  - char: "alsace"
    side: "left"
    status: "is-sea"
    text:
      - "Готовлюсь к запуску режима зачистки!"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Боже мой... Они расправляются с Икс так, будто те вообще не представляют угрозы."
      - "Как они вдруг стали такими сильными?"
  - char: "rodney_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "«Я» не знаю."
      - "«Я» лишь дала тебе основу для самовыражения. Всё остальное сделал ты."
  - char: "commander"
    side: "left"
    text:
      - "Это сделал... я?"
  - char: "miss_d"
    side: "right"
    text:
      - "Ух ты! Ты и правда сделал это, ассистент!"
  - char: "commander"
    side: "left"
    text:
      - "Ты знаешь, что именно я сделал?"
  - char: "miss_d"
    side: "right"
    text:
      - "Нет, просто отдаю тебе должное."

chapter3:
  rows:
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Векторная зона... нейтрализована? Как? Наши силы значительно уступали!"
      - "Беарн, у тебя есть этому какое-то объяснение?"
  - char: "bearn_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Боюсь, что нет. Всё, что я могу сказать — эти девочки светились золотом и казались совсем не похожими на самих себя."
      - "Каким-то образом им удалось отбить атаку Икс, не применяя никаких выдающихся Таинств или какого бы то ни было особенного оружия."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "(Что, черт возьми, сейчас произошло?)"
      - "(Как они провернули трюк уровня Энтерпрайз без какого-то секретного оружия?)"
      - "(И как девочки из таймлайна бета вот так слились со своими двойниками из воспоминаний? Минуту назад их здесь не было!)"
      - "(Если только здесь как-то не замешана Хелена, их ветвь и близко не настолько технологически развита, чтобы сделать такое!)"
  - char: "repulse_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "У нас есть сигнал, сестренка! Мы успели вовремя!"
  - char: "renown_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Ваше Величество, это Ринаун и Рипалс. Мы пришли к вам на помощь!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ринаун! На тебе живого места нет! Что с тобой случилось?"
      - "И если уж на то пошло, что вы здесь делаете?!"
      - "Мы отдали приказ всем нашим силам отступать! Разве мы выразились недостаточно ясно?!"
  - char: "renown_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Вас всё еще не было, Ваше Величество. Мы пришли, потому что боялись за вашу безопасность."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Что ж, добраться сюда явно было нелегко, надо отдать вам должное."
      - "Сказать по правде, еще совсем недавно мы были на грани полного уничтожения. Мы были готовы к тому, что океан заберет нас."
      - "То, что мы снова можем видеть друг друга — не иначе как чудо."
      - "Спасибо вам, «друзья издалека», что пришли к нам на помощь."
  - char: "commander"
    side: "left"
    text:
      - "Погоди... Так ты теперь всё понимаешь, Элизабет?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Это просто чутье. Мы правы?"

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "......"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Да."

chapter6:
  rows:
  - char: "rodney_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "Твоя борьба принесла плоды. Тебе удалось отправить смерть туда, откуда она пришла."
      - "В конце концов, всё вернется в небытие. Но твой конец еще далек."
      - "«Я» уничтожу кокон и положу конец этой иллюзии."
      - "А ты... ты вернешься туда, где был."
      - "Прощай. Возможно, когда-нибудь мы встретимся снова."

chapter7:
  rows:
  - text:
      - "Девочки Ириса моргнули и  оказались в этом пространстве холодных механизмов."
  - char: "brennus"
    side: "left"
    status: "is-sea"
    text:
      - "Мы... теперь внутри кита?"
  - char: "epee"
    side: "right"
    status: "is-sea"
    text:
      - "Нас что, только что отправили назад?"
  - char: "death_shadow"
    side: "left"
    status: "is-red"
    text:
      - "40%... 50%... 60%..."
  - char: "mogador"
    side: "right"
    status: "is-sea"
    text:
      - "О боже, опять она! И она всё еще заряжает свой лазер! Мы что, отключились, и вся эта битва была галлюцинацией?"
  - char: "fleuret"
    side: "left"
    status: "is-sea"
    text:
      - "Нам, НАВЕРНОЕ, стоит что-то сделать с этим лазером, типа, прямо сейчас!"
  - char: "alsace"
    side: "right"
    status: "is-sea"
    text:
      - "Внезапно обретенная сила всё еще со мной..."
  - char: "brennus"
    side: "left"
    status: "is-sea"
    text:
      - "Я тоже её чувствую. Она исчезает мало-помалу, но я всё еще чувствую себя достаточно сильной, чтобы сокрушить Тень Смерти."
  - char: "mogador"
    side: "right"
    status: "is-sea"
    text:
      - "Тогда чего мы ждем? Давайте надерем ей задницу!"

chapter8:
  rows:
  - text:
      - "Лазер достиг заряда в 85%, но дальше дело не пошло."
      - "Бреннус натянула свои серебряные нити и обрушила на Тень Смерти меч за мечом, очищая окружающий её черный туман и отрезая ей пути к отступлению."
      - "Затем, словно мчащийся по небесам скакун, Эльзас рванула вперед и нанесла великолепный удар."
      - "Цепи смерти были разорваны, а её мертвенно-бледная оболочка разлетелась на куски."

chapter9:
  rows:
  - char: "alsace"
    side: "left"
    text:
      - "Я нанесла смертельный удар!"
  - char: "mogador"
    side: "right"
    text:
      - "Фух... Наконец-то всё кончено."
  - char: "brennus"
    side: "left"
    text:
      - "Безупречная победа. Это была образцовая командная работа."
  - char: "fleuret"
    side: "right"
    text:
      - "Кажется, весь запас силы только что иссяк... Думаю, мы вообще-то были на волоске."
  - char: "alsace"
    side: "left"
    text:
      - "Надеюсь, контроль над китом вернется к Мисс D теперь, когда с её двойником покончено. Пойдемте найдем её и Командира!"
      - "Уверена, они будут вне себя от радости, когда узнают, что нам удалось захватить кита!"
  - char: "epee"
    side: "right"
    text:
      - "Эмм, девочки... Посмотрите вниз..."
  - char: "mogador"
    side: "left"
    text:
      - "На что? На Мартириум?"
      - "...Ох. Мы над ТРЕТЬИМ кольцом. И когда это произошло?"
  - char: "fleuret"
    side: "right"
    text:
      - "Кто теперь разберет... Но, думаю, Мисс D и Командир там, внизу."
  - char: "brennus"
    side: "left"
    text:
      - "Мисс D здесь нет, чтобы проложить нам путь с помощью вагонов поезда. Наш единственный путь туда — через смерть."
  - char: "alsace"
    side: "right"
    text:
      - "Не-е-ет! Я не хочу умирать!"
