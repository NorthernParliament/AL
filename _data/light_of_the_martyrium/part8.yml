chapter1:
  rows:
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Ну-ну... Мы только прибыли, а уже наблюдаем такое зрелище."
      - "Концептуальный якорь. Впечатляет. Есть догадки, чей он, Дьявол?"
  - char: "devil"
    side: "right"
    text:
      - "Ни единой. Они идеально замаскировались."
      - "Всё, что я знаю, — от них пахнет так, будто они с испытательного полигона бета."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Ты имеешь в виду ветвь, где Память Меркурия влипла в крупные неприятности? Интересно."
      - "Как ты поняла?"
  - char: "devil"
    side: "right"
    text:
      - "У Арбитров тоже есть свои секреты."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Ладно. А кит, летящий в небе? Что это, черт возьми, такое?"
  - char: "devil"
    side: "right"
    text:
      - "Что, ты не знаешь?"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "То, чего я не знаю, могло бы заполнить всю твою базу данных."
      - "Ты же понимаешь, что я только что сбежала из того места, да? Пока что я могу видеть лишь проблески вещей."
  - char: "devil"
    side: "right"
    text:
      - "Ха-ха. Ладно, я расскажу тебе. Эта штуковина — невероятно важная."
      - "Я имею в виду, в колоссальных масштабах. Ты будешь обеспечена на всю жизнь, если сможешь его поймать."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Ага. Ты скажешь мне, что это такое, или нет?"
  - char: "devil"
    side: "right"
    text:
      - "Не-а. Раз ты не знаешь, я не обязана тебе рассказывать. Я не твоя мамочка."
      - "Но-о-о, я слышала, что «Они» ищут его, и дадут щедрую награду за его возвращение."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Правда? Тогда я должна его заполучить."
      - "Нет, подожди, сначала мне нужно узнать концепцию, привязанную к этой основе. Я не буду дурой и не брошусь туда вслепую."
  - char: "devil"
    side: "right"
    text:
      - "Ты не узнаёшь концепцию? А я узнаю."
      - "Это Смерть."
