chapter1:
  rows:
  - text:
      - "Мир воспоминаний рушится, и когда я в следующий раз открываю глаза, то снова оказываюсь в Мартириуме."
  - char: "miss_d"
    side: "left"
    text:
      - "Мы сделали это! Мы вернулись!"
      - "Это третье кольцо Мартириума! Третье кольцо — это сердце!"
      - "Это ДОЛЖНО быть последнее развернутое пространство, раз уж вся эта странная штука с воспоминаниями закончилась."
      - "Теперь ты мой, кит! Бежать больше некуда!"
      - "Выходи, выходи, где бы ты ни..."
      - "...Был?! Он улетел на самое внешнее кольцо!"
      - "Ассистент, мы должны..."
  - char: "commander"
    side: "right"
    text:
      - "Погоди. Что-то здесь не так."
  - text:
      - "Я осматриваю окрестности. Белая базилика Мартириума, кажется, сияет ярче всего остального."
      - "Однако еще больше внимания привлекает площадь в центре третьего кольца и огромное сооружение, возвышающееся над ней."
      - "Это желтый кристалл, заключенный в вырезанные из мрамора крылья. На первый взгляд, он кажется почти священным..."
      - "Но, присмотревшись, я понимаю, что это эпицентр мраморной, пустой белизны."
      - "Белизны, которая живет, множится и разрастается, как корни дерева, подвергая коррозии всё вокруг."
  - char: "commander"
    side: "left"
    text:
      - "(Словно инвазивный мицелий... Так вот что такое коррозия?)"
      - "(Неужели зверь-мимик IX класса появился в том воспоминании из-за этой коррозии?)"
      - "(Точно, там же была та META, работающая вместе с Дьяволом... Это их рук дело?)"
  - char: "miss_d"
    side: "right"
    text:
      - "Фу... Давай убираться отсюда, ассистент."
  - text:
      - "Я открываю свой коммуникатор и пытаюсь связаться с Элизабет и Эльзас."
      - "Раздается щелчок, но больше никаких звуков. Он не работает."
  - char: "commander"
    side: "left"
    text:
      - "(Черт, Дьявол снова за свое. Она глушит нашу связь.)"
      - "(Я изолирован от девочек, и у меня нет поддержки от Элизабет. Я в серьезной опасности.)"
  - text:
      - "Я почти слышу, как Дьявол самодовольно смеется над моим затруднительным положением."
  - char: "commander"
    side: "left"
    text:
      - "Эй, как нам попасть на самое внешнее кольцо?"
  - char: "miss_d"
    side: "right"
    text:
      - "Просто выйти из Мартириума и зайти обратно."
      - "Я знаю, как выйти! Через то светящееся пятно в центре!"
  - char: "commander"
    side: "left"
    text:
      - "В центре... откуда исходит коррозия..."
      - "Проклятье. Если это единственный путь, так тому и быть..."
