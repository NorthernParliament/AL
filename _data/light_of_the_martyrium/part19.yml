chapter1:
  rows:
  - char: "alsace"
    side: "left"
    text:
      - "У меня возникает один вопрос."
      - "Если Демон Лапласа — настолько важная машина, почему они просто не перевезут его в другое место для защиты?"
  - char: "fleuret"
    side: "right"
    text:
      - "Кто знает? Может, он слишком большой, чтобы его можно было так легко перевезти?"
  - char: "alsace"
    side: "left"
    text:
      - "Если план состоит в том, чтобы Факел украл его, то он должен быть достаточно мал, чтобы поместиться в чьем-то личном хранилище, не так ли?"
      - "Если кансен могут это сделать, то Антиох, безусловно, тоже..."
  - char: "brennus"
    side: "right"
    text:
      - "Просто украсть — это одно. Путь отхода чреват опасностями."
      - "Возможно, лучший способ безопасно переправить хорошо защищенную цель в другое место — позволить украсть её без боя."
  - char: "commander"
    side: "left"
    text:
      - "Возможно, именно в этом и заключается план доктора."
  - char: "fleuret"
    side: "right"
    text:
      - "И как мы вписываемся во всё это?"
  - char: "alsace"
    side: "left"
    text:
      - "Мы свяжемся с Революционным фронтом, скажем им, что это ловушка Федерации, и будем надеяться, что они откажутся от боя?"
  - char: "commander"
    side: "right"
    text:
      - "Сомневаюсь, что это поможет. Завершение создания Демона Лапласа — это вопрос жизни и смерти для РФ."
      - "Ловушка это или нет, они не могут позволить себе так легко отступить."
      - "Кроме того... не думаю, что они станут нам доверять."
  - char: "miss_d"
    side: "left"
    text:
      - "Я знаю! Давайте позвоним Аосте и заставим его спрятать Демона Лапласа!"
  - char: "commander"
    side: "right"
    text:
      - "Абсолютно исключено. Это окончательно сделает их врагами Федерации."
      - "К тому же, если бы он мог спрятать его без чьего-либо ведома, ему не понадобилось бы заставлять Факел красть его."
      - "Начинает казаться, что у нас есть только один вариант."
  - char: "fleuret"
    side: "left"
    text:
      - "О! Ты собираешься надрать задницы им обоим сразу, Командир?"
  - char: "epee"
    side: "right"
    text:
      - "Флёр, очевидно, что план не в этом!"
  - char: "mogador"
    side: "left"
    text:
      - "Ты попытаешься наложить руки на Демона Лапласа первым, не так ли?"
  - char: "commander"
    side: "right"
    text:
      - "Верно. Оставить всё как есть означает сохранить статус-кво — это пространство поглощено концепцией смерти. Следовательно, именно наше вмешательство должно всё изменить."
      - "(Правда, это если предположить, что Факел не смог его украсть.)"
      - "(Если проблема кроется в методе докторов по спасению ситуации, тогда...)"
      - "(Нет, сейчас не время для сомнений. Пора действовать.)"

chapter2:
  rows:
  - text:
      - "Мы приблизились к Институту морских исследований Самоса в сопровождении Мисс D."
      - "Кроме автоматических турелей, по пути мы не встретили ни одного сотрудника службы безопасности."
      - "Одно только это подкрепляет слова д-ра Анзил об операции под чужим флагом со стороны Федерации."
  - text:
      - "БАБАХ!!!"
  - char: "alsace"
    side: "left"
    text:
      - "Звуки битвы?"
  - char: "mogador"
    side: "right"
    text:
      - "Прошло уже три часа. РФ и Антиох, должно быть, уже сражаются, верно?"
  - char: "commander"
    side: "left"
    text:
      - "Вы близко к Демону Лапласа. Поторопитесь и захватите его, пока этого не сделал Факел."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хм? Погоди, это же..."
  - char: "commander"
    side: "left"
    text:
      - "(Это Уичита META. Значит, они тоже оказались здесь, да?)"
      - "(Теперь, когда я думаю об этом, возможно, именно им принадлежит это воспоминание... Такао, Энтерпрайз...)"
      - "(Факел догорает, и всё, что остается — это Пепел...)"
      - "(Пепел изначально был Факелом?)"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Что ж, это один из способов поприветствовать кого-то."
      - "Немного поздновато ты до этого додумался. Ты прав, но не до конца."
      - "Да, выжившие из Факела есть среди Пепла... Но, как следует из названия, мы в буквальном смысле то, что осталось после."
      - "То, что ты продолжаешь идти вперед, даже зная это, означает, что ты всё ещё абсолютно ничего не понимаешь."
  - char: "commander"
    side: "left"
    text:
      - "Это вы с Кимберли пережили эти события в альфа таймлайне?"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Мне нечего сказать по этому поводу."
  - char: "commander"
    side: "left"
    text:
      - "Прости. Тогда давай сменим тему."
      - "Мне звонила д-р Анзил. Она рассказала мне о планах РФ и Федерации, а также о том, что пытается сделать Факел."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Доктор связалась с тобой?!"
      - "Не знаю, с чего бы ей связываться с ТОБОЙ, но... за ней ведется строгая слежка. Ей пришлось свернуть горы, просто чтобы связаться с нами."
      - "Связаться именно с тобой, да еще и с Самоса..."
      - "Нет, если она рассказала тебе еще и план Факела, то это тем более подозрительно..."
      - "И что? Что ты планируешь? Собираешься украсть Демона Лапласа до того, как до него доберется Факел?"
  - char: "commander"
    side: "left"
    text:
      - "Да. Мы знаем, что если позволить ситуации развиваться своим чередом, это приведет к гибели всего этого места."
      - "И лично я тоже не хочу, чтобы Факел вмешивался в это."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ты со странностями... но ладно. В этом я с тобой согласна."
      - "Не волнуйся. Факел не придет."
  - char: "commander"
    side: "left"
    text:
      - "Не придет?"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Да, не придет. Мы уже вывели их всех из этого района, чтобы уберечь от того, что вот-вот произойдет."
  - char: "commander"
    side: "left"
    text:
      - "Значит, вы с Кимберли тоже пришли украсть Демона Лапласа?"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ха-ха-ха. Поверишь ли ты мне, если я скажу, что в тот день НИКТО даже близко не подобрался к этой адской машине?"
      - "...Время почти пришло."
      - "Если тебе так любопытно, тогда занимай места в первом ряду. Такое ты не захочешь пропустить."

chapter3:
  rows:
  - text:
      - "Мы отменили наши планы и стали наблюдать за далеким морем вместе с двумя из Пепла."
      - "Революционный фронт уже прорвал линию обороны Инфорсеров, и на горизонте показался их авангард."
      - "Именно тогда силы Федерации вновь появились из глубин моря и с небес."
      - "По данным нашей дальней разведки, к ним стягивалось еще больше сил Федерации, чтобы окружить их с трех сторон."
      - "Ни один из флотов не сделал первого выстрела, но и не прекратил наступление."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "В тот день Энтерпрайз привела нас сюда."
      - "Институт морских исследований был прямо перед нами. Всё, что нам нужно было сделать, — это украсть Демона Лапласа, и эта абсурдная ситуация разрешилась бы."
      - "А затем... произошло это."
  - text:
      - "Мир начинает темнеть, словно началось солнечное затмение. Небо над головой искажается, изгибается и закручивается, принимая форму гигантского вихря."
      - "Появляется черный торнадо, вздымающий море и становящийся всё больше с каждым мгновением."
  - char: "commander"
    side: "left"
    text:
      - "Черный торнадо... Феномен коррозии."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Вот именно. Да, это коррозийное явление."
      - "Тогда мы тоже не знали, что это такое. Мы называли это черным торнадо, прямо как вы."
      - "Хех. Да, совершенно никаких предупреждающих знаков. Оно появляется прямо из ниоткуда."
  - char: "alsace"
    side: "left"
    text:
      - "Командир, торнадо стремительно разрастается! Скоро оно поглотит нас!"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Можешь сколько угодно пялиться на красивые цвета, но это коррозийное явление, Командир! Ты там долго не протянешь!"
      - "Немедленно уходи, или хуже будет!"
  - char: "whale"
    side: "left"
    text:
      - "......"
  - text:
      - "С оглушительным ревом кит выпрыгивает из океана и исчезает в черных тучах."
  - char: "miss_d"
    side: "left"
    text:
      - "А-а-а-аргх! Мой кит снова сбежал! Элизабет, живо бросай якорь для этой концепции!"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Мы уже это делаем! Подожди хоть минутку, хорошо?!"
  - char: "miss_d"
    side: "left"
    text:
      - "Ладно! Все остальные, собирайтесь вокруг меня! Мы сваливаем отсюда!"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хех, хорошая идея. Вам стоит убраться подальше от этой опасной зоны."
  - char: "commander"
    side: "left"
    text:
      - "А вы не пойдете? Коррозия должна быть опасна и для МЕТА тоже."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Тогда мы были слабы. Поэтому мы запаниковали и упустили из виду некоторые важные вещи."
      - "Теперь мы другие."
      - "Мы останемся здесь и станем свидетелями конца."
  - char: "commander"
    side: "left"
    text:
      - "Тогда я тоже остаюсь. Мисс D, уведи остальных в следующее кольцо!"
  - char: "miss_d"
    side: "right"
    text:
      - "Ты хоть слышишь себя, ассистент?!"
  - char: "mogador"
    side: "left"
    text:
      - "Командир?!"
  - char: "brennus"
    side: "right"
    text:
      - "Меченосец, это слишком опасно!"
  - char: "commander"
    side: "left"
    text:
      - "Я буду в порядке. Если я использую концепцию смерти вместо поезда, то смогу догнать вас!"
      - "Именно так вы сюда попали, не так ли, Уичита?"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Верно. Но..."
  - char: "miss_d"
    side: "left"
    text:
      - "Даже если ты примешь смерть и успеешь до того, как подвергнешься коррозии, умирать больно! Больно до смерти!"
  - char: "commander"
    side: "right"
    text:
      - "Возможно, но это может многое нам дать. Это может быть даже так же важно, как твой кит."
  - char: "miss_d"
    side: "left"
    text:
      - "Б-блин... Ладно. Удачи, ассистент!"
  - char: "alsace"
    side: "right"
    text:
      - "Подожди! Я должна остаться... чтобы защитить тебя в худшем случае!"
  - char: "fleuret"
    side: "left"
    text:
      - "Я тоже останусь!"
  - char: "epee"
    side: "right"
    text:
      - "Я-я тоже!"
  - char: "commander"
    side: "left"
    text:
      - "Со мной всё будет хорошо, девочки. Верьте в Мисс D, Элизабет и меня!"
  - char: "alsace"
    side: "right"
    text:
      - "...Приказ получен..."

chapter4:
  rows:
  - text:
      - "Как только Элизабет дала сигнал, что её приготовления завершены, Мисс D и кансен Ириса исчезли."
      - "Рядом со мной остались только Уичита и Кимберли из будущего."
  - char: "kimberly_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Ответь мне на несколько вопросов. Откуда ты так много знаешь?"
      - "Наши секреты, секреты Антиоха... Как будто ты всё это знаешь..."
      - "Почему мы испытываем такую ностальгию по отношению к тебе?"
      - "Почему Энтерпрайз не смогла покончить с тобой?"
      - "Почему... я тоже не могу этого сделать?"
      - "Кто ты вообще такой?"
  - char: "commander"
    side: "right"
    text:
      - "Честно говоря, Кимберли, я бы и сам не отказался от ответа на этот вопрос."
      - "Именно поэтому я сейчас здесь с вами."
  - char: "kimberly_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Хорошо."
      - "Тогда давай смотреть, как наступает конец... вместе."

chapter5:
  rows:
  - text:
      - "Мы больше не произносим ни слова. Мы все молча смотрим, как наступает предрешенный конец."
      - "Черный вихрь набирает силу и ярость в попытке поглотить всё сущее."
      - "Затем, словно достигнув критической точки, из центра вырывается ударная волна."
      - "Всё в поле зрения становится черным."
      - "Уичита и Кимберли уже пали. Мое тело и разум трещат под этой тяжестью, стремительно приближаясь к точке коллапса."
      - "Мой затуманенный разум, находящийся на грани полного растворения, обволакивает синяя пена."
      - "Я вижу почерневшее небо. Огонь, дым."
      - "Одинокая падающая звезда проносится сквозь эту пустоту."
      - "Как же они прекрасны, звезды в ночном небе."
