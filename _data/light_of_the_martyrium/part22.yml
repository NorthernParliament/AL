chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Используя разведданные, собранные для меня девочками, я привел поле боя в движение."
      - "Парящие линкоры обеспечивают максимально возможную огневую поддержку, уничтожая приближающуюся волну врагов."
      - "Основываясь на отчете Констеллейшн, я думал, что примерно представляю, насколько сильны флоты Совета. На деле же они превосходят все ожидания."
      - "Этот личный опыт говорит мне о том, что оценки из отчета, которые казались мне преувеличенными, теперь выглядят, скорее, чересчур сдержанными."
      - "Эти суда могли бы за считанные секунды уничтожить даже основной флот серийных кораблей из нашего таймлайна."
      - "И это не говоря уже о кансен, чья сила на целый порядок превосходит силу девочек из нашего таймлайна."
      - "Взять, к примеру, Эльзас из этого флота. Она получила тяжелые повреждения, и лишь один из её главных калибров всё ещё может вести огонь."
      - "Даже при этом я искренне сомневаюсь, что наша Эльзас смогла бы победить её один на один."
      - "Мне нужно узнать, что делает их настолько сильнее."
  - char: "commander"
    side: "left"
    text:
      - "(Теперь я хорошо понимаю уровень силы этого таймлайна.)"
      - "(Далее нужно оценить силы Икс.)"

chapter2:
  rows:
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Командир, в вашу сторону направляется небольшой флот."
      - "Это то самое подкрепление, о котором говорили вы с Анзил?"
  - char: "commander"
    side: "left"
    text:
      - "(Я знал, что был прав, доверившись ей. И они прибыли гораздо раньше, чем я ожидал.)"
      - "(Давайте проверим данные воздушной разведки и посмотрим, кто там идет. У нас тут... Кимберли и Уичита META, и...)"
      - "(Погодите-ка... Мисс D?!)"

chapter3:
  rows:
  - text:
      - "Благодаря моему командованию Икс понесли тяжелые потери, но, чтобы избежать дальнейшего урона, они сливаются в огромные сгустки и исчезают под водой."
      - "Похоже, мы пережили бурю."
  - char: "miss_d"
    side: "left"
    text:
      - "Вот ты где, ассистент! Я наконец-то нашла тебя!"
      - "Что ты здесь делаешь?!"
      - "Они идут! Икс наступают! Нам нужно убираться отсюда!"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Угомонись. Икс были полностью разбиты."
      - "В смысле, ты же сама это видишь, верно?"
  - char: "miss_d"
    side: "left"
    text:
      - "Их возвращение — лишь вопрос времени! И когда они вернутся, вам мало не покажется!"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "И на чьей ты вообще стороне, раз такое говоришь?"
  - char: "miss_d"
    side: "left"
    text:
      - "Я на стороне ассистента!"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Да-да. Твой ассистент вон там. Давай, топай к нему."
  - char: "miss_d"
    side: "left"
    text:
      - "Не указывай мне, что делать! Ты мне не мама!"

chapter4:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Эм, спасибо, что присмотрели за Мисс D, наверное?"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Теперь она снова твоя проблема. На сегодня с меня хватит работы нянькой."

chapter5:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Что ж, вот так случайная встреча..."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "И не говори. Не думала, что снова наткнусь на тебя."

chapter6:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Мисс D, где все остальные? Мы всё еще в Мартириуме?"
  - char: "miss_d"
    side: "left"
    text:
      - "Здесь всё ещё пахнет смертью, так что, думаю, да."
      - "Но это материализовали не вагоны поезда! А что-то другое!"
      - "Слушай, всё очень сложно!"
      - "Я нашла тебя только благодаря маячку, который на тебя повесила!"
  - char: "commander"
    side: "right"
    text:
      - "Погоди, и как давно на мне висит маячок?"
  - char: "commander"
    side: "left"
    text:
      - "С тех самых пор, как я встала с той кровати! Вот такая я умная!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Угх... Тоже мне подкрепление она прислала."
      - "По крайней мере, мы все еще живы благодаря вам и Командиру."
      - "А вы-то что здесь делаете? Разве вы не должны быть в другом месте?"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Э-э..."
      - "В общем, всё сложно. У меня нет слов, чтобы это объяснить."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Как скажете. В последнее время для всех нас всё сложно, странные вещи происходят одна за другой."
      - "Несмотря на это, мы рады встрече с вами."
      - "С вашей и Командира помощью, мы, возможно, доживем до завтрашнего дня."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Доживете. Вы вернетесь домой."
  - char: "kimberly_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Да."
  - char: "bearn_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Командир, из моря поднялась векторная зона коррозии, защищенная коконом."
      - "По моим оценкам, их численность в пятнадцать раз превышает прошлую волну. Даже ваши способности не смогут компенсировать такую разницу в силе."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Мы так и знали... Это место — одна большая засада."
  - char: "commander"
    side: "left"
    text:
      - "Тогда мы просто проложим себе путь отсюда, как и планировали. Всем приготовиться к бою."
      - "Пеп... Уичита и Кимберли расчистят путь. Мы отступим, как только обеспечим себе выход!"
  - char: "bearn_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Их двоих действительно будет достаточно?"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Будет. Вы только что видели, на что мы способны."
      - "Вы сосредоточьтесь на своей задаче, а мы — на своей!"
