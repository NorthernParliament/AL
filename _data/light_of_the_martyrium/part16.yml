chapter1:
  rows:
  - text:
      - "Свет рассеивается, и я обнаруживаю себя стоящим на пляже на закате."
  - char: "commander"
    side: "left"
    text:
      - "(Что это, черт возьми, за место? Разве она не должна была вернуть меня в Мартириум?)"
  - char: "alsace"
    side: "right"
    text:
      - "Я обнаружила цели! Мисс D и Командир невредимы!"
  - char: "brennus"
    side: "left"
    text:
      - "Ты заставил меня поволноваться, Меченосец. Ты снова отстал от нас."
  - char: "miss_d"
    side: "right"
    text:
      - "Это происходит ТОЛЬКО с тобой каждый раз, когда мы перемещаемся! Если ты делаешь это специально, то прекращай!"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Где мы вообще находимся?"

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Если это не Мартириум, то что тогда?"

chapter4:
  rows:
  - char: "mogador"
    side: "right"
    text:
      - "Понятия не имею, прости. Мы просто двигались вперед, и следующее, что я помню — я здесь."
      - "Всё, что я могу сказать — это остров с довольно большими коралловыми рифами."
  - char: "fleuret"
    side: "left"
    text:
      - "Эй, Эльзас, ты уверена, что это место не плод твоего воображения?"
  - char: "alsace"
    side: "right"
    text:
      - "Я никогда не представляла себе никаких островов, а уж тем более этот!"
  - char: "fleuret"
    side: "left"
    text:
      - "Ладно, тогда почему мы здесь? Ты что, свернула не туда или типа того, Мисс D?"
  - char: "miss_d"
    side: "right"
    text:
      - "Я не делаю ошибок, и точка! Скажи им, Элизабет!"
  - char: "queen_elizabeth_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Мисс D не запорола прыжок. Ваши координаты, вообще-то, находятся внутри Мартириума."
      - "А если точнее, вы находитесь во втором кольце, которое мы воплотили с помощью нашего шестого вагона. Концепция, правящая там — это по-прежнему смерть."
  - char: "commander"
    side: "right"
    text:
      - "Ты всё еще с нами, Элизабет! Я думал, связь оборвется."
  - char: "queen_elizabeth_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Судя по тому, как ты это сказал, для тебя это обычное дело."
      - "Не волнуйся. Этого не произойдет, пока мы обеспечиваем вам поддержку."
  - char: "commander"
    side: "right"
    text:
      - "(Улучшенный коммуникатор, вероятно, тоже помогает. В любом случае, так я смогу лучше справляться с непредвиденными ситуациями.)"

chapter5:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Спасибо. Я рад, что ты у нас есть."

chapter6:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Спасибо, Ваше Величество. МЕТА или нет, на тебя всегда можно положиться!"

chapter7:
  rows:
  - char: "queen_elizabeth_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Да, и тебе следует быть благодарным за это!"
  - char: "fleuret"
    side: "right"
    text:
      - "Ты УВЕРЕНА, что это Мартириум? Он совсем не похож на то, что снаружи."
      - "Второе кольцо выглядело, ну знаешь, прямо как первое. Золото, мрамор, бла-бла-бла."
  - char: "miss_d"
    side: "left"
    text:
      - "Потому что внутри — это не снаружи! Это обособленное пространство, прямо как вагоны поезда!"
      - "Тебя тоже сбивает с толку, почему они выглядят иначе внутри, или как?"
  - char: "fleuret"
    side: "right"
    text:
      - "Но эти двое АБСОЛЮТНО разные! Интерьер поезда всё равно выглядит как интерьер поезда, даже если ты сменишь обстановку!"
  - char: "miss_d"
    side: "left"
    text:
      - "В смысле... Да, полагаю, два воплощения концепции смерти не должны выглядеть НАСТОЛЬКО по-разному."
      - "Поняла! Концепция, вероятно, вся перемешалась из-за того, что здесь слишком много людей!"
      - "Это не ТОЛЬКО представление Эльзас о смерти — оно смешалось с чьим-то ещё. На самом деле, с представлениями сразу нескольких людей!"
      - "Это единственное объяснение того, почему здесь всё выглядит иначе!"
  - char: "commander"
    side: "right"
    text:
      - "(Тогда, если это смесь концепций, значит ли это, что место стало ближе к тому, как оно выглядело изначально?)"
  - char: "miss_d"
    side: "left"
    text:
      - "Подождите-ка... Оно не просто ВЫГЛЯДИТ иначе, оно и функционирует по-другому!"
      - "Здесь течет время!"
  - char: "mogador"
    side: "right"
    text:
      - "Эм, а разве время не постоянно? Потому что оно не то чтобы начинается или останавливается?.."
  - char: "miss_d"
    side: "left"
    text:
      - "Я не про НАШЕ время говорю, идиотка! Я имею в виду, что время течет для этого пространства!"
      - "Элизабет не делала его таким, когда материализовывала Мартириум."
      - "Не делала, потому что всё, что нам было нужно — это простая основа. Она создала неизменное пространство!"
      - "Но это место другое. К нему была добавлена концепция времени."
      - "Это значит, что оно больше не представляет собой статичную смерть — оно представляет смерть в динамике!"
  - char: "mogador"
    side: "right"
    text:
      - "Что-что? Так, типа... это пространство будет меняться с течением времени?"
  - char: "miss_d"
    side: "left"
    text:
      - "Да! Именно так!"
      - "А значит, я понятия не имею, что нас ждет!"
  - char: "brennus"
    side: "right"
    text:
      - "Как бы то ни было, смерть остается смертью. Что бы ни случилось, это будет связано со смертью."
  - char: "miss_d"
    side: "left"
    text:
      - "Тут ты права!"
  - char: "commander"
    side: "right"
    text:
      - "(То есть это похоже на видеокассету? Пленку, показывающую процесс чьей-то смерти... Или, может быть, смерти этого мира.)"
  - text:
      - "Волны плещутся о берег. Тропические растения на небольшом холме. Выглядит как любой другой островок в Тихом океане."
      - "Однако одна деталь выделяет его — здание вдалеке."
  - char: "commander"
    side: "right"
    text:
      - "(Внешний вид немного отличается от того, каким я его помню, но силуэт и расположение совпадают...)"
      - "(Точно. Это Институт морских исследований Самоса из альфа таймлайна!)"
      - "(Если моя догадка верна, то это запись смерти кого-то из того таймлайна — или «смерти» этого пространства.)"
  - char: "epee"
    side: "left"
    text:
      - "Эт-то место нагоняет на меня жуть..."
      - "Оно выглядит таким тихим и мирным, но смерть таится за углом..."
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Тебе не нужно так бояться. Смерть — это всего лишь правило, которое управляет этим пространством, и средство для того, чтобы войти, выйти и перемещаться по нему."
      - "Смерть там, так сказать, не означает вашу буквальную смерть. Это стало бы проблемой только в том случае, если бы концепция поглотила вас."
      - "К слову, мы провели еще одну проверку и определили, что там ВСЁ ЕЩЕ есть пространство для развертывания, если вы можете в это поверить."
      - "Знайте, что если вам понадобится преследовать кита дальше, вы можете использовать смерть, чтобы попасть в следующее пространство."
  - char: "alsace"
    side: "left"
    text:
      - "Т-ты предлагаешь действительно заглянуть смерти в глаза?"
      - "Я бы куда больше предпочла путешествовать в вагонах поезда!"
  - char: "miss_d"
    side: "right"
    text:
      - "Смерть вас не тронет, пока я здесь. Кроме того, у меня есть идея получше!"
      - "Мы просто поймаем кита прямо здесь и сейчас!"
  - char: "fleuret"
    side: "left"
    text:
      - "Отличная идея! Единственная проблема — я нигде не вижу кита. Он, наверное, снова сбежал."
  - char: "miss_d"
    side: "right"
    text:
      - "Не-а! Я знаю, что нет! Он просто прячется где-то поблизости!"
      - "Где-то вроде... Ага! Море!"
      - "Он ТОЧНО должен быть там!"
      - "Готовы вы или нет, мы идем плавать!"
  - char: "commander"
    side: "left"
    text:
      - "Секундочку, Мисс D. Ты не узнаешь этот остров? И, что еще важнее, то здание вон там?"
  - text:
      - "Я указываю ей на исследовательский институт."
  - char: "commander"
    side: "left"
    text:
      - "Если она Арбитр, она должна знать место, где д-р Аосте проводил свои исследования.)"
  - char: "miss_d"
    side: "right"
    text:
      - "О, ты про Институт морских исследований?"
      - "Да, я помню его. Кажется, это был мой дом. Или твой. Или наш общий. Наверное."
  - char: "commander"
    side: "left"
    text:
      - "«Наверное»?"
  - char: "miss_d"
    side: "right"
    text:
      - "Я не уверена, ясно?! Это просто чутье!"
      - "Все мои важные воспоминания хранятся внутри кита! Я не вспомню, пока мы его не поймаем!"
      - "А ТЫ-ТО сам откуда помнишь, что был здесь?"
  - char: "commander"
    side: "left"
    text:
      - "«Помню» — не совсем правильное слово. Сейчас слишком долго это объяснять. Мы можем, пожалуйста, сначала осмотреть институт?"
  - char: "mogador"
    side: "right"
    text:
      - "Погоди, ты узнаешь это место?"
  - char: "commander"
    side: "left"
    text:
      - "Да. Это остров Самос, расположенный в Бермудском море. Ну, остров Самос из будущего."
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Из альфа таймлайна? Ты хочешь сказать, что это пространство было построено на основе данных оттуда?"
  - char: "miss_d"
    side: "left"
    text:
      - "Ла-а-адно, мы сделаем так, как ты скажешь, ассистент. Мы осмотрим институт, а ЗАТЕМ пойдем ловить кита!"
