chapter1:
  rows:
  - text:
      - "Держа Мисс D за руку, я шагаю через дверь в седьмой вагон. Внезапно меня швыряет в небытие."
      - "Мое чувство времени, пространства и даже самого себя становится туманным, словно какая-то могущественная сила разрывает меня на части."
      - "Мысль за мыслью — кажется, будто мой разум сливается воедино с этой бесконечной пустотой."
  - char: "miss_d???d"
    side: "right"
    status: "is-purple"
    text:
      - "Ты когда-нибудь думал о смерти? О том, что она значит для этих девочек? Для них это ни конец, ни избавление."
  - text:
      - "Как раз в тот момент, когда мне кажется, что я вот-вот исчезну, со мной заговаривает знакомый голос."
  - char: "miss_d???d"
    side: "right"
    status: "is-purple"
    text:
      - "К худу или к добру, они никогда по-настоящему не умрут, пока люди о них помнят."
      - "Более того, для них смерть — это не билет в один конец, как для нас."
      - "«Мертвые» и «живые» — для них это не более чем состояния бытия."
      - "Каждый раз, когда они живут, и каждый раз, когда умирают, к их именам просто добавляется еще немного информации."
      - "С диалектической точки зрения смерть для них — ни хорошо, ни плохо. Это нейтральная концепция."
      - "Запомни это, это важно — они образуют коллектив из бесчисленных фрагментов данных, пока им не дадут индивидуальные тела."
      - "Отдельные ответвления этого коллектива можно реплицировать. Я дала эту силу Смерти."

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Мисс D?"

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Аосте?"

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Анзил?"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Кто ты?"

chapter6:
  rows:
  - char: "miss_d"
    side: "right"
    text:
      - "...Эй! Не стой просто так!"
  - char: "commander"
    side: "left"
    text:
      - "(Это был голос Мисс D... но что-то не так. Она не понимает, что только что сказала?)"
  - char: "miss_d"
    side: "right"
    text:
      - "Эй! Идиот! Отлично придумал — потеряться и всех до смерти напугать!"
  - char: "commander"
    side: "left"
    text:
      - "...Что? Ты думала, это я привел тебя сюда?"
  - char: "miss_d"
    side: "right"
    text:
      - "Нет, конечно же нет! Зачем ты вообще сюда пришел? Ты буквально развалишься на части, если останешься тут дольше!"
      - "Возьми меня за руку! Я вытащу тебя!"

chapter7:
  rows:
  - text:
      - "Я хватаю Мисс D за руку. Пустота исчезает по щелчку, сменяясь золотым светом."
      - "Я стою в городе, высеченном из мрамора, над головой возвышаются золотые арки. Воздух наполнен ароматами сельской местности Ириса и тихой, умиротворяющей соборной музыкой."
  - char: "commander"
    side: "left"
    text:
      - "(Это Мартириум... Я добрался.)"
  - char: "alsace"
    side: "right"
    text:
      - "Слава небесам, ты в порядке, Командир! Ты просто исчез у нас на глазах, и я подумала, что ты пропал..."
  - char: "miss_d"
    side: "left"
    text:
      - "Ха, какая ты наивная! Никто не пропадает, если я так решила!"
  - char: "brennus"
    side: "right"
    text:
      - "Еще одно чудо во имя Меченосца. Какое облегчение, что ты невредим."
  - char: "commander"
    side: "left"
    text:
      - "Простите, если напугал вас всех. Я просто немного потерялся."
  - char: "miss_d"
    side: "right"
    text:
      - "«Немного» потерялся! Ты ЕДИНСТВЕННЫЙ, кто умудрился это сделать! Ты такой идиот!"
  - char: "alsace"
    side: "left"
    text:
      - "Какая наглость! Знаешь ли, в моих базах данных сказано, что те, кто называет других идиотами, обычно сами идиоты!"
  - char: "miss_d"
    side: "right"
    text:
      - "Конечно, идиотка! Я называю идиотами только идиотов!"
  - char: "alsace"
    side: "left"
    text:
      - "Ложь! Я никогда не соглашусь с тем, что Командир — идиот!"
  - char: "fleuret"
    side: "right"
    text:
      - "Угх... Что это, детская площадка? Хватит спорить, как малые дети."
  - char: "commander"
    side: "left"
    text:
      - "Они в конце концов устанут. Что более важно, куда делась нарушительница?"
  - char: "fleuret"
    side: "right"
    text:
      - "Думаю, мы оторвались от неё."
  - char: "mogador"
    side: "left"
    text:
      - "Обожаю отрываться... в смысле, отрываться от врагов."
      - "Кроме того, теперь мы знаем, что концепции могут игнорировать такие вещи, как, ну знаете, физическое расстояние между двумя точками в пространстве..."
  - char: "commander"
    side: "right"
    text:
      - "(Технически, мы находимся в Зеркальном море, так что, возможно, именно поэтому такое чудо стало возможным. Интересно, работают ли телепорты и искусственный туман Сирен по схожему принципу...)"
  - char: "miss_d"
    side: "left"
    text:
      - "Угх... Да какая разница! Ассистент НЕ идиот! Вот! Теперь довольна?"
  - char: "alsace"
    side: "right"
    text:
      - "Я выиграла этот спор!"
  - text:
      - "Эльзас победоносно упирает руки в бока и наслаждается своей стратегической победой."
  - char: "commander"
    side: "left"
    text:
      - "Хорошо. А теперь, Мисс D, этот враг погонится за нами?"
  - char: "miss_d"
    side: "right"
    text:
      - "«Этот враг»... Ненавижу, как это звучит! Ей нужно имя!"
      - "Что-то вроде... Придумала! Тень Смерти!"
      - "Да! Мне плевать, что она там думает, мы будем называть её так!"
  - char: "commander"
    side: "left"
    text:
      - "(Это еще один случай «важности концепции»?)"
      - "Ладно. Тень Смерти погонится за нами?"
  - char: "miss_d"
    side: "right"
    text:
      - "Всё, что могу я, может и она! А это значит, что да, погонится! Если только она не полная идиотка!"
      - "Но забудь о ней, есть кое-что поважнее! Мы добрались до Мартириума, помнишь?"
      - "И зачем мы здесь? Ловить кита! Время кита-а-а!"
  - text:
      - "Мисс D указывает пальцем на кита, плывущего по небу, и восторженно прыгает вокруг."
      - "Но, прежде чем мы сможем поймать кита..."

chapter8:
  rows:
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Что?! Враг преодолел защиту поезда, потому что их концепции суть одно и то же?!"
      - "Это действительно объясняет, почему мы не смогли обнаружить вторжение издалека... Тот факт, что мы не можем обнаружить её и сейчас, скорее всего означает, что она переместилась куда-то еще."
      - "Мы только что вернулись в поезд. Излишне говорить, что никаких следов... «Тени Смерти» нигде не обнаружено."
  - char: "alsace"
    side: "left"
    text:
      - "Элизабет, Мисс D ранее назвала тебя идиоткой за то, что ты не воспользовалась прямым маршрутом через дверь шестого вагона."
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Вот как? Месяц без сладостей для неё."
  - char: "miss_d"
    side: "left"
    text:
      - "Почему?!"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "А ты подумала, ПОЧЕМУ мы не воспользовались этим маршрутом? Потому что это значительно повышает риск того, что преследователь последует за нами в поезд."
  - char: "miss_d"
    side: "left"
    text:
      - "Ох..."
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Да, теперь ты знаешь. Оставайтесь на месте, и мы скоро будем."
  - char: "miss_d"
    side: "left"
    text:
      - "Нет, не приходите сюда! Вы вообще не должны были здесь находиться!"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Что-что? И каков твой план — противостоять Дьявол без нас?"
  - char: "miss_d"
    side: "left"
    text:
      - "Не-а! Никаких сражений! Я поймаю кита и смоюсь!"
      - "Мы не можем позволить ему снова сбежать! Вы должны оставаться там и стабилизировать Зеркальное море и концепцию!"
      - "Сделать их супер-пупер стабильными! И тогда он окажется здесь в ловушке!"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "И речи быть не может! У нас закончатся ресурсы, если мы сделаем её еще стабильнее!"
      - "Или что, ты на полном серьезе предлагаешь нам использовать ЕЩЕ ОДИН вагон поезда?!"
  - char: "miss_d"
    side: "left"
    text:
      - "Вы всегда можете превратить его обратно! Если кит сбежит сейчас, кто знает, сможем ли мы вообще когда-нибудь его поймать!"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Тц. Да будет так. Кто не рискует, тот ничего не получает, полагаем."
  - char: "commander"
    side: "left"
    text:
      - "В этом я согласен с Мисс D. Пожалуйста, сделайте это."
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Очень хорошо. Мы будем поддерживать вас изо всех сил из поезда."
      - "В худшем случае мы придем и спасем вас. А теперь, вперед. Наслаждайтесь Мартириумом."
  - char: "miss_d"
    side: "left"
    text:
      - "Все слышали её. Идем ловить этого кита!"
