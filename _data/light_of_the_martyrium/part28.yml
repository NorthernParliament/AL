chapter1:
  rows:
  - text:
      - "Благодаря нашим усилиям нам удается приблизить концепцию Зеркального Моря к её изначальному состоянию."
      - "БАБАХ!!!"
  - char: "alsace_rad"
    side: "right"
    text:
      - "Подтверждаю уничтожение противника на три часа!"
  - char: "mogador_rad"
    side: "left"
    text:
      - "Ура-а-а♪ Коррозия заметно замедляется!"
  - char: "commander"
    side: "right"
    text:
      - "Так держать! Прорывайтесь к центральному кристаллу!"
      - "Система управления Мартириумом... то есть Зеркальным Морем, может ждать нас там!"
  - char: "fleuret_rad"
    side: "left"
    text:
      - "Говорит Флёре! Флот подавления всё еще не может достичь заданного сектора из-за угрозы попасть под перекрестный огонь."
  - char: "commander"
    side: "right"
    text:
      - "Пропустите этот сектор. Пусть флот Элизабет сражается свободно."
      - "Меня беспокоит битва с Родни. Свяжитесь со мной, как только заметите Хатакадзэ!"
  - char: "epee_rad"
    side: "left"
    text:
      - "П-поняла-приняла!.."
  - char: "brennus_rad"
    side: "right"
    text:
      - "Я заметила несколько дронов Дьявол, но самой Арбитр нигде не видно."
  - char: "commander"
    side: "left"
    text:
      - "Не преследуйте дронов слишком далеко. Сосредоточьтесь на поисках, как и планировалось."
  - char: "brennus_rad"
    side: "right"
    text:
      - "Поняла."

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Отлично. Родни должна слабеть с каждым мгновением.)"
      - "(Однако Хатакадзэ не показывалась с тех пор, как проявила коррозию.)"
      - "(Дьявол тоже должна что-то замышлять.)"
      - "(Может ли быть... они ждут, пока мы победим Родни?)"
      - "Мисс D, отчет о состоянии Родни."
  - char: "miss_d"
    side: "right"
    text:
      - "Она всё еще хорохорится, но довольно скоро распадется."
  - char: "commander"
    side: "left"
    text:
      - "...Распадется? Что будет потом?"
  - char: "miss_d"
    side: "right"
    text:
      - "Понятия не имею!"
  - char: "commander"
    side: "left"
    text:
      - "(Может, попытаться связаться с Хеленой? Мы в самом разгаре боя... но, думаю, это мой лучший шанс.)"
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "commander"
    side: "left"
    text:
      - "Хелена, ты меня слышишь?"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Мы тут почти закончили. Сосредоточься на собственной безопасности."
  - char: "commander"
    side: "left"
    text:
      - "Я в порядке. Но у меня к тебе пара вопросов!"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "...Обязательно прямо сейчас?"
  - char: "commander"
    side: "left"
    text:
      - "Да, обязательно. Это связано с этой битвой."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Хорошо, тогда. Спрашивай о чем угодно."
  - char: "commander"
    side: "left"
    text:
      - "Та Родни — это подделка, созданная из комплекса, что означает, что она похожа на Пешку."
      - "Как она может быть такой сильной?"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Коррозия служит лишь клеем для кокона. Что действительно важно — так это сам кокон."
      - "Что касается кокона, то это основа, которая привязывает концепцию Родни к этому миру, чтобы она могла проявиться."
  - char: "commander"
    side: "left"
    text:
      - "Кокон сейчас разбит на фрагменты, не так ли?"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Да. Сначала Хатакадзэ послала Икс в эту область воспоминаний, чтобы подвергнуть Родни коррозии."
      - "Благодаря твоему вмешательству концепция Родни сама уничтожила кокон."
      - "Коррозия Икс остановилась, но это также ослабило связь самой концепции с реальностью."
  - char: "commander"
    side: "left"
    text:
      - "И после этого Хатакадзэ использовала оставшиеся фрагменты, чтобы создать марионетку из чистой силы?"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Именно так."
  - char: "commander"
    side: "left"
    text:
      - "Если твое утверждение про клей верно, то очищение от коррозии заставит кокон развалиться на части... Как думаешь, это возможно?"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Да, конечно."
  - char: "commander"
    side: "left"
    text:
      - "Хорошо... А что, если вместо того, чтобы уничтожить её, мы оставим Родни в этом мире? Это сработает?"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Это будет сложно, но не невозможно."
      - "Если такова твоя цель, то нам нужно будет подавить силу этой Родни ради нашей собственной безопасности."
  - char: "commander"
    side: "left"
    text:
      - "Мы должны попытаться. Это просто предчувствие, но я думаю, Хатакадзэ и Дьявол рассчитывают на то, что вы уничтожите эту марионетку."
      - "Иначе не думаю, что они стали бы показываться только ради того, чтобы спровоцировать вас."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Поняла. D, помоги нам приблизиться к цели. Будем действовать, отталкиваясь от этого."
  - char: "miss_d"
    side: "left"
    text:
      - "Сколько раз мне еще повторить?! Нет кита — нет шансов! Ничего не выйдет!"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Ладно. Тогда я сделаю это за тебя."
      - "Перераспределение ресурсов, режим передачи данных."

chapter3:
  rows:
  - text:
      - "Синий поток вырывается из коммуникатора и поглощает Мисс D."
      - "Сразу после этого Мисс D и Хелена появляются позади Родни."
  - char: "rodney_meta_1"
    side: "left"
    status: "is-lightgray"
    text:
      - "?.."
  - char: "miss_d"
    side: "right"
    text:
      - "А? Что происходит? Воу, воу, воу!"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Взлом... Завершен."
      - "Перезапись... Завершена."
      - "Родни. В соответствии с желанием Командира, воссоздай себя как META."

chapter4:
  rows:
  - text:
      - "Мягкий синий свет окутывает Родни. Её израненное тело восстанавливается в мгновение ока."
      - "Витающая в воздухе коррозия разом исчезает, словно смытая потоком."
      - "Когда всё заканчивается..."
  - char: "rodney_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Значит, ты призвала «меня» сюда."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Если бы я этого не сделала, концепция поглотила бы тебя целиком. Не благодари меня — благодари Командира."
  - char: "rodney_meta"
    side: "left"
    status: "is-purple"
    text:
      - "......"
      - "Очень хорошо."
  - text:
      - "Так битва в небе над Мартириумом внезапно подошла к концу."
