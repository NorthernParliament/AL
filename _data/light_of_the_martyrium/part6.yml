chapter1:
  rows:
  - text:
      - "Из пустой темноты вырывается свет."
      - "Затем появляются золотые арки и жемчужно-белая дорога. К всеобщему изумлению, из небытия возникает круглый город."
  - char: "epee"
    side: "left"
    text:
      - "Это... прекрасно..."
  - char: "brennus"
    side: "right"
    text:
      - "Подобно Зеркальному морю, сжатое пространство высвободилось, породив целый город, основанный на концепции."
      - "И всё это из объекта размером всего лишь с вагон поезда. Это поистине внушает трепет."
  - char: "mogador"
    side: "left"
    text:
      - "Ва-а-ау... Никогда раньше не видела ничего подобного."
      - "Должно быть, именно так Беарн манипулирует пространством с помощью якорей реальности."
  - char: "fleuret"
    side: "right"
    text:
      - "Якоря реальности? Что это такое?"
  - char: "mogador"
    side: "left"
    text:
      - "Это технология стабилизации реальности, которая постоянно используется в Базиликах."
      - "Как следует из названия, они могут закреплять самые разные концепции. В случае этого города — концепцию смерти."
      - "Беарн была бы в та-а-аком восторге, если бы могла это увидеть. Жаль, что её здесь нет."
  - char: "commander"
    side: "right"
    text:
      - "(Однако по ощущениям это не очень похоже на город, основанный на идее смерти. Скорее на ум приходят образы великолепия и святости.)"
      - "(Всё дело в интерпретации? Так Эльзас представляет себе смерть?)"
  - char: "fleuret"
    side: "left"
    text:
      - "Эльзас, у этого города есть, типа, название?"
  - char: "alsace"
    side: "right"
    text:
      - "Хм? Мне о таком неизвестно."
  - char: "brennus"
    side: "left"
    text:
      - "Великолепное сооружение из золота и мрамора в память о смерти..."
      - "Это наводит на мысль — Мартириум. Как вам такое название?"
  - char: "alsace"
    side: "right"
    text:
      - "Мартириум... Святилище, построенное на могиле, да? Я одобряю эту идею!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хорошее название. Давайте назовем его так."
      - "Хотя ты, вероятно, этого не осознаешь, но давать вещам имена в соответствии с твоей концепцией о них — это хорошо."
      - "Если другие примут эту концепцию, то это... ладно, неважно."
      - "Возникла небольшая проблема."
      - "Мы не можем должным образом закрепить концепцию. Пространство, которое занимает кит, не сможет полностью воплотиться в реальности."
      - "Наше пространственное возмущение было сильным, но объем данных внутри свернутого пространства просто ошеломляет... Даже целый вагон поезда смог развернуть лишь эту часть."

chapter2:
  rows:
  - char: "whale"
    side: "right"
    text:
      - "......"
  - text:
      - "С оглушительным гулом в небе над Мартириумом внезапно появляется кит."
  - char: "miss_d"
    side: "left"
    text:
      - "Кит! Мой кит здесь!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ох. Значит, этого всё же хватило, чтобы его выманить."
  - char: "miss_d"
    side: "left"
    text:
      - "Элизабет, заводи поезд! Мы должны поймать моего кита!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Не торопись. Мартириум — это отдельное пространство, сродни Зеркальному морю. Мы не сможем поймать кита, не войдя в это пространство."
  - char: "miss_d"
    side: "left"
    text:
      - "Тогда сделай это! Отправляйся в город! Заводи поезд ПРЯМО СЕЙЧАС!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ты бываешь такой занозой... Ладно, запускаю двигатель."
      - "...Подожди. Кит не один."
  - char: "commander"
    side: "left"
    text:
      - "Что ты имеешь в виду? Там есть кто-то еще?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "МЕТА, если быть точной. Две группы, одна из которых не замаскирована. Уичита и Кимберли."
      - "Судя по этому дуэту... это Пепел."
  - char: "commander"
    side: "left"
    text:
      - "Даже в такой дали мы всё равно натыкаемся на них..."
      - "(Но одна из наших работает с ними — Фридрих. Может, мы сможем расспросить их об Энтерпрайз или Хирю.)"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Другая группа замаскирована. Мы не можем их опознать с такого расстояния."
      - "Только мы знаем о ките, поэтому они, скорее всего, здесь лишь для расследования пространственного возмущения."
      - "Как будто нам и без того мало проблем..."
  - char: "miss_d"
    side: "left"
    text:
      - "Они УЗНАЮТ о ките, как только посмотрят наверх!"
      - "Заводи уже этот чертов поезд! Иначе они доберутся до него первыми!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "ХВАТИТ! НАС! ПОДГОНЯТЬ! Более того, мы не знаем, с кем имеем дело! Бросаться туда вслепую — верная смерть!"
      - "А пока все останутся на своих местах внутри поезда. Мы пойдем и разведаем обстановку."
      - "Антиконцептуальная защита «Света Королевы» неприступна. Вы будете здесь в безопасности, пока нас не будет."
      - "Командир, я слышала, ты отличная нянька. Присмотри за этим дерзким ребенком в наше отсутствие! Проследи, чтобы она не сбежала."
  - char: "commander"
    side: "left"
    text:
      - "Будет сделано."
  - char: "miss_d"
    side: "right"
    text:
      - "С чего бы мне сбегать от ассистента? Просто иди и возвращайся поскорее!"
