chapter1:
  rows:
  - text:
      - "Мы замаскировали дверь и Камелот, прежде чем подняться на борт «Света Королевы»."
      - "За окном сияют бескрайние звезды."
      - "Но место нашего назначения — не далекое море звезд. Это абсолютное ничто."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мы почти на месте. Эльзас, ты готова?"
  - char: "alsace"
    side: "right"
    text:
      - "В-возможно! Позволь мне подготовиться еще немного..."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Не волнуйся. Расслабься и предоставь всё нам."

chapter2:
  rows:
  - text:
      - "Время останавливается."
      - "Всё в вагоне замирает. Даже звуки затихают."
      - "Лишь Элизабет начинает медленно двигаться."
      - "Шаг за шагом, оставляя за собой тусклые остаточные силуэты."
      - "Она на мгновение останавливается перед Эльзас. А затем проходит прямо сквозь неё."
      - "Сразу после этого время возобновляет свой ход."
      - "Остаточные силуэты, оставленные Элизабет, проходят сквозь Эльзас и растворяются в своей владелице."

chapter3:
  rows:
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Наша проверка завершена."
      - "Отличная работа. Теперь можешь перестать это представлять."
  - char: "alsace"
    side: "right"
    text:
      - "Уже всё закончилось?.. В моей области памяти ничего нет..."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты отлично справилась."
      - "Поразительно, что кто-то смог так хорошо сконструировать концепцию смерти."
  - char: "fleuret"
    side: "right"
    text:
      - "Ой, это было похоже на оживший фильм ужасов."
      - "Элизабет просто телепортировалась за спину Эльзас... Прямо как какое-то привидение!"
  - char: "epee"
    side: "left"
    text:
      - "Я-я ничего не видела... Вообще ничего..."
  - char: "brennus"
    side: "right"
    text:
      - "Какая поразительная скорость. Даже я не смогла уследить за ней."
  - char: "mogador"
    side: "left"
    text:
      - "Хммм..."
  - char: "miss_d"
    side: "right"
    text:
      - "Ха-ха-ха! Круто, да?"
      - "После того как мы поймаем этого кита, я стану ещё круче!"
  - char: "commander"
    side: "left"
    text:
      - "(А? Неужели никто больше не видел, что только что произошло?)"
      - "(Вообще-то, проходить сквозь цель так быстро, что остаются остаточные силуэты... Помню, Арбитр, с которой мы сражались в Средиземном море, делала то же самое.)"
      - "(Она назвала это... проверкой? Надо будет спросить об этом Хелену.)"
  - char: "fleuret"
    side: "right"
    text:
      - "Ну и? Сработало или как?"
      - "Снаружи ничего не изменилось."
  - char: "epee"
    side: "left"
    text:
      - "Да... Там всё темно и пусто..."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Поезд ещё не начал свою трансформацию."
      - "Честно говоря... Возможно, нам стоило бы использовать другой вагон в качестве основы для концепции этого прекрасного вида."
      - "Преобразование концепции, седьмой вагон. Стань основой смерти, закрепи незримое и воплоти его форму!"
