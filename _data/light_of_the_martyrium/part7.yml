chapter1:
  rows:
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Это здесь, Кимберли? Мы в точке зарождения пространственного искажения?"
  - char: "kimberly_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Скоро — мы близко. Хотя это странно... здесь не видно никаких обломков."
      - "В теории, их здесь должно быть полно."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "К слову, я ВООБЩЕ ничего не видела. Вся ветвь была буквально стерта."
      - "Этому есть только одно объяснение."
      - "Возмущение высвободило столько энергии, что пространство полностью потеряло стабильность."
      - "Оно стерло основу реального мира всей ветви и испытательного полигона вместе с ней, свернув её в более высокое измерение. Это объясняет, почему мы ни черта не видим снаружи."
  - char: "kimberly_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Всё просто. Нужно лишь вызвать ещё одно пространственное возмущение, чтобы создать проход."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мои мысли в точности. Хорошо, что у меня есть устройство, которое как раз с этим справится."
      - "Показывай дорогу. Я устрою для тебя настоящее шоу фейерверков."
  - text:
      - "Пока две участницы Пепла обдумывали план, они увидели на горизонте свет Мартириума."

chapter2:
  rows:
  - char: "kimberly_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Уичита?"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я вижу."
      - "Кто-то заново выстроил основу с помощью концептуального якоря, развернув пространство. Полагаю, это один из способов сделать это."
  - char: "kimberly_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Кто бы это ни сделал, он скрывается."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "И делает это чертовски хорошо. На моём радаре пусто."
      - "Но забудь об этом городе — видишь кита в небе? Узнаёшь его?"
  - char: "kimberly_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Арбитр XIII... Смерть."
      - "Она здесь. Может быть, даже затем же, зачем и мы."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "В любом случае, давай поторопимся. Мы должны уничтожить цель первыми, иначе выйдет, что мы зря потратили время, придя сюда."
  - char: "kimberly_meta"
    side: "right"
    status: "is-meta"
    text:
      - "И проигнорировать того, кто заново выстроил основу?"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Плевать. Рано или поздно мы их найдем."
      - "Если они дружелюбны, мы всё обсудим. Если нет — сразимся с ними. В любом случае, им нас не остановить!"
