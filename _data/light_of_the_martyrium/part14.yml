chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Впечатляет... Я восстанавливаю и укрепляю свое тело всё больше и больше, и каждый раз, несмотря на это, вы сбиваете меня с ног."
      - "Вы не рядовые участницы Пепла. Вы двое из числа основателей, не так ли?"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Подавление страха смерти и мгновенное возрождение... Обычные фокусы."
      - "Я видела, как такие, как ты, проделывали это миллион раз."
      - "Я видела, как их разум разрушается, пока они не оказываются в одном шаге от полного безумия."
      - "Так как же, черт возьми, ты сохранила рассудок?"
      - "Кто ты, черт возьми, такая?"
  - text:
      - "БАБАХ!!!"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Продолжаешь болтать, даже поливая меня огнем... Ты и правда закаленная воительница."
      - "К твоему сожалению, мои секреты останутся при мне."
      - "Взгляни на это новое кольцо. Они уже дважды бросили якорь, создав два Зеркальных моря, и всё равно то, что скрыто, так и не было раскрыто."
      - "Тот, кто вызвал это пространственное колебание, обладает невообразимой силой. Как бы мне хотелось с ним встретиться."
  - text:
      - "БАБАХ!!!"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Должно быть, ты мнишь себя невесть кем, раз отворачиваешься во время битвы с Пеплом."
      - "Я же сказала: я видела твои фокусы миллион раз. Думаешь, ты непобедима?"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Нет, и к тому же смерть — это лишь еще один путь к следующему месту назначения."
      - "Разве вы не поняли, какая концепция управляет этим пространством и какие правила вплетены в него?"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Аха-ха! До этого момента даже не задумывалась о них."
      - "Давненько я не встречала кого-то с таким взглядом на смерть. Антиох, должно быть, действительно обожает испытательный полигон бета."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Дело не в том, что я смеюсь в лицо смерти. Смерть — это обязательное условие для входа во второе Зеркальное море."
      - "Смерть — это концепция, правящая этим пространством. Это то, где оказываются все живые существа."
      - "Более того, сама концепция смерти здесь была переосмыслена. Вы буквально не можете убить меня, что бы вы ни делали."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Мне и не нужно тебя убивать. Я могу просто разорвать тебя в клочья."
      - "Даже если ты не умрешь, твои раны никуда не денутся, и в конечном итоге у тебя закончится энергия."
      - "Может, я и не смогу стереть тебя в порошок... а может, и смогу. Есть только один способ это выяснить."
  - text:
      - "БАБАХ!!!"
  - char: "kimberly_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Тебе никогда не суждено было появиться на свет. Сгинь."
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Теперь вы возомнили себя вершителями того, кому суждено родиться, не так ли?"
      - "Скажите мне, скольких людей вы убили?"
      - "Все эти угасшие души... дали ли эти смерти вам то, чего вы хотели?"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Заткнись. Каждая мертвая крыса вроде тебя — это одной проблемой меньше для вселенной."
      - "Не думай, что я не знаю, откуда берется твоя сила, с кем ты в сговоре и что ты замышляешь."
      - "Такие отбросы, как ты, не имеют права читать мораль!"
  - text:
      - "БАБАХ!!!"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Я надеялась заставить вас усомниться в себе, но увы..."
      - "Вы не оставляете мне иного выбора, кроме как исполнить ваше желание."
      - "Пусть наше конечное место назначения и одинаково, но я дам вам небольшой толчок, чтобы вы туда добрались!"

chapter2:
  rows:
  - char: "devil"
    side: "left"
    text:
      - "Два типа колец... Город?"
      - "Появилась новая зона. Подумать только."
      - "Если предположить, что смерть — это условие для входа..."
      - "Полагаю, я просто умру."
  - text:
      - "БАБАХ!!!"

