chapter4:
  rows:
  - text:
      - "Внутри того, что можно было назвать только линкором, синеволосая девушка смотрела на монитор с нежным выражением лица."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я не ожидала, что эти выскочки окажутся НАСТОЛЬКО сильны."
      - "Мне пришлось воззвать к силе Башни, чтобы наконец-то добраться сюда..."
      - "А теперь они просто остановились."
      - "Может быть, они боятся встретиться со мной лицом к лицу. По крайней мере, я на это надеюсь."
      - "Кто бы вы ни были, где бы вы ни находились..."
      - "Я найду вас и уничтожу за то, что вы открыли охоту на Командира и встали между нами!"
  - text:
      - "Светящиеся синие фрагменты пронеслись в воздухе, освещая огромное внутреннее пространство корабля."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "......"
      - "70% материи, свернутой пространственным возмущением, материализовалось, разделившись между двумя Зеркальными морями..."
      - "Похоже, я опоздала, но не СЛИШКОМ сильно."
      - "Командир пря-я-ямо... там."
      - "О? Уичита и Кимберли тоже здесь?"
      - "......"
      - "Планы меняются. Прервать процесс переработки и запустить перезапись. Инициировать план «Е»."
      - "Хелена, покидаю корабль."
