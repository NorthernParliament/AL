chapter1:
  rows:
  - text:
      - "Прошло 15 минут с тех пор, как Элизабет покинула поезд. Те из нас, кто остался, бездельничают в ожидании её возвращения."
      - "Ранее Мисс D закатила истерику, которая продлилась минут 5. Теперь она просто тихо сидит в углу."
      - "Тем временем некоторые из нас лениво смотрят в окна на таинственный город."
  - char: "brennus"
    side: "left"
    text:
      - "Построить такой великолепный город, просто представив его. Вы можете себе это вообразить?"
      - "Нам всем выпало благословение стать свидетелями этого."
  - char: "fleuret"
    side: "right"
    text:
      - "Раз уж мы здесь, нам надо сделать фотографию!"
      - "Подождите, дайте мне найти камеру..."
  - char: "alsace"
    side: "left"
    text:
      - "Если ты хочешь запечатлеть это для потомков, я уже сделала это и готовлюсь составить отчет для Кардинала."
  - char: "fleuret"
    side: "right"
    text:
      - "Нет, не для потомков! Для нас! Я говорю о том, чтобы сделать фотографию на память!"
  - char: "alsace"
    side: "left"
    text:
      - "У меня... есть вопросы о практической пользе этого действия."
  - char: "fleuret"
    side: "right"
    text:
      - "Это чтобы показывать другим людям и говорить: «Смотрите! Мы были здесь!»"
      - "Типа, мы единственные, кто когда-либо сюда придет. Они так обзавидуются, когда увидят на фотографии, как здесь красиво!"
  - char: "alsace"
    side: "left"
    text:
      - "Угу... Обороты мыслительного процессора стремительно возрастают..."
  - char: "epee"
    side: "right"
    text:
      - "Фл-Флёр, пожалуйста, не изводи её так..."
  - char: "fleuret"
    side: "left"
    text:
      - "Я говорю серьезно! Разве ты не хочешь показать фотку Тем и Опи и посмотреть на выражения их лиц?"
  - char: "epee"
    side: "right"
    text:
      - "Всё, чего я хочу, — это пойти домой и побыть одной."
  - char: "fleuret"
    side: "left"
    text:
      - "Ох. Ну ладненько."
  - char: "miss_d"
    side: "right"
    text:
      - "Бррррр..."
  - char: "fleuret"
    side: "left"
    text:
      - "Что случилось, Мисс D?"
  - text:
      - "Мисс D забилась в свой уголок и начала дрожать как лист."
  - char: "miss_d"
    side: "right"
    text:
      - "Холодно... Здесь так холодно! Вы разве не чувствуете? Просто ледник!"
  - char: "fleuret"
    side: "left"
    text:
      - "Эм... Не особо..."
  - char: "alsace"
    side: "right"
    text:
      - "Моя температура тела остается стабильной."
  - char: "epee"
    side: "left"
    text:
      - "Может, мне, эм, принести тебе одеяло?"
  - char: "miss_d"
    side: "right"
    text:
      - "Нет! Здесь нарушитель! Кто-то пробрался в поезд!"
      - "Потому и так холодно! У меня аж задница отмерзает!"
  - char: "mogador"
    side: "left"
    text:
      - "Да, я чувствую какой-то запах, и это не Командир..."
      - "Он гнилостный и сырой, вонь удручающей смерти..."
  - char: "alsace"
    side: "right"
    text:
      - "Моя обонятельная система ничего не улавливает. Может ли быть... что система неисправна?"
  - char: "mogador"
    side: "left"
    text:
      - "Наверное, это не совсем запах, скорее аура. Я долгое время работала судьей Трибунала, поэтому у меня развилось острое чутье на такие вещи."
  - char: "commander"
    side: "right"
    text:
      - "Разве Элизабет не говорила, что концептуальная защита поезда неприступна?"
      - "Хотя, если и ты, и Мисс D чувствуете, что что-то не так, не думаю, что это совпадение."
      - "Без паники, хорошо? Давайте первым делом свяжемся с Элизабет."
  - char: "miss_d"
    side: "left"
    text:
      - "Ассистент прав! Звоните ей!"

chapter2:
  rows:
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Мы всё перепроверили. Нет никаких признаков присутствия нарушителя."
  - char: "miss_d"
    side: "left"
    text:
      - "Нарушитель ЕСТЬ! И он подбирается всё ближе и ближе!"
      - "Он всего в одном вагоне от нас! Барьеры между нами бесполезны! Спаси-и-ите!"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Хорошо, мы доверяем твоей интуиции."
      - "Чего мы не понимаем, так это как этот нарушитель смог проникнуть внутрь, не оставив по пути ни единого следа..."
      - "Неважно. Соберите всех в одном вагоне, и мы сейчас же будем там."
      - "Кстати, мы опознали вторую группу, прибывшую сюда. Одна из них — Арбитр Дьявол XIV. Ты наверняка всё о ней знаешь."
      - "Другая, судя по всему, МЕТА. Мы пока не выяснили, кто именно."
      - "Держитесь. Мы идем."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Дьявол? И её сопровождает МЕТА?)"
      - "(Это действительно плохие новости. Нам нужно занять оборонительную позицию...)"
  - char: "mogador"
    side: "right"
    text:
      - "Хм? Командир, хочешь, чтобы мы подготовили оборону?"
  - char: "commander"
    side: "left"
    text:
      - "Да. Ты ведь чувствуешь по запаху, откуда приближается нарушитель, верно?"
  - char: "mogador"
    side: "right"
    text:
      - "Ещё как!"
  - text:
      - "Могадор указывает на дверь, ведущую в следующий вагон."
  - char: "mogador"
    side: "right"
    text:
      - "Я дума-а-аю, лучшей стратегией будет, если я, Эльзас и Бреннус перейдем в следующий вагон и перехватим нарушителя, пока остальные останутся здесь."
  - char: "commander"
    side: "left"
    text:
      - "(С одной стороны, это разделит наши силы. С другой — даст им больше пространства для боя и гарантирует нам путь к отступлению.)"
      - "Так и поступим. Все остальные, смотрите в оба и ждите появления врага!"
