chapter1:
  rows:
  - text:
      - "Посреди бушующего шторма флот, известный как «Факел», направляется к острову Самос."
  - char: "hornet"
    side: "left"
    text:
      - "Блин. Еще совсем недавно светило солнце. Почему на нас обязательно должен был пролиться дождь?"
      - "Клянусь, погода вокруг острова Самос такая изменчивая."
  - char: "bearn"
    side: "right"
    text:
      - "Аномальная погода и состояние моря здесь — это побочные эффекты исследований Демона Лапласа."
      - "Иногда люди даже сообщают о том, что видели призраков и монстров."
  - char: "ark_royal"
    side: "left"
    text:
      - "Всё настолько плохо? Это немного жутковато..."
  - char: "kasumi"
    side: "right"
    text:
      - "Касуми хочет их увидеть."
  - char: "takao"
    side: "left"
    text:
      - "С тобой мы вполне можем встретить парочку призраков."
      - "Я бы сказала, что у этого шторма есть и своя светлая сторона. Он помогает нам скрывать наши маневры."
  - char: "yorktown"
    side: "right"
    text:
      - "Начальство возлагает слишком много надежд на Демона Лапласа. Они взяли и спровоцировали кризис только потому, что он «почти готов»."
      - "И ради чего? Потому что они думают, что если дело дойдет до полномасштабной войны, они смогут победить, и всё остальное не будет иметь значения? Как будто всё так просто."
  - char: "hiryuu"
    side: "left"
    text:
      - "Они не единственные сумасшедшие. Революционный фронт выступил в полную силу только ради того, чтобы украсть незаконченную машину."
  - char: "memphis"
    side: "right"
    text:
      - "Не могу сказать, что не сочувствую им. Если бы они дождались его завершения и всё пошло бы так, как хочет Федерация, было бы уже слишком поздно."
  - char: "hiryuu"
    side: "left"
    text:
      - "А ведь ты права!"
  - char: "enterprise"
    side: "right"
    text:
      - "«Демон Лапласа должен служить всему человечеству. Не как орудие войны и не как спусковой крючок, который приведет к уничтожению человечества»."
      - "Мы должны их остановить."
  - char: "la_galissonniere"
    side: "left"
    text:
      - "Конечно! На самом деле, почему бы нам не пойти еще дальше?"
      - "Благодаря д-ру Анзил мы уже знаем её местоположение и состояние оборонительных систем вокруг неё."
      - "Почему бы нам не спасти её, раз уж мы здесь?"
  - char: "marseillaise"
    side: "right"
    text:
      - "Спасти её — это одно. Но что будет потом? Она действительно сбежит с нами?"
  - char: "bearn"
    side: "left"
    text:
      - "В этом не будет необходимости. У д-ра Анзил наверняка есть план."
  - char: "hornet"
    side: "right"
    text:
      - "Ага! Даже когда её посадили за решетку, она сказала нам не приходить ей на помощь. Сейчас она всего лишь под домашним арестом, так что нам не нужно лезть из кожи вон."
  - char: "yorktown"
    side: "left"
    text:
      - "Кроме того, чем больше шума мы здесь наведем, тем опаснее станет ситуация для д-ра Анзил и людей, запертых вместе с ней."
  - char: "la_galissonniere"
    side: "right"
    text:
      - "Ох... Виновата!"
  - char: "kimberly"
    side: "left"
    text:
      - "......"
  - char: "helena"
    side: "right"
    text:
      - "Энтерпрайз, Революционный фронт выдвинул ультиматум острову Самос."
      - "Флот Федерации, сформированный для засады, также прибыл на заданные координаты."
  - char: "enterprise"
    side: "left"
    text:
      - "...Похоже, нам пора действовать."
      - "Уичита, в чем проблема? Ты сегодня на удивление тихая... Нервничаешь, что ли?"
  - char: "wichita"
    side: "right"
    text:
      - "Я..."
      - "Аха-ха, не-а, просто много мыслей в голове. Я снова пойду в разведку вместе с Кимберли, попытаюсь привести мысли в порядок."
  - char: "enterprise"
    side: "left"
    text:
      - "Хорошо. Не отдаляйтесь слишком далеко от главных сил."
  - char: "wichita"
    side: "right"
    text:
      - "Ой, да ладно. Не беспокойся за меня!"

chapter2:
  rows:
  - char: "wichita"
    side: "right"
    text:
      - "...Здесь нас никто не должен услышать."

chapter3:
  rows:
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Начало конца... Не думала, что нас вернут в этот день."
  - char: "kimberly_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я точно знаю, что это новое пространство, воплощенное Мартириумом."
      - "Но почему сегодня? Почему оно воплотило именно это?"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Должно быть, наша концепция смерти примешалась к формуле, когда мы вошли."
      - "Нет, если пойти еще дальше, возможно, наша концепция смерти настолько сильна, что вытеснила восприятие руин Ирис таймлайном бета..."
      - "Хех. Значит, мы умерли сегодня, да? Ха-ха-ха-ха!"
  - char: "kimberly_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Уичита."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "А, прости. Это была шутка."
      - "Ты можешь отследить эту Хатакадзе META?"
  - char: "kimberly_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Она в этом пространстве, но я не могу отследить её точные координаты. Должно быть, она прячется."
      - "Но нет никаких сомнений, что это пространство подверглось коррозии. И РФ, и Федерация — сплошь коррозийные сущности."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ага. Так вот в чем был смысл всего этого трюка с самоубийством."
  - char: "kimberly_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Уичита, ты помнишь тот день? Коррозийные явления появились и тогда тоже."
      - "Мы ничего не знали, поэтому просто называли их черными торнадо."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Если мы сможем узнать то, что упустили тогда, возможно, мы сумеем докопаться до новой правды в этих зафиксированных воспоминаниях."
      - "Это огромная возможность."
      - "Хех. Мы не можем изменить то, что произошло на самом деле, но как насчет того, чтобы исправить ошибки прошлого в наших воспоминаниях?"
      - "Если бы мы поступили иначе, сделали лучший выбор тогда..."
      - "Смогли бы мы построить лучшее будущее?"
  - char: "kimberly_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Сейчас это уже никак не узнать, но я определенно не хочу видеть эту трагедию во второй раз."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Согласна. Давай постараемся не допустить этого."
