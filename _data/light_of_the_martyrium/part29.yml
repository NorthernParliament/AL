chapter1:
  rows:
  - char: "alsace"
    side: "left"
    text:
      - "Я сейчас обеспечу путь к кристаллу!"
  - text:
      - "БАБАХ!!!"
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Дальше ты не пройдешь, дитя."
  - char: "mogador"
    side: "left"
    text:
      - "Хатакадзэ META..."
  - char: "alsace"
    side: "right"
    text:
      - "Командир, Хатакадзэ обнаружена! Запрашиваю приказы!"
  - char: "commander"
    side: "left"
    text:
      - "Значит, это действительно центр управления. Родни нейтрализована! Самое время тебе сдаться!"
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Хе-хе, хе-хе-хе... Ты не перестаешь удивлять."
      - "Но ты, кажется, кое-что забыл. Контроль над Мартириумом всё еще в моих руках."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Неужели?"

chapter2:
  rows:
  - text:
      - "После вспышки ослепительного света  появляется еще одно сооружение — врата Камелота."
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Что?.."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Наш поезд всё еще припаркован в Камелоте. Зеркальное Море или нет, неужели ты думала, что один-единственный вагон может содержать больше информации, чем весь поезд?"
      - "Мы не решались использовать этот метод лишь потому, что хотели избежать повреждения поезда."
      - "Ты явилась лично, а наш слуга уже очистил коррозию Зеркального Моря."
      - "И как же, скажи на милость, ты рассчитываешь контролировать это место?"

chapter3:
  rows:
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "«На этой славной небесной орбите есть только один поезд». Убирайся из нашего поезда!"

chapter4:
  rows:
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Кх!.."

chapter5:
  rows:
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Тестовый полигон бета... Я этого не забуду!"

chapter6:
  rows:
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Допустить такую ошибку на последнем шаге..."
      - "Я признаю поражение. Но будьте уверены, вы не победили!"

chapter7:
  rows:
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты сказала достаточно, крыса!"
      - "А теперь, после небольшой уборки, эта проблема с коррозией исчезнет без следа!"

chapter8:
  rows:
  - text:
      - "Святая статуя в центре Мартириума вновь расправляет крылья."
      - "На этот раз кристалл излучает святой свет, который озаряет город."
      - "Под действием силы Ирис комплекс лишается источника коррозии и обращается в пепел. Вскоре Зеркальное Море полностью очищается."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Фух... Идеально."
      - "Осталось только вернуть кита..."
  - char: "whale"
    side: "right"
    text:
      - "......"
  - char: "miss_d"
    side: "left"
    text:
      - "Это мой кит зовет!"
      - "А-а-а-а! Кит! Мой кит снова убегает!"
  - text:
      - "Оглушительный рев сопровождает подъем кита в небо над Мартириумом."
  - char: "alsace"
    side: "left"
    text:
      - "Тень Смерти повержена. Если Мисс D не контролирует кита, то кто же тогда..."
  - char: "commander"
    side: "right"
    text:
      - "Проклятье! Дьявол?!"
      - "Она пряталась всё это время только для того, чтобы заставить нас сражаться с Хатакадзэ и украсть кита в последнюю минуту?!"
      - "Она обвела нас вокруг пальца!"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Всё такая же хитрая... Нас тоже одурачила."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Тоже. Мне жаль..."
  - char: "miss_d"
    side: "left"
    text:
      - "Ну уж нет! Сейчас не время для извинений!"
      - "Время кита! В погоню за кито-о-ом!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Подожди! Сначала нам нужно вернуть вагон поезда!"
  - char: "miss_d"
    side: "left"
    text:
      - "К черту этот поезд! Кит, кит, кит!"
      - "КИ-И-И-ИТ!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Угх... Ладно!"
  - char: "commander"
    side: "left"
    text:
      - "Давайте сначала вернемся на «Свет Королевы»."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Подожди. Я не могу отпустить тебя, Командир."
  - char: "commander"
    side: "left"
    text:
      - "Хелена?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Согласны. Эта погоня чревата опасностями. Это не входило в изначальный план."
      - "Командир, возвращайся вместе с флотом Ириса. Будьте осторожны по пути — вы находитесь на поле боя, пока не доберетесь до дома."
  - text:
      - "Элизабет отмахивается от меня, прежде чем я успеваю что-либо сказать. Затем она всовывает мне в руки небольшую брошюру."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Руководство по эксплуатации врат Камелота. Используй по назначению, и ты без проблем доберешься до полигона бета."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "В этом нет необходимости. Я сама могу научить Командира."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "И зачем тебе с нами об этом спорить... Ладно. Делай как знаешь."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "......"
      - "Мартириум нельзя оставлять в таком состоянии."
      - "Столь масштабное событие пространственного удара в скором времени привлечет другие фракции. Мы должны уничтожить все его следы, пока еще можем."
      - "...Я превращу это Зеркальное Море обратно в вагоны поезда и доставлю их на тестовый полигон бета."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Весьма признательны. Оставляем это в твоих руках."
  - char: "miss_d"
    side: "left"
    text:
      - "Пока, таинственный ассистент! Увидимся позже!"

chapter9:
  rows:
  - text:
      - "Пока «Свет Королевы» исчезал — на несколько вагонов меньше, чем в момент прибытия, — Пепел тоже готовился к отбытию."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Та воссозданная Родни META больше не представляет угрозы."
      - "Сомневаюсь, что она пойдет с нами. Не возражаешь, если мы оставим её с тобой, Хелена?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Нисколько. Вы двое уже уходите?"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Да. Охота на Арбитров — не наша работа."
      - "Мы подтвердили причину события пространственного удара, так что нам самое время возвращаться домой."
      - "...Было приятно сражаться бок о бок с тобой. Ты всё такая же надежная, Хелена."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Понятия не имею, о чем ты."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Аха-ха-ха-ха! Полагаю, тогда нам ничего не остается, кроме как попрощаться!"
      - "Надеюсь, мы еще встретимся, Хелена."
      - "И, боже, как же я надеюсь больше никогда не сталкиваться с вами, ребята с тестового полигона бета."
  - char: "commander"
    side: "right"
    text:
      - "Боюсь, я не могу дать никаких гарантий на этот счет."
      - "Это была честь. Передавай от меня привет Фридрих."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Передам."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Командир, отведи этих девочек обратно в Камелот. Я пойду следом за вами."
