chapter1:
  rows:
  - char: "strength"
    side: "left"
    text:
      - "Мы прибыли на заданную точку, хотя и отстаем от графика на 14 часов 13 минут."
      - "«Пепел» оказался более стойким, чем ожидалось. Вероятно, они тоже направили сюда своих."
      - "По пути мы также столкнулись с аномальным типом глушения связи."
      - "Если бы не этот удар, мы бы прибыли раньше."
      - "Кто, черт возьми, пытался нас остановить?"
  - char: "temperance"
    side: "right"
    text:
      - "Неизвестно. В базе данных не найдено совпадений по характеристикам."
  - char: "strength"
    side: "left"
    text:
      - "Значит, это новый враг, которого мы никогда не регистрировали ни на одном из наших тестовых полигонов, да."
      - "Скажем так, я заинтригована."
  - char: "hermit"
    side: "right"
    text:
      - "Умеренность, каковы наши шансы извлечь хоть какие-то данные из пустоты?"
  - char: "temperance"
    side: "left"
    text:
      - "Поиск. Анализ. Никаких."
      - "Эта область была вычищена подчистую. Агент, ответственный за это, обладает выдающимися навыками."
      - "Даже я не обладаю способностью провести зачистку, не оставив ни единого следа."
      - "Единственные известные агенты, потенциально способные на такое — Башня и Фокусник."
  - char: "hermit"
    side: "right"
    text:
      - "Они не ответили на наш запрос о подкреплении. Никто из них никак не мог быть здесь."
  - char: "temperance"
    side: "left"
    text:
      - "Тогда это должен быть агент, равный им по навыкам."
      - "Здесь попросту ничего нет."
      - "Определить причину и источник события пространственного удара невозможно."
      - "Миссия провалена. Приступаем к первой задаче в списке миссий после отправки отчета о результатах операции."
  - char: "hermit"
    side: "right"
    text:
      - "Отправляю отчет прямо сейчас."
      - "...Эй, я только что получила срочное сообщение от Императрицы."
  - char: "strength"
    side: "left"
    text:
      - "«Риск выхода тестового полигона бета из-под контроля... Запрашиваю Арбитров для проведения мер по усмирению»?"
      - "Что она тоже забыла на тестовом полигоне бета?"
  - char: "temperance"
    side: "right"
    text:
      - "Это особый полигон."
      - "В частности, из-за сущности, известной как «Командир»."
      - "Полномасштабная атака — не вариант; как и отсутствие атаки вообще. Какая докучливая дилемма."
      - "Запрашиваю разрешение присоединиться к Влюбленные на линии обороны."
  - char: "hermit"
    side: "left"
    text:
      - "Что ж, Императрица не высекла наши назначения в камне, так что если хочешь отправиться туда — сейчас самое время."
      - "Мэээх... Возвращаемся на тестовый полигон бета."
