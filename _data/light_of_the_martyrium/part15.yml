chapter1:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Я снова здесь..."
  - text:
      - "Я взял Мисс D за руку, и меня снова перенесло в пустоту."
      - "Она бесконечно простирается во всех направлениях. Время и ориентиры здесь ничего не значат."
      - "Однако, в отличие от прошлого раза, мое сознание у меня не отнимают. Кажется, будто я нахожусь в защитном пузыре, который скорее усиливает мое восприятие окружения, чем ослабляет его."
      - "Это обостренное восприятие позволяет мне обнаружить кое-что среди небытия."
  - char: "rorodney_meta???d"
    side: "right"
    status: "is-lightgray"
    text:
      - "Принимать смерть, одну за другой... Это то, что вы выбрали?"
      - "Значит, «я» сделала правильный выбор."
  - text:
      - "Женский голос, лишенный эмоций. Близкий, но в то же время далекий, приближающийся, но отдаляющийся."
      - "Кто-то говорит со мной сквозь тьму."
  - char: "rorodney_meta???d"
    side: "right"
    status: "is-lightgray"
    text:
      - "Жизнь рождается из небытия, и в небытие смерть её возвращает."
      - "Забвение — это ответ на всё."
      - "С вашей стороны было бы разумно принять свою кончину."
      - "Это лучше, чем тщетно сражаться где-то между началом и концом."
  - char: "commander"
    side: "left"
    text:
      - "(Она не может быть далеко, но я понятия не имею, где она.)"
      - "(Всё, что я знаю — она наблюдает за нами... Наблюдает за Мартириумом.)"
      - "(Кто она? И что это за место?)"
  - char: "miss_d???d"
    side: "right"
    status: "is-purple"
    text:
      - "Правда?"
      - "А что, если смерть не означает возвращения в небытие?"
  - char: "commander"
    side: "left"
    text:
      - "(Это... Мисс D? Её голос почему-то звучит старше.)"
  - char: "rorodney_meta???d"
    side: "right"
    status: "is-lightgray"
    text:
      - "Что?.."
      - "Ты слышишь «мой» голос?"
      - "Кто ты?"

chapter2:
  rows:
  - char: "miss_d"
    side: "left"
    text:
      - "Ммгх...! Нет, кто ТЫ такая? Что ты делаешь с ассистентом?!"
  - char: "rorodney_meta???d"
    side: "right"
    status: "is-lightgray"
    text:
      - "«Ассистент»?"
  - char: "miss_d"
    side: "left"
    text:
      - "Ты всё слышала! Ассистент, почему ты ОПЯТЬ здесь? Говорю же тебе, тебя РАЗОРВЕТ на части!"
  - text:
      - "Мисс D указывает туда, где нахожусь я. Это наконец-то обращает внимание собеседницы на мое присутствие."
  - char: "rorodney_meta???d"
    side: "right"
    status: "is-lightgray"
    text:
      - "Здесь есть... кто-то еще?"

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Привет."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ты... Родни?"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Я не пытался подслушивать, клянусь."

chapter6:
  rows:
  - char: "rorodney_meta???d"
    side: "right"
    status: "is-lightgray"
    text:
      - "......"
      - "Кто вы такие? Зачем вы сюда пришли?"
  - char: "commander"
    side: "left"
    text:
      - "Короче говоря..."
  - char: "miss_d"
    side: "right"
    text:
      - "А ну заткнись! Нет времени на разговоры!"
      - "Не заставляй меня повторять, насколько опасно это место! Пошли!"
      - "И ты, кто бы ты ни была! Ты идешь с нами?"
  - char: "rorodney_meta???d"
    side: "left"
    status: "is-lightgray"
    text:
      - "«Я»?"
      - "Нет, боюсь, «я» останусь здесь."
  - char: "miss_d"
    side: "right"
    text:
      - "В каком смысле «нет»? Тебе НРАВИТСЯ торчать в этом темном, унылом месте? Как знаешь, чудачка!"
      - "Ассистент, мы возвращаемся в Мартириум! Держись крепче и не потеряйся в третий раз!"
