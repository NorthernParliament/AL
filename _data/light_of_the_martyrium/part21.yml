chapter1:
  rows:
  - text:
      - "Свет снова окрашивает мое зрение в белый. Сразу после этого я вижу ночную тьму."
      - "До моих ушей доносится рев двигателя. В нос ударяет тошнотворная смесь запахов дыма и смерти."
  - char: "commander"
    side: "left"
    text:
      - "(Это поле боя? Но я на... серийном корабле, не так ли?)"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "А-а-а-ай! Откуда ты, черт возьми, взялся?!"
  - char: "commander"
    side: "left"
    text:
      - "Элизабет? Разве ты не была на «Свете Королевы»?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "«Свете Королевы»?.. Бел! Немедленно схватите этого незнакомца!"
  - char: "belfast_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Поняла, Ваше Величество. *кхе*..."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Аргх, ладно! Просто сиди и отдыхай. Мы сами с этим разберемся!"
  - char: "commander"
    side: "left"
    text:
      - "(Все ведут себя странно...)"
      - "(Вообще-то, это может быть просто очередным воспоминанием, как остров Самос. И если Элизабет прямо у меня перед глазами...)"
      - "(...Мой коммуникатор всё равно не может связаться с Элизабет в поезде. Полагаю, здесь может находиться только одна Элизабет одновременно.)"
      - "(Белфаст ранена. Ситуация не очень-то обнадеживающая.)"
  - char: "rodney_rad"
    side: "right"
    text:
      - "Ваше Величество, флот X заблокировал нам путь к отступлению."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Какие силы и сколько их?"
  - char: "rodney_rad"
    side: "right"
    text:
      - "Зверь-мимик V класса, более тысячи сущностей-мимиков и векторная зона в пять квадратных морских миль."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мы с трудом справляемся с одним лишь V классом? Гах, если бы только наш флот был в лучшем состоянии..."
      - "Проложите курс в обход. Мы намерены избежать ненужного боя."
  - char: "rodney_rad"
    side: "right"
    text:
      - "Да, Ваше Величество."
  - char: "bearn_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Ваше Величество. Враги наступают со всех сторон. У нас нет времени на обходные маневры."
      - "Я могу в одиночку справиться со зверем-мимиком V класса. Учитывая потери, которые понес ваш флот, я бы предложила оставить его на меня."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Даже если мы сможем прорваться, потери будут колоссальными."
      - "План таков. Мы будем замыкать строй. Пока мы отвлекаем врага, остальные смогут пойти в обход и спастись."
  - char: "bearn_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Это такой завуалированный способ самоубийства?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Нет. Ответственность за это сокрушительное поражение лежит исключительно на наших плечах."
      - "Пожалуйста... Позвольте нам искупить свою вину."
  - char: "bearn_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "С вашего позволения, я думаю, вы просто пытаетесь сбежать. Ваша смерть никак не улучшит общую ситуацию."
      - "Но вы и сами это знаете, я уверена."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "......"
      - "У нас был флот из двухсот кораблей и сотни кансен. Теперь у нас осталось менее тридцати процентов..."
      - "На других фронтах этой битвы дела обстоят ненамного лучше..."
      - "Цк... Мы вложили столько времени и сил в сбор этих войск."
      - "Мы больше не хотим видеть ничьих смертей..."
  - char: "belfast_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Ваше Величество, это обречено на провал."
  - char: "nelson_rad"
    side: "right"
    text:
      - "Королевский Флот никогда вас не бросит."
      - "Простите, Ваше Величество, но мы не подчинимся этим приказам."
  - char: "mogador_rad"
    side: "left"
    status: "is-meta"
    text:
      - "*кхе* *кхе*"
      - "Эй, вы же не могли с точностью предсказать силу врага. Это не ваша вина..."
  - char: "alsace_rad"
    side: "right"
    text:
      - "Не сдавайтесь, Ваше Величество! Вы обещали, что мы вернемся домой вместе!"
  - char: "mogador_rad"
    side: "left"
    text:
      - "С такой численностью, думаю, мы сможем прорваться с потерями в тридцать процентов. Обходной путь мог бы выиграть нам время, но он также мог бы загнать нас еще дальше в угол..."
  - char: "vanguard_rad"
    side: "right"
    text:
      - "Королевский Флот остается и сражается."
      - "Какими бы ужасными ни были обстоятельства, мы должны встретить их вместе, Ваше Величество."
  - char: "rodney_rad"
    side: "left"
    text:
      - "Да. Давайте прорвем это окружение вместе!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "......"
  - char: "communicator"
    side: "left"
    text:
      - "БИП-БИП!"
  - text:
      - "Коммуникатор снова пищит — на этот раз не у Элизабет, а у меня."
  - char: "anzeel_rad"
    side: "left"
    text:
      - "Коман... Кхм. Ассистент, слава богу, я наконец-то до тебя дозвонилась."
  - char: "commander"
    side: "right"
    text:
      - "Д-р Анзил... верно?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты сказал, д-р Анзил?!"
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Э-Элизабет? Почему ты с моим ассистентом?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хм? Человек, свалившийся сюда из ниоткуда — твой АССИСТЕНТ?"
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Ага."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Мы примем это за правду. Анзил, как дела у Совета?"
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Здесь все в безопасности. Некоторые из потерянных флотов прибывают в точку сбора."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Какое облегчение..."
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Тебе тоже лучше поскорее тащить свою задницу сюда, ясно?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мы... как раз планируем наше отступление."
      - "Однако мы слишком сильно отдалились от союзников, так что шансы... не в нашу пользу."
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Элизабет, не сдавайся пока. Надежда прямо рядом с тобой."
      - "Могу я попросить тебя передать командование боем моему ассистенту?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Передать командование? Этому незнакомцу? Ты совсем из ума выжила?"
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Не волнуйся. Я уверена, что мой ассистент — Командир — приведет вас к победе."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Ладно, ладно, мы тебе верим. В любом случае, мы и так должны подчиняться твоим приказам."
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Отлично, Командир, задай им жару. Подкрепление уже в пути."
      - "Я жду, когда вы вернетесь к нам домой."
  - char: "commander"
    side: "left"
    text:
      - "Д-р Анзил? Погоди, ты..."
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Хм? Ты что-то сказал?"
  - char: "commander"
    side: "left"
    text:
      - "Не бери в голову. Будь осторожна."
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Обо мне не беспокойся. Мы в безопасном месте."
      - "И еще, не отходите далеко от парящих линкоров. И избегайте контакта с Икс любой ценой."
      - "Отключаюсь."
  - char: "commander"
    side: "left"
    text:
      - "(Хмм. Судя по тому, как эта Анзил разговаривает, кажется, я знаю, кто она на самом деле.)"
      - "(Значит, в этом воспоминании д-ра Анзил и меня изначально вообще не было.)"
      - "(А это значит, если мы продолжим в том же духе, нас ждут лишь смерть и разрушение...)"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Анзил возлагает на тебя ужасно большие надежды. Ну давай, покажи нам, на что ты способен."
  - char: "bearn_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Каким будет твой первый приказ, Командир?"
  - char: "commander"
    side: "right"
    text:
      - "Мне нужен отчет о повреждениях всех кораблей и информация о том, какое оружие, личный состав и ресурсы есть в нашем распоряжении."
      - "Тем временем все корабли, способные сражаться, направляются на первую линию обороны. Серийные корабли поставьте на вторую линию обороны. Мы займем жесткую оборону."
  - char: "bearn_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Жесткую оборону? Но боевые порядки полностью смешались. И мы не знаем, действительно ли подкрепление..."
  - char: "commander"
    side: "right"
    text:
      - "Анзил сказала, что подкрепление будет. Доверься ей."
      - "Сражайтесь, пока не угаснет последний луч света."
  - char: "bearn_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Да, Ваше Величество."

chapter2:
  rows:
  - text:
      - "Мои приказы основаны на интуиции, но все корабли тут же приходят в движение."
      - "С летающего линкора, о котором я читал только в отчетах Гуам, я смотрю на темное море."
      - "Вдалеке назревает сильный шторм."
      - "Под штормом море покрывает жидкость, излучающая жутковатое синее свечение."
      - "Бесчисленные сущности, кажется, шатаются, извиваются и толпятся на ней."
  - char: "commander"
    side: "left"
    text:
      - "Так вот он, враг альфа таймлайна... Тот, с кем мы будем вынуждены столкнуться в будущем нашего мира."
      - "Вы наконец-то показали себя... «Икс»."
