chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Эти так называемые «мимики» — Икс (X) — обладают поистине разнообразным набором характеристик."
      - "Их тела гибкие, но при этом прочные, что напоминает металлических слаймов из некоторых фэнтезийных произведений."
      - "Они могут поглощать удары за счет расширения, при этом сохраняя жесткость, позволяющую им переживать близкие взрывы. Интересно, что их внешний вид также варьируется в зависимости от категории."
      - "Соответственно, люди этого таймлайна распределили их по категориям в зависимости от внешнего вида и размера."
      - "Мелких называют «сущностями-мимиками», а более крупных — «зверями-мимиками», которые дополнительно делятся на классы в зависимости от их силы."
      - "Кроме того, область, которую они подвергают коррозии, называется «векторной зоной». Она поражает не только воду, но и воздух."
      - "Подозреваю, именно по этой причине парящие линкоры не поднимаются так уж высоко над поверхностью."
      - "Икс также способны «заражать» затопленные серийные корабли и восстанавливать их с пугающей скоростью."
      - "Можно с уверенностью предположить, что они способны делать всё это и на суше."
      - "Хоть они и являются очень могущественным противником, они не непобедимы. Их можно одолеть."
      - "Однако победа над крупными особями — та еще задача, поскольку при уничтожении они распадаются на более мелких Икс."
      - "Они теряют всякую связность, когда получают достаточно сильный урон, но затем сливаются с векторной зоной."
      - "Со временем векторная зона становится всё плотнее и плотнее, пока не позволит появиться новообразованным Икс."
  - char: "commander"
    side: "left"
    text:
      - "(Нет таких Икс, которых Уичита и Кимберли не могли бы разнести на куски... но также нет и таких Икс, которых они могли бы убить в каком-либо значимом смысле этого слова.)"
      - "(Как сражаться с врагом, которого невозможно убить?)"
  - text:
      - "БАБАХ!!!"
      - "Раздается взрыв, и парящий линкор содрогается. К счастью, щиты корабля остановили атаку."
      - "днако другому линкору, находившемуся неподалеку от моего, повезло меньше. Удар пробил защиту, вынудив его совершить аварийную посадку."
  - char: "miss_d"
    side: "left"
    text:
      - "Я что-то чувствую... Зверь-мимик IX класса?! Где он?!"
      - "Это очень, ОЧЕНЬ плохо! У этих двоих нет ни единого шанса против IX класса!"
      - "Всё кончено! Мы все обречены-ы-ы!"
  - text:
      - "Монитор поля боя показывает крупным планом векторную зону впереди, где бушует светящийся синий торнадо."
      - "Я щурюсь, и мне кажется, будто внутри него что-то парит."
  - char: "commander"
    side: "left"
    text:
      - "Это... глаз?"
  - char: "miss_d"
    side: "right"
    text:
      - "Ох, фух... Нам очень повезло. Эта штука не смогла напасть на нас исподтишка."
      - "Если бы оно ударило прямо по нам, это был бы конец игры!"
  - char: "commander"
    side: "left"
    text:
      - "Почему? Мы не можем умереть в этом месте, пока концепция «не поглотит нас». В чем здесь опасность?"
  - char: "miss_d"
    side: "right"
    text:
      - "То, что ты не можешь умереть, не значит, что опасности нет!"
      - "Есть и другие способы избавиться от кого-то, помимо простого убийства!"
      - "Видишь того Икс? Присмотрись и скажи мне вот что: ты правда думаешь, что это просто копия, созданная из воспоминаний?"
  - char: "commander"
    side: "left"
    text:
      - "Хочешь сказать, что нет?"
  - char: "miss_d"
    side: "right"
    text:
      - "Нет! Это как нельзя дальше от истины! Не бывает никаких «фальшивых» Икс!"
      - "Для этого пространства всё было кончено в тот момент, когда появилась эта штука!"
      - "Если Икс доберутся до тебя, ты исчезнешь навсегда! Теперь ты понимаешь?!"
      - "Не отвечай! Просто держись за меня, и я вытащу нас отсюда!"
  - char: "commander"
    side: "left"
    text:
      - "Я не собираюсь убегать. Пока сам не увижу, что его невозможно победить."
  - char: "miss_d"
    side: "right"
    text:
      - "Угх, ладно! Тогда я буду защищать тебя столько, сколько смогу!"
      - "Что будет не так уж долго, имей в виду!"
      - "Когда запахнет жареным, я вытащу тебя отсюда, нравится тебе это или нет!"

chapter2:
  rows:
  - text:
      - "БАБАХ!"
      - "Зверь-мимик бьет по нам раз. Затем еще раз. И еще раз. Каждый раз, когда он наносит удар по щитам корабля, тот содрогается так сильно, что я боюсь, как бы он не затонул."
  - char: "commander"
    side: "left"
    text:
      - "(Эта штука явно охотится именно за нами. Единственный плюс в том, что она такая одна. Остальные Икс нас игнорируют.)"
      - "(Она явно пытается разрушить нашу цепочку командования, что не произойдет без поддержки с ее стороны.)"
      - "(Откуда оно вообще узнало, что я здесь? И если оно нацелилось на тех, кто не является частью этого воспоминания, почему оно не охотится также за Мисс D и Пеплом?)"
      - "(Подождите... Вот оно что! Мы не являемся частью воспоминания, как и зверь-мимик!)"
      - "(Если вторжение Икс было кем-то вызвано, то, скорее всего, это были Хатакадзе META и Дьявол.)"
      - "(Нет, постойте... есть еще один человек.)"
  - char: "miss_d"
    side: "right"
    text:
      - "Ассистент! Мы больше не можем здесь оставаться!"
      - "Иди ко мне прямо сейчас, или тебя раздавят в лепешку!"
  - char: "commander"
    side: "left"
    text:
      - "Нет, я остаюсь. Мы собираемся победить зверя-мимика."
  - char: "miss_d"
    side: "right"
    text:
      - "Победить IX класс? И кто, по-твоему, это сделает? Я?"
      - "Без моего кита у нас нет ни единого шанса!"
      - "Береги-и-ись! Оно направляется прямо к нам! Хватит терять время, иди сюда!"
  - text:
      - "БАБАХ!!!"
  - char: "miss_d"
    side: "right"
    text:
      - "Черт! Я не успею!"
      - "Проклятье, ах ты глупый, глупый идиот! Если ты не хочешь уходить, тогда я буду с ним сражаться, ясно?!"
      - "Ты самый тупой кретин на свете, клянусь!"

chapter3:
  rows:
  - text:
      - "Мисс D спрыгивает с палубы, сразу после чего атака зверя-мимика пробивает щиты корабля."
      - "Атака, однако, не задела ни корабль, ни Мисс D."
      - "Она была в мгновении от того, чтобы поразить Мисс D, но затем исказилась и искривилась, прежде чем исчезнуть во вспышке света."
  - char: "rodney_meta_1"
    side: "left"
    status: "is-lightgray"
    text:
      - "...Упрямство погубило не одну душу."
  - char: "commander"
    side: "right"
    text:
      - "У меня было предчувствие, что ты здесь."
      - "Более того... ты создала это пространство, не так ли?"

chapter4:
  rows:
  - char: "rodney_meta_1"
    side: "left"
    status: "is-lightgray"
    text:
      - "Именно так."
      - "Почему ты был так уверен, что «я» спасу тебя?"
  - char: "commander"
    side: "right"
    text:
      - "Потому что именно так бы ты и поступила, Родни."
  - char: "rodney_meta_1"
    side: "left"
    status: "is-lightgray"
    text:
      - "......"
      - "«Я» — Родни; «мы» — Родни. Приветствую того, кто носит имя «Командир»."
      - "После долгих наблюдений и размышлений «я» сделала свой выбор."
      - "«Мы» выбираем не кончину, известную как забвение, а вместо этого выбираем увидеть твой конец."
      - "Пусть это иллюзорное место изменится по твоей воле."

chapter5:
  rows:
  - text:
      - "Меня охватывает чувство невесомости, и мой кругозор внезапно расширяется."
      - "Я вижу всё: поле боя, то, что на нем происходит, что реально, а что нет."
      - "Элизабет, Уичита и эскадра Эльзас сражаются изо всех сил."
      - "Более того, вдалеке, далеко от этого воспоминания, я вижу золотой храм."
      - "Вокруг него девочки из моего таймлайна держатся из последних сил."

chapter6:
  rows:
  - char: "epee"
    side: "left"
    text:
      - "П-попробуй-ка это!"
  - text:
      - "БАБАХ!!!"
  - char: "death_shadow"
    side: "right"
    status: "is-red"
    text:
      - "Зарядка Луча Смерти."
      - "Прогресс зарядки: 0%... 10%... 20%..."
  - char: "fleuret"
    side: "left"
    text:
      - "«Луч Смерти» звучит очень плохо! Во всех смыслах!"
  - char: "mogador"
    side: "right"
    text:
      - "Нам нужно прервать зарядку! Взять её!"
  - text:
      - "БАБАХ!!!"
  - char: "epee"
    side: "left"
    text:
      - "О-она снова уклонилась!"
  - char: "alsace"
    side: "right"
    text:
      - "Выполняю последующую атаку!"
  - char: "death_shadow"
    side: "left"
    status: "is-red"
    text:
      - "30%... 40%... 50%..."
  - char: "alsace"
    side: "right"
    text:
      - "Такая ловкость... Этот Антиох весьма изворотлив!"
  - char: "brennus"
    side: "left"
    text:
      - "Она атакует. Назад!"
  - text:
      - "БАБАХ!!!"
  - char: "brennus"
    side: "left"
    text:
      - "Она слишком сильна. Мы не можем надеяться победить её одними лишь своими силами."
  - char: "mogador"
    side: "right"
    text:
      - "Но мы потеряли связь с Мисс D и Командиром, а Тень Смерти не собирается отступать."
  - char: "fleuret"
    side: "left"
    text:
      - "Однако сбежать — тоже не вариант. Она просто бросится за нами в погоню."
      - "Какое невезение, она ведь наконец-то привела кита сюда... Что же нам делать?"
  - char: "alsace"
    side: "right"
    text:
      - "Странно... Я чувствую, что Командир наблюдает. Кто-нибудь еще это ощущает?"
  - char: "fleuret"
    side: "left"
    text:
      - "Наблюдает? О чем ты говоришь?"
      - "Я ничего не чувствую... Или, по крайней мере, мне так кажется?"
  - char: "alsace"
    side: "right"
    text:
      - "Я определенно это чувствую. Где-то далеко Командир наблюдает за нами."
      - "Командир! Мы здесь!"

chapter7:
  rows:
  - text:
      - "Посреди золотого света Эльзас протягивает ко мне руку."

chapter8:
  rows:
  - text:
      - "Подсознательно я протягиваю свою в ответ, пытаясь дотянуться до неё сквозь огромное расстояние."
      - "Прежде чем наши руки успевают соприкоснуться, охватившее меня чувство невесомости полностью исчезает."
      - "Гравитация возвращает мой разум на землю и снова сужает поле зрения."
      - "В следующее мгновение я понимаю, что снова нахожусь на палубе парящего линкора."
      - "И каким-то образом я осознаю, что этот пропитанный отчаянием участок океана изменился."

chapter9:
  rows:
  - char: "fleuret"
    side: "left"
    status: "is-sea"
    text:
      - "...А? Где мы? Нас что, только что сюда телепортировало?"
  - char: "mogador"
    side: "right"
    status: "is-sea"
    text:
      - "Кажется, мы стряхнули с хвоста Тень Смерти.  Погодите..."
      - "Я что, чую коррозию? И это один из тех парящих линкоров, о которых говорил Командир?"
      - "Угх... Блин, мне вдруг стало очень не по себе."
  - char: "fleuret"
    side: "left"
    status: "is-sea"
    text:
      - "Да... У меня такое чувство, будто я вот-вот расплачусь."
  - char: "brennus"
    side: "right"
    status: "is-sea"
    text:
      - "В моем сердце тоже грусть и гнев... Это воспоминание вложило в нас эти чувства?"
  - char: "epee"
    side: "left"
    status: "is-sea"
    text:
      - "Хнык..."
  - char: "alsace"
    side: "right"
    status: "is-sea"
    text:
      - "Я... Я сбита с толку, но я слышу, как чувства в моем сердце кричат, вырываясь наружу."
      - "Я знаю, что нужно сделать. Мне нужно высвободить их все!"
  - char: "bearn_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Эльзас? Могадор? Я думала, вы получили критические повреждения."
      - "Как вы восстановились? И почему вы светитесь?"
  - char: "alsace"
    side: "right"
    status: "is-sea"
    text:
      - "Всё в порядке, Беарн. Теперь я всё понимаю."
      - "Я — линкор Эльзас: Таинство Объединенной Ортодоксии, недосягаемая мечта и защитница Святого Престола!"
      - "Я вернулась, чтобы свершить святой суд над злом!"

chapter10:
  rows:
  - char: "renown_meta"
    side: "left"
    status: "is-meta"
    text:
      - "*кхе-кхе*... Рипалс, ты в порядке?"
  - char: "repulse_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я вышла за пределы своих возможностей, но, на удивление, я в порядке... *кхе-кхе*..."
  - char: "renown_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Маяк всё еще передает сигнал SOS. Её Величество всё еще сражается."
      - "Как думаешь, сможешь продержаться еще немного?"
  - char: "repulse_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Конечно, смогу! Но нам нужно поторопиться!"
      - "Её Величество ждет нас. Мы ТОЧНО успеем вовремя!"
