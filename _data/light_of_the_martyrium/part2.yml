chapter1:
  rows:
  - text:
      - "Мы сели в поезд и отправились в путь, мчась по невидимым рельсам сквозь небеса."
      - "Проходит какое-то время, и мы наконец прибываем к Зеркальному морю в Скапа-Флоу."

chapter2:
  rows:
  - text:
      - "Двери поезда открываются, и поток ослепительного золотого света заливает мой взор."
      - "Часы показывают раннее утро, и всё же это Зеркальное море купается в лучах полуденного света."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Добро пожаловать к Вратам Авалона, слуга."
      - "Искусственная Сингулярность и точка перехода между ветвями — впечатляет, не так ли?"
  - text:
      - "Это место — некогда бывшее простым Зеркальным морем — превратилось во врата между мирами с тех пор, как Королевский Флот захватил его."
      - "Я узнал о нём после того, как Элизабет прислала мне подробную документацию после поражения Компилятора."
      - "И всё же, читать о чем-то и видеть это воочию — две совершенно разные вещи. Это поистине внушающее трепет сооружение."
  - char: "queen_elizabeth_meta???"
    side: "left"
    status: "is-meta"
    text:
      - "Хи-хи. Как раз та реакция, на которую она надеялась."
  - char: "commander"
    side: "right"
    text:
      - "«Она»?"
  - char: "queen_elizabeth_meta???"
    side: "left"
    status: "is-meta"
    text:
      - "Да, твоя Элизабет. Она хотела произвести на тебя впечатление во время твоего первого визита сюда, поэтому выкрутила освещение на максимум."
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Эй! Ты не должна была этого говорить!"
  - char: "queen_elizabeth_meta???"
    side: "left"
    status: "is-meta"
    text:
      - "Чего не говорить? Правду?"
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Пф! Да, я усилила освещение, но только для того, чтобы лишний раз подчеркнуть важность этой операции."
      - "Ох, слуга, не думаю, что вы встречались раньше."
      - "Это Куин Элизабет. МЕТА, как ты мог догадаться."
      - "Она является лидером своей организации и в настоящее время находится здесь в качестве моего подкрепления."
      - "Кроме того, она познакомила меня с Мисс  D и пригнала тот поезд, на котором ты приехал."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Приветствую, слуг... Командир. Мы наблюдали за тобой с места машиниста."
  - char: "commander"
    side: "right"
    text:
      - "«Мы»? Вы обе вели поезд?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Нет. Мы имеем в виду королевскую особу, к которой ты сейчас обращаешься. Мы единственные, кто способен управлять «Светом Королевы», поэтому нам пришлось отправиться и забрать тебя лично."
      - "Как бы нам ни хотелось представиться более подробно, помимо того, что только что сказала твоя Элизабет, сейчас просто не время."
      - "А теперь о наших наблюдениях... Мы пришли к выводу, что ты находишься в схожем состоянии с Мисс D."
      - "Если говорить кратко, ты не целостен."
  - char: "commander"
    side: "right"
    text:
      - "Что это значит?"
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Такая формулировка ничего не объясняет. Подойди, слуга. Садись."
      - "Я знаю, у тебя есть вопросы. Ришелье наверняка обещала, что я объясню всё, что тебе следует знать, прежде чем ты на что-либо согласишься."
      - "То, что я собираюсь тебе рассказать, совершенно секретно. Независимо от того, согласишься ты помочь или нет, командование не должно услышать об этом ни слова. Ты понимаешь?"
  - char: "commander"
    side: "right"
    text:
      - "Конечно."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Хорошо. Я просто хотела внести полную ясность."
      - "Прежде чем мы продолжим, позволь мне напомнить тебе информацию, которой мы делились ранее."
      - "Во-первых, враги, которых мы называем Сиренами — это искусственные создания из будущего, чье истинное имя «Антиох»."
      - "Технически, это ANTI-X, что полностью расшифровывается как «Искусственный Военно-Морской Трансформационный Интеллект, Класс X»."
      - "Их имя говорит о том, что они являются искусственным оружием, созданным для борьбы с «X», но до сих пор неясно, что именно представляет собой этот «X»."
      - "Всё, что мы знаем — это то, что эта великая угроза существует, и в настоящее время ни у Антиоха, ни у Пепла нет никаких фундаментальных средств противодействия ей."
      - "Во-вторых, Сирены проводят эксперименты во многих ветвях, включая нашу, предназначенные для противодействия «X»."
      - "Технологии, которыми они обладают, позволяют им не только управлять этими экспериментальными ветвями по своему усмотрению, но и избавляться от них, если они того пожелают."
      - "Чем бы ни был этот враг «X», это не делает Сирен меньшей экзистенциальной угрозой для нас, и мы всё равно должны уничтожить их."
      - "Но в этом-то и кроется проблема. Даже если мы победим Сирен и изгоним их силу из нашего мира, что нам делать с этой нависшей угрозой?"
      - "Если мы не знаем, как с ней бороться, наша участь будет такой же, как если бы Сирены уничтожили нас всех."
      - "Поэтому я придумала план."
      - "Да, всё верно. Наверняка по пути сюда ты заметил, что Мисс D на самом деле Сирена."
      - "Мое META-воплощение, находящееся здесь, пришло к выводу, что она, по всей вероятности, является одной из высокоуровневых программ Антиоха, несмотря на её детское поведение."
      - "Очевидно, ей не хватает её оснастки — «кита», как она её называет. Её отсутствие повредило её память и ограничило её вычислительные ресурсы."
      - "Другими словами, она не целостна."
      - "Только подумай, что мы сможем получить, если снова вернём ей целостность. Данные об «X», записи битв против него, возможно, даже способ остановить его вторжение."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Верно. С тех пор, как мы нашли Мисс D, мы отправляли свои силы, чтобы попытаться поймать этого кита."
      - "Пока что безуспешно, хотя в последнюю нашу попытку мы подобрались к нему очень близко."
      - "Несколько дней назад Мисс D снова взяла след кита, и мы готовились возобновить на него охоту."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Видишь ли, она берет след кита лишь периодически."
      - "А теперь я объясню, зачем нам твоя помощь."
      - "Кит, которого хочет поймать Мисс D, находится в месте, где произошло пространственное возмущение."
      - "И я, и моя META-копия верим, что кита тянет к подобным явлениям."
      - "Эти пространственные возмущения часто происходят там, где ведутся сражения. От тебя нам нужен твой тактический опыт, чтобы застать врага врасплох. Это значительно повысит наши шансы на успех."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "И еще одна деталь — эти пространственные явления также часто наблюдаются во время экспериментов с Кубами Мудрости."
      - "Мы верим, что твоя исключительно высокая совместимость с Кубами позволит тебе справиться с любыми непредвиденными поворотами во время операции."
      - "О, а еще Мисс D подняла из-за тебя огромную шумиху. Она настаивает на том, чтобы ты помог нам."
      - "Да, она может выглядеть и вести себя как ребенок, но она всё еще Сирена. Её интуиция на голову превосходит нашу."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Она также очень хорошо знакома со всеми теми терминами, которых ты нахватался в Линзе Реальности."
      - "Даже если мои расспросы пока не принесли от неё никакой полезной информации..."
      - "Как бы то ни было, уже установлено, что события будущего приведут к зарождению Пепла и Антиоха."
      - "Кстати об этом, мы узнали, что Сирены называют это конкретное будущее «Альфа таймлайном»."
      - "Поскольку все они связаны, изучение альфа таймлайна даст нам больше знаний о Сиренах и «X»..."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Не смотри на нас так. Мы не из альфа таймлайна."
      - "Все встреченные нами, кто, похоже, родом из альфа таймлайна, держат язык за зубами о ветви, из которой они прибыли."
      - "Либо они не хотят об этом говорить, либо потеряли свои воспоминания о том времени."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Как в случае с Ринаун и Рипалс, которых мы нашли с помощью наших врат."
      - "Иногда их рассказы об одном и том же событии противоречат друг другу, и они даже не осознают этого, пока я им не укажу."
      - "Это делает практически невозможным проверить хоть что-то об альфа таймлайне."
      - "Но ты, мой слуга, другое дело. Совершенно ясно, что Мисс D пыталась тебе что-то рассказать."
      - "Я почти уверена, что ты продвинешься в своем собственном расследовании, если мы успешно поймаем этого кита."
  - text:
      - "Этот шквал новой информации от двух Элизабет повергает меня в шок."
  - char: "commander"
    side: "left"
    text:
      - "(Я И ЕСТЬ тот человек, который лучше всего подходит для расследования альфа таймлайна, который я видел в Линзе Реальности...)"
      - "(Анзил и Аосте — оба из того таймлайна. Есть большая вероятность, что «Серебряная Лиса», о которой я слышал, тоже оттуда.)"
      - "(Черт возьми, возможно, и я тоже. Неважно, были они симуляциями, созданными из воспоминаний, или нет, они явно знали, кто я.)"
      - "(Может быть, я действительно потерял часть своих воспоминаний, прямо как эти МЕТА...)"

chapter3:
  rows:
  - char: "anzeel_rec_d"
    side: "right"
    status: "is-purple"
    text:
      - "Что ж, похоже, ты наконец-то начал собирать воедино головоломку корпусов кансен."
      - "Совпадение с моими записями составляет менее 1%, но эта длина волны точно принадлежит тебе."
      - "Тот факт, что ты воспроизводишь эту запись, является абсолютным доказательством того, что это ты."
      - "Это также означает, что моя самая последняя авантюра увенчалась успехом."
      - "Я знаю тебя. Неважно когда, где или кто ты..."
      - "Ты никогда бы не смог бросить этих девочек."
      - "Сделать тебя последним запасным планом было правильным решением."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Подожди, так вот что значила та запись Анзил в виртуальном пространстве воспоминаний...)"
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Судя по твоей реакции, многие фрагменты мозаики только что встали для тебя на свои места."
      - "Я была права, когда доверилась тебе, мой слуга."
      - "Ты ни перед чем не остановишься ради нас, кансен, и ничего не станешь от нас утаивать."
      - "Ты помог нам разглядеть паутину лжи Сирен, навязанную нам командованием, и отвоевал для нас место в этом мире."
      - "Именно благодаря тебе все наши фракции держатся вместе, объединившись в нашей борьбе с безжалостными врагами."
      - "А когда мы объединяемся, мы можем совершить невозможное. Как это было в Антарктиде."
      - "Без тебя мы бы поддались недоверию и старым обидам, и, как следствие, стали бы жертвами Дироев (Наблюдателей - Гейзеров)."
      - "Но тебе удалось свести вместе таких маловероятных союзниц, как Союз и Бисмарк, предотвратив кризис, с которым мы столкнулись."
      - "Ты был с нами на каждом этапе пути, и именно поэтому мы вообще можем говорить о планах и о будущем."
      - "И если ты присоединишься к нам в этой операции, я с радостью расскажу тебе всё, что знаю, и помогу всем, чем смогу."
      - "Что скажешь, Командир?"
  - char: "commander"
    side: "left"
    text:
      - "Это очень рискованная операция..."
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Но это также прекрасная возможность, которую мы не можем позволить себе упустить."

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ты права. Я в деле."

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Тем больше причин мне в этом участвовать."

chapter7:
  rows:
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хи-хи. Какой храбрец."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Видишь? Я же говорила тебе, что мой слуга готов к этому!"
  - char: "commander"
    side: "right"
    text:
      - "У меня вопрос. Разве не поднимется переполох из-за моего внезапного исчезновения с конференции?"
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Я уже всё продумала на этот случай."
      - "Мы с Ришелье придумаем что-нибудь, чтобы развеять подозрения на время, достаточное для выполнения миссии."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "По этой причине мы будем сопровождать тебя, Командир. Поезду нужна «Куин Элизабет» для стабилизации его концептуальной защиты."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Конечно же ты поедешь! Я не верю в твою отговорку о том, что ему «нужна» одна из нас, но и поспорить с этим тоже не могу!"
      - "Но я отвлеклась. Короче говоря, мы с Ришелье останемся здесь и прикроем тебя."
  - char: "richelieu"
    side: "right"
    text:
      - "Я думаю, мы будем придерживаться версии, что Её Величество внезапно прибыла на конференцию, поэтому ты, как её «слуга», занят потаканием её прихотям на несколько дней."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Нам не понадобится так много времени. Мы всё сделаем и вернемся максимум через день-два."
  - char: "miss_d"
    side: "right"
    text:
      - "Элизабет! Я же говорила тебе, что ты не поедешь!"
      - "Никакие МЕТА не поедут! Ни единая!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Да, мы знаем. Ты очень настаивала на привлечении кансен из этого таймлайна, а не из нашего."
      - "Но нравится тебе это или нет, МЫ должны вести поезд."
  - char: "miss_d"
    side: "right"
    text:
      - "О. Точно. Нам нужен машинист. Ладно, можешь поехать! Но смотри у меня!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Как скажешь..."
  - char: "richelieu"
    side: "right"
    text:
      - "Я ручаюсь за этих девочек. Если понадобится, они рискнут собственными жизнями, чтобы защитить тебя."
  - char: "miss_d"
    side: "left"
    text:
      - "Хорошо! Не-МЕТА лучше! Они полезнее!"
  - char: "commander"
    side: "right"
    text:
      - "(Стратегически говоря, наши силы были бы куда мощнее с кем-нибудь из подчиненных Куин Элизабет META...)"
      - "(Почему Мисс D не хочет брать с собой никого из МЕТА? Они каким-то образом могут помешать этой операции?)"
      - "(Я бы спросил, но сомневаюсь, что получу от неё прямой ответ, пока мы не поймаем её кита.)"
      - "И что теперь? Мы садимся на «Свет Королевы» и совершаем прыжок в новую ветвь?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хотя «Света Королевы» было бы достаточно для этой миссии, мы отправимся к месту назначения через Камелот."
      - "Безопаснее иметь двусторонний портал на случай, если потребуется подкрепление. Это также гарантирует нам путь домой."
      - "Существует риск того, что Сирены или эта Бон Омм Ричард будут преследовать нас, но если до этого дойдет, новые и улучшенные врата и наш поезд смогут легко прыгать от ветви к ветви."
      - "Есть последние вопросы перед отправлением?"
  - char: "commander"
    side: "right"
    text:
      - "Ничего не приходит в голову."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хорошо. Тогда давайте готовиться к отправлению."
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Вот и готовьтесь. А я тем временем возвращаюсь в Ортодоксию."
      - "Наслаждайтесь своей охотой на кита! И постарайтесь не умереть!"
  - text:
      - "Куин Элизабет встает и уходит, забирая с собой Белфаст и Шеффилд."
  - char: "commander"
    side: "left"
    text:
      - "(Хм. Я был уверен, что она заставит нас взять с собой кого-нибудь из Королевских горничных.)"
      - "(Надеюсь, это знак того, что она настолько доверяет Ришелье, что полностью оставляет эту миссию на неё.)"
  - char: "richelieu"
    side: "right"
    text:
      - "Леди, во имя направляющей Ирис, помните о своих клятвах и защищайте Командира любой ценой."
  - char: "alsace"
    side: "left"
    text:
      - "Пока бьется сердце, я буду верным мечом, защищающим Командира от всех, кто желает причинить ему зло."
  - char: "mogador"
    side: "right"
    text:
      - "А я исполню волю Святого Престола, ибо я — агент Трибунала."
  - char: "richelieu"
    side: "left"
    text:
      - "Да пребудет со всеми вами Ирис."
      - "Командир, возьми это. Это коммуникатор, модифицированный и улучшенный Трибуналом."
      - "Мне сказали, что он более совершенен, чем те, что у Союза Орла. Он обеспечивает более стабильную и лучше зашифрованную связь."
      - "У остальных тоже есть такие. Ты сможешь отдавать им команды удаленно, как обычно."
  - char: "commander"
    side: "right"
    text:
      - "(Даже Трибунал внес свою лепту в эту миссию. Надеюсь, он защитит от сильных помех, раз уж я до сих пор не могу связаться с Хеленой для подстраховки.)"
      - "Большое спасибо."
  - char: "richelieu"
    side: "left"
    text:
      - "Не за что. Да пребудут с тобой удача и Святая Ирис, Командир."
  - text:
      - "После этих прощальных слов Ришелье также покидает Камелот."
      - "Вскоре после этого золотые кольца над замком оживают."
  - char: "commander"
    side: "left"
    text:
      - "Отлично. Идём ловить кита!"
