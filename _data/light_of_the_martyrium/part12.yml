chapter1:
  rows:
  - text:
      - "При содействии Элизабет наша команда выдвигается в сторону кита."
      - "Сначала мы шли пешком, пока не поняли, что «облака» вокруг нас обладают свойствами, идентичными воде. Поэтому девочки развернули свою оснастку."
      - "Мы должны суметь добраться до кита, перебираясь от облака к облаку."
      - "Однако прежде чем мы это сделаем, нужно решить одну проблему."

chapter2:
  rows:
  - char: "mogador"
    side: "left"
    text:
      - "*нюх-нюх*... Командир был прав. Впереди кто-то есть."
  - char: "alsace"
    side: "right"
    text:
      - "Что? Но мои сенсоры ничего не фиксируют."
  - char: "mogador"
    side: "left"
    text:
      - "Думаю, они используют технологию маскировки..."
  - char: "commander"
    side: "right"
    text:
      - "Да. Это излюбленный метод Пепла."
  - char: "alsace"
    side: "left"
    text:
      - "Обнаружены сигналы! Они приближаются с противоположных сторон! Жду приказов!"
  - char: "commander"
    side: "right"
    text:
      - "(Учитывая наши предыдущие встречи, они, вероятно, просто хотят поговорить.)"
      - "Посмотрим, сможем ли мы решить это словами. Будьте начеку, но не стреляйте первыми."
      - "Я попытаюсь с ними договориться."

chapter3:
  rows:
  - text:
      - "Увидев наши мирные намерения, кансен из Пепла отключают маскировочные устройства и показывают себя."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я Уичита, это Кимберли. Мы из Пепла. Вы ни капли не удивлены нас видеть."
  - char: "commander"
    side: "right"
    text:
      - "Нет. Мы знали, что вы здесь, еще до того, как ступили в Мартириум."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ступили куда? А, ты про это место. Вы ведь его создали, да?"
  - char: "commander"
    side: "right"
    text:
      - "Можно и так сказать."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я хочу знать, кто именно. Кто из вас это сделал?"
  - char: "commander"
    side: "right"
    text:
      - "Боюсь, я не могу вам этого сказать. Давайте сменим тему. Что скажете насчет перемирия, пока мы здесь?"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Зачем?"
  - char: "commander"
    side: "right"
    text:
      - "Я знаю ваших Хирю и Арк Роял. Я сражался с ними плечом к плечу. Фридрих из нашего таймлайна тоже работает с вами."
  - char: "kimberly_meta"
    side: "left"
    status: "is-meta"
    text:
      - "А-а. Так вы люди с испытательного полигона бета."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Вы с испытательного полигона бета? Это многое объясняет."
      - "Мы всё о вас знаем. Недавно у вас была крупная битва, не так ли?"
  - char: "commander"
    side: "left"
    text:
      - "(Крупная битва? Она говорит о том событии с почти произошедшим наложением Царства Божьего? Они знают больше, чем показывают.)"
      - "(Учитывая, что Фридрих, возможно, снабжала их информацией, может, мне удастся уговорить этих двоих на временный альянс.)"
      - "Я ценю то, что вы сделали для Фридрих. Как она справляется?"
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "В полном порядке. Она работает над кое-чем грандиозным в нашем убежище."
      - "А ты и впрямь много знаешь. Полагаю, ты и есть тот самый Командир, о котором я так много слышала."
  - char: "commander"
    side: "left"
    text:
      - "Собственной персоной."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Оно и видно. Хирю была права — один лишь взгляд на тебя навевает теплые воспоминания."
      - "Понимаешь, о чем я, Кимберли?"
  - char: "kimberly_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Да. Мне... тоже это кое-что напоминает."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Многое изменилось с тех пор, как вы с Энтерпрайз встретились. В последнее время она принимает довольно странные решения. То, что она впустила Фридрих — одно из них."
      - "Но должна признать, она отлично справляется."
      - "Знаешь что, я заинтригована — кто ты такой на самом деле?"
  - char: "commander"
    side: "left"
    text:
      - "Хороший вопрос. Вы, вероятно, знакомы со мной из будущего, а вот я нет. Мне бы хотелось узнать больше."
      - "На самом деле, именно поэтому я здесь. Чтобы узнать больше."
  - char: "miss_d"
    side: "right"
    text:
      - "Я же уже говорила, кто ты! Ты таинственный ассистент!"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Никогда раньше не слышала ни о каком «таинственном ассистенте». Тебе это о чем-нибудь говорит, Кимберли?"
  - char: "kimberly_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Не уверена. Если у меня и есть воспоминания о таком человеке, то они запрятаны очень глубоко."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Спрошу потом у Энтерпрайз, когда вернемся на базу. Эй ты, мелочь, откуда ты знаешь «ассистента»?"
  - char: "miss_d"
    side: "right"
    text:
      - "У меня есть имя! Я Мисс D!"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Точно не то имя, которое я когда-либо слышала. Тебе есть что скрывать?"
  - char: "miss_d"
    side: "right"
    text:
      - "Не твое дело! Всё, что тебе нужно знать — меня зовут Мисс D!"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я не доверяю этой крысе. Она же явно из проклятого Антиоха! Готова поспорить, она шпионка, проникшая на испытательный полигон бета!"
  - char: "miss_d"
    side: "right"
    text:
      - "Это ТЫ шпионка!"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Слышали? Она не стала отрицать, что из Антиоха!"
  - char: "commander"
    side: "right"
    text:
      - "Она Арбитр. Арбитр XIII: Смерть, если быть точным."
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Чушь собачья. Я сражалась со Смертью больше раз, чем могу вспомнить, и это точно не она."
      - "Видите того кита в небе? ЭТО Смерть."
  - char: "miss_d"
    side: "right"
    text:
      - "А?! Ты просто полная идиотка! Самозванка одурачила тебя, идиотка!"
  - char: "wichita_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Назови меня идиоткой еще раз, и ты получишь свое, мелкая засранка."
  - char: "miss_d"
    side: "right"
    text:
      - "Иии!"
  - char: "kimberly_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Она всего лишь ребенок. Не угрожай ей."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Конечно, она ребенок, а детей нужно ставить на место."
      - "В любом случае... Если эта малявка с вами, это всё меняет. Мы оставим эту из Антиоха в покое, пока она не лезет к нам."
      - "Однако нам всё еще нужно что-то сделать с этим пространственным возмущением. Просто надеюсь, что нам не придется из-за этого драться друг с другом."
      - "Вы ведь за этим сюда пришли, верно? Чтобы измерить его?"
  - char: "commander"
    side: "left"
    text:
      - "В какой-то степени. Наша цель здесь — поймать кита. Получение данных о возмущении — это просто второстепенная задача."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Серьезно, да? Мы не знали о ките, пока не прибыли сюда. Полагаю, вы знали о нем с самого начала."
      - "Эта штука — гигантская база данных с плавниками, знаешь ли."
  - char: "commander"
    side: "left"
    text:
      - "Интересно. Так как вы смотрите на то, чтобы мы поработали над этим вместе?"
      - "Где-то в этом месте находится Арбитр — Дьявол — и я не думаю, что она просто Ковчег. Она наш враг, как и ваш."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Вспомни о дьяволе, как говорится... Да, мы засекли её, как только вошли в этот... «Мартириум»."
      - "Но вот в чем дело. Мы лучше всего работаем одни."
      - "Лучшее, что я могу сделать, — это согласиться не путаться у вас под ногами, если вы не будете путаться у нас."
  - char: "commander"
    side: "left"
    text:
      - "(Я почти забыл, что Пепел полон волков-одиночек. Раз они так хотят...)"
      - "Меня это устраивает. Удачи с вашим заданием."
  - char: "wichita_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Да. И вам того же."
