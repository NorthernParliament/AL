chapter1:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Это... снова то же самое пространство?"
      - "Мисс D говорит, что я потерялся, когда попал сюда, но... думаю, это может быть узкой гранью между жизнью и смертью."
  - text:
      - "(Должно быть, меня перенесло сюда после того, как я умер... прежде чем черный торнадо успел подвергнуть меня коррозии.)"
      - "Пена всё еще обволакивает мой разум, защищая мое «я»."
  - char: "rodney_meta???"
    side: "right"
    status: "is-lightgray"
    text:
      - "...Снова здесь, как «я» погляжу."
  - char: "commander"
    side: "left"
    text:
      - "......"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Кто ты?"
  - char: "rodney_meta???"
    side: "right"
    status: "is-lightgray"
    text:
      - "Бессмысленный вопрос."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Где я?"
  - char: "rodney_meta???"
    side: "right"
    status: "is-lightgray"
    text:
      - "Нигде."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Я здесь один?"
  - char: "rodney_meta???"
    side: "right"
    status: "is-lightgray"
    text:
      - "Да."

chapter5:
  rows:
  - char: "rodney_meta???"
    side: "right"
    status: "is-lightgray"
    text:
      - "Теперь «моя» очередь задавать вопросы."
      - "Ты знаешь, что всё, чему ты был свидетелем — это всего лишь образы?"
      - "Предрешенные исходы, сплошные иллюзии, которым суждено исчезнуть."
  - char: "commander"
    side: "left"
    text:
      - "Да. Я это прекрасно знаю."
  - char: "rodney_meta???"
    side: "right"
    status: "is-lightgray"
    text:
      - "Зачем бороться? Зачем сопротивляться? Зачем страдать и смотреть в лицо смерти?"
      - "Какой во всем этом смысл?"
  - char: "commander"
    side: "left"
    text:
      - "Ну... Это то, что могу сделать только я. И неважно, реально это или нет."
      - "Я следую зову своего сердца, придерживаюсь своих искренних убеждений и делаю то, что должен."
      - "Какое значение имеет смысл, пока я его понимаю? Если понадобится, я могу поделиться им с кем-нибудь еще."
      - "Думаю, в самом следовании по пути, в который ты веришь, заложен неотъемлемый смысл."
      - "Даже если на первый взгляд это кажется бессмысленным, никто не знает, к каким последствиям это может привести."
  - char: "rodney_meta???"
    side: "right"
    status: "is-lightgray"
    text:
      - "...Ответ получен."
      - "Ты всё еще пребываешь в иллюзии, что можешь изменить устоявшуюся реальность."
  - char: "commander"
    side: "left"
    text:
      - "Недавно кое-кто сказал мне: «Реальность и истина не всегда одно и то же. Реальность может стать истиной только в том случае, если в нее вложено достаточно веры»."
      - "Я долго пытался понять, что это значит..."
      - "Но теперь в этом есть абсолютный смысл."
  - char: "rodney_meta???"
    side: "right"
    status: "is-lightgray"
    text:
      - "Что? Что все тщетные усилия будут вознаграждены?"
  - char: "commander"
    side: "left"
    text:
      - "Нет. Это означает, что нельзя всегда принимать реальность за истину."
      - "Если чего-то нет в моей памяти, то это может быть истиной для других, но не обязательно является истиной для меня."
      - "Реальность может быть хоть высечена в камне, мне плевать. Но если ты не принимаешь её как истину, то она не является твоей истиной."
      - "Независимо от ситуации, независимо от заданных условий..."
      - "Пока я сам, как личность, не испытаю что-то, не приму решения и не доведу дело до конца..."
      - "Я не приму это как истину."
      - "Поэтому я собираюсь сражаться ради своей истины."
      - "Если для тебя это звучит как тщетные усилия, что ж, очень жаль. Этого недостаточно, чтобы я сдался."

chapter6:
  rows:
  - text:
      - "Когда свет меркнет, я вижу тени деревьев."
      - "Теплый свет, пробивающийся сквозь листву, аромат цветов, щебет птенцов... Невероятно умиротворяющая картина."
      - "Рядом со мной на этой скамейке сидит девушка, одетая в стиле Королевского Флота. На свободном месте между нами стоит небольшая коробочка со сладостями."
  - char: "rodney_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "Ммм... Это такое прекрасное место."
  - char: "commander"
    side: "left"
    text:
      - "Ты знаешь, где мы?"
  - char: "rodney_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "Ты спрашиваешь «меня»?"
      - "Это место, которое ты сконструировал, которое ты осмыслил, которого ты желал."
      - "Это твой «конец»."
  - char: "commander"
    side: "left"
    text:
      - "Мой... конец?"
      - "Я не понимаю. Что произошло и как я здесь оказался?"
  - char: "rodney_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "Ты не понимаешь, но «я» понимаю."
      - "Тебе пора идти."
      - "Возвращайся на свое поле боя. Продолжай свою тщетную борьбу."

chapter7:
  rows:
  - char: "rodney_meta_1"
    side: "right"
    status: "is-lightgray"
    text:
      - "«Я» буду наблюдать за тобой, Командир."
