  - "Комната отдыха Командира"
  - "После завершения операции"

black_scene10:
  - "Буря бушует над водами сквозь ночь, которой не видно конца."
  - "Посреди бури замерло одно одинокое судно."
  - "Утихнет ли сначала ярость бури, или же сначала пойдет ко дну этот корабль?"
  - "Принесет ли луч света надежду сквозь тьму?"
  - "......."
  - "Ибо я — лишь бабочка из снов, порхающая среди иллюзий."
  - "Пусть свет направит этот корабль. Пусть надежда направит Империю Сакуры."

black_scene11:
  - "Сноходец видит свет Церемонии Рассвета..."
  - "...Окрашенные багрянцем интриги. Потусторонние взрывы. Обитель веры, расколотая обугленным клинком."
  - "Сноходец видит своих доблестных товарищей, сдерживающих волны хаоса, чтобы завершить церемонию."
  - "Наконец, дрейфуя в бескрайнем море между мирами, сноходец приходит в движение."