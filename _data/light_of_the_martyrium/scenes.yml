black_scene1:
  - "Знаешь, ассистент... то есть, Командир."
  - "Я очень боюсь смерти."
  - "Настолько, что даже думать об этом не хочу."

black_scene2:
  - "Больше всего меня пугает мысль о внезапной кончине."
  - "Просто всё резко обрывается в тот самый момент, когда твой разум всё ещё полон мыслей о вчерашнем дне и надежд на завтра."
  - "Поэтому, если уж мне и суждено умереть, я бы хотела, чтобы это произошло на моих условиях. Я бы хотела сама решить, когда, где и как."
  - "...Очевидно, что мне далеко до твоей храбрости."

black_scene3:
  - "Собственную смерть не принимают просто так. На это нужно время."
  - "Но когда смерть заберет меня, не скорби."
  - "Потому что когда она придет, я буду готова и буду её ждать."

black_scene4:
  - "Когда моя душа покинет этот мир, мои стремления перейдут к тебе."
  - "...Что? Их слишком много, чтобы ты смог взвалить их на свои плечи?"
  - "Я знаю, что ты просто пытаешься разрядить обстановку шуткой, но я говорю серьезно."
  - "...Ты правда думаешь, что не справишься без моей помощи?"
  - "Ты просишь слишком многого от того, кто будет мертв."
  - "Но хорошо. Я сделаю всё, что смогу."
  - "Всё, ради чего я трудилась, я оставляю тебе. Мои мечты, мой путь и всё, что я защищала."

