chapter1:
  rows:
  - text:
      - "Я собираюсь с духом и открываю дверь в свою комнату отдыха."
      - "Внутри всё выглядит практически так же, как я и оставил. И здесь нет никого, кто мог бы поприветствовать меня по возвращении."
  - char: "commander"
    side: "left"
    text:
      - "(Фух. Элизабет и Ришелье действительно прикрыли меня. Никто ничего не заподозрил.)"
      - "(Мне о многом, об ОЧЕНЬ МНОГОМ нужно поразмыслить касательно этой операции. Я делал кое-какие записи, но они черновые.)"
      - "(Лучше записать все детали, пока они еще свежи в памяти.)"
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "commander"
    side: "left"
    text:
      - "Хм? Сообщение, как только я вернулся?"
      - "(Ага... Это из Союза Орла.)"
      - "«В Тихом Океане произошел пока не получивший объяснения инцидент»."
      - "«В течение 48 часов множество военно-морских баз получили огромные объемы данных, которые противоречат друг другу»."
      - "«Кроме того, была кратковременно потеряна связь с PH (Перл Харбор), как позже выяснилось, из-за проблем с линиями связи»."
      - "«Командир, ради вашей собственной безопасности вам надлежит оставаться на территории Ортодоксии. Продолжайте участие в конференции в обычном режиме»."
      - "«Энтерпрайз поручено следить за развитием ситуации в Тихом Океане. Она свяжется с вами, как только появятся какие-либо новости»."
      - "Я совершенно сбит с толку... чем бы это ни было."
      - "Что они имеют в виду под «не получившим объяснения инцидентом»?"
      - "(Отправитель мне тоже незнаком. Это может быть Командование, а может — кто-то из моих знакомых.)"
      - "(Хотя, учитывая, насколько скудны подробности, вероятно, это всё же Командование. Что-то произошло, и они не могут этого объяснить.)"
      - "Я просто дам этой информации немного улечься, а потом позвоню Энтерпрайз и Саратоге."
      - "(Интересно, произошло ли это конкретно в Тихом Океане...)"
      - "(Он граничит со многими фракциями. Союз Орла, Северный Парламент, Империя Сакуры, даже Империя Дракона.)"
      - "(У Королевского Флота, Железной Крови и Ортодоксии Ирис там тоже есть базы.)"
      - "(В любом случае, я сделаю пару звонков и проверю, знает ли кто-нибудь хоть что-то.)"
      - "(Однако отсутствие подробностей об этом «инциденте» вызывает у меня серьезные дурные предчувствия...)"
      - "(Очень надеюсь, что мои опасения окажутся беспочвенными.)"
