chapter1:
  rows:
  - char: "rodney_meta_1"
    side: "left"
    status: "is-lightgray"
    text:
      - "АААААААХХХ!.."
  - text:
      - "БАБАХ!!!"
  - char: "miss_d"
    side: "left"
    text:
      - "Ассистент, там опасно! Держись рядом со мной!"
  - char: "commander"
    side: "right"
    text:
      - "Понял. Но такими темпами!.."

chapter2:
  rows:
  - text:
      - "Кансен META и Родни уже начали обмениваться ударами в море Мартириума."
      - "Отдельные META объединились, чтобы сражаться как единое целое, обладающее потрясающей мощью, но им всё еще не удается превзойти силу Родни."
      - "Пока я был подавлен своим бессилием и тем, насколько мы уступаем в силе, меня вдруг осенило."
      - "Как насчет той силы, которую я испытал раньше? Способности видеть поле боя целиком, удаленно связываться с чувствами кансен?"
      - "Если бы я использовал её, я мог бы не просто сообщить им, где нахожусь — я мог бы помочь META в их бою."
      - "Возможно, я потерял ту основу, которую создала Родни, но если фрагменты кокона, создавшие это воспоминание, всё еще внутри..."
      - "Если бы я только мог обуздать их силу, хотя бы её крупицу..."

chapter3:
  rows:
  - char: "alsace"
    side: "left"
    text:
      - "К-командир! Флот телохранителей Ириса собран!"
  - char: "fleuret"
    side: "right"
    text:
      - "Фух... Мы успели вовремя!"
  - char: "mogador"
    side: "left"
    text:
      - "Я тут вся распереживалась и завелась, зная, что ты смотришь на нас, но всё и вправду приняло серьезный оборот..."
  - char: "commander"
    side: "right"
    text:
      - "(Эльзас и остальные! Отлично, сработало...)"
      - "Где вы были? Вы все в порядке?"
  - char: "brennus"
    side: "left"
    text:
      - "Мы взобрались на кита и сразились с Тенью Смерти."
      - "Твое руководство даровало нам силу, необходимую, чтобы повергнуть это чудовище."
      - "После этого мы должны были собраться здесь, в третьем кольце, но во время боя кит сбежал в первое кольцо. Нас унесло вместе с ним."
      - "Вот почему мы не смогли поспешить к тебе на помощь... От лица всех нас я приношу извинения."
  - char: "commander"
    side: "right"
    text:
      - "Значит ли это, что вы пришли сюда из первого кольца?"
      - "Мисс D всё это время была со мной. Только не говорите мне, что вы..."
  - char: "brennus"
    side: "left"
    text:
      - "Мы действовали в соответствии с правилами этого Зеркального Моря. Не беспокойся за нас, Меченосец."
  - char: "fleuret"
    side: "right"
    text:
      - "В конце концов, это же Мартириум! Принесение себя в жертву ради Ириса в качестве подношения подходит под концепцию как нельзя лучше!"
  - char: "commander"
    side: "left"
    text:
      - "Простите, девочки. Если бы только мы могли использовать наши коммуникаторы..."
  - char: "epee"
    side: "right"
    text:
      - "В-всё в порядке. Мы в любом случае направлялись к тебе."
  - char: "alsace"
    side: "left"
    text:
      - "Верно. Я следила за нашей линией связи, поэтому, когда всё начало выходить из-под контроля, я поняла, что должна бежать сюда."
  - char: "commander"
    side: "right"
    text:
      - "Ты имеешь в виду, как только Дьявол оборвала нашу связь?"
  - char: "alsace"
    side: "left"
    text:
      - "Да! Однако точно определить твое местоположение было непростой задачей..."
  - char: "mogador"
    side: "right"
    text:
      - "Хе-хе-хе♥ Мы смогли встретиться так быстро только потому, что ты та-а-ак сильно за нас волновался, да?"
      - "Жаль только, что наше маленькое усиление уже прошло. Даже если бы мы вступили в бой, не думаю, что мы смогли бы сделать многое..."
      - "Но это не значит, что мы останемся в стороне в этой битве."
      - "Этой Родни определенно помогают Арбитр и коррозия."
      - "Поэтому я предлагаю уравнять шансы, помогая им отбиться от этой Хатакадзе и Арбитра. Мы даже можем поддержать их, усиливая концепцию Мартириума путем уничтожения коррозийных сущностей."
  - char: "alsace"
    side: "left"
    text:
      - "Да! В конце концов, Командир на нашей стороне!"
  - char: "commander"
    side: "right"
    text:
      - "Отличная мысль, Могадор. Родни сильна, но она не единственная угроза в этом бою."
      - "Хатакадзэ, Дьявол — вмешательство любой из них в бой может стать катастрофой."
      - "Давайте внесем в битву свой вклад всем, чем сможем."
      - "Всем занять строй! Теперь это и наш бой тоже!"
