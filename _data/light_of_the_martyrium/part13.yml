chapter1:
  rows:
  - text:
      - "Мы с Пеплом расходимся в разные стороны и возобновляем наш подъем к киту."
      - "Однако вскоре мы видим, что кто-то добрался до кита раньше нас и Пепла."
      - "БАБАХ!!!"
  - char: "alsace"
    side: "left"
    text:
      - "Кита атакует что-то похожее на дронов!"
  - char: "brennus"
    side: "right"
    text:
      - "К тому же это довольно большой рой, принимающий форму сети, чтобы поймать его."
  - char: "mogador"
    side: "left"
    text:
      - "Эти штуки выглядят знакомо... О, вспомнила! Это дроны Дьявола!"
  - char: "miss_d"
    side: "right"
    text:
      - "Не-е-ет! Дьявол, ты огромная идиотка! Полегче! Ты убьешь моего кита!"
      - "Нет, подожди, он же сбежит быстрее, чем случится что-то еще!"
      - "Видите?! Он уже готовится уйти!"
      - "...Подождите, что?! Отлично! Самозванка заполучила новое оружие!"
  - text:
      - "Когда кит оказывается окружен дронами, его тело внезапно начинает светиться синим."
      - "Каждый дрон, которого касается свет, мгновенно теряет управление и падает на землю. Затем кит поворачивает спинной плавник и на огромной скорости устремляется к центру Мартириума."
      - "Он достигает предела кольца города, касаясь границы. Происходит пространственное искажение, и кит вновь ускользает в пространство."
  - char: "commander"
    side: "left"
    text:
      - "Проклятье. Он опять ушел."
  - char: "miss_d"
    side: "right"
    text:
      - "Элизабет! Ответь, Элизабет!"
      - "Используй свой поезд, чтобы расширить Мартириум! Притяни кита к нам!"
  - char: "queen_elizabeth_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Угх-х-х..."

chapter2:
  rows:
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Преобразование концепции, шестой вагон. Расширь горизонт смерти, материализуй незримое и воплоти его форму!"

chapter3:
  rows:
  - text:
      - "Из пустоты вновь вырвался ослепительный свет."

chapter4:
  rows:
  - text:
      - "Концепция Зеркального моря усиливается, расширяя Мартириум вторым кольцом, украшенным золотом, мрамором и арками, прямо как первое."
      - "Там, в воздухе над вторым кольцом, снова появляется кит."
  - char: "epee"
    side: "left"
    text:
      - "Мартириум стал ещё больше и ярче, чем раньше!"
  - char: "fleuret"
    side: "right"
    text:
      - "Посмотрим, как этот кит попытается сбежать ТЕПЕРЬ!"
  - char: "queen_elizabeth_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Невероятно. Мы развернули так много пространства, а там всё ещё есть нечто большее..."
      - "Интересно, какое ужасающее существо вызвало столь массивное пространственное искажение..."
  - char: "miss_d"
    side: "right"
    text:
      - "Неважно! Важно только то, чтобы он снова не сбежал!"
      - "Вы не можете позволить этому случиться в третий раз!"
  - char: "queen_elizabeth_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Мы сказали, что сделаем это, помнишь? Поверь нам, мы не дадим ему скрыться."
  - char: "miss_d"
    side: "right"
    text:
      - "Спасибо! Ты добрая, Элизабет!"
      - "Давай, ассистент! Нам нужно вернуться к поимке кита!"
  - char: "alsace"
    side: "left"
    text:
      - "Но как? К новому кольцу нет пути."
      - "Мы ведь не предназначены для прыжков по облакам, так что..."
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Вы бы и не смогли в любом случае. Так же, как каждый вагон поезда независим от следующего, эти кольца независимы друг от друга."
      - "Помните, как в некоторых Зеркальных морях есть правила входа и выхода? Эти работают схожим образом."
      - "Короче говоря, метод, который сработал на первом кольце, не сработает на втором. Мы должны найти новый путь внутрь."
  - char: "miss_d"
    side: "left"
    text:
      - "Всё нормально! Вагоны поезда соединены, так что мы можем войти тем же путем, что и в прошлый раз!"
      - "Просто идите за мной, и мы доберемся туда! Не беспокойтесь о концептуальном правиле!"
  - char: "commander"
    side: "right"
    text:
      - "Мы должны хотя бы знать правила, прежде чем начнем их игнорировать. С каким концептуальным правилом мы имеем дело?"
  - char: "miss_d"
    side: "left"
    text:
      - "А ты как думаешь? Смерть! Смерть — это главная фишка этого места, помнишь?"
      - "Как я уже сказала, не берите в голову! Просто идемте со мной!"
      - "Кит не будет нас ждать! Поспешим!"
