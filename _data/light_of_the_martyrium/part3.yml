chapter1:
  rows:
  - text:
      - "Кольцо света вращается, и мир вокруг нас начинает меняться."
      - "Прыжок между ветвями начался, и всё же двор Камелота не подает никаких признаков движения."
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Врата могут перемещать двумя разными способами. Первый — это прыжок от Зеркального моря к Зеркальному морю, а второй — указание координат для прямого перемещения."
      - "При прямом перемещении по координатам необходимо справляться с воздействием целевой ветви — пространственным возмущением."
      - "Похоже, здесь это достигается за счет энергетического барьера, создаваемого тремя кольцами."
      - "Наши комплименты тому, кто это построил."
      - "Основа отлично спроектирована, достаточное внимание уделено как гибкости, так и комфорту."
      - "А теперь, чтобы никакие злоумышленники не сели нам на хвост, мы сделаем с десяток крюков."
      - "До прибытия в целевую ветвь три часа. Выпейте чашечку чая, пока мы ждем."
      - "Горничные твоей Элизабет приготовили его перед нашим отбытием."
      - "...Нам придется попить чай в другом месте. Не обращайте на нас внимания. Идите, отдыхайте."

chapter2:
  rows:
  - char: "brennus"
    side: "left"
    text:
      - "Чай и закуски готовы. Я сняла пробу. Они сладкие и с приятной текстурой, и, конечно же, я не почувствовала никакого яда."
  - char: "fleuret"
    side: "right"
    text:
      - "Фух... Сладости Королевского Флота никогда не перестанут удивлять!"
      - "С ума сойти, какие у вас потрясающие сладости, а вот вся остальная еда... Ба, сейчас не время для этого!"
      - "Налетайте, все! Всё горячее и свежее! Не стесняйся, Командир!"
  - char: "alsace"
    side: "left"
    text:
      - "*глоть* Я буду пить хладагент вместо холодного чая..."
  - char: "commander"
    side: "right"
    text:
      - "Хладагент?!"
      - "Ох. Точно, тебе нужно охлаждать свои модули, прямо как Гасконь."
  - char: "alsace"
    side: "left"
    text:
      - "В-всё верно! Гасконь признана могущественным союзником поддержки!"
  - char: "epee"
    side: "right"
    text:
      - "Воу, воу, воу, воу..."
  - char: "commander"
    side: "left"
    text:
      - "Эпе, что случилось? Ты увидела что-то в сладостях?"
  - char: "epee"
    side: "right"
    text:
      - "Н-нет! Я просто боюсь, что уроню поднос... Такое случалось уже миллион раз... Воу, воу..."
  - char: "commander"
    side: "left"
    text:
      - "Погоди, разве ты не говорила, что тебе с трудом удается контролировать свою силу?"

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ничего страшного, если ты его уронишь! Не переживай."
  - char: "epee"
    side: "right"
    text:
      - "К-Командир, это никак не может быть нормальным..."
  - char: "commander"
    side: "left"
    text:
      - "Её Величество не будет возражать против пары разбитых подносов."
  - char: "miss_d"
    side: "right"
    text:
      - "Да! Элизабет всё равно!"

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Эмм, а что, если я покормлю тебя?"
  - char: "epee"
    side: "right"
    text:
      - "К-Командир, это никак не может быть нормальным..."
  - char: "fleuret"
    side: "left"
    text:
      - "Если Эпи не согласится, то я согласна! Мой ротик открыт и ждёт, Командир!"
  - char: "alsace"
    side: "right"
    text:
      - "Я... т-т-тоже... х-х-хочу кушать!"
  - char: "miss_d"
    side: "left"
    text:
      - "Я тоже! Покорми меня-я-я!"

chapter5:
  rows:
  - text:
      - "Несмотря на минутную суматоху, нам удается насладиться относительно спокойным совместным чаепитием."
  - char: "commander"
    side: "left"
    text:
      - "Скажите, а где Могадор? Я её давно не видел."
  - char: "brennus"
    side: "right"
    text:
      - "То, как она... одевается... не подходит для чаепитий."
      - "Могадор должна стоять на страже, как и я. Её пост вон на той башне."
  - text:
      - "Я смотрю в направлении, куда указывает Бреннус. И вижу там расплывчатый силуэт."
  - char: "commander"
    side: "left"
    text:
      - "Да... Да, это не подходящий наряд для чаепития. Мы можем что-нибудь для неё сделать?"
  - char: "brennus"
    side: "right"
    text:
      - "Видимо, это её причуда. К сожалению, это издержки рабочей среды. Не думаю, что в наших силах помочь."
      - "Мы можем просто оставить её долю сладостей, чтобы она забрала их позже."
  - char: "commander"
    side: "left"
    text:
      - "Полагаю, это всё, что мы можем сделать..."

chapter6:
  rows:
  - text:
      - "Три часа пролетают в мгновение ока. Чаепитие помогло мне поближе познакомиться с нашими новыми друзьями из Ириса."
      - "Пока мы все убираем со стола, Мисс D, которая большую часть времени пролежала на траве, выбившись из сил, внезапно вскакивает на ноги."
  - char: "miss_d"
    side: "left"
    text:
      - "Кит! Я буквально чую его!"
      - "Он близко! Очень близко!"
      - "Элизабет, готовь поезд! Я поймаю себе кита!"
  - char: "alsace"
    side: "right"
    text:
      - "Охота на кита подтверждена в качестве цели этого путешествия. Но я не могу ни увидеть, ни определить координаты этого кита."
  - char: "brennus"
    side: "left"
    text:
      - "Хмм. Я тоже понятия не имею, что произошло."
  - char: "miss_d"
    side: "right"
    text:
      - "Мм. Как странно. Где кит? Он прячется?!"
      - "Как, черт возьми, он это активировал... Автоматическая система защиты превысила лимит вызовов!"
      - "Эй, ты, проклятый кит! Покажись уже!"
      - "Ки-и-ит! Давай, давай, давай!"
  - text:
      - "Мисс D сердито кричит в пустое небо."
      - "А затем... что-то начинает проявляться."

chapter7:
  rows:
  - text:
      - "Сначала возникло легкое пространственное колебание за пределами колец врат."
      - "Сразу после этого из пространства недалеко от самого внешнего кольца появляется кит."
  - char: "fleuret"
    side: "left"
    text:
      - "Это и есть... тот кит, которого мы пытаемся поймать?"
  - char: "epee"
    side: "right"
    text:
      - "Он огромный..."
  - char: "brennus"
    side: "left"
    text:
      - "Судя по его видимым размерам и расстоянию между нами, его длина должна составлять от 1100 до 1300 метров."
      - "Огромный — это еще слабо сказано."
  - char: "miss_d"
    side: "right"
    text:
      - "Да! Это мой кит! Элизабет! Поднимай свой зад, и пошли ловить этого кита!"
  - char: "queen_elizabeth_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "..."
  - char: "commander"
    side: "right"
    text:
      - "У меня вопрос. Этот кит вообще откликается на твой голос?"
      - "Замечательно, если да, но если нет..."
  - char: "mogador_rad"
    side: "left"
    text:
      - "Ах, кит поворачивается к нам. У меня плохое предчувствие насчет этог-о-о-о..."
  - char: "commander"
    side: "right"
    text:
      - "О нет. Элизабет! Активируй защиту!"
  - char: "queen_elizabeth_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Первое Кольцо, развернуть активную защиту!"
  - text:
      - "Ослепительный золотой свет на мгновение проносится сквозь защитный барьер врат. Энергетический залп кита остановлен, от него осталась лишь рябь на поверхности."
  - char: "commander"
    side: "left"
    text:
      - "Он нас атаковал!"
  - char: "miss_d"
    side: "right"
    text:
      - "К-как?! Мы даже не нападали на него. С чего бы ему активировать автоматическую защиту?"
      - "Черт возьми, почему он вообще нападает на МЕНЯ?"
      - "Почему... Я не понимаю, я не понимаю, в этом нет никакого смысла!"
  - text:
      - "Осознав, что его атака была тщетной, кит слегка мотает головой. Даже не взглянув на Мисс Д, он исчезает в пространственных колебаниях, из которых появился."
  - char: "miss_d"
    side: "right"
    text:
      - "Кит, мой кит... всхлип... Почем-у-у..."
  - char: "mogador_rad"
    side: "left"
    text:
      - "Думаешь, он попытается устроить нам засаду?"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Возможно. Нам это казалось странным еще с тех пор, как команда Хантер в последний раз пыталась его поймать."
      - "Когда он был загнан в угол, он внезапно продемонстрировал неожиданный интеллект И оружие, которого мы никогда раньше не видели..."
  - char: "miss_d"
    side: "left"
    text:
      - "Ложь! Это не может быть правдой!"
      - "Кит подчиняется только мне! Только я могу им управлять!"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Да, да. Вскоре мы сможем сами во всем убедиться."
      - "А пока сосредоточься на том, чтобы выяснить, куда делся этот кит... и как вытащить его из укрытия."
