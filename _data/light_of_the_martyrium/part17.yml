chapter1:
  rows:
  - text:
      - "Мы идем к институту, ведомые моими воспоминаниями о маршруте."
      - "Это то же самое место, где я побывал в Линзе Реальности, и то же самое место, которое описывали Кронштадт и её команда, однако между ними остаются разительные отличия."
      - "Здесь нет ни магазинов, ни ларьков, ни туристических объектов. Все они заменены оборонительными сооружениями и баррикадами."
      - "Маска миролюбия сорвана, обнажив истинную природу острова как военной базы."

chapter2:
  rows:
  - text:
      - "Внезапно начинают выть сирены."
  - char: "brennus"
    side: "left"
    text:
      - "Тревога. Кто неосторожно активировал систему безопасности?"
  - char: "alsace"
    side: "right"
    text:
      - "Мои сенсоры ничего не фиксируют... И предвосхищая твой вопрос — да, они работают."
  - char: "mogador"
    side: "left"
    text:
      - "Это не я. Я скорее отключала все системы."
  - char: "fleuret"
    side: "right"
    text:
      - "С каких это пор? Я понятия не имела, что ты это делаешь!"
  - char: "epee"
    side: "left"
    text:
      - "Вы, люди из Трибунала, пугаете меня..."
  - char: "commander"
    side: "right"
    text:
      - "Не думаю, что кто-то из нас её активировал. Сирены воют по всему острову, и я не думаю, что они сработали только для того, чтобы нас арестовать."
  - char: "alsace"
    side: "left"
    text:
      - "Но тогда кто? Я не понимаю."
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Вражеский флот появился в 50 морских милях к северо-западу. Похоже, они направляются в вашу сторону."
  - char: "commander"
    side: "left"
    text:
      - "Флот? Ты можешь их опознать?"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Это коррозийные сущности."
  - char: "commander"
    side: "left"
    text:
      - "Ты имеешь в виду те штуки, которые извергают черные торнадо и которые не поддаются анализу?"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Если ты имеешь в виду коррозийные явления, то да, но они могут проявляться и иными способами."
      - "Помни, они — буквальное воплощение коррозии."
      - "Как ты и сказал, их невозможно нормально проанализировать даже вблизи."
      - "Или, скорее, МОЖНО, но то, что вы воспринимаете, каждый раз немного меняется."
      - "Вы также не можете их захватить, и после уничтожения от них не остается обломков. Как будто физически они не существуют."
      - "В каком-то смысле, так оно и есть. Это тени, спроецированные из другого измерения. Причем несовершенным образом."
      - "Потеря данных, вызванная процессом проекции, на самом деле и является причиной того, что они кажутся размытыми пятнами, которые вы не можете нормально разглядеть."
      - "Считайте их поврежденными данными. Тот факт, что они здесь, означает, что пространство, в котором вы находитесь, подвергается коррозии."
      - "А сейчас, похоже, мы имеем дело с... Что? Революционным фронтом?!"
      - "Послушайте! Эти сущности происходят из данных, присутствующих в этом пространстве!"
  - char: "commander"
    side: "left"
    text:
      - "Что ты имеешь в виду?"
  - char: "queen_elizabeth_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Просто настройтесь на частоту, которую мы вам только что отправили! Их флот передает сообщение на остров!"

chapter3:
  rows:
  - char: "communicator"
    side: "right"
    text:
      - "Говорит флот сектора АО Революционного фронта. Настоящим мы выдвигаем ультиматум острову Самос."
      - "Выдайте лиц, стоящих за нападением на грузовое судно «Полтава», разоружите ваших Инфорсеров и немедленно уничтожьте все лаборатории по разработке искусственного интеллекта на острове."
      - "Если наши требования не будут выполнены в течение трех часов, мы добьемся этих целей силой."
      - "Очевидно, что остров Самос стал рассадником коррупции из-за политики попустительства со стороны Федерации."
      - "Здесь проводятся эксперименты — особенно над военезированным искусственным интеллектом, — которые никогда не проходили оценку безопасности и не соответствовали этическим нормам, и всё это во имя «научного прогресса»."
      - "Эти люди вложили оружие в руки роботов и передали власть над жизнью и смертью компьютерным программам."
      - "Именно это и привело к этой трагедии. Нельзя доверять человеческие жизни машинам."
      - "Вооруженный искусственный интеллект неконтролируем и крайне опасен, и нападение на «Полтаву» это доказало."
      - "сли этим зловещим машинам позволить свободно разгуливать, это станет концом человечества."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Они серьезно? Они захватят остров силой, если понадобится?)"
      - "(Они упомянули искусственный интеллект и Инфорсеров... Это означает Антиох, проект д-ра Аосте.)"
      - "(А еще это нападение на грузовое судно. Они опустили подробности...)"
      - "(Кажется, можно с уверенностью предположить, что Антиох атаковал «Полтаву» и навредил невинным людям.)"
      - "(Другими словами, они поставили под угрозу безопасность мирового океана, что побудило Революционный фронт нанести ответный удар.)"
      - "Мисс D, ты помнишь, о чем это воспоминание?"
  - char: "miss_d"
    side: "right"
    text:
      - "Нет, ничего! Но это явно что-то плохое! Плохое, и мне это не нравится!"
  - char: "queen_elizabeth_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "...Тут мы солидарны."
  - char: "mogador"
    side: "right"
    text:
      - "Звучит так, будто с этим островом связаны как Союз Орла, так и Королевский Флот."
      - "Эти требования были довольно сумасшедшими... Они хотят, чтобы ученые выдали этих людей, разоружили своих юнитов и уничтожили лабораторию — и всё это за три часа."
      - "За это время можно было бы выполнить, может, два из них, но все три? Ни за что."
  - char: "fleuret"
    side: "left"
    text:
      - "Думаю, они с самого начала собирались применить силу в любом случае."
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Я вижу тебя по камерам видеонаблюдения, Командир! Что ты делаешь на Самосе?"
  - char: "queen_elizabeth_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Что за...?!"
  - char: "commander"
    side: "right"
    text:
      - "(Тс-с! Я с этим разберусь!)"

chapter5:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Кхм. Д-р Анзил?"
  - char: "anzeel_rad"
    side: "left"
    text:
      - "Да, это мое имя! Аосте уже смылся, так почему ты вернулся сюда?"
  - char: "commander"
    side: "right"
    text:
      - "Ты знаешь о нападении на «Полтаву»? Революционный фронт уже на пороге острова, готовый отомстить за это."
  - char: "anzeel_rad"
    side: "left"
    text:
      - "Да, я знаю о том, что уже несколько дней не сходит с первых полос мировых газет!"
      - "Ты всерьез в это веришь? Что Антиох нарушит протокол и нападет на проходящее мимо гражданское грузовое судно?"
  - char: "commander"
    side: "right"
    text:
      - "(Это звучит в точности как то, что сделали бы известные нам Сирены...)"
      - "(Учитывая всё, чему мы были свидетелями, это определенно не выходит за рамки возможного... как бы тяжело мне ни было говорить ей это.)"
  - char: "anzeel_rad"
    side: "left"
    text:
      - "«Месть», черта с два... Они просто хотят, чтобы ты так думал."
      - "Нападение было операцией под чужим флагом, организованной Революционным фронтом. Им нужен был предлог, чтобы отправить флот на Самос."
      - "Демон Лапласа почти завершен, и они хотят его украсть."
  - char: "commander"
    side: "right"
    text:
      - "(Демон Лапласа?)"

chapter6:
  rows:
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "Если мы примем этот план, может появиться шанс на успех."
      - "Однако мы должны гарантировать, что генератор помех будет работать как можно дольше. Тем временем нам придется держать оборону, пока проводится эвакуация."
      - "Другими словами..."
  - char: "nop"
    side: "right"
    status: "is-yellow"
    text:
      - "Мы уже знаем это, д-р Аосте. Мы взяли на себя задачу выстроить работу на этой основе."
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "...Понимаю. Но даже в этом случае все уже понесли тяжелые потери. Фактическую осуществимость предоставленных вами сроков всё еще необходимо тщательно оценить..."
      - "Если «Свет Зари» когда-либо погаснет, то Демон Лапласа перестанет существовать. Если к тому времени мы не достигнем порога эвакуации, наши будущие оперативные планы окажутся под угрозой."
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "Не беспокойся. Я тоже помогу выиграть для тебя время."
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "Кхм. Д-р Анзил?"
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "В процессе командования операцией я передала слишком много сообщений, и, вероятно, они уже определили меня как цель для уничтожения."
      - "Пока я могу продолжать привлекать их внимание, я смогу ослабить давление в других местах, что даст вам больше времени на реализацию плана."
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "Но что тогда будет с тобой?"
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "После такого фиаско кто-то всегда должен нести ответственность. Вот только теперь осталось не так много людей, способных взвалить на себя это бремя."
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "Понимаю... Ты также можешь взять с собой своих кансен. Однако я бы хотел, чтобы Код G сопровождала моего Антиоха, если это возможно."
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "Очень хорошо. Ты можешь забрать Энтерпрайз и всех остальных, кому удастся выжить."
      - "Однако увези их как можно дальше от Нью-Йорка. И никогда не позволяй им возвращаться сюда."
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "...Без тебя я не уверен, что смогу их контролировать..."
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "Что случилось с вечно мудрым и невозмутимым Магистром? У тебя нет иного выбора, кроме как дать этим детям цель и связанную с ней ответственность, не так ли?"
      - "...Даже после того, как ты «предал» нас, я всё ещё верю, что мы сходимся во взглядах. И я считаю, что то, что ты делаешь — справедливо. Я полностью понимаю тебя и верю, что в глубине души они тоже тебя понимают..."
      - "Уверена, им понадобится время, чтобы принять это, но однажды они поймут тебя..."
      - "Да, я в этом уверена..."

chapter7:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Это то, что я слышал, когда был в Святилище Арканы. Так вот к чему относился тот разговор?)"
      - "То есть Революционный фронт хочет украсть вашу машину времени — Демона Лапласа. Федерация знает об этом?"
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Конечно знает. Они вообще зашли так далеко только потому, что у РФ было негласное разрешение Федерации."
      - "Федерация хочет, чтобы РФ сделал первый шаг и обострил ситуацию. Таким образом, им не придется брать на себя вину за развязывание войны."
  - char: "commander"
    side: "left"
    text:
      - "Погоди... Развязывание войны?"
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Да. Войны, которая сотрет их из времени."
      - "Захвати власть над временем, и весь мир станет твоим."

chapter8:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Боже мой..."

chapter9:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Они собираются начать Мировую войну..."

chapter10:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Но это же безумие!"

chapter11:
  rows:
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Не паникуй. У нас с Аосте уже есть план."
      - "«Факел» — то есть Энтерпрайз и компания — нагрянут без предупреждения, выкрадут Демона Лапласа и заставят обе стороны поостыть."
  - char: "commander"
    side: "left"
    text:
      - "Энтерпрайз? Ты имеешь в виду... Код G?!"
  - char: "anzeel_rad"
    side: "right"
    text:
      - "Слушай, мы уже достаточно поболтали, а этот остров вот-вот превратится в зону боевых действий! Тебе нужно убираться отсюда ПРЯМО СЕЙЧАС!"
  - text:
      - "Коммуникатор замолкает."
  - char: "commander"
    side: "left"
    text:
      - "(Напряжение между двумя главными игроками в альфа таймлайне вот-вот выльется в полномасштабную войну.)"
      - "(Но если план Анзил и Аосте увенчается успехом и Демон Лапласа не достанется ни одной из сторон, то это воспоминание не будет иметь ничего общего со смертью.)"
      - "(Так что же, черт возьми, здесь произойдет?)"
  - char: "mogador"
    side: "right"
    text:
      - "Команди-и-ир. Кто это была? Ты её знаешь?"
  - char: "commander"
    side: "left"
    text:
      - "Согласно воспоминанию, в котором мы находимся — да. А почему ты спрашиваешь?"
  - char: "mogador"
    side: "right"
    text:
      - "Потому что... она связалась с тобой, используя закрытую частоту Трибунала."
      - "Все участники этой миссии, включая Элизабет, тоже её используют."
      - "Эта частота из НАШЕГО таймлайна, так откуда эта женщина узнала о ней и связалась с нами так, будто это самое естественное дело в мире?"
  - char: "commander"
    side: "left"
    text:
      - "(А ведь она права... Я так привык к тому, что наши каналы связи постоянно глушат или перехватывают, что перестал задаваться этим вопросом.)"
  - char: "miss_d"
    side: "right"
    text:
      - "Как она это сделала — неважно!"
      - "Разве ты её не слышал? Нам нужно убираться отсюда, и побыстрее!"
  - char: "commander"
    side: "left"
    text:
      - "Для этого уже слишком поздно. Если это воспоминание действительно является воплощением смерти, план Анзил и Аосте провалится."
  - char: "miss_d"
    side: "right"
    text:
      - "А? Откуда ты знаешь?"
  - char: "commander"
    side: "left"
    text:
      - "Потому что если бы он увенчался успехом, это пространство вообще бы не существовало."
