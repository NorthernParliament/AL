chapter1:
  rows:
  - char: "noshiro"
    side: "left"
    text:
      - "Этот ритуал проводится только тогда, когда нашей Империи угрожает кризис... Никогда не думала, что однажды МЫ будем его проводить."
  - char: "ryuuhou"
    side: "right"
    text:
      - "Да. Когда наступают самые темные времена, именно тогда сила госпожи Синано важнее всего."
      - "Она — наш символ надежды, и если мы сможем убедить ее еще и провести этот ритуал..."
      - "Тогда я уверена, наша Империя найдет верный путь, рассеет тьму и восстановит свет."
  - char: "noshiro"
    side: "left"
    text:
      - "Хоть я тоже на это надеюсь, этот ритуал — огромное бремя для госпожи Синано."
  - char: "ryuuhou"
    side: "right"
    text:
      - "Это так. Вот почему мы, как участники ритуала, должны сделать все возможное, чтобы хоть немного облегчить ее ношу."
  - char: "noshiro"
    side: "left"
    text:
      - "А также постараться не быть для нее обузой."
      - "Теперь я бы хотела, чтобы ты подготовила танец для участниц, а также решила, как проводить поединки."
      - "И Суруга... Ты в порядке? Ты что-то слишком тихая."
  - char: "suruga"
    side: "right"
    text:
      - "А? Да, эм, я в полном порядке."
  - char: "noshiro"
    side: "left"
    text:
      - "Тебе не стоит так нервничать. Мы все делаем это вместе. Если у тебя есть какие-то мысли, я бы хотела их выслушать."
  - char: "suruga"
    side: "right"
    text:
      - "Ну, э-э... Исполнять танец перед ритуалом — не совсем наша работа, не так ли?"
  - char: "noshiro"
    side: "left"
    text:
      - "...Верно. Пойду еще раз всё осмотрю."
  - char: "ryuuhou"
    side: "right"
    text:
      - "Танец — ЭТО часть ритуала. Мы должны вложить в него не меньше усилий, чем во всё остальное."
      - "Раз уж мы должны это сделать, стоит постараться проявить энтузиазм."
  - char: "suruga"
    side: "left"
    text:
      - "Лично я просто хочу, чтобы ритуал закончился без происшествий."

chapter2:
  rows:
  - char: "shinano"
    side: "left"
    text:
      - "(Это... Диадема Света?)"
      - "(Еще мгновение назад я была в столице Ортодоксии... Как же так?)"
      - "(Ах... Это еще один сон...)"
      - "(Я помню... Пока я спала, они готовили ритуал.)"
      - "(Я не могу ни говорить, ни двигаться... Как не могла и в тот день...)"

chapter3:
  rows:
  - text:
      - "*тук-тук*"
  - char: "kinu"
    side: "left"
    text:
      - "Рюхо, команда Акаги прибудет с минуты на минуту."
  - char: "noshiro"
    side: "right"
    text:
      - "Пришло время действовать, Рюхо."
  - char: "ryuuhou"
    side: "left"
    text:
      - "...Да, конечно."
      - "Этот ритуал решит будущее Империи Сакуры."
      - "Как представители нашей великой земли, мы не имеем права на ошибку!"
      - "А теперь всем занять свои места!"
  - char: "all"
    side: "right"
    text:
      - "Вас поняли!"
  - char: "ryuuhou"
    side: "left"
    text:
      - "После стольких лет страданий... Нет, мы тренировались ради этого самого момента, и пришло время показать всему миру нашу мощь!"

chapter4:
  rows:
  - char: "shinano"
    side: "left"
    text:
      - "В тот день я тоже стала свидетельницей ритуала в своих снах..."
      - "Однако, хотя общая картина была верна, детали расходились."
      - "Ах, я ведь просто в своей спальне..."
      - "Так почему же тогда я чувствую себя такой одинокой?"

chapter5:
  rows:
  - text:
      - "Багровый, алый, киноварный. Красный цвет, пульсирующий повсюду."
  - char: "shinano"
    side: "left"
    text:
      - "...Священная Сакура увяла. Острова Мидзухо объяты пламенем."
      - "...Сон, влекущий к гибели, и красный цвет, обращающий всё в пепел."
      - "...Почему?"
      - "...Я должна пробудиться и рассказать остальным об этих предзнаменованиях..."
      - "...Почему я не могу? Почему я чувствую себя такой бессильной?"
  - text:
      - "Красные сполохи подступали всё ближе. Сон распадался на части, рассыпался, рушился."
  - char: "shinano"
    side: "left"
    text:
      - "...Ах... Даже в моих снах у меня отнимают мой дом..."
      - "...Всё такая же одинокая и слабая... Я совсем не изменилась..."
      - "...Мне не остается ничего, кроме как покориться судьбе и идти по этому пути..."
      - "...Но, возможно... это не так уж и плохо..."
  - text:
      - "Синано смотрела прямо на красное зарево, не помышляя ни о бегстве, ни о том, чтобы сдаться."
  - char: "shinano"
    side: "left"
    text:
      - "Если ты хочешь обратить в пепел то, что стоит за мной, тебе сначала придется испепелить меня!"

chapter6:
  rows:
  - text:
      - "И как раз в тот момент, когда пламя было готово поглотить её, раздался звон ветряного колокольчика."
