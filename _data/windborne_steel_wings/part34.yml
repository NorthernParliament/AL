chapter1:
  rows:
  - text:
      - "Синее небо, синее море и сверкающие волны, насколько хватало глаз. Это был ещё один обычный, мирный день."
  - char: "aquila"
    side: "left"
    text:
      - "М-м-м. Такая чудесная погода."
      - "Так и хочется выйти в море и попрактиковаться в построении с моими самолётами. Кто-нибудь пойдёт посмотреть?"
  - char: "carabiniere"
    side: "right"
    text:
      - "Позволь мне сопровождать тебя в качестве эскорта!"
  - char: "leonardo_da_vinci"
    side: "left"
    text:
      - "Да, я тоже пойду! Я как раз собиралась испытать новый планер, который я изобрела."
  - char: "torricelli"
    side: "right"
    text:
      - "Хе-хе-хе... Идите, девочки, развлекайтесь... А я останусь прямо здесь..."
  - char: "leonardo_da_vinci"
    side: "left"
    text:
      - "Конечно, мы... Эм, а что это там в небе?"

chapter2:
  rows:
  - text:
      - "Чёрное солнце, тихо горящее в сумеречном небе."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Кхм. Это Венето. Вы меня слышите? Я говорю с вами не совсем обычным способом."
  - char: "leonardo_da_vinci"
    side: "right"
    text:
      - "Чёрное солнце... Я помню его! Это то самое концептуальное оружие, которое использовала Марко Поло!"
  - char: "carabiniere"
    side: "left"
    text:
      - "Та самая штука?! О нет... Только не говорите мне, что кто-то пытается вызвать ещё одно событие наложения!"
  - char: "aquila"
    side: "right"
    text:
      - "Значит, очевидно, что это не та, о ком мы думаем!"
      - "Ты! Ты всего лишь самозванка, называющая себя Венето! Кто ты на самом деле и чего хочешь?"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "А?! Но Аквила, это я... Витторио Венето."
  - char: "aquila"
    side: "right"
    text:
      - "Я тебе не верю. Марко Поло уже однажды пыталась провернуть этот трюк! Тогда это не сработало, и уж точно не сработает сейчас!"
      - "Что бы ты ни говорила, я тебе не поверю! Дамы, приготовьтесь к бою!"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Подожди, Аквила! Я знаю, ты, должно быть, сбита с толку, раз я так внезапно вас пробудила. Эм..."
      - "Пожалуйста, не руби с плеча. Просто сделай глубокий вдох вместе со мной... Это правда я, Венето. Я одолжила это концептуальное оружие, чтобы разрушить иллюзию и вытащить вас."
  - char: "leonardo_da_vinci"
    side: "right"
    text:
      - "Знаете, это ДЕЙСТВИТЕЛЬНО прозвучало в точности так, как сказала бы Венето..."
  - char: "aquila"
    side: "left"
    text:
      - "Думаешь?"
      - "Что это за «иллюзия», о которой ты говоришь? Я не понимаю, что ты имеешь в виду."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Разве вам не снились необычные сны? Может быть, вы сталкивались со странными людьми или замечали, что происходят странные вещи."
  - char: "torricelli"
    side: "left"
    text:
      - "Эм, нет? Самое странное, что случилось за последнее время, — это ты..."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Значит... там вообще не происходило ничего странного?"
      - "А что насчёт новостей из-за границы? Вы получали какие-нибудь звонки или необычные сообщения?"
  - char: "aquila"
    side: "left"
    text:
      - "Нет. Все наши сеансы связи с Римом и близлежащими флотами были совершенно нормальными."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "(Неужели иллюзии совершенно не повлияли на нашу страну?! Этого просто не может быть!)"
      - "(О, я поняла! Виновник так испугался славы Сардинии, что не посмел нас тронуть!)"
      - "(Да, это всё объясняет!)"
