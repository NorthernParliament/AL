chapter1:
  rows:
  - text:
      - "План Империи Дракона состоит в том, чтобы уничтожить Шторм. Поэтому они дали своей операции кодовое название «Ледяной Дракон, сокрушающий ветер»."
      - "Эта операция готовилась долгое время. Командование по всей Империи сейчас завершает последние приготовления."
      - "Включая меня, того, кто возглавит флот."
      - "Однако есть одна вещь, которая не даёт мне покоя."
  - char: "commander"
    side: "left"
    text:
      - "(Согласно брифингу, даже несмотря на то, что Шторм усилился, у Империи хватит сил, чтобы подавить его.)"
      - "(Если они преуспеют, то наконец-то вернут себе прямой выход к морю.)"
      - "(Но моё дурное предчувствие подтвердилось. Тихий Океан погрузился в хаос.)"
      - "(Империя может оказаться под перекрестным огнем, если продолжит операцию, находясь в неведении.)"
  - char: "memphis"
    side: "right"
    text:
      - "Поскольку шторм усилился, получить информацию о том, что происходит за пределами Империи, практически невозможно."
      - "По крайней мере, благодаря тебе мы установили связь с базой Северного Парламента на острове Карагинский."
      - "Кстати говоря, на линии Советский Союз. Она хочет поговорить с тобой."
  - char: "commander"
    side: "left"
    text:
      - "Союз?.. Что она делает в Тихом Океане?.."
      - "Соедини меня с ней."

chapter2:
  rows:
  - char: "sovetsky_soyuz_rad"
    side: "right"
    text:
      - "Какое облегчение видеть, что ты в порядке, товарищ Командир."
      - "Я не ожидала, что мы снова встретимся при таких обстоятельствах, но вот мы здесь."
  - char: "commander"
    side: "left"
    text:
      - "Что ты делаешь в такой дали?.. Что-то случилось дома?.."
  - char: "sovetsky_soyuz_rad"
    side: "right"
    text:
      - "Что ж, я уверена, ты уже знаешь об иллюзии, поразившей Европу."
      - "По всей Европе появились пространственные области, способные вызывать массовые, широкомасштабные иллюзии."
      - "Эти области увеличиваются в размерах, но, к счастью, те, кто очнулся от иллюзии, способны в какой-то мере выбраться оттуда самостоятельно."
      - "Однако, поскольку их рост невозможно остановить, мы перенесли нашу цепочку командования на эту сторону планеты."
      - "Мы отдали приказ всем нашим флотам также передислоцироваться, но немного опоздали. Лишь около 50% наших сил успели перебраться вовремя."
      - "К счастью, некоторые из наших активов и девушек-кораблей находятся вне зоны действия этих областей — это наш Арктический флот, корабли прототипы и наши исследовательские группы."
      - "В целом, я бы сказала, что Северный Парламент всё ещё держит кризис под контролем."
      - "Будь уверен, мы перейдём в контратаку, как только наше расследование этих областей будет завершено."
      - "Кроме того, я должна передать тебе кое-что ещё."
      - "Ят Сен сказала мне, что ты хочешь знать, что происходит в Тихом Океане."
      - "Северный Парламент готов поделиться имеющейся у него информацией."
      - "По данным нашего оборонительного флота, дислоцированного на Алеутских островах, в настоящее время бои идут по всему Тихому Океану."
      - "Империя Сакуры перешла в наступление, в то время как у Союза Орла есть флот, движущийся к Маршалловым Островам."
      - "Наша разведка также утверждает, что сакуранцы уже вступили в бой на Соломоновых и Маршалловых Островах."
      - "Как ты можешь себе представить, всё не так однозначно."
      - "Тем временем в Союзе Орла была потеряна связь с DC и базами в SD и Нью-Йорке почти в то же время, когда появились иллюзорные пространства."
      - "Учитывая происходящее в Европе, можно с уверенностью предположить, что Союз Орла также подвергся воздействию иллюзий."
      - "Боюсь, я не могу отправить силы напрямую в Тихий Океан, чтобы проверить эту информацию, поскольку ситуация и так сложная."
      - "И всё же, надеюсь, эти разведданные будут тебе хоть чем-то полезны."
  - char: "commander"
    side: "left"
    text:
      - "Это очень поможет."
  - char: "sovetsky_soyuz_rad"
    side: "right"
    text:
      - "Пожалуйста. Надеюсь, твоя операция пройдёт успешно."
  - text:
      - "Я вешаю трубку и начинаю обдумывать информацию, которую она мне только что дала."
  - char: "commander"
    side: "left"
    text:
      - "(Она сказала, что всё под контролем, но очевидно, что они находятся в таком же кризисном положении, как и все мы.)"
      - "(И всё же хорошо знать, что они более-менее в порядке.)"
      - "(Что касается Союза Орла, я знаю, что Энтерпрайз и её товарищи сейчас в Тихом Океане. Я знаю, что они отлично справятся.)"
      - "(Судя по последнему отчёту, который я получил из Европы, Синано и Клемансо пытаются создать концептуальное оружие, чтобы развеять иллюзии.)"
      - "(Хотя это вряд ли решит кризис одним махом, это может пойти на пользу Союз, если окажется, что ей нужна помощь.)"
      - "(А ещё есть Империя Сакуры... Я так и не получил о них никаких разведданных.)"
      - "(Однако им придётся подождать. Операция «Ледяной Дракон, сокрушающий ветер» на первом месте.)"
      - "(Сирены, должно быть, заметили, что мы готовимся. Битва будет ожесточённой.)"
      - "(Пока я сосредоточусь на этой операции, а потом буду решать проблемы по мере их поступления.)"
