chapter1:
  rows:
  - char: "shimanto"
    side: "left"
    text:
      - "Змей-сикигами, рази, словно зимняя луна!"
  - text:
      - "БАБАХ!!!"
  - char: "enterprise"
    side: "left"
    text:
      - "Нагато! Ты в порядке?!"
  - char: "indiana"
    side: "right"
    text:
      - "Я так и знала! У этого проклятого места есть скрытый второй слой!"
      - "Мы более-менее развеяли иллюзию на всех остальных островах, но этот по какой-то причине остался!"
      - "Хорошо, что мы пришли проверить вас! И ещё лучше, что мы не опоздали!"
  - char: "shimanto"
    side: "left"
    text:
      - "Прости меня, госпожа Нагато! Разрушение барьера заняло некоторое время."
  - char: "hiei"
    side: "right"
    text:
      - "Встань за нами, лиса-хранительница!"
  - char: "amagi"
    side: "left"
    text:
      - "Надо же, вы прибыли так быстро."
  - char: "nagato"
    side: "right"
    text:
      - "Забудьте обо мне! Обрушьте на этого злого духа всё, что у вас есть!"
      - "Она крайне опасна! Мы должны уничтожить её здесь и сейчас!"
  - text:
      - "За время этого короткого обмена репликами Нагато поняла, кем на самом деле была их противница."
      - "Она ощутила в ней ту же ауру, что исходила от фрагмента Ватацуми. Ту самую коррозию, которая сгноила Изначальную Сакуру."
      - "Это была не Амаги — это была Тень Коррозии."
      - "Коррозия, над очищением которой так усердно трудились Мусаси и Великий Мудрец, не только вернулась, но и казалась ещё сильнее, чем была в святилище."
  - char: "nagato"
    side: "right"
    text:
      - "(Союз Орла с нами! Нам нужно лишь остановить этого злого духа, истощить её силу и изгнать её ещё раз...)"
      - "(Нет! Проклятье! Её не остановить обычными атаками! Сила, которой она только что щеголяла, была лишь уловкой, чтобы заманить меня поближе!)"
  - text:
      - "К тому времени, когда Нагато наконец осознала, что неосторожно приблизилась к стволу увядшей Изначальной Сакуры, было уже слишком поздно."
      - "В следующее мгновение массивная сущность, сидевшая на мертвой ветви, ринулась вниз, чтобы атаковать её."
  - char: "nagato"
    side: "right"
    text:
      - "НЕТ!"
  - char: "hiei"
    side: "left"
    text:
      - "ГОСПОЖА НАГАТО!"
  - char: "nop_x1"
    side: "right"
    text:
      - "▊▇ ▊▇■■■▊▇ ▊▇ ▊▇ ■■■■▋▌▊▎▇"

chapter2:
  rows:
  - text:
      - "Прямо перед тем, как поток чёрного тумана смог поглотить её, кто-то выскочил вперёд, чтобы защитить её."

chapter3:
  rows:
  - text:
      - "Это была Хиэй — или, скорее, она выглядела как Хиэй. Тёмный дракон проглотил её вместо Нагато, а затем взмыл в небо."
      - "Мгновение спустя всё исчезло. Самозванка Амаги, Тень Коррозии и девушка, пожертвовавшая собой ради Нагато."
