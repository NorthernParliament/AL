chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "memphis"
    side: "left"
    text:
      - "Командир, мы теряем серийные корабли со всё возрастающей скоростью."
      - "Сирены развернули модели Типа IV. Вот, мы сделали снимок одной из них."
      - "Она наполовину погружена в воду, но, возможно, она находится там уже довольно давно."
  - char: "commander"
    side: "right"
    text:
      - "Подожди, Тип IV?.."
      - "(Я знаю её. Это редкая модель, которая упоминалась в файлах Бисмарк и появлялась во время операции «Ледяной дождь».)"
      - "(Их здесь больше, чем мы когда-либо видели раньше.)"
      - "(Чкалов говорила мне, что они являются серьёзным улучшением по сравнению с предыдущей моделью, как и следовало ожидать.)"
      - "(Тот факт, что они атакуют в таких больших количествах, делает их только ещё более опасными.)"
      - "(Империя сильно зависит от своих серийных кораблей из-за того, что у них мало девушек-кораблей.)"
      - "(Хотя наши серийные корабли могут справиться с их Типом III, Тип IV — это куда более сложная задача.)"
      - "(Мы будем втянуты в затяжную и проигрышную битву, если продолжим сражаться подобным образом.)"
      - "(Наша главная надежда — как можно скорее перегруппироваться с Северным Парламентом.)"
  - char: "an_shan_rad"
    side: "left"
    text:
      - "Командир, они бросили в бой Тип IV. Наши серийные корабли несут тяжёлые потери."
      - "Однако у меня есть план. Мы разбомбим врага, используя наши «Дунъюй»."
      - "Модели Типа IV могут быть сильны, но даже они не переживут залпа кассетных ракет!"
  - char: "commander"
    side: "right"
    text:
      - "Ты уверена, что это сработает?.."
  - char: "an_shan_rad"
    side: "left"
    text:
      - "Уверена! Мы собрали разведданные о Типе IV и провели боевые симуляции ещё на базе, чтобы проверить эту теорию."
      - "Доверься мне! Это сработает!"
