chapter1:
  rows:
  - char: "indiana"
    side: "left"
    text:
      - "Энтерпрайз, я прочесала местность, но ничего не нашла."
  - char: "enterprise"
    side: "right"
    text:
      - "Значит, нам придётся расширить зону поиска."
  - char: "herring"
    side: "left"
    text:
      - "Вы займитесь этим! А мы с другими подлодками пойдём осмотримся!"
  - char: "shimanto"
    side: "right"
    text:
      - "Госпожа Нагато, я обыщу иллюзию изнутри ещё раз."
  - char: "bell"
    side: "left"
    text:
      - "Позволь мне тебе помочь!"
  - char: "nagato"
    side: "right"
    text:
      - "Хватит уже. Я объявляю о прекращении поисков."
  - char: "shoukaku"
    side: "left"
    text:
      - "Что?! Почему?"
  - char: "nagato"
    side: "right"
    text:
      - "Их здесь нет. Она использовала Священную Сакуру, чтобы переместиться в другое пространство."
      - "Одно дело, если бы пространство Священной Сакуры ограничивалось только Островами Сакуры. Но раз уж оно растянуто на весь мир, нет смысла обыскивать это место вдоль и поперёк."
  - char: "pittsburgh"
    side: "left"
    text:
      - "Погоди, то есть ты хочешь сказать, что она похитила Хиэй и просто куда-то телепортировалась?"
  - char: "nagato"
    side: "right"
    text:
      - "Да. Перемещение с помощью Священной Сакуры было нашим строго охраняемым секретом. Мне нет нужды утаивать это знание теперь, когда вы сами стали тому свидетелями."
      - "(Я поклялась защищать их. Их всех. И всё же моя собственная беспечность привела к тому, что Хиэй похитили прямо у меня на глазах...)"
      - "(Нет, успокойся. Всё будет хорошо.)"
      - "(Тот дух, похожий на Амаги, охотился за мной. Она должна была вернуться, чтобы закончить начатое...)"
      - "(И тем не менее, вместо того чтобы попытаться снова после захвата Хиэй, она просто исчезла и с тех пор не возвращалась.)"
      - "(Это вызывает у меня очень, очень дурное предчувствие.)"
      - "(Мне нужно...)"
      - "(Нет. Успокойся. Ты не можешь позволить себе снова потерять самообладание.)"
      - "(А пока пришло время отвоевать Маршалловы Острова и встретиться с Командиром!)"

chapter2:
  rows:
  - text:
      - "Нагато сделала несколько глубоких, успокаивающих вдохов, затем снова положила руку на ствол фальшивой Изначальной Сакуры."
  - char: "nagato"
    side: "right"
    text:
      - "(Вот оно. Здесь находится ещё один фрагмент Ватацуми. Я также ощущаю коррозию.)"
      - "Рассыпься в прах."

chapter3:
  rows:
  - text:
      - "Лишившись своего уничтоженного ядра, иллюзия Маршалловых Островов в одно мгновение рассыпалась на части."
      - "Чёрные суда за пределами иллюзии также дезинтегрировались, так как их источник энергии был уничтожен."
      - "Наконец, битва за Маршалловы Острова завершилась победой девушек-кораблей."
