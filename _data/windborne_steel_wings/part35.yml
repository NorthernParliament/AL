chapter1:
  rows:
  - text:
      - "В убежище Трибунала девушки-корабли, пробудившиеся от сна, проводили собрание."
  - char: "clemenceau"
    side: "left"
    text:
      - "Элизабет и Венето постепенно развеивают иллюзии по всей Европе. Остался только Северный Парламент."
  - char: "richelieu"
    side: "right"
    text:
      - "Ах, они... Я слышала, что Союз перенесла систему командования в Тихий Океан."
      - "Этот шаг кажется продуманным. Думаю, нам стоит воздержаться от применения нашего концептуального оружия на их кансен."
  - char: "bismarck_z"
    side: "left"
    text:
      - "Тогда следующая тема. Я получила разведданные о том, что прояснились некоторые обстоятельства, стоящие за иллюзиями."
      - "Не стоит ходить вокруг да около — в этом инциденте сыграли свою роль фрагменты Ватацуми."
  - char: "shinano"
    side: "right"
    text:
      - "Нужно отметить, что у Империи Сакуры не было планов ни на какие подобные инциденты..."
  - char: "bismarck_z"
    side: "left"
    text:
      - "Никто не подозревает твою страну. Подозревают Акаги."
  - char: "shinano"
    side: "right"
    text:
      - "Акаги?.."
  - char: "bismarck_z"
    side: "left"
    text:
      - "Позвольте мне ввести вас в курс дела. Многие сообщали, что видели в своих снах кого-то под именем «Амаги»."
  - char: "richelieu"
    side: "right"
    text:
      - "Амаги. Головной корабль своего класса и сестра Акаги."
  - char: "bismarck_z"
    side: "left"
    text:
      - "Верно. Мы с Фридрих однажды наводили о ней справки. Что касается нашей беседы, Амаги мертва."
      - "Когда она ушла из жизни, это сильно повлияло на Акаги. Она была линейным крейсером и была модернезирована в авианосец."
  - char: "richelieu"
    side: "right"
    text:
      - "Погоди, Амаги... умерла?.."
  - char: "bismarck_z"
    side: "left"
    text:
      - "Да. Она должна была стать главным претендентом на должность флагмана их Объединённого флота."
      - "К сожалению, она родилась с дефектом корпуса, который ослабил её тело. Становилось только хуже, пока в один прекрасный день это не оборвало её жизнь."
      - "На сегодняшний день она — единственный случай гибели девушки-корабля из-за дефекта корпуса."
      - "Акаги так тяжело перенесла потерю сестры, что какое-то время была безутешна."
      - "Когда ей стало лучше, она стала другим человеком. Она приобрела влияние наравне со своей сестрой и стала значимым лидером Империи Сакуры, наряду с Кагой."
      - "Вскоре после этого Империя Сакуры вступила в союз с Сиренами, а остальное вы уже знаете."
  - char: "shinano"
    side: "right"
    text:
      - "Амаги... Многие сакуране оплакивали её смерть..."
      - "И всё же память о ней со временем угасла... Сейчас мало кто может похвастаться тем, что отчётливо её помнит..."
  - char: "bismarck_z"
    side: "left"
    text:
      - "Но это ещё не всё, не так ли?.. Разве разговоры о ней не считались табу?.."
  - char: "shinano"
    side: "right"
    text:
      - "Считались... От этого она казалась лишь ещё более забытой... Я должна спросить — откуда ты всё это знаешь, Бисмарк?.."
  - char: "bismarck_z"
    side: "left"
    text:
      - "Как я уже говорила, Фридрих. Она много мне о ней рассказывала."
  - char: "richelieu"
    side: "right"
    text:
      - "Есть ли основания полагать, что дефект её корпуса был внедрён Сиренами?.."
  - char: "bismarck_z"
    side: "left"
    text:
      - "Этого нельзя исключать. Вот почему Акаги никогда не доверяла им до конца."
      - "Возможно, союз с Сиренами был для неё лишь средством достижения цели. Возможно, она хотела использовать их, как и мы."
  - char: "clemenceau"
    side: "right"
    text:
      - "Подводя итог: мало кто знает о настоящей Амаги, или о том, что она ушла из жизни."
      - "Поэтому, когда она появляется перед людьми в иллюзии, создаётся впечатление, что она на самом деле жива и здорова."
      - "Из этого мы можем сделать вывод, что цель Акаги — распространить в глобальном масштабе знание о том, что девушка-корабль, известная как Амаги, жива."
      - "Ватацуми способен воплощать идеи в жизнь, и Акаги хочет использовать эту силу, чтобы воскресить Амаги."
  - char: "richelieu"
    side: "left"
    text:
      - "Но как только девушка-корабль обретает форму, она не может оправиться от серьёзных повреждений корпуса..."
      - "Командир уже тоже пытается найти от этого лекарство. Зачем Акаги это делать?.."
  - char: "bismarck_z"
    side: "right"
    text:
      - "Если ей это удастся, это будет беспрецедентный прорыв. Однако риск крайне велик."
  - char: "richelieu"
    side: "left"
    text:
      - "Вернёмся к более насущным проблемам — Командир и Империя Дракона прямо сейчас сражаются в Тихом Океане. Думаю, мы должны им помочь."
  - char: "shinano"
    side: "right"
    text:
      - "Я согласна... Однако Тихий Океан, к несчастью, так далеко... Мы бы не успели, даже если бы отправились прямо сейчас..."
  - char: "clemenceau"
    side: "left"
    text:
      - "Я бы так не сказала. У нас ведь есть фрагмент Ватацуми, который мы можем использовать, не так ли?.."
