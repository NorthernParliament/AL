chapter1:
  rows:
  - text:
      - "Маршалловы Острова зловеще застыли на горизонте, контрастируя с трио приближающихся флотов."
      - "После сражения на Соломоновых Островах девушки-корабли поняли, что иллюзия, охватившая Маршалловы Острова, была гораздо, гораздо опаснее, чем предполагалось."
      - "Энтерпрайз, Нагато и её флот заняли атакующие позиции, в то время как Банкер Хилл перешла от обороны к наступлению, стараясь как можно сильнее отвлечь внимание врага."
      - "Тем временем флот Энтерпрайз разделился на более мелкие эскадрильи, каждая из которых атаковала один остров, прощупывая почву в попытках найти сердце иллюзии."

chapter2:
  rows:
  - text:
      - "Пели птицы, цвели цветы, а синие воды пересекались с зелёными горами. Это было похоже на картину, призывающую заблудиться в ней."
  - char: "ashigara"
    side: "left"
    text:
      - "Боже. Это место — услада для глаз."
  - char: "shoukaku"
    side: "right"
    text:
      - "Здесь так красиво — словно сон наяву. Слишком красиво, чтобы быть правдой."
  - char: "shimanto"
    side: "left"
    text:
      - "Госпожа Нагато, ты узнаёшь это место?.."
  - char: "nagato"
    side: "right"
    text:
      - "Да. Ошибиться невозможно."
  - text:
      - "Нагато огляделась, и её лицо приняло мрачное выражение."
  - char: "kongou"
    side: "left"
    text:
      - "Ты знаешь, что это за место?.."
  - char: "nagato"
    side: "right"
    text:
      - "Это святилище Изначальной Сакуры."
      - "Это строго охраняемое место, поэтому ожидаемо, что никто из вас его не узнаёт."
      - "(Если предположения кансен из Союза Орла верны, то эта иллюзия — проекция снов тех, кто в ней находится.)"
      - "(Предполагая, что иллюзия на Соломоновых Островах была моей проекцией, то чья же эта?..)"
      - "(Может быть, Ундзэн?.. Нет, не может быть. Она под защитой Ямато.)"
      - "(Тогда Мусаси?.. Крайне маловероятно. Она покинула Острова Сакуры, и у неё нет причин приходить сюда.)"
  - char: "hiei"
    side: "left"
    text:
      - "Госпожа Нагато, кажется, впереди кто-то спит."
  - char: "nagato"
    side: "right"
    text:
      - "Спят во сне, значит?.. Проводи меня к ним."

chapter3:
  rows:
  - text:
      - "У ручья стояла сакуранская беседка. Вокруг неё, на траве, крепко спали молодые девушки в сакуранских одеждах."
  - char: "kongou"
    side: "left"
    text:
      - "I-13, I-19, I-25, I-26, I-56, I-58, I-168..."
      - "Что наши подводные лодки здесь делают?.. Они же не могли все быть дислоцированы на Соломоновых Островах!"
  - char: "kawakaze"
    side: "right"
    text:
      - "Проснитесь! Откройте глаза!"
      - "Бесполезно. Они не просыпаются."
  - char: "hiei"
    side: "left"
    text:
      - "В беседке расстелен коврик для пикника и разбросаны закуски. Смею предположить, что они собирались устроить вечеринку с любованием цветами."
  - char: "harutsuki"
    side: "right"
    text:
      - "Госпожа Нагато, здесь кто-то ещё! Это Рюхо!"
  - char: "nagato"
    side: "left"
    text:
      - "Что?.. Рюхо?.."
      - "(Я могла бы поклясться, что она была в Диадеме Света... Если не там, то в Европе с Суругой и Носиро.)"
      - "(Акаги специально привела её сюда?.. Если да, то зачем?..)"
      - "(Беру свои слова обратно... Она явно под чарами иллюзии.)"
      - "(Бессмысленно было бы помещать её сюда, чтобы что-то сделать, только ради того, чтобы усыпить её.)"
  - text:
      - "Нагато и остальные двинулись дальше, исследуя иллюзию."
  - char: "nagato"
    side: "left"
    text:
      - "(Это не самозванка. Она настоящая Рюхо.)"
      - "(Как странно. Ни она, ни подводные лодки никогда не видели святилища Изначальной Сакуры.)"
      - "(Тогда, если никто из них не знает, как оно выглядит, кто же мог создать это место?..)"
      - "(Более того, если они потеряли сознание в иллюзии, будет ли она по-прежнему проецировать то, что у них в уме?..)"
      - "(Если цель состоит в том, чтобы заключить их здесь, то какая причина лишать их сознания?..)"
  - text:
      - "Сакуранки перенесли спящих девочек в безопасное место, а затем направились к иллюзорной Изначальной Сакуре."

chapter4:
  rows:
  - text:
      - "После спокойной прогулки, свободной от вражеских атак, девочки прибыли к подножию Изначальной Сакуры."
  - char: "nagato"
    side: "left"
    text:
      - "(Это дерево — сердце иллюзии — и причина, по которой иллюзия стала такой мощной.)"
      - "(В иллюзии на Соломоновых Островах я подобрала фрагмент Ватацуми.)"
      - "(Та иллюзия была всего лишь этим — иллюзией. Как и та Изначальная Сакура. Однако фрагмент Ватацуми был, несомненно, подлинным.)"
      - "(В этом фрагменте я ощутила коррозию. Слабую, но несомненную.)"
      - "(Великий Мудрец очистила Ватацуми от порчи, так почему же он снова осквернён?..)"
  - text:
      - "Нагато положила руку на Изначальную Сакуру и ощутила поток её энергии."
  - char: "nagato"
    side: "left"
    text:
      - "(Теперь я уверена. Именно эта Изначальная Сакура поддерживает иллюзию.)"
      - "(Однако, как ни странно, её аура проходит сквозь другие деревья в иллюзии и соединяется с внешним миром... Но зачем?..)"
      - "(О, нет... Иллюзия, должно быть, накачивает энергией врага снаружи!)"
      - "(Неудивительно, что она смогла сохранить свою форму, несмотря на Тень Коррозии...)"
      - "Враг скоро победит наших союзников из Союза Орла. Мы должны действовать быстро."
      - "Симанто, Конго, берите остальных и уничтожьте все деревья. Они посылают энергию кому-то за пределами иллюзии."
      - "Я же избавлюсь от этой фальшивой Изначальной Сакуры."
  - text:
      - "Отдав приказы, Нагато снова сосредоточилась на Изначальной Сакуре."

chapter5:
  rows:
  - text:
      - "Как только она это сделала, всё вокруг неё внезапно изменилось в мгновение ока."
  - char: "nagato"
    side: "left"
    text:
      - "(Она очень похожа на настоящую Изначальную Сакуру, внутри неё находится это пространство.)"
      - "(Я была права. Энергия дерева перетекает к остальным деревьям, которые затем перенаправляют её наружу.)"
      - "(Чтобы остановить поток, нужно уничтожить источник силы внутри этого грота. Само дерево просто восстановится, если его срубить.)"
      - "(Хитрая же ты лисица...)"
  - char: "amagi"
    side: "right"
    status: "is-red"
    text:
      - "Я знала, что ты придёшь, госпожа Нагато."
  - char: "nagato"
    side: "left"
    text:
      - "...Амаги. Это твоих рук дело?.."
      - "Я думала, коррозия Ватацуми загрязнила твою душу... И всё же на Соломоновых Островах ты хотела, чтобы я держалась в стороне от этого инцидента."
      - "У меня к тебе много, очень много вопросов."
      - "Проблема лишь в том..."
  - char: "amagi"
    side: "right"
    status: "is-red"
    text:
      - "Ты не знаешь, сколько от моей истинной сущности осталось. В этом дело?.."
  - char: "nagato"
    side: "left"
    text:
      - "……"
  - char: "amagi"
    side: "right"
    status: "is-red"
    text:
      - "Хи-хи. Понимаю. Когда мы говорили на Соломоновых Островах, я бы сказала, что от меня оставалось около 30%."
      - "Но теперь... Честно говоря, я и сама не уверена."
  - char: "nagato"
    side: "left"
    text:
      - "Вот как..."
  - text:
      - "Для Нагато Амаги была несчастной душой, рождённой с дефектным корпусом. Её уложили спать у подножия Изначальной Сакуры, молясь о её выздоровлении. Увы, коррозия Ватацуми отняла у неё даже надежду на то, что она когда-нибудь проснётся."
      - "Нагато знала об этом давно, но, услышав эти слова прямо из уст Амаги, она почувствовала тень грусти."
      - "Лишь 30% её всё ещё оставалось Амаги. И всё же она должна была высказать всё, что у неё на душе, той, кто за неё беспокоился."
  - char: "nagato"
    side: "left"
    text:
      - "(Я не сбегу... Больше нет.)"
      - "Амаги... Кто же ты такая?.."
  - char: "amagi"
    side: "right"
    status: "is-red"
    text:
      - "Я Амаги."
  - char: "nagato"
    side: "left"
    text:
      - "Правда?.."
  - char: "amagi"
    side: "right"
    status: "is-red"
    text:
      - "Правда. У меня её внешность, воспоминания, личность, образ мышления, даже её манеры."
      - "Амаги — это единственное, чем я являюсь."
  - char: "nagato"
    side: "left"
    text:
      - "Не говори подобных нелепостей. Амаги никогда бы не сделала того, что ты делаешь сейчас."
  - char: "amagi"
    side: "right"
    status: "is-red"
    text:
      - "Верно — я бы НИКОГДА не сделала ничего подобного в прошлом. Однако ты говоришь с моей будущей версией."
      - "Боюсь, человек, которого ты когда-то знала, и человек, стоящий здесь сейчас, — это разные люди."
  - char: "nagato"
    side: "left"
    text:
      - "Это ложь."
      - "Ты не Амаги и никогда ею не станешь."
      - "Ты не более чем двойник. Двойник, который поглотил её душу и, к сожалению, поддался злу."
      - "И я... Я остановлю тебя!"

chapter6:
  rows:
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "У меня было предчувствие, что так и будет."
      - "Как бы то ни было, я должна достичь своей цели."
      - "Меня не остановить. Ни тебе, ни кому-либо другому."
      - "Даже тебе — моя дорогая сестра Амаги!"
  - text:
      - "Тысяча сикигами взмыла в воздух, окрасив грот в розоватый цвет."
      - "Ярко вспыхнули заклинания и с грохотом прогремели пушки. Началась ожесточённая битва."
