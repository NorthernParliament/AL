chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
      - "С громким грохотом враги, стоявшие на пути сакуранок, были уничтожены, оставив после себя лишь немного обломков."
  - char: "kawakaze"
    side: "left"
    text:
      - "Госпожа Нагато, это то же самое, что и в наше прошлое столкновение. Точно такое же количество врагов, точно с того же направления."
  - char: "shoukaku"
    side: "right"
    text:
      - "Мы проходили здесь уже несколько раз. Я начинаю бояться, что нас заперли за другим, не иллюзорным барьером."
  - char: "nagato"
    side: "left"
    text:
      - "Если это барьер, у него должно быть уязвимое место. Симанто ищет его."
      - "Вы все должны держаться ближе ко мне, иначе поддадитесь обману иллюзии."
  - text:
      - "Сакуранский флот плыл вперёд по вишнёвым морям, окрашенным в чернильно-чёрный цвет."
  - char: "nagato"
    side: "left"
    text:
      - "(Я разрушила столько якорей, но нет никаких признаков того, что иллюзия рассеивается...)"
      - "(На самом деле, похоже, единственный эффект от разрушения этих якорей заключается в том, что иллюзия смещается и меняется.)"
      - "(Я предполагала, что эта иллюзия похожа на остальные... Неужели мы на самом деле вошли в тюрьму?..)"
      - "(И ещё эта Амаги... Что, если она не просто фантом, вызванный иллюзией?..)"
  - text:
      - "Нагато ломала голову, вспоминая багровую фигуру в лисьей маске, которая прошла мимо неё не так давно."
  - char: "nagato"
    side: "left"
    text:
      - "(Она что-то сказала, но я не могу вспомнить, что...)"
      - "(Я не стала слушать её, когда наши пути впервые пересеклись, полагая, что она лишь плод этой иллюзии.)"
      - "(И всё же я последовала за ней, когда она пошла вперёд, поскольку казалось, будто она ведёт меня...)"
      - "(Несмотря на мои опасения, по пути я действительно обнаружила эти якоря.)"
      - "(Оглядываясь назад, сопровождать её было безрассудно. Я позволила ей заманить меня...)"
      - "(Сюда, в это море со Священной Сакурой...)"
      - "(Подождите... Священная Сакура... Амаги?..)"
      - "(Вот оно! Теперь я понимаю!)"
      - "(ЭТО то, что Микаса просила меня расследовать!)"
      - "(Задержавшаяся душа Амаги кружила у корней Священной Сакуры, позволив её сознанию обрести форму...)"
      - "(Более того, радиус её влияния намного превышает барьер, охраняющий Священную Сакуру...)"
      - "(Обычно такое было бы невозможно... если только кто-то не использовал иллюзию, чтобы расширить владения Священной Сакуры даже за пределы Островов Сакуры.)"
      - "(Но как кто-то мог сделать такое?..)"
      - "(Я думала, что Великий Мудрец восстановила печать на Изначальной Сакуре, а затем Ямато унаследовала Ватацуми...)"
      - "(Если только... на самом деле бразды правления взяла не Ямато...)"
      - "(В этом дело?.. Так вот почему она пыталась предупредить меня?..)"

chapter2:
  rows:
  - char: "minazuki"
    side: "right"
    text:
      - "«Врата Небес будут открыты. Умоляю тебя присоединиться к нам, если это возможно, госпожа Нагато.»"
      - "«...Госпожа Нагато.»"
      - "«Немедленно отзови Дзуйкаку и держи Симанто рядом с собой.»"
      - "«Грядёт огонь, который сожжёт этот мир.»"

chapter3:
  rows:
  - char: "nagato"
    side: "left"
    text:
      - "(Огонь, который сожжёт этот мир?!)"
      - "(Какой же беспечной я была... Какой глупой!)"
      - "(Акаги... Твоё нежелание отпустить прошлое действительно толкает тебя на немыслимые поступки.)"
      - "(Я могу понять. Если бы корпус моей сестры был повреждён и едва мог поддерживать себя, я бы сделала всё, что в моих силах, чтобы спасти её.)"
      - "(Но это?.. Ты вообще знаешь, кого пытаешься воскресить?..)"
  - text:
      - "БАБАХ!!!"
      - "В этот самый момент залп снарядов обрушился на барьер Нагато, защищающий от иллюзий."
      - "На поверхности барьера прогремели взрывы, пустив по нему рябь."
  - char: "nagato"
    side: "left"
    text:
      - "Урх!"
  - char: "kawakaze"
    side: "right"
    text:
      - "Госпожа Нагато!"
  - char: "haguro"
    side: "left"
    text:
      - "Чёрт возьми... Им нет конца! Откуда они вообще лезут?!"
  - char: "shimanto"
    side: "right"
    text:
      - "Госпожа Нагато, позволь мне с этим разобраться!"
      - "Ты ещё не до конца восстановила свои силы. Перенапрягаться опасно!"
  - char: "nagato"
    side: "left"
    text:
      - "Нет! Я сделаю это!"
      - "Ты потратила слишком много своих сил на создание этих талисманов. Если кому здесь и нужно время на восстановление, так это тебе!"
  - char: "kongou"
    side: "right"
    text:
      - "Этого более чем достаточно, чтобы нам немедленно эвакуироваться! Симанто, ты уже нашла слабое место в барьере?.."
  - char: "shimanto"
    side: "left"
    text:
      - "Нашла! Идёмте за мной!"
  - char: "nagato"
    side: "right"
    text:
      - "Стоп! Обе!"
  - char: "shimanto"
    side: "left"
    text:
      - "Госпожа Нагато?.."
  - char: "nagato"
    side: "right"
    text:
      - "Эта иллюзия существует не только для того, чтобы сбить нас с пути. Священная Сакура вон там — её ядро."
      - "Это именно то, ради чего Микаса послала нас сюда!"
      - "Сменить курс! Мы направляемся в центр иллюзии!"
