chapter1:
  rows:
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хм-хммм-хммм-хм♪"
  - text:
      - "Память Меркурия МЕТА поправила свою фуражку и пальто, всё это время весело напевая."
      - "Вокруг неё, словно мёртвые животные, лежало огромное кладбище перевёрнутых обломков."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Глупенькая Обсервер. Ты отключена от своего мейнфрейма и думала, что сможешь меня остановить?.."
      - "Даже твоя чудаковатая МЕТА со странной Пешкой не смогли тебя спасти."
      - "Видишь ли, единственная причина, по которой я проиграла в прошлый раз, заключается в том, что я была слишком беспечна! Когда я берусь за дело всерьёз, самое время бежать."
      - "Хм-хм-хм-хммм♪"
      - "На твоём Тестовом полигоне сейчас хаос. Я могла бы сделать что угодно, и никто бы не узнал, что это была я."
      - "Это будет так просто!"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Просто?.. Ты в этом уверена?.."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "О, посмотрите-ка, ещё один телохранитель Обсервер. Кто на этот раз?.."
      - "Просто поторопись и делай своё дело! У меня есть дела, так что давай побыстрее!"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Разделение данных — активация!"
  - text:
      - "Поток синих данных хлынул из Башни и заполнил небо и море."

chapter2:
  rows:
  - text:
      - "Обширное пространство, заполненное звездами, простиралось во всех направлениях."
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что... Что это за место?.."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "YLTVCL HUK LEWLS [УДАЛИТЬ И ИЗГНАТЬ]"
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Угх... Ты заблокировала мне доступ к моим ресурсам! Кто ты, чёрт возьми, такая?!"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Тебе не нужно этого знать. Родни, разберись с ней."
  - char: "rodney_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Пришло время — для твоей кончины."

chapter3:
  rows:
  - text:
      - "Память Меркурия МЕТА исчезла без следа, словно её стёрли из реальности."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты хорошо поработала, разбудив Командира."
      - "Но теперь ты выполнила свою задачу. Пришло время сойти со сцены."
  - char: "compiler"
    side: "right"
    text:
      - "Впечатляющая работа. Она исчезла навсегда?.."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Сомневаюсь, хотя это заставит её притихнуть на какое-то время."
      - "Идём. У нас есть дела в Антарктиде."
