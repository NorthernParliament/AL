chapter1:
  rows:
  - text:
      - "С помощью дронов и самолётов, проникших через врата тории, девушки-корабли, дислоцированные у Панамского канала, смогли пробудиться от сна."
      - "Утопический мираж растворился в воздухе, и реальность вновь предстала перед ними."
  - char: "intrepid"
    side: "left"
    text:
      - "У меня всё ещё кружится голова..."
      - "Поверить не могу, что всё это время мы спали."
  - char: "casablanca"
    side: "right"
    text:
      - "Мы были совершенно не в курсе, от начала и до конца..."
      - "Что ж, я закончила осмотр с воздуха. Всё выглядит нормально. А что внутри наших комплексов?.."
  - char: "cooper_rad"
    side: "left"
    text:
      - "Я только что закончила их осматривать. Никаких аномальных записей в журналах данных или чего-то подобного!"
  - char: "bluegill_rad"
    side: "right"
    text:
      - "А я закончила поиски под водой. Докладывать не о чем!"
  - char: "intrepid"
    side: "left"
    text:
      - "Фух... Какое облегчение. Была бы катастрофа, если бы враг напал, пока мы спали наяву."
      - "Я всё ещё злюсь из-за того, что мы вообще на это купились! Они выставили нас посмешищем!"
      - "Когда я узнаю, кто это сделал, им мало не покажется!"
  - char: "kimberly_rad"
    side: "right"
    text:
      - "Это станция связи Киритимати. Панамский канал, как слышно?.."
  - char: "intrepid"
    side: "left"
    text:
      - "Это Интрепид. Слышу тебя громко и чётко. Вы выбрались без проблем?.."
  - char: "kimberly_rad"
    side: "right"
    text:
      - "Да. Мы пробудились от нашего сна с помощью Энтерпрайз и Фарго."
  - char: "intrepid"
    side: "left"
    text:
      - "Правда?.. У нас то же самое. Кстати, у вас есть какие-нибудь разведданные о враге?.."
  - char: "kimberly_rad"
    side: "right"
    text:
      - "Ну... Полагаю, это можно и так назвать."
      - "Это касается Памяти Меркурия МЕТА."

chapter2:
  rows:
  - char: "intrepid"
    side: "left"
    text:
      - "Это плохие новости..."
      - "Если она действительно направляется в Антарктиду, она определённо попытается вызвать ещё одно событие наложения!"
      - "И как раз в тот момент, когда у нас связаны руки, и мы не можем перебросить силы в Антарктиду..."
      - "Погоди, я поняла!"
      - "У дронов Фарго должна быть приёмная антенна. Фарго, приём?.."
  - char: "fargo_rad"
    side: "right"
    text:
      - "Слышу тебя, Панамский канал. Чем могу помочь?.."
  - char: "intrepid"
    side: "left"
    text:
      - "Мне просто было интересно — что ты будешь делать с дронами и самолётами, которых отправила нам?.. Уже собираешься забрать их обратно?.."
  - char: "fargo_rad"
    side: "right"
    text:
      - "Они выполнили свою миссию здесь, так что да, я возвращаю их, чтобы сэкономить топливо."
  - char: "intrepid"
    side: "left"
    text:
      - "Понятно. У тебя осталось ещё немного этих сакуранских талисманов?.."
  - char: "fargo_rad"
    side: "right"
    text:
      - "Да, есть немного лишних."
  - char: "intrepid"
    side: "left"
    text:
      - "Фантастика. Я надеялась, что ты сможешь срочно отправить несколько штук на базу на Огненной Земле!"
      - "Если хочешь сэкономить топливо, можешь просто вернуть свои самолёты, а мы дозаправим дронов. Я буду сопровождать дронов в Южную Атлантику своими собственными самолётами."
  - char: "fargo_rad"
    side: "right"
    text:
      - "Позволь мне сначала обсудить эту идею с Энтерпрайз."

chapter3:
  rows:
  - char: "fargo_rad"
    side: "right"
    text:
      - "Я вернулась. Энтерпрайз одобрила изменение маршрута."
      - "Это масштабный кризис, и Союз Орла никак не сможет справиться с ним в одиночку."
      - "В связи с этим я отправила ещё одно звено к флоту Королевского Флота, дислоцированному в Сиднее."
      - "Если сможешь, передай флотам в Южной Атлантике оставаться в режиме готовности, пока Королевский Флот не разберётся в ситуации."
  - char: "intrepid"
    side: "left"
    text:
      - "Принято!"
