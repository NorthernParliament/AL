chapter1:
  rows:
  - text:
      - "По мере приближения флота к Киритимати, тёмные облака над головой внезапно и мгновенно рассеялись."
  - char: "pittsburgh"
    side: "left"
    text:
      - "Ожидаемо. Погодная аномалия игнорирует законы природы. Фарго, что ты видишь на острове?.."
  - char: "fargo"
    side: "right"
    text:
      - "Ничего необычного. Мои разведывательные самолёты не видят никаких признаков боя, или, если уж на то пошло, кого-либо, кто к нему готовится."
  - char: "indiana"
    side: "left"
    text:
      - "Однако на наши вызовы они не ответили."
  - char: "fargo"
    side: "right"
    text:
      - "Это правда. Мой индекс уверенности в том, что эффект глушения был бы устранён на таком близком расстоянии, составляет 94,75%."
  - char: "indiana"
    side: "left"
    text:
      - "Тогда можно с уверенностью предположить, что у них тут всё так же плохо, как было у нас на Самоа."
      - "То, что мы видели собственными глазами, фотографии, сделанные разведывательным самолётом, море и небо, меняющиеся в мгновение ока — всё это указывает на то, что это место находится под воздействием иллюзии."
      - "Если Симанто не разбудила тех, кто здесь дислоцирован, есть большая вероятность, что остров уже захвачен."
  - char: "herring"
    side: "right"
    text:
      - "Тогда мы должны пойти туда и спасти их!"
  - char: "pittsburgh"
    side: "left"
    text:
      - "Да, но осторожно. Мы знаем, что иллюзия искажает само восприятие мира."
      - "Она может выставить нас врагами, как она заставила нас думать, что те враги были сакуранскими туристами."
      - "Если до этого дойдёт, нам просто придётся прилепить эти талисманы им на лбы."
      - "На нас это сработало, так что должно сработать и на них, верно?.."
  - char: "indiana"
    side: "right"
    text:
      - "Но как нам вообще к ним подобраться?.. Симанто использовала портал врат тории, а это не совсем стандартное снаряжение Союза Орла."
  - char: "herring"
    side: "left"
    text:
      - "Белл?.. Есть какие-нибудь идеи?.."
  - char: "bell"
    side: "right"
    text:
      - "Почему вы все постоянно обращаетесь ко мне?.. Я просто девушка, которая любит сакуранские фильмы и мангу!"
      - "Хотя, подождите, я ДЕЙСТВИТЕЛЬНО помню, как смотрела фильм, где они создавали портал."
      - "Они зажимали талисман между пальцами, а затем бросали его вперёд, выкрикивая что-то крутое. Это может сработать!"
  - text:
      - "Белл взяла один из талисманов и зажала его между пальцами, в точности как она видела в кино."
      - "Удивительно, но талисман начал пульсировать вишнёво-розовым светом с определённым ритмом, как будто он дышал."
  - char: "bell"
    side: "right"
    text:
      - "Э-это и правда сработало! Поверить не могу!"
  - char: "herring"
    side: "left"
    text:
      - "Не забудь крикнуть что-нибудь."
  - char: "bell"
    side: "right"
    text:
      - "Точно, да! Как насчёт... Сакуранский талисман, развей этот сон!"

chapter2:
  rows:
  - text:
      - "Талисман превратился в светящуюся стрелу и полетел над поверхностью воды."
      - "Она растворилась в воздухе, и на её месте появились врата тории."
  - char: "pittsburgh"
    side: "left"
    text:
      - "Так вот как они появились из ниоткуда. Надеюсь, они не против, что мы им подражаем."
  - char: "indiana"
    side: "right"
    text:
      - "Чёрт возьми, да! Отличная работа, Белл!"
  - char: "bell"
    side: "left"
    text:
      - "Не благодари меня, скажи спасибо Симанто за то, что дала нам эти талисманы."
  - char: "herring"
    side: "right"
    text:
      - "Тогда отличная работа вам обеим. Давайте пройдём через врата и спасём этих ребят!"
