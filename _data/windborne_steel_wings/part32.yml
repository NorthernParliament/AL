chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "nagato"
    side: "left"
    text:
      - "Раз твой проклятый коррозийный шторм исчез, ты больше не можешь двигаться, как тебе вздумается!"
      - "Сдавайся! Твой план провалился!"
  - text:
      - "«Дунъюй» успешно уничтожили коррозийный шторм — то самое, что поддерживало армию двойников Амаги. После этого Союз Орла с лёгкостью уничтожил их всех."
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Ты сейчас выглядишь такой внушительной, госпожа Нагато. Я удивлена."
  - char: "nagato"
    side: "left"
    text:
      - "Не смей говорить голосом Амаги, чудовище."
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Можешь думать что угодно, потому что — знаешь что?.. Я уже добилась своего."
  - char: "nagato"
    side: "left"
    text:
      - "«Добилась своего»?.. Ты лжёшь самой себе, что довольна созданием этих мерзостей."
      - "Думаешь, ЭТОГО хотела бы Акаги?.."
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Вовсе нет. Судьбы этих существ были предрешены в тот самый момент, когда они были созданы."
      - "Скажи мне, Нагато, когда ты смотришь на них, что ты видишь?.."
  - char: "nagato"
    side: "left"
    text:
      - "Стадо самозванцев, которым никогда, никогда не достичь истины."
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Интересно. Самозванцев кого именно?.."
  - char: "nagato"
    side: "left"
    text:
      - "Что значит «кого»?.."
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Ложь может существовать только тогда, когда существует истина. Подделки обязаны своим существованием оригиналу. На чьём корпусе они основаны, и где его владелица?.."
  - char: "nagato"
    side: "left"
    text:
      - "Владелица уже давно мертва!"
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Мертва?.. Правда?.. Почему?.."
      - "Закрой глаза и подумай об этом, пожалуйста. Разве ты не нашла способ исцелить болезнь Амаги?.."
  - char: "nagato"
    side: "left"
    text:
      - "О чём ты говоришь?.. Это был сон — видение, порождённое иллюзией."
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Сон, говоришь?.."
      - "Прямо сейчас ты в реальности. Но ты не можешь забыть воспоминания о том идеальном сне."
  - char: "nagato"
    side: "left"
    text:
      - "Ты ведь не серьёзно..."
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Там, где есть причина, есть и следствие, и наоборот."
      - "Самозванец — это следствие, оригинал — причина. Всё логично."
  - char: "nagato"
    side: "left"
    text:
      - "Нет... Ты внедрила в нас воспоминания, а затем использовала Ватацуми, чтобы сделать их реальными... В этом дело, да?.. Таков был твой план с самого начала!"
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Хи-хи... АХАХАХАХАХАХА!"
  - text:
      - "Фигура в красной лисьей маске развернулась и вошла в пространственный разлом, победоносно смеясь."
      - "Когда последние следы коррозийного шторма рассеялись, портал к мейнфрейму закрылся."

chapter2:
  rows:
  - char: "shimanto"
    side: "left"
    text:
      - "Проклятье! Мы были ТАК близки!"
  - char: "nagato"
    side: "right"
    text:
      - "Нет. Не были. У этой самозванки уже было тело, способное существовать вне иллюзии."
      - "Она позволила атаковать себя. Притворилась, будто не может добраться до мейнфрейма. И всё ради того, чтобы посмеяться над нами."
      - "Она хотела похвастаться передо мной своей победой..."
      - "Командир... Мне нужно поговорить с тобой..."

chapter3:
  rows:
  - text:
      - "Толпа девушек-кораблей собралась у входа в Зеркальное море, в котором находился мейнфрейм Тестер."
      - "Пространство перед ними казалось пустым. Но все они, разумеется, знали, что это всего лишь маскировка."
  - char: "nagato"
    side: "left"
    text:
      - "Я внимательно изучила это место до того, как вы все сюда прибыли."
      - "Путь к мейнфрейму, несомненно, здесь. Однако его защищает чрезвычайно сложный барьер. Потребуется некоторое время, чтобы его развеять."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Барьер, значит... Хм..."
      - "Учитывая контекст, думаете, она говорит о Зеркальном море?.."
  - char: "fargo"
    side: "left"
    text:
      - "Вероятно. Когда сакуране используют слово «барьер», они иногда имеют в виду особый вид Зеркального моря, известный как запертое Зеркальное море."
  - char: "nagato"
    side: "right"
    text:
      - "Запертое Зеркальное море?.. Продолжай."
  - char: "fargo"
    side: "left"
    text:
      - "Ну, первое в своём роде было обнаружено в..."
  - char: "herring"
    side: "right"
    text:
      - "Это такое Зеркальное море, внутренности которого скрыты! Тебе нужно знать правильный порядок действий, чтобы вообще попасть внутрь!"
  - char: "fargo"
    side: "left"
    text:
      - "...В этом и заключается суть."
  - char: "nagato"
    side: "right"
    text:
      - "Да, похоже, что это именно оно."
  - char: "saratoga_rad"
    side: "left"
    text:
      - "Что это?.. Кажется, я только что услышала кое-что интересное!"
      - "Наши исследователи добились успеха во взломе кода для проникновения в эти запертые Зеркальные моря! Звучит как отличная возможность проверить некоторые теории!"
      - "Что скажешь, Командир?.."
  - char: "commander"
    side: "right"
    text:
      - "Хм. Вычислительная мощность Моря Звёзд помогла бы нам найти ключ гораздо быстрее."
  - char: "yat_sen"
    side: "left"
    text:
      - "Возможно, мы сможем помочь. Наш суперкомпьютер, Небесная Башня, может разделить вычислительную нагрузку."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Итак, у нас есть сакуранский эксперт по этой теме, суперкомпьютер Империи и наше собственное Море Звёзд..."
      - "Это будет проще простого."
  - char: "nagato"
    side: "left"
    text:
      - "Да. Так дело пойдёт гораздо быстрее, если мы будем работать вместе."
  - char: "herring"
    side: "right"
    text:
      - "Отлично, тогда я буду глашатаем!"
  - char: "nagato"
    side: "left"
    text:
      - "Кем?.."
  - char: "herring"
    side: "right"
    text:
      - "Ну знаешь, та, которая выкрикивает всякое, когда ты используешь талисман."
      - "Полагаю, нам понадобится специальный глашатай для этого Зеркального моря, так что только скажи, и я буду тут как тут."
  - char: "nagato"
    side: "left"
    text:
      - "Я... Что?.."
  - char: "bell"
    side: "right"
    text:
      - "Подожди, так тебе НЕ обязательно это делать?.. Но Симанто делала это, когда бросала СВОИ талисманы!"
  - char: "shimanto"
    side: "left"
    text:
      - "Это... просто моя привычка."
  - char: "bell"
    side: "right"
    text:
      - "ПРИВЫЧКА?! Так я зря записала все те кринжовые реплики?!"
      - "О боже... Они же играли НА ПОВТОРЕ внутри стольких иллюзий!"
  - char: "herring"
    side: "left"
    text:
      - "Ой-ёй. Как неловко."
  - char: "bell"
    side: "right"
    text:
      - "У-у-угх! Убейте меня прямо сейчас!"
  - char: "commander"
    side: "left"
    text:
      - "Ха! Что ж, давайте пока что забудем об этом и займёмся делом."
      - "Всем флотам, пополнить припасы и боекомплект, а затем приготовиться к вторжению в мейнфрейм."
      - "Пока сама Тестер недееспособна, мы должны быть готовы столкнуться с двойником Амаги. Не теряйте бдительности."
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП-БИП-БИП!"
  - char: "memphis"
    side: "left"
    text:
      - "Что?.. Энергетический импульс?.."
      - "Похоже, он направляется к нам на высокой скорости..."
  - char: "tb_rad"
    side: "right"
    text:
      - "Внимание: 30 секунд назад был зафиксирован мощный энергетический импульс, исходящий с Островов Сакуры."
      - "Энергетический импульс на 96,4% совпадает с импульсом при создании Сингулярности."
      - "Размер данной Сингулярности определить невозможно, поскольку всё близлежащее оборудование мониторинга отключилось."
      - "Море Звёзд предлагает дать этой Сингулярности предварительное название «Нарака»."
      - "Согласно расчётам на основе имеющихся данных, считается, что Нарака затрагивает всю территорию Островов Сакуры."
      - "Уровень угрозы: Катаклизм."
  - char: "all"
    side: "left"
    text:
      - "ЧТО?!"
