chapter1:
  rows:
  - text:
      - "С вершины своей высокой башни истинная владычица Тихого Океана наблюдала за полем боя через свои многочисленные скрытые камеры."
      - "Её взгляд скользнул мимо бесчисленных огней над западной частью Тихого Океана и остановился на восточной — на Империи Дракона."
  - char: "tester"
    side: "left"
    status: "is-red"
    text:
      - "Ситуация продолжает ухудшаться."
      - "Ошеломляющий объём электроэнергии Империи был перенаправлен в одно место — к Небесной Башне."
      - "По предварительным наблюдениям, это более 40% всей их электроэнергии, и это число растёт."
      - "Я также вижу, что вся страна перешла в состояние боевой готовности первого уровня."
      - "Учитывая численность их сил и тот факт, что во главе стоит Командир, вероятность того, что они прорвутся через Шторм, составляет 98%."
      - "В заключение, необходимо принять экстренные меры."
      - "Приказы Обсервер ясны — любые попытки уничтожить Шторм должны пресекаться, пока эксперимент не перейдёт в следующую фазу."
      - "В качестве меры предосторожности я повышаю интенсивность Шторма с IV до V."
      - "Я буду сдерживать их, пока у них не закончатся боеприпасы и они больше не смогут продолжать штурм."
  - text:
      - "Тестер пришла к выводу и начала рассылать приказы по всем своим модулям."
      - "Модули, однако, не отреагировали на приказы. Они оставались без ответа даже по прошествии нескольких секунд."
  - char: "tester"
    side: "left"
    status: "is-red"
    text:
      - "Моё подключение прервалось по тайм-ауту?.."
      - "Кто-то глушит башню моего мейнфрейма?.."
      - "Нет... Это невозможно..."

chapter2:
  rows:
  - text:
      - "В стальном городе, который является её мейнфреймом, мерцала одинокая синяя точка."
      - "Мерцание вырвалось ослепительным потоком, разлившимся по всему городу."
      - "Оно угасло, снова став точкой, прежде чем исчезнуть там же, где и появилось."
  - char: "tester"
    side: "left"
    status: "is-red"
    text:
      - "Приказы получены."
      - "Отмена первоначального плана по увеличению интенсивности Шторма."
      - "Получен альтернативный план."
      - "Активация серийных кораблей Типа IV."
      - "Передислокация единиц для формирования линии обороны. Вступление в бой с вражескими силами до завершения последовательности инициации Шторма."
  - text:
      - "Она разослала новые наборы приказов своим многочисленным модулям, и на этот раз они ответили."
      - "С серией электрических сигналов началось производство серийной модели Типа IV — массивных единиц, которые редко можно было увидеть на Тестовом полигоне Бета."
      - "Теперь ситуация напоминала пороховую бочку, готовую вот-вот взорваться."
