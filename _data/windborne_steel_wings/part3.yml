chapter1:
  rows:
  - char: "fargo"
    side: "left"
    text:
      - "База на острове Рождества. Нет ответа."
      - "База на AF. Нет ответа."
      - "Порт в PH. Нет ответа."

chapter2:
  rows:
  - char: "fargo"
    side: "left"
    text:
      - "База в SD. Нет ответа."
      - "Я попыталась связаться с каждой из наших баз по всему Тихому Океану. Ни одна из них не ответила."
  - char: "bell"
    side: "right"
    text:
      - "Значит, Симанто не шутила... Эта ситуация намного, намного серьёзнее, чем я думала."
  - char: "fargo"
    side: "left"
    text:
      - "ВОЗМОЖНО, что нашим коммуникаторам просто не хватает мощности сигнала, так как мы ещё не полностью развеяли иллюзию."
      - "Вполне вероятно, что базы недоступны из-за банального глушения."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Это правда."
      - "Но  с чего ты взяла, что мы ещё не полностью избавились от иллюзии?.."
  - char: "fargo"
    side: "left"
    text:
      - "Мои разведывательные самолёты засекли приближающийся флот. Принадлежность неизвестна."
      - "Их внешние идентификаторы совпадают с серийными кораблями сакуранцев, но только на 35,75%."
      - "Они окутаны чёрным туманом, что делает дальнейшую идентификацию невозможной."
      - "Вот снимок, который сделали мои самолёты."
  - text:
      - "<img src='../../img/bg/r/6.png' class='inline-img' alt=''>"
  - char: "indiana"
    side: "right"
    text:
      - "Они и правда покрыты чёрным туманом... Очень похоже на тех коррозийных сущностей, о которых рассказывал нам Командир."
      - "Вот только в тех разведданных говорилось, что их вообще невозможно опознать, а ты сказала, что узнаёшь хотя бы часть из них."
      - "Сделай резервную копию этих данных на всякий случай. Мы отправим их в SD, как только снова появится сигнал."
  - char: "fargo"
    side: "left"
    text:
      - "Знаю."
  - char: "herring"
    side: "right"
    text:
      - "Знаете... когда мы «видели сны», или что там ещё, разве мы не говорили, что скоро приедут сакуранские туристы?.."
      - "Судя по часам, я думаю, что наши «туристы» — это враг!"
  - char: "bell"
    side: "left"
    text:
      - "Возможно, ты права... Если бы мы не пришли в себя, это мог бы быть конец для нашей базы здесь!"
  - char: "indiana"
    side: "right"
    text:
      - "Но мы ПРИШЛИ в себя. Враг потерял эффект неожиданности."
      - "Дадим им бой в лоб! Не прекращайте стрелять, пока они все не пойдут на корм рыбам!"
