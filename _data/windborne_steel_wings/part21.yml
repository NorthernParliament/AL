chapter1:
  rows:
  - char: "hwah_jah_rad"
    side: "left"
    text:
      - "Командир, это Флот анализа Шторма Южного моря. Первый раунд массированной атаки завершён. Цель всё ещё цела!"
  - char: "chen_hai_rad"
    side: "right"
    text:
      - "Это Флот анализа Шторма Северного моря, докладываю об аналогичных результатах. Первый раунд атаки завершён, но цель не подаёт признаков ослабления."
  - char: "chian"
    side: "left"
    text:
      - "Здесь Флот анализа Шторма Восточного моря. Завершили первый раунд массированной атаки. Это ничего не дало."
      - "Это были все наши первые атаки. Штормы от Альфа до Дельта совершенно не пострадали. Флоты перезарядятся и пополнят припасы, а затем начнут второй раунд атак."
  - char: "commander"
    side: "right"
    text:
      - "Понял. Как закончите, начинайте второй раунд по моей команде."
  - char: "chian"
    side: "left"
    text:
      - "Вас поняла. Начнём второй раунд после пополнения припасов."
  - char: "commander"
    side: "right"
    text:
      - "(Примерно этого я и ожидал от первого раунда.)"
      - "(С виду это ничего не дало, но третий раунд должен сработать. В крайнем случае, четвёртый.)"

chapter2:
  rows:
  - text:
      - "Начался второй раунд атак. Хотя сам Шторм с виду остался прежним, аномальная погода, окутавшая этот район, явно немного утихла."
  - text:
      - "<img src='../../img/bg/r/7.png' class='inline-img' alt=''>"

chapter3:
  rows:
  - text:
      - "Затем последовал третий раунд. Штормы Альфа и Дельта, которые уже были сравнительно слабыми, с трудом поддерживали своё существование. Тем временем штормы Бета и Гамма начали ослабевать."

chapter4:
  rows:
  - text:
      - "Наконец, завершился четвёртый раунд. В морях воцарилась тишина."
      - "Шторм таял прямо на глазах, в то время как необычная погода наверху тоже рассеялась."
  - char: "an_shan"
    side: "left"
    text:
      - "Мы сделали это... Мы одолели Шторм!"
  - char: "chian"
    side: "right"
    text:
      - "Командир, замечены приближающиеся Сирены! Они направляются к нам!"
  - char: "commander"
    side: "left"
    text:
      - "Шторм исчез, их глушение должно стать намного слабее! Отправьте разведчиков, проведите разведку с воздуха и начните масштабное сканирование радарами!"
      - "Авангард, перехватите Сирен!"
  - char: "harbin"
    side: "right"
    text:
      - "Будет сделано! Я слышала много историй о том, на что ты способен, Командир!"
      - "Отправим этих Сирен туда, откуда они пришли!"
