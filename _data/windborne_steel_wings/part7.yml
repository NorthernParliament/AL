chapter1:
  rows:
  - text:
      - "Разношёрстный флот плавно продвигался вперёд по пылающему морю."
      - "Линия обороны получила катастрофические повреждения в результате интенсивных боёв."
      - "Хотя девушки-корабли изо всех сил сражались, пытаясь предотвратить это, всех их усилий оказалось попросту недостаточно."
  - char: "hazelwood"
    side: "left"
    text:
      - "Почему... Как это могло произойти?.."
  - char: "halsey_powell"
    side: "right"
    text:
      - "Мы победили всех Сирен, и они всё равно нанесли такой огромный ущерб..."
  - char: "dewey"
    side: "left"
    text:
      - "Линия пала только из-за нас... Мы были слабы..."
  - char: "amagi"
    side: "right"
    text:
      - "Нет, это неправда. Это не ваша вина."
      - "Их было так много, а вас так мало. Как бы ни была важна эта линия обороны, вы бы ни за что не смогли защитить её в одиночку."
      - "Вы не только пережили битву, вы даже отбили первую атаку. За это вас стоит похвалить."
  - char: "dewey"
    side: "left"
    text:
      - "Спасибо... Спасибо тебе, Амаги."
      - "И спасибо за то, что помогла нам. Без тебя мы бы уже были на дне океана!"
  - char: "amagi"
    side: "right"
    text:
      - "Пожалуйста. Совесть не позволила бы мне стоять в стороне и бросить союзников на произвол судьбы."
      - "Знаете, этого бы не случилось, если бы у вас было больше поддержки. Вместо этого ваше начальство перенаправило силы отсюда в другое место.Я предвидела это и пришла сюда в надежде решить вашу проблему нехватки сил... Увы, я опоздала."
      - "Следующая атака Сирен может начаться в любую минуту. Нам следует уйти как можно скорее. Пойдёмте со мной, и мы отступим вглубь суши."
  - char: "indiana_rad"
    side: "left"
    text:
      - "Это Индиана. Дьюи, каков твой статус?.."
  - char: "dewey"
    side: "right"
    text:
      - "И-Индиана?.. Почему ты здесь?.."
  - char: "indiana_rad"
    side: "left"
    text:
      - "А ты как думаешь?.. Чтобы спасти ваши задницы! Питтсбург, Фарго, Херринг и Белл здесь, со мной."
  - char: "dewey"
    side: "right"
    text:
      - "Мы рады, что вы пришли за нами, но боюсь, уже слишком поздно..."
      - "Хотя нам и удалось отбросить первую волну Сирен, линия обороны была полностью уничтожена."
      - "Что ещё хуже, мы не можем связаться ни с кем поблизости. Вы единственные, кто пришёл на помощь."
      - "Вам не стоит здесь задерживаться! Командир Сирен ещё не показалась, так что их следующая атака может произойти в любую секунду!"
      - "Мы собираемся отступить вместе с сакуранской делегацией. Вам следует пойти с нами."
      - "Нам нужно отступить и перегруппироваться, тогда мы сможем выстроить новую оборону!"
  - char: "indiana_rad"
    side: "left"
    text:
      - "Что-что?.. Вы собираетесь отступать?.."
  - char: "dewey"
    side: "right"
    text:
      - "Так точно! Ненавижу это признавать, но в данный момент мы совершенно не готовы отразить ещё один штурм."
  - char: "amagi"
    side: "left"
    text:
      - "Сирены идут ва-банк. Эта линия — лишь одно из множества укреплений Союза Орла, которые они атакуют."
      - "Подумать только, что основные флоты находятся так далеко в столь решающий момент..."
      - "Как бы то ни было, оставаться здесь глупо. Отступить и сохранить силы — ваш лучший вариант."
  - char: "pittsburgh_rad"
    side: "right"
    text:
      - "Никто не спрашивал твоего совета, «Амаги»."
  - char: "indiana_rad"
    side: "left"
    text:
      - "Ага. Держи его при себе, манипулятивный монстр."
  - char: "dewey"
    side: "right"
    text:
      - "М-монстр?.. Но она спасла нам жизни!"
  - char: "indiana"
    side: "left"
    text:
      - "Нет. Послушай меня, Дьюи. Ничего из того, что она для вас сделала, не является реальностью."
      - "Это сон — иллюзия, которую она наколдовала, чтобы сыграть на вашей слабости!"
      - "Моего флота не было там, когда атаковали линию, но мы изучили, что произошло постфактум."
      - "Сирены застали вас врасплох. Они нанесли серьёзный ущерб линии. Всё это правда..."
      - "Но ведь это не вся история, не так ли?.."
      - "Сирены бросили на вас огромные силы, но вы выстояли, сражаясь до самого конца. Никто из вас даже не думал сдаваться."
      - "Несмотря на отсутствие подкрепления, несмотря на огромную разницу в силах, вы удержали линию — с помощью одного конкретного человека!"
  - char: "dewey"
    side: "right"
    text:
      - "Одного человека?.. Подождите..."

chapter2:
  rows:
  - char: "dewey"
    side: "right"
    text:
      - "Эсминец типа «Фаррагут», Дьюи, прибыла на службу!"
  - char: "aylwin"
    side: "left"
    text:
      - "Я ещё один эсминец типа «Фаррагут», Элвин. Прибыла на службу."
  - char: "victorious"
    side: "right"
    text:
      - "Вы двое с линии обороны?.."
  - char: "dewey"
    side: "left"
    text:
      - "Да, мы, мисс Викториес."
  - char: "baltimore"
    side: "right"
    text:
      - "А что с остальными?.."
  - char: "dewey"
    side: "left"
    text:
      - "Диверсионному отряду удалось отвлечь внимание Сирен, что дало нам возможность отступить с ранеными. Но после этого..."
  - char: "aylwin"
    side: "right"
    text:
      - "Мы хотели бы вернуться к остальным, но флот Сирен преграждает путь назад."
      - "Нам одним с этим не справиться..."
  - char: "dewey"
    side: "left"
    text:
      - "Н-но... пока вы здесь, Командир, вы же что-нибудь придумаете, верно?.."
  - char: "commander"
    side: "right"
    text:
      - "Да. Всё будет хорошо."
  - char: "baltimore"
    side: "left"
    text:
      - "Не волнуйтесь. Вы молодцы. С помощью Командира мы со всем справимся."
  - char: "victorious"
    side: "right"
    text:
      - "Богиня победы с вами! Мы обеспечим вам безопасность — просто держитесь позади нас!"
  - char: "dewey"
    side: "left"
    text:
      - "В-Викториес! Мы получили сообщение от Джуно и Бирмингем, они сообщают, что вступили в бой с элитной Сиреной!"
      - "Командир, мы должны отправиться спасать их!"

chapter3:
  rows:
  - char: "dewey"
    side: "left"
    text:
      - "Теперь я вспомнила! Командир сражался вместе с нами, и мы в тот день ПОБЕДИЛИ!"
      - "И никакая сакуранская делегация тогда к нам не приходила!"
      - "Но тогда... Кто же ты такая?!"

chapter4:
  rows:
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Хе-хе. Значит, вы открыли глаза."
      - "Даже с посторонней помощью я не думала, что вы проснётесь так быстро... Полагаю, воспоминания — сильная штука."
      - "Это интересно. ОЧЕНЬ интересно."
      - "Теперь, когда вы проснулись, наслаждайтесь своим вечным пребыванием здесь."
  - text:
      - "В тот момент, когда её фальшивая личность была сорвана, особа в маске обнажила свою оснастку, в то время как чёрный туман заклубился вокруг её тела."
      - "Подобные ей зловещие серийные корабли в следующее же мгновение тоже начали излучать пугающую ауру."
  - char: "dewey"
    side: "left"
    text:
      - "О-о, нет!"
  - text:
      - "Тёплые объятия безопасности, которые дарил им сон, исчезли, полностью сменившись всепоглощающей жаждой крови."
      - "Внезапно в небе со вспышкой розоватого света появились врата тории. Из них выпрыгнула их спасительница."

chapter5:
  rows:
  - char: "indiana"
    side: "left"
    text:
      - "<h2>Оставьте!</h2>"
      - "<h2>Наших!</h2>"
      - "<h2>ЭСМИНЦЕВ!</h2>"
      - "<h2>В ПОКО-О-ОЕ!</h2>"

chapter6:
  rows:
  - text:
      - "Безжалостный артиллерийский огонь обрушился на серийные корабли, заставив фигуру в маске отступить."
  - char: "dewey"
    side: "left"
    text:
      - "Что?!"
  - char: "halsey_powell"
    side: "right"
    text:
      - "Она только что спрыгнула с неба?!"
      - "Это ТАК КРУТО!"
  - char: "indiana"
    side: "left"
    text:
      - "Если тебе есть что сказать, скажи это мне, монстр."
      - "Девочки! Волк в овечьей шкуре показал своё истинное лицо! Давайте надерём ей задницу и уберёмся отсюда к чертям!"
