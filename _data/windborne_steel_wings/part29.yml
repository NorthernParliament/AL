chapter1:
  rows:
  - text:
      - "На экране системы управления отображаются четыре флота: три направляются к Марианским островам, а один гигантский флот только что отвоевал Маршалловы Острова."
  - char: "memphis"
    side: "left"
    text:
      - "Благодаря этому операция всё ещё идёт по плану, несмотря на задержку."
      - "Хорошо, что наши флоты продвигались осторожно, ведь теперь, когда мы отбили Маршалловы Острова, у нас, к счастью, появились свободные силы."
      - "Плохая новость в том, что дальше продвигаться будет только сложнее."
      - "Хочешь, чтобы я передала Королевскому Флоту и Железной Крови ускориться?.."
  - char: "commander"
    side: "right"
    text:
      - "В этом нет необходимости. Учитывая наше нынешнее выгодное положение, я бы хотел придержать их в резерве."
  - char: "helena"
    side: "left"
    text:
      - "Ты беспокоишься о той Амаги, не так ли?.."
  - char: "commander"
    side: "right"
    text:
      - "Да. Услышав отчёты о том, что она сделала, а также рассказ Нагато о произошедшем, у меня есть на то веские причины."
      - "Нам нужно быть начеку на случай любых сюрпризов от неё."
      - "(Интересно, чего она хочет — это существо, обладающее чертами как Акаги, так и Амаги.)"

chapter2:
  rows:
  - char: "nagato"
    side: "left"
    text:
      - "...Как ты и предполагал, вовсе не Сирены были в ответе за иллюзорные явления. Это был кто-то, кто утверждал — и верил, — что является Амаги."
      - "Для меня она сродни задержавшейся воле, которой Ватацуми придал форму, запятнанной коррозией с ног до головы."
      - "...Действительно, она имеет много общего с существами, которых вы называете коррозийными сущностями."
      - "Можно сказать, что она — порождение коррозии, пожирающей этот мир. Это придаёт смысл тому, что мы называем её «Предвестником Коррозии» или «Тенью Коррозии»."
      - "Однако Тень Коррозии отличает то, что на поле боя она приняла форму наших собственных серийных кораблей."
      - "Более того, эта похожая на Амаги сущность знала как и смогла использовать пространство Священной Сакуры для перемещения в новое место."
      - "...Это правда. Пространство Священной Сакуры, телепорты Сирен и система микрослойного переноса имеют несколько поразительных сходств."
      - "Но отбросив это, важно то, что эта сущность опасна."
      - "У нас обоих есть опасения насчёт Акаги. Именно по этой причине мы должны остановить её как можно скорее."
      - "Иначе она может утратить саму себя и превратиться в монстра, который опустошит не только Империю Сакуры, но и весь мир..."
      - "...Что?.. Не пытаться поспеть везде и сразу?.."
      - "...Значит, ты присматриваешь и за Империей Сакуры тоже. Понимаю."
      - "Тогда я приму твой совет близко к сердцу и сделаю всё, что в моих силах. В разумных пределах."

chapter3:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "(Я обдумал множество вариантов, и ни один из них не объясняет до конца, чем — или кем — на самом деле является это слияние Амаги и Акаги.)"
      - "(Она часть души Амаги, которую поглотила коррозия?.. Она фантом, вызванный коррозией?.. Она марионетка, контролируемая Акаги?.. Она сама Акаги, искажённая и деформированная коррозией?.. Вариантов множество.)"
      - "(Лично я сомневаюсь, что она просто марионетка или коррозийная сущность с кризисом самоопределения.)"
      - "(Что мы знаем наверняка, так это то, что она крайне опасна, и к ней нельзя относиться легкомысленно.)"
      - "(...Спасибо за это, Нагато. Будь там осторожна.)"
