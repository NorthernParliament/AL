chapter1:
  rows:
  - text:
      - "Флот Союза Орла сокрушительным напором прорвал вражеские ряды, оказавшись лицом к лицу с их лидером."
      - "БАБАХ!!!"
  - char: "indiana"
    side: "left"
    text:
      - "Внимание! Я засекла их командира!"
  - char: "pittsburgh"
    side: "right"
    text:
      - "Давай же, покажи нам своё истинное лицо."
  - char: "indiana"
    side: "left"
    text:
      - "Из всех орудий! Ого-о-онь!"
  - text:
      - "БАБАХ!!!"
  - char: "amagi_m???"
    side: "right"
    status: "is-red"
    text:
      - "……"
      - "Хи-хи..."

chapter2:
  rows:
  - text:
      - "За мгновение до того, как снаряд успел попасть, существо в лисьей маске исчезло в облаке розового дыма, не оставив и следа."
  - char: "bell"
    side: "left"
    text:
      - "Она исчезла! Как?!"
  - char: "pittsburgh"
    side: "right"
    text:
      - "Здесь мы имеем дело отнюдь не с обычной Пешкой."
  - char: "herring"
    side: "left"
    text:
      - "Тогда это МЕТА?.. Или новый тип Сирен?.."
  - char: "fargo"
    side: "right"
    text:
      - "Похоже, нашей «гостьей» должна была стать некто по имени «Амаги»."
      - "У кого-нибудь есть какая-то информация о ней?.."
  - char: "indiana"
    side: "left"
    text:
      - "Не-а. Среди нынешнего руководства Империи Сакуры нет никого по имени Амаги."
  - char: "herring"
    side: "right"
    text:
      - "Ага, простите, я не лезу в политику и всё такое, так что..."
  - char: "pittsburgh"
    side: "left"
    text:
      - "Разве не ты наш местный эксперт по сакуранцам, Белл?.. Ты что-нибудь знаешь?.."
  - char: "bell"
    side: "right"
    text:
      - "Ну, я только смотрю их фильмы и читаю их мангу... Я никогда не слышала ни о ком по имени «Амаги»."
  - char: "indiana"
    side: "left"
    text:
      - "Полагаю, нам придётся восстановить связь с SD, прежде чем мы сможем выяснить, кто она такая."
      - "Переведите дух, и мы снова выдвигаемся. Мы направляемся на Киритимати - остров Рождества."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Почему на Киритимати?.."
  - char: "fargo"
    side: "left"
    text:
      - "Их радиооборудование куда более продвинутое, чем здесь. Возможно, оттуда мы сможем связаться с другой базой."
  - char: "indiana"
    side: "right"
    text:
      - "Это ещё не всё. Кто-нибудь из вас заметил, откуда взялись эти туманные твари?.."
      - "Судя по их курсу, высока вероятность, что они прибыли со стороны Киритимати."
      - "Если это правда, то это также может означать, что дислоцированный там флот в глубокой заднице..."
      - "Мы ближайший к ним союзный флот, так что мы обязаны помочь."
