chapter1:
  rows:
  - text:
      - "На улицах было полно людей. Это был ещё один обычный, мирный день."
  - char: "hardy"
    side: "left"
    text:
      - "Эй, кому-нибудь ещё кажется, что этот отпуск длится до смешного долго?.."
  - char: "musketeer"
    side: "right"
    text:
      - "И что в этом плохого?.. Отсутствие приказов о возвращении домой означает бесконечный отпуск!"
  - char: "kent"
    side: "left"
    text:
      - "Ага! Я имею в виду, кому НЕ нравится долгий отпуск?.."
  - char: "suffolk"
    side: "right"
    text:
      - "Смотрите... В небе."
  - char: "musketeer"
    side: "left"
    text:
      - "Ты заметила причудливое облако или... О боже мой! Девочки, смотрите!"

chapter2:
  rows:
  - text:
      - "Чёрное солнце, тихо горящее в сумеречном небе."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Говорит ваша королева! Мои верные подданные — проснитесь!"
      - "Вы угодили в сладкую, но смертельную ловушку, так что приходите в себя!"

chapter3:
  rows:
  - char: "suffolk"
    side: "right"
    text:
      - "В-Ваше Величество, почему вы в небе?.."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "ЭТО первое, что пришло тебе в голову?.."
  - char: "hardy"
    side: "right"
    text:
      - "Ой... Голова болит..."
      - "Значит, весь этот отпуск был всего лишь сном... Поверить не могу, насколько реалистичным он казался."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Потому что это не совсем сон. Сны естественны, в то время как ваш был сфабрикован!"
      - "Однако всё будет в порядке. Это недавно разработанное антиконцептуальное оружие разрушит эту иллюзию всего за три минуты."
      - "Если вы чувствуете головокружение или у вас болит голова, это нормально. Всё пройдет, когда вы откроете глаза."
      - "А теперь я отправляюсь к следующей иллюзии. Вы же просто сосредоточьтесь на пробуждении!"
      - "Будем надеяться, что девчонки, охраняющие врата, не натворили глупостей..."
