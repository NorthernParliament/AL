chapter1:
  rows:
  - text:
      - "Нагато и её флот продвигались вперёд, поддерживая её защитный барьер, направляясь к Священной Сакуре."
      - "По пути они почти не встретили сопротивления, что резко контрастировало с количеством врагов на границах иллюзии."
  - char: "nagato"
    side: "left"
    text:
      - "(Почему нет сопротивления?.. Они пытаются подвести меня ближе к Священной Сакуре?..)"
      - "(В чём может быть причина?..)"
  - text:
      - "В отличие от цветущих вокруг деревьев, Священная Сакура давно увяла."
      - "Нагато посмотрела на её ветви."
      - "Прошло мгновение. Затем на ветке появилась одна-единственная красная точка, и внезапно все бутоны распустились разом."

chapter2:
  rows:
  - char: "amagi"
    side: "right"
    text:
      - "Госпожа Нагато..."
      - "Госпожа Нагато?.."
  - text:
      - "Облака расступились, и сияющий солнечный свет озарил лес цветущей сакуры."
      - "Нежный голос звал Нагато снова и снова. Наконец, она пришла в себя."
  - char: "nagato"
    side: "left"
    text:
      - "Амаги?.. Но... Где я?.."
  - text:
      - "Она огляделась. Она находилась в гостевой комнате, на удивление знакомой ей и в то же время с экстравагантным дизайном."
  - char: "amagi"
    side: "right"
    text:
      - "Ты кажешься немного рассеянной с тех пор, как пришла сюда."
      - "Тебя что-то беспокоит?.."
  - char: "nagato"
    side: "left"
    text:
      - "Да... Такое чувство, будто мне приснился долгий сон, и я до сих пор ошеломлена после того, как меня так внезапно вернули в реальность."
  - char: "amagi"
    side: "right"
    text:
      - "Понимаю. В последнее время было довольно дождливо, и любой бы удивился, увидев, как небо внезапно прояснилось."
      - "Я также знаю, что ты слишком перенапрягалась. Пожалуйста, береги себя получше, хорошо?.."
  - char: "nagato"
    side: "left"
    text:
      - "Очень хорошо. Кстати..."
      - "Это ты привела меня к Священной Сакуре?.."
  - char: "amagi"
    side: "right"
    text:
      - "Прости?.. Да, это была я. Почему ты спрашиваешь?.. Тебе приснился неприятный сон?.."
  - char: "nagato"
    side: "left"
    text:
      - "Сны — это всего лишь сны."
      - "Не беспокойся обо мне. Итак, о чём ты хотела меня попросить?.."
  - char: "amagi"
    side: "right"
    text:
      - "Прости мою грубость, но я хотела бы обратиться с просьбой от имени Каги."
  - char: "nagato"
    side: "left"
    text:
      - "Очень хорошо. Говори."
  - char: "amagi"
    side: "right"
    text:
      - "Как ты знаешь, договор позволяет переоборудовать любые два крупных капитальных корабля в авианосцы. Я стремлюсь отменить списание линкора Кага на основании требований Договора."
  - char: "nagato"
    side: "left"
    text:
      - "Хм... Амаги, никто не желает такого исхода..."
  - char: "amagi"
    side: "right"
    text:
      - "Договор вступает в силу после подписания, я знаю. Судьбу не изменить."
      - "Если только кто-то не займёт её место..."
  - char: "nagato"
    side: "left"
    text:
      - "С самого начала мир никогда не судил, кто слаб, а кто силён. Ты просто используешь это как предлог, чтобы сбежать от реальности."
  - char: "amagi"
    side: "right"
    text:
      - "Госпожа Нагато, ты уже должна знать, что я не гожусь на роль флагмана Объединённого флота. Рано или поздно эта роль должна быть поручена кому-то другому."
      - "Хоть она, возможно, ещё и не готова к этой задаче, но если бы ты передала эту роль Каге, я могла бы быть спокойна, зная, что смогла послужить Империи Сакуры даже с этим неполноценным телом."
  - char: "nagato"
    side: "left"
    text:
      - "Это правда то, чего ты желаешь?.."
  - char: "amagi"
    side: "right"
    text:
      - "Без сомнения. Сейчас Кага в одиночестве в Зеркальном море из-за своего отчаяния, но я лично верну её."
      - "Если мы сможем благополучно вернуться, я смиренно прошу тебя обдумать моё решение и провести ещё одни учения, чтобы убедиться, что Кага может стать авианосцем."
  - char: "nagato"
    side: "left"
    text:
      - "...Нет."
  - char: "amagi"
    side: "right"
    text:
      - "Госпожа Нагато?.."
  - char: "nagato"
    side: "left"
    text:
      - "Я этого не позволю."
      - "Не сдавайся сейчас, Амаги. Я вылечу тебя, клянусь!"
  - char: "amagi"
    side: "right"
    text:
      - "«Вылечишь» меня?.. Как ты это сделаешь?.."
  - char: "nagato"
    side: "left"
    text:
      - "Использовав Ватацуми, а также силу Священной Сакуры."
      - "Пусть твой корпус и разрушается, твою душу — то, что делает тебя тобой — можно поддерживать с помощью Священной Сакуры."
      - "Священная Сакура будет питаться силой Ватацуми, а её корни можно будет соединить с Изначальной Сакурой."
      - "Мы сможем создать для тебя новое тело, используя Ватацуми в качестве ядра."
  - char: "amagi"
    side: "right"
    text:
      - "Я понимаю твой план... Он в точности такой же, как у неё, не так ли?.."
  - char: "nagato"
    side: "left"
    text:
      - "У «неё»?.. У кого?.."
      - "...Теперь я понимаю. То, что я считала сном, было реальностью. А ЭТО — сон."

chapter3:
  rows:
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "С самого начала мир никогда не судил, кто слаб, а кто силён. Ты просто используешь это как предлог, чтобы сбежать от реальности."
  - text:
      - "Багровая фигура не ответила. Молча она надела на лицо свою лисью маску."

chapter4:
  rows:
  - char: "shimanto"
    side: "left"
    text:
      - "Змей-сикигами, разрушь эту иллюзию!"
  - text:
      - "Тишину между ними нарушил крик издалека."
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Кажется, наш разговор окончен."
      - "Госпожа Нагато, пожалуйста, поверни назад. Не вмешивайся в это дело."

chapter5:
  rows:
  - text:
      - "Когда иллюзия была разрушена, враги, сидевшие в засаде, обнаружили себя."
      - "Однако они представляли мало угрозы для объединённой мощи флотов Империи Сакуры и Союза Орла."
      - "Посреди хаоса багровая фигура снова исчезла."
      - "Всё, что осталось — это эхо её глухого вздоха в ушах Нагато."

chapter6:
  rows:
  - char: "pittsburgh"
    side: "left"
    text:
      - "(ЭТО Нагато?.. Вау, а она чертовски миленькая.)"
      - "Эй, ты предводительница этого флота?.."
  - char: "nagato"
    side: "right"
    text:
      - "Я Нагато, лиса-хранительница, а также бывший флагман Объединённого флота Империи Сакуры."
  - char: "pittsburgh"
    side: "left"
    text:
      - "Ой, извини, если это прозвучало грубо. Я много о тебе слышала, но не думала, что ты будешь такой... маленькой."
  - char: "kawakaze"
    side: "right"
    text:
      - "Да как ты смеешь?!"
  - char: "enterprise"
    side: "left"
    text:
      - "Кхм. Питтсбург."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Точно, не хотела никого обидеть. Простите меня."
  - char: "enterprise"
    side: "left"
    text:
      - "Я Энтерпрайз. Флагман Тихоокеанского флота Союза Орла и в настоящее время руковожу операциями в Тихом Океане и его окрестностях."
      - "Для меня честь познакомиться с тобой, лиса-хранительница."
  - text:
      - "И вот так Союз Орла и Империя Сакуры наконец-то встретились на Соломоновых Островах."
      - "Твёрдым рукопожатием две самые влиятельные фракции Тихого Океана официально установили контакт."

chapter7:
  rows:
  - char: "nagato"
    side: "left"
    text:
      - "Энтерпрайз. Серый Призрак. Я слышала о тебе."
      - "Ты пришла нам на помощь сегодня, и за это я благодарю тебя."
  - char: "enterprise"
    side: "right"
    text:
      - "Прошу, это я должна благодарить ТЕБЯ. Твои действия спасли нас."
      - "От лица всех нас... На самом деле, время не ждёт, так что прости, что перехожу сразу к делу."
      - "По нашим разведданным, ситуация на Маршалловых Островах ещё хуже, чем здесь."
      - "Мы собираемся объединиться с основным флотом и начать атаку в клещи. Наша цель — разрушить иллюзию и помочь флоту, дислоцированному на острове."
      - "Не могла бы ты поделиться, что твой флот планирует делать дальше?.."
  - char: "nagato"
    side: "left"
    text:
      - "……"
      - "(Времена меняются...)"
      - "(Охранять и следовать традициям, или же отправиться в путь с новыми ветрами... Выбор для меня уже очевиден.)"
      - "(Многое я пережила с момента моего пробуждения под Священной Сакурой, от встречи с Возрождённым Объединённым флотом до Акаги и её яростного упрямства.)"
      - "Позволь мне начать с того, что всё это — эти иллюзии, эти странные новые враги — всё это связано с планом, который осуществляет Акаги."
      - "Она использует Ватацуми и Священную Сакуру в своих собственных злых умыслах. Я больше не могу этого терпеть."
      - "В конечном счете ответственность за этот кризис лежит на Империи Сакуры, а вы оказались втянуты в него."
      - "За это я понесу ответственность. Мой флот с радостью будет сопровождать вас и сокрушит эту напасть в наших морях."
      - "Как только с этим будет покончено, посмотрим, что будет дальше."
  - char: "enterprise"
    side: "right"
    text:
      - "Большего я и просить не могла. Я просто рада, что мне не придётся потом объяснять, почему наши силы были замечены вблизи Маршалловых Островов."
      - "С вашей помощью, я уверена, эта операция пройдёт без сучка без задоринки."
  - char: "nagato"
    side: "left"
    text:
      - "Да. Давайте построимся и отправимся к Маршалловым Островам!"
