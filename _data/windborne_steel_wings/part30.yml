chapter1:
  rows:
  - char: "chian_rad"
    side: "right"
    text:
      - "Командир, флот на позиции. Я отсюда вижу оборонительные сооружения Сирен."
  - char: "commander"
    side: "left"
    text:
      - "Чэнь Хай, Хуа Цзя, каков ваш статус?.."
  - char: "chen_hai_rad"
    side: "right"
    text:
      - "На позиции, готовы и ждём приказа открыть огонь."
  - char: "hwah_jah_rad"
    side: "left"
    text:
      - "Аналогично. Мы прибыли в назначенное место, ждём твоего приказа открыть огонь."

chapter2:
  rows:
  - char: "sovetsky_soyuz_rad"
    side: "right"
    text:
      - "Это Советский Союз, докладываю Империи Дракона и Командиру. Наш Антарктический флот и флот кораблей прототипов на позиции и ожидают приказов."
  - char: "commander"
    side: "left"
    text:
      - "Ты сама командуешь флотами?.."
  - char: "sovetsky_soyuz_rad"
    side: "right"
    text:
      - "Да. В конце концов, наша цель — захватить Марианские острова и уничтожить механизм, создающий Шторм."
      - "Для этого, я считаю, я должна быть на земле со своими войсками. Ну, на воде, но ты знаешь поговорку."
      - "Меня сопровождают корабли прототипы и Киров МЕТА. Надеюсь, они сослужат тебе хорошую службу."
  - char: "admial_hakhimov_rad"
    side: "left"
    text:
      - "Адмирал Нахимов на связи. Я рада сражаться вместе со всеми вами."
  - char: "kirov_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Собрать несколько разных фракций в одном сражении... Очень интересно. Я буду наблюдать и учиться твоему стилю командования."

chapter3:
  rows:
  - char: "peter_strasser_rad"
    side: "left"
    text:
      - "Это Петер Штрассер из Железной Крови."
      - "Ты звал, Офицер, и флот Парящей Крепости откликнулся. Мы поможем тебе захватить Марианские острова."
  - char: "hindenburg_rad"
    side: "right"
    text:
      - "Говорит Гинденбург. Мы ждём, Связавший Контрактом. Отдавай свои приказы."
  - char: "agir_rad"
    side: "left"
    text:
      - "Хе-хе. Я бы никогда не смогла отказать тебе в просьбе о помощи."
      - "Ожидаю, что это будет захватывающая битва. Как и всегда."
  - char: "implacable_rad"
    side: "right"
    text:
      - "Южно-Тихоокеанский флот Королевского Флота прибыл."
      - "По пути мы встретили оруженосца Ортодоксии. Она хочет с тобой поговорить, так что я передаю ей связь."
  - char: "forbin_rad"
    side: "left"
    text:
      - "Я Форбин, сятой рыцарь Ортодоксии! Я здесь, чтобы принять участие в вашей операции по приказу кардинала Ришелье!"
  - char: "commander"
    side: "right"
    text:
      - "Погоди, Форбин?.. Ты можешь связаться с Ришелье на таком расстоянии?.."
  - char: "forbin_rad"
    side: "left"
    text:
      - "Ну, могла! Я получила очень короткое сообщение от Кардинала. Она сказала, что прямо сейчас они разбираются с иллюзиями в Европе!"
  - char: "commander"
    side: "right"
    text:
      - "(Это хорошие новости. Значит, Синано и Клемансо отлично справляются. Одной проблемой меньше.)"

chapter4:
  rows:
  - char: "nagato_rad"
    side: "left"
    text:
      - "Это Нагато. Мой флот на позиции."
  - char: "commander"
    side: "right"
    text:
      - "Отлично. Спасибо, что сообщила."
  - char: "hornet_ii_rad"
    side: "left"
    text:
      - "Эй, это Хорнет! Со своим Тип II и всё такое! Я уже в пути!"
      - "Йорктаун остаётся в SD, поэтому она передала командование нашим флотом мне!"
  - char: "enterprise_rad"
    side: "right"
    text:
      - "Правильное решение. Она помогает в управлении базой, поэтому лучше, чтобы она оставалась там, пока не будут решены все проблемы, вызванные иллюзиями."
  - char: "hornet_ii_rad"
    side: "left"
    text:
      - "Да, она так мне и сказала! О, и ещё она расстроена, что ей не удалось встретиться с Командиром, но всегда есть следующий раз!"
      - "Блин, вы трое так близки. Командир, Энти и Йорки сидят на дереве..."
  - char: "enterprise_rad"
    side: "right"
    text:
      - "Хорнет..."
  - char: "hornet_ii_rad"
    side: "left"
    text:
      - "Ой-ой! Это мой сигнал заткнуться! Прости!"
  - char: "enterprise_rad"
    side: "right"
    text:
      - "Кхм. Командир, наш флот прибудет через час. К сожалению, флоту Хорнет потребуется два часа даже на максимальной скорости, чтобы добраться сюда."
      - "Мы не хотим давать врагу слишком много времени, поэтому давайте начнём атаку через час. Союз Орла возглавит наступление — остальные флоты смогут пойти по нашему следу."
  - char: "commander"
    side: "left"
    text:
      - "Без проблем. Тогда атака начнётся через один час."
