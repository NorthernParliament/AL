chapter1:
  rows:
  - text:
      - "В конце концов, даже превосходное оборудование связи на Киритимати не смогло соединить их с базой в SD."
      - "Но, к счастью для девочек, им поступил звонок от весьма неожиданной персоны."
  - char: "enterprise_rad"
    side: "left"
    text:
      - "Это Энтерпрайз, флагман Тихоокеанского флота."
      - "Я думала, мы полностью потеряли Киритимати... Слава богу, вы живы и здоровы."
      - "Кто бы ни был за главную, не могла бы ты ввести меня в курс дела?.."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Энтерпрайз?!"
      - "Ах, ты в порядке... Какое облегчение."
      - "Ну, если вкратце..."

chapter2:
  rows:
  - char: "enterprise_rad"
    side: "left"
    text:
      - "Понимаю. Даже Самоа не спаслось от иллюзии."
      - "Вы отлично справились с ситуацией."
      - "Мы выступили, как только поняли, что Киритимати находится на грани падения. Прямо сейчас направляемся к вам."
  - char: "indiana"
    side: "right"
    text:
      - "Есть идеи, что вообще происходит в Тихом Океане?.. Ты знаешь, кто враг, или что случилось с нашей базой в SD?.."
  - char: "enterprise_rad"
    side: "left"
    text:
      - "Извини, я ничего не знаю. Я надеялась, что вы в курсе."
      - "Всё, что я могу сказать, это то, что по всему Тихому Океану работают глушилки, и что все наши базы оказались под воздействием иллюзии."
      - "И это не ограничивается только Тихим Океаном. Это затронуло нашу базу в SD, Нью-Йорк и даже DC. Мы ни с кем из них не можем связаться."
      - "Хотя возможно, что это просто из-за глушения, я думаю, нам следует исходить из худшего сценария."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Боже мой..."
      - "На тебя иллюзия тоже подействовала?.. И ты смогла из неё вырваться?.."
  - char: "enterprise_rad"
    side: "left"
    text:
      - "Да. Мне приснился сон о..."

chapter3:
  rows:
  - text:
      - "Пламя. Пламя, насколько хватает глаз."
      - "Среди этого пекла — незнакомка, но в то же время до боли знакомая..."
  - char: "enterprise_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Пришла поболтать, да?.."
  - char: "enterprise"
    side: "left"
    text:
      - "Нет... У меня ещё есть незаконченные дела. Мне нельзя терять ни минуты."
  - char: "enterprise_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хм. Ладно."
      - "Уходи. Пора просыпаться."
  - text:
      - "Женщина взмахнула рукой, окутывая всё пламенем."
      - "И вот так иллюзия была разрушена."

chapter4:
  rows:
  - char: "enterprise_rad"
    side: "left"
    text:
      - "На самом деле, это неважно."
      - "Важно то, что иллюзия не является нерушимой. Мы все проснулись и пытаемся выиграть эту битву."
      - "Должны быть и другие. В DC, Нью-Йорке... Наверняка есть и другие люди, которые очнулись."
      - "Пока что нам остаётся лишь делать всё, что в наших силах, и верить в наших товарищей."
  - char: "indiana"
    side: "right"
    text:
      - "Согласна."
      - "Я передаю командование тебе. Каков наш план?.."
  - char: "enterprise_rad"
    side: "left"
    text:
      - "Как мы уже выяснили, связь потеряна практически со всеми нашими базами в Тихом Океане."
      - "Включая базы в PH и AF."
      - "У них огромные запасы припасов и оборудования, а также много личного состава, но от них нет никаких вестей."
      - "Если эти две базы попадут в руки врага, ситуация для нас станет куда более сложной."
      - "Нашим главным приоритетом должна стать помощь тем, кому мы можем помочь, и наращивание сил, необходимых для возвращения этих двух баз."
  - char: "indiana"
    side: "right"
    text:
      - "Поняла."
  - char: "enterprise_rad"
    side: "left"
    text:
      - "Банкер Хилл и некоторые другие сейчас ведут бой с врагом. Они прибыли с базы на Маршалловых Островах."
      - "Судя по их внешнему виду, я подозревала, что это внезапная атака сакуранцев, но теперь я полностью исключила эту вероятность благодаря разведданным, которые вы только что предоставили."
      - "Я переслала информацию Банкер Хилл и приказала ей не провоцировать никакие сакуранские базы."
      - "Пока мы не отбьём PH и AF, мы вынуждены играть от обороны."
      - "К счастью, отвоевав Киритимати, вы выиграли для нас много времени. Возможно, вы даже спасли наши души."
      - "Как только мы убедимся, что все наши базы уцелели, мы сосредоточимся на пробуждении как можно большего числа людей..."
  - char: "indiana"
    side: "right"
    text:
      - "Позволь мне прервать тебя. Я согласна, что пробуждение людей находится на верхних строчках нашего списка задач..."
      - "Но у врага огромное преимущество, И мы ни с кем не можем связаться. Слишком сильно распылять наши силы чересчур опасно."
  - char: "enterprise_rad"
    side: "left"
    text:
      - "Я знаю. Мой план это учитывает."
      - "Мы не собираемся разделяться. Мы просто разошлём самолёты, чтобы пробудить остальных."
      - "Самолёты могут использовать один из этих талисманов для создания входа в иллюзию, сбросить другой, чтобы кого-то разбудить, а затем при возможности нанести удар по врагу. Как вам такое?.."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Да... это легче сказать, чем сделать. Потребуется нечеловеческая точность, чтобы сбросить талисман прямо кому-то на лоб."
      - "Я думаю, более эффективным подходом было бы напрямую связаться с теми, кто находится под иллюзией, как мы сделали с группой Дьюи."
  - char: "enterprise_rad"
    side: "left"
    text:
      - "Верно. Это не такой уж и простой сброс..."
      - "Значит, вариантов немного. Нам просто придётся рассредоточиться как можно меньше, выполняя наши задачи в порядке приоритета."
      - "И даже тогда есть риск, что враг обнаружит нас и уничтожит наши изолированные спасательные флоты..."
  - char: "fargo"
    side: "right"
    text:
      - "Если всё, что нам нужно сделать, это выйти с ними на связь, моих дронов для этой задачи более чем достаточно."
      - "Мои дроны Fargo Direct могут сбрасывать партии талисманов с воздуха и даже воспроизводить звук."
      - "Наши самолёты смогут сосредоточиться на сопровождении сил и устранении отбившихся врагов. Мои дроны займутся всем остальным."
      - "Это обеспечит нам большую оперативную точность при одновременном спасении людей."
      - "Используя своё бортовое оборудование, дроны также могут усилить нашу связь, облегчая обмен разведданными и позволяя передавать задачи и приказы."
  - char: "enterprise_rad"
    side: "left"
    text:
      - "Комбинация дронов и самолётов, работающих в тандеме... Стоит попробовать."
      - "Хорошо. Наши самолёты разберутся с любыми врагами, которые нам встретятся."
      - "Как будете готовы, мы отправимся на PH и AF."
  - char: "indiana"
    side: "right"
    text:
      - "Поняла. Устроим этим ублюдкам сущий ад!"

chapter5:
  rows:
  - text:
      - "В лучах заката девушка проводила последние проверки в окружении дронов."
  - char: "fargo"
    side: "left"
    text:
      - "Пункт назначения: База в SD. Замена голосового пакета на NINJABELL. Настройка завершена."
  - text:
      - "Она поместила талисман в грузовой отсек дрона, после чего он взлетел, заняв место в строю с самолётами."
  - char: "fargo"
    side: "left"
    text:
      - "Следующий. Пункт назначения: База у Панамского канала. Замена голосового пакета на NINJABELL. Настройка завершена."
      - "Следующий. Пункт назначения: Остров Пасхи..."
  - text:
      - "Один за другим дроны поднимаются в небо и объединяются с самолётами, на своих крыльях они несут и груз, и надежду."
  - char: "fargo"
    side: "left"
    text:
      - "Если всё пройдёт гладко, это в корне изменит ситуацию."
