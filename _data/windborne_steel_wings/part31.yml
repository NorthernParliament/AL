chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "indiana"
    side: "left"
    text:
      - "Харуцуки! Ты в порядке?"
  - char: "harutsuki"
    side: "right"
    text:
      - "Я-я в порядке, спасибо!"
  - char: "indiana"
    side: "left"
    text:
      - "Эти Сирены Типа IV не шутят. Не теряй бдительности."
  - char: "harutsuki"
    side: "right"
    text:
      - "Хорошо! Я буду осторожна."
  - char: "indiana"
    side: "left"
    text:
      - "Идём со мной. Мы перегруппируемся с сакуранками."
  - char: "harutsuki"
    side: "right"
    text:
      - "Слушаюсь!"
      - "Стой! Индиана, сзади!"
  - char: "indiana"
    side: "left"
    text:
      - "Чёрт возьми! Стоит отвернуться на секунду, и они набрасываются на тебя, как гиены!"
      - "Думаете, сможете застать меня врасплох?!"

chapter2:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "indiana"
    side: "left"
    text:
      - "Ещё одно вместилище Тестер уничтожено. Одно очко в мою пользу."
      - "Фух. Похоже, этой вражеской цитадели задают жару."
      - "Такими темпами мы мигом управимся. Ха-ха."

chapter3:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "Получила отчёт от Чэнь Хай! Они уничтожили то, что, по их мнению, является устройством управления Штормом!"
      - "Кроме того, скоординированная атака на цитадель идёт полным ходом! Задача миссии должна быть выполнена довольно скоро!"
  - char: "commander"
    side: "right"
    text:
      - "Хорошо! Как только крепость будет разрушена, все флоты покинут этот район. Уничтожение мейнфрейма Тестер придётся отложить до другого раза, когда мы будем лучше подготовлены."
  - char: "hornet_ii_rad"
    side: "left"
    text:
      - "Ну, насчёт этого мейнфрейма — я думаю, она выставляет его напоказ для нас."
      - "Посылаю тебе собранные мной разведданные. Взгляни."
  - text:
      - "Хорнет присылает мне снимок и набор координат."
      - "На снимке изображён огромный разлом, зависший над морем, как будто кто-то пробил гигантскую дыру в пространстве."
      - "По ту сторону дыры виднеются тысячи слабо светящихся линий, а на заднем плане — раскинувшийся стальной город, расположенный в море электроники."
  - char: "memphis"
    side: "left"
    text:
      - "Это правда он?.. Её мейнфрейм?.."
      - "Она специально открыла его нам?.."

chapter4:
  rows:
  - char: "tester"
    side: "right"
    status: "is-red"
    text:
      - "План предотвращения вторжения должен быть выполнен... Шторм должен быть реконструирован..."
      - "Фактические показатели Тестового полигона... намного превышают прогнозируемые значения..."
      - "Запрашиваю разрешение на локальную зачистку..."

chapter5:
  rows:
  - char: "bell"
    side: "left"
    text:
      - "«Зачистку»?.. Звучит скверно!"
  - char: "fargo"
    side: "right"
    text:
      - "Очень скверно. Компилятор пыталась запустить то же самое, когда мы прорвались в её мейнфрейм."
      - "Наши силы слишком рассредоточены, чтобы сразиться с ней. Я считаю, мы должны отступить, прежде чем она успеет её активировать."
  - char: "herring"
    side: "left"
    text:
      - "чего бы ей так всё обострять?! Мы ведь даже не гонимся за её проклятым мейнфреймом!"
  - char: "pittsburgh"
    side: "right"
    text:
      - "Может быть, дело не в нас... А в ком-то другом!"

chapter6:
  rows:
  - char: "tester"
    side: "right"
    status: "is-red"
    text:
      - "В ЗАПРОСЕ ОТКАЗАНО."
      - "ВАШЕ ВМЕСТИЛИЩЕ ДЕМОНСТРИРУЕТ ПРИЗНАКИ ВМЕШАТЕЛЬСТВА. ЗАПУСТИТЕ ПРОЦЕДУРУ САМОДИАГНОСТИКИ."
      - "Самодиагностику ПРЯМО СЕЙЧАС?!"
      - "Я в полном порядке! Я что, похожа на неисправную?!"
      - "Пох-пох-пох-похожа на-на не-не-неисправ..."
  - text:
      - "БАБАХ!!!"

chapter7:
  rows:
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "О боже. Тебе бы показаться мастеру по ремонту."
  - text:
      - "Словно из ниоткуда появился двойник Амаги."
      - "Вместе с этим последнее вместилище Тестер на пути к её мейнфрейму было мгновенно уничтожено."
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Я найду хорошее применение твоему мейнфрейму, если ты не возражаешь."
  - text:
      - "Из её лисьей маски запульсировали тёмные щупальца."
      - "Чёрный туман пронёсся по воздуху, целясь в пространственный разлом, где лежали обломки Тестер и её кораблей."
      - "Но как раз в тот момент, когда они собирались проникнуть в разлом, они ударились о невидимую стену, высекая снопы искр."
      - "Тем временем ещё больше чёрного тумана окутало обломки серийных кораблей. Он стянул их вместе, преобразив в одно-единственное колоссальное судно."

chapter8:
  rows:
  - char: "nagato_rad"
    side: "left"
    text:
      - "Это она! Это Тень Коррозии!"
      - "Она пытается захватить контроль над мейнфреймом Тестер и подключить Ватацуми к своей фальшивой Священной Сакуре!"
      - "Командир, ты должен НЕМЕДЛЕННО остановить её!"

chapter9:
  rows:
  - char: "amagi_m1"
    side: "right"
    status: "is-red"
    text:
      - "Вычислительные ресурсы. Душа. Тело..."
      - "Теперь у меня есть всё."
      - "Орочи! Яви себя мне!"

chapter10:
  rows:
  - text:
      - "Море окутало чёрным туманом коррозии. Сначала он стал порывом ветра, затем торнадо, а затем принял свою окончательную форму коррозийной сущности."
      - "Колоссальный линкор, названный «Орочи», излучал зловещий багровый свет, его форма искажалась."
      - "Затем он сжался, приняв форму человека."
      - "Сначала появилась одна, потом две, затем три, десять, сотня..."
      - "Наконец, зловеще выстроилась багровая толпа людей, словно армия Пешек."
  - char: "nagato_rad"
    side: "left"
    text:
      - "Эти... штуки... они не кансен."
      - "И они не Пешки, и не корабли... и уж точно не люди!"
      - "Это безумие!"
      - "Что ты наделала?! Ты ужасным образом злоупотребила силой Ватацуми!"
  - char: "amagi_m100"
    side: "right"
    status: "is-red"
    text:
      - "Ахахахахаха!"
      - "Я сделала это!"
      - "Я так, так счастлива!"
  - text:
      - "Какофония смеха разнеслась эхом по всему морю."
  - char: "memphis"
    side: "left"
    text:
      - "Зафиксирована аномальная погода! Появляются коррозийные сущности... и серийные корабли... Боже мой, их так много!"
  - char: "nagato_rad"
    side: "right"
    text:
      - "Сила самозванки всё ещё растёт... Но как?.. У неё не должно быть силы вне иллюзии..."
      - "Мейнфрейм! Вот оно что! В случае необходимости, мы должны поставить на кон свои жизни, чтобы не дать ей добраться до него!"
  - char: "memphis"
    side: "left"
    text:
      - "Но как?.. Этот коррозийный шторм слишком опасен, чтобы приближаться!"
  - char: "chen_hai_rad"
    side: "right"
    text:
      - "Решение есть! Этот шторм очень похож на тот, что мы разрушили чуть ранее! Более того, он уже крайне нестабилен!"
      - "Я верю, что мы сможем рассеять его, используя ракеты «Дунъюй»!"
  - char: "commander"
    side: "left"
    text:
      - "Попытка не пытка! Действуйте!"
      - "Подразделения Империи Дракона, атакуйте коррозийный шторм своими «Дунъюй»!"
      - "Подразделения Железной Крови, защищайте их!"
      - "Энтерпрайз, Банкер Хилл, Питтсбург, рассейте толпу двойников Амаги!"
      - "Мы направимся к мейнфрейму Тестер и любой ценой не дадим главной Амаги проникнуть внутрь!"
