chapter1:
  rows:
  - text:
      - "Голубые небеса, белые облака и сказочный рай, окружённый морем. Самоанским островам нет дела до смены времён года."
      - "Посреди этих тропиков была девушка, пилотирующая самолёт."
  - char: "fargo"
    side: "left"
    text:
      - "Результаты: умеренный ветер, влажность 83%, что на 3% выше, чем вчера; температура 80 градусов по Фаренгейту, примерно такая же, как в это же время вчера."
      - "В зоне наблюдения моего самолёта дождевых облаков не обнаружено."
      - "Вероятность осадков составляет 1% в ближайшие 8 часов, 15% в ближайшие 16 часов и 23% в ближайшие 24 часа."
  - char: "bell"
    side: "right"
    text:
      - "Короче говоря, в целом погода отличная."
  - char: "herring"
    side: "left"
    text:
      - "Чёрт возьми, вот это профессионализм. С Фарго и метеостанция не нужна!"
  - char: "fargo"
    side: "right"
    text:
      - "Спасибо, что воспользовались нашей службой прогноза погоды. А теперь, пожалуйста, оплатите штраф."
  - char: "bell"
    side: "left"
    text:
      - "Ш-штраф?.. Ты собираешься взять с нас деньги?.."
  - char: "fargo"
    side: "right"
    text:
      - "Это была шутка."
  - char: "herring"
    side: "left"
    text:
      - "Совершенно не похоже на шутку!"
  - char: "fargo"
    side: "right"
    text:
      - "О. Наверное, это потому, что я всё ещё тренирую мимику. Позвольте мне повысить индекс счастья на 200%. Кхм..."
      - "Я просто хотела сказать какую-нибудь глупость! Не воспринимайте всё так серьёзно!"
  - char: "herring"
    side: "left"
    text:
      - "......"
  - char: "bell"
    side: "right"
    text:
      - "......"
  - char: "fargo"
    side: "left"
    text:
      - "Я переборщила, да?.."
  - char: "bell"
    side: "right"
    text:
      - "Немного. Ахахаха..."
  - char: "herring"
    side: "left"
    text:
      - "В любом случае, теперь мы знаем, что погода останется хорошей. Это облегчит нам задачу."
      - "Вы все готовы отправляться?.."
  - char: "bell"
    side: "right"
    text:
      - "Эм, конечно... Мы правда сделаем это?.."
  - char: "herring"
    side: "left"
    text:
      - "Поздно давать заднюю. Девочки уже ждут нас в лагере."
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "herring"
    side: "left"
    text:
      - "Это Питтсбург вызывает. Наверное, уже всё обустроила. Алло?.."
  - char: "pittsburgh_rad"
    side: "right"
    text:
      - "Херринг, мы тут закончили."
      - "Вас ждёт палатка, гриль и прекрасные самоанские пейзажи."
      - "Как у вас дела идут?.."
  - char: "herring"
    side: "left"
    text:
      - "Рассла-а-абься, у нас есть всё необходимое, и в большом количестве. Кстати, чем занята Индиана?.."
  - char: "pittsburgh_rad"
    side: "right"
    text:
      - "Она ушла в лес собирать дрова."
  - char: "fargo"
    side: "left"
    text:
      - "Дрова?.. Зачем?.."
  - char: "pittsburgh_rad"
    side: "right"
    text:
      - "Топливо для гриля."
  - char: "fargo"
    side: "left"
    text:
      - "Но наш гриль работает на специальном древесном угле, созданном именно для него."
      - "Ты могла просто попросить меня принести ещё. Я же эксперт по логистике, помнишь?.."
  - char: "pittsburgh_rad"
    side: "right"
    text:
      - "Да, именно это я и сказала Индиане."
      - "Но она всё равно настояла на своём. Сказала что-то о том, что не может сидеть на месте и хочет сделать что-нибудь безумное, пока мы здесь."
  - char: "bell"
    side: "left"
    text:
      - "Она... Она ведь знает, что у нас на обед консервированная селёдка, да?.."
      - "Насколько безумнее всё должно стать, чтобы удовлетворить её?.."
  - char: "pittsburgh_rad"
    side: "right"
    text:
      - "Без понятия."
  - char: "fargo"
    side: "left"
    text:
      - "Ха. Мне нравится её энтузиазм."
  - char: "bell"
    side: "right"
    text:
      - "Погоди, это ты сейчас говорила, Фарго?!"
  - char: "fargo"
    side: "left"
    text:
      - "Да?.. А что такое?.."
  - char: "bell"
    side: "right"
    text:
      - "Ты проявила эмоции, не настраивая свои индексы или что там ещё! У тебя получилось!"
  - char: "fargo"
    side: "left"
    text:
      - "Да, да..."
  - char: "herring"
    side: "right"
    text:
      - "Пусть Индиана развлекается. Я смогу вкусно приготовить консервированную селёдку даже на обычных дровах."
  - char: "fargo"
    side: "left"
    text:
      - "Я в тебя верю."
  - char: "herring"
    side: "right"
    text:
      - "О, правда?.. Тогда что в этой большой коробке позади тебя?.."
  - char: "fargo"
    side: "left"
    text:
      - "Дополнительные ингредиенты. Это контейнер-морозильник, чтобы сохранить их свежими."
  - char: "herring"
    side: "right"
    text:
      - "«Я в тебя верю», как же! Знаешь что?.. Я приготовлю нечто настолько вкусное, что ты будешь прыгать от радости, попробовав это!"
  - char: "pittsburgh_rad"
    side: "left"
    text:
      - "Хи-хи. Я сейчас скину координаты, так что не задерживайтесь. О, и не забудьте вино."
  - char: "bell"
    side: "right"
    text:
      - "Поняла!"
  - char: "herring"
    side: "left"
    text:
      - "Пусть пикник начнётся! Пришло время очистить доброе имя консервированной сельди и доказать, насколько она хороша на самом деле!"
      - "Вперёд, в будущее, где Херринг — Царь-рыба!"
