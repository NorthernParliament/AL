chapter1:
  rows:
  - text:
      - "Пакеты с продуктами стояли у входа в резиденцию, до краев наполненные вкусностями, готовыми стать частью пиршества, которое должно было состояться в особняке сегодня вечером."
  - char: "lexington"
    side: "left"
    text:
      - "Сара, в этот раз ты действительно переборщила."
  - char: "saratoga"
    side: "right"
    text:
      - "Может быть, немного, но это оправдано. Я пригласила ку-у-у-уучу людей на сегодня! Энтерпрайз, Хорнет — в общем-то, почти всех!"
      - "Мы же не можем скупиться, когда устраиваем такую грандиозную вечеринку, верно?.."
  - char: "lexington"
    side: "left"
    text:
      - "Хи-хи. Это правда. Мы должны отпраздновать с размахом, раз уж наши отпуска так удачно совпали."
      - "Оставляю сортировку на тебя. Я закончу с уборкой, а затем мы начнем готовить еду."
  - char: "saratoga"
    side: "right"
    text:
      - "Конечно!"
  - text:
      - "Лексингтон вошла в гостиную, и на какое-то короткое мгновение всё стихло."
  - char: "nop"
    side: "right"
    status: "is-red"
    text:
      - "ПИП... ПИП... ПИП..."
  - text:
      - "Раздался едва слышный писк. Звук, похожий на жестокие часы, отсчитывающие секунды до смерти."
  - char: "saratoga"
    side: "left"
    text:
      - "Снова этот звук..."
      - "Хоть бы он просто прекратился..."

chapter2:
  rows:
  - text:
      - "Светило солнце, и небо было ясным — идеальная погода для партии в гольф."
  - char: "saratoga"
    side: "left"
    text:
      - "Я слышала, ты очень усердно трудилась в академии, Лекс."
      - "А поскольку усердный труд заслуживает награды, я взяла и забронировала всё это поле для гольфа на сегодня!"
  - char: "lexington"
    side: "right"
    text:
      - "Боже... Я ценю это, правда ценю, но разве оно не слишком велико всего для нас двоих?.."
      - "К тому же бронирование на весь день не могло стоить дёшево."
  - char: "saratoga"
    side: "left"
    text:
      - "Ну и что с того?.. Чем больше, тем лучше, я считаю!"
  - char: "lexington"
    side: "right"
    text:
      - "Сара... Ты ведь ничего от меня не скрываешь, да?.."
  - char: "saratoga"
    side: "left"
    text:
      - "А?.. Что ты имеешь в виду?.. Мне НЕЧЕГО скрывать!"
      - "Посмотри на эту широкую улыбку на моём лице! Такое лицо у меня бывает, когда меня в этом мире ничто не беспокоит!"
      - "Если хочешь моего совета, тебе стоит сосредоточиться на своих ударах, иначе твоя младшая сестрёнка победит проще простого!"
  - char: "lexington"
    side: "right"
    text:
      - "Боже мой, какие громкие слова из твоих уст!"
      - "Но матчи выигрывают не громкие слова, а мастерство — и ты станешь свидетельницей моего."
  - char: "saratoga"
    side: "left"
    text:
      - "Вот это другой разговор. Как насчет небольшой разминки, а потом сразу приступим к делу?.."
  - char: "lexington"
    side: "right"
    text:
      - "Звучит отлично. Я скоро вернусь."
  - text:
      - "Лексингтон ушла. На мимолетное, одинокое мгновение на поле для гольфа воцарилась тишина."
  - char: "nop"
    side: "right"
    status: "is-red"
    text:
      - "ПИП... ПИП... ПИП..."
  - text:
      - "Раздался едва слышный писк. Звук, похожий на жестокие часы, отсчитывающие секунды до смерти."
  - char: "saratoga"
    side: "left"
    text:
      - "Нет, пожалуйста, умоляю..."
      - "Пусть это прекратится..."

chapter3:
  rows:
  - text:
      - "Праздничные песни разносились эхом по улицам, а неоновые огни и ленты раскрасили фасады, уличные фонари и витрины в цвета Рождества."
  - char: "saratoga"
    side: "left"
    text:
      - "Вау, посмотри на все эти магазины с рождественскими скидками и акциями! Мой кошелек возненавидит меня за это, но кого это волнует!"
  - char: "lexington"
    side: "right"
    text:
      - "Их и правда много. Но разве ты не достаточно уже накупила на сегодня?.."
  - char: "saratoga"
    side: "left"
    text:
      - "Ни за что! Нам нужно обойти ещё три квартала магазинов!"
      - "К тому же завтра прибывает эта сакуранская делегация, помнишь?.. Нам нужно подготовить подарки!"
      - "Я много слышала об Амаги. Честно говоря, мне всегда хотелось с ней познакомиться!"
  - char: "lexington"
    side: "right"
    text:
      - "Верно. Амаги. С сакуранской делегацией..."
      - "Позволь спросить... Ты правда думаешь, что она приедет?.."
  - char: "saratoga"
    side: "left"
    text:
      - "Да... Мы планировали это довольно долгое время. Было бы омега-грубо отменить всё в последнюю минуту."
      - "С чего это ты вдруг спрашиваешь?.."
  - char: "lexington"
    side: "right"
    text:
      - "Да так, без причины. Я просто так счастлива, что кажется, будто я сплю. Как будто всё это слишком хорошо, чтобы быть правдой."
      - "Ты чувствуешь что-нибудь подобное?.. Хоть немного?.."
  - char: "saratoga"
    side: "left"
    text:
      - "Л-Лекс, ну же... Не порти настроение..."
      - "Не бывает «настоящего» или «фальшивого» счастья."
      - "Пока мы счастливы и Командир здесь с нами, чего ещё можно желать?.."
  - char: "lexington"
    side: "right"
    text:
      - "Сара... Я знаю, что последние несколько дней тебя что-то сильно тяготит."
      - "Я твоя сестра. Я могу сказать, когда ты мне что-то не договариваешь."
  - char: "saratoga"
    side: "left"
    text:
      - "Хватит портить настроение, хорошо?.. Скоро Рождество, так что давай лучше веселиться!"
      - "Эй, смотри, это сестры Колорадо! Давай посмотрим, что они купили!"

chapter4:
  rows:
  - char: "saratoga"
    side: "left"
    text:
      - "Мэриленд! Колорадо! Вест Вирджиния! Привееет!"
  - char: "maryland"
    side: "right"
    text:
      - "Ба, кого я вижу, Лекс и Сара! Тоже выбрались за рождественскими покупками, да?.."
  - char: "saratoga"
    side: "left"
    text:
      - "Ага-ага! Закупаемся от всей души."
  - char: "maryland"
    side: "right"
    text:
      - "Ахахахах! Рада это слышать. Нам ещё нужно заглянуть кое-куда, так что увидимся позже! Счастливого Рождества!"
  - char: "saratoga"
    side: "left"
    text:
      - "Счастливого Рождества! Повеселитесь там!"

chapter5:
  rows:
  - char: "saratoga"
    side: "left"
    text:
      - "Видишь, Лекс?.. Рождество — это сплошное веселье."
  - char: "lexington"
    side: "right"
    text:
      - "Мэриленд, Колорадо и Вест Вирджиния..."
      - "Если отчёт, который я читала, был верен, их перевели в оборонительный флот DC в награду за их блестящие результаты во время службы на PH."
      - "Это действительно правда?.."
  - char: "saratoga"
    side: "left"
    text:
      - "Что?.. Конечно это..."
  - char: "lexington"
    side: "right"
    text:
      - "Сара. Посмотри мне в глаза."
  - char: "saratoga"
    side: "left"
    text:
      - "О-обязательно?.."
  - char: "lexington"
    side: "right"
    text:
      - "Да. Прислушайся к своему сердцу и ответь мне."
      - "Это ПРАВДА то, что произошло?.."
  - char: "saratoga"
    side: "left"
    text:
      - "……"
      - "Нет. Это не так."
      - "Они... Они были переведены на PH незадолго до того, как произошла та Реконструкция, и оказались втянуты в неё."
      - "Они сражались не на жизнь, а на смерть, но всё равно получили тяжелейшие повреждения."
      - "Они долгое время восстанавливались, но их раны были слишком серьёзными. В конце концов, они были законсервированы."
      - "А затем произошёл прорыв в технологии модернизации, который позволил перестроить их оснастку. Лишь совсем недавно они наконец-то вернулись на передовую и были распределены по постам по всей стране..."
  - char: "lexington"
    side: "right"
    text:
      - "А что насчёт Йорктаун?.. Недавно мы устраивали с ней вечеринку."
  - char: "saratoga"
    side: "left"
    text:
      - "Корпус Йорктаун подвергся коррозии после Реконструкции на AF. Её шансы на выздоровление всегда были невелики."
      - "Так было до тех пор, пока Командир не использовал технологию Типа II, чтобы чудесным образом полностью её исцелить."
      - "Она завершила свою программу реабилитации в Море Звёзд и должна была вернуться в строй."
  - char: "lexington"
    side: "right"
    text:
      - "Хорошо... А что насчёт меня?.."
  - char: "saratoga"
    side: "left"
    text:
      - "Просто... Просто перестань задавать эти вопросы, пожалуйста."

chapter6:
  rows:
  - char: "nop"
    side: "right"
    text:
      - "ПИП... ПИП... ПИП..."
  - text:
      - "Писк был громким и отчётливым."
      - "Он звучал ещё холоднее и жёстче, чем обычно."
  - char: "lexington"
    side: "right"
    text:
      - "Что стало со мной?.."
      - "Разве я веду счастливую жизнь вместе с тобой вдали от передовой?.."
  - char: "saratoga"
    side: "left"
    text:
      - "А разве мы все не должны?.. Что плохого в том, чтобы быть счастливыми?!"
  - char: "lexington"
    side: "right"
    text:
      - "Успокойся, Сара. Ответь мне."
  - char: "saratoga"
    side: "left"
    text:
      - "Лексингтон... Ты..."
      - "Ты получила тяжелые коррозийные повреждения во время Реконструкции в Коралловом море."
      - "Ты так и не оправилась от ран, и до сих пор нет известного способа тебя вылечить..."
      - "И по сей день ты всё ещё лежишь в медицинской капсуле в Море Звёзд..."
      - "Это несправедливо..."
      - "хнык... Они все так или иначе поправились... но ты всё ещё больна..."
      - "Почему?.. Почему ты не возвращаешься ко мне?.."
  - char: "lexington"
    side: "right"
    text:
      - "Я не знаю почему."
      - "Всё, что я знаю, это то, что ты не можешь оставаться здесь вечно."
      - "Любые сны должны когда-нибудь заканчиваться."
  - char: "saratoga"
    side: "left"
    text:
      - "Но..."
  - char: "lexington"
    side: "right"
    text:
      - "Открой глаза, Сара."
      - "Ты нужна своим друзьям. Ты нужна им в реальности. Командир тоже ждёт тебя."
      - "Я уверена, что ты это и так знаешь."

chapter7:
  rows:
  - char: "saratoga"
    side: "left"
    text:
      - "Да, я знаю..."
      - "Я прекрасно это знаю..."
      - "Я знаю, что должна делать. Я должна продолжать сражаться."
      - "Пока я продолжаю сражаться, всегда остаётся надежда на то что всё изменится..."
  - char: "care_pod"
    side: "right"
    text:
      - "ПИП... ПИП... ПИП..."
  - text:
      - "Раздался едва слышный писк. Размеренный и холодный, как волны мёртвого моря, плещущиеся о пустынный берег."
  - char: "saratoga"
    side: "left"
    text:
      - "Теперь я уйду, Лекс."
      - "Ты во всём права. В реальном мире есть люди, которым я нужна."
      - "ТБ, приём?.."
  - char: "tb_rad"
    side: "right"
    text:
      - "Это ТБ. Ожидаю приказов."
  - char: "saratoga"
    side: "left"
    text:
      - "Отлично! Я отправляюсь в диспетчерскую. Тем временем выясни, что происходит в Море Звёзд."
      - "Мы дадим им отпор."
