chapter1:
  rows:
  - text:
      - "Голубые небеса, белые облака и сказочный рай, окружённый морем. Самоанским островам нет дела до смены времён года."
      - "Среди этих тропиков мчался по сверкающим волнам флот девушек-кораблей."
  - char: "shimanto"
    side: "left"
    text:
      - "Госпожа Нагато, мы с Харуцуки скоро прибудем к цели."
      - "Я пока не видела ничего необычного... но у меня какое-то жутковатое чувство."
      - "Всё это время было облачно, а потом, как только мы приблизились к острову, внезапно выглянуло солнце."
      - "Даже если на первый взгляд всё кажется мирным, можно с уверенностью предположить, что над этим морем нависла какая-то искажённая иллюзия."
      - "Поняла. Будь уверена, госпожа, мы с этим разберёмся."
      - "Береги себя. Мы вернёмся, как только наша миссия здесь будет завершена."
  - text:
      - "Симанто повесила трубку, затем посмотрела на Харуцуки и что-то ей сказала."
      - "Они включили двигатели на полную мощность и разделились, оставив за собой сотни сикигами. Сикигами создали вишнёво-розовый магический круг."
  - char: "harutsuki"
    side: "right"
    text:
      - "Бог Дракон, всё готово. Мы можем прорваться, когда будешь готова!"
  - char: "shimanto"
    side: "left"
    text:
      - "Хорошо. С помощью этих сикигами, созданных при поддержке госпожи Нагато, мы проникнем внутрь этой огромной иллюзии."
      - "Змей-сикигами, высвободи свою божественную мощь!"

chapter2:
  rows:
  - text:
      - "Полуденное солнце светило над островом, отбрасывая тени деревьев на землю."
  - char: "bell"
    side: "left"
    text:
      - "Прошлый вечер был великолепен! И время пролетело так незаметно. Оглянуться не успели, как уже глубокая ночь!"
  - char: "pittsburgh"
    side: "right"
    text:
      - "Ух... У меня кружится голова..."
  - char: "bell"
    side: "left"
    text:
      - "Я не знаю, как ты это сделала, но ты РЕАЛЬНО напилась газировкой..."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Ммгх... Дай ещё одну... Ваше здоровье..."
  - char: "indiana"
    side: "left"
    text:
      - "Не похоже, что она скоро встанет."
      - "Подруга, та селёдка, которую ты вчера приготовила, отлично подошла к коктейлю... Не могу отрицать, это было довольно интересно."
  - char: "herring"
    side: "right"
    text:
      - "О-о, неужели я слышу признание?.. Признание того, что селёдка хороша?.."
  - char: "indiana"
    side: "left"
    text:
      - "Признаю. К тому же селёдка богата белком, так что это отличная еда для наращивания мышечной массы."
  - char: "herring"
    side: "right"
    text:
      - "А физические упражнения вообще, ну знаешь, как-то влияют на наши тела?.. Есть ли под этим какая-то научная основа?.."
  - char: "indiana"
    side: "left"
    text:
      - "Никакая наука не нужна. Всё, что тебе нужно, это вера и решимость. И мотивация!"
  - char: "herring"
    side: "right"
    text:
      - "Угу. Вера, решимость, и... Погоди-ка, мы отклонились от темы!"
      - "Консервированная селёдка! Что ты о ней думаешь?.."
  - char: "indiana"
    side: "left"
    text:
      - "Ну, всё, что ты приготовила вчера, было вкусно... за исключением той консервированной селёдки."
  - char: "herring"
    side: "right"
    text:
      - "Чёрт... Значит, частичный успех. Но для меня этого недостаточно. В следующий раз я сделаю всё идеально!"
  - char: "bell"
    side: "left"
    text:
      - "Подожди... Мы будем делать это снова?.."
  - char: "herring"
    side: "right"
    text:
      - "Снова и снова, пока вы все не помешаетесь на консервированной селёдке!"
  - char: "bell"
    side: "left"
    text:
      - "Ну... Полагаю, в комиксах, которые я читаю, ниндзя действительно тренируют себя переваривать всё что угодно... Ладно, раз уж надо!"
  - char: "herring"
    side: "right"
    text:
      - "Расслабься, я не собираюсь вас пытать! Это была просто шутка."
      - "В любом случае, спасибо за отзывы, девочки. Я сосредоточусь на изменении рецепта и сделаю его более вкусным к следующему разу!"
  - char: "indiana"
    side: "left"
    text:
      - "Умница. Продолжай в том же духе, и однажды ты приготовишь что-то, что мы все сможем переварить."
  - char: "herring"
    side: "right"
    text:
      - "Оу, спасибо! Эй, а где Фарго?.. Она всё ещё спит?.."
  - char: "bell"
    side: "left"
    text:
      - "Фарго — полная противоположность соне. Она встала рано утром и сказала, что у неё есть дела."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Хррр... А?.. Какие-то дела?.."
      - "О, чёрт!"
      - "Это напомнило мне! Сегодня сюда приезжает группа туристов из Империи Сакуры!"
      - "Не стоило мне пить всю эту чёртову газировку... Давайте, быстренько приберёмся здесь и приготовимся встречать гостей!"
      - "Амаги возглавляет делегацию! Они могут быть туристами, но это не значит, что мы можем халтурить с их приёмом!"
  - char: "fargo_rad"
    side: "left"
    text:
      - "Быстро ответили. Уже проснулись?.."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Туристы, Фарго! Где они?.."
  - char: "fargo_rad"
    side: "left"
    text:
      - "Успокойся. Я уже накрыла для них на стол. Умывайтесь, переодевайтесь и приходите на третий пирс, где я нахожусь."
  - char: "indiana"
    side: "right"
    text:
      - "Профессионально, как всегда. Молодец, Фарго."
  - char: "pittsburgh"
    side: "left"
    text:
      - "Вы слышали её, девочки. Приводите себя в порядок, а затем нам предстоит поговорить с сакуранками. Скоро здесь будет не протолкнуться!"
  - text:
      - "БУ-У-УМ!"
  - char: "pittsburgh"
    side: "right"
    text:
      - "А?.. Вы это слышали?.."
  - char: "bell"
    side: "left"
    text:
      - "Там... Там только что из ниоткуда появились врата тории?.. Мне ведь это не мерещится, да?.."

chapter3:
  rows:
  - text:
      - "Врата тории, которых точно не было там минуту назад, появились на ровном травянистом поле неподалёку от них."
      - "Что ещё более странно, они увидели двух кансен в сакуранских нарядах по ту сторону врат. Обычным шагом они вышли из них."
  - char: "shimanto"
    side: "left"
    text:
      - "Должно быть, вы — дислоцированный здесь флот Союза Орла. Кхм... Я Симанто, а это Харуцуки."
      - "Мы здесь от имени госпожи Нагато. Не могли бы вы указать на вашего лидера?.. Это важно."
  - char: "indiana"
    side: "right"
    text:
      - "Это буду я. Я Индиана, здесь я за главную. Мы тут в отпуске, так что нас не то чтобы где-то «дислоцировали»."
  - char: "shimanto"
    side: "left"
    text:
      - "Простите?.. В отпуске?.."
      - "Хм... Похоже, одного нашего присутствия здесь недостаточно, чтобы развеять когнитивное вмешательство, вызванное иллюзией."
      - "Ничего страшного. У меня в рукаве есть ещё один трюк."
      - "Стой спокойно."
  - text:
      - "Симанто внезапно сделала шаг вперёд и прилепила бумажный талисман на лоб Индианы."
      - "При контакте он вспыхнул вишнёво-розовым светом, прежде чем распасться на полоски."
  - char: "indiana"
    side: "right"
    text:
      - "Что ты только что... со мной сделала?.."
  - char: "shimanto"
    side: "left"
    text:
      - "Не пугайся. Я просто использовала внешнее средство, чтобы разрушить чары иллюзии, наложенные на тебя."
      - "Теперь ты помнишь?.. Помнишь свою изначальную миссию?.."
  - char: "indiana"
    side: "right"
    text:
      - "Да... Мы — флот, удерживающий позиции здесь, на Самоа, а я — флагман."
      - "Мы не в чёртовом отпуске. Это серьёзное дело."
      - "И всё же я не понимаю... Как я могла об этом забыть до этого самого момента?.."
  - char: "shimanto"
    side: "left"
    text:
      - "Вот это я и пытаюсь выяснить. Я рада, что ты пришла в себя."
  - char: "indiana"
    side: "right"
    text:
      - "Ценю это. А теперь можешь объяснить, как вы сюда попали и как поняли, что мы находимся под какими-то чарами?.."
  - char: "shimanto"
    side: "left"
    text:
      - "Изначально мы с Харуцуки были на Соломоновых Островах вместе с госпожой Нагато."
      - "Что касается того, как мы сюда попали... То, что произошло с вами, случилось и там. Странные враги появились как раз в тот момент, когда это произошло."
      - "Нам удалось разрушить иллюзию и каким-то образом удержать острова, но затем мы потеряли связь с базой на соседних Маршалловых Островах."
      - "Госпожа Нагато осознала, насколько серьёзна ситуация, и предвидела, что полномасштабная война между нами неизбежна, если мы ничего не предпримем."
      - "Поэтому мы решили попытаться связаться с вами — то есть с Союзом Орла."
      - "Мы пытались дозвониться до каждой вашей базы, о которой знали, но ни одна из них нам не ответила."
  - char: "indiana"
    side: "right"
    text:
      - "Подожди... Ты хочешь сказать, что все до единой нашей базы пострадали от этой иллюзии?.."
  - char: "shimanto"
    side: "left"
    text:
      - "Да. Это единственное объяснение."
      - "В любом случае... Затем госпожа Нагато отправила нас на этот остров, так как он был ближе всего к нам."
  - char: "indiana"
    side: "right"
    text:
      - "Блин, я почти не могу поверить в то, что слышу... От лица всех нас, спасибо, что связались с нами."
      - "Если бы не вы, я бы так и оставалась в неведении."
      - "Как Империя Сакуры справляется со всем этим?.. Вам нужна наша помощь?.."
  - char: "shimanto"
    side: "left"
    text:
      - "Спасибо, но мы в порядке. Тебе следует больше беспокоиться о ситуации на ваших собственных базах."
      - "Возьми эти талисманы. Ты можешь использовать их, чтобы пробуждать людей от иллюзии."
      - "Извини, мне следует добавить... с твоей стороны было бы мудро принять этот дар от Бога Дракона."
  - char: "indiana"
    side: "right"
    text:
      - "Спасибо. Вы сегодня спасли наши шкуры, и мы этого не забудем."
  - char: "shimanto"
    side: "left"
    text:
      - "Пожалуйста. А теперь, прошу нас простить, мы должны вернуться к госпоже Нагато."
      - "Кстати, разрушение иллюзии вернёт погоду в норму. Будет облачно, так что приготовьтесь к этому."
      - "Если хотите моего совета — берите зонтики и дождевики!"
