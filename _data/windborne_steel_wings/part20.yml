chapter1:
  rows:
  - char: "yat_sen_rad"
    side: "left"
    text:
      - "Все как один! Смело вперёд!"
      - "Окончательная победа будет за нами!"
  - text:
      - "Ят Сен произнесла последнюю воодушевляющую речь."
      - "Все линии связи замерли в мёртвой тишине. Каждый флот собирался с духом в ожидании выстрела, знаменующего начало операции."
  - char: "ying_swei"
    side: "left"
    text:
      - "Шторм Альфа — все отслеживаемые показатели в норме. Штормы от Бета до Дельта — всё в норме."
      - "Последняя проверка завершена. Четыре основных отслеживаемых показателя Шторма находятся в пределах нормы."
  - char: "chao_ho"
    side: "right"
    text:
      - "Ура! Победа нам гарантирована, если только Шторм не усилится!"
  - char: "huan_chang"
    side: "left"
    text:
      - "Кхм."
  - char: "chao_ho"
    side: "right"
    text:
      - "Верно, э-э... Всем подразделениям, занять позиции!"
      - "853 корабля типа «Дунъюй» находятся в режиме готовности на передовой, ожидая приказов."
      - "Суда снабжения и грузовые корабли также готовы к отправке."
      - "По нашим оценкам, наших запасов хватит на пять раундов массированных атак, что обеспечит непрерывные действия флота в течение следующих трёх дней."
      - "Для этой операции мы действительно бросили все силы, хе-хе. Бойцам на передовой придётся несладко."
  - char: "huan_chang"
    side: "left"
    text:
      - "Это уж точно."
      - "(Эти корабли типа «Дунъюй» оснащены своими фирменными кассетными ракетами увеличенной дальности «Ледяной Дождь».)"
      - "(Их можно запустить в огромном количестве за короткое время, а их боеголовки при ударе обладают мощным эффектом снижения температуры.)"
      - "(Всё, что нам нужно сделать, — это дестабилизировать термодинамическое равновесие Шторма, и мы победим.)"
      - "Если наши симуляции точны, четырёх раундов массированных атак будет достаточно, чтобы полностью уничтожить четыре главных шторма."
      - "Когда эти четыре исчезнут, Шторм больше не будет стоять между нами и морем."
      - "Единственная настоящая неопределённость — это то, что происходит по ту сторону Шторма."
      - "Мы точно знаем, что активность Сирен вокруг Марианских островов возросла, благодаря разведданным Северного Парламента."
      - "Некоторые предполагали, что их цитадель в этом районе на самом деле и является источником Шторма."
      - "Эта теория практически подтвердилась теперь, когда они начали наращивать силы одновременно с нами."
  - char: "chao_ho"
    side: "right"
    text:
      - "Тогда мы просто сокрушим и их тоже!"
  - char: "ying_swei"
    side: "left"
    text:
      - "Это придётся сделать после того, как мы разберёмся со Штормом."
  - char: "huan_chang"
    side: "right"
    text:
      - "Да. Уничтожение Шторма — на первом месте."
      - "Как только мы это сделаем, нас будет ждать огромная армия Сирен. Битва с ними неизбежна."
      - "К сожалению, нам придётся иметь с ними дело в одиночку. Северный Парламент не может оказать никакой поддержки."
      - "Нам остаётся только сделать всё возможное и ждать. Товарищи, приготовьтесь!"

chapter2:
  rows:
  - text:
      - "Корабли и девушки-корабли Империи Дракона выстроились на передовой в ожидании сигнала к началу."
  - char: "memphis"
    side: "left"
    text:
      - "Боже мой. Я не думала, что они на полном серьёзе собираются бросить вызов Шторму в лоб."
      - "Их симуляции БЫЛИ точны... но я просто не могу избавиться от этой нервозности внутри."
  - char: "commander"
    side: "right"
    text:
      - "Всё будет хорошо. Они ко всему подготовились. Им просто нужно следовать первому шагу плана."
      - "Вот только после этого ситуация станет рискованной. У нас очень мало данных о том, как отреагируют Сирены в Тихом Океане."
  - char: "helena"
    side: "left"
    text:
      - "Я думаю, нам следует ожидать ожесточённой битвы."
  - char: "commander"
    side: "right"
    text:
      - "Согласен. Всем подразделениям, начать обратный отсчёт!"
  - char: "communicator"
    side: "left"
    text:
      - "Восемь... Семь... Шесть... Пять..."
      - "Четыре... Три... Два... Один..."
  - char: "yat_sen_rad"
    side: "right"
    text:
      - "Начать операцию «Ледяной Дракон, сокрушающий ветер»!"
  - text:
      - "В первое мгновение ничего не произошло. Однако, в следующее сотни кораблей типа «Дунъюй» запустили свои кассетные ракеты, озарив штормовые небеса."
      - "Шторм содрогнулся под мощной бомбардировкой. Казалось, он даже сжимается."
      - "Сквозь Шторм прорвался ледяной дракон, воспарив в воздухе, словно радуга."
