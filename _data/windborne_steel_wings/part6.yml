chapter1:
  rows:
  - text:
      - "Наверху висел дым такой густой, что застилал ночное небо. В воздухе выли сирены. Всё вокруг, от моря до суши, было в огне."
  - char: "fargo"
    side: "left"
    text:
      - "Судя по топографии, это похоже на линию обороны Лонг Айленд недалеко от Нью-Йорка."
  - char: "bell"
    side: "right"
    text:
      - "Нью-Йорка?.. Я думала, мы направлялись на Киритимати."
  - char: "indiana"
    side: "left"
    text:
      - "Сомневаюсь, что всё будет так просто. Мы играем по правилам иллюзии."
      - "Фарго, ты видишь что-нибудь ещё?.."
  - char: "fargo"
    side: "right"
    text:
      - "С тех пор, как была атакована линия обороны, здесь должно быть гораздо больше оборонительных сооружений. Но их нигде не видно."
      - "Могу предположить, что эта иллюзия — воссоздание дня нападения."
  - char: "pittsburgh"
    side: "left"
    text:
      - "Это тот день, когда Командир, Балтимор и Викториес отбросили Тестер..."
      - "В то время Дьюи базировалась на Киритимати, и так уж вышло, что она оказалась на линии обороны."
  - char: "herring"
    side: "right"
    text:
      - "Может быть, иллюзия цепляется за прошлые травмы... Если так, Дьюи в опасности! И не только она, но и весь её гарнизон!"
  - char: "indiana"
    side: "left"
    text:
      - "Где они?.."
  - char: "fargo"
    side: "right"
    text:
      - "Я всё ещё ищу. Позволь мне расширить радиус поиска."

chapter2:
  rows:
  - char: "fargo"
    side: "right"
    text:
      - "Судя по моим последним данным... все Сирены были уничтожены."
      - "При всём уважении к Дьюи и её флоту, но они ни за что не смогли бы отбиться от всех этих Сирен в одиночку."
  - char: "indiana"
    side: "left"
    text:
      - "Да, я тоже так думаю. Что-то тут не так."
  - char: "fargo"
    side: "right"
    text:
      - "Нашла их! К берегу направляется флот. Я вижу Дьюи, Холси Пауэлл и даже Хейзелвуд."
  - char: "bell"
    side: "left"
    text:
      - "Слава богу. Мы должны объединиться с ними немедле..."
  - char: "fargo"
    side: "right"
    text:
      - "Подожди. Среди них есть незнакомка в маске."
      - "И это ещё не всё... Я вижу те же самые квази-сакуранские серийные корабли, что и раньше."
  - char: "pittsburgh"
    side: "left"
    text:
      - "О нет. Эти девочки даже не подозревают..."
  - char: "indiana"
    side: "right"
    text:
      - "Время ещё есть. Врываемся туда и давайте спасём их!"
