chapter1:
  rows:
  - char: "tester"
    side: "right"
    status: "is-red"
    text:
      - "Вы испытываете судьбу, кансен Империи Дракона."
      - "Прекратите сражаться и вернитесь на свою базу, и я оставлю вас в покое, пока Шторм снова не заработает."
      - "Или вы можете остаться, и я пущу ко дну каждую из вас."
  - char: "harbin"
    side: "left"
    text:
      - "Ха! Думаешь, мы смиримся с тем, что торчим на суше из-за Шторма?"
  - char: "chang_chun"
    side: "right"
    text:
      - "Подумать только, она считает, что мы просто сложим оружие и смиримся."
  - char: "tai_yuan"
    side: "left"
    text:
      - "Ты знаешь, что не сможешь нас одолеть, поэтому теперь пытаешься выиграть для себя время!"
  - char: "fu_shun"
    side: "right"
    text:
      - "Да! Надерём ей задницу!"

chapter2:
  rows:
  - text:
      - "(Отвергнуть её нелепую сделку.)"
  - char: "commander"
    side: "left"
    text:
      - "Этому не бывать. Ань Шань, тебе слово."
  - char: "an_shan"
    side: "right"
    text:
      - "Если хочешь драки, то нападай! Ну или сдавайся мирно, и мы сохраним тебе жизнь!"

chapter3:
  rows:
  - text:
      - "(Обратить её угрозу против неё самой.)"
  - char: "commander"
    side: "left"
    text:
      - "Да ну? Я отпущу тебя, если ты побежишь обратно в свою цитадель на Марианских островах. Или ты можешь остаться..."
  - char: "chian"
    side: "right"
    text:
      - "И мы отправим тебя на дно морское!"

chapter4:
  rows:
  - text:
      - "(Сказать ей, что под вашим командованием никто не пойдет ко дну.)"
  - char: "commander"
    side: "left"
    text:
      - "Я Командир Лазурного Пути. Я провёл бесчисленное количество сражений по всему земному шару и каждый раз защищал каждую девушку-корабль под своим командованием."
      - "Эта битва не станет исключением."

chapter5:
  rows:
  - char: "tester"
    side: "right"
    status: "is-red"
    text:
      - "Вот и поговорили. Корабли, вперёд!"

chapter6:
  rows:
  - char: "tester"
    side: "right"
    status: "is-red"
    text:
      - "Это ваше последнее предупреждение. Забирай свой флот и отступай прямо сейчас."
  - text:
      - "БАБАХ!!!"
  - char: "harbin"
    side: "left"
    text:
      - "Слышала это? Это был наш окончательный ответ!"
  - char: "tester"
    side: "right"
    status: "is-red"
    text:
      - "……"
  - char: "harbin"
    side: "left"
    text:
      - "В чём дело? Язык проглотила?"
  - char: "chen_hai_rad"
    side: "right"
    text:
      - "Командир, по нашему курсу замечены многочисленные ковчеги Тестер."
  - char: "commander"
    side: "left"
    text:
      - "Вы сможете их одолеть?"
  - char: "chen_hai_rad"
    side: "right"
    text:
      - "Легко."
  - char: "hwah_jah_rad"
    side: "left"
    text:
      - "Мы тоже видим ковчеги Тестер. Их тут дюжина или даже больше!"
  - char: "commander"
    side: "right"
    text:
      - "Дюжина — это много... Вы справитесь с ними?"
  - char: "hwah_jah_rad"
    side: "left"
    text:
      - "Справимся. Наш флот выполнит свою задачу, несмотря ни на что."
  - char: "commander"
    side: "right"
    text:
      - "Хорошо. Я окажу достаточное давление на саму Тестер, чтобы она не смогла перенаправить ресурсы на свои корабли."
      - "Продолжайте операцию. Мы встретимся в цитадели на Марианских островах!"

chapter7:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Благодаря командной работе и ракетным залпам «Дунъюй» нам удалось выдержать натиск Тестер."
      - "Её ковчеги шли ко дну одно за другим. Наша победа практически предрешена."
  - char: "tester"
    side: "right"
    status: "is-red"
    text:
      - "Вы прорвались через Шторм, совершенно не представляя, что скрывается за ним."
      - "Чёрт возьми, вы даже не подозреваете, что мы пытаемся вас защитить."
  - char: "yat_sen_rad"
    side: "left"
    text:
      - "Даже если предположить, что ты говоришь правду, твоя «защита» ничем не лучше клетки."
      - "Кроме того, мы ясно видим, что находится за штормом."
      - "Это свобода. Свобода и будущее!"
  - char: "tester"
    side: "right"
    status: "is-red"
    text:
      - "Я не позволю вам туда отправиться."
  - char: "harbin"
    side: "left"
    text:
      - "Слишком поздно. Мы уже туда идём!"
      - "Уничтожение твоего Шторма было лишь первым шагом! Мы сами выберем свой собственный путь!"
      - "Если думаешь, что сможешь нас остановить, тогда кончай трепаться и попробуй!"
      - "Мы сокрушим твой флот, твои ковчеги И твой мейнфрейм!"
  - text:
      - "БАБАХ!!!"
      - "После долгих ожесточённых боёв все вместилища Тестер были уничтожены."
  - char: "an_shan_rad"
    side: "right"
    text:
      - "Командир, это Флот анализа Шторма Восточного моря. Все Сирены были уничтожены."
      - "Мы прорвались через зону шторма и в данный момент направляемся к цели!"
  - char: "chen_hai_rad"
    side: "left"
    text:
      - "Я тоже. Направляюсь к цели прямо сейчас."
  - char: "hwah_jah_rad"
    side: "right"
    text:
      - "Мы тоже в пути!"
  - text:
      - "Со всех направлений поступают донесения о том, что с флотом Тестер покончено."
      - "Наконец-то Империя Дракона прорвалась сквозь Шторм и устремилась навстречу собственному будущему."
