chapter1:
  rows:
  - text:
      - "Порт PH вернулся к работе, став оживленнее, чем когда-либо прежде."
      - "Помимо Тихоокеанского флота Энтерпрайз, отовсюду прибыло подкрепление, в том числе с базы в SD и от Панамского канала."
      - "Они собрались в комнате для брифингов, чтобы проанализировать текущую боевую обстановку."
  - char: "enterprise"
    side: "left"
    text:
      - "Все наши базы в Тихом Океане отбиты, включая PH, AF и Панамский канал."
      - "Хотя из-за иллюзий пока не было никаких потерь личного состава, зафиксированы многочисленные случаи повреждения оборудования."
      - "Наконец, все гарнизонные флоты в настоящее время проходят необходимый ремонт и перевооружение, чтобы присоединиться к нам на передовой."
  - char: "yorktown_ii_rad"
    side: "right"
    text:
      - "Вы отбили все эти базы за такое короткое время?.. Вы действительно совершили чудо."
  - char: "enterprise"
    side: "left"
    text:
      - "Да. Я ожидала, что это превратится в войну на истощение."
      - "Мы бы не справились так быстро без талисманов, которые дали нам сакуранки, и без изобретательности Фарго."
  - char: "saratoga_rad"
    side: "right"
    text:
      - "О, говоря о талисманах, мне есть что доложить."
      - "Я взяла талисманы, которые флот Йорктаун забрал в SD, и отправила их в Море Звёзд."
      - "Кстати, они возобновили штатную работу и сейчас ищут способы проанализировать и разрушить иллюзии."
      - "Если им это удастся, мы сможем освободить территории по всей стране, попавшие под её влияние."
  - char: "enterprise"
    side: "left"
    text:
      - "Отличная работа, Саратога. Я знала, что на тебя можно положиться."
  - char: "saratoga_rad"
    side: "right"
    text:
      - "Мы разберёмся с ситуацией внутри страны, чтобы вы могли сосредоточиться на передовой."
      - "В общем, э-э, это всё, что я хотела сказать. Возвращаю слово тебе."
  - char: "bunker_hill_rad"
    side: "left"
    text:
      - "Ситуация на передовой не очень хорошая. Враг оказывает на нас давление, даже если продвигается черепашьим шагом."
      - "Их силы прибывают со стороны Маршалловых Островов, и их флоты увеличиваются в размерах."
      - "В настоящее время мы насчитываем в общей сложности семь флотов, в каждом из которых есть предполагаемый флагман с общей длиной корпуса почти три километра."
  - char: "hornet_ii_rad"
    side: "right"
    text:
      - "ЦЕЛЫХ три километра?.. Я раньше даже кораблей Сирен такого исполинского размера не видела."
  - char: "bunker_hill_rad"
    side: "left"
    text:
      - "Я тоже. Хуже того, эти корабли оснащены щитами и довольно хорошей огневой мощью."
      - "Были предприняты многочисленные попытки разбомбить их с воздуха, но, честно говоря, это не дало никакого эффекта."
      - "Сейчас мы пробуем другой подход — атакуем подводными лодками, чтобы уничтожить их командира и посеять в их рядах хаос."
  - char: "constellation_rad"
    side: "right"
    text:
      - "Подожди! Банкер Хилл, приостанови эту атаку!"
      - "Наш анализ врага только что дал первые результаты."
      - "По-видимому, то, с чем мы столкнулись, — это своего рода коррозийная сущность."
      - "Что касается того, какого именно рода, они частично базируются на существующих кораблях в нашем мире, в отличие от тех, что проецируются в нашу ветвь из другой."
      - "По этой причине мы смогли частично их идентифицировать, в отличие от всех предыдущих. Поэтому и наши атаки против них более эффективны."
      - "Однако мы всё ещё не знаем, КАК они появляются на свет."
      - "Ясно одно: кто бы ни стоял за этой атакой, он присвоил себе сакуранские технологии массового производства."
      - "О, и ещё кое-что..."
      - "Во всех наших предыдущих столкновениях коррозийные сущности растворялись в воздухе при уничтожении, не оставляя и следа."
      - "Эти же, напротив, оставляют после себя металлические детали, напоминающие какую-то минеральную руду."
      - "Мы проанализировали образец и обнаружили, что эти детали обладают свойствами, заставляющими их разъедать другие материалы."
      - "Хорошая новость в том, что они не могут разъесть наши корпуса. Однако они МОГУТ разъедать электронику."
      - "Что подводит меня к тому, почему вам не стоит атаковать тот флагман..."
      - "Мы ещё не анализировали его образец, но учитывая, насколько он больше своих собратьев, его коррозийные свойства также могут быть на совершенно ином уровне."
      - "А значит, нападение на него может привести к образованию обломков, которые разъедят окружающую воду или прилипнут к атакующим его подводным лодкам. Это лишь предположение, но лучше перестраховаться, чем потом сожалеть."
  - char: "bunker_hill_rad"
    side: "left"
    text:
      - "Спасибо за все эти разведданные. Мы пересмотрим план атаки."
  - char: "indiana"
    side: "right"
    text:
      - "У меня есть разведданные с нашей наблюдательной станции на Самоа."
      - "Показания говорят, что флот покинул Соломоновы Острова и направляется к Маршалловым Островам."
      - "В лучшем случае, дислоцированный там сакуранский флот всё ещё находится под воздействием иллюзии, но они живы."
      - "В худшем случае... они пришли в себя, и враг их уничтожил."
  - char: "yorktown_ii_rad"
    side: "left"
    text:
      - "Только благодаря Симанто и Харуцуки мы смогли так быстро вернуть контроль над ситуацией."
      - "Если они в опасности, мы не можем просто бросить их на произвол судьбы."
  - char: "saratoga_rad"
    side: "right"
    text:
      - "Конечно нет! Кроме того, если Соломоновы Острова падут, это даст врагу ещё одно направление для атаки!"
      - "Мы обязаны помочь им как со стратегической точки зрения, так и ради возвращения долга за их доброту!"
  - char: "enterprise"
    side: "left"
    text:
      - "Согласна."
      - "Банкер Хилл, продолжай держать оборону. Действуй медленно и верно."
      - "Собери как можно больше разведданных о вражеских флагманах и выясни, чего они добиваются на самом деле."
      - "После того, как поможешь сакуранкам на Соломоновых Островах, направляйся к Маршалловым Островам с неожиданного для них направления."
      - "Затем мы возьмем врага в клещи и уничтожим их всех."
  - char: "bunker_hill_rad"
    side: "right"
    text:
      - "Принято!"
  - char: "yorktown_ii"
    side: "left"
    text:
      - "Энтерпрайз, у нас ещё остались свободные силы. Мне перенаправить их на Соломоновы Острова?.."
  - char: "enterprise"
    side: "right"
    text:
      - "С этими островами всё будет в порядке. Лучше отправь их к Банкер Хилл."
      - "Наши силы смогут перегруппироваться позже, если спасение сакуранок не обойдётся слишком дорого, к тому же мы можем ожидать подкрепления из Парящей Крепости Железной Крови."
      - "В случае необходимости мы всегда можем связаться с Железной Кровью напрямую."
  - char: "yorktown_ii_rad"
    side: "left"
    text:
      - "Ты уверена, что это хорошая идея?.. Не лучше ли нам поговорить с флотом Королевского Флота, дислоцированным в Сиднее?.."
  - char: "enterprise"
    side: "right"
    text:
      - "У них и так полно хлопот с отслеживанием Памяти Меркурия МЕТА и подготовкой на случай, если что-то внезапно произойдёт в Антарктическом океане."
      - "Если мы заберём у них подкрепление, они не смогут отреагировать на изменения в Антарктиде."
      - "Железная Кровь — наш лучший вариант. Командир значительно облегчил переговоры с ними."
  - char: "yorktown_ii_rad"
    side: "left"
    text:
      - "Хорошо. Будь осторожна там, Энтерпрайз."
  - char: "enterprise"
    side: "right"
    text:
      - "И ты тоже."
      - "На твоей стороне мощь корпуса Тип II, но мы всё ещё не выяснили, кто за всем этим стоит. Будь готова ко всему."
  - char: "yorktown_ii_rad"
    side: "left"
    text:
      - "Хи-хи. Со мной всё будет в порядке. Правда, я давно не сражалась, но я всё ещё помню, как это делается."
      - "Это будет моя первая битва плечом к плечу со всеми вами после моего возвращения на передовую. Кто бы ни был вражеским командиром, он пожалеет, что навлёк на себя мой гнев!"
