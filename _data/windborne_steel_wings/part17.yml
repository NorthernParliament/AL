chapter1:
  rows:
  - text:
      - "Расправившись с волнами врагов на своём пути, флоты Индианы и Энтерпрайз создали врата тории и прорвались в иллюзию."
      - "Изнутри иллюзия походила на бескрайний лес цветущей сакуры, над которым вдалеке возвышалось одинокое, гигантское, засохшее дерево."
  - char: "bell"
    side: "left"
    text:
      - "Знаете, цветы — это символ жизни..."
      - "И всё же, несмотря на то, как их здесь много, вокруг чувствуется такое запустение."
      - "Это правда оно?.. Иллюзия, в которую попали наши сакуранские друзья?.."
  - char: "indiana"
    side: "right"
    text:
      - "Я вижу следы сражения. И выглядят они свежими."
      - "Энтерпрайз, видишь что-нибудь сверху?.."
  - char: "enterprise"
    side: "left"
    text:
      - "Ещё больше следов сражения. Их очень много."
      - "Это говорит о том, что сакуранки не просто живы, но и сражаются прямо в этот момент."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Больше никому не кажется странным, что они всё ещё заперты здесь?.."
      - "Сакуранки пришли к НАМ первыми, так разве они не должны быть способны выбраться самостоятельно?.."
  - char: "fargo"
    side: "left"
    text:
      - "Эта иллюзия может быть уникальной — возможно, даже созданной специально для того, чтобы удержать их. Кто бы за всем этим ни стоял, он нацелился именно на них."
  - char: "herring"
    side: "right"
    text:
      - "Нацелился именно на них?.. Звучит скверно! Прям ОЧЕНЬ скверно для них!"
  - char: "enterprise"
    side: "left"
    text:
      - "Нашла их. Они направляются к тому огромному дереву в центре."
  - char: "pittsburgh"
    side: "right"
    text:
      - "Значит, время ещё есть! Нам нужно поторопиться!"
