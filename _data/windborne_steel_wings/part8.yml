chapter1:
  rows:
  - text:
      - "Фигура в маске не оказала особого сопротивления, так как прибытие флота Индианы застало её врасплох."
      - "Какое-то время она отбивалась лишь для вида, в конечном итоге исчезнув в розоватом тумане, как и в прошлый раз."
      - "Оставшись без командира, остальная часть её флота быстро впала в хаос и была уничтожена. Власть иллюзии над островом рассеялась."
      - "К тому времени, как девушки-корабли вернулись на Киритимати, был уже вечер."
  - char: "dewey"
    side: "left"
    text:
      - "Мы вернулись на Киритимати! Боже, это было СЛИШКОМ реалистично для простого сна..."
      - "Простите, что мы так вас подвели... поддавшись иллюзии..."
      - "Если бы вас здесь не было, боюсь, мы бы не выжили."
  - char: "indiana"
    side: "right"
    text:
      - "Не переживай из-за этого. Вы доблестно сражались с крайне хитрым врагом."
  - char: "pittsburgh"
    side: "left"
    text:
      - "По правде говоря, мы тоже попались в эту иллюзию, и нас пришлось спасать. В нашем случае это были Симанто и Харуцуки."
  - char: "herring"
    side: "right"
    text:
      - "Вот они были настоящими. Не то что эта фальшивая лисица."
  - char: "dewey"
    side: "left"
    text:
      - "Сакуранки вас спасли?.. Почему они были на Самоа?.."
  - char: "indiana"
    side: "right"
    text:
      - "На них тоже напал неизвестный враг, прямо как на нас."
      - "Кроме того, враги маскируются под сакуранцев, поэтому они хотели добраться до нас первыми, прежде чем возникнут какие-либо недоразумения."
      - "В худшем случае, весь Тихий Океан пал жертвой этой иллюзии... но пока мы можем продолжать сражаться, всё будет в порядке."
  - char: "dewey"
    side: "left"
    text:
      - "Надеюсь на это!"
  - char: "halsey_powell"
    side: "right"
    text:
      - "О, у меня есть вопрос!"
      - "Вы использовали какую-то крутую портальную штуку, чтобы попасть сюда, да?.. Что это было?.."
  - char: "indiana"
    side: "left"
    text:
      - "Ха-ха-ха! Это были врата тории, созданные с помощью особого талисмана, который дала нам Симанто. Они предназначены для проникновения внутрь этих иллюзорных измерений."
      - "А также для снятия эффекта, который иллюзия оказывает на ваш разум. Хотя в этот раз нам это даже не понадобилось."
  - char: "herring"
    side: "right"
    text:
      - "Точно! Мы их даже не использовали."
  - char: "bell"
    side: "left"
    text:
      - "На самом деле я не сделала ничего «крутого», просто повторила то, что однажды видела в кино..."
  - char: "fargo"
    side: "right"
    text:
      - "Простите, что вмешиваюсь, но я закончила разведку территории."
      - "Перейду сразу к делу. Большинство автоматизированных производственных комплексов попало в руки врага."
      - "К тому же, насколько я могу судить, они используют Киритимати как свою оперативную базу для отправки сил на другие острова по всему Тихому Океану."
      - "По моим оценкам, с вероятностью 99,95% флот, атаковавший Самоа, прибыл отсюда."
  - char: "indiana"
    side: "left"
    text:
      - "Значит, они проводят здесь скоординированную операцию. Мы не можем позволить им просто так вытирать о нас ноги."
      - "Дьюи, ты идёшь со мной. Мы отобьём командные пункты острова и свяжемся со штабом."
      - "Если что-то встанет у нас на пути, мы это сокрушим!"
