chapter1:
  rows:
  - char: "chen_hai_rad"
    side: "right"
    text:
      - "Командир, это Флот анализа Шторма Северного моря. Все Сирены были уничтожены."
      - "Мы не заметили никаких элитных моделей, так что, скорее всего, отправленные против нас силы — всего лишь разведывательный флот."
  - char: "hwah_jah_rad"
    side: "left"
    text:
      - "Флот анализа Шторма Южного моря. Мы подозреваем то же самое."
      - "Все цели были уничтожены. Приступаем к дозаправке и пополнению припасов."
  - char: "commander"
    side: "right"
    text:
      - "Отличная работа, вы обе. Чи Ань, каковы ваши потери?.."
  - char: "chian"
    side: "left"
    text:
      - "Благодаря полученной поддержке мы потеряли менее пяти процентов боеспособности."
  - char: "chen_hai_rad"
    side: "right"
    text:
      - "У нас менее трёх процентов, так как мы находимся в непосредственной близости от базы в BP."
  - char: "hwah_jah_rad"
    side: "left"
    text:
      - "О боже... Наши потери оцениваются примерно в девять процентов. Это довольно много."
  - char: "commander"
    side: "right"
    text:
      - "Всё в порядке. У твоего флота меньше огневой мощи, чем у двух других, и вам нужно охватить большую площадь. Вы отлично справляетесь."
      - "Наши максимально допустимые потери на первом этапе составляли 15% в общей сложности, и вы все удержались ниже этого значения. Выдающаяся работа."
      - "Хуань Чан, ты видишь какие-либо передвижения противника в радиусе своей разведки?.."
  - char: "huan_chang_rad"
    side: "left"
    text:
      - "Судя по тому, что у меня есть сейчас, похоже, что на их базе на Марианских островах собираются значительные силы. С другой стороны, я нигде больше не вижу никаких подкреплений."
      - "Короче говоря, никаких серьёзных изменений не произошло."
  - char: "commander"
    side: "right"
    text:
      - "Шторм ликвидирован, наши потери в пределах расчётных, и никаких сюрпризов от Сирен. В целом, всё идёт отлично."
      - "Ят Сен, тебе есть что доложить?.."
  - char: "yat_sen_rad"
    side: "left"
    text:
      - "Вокруг базы в BP всё в норме. Я думаю, мы можем переходить к следующему этапу операции."
  - char: "commander"
    side: "right"
    text:
      - "Спасибо. Всем флотам: вы выступаете через час, как и планировалось."
      - "О, и передайте от меня сообщение Северному Парламенту — «Встретимся у Марианских островов»."
