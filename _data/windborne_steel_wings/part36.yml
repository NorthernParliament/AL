chapter1:
  rows:
  - text:
      - "В столице Ортодоксии, в консульстве Союза Орла, группа пробудившихся девушек-кораблей пыталась осознать происходящее."
  - char: "essex"
    side: "left"
    text:
      - "(Не может быть... Всё это было сном!)"
      - "(Так, нужно сохранять спокойствие. Я вырвалась из иллюзии, так что теперь мне нужно выяснить, что происходит, и быстро!)"
      - "Шангри-Ла, наша связь с Нью-Йорком уже полностью восстановилась?"
  - char: "shangri_la"
    side: "right"
    text:
      - "Ещё нет. По разведданным Ортодоксии, множество оборудования вышло из строя, даже если сама иллюзия исчезла."
      - "Полагаю, причина именно в этом."
  - char: "essex"
    side: "left"
    text:
      - "Проклятье. Они действительно застали нас врасплох..."
      - "С другой стороны, нам не привыкать к обрывам связи, так что это не самое страшное. Начинай писать отчёт и отправь его, как только снова появится сигнал."
      - "...Хм?"
      - "Эй, постой. Взгляни на это. Тебе тоже кажется, что центр Северной Атлантики выглядит странно?"
  - char: "shangri_la"
    side: "right"
    text:
      - "Боже, эти показатели наблюдения просто зашкаливают..."
      - "Я попытаюсь связаться с Нью-Джерси и попрошу её всё разузнать."
  - char: "communicator"
    side: "left"
    text:
      - "БИП... БИП... БИП..."
  - char: "shangri_la"
    side: "right"
    text:
      - "А? Не соединяет."
  - char: "essex"
    side: "left"
    text:
      - "У меня очень дурное предчувствие на этот счёт."
  - char: "shangri_la"
    side: "right"
    text:
      - "Нас уже двое..."
  - char: "essex"
    side: "left"
    text:
      - "Свяжись с Ришелье и сообщи ей об этом. Нам нужно как можно скорее выяснить, что происходит в Северной Атлантике."
      - "Я отправлю разведывательные самолёты и посмотрю, что смогу найти!"
