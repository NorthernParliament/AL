chapter1:
  rows:
  - text:
      - "Операция «Ледяной Дракон, сокрушающий ветер» состоит из трёх этапов, у каждого из которых свои цели."
      - "Первый — прорваться сквозь Шторм и уничтожить всех Сирен в этом районе. Когда этот этап будет завершён, и только если потери составят менее 15%, можно приступать ко второму этапу."
      - "Следующий этап — выдвинуться к цитадели на Марианских островах и перегруппироваться с флотом поддержки Северного Парламента."
      - "Наконец — ликвидировать присутствие Сирен в цитадели и нейтрализовать все объекты на острове."
      - "Теперь, когда практически нет сомнений в том, что Марианские острова являются источником Шторма, мы знаем, что должны полностью их зачистить, иначе все наши усилия окажутся напрасными."
      - "Насладившись мгновением триумфа от уничтожения Тестер, все наши флоты вновь сосредоточились на главной цели."
      - "Все три наших флота, прибывшие с разных направлений, воссоединяются в водах Марианских островов."

chapter2:
  rows:
  - char: "memphis"
    side: "right"
    text:
      - "Командир, я получила отчёт о том, что происходит в Тихом Океане."
      - "Море Звёзд развернуло на различных базах множество дронов с функциями усиления сигнала."
      - "В дальнейшем это обеспечит гораздо более бесперебойную связь между нашими подразделениями."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Я и раньше сталкивался с массовыми иллюзиями, но никогда в ТАКОМ масштабе.)"
      - "(Это затрагивает не только Тихий Океан, но также Союз Орла и Европу.)"
      - "(Падение такой удалённой базы, как PH, в руки врага было бы достаточно скверным, но Нью-Йорк и Море Звёзд тоже едва не пали.)"

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(К счастью, Симанто и Харуцуки пришли на помощь, а усердная работа Саратоги, Индианы и Энтерпрайз оттащила нас от края пропасти.)"
      - "(Что и приводит нас к тому, где мы сейчас...)"
      - "(Все иллюзорные области, обнаруженные на территории Союза Орла, были удалены.)"
      - "(Энтерпрайз объединилась с флотом Нагато, и все они направляются к Маршалловым Островам.)"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Там нелегко, и тот факт, что они работают вместе, вызывает у меня улыбку.)"
      - "(Я не ожидал, что лиса-хранительница появится на передовой в столь необычной операции, но любая помощь ценна.)"
      - "(Если мы сможем привлечь её на свою сторону, реформировать Лазурный Путь станет проще.)"
      - "(А ещё тот отчёт, который она мне передала. Об Акаги...)"
      - "(И её предполагаемой связи со всем этим инцидентом.)"

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Я не знаю, как относиться к тому, что Акаги замешана в этом.)"
      - "(Однажды мы сражались, она и я. Прямо здесь, в Тихом Океане.)"

chapter7:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Это была внезапная атака. Никто её не ожидал.)"

chapter8:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Затем последовала битва в Коралловом море.)"

chapter9:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(А потом битва на AF.)"

chapter10:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "......"

chapter11:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Ходили слухи, что она затонула после той битвы. Позже выяснилось, что это не так.)"
      - "(Она хитрая, эта лиса. Днём правит Империей Сакуры, а ночью плетёт интриги. Жаль, что у меня было мало возможностей поговорить с ней с глазу на глаз.)"

chapter12:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Мы ДЕЙСТВИТЕЛЬНО сражались плечом к плечу, а не друг против друга во время битвы за мейнфрейм Компилятора...)"
      - "(Правда, тогда было время для действий, а не для разговоров. Жаль.)"
      - "(Возможно, мне стоило отвести её в сторону и поговорить с ней...)"

chapter13:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Хотя она и не присутствовала на встречах по обсуждению реформирования Лазурного Пути, до меня доходили слухи, что у неё довольно специфическая позиция по этому вопросу.)"
      - "(И всё же что-то не даёт мне покоя.)"
      - "(Даже если у неё и есть опасная сторона, она не кажется мне той, кто стал бы причиной инцидента с последствиями мирового масштаба.)"
      - "(После всего, через что мы прошли — после всего, через что прошла ОНА, — мне не хочется верить, что она вот так подставит своих друзей.)"
      - "(Она не какая-нибудь эгоманьячка, желающая захватить мир...)"
      - "(...Или, может быть, я знаю её не так хорошо, как мне кажется.)"
      - "(Я поручу кое-кому собрать для меня разведданные, просто чтобы быть готовым к худшему сценарию.)"
      - "(А пока мне нужно сосредоточиться на том, что прямо передо мной — возвращении Маршалловых Островов и свержении цитадели на Марианских островах.)"

chapter14:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Начиная с Маршалловых Островов. Они попали в руки того всё ещё неопознанного врага, который использует их в качестве передовой оперативной базы.)"

chapter15:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Флот Банкер Хилл блокирует путь к другим базам. Они позаботятся о том, чтобы никто не проник внутрь и не выбрался наружу.)"

chapter16:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Энтерпрайз, Нагато и их флоты отбыли с Соломоновых Островов. Скоро они достигнут Маршалловых Островов.)"

chapter17:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Как только они прибудут, Банкер Хилл присоединится к ним в отвоёвывании острова.)"

chapter18:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Для подкрепления у нас в резерве есть два флота Союза Орла.)"

chapter19:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Один из них отправится из SD, пополнит припасы и дозаправится на PH, а затем направится прямо к нам.)"

chapter20:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Другой идёт из Нью-Йорка, что означает, что им придётся проделать путь через Панамский канал.)"
      - "(Они очень далеко и не успеют вовремя, но я всё равно перебрасываю их на всякий случай.)"

chapter21:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Далее — моя текущая цель: Марианские острова.)"
      - "(Долгое время это была весьма ничем не примечательная база Сирен, практически без какой-либо активности.)"
      - "(Так было до прошлого года, когда Империя Дракона начала разрабатывать план по прорыву сквозь Шторм. Внезапно активность там резко возросла.)"
      - "(Почти как если бы Сирены знали, что планирует Империя, точно так же, как Шторм усилился, когда Империя собрала свои войска.)"

chapter22:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(По сути, это было негласным подтверждением того, что центр управления Штормом находится на этих островах.)"

chapter23:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Эта теория была дополнительно подкреплена разведданными, которыми поделилась Железная Кровь, а также серьёзной попыткой Тестер отбросить нас назад.)"

chapter24:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Как же вовремя всё это для нас произошло.)"

chapter25:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Империя посылает флоты с трёх направлений, а Северный Парламент отправляет на юг свой собственный флот.)"
      - "(Учитывая, что мы обошли глушение, возможно, мне также стоит попросить о помощи гарнизонный флот в Парящей Крепости Железной Крови.)"
      - "(О, и ещё есть флот Королевского Флота, дислоцированный в Сиднее.)"
      - "(Судя по тому, что я слышал от наших союзников на Огненной Земле, вокруг Антарктиды мало что происходит. По крайней мере, пока.)"
      - "(С одной стороны, кто-то должен присматривать за Памятью Меркурия МЕТА. С другой, распылять свои силы — не лучшая идея.)"
      - "(Мне не нравится выбирать что-то одно, но...)"
      - "(Ладно. Может быть, что-то вроде...)"
      - "(Я прикажу флоту Королевского Флота присоединиться к атаке на Марианские острова.)"

chapter26:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Память, скорее всего, не станет проблемой. Кимберли сказала, что по какой-то причине она просто хотела насладиться отпуском. Кроме того, я могу рассчитывать на то, что Обсервер не позволит Памяти творить в Антарктиде всё, что ей вздумается.)"
      - "(Как гласит старая поговорка — враг моего врага — мой друг.)"
      - "(Наконец, остаётся вопрос о том, как распределить силы для этих двух отдельных операций.)"
      - "(Маршалловы Острова — это штаб-квартира неизвестного врага, и они всё ещё находятся под воздействием иллюзий. Это угроза, к которой нам нужно отнестись серьёзно.)"
      - "(В то же время, Шторм может вернуться, если мы в скором времени не уничтожим центр управления. Мы должны быть к этому готовы.)"
      - "(Империя сдерживает шторм с помощью своих «Дунъюй», но они не могут продолжать штурм вечно.)"
      - "(К тому же времени на передислокацию кого-либо очень мало, так как Марианские острова будут продолжать производить эти модели Тип IV.)"
      - "(Хорошо. Я всё продумал.)"

chapter27:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "(Мы просто проведем обе операции параллельно.)"
      - "(Операция «Ледяной Дракон, сокрушающий ветер» продолжится по плану. Если окажется, что мы в меньшинстве, я дождусь подкрепления от Королевского Флота и Железной Крови.)"
      - "(Если Энтерпрайз, Индиана и Нагато отвоюют Маршалловы Острова достаточно быстро, я тоже перегруппируюсь с ними.)"

chapter28:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Значит, решено. Уничтожить центр управления Штормом и нейтрализовать комплексы по производству Тип IV.)"
      - "(Как бы ни было здорово уничтожить мейнфрейм сегодня, Тестер ни за что не подставит нам своё бьющееся сердце вот так просто.)"
      - "(Я также не хочу её провоцировать. Осторожность здесь превыше всего.)"
      - "Мемфис, у меня есть несколько приказов."
  - char: "memphis"
    side: "right"
    text:
      - "Я слушаю. Как будешь готов."
  - char: "commander"
    side: "left"
    text:
      - "Спасибо. Обязательно запиши это."
  - char: "memphis"
    side: "right"
    text:
      - "Конечно!"
  - char: "commander"
    side: "left"
    text:
      - "Первое — передай базам на Карагинском, в BP и SD, чтобы они внимательно следили за Островами Сакуры. Собирайте разведданные при любой возможности."
      - "Второе — передай флоту Королевского Флота, дислоцированному в Сиднее, отправиться к Марианским островам и оказать помощь в операции по их захвату."
      - "Кроме того, они должны быть готовы передавать любую информацию о наблюдении за Антарктидой и её океаном напрямую мне."
      - "Третье — прикажи флоту Союза Орла, дислоцированному на Огненной Земле, оставаться в режиме готовности. Командование им будет передано флоту Королевского Флота в Сиднее до завершения этой операции."
      - "Четвертое — свяжись с Петер Штрассер и сообщи ей, что мы запрашиваем помощь флота Парящей Крепости в захвате Марианских островов."
      - "Кроме того, поделись с ней всеми разведданными, относящимися к этой операции, и скажи ей немедленно связаться со своими товарищами в Европе, чтобы ввести их в курс дела."
      - "Пятое — сообщи Энтерпрайз, что её группа несет ответственность за захват Маршалловых Островов."
      - "Их миссия продолжается по плану под её руководством. Сопровождающий её сакуранский флот должен подчиняться её приказам."
      - "Шестое — Операция «Ледяной Дракон, сокрушающий ветер» продолжится по плану. Флоты Северного Парламента и Империи Дракона должны оказать помощь в уничтожении цитадели Сирен на Марианских островах."
      - "И, наконец, седьмое — если одна из наших двух оперативных групп выполнит свою задачу раньше другой, они должны быстро объединиться с остальными."
  - char: "memphis"
    side: "right"
    text:
      - "Поняла."
      - "Что-нибудь ещё?.."
  - char: "commander"
    side: "left"
    text:
      - "Нет, это всё. Пойду ненадолго сомкну глаза. Если что-то случится, вызови меня."
  - char: "memphis"
    side: "right"
    text:
      - "Хи-хи. Хорошенько и подольше отдохни."
      - "Ты действительно делаешь всё возможное и невозможное для всех нас здесь, Командир. Спасибо тебе."
  - char: "commander"
    side: "left"
    text:
      - "Не стоит благодарности. Я просто делаю свою работу."
