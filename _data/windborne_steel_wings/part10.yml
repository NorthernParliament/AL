chapter1:
  rows:
  - char: "hornet_ii"
    side: "left"
    text:
      - "Эй, Йорктаун, мы ТОЛЬКО ЧТО проходили через этот район!"
  - char: "yorktown_ii"
    side: "right"
    text:
      - "Ты права..."
  - char: "northampton_ii"
    side: "left"
    text:
      - "GPS показывает, что мы должны были прибыть на базу давным-давно..."
      - "И тем не менее, я даже не вижу суши на горизонте. Думаешь, GPS неисправен?.."
  - char: "houston_ii"
    side: "right"
    text:
      - "Возможно... Навигатор работал нормально, пока мы не приблизились к базе."
      - "Погодите, может, дело не в GPS, а в самой этой области, в которой творится что-то неладное?.."
  - char: "kearsarge"
    side: "left"
    text:
      - "Ты хочешь сказать, что мы вошли в Зеркальное море?.."
  - char: "houston_ii"
    side: "right"
    text:
      - "Именно это я и говорю! Я тоже не могу связаться с DC и Морем Звёзд!"
  - char: "hammann_ii"
    side: "left"
    text:
      - "Зеркальное море ТАК близко к базе?! Это огромная, ОГРОМНАЯ проблема!"
  - char: "hornet_ii"
    side: "right"
    text:
      - "Да уж, без шуток. Но если мы в Зеркальном море, то где же все враги?.."
      - "Оглянись. Ни самолёта в небе, ни корабля на воде, ни даже отметки на радаре. Нет ничего."
  - char: "houston_ii"
    side: "left"
    text:
      - "Ох! Посмотри на это! Ты нас сглазила, Хорнет!"
  - char: "hornet_ii"
    side: "right"
    text:
      - "Что, ты что-то засекла?.. О, ты права — я вижу отметки на радаре, и они приближаются!"
      - "Йорктаун, давай запустим самолёты и перехватим их, прежде чем..."
      - "Погоди, отбой... Судя по всему, они союзные."
  - char: "yorktown_ii"
    side: "left"
    text:
      - "Да, мой показывает то же самое. Что ещё более странно, вперемешку с самолётами летят даже дроны."
      - "Это действительно странно. Дроны не могут летать так же быстро, как самолёты, поэтому их объединение замедлило бы строй."
  - text:
      - "Строй пролетел над головами девочек и сбросил послание. В следующее мгновение вспыхнул розовый свет, и в небе появились врата тории."
  - char: "hammann_ii"
    side: "left"
    text:
      - "Это голос Белл?.. И что это вообще такое?! Почему в воздухе появились врата?!"
      - "Смотрите! Эти дроны и самолёты влетели в них!"
  - char: "houston_ii"
    side: "right"
    text:
      - "Я поняла! Не только мы оказались в ловушке Зеркального моря — база тоже."
  - char: "hornet_ii"
    side: "left"
    text:
      - "Это объясняет, почему мы не можем с ними связаться. Но если мы обе находимся в одном и том же Зеркальном море, почему мы не можем до них дозвониться, куда бы мы ни направились?.."
      - "Ну, полагаю, существуют Зеркальные моря, использующие тот самый туман, который искажает законы физики..."
  - char: "northampton_ii"
    side: "right"
    text:
      - "Я читала некоторые документы, в которых описывалось Зеркальное море, похожее на это — запертое Зеркальное море."
      - "Оно работает как Парящая Крепость Железной Крови. Получить доступ к самой Крепости можно только с помощью какого-то особого метода."
      - "Если ты не знаешь, в чём он заключается, ты будешь либо вечно бесцельно блуждать по кругу, либо просто случайно выйдешь с другой стороны Зеркального моря."
  - char: "hornet_ii"
    side: "left"
    text:
      - "Это немного напоминает мне пространство, окружающее мейнфрейм Сирен. Работает примерно так же..."
  - char: "northampton_ii"
    side: "right"
    text:
      - "Понимаю, к чему ты клонишь, даже если те НАМНОГО сложнее."
  - char: "yorktown_ii"
    side: "left"
    text:
      - "Если я правильно поняла, то мы находимся только на границе Зеркального моря, в то время как база заперта глубже внутри, верно?.."
      - "Предположу, что эти сакуранские врата и есть тот самый «особый метод», о котором только что упомянула Нортгемптон."
      - "Кстати об этих вратах, они всё ещё висят там..."
      - "Хорнет, Кирсардж, давайте все используем наши самолёты, чтобы попасть внутрь!"
