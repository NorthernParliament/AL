chapter1:
  rows:
  - text:
      - "Z52 отважно прорывается сквозь стадо экстрамерных существ."
      - "Я пересаживаюсь с военного корабля на скоростную лодку и следую за ней в кильватере."
  - char: "z52"
    side: "left"
    text:
      - "Громовое сердце, взрыв!"
  - text:
      - "БАБАХ!!!"
  - text:
      - "Почувствовав изменение в ходе битвы, экстрамерные существа вытягивают щупальца, пытаясь отрезать нам путь."
  - char: "z52"
    side: "left"
    text:
      - "Слишком медленно!"
      - "Громовое сердце, сожги и отправь их в полет!"
  - text:
      - "БАБАХ!!!"
  - text:
      - "Она прорывается сквозь стену щупалец до того, как та успевает сомкнуться."
  - text:
      - "БЗЗЗЗТ!"
  - text:
      - "Внезапно раздаётся странный звук, и на мгновение кажется, будто двигатель лодки и моё сердце полностью остановились."
      - "Однако в следующий миг это ощущение исчезает, словно его и не было."
  - char: "commander"
    side: "left"
    text:
      - "Я почувствовал это. Враг ощущает давление."
      - "Это значит, что наш план работает."
      - "Расслабься. Я никуда не уйду."

chapter2:
  rows:
  - char: "z52"
    side: "left"
    text:
      - "Почти у цели! Птерозавры, вперёд!"
  - text:
      - "Дроны разгоняют наступающих врагов и уносят мою лодку на Вечную Звезду."
  - char: "z52"
    side: "left"
    text:
      - "Z52 возвращается к основному флоту!"
      - "Надеюсь, это сработает!"
      - "Удачи, Командир!"

chapter3:
  rows:
  - text:
      - "Я переключаю внимание на третью панель управления в зале."
  - char: "commander"
    side: "left"
    text:
      - "Ага. Стена Мидгарда — защитный барьер, сочетающий в себе нападение и оборону."
      - "(Я так и знал. Это Зеркальное море здесь не только для маскировки штаба.)"
      - "(Неужели его атакующая часть так и не была завершена? Похоже, нам придется полагаться на его защитные функции.)"
  - text:
      - "Следуя руководству по эксплуатации, оставленному в журналах данных, я отдаю сооружению ряд команд через панель."
      - "Мои учётные данные  и полномочия проходят проверку без проблем, и приказы выполняются один за другим."
      - "Невидимая граница Зеркального моря начинает искажаться, создавая нечто похожее на своеобразный барьер."
  - char: "commander"
    side: "left"
    text:
      - "На очереди — четвёртая станция."
  - text:
      - "Я осматриваю четвертую панель управления, пока активируется защита."
  - char: "commander"
    side: "left"
    text:
      - "Так, журналы, журналы... Это энергетическая башня."
      - "Ноль повреждений. Я поражен, учитывая, как долго она там простояла."
      - "Хм... Она называется Башня Мидгарда."
      - "(Кажется, я уже где-то видел это название. Может ли это быть связано с моими потерянными воспоминаниями?)"
  - text:
      - "Я начинаю искать, какие тайные знания содержит Башня."
  - char: "commander"
    side: "left"
    text:
      - "Проклятье. Журналы и доступ к управлению заблокированы."
      - "Посмотрим... Доступ к ней можно получить только после того, как Йормунганд достигнет 40%?"
      - "«Йормунганд»? Что это такое?"
      - "Что Сирены пытались здесь сделать?"
  - text:
      - "Несмотря на то, что я обыскал всё вокруг, мне не удалось найти ничего, что могло бы дать мне подсказку."
  - text:
      - "БЗЗЗЗТ!"
  - text:
      - "В этот момент по залу прокатываются ударные волны от появления Звёздного Зверя."

chapter4:
  rows:
  - text:
      - "Звезда над головой внезапно засияла ослепительно ярко, её многократно усиленное сияние в мгновение ока осветило половину ночного неба."
  - char: "commander"
    side: "left"
    text:
      - "Это быстрее, чем в прошлый раз! Он понял, что я делаю?"
      - "Отлично! Тогда мне придется разыграть карты, которые я собрал!"
      - "Вечная Звезда, начать атаку!"

chapter5:
  rows:
  - text:
      - "На инвертированном небе мерцают голубые звёзды."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Класс Лорд... Он всё-таки появился."
      - "Зеркальное море меняется. Командир, должно быть, преуспел."
  - char: "z9"
    side: "right"
    text:
      - "М-мы будем в порядке?"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Посмотрим. Сражаться — наш единственный выбор."

chapter6:
  rows:
  - text:
      - "Появляются бесчисленные щупальца, тянущиеся в небо, словно пытаясь сшить его с морем воедино."
      - "Шквал снарядов Вечной Звезды разносит их вдребезги. Осколки падают обратно в море, словно град."
  - text:
      - "БЗЗЗЗТ!"
  - text:
      - "Снова этот странный звук. В меня летят лучи энергии — но защитный барьер Зеркального моря блокирует их все."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Сработало."
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ха! Больше не такой крутой! Твоё царство террора ОКОНЧЕНО!"
      - "Я наконец-то, наконец-то смогу отомстить!"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Успокойся, Хиппер. Придерживайся плана."
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Да, я знаю."
      - "Хотя... этот барьер, скорее всего, не выдержит."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Его достаточно, чтобы потянуть время. Теперь мы должны придумать контрмеру."
      - "Всем кораблям, сосредоточить огонь на щупальцах! Остановить спуск Звёздного Зверя!"

chapter7:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "duisburg"
    side: "left"
    text:
      - "Что это был за шум? Энергетическая башня только что взорвалась?!"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Проклятье... Она перегрелась! Барьер выдержал, но башня — нет!"
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Вы сделали более чем достаточно."
      - "Теперь моя очередь. Я столкнусь с этой тварью лоб в лоб."
      - "Время отомстить за то, что ты сделал с моими сёстрами!"
      - "Тогда я была слаба — но не теперь!"

chapter8:
  rows:
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Твоя смерть станет венцом достижений класса «Адмирал Хиппер»!"
  - text:
      - "Хиппер взглянула на бескрайнее небо и во всеуслышание заявила о своих намерениях."
  - char: "star_beast"
    side: "right"
    status: "is-red"
    text:
      - "PUZVSLUA PUZLJAZ (НАГЛЫЕ НАСЕКОМЫЕ)"
      - "FVB HYL IBA MPYLMSPLZ (ВЫ ВСЕГО ЛИШЬ СВЕТЛЯЧКИ)"
      - "FVBY SPNOA PZ UVAOPUN JVTWHYLK AV AOL YHKPHUJL VM AOL ZAHYZ (ВАШ СВЕТ — НИЧТО ПО СРАВНЕНИЮ С СИЯНИЕМ ЗВЁЗД)"
      - "P HT AOL ZAHY ILHZA (Я — ЗВЁЗДНЫЙ ЗВЕРЬ)"
      - "NBPKPUN AOL ZAHYZ KV P HWWLHY (Я ЯВЛЯЮСЬ, НАПРАВЛЯЯ ЗВЁЗДЫ)"
      - "ILHYPUN AOL ZAHYZ KV P SLHCL (Я УХОЖУ, УНОСЯ ЗВЁЗДЫ )"
      - "IVD KVDU ILMVYL TL (СКЛОНИТЕСЬ ПЕРЕДО МНОЙ)"
      - "ZPUN OFTUZ AV TF UHTL (ПОЙТЕ ГИМНЫ ВО ИМЯ МОЁ)"
      - "OLLK TF JVTTHUKZ HUK VILF (ВНЕМЛИТЕ МОИМ ПРИКАЗАМ И ПОВИНУЙТЕСЬ)"
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хе-хе..."
      - "Хватит нести чушь и нападай!"
  - char: "star_beast"
    side: "right"
    status: "is-red"
    text:
      - "WLY BZBHS (КАК ОБЫЧНО)"
      - "ZV IL PA AOLU (ДА БУДЕТ ТАК)"
      - "WLYPZO (СГИНЬТЕ)"
      - "WLY BZBHS (КАК ОБЫЧНО)"

chapter9:
  rows:
  - char: "star_beast"
    side: "right"
    status: "is-red"
    text:
      - "P HT AOL ZAHY ILHZA (Я — ЗВЁЗДНЫЙ ЗВЕРЬ)"
      - "NBPKPUN AOL ZAHYZ KV P HWWLHY (Я ЯВЛЯЮСЬ, НАПРАВЛЯЯ ЗВЁЗДЫ)"
      - "ILHYPUN AOL ZAHYZ KV P SLHCL (Я УХОЖУ, УНОСЯ ЗВЁЗДЫ )"
      - "AOL DVYSK OHZ ILLU ZBSSPLK (МИР БЫЛ ОСКВЕРНЁН)"
      - "IBYU PA KVDU P ZOHSS HUK PA DPSS IL YLIVYU (Я СОЖГУ ЕГО ДОТЛА, И ОН ПЕРЕРОДИТСЯ)"
  - text:
      - "Абсолютно всё рассыпается в прах в ослепительном свете. Вечная Звезда исчезает первой."
  - text:
      - "ШУРХ..."
  - text:
      - "А затем я слышу звук тасуемых карт."
