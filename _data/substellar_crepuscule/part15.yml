chapter1:
  rows:
  - text:
      - "Когда свет рассеивается, этот светлый класс вновь предстаёт перед моими глазами."
  - char: "commander"
    side: "left"
    text:
      - "Класс Мадам М. Я снова вернулся, не так ли?"
  - text:
      - "Подавляя душевную боль от пережитой на собственном опыте смерти, я осматриваю своё окружение."
      - "Как и ожидалось, леди с фиолетовыми волосами стоит за кафедрой. Она бросает на меня задумчивый взгляд."
  - char: "madam_m"
    side: "right"
    text:
      - "Ну как, тебе понравился этот второй поиск?"
  - char: "commander"
    side: "left"
    text:
      - "Несмотря на всю мою осторожность, я пал прямо на финишной прямой."
  - char: "madam_m"
    side: "right"
    text:
      - "Хи-хи. Недостаточно информации, я полагаю?"
  - char: "commander"
    side: "left"
    text:
      - "Как и в прошлый раз, когда мы готовили нашу контратаку, экстрамерные существа поймали нас в ловушку."
      - "Должен быть лидер, планирующий их действия, но кто?"
  - char: "madam_m"
    side: "right"
    text:
      - "Ты же знаешь, что я тебе не скажу."
  - char: "commander"
    side: "left"
    text:
      - "Чего и следовало ожидать."
  - text:
      - "С моих губ срывается вздох из-за её упрямства."
      - "В то же время я замечаю, что за соседней партой сидит девушка в белой одежде."
  - char: "zero_kid??"
    side: "right"
    text:
      - "Ты что-нибудь вспомнил?"
  - text:
      - "Она обращается ко мне с невинным любопытством в глазах."
      - "Её присутствие здесь кажется невероятно естественным, как будто она была здесь с самого начала."
  - char: "commander"
    side: "left"
    text:
      - "Да. По крайней мере, кое-что."
  - char: "zero_kid??"
    side: "right"
    text:
      - "Хорошо..."
  - text:
      - "На мгновение в выражении её лица происходит крошечная перемена — это улыбка."
  - char: "madam_m"
    side: "right"
    text:
      - "Вернёмся к теме. Мы собирались поговорить о тебе."
  - char: "commander"
    side: "left"
    text:
      - "У меня всё ещё так много вопросов к тебе."
  - char: "madam_m"
    side: "right"
    text:
      - "А ты не сдаёшься, да? Даже когда знаешь, как я отвечу."
  - char: "commander"
    side: "left"
    text:
      - "Я прекрасно осознаю, что ты не дашь мне прямых ответов. Я просто хочу обсудить их с тобой."
  - char: "madam_m"
    side: "right"
    text:
      - "Что ж, это я могу. Что ты хочешь обсудить?"
  - char: "commander"
    side: "left"
    text:
      - "Сейчас это всего лишь теория, но предполагая, что всё, что я пережил, было реальностью..."
      - "Что происходит с миром в тот момент, когда я покидаю его? То есть, после того, как я возвращаюсь в прошлое, чтобы сделать новый выбор."
  - char: "madam_m"
    side: "right"
    text:
      - "Возможно, он естественным образом развивается в другую вероятность. А возможно, всё исчезает в небытие."
  - char: "commander"
    side: "left"
    text:
      - "Эти два пути слишком разные, так быть не может. Погоди, дай угадаю — это одно и то же, не так ли?"
  - char: "madam_m"
    side: "right"
    text:
      - "Верно. Одно и то же."
      - "Потому что в тот момент, когда ты сделал свой выбор, этот мир с тех пор стал «реальным» с твоей точки зрения."
      - "Что касается других  исходов ветви, они были понижены до уровня простых вероятностей."
      - "Возможно, они вероятны, а возможно и нет. Они могут продолжиться после этой точки, а могут прерваться прямо там и тогда."
      - "Какая разница для тебя, того, кто живет в «определённости»?"
  - char: "commander"
    side: "left"
    text:
      - "Ты забываешь о других людях, кроме меня. А как же они?"
      - "Если мой выбор заставит мир отклониться к другой ветви, которую я не могу наблюдать, как другие люди воспринимают эту ветвь?"
  - char: "madam_m"
    side: "right"
    text:
      - "Другие люди..."
  - char: "commander"
    side: "left"
    text:
      - "Хорошо, давай возьмём девушек из Сопротивления в качестве примера."
  - char: "madam_m"
    side: "right"
    text:
      - "Их существование само по себе — просто одна из вероятностей. Обсуждать о них варианты «а что, если» бессмысленно."
  - char: "commander"
    side: "left"
    text:
      - "Они «просто одна из вероятностей»? Кем же это тогда делает тебя?"
      - "Если ты говоришь, что обсуждения стоят только сторонние наблюдатели, то нас двое. Ты тоже наблюдала за ними."
  - char: "madam_m"
    side: "right"
    text:
      - "Не совсем. Я наблюдала только за тобой и непосредственным пространством вокруг тебя."
  - char: "commander"
    side: "left"
    text:
      - "Угу. А что, если ты захочешь снова понаблюдать за прошлым?"
  - char: "madam_m"
    side: "right"
    text:
      - "Если мне захочется это сделать, то я сделаю."
      - "Но, неважно, что я вижу или видела, для тебя это ничего не значит."
      - "Варианты «а что, если» — то есть вероятности — ничего не значат по сравнению с установленными фактами."
  - char: "commander"
    side: "left"
    text:
      - "Давай оставим весь этот разговор про «это имеет значение, а это нет». Ты можешь наблюдать бесконечное множество возможных миров, в то время как я не могу."
      - "Меня интересует вот что: могу ли я двигаться только по пути, состоящему из определённостей?"
  - char: "madam_m"
    side: "right"
    text:
      - "...А. Теперь я понимаю, к чему ты клонишь. Честно говоря, я тебя недооценила."
  - char: "commander"
    side: "left"
    text:
      - "Я так и думал."
      - "Секрет этой твоей способности кроется в системе Антиоха."
      - "Тот мир — это тестовый полигон, не так ли? Вот почему за ним можно наблюдать."
  - text:
      - "Хотя она ни подтверждает, ни опровергает моё утверждение, её губы, кажется, слегка напрягаются."
  - char: "commander"
    side: "left"
    text:
      - "Вероятности бесконечны, и их невозможно предсказать. Но добавь в это уравнение стороннего наблюдателя, и вероятности сойдутся воедино, станут фактами и обретут смысл."
      - "Вот почему Антиох разработал систему тестовых полигонов."
      - "Каждый тестовый полигон получает запись в базе данных их системы, как только они вмешиваются в определённый момент времени."
      - "Более того, мониторинг каждого тестового полигона может продолжаться даже после ухода Антиоха благодаря присутствию их творений."
      - "Любая ветвь — это параллельная вероятность, пока не появится Антиох и не сделает её своим тестовым полигоном, тем самым делая её определённой, реальной и значимой."
      - "Я прав?"
  - char: "madam_m"
    side: "right"
    text:
      - "......"
      - "Не до конца."
  - char: "commander"
    side: "left"
    text:
      - "Разве дело не только в тестовых полигонах? Есть ли что-то ещё, за чем ты наблюдаешь?"
      - "Ох... Теперь я понял. Вот почему ты наблюдаешь за мной."
      - "Каждый раз, когда я добираюсь до истины, новые вероятности становятся определёнными, тем самым создавая тестовые полигоны. Так ли это?"
  - char: "madam_m"
    side: "right"
    text:
      - "Видишь?"
      - "Пока у тебя есть среда для размышлений, ты можешь делать одно открытие за другим, не так ли?"
      - "Время обсуждений вышло. Теперь пришло время сделать твой следующий выбор."
      - "Хочешь продолжить?"
  - char: "commander"
    side: "left"
    text:
      - "......"
      - "Хочу."
