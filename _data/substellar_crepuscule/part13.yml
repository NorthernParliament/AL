chapter1:
  rows:
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Дзинцу, ты меня слышишь?"
  - text:
      - "Хелена закрыла глаза, глубоко задумавшись."
  - char: "jintsuu_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Это ты, Хелена? Ты уже решила свою проблему?"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Давай начнем с твоей."
      - "Как обстановка?"
  - char: "jintsuu_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Нагато и Хиэй с тестового полигона Бета вернулись в норму, но мы не можем покинуть Камелот."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что ж, так вышло, что я знаю почему. Тестовый полигон Бета куда-то переместился."
  - char: "jintsuu_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Ты сказала ПЕРЕМЕСТИЛСЯ?"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Это сделала Императрица. Она всё это время плела интриги."
      - "За пределами Камелота ничего нет. Вот почему вы не можете уйти."
  - char: "jintsuu_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Полагаю... ты тоже не знаешь, где находится Бета."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Да, на этот раз она и правда постаралась. Но я думаю, мы в долгу перед D."
      - "Активируй оставленный ею коммуникатор и поддерживай связь с тестовым полигоном Бета. Со мной связь тоже не прерывай."
  - char: "jintsuu_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Ты собираешься отследить его?"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я справлюсь менее чем за 72 системных часа."
      - "А также передай Элизабет из Беты, чтобы она передала это сообщение двум нашим охотницам на китов."
      - "«Если не хотите остаться без дома по возвращении, вам лучше начать анализ прямо сейчас»."
  - char: "jintsuu_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Кто-то сегодня ужасно заботлив."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Я просто возвращаю должок."
      - "В любом случае, на этом всё. Давай будем с этим осторожнее."
  - text:
      - "Хелена отключила канал связи и переключила внимание на другую панель."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ядро фальшивого тестового полигона... Идеальное место для новой среды обитания Обсервер."
      - "Хе-хе... Этот сюрприз сразит тебя наповал."

chapter2:
  rows:
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Координаты отслежены. Переключаюсь в режим захвата."
      - "Пора браться за дело."
