chapter1:
  rows:
  - text:
      - "Наше контрнаступление проходило гладко. Вражеские метки на мониторе исчезали одна за другой, и казалось, что до победы остался всего один залп."
      - "Но именно в этот момент произошло нечто шокирующее."

chapter2:
  rows:
  - text:
      - "Звезда над головой внезапно засияла ослепительно ярко, её многократно усиленное сияние в мгновение ока осветило половину ночного неба."
      - "В залитом светом небесах вспыхивают бесчисленные синие огни, которые то вспыхивают, то гаснут. Словно кто-то инвертировал цвета ночи."
      - "Раздаётся странный звук, похожий на накатывающие волны — он резонирует со всеми и каждым, потрясая до глубины души."
  - char: "duisburg"
    side: "left"
    text:
      - "О боже... Это класс Лорд?! Я думала, это миф!"
  - char: "commander"
    side: "right"
    text:
      - "Класс Лорд?"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Существо, превосходящее даже класс Вожак... Истинный лидер экстрамерных существ."
      - "Его имя — Звёздный Зверь... За всю историю он появлялся лишь трижды."
      - "Каждое его появление знаменовалось катастрофой."
  - char: "commander"
    side: "right"
    text:
      - "Значит, это четвертый раз..."
      - "Как вы справлялись с ним предыдущие три раза?"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "В первый раз мы бросили против него все творения золотого века человечества. Во второй — Сирены продемонстрировали свою последнюю славу."
      - "В третий — нам оставалось лишь быть свидетелями его ярости."
  - char: "commander"
    side: "right"
    text:
      - "......"
      - "Выглядит мрачно."

chapter3:
  rows:
  - text:
      - "Появляются бесчисленные щупальца, тянущиеся в небо, словно пытаясь сшить его с морем воедино."
      - "Волны становятся гораздо сильнее и яростнее, вселяя страх в сердце каждой девушки-кансен."
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Звёздный Зверь..."
      - "Тогда... Это был ты!"
      - "Ахахахаха... Наконец-то я тебя нашла!"
      - "Да... Пришло время!"
      - "Время отомстить за то, что ты сделал с моими сёстрами!"
      - "Тогда я была слаба — но не теперь!"
      - "Твоя смерть станет венцом достижений класса «Адмирал Хиппер»!"
  - text:
      - "Хиппер взглянула на бескрайнее небо и во всеуслышание заявила о своих намерениях."
  - char: "z52"
    side: "left"
    text:
      - "Нет, Хиппер! Успокойся!"
  - char: "duisburg"
    side: "right"
    text:
      - "Бесполезно. Она нас не послушает."
  - char: "commander"
    side: "left"
    text:
      - "Это не значит, что мы позволим ей убить себя."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Всем отрядам, поддержите Хиппер всем, что у вас есть!"

