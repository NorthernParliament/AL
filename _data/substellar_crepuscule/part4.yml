chapter1:
  rows:
  - text:
      - "После завершения моей встречи с Фриц Румей я официально стал членом Сопротивления."
      - "Не то чтобы у меня был большой выбор, учитывая, что я застрял в этом мире."
      - "С другой стороны, у них были знания касательно моей ситуации, которыми они могли поделиться."

chapter2:
  rows:
  - char: "fritz_rumey"
    side: "right"
    text:
      - "В прочитанных мной отчетах говорится, что случаи, подобные твоему — когда чужеземец внезапно растворялся в воздухе — происходили много раз в прошлом."
      - "Популярная теория того времени гласит, что чужеземцы возвращались в миры, откуда они пришли."
      - "Думаю, тебе пока не стоит беспокоиться о возвращении домой."
      - "Что касается того, что будет дальше, мы будем решать проблемы по мере их поступления."

chapter3:
  rows:
  - text:
      - "Мы также обсудили угрозу, с которой сталкивается этот мир, а именно так называемых экстрамерных существ."
      - "То, как их описывали, напомнило мне Икс."
      - "Однако внешне они отличаются. Чтобы узнать больше, мне просто придется сразиться с ними и увидеть всё самому."
      - "Я также упомянул Антиоха, и реакция была интересной."

chapter4:
  rows:
  - char: "fritz_rumey"
    side: "right"
    text:
      - "...«Антиох»? Никогда раньше не слышала этого слова. Странный псевдоним для Сирен, несомненно."
      - "Если тебе нужна информация о них, я могу ее предоставить."
      - "Ведь если проследить всё до самых истоков, они неразрывно связаны с развитием нашего мира, а также с моим собственным рождением."

chapter5:
  rows:
  - text:
      - "Румей рассказала мне, что Сирены появились из ниоткуда в этом мире примерно 200 лет назад."
      - "Как противоположность экстрамерных существ, они пришли с миром."
      - "Именно благодаря этим дружелюбным пришельцам технологическое развитие мира ускорилось в геометрической прогрессии."
      - "Однако со временем даже Сирены не избежали вражды между мировыми фракциями."
      - "Они тоже разделились, иногда даже втягиваясь в мелкомасштабные конфликты."
      - "Но даже несмотря на это, человечество верило, что этот золотой век стремительного развития цивилизации будет длиться вечно."
      - "Так оно и было — по крайней мере, до тех пор, пока не напали экстрамерные существа."
      - "Как только стало известно об их существовании, весь мир объединился под знаменем Сирен и провел бесчисленное множество сражений, вплоть до окончательного поражения Сирен."
      - "И всё же, несмотря на свою победу, экстрамерные существа странным образом не пошли дальше. Их наступление остановилось, а их мощь, казалось, даже пошла на спад."
      - "Именно так организациям сопротивления человечества удалось выжить до сегодняшнего дня..."
  - text:
      - "*тук-тук*"
  - char: "z11"
    side: "left"
    text:
      - "Комм! Ты здесь?"
  - text:
      - "Z11 — еще один член Сопротивления — стучит в мою дверь."

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Что случилось?"
  - char: "z11"
    side: "right"
    text:
      - "Ты же еще не ужинал, да?"
  - char: "commander"
    side: "left"
    text:
      - "Нет."
  - text:
      - "Никто не ужинает в четыре часа дня."
  - char: "z11"
    side: "left"
    text:
      - "Отлично! Идеально! Понимаешь, Дуйсбург устраивает приветственную вечеринку, и ты приглашен!"
  - char: "commander"
    side: "right"
    text:
      - "Приветственную вечеринку для кого?"
  - char: "z11"
    side: "left"
    text:
      - "Для тебя, конечно! Ты почетный гость, так что ты типа не можешь НЕ прийти. Девочки будут буквально убиты горем!"
      - "Так ты идешь или нет?"
  - char: "commander"
    side: "right"
    text:
      - "Конечно, иду. Показывай дорогу!"
  - char: "z11"
    side: "left"
    text:
      - "А? Подожди, э-э, эм-м... Разве ты типа... не знаешь, где наше тайное убежище?"
  - char: "commander"
    side: "right"
    text:
      - "С чего бы мне знать?"
  - char: "z11"
    side: "left"
    text:
      - "А, ну да, конечно... Полагаю, мне просто придется, э-э, проводить тебя..."
      - "Надо сделать всё как можно быстрее..."
  - char: "commander"
    side: "right"
    text:
      - "?.."
  - char: "z11"
    side: "left"
    text:
      - "*вдох-выдох*... Ладно, я в порядке! Пошли!"
  - text:
      - "Что-то свирепое внутри нее внезапно вырывается наружу, и она тащит меня из комнаты отдыха на головокружительной скорости."

chapter7:
  rows:
  - text:
      - "На пляже, который едва ли можно назвать красивым, Дуйсбург и ее подруги молча стоят и смотрят на закат."
  - char: "z52"
    side: "left"
    text:
      - "О, а вот и Командир! И Z11! Вы наконец-то пришли!"
  - char: "z11"
    side: "right"
    text:
      - "*вдох-выдох* Моя работа здесь окончена... Можно я пойду домой?"
  - char: "z52"
    side: "left"
    text:
      - "Да ладно, ты серьезно? Ты уже здесь, так какие у тебя причины НЕ остаться на вечеринку?"
  - char: "z11"
    side: "right"
    text:
      - "Ага... Ахахаха... Вы опять это затеяли, да?"
      - "Z9, ты участвуешь?"
  - char: "z9"
    side: "left"
    text:
      - "Ну, это же для Командира, так что..."
  - char: "z11"
    side: "right"
    text:
      - "Коне-е-ечно... Ладно, я останусь!"
  - char: "z52"
    side: "left"
    text:
      - "Супер!"

chapter8:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Так где же вечеринка?"

chapter9:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "«Затеяли это»? Что именно?"

chapter10:
  rows:
  - char: "duisburg"
    side: "left"
    text:
      - "Хи-хи. У тебя на лице всё написано. Давай я объясню."
      - "Посмотри туда. Что ты видишь?"
  - text:
      - "Дуйсбург указывает на довольно большой остров, расположенный на периферии штаба."
      - "Они соединены мостом, и на этом острове возвышается огромное сооружение, не уступающее по размерам зданию штаба."
  - char: "duisburg"
    side: "left"
    text:
      - "Это наша энергетическая башня. Это наша артерия жизни, которая питает не только всю базу, но и Зеркальное море, и даже Вечные Звёзды."
      - "Говорят, она таит в себе множество секретов, которые до сих пор не раскрыты спустя много лет, поэтому ее просто оставили как есть."
  - char: "commander"
    side: "right"
    text:
      - "И там находится ваше убежище?"
  - char: "duisburg"
    side: "left"
    text:
      - "Что? Нет. Но это как-то связано с тем, что мы собираемся сделать."
      - "Открою тебе секрет: внутри башни есть рыбная ферма."
  - char: "commander"
    side: "right"
    text:
      - "Серьезно?"
  - char: "duisburg"
    side: "left"
    text:
      - "Ага. Поскольку ты не в восторге от еды из тюбиков, я планировала вежливо позаимствовать немного рыбы, чтобы пожарить."
  - char: "commander"
    side: "right"
    text:
      - "Под «вежливо позаимствовать» ты имеешь в виду украсть?"
  - char: "duisburg"
    side: "left"
    text:
      - "Это называется брать с благодарностью!"
  - text:
      - "Она мило улыбается."
  - char: "commander"
    side: "right"
    text:
      - "Ладно. И как ты собираешься возвращать рыбу?"
      - "(Если только она не планирует заставить нас срыгнуть ее, как птиц...)"
  - char: "duisburg"
    side: "left"
    text:
      - "Это не имеет значения, пока популяция не сокращается."
  - text:
      - "Она сохраняет свою непоколебимую улыбку."
  - char: "z52"
    side: "right"
    text:
      - "Рано или поздно они расплодятся еще!"
  - char: "commander"
    side: "left"
    text:
      - "......"
  - char: "z52"
    side: "right"
    text:
      - "Ну так что, пойдешь с нами позаимствовать парочку?"
  - char: "commander"
    side: "left"
    text:
      - "Что ж, звучит весело, да и мне не помешает опыт работы в этом мире."
  - char: "z52"
    side: "right"
    text:
      - "Я так и думала. Пора выдвигаться!"
  - char: "z11"
    side: "left"
    text:
      - "П-погнали!"

chapter11:
  rows:
  - char: "z9"
    side: "left"
    text:
      - "Уф... Отличная работа, девочки. Угощайтесь кофе!"
      - "Рыба будет готова буквально через минуту."
  - char: "duisburg"
    side: "right"
    text:
      - "Твоя одежда тоже уже должна была высохнуть, Командир. Эти рыбешки были довольно шустрыми, да?"
  - char: "commander"
    side: "left"
    text:
      - "(Операция «Вежливый улов» прошла успешно... и весело.)"
      - "(Когда в последний раз я так веселился?)"
      - "(Проклятье... Я и правда не могу вспомнить из-за этой чертовой амнезии.)"
  - char: "z52"
    side: "right"
    text:
      - "А-а-а! Я напортачила! На помощь, помогите!"
  - char: "z11"
    side: "left"
    text:
      - "Ой! Ч-что случилось?!"
  - char: "z52"
    side: "right"
    text:
      - "Я плеснула туда немного бензина, потому что огонь показался мне слабым, и, ну... наша еда горит!"
  - char: "duisburg"
    side: "left"
    text:
      - "Ох, ради всего святого... Я ЖЕ ГОВОРИЛА не делать этого самой."
      - "Один момент, Командир. Я с этим разберусь!"

chapter12:
  rows:
  - text:
      - "И вот так мы с участницами Сопротивления вместе провели веселую ночь."
