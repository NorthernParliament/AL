chapter1:
  rows:
  - text:
      - "Когда свет померк, штаб, Вечные Звёзды и Звёздный Зверь — всё исчезло."
      - "Я сидел, склонившись над партой в классе, залитом тёплым солнечным светом. Через минуту, мне уже казалось, будто всё произошедшее было лишь сном."
      - "Но я прекрасно знал, что всё пережитое было реальностью. Слова Ойген всё ещё свежи в моей памяти."
  - char: "commander"
    side: "left"
    text:
      - "(Давно не виделись. Скоро увидимся.)"
  - char: "madam_m"
    side: "right"
    text:
      - "О чём-то задумался? Или просто странное чувство от того, что на этот раз тебе не пришлось умирать?"
  - char: "commander"
    side: "left"
    text:
      - "Я думаю о том, что сказал мне фантом Ойген перед моим уходом."
  - char: "madam_m"
    side: "right"
    text:
      - "Кого это волнует? Зачем мучиться из-за того, что она не сочла достаточно важным, чтобы сказать тебе напрямую?"
  - char: "commander"
    side: "left"
    text:
      - "Ты что-то знаешь, не так ли?"
  - char: "madam_m"
    side: "right"
    text:
      - "Давай вернёмся к разговору о тебе."
      - "Твои маленькие поиски наконец-то подошли к концу. Ты доволен?"
  - char: "commander"
    side: "left"
    text:
      - "Я бы назвал это счастливым концом."
      - "А что насчёт тебя? Чего ты добивалась всё это время?"
  - char: "madam_m"
    side: "right"
    text:
      - "Есть одна вещь, которую я хотела бы знать."
      - "...Помогла ли изоляция от воспоминаний о тестовом полигоне Бета легче разобраться в том, кто ты такой и что ты пережил?"
  - char: "commander"
    side: "left"
    text:
      - "Не могу этого отрицать. Кусочки головоломки сложились воедино намного проще. Я вспомнил кое-что новое."
      - "Но..."
  - char: "madam_m"
    side: "right"
    text:
      - "Тебе не нравится мой метод."
  - char: "commander"
    side: "left"
    text:
      - "Да, действительно не нравится. Я могу закрыть глаза на твои манипуляции мной, но манипулирование воспоминаниями моих друзей — это уже переходит все границы."
  - char: "madam_m"
    side: "right"
    text:
      - "Правда? Даже если некоторые из твоих собственных воспоминаний на тестовом полигоне Бета — ложь?"
  - char: "commander"
    side: "left"
    text:
      - "Не имеет значения. Мои воспоминания — с тестового полигона Бета, вот что важно."
      - "Что бы ни было до этого, именно там моё место."
      - "Для меня это не просто тестовый полигон, который можно легко отбросить. Это мой дом. По крайней мере, один из них."
      - "Честно говоря, я бы не смог выбраться из всего этого, если бы не мои узы."
      - "Ответ, который я дал, несомненно отличается от того, на который ты рассчитывала, верно?"
  - char: "madam_m"
    side: "right"
    text:
      - "Даа... Я планировала, что ты выберешь другой путь."
  - char: "commander"
    side: "left"
    text:
      - "Полагаю, чтобы я завершил Йормунганд."
  - char: "madam_m"
    side: "right"
    text:
      - "Почему ты так думаешь?"
  - char: "commander"
    side: "left"
    text:
      - "Роль Сирен — это ключ. Я думаю, твоей конечной целью здесь было заставить меня изменить своё мнение о них."
      - "Ты хотела, чтобы я терпел неудачи снова и снова, пока не соглашусь сотрудничать с Антиохом... или ты убедила бы меня пойти на похожую сделку."
      - "Если бы я согласился, ты бы рассказала мне, как завершить Йормунганд, и предоставила бы ресурсы. С его помощью мы бы победили Звёздного Зверя..."
      - "...И вместе с тем у меня сложилось бы новое впечатление о Сиренах — что они мои союзники. Не так ли?"
  - char: "madam_m"
    side: "right"
    text:
      - "Теперь это ничего не значит. В конце концов, ты выбрал другой путь."
  - char: "commander"
    side: "left"
    text:
      - "Фокусник... Ты ведь меня не помнишь, да?"
  - char: "madam_m"
    side: "right"
    text:
      - "Почему ты спрашиваешь?"
  - char: "commander"
    side: "left"
    text:
      - "Ты пыталась научить меня разным вещам, хотя и окольными путями. Но ты упорно молчала о моей истинной личности."
      - "Пока я искал, ты хотела наблюдать за мной и попытаться понять, кто я такой. Я ошибаюсь?"
  - char: "madam_m"
    side: "right"
    text:
      - "Хи-хи. Возможно. Или я просто заставила тебя так думать?"
      - "Так или иначе, теперь я понимаю твои мысли."
      - "Я больше не буду играть с твоими воспоминаниями. По крайней мере, это я тебе обещаю."
  - char: "commander"
    side: "left"
    text:
      - "Больше не будешь внезапно выдёргивать меня из моего мира?"
  - char: "madam_m"
    side: "right"
    text:
      - "Хм... Боюсь, это зависит от моего настроения."
  - char: "commander"
    side: "left"
    text:
      - "Тогда пообещай, что больше не будешь вмешиваться в их мир. Я хочу иметь возможность снова их увидеть."
  - char: "madam_m"
    side: "right"
    text:
      - "Очень хорошо."
      - "У нас осталось мало времени, так что давай сделаем что-нибудь особенное."

chapter2:
  rows:
  - text:
      - "Внезапно мы оказываемся внутри какого-то шатра для гаданий."
  - char: "madam_m"
    side: "right"
    text:
      - "Выбери три карты, пожалуйста."
  - text:
      - "На фиолетовой скатерти рубашкой вверх разложена колода карт Таро."
  - char: "commander"
    side: "left"
    text:
      - "Теперь мы будем гадать?"
  - char: "madam_m"
    side: "right"
    text:
      - "Прошлое, настоящее, будущее. Три карты, пожалуйста."
      - "Начинай."
  - text:
      - "Я выбираю первую карту."

chapter3:
  rows:
  - char: "madam_m"
    side: "right"
    text:
      - "Твоя первая карта — Звезда, перевёрнутая."
  - text:
      - "Я выбираю вторую карту."

chapter4:
  rows:
  - char: "madam_m"
    side: "right"
    text:
      - "Луна, в прямом положении."
  - text:
      - "Я выбираю третью карту."

chapter5:
  rows:
  - char: "madam_m"
    side: "right"
    text:
      - "Твоя третья... Что ж,  это очень интересно."
  - char: "commander"
    side: "left"
    text:
      - "В каком смысле?"
  - char: "madam_m"
    side: "right"
    text:
      - "Я пока не скажу. Я предпочту подержать тебя в напряжении."
  - char: "commander"
    side: "left"
    text:
      - "Ещё один секрет, да?"
  - char: "madam_m"
    side: "right"
    text:
      - "Я лишь позволила тебе выбрать. Разве я говорила, что поделюсь результатом?"
      - "К тому же, что толку знать будущее, если это означает ограничение твоих возможностей?"
      - "Хи-хи. Это было очень весело."
      - "С нетерпением жду нашей новой встречи, Командир."
