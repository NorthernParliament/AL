chapter1:
  rows:
  - text:
      - "Очиститель от радиации сработал, и нам удалось очистить партию минерализованной энергии."
      - "Зачистку вражеских сил мы оставили нашим союзникам, в то время как Румей, Дуйсбург и Хиппер сопроводили меня к энергетической башне."
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "И эта штука должна сделать меня сильнее?"
      - "Это что, шутка такая?"
  - text:
      - "Неудивительно, что Хиппер настроена так скептически."
  - char: "commander"
    side: "right"
    text:
      - "Ещё немного усилий..."
  - text:
      - "Выделив общие атрибуты между минерализованной энергией и Ватацуми и напитав результат эмоциями, его можно превратить в предмет, который воздействует на корпус девушки-кансен и повышает её огневую мощь."
      - "Однако вместо того, чтобы пытаться объяснить столь сложную концепцию, я решаю лучше показать, чем рассказать."
  - char: "commander"
    side: "right"
    text:
      - "(Напитать эмоциями... Другими словами, я должен сосредоточиться на том, как сильно я забочусь о Хиппер.)"
  - text:
      - "Вспомнив метод, которому меня научила Акаги, я поднимаю фрагмент минерала и прикладываю его ко лбу."

chapter2:
  rows:
  - text:
      - "Моё сознание меркнет, и я понимаю, что нахожусь где-то в другом месте."
      - "Пустота бесконечно простирается во всех направлениях. Время и местоположение здесь не имеют никакого значения."
  - char: "commander"
    side: "left"
    text:
      - "Почему это кажется... ностальгическим?"
      - "Здесь ли я впервые встретил Родни META?"
      - "Ах, чёрт возьми!"
  - text:
      - "Мой затуманенный разум начинает плавиться, ассимилируясь в бесконечной пустоте."
  - char: "commander"
    side: "left"
    text:
      - "Стоп!"

chapter3:
  rows:
  - text:
      - "Когда моё сознание начинает угасать, я слышу знакомый звук колокольчика."

chapter4:
  rows:
  - char: "admiral_hipper"
    side: "right"
    status: "is-blue"
    text:
      - "Угх, почему ты продолжаешь спрашивать, какие подарки я бы хотела?"
      - "Ты что, дурак?!"
      - "Хмф! Ладно, но я скажу тебе только один раз!"
      - "Идиот!"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Что это было?)"
  - text:
      - "Я становлюсь свидетелем странной сцены, но она быстро ускользает из моих воспоминаний."
      - "Я в замешательстве поднимаю глаза. Все вокруг меня удивлены не меньше."
  - char: "commander"
    side: "left"
    text:
      - "......"
  - char: "duisburg"
    side: "right"
    text:
      - "Командир... Ты сделал это так легко?!"
      - "Ни специального оборудования, ни особой обработки... Просто приложив его ко лбу, ты превратил минерализованную энергию во что-то другое!"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Антинаучно."
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Воистину, гость извне. Ты нечто особенное."
  - text:
      - "Их комментарии заставляют меня осознать, что минерал в моей руке превратился в маленькую коробочку."
  - char: "commander"
    side: "left"
    text:
      - "(Придание эмоциям материальной формы... В этом ли истинная сила Ватацуми?)"
      - "(Я не знаю, работает ли это как Кубы Мудрости, но в любом случае, похоже, что сработало.)"
      - "(Но эта коробочка — то ли это, о чём я думаю?)"
      - "Хиппер, я хочу, чтобы ты взяла это."
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "И это должно сделать меня сильнее? Что внутри этой штуки?"
  - char: "commander"
    side: "left"
    text:
      - "Неизвестность. Именно поэтому она может дать тебе силу, известную как надежда."
      - "Незнание будущего — вот что даёт нам надежду. Мы сами решаем свою судьбу, а не кто-то другой."
      - "Мы ещё не закончили. И этот мир тоже."
      - "С этой силой мы вырвем победу и обретём будущее, полное надежд."
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Всё равно не понимаю, к чему ты клонишь."
      - "Ну, это подарок. Спасибо, наверное."

chapter6:
  rows:
  - text:
      - "Мы с Румей работаем вместе, чтобы подготовить оборону штаба так быстро, как это только возможно."
      - "После этого я отправляюсь к Вечной Звезде и использую консоль, чтобы переключить Зеркальное море в режим обороны."
  - char: "commander"
    side: "left"
    text:
      - "Звёздный Зверь приближается. Посмотрим, как он справится с нами на этот раз!"
