chapter1:
  rows:
  - text:
      - "Флот Сопротивления Румей на полном ходу мчался обратно в штаб."
  - char: "duisburg"
    side: "left"
    text:
      - "Румей, Командир. Если мы продолжим идти этим курсом, то попадём в опасные воды."
  - char: "commander"
    side: "right"
    text:
      - "(Опасные воды?)"
      - "Насколько большую угрозу этот маршрут представляет для нашего основного флота?"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Доля риска есть. Однако она приемлема, учитывая численность наших сил."
  - char: "duisburg"
    side: "right"
    text:
      - "То есть ты хочешь сказать..."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Каждая секунда на счету. Мы не меняем курс."
  - char: "duisburg"
    side: "right"
    text:
      - "Вас поняла!"

chapter2:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "extrademision_horde"
    side: "right"
    text:
      - "Р-Р-Р-Р-Р-Р!"
  - char: "z52_rad"
    side: "left"
    text:
      - "О нет... Мы идем так быстро, как только можем, но они быстрее!"
  - char: "commander"
    side: "right"
    text:
      - "Эта орда еще сильнее предыдущей!"
      - "Румей, они прощупывают нас и одновременно истощают наши силы."
      - "Они атаковали наш штаб И устроили засаду на нас, в момент когда мы возвращаемся на его защиту... Их определённо кто-то направляет, это точно."
      - "Продолжать путь слишком опасно. Румей, запрашиваю смену курса."
  - char: "fritz_rumey_rad"
    side: "left"
    text:
      - "Думаешь, там есть Вожак? Эти твари редко появляются с тех пор, как мы потеряли Сирен."
      - "Последний был несколько десятилетий назад. Я знаю, что ты беспокоишься, но ты, должно быть, накручиваешь себя."
      - "Мы уже прошли половину пути и почти не получили урона."
      - "Твоя предусмотрительность похвальна, да, но наша оборона в штабе слаба без основного флота."
      - "У нас нет другого выбора, кроме как рискнуть. Продолжаем двигаться вперёд, живо!"

chapter3:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "duisburg_rad"
    side: "left"
    text:
      - "Командир! Румей! Атаки с флангов слишком сильны! Наш строй рушится!"
  - char: "fritz_rumey_rad"
    side: "right"
    text:
      - "Я прикрою тыл! Пусть все корабли перестроятся в 30 морских милях впереди!"
  - char: "duisburg_rad"
    side: "left"
    text:
      - "Поняла! Немедленно передам!"
  - char: "fritz_rumey_rad"
    side: "right"
    text:
      - "Командир, веди за собой командирский корабль и проконтролируй перестроение! Как только оно завершится, немедленно отправляйтесь на базу!"
  - char: "commander"
    side: "left"
    text:
      - "Если они знают наши планы, тогда их следующий шаг..."
      - "Румей. Известны ли случаи, когда экстрамерные существа атаковали используя механизм самоуничтожения?"
  - char: "fritz_rumey_rad"
    side: "right"
    text:
      - "Они звери. Они следуют только своим инстинктам — они бы никогда не покончили с собой ради великой цели."
      - "Они спасаются бегством перед лицом превосходящих сил, и они крайне редко сражаются до смерти. Если бы они когда-нибудь и начали самоуничтожаться, то это только если..."
  - char: "commander"
    side: "left"
    text:
      - "...Только если их вожак заставил их."
  - char: "fritz_rumey_rad"
    side: "right"
    text:
      - "Боже правый! Но этого не может..."
  - text:
      - "БАБАХ!!!"

chapter4:
  rows:
  - text:
      - "В центре взрыва серийного корабля моё сознание низвергается в пустую бездну."
  - text:
      - "ШУРХ..."
  - text:
      - "А затем я слышу звук тасуемых карт."
