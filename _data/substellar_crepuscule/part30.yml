chapter1:
  rows:
  - text:
      - "Вот уже несколько дней Хелена безотрывно смотрела на панель перед собой и работала без отдыха."
      - "Оставался всего один системный час до того, как она обнаружит координаты тестового полигона Бета."
      - "Она захватила центральное устройство фантомного тестового полигона три системных часа назад."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Всё идёт даже слишком гладко..."
      - "Фокусник, должно быть, устроила ловушку. Это ясно уже из того факта, что появление Мисс D на тестовом полигоне Бета не держится в секрете."
      - "Кроме того, Башня и Камелот должны поддерживать постоянную связь, чтобы это сработало..."
      - "Сейчас было бы идеальное время для её атаки, и всё же..."
      - "Почему она ничего не предпринимает?"
      - "В этом и был весь смысл? Просто задержать меня на пару дней, и ничего больше?"
  - text:
      - "БИП-БИП!"
  - text:
      - "Как по команде, ситуация изменилась к худшему."
      - "Мощный удар последовал, казалось, со всех сторон. Приманка, которую подготовила Хелена, была уничтожена в мгновение ока."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "И это всё?"
      - "Нет... Она никогда не охотилась за Башней. Она хотела нарушить пространство-время и отсрочить мой контакт с тестовым полигоном Бета!"
      - "Обсервер, ты там закончила?"
  - char: "observer_rad"
    side: "right"
    text:
      - "Я всё ещё выбираю место для Мейнфрейма. Думаешь, я могу сделать это так быстро?"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Понятно. Тогда пока отложи это."
  - char: "observer_rad"
    side: "right"
    text:
      - "...Ты ведь не собираешься сказать мне, чтобы я шла сражаться с Фокусником, верно?"
      - "Я? Сражаться с Арбитром? Ты, должно быть, шутишь."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Немедленно отключайся и прячься — пока она не перехватила контроль и не застала нас врасплох."
      - "Иначе я буду вынуждена избавиться от тебя."
  - char: "observer_rad"
    side: "right"
    text:
      - "Угх... Ладно, я сваливаю."

chapter2:
  rows:
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Фух..."

chapter3:
  rows:
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Запрашиваю доступ к базе данных Антиоха: Информация о системе Арбитров."
      - "Чтение резервных данных Арбитров с IV по XIV. Построение симуляций."
      - "Фокусник... Ты всегда была для меня бельмом на глазу."
      - "Пришло время мне сделать свой ход!"
