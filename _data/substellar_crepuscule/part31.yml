chapter1:
  rows:
  - text:
      - "Моё исчезновение стало известно как День, когда померкли звёзды."
      - "В течение нескольких дней после этого я оставался в павильоне Империи Сакуры из соображений безопасности."
      - "Во время своего пребывания я представил отчёт об инциденте, связался со своими союзниками по всему миру и убедился, что всё вернулось в норму."
      - "После этого я связался с Элизабет по зашифрованному каналу и узнал, что подкрепление Пепла так и не прибыло в Сингулярность Океана NA."
      - "Она также сообщила мне о ситуации с тестовым полигоном Бета и о том, как усердно над этим работает Хелена МЕТА."
      - "Я всё ещё не мог связаться с самой Хеленой, и Камелот потерял с ней связь."
      - "Учитывая то, что я знал на данный момент, не было никаких сомнений, что она и Мадам М — Фокусник — находились в самом разгаре ожесточённой битвы."
      - "У меня не было бы никакой возможности вмешаться, и, зная их силу, казалось маловероятным, что кто-то из них серьёзно пострадает."
      - "Всё, что я мог делать — это молиться, чтобы их битва поскорее закончилась."
      - "И вот, наконец, настало время Акаги возвращаться в Империю Сакуры."

chapter2:
  rows:
  - char: "akagi"
    side: "left"
    text:
      - "Ты можешь оставить меня здесь, Командир."
  - char: "commander"
    side: "right"
    text:
      - "Для тебя это очень важный момент. Я не против пойти с тобой, если так будет легче."
  - char: "akagi"
    side: "left"
    text:
      - "Ты... правда пойдёшь со мной?"
  - char: "commander"
    side: "right"
    text:
      - "Конечно. У меня есть два-три свободных дня, и я могу найти больше времени, если понадобится."
  - char: "akagi"
    side: "left"
    text:
      - "Не нужно. Это внутреннее дело, поэтому оно должно решаться моим народом."
      - "Если ты будешь там, они могут быть ко мне слишком добры. Я не получу того наказания, которого заслуживаю."
      - "К тому же... Госпожа Нагато, Мусаси, Микаса — все они теперь выступают единым фронтом."
  - char: "commander"
    side: "right"
    text:
      - "Но..."
  - char: "akagi"
    side: "left"
    text:
      - "Я буду в порядке. Я готова ко всему, что бы ни случилось."
  - char: "amagi_cv"
    side: "right"
    text:
      - "Не волнуйся, Командир. Я тоже буду там."
      - "Я долго была вдали от дома, но верю, что у меня всё ещё остались друзья, которые проявят ко мне уважение."
  - char: "akagi"
    side: "left"
    text:
      - "Я не забыла наше обещание путешествовать вместе."
      - "Когда всё это закончится, Командир... Я буду ждать тебя. В Империи Сакуры."
  - char: "commander"
    side: "right"
    text:
      - "Спасибо, Акаги."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Командир. Друзья. Сакуранский флот на этом откланивается."
      - "С нетерпением жду нашей новой встречи со всеми вами."

chapter3:
  rows:
  - text:
      - "Так отбывает флот Империи Сакуры."
  - char: "memphis"
    side: "left"
    text:
      - "Вот они и ушли..."
  - char: "commander"
    side: "right"
    text:
      - "Стала немного сентиментальной?"
  - char: "memphis"
    side: "left"
    text:
      - "Она рисковала своей жизнью вместе с нами."
      - "Сначала она казалась мне немного впадающей в крайности... Но теперь, когда мы поговорили, я думаю о ней иначе."
  - char: "commander"
    side: "right"
    text:
      - "В Акаги есть нечто большее, чем просто её ошибки. Надеюсь, она сможет искупить свои грехи."
  - char: "memphis"
    side: "left"
    text:
      - "Божечки. Тебе не кажется, что сначала нужно побеспокоиться о себе?"
  - char: "commander"
    side: "right"
    text:
      - "Хм?"
  - char: "memphis"
    side: "left"
    text:
      - "Не разбрасывайся словами, что можешь найти для людей сколько угодно времени!"
      - "Угх, расставь правильно приоритеты!"
  - char: "commander"
    side: "right"
    text:
      - "О... Ты имеешь в виду реформацию?"
  - char: "memphis"
    side: "left"
    text:
      - "Да, именно это я и имею в виду! Реформация снова на повестке дня благодаря всему этому, и перспективы лучше, чем когда-либо!"
      - "Силы Сирен теперь тоже дезорганизованы из-за потери Мейнфрейма... У тебя, знаешь ли, бесконечное количество работы!"
  - char: "commander"
    side: "right"
    text:
      - "......"
      - "В Лазурном Пути дуют ветры перемен..."
  - text:
      - "Я тоже должен подумать о тестовом полигоне."
      - "Теперь, когда Экспериментального Отдела больше нет, стоит ли предавать истину огласке?"
      - "Как сложится будущее без вмешательства Сирен?"
      - "Проблемы, с которыми, как я думал, придётся разбираться «будущему мне», наваливаются на меня прямо сейчас."
      - "Сирены принесли войну и разрушения, но в то же время они подтолкнули нас к решению проблемы Икс."
      - "С исчезновением их Мейнфрейма исчезло и это давление."
      - "Что насчёт людей, которые не знают об Икс? Они испытывают облегчение от снижения угрозы Сирен, но что они почувствуют потом?"
      - "Есть ли у Лазурного Пути вообще причина существовать дальше?"
  - char: "memphis"
    side: "left"
    text:
      - "Всё это время мы были так сосредоточены на победе над Сиренами."
      - "Но теперь, когда Экспериментального Отдела больше нет... Не похоже, что мы действительно победили."
  - text:
      - "Всё ещё есть Сирены, которые угрожают безопасности этого мира."
      - "Арбитры, наблюдающие за нами. Таинственная Обсервер Зеро."
      - "Пока их эксперименты продолжаются — пока мы страдаем в качестве их подопытных кроликов — мир с Сиренами невозможен."
      - "Более того, наша истинная угроза всё ещё скрывается во тьме. Риск её вторжения в наш мир присутствует всегда."
      - "Сейчас не время почивать на лаврах."
  - char: "memphis"
    side: "left"
    text:
      - "Мы не можем рассказать всему миру всё о нашем враге..."
      - "Они будут праздновать эту ложную победу и сражаться за трофеи ещё какое-то время..."
  - char: "commander"
    side: "right"
    text:
      - "Мы ничего не можем с этим поделать. Нам просто нужно защищать мир."
      - "Лазурный Путь, Сирены и наш тестовый полигон..."
      - "Полагаю, у меня всё-таки будет не так уж много свободного времени."
      - "Точно. Я должен вернуть твой платок. Он оказался большим подспорьем."
  - char: "memphis"
    side: "left"
    text:
      - "О... Ничего страшного! Это подарок!"
  - char: "commander"
    side: "right"
    text:
      - "Я думал, это твой любимый?"
  - char: "memphis"
    side: "left"
    text:
      - "Не беспокойся об этом!"
      - "Если ты действительно хочешь отблагодарить меня, то купи мне новый."
      - "К тому же... Ты сказал, что свободен следующие два дня? Почему бы нам всем не сходить куда-нибудь вместе?"
      - "Мне не терпится побывать в отпуске в Сардинии!"
