chapter1:
  rows:
  - text:
      - "В Зильберштерне я вижу усердно работающих роботов-шахтеров, снующих с места на место."
  - char: "commander"
    side: "left"
    text:
      - "(Теперь я вернулся в момент прямо перед атакой? Это примерно восемь часов назад...)"
      - "(Проклятье... У меня так мало времени на работу. Как же мне это сделать?)"
      - "(Должен ли я прямо сейчас отдать приказ подготовиться к засаде?)"
      - "(По крайней мере, это выиграет нам немного времени. Затем мне нужно предупредить Румей о том, чтобы мы не лезли на рожон в опасную зону...)"
      - "(Для разработки базового решения потребуется флот побольше.)"
      - "(Погодите-ка... Флот побольше...)"

chapter2:
  rows:
  - text:
      - "На дальнем конце океана вспыхивает луч света, казалось бы, направляя поток информации мне в голову."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Еще один фрагмент воспоминаний. Как раз вовремя.)"
      - "(Существует вариант Куба Энергии, известный как Куб Мудрости...)"
      - "(Странно — откуда в этом мире Кубы Мудрости?)"
      - "(Если бы Сопротивление могло использовать Кубы Мудрости для расширения своего флота, они бы не оказались сейчас в таком отчаянном положении. Так что же пошло не так?)"
      - "(Без каких-либо Кубов наш единственный выход — полагаться на то, что нас спасет Адмирал Хиппер META.)"

chapter4:
  rows:
  - text:
      - "Спустя некоторое время я подошел к Румей. Она наблюдает за процессом добычи."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Что-то случилось? Твое выражение лица говорит само за себя."
  - char: "commander"
    side: "right"
    text:
      - "Нам нужно поговорить о Кубах Мудрости..."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "...Кубы Мудрости? Как давно я не слышала этих слов."
      - "Всё так, как ты говоришь. Мы — существа, рожденные из этих Кубов."
      - "Увы, все наши технологии сбора Кубов исчезли вместе с Сиренами, а наши запасы уже давно иссякли."
  - char: "commander"
    side: "right"
    text:
      - "(Погодите, «технологии сбора»?)"
      - "Хочешь сказать, Кубы каким-то образом собирают?"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Именно. Я слышала, что глубоко под водой покоится уникальная руда. Только Сирены знали, как ее извлечь."
      - "Даже если бы технологии вернулись к нам, строительство необходимых объектов для сбора материала — это несбыточная мечта в наших условиях."
  - text:
      - "Она криво усмехается, полная самоиронии."
  - char: "commander"
    side: "left"
    text:
      - "(Это не то, что я помню. Там говорилось, что Куб Мудрости был создан как вариация Куба Энергии.)"
      - "(Неужели Сирены ограничили им доступ к этой информации?)"
      - "(Ну, даже если и так, уже слишком поздно что-то менять.)"
      - "Я хочу связаться с Адмирал Хиппер META."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Хиппер, говоришь?"
      - "Ах, да, именно она нашла тебя первой. У тебя к ней вопросы?"
  - char: "commander"
    side: "left"
    text:
      - "Судя по тому, что мне рассказывала Дуйсбург, отношения Сопротивления с ней довольно сложные."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "И не говори."
      - "Ее имя по сей день числится в списке разыскиваемых Герцогством. Хотя это не значит, что мы стремимся ее арестовать."
  - char: "commander"
    side: "left"
    text:
      - "Она в итоге стала МЕТА из-за чего-то, что сделало Герцогство?"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Давным-давно мы вели войну и проиграли."
      - "Мы следовали приказам и выполняли свою миссию. Не было ни вмешательства извне, ни внутренних распрей. И все же мы проиграли."
      - "Мы смирились с нашим поражением и приняли его. Однако Хиппер — нет."
  - char: "commander"
    side: "left"
    text:
      - "Полагаю, поэтому она сражалась с Герцогством и в итоге оказалась в розыске."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "...Это было в далеком прошлом."
  - char: "commander"
    side: "left"
    text:
      - "Извини, если затронул деликатную тему."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Позже Хиппер перестала быть к нам враждебной. На самом деле, она даже иногда помогала нам с Восходящими приливами."
      - "Хотя, если ты спросишь ее, она никогда в этом не признается. Должно быть, для нее это вопрос гордости."
      - "Дуйсбург может рассказать тебе о ней больше, чем я. Позови ее, хорошо?"
  - char: "commander"
    side: "left"
    text:
      - "На это нет времени. Вдадимся в подробности как-нибудь в другой раз."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Что? Нет времени?"
  - text:
      - "Она внезапно становится настороженной после своего погружения в море воспоминаний."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Что ты имеешь в виду? Можешь объяснить?"
  - char: "commander"
    side: "left"
    text:
      - "Ситуация изменилась."
      - "У экстрамерных существ есть лидер, и они используют нашу контроперацию как возможность для чего-то."
      - "Поскольку твоя главная огневая мощь находится с нами, самым разумным решением будет повысить уровень боевой готовности базы и вернуться как можно скорее."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Другими словами, у них есть класс Вожак... Если такой и правда есть, это серьезная угроза."
      - "Однако с тех пор, как ушли Сирены, не было ни одного случая появления класса Вожак на протяжении десятилетий."
      - "Как ты можешь быть уверен, что он существует, когда мы не видели даже тени намека на это?"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Они уже заняли выгодные позиции и подготовили засаду. Безмозглые твари так не делают. Есть очень большая вероятность, что ими кто-то командует."
      - "Более того, твои союзники в штабе ремонтируют Вечные Звезды и потеряли бдительность. Это делает их легкой мишенью."
      - "Излишняя гордыня влечет за собой ошибки и ведет к поражению. Это то, что я не успел сказать тебе перед нашим отбытием."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Да... Всё это отличные доводы. Реактивация Вечных Звезд сделала меня слишком самонадеянной."

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Мое командирское чутье буквально кричит мне об этом. Доверься мне."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "«Чутье» — не самый удовлетворительный ответ. Насколько ты уверен в этом своем инстинктивном чувстве?"
  - char: "commander"
    side: "left"
    text:
      - "На все 100%."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Ладно.  Я доверюсь тебе."

chapter7:
  rows:
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Я немедленно свяжусь с базой."

chapter8:
  rows:
  - text:
      - "Спустя час мое «предсказание» сбывается, и база подвергается нападению."
  - char: "z11_rad"
    side: "right"
    text:
      - "С-с-срочное сообщение! Вы меня слышите?!"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Что случилось?! Отвечай немедленно!"
  - char: "z11_rad"
    side: "right"
    text:
      - "Р-рой экстрамерных существ атакует базу!"
      - "Мы едва держимся благодаря тому, что подняли уровень готовности до максимума, и... В любом случае!"
      - "Враг там словно с цепи сорвался, но мы перенесли оборону, и она держится!"
      - "Это было офигенное предвидение с твоей стороны!"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Это не я предвидела нападение — это Командир."
      - "Соберите свои силы и укрепите оборону! Как только наши основные корабли прибудут, мы возьмем врага в клещи и уничтожим его!"
  - char: "z11_rad"
    side: "right"
    text:
      - "Поняла! Огромное спасибо и тебе, Комму!"
  - text:
      - "Румей завершает вызов, затем поворачивается ко мне с подозрительным взглядом."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Всё точно так, как ты и предсказывал. Что будем делать теперь?"
  - char: "commander"
    side: "right"
    text:
      - "(Единственное, что я знаю, это то, что враг ждет в засаде в опасной зоне...)"
      - "(Оборона базы надежна... Ах, я знаю!)"
      - "Поскольку штаб был наготове и у них есть Вечные Звезды, они должны продержаться."
      - "Признаю, возможно, я слишком поспешно предложил вернуться на базу. Насколько я могу судить, наши первоначальные цели миссии всё еще выполнимы в некоторой степени."
      - "Лучше получить необходимый минимум, чем возвращаться домой с пустыми руками."
      - "Дуйсбург, как продвигается добыча?"
  - char: "duisburg_rad"
    side: "left"
    text:
      - "Примерно 30% от нашей цели."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Мы не можем позволить себе ждать ее завершения."
  - char: "commander"
    side: "left"
    text:
      - "Это правда. Пока придется довольствоваться тем, что хватит на один очиститель от радиации."
      - "Этого будет достаточно, чтобы сказать, что мы достигли поставленной цели."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Вот так, Дуйсбург. Как только у нас будет достаточно материалов для одного устройства, забирайте оборудование и отступайте."
  - char: "duisburg_rad"
    side: "left"
    text:
      - "Вас поняла."
  - char: "commander"
    side: "right"
    text:
      - "Существует вероятность, что наша группа — их истинная цель. Я хочу, чтобы все были максимально готовы к бою, когда мы отправимся обратно."
      - "Давайте выберем такой обратный маршрут, который будет настолько же быстрым, насколько И безопасным."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Z52, помоги Командиру проложить курс. Нельзя бросаться вперед сломя голову."
  - char: "z52_rad"
    side: "right"
    text:
      - "Будет сделано!"
  - char: "commander"
    side: "left"
    text:
      - "О, и я хотел бы запросить дополнительное подкрепление."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Что-что? Позволь напомнить тебе — мы единственный боеспособный флот в этом районе."
  - char: "commander"
    side: "left"
    text:
      - "Почти. Есть Хиппер. Отправь ей запрос на помощь. Неважно, даже если он будет незашифрованным."
      - "Зная ее послужной список, она согласится помочь. Нам сейчас нужна ее сила."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Стоит попробовать. Я не могу гарантировать, что она поможет, но чем больше у нас будет поддержки, тем лучше."
  - char: "commander"
    side: "left"
    text:
      - "Спасибо, Румей. Отправляемся, как только все будут готовы!"
