chapter1:
  rows:
  - text:
      - "На гигантском корабле синеволосая девушка смотрела на раскинувшуюся перед ней галактику."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Нарака и Сингулярность Океана NA связаны, и Командир действительно вошёл в Сингулярность."
      - "Но что-то вмешивается в работу выхода."
      - "Мемфис находится на другом тестовом полигоне, а Командир пропал..."
      - "Нет... Тестовый полигон Бета словно бы вообще стал иллюзией."
      - "Я нигде не могу его найти. Куда подевался настоящий тестовый полигон Бета?"
  - text:
      - "В холодных глазах Хелены промелькнула тень боли."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Пассивный радар и обычное сканирование не показывают никаких аномалий. От наших систем защиты также не поступало никаких уведомлений."
      - "Если бы ресурсы Башни не были перенаправлены на активное сканирование, я бы ни за что не раскусила маскировку тестового полигона."
      - "Что-то переместило настоящую Бету в другое место."
      - "Способность не просто изменить её координаты, но и создать иллюзию размером с целую ветвь и даже заглушить возможности наблюдения Башни..."
      - "В этом нет никаких сомнений."
      - "Императрица и Фокусник..."
      - "Значит, они объединились."
  - text:
      - "Блеск в её глазах стал ещё холоднее."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Бездушные существа, скрывающиеся во тьме и жаждущие заполучить Командира..."
      - "Добавим ещё одну обиду к этой долго назревавшей ненависти... Очень хорошо. Тогда приступим."
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Дзинцу. Это я."
