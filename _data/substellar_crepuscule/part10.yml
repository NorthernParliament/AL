chapter1:
  rows:
  - text:
      - "После публичного выступления Румей я попросил Дуйсбург и Z52 сопроводить меня к Вечной Звезде, находящейся в наилучшем состоянии."
      - "После недолгого плавания на серийном корабле мы стоим прямо под брюхом гигантского сооружения."
      - "Оно беззвучно парит в воздухе, примерно в десяти метрах над поверхностью."
  - char: "commander"
    side: "left"
    text:
      - "(Технология парения. Напоминает мне летающие линкоры Объединённого Совета.)"
      - "(Только более продвинутая. Это сооружение затмевает собой любой линкор.)"
  - char: "duisburg"
    side: "right"
    text:
      - "Это Вечная Звезда 1, самая целая из всех."
      - "Мы однажды исследовали эту штуку, когда захватили её, но, по сути, ничего не нашли."
      - "Впрочем, возможно, наш надёжный Командир преуспеет там, где мы потерпели неудачу?"
  - text:
      - "Улыбнувшись мне, Дуйсбург открывает двери контейнера, стоящего на палубе."
  - char: "duisburg"
    side: "right"
    text:
      - "Что ж, ты первый."
  - char: "commander"
    side: "left"
    text:
      - "Для чего этот контейнер?"
  - char: "duisburg"
    side: "right"
    text:
      - "Эта штука парит в воздухе, помнишь? Насколько я помню, никто из нас здесь не умеет летать."
  - text:
      - "По щелчку пальцев Дуйсбург стая дронов, похожих на драконов, пикирует вниз и цепляется за четыре угла контейнера."
  - char: "commander"
    side: "left"
    text:
      - "Подожди, ты собираешься поднять нас туда в контейнере? И вообще, что это за дроны?"
  - char: "duisburg"
    side: "right"
    text:
      - "Орнитоптеры модели IB-50 по прозвищу «Птерозавр». Они были разработаны на основе технологии оснастки."
      - "Просто называй их Птерозаврами."
  - char: "commander"
    side: "left"
    text:
      - "(Надо же, орнитоптеры... Ну, их применение не так уж сильно отличается от самолётов с неподвижным крылом.)"
  - char: "z52"
    side: "right"
    text:
      - "Давайте, поднимаемся!"

chapter2:
  rows:
  - text:
      - "Войдя в сооружение, мы оказались в длинном коридоре шириной три метра и высотой пять."
      - "С одной его стороны находился лифт, на этот раз ведущий вверх, в центральную часть Звезды."
      - "Здесь нет ни развилок, ни лестниц, и даже двери."
  - char: "duisburg"
    side: "left"
    text:
      - "Снаружи кажется, что здесь куча мест для исследований... На самом же деле планировка предельно проста, не так ли?"
  - char: "commander"
    side: "right"
    text:
      - "Я ожидал, что это займёт целых три дня. Теперь же кажется, что мы управимся за полдня."
  - char: "duisburg"
    side: "left"
    text:
      - "В этом все сооружения Сирен — закрытые, компактные и автоматизированные от и до."
      - "Если бы Сирены не приспособили их для нас, даже этого единственного коридора, вероятно, не существовало бы."
  - char: "commander"
    side: "right"
    text:
      - "И то верно."
  - char: "duisburg"
    side: "left"
    text:
      - "Вон те семь пьедесталов — это панели управления. Работает только первая."
      - "Всё, что она может — это открывать и закрывать проход, выдавать и отзывать права доступа, а также изменять радиус готовности сооружения. О, и ещё включать и выключать режим обзора."
      - "Давай я продемонстрирую."
  - text:
      - "Её изящные руки пробегают по панели управления."

chapter3:
  rows:
  - text:
      - "В мгновение ока стены и пол становятся прозрачными. Солнечный свет льётся со всех сторон, и море под нами светится золотом."
  - char: "duisburg"
    side: "left"
    text:
      - "Хи-хи. Это режим обзора. Круто, да?"
  - text:
      - "Такое чувство, будто я парю в небе. Этот невероятный вид, кажется, простирается до самого края света."
  - char: "commander"
    side: "left"
    text:
      - "Хоть вид и правда потрясающий, не думаешь ли ты, что истинная цель этого режима — обеспечить оптимальный обзор поля боя?"
  - char: "duisburg"
    side: "right"
    text:
      - "Хм. Вполне возможно."
      - "Дело в том, что никто не способен управлять Вечной Звездой в бою, поэтому на практике это, по сути, просто смотровая площадка."
  - char: "commander"
    side: "left"
    text:
      - "(Понятно...)"
  - text:
      - "Мысленно вздохнув, я как бы невзначай кладу руку на панель управления станции."
  - char: "control_station_1"
    side: "right"
    text:
      - "Права доступа подтверждены."
  - text:
      - "По всему коридору разносится гул. Огни на второй панели управления загораются, словно она ожила."
  - char: "commander"
    side: "left"
    text:
      - "(Я так и знал. Мы с Антиохом связаны.)"
  - char: "duisburg"
    side: "right"
    text:
      - "Обалдеть... Поверить не могу! Потрясающая работа!"
      - "Никто никогда раньше этого не делал! Я должна рассказать Румей!"
  - char: "z52"
    side: "left"
    text:
      - "Быстрее, проверь, появились ли у неё какие-нибудь новые функции!"

chapter4:
  rows:
  - text:
      - "Подгоняемый Z52, я подхожу ко второй станции. Я быстро вспоминаю, как ей управлять."
  - char: "commander"
    side: "left"
    text:
      - "Посмотрим, здесь есть... Проверка системных журналов, запуск самовосстановления, открытие грузового прохода..."
      - "Обзор систем вооружения, настройка режима перехвата... Есть даже ручное управление каждым отдельным орудием."
  - char: "z52"
    side: "right"
    text:
      - "Так, подожди, ты можешь управлять тем, куда стреляет звезда?!"
      - "Нифига себе! Это самое крутое из всего, что я когда-либо видела!"
  - char: "commander"
    side: "left"
    text:
      - "Похоже, открытие прохода также позволит нам починить окружающие Вечные Звёзды."
      - "Мы даже сможем вернуть в строй те, что были отключены из-за повреждений."
      - "Могу сказать одно — это станет огромным толчком для боевых возможностей Сопротивления."
  - char: "z52"
    side: "right"
    text:
      - "Знаешь, я и правда начинаю тобой восхищаться!"
  - char: "fritz_rumey_rad"
    side: "left"
    text:
      - "Какой великолепный сюрприз ты мне преподнёс."
      - "Мне вот интересно — Звезду можно переместить?"
      - "Если бы она была способна к автономному передвижению и прицеливанию, для нас открылось бы гораздо больше мест для освобождения."
  - char: "commander"
    side: "right"
    text:
      - "Это, возможно, уже слишком..."
      - "Судя по журналам данных, Вечные Звёзды на самом деле являются частями ещё большей машины. Они не были созданы для самостоятельного передвижения."
  - char: "fritz_rumey_rad"
    side: "left"
    text:
      - "Ещё большей машины? Это для меня новость."
  - char: "commander"
    side: "right"
    text:
      - "Ну, это только мои догадки. Также возможно, что Зеркальное море и энергетическая башня имеют какое-то отношение к этой предполагаемой машине."
      - "Но, к сожалению, некоторых частей всё ещё не хватает. Они так и не закончили её строительство."
  - char: "fritz_rumey_rad"
    side: "left"
    text:
      - "Да... Какая жалость."
      - "Завершить строительство их машины — это далеко за пределами наших нынешних возможностей."
      - "Но даже так, это монументальное открытие для наших сил."
      - "Хм. Кажется, с Первой Вечной Звездой что-то происходит. Ты запустил техническое обслуживание?"
  - char: "commander"
    side: "right"
    text:
      - "Ага. Хотя она и в лучшем состоянии из всех, запущенная мной самодиагностика выявила целую кучу проблем."
      - "К счастью, ничего серьёзного. Техническое обслуживание должно скоро завершиться."
  - char: "fritz_rumey_rad"
    side: "left"
    text:
      - "......"
  - text:
      - "Румей прикусывает язык, по-видимому, сдерживая какие-то эмоции."
  - char: "fritz_rumey_rad"
    side: "left"
    text:
      - "Остальное я оставляю на тебя, Командир."
  - char: "commander"
    side: "right"
    text:
      - "Спасибо. Я сделаю всё, что в моих силах."
      - "(Операция начнётся через три дня. А до тех пор я должен привести остальные Вечные Звёзды в максимально  работоспособное состояние.)"
