chapter1:
  rows:
  - text:
      - "К тому времени, когда я прибыл на базу, было уже поздно, поэтому меня сразу же проводили в гостевую комнату."
      - "Наступил следующий день и я собираюсь встретиться с Фриц Румей за обедом. Но перед этим я получил звонок от Дуйсбург по коммуникатору."

chapter2:
  rows:
  - char: "duisburg_rad"
    side: "right"
    text:
      - "Доброе утро, Командир. Это Дуйсбург."
      - "Мы сделали несколько открытий, о которых, я думаю, тебе стоит знать. Наши инженеры нашли весьма ценные детали среди того, что мы собрали вчера."
      - "Они позволят нам наконец-то достичь нашей цели и починить очистители от радиации."
      - "Им также удалось расшифровать чертежи по улучшению этого устройства из массива данных научного судна."
      - "Я слышала, что они нам очень пригодятся."
      - "У Румей всегда были планы по возвращению близлежащих островных баз, если нам удастся починить очистители."
      - "Благодаря всем этим находкам мы сможем немедленно привести наш великий план в действие."
      - "О плане будет публично объявлено сегодня в полдень. Мы были бы рады, если бы ты пришел послушать."
      - "Как только объявление закончится, я отведу тебя в кабинет Румей. Там вы сможете посекретничать."

chapter3:
  rows:
  - text:
      - "Девушки-кансен собираются на площади базы и поднимают свои знамена."
      - "На возвышении величественно появляется женщина, облаченная в военно-морскую форму Железной Крови."

chapter4:
  rows:
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Мои соратники!"
      - "Полагаю, вы все слышали, что появился Восходящий прилив V класса."
      - "Вчера наш разведывательный отряд вернулся оттуда с добычей."
      - "С найденным ими оборудованием мы наконец-то сможем вернуть в рабочее состояние наши три очистителя от радиации!"
      - "Наконец-то мы сможем вернуть утраченные  базы!"
  - char: "all"
    side: "right"
    text:
      - "ДА-А-А!"
  - text:
      - "Молчаливая толпа взрывается радостными криками, словно давно дремавший вулкан."
      - "Однако Румей поднимает руку, чтобы унять их ликование."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Еще не время праздновать."
      - "Восстановленное нами ядро данных содержит чертежи модернизации очистителей от радиации, а также схемы для их массового производства."
      - "Это означает, что мы сможем вернуть не только наши острова, но и запретные зоны на материке!"
  - char: "all"
    side: "right"
    text:
      - "ДА-А-А!"
  - text:
      - "Толпа ликует еще громче, чем в прошлый раз."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Поэтому через три дня я начну нашу первую операцию по возвращению утраченных территорий!"
      - "Первой будет возвращена зона IB-AX-104, Зильберштерн — Серебряная Звезда."
      - "Наша цель — захватить остров, восстановить работоспособность базы и наладить логистическую линию между ней и нашим штабом."
      - "Мы должны вернуть этот остров, чтобы обеспечить себя жизненно важными материалами, необходимыми для модернизации очистителей от радиации."
      - "Кроме того, он послужит плацдармом для будущих операций по освобождению..."
  - text:
      - "Объявление Румей продолжается."
      - "Ее отчет о спасательной миссии сначала переходит в стадию анонсов операций, а затем в конкретные приказы для её войск."
      - "Поначалу эти сыплющиеся как из пулемета заявления сбили меня с толку, но если подумать, в этом есть смысл."
  - char: "commander"
    side: "left"
    text:
      - "(Это И ЕСТЬ их передовая оперативная база, так что, полагаю, все присутствующие здесь так или иначе в это вовлечены.)"

chapter5:
  rows:
  - text:
      - "Как только объявления заканчиваются, Дуйсбург сопровождает меня в кабинет Румей."
      - "Лидер  только что закончила свою речь, и теперь я поговорю с ней лицом к лицу."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Ты, должно быть, чужеземец — или мне лучше сказать «Командир»?"
      - "Мне рассказывали о тебе. Вернулась ли к тебе память после ночного сна?"
  - text:
      - "Я качаю головой в ответ. Ничуть не изменившись в лице, она переходит прямо к делу."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Перейду сразу к сути. Не хочешь присоединиться к нам?"
      - "Как ты уже мог заметить, бродя по базе, нам на счету каждая пара рук."
      - "Ты оказал бы нам необычайно большую помощь, особенно учитывая твои связи с другими чужеземцами — Сиренами."
      - "К сожалению, я не могу обещать много материальных ресурсов в обмен на знания и информацию, которыми ты обладаешь..."
      - "Однако, если ты будешь работать с нами, обещаю, что к тебе будут относиться как к союзнику Сопротивления."
      - "Нет, даже больше — я слышала, что ты превосходный лидер."
      - "Я также окажу тебе высочайшую степень доверия и предоставлю простор, чтобы ты мог в полной мере проявить свою тактическую изобретательность."
      - "Естественно, если ты пожелаешь присоединиться к другой фракции человечества, я не стану тебя останавливать."
      - "И всё же, как лично, так и официально, я искренне надеюсь, что ты решишь остаться с нами."
      - "Пожалуйста, Командир."
  - char: "commander"
    side: "right"
    text:
      - "(Откровенная, но лаконичная просьба. Трудно сказать «нет», когда она так искренне просит...)"
      - "(Ты и правда умеешь убеждать, Румей.)"
