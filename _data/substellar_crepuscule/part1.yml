chapter1:
  rows:
  - text:
      - "Под светом звёзд небольшой флот из трёх девушек-кансен осторожно продвигался вперёд."
  - char: "duisburg"
    side: "left"
    text:
      - "Восходящему прилив близко. Будьте начеку."
  - char: "z52"
    side: "right"
    text:
      - "Блин, я уже вижу обломки!"
      - "Этот Восходящий прилив — V класса... Никогда не видела ничего подобного!"
  - char: "z9"
    side: "left"
    text:
      - "Это и правда потрясающе, но разве это не первый Восходящий прилив в этом году?"
      - "Кто знает, может, и последний. Надеюсь, мы добудем что-нибудь ценное..."
  - char: "duisburg"
    side: "right"
    text:
      - "Именно на это и рассчитывает Румей."
      - "В следующем году всё станет ещё хуже, если мы не найдём ничего стоящего."
      - "Но не волнуйтесь. Прилив V класса приносит куда больше ценного утиля, чем что-либо другое."
      - "Давайте не думать об опасности, а лучше предвкушать сюрпризы, которые мы найдем."

chapter2:
  rows:
  - char: "duisburg"
    side: "right"
    text:
      - "Хм. Похоже, здесь был бой. И совсем недавно."
      - "Она добралась сюда раньше нас?"
  - char: "z9"
    side: "left"
    text:
      - "Тогда неудивительно, почему не появилось ни одного экстрамерного существа."
      - "Эхх... Она, наверное, забрала кучу ценного снаряжения и компонентов..."
  - char: "z52"
    side: "right"
    text:
      - "Охота в Восходящих приливах — её единственный путь, учитывая, что она сражается одна, без какой-либо поддержки или снабжения."
  - char: "duisburg"
    side: "left"
    text:
      - "Не теряйте надежды. Независимо от того, что она могла забрать, а что нет, прилив V класса обязательно принесёт достаточно, чтобы хватило нам всем."
  - char: "z9"
    side: "right"
    text:
      - "Хнык... Ты права. Извини, мне не стоит болтать всё, что приходит в голову..."
      - "Мы недостаточно сильны, чтобы помешать ей делать то, что она хочет... Не то чтобы мы вообще этого хотели."
  - char: "duisburg"
    side: "left"
    text:
      - "Именно, так что нам следует молиться, чтобы она нашла то, что искала, если ей вообще что-то было нужно."
      - "...Хм? Там среди обломков человек?"
  - char: "z52"
    side: "right"
    text:
      - "Что? Живой человек внутри Восходящего прилива?!"
      - "О боже, ты права!"
      - "Никаких признаков движения... Этот человек вообще жив?"
  - char: "z9"
    side: "left"
    text:
      - "А-а, э-м-м... п-пожалуйста, будь жив?.."
  - char: "z52"
    side: "right"
    text:
      - "Смотрите! Он пошевелился! Он жив!"
  - char: "duisburg"
    side: "left"
    text:
      - "Похоже, это и есть сюрприз Восходящего прилива для нас. Идёмте поможем!"

chapter3:
  rows:
  - char: "duisburg"
    side: "left"
    text:
      - "Хм."
  - char: "z9"
    side: "right"
    text:
      - "Эм..."
  - char: "z52"
    side: "left"
    text:
      - "Эй! Ты!"
  - char: "commander"
    side: "right"
    text:
      - "......"
      - "Эм, привет."
  - char: "z52"
    side: "left"
    text:
      - "Вау! Ты умеешь говорить?!"
      - "Ещё и на понятном нам языке! Потрясающе!"
  - char: "commander"
    side: "right"
    text:
      - "?.."
  - char: "duisburg"
    side: "left"
    text:
      - "Кхм. Простите, что пропускаю знакомство, но я должна задать несколько вопросов."
      - "Откуда ты взялся? И что делаешь внутри Восходящего прилива?"
  - char: "commander"
    side: "right"
    text:
      - "На самом деле, я и сам не уверен. Я просто вроде как очнулся здесь."
      - "Не уверен, имеет ли это для вас смысл, но... всё как в тумане."
  - char: "duisburg"
    side: "left"
    text:
      - "Хм... Похоже на потерю памяти."
  - char: "commander"
    side: "right"
    text:
      - "Кое-что я всё же помню... Просто для проверки, вы когда-нибудь слышали о «тестовом полигоне альфа»?"
  - char: "duisburg"
    side: "left"
    text:
      - "Тестовый полигон... альфа? Девочки, вам это о чём-нибудь говорит?"
  - char: "z52"
    side: "right"
    text:
      - "Не-а."
  - char: "z9"
    side: "left"
    text:
      - "Прости, мне тоже."
  - char: "duisburg"
    side: "right"
    text:
      - "Что ж, незнакомец, ты появился в Восходящем приливе, а теперь задаёшь странные вопросы..."
      - "Ты гость извне?"
  - char: "commander"
    side: "left"
    text:
      - "«Извне»? В смысле?"
  - char: "duisburg"
    side: "right"
    text:
      - "Существо из другого мира."
  - char: "commander"
    side: "left"
    text:
      - "Что-что?"
      - "(Из другого мира? Она что, издевается надо мной?)"
  - char: "duisburg"
    side: "right"
    text:
      - "Некоторые называют таких, как ты, «чужеземцами», хотя этот термин не совсем точен. В любом случае, с древних времён у нас было множество гостей из других миров."
      - "Они были дружелюбны и внесли огромный вклад в развитие нашей планеты."
      - "Но вот увидеть одного из вас во плоти — это большая удача."
  - char: "commander"
    side: "left"
    text:
      - "(Они привыкли сталкиваться с пришельцами... В какую безумную ветвь меня занесло.)"
  - char: "duisburg"
    side: "right"
    text:
      - "А, тебе трудно всё это осознать, не так ли?"
  - char: "commander"
    side: "left"
    text:
      - "А тебе нет? Ты разговариваешь с кем-то из другого мира, по твоим же собственным словам."
  - char: "duisburg"
    side: "right"
    text:
      - "Ну, мы слышали только легенды. Единственные существа извне, которых мы видели до сих пор — это экстрамерные монстры."
  - char: "commander"
    side: "left"
    text:
      - "Экстрамерные монстры?"
  - char: "duisburg"
    side: "right"
    text:
      - "Ох, эм, давай оставим эту тему на потом."
  - text:
      - "Она уклоняется от моего вопроса практически без всякой тонкости."
  - char: "duisburg"
    side: "right"
    text:
      - "Я — Дуйсбург. Этот комок энергии — Z52, а эта скромница — Z9."
      - "Мы из Сил Сопротивления Герцогства Железная Кровь."
  - text:
      - "Она дарит мне нежную улыбку."
  - char: "commander"
    side: "left"
    text:
      - "(Так значит, они из Железной Крови, да... Насколько я помню, она не была герцогством.)"
      - "Меня зовут Командир. Я из ветви, известной как тестовый полигон альфа."
      - "Если бы я помнил, на кого или на что я работаю, я бы сказал."
      - "Но я совершенно уверен... что служу на флоте и командую эскадрой."
  - char: "z52"
    side: "right"
    text:
      - "Подожди, то есть ты типа... Командир флота?"
      - "О да! Румей будет в восторге, когда услышит об этом!"
      - "Командир, не хочешь пойти с нами?"
  - char: "commander"
    side: "left"
    text:
      - "Стоит ли? Последний человек, с которым я общался, велел мне сидеть и ждать спасения."
  - char: "z9"
    side: "right"
    text:
      - "Кто-то знал, что мы придем?"
  - char: "commander"
    side: "left"
    text:
      - "Да. Я встретил Адмирал Хиппер до того, как появились вы, девочки."
      - "Она сказала, цитирую: «Сиди смирно и жди, пока прибудет подмога»."
  - char: "duisburg"
    side: "right"
    text:
      - "Хиппер? Адмирал Хиппер? У тебя получилось нормально с ней поговорить?"
  - char: "z52"
    side: "left"
    text:
      - "Обалдеть... Чужеземец — ну, или Командир, полагаю — ты невероятен!"
  - char: "commander"
    side: "right"
    text:
      - "Что-что? Разве она не с вами?"
  - char: "duisburg"
    side: "left"
    text:
      - "Она... Я думаю, она не совсем считает нас союзниками."
      - "Скорее, прохожими."
  - text:
      - "И хотя она говорит спокойным тоном, её глаза выдают целый спектр смешанных чувств."
  - char: "commander"
    side: "left"
    text:
      - "(Движение сопротивления, странная МЕТА, да ещё и существа из другого измерения... Всё становится запутаннее и запутаннее.)"
  - char: "duisburg"
    side: "right"
    text:
      - "Z52, не возражаешь, если мы развернём твой серийный корабль? Я заберу Командира на базу."
  - char: "z52"
    side: "left"
    text:
      - "Можно, но так мы сами нарисуем мишень у себя на спинах."
  - char: "duisburg"
    side: "right"
    text:
      - "Ладно, тогда почему бы тебе не понести Командира на спине?"
  - char: "z52"
    side: "left"
    text:
      - "Звучит весело! Я согласна."
  - char: "duisburg"
    side: "right"
    text:
      - "Пожалуйста, не делай глупостей только потому, что это «звучит весело»."
  - char: "z9"
    side: "left"
    text:
      - "Точно... А вдруг ты уронишь Командира?"
  - char: "z52"
    side: "right"
    text:
      - "Хороший аргумент... Но мы вообще уже уходим? Мы же ещё ничего не собрали."
  - char: "duisburg"
    side: "left"
    text:
      - "Нет, очевидно, что не уходим."
      - "К тому же, я только что переговорила со штабом. Они выдали задание принести хотя бы немного мощного снаряжения."
  - char: "z52"
    side: "right"
    text:
      - "Тогда нужно выжать максимум из этого Восходящего прилива! Мы должны принести кучу сокровищ!"
  - char: "commander"
    side: "left"
    text:
      - "Что ты сказала насчет задания?"
  - char: "duisburg"
    side: "right"
    text:
      - "Разведать Восходящий прилив, найти безопасные маршруты и, полагаю, подготовить почву для крупномасштабной операции по сбору утиля для нашей команды логистики."
      - "Добыча ценного лома не входила в наши первоначальные планы, но если уж мы собираемся развернуть серийный корабль, мы не можем вернуться с пустыми руками."
      - "Как только что сказала Z52, мы обязаны вернуться с кучей сокровищ."
      - "Другими словами, теперь наша задача — найти самое ценное оборудование для нашей базы и собрать его."
      - "Я знаю, ты хочешь уйти прямо сейчас, но не волнуйся, мы скоро отсюда выберемся."
  - char: "commander"
    side: "left"
    text:
      - "Обо мне не беспокойтесь. Сосредоточьтесь на поиске ваших сокровищ."
      - "(Обломки считаются здесь сокровищами... Интересно.)"
