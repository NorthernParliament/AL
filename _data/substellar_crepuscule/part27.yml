chapter1:
  rows:
  - text:
      - "Воды Зеркального моря начинают меняться."
      - "Его обычно невидимая граница искажается, проявляя нечто похожее на барьер."
  - char: "duisburg"
    side: "left"
    text:
      - "Я и понятия не имела, что у Зеркального моря есть такая скрытая функция... Ещё одно чудо, сотворённое Командиром."
  - char: "z52"
    side: "right"
    text:
      - "Пока всё идёт на удивление хорошо!"
      - "Предсказания Командира насчёт численности и расположения врагов оказались точными вплоть до мелочей."
      - "Как будто ты можешь видеть будущее! Честно говоря, это немного жутко..."
  - char: "z11"
    side: "left"
    text:
      - "Я просто рада, что Командир на нашей стороне."
  - char: "z9"
    side: "right"
    text:
      - "Всё идёт точно так, как ты сказал... Тогда это должно означать..."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Звёздный Зверь появится. Приготовьтесь."

chapter2:
  rows:
  - text:
      - "Наше контрнаступление проходило гладко. Вражеские метки на мониторе исчезали одна за другой, и казалось, что до победы остался всего один залп."
      - "Но именно в этот момент произошло нечто шокирующее."

chapter3:
  rows:
  - text:
      - "Звезда над головой внезапно засияла ослепительно ярко, её многократно усиленное сияние в мгновение ока осветило половину ночного неба."
      - "Белые небеса озаряются бесчисленными синими огнями, которые то вспыхивают, то гаснут. Словно кто-то инвертировал цвета ночи."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Класс Лорд... Он всё-таки появился."
  - char: "z9"
    side: "right"
    text:
      - "М-мы будем в порядке?"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Посмотрим. Сражаться — наш единственный выбор."
  - text:
      - "Странные звуки накатывают волнами, казалось бы, сотрясая весь мир до глубины наших душ."
      - "Но эта сила блокируется Стеной Мидгарда, лишь вызывая небольшую рябь на барьере."
      - "Появляются бесчисленные щупальца, тянущиеся в небо, словно пытаясь сшить его с морем воедино."
      - "Шквал снарядов Вечной Звезды разносит их вдребезги. Осколки падают обратно в море, словно град."
  - char: "commander"
    side: "left"
    text:
      - "(Пока всё идёт хорошо. Но настоящая битва начинается только сейчас.)"
      - "Хиппер, ты готова?"
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я ждала этого очень долго! Позвольте мне заняться им!"
  - char: "commander"
    side: "left"
    text:
      - "Всем, сосредоточить огонь на классе Лорд!"

chapter4:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Следуйте за мной! Мы синхронизируем наши удары!"
      - "Прикройте Хиппер и обеспечьте ей путь к победе!"

chapter5:
  rows:
  - text:
      - "БАБАХ!!!"
  - text:
      - "Огонь орудий растворился, словно светлячки в чёрном, звёздном небе."
  - char: "star_beast"
    side: "right"
    status: "is-red"
    text:
      - "PUZVSLUA PUZLJAZ (НАГЛЫЕ НАСЕКОМЫЕ)"
      - "FVB HYL IBA MPYLMSPLZ (ВЫ ВСЕГО ЛИШЬ СВЕТЛЯЧКИ)"
      - "FVBY SPNOA PZ UVAOPUN JVTWHYLK AV AOL YHKPHUJL VM AOL ZAHYZ (ВАШ СВЕТ — НИЧТО ПО СРАВНЕНИЮ С СИЯНИЕМ ЗВЁЗД)"
      - "P HT AOL ZAHY ILHZA (Я — ЗВЁЗДНЫЙ ЗВЕРЬ)"
      - "NBPKPUN AOL ZAHYZ KV P HWWLHY (Я ЯВЛЯЮСЬ, НАПРАВЛЯЯ ЗВЁЗДЫ)"
      - "ILHYPUN AOL ZAHYZ KV P SLHCL (Я УХОЖУ, УНОСЯ ЗВЁЗДЫ )"
      - "IVD KVDU ILMVYL TL (СКЛОНИТЕСЬ ПЕРЕДО МНОЙ)"
      - "ZPUN OFTUZ AV TF UHTL (ПОЙТЕ ГИМНЫ ВО ИМЯ МОЁ)"
      - "OLLK TF JVTTHUKZ HUK VILF (ВНЕМЛИТЕ МОИМ ПРИКАЗАМ И ПОВИНУЙТЕСЬ)"
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хватит болтать! Ты умрёшь прямо сейчас!"
      - "Я одолею тебя... не только чтобы отомстить за своих сестёр, но и ради светлого будущего класса «Адмирал Хиппер»!"
  - char: "star_beast"
    side: "right"
    status: "is-red"
    text:
      - "PUZVSLUA PUZLJAZ (НАГЛЫЕ НАСЕКОМЫЕ)"
  - text:
      - "БЗЗЗЗТ!"
  - text:
      - "Когда она покидает безопасный барьер, Звёздный Зверь начинает атаку."

chapter6:
  rows:
  - text:
      - "Однако оглушительный шум стирается мягким светом."
  - char: "prinz_eugen"
    side: "left"
    status: "is-blue"
    text:
      - "Обижаете бедняжку Хиппер? Только не в мою смену."
  - char: "blucher"
    side: "right"
    status: "is-blue"
    text:
      - "Хе-хе☆ Хиппер! Давай накажем этого здоровяка вместе!"
  - text:
      - "На сцене появляются два человека, которых давно считали потерянными."
      - "Девушки на флангах Хиппер направляют свои орудия в ту же сторону."
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ойген, Блюхер... Разве вы двое не должны быть..."
      - "Не может быть. Это нереально..."
      - "Вы призраки? Галлюцинации? Или?.."
  - char: "blucher"
    side: "right"
    status: "is-blue"
    text:
      - "Боже~ Успокойся, сестрёнка!"
      - "Ты не ошибаешься, но это не значит, что ты права!"
      - "Ну, эм, может, ты всё-таки ошибаешься..."
      - "А-а-а, я не настолько хорошо это понимаю, чтобы объяснить!"
      - "Ойген, помоги мне!"
  - char: "prinz_eugen"
    side: "left"
    status: "is-blue"
    text:
      - "В общем, твои желания приняли форму нас."
      - "Ты желала создать новое будущее для класса «Адмирал Хиппер». Как мы могли позволить тебе сделать это в одиночку?"
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Это... действительно вы?"
  - char: "prinz_eugen"
    side: "left"
    status: "is-blue"
    text:
      - "Да, мы вернулись. Правда, ненадолго."
  - char: "blucher"
    side: "right"
    status: "is-blue"
    text:
      - "Хиппер... Спасибо за всё, что ты сделала вместо нас."
  - char: "star_beast"
    side: "left"
    status: "is-red"
    text:
      - "........."
      - "P HT AOL ZAHY ILHZA (Я — ЗВЁЗДНЫЙ ЗВЕРЬ)"
      - "NBPKPUN AOL ZAHYZ KV P HWWLHY (Я ЯВЛЯЮСЬ, НАПРАВЛЯЯ ЗВЁЗДЫ)"
      - "ILHYPUN AOL ZAHYZ KV P SLHCL (Я УХОЖУ, УНОСЯ ЗВЁЗДЫ )"
      - "AOL DVYSK OHZ ILLU ZBSSPLK (МИР БЫЛ ОСКВЕРНЁН)"
      - "IBYU PA KVDU P ZOHSS HUK PA DPSS IL YLIVYU (Я СОЖГУ ЕГО ДОТЛА, И ОН ПЕРЕРОДИТСЯ)"

chapter7:
  rows:
  - text:
      - "Ослепительный свет сгущается под звёздным небом."
  - char: "prinz_eugen"
    side: "left"
    status: "is-blue"
    text:
      - "Тч... Прерываешь наше трогательное воссоединение? Ты такой же тупой, как и они."
  - char: "blucher"
    side: "right"
    status: "is-blue"
    text:
      - "Эй, здоровяк! Я из тебя всю дурь выбью!"
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Подождите! Ойген, Блюхер! Возвращайтесь за барьер!"
      - "Вы двое не сможете справиться с этой тварью в одиночку!"
  - char: "prinz_eugen"
    side: "right"
    status: "is-blue"
    text:
      - "Не беспокойся о нас. У нас есть мы."
  - char: "blucher"
    side: "left"
    status: "is-blue"
    text:
      - "Да! Давай выиграем это вместе!"

chapter8:
  rows:
  - text:
      - "БАБАХ!!!"

chapter9:
  rows:
  - text:
      - "То, что раньше, как я видел, разрушило мир, было остановлено более мягкой силой, которая ослабляла его с каждой секундой."
      - "Тишина воцарилась на поле боя, поглотив всё вокруг."
      - "Казалось, в этот момент прошли целые эпохи."

chapter10:
  rows:
  - text:
      - "Когда свет исчез, исчез и Звёздный Зверь."
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мы... победили?"
  - char: "prinz_eugen_rad"
    side: "right"
    status: "is-blue"
    text:
      - "Это была идеальная победа."
  - char: "blucher_rad"
    side: "left"
    status: "is-blue"
    text:
      - "Хе-хе☆ Наша связь может одолеть всё что угодно!"
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Клянусь, мне, должно быть, это снится... Мы правда, правда победили?"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Блюхер? Ойген?! Вы каким-то образом вернулись к жизни?!"
  - char: "prinz_eugen_rad"
    side: "right"
    status: "is-blue"
    text:
      - "Давненько не виделись, Румей. Кто бы мог подумать, что ты станешь лидером Сопротивления?"
      - "Прости, но мы не воскресли. Считай нас лишь мимолётной иллюзией, рождённой из надежд и мечтаний."
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мимолётной иллюзией... Значит, вы меня покидаете?!"
  - char: "prinz_eugen_rad"
    side: "right"
    status: "is-blue"
    text:
      - "Будущее, о котором ты мечтала, теперь реальность. Наша работа здесь окончена."
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ох... Ну, знание того, что вы двое продолжаете жить в таком состоянии, всё равно приносит облегчение."
      - "Когда я смогу увидеть вас снова?"
  - char: "prinz_eugen_rad"
    side: "right"
    status: "is-blue"
    text:
      - "Заботься о себе и продолжай становиться сильнее, и, возможно, тогда..."
      - "Возможно, ты сможешь найти нас... Или даже поймёшь, что мы всё это время были с тобой."
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Для меня в этом мало смысла. Но хорошо... Я буду заботиться о себе. Я стану сильнее. И когда-нибудь я найду вас двоих!"
  - char: "blucher_rad"
    side: "right"
    status: "is-blue"
    text:
      - "Мы болеем за тебя, Хиппер!"
  - char: "prinz_eugen_rad"
    side: "left"
    status: "is-blue"
    text:
      - "Конечно. И следи за своим питанием, поняла?"
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Тебе не обязательно говорить мне это!"
  - text:
      - "Подул морской бриз, и Принц Ойген с Блюхер начали исчезать."
  - char: "prinz_eugen_rad"
    side: "left"
    status: "is-blue"
    text:
      - "Нам пора идти... Спасибо всем вам, что так хорошо заботились о нашей сестре. Берегите её для нас."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Не волнуйся об этом, Ойген. Мы выиграем эту войну."
  - char: "prinz_eugen_rad"
    side: "left"
    status: "is-blue"
    text:
      - "Я верю тебе."

chapter11:
  rows:
  - text:
      - "ШУРХ..."
  - text:
      - "Снова звук тасуемых карт. Но на этот раз он тише и медленнее, словно давая мне время подготовиться перед тем, как меня заберут."
      - "Пришло время прощаться."
  - char: "commander"
    side: "left"
    text:
      - "Девочки, сегодня мы одержали великую победу."
      - "Отныне Звёздный Зверь — это не меч, занесённый над миром, а символ победы и надежды."
      - "Мои поздравления, Фриц Румей. Твоё контрнаступление сделало огромный шаг вперёд."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Командир... Спасибо."
  - char: "duisburg"
    side: "left"
    text:
      - "И ты тоже уходишь, да?!"
  - char: "commander"
    side: "right"
    text:
      - "...Ухожу."
  - char: "duisburg"
    side: "left"
    text:
      - "Увидим ли мы тебя когда-нибудь снова?"
  - char: "commander"
    side: "right"
    text:
      - "Конечно. Я в этом уверен."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Ты навсегда останешься Командиром Сопротивления Железной Крови. Береги себя."

chapter12:
  rows:
  - char: "prinz_eugen"
    side: "left"
    status: "is-blue"
    text:
      - "Хе-хе... Командир."
      - "Давно не виделись... Или, может, мне лучше сказать: «Скоро увидимся»."
  - char: "commander"
    side: "right"
    text:
      - "(Что?!)"
