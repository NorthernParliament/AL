chapter1:
  rows:
  - text:
      - "Следящий магический круг показывал сцену, совершенно не похожую на то место, где они находились раньше."

chapter2:
  rows:
  - text:
      - "Это был оживленный порт, в который входили и из которого выходили грузовые суда."
  - char: "memphis"
    side: "left"
    text:
      - "Подождите... Это что, Нью-Йорк?"
      - "Нас только что перенесло на другой конец света?"
  - char: "akagi"
    side: "right"
    text:
      - "Нет. Это просто видение, которое показывает нам магический круг."
      - "Связи Командира с Союзом Орла глубоки. Это хорошее место, чтобы начать поиски."
      - "Ты что-нибудь чувствуешь?"
  - char: "memphis"
    side: "left"
    text:
      - "Нет, совсем ничего."
  - char: "akagi"
    side: "right"
    text:
      - "Это наша первая попытка, так что ничего удивительного. Давай попробуем в другом месте."

chapter3:
  rows:
  - text:
      - "Золотой свет хлынул сверху, расходясь во все стороны от Акаги."
      - "В мгновение ока сцена Нью-Йорка исчезла, словно лопнувший мыльный пузырь."
  - char: "memphis"
    side: "left"
    text:
      - "Куда всё подевалось?!"
  - char: "akagi"
    side: "right"
    text:
      - "Можешь не психовать по каждому пустяку?"
      - "Я просто исключила это место, так как наши поиски там завершены."
  - char: "memphis"
    side: "left"
    text:
      - "......"
      - "Ч-что ж, переходим к следующему!"

chapter4:
  rows:
  - text:
      - "Бурное море. Повсюду вокруг аномальная погода."
  - char: "memphis"
    side: "left"
    text:
      - "Это Бермудское море!"
  - char: "akagi"
    side: "right"
    text:
      - "Теперь что-нибудь чувствуешь?"
  - char: "memphis"
    side: "left"
    text:
      - "Не-а. Ничего."

chapter5:
  rows:
  - char: "akagi"
    side: "right"
    text:
      - "Дальше."

chapter6:
  rows:
  - text:
      - "Остров на закате. Свет прожекторов заполнял пейзаж."
  - char: "memphis"
    side: "left"
    text:
      - "Это наша база на Атолле Мидуэй... Разве это не похоже на шпионаж?"
      - "Если в будущем здесь будет развернуто какое-то военное присутствие, ты уже..."
  - char: "akagi"
    side: "right"
    text:
      - "Просто сосредоточься на поиске Командира, хорошо?"
  - char: "memphis"
    side: "left"
    text:
      - "Да, извини. По-прежнему ничего."

chapter7:
  rows:
  - char: "akagi"
    side: "right"
    text:
      - "Угх. Это займёт целую вечность..."
  - char: "memphis"
    side: "left"
    text:
      - "...Что ты делаешь?"
  - char: "akagi"
    side: "right"
    text:
      - "Как думаешь? Ускоряю процесс."
      - "Следующее место — весь Тихий океан."

chapter8:
  rows:
  - text:
      - "Воздух над Тихим океаном. Разбросанные острова простирались насколько хватало глаз."
  - char: "akagi"
    side: "right"
    text:
      - "Угх... <i>кхе-кхе!</i>"
  - char: "memphis"
    side: "left"
    text:
      - "Эй! Что случилось? Осторожнее!"
      - "Боже, ты бледна как смерть! Ты в порядке?"
  - char: "akagi"
    side: "right"
    text:
      - "<i>кхе-кхе!</i> Не обращай на меня внимания!"
  - char: "memphis"
    side: "left"
    text:
      - "Ты буквально кашляешь кровью! Остановись и отдохни!"
  - char: "akagi"
    side: "right"
    text:
      - "Об этом не может быть и речи! Я не собираюсь умирать, ясно?"
      - "Ну так что? Ты что-нибудь чувствуешь?"
  - char: "memphis"
    side: "left"
    text:
      - "Чувствую, но очень слабо!"
  - char: "akagi"
    side: "right"
    text:
      - "Где?! Выкладывай!"
  - char: "memphis"
    side: "left"
    text:
      - "Это не прямо здесь! Это дальше на север!"
  - char: "akagi"
    side: "right"
    text:
      - "На север? Уж не Арктику ли ты имеешь в виду?"
      - "Дальше!"

chapter9:
  rows:
  - text:
      - "Бесплодное, замерзшее море. Бушевал шторм, оставляя за собой морозный след."
  - char: "akagi"
    side: "right"
    text:
      - "<i>тяжело дышит...</i> А... теперь?"
  - char: "memphis"
    side: "left"
    text:
      - "Чувство становится сильнее! Там! Прямо вон там!"
  - char: "akagi"
    side: "right"
    text:
      - "Я уменьшу радиус! Дальше!"

chapter10:
  rows:
  - text:
      - "Царство глубокой синевы. Гигантские кубы безмолвно покоились в воде, словно кубики льда."
  - char: "memphis"
    side: "left"
    text:
      - "Где мы?"
  - char: "akagi"
    side: "right"
    text:
      - "Я не меняла местоположение, я просто сузила радиус... Мы, вероятно, под водой."
      - "Что это? Подводное Зеркальное море?"

chapter11:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "Ох, чувство стало еще сильнее!"
  - char: "akagi"
    side: "right"
    text:
      - "Должно быть, это то самое место. Дальше!"

chapter12:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "А... Цвета изменились?"
      - "И что это вообще за свет?"
  - char: "akagi"
    side: "right"
    text:
      - "Какая-то сила борется с магическим кругом..."
      - "Ха... Посмотрим, что там под тобой!"

chapter13:
  rows:
  - char: "akagi"
    side: "right"
    text:
      - "Откройся... сейчас же!"

chapter14:
  rows:
  - char: "akagi"
    side: "right"
    text:
      - "Я СКАЗАЛА, ОТКРОЙСЯ!"

chapter15:
  rows:
  - char: "akagi"
    side: "right"
    text:
      - "Откройся, откройся, откройся! ОТКРОЙСЯ!"

chapter16:
  rows:
  - text:
      - "Залитое звездным светом поле боя. Непрекращающееся пламя пылало в неистовой ярости."
  - char: "memphis"
    side: "left"
    text:
      - "Теперь чувство еще сильнее! Командир очень близко!"
  - char: "akagi"
    side: "right"
    text:
      - "Да! Командир!"

chapter17:
  rows:
  - text:
      - "Классная комната. Теплый солнечный свет падал на парты и стулья."
  - char: "memphis"
    side: "left"
    text:
      - "Какого...?"
  - char: "akagi"
    side: "right"
    text:
      - "...Класс?"
