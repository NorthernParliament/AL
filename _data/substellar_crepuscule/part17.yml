chapter1:
  rows:
  - text:
      - "Флот продвигался вперёд, сохраняя бдительность, и вскоре вернулся в штаб."
      - "Дуйсбург несколько раз пыталась связаться с Хиппер, но в итоге та так и не появилась, чтобы помочь нам в обороне."
  - char: "z52"
    side: "left"
    text:
      - "Уф... Наконец-то вернулись!"
      - "Блин, эти Вечные Звёзды работают куда лучше, чем я думала! Экстрамерные существа застряли на внешнем периметре!"
  - char: "duisburg"
    side: "right"
    text:
      - "Ага. Это наш лучший шанс ударить по ним с двух сторон."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Z11, мы достигли базы. Доложи о расположении сил противника."
  - char: "z11_rad"
    side: "right"
    text:
      - "Эм, что? В-вы только сейчас прибыли?"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "...К чему этот вопрос?"
  - char: "z11_rad"
    side: "right"
    text:
      - "Потому что, эм, какие-то силы за пределами нашей линии обороны атаковали врага около часа назад."
      - "Они показались довольно мощными, поэтому я просто предположила, что это вы, и вы не смогли связаться с нами по рации или типа того..."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Другие силы? В каком направлении? Я должна увидеть это сама!"

chapter2:
  rows:
  - text:
      - "Разведывательные самолёты Румей быстро вернулись с ответами."
      - "Экстрамерных существ перехватил всего один человек — юная леди с плоской фигурой."

chapter3:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "admiral_hipper_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Раз уж вы так жаждете смерти, я исполню ваше желание!"
      - "Во имя класса«Адмирал Хиппер», я сыграю песню, чтобы успокоить ваши души!"
  - text:
      - "БАБАХ!!!"

chapter4:
  rows:
  - char: "z52"
    side: "left"
    text:
      - "Хиппер здесь?!"
      - "Это объясняет, почему она не отвечала на наши вызовы!"
  - char: "duisburg"
    side: "right"
    text:
      - "Хе-хе. Она просто слишком добра, чтобы отвернуться от нас."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Давненько я её не видела. Она стала ещё сильнее."
      - "Однако её боевой стиль остался прежним."
  - char: "duisburg"
    side: "right"
    text:
      - "Нам стоит объединиться с ней?"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Что скажешь, Командир?"
  - char: "commander"
    side: "right"
    text:
      - "Если мы так и сделаем, как думаешь, каковы шансы, что она поможет нам с нашей миссией?"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Я не уверена. Учитывая обстоятельства, шансы кажутся очень призрачными."
  - char: "commander"
    side: "right"
    text:
      - "Тогда не будем на неё давить. Пусть действует по-своему и выбивает врага из равновесия."
  - char: "z9_rad"
    side: "left"
    text:
      - "Румей, Командир, вот п-позиции врага."
  - char: "commander"
    side: "right"
    text:
      - "(Их меньше, чем я ожидал. Хиппер, должно быть, и правда сильно сократила их численность.)"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Сначала давайте разберёмся с группой на 60 градусов к востоку, затем встретимся с Хиппер и уничтожим тех, кто на 95 градусов оттуда. И, наконец, методично зачистим остальных. Как вам такой план?"
  - char: "commander"
    side: "right"
    text:
      - "Звучит отлично. Я свяжусь со штабом и запрошу огневую поддержку. Всем приготовиться к бою!"
