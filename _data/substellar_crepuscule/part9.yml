chapter1:
  rows:
  - text:
      - "По мере того как ослепительная белизна угасает, моё сознание погружается во тьму."

chapter2:
  rows:
  - text:
      - "Когда я снова открываю глаза, меня встречает потолок комнаты отдыха, возвращая мне осознание течения времени."
      - "Коммуникатор у моей кровати мигает. Я нажимаю кнопку включения и слышу голосовое сообщение от Дуйсбург."
  - char: "duisburg_rad"
    side: "right"
    text:
      - "Мы сделали несколько открытий, о которых, я думаю, тебе стоит знать. Наши инженеры нашли весьма ценные детали среди того, что мы собрали вчера."
      - "Они позволят нам наконец-то достичь нашей цели и починить очистители от радиации."
      - "Им также удалось..."
  - text:
      - "Она с энтузиазмом рассказывала мне о плодах их спасательной операции. Всё было в точности как и до наступления третьего дня."
  - char: "commander"
    side: "left"
    text:
      - "6 утра... Я вернулся, прямо как и говорила Мадам М."
      - "Я должен воспользоваться этим вторым шансом."
      - "(Осталось шесть часов до выступления Румей. Ничего не изменится, если она объявит о своей операции и распределит задания точно так же, как и раньше.)"
      - "(Это значит, что у меня есть всего шесть часов, чтобы изменить планы Румей.)"
      - "(Нужно многое сделать, да ещё и в сжатые сроки... Первым делом — разработать новую стратегию.)"

chapter3:
  rows:
  - text:
      - "Поскольку у меня уже было много идей, мне удалось закончить план битвы примерно за три часа."
      - "Затем я позвонил Дуйсбург и попросил её перенести мою встречу с Румей на более раннее время."
      - "Хотя она, естественно, была ошеломлена моим внезапным предложением, она всё же передала мои слова Румей."

chapter4:
  rows:
  - char: "fritz_rumey"
    side: "left"
    text:
      - "...Изменение в моём плане операции?"
  - text:
      - "Поскольку я уже знал ход её мыслей, я быстро покончил со вступлением и сразу же представил свой пересмотренный план."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Хм. Это интересное направление."
  - text:
      - "Мои изменения касались трёх аспектов: концентрации наших сил, дополнительной разведки местности и выделения отрядов для сбора образцов."
      - "Это повысит вероятность выполнения наших главных задач ценой потенциальных второстепенных выгод в ходе операции."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Ты придумал всё это только потому, что тебе позвонила Дуйсбург?"
      - "До своей амнезии ты, должно быть, был поистине уникальным Командиром."
  - text:
      - "Само собой разумеется, она не подозревает об истинных причинах, стоящих за этим новым планом."
      - "Я решаю ничего не отвечать на её комплимент, чтобы не усложнять ситуацию ещё больше."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Тем не менее, твой план, судя по всему, воспринимает наличие вражеской засады как нечто само собой разумеющееся."
      - "С чего бы это?"
  - char: "commander"
    side: "right"
    text:
      - "Бережёного бог бережёт. Начальная фаза контрнаступления особенно важна."
  - text:
      - "Её пристальный взгляд изучает меня, но я спокойно отвечаю заранее заготовленной фразой."
  - char: "commander"
    side: "right"
    text:
      - "(Она сочла бы меня сумасшедшим, скажи я ей, что уже видел, что произойдёт.)"
      - "(Моя амнезия — уже достаточный повод для подозрений. Последнее, чего я хочу, это объявлять себя пророком.)"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Понятно..."
  - text:
      - "К счастью, мой статус Командира из другого таймлайна придаёт мне достаточно авторитета, чтобы Румей приняла моё предложение."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Твой план крайне ценен. Я включу твои изменения в свой."
      - "Более того, я хочу, чтобы ты взял на себя командование моими основными силами во время операции через три дня. Ты примешь на себя эту ответственность?"
  - char: "commander"
    side: "right"
    text:
      - "С удовольствием."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Отлично. Я весьма признательна за то, что ты решил остаться с Сопротивлением."
      - "Поговорим позже. Прямо сейчас я должна сосредоточиться на своём выступлении."
  - char: "commander"
    side: "right"
    text:
      - "Принято. Кстати, есть ещё кое-что, что я хотел бы обсудить..."
  - text:
      - "Несмотря на лёгкую нерешительность, я рассказываю ей о своей идее исследовать Вечные Звёзды и собрать разведданные как о наших врагах, так и о Сиренах."
      - "К моему удивлению, она охотно её одобряет."
  - char: "commander"
    side: "right"
    text:
      - "(Хотя мои воспоминания и туманны, я уверен, что неразрывно связан с системами Антиоха.)"
      - "(Если я смогу полностью разобраться в оружии, которое они оставили после себя, оно станет мощной страховкой в грядущих битвах.)"
      - "(Информация, которую мы получим от исследования Вечных Звёзд за эти три дня, станет ключевой.)"
