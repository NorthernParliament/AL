chapter1:
  rows:
  - text:
      - "На борту серийного корабля Z52 три девушки-кансен вошли в Восходящий прилив и начали сбор материалов."
      - "К тому времени, когда небо на востоке посветлело, они отправились домой с трюмами, доверху забитыми добытым утилем."

chapter2:
  rows:
  - char: "z9"
    side: "left"
    text:
      - "Уф... Нам и правда удалось собрать очень много."
  - char: "z52"
    side: "right"
    text:
      - "Блин, это просто ОГРОМНЫЙ улов! Румей будет прыгать от радости!"
  - char: "duisburg"
    side: "left"
    text:
      - "Да, и даже среди того, что мы пока не смогли забрать, была куча хороших вещей."
      - "Я отметила это на карте, чтобы другие могли прийти и закончить работу."
  - text:
      - "После тяжелой ночи работы все девочки собрались в комнате отдыха на корабле."
      - "Дуйсбург достает около семи бутылочек и что-то похожее на хлеб, и ставит их на стол."
  - char: "z52"
    side: "left"
    text:
      - "Вау, как много еды! Мы сегодня прямо шикуем, да?"
  - char: "duisburg"
    side: "right"
    text:
      - "Конечно. Оглушительный успех миссии заслуживает того, чтобы его отпраздновали."
  - char: "z9"
    side: "left"
    text:
      - "У-ура!"
  - char: "commander"
    side: "right"
    text:
      - "(И это «много» еды?)"
      - "(В этих бутылках еда, что ли?)"
      - "(Может, у меня и амнезия, но это совсем не похоже на пир в моём понимании...)"
  - char: "duisburg"
    side: "left"
    text:
      - "Не нужно стесняться, Командир. Присоединяйся к нам."
  - text:
      - "Дуйсбург берет кусок хлеба в одну руку, а бутылку — в другую. Она сжимает бутылку, выдавливая пастообразное содержимое на хлеб."
  - char: "duisburg"
    side: "left"
    text:
      - "Это швайнсхаксе. Не хочешь попробовать?"
  - char: "commander"
    side: "right"
    text:
      - "Это... Вы это так называете?"
  - text:
      - "Хотя это слово мне и знакомо, я всё ещё ошеломлён."
  - char: "commander"
    side: "right"
    text:
      - "(Можно сказать, что это пахнет как швайнсхаксе, а бутылка служит заменой консервной банке...)"
      - "(Но сама эта паста? Можно ли это действительно назвать «едой»?)"
  - char: "z52"
    side: "left"
    text:
      - "Что такое? Ты так смотришь, будто никогда раньше не видел тюбиков с едой."
  - char: "duisburg"
    side: "right"
    text:
      - "Хи-хи. Я знаю, о чём ты думаешь — извини, но настоящей еды ты здесь нигде не найдешь."
      - "Будь уверен, это И ЕСТЬ швайнсхаксе, даже если оно не выглядит и не жуётся так же."
  - text:
      - "Дуйсбург кладет свою бутылку — или что бы это ни было — и откусывает кусок хлеба с приправой."
  - char: "duisburg"
    side: "right"
    text:
      - "М-м-м, вкуснотища! Это так здорово!"
  - text:
      - "Не обращая внимания на моё недоверие, она намазывает пасту со вкусом швайнсхаксе на другой кусок хлеба и протягивает мне."
  - char: "commander"
    side: "left"
    text:
      - "Что ж... Не попробуешь — не узнаешь, верно?"
  - text:
      - "Я беру хлеб и откусываю кусочек."
      - "Сначала на вкус это просто хлеб с непонятной намазкой, но постепенно он приобретает вкус и текстуру мяса."
  - char: "duisburg"
    side: "right"
    text:
      - "Что я говорила? Довольно вкусно, да?"
      - "Это синтетическая еда массового производства, но на вкус она и правда потрясающая."
      - "Да и хлеб тоже не совсем обычный."
      - "Он меняет вкус в зависимости от того, какую пасту на него намазать."
      - "О, и ещё... Я бы не советовала использовать больше одного вкуса за раз."
  - text:
      - "С улыбкой она по очереди открывает несколько этих бутылочек-тюбиков. Каким-то образом действительно начинает пахнуть так, будто на столе роскошный пир."
  - char: "duisburg"
    side: "right"
    text:
      - "У тебя наверняка полно вопросов, да? Давай выслушаем их, пока мы едим."
  - char: "commander"
    side: "left"
    text:
      - "......"

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Расскажи мне о Сопротивлении."
  - char: "duisburg"
    side: "right"
    text:
      - "Для этого мне нужно рассказать немного предыстории."
      - "Сопротивление Железной Крови сражается с врагом, которого мы называем экстрамерными существами."
      - "Около 150 лет назад на нашу планету упал метеорит."
      - "Сначала этого почти никто не заметил, но потом из моря появились враждебные белые существа."
      - "Они напали так внезапно, что в одночасье уничтожили все крупные фракции в мире."
      - "С тех пор выжившие делают всё возможное, чтобы дать отпор."
      - "Герцогство, которому мы служим, в их числе, но это лишь одна из сил человечества."
      - "Помимо Сопротивления, есть много людей, которые также ведут праведную борьбу. И, конечно же, всё ещё существуют правительственные органы."
      - "Некоторые из них рассредоточены глубоко на материке, в то время как другие прячутся на островах, как мы."
  - char: "commander"
    side: "left"
    text:
      - "На островах? Разве не проще защищаться от врагов с моря оставаясь на суше?"
  - char: "duisburg"
    side: "right"
    text:
      - "Ты прав. Но мы, девушки-кансен, превосходно сражаемся в море, так что вот так."
      - "К тому же, наши аванпосты — это не просто обычные острова, это бывшие военно-морские базы."
      - "У нас также есть гигантские орудия, которые больше невозможно произвести, и установки, обеспечивающие как маскировку, так и оборону. Что-то вроде Зеркальных морей."
      - "Наверное, всё это трудно представить. Ты поймёшь, когда мы туда доберёмся."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Расскажи мне о Восходящем приливе."
  - char: "duisburg"
    side: "right"
    text:
      - "Это явление, при котором со дна моря в огромных количествах поднимаются обломки."
  - char: "commander"
    side: "left"
    text:
      - "Это происходит так часто, что вы даже дали этому название?"
  - char: "duisburg"
    side: "right"
    text:
      - "Да. Так бывает, когда война длится так же долго, как эта."
      - "За это время было потеряно множество баз, захвачены моря и разбиты армии. Впрочем, большинство обломков довольно старые."
      - "По мере того как сила экстрамерных существ росла, они захватили эти звёздные моря и стали использовать их как свои базы."
      - "С их приходом воды изменились, что привело к разным странным явлениям."
      - "Восходящие приливы — одно из них."
      - "Они появляются случайным образом по всему миру, возвращая на поверхность груды старых обломков."
      - "Вещи, которые мы собрали ранее, были произведены на ранних этапах войны, судя по продвинутым технологиям."
      - "Слава богу, что случился этот Восходящий прилив. Он принёс нам много хороших вещей."
  - char: "commander"
    side: "left"
    text:
      - "Подожди, продвинутым технологиям? Хочешь сказать, тогда технологии были более развитыми, чем сейчас?"
  - char: "duisburg"
    side: "right"
    text:
      - "Разница колоссальная. Вот почему мы безумно благодарны, когда такое случается — при условии, что это происходит не рядом с базой."
      - "Чёрт возьми, Прилив даже принёс тебя к нам!"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Расскажи мне о Румей."
  - char: "duisburg"
    side: "right"
    text:
      - "А, ну да, мы ведь упоминали её несколько раз, не так ли?"
      - "Её полное имя — Фриц Румей. Она лидер нашего Сопротивления."
  - char: "commander"
    side: "left"
    text:
      - "Я полагаю, она такая же девушка-кансен, как и вы?"
  - char: "duisburg"
    side: "right"
    text:
      - "Конечно. Сопротивление вынуждено сражаться на передовой, и ни один обычный человек не смог бы вынести тяжкое бремя её должности."
      - "На самом деле, у большинства фракций в этой войне лидер — кансен."
      - "Румей, в частности, очень..."
  - char: "z52"
    side: "left"
    text:
      - "Крутая! И суперсильная!"
  - char: "duisburg"
    side: "right"
    text:
      - "Это вкратце всё объясняет. Мы уже рассказали ей о тебе, так что ты скоро с ней встретишься."
      - "Какая честь!"

chapter6:
  rows:
  - text:
      - "Непринужденная атмосфера сохранялась, пока военный корабль без происшествий плыл вперед."
      - "По пути я увидел несколько пустынных островов, излучавших странное свечение, которые то тут, то там усеивали пейзаж."
      - "Дуйсбург рассказала мне, что эти острова раньше были оплотами Сопротивления."
      - "Однако они подверглись атаке с применением радиоактивного оружия, и почва была навсегда заражена."
      - "Девушки-кансен долго не протянут в радиоактивной среде, не говоря уже о людях."
      - "У них было оборудование для дезактивации, но из-за износа последняя исправная установка сломалась 20 лет назад. Из-за этого остров пришлось покинуть."
      - "После этого они стали запретными зонами и фактически приравнивались к базам экстрамерных существ."

chapter7:
  rows:
  - text:
      - "На борту прошло несколько часов. Светит вечернее солнце, и воздух перед кораблем, кажется, искажается."
      - "Затем, без какого-либо предупреждения, в воздухе появляется несколько крестообразных объектов."
  - char: "z52"
    side: "left"
    text:
      - "Командир! Мы вошли в наше Зеркальное море!"
      - "Вон те штуки — это наша внешняя линия обороны! Круто, да?"
  - text:
      - "Механические гиганты парят в свете заходящего солнца, не издавая ни единого звука."
      - "Их внешний вид ни о чём мне не говорит, и я даже представить себе не могу, какими функциями они обладают."
  - char: "duisburg"
    side: "left"
    text:
      - "Это то, что мы называем Вечными Звёздами."
      - "Они, наряду с Зеркальным морем, являются реликвиями, которые находятся здесь уже больше ста лет. Загадка, как они до сих пор работают."
      - "Они не только поразительно прочные, но и обладают исключительной маскировкой."
      - "Именно по этим причинам Румей выбрала это место для нашей базы."
      - "Но мой тебе совет — не подходи к ним слишком близко."
      - "Они просто следуют древним программам. Всё, что мы можем сделать — это поддерживать их в рабочем состоянии."
      - "Любой, кто подходит слишком близко без разрешения на обслуживание, расценивается как враг, так что..."
      - "В любом случае, видишь вон то здание?"
  - text:
      - "Вдалеке на воде покоится массивный остров."
      - "Хотя здание, расположенное в центре острова, и не так поражает воображение, как Вечные Звёзды, оно всё же внушает благоговение."
  - char: "duisburg"
    side: "left"
    text:
      - "Это штаб-квартира Сопротивления."
  - char: "z52"
    side: "right"
    text:
      - "А-а... Наконец-то! Дом, милый дом!"
