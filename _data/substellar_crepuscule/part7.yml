chapter1:
  rows:
  - text:
      - "После исчезновения Командира Акаги привела флот, спасшийся из Нараки, в Сардинию в надежде обеспечить Амаги необходимое восстановление."
      - "Павильон Империи Сакуры на Всемирной выставке остался нетронутым благодаря своей популярности во время мероприятия."
      - "Однако, как и другие павильоны Всемирной выставки, новые покои Синано таили в себе больше, чем кажется на первый взгляд."
  - char: "akagi"
    side: "left"
    text:
      - "Повсюду барьеры..."
      - "Поразительно, что барьеры заботятся даже о цветах в саду."
      - "Я и представить не могла, что такой простой с виду павильон окажется настолько сложным."
      - "И к тому же идеально защищённым..."
      - "И вы только посмотрите на это. Дело не только в здании — здесь слои защиты, тянущиеся от самой земли до небес."
      - "Синано, это точно  просто сакуранский особняк, а не какой-нибудь бункер Судного дня Союза Орла?"
  - char: "shinano"
    side: "right"
    text:
      - "Я лишь курировала строительство, а не проектирование..."
  - char: "akagi"
    side: "left"
    text:
      - "Ох, ты права."
      - "Теперь, когда мы внутри, ты получала ещё какие-нибудь указания от Ямато?"
  - char: "shinano"
    side: "right"
    text:
      - "Подожди, пожалуйста..."
      - "Она говорит, что барьеры — это лишь мера предосторожности. Не обращай на них внимания..."
      - "Они также предотвращают вмешательство в разум, поэтому мы можем готовиться без лишних тревог."
      - "Она намерена провести Обряд Возвращения через два дня..."
      - "Устранить коррозию в Нараке, обратить вспять нарушение концепций мира, воскресить тех, кто пал в бою..."
      - "И в процессе, возможно, даже снять ментальное вмешательство, которому подвергается Командир."
      - "Но перед обрядом мы должны найти разрыв в мире, который образовался из-за исчезновения Командира..."
      - "Восстановив его правильными воспоминаниями и концепциями, теми, которые есть только у нас..."
      - "Мы сможем значительно повысить наши шансы на успех."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Помочь нашим союзникам и спасти Командира. И впрямь убить двух зайцев одним выстрелом."
      - "Однако, если Обряд Возвращения состоится всего через два дня, на нас ложится огромная ответственность по поиску и устранению этого разрыва."
  - char: "memphis"
    side: "right"
    text:
      - "Предоставьте это нам с Хеленой. Обработка информации — это по нашей части."
  - char: "helena"
    side: "left"
    text:
      - "Всё верно. Ради Командира я сделаю всё что угодно!"
  - char: "amagi_cv"
    side: "right"
    text:
      - "Конечно. Мы все питаем одинаковую любовь к Командиру, да, но наши навыки совершенно разные."
  - char: "memphis"
    side: "left"
    text:
      - "П-полагаю, что так?.."
  - char: "zuikaku"
    side: "right"
    text:
      - "Мы с Рюхо тоже поможем!"
  - char: "ryuuhou"
    side: "left"
    text:
      - "С радостью!"
  - char: "amagi_cv"
    side: "right"
    text:
      - "и-хи. Давайте все постараемся ради тех, кого мы любим."
  - char: "shinano"
    side: "left"
    text:
      - "Ах... Она также говорит, что может помочь наличие любых предметов, которые связывают нас с Командиром."
  - char: "memphis"
    side: "right"
    text:
      - "Предметы, которые связывают нас... О!"
      - "Брошь от Клемансо... Нет, ещё лучше! Носовой платок, который я подарила Командиру!"
  - char: "shinano"
    side: "left"
    text:
      - "Носовой платок... Идеально! Наши шансы на успех возрастают ещё больше..."
  - char: "akagi"
    side: "right"
    text:
      - "Какое удачное маленькое совпадение."
  - char: "shinano"
    side: "left"
    text:
      - "А также... Ямато говорит, что раз душа Каги в безопасности, она должна скоро прийти в норму..."
      - "Разум останется её собственным, но будет дополнен воспоминаниями, выходящими за ограниченные рамки образца..."
  - char: "kagabb"
    side: "right"
    text:
      - "Пока я остаюсь собой, я не против."
  - char: "shinano"
    side: "left"
    text:
      - "Тогда мы должны начать подготовку обряда согласно инструкциям Ямато..."
  - char: "akagi"
    side: "right"
    text:
      - "Согласна со своей сестрой. Давайте сделаем всё возможное, чтобы вернуть нашего Командира."
