chapter1:
  rows:
  - text:
      - "Я снова вернулся — в залитый светом класс."
      - "Мадам М с улыбкой на губах смотрит на меня, спускается с кафедры и подходит ко мне."
  - char: "madam_m"
    side: "right"
    text:
      - "Тебе понравился большой сюрприз?"
  - char: "commander"
    side: "left"
    text:
      - "Сюрприз? Я бы назвал это ужасным потрясением. Мне следовало догадаться, что ты знала об этом с самого начала."
      - "Что это было? Звёздный Зверь."
  - char: "madam_m"
    side: "right"
    text:
      - "Хороший вопрос. Это то, против чего у тебя нет ни единого шанса."
      - "Ты не сможешь его победить. По крайней мере, не таким, какой ты сейчас."
  - char: "commander"
    side: "left"
    text:
      - "Именно об этом я и думал."
      - "Хотя всё могло бы сложиться иначе, если бы я подготовился к этому раньше."
      - "Ты уже возвращала меня на три дня назад — сможешь ли вернуть на три года или на тридцать лет?"
  - char: "madam_m"
    side: "right"
    text:
      - "И что, ты собираешься жить там с этого момента?"
  - char: "commander"
    side: "left"
    text:
      - "Разве не существует бесконечных вероятностей? Я могу продолжать пробовать что-то новое."
  - char: "madam_m"
    side: "right"
    text:
      - "Поначалу были. Теперь уже не так много."
  - char: "commander"
    side: "left"
    text:
      - "Почему нет? Ты уже дважды отправляла меня в прошлое."
  - char: "madam_m"
    side: "right"
    text:
      - "Три дня — это предел. Ну, если точнее, четыре дня."
      - "Ты стал свидетелем вероятностей того мира лишь в объеме четырёх дней."
      - "Включая твое первое наблюдение — тот день, когда ты ступил в этот мир. Я могу отправить тебя назад к этому моменту или в любое последующее время, но не раньше."
      - "В конце концов, не может же быть больше одного первого наблюдения, не так ли?"
      - "Ты можешь перепрыгивать между ветвями и возвращаться к более ранней отправной точке. Это, безусловно, возможно..."
      - "Но это не то, что ты надеешься сделать, верно?"
  - char: "commander"
    side: "left"
    text:
      - "Нет."
  - char: "madam_m"
    side: "right"
    text:
      - "Хи-хи. Что ж, и в чём разница между тем и этим?"
  - char: "commander"
    side: "left"
    text:
      - "Я не знаю... У меня пока нет конкретной теории."
  - char: "madam_m"
    side: "right"
    text:
      - "Хорошо. Тогда продолжай думать."
      - "Продолжишь ли ты выбирать, даже если это будет означать столкновение с тем кошмарным врагом?"
  - char: "commander"
    side: "left"
    text:
      - "Конечно. Если я сдамся, всё будет кончено."
      - "Это даже ещё не кошмарный сценарий. Есть куча вещей, которые я могу испробовать."
      - "Например, я мог бы заставить их переместить базу и убедить спастись бегством от Звёздного Зверя."
      - "Я сделаю всё, что потребуется, чтобы сделать этот мир лучше."
  - char: "madam_m"
    side: "right"
    text:
      - "Хи-хи. Мне не терпится увидеть, как ты попытаешься."
