chapter1:
  rows:
  - text:
      - "Глядя в иллюминатор серийного корабля, я вижу, как снаружи сражаются кансен."
  - char: "commander"
    side: "left"
    text:
      - "(Я снова вернулся.)"
      - "(Если мы не активируем Стену Мидгарда, то до появления Звёздного Зверя должно пройти ещё пять часов.)"
      - "(Я должен использовать это время, чтобы осуществить свой план!)"
  - text:
      - "Посмотрев наверх, я вижу в небе разведывательные самолёты Румей. Новости о Хиппер достигнут нас с секунды на секунду."
      - "Я убеждаю её, что Звёздный Зверь приближается, и прошу связаться с Хиппер."
      - "Но то, что я собираюсь сделать сейчас, станет настоящим поворотным моментом."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Ты хочешь использовать минерализованную энергию, чтобы усилить наши войска?"
  - char: "commander"
    side: "left"
    text:
      - "Именно. В вашем мире это беспрецедентно?"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Насколько мне известно, такого никогда не делали... Нет, погоди."
      - "Хотя я никогда не слышала, чтобы минерализованная энергия использовалась для прямого усиления боевых возможностей или огневой мощи..."
      - "В эпоху расцвета нашей цивилизации существовали портативные устройства для ремонта оснастки, сделанные из этого материала."
      - "Как следует из названия, девушки-корабли могли использовать их для починки своей оснастки в бою — но они также воздействовали, пусть и с меньшим эффектом, на их тела и корпуса."
      - "Хоть это и косвенно, думаю, это вполне уместно назвать усилением боевых сил."
  - char: "commander"
    side: "left"
    text:
      - "Они воздействовали и на корпуса? Включая корпуса с коррозией МЕТА?"
      - "Сохранились ли они до наших дней?"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Нет. Давным-давно мы случайно наткнулись на одну партию, но они уже давно израсходованы."
      - "Что касается того, могут ли они излечить коррозию МЕТА — я не знаю."
  - char: "commander"
    side: "left"
    text:
      - "Вот как... Какая жалость."
      - "(Но они могут чинить оснастку, плоть и корпус в равной степени? Это полезная информация.)"
      - "(Когда вернусь домой, мне нужно будет исследовать это в Море Звёзд.)"
      - "(Если минерализованная энергия может напрямую воздействовать на корпуса, то, возможно, она как-то связана с Ватацуми... С Кубами Мудрости.)"
      - "Могу ли я сам взглянуть на эту минерализованную энергию?"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Боюсь, об этом не может быть и речи. Она всё ещё заражена, но ты сможешь посмотреть после того, как её очистят."
  - char: "commander"
    side: "left"
    text:
      - "Ты можешь сделать это прямо сейчас?"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Да. В энергетической башне в штабе есть восстановленный очиститель от радиации."
      - "Если ты хочешь модернизировать его прямо сейчас, я не против ускорить этот процесс..."
      - "Но это займёт как минимум полмесяца. Сомневаюсь, что мы успеем вовремя, чтобы сразиться с этим Звёздным Зверем, если ты прав на его счёт."
  - char: "commander"
    side: "left"
    text:
      - "Мне не нужна его модернизация — я просто хочу получить минерализованную энергию."
      - "Она поможет в грядущей битве."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "...Ты и правда знаешь способ сделать девушек-кансен сильнее с помощью минерализованной энергии?"
  - char: "commander"
    side: "left"
    text:
      - "Что-то вроде того. Объясню позже."
      - "А пока мне нужно, чтобы ты разделила флот надвое. Одна половина доставит минерализованную энергию обратно в штаб, а другая — найдёт Хиппер и приведёт её на встречу с нами."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Поняла. Будем молиться, чтобы твой план сработал."
