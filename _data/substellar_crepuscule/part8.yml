chapter1:
  rows:
  - text:
      - "Свет отступает, и я оказываюсь в светлом классе."
  - char: "commander"
    side: "left"
    text:
      - "Фух..."
  - text:
      - "Холод от моего столкновения со смертью всё ещё витает вокруг меня. Тёплого солнечного света достаточно, чтобы у меня закружилась голова."
  - char: "commander"
    side: "left"
    text:
      - "Что случилось?"
      - "Мне всё это приснилось? Или это и есть сон?"
  - char: "madam_m"
    side: "right"
    text:
      - "Хи-хи. Смерть — это совсем не приятный опыт. Не торопись, привыкай к этому."
  - text:
      - "Женщина с фиолетовыми волосами выходит из-за учительской кафедры, с улыбкой на лице."
  - char: "commander"
    side: "left"
    text:
      - "Я помню тебя. Тебя и этот класс."
      - "Я уже был здесь раньше... не так ли, Мадам М?"
  - char: "madam_m"
    side: "right"
    text:
      - "Похоже, часть твоих воспоминаний вернулась."
  - char: "commander"
    side: "left"
    text:
      - "Но я мало что помню. Это ты ответственна за мою амнезию?"
  - char: "madam_m"
    side: "right"
    text:
      - "...Говорят, что лицо старого друга может помочь страдающему амнезией восстановить часть своих воспоминаний."
  - char: "commander"
    side: "left"
    text:
      - "Хочешь сказать, этот старый друг — ты? Как-то не похоже."
  - char: "madam_m"
    side: "right"
    text:
      - "Не похоже? Какая жалость."
  - text:
      - "Так она говорит, однако в её выражении лица нет ни малейшего следа разочарования."
  - char: "madam_m"
    side: "right"
    text:
      - "В любом случае, давай перейдём к обсуждению твоей текущей проблемы."
  - char: "commander"
    side: "left"
    text:
      - "Да, давай. Что вообще происходит?"
  - char: "madam_m"
    side: "right"
    text:
      - "Помнишь две вещи, которые я тебе гарантировала? Право искать и возможность выбирать."
      - "Ты готов сделать свой выбор?"
  - char: "commander"
    side: "left"
    text:
      - "Вот, ты снова несёшь чепуху. Какое это имеет отношение к выяснению того, кто я такой?"
  - char: "madam_m"
    side: "right"
    text:
      - "Это зависит от того, что тебе удастся вынести из своего поиска."
      - "Возьми, к примеру, Сирен. Что ты о них думаешь?"
  - char: "commander"
    side: "left"
    text:
      - "Сирены, да..."
      - "Их прибытие в тот мир ознаменовало собой технологический золотой век, и они, должно быть, сыграли решающую роль в битве против захватчиков."
      - "Хотя их усилия и закончились провалом, то, что они оставили после себя, помогло сопротивлению человечества."
      - "Погоди, ты пытаешься намекнуть, что Сирены и те экстрамерные существа — естественные враги, и поэтому они потерпели поражение?"
  - char: "madam_m"
    side: "right"
    text:
      - "Я ни на что не намекаю. Мне просто нравится наблюдать за тем, как работает твой разум."
  - char: "commander"
    side: "left"
    text:
      - "Чем же тогда всё это было? Искусной иллюзией, которую ты для меня создала?"
  - char: "madam_m"
    side: "right"
    text:
      - "Это зависит от того, что думаешь ты. Если считаешь, что всё было по-настоящему — значит, так оно и было. Если думаешь, что это фальшивка — значит, это фальшивка."
  - text:
      - "С тем же бесстрастным лицом, что и всегда, она изрекает очередную эзотерическую чушь."
  - char: "madam_m"
    side: "right"
    text:
      - "Реальность или вымысел? Этот вопрос не так уж и важен."
  - char: "commander"
    side: "left"
    text:
      - "В смысле?"
  - char: "madam_m"
    side: "right"
    text:
      - "Я говорю о том, что для нас это в любом случае не имеет значения."
      - "Тебя ведь не волнует истинность происходящего, не так ли?"
      - "Этот поиск закончился для тебя трагически. Предположим, я бы сказала, что всё это было по-настоящему, что бы ты тогда ответил?"
  - char: "commander"
    side: "left"
    text:
      - "Я бы ответил, что сожалею о совершении столь чудовищной ошибки, но благодарен, что меня спасли."
      - "Если бы я больше знал о враге и поделился кое-какими мыслями с Румей, я, возможно, смог бы сконцентрировать наши силы и достичь иного результата."
  - char: "madam_m"
    side: "right"
    text:
      - "Тогда если бы я сказала тебе, что всё это было сплошным обманом, изменились бы как-то твои мысли на этот счёт?"
  - char: "commander"
    side: "left"
    text:
      - "Нет, но это совершенно разные вещи."
      - "Если всё было по-настоящему, то это непоправимая трагедия."
      - "Но если это была фальшивка, её можно было бы назвать крайне ценной симуляцией."
      - "Столкнись я с подобной ситуацией в будущем, у меня будут выше шансы пережить бурю благодаря тому, чему я здесь научился."
  - char: "madam_m"
    side: "right"
    text:
      - "Это одно и то же."
      - "Если хочешь переиграть, то просто попробуй ещё раз и сделай что-нибудь по-другому. Зачем ждать наступления будущего?"
  - char: "commander"
    side: "left"
    text:
      - "О чём ты? О том, что я должен вернуться в твою иллюзию и сделать более правильный выбор?"
  - char: "madam_m"
    side: "right"
    text:
      - "Не припомню, чтобы я говорила, что это иллюзия."
  - char: "commander"
    side: "left"
    text:
      - "Что ж, если это было реальностью, то что сделано, то сделано. Как я могу начать всё сначала?"
  - char: "madam_m"
    side: "right"
    text:
      - "Вот и мне интересно. О чём тебе действительно стоит подумать, так это вот о чём: если у тебя появится шанс начать всё сначала, воспользуешься ли ты им?"
  - char: "commander"
    side: "left"
    text:
      - "Конечно воспользуюсь. Я буду менять всё до тех пор, пока не останется никакой печали."
  - char: "madam_m"
    side: "right"
    text:
      - "Значит, так тебе и следует поступить."

chapter2:
  rows:
  - text:
      - "Свет за окнами класса становится ослепительно ярким, окутывая всё в чистую белизну."
  - char: "madam_m"
    side: "right"
    text:
      - "У тебя всегда будет свобода выбора."
      - "И когда ты не уверен, какой выбор сделать..."
      - "Испробуй все варианты, пока не будешь уверен в своём ответе."
