chapter1:
  rows:
  - text:
      - "Три дня пролетели в мгновение ока. Время битвы наконец-то пришло."
  - char: "duisburg"
    side: "left"
    text:
      - "Командир,  Румей приказала мне передать командование этим флотом тебе."
      - "Но учитывая, что это твоя первая миссия, могу ли я стать твоим заместителем?"
  - char: "commander"
    side: "right"
    text:
      - "Буду только рад."
  - text:
      - "Дуйсбург знает в миллион раз больше меня об этих морях и так называемых экстрамерных существах."
      - "Я бы и не подумал отказываться от такого предложения."
  - char: "duisburg"
    side: "left"
    text:
      - "Хе-хе. Я тебя не подведу."
      - "Разведывательный флот Z52 направляется из сектора IB-AX-108 в 110-й, а Румей уже вышла в море со своим основным флотом."
      - "Десантные флоты и флоты сопровождения всё ещё в режиме ожидания."
      - "Что касается нашего собственного ударного флота, наша задача — обезопасить маршрут снабжения в секторе IB-AX-104, устранить всех врагов в поле зрения и собрать с них образцы."
      - "Но кто мог подумать, что для починки наших очистителей от радиации понадобится образец экстрамерного существа, из всех возможных вариантов..."
      - "Сектор IB-AX-104 обширен, но он уже давно считается относительно безопасным."
      - "Восемь часов назад разведка тоже не показала ничего необычного."
  - char: "commander"
    side: "right"
    text:
      - "Что ж, как удачно..."
      - "(Если там действительно безопасно, то рассредоточение наших флотов сделает поиски более эффективными, это да. Но здесь явно что-то нечисто...)"
  - char: "duisburg"
    side: "left"
    text:
      - "В любом случае, нам лучше выдвигаться."

chapter2:
  rows:
  - text:
      - "После спокойного перехода в IB-AX-103 мы наткнулись на них — экстрамерных существ."
  - text:
      - "БАБАХ!"
  - char: "extrademision_horde"
    side: "right"
    text:
      - "Р-Р-Р-Р-Р-Р!"
  - char: "commander"
    side: "left"
    text:
      - "Ничего себе орда! И это ты называешь безопасным?"
  - char: "duisburg_rad"
    side: "right"
    text:
      - "Вовсе нет. Это самое большое их скопление, что мы видели за последние годы!"
      - "Но почему именно сегодня?"
      - "Командир, я настаиваю на немедленном отступлении! Нам не отбиться от такого количества!"
  - char: "commander"
    side: "left"
    text:
      - "Согласен. Отдай всем кораблям приказ прикрывать немедленное отступление друг друга. Также свяжись с союзными флотами и штабом — Румей должна немедленно остановить миссию."
  - char: "duisburg_rad"
    side: "right"
    text:
      - "Принято!"

chapter3:
  rows:
  - text:
      - "БАБАХ!"
  - char: "extrademision_horde"
    side: "right"
    text:
      - "Р-Р-Р-Р-Р-Р!"
  - text:
      - "Шло время, а численность орды лишь росла."
      - "Ситуация из обнадёживающей стала безнадёжной буквально за считанные минуты."
      - "Мы делали всё, что в наших силах, но теряли связь с одним кораблём за другим."
      - "На этом этапе даже отступление казалось недостижимой роскошью."
  - char: "duisburg_rad"
    side: "right"
    text:
      - "Нет... Почему это должно было случиться именно сегодня?"
      - "Почему..."
  - text:
      - "Миссия, от которой мы ожидали лёгкого успеха, обернулась трагедией."
      - "Голос Дуйсбург дрожит от боли, грусти и сожаления."
  - char: "duisburg_rad"
    side: "right"
    text:
      - "Командир... Нам конец, да?"
      - "Мне жаль, что втянула тебя в это. Я..."
  - text:
      - "БАБАХ!"
  - text:
      - "Воздух наполняет мёртвая тишина."
  - char: "commander"
    side: "left"
    text:
      - "......"
      - "Я... умираю?"
      - "Прямо здесь? Так просто?"
      - "Я ничего не достиг. Я даже не смог вернуть свои воспоминания."
      - "Но на этом всё заканчивается..."
  - text:
      - "БАБАХ!"

chapter4:
  rows:
  - text:
      - "Посреди взрыва серийного корабля моё сознание низвергается в пустую бездну."
  - text:
      - "ШУРХ..."
  - text:
      - "А затем я слышу звук тасуемых карт."
