chapter1:
  rows:
  - text:
      - "Настал день проведения Обряда Возвращения."
      - "Девушки сделали всё, что могли. Теперь им оставалось лишь ждать, затаив дыхание."
      - "Вместе со всплеском света появились золотые бабочки, которые запорхали по залу."
      - "Бабочки касались барьеров один за другим, зажигая их, словно оживающие машины."
      - "В другом месте проводился такой же ритуал."
      - "На востоке, внутри Дворца Дракона в Тихом Океане."
  - char: "memphis"
    side: "left"
    text:
      - "Ого... Этот ритуал куда более впечатляющий, чем те, что показывают в фильмах Белл."
  - char: "helena"
    side: "right"
    text:
      - "Такое чувство, будто меня окружает какая-то странная сила... Это «души»?"
  - text:
      - "Вслед за золотыми бабочками появились фиолетовые."
      - "Они слились в красочном танце, возвращая жизнь разрушенной земле и обновляя обветшавшее здание. Их павшая соратница вновь открыла глаза."
  - char: "shinano"
    side: "left"
    text:
      - "Мусаси... Ты вернулась..."
  - char: "amagi_cv"
    side: "right"
    text:
      - "Разве это не чудесно, Акаги? Ритуал прошел успешно."
  - char: "akagi"
    side: "left"
    text:
      - "Да... Это чудесно."
  - text:
      - "Пока смешивалось свечение барьеров, в зале появился еще один человек."
  - char: "unzen_rad"
    side: "right"
    text:
      - "Госпожа Ямато приказала мне передать её поздравления с успешным проведением ритуала."
      - "Госпожа Мусаси пришла в норму и знает, что нужно делать дальше."
      - "Теперь, когда ритуал завершен, пришло время активировать магический круг, с помощью которого мы найдем Командира."
  - char: "shinano"
    side: "left"
    text:
      - "Просто великолепно..."

chapter2:
  rows:
  - text:
      - "Третья бабочка — синяя — расправила крылья в зале."
      - "Сила барьеров исказила пол и стены вокруг них, обнажив ещё десятки скрытых магических кругов."
      - "Иллюзорное ночное небо над головой и мириады ритуальных барьеров внизу начали светиться."
  - char: "unzen_rad"
    side: "right"
    text:
      - "Вы уже выбрали следящий указатель?"
  - text:
      - "Следящим указателем должен был стать человек, который определит радиус поиска магического круга для обнаружения Командира."
      - "Этот человек должен находиться в самом центре магического круга, используя силу ритуала для защиты от когнитивного вмешательства."
      - "Этому человеку придется не только выдержать бремя управления этой могучей силой, но и одновременно искать следы Командира в нахлынувшем потоке информации."
      - "Это требовало стойкости разума, и процесс мог нанести серьёзный вред, если бы продолжался длительное время."
  - char: "akagi"
    side: "left"
    text:
      - "Я сделаю это."
  - char: "amagi_cv"
    side: "right"
    text:
      - "Я рядом, если тебе нужно будет остановиться. Только не переусердствуй, хорошо?"
  - char: "akagi"
    side: "left"
    text:
      - "Знаю. Не буду."
      - "Хоть у меня и нет такой же совместимости с Ватацуми, как у тебя, меня будет более чем достаточно для этой задачи."
  - char: "unzen_rad"
    side: "right"
    text:
      - "Очень хорошо. А кто будет путеводной меткой?"
  - text:
      - "Путеводная метка отвечала за обозначение цели и помощь в поиске."
      - "Хотя в первоначальном ритуале не было такой роли, она была добавлена в связи с носовым платком, который Мемфис подарила Командиру."
  - char: "memphis"
    side: "left"
    text:
      - "Что ж, раз Клемансо здесь нет, а платок был мой, это сделаю я."
      - "Не волнуйтесь. Мы с Акаги благополучно вернем Командира домой!"
  - char: "unzen_rad"
    side: "right"
    text:
      - "Обе встаньте в магический круг, пожалуйста."
  - char: "akagi"
    side: "left"
    text:
      - "Конечно. Я готова."

chapter3:
  rows:
  - text:
      - "Акаги и Мемфис шагнули в магический круг."
      - "Танцующие в воздухе огни закружились вокруг круга, образовали кольца, а затем превратились в световые столбы, которые окутали их обеих."
  - char: "memphis"
    side: "left"
    text:
      - "(Дождись нас, Командир...)"
  - char: "akagi"
    side: "right"
    text:
      - "(Я иду спасать тебя, мой дорогой Командир...)"
  - char: "unzen_rad"
    side: "left"
    text:
      - "Магический круг, активация!"
