chapter1:
  rows:
  - text:
      - "Прошёл день с тех пор, как сакуранцы прибыли в свой павильон."
      - "Благодаря слаженным усилиям всех присутствующих, фиксация и устранение разрыва проходили гладко."
      - "Для Каги был выстроен барьер, и она в одиночестве проводила последние приготовления."
      - "Несмотря на сложившуюся ситуацию, некоторые всё же нашли время для отдыха и бесед."

chapter2:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "...И это все истории о Командире, что у меня есть."
  - char: "amagi_cv"
    side: "right"
    text:
      - "От линии обороны Лонг Айленд до Бермудского моря и контрнаступления в Океане NA..."
      - "А ещё инцидент на Всемирной выставке и недавняя битва внутри Нараки."
      - "Командир действительно сражался плечом к плечу с Союзом Орла во многих, многих местах."
  - char: "memphis"
    side: "left"
    text:
      - "Да, полагаю, что так."
      - "Хелена долгое время сражалась под началом Командира. Хотя, возможно, я сражалась чуточку дольше."
  - char: "akagi"
    side: "right"
    text:
      - "Ах, это даёт тебе право хвастаться перед всеми остальными фанатками."
      - "Должна ли я изображать ревность?"
  - char: "memphis"
    side: "left"
    text:
      - "Угх, ты..."
      - "Ты думаешь, что ты такая важная шишка. Всё, что ты сделала — это едва не погубила мир и заставила Командира проливать по тебе слёзы. А потом тебя ещё и пришлось спасать."
  - char: "akagi"
    side: "right"
    text:
      - "Это правда. Я совершила огромную ошибку и доставила Командиру много хлопот."
      - "Несмотря на это, Командир спас меня и даже принял мои одержимости."
      - "Я готова отказаться от чего угодно ради этого человека, даже от собственной жизни. А ты можешь сказать то же самое?"
  - char: "memphis"
    side: "left"
    text:
      - "Ты всё равно чуть не погубила мир, каким мы его знаем, а заодно и Командира..."
  - char: "akagi"
    side: "right"
    text:
      - "Именно поэтому любовь в моём сердце должна пылать жарче, чем у кого-либо другого."
  - char: "memphis"
    side: "left"
    text:
      - "*вздох*"
  - text:
      - "Мемфис оставалось лишь закатить глаза от такой дерзости."

chapter3:
  rows:
  - char: "unzen_rad"
    side: "right"
    text:
      - "О чём эта оживлённая беседа?"
  - text:
      - "Раздался голос, и в павильон ударил луч света, приняв форму девушки-кансен."
  - char: "memphis"
    side: "left"
    text:
      - "Ты кто?"
  - char: "akagi"
    side: "right"
    text:
      - "Ундзэн? Какими судьбами?"
  - char: "unzen_rad"
    side: "left"
    text:
      - "Я услышала, как вы вдвоём говорите о Командире, и подумала, что мне стоит поделиться одной своей старой историей."
  - char: "shinano"
    side: "right"
    text:
      - "У тебя есть история, которой ты хочешь с нами поделиться?"
  - char: "unzen_rad"
    side: "left"
    text:
      - "Да. Давным-давно, когда делегация Военно-морской академии нанесла визит на нашу родину..."
      - "Это история о человеке, который не побоялся заблудиться — о человеке, который прошёл через бесчисленные барьеры и пути, чтобы добраться до меня..."
