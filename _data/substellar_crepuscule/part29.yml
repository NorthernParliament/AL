chapter1:
  rows:
  - text:
      - "Я наконец-то воссоединился со своими подругами в магическом круге, окружённый калейдоскопом бабочек."
  - char: "akagi"
    side: "right"
    text:
      - "Командир!"
  - char: "memphis"
    side: "left"
    text:
      - "Ты наконец-то вернулся!"
  - char: "akagi"
    side: "right"
    text:
      - "Я ждала тебя!"
  - char: "commander"
    side: "left"
    text:
      - "Кхм... Извините за ожидание. Теперь всё позади."
  - char: "memphis"
    side: "right"
    text:
      - "Прошло не так уж много времени."
  - char: "akagi"
    side: "left"
    text:
      - "Мы, честно говоря, удивлены, как быстро ты справился. Ты уже закончил все свои дела?"
  - char: "commander"
    side: "right"
    text:
      - "...Быстро?"
      - "Сколько времени прошло с нашего последнего разговора?"
  - char: "akagi"
    side: "left"
    text:
      - "Меньше трёх минут."
  - char: "commander"
    side: "right"
    text:
      - "(Время там текло с другой скоростью?)"
      - "(...Неужели Мадам М сделала это из заботы об этих двоих?)"
      - "(Я и понятия не имел, что кто-то из Арбитров на такое способен.)"
  - char: "memphis"
    side: "left"
    text:
      - "Командир? Ты просто замер... Ты забыл сделать что-то важное?"
  - char: "commander"
    side: "right"
    text:
      - "Нет, нет. Я в порядке."
      - "Я сыт по горло этой маленькой командировкой. Отправляемся домой, а обсуждения оставим на потом."
  - char: "memphis"
    side: "left"
    text:
      - "Да, вперёд!"
  - char: "akagi"
    side: "right"
    text:
      - "Я счастлива сопровождать тебя, Командир."
