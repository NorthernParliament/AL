chapter1:
  rows:
  - text:
      - "Глядя в иллюминатор серийного корабля, я вижу, как снаружи сражаются кансен."
  - char: "commander"
    side: "left"
    text:
      - "(Это в окрестностях базы. Пять часов до прибытия Звёздного Зверя.)"
      - "(Есть основания полагать, что он не может оставаться здесь вечно.)"
      - "(В таком случае нам следует немедленно отступить и прятаться до тех пор, пока он не решит уйти.)"
      - "(Проблема в том, что такое внезапное отступление из штаба повлечёт за собой тяжёлые потери для Сопротивления.)"
      - "(Отступать, когда они окружены со всех сторон, тоже слишком тяжело.)"
      - "(Раз об этом не может быть и речи, остаётся только тянуть время, нащупывая слабости Звёздного Зверя.)"
      - "(Хотя он и кажется неуязвимым, в прошлом его дважды удавалось отбросить. Должен быть способ противостоять ему.)"
      - "(Использование объектов, оставленных Сиренами, может выиграть нам достаточно времени, пока Зверь не уйдет.)"
      - "(Сражаться или отступать — я позволю девочкам сделать этот выбор.)"
  - text:
      - "Посмотрев наверх, я вижу в небе разведывательные самолёты Румей. Новости о Хиппер достигнут нас с секунды на секунду."
  - char: "commander"
    side: "left"
    text:
      - "(Нужно кратко ввести её в курс дела насчет Звёздного Зверя.)"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Звёздный Зверь? Ты имеешь в виду лидера экстрамерных существ?"
      - "К чему ты сейчас об этом заговорил?"
  - char: "commander"
    side: "left"
    text:
      - "Потому что он командует врагами, с которыми мы сейчас сражаемся."
      - "(Я должен перейти прямо к делу. Нельзя терять ни секунды.)"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Если это такая шутка, то мне не смешно."
  - char: "commander"
    side: "left"
    text:
      - "Нет. Я абсолютно серьёзен."
  - text:
      - "Она смотрит мне прямо в глаза, ища любые признаки того, что я лгу."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Насколько ты в этом уверен?"
  - char: "commander"
    side: "left"
    text:
      - "Абсолютно. У нас меньше пяти часов до его появления."
      - "Я знаю также , что Хиппер прибыла сюда раньше нас и задала им жару — и что у неё с ним личные счёты."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "...Откуда ты это знаешь?"
      - "Я только что отправила свои разведывательные самолёты."
  - text:
      - "Она отводит взгляд."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Лучше бы тебе не водить меня за нос."
  - char: "commander"
    side: "left"
    text:
      - "Есть ли у Звёздного Зверя какие-нибудь слабости? Вы ведь уже отбивались от него раньше, не так ли?"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Да... Если он действительно появится, это будет наша четвёртая встреча."
      - "Ты же не думаешь всерьёз, что мы сможем дать ему отпор?"
  - char: "commander"
    side: "left"
    text:
      - "Как раз наоборот. Нам следует держаться от него подальше."
      - "Возможно ли эвакуировать штаб за четыре часа?"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "......"
      - "Персонал — да, но мы будем вынуждены бросить почти все наши припасы и оборудование."
  - char: "commander"
    side: "left"
    text:
      - "Жизни стоят больше, чем материалы."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Но одними жизнями войны не выигрывают."
  - text:
      - "Она качает головой и отвечает с горечью в голосе."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Этот остров — последний оплот, располагающий средствами для производства и обслуживания оборудования, необходимого Сопротивлению."
      - "Если мы потеряем его и будем вынуждены полагаться на наспех перевезенные припасы, мы даже не доберемся ни до одной союзной территории."
  - char: "commander"
    side: "left"
    text:
      - "Значит, о бегстве не может быть и речи."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Да. Сражаться — наш единственный выбор."
      - "По крайней мере, для нас. Ты же, с другой стороны..."
  - char: "commander"
    side: "left"
    text:
      - "Я один из вас. Я не могу просто бросить вас."
      - "В последний раз, когда появлялся Звёздный Зверь, как долго длилась его ярость?"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "17 дней."
  - char: "commander"
    side: "left"
    text:
      - "Было ли уничтожено всё на его пути?"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Всё, за исключением нескольких прочных укреплений, оставленных Сиренами."
      - "Ты надеешься использовать одно из них и переждать бурю там?"
      - "Наш штаб — не соломенная хижина, но он ничто по сравнению с великими цитаделями Сирен."
  - char: "commander"
    side: "left"
    text:
      - "Ты права — в нынешнем виде он не выстоит, но мы могли бы попытаться укрепить его."
      - "Сирены пытались построить какое-то колоссальное сооружение прямо там, где мы находимся."
      - "Вечные Звёзды должны были стать его атакующими модулями, а энергетическая башня — источником питания. Нетрудно предположить, что Зеркальное море должно было стать его защитным компонентом."
      - "Если мы сможем перенастроить его части так же, как мы сделали это с Вечными Звёздами, они могут заработать так, как и задумывали Сирены..."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Подожди. Я помню отчет об этом."
      - "Вот он. Наша команда инженеров передала его мне перед отбытием."
      - "Судя по всему, третья и четвёртая панели управления в зале на борту Первой Вечной Звезды на мгновение мигнули после её ремонта."
  - char: "commander"
    side: "left"
    text:
      - "Вот оно! Есть ли в других сооружениях такие же комнаты управления?"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Есть, но у Первой Вечной Звезды она самая большая."
  - char: "commander"
    side: "left"
    text:
      - "Что, если первая — это не просто оружие, но ещё и командный центр всей этой махины?"
      - "Я думаю, это стоит проверить."
      - "Я чуть не забыл про Хиппер... Можно ли заставить её выполнять приказы?"
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Да. Я верю, что она согласится работать с нами, если узнает о приближении Звёздного Зверя."
  - char: "commander"
    side: "left"
    text:
      - "Тогда давайте сузим нашу линию обороны и сосредоточимся на сохранении сил, а не на уничтожении врага."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Согласна. Давайте разделимся и начнём подготовку."
  - char: "commander"
    side: "left"
    text:
      - "Принято. Я направлюсь прямиком к Первой Вечной Звезде."
  - char: "fritz_rumey"
    side: "right"
    text:
      - "Z52, ты будешь сопровождать Командира."
  - char: "z52"
    side: "left"
    text:
      - "Будет сделано! Хе-хе!"
