chapter1:
  rows:
  - text:
      - "Три дня пролетели в мгновение ока. Время битвы наконец-то пришло."
      - "Благодаря пересмотренной стратегии мы быстро обнаружили основные силы экстрамерных существ, сконцентрировали наши атаки и без проблем разгромили их."
      - "Настоящим сюрпризом стало количество полученных нами образцов, что позволило выполнить отложенную миссию в процессе."

chapter2:
  rows:
  - text:
      - "В настоящее время основной флот плавно движется к Зильберштерну."
      - "Из-за нашего упора на огневую мощь в этот раз мы решили не задействовать десантные флоты и флоты сопровождения. Таким образом, полный контроль и крупномасштабная добыча полезных ископаемых на острове были исключены из целей этой миссии."
      - "После зачистки всех угроз вокруг острова основные силы должны установить автоматические добывающие станции, чтобы получить лишь необходимые материалы для починки очистителей от радиации."
      - "Это было еще одним изменением, которое я внес в план."
  - char: "z52"
    side: "left"
    text:
      - "Все, смотрите! Место добычи прямо по курсу!"
  - text:
      - "Она указывает на высокую гору на краю острова."
      - "Вся гора покрыта металлическими обломками, придающими ей особый блеск."
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Да ладно вам. Вы же не думали, что мы будем добывать руду из шахты?"
      - "Мы планируем добывать минерализованную энергию — особый вид руды, который растет из металлических обломков. Это один из главных материалов для Кубов Энергии."
      - "Давным-давно каждая фракция культивировала минерализованную энергию высокой чистоты и производила бесчисленное количество Кубов Энергии."
      - "Эта безграничная энергия когда-то питала золотой век нашей цивилизации... Сегодня мы живем лишь в его отблесках."
  - text:
      - "На губах Румей промелькнула сардоническая улыбка."
  - char: "commander"
    side: "left"
    text:
      - "(Кубы Энергии? Почему мне кажется, что я уже слышал о них раньше...)"

chapter3:
  rows:
  - text:
      - "На дальнем конце океана вспыхивает луч света, казалось бы, направляя поток информации мне в голову."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Это тоже часть моих потерянных воспоминаний?)"
      - "(Причем, все они об Энергетических Кубах. И люди этого мира используют этот материал для производства Кубов Энергии?)"
      - "(Но что это за минерализованная энергия? Это совсем не вяжется с моими воспоминаниями.)"
      - "(Самой важной частью производства Куба Энергии было создание сложного синтетического контейнера...)"
      - "(Является ли этот контейнер переработанной версией этого минерала?)"

chapter5:
  rows:
  - text:
      - "После этого я не получил никакой другой информации, поэтому не пришел ни к какому значимому выводу."
      - "Тем временем Румей и ее флот установили свои автоматические добывающие машины, и их роботы-шахтеры приступили к работе."
  - char: "commander"
    side: "left"
    text:
      - "Контроперация началась удачно, принеся нам эту добычу стратегических материалов."
      - "Похоже, мы вне опасности... пока что."
  - char: "z11_rad"
    side: "right"
    text:
      - "С-с-срочное сообщение! Вы меня слышите?!"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Что случилось?! Отвечай немедленно!"
  - char: "z11_rad"
    side: "right"
    text:
      - "Дело дрянь! Экстрамерные существа у штаба..."
  - char: "communicator"
    side: "left"
    text:
      - "БАБАХ!!!"
  - char: "z11_rad"
    side: "right"
    text:
      - "...н-начали крупномасштабную атаку!"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Мы уже в пути. Сделайте все возможное, чтобы продержаться до нашего возвращения!"
  - char: "z11_rad"
    side: "right"
    text:
      - "В-вас поняла!"
  - char: "communicator"
    side: "left"
    text:
      - "БАБАХ!!!"
  - char: "commander"
    side: "right"
    text:
      - "......"
  - char: "fritz_rumey"
    side: "left"
    text:
      - "Вот и всё."
      - "Миссия откладывается. Всем силам немедленно возвращаться!"
