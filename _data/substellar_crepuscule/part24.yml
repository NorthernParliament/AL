chapter1:
  rows:
  - text:
      - "Когда свет рассеялся, я снова оказался в светлом классе."
  - char: "madam_m"
    side: "right"
    text:
      - "Увы, энергетическая башня просто не выдержала. Вот тебе и весь твой план."
  - text:
      - "Мадам М, как обычно, ждала меня."
  - char: "commander"
    side: "left"
    text:
      - "И не говори. Сначала я искренне верил, что всё сработает."
  - char: "madam_m"
    side: "right"
    text:
      - "«Ты не можешь победить его. По крайней мере, не в твоём нынешнем состоянии»."
  - char: "commander"
    side: "left"
    text:
      - "Дело в том, что я не умею проигрывать. Дай мне ещё немного побиться об это головой."
  - char: "madam_m"
    side: "right"
    text:
      - "Что будешь делать дальше?"
  - char: "commander"
    side: "left"
    text:
      - "Во-первых, мне нужно, чтобы ты присоединилась ко мне в одной горячей дискуссии."
  - char: "madam_m"
    side: "right"
    text:
      - "Конечно. Не вижу причин для отказа."
  - char: "commander"
    side: "left"
    text:
      - "Звёздный Зверь появлялся всего четыре раза, и с последнего прошло несколько десятилетий."
      - "Так совпало, что я оказался в том мире за неделю до его появления. Что ж, с этим я могу смириться."
      - "Но на этот раз он спустился раньше."
  - char: "madam_m"
    side: "right"
    text:
      - "И как думаешь, почему?"
  - char: "commander"
    side: "left"
    text:
      - "Всё потому, что сооружение Сирен изменилось в результате действий Сопротивления... нет, моих действий."
      - "Ещё во время операции по сбору материалов в Зильберштерне враг действовал как организованная единица."
      - "Думаю, Звёздный Зверь к тому времени уже вышел на наш след."
      - "Ремонт Вечных Звёзд и активация Стены Мидгарда ускорили его прибытие."
      - "С каждым нашим шагом и продвижением Звёздный Зверь становился всё осторожнее."
      - "Так что же такое Йормунганд?"
  - char: "madam_m"
    side: "right"
    text:
      - "Ты чертовски проницателен. Звёздный Зверь — это творение Экспериментальнго Отдела, а Йормунганд — то, что должно было уничтожить этого зверя."
  - char: "commander"
    side: "left"
    text:
      - "Ты имеешь в виду Обсервер... Тогда это тоже как-то связано с Икс?"
      - "Но Звёздный Зверь совсем не похож на Икс из моих воспоминаний."
  - char: "madam_m"
    side: "right"
    text:
      - "То, что вы называете экстрамерными существами, — это просто материальные проявления силы Икс."
      - "Хотя они и связаны с Икс, да, они не являются истинной формой Икс."
  - char: "commander"
    side: "left"
    text:
      - "Понятно... Но от этого опасность не становится менее реальной."
      - "Если Икс начали пробираться на тестовый полигон, почему вы, Арбитры, ничего с этим не делаете?"
  - char: "madam_m"
    side: "right"
    text:
      - "О? Что заставляет тебя быть таким уверенным, что я так близка к Арбитрам?"
  - char: "commander"
    side: "left"
    text:
      - "Не просто близка к ним, Мадам М."
      - "Ты сама Арбитр... Фокусник!"
  - char: "madam_m"
    side: "right"
    text:
      - "Хи-хи. И правда... Если бы я была Фокусником, то зачем бы я была здесь и пыталась помочь тебе пройти через всё это?"
  - char: "commander"
    side: "left"
    text:
      - "........."
  - char: "commander"
    side: "right"
    text:
      - "И если ты думаешь, что именно сооружение Сирен привлекло Звёздного Зверя, то давай, попробуй на этот раз уничтожить энергетическую башню."
      - "В конце концов, тебе ничего не угрожает, если он так и не появится."
  - char: "commander"
    side: "left"
    text:
      - "Не сработает."
      - "Людям свойственно стремиться к прогрессу. Когда-нибудь Звёздный Зверь снова почувствует угрозу и вернётся."
  - char: "madam_m"
    side: "right"
    text:
      - "Лишь в далёком будущем. Тебе не придётся беспокоиться об этом при жизни. Разве этого недостаточно для победы?"
  - char: "commander"
    side: "left"
    text:
      - "Тогда мир в конечном итоге постигнет та же участь, свидетелем которой я стал."
      - "Сирены уже потерпели неудачу во время его второго пришествия. Мы не можем быть уверены, что сможем противостоять ему, когда бы он ни вернулся."
      - "Что касается меня, то это наша последняя возможность избавиться от него."
  - char: "madam_m"
    side: "right"
    text:
      - "Я говорила это уже несколько раз. «Ты не можешь победить его. По крайней мере, не в твоём нынешнем состоянии»."
  - char: "commander"
    side: "left"
    text:
      - "И ты права. Не в нынешнем."
      - "Но как насчёт меня из прошлого? Или из будущего?"
  - text:
      - "Платок в моём нагрудном кармане начинает светиться. Кажется, чувства моих подруг струятся из него."
  - char: "commander"
    side: "left"
    text:
      - "Так вот почему ты забрала мои воспоминания."
      - "Не воображай, что сможешь контролировать меня вечно, Фокусник."

chapter2:
  rows:
  - text:
      - "Яркий свет вырывается из платка, окутывая весь класс."

chapter3:
  rows:
  - text:
      - "Когда он рассеивается, я обнаруживаю, что к нам присоединились две очень знакомые подруги."
  - char: "akagi"
    side: "right"
    text:
      - "Командир?!"
  - char: "memphis"
    side: "left"
    text:
      - "Командир?!"
  - char: "commander"
    side: "right"
    text:
      - "Мемфис... и Акаги?!"

chapter4:
  rows:
  - text:
      - "Туман в моём разуме рассеивается. Воспоминания о тестовом полигоне Бета и людях из Лазурного Пути возвращаются."
      - "Распечатанные воспоминания наводняют мой разум, смывая тёмные облака, скрывавшие лица моих друзей."
      - "Мой разум работает с такой скоростью, какой я никогда не испытывал."
  - char: "commander"
    side: "left"
    text:
      - "(Кубы Энергии, Кубы Мудрости, образец метеорита, Ватацуми...)"
      - "(Одержимость, иллюзии, души, перерождение...)"
      - "(Неужели?!)"
  - char: "memphis"
    side: "right"
    text:
      - "Наконец-то мы тебя нашли! Ты в порядке, Командир?!"
  - char: "commander"
    side: "left"
    text:
      - "Я в безопасности здесь. Как вам вообще удалось меня найти?"
  - char: "akagi"
    side: "right"
    text:
      - "Всё благодаря следящему магическому кругу, который подготовила Ямато."

chapter5:
  rows:
  - text:
      - "Девушки рассказали о том, что произошло после банкета."
  - char: "commander"
    side: "left"
    text:
      - "Без меня, оказывается, много чего произошло, да? Нам за многое стоит благодарить Ямато."
      - "И, конечно же, я должен поблагодарить вас двоих."
  - char: "memphis"
    side: "right"
    text:
      - "Вовсе нет. Это было необходимо."
  - char: "akagi"
    side: "left"
    text:
      - "Ты готов вернуться, Командир?"
  - char: "commander"
    side: "right"
    text:
      - "Пока нет. У меня здесь остались незавершённые дела."
      - "Но вы не волнуйтесь. Благодаря вашему приходу я увидел проблеск победы. Скоро я с триумфом вернусь в наш мир."
  - char: "akagi"
    side: "left"
    text:
      - "Победы? Триумфом? Командир, о чём ты говоришь?"
  - char: "commander"
    side: "right"
    text:
      - "Давайте пока опустим детали. Акаги, ты можешь рассказать мне, как использовать Ватацуми?"
  - char: "akagi"
    side: "left"
    text:
      - "Но ты уже подверг себя такой опасности, чтобы спасти меня... Ты должен лучше заботиться о себе!"
  - char: "commander"
    side: "right"
    text:
      - "Я знаю. В конце концов, мы обещали друг другу отправиться в путешествие вместе."
  - char: "akagi"
    side: "left"
    text:
      - "Командир..."
  - char: "commander"
    side: "right"
    text:
      - "Нет времени. Можешь кратко объяснить?"
  - text:
      - "На мгновение она смущается, но берёт себя в руки и учит меня, как использовать Ватацуми."
  - char: "commander"
    side: "right"
    text:
      - "(Значит, мысли и молитвы — неотъемлемая часть процесса... Неудивительно, что ей удалось воскресить Амаги.)"
      - "Понял. Спасибо."
      - "Находиться в магическом круге, должно быть, вредно для вас. Вы двое должны вернуться!"
  - char: "akagi"
    side: "left"
    text:
      - "Ни за что. Если мы разорвём связь с тобой сейчас, мы, возможно, больше никогда тебя не найдём."
  - char: "commander"
    side: "right"
    text:
      - "Ох... Тогда мне просто нужно, чтобы вы ещё немного подождали меня."
  - char: "memphis"
    side: "left"
    text:
      - "Я не знаю, что здесь происходит, но удачи, Командир. Мы не вернёмся домой без тебя!"

chapter6:
  rows:
  - text:
      - "После очередной вспышки света Мемфис и Акаги исчезли, как будто их здесь никогда и не было."
      - "Тем временем Мадам М садится на парту и наклоняется ко мне, глядя мне в глаза с расстояния всего в несколько дюймов."
  - char: "madam_m"
    side: "right"
    text:
      - "Теперь ты всё вспомнил?"
  - char: "commander"
    side: "left"
    text:
      - "Да. Всё."
  - char: "madam_m"
    side: "right"
    text:
      - "Какие у тебя милые друзья. Они гонялись за тобой до самого края земли и даже дальше."
      - "Ты и эти девочки практически неразлучны, не так ли?"
  - char: "commander"
    side: "left"
    text:
      - "Естественно."
      - "Разве ты этого не знала? Или просто притворилась, что не заметила платок?"
  - char: "madam_m"
    side: "right"
    text:
      - "Ох, даже не знаю. В любом случае, должна признать, что я впечатлена."
      - "Но хватит дискуссий. Пришло время тебе выбирать."
      - "Хочешь продолжить?"
  - char: "commander"
    side: "left"
    text:
      - "Хочу."
  - char: "madam_m"
    side: "right"
    text:
      - "Звучишь уверенно."
  - char: "commander"
    side: "left"
    text:
      - "Я не собираюсь решать свои проблемы, убегая от них."
      - "Бегство может выиграть тебе время, но рано или поздно тебе придётся столкнуться со своими страхами."
      - "Я не сдамся, пока стою на ногах."
      - "К тому же, я придумал стратегию, которая может сработать."
  - char: "madam_m"
    side: "right"
    text:
      - "Хи-хи. Мне не терпится увидеть, как ты попытаешься."
