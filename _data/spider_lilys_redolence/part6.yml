chapter1:
  rows:
  - text:
      - "В роскошной комнате отдыха две королевы наслаждались неспешным чаепитием."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Аха-ха... Отлично, этого и стоило ожидать от нашего великого детектива."
      - "Даже если историческая эпоха изменилась, имидж Скотленд-Ярда остался прежним..."
      - "Боже, могли бы и постараться!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "И не говори."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Никогда бы не подумала, что смогу прочитать новую главу романа таким вот образом."
      - "Ты обычно именно так, через эти газеты и журналы, получаешь новости с разных тестовых полигонов?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Неплохой выбор, не так ли?"
      - "Это не только сводит к минимуму наше вмешательство на различные полигоны, тем самым снижая риски."
      - "Но еще это удобно и весьма увлекательно."
      - "К тому же, за чашечкой чая всегда хочется что-нибудь почитать, верно?"
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Согласна."
      - "Скорее взгляни на эту статью: один бандит пытался совершить ограбление, но его целью оказался оружейный магазин..."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Пфф... И чем всё закончилось?"
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "В итоге... никто не пострадал, за исключением самого бандита, который был уничтожен."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ничего удивительного..."
  - char: "strange_machine"
    side: "left"
    text:
      - "Дзинь-дзинь-дзинь... Бум-бум-бум..."
      - "Клац-клац-клац... Тра-та-та..."
  - text:
      - "Внезапно раздавшиеся странные звуки нарушили расслабляющую атмосферу в комнате отдыха."
  - text:
      - "Экстренный сбор, цель обнаружена!"
      - "Бип-бип-бип... Хлоп-хлоп-хлоп..."
      - "Экстренный сбор, цель обнаружена!"
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "......"
      - "......?.."
      - "...А?"
  - text:
      - "Элизабет огляделась по сторонам и, наконец, обнаружила в углу дивана мигающую и вопящую плюшевую косатку."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "...Что это за штука?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Игрушка, которую оставила здесь Мисс D. Кажется, она определила место следующей охоты."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Она сделала это сама?.."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Сама."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "...Это даже слишком мило."
      - "Прямо как «человек»."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Чувствуешь, что стала понимать Мисс D немного лучше?"
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "........."
      - "...Просто жутко."
