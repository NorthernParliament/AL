chapter1:
  rows:
  - text:
      - "На скамейке, стоявшей на некотором расстоянии от главных ворот поместья, сидела девушка в белом. Подперев щеки руками, она в унынии о чем-то размышляла."
  - char: "zuikaku"
    side: "left"
    text:
      - "Не только Микаса... но и госпожа Нагато, и сестра — с ними тоже не удается связаться."
      - "Даже если у них появились срочные дела и они куда-то ушли... не может же быть, чтобы в поместье не осталось ни единой души."
      - "Да и по всему видно, что в доме кто-то есть. Там не только горит свет, но и..."
      - "Но и...... Э?.."
      - "Неужели Микасаа заново покрасила забор?.."
      - "Хм... раз уж на то пошло, разве дорога здесь раньше была в таком плохом состоянии?"
      - "А еще эти уличные ларьки с едой... Когда я была здесь в прошлый раз, я их совершенно не запомнила."
  - char: "nop"
    side: "right"
    text:
      - "Прости, сестрица, это я слишком долго собиралась!..."
  - char: "nop"
    side: "left"
    text:
      - "Мы опоздаем... и Микаса снова будет читать нам нотации..."
  - char: "nop"
    side: "right"
    text:
      - "Хе-хе... Не стоит спешить."
      - "Раз уж опоздания все равно не избежать, давай просто пойдем не спеша, безопасность превыше всего."
      - "Если из-за спешки макияж потечет, то получится, что мы опоздали зря."
  - text:
      - "Словно в трансе, девушка в белом услышала до боли знакомый голос."
      - "Она поспешно подняла голову и огляделась, наконец-то заметив на углу улицы два мелькнувших красных силуэта."
  - char: "zuikaku"
    side: "left"
    text:
      - "Э... этот голос только что, кажется, и правда был... но..."
      - "Н-не может быть..."
      - "Эй, подождите!"
  - text:
      - "Девушка в белом поспешно вскочила и со всех ног бросилась к углу, за которым скрылись красные силуэты."

chapter2:
  rows:
  - text:
      - "*Бац!*"
  - char: "zuikaku"
    side: "left"
    text:
      - "Ай-яй... больно-больно-больно..."
  - char: "nop"
    side: "right"
    text:
      - "Ты в порядке, девочка?"

chapter3:
  rows:
  - char: "mikasa"
    side: "right"
    text:
      - "Э... да это же Дзуйкаку. Куда ты так несешься, заблудилась, что ли?"
      - "Неудивительно, что я никак не могла дождаться тебя на перекрестке..."
  - char: "zuikaku"
    side: "left"
    text:
      - "Микаса?!"
      - "Что ты здесь делаешь?"
  - char: "mikasa"
    side: "right"
    text:
      - "...А? Я знала, что ты сегодня возвращаешься, поэтому специально пришла на перекресток встретить тебя."
      - "Дорога здесь не очень, да и в последнее время тут часто ведутся ремонтные работы."
  - char: "zuikaku"
    side: "left"
    text:
      - "Микаса, ты всё это время... ждала здесь?"
  - char: "mikasa"
    side: "right"
    text:
      - "Ну да, а что?"
  - char: "zuikaku"
    side: "left"
    text:
      - "(Странно... Я ведь точно шла по этой дороге, и тогда совершенно точно не видела Микасу...)"
      - "(И дорога вокруг... она изменилась по сравнению с тем, что было только что?!)"
      - "(И уличные торговцы исчезли?!)"
      - "(Неужели это...)"
      - "(......)"
      - "(...Раньше я бы, наверное, просто решила, что переутомилась и мне всё померещилось.)"
      - "(Но... пережитое  путешествие подсказывает мне, что увиденное только что — отнюдь не простая галлюцинация.)"
      - "(Неужели это... какая-то особая атака?)"
  - char: "mikasa"
    side: "right"
    text:
      - "Дзуйкаку, на тебе лица нет. Что-то случилось?"
  - char: "zuikaku"
    side: "left"
    text:
      - "Микаса, где сейчас госпожа Нагато и сестра?"
  - char: "mikasa"
    side: "right"
    text:
      - "Они обе ждут тебя в поместье, я велела им не выходить."
  - char: "zuikaku"
    side: "left"
    text:
      - "Фух, вот и отлично... Тогда давай скорее вернемся."
      - "Совсем недавно, прямо у ворот твоего поместья, я столкнулась с кое-чем совершенно необычным..."
      - "Я хочу немедленно вам обо всем рассказать!"
