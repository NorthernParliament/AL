chapter1:
  rows:
  - char: "littorio"
    side: "left"
    text:
      - "Прошу всех поднять бокалы..."
      - "Давайте выпьем за наши дипломатические успехи, до дна!"
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "За нас~"
  - char: "all"
    side: "left"
    text:
      - "До дна!"
  - text:
      - "В богато украшенном зале в самом разгаре шел закрытый банкет для девушек Империи Сардиния."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Конференция по объединению альянса, в которой мы выступаем координаторами, сейчас в самом разгаре."
      - "Успешное подписание договора с Ирис является лучшим доказательством того, что все стороны признают наш статус координатора."
      - "А также в полной мере демонстрирует наши дипломатические таланты."
      - "Я хочу искренне поблагодарить всех вас за внесенный вклад."
  - char: "littorio"
    side: "right"
    text:
      - "Хе-хе~ Теперь, как бы ни изменилась обстановка в будущем, мы точно будем готовы к любым сюрпризам."
  - char: "duca_degli_abruzzi"
    side: "left"
    text:
      - "Кажется, это первое дипломатическое соглашение, подписанное Ирис после объединения... И сразу такое весомое."
      - "Почему они выбрали именно нас?.."
  - char: "impero"
    side: "right"
    text:
      - "Разве не очевидно? Они наверняка разглядели потенциал нашей Империи Сардиния."
      - "Начиная с Всемирной выставки мы всё чаще заявляем о себе на международной арене, и наше влияние стремительно растет."
      - "И хорошие новости так и сыплются одна за другой."
      - "Кто знает, возможно, в будущем мы станем одной из самых могущественных сил в объединенном альянсе."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Того, чего мы достигли сегодня, не было бы без наших общих усилий, но это только начало."
      - "Ради будущего нашей Империи мы все должны продолжать усердно трудиться и не расслабляться."
  - char: "littorio"
    side: "right"
    text:
      - "Это само собой разумеется, само собой~"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Тогда давайте еще раз поднимем бокалы."
      - "За величие и возрождение Империи Сардиния!"
  - char: "littorio"
    side: "right"
    text:
      - "За Сардинию~"
  - char: "all"
    side: "left"
    text:
      - "До дна!"
