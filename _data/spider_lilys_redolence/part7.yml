chapter1:
  rows:
  - text:
      - "По вымощенной камнем дорожке сквозь море цветов пробирались два красных силуэта."
  - char: "akagi"
    side: "left"
    text:
      - "Сестрица~ Уже видно беседку!"
  - char: "amagi"
    side: "right"
    text:
      - "Кажется, праздник любования цветами уже начался..."
      - "Но места для нас еще остались, значит, мы не так уж сильно и опоздали."

chapter2:
  rows:
  - char: "amagi"
    side: "right"
    text:
      - "Прошу прощения, что заставили вас ждать."
  - char: "akagi"
    side: "left"
    text:
      - "Очень извиняемся, что заставили вас так долго ждать!"
  - char: "kamikaze_kai"
    side: "right"
    text:
      - "Вот видите, я же говорила, что госпожа Амаги сегодня хоть и опоздает, но ни за что не пропустит."
      - "Ты проиграла, гони сладости."
  - char: "jintsuu"
    side: "left"
    text:
      - "Я же тебе говорила, не спорь с ней."
  - char: "naka"
    side: "right"
    text:
      - "Уууу... Держи."
  - char: "houshou"
    side: "left"
    text:
      - "Госпожа Амаги, госпожа Акаги, добро пожаловать. Благодарим, что почтили нас сегодня своим присутствием."
  - char: "amagi"
    side: "right"
    text:
      - "Прости, что заставили тебя ждать, госпожа Хосё."
      - "Что-то не видно госпожи Микасы, она еще не прибыла?"
  - char: "houshou"
    side: "left"
    text:
      - "Микасу по пути перехватили и утащили на экстренное совещание."
      - "Я уж начала переживать, не постигла ли и тебя такая же «ужасная участь»..."
      - "Раз так, значит, в пути произошло что-то непредвиденное?"
  - char: "amagi"
    side: "right"
    text:
      - "Ну, как сказать..."
  - char: "kagabb"
    side: "left"
    text:
      - "Наверняка она просто слишком долго возилась с младшей сестрой дома."
      - "Сестра Амаги ведь известна тем, что с ней глаз да глаз нужен~"
      - "Хорошо еще, что Микаса не пришла, а то, увидев вашу непунктуальность, она бы точно прочитала вам нотации."
  - char: "akagi"
    side: "right"
    text:
      - "Эй!..."
      - "А ты-то, белобрысая старая карга, что здесь забыла?!.."
  - char: "kagabb"
    side: "left"
    text:
      - "То, что я получила приглашение, само собой разумеется~"
      - "А вот насчет кое-кого, кто пробрался сюда только благодаря своей сестрице, я бы так не сказала~"
  - char: "akagi"
    side: "right"
    text:
      - "Ах~ Так вот, значит, как Тоса получила свое приглашение~"
  - char: "tosa"
    side: "left"
    text:
      - "...Пожалуйста, не переносите огонь на невинных, спасибо."
  - char: "kagabb"
    side: "right"
    text:
      - "Ты... мы не виделись всего пару дней, а язычок у тебя стал куда острее!"
      - "Наверняка набралась этого у той ста..."
  - char: "amagi"
    side: "left"
    text:
      - "Мм?"
  - char: "kagabb"
    side: "right"
    text:
      - "Ста... старой интриганки Амаги!"
  - char: "амаги"
    side: "left"
    text:
      - "Ладно, давайте для начала присядем. Ты не против, госпожа Кага?"
  - char: "kagabb"
    side: "right"
    text:
      - "...С чего бы тебе спрашивать меня, располагайтесь как хотите."
  - char: "amagi"
    side: "left"
    text:
      - "Хе-хе~"
  - char: "akagi"
    side: "right"
    text:
      - "Бее~"
  - text:
      - "Девушка в красном скорчила рожицу и вслед за Амаги направилась к своему месту."
      - "Виляющие из стороны в сторону хвосты выдавали ее триумфальное настроение."

chapter3:
  rows:
  - text:
      - "Усевшись, девушка в красном обнаружила, что находится посреди моря цветов."
  - char: "amagi_d?"
    side: "left"
    text:
      - "Акаги, по пути я сорвала для тебя цветок."
      - "Посмотри, что это?"
  - text:
      - "Прямо в чайной чашке девушки распустился мазок киновари."
  - char: "akagi"
    side: "right"
    text:
      - "Этот цветок... неужели это паучья лилия?"
  - char: "amagi_d?"
    side: "left"
    text:
      - "Верно."
      - "Паучья лилия — прекрасная, броская, ядовитая."
      - "Прямо как ты, не так ли?"
  - char: "akagi"
    side: "right"
    text:
      - "Прямо как я..."
  - char: "amagi_d?"
    side: "left"
    text:
      - "Пусть паучьи лилии заполнят весь мир, пусть этот мазок киновари воспламенит его."
      - "...Моя сестренка."
