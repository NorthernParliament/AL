chapter1:
  rows:
  - text:
      - "Это был небольшой пригородный городок, вдали от городского шума."
      - "Заурядный, тихий, окруженный прекрасной природой."
  - char: "sheffild_cloak"
    side: "left"
    text:
      - "Ни тайных подземелий, ни аномальных радиоволн, ни подозрительных лиц..."
      - "Значит, и здесь пусто?.."
      - "Тц... Ни разведданных, ни зацепок. Ситуация, когда приходится искать иголку в стоге сена, уповая лишь на удачу, ужасно раздражает."
      - "Командир внезапно так сильно сблизился с верхами Ирис..."
      - "Либо его чем-то шантажируют, либо обе стороны разделяют какой-то критически важный секрет..."
      - "Что бы это ни было, я должна как можно скорее во всем разобраться..."
      - "Клемансо — крайне опасная женщина. Командир, совершенно не осознавая угрозы, словно овца, сам лезет хищнику в пасть..."
      - "...Мм?"

chapter2:
  rows:
  - char: "joffre"
    side: "right"
    text:
      - "Мисс Шеффилд, не ожидала встретить тебя здесь."
  - char: "sheffild_cloak"
    side: "left"
    text:
      - "...Жоффр."
  - char: "joffre"
    side: "right"
    text:
      - "Мисс Шеффилд, разве ты не должна отвечать за безопасность делегации Королевского Флота на конференции?"
      - "Что привело тебя в этот отдаленный городок?"
  - char: "sheffild_cloak"
    side: "left"
    text:
      - "Ваш Трибунал блестяще справляется с охраной, так что мне там совершенно нечем заняться."
      - "Поэтому я решила прогуляться по местным достопримечательностям и насладиться туризмом за казенный счет."
  - char: "joffre"
    side: "right"
    text:
      - "Хе-хе, благодарю за высокую оценку работы Трибунала."
      - "Однако отлынивание от работы мы не поощряем."
      - "Но, конечно же, мисс Шеффилд — наша гостья, и я очень рада, что тебя заинтересовали красоты Ирис."
      - "Наша встреча — не иначе как судьба. Поблизости есть одно место, которое мне очень нравится. Не хочешь составить мне компанию?"
      - "Я с удовольствием побуду твоим личным экскурсоводом."
