chapter1:
  rows:
  - text:
      - "Еще совсем недавно это место было не более чем обычным девственным лесом, которых полно на территории Врат Авалона."
      - "Но теперь оно превратилось в функциональную зону Врат Авалона, не уступающую по своему величию Двору Камелота — «Район Белой Розы»."
      - "Помимо замков и садов, главной особенностью Района Белой Розы стал возвышающийся до небес направленный портал в форме Тауэрского моста."
      - "Благодаря этому порталу Куин Элизабет и все, кто получил ее разрешение, могут безопасно, быстро и совершенно незаметно для окружающих перемещаться между двумя его концами."

chapter2:
  rows:
  - char: "vampire_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Тестовый полигон Бета, а вот и мы~"
      - "Ого, в Районе Белой Розы и правда повсюду цветут белые розы... Со вкусом."
      - "Нас не было всего ничего, а строительство здесь продвигается на удивление быстро."
      - "Однако... раз уж мы планируем задержаться здесь надолго."
      - "Я бы хотела, чтобы они построили еще и Район Вечной Ночи~"
  - char: "erebus_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Поддерживаю."
      - "Тогда мне нужен Район Безмолвного Забвения."
  - char: "hunter_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Мы здесь не на курорте, у нас вообще-то важные дела."
  - char: "vampire_meta"
    side: "right"
    status: "is-meta"
    text:
      - "А разве на деле это не похоже на отпуск?.."
      - "Передать кое-какие технологии, обновить оснастку, потренировать местных..."
      - "Никакого вызова в такой работенке."
  - char: "hunter_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Здесь есть сильные противники, с которыми стоит скрестить клинки..."
  - char: "vampire_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Сильные... а, ты про тех двух старых знакомых Шеффилд."
      - "Неудивительно, что в этот раз она наотрез отказалась идти с нами..."
  - char: "erebus_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Тшш... она просила нас хранить секрет, забыла?"
      - "Я не хочу, чтобы в первый же день нашего прибытия произошло убийство."
  - char: "vampire_meta"
    side: "right"
    status: "is-meta"
    text:
      - "А, твоя правда."
  - char: "erebus_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ладно... Встречающие уже здесь, давайте не будем выставлять себя на посмешище."

chapter3:
  rows:
  - char: "hood"
    side: "left"
    text:
      - "Добро пожаловать во Врата Авалона, наши прибывшие издалека союзники."
  - char: "erebus_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Не ожидала, что ты лично придешь нас встретить. Для меня большая честь познакомиться с тобой, леди Худ."
  - char: "vampire_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Добрый день, леди Худ~ В этот раз ты привела с собой весьма интересных особ, чтобы встретить нас."
  - char: "vampire"
    side: "right"
    text:
      - "Ху-ху-ху, тех, кто шествует в ночи, прибавилось."
      - "Так ты — это другая я?"
  - char: "vampire_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Именно так~ И какие впечатления от моего облика?"
  - char: "vampire"
    side: "right"
    text:
      - "Это просто мой идеальный, совершенный образ~"
      - "Я тоже хочу себе такую экипировку~"
      - "Эй, а как ты стала МЕТА, не расскажешь мне~?"
  - char: "vampire_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хо-хо-хо, это же самый большой секрет каждой из нас, просто так я тебе его не раскрою."
  - char: "vampire"
    side: "right"
    text:
      - "И~ какую же цену мне придется заплатить?"
  - char: "vampire_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хм, дай-ка подумать~"
      - "Как насчет того, чтобы обменять это на кое-какую интересующую меня информацию?"
  - char: "hood"
    side: "right"
    text:
      - "Хе-хе, похоже, вы уже начали находить общий язык."
  - char: "hunter_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Уже начали заключать темные сделки."
  - char: "newcastle"
    side: "right"
    text:
      - "Леди Худ."
  - char: "hood"
    side: "left"
    text:
      - "Да."
      - "Дамы, сейчас как раз время послеобеденного чая. Я уже всё подготовила, почему бы нам не поболтать за столом?"
  - char: "vampire_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Отлично-отлично! Тогда я заказываю малиновое мороженое с огромным количеством кроваво-красных элементов~"
  - char: "hunter_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Уже начала делать заказы."
      - "Эребус, а эта курортная атмосфера... это вообще нормально?.."
  - char: "erebus_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Здесь мирное место. Мне это не претит."
      - "Так что... немного расслабиться тоже неплохо."
  - char: "hood"
    side: "left"
    text:
      - "Хе-хе, во Вратах Авалона наконец-то становится оживленно..."
