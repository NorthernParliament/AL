chapter1:
  rows:
  - char: "harbin"
    side: "left"
    text:
      - "«Падение Чжуцюэ с девяти небес»... Не ожидала, что предсказание Хуань Чан так быстро сбудется наполовину."
      - "Тут нельзя не восхититься..."
  - char: "chian"
    side: "right"
    text:
      - "Это да, сейчас ситуация в Антарктике обострилась до невообразимых масштабов."
      - "Судя по всему, из-за того, что Мейнфрейм Обсервер находится в опасности, армии Сирен со всех акваторий в данный момент стягиваются к Антарктике."
      - "Они одновременно возводят круговую линию обороны во многих местах, намереваясь взять в кольцо весь континент."
      - "В то же время таинственный кукловод, стоящий за этими событиями, похоже, и не думает сдаваться. Битвы в Антарктике продолжаются."
      - "Вот только как там обстоят дела на самом деле — неизвестно..."
  - char: "yat_sen"
    side: "left"
    text:
      - "Верно. На данный момент Командование эвакуировало весь персонал из зоны боевых действий в Антарктике и приостановило любую научно-исследовательскую деятельность."
      - "Союз Орла, Королевский Флот, а также Железная Кровь, которая сама вызвалась присоединиться к операции, совместно развернули свои силы за пределами линии обороны Сирен."
      - "Они следят за ходом битвы в Антарктике и одновременно предотвращают возможное распространение угрозы за ее пределы."
  - char: "an_shan"
    side: "right"
    text:
      - "...Какая нестабильная и коварная ситуация. Кто бы мог подумать, что всегда спокойная Антарктика в мгновение ока превратится в нечто подобное."
      - "Наш план по строительству исследовательской станции... тоже придется отложить на неопределенный срок."
  - char: "yat_sen"
    side: "left"
    text:
      - "Очень жаль, но с этим ничего не поделаешь."
      - "К тому же, не только в Антарктике — по всем морям мира Сирены приступили к серии новых развертываний."
      - "В акваториях, которые ранее были ими покинуты, вновь появились патрульные флоты Сирен."
      - "Это коснулось даже Океана NA, контроль над которым Командование полностью вернуло после уничтожения Мейнфрейма Компилятора."
      - "Согласно разведданным, предоставленным Командованием, модели этих патрулей остались прежними, но их искусственный интеллект значительно возрос."
      - "Они не только активно избегают боев, но и, будучи втянутыми в сражение, демонстрируют совершенно иные тактические способности, нежели раньше."
      - "Словно в любое время и в любом месте ими напрямую управляет некая невидимая высокоранговая Сирена."
  - char: "an_shan"
    side: "right"
    text:
      - "Неужели Мейнфрейм Компилятора был восстановлен?.."
  - char: "yat_sen"
    side: "left"
    text:
      - "У меня тоже были такие подозрения, но в данных Командования нет ни одного рапорта об обнаружении Компилятора."
      - "Вернее будет сказать, в отчетах не упоминается ни одна высокоранговая Сирена вообще."
      - "В различных акваториях активны лишь пешки и корабли серийного производства. Похоже, весь Исследовательский Отдел Сирен просто исчез."
      - "Генеральный штаб полагает, что исчезновение Пьюрифайер, Тестер и других высокоранговых Сирен — результат того, что Обсервер сосредоточила свои основные силы в Антарктике."
      - "А повышение интеллекта и изменение поведенческих паттернов обычных сил Сирен во внешних водах может быть связано со сменой того, кто ими управляет."
      - "Вполне вероятно, что Обсервер, полностью сосредоточившись на сражении в Антарктике, передала права на управление внешними водами другой высокоранговой Сирене."
      - "И этой высокоранговой Сиреной с большой долей вероятности может быть Арбитр — кто-то из тех, с кем мы уже сталкивались, или же тот, кого мы еще не встречали."
  - char: "an_shan"
    side: "right"
    text:
      - "Анализ Генерального штаба звучит весьма убедительно..."
  - char: "harbin"
    side: "left"
    text:
      - "Арбитр, способная улучшить характеристики всех серийных Сирен и пешек по всему миру?.."
      - "Похоже, мы столкнулись с невероятно грозным противником..."
  - char: "yat_sen"
    side: "right"
    text:
      - "Что еще хуже, вокруг Великого шторма тоже появились плотные скопления патрулей Сирен."
      - "Кажется, они наконец-то заметили, что мы анализируем Великий шторм, и пытаются принять ответные меры."
      - "Все признаки указывают на то, что другое событие, упомянутое в предсказании  Хуань Чан, принесет с собой неопределенность, далеко выходящую за рамки наших прошлых прогнозов."
      - "Ситуация может принять крайне дурной оборот."
  - char: "harbin"
    side: "left"
    text:
      - "Я поняла. Ты позвала нас с Ань Шань сегодня, чтобы поручить нам новое задание."
  - char: "yat_sen"
    side: "right"
    text:
      - "Верно. В связи с изменением обстановки Генеральный штаб решил приостановить текущие операции, которые выполняете ты и Ань Шань."
      - "На ближайшее время вы присоединитесь к флоту анализа шторма Восточного моря под командованием Чи Ань."
      - "Кроме того, Ань Шань, вы получили особое разрешение."
      - "В случае возникновения непредвиденных ситуаций на передовой вы можете, исходя из обстоятельств, самостоятельно решать, применять ли передовое оборудование."
  - char: "chian"
    side: "left"
    text:
      - "Вот такие дела. Рассчитываю на вашу помощь и нашу слаженную работу в ближайшее время~"
