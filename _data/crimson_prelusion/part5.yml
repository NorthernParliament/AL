chapter1:
  rows:
  - text:
      - "База Союза Орла в Нью-Йорке погрузилась в хаос."
      - "От привычно упорядоченной рабочей обстановки не осталось и следа. Персонал носился туда-сюда, шумел и суетился, пытаясь выполнить свои задачи."
      - "Посреди всего этого хаоса Саратога хмурила брови, изо всех сил стараясь сохранять спокойствие и навести порядок — или, по крайней мере, попытаться осмыслить ситуацию."
  - char: "saratoga"
    side: "left"
    text:
      - "От острова Пасхи до баз AF и PH... Повсюду творятся одни и те же странности..."
      - "Штаб тоже не может ни с чем определиться! Что это? Ошибка? Сбой передачи данных? Или вообще ничего?!"
      - "Так я в это и поверила! В Тихом Океане полный бардак! Не говорите мне, что там ничего не происходит!"
      - "Угх... Если бы только на базе SD сейчас не шла передача полномочий... Если бы Миссури не была на пути в DC, а Йорктаун не была в отъезде..."
      - "Время хуже не придумаешь..."
      - "Но в то же время жалобы ничего не решат! Мне нужно искать ответы!"
  - char: "allen_m_sumner"
    side: "right"
    text:
      - "Эй, Сара, я нашла ещё один отчёт, на который тебе стоит взглянуть."
  - char: "saratoga"
    side: "left"
    text:
      - "Снова из Тихого Океана?"
  - char: "allen_m_sumner"
    side: "right"
    text:
      - "На этот раз нет. Это от Панамского канала."
  - char: "saratoga"
    side: "left"
    text:
      - "Из Панамы?! Дай мне посмотреть, живо!"
      - "Они... проводят церемонию в честь победы над Сиренами?"
      - "Не припомню, чтобы в последнее время там проходили какие-то крупные сражения... Можешь попросить Интрепид проверить?"
  - char: "allen_m_sumner"
    side: "right"
    text:
      - "Поняла!"
  - char: "indianapolis"
    side: "left"
    text:
      - "Сара, у меня тоже есть отчёт."
  - char: "saratoga"
    side: "right"
    text:
      - "Спасибо, но мы сейчас по уши в работе. Пожалуйста, приноси только отчёты с наивысшим приоритетом."
  - char: "indianapolis"
    side: "left"
    text:
      - "У него И ЕСТЬ наивысший приоритет. К тому же из Европы."
  - char: "saratoga"
    side: "right"
    text:
      - "Подожди, из Европы?"
  - char: "indianapolis"
    side: "left"
    text:
      - "Ага."
  - char: "saratoga"
    side: "right"
    text:
      - "Но там же сейчас Командир... Покажи его мне!"

chapter2:
  rows:
  - char: "saratoga"
    side: "right"
    text:
      - "О боже мой... Даже Европа не спаслась от этого..."
      - "Да что вообще происходит? Они там все спят, что ли?"
      - "Если только... Точно! Что, если они находятся под воздействием массовой ментальной атаки, как это было на Всемирной выставке?"
      - "И... Командир был переведён в Империю Дракона? Фух. По крайней мере, там должно быть безопасно."
  - char: "communicator"
    side: "left"
    text:
      - "БИП-БИП!"
  - char: "saratoga"
    side: "right"
    text:
      - "Что на ЭТОТ раз?!"
  - char: "aylwin"
    side: "left"
    text:
      - "Ой! Надеюсь, я не невовремя..."
  - char: "saratoga"
    side: "right"
    text:
      - "Прости, я просто на взводе. У тебя есть новости?"
  - char: "aylwin"
    side: "left"
    text:
      - "Да. DC наконец-то ответил нам."
  - char: "saratoga"
    side: "right"
    text:
      - "Слава богу! Что сказала Айова?"
  - char: "aylwin"
    side: "left"
    text:
      - "Ну, эм, ответила не Айова..."
  - char: "saratoga"
    side: "right"
    text:
      - "Не она? Странно. Я писала лично ей... Неважно, перешли это мне!"

chapter3:
  rows:
  - char: "saratoga"
    side: "right"
    text:
      - "Что? «Айова занята делегацией из Империи Сакуры и некоторое время не сможет помогать в других миссиях»?"
      - "Но... разве эта делегация не уехала пять дней назад? Как она ВСЁ ЕЩЁ может быть ими занята?"
      - "И как ЭТО может быть важнее, чем ТО, что происходит сейчас?"
      - "Угх... Чувствую, как начинает болеть голова..."
  - char: "baltimore"
    side: "left"
    text:
      - "Эй, Сара..."
  - char: "saratoga"
    side: "right"
    text:
      - "Да? Какие плохие новости на этот раз?"
  - char: "baltimore"
    side: "left"
    text:
      - "Мы... потеряли связь с Морем Звёзд."
  - char: "saratoga"
    side: "right"
    text:
      - "Подожди, что?"
      - "Нет... Даже они не избежали этого..."
      - "Но как? Его местоположение засекречено, системы защиты самые передовые, и там дислоцированы одни из наших лучших людей..."
      - "И... там находится медицинская капсула Лекс..."
      - "Нет! Я не могу допустить, чтобы с Морем Звёзд что-то случилось!"
  - text:
      - "Она повесила трубку, спрятала секретные документы в свой шкафчик, а затем поспешила вниз по лестнице на подземный уровень."

chapter4:
  rows:
  - text:
      - "Вслед за инцидентом с угрозой наложения Союз Орла заполучил ключевые компоненты — местные образцы из Ортодоксии и разведданные о её системе микрослойного перемещения, — необходимые для того, чтобы наконец приступить к исследованию технологий телепортации Сирен."
      - "Одним из плодов этих изысканий стал Звёздный мост — высокоскоростная сеть, напрямую соединяющая базу в Нью-Йорке с Морем Звёзд."
      - "Именно туда и направлялась Саратога — к подземному мосту надежды."
  - char: "saratoga"
    side: "left"
    text:
      - "Они откалибровали Звёздный мост... Он должен перенести меня прямо в Море Звёзд!"
  - text:
      - "Пламя надежды в сердце подстёгивало её, заставляя бежать ещё быстрее."

chapter5:
  rows:
  - char: "portland"
    side: "left"
    text:
      - "А? Саратога? Я думала, ты занята наверху, в командном центре."
  - char: "saratoga"
    side: "right"
    text:
      - "Звёздный мост готов? Его можно запустить прямо здесь и сейчас?"
  - char: "portland"
    side: "left"
    text:
      - "Что? Что ещё за «Звёздный мост»?"
  - char: "saratoga"
    side: "right"
    text:
      - "Машина, открывающая портал прямиком в Море Звёзд! Что же ещё!"
  - char: "portland"
    side: "left"
    text:
      - "«Море Звёзд»? Что это такое? Ты говоришь как-то бессвязно. Может, позвать тебе врача?"
  - char: "saratoga"
    side: "right"
    text:
      - "(О нет... Ментальная атака добралась и до людей в Нью-Йорке!)"
      - "(А мы до сих пор ничего о ней не выяснили!)"
      - "(Море Звёзд — ключ к тому, чтобы переломить ситуацию... Мне НУЖНО попасть туда!)"

chapter6:
  rows:
  - text:
      - "Саратога добралась до помещения, где находился Звёздный мост."
      - "Внутри, однако, ничего не оказалось. Лишь пустая комната."
  - char: "saratoga"
    side: "left"
    text:
      - "Неужели... ментальная атака наконец добралась и до меня?"
      - "Нет, всё ещё не кончено! Даже если она стирает Звёздный мост из моего сознания, она не может просто взять и вычеркнуть его из реальности!"
      - "Пусть я не вижу и даже не чувствую его, он ДОЛЖЕН быть здесь, а по ту сторону обязано быть Море Звёзд!"
      - "Если мои догадки верны, нужно просто найти способ активировать его!"
  - text:
      - "Полагаясь исключительно на память, она протянула руки к пустому пространству перед собой, нажимая кнопки и клавиши на несуществующей панели."
      - "После долгих манипуляций наугад она наконец различила слабый шум запускающегося механизма."
  - char: "saratoga"
    side: "left"
    text:
      - "Получилось! Теперь нужно лишь шагнуть в портал!"
  - text:
      - "Она подошла к платформе портала и посмотрела вниз — там зияла лишь бездонная пропасть."
  - char: "saratoga"
    side: "left"
    text:
      - "Решила меня напугать, да?"

chapter7:
  rows:
  - text:
      - "Она замерла на краю бездны, закрыв глаза."
  - char: "saratoga"
    side: "left"
    text:
      - "Всё это просто иллюзия..."
      - "Проход прямо здесь. Нужно просто сделать шаг вперёд, добраться до Моря Звёзд и увидеть Лекс!"
      - "Не бойся, Сара!"
  - text:
      - "Но едва она сделала шаг навстречу бездне, колоссальная сила словно остановила её на месте."

chapter8:
  rows:
  - text:
      - "Когда она вновь открыла глаза, то обнаружила, что стоит посреди оживлённого торгового квартала."
      - "Неподалёку, прямо на главной улице, стояла та, кто её ждал."
  - char: "lexington"
    side: "left"
    text:
      - "Вот и ты, Сара."
      - "Я заждалась тебя. Всё прошло гладко?"
  - char: "saratoga"
    side: "right"
    text:
      - "......."
      - "Лекс... Ты здесь?.."
