chapter1:
  rows:
  - text:
      - "В воздухе над Скапа-Флоу ревели сирены."
      - "И всё же никто здесь не готовился к бою. Напротив, многие снимали головные уборы в знак уважения."
      - "Это была не битва, а церемония в память о ней."

chapter2:
  rows:
  - char: "king_george_v"
    side: "left"
    text:
      - "Спасибо всем за ваши мысли и молитвы."
      - "Мы вновь собрались здесь в этом году, чтобы отдать дань уважения нашим товарищам, павшим при обороне Скапа-Флоу."
      - "Хотя эта битва давно миновала, мужество, проявленное здесь нашими солдатами, продолжает вдохновлять нас."
      - "Корабли, которые мы потеряли, всё ещё покоятся на морском дне, безмолвно повествуя о случившемся."
      - "В тот день Королевский Флот, Железная Кровь и Империя Сакуры объединились против Сирен, отбросив их и защитив нашу великую родину."
      - "Мы одолели Компилятор, доказав, что человечество выстоит. Эти руины, что вы видите перед собой — её последнее деяние."
      - "Это не просто останки с поля боя, но и доказательство наших нерушимых уз."
      - "Я искренне надеюсь, что наша дружба продлится вечно."
  - text:
      - "Вдохновляющая речь с церемониальной трибуны продолжалась."

chapter3:
  rows:
  - text:
      - "В туристической зоне Скапа-Флоу расположен огромный роскошный отель. Именно там каждый год после церемонии памяти проводится вечеринка."
      - "одят легенды, что после окончания битвы героини всех трёх фракций устроили здесь своё собственное празднование."
  - char: "lutzow"
    side: "left"
    text:
      - "*зевает* Я вымоталась. Это был долгий день."
      - "Сейчас набью живот, заряжу батарейки и отрублюсь за полсекунды, как только доползу до кровати."
  - char: "amagi"
    side: "right"
    text:
      - "Хи-хи. Я погляжу, ты и правда знаешь, как расслабляться после тяжелого рабочего дня."
  - char: "lutzow"
    side: "left"
    text:
      - "Ага. Отдых — моё второе имя."
  - char: "king_george_v"
    side: "right"
    text:
      - "Я бы хотела поблагодарить вас обеих за то, что проделали такой долгий путь."
      - "В особенности тебя, Амаги. От лица всего Королевского Флота благодарю за то, что посещаешь эту церемонию каждый год."
  - char: "amagi"
    side: "left"
    text:
      - "Тебе не за что меня благодарить. Стыдно признаться, но отчасти я приезжаю сюда ради того, чтобы отдохнуть от работы дома."
      - "Хотя, конечно же, главная причина — это всегда встреча со старыми друзьями."
  - char: "warspite"
    side: "right"
    text:
      - "Для меня тоже. Давайте выпьем! За старых друзей!"
  - char: "amagi"
    side: "left"
    text:
      - "За старых друзей!"
  - char: "lutzow"
    side: "right"
    text:
      - "За старых друзей!"
  - char: "king_george_v"
    side: "left"
    text:
      - "Ход войны меняется в нашу пользу. В настоящее время мы готовим масштабную контратаку, и были бы очень признательны за вашу помощь в её проведении."
  - char: "lutzow"
    side: "right"
    text:
      - "Можешь на нас рассчитывать. Перед отъездом Фридрих велела нам согласиться помочь, если ты заведёшь разговор о контратаке."
  - char: "amagi"
    side: "left"
    text:
      - "Сакуры тоже окажет тебе поддержку. Позволь теперь мне сказать тост. За нашу дружбу!"
  - char: "warspite"
    side: "right"
    text:
      - "За нашу дружбу!"
  - char: "lutzow"
    side: "left"
    text:
      - "За нашу дружбу!"
  - char: "king_george_v"
    side: "right"
    text:
      - "За нашу дружбу!"

chapter4:
  rows:
  - char: "communicator"
    side: "right"
    text:
      - "Бип-Бип!"
  - char: "monarch_rad"
    side: "left"
    text:
      - "Проклятье. Я так и знала, что связаться с внешним миром будет не так-то просто."
      - "Вангард, есть успехи?"
  - char: "vanguard_rad"
    side: "right"
    text:
      - "Боюсь, что нет. «Не удалось построить проход: не удалось определить координаты выхода». Я перезапускала его снова и снова, но каждый раз одно и то же."
  - char: "vampire"
    side: "left"
    text:
      - "Мы не можем ни связаться с внешним миром, ни выбраться отсюда. Мы чертовски застряли в Камелоте!"
  - char: "glasgow"
    side: "right"
    text:
      - "Они ДОЛЖНЫ послать спасательный флот, как только поймут, что потеряли с нами связь."
  - char: "hunter_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Лично мне не хочется сидеть сложа руки, пока не прибудет помощь."
      - "Телепорт не может найти координаты выхода, хотя внутри ничего не изменилось. Это значит, что проблема снаружи."
      - "Может быть, они в таком же положении, как и мы, и не могут воспользоваться вратами со своей стороны."
      - "В худшем случае... мы, возможно, стали для них ненаблюдаемыми."
  - char: "glasgow"
    side: "right"
    text:
      - "Но тогда... разве нам не крышка?!"
  - char: "hunter_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я лишь предполагаю. Не то чтобы я знала, как эта штука работает."
      - "Я просто говорю, что это ВОЗМОЖНО."
  - char: "vanguard_rad"
    side: "right"
    text:
      - "Её Величество знает врата лучше, чем кто-либо... но сейчас она в Европе, и мы явно не можем с ней связаться."
  - char: "vampire"
    side: "left"
    text:
      - "А как насчёт Её META Величества?"
  - char: "vampire_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Не вариант. Она взошла на борт «Света Королевы» и отправилась бог знает куда, где до неё не добраться. Как она частенько и делает."
  - char: "glasgow"
    side: "left"
    text:
      - "Тогда что нам делать?"
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "У меня есть одна идея."
      - "Если за пределами тестового полигона бета возникли проблемы, мы могли бы перенести Камелот в место, которое находится чуть дальше. Тогда мы, возможно, поймём, что происходит."
  - char: "vanguard_rad"
    side: "left"
    text:
      - "Однако Её Величество ясно приказала нам не использовать врата без её разрешения."
  - char: "hunter_meta"
    side: "right"
    status: "is-meta"
    text:
      - "И как, скажи на милость, мы должны ПОЛУЧИТЬ это чёртово разрешение, а?"
  - char: "vanguard_rad"
    side: "left"
    text:
      - "Я понимаю твою точку зрения, но всё же..."
  - char: "vampire_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Нам даны мозги как раз для таких случаев. Давай, мы готовы выслушать альтернативные идеи."
  - char: "vanguard_rad"
    side: "left"
    text:
      - "Ну... Её Величество ДЕЙСТВИТЕЛЬНО говорила, что у меня есть разрешение использовать врата один раз в случае чрезвычайной ситуации, но..."
  - char: "vampire_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хочешь сказать, что это НЕ чрезвычайная ситуация?"
  - char: "vanguard_rad"
    side: "left"
    text:
      - "Ты права. Это она и есть. Другого выхода нет!"
      - "Тогда вводите координаты, и я сразу же активирую врата."
  - char: "vampire_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Эм..."
  - char: "hunter_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Э-э..."
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Ну..."
  - char: "vanguard_rad"
    side: "left"
    text:
      - "Ради всего святого... Неужели никто из вас не знает, как вводить координаты?"
  - char: "hunter_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Бои и охота — мои сильные стороны, а не управление телепортами."
  - char: "vampire_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я была слишком занята настройкой обороны в Блоке Розы, чтобы изучать подобные вещи."
      - "А как насчёт вас, Рипалс и Ринаун? Вы прибыли сюда раньше всех нас."
  - char: "repulse_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Мы ВЫГЛЯДИМ так, будто знаем, как эта штука работает? То, что мы прибыли первыми, не делает нас автоматически экспертами."
  - char: "vanguard_rad"
    side: "left"
    text:
      - "Угх. Замечательно... Значит, Её Величество, скорее всего, единственная, кто знает как."
      - "Её разрешение ничего не значит, если мы не умеем пользоваться этой чёртовой штуковиной."
  - char: "monarch"
    side: "right"
    text:
      - "Я сделаю это."
      - "Я уже вводила в него координаты однажды и более-менее знаю, как работает эта машина."
  - char: "vanguard_rad"
    side: "left"
    text:
      - "Только потому, что ты была такой безрассудной тогда..."
      - "И всё же не всё так просто. Все сохранённые координаты были стёрты."
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Похоже, у нас нет другого выбора. Мы должны пробить брешь во внешнем барьере."
  - char: "vanguard_rad"
    side: "left"
    text:
      - "Нет, нет, НЕТ! Даже не думай об этом, Ринаун!"
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Хм. Как скажешь."
  - char: "vampire_meta"
    side: "left"
    text:
      - "Простое ожидание кажется нашим лучшим вариантом. Либо Наше Величество вернётся, либо ваше пошлёт спасательный флот."
  - char: "vanguard_rad"
    side: "right"
    text:
      - "Наш лучший и ЕДИНСТВЕННЫЙ вариант. Угх... Возвращайтесь на свои посты и возобновите работу."
