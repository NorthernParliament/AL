chapter1:
  rows:
  - text:
      - "Тёмные облака. Песня чёрной стали звучала над морем, пока разворачивалась безжалостная погоня."
  - char: "renown"
    side: "right"
    status: "is-red"
    text:
      - "Я Ринаун, линейный крейсер Соединения H Королевского Флота! Я здесь из-за вашей засады на наши корабли! Немедленно прекратите бессмысленное сопротивление!"
      - "Самые боеспособные корабли Королевской Семьи направляются сюда! Я не позволю тебе сбежать!"
  - char: "ark_royal"
    side: "left"
    status: "is-red"
    text:
      - "Она... не сопротивляется так, как я ожидала."
      - "Неважно. От меня она не уйдёт!"
      - "Сделаем в точности так, как сказала Кинг Джордж V, и замедлим её!"
      - "«Суордфиши», на взлёт! Атаковать Бисмарк!"

chapter2:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "bismarck"
    side: "left"
    text:
      - "Торпеды... из слепой зоны?.."
      - "Я не... смогу уклониться от них вовремя!.."
  - text:
      - "БАБАХ!!!"
  - char: "king_george_v_rad"
    side: "right"
    status: "is-red"
    text:
      - "Это конец, Бисмарк."
      - "По указу Королевы ты должна сложить оружие и пойти с нами. Тебя ждёт справедливый суд."
  - char: "bismarck"
    side: "left"
    text:
      - "Мои двигатели потеряли мощность, и операция провалилась... Всё кончено."
  - char: "tester"
    side: "right"
    status: "is-red"
    text:
      - "Мисс Бисмарк... Ты чуть не лишилась жизни, и всё же до сих пор отказываешься использовать «это»?"
  - char: "bismarck"
    side: "left"
    text:
      - "Мне не нужна помощь от таких, как ты..."
  - char: "tester"
    side: "right"
    status: "is-red"
    text:
      - "Всё ещё строишь из себя крутую даже в таком состоянии? Ты могла бы так легко отправить своих врагов на дно морское. Всё, что тебе было нужно — это немного... решимости."
  - text:
      - "БАБАХ!!!"
  - char: "friedrich_der_grosse"
    side: "left"
    text:
      - "Какой ужасный диссонанс."
      - "Бисмарк уже ясно выразила свою волю, Сирена. Ты не часть этого оркестра."
  - char: "amagi"
    side: "right"
    text:
      - "Прости, что так долго, Бисмарк. Ты в порядке?"
  - char: "bismarck"
    side: "left"
    text:
      - "Фридрих... Ты — кто ты такая?"
  - char: "amagi"
    side: "right"
    text:
      - "Я Амаги. Ты помнишь меня?"
  - char: "bismarck"
    side: "left"
    text:
      - "Если я правильно помню, ты старшая сестра Акаги."
      - "Что это за флот вон там? Почему он такой чёрный?"
  - char: "amagi"
    side: "right"
    text:
      - "Это мой флот поддержки. Подкрепление с твоей стороны тоже здесь. Королевский Флот не осмелится подойти ближе."
      - "Теперь ты в безопасности. С тобой всё будет хорошо."
  - char: "bismarck"
    side: "left"
    text:
      - "Я... в безопасности?.."
  - text:
      - "Бисмарк едва могла поверить своим ушам. Она сделала паузу, чтобы осмыслить это слово."
  - char: "tester"
    side: "right"
    status: "is-red"
    text:
      - "С появлением этих непредвиденных переменных предсказанные результаты теста изменились. Кажется, у тебя появилась возможность выбрать новый путь."
  - char: "bismarck"
    side: "left"
    text:
      - "Новый путь..."
  - text:
      - "Бисмарк посмотрела на Тестер, затем на Амаги, потом на Фридрих и, наконец, на Чёрный Куб, покоящийся на её оснастке."
  - char: "bismarck"
    side: "left"
    text:
      - "Хе-хе-хе..."
  - char: "amagi"
    side: "right"
    text:
      - "Что тут смешного?"
  - char: "bismarck"
    side: "left"
    text:
      - "Таков был ваш план? Изменить судьбу, приведя подкрепление, чтобы спасти меня?"
  - char: "friedrich_der_grosse"
    side: "right"
    text:
      - "Возможно. А ты как думаешь?"
  - char: "bismarck"
    side: "left"
    text:
      - "Нет. Это неправильно."
      - "Это не то, о чём мы договаривались."
      - "Ты должна была вернуться на базу. Когда до тебя дойдут вести о моём «затоплении», ты начнёшь чистку нашего высшего командования и возглавишь Железную Кровь вместо меня."
      - "А это значит, что это не реальность. Я права?"
  - char: "friedrich_der_grosse"
    side: "right"
    text:
      - "Хи-хи..."
  - char: "amagi"
    side: "left"
    text:
      - "О чём ты говоришь?"
      - "Конечно же, это реальность. Более того, она даже лучше, чем была прежде."
      - "Разве мы не должны позволить реальности идти своим чередом?"
  - char: "bismarck"
    side: "right"
    text:
      - "Реальность не состоит лишь из солнца и бабочек. На жизненном пути неизбежны сожаления, прощания и ошибки."
      - "Не может быть будущего без настоящего прошлого."
      - "И сделанного не отменить."
      - "Неважно, насколько прошлое разочаровывающе или печально, или как сильно хочется его изменить..."
      - "Мы должны принять реальность такой, какая она есть. Лишь приняв её, мы сможем двигаться в будущее."
  - text:
      - "Она начала заряжать орудия главного калибра, используя ужасающую мощь, сокрытую в её руках."
      - "Странный чёрный свет скопился в стволе её орудия, в конце концов сжавшись до единственной точки."
  - char: "amagi"
    side: "left"
    text:
      - "Пожалуйста, не надо, Бисмарк! Чего ты пытаешься этим добиться?.."
  - char: "bismarck"
    side: "right"
    text:
      - "Я делаю то, что должно быть сделано."
      - "Как и в прошлом. Тестер! Я использую эту силу, чтобы стереть твой флот в порошок!"
      - "Я принимаю свою судьбу — свой конец — таким, каков он есть!"
  - text:
      - "Мощь вырвалась из крошечной точки, поглотив не только Тестер и саму Бисмарк, но и озадаченную Амаги, а также улыбающуюся Фридрих."

chapter3:
  rows:
  - char: "gerion"
    side: "right"
    status: "is-meta"
    text:
      - "Р-Р-Р-А-А-А-Р!"
  - char: "bismarck_z"
    side: "left"
    text:
      - "Это... Это и есть реальность."
      - "Понимаешь? Только приняв прошлое, можно двигаться в будущее."
      - "К более светлому, лучшему будущему."
