chapter1:
  rows:
  - text:
      - "Где-то в Империи Сардиния две девушки-корабля прогуливались по саду, любуясь цветами."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Признаться, я совсем не ожидала, что ты лично возглавишь делегацию."
      - "С твоим присутствием здесь ваш павильон наверняка привлечет внимание всей Всемирной выставки."
  - char: "amagi"
    side: "right"
    text:
      - "Что ты, ни в коем случае. С моей стороны было бы невежливо красть всё внимание у хозяев."
      - "Однако я полна решимости и энтузиазма создать ВТОРОЙ по привлекательности павильон."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Хи-хи. Пожалуйста, не создавай нам слишком жесткую конкуренцию."
  - char: "amagi"
    side: "right"
    text:
      - "Конечно же, нет. Я не буду перегибать палку."
      - "К слову, я хотела бы попросить тебя о личной услуге. Выслушаешь меня?"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "О личной услуге? Тебе нужен гид? Или, может быть, столик в ресторане?"
      - "Я могу исполнить практически любое твое пожелание, так что говори."
  - char: "amagi"
    side: "right"
    text:
      - "Что ж... есть кое-кто, с кем я хотела бы встретиться."
      - "То, что вы, сардинцы, вызвались принять Всемирную выставку, было шагом поистине божественного гения."
      - "Тот, кто выдвинул эту идею, определенно обладает великими амбициями и дальновидностью."
      - "По этой причине я хочу поговорить с этим человеком. Можешь устроить такую встречу?"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Ах, ты, должно быть, имеешь в виду Марко Поло."
      - "(Если подумать, Марко даже не выпал шанс появиться на Всемирной выставке, хотя именно она была её вдохновителем.)"
      - "(Мне немного жаль её. Она заслуживает своей минуты славы.)"
      - "Полагаю, сейчас она в нашей столице. Я организую встречу между вами."
  - char: "amagi"
    side: "right"
    text:
      - "Большое спасибо. С нетерпением жду возможности поговорить с ней."
  - char: "nop"
    side: "left"
    text:
      - "Хм! А мне, с другой стороны, до тебя нет совершенно никакого дела!"

chapter2:
  rows:
  - text:
      - "Небо озарилось ослепительным светом, и появился трон, украшенный белыми крыльями."
      - "Вся земля под троном в одно мгновение исчезла, сменившись белизной, простиравшейся от горизонта до горизонта."
      - "Трон медленно опустился с небес, и показалась та, кто им управлял."
  - char: "marco_polo"
    side: "left"
    text:
      - "В то время я была вполне довольна тем, что целыми днями составляла планы! Мне не нужна твоя жалость, Венето!"
      - "Что до ТЕБЯ... Кто ты такая?"
      - "Подобным тебе мерзким созданиям нет места в моей славной империи!"
  - char: "amagi_m"
    side: "right"
    text:
      - "Мар▇о, о ч▇м т▇ ▇▇▇▇▇▇▇?"
  - char: "marco_polo"
    side: "left"
    text:
      - "Ха! Ты даже говорить толком не можешь."
      - "Сгинь с глаз моих!"

chapter3:
  rows:
  - text:
      - "Поражённый святым светом, двойник Амаги превратился в чёрный туман, а затем и вовсе исчез."
      - "В следующее мгновение в мире снов появились врата тории, из которых выскочила Синано."
  - char: "shinano"
    side: "left"
    text:
      - "Марко Поло, ты должна хорошенько думать, прежде чем действовать в этом мире снов!"
      - "В этих обстоятельствах беспорядочные действия очень опасны..."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Марко... Поло? И Синано тоже?"
  - char: "shinano"
    side: "left"
    text:
      - "Венето? Прошу прощения за вторжение в твой сон, пусть и невольное... Ты очнулась от иллюзии?"
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Полагаю, да... Что вообще происходит?"
      - "Я думала, Марко Поло всё ещё в коме! Что она здесь делает? И, если на то пошло, почему здесь ты?"
  - char: "marco_polo"
    side: "left"
    text:
      - "Разуй глаза, женщина! Я обрела новый источник силы и с легкостью сокрушила им эту иллюзию!"
      - "Далее я осуществлю следующий шаг своего плана! Я только что его придумала, но это неважно!"
      - "Ты, Синано — это ведь ты меня разбудила, не так ли?"
      - "Значит, у меня есть надежный союзник! Великолепно! Гарантирую, позже ты получишь свой кусок пирога!"
  - char: "shinano"
    side: "right"
    text:
      - "Да, это я разбудила тебя... однако ты всё ещё спишь, а сила, которую ты ощущаешь, принадлежит мне..."
  - char: "marco_polo"
    side: "left"
    text:
      - "«Всё ещё сплю»? Значит, то, что я здесь вижу — не реальность, хотя я и в сознании?"
      - "Хм. Минуту назад ты действительно говорила что-то о «мире снов»..."
  - char: "shinano"
    side: "right"
    text:
      - "Твой разум всё ещё находится в мире сновидений... Я лишь перетянула тебя сюда..."
  - char: "marco_polo"
    side: "left"
    text:
      - "Пф-ф. Неудивительно, что я «очнулась» в таком ужасном месте. Я уж подумала, что кто-то уже украл у меня мою милую Сардинию."
      - "Слава богу, что это просто сон... Нет, постой, в этом нет совершенно ничего хорошего!"
      - "Если я уже очнулась, как ты утверждаешь, тогда как мне проснуться в РЕАЛЬНОМ мире?"
  - char: "shinano"
    side: "right"
    text:
      - "Увы... Я не знаю..."
  - char: "marco_polo"
    side: "left"
    text:
      - "Значит, я в ловушке?!"
  - char: "shinano"
    side: "right"
    text:
      - "Моя сила не продержится долго... Я разбудила тебя, чтобы задать вопросы от лица Клемансо..."
  - char: "marco_polo"
    side: "left"
    text:
      - "Клемансо, говоришь? Ха! Я ей ни черта не скажу!"
  - char: "shinano"
    side: "right"
    text:
      - "Ты должна... Я не могу уйти с пустыми руками..."
  - char: "marco_polo"
    side: "left"
    text:
      - "......"
  - char: "shinano"
    side: "right"
    text:
      - "......"
  - char: "marco_polo"
    side: "left"
    text:
      - "Ну? Так и будешь пялиться весь день или задашь свои вопросы? Ты тратишь моё ограниченное время!"
      - "Я сказала, что ЕЙ ни черта не скажу! Это не значит, что я не отвечу на твои вопросы!"
  - char: "shinano"
    side: "right"
    text:
      - "Как скажешь..."
      - "Известно ли тебе что-нибудь о посланнице Сакуры, одолжившей вашей стране осколок Ватацуми?"
  - char: "marco_polo"
    side: "left"
    text:
      - "Ах, Ватацуми. Если я правильно помню, ты возглавляла команду, которая перевозила его из Парящей крепости Железной Крови, и..."
      - "Тц! Точно!"
  - char: "shinano"
    side: "right"
    text:
      - "Да? Ты что-то вспомнила?"
  - char: "marco_polo"
    side: "left"
    text:
      - "Нет, забудь! Я ничего не знаю ни о каком проклятом осколке Ватацуми!"
  - char: "shinano"
    side: "right"
    text:
      - "Очень хорошо... Тогда известно ли тебе о каких-либо других подарках от Империи Сакуры?"
  - char: "marco_polo"
    side: "left"
    text:
      - "Об этом да, известно. Когда я коллекционировала антиквариат и произведения искусства, я получила немало вещей от вас, представительниц Сакуры."
      - "Кажется, я поместила их на склад в Венеции."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Что, прости? Мы обыскали этот склад и не нашли ни единого артефакта Сакуры."
  - char: "marco_polo"
    side: "left"
    text:
      - "Вы сделали ЧТО?! Это был МОЙ личный склад!"
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "О, умоляю. Ты правда думала, что мы не тронем твой склад, после того как ты устроила кризис катастрофических масштабов?"
  - char: "marco_polo"
    side: "left"
    text:
      - "Д-да неважно! Я никогда не говорила, что вам НЕЛЬЗЯ его обыскивать!"
      - "Просто знайте, что все эти артефакты бесценны! Обыскивайте, если нужно, но будьте с ними осторожны!"
      - "Что-нибудь ещё? Я что-то... так... внезапно... устала..."
      - "Если на этом... всё... я просто... Хр-р-р..."

chapter4:
  rows:
  - text:
      - "Мгновение назад Марко Поло и её трон были здесь, а в следующее — уже исчезли."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Марко!"
      - "Что... Что только что произошло?"
  - char: "shinano"
    side: "right"
    text:
      - "Сила, дарованная мне сном, иссякла... Теперь она снова спит..."
      - "Случай Марко Поло крайне необычный, поэтому удерживать её здесь было очень тяжело..."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Понимаю... Значит, ты ненадолго разбудила её, чтобы задать эти вопросы? Не могла бы ты рассказать побольше об этом «осколке Ватацуми»?"
  - char: "shinano"
    side: "right"
    text:
      - "Боюсь, всё слишком сложно... Я объясню это в мире бодрствования..."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Я понимаю. Поговорим снова в реальном мире."
