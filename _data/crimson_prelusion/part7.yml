chapter1:
  rows:
  - text:
      - "Группа кансен Сакуры стояла на Соломоновых островах — бывшей передовой войны против Сирен."
      - "Эти острова и расположенные на них базы уже давно не видели войны с тех пор, как во всём мире воцарился мир."
      - "Ни пламени, ни запаха пороха не было видно на разбросанных по акватории островах. Лишь тропический рай простирался настолько далеко, насколько хватало глаз."
  - char: "hiei"
    side: "left"
    text:
      - "Как-то странно находиться в столь безмятежном месте с таким большим флотом, как наш."
  - char: "kirishima"
    side: "right"
    text:
      - "Я была бы только рада, будь мы в отпуске, но увы..."
      - "Нас отослали так далеко от большой земли. Зачем? Не могу придумать ни одной веской причины для такого шага."
  - char: "haguro"
    side: "left"
    text:
      - "Ага. Выглядит подозрительно."
  - char: "shoukaku"
    side: "right"
    text:
      - "Я слышала, это было совместное решение Микасы и Мусаси."
      - "Странно тогда, что самой Микасы нет с нами. Хиэй, ты ничего от неё не слышала?"
  - char: "hiei"
    side: "left"
    text:
      - "Я говорила с ней перед отплытием, но всё, что она сказала — это что мы должны расследовать странные явления, замеченные в этих краях."
      - "Единственное, что я ещё заметила — она, похоже, была в ужасном настроении."
  - char: "shoukaku"
    side: "right"
    text:
      - "Хм. Знай я наперёд, что так выйдет, осталась бы дома с Дзуйкаку и не попадалась никому на глаза."
  - char: "harutsuki"
    side: "left"
    text:
      - "Но тогда бы у леди Нагато не было авианосца для защиты! Ты всем нам нужна."
  - char: "shimanto"
    side: "right"
    text:
      - "В любом случае, ты уже здесь. Расслабься — уверена, всё пройдёт хорошо."

chapter2:
  rows:
  - char: "kawakaze"
    side: "left"
    text:
      - "Леди Нагато, похоже, у твоего эскорта неоднозначные чувства насчёт этой передислокации."
  - char: "nagato"
    side: "right"
    text:
      - "Я знаю."
      - "Я обдумываю наш следующий шаг и вскоре оглашу его."
      - "Передай им, чтобы сохраняли спокойствие и оставались на позициях."
  - char: "kawakaze"
    side: "left"
    text:
      - "Как прикажешь."

chapter3:
  rows:
  - char: "nagato"
    side: "left"
    text:
      - "......"
  - text:
      - "Верная служанка покинула покои Нагато, после чего та тяжело вздохнула."
  - char: "nagato"
    side: "left"
    text:
      - "Великий Ветеран... О чём вы с Мусаси говорили в тот день?"
      - "Совершенно очевидно, что вы вдвоём приняли решение об этой передислокации."
      - "Ходят слухи, будто это уловка с твоей стороны, чтобы отстранить меня."
      - "Я, конечно же, знаю, что это не так."
      - "Ты лишь хочешь уберечь меня, но делаешь это ценой собственной безопасности."
      - "По этой причине я позволила Дзуйкаку остаться на большой земле."
      - "Я могу лишь надеяться, что она сослужит тебе добрую службу..."
  - text:
      - "В тёмной комнате вновь воцарилась тишина."
      - "Минуло немало времени."
  - char: "nagato"
    side: "left"
    text:
      - "Сначала пришло предупреждение Ямато... Затем твои приказы о передислокации."
      - "Аномалия, которую я почувствовала в Священной Сакуре, когда покидала большую землю... Связана ли она с этим?"
      - "Ты и Мусаси пытаетесь подготовиться к надвигающейся угрозе. Это я понимаю."
      - "Однако на этих Соломоновых островах нет Священной Сакуры."
      - "Даже если странные явления и требуют расследования, мне здесь делать нечего."
      - "Это почти заставляет меня думать, что ты намеренно держишь меня так далеко лишь ради того, чтобы защитить..."
      - "......"
  - text:
      - "Опустившись на колени, девушка ухватилась за свои рукава и крепко сжала их."
  - char: "nagato"
    side: "left"
    text:
      - "После всех этих взлётов и падений, перипетий и невзгод... Я ни капельки не изменилась..."
      - "Я стремлюсь вырваться из оков судьбы, но всё равно иду по пути, проложенному кем-то другим..."
      - "Я поклялась себе, что больше не стану убегать, и нарушила собственное обещание..."
      - "Если бы только я настояла на своём, а не бездумно подчинилась твоему приказу..."
      - "Наша страна вскоре столкнётся с великой опасностью, и я должна быть рядом с тобой, чтобы встретить её плечом к плечу..."
      - "Вместо этого я сижу здесь одна, и всё из-за того, что моя решимость пошатнулась..."
  - char: "kongou"
    side: "right"
    text:
      - "Ты ошибаешься, леди Нагато."
      - "Твоя отправка на эти острова не была бегством от опасности — это было общее решение, и к тому же совершенно правильное."
      - "Микаса скрывает от тебя кое-какие вещи, но ты ведь интуитивно всё поняла и согласилась с этим решением, не так ли?"
  - char: "nagato"
    side: "left"
    text:
      - "Конго?"
  - char: "kongou"
    side: "right"
    text:
      - "Прошу прощения за неожиданный визит."
      - "Я проходила мимо и увидела помрачневшую Кавакадзэ, поэтому решила сама проведать тебя."
      - "К тому же твой следующий шаг... Это ведь не прямое возвращение на большую землю, верно?"
  - char: "nagato"
    side: "left"
    text:
      - "Я... Нет, до этого не дойдёт."
      - "Входи и присаживайся. Я как раз хотела поговорить с тобой."
  - text:
      - "Конго склонила голову, вошла внутрь и села напротив Нагато."
  - char: "nagato"
    side: "left"
    text:
      - "Ты права, Конго."
      - "Когда я увидела выражение лица Великого Ветерана по её возвращении, я сразу всё поняла."
      - "Я поняла, почему она объединила силы с Мусаси — с той, кого клялась склонить на нашу сторону."
      - "Немного подумав, я осознала, что наша страна уже в опасности."
      - "Решения нужно принимать быстро, и моё присутствие едва ли имеет значение. Вот насколько серьёзна нависшая над нами угроза."
      - "Куда разумнее держать меня в резерве, вдали от опасности, дабы я послужила искрой, способной разжечь контратаку, если худшее воплотится в жизнь."
      - "Полагаю, именно в этом и заключался смысл решения Мусаси отправить Синано в Европу."
      - "Я понимаю логику её действий, просто..."
      - "Я... сомневаюсь в своих способностях как воина. Я не знаю, смогу ли стать той самой искрой для контратаки."
  - char: "kongou"
    side: "right"
    text:
      - "Великий Ветеран верит в тебя, и я тоже."
  - char: "nagato"
    side: "left"
    text:
      - "*вздох*"
  - text:
      - "Сжатые кулаки Нагато разжались, отпустив ткань рукавов."
  - char: "nagato"
    side: "left"
    text:
      - "Значит, мои сомнения были напрасны."
      - "Микаса сказала, что здесь творится нечто странное, и мне ничего не остаётся, кроме как расследовать это."
      - "А как только с этим будет покончено, мы вернёмся на Острова Сакуры и всех спасём!"
