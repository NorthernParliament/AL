chapter1:
  rows:
  - text:
      - "Я на борту частного самолёта, и мы держим устойчивый курс в воздушном пространстве Империи Дракона."
      - "Хотя земли из-за облаков не разглядеть, совсем скоро мы должны начать снижение."
      - "С самого момента входа в воздушное пространство Империи нас сопровождают самолёты эскорта. Рад отметить, что до сих пор полёт проходил гладко."
      - "И всё же, глядя на тёмные тучи вдалеке, я не могу отделаться от тревоги."
  - char: "commander"
    side: "left"
    text:
      - "Вон там... это ведь тот самый печально известный Шторм, верно?"
  - char: "chen_hai"
    side: "right"
    text:
      - "Именно так. Он настолько огромен, что обойти его стороной практически невозможно."
      - "Впрочем, называть его просто Штормом было бы не совсем точно. На самом деле он состоит из нескольких бурь разной величины, движущихся как единое целое."
      - "Они не просто связаны между собой вразрез со всеми законами физики, но и бушуют круглый год, образуя фактически непреодолимый барьер."
  - char: "helena"
    side: "left"
    text:
      - "Именно поэтому береговая линия Империи постоянно заблокирована."
      - "В такую погоду об отправке флота нельзя даже помыслить."
  - char: "chen_hai"
    side: "right"
    text:
      - "Вот именно. Наши воды, как прибрежные, так и дальние, всегда остаются для нас закрытыми."
      - "Кроме того, сила Шторма постоянно колеблется. Порой он становится свирепее, порой затихает."
      - "Когда его мощь возрастает, зона его воздействия расширяется."
      - "Шторм не только опустошает наши побережья, но и служит путём для вторжения Сирен."
      - "Из-за этого многие полагают, что именно Сирены стоят за его появлением."
  - char: "commander"
    side: "left"
    text:
      - "Он не только блокирует морской доступ, но ещё и вполне вероятно служит базой для Сирен, да?"
      - "Это отлично объясняет, почему Империя не может отправлять свои флоты в зарубежные воды."
  - char: "chen_hai"
    side: "right"
    text:
      - "Да. Мы бы с радостью, если б могли."
  - char: "memphis"
    side: "left"
    text:
      - "К слову о Шторме, в последнее время в зоне вокруг него наблюдаются странные явления, не так ли?"
  - char: "chen_hai"
    side: "right"
    text:
      - "Ах. Я удивлена, что ты знаешь об этом."
      - "Да, мы полагаем, что после битвы в Антарктике Сирены передислоцировали свои силы по всему земному шару. И это, естественно, касается и вод вокруг Шторма."
      - "И хотя в целом их присутствие ослабло, в регионах, охваченных Штормом, их активность, напротив, заметно возросла."
      - "Хуже того, их давно заброшенные опорные пункты на Марианских островах снова ожили. С каждым днём там фиксируется всё больше их сил."
      - "Марианские острова также играют свою роль в нашей предстоящей операции."
  - char: "memphis"
    side: "left"
    text:
      - "Дай угадаю: вы наконец собираетесь нанести ответный удар по Шторму?"
  - char: "chen_hai"
    side: "right"
    text:
      - "Ты права. Они слишком долго держали нас в плену у собственного побережья, и пришло время расплаты."
  - char: "commander"
    side: "left"
    text:
      - "Каковы шансы на успех операции?"
  - char: "chen_hai"
    side: "right"
    text:
      - "С твоей помощью — сто процентов. Хи-хи."

chapter2:
  rows:
  - text:
      - "Самолёт начинает снижаться, и сквозь прорехи в облаках открывается вид на прекрасные, величественные земли."
      - "В то же самое время вдалеке в небо устремляется световой занавес, возвышающийся над зеленью на горизонте."
  - char: "memphis"
    side: "left"
    text:
      - "Эй, Чэнь Хай, что это такое? Только не говори, что мы под атакой!"
  - char: "chen_hai"
    side: "right"
    text:
      - "О, вовсе нет. Это наш барьер для защиты от Шторма — система Пинфэн."
      - "Мы активировали её на всякий случай к вашему прибытию, пусть даже сегодня Шторм ведёт себя довольно смирно."
  - text:
      - "И хорошо, что активировали. Посадка проходит очень гладко благодаря занавесу, отсекающему бушующую стихию."
  - char: "commander"
    side: "left"
    text:
      - "Знаешь, ваша система Пинфэн чем-то напоминает мне Небесную Стену (Стену Авроры) Ортодоксии."
      - "Это случаем не результат совместного обмена технологиями?"
  - char: "chen_hai"
    side: "right"
    text:
      - "Я... удивлена, что ты спрашиваешь об этом. Я не участвовала в её разработке, так что, боюсь, не смогу ответить на твой вопрос."
      - "Однако уверена, что вскоре ты найдёшь того, кто сможет. Позже мы отправимся на банкет, где будет много гостей."
  - char: "commander"
    side: "left"
    text:
      - "Банкет? Зачем?"
  - char: "chen_hai"
    side: "right"
    text:
      - "Ят Сен настояла на этом. Она сказала, что после столь долгого пути ты устанешь, и банкет будет идеальным способом отдохнуть и расслабиться. А важные дела мы обсудим позже."
  - char: "memphis"
    side: "left"
    text:
      - "Таковы их обычаи. В Империи всегда радушно встречают гостей."
  - char: "helena"
    side: "right"
    text:
      - "А-а-а. Похоже, ты отлично знакома с их культурой."
  - char: "memphis"
    side: "left"
    text:
      - "Да, вообще-то так и есть!"
      - "Я ведь раньше работала послом, помнишь? Я много читала об этом."
  - char: "chen_hai"
    side: "right"
    text:
      - "Кортеж Ят Сен должен прибыть в аэропорт с минуты на минуту."
      - "Приземление будет немного жестковатым, поэтому советую пристегнуть ремни безопасности."
