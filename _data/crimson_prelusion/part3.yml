chapter1:
  rows:
  - text:
      - "Кансен из Империи Сакуры пробирались сквозь толпу к месту своего назначения."
  - char: "hakuryuu"
    side: "left"
    text:
      - "<h2>С дороги! Дайте пройти!</h2>"
      - "<h2>РАЗОШЛИСЬ, чёрт возьми!</h2>"
  - char: "suruga"
    side: "right"
    text:
      - "Мы расчистили путь. Поспешим, леди Синано!"

chapter2:
  rows:
  - char: "shimakaze"
    side: "left"
    text:
      - "Фух... Наконец-то мы выбрались хоть на какое-то свободное пространство."
      - "Уму непостижимо, сколько тут людей. Как думаете, здесь проходит какой-то фестиваль?"
  - char: "shinano"
    side: "right"
    text:
      - "Я не слышала ни о чём подобном, что должно было происходить сегодня..."
  - char: "hakuryuu"
    side: "left"
    text:
      - "Может, это спонтанное решение. Чтобы повеселиться, повод не нужен!"
      - "Как пару дней назад, когда мы все вдруг собрались посмотреть на луну!"
  - char: "noshiro"
    side: "right"
    text:
      - "Ну, вообще-то этого никогда..."
  - char: "shinano"
    side: "left"
    text:
      - "Кхм. Давайте поговорим в другом месте. Хакурю, продолжай вести нас. Прежде всего, мы должны вернуться в наши покои..."
  - char: "hakuryuu"
    side: "right"
    text:
      - "Да-да! Будет сделано!"

chapter3:
  rows:
  - text:
      - "Миновав очередной перекрёсток, представительницы Сакуры наткнулись на группу юных девушек Ортодоксии."
  - char: "le_triomphant"
    side: "left"
    text:
      - "Пожалуйста, продвигайтесь организованно! Давайте вместе отпразднуем нашу победу в этой войне сопротивления!"
  - char: "le_malin"
    side: "right"
    text:
      - "Пусть Ортодоксия, Королевский Флот и Империя Сакуры навсегда останутся союзниками!"

chapter4:
  rows:
  - char: "hakuryuu"
    side: "left"
    text:
      - "«Войне сопротивления»? О чём, чёрт возьми, она говорит?"
  - char: "suruga"
    side: "right"
    text:
      - "Мы втроём — союзники навеки? Для меня это новость."
      - "С этими девочками что-то не так."
  - char: "shimakaze"
    side: "left"
    text:
      - "Вот именно! Они страннее, чем жаба в кимоно!"
  - char: "noshiro"
    side: "right"
    text:
      - "Леди Синано... Кажется, они тоже оказались под действием заклинания сна."
  - char: "shinano"
    side: "left"
    text:
      - "Да... Неудивительно, что святая столица тоже пострадала..."
      - "Однако я никак не ожидала, что масштаб эффекта окажется столь огромным..."
      - "Но, по воле случая, у меня есть дело к рыцарям... Давайте поговорим с ними."

chapter5:
  rows:
  - char: "shinano"
    side: "left"
    text:
      - "Приветствую вас, рыцари Святого Ириса... Где Клемансо?"
  - char: "le_triomphant"
    side: "right"
    text:
      - "Ах, представительницы Сакуры! Добро пожаловать на наш парад! Присоединяйтесь к празднованию!"
  - char: "shinano"
    side: "left"
    text:
      - "(Они меня игнорируют... Нужно показать им это.)"
      - "Взгляните на это."
  - text:
      - "<img src='../../img/bg/r/5.png' class='inline-img' alt=''>"
  - text:
      - "Она показала им брошь, которую дал ей Командир."
  - char: "shinano"
    side: "left"
    text:
      - "Прошу вас, юные рыцари... Я бы хотела встретиться с Клемансо."
  - char: "le_malin"
    side: "right"
    text:
      - "Хотите пройти к главному месту проведения? Проводить вас туда?"
  - char: "shinano"
    side: "left"
    text:
      - "(Мои слова до них не доходят... Что ж, да будет так.)"
      - "Спасибо, но нет. В этом нет необходимости."
  - char: "le_triomphant"
    side: "right"
    text:
      - "Очень хорошо. Пожалуйста, обязательно осмотритесь здесь! Тут столько всего интересного!"

chapter6:
  rows:
  - text:
      - "Когда солнце начало садиться, представительницы Сакуры наконец добрались до своих покоев."
      - "Несмотря на все свои усилия, Синано так и не смогла организовать встречу с Клемансо."
      - "Смирившись, она сидела в своей комнате, глубоко задумавшись о том, как сон повлиял на её товарищей из Ортодоксии."
  - char: "shinano"
    side: "left"
    text:
      - "Ах, словно маленькая лодка, попавшая в сильный шторм, я могу лишь сокрушаться о собственной беспомощности..."
      - "Сколько ещё мне придётся испытывать это чувство тщетности?"
      - "В былых снах всегда оставалась надежда, что всё изменится, как только я проснусь..."
      - "Увы, молитвы не в силах изменить реальность мира бодрствования..."
      - "Теперь я в равной степени завишу от прихотей как реального мира, так и мира снов, не имея ни секунды на передышку..."
      - "Как тот, кто умеет лишь плыть по течению, может бороться с волнами?"
      - "Нет ни выхода, ни того, кто придёт мне на помощь..."
      - "Только один человек способен разрешить этот кризис... и этот человек — я сама..."
      - "Я больше не могу убегать от своих проблем..."

chapter7:
  rows:
  - text:
      - "Синано закрыла глаза и крепко сжала в руках амулет Ватацуми. Вняв её молитве, он начал слабо светиться."
  - char: "shinano"
    side: "left"
    text:
      - "Я всегда знала суть своей силы, исток своих снов..."
      - "Это этот осколок... Ватацуми дарует мне мою силу, мои сны..."
      - "И всё же, я всегда закрывала глаза на правду..."
      - "На то, что без этого осколка я — лишь пустая оболочка без какой-либо силы, несмотря на то, что обладаю корпусом типа «Ямато»..."
      - "Пришло время принять реальность такой, какая она есть..."
      - "Тогда... я сделаю то, что в моих силах..."
  - text:
      - "Когда она открыла глаза, свет амулета померк, подобно отражению луны на поверхности озера."
  - char: "shinano"
    side: "left"
    text:
      - "Ватацуми — священная реликвия, но он также может быть и оружием..."
      - "Солдаты полагаются на своё огнестрельное оружие, корабли — на свою оснастку... в то время как всё моё существование зависит от этого осколка..."
      - "С помощью этого амулета ты помог мне увидеть реальность, когда я не хотела её принимать..."
      - "Этот амулет моего собственного творения пролил свет на сон, который околдовал столь многих... Он заставил меня осознать, что мир бодрствования погрузился в спячку..."
      - "До сих пор он направлял меня, и, без сомнения, продолжит это делать..."
      - "Это моя связь с миром сновидений, а также мой путеводный свет к нему..."
      - "Если мои слова ничего не значат в реальном мире, то, возможно, они будут иметь вес в мире снов..."
      - "Я развею иллюзию, нависшую над святой столицей, и выполню свою миссию."
  - text:
      - "Собравшись с духом, она снова сжала амулет в руках."
      - "Затем в дверь внезапно постучали."
  - char: "clemenceau"
    side: "left"
    text:
      - "Это Клемансо. Я слышала, ты носишься по всему городу, пытаясь меня найти."
      - "Что я могу для тебя сделать?"
  - char: "shinano"
    side: "right"
    text:
      - "Клемансо?!"

chapter8:
  rows:
  - text:
      - "Потрясённая, Синано поспешила открыть дверь и впустить Клемансо."
  - char: "shinano"
    side: "right"
    text:
      - "Ты... очнулась от иллюзии?"
  - char: "clemenceau"
    side: "left"
    text:
      - "Да, как видишь."
  - char: "shinano"
    side: "right"
    text:
      - "Как?"
  - char: "clemenceau"
    side: "left"
    text:
      - "Очень просто. Всё казалось слишком идеальным даже для сна."
      - "Как это ни печально, я знаю, что ни прошлое, ни настоящее, ни будущее никогда не бывают столь прекрасными."
      - "Поэтому я пошла на жертву и снова сделала правильный выбор. Вот и всё."
  - char: "shinano"
    side: "right"
    text:
      - "Раз уж ты тоже была обманута, то должна хорошо понимать, насколько сильна эта иллюзия. Обыватель не сможет правильно распознать идеальный сон."
      - "Более того... похоже, Командир дважды просчитался..."
  - char: "clemenceau"
    side: "left"
    text:
      - "Просчитался? Продолжай."
  - char: "shinano"
    side: "right"
    text:
      - "Первый просчёт — я показала твоим товарищам эту брошь, но они так и не позволили мне увидеться с тобой."
  - text:
      - "Синано достала брошь и показала её Клемансо."
  - char: "shinano"
    side: "right"
    text:
      - "Второй — предположение о том, что мало кто из европеек сможет самостоятельно очнуться от иллюзии."
  - char: "clemenceau"
    side: "left"
    text:
      - "Все мы иногда совершаем ошибки, даже Командир."
      - "Кроме того, эта брошь была подарком. Меня немного задевает тот факт, что её отдали кому-то другому."
      - "Держу пари, именно то, что она оказалась в твоих руках, и стало причиной, по которой она не сработала."
      - "Как бы то ни было, теперь мы встретились лицом к лицу. Не возражаешь, если ты вернёшь её мне?"
  - text:
      - "С кивком Синано передала брошь Клемансо."
  - char: "clemenceau"
    side: "left"
    text:
      - "А теперь к делу. Я уже начала расследование этого странного явления."
      - "Командир поступил мудро, прислав тебя сюда. Мне понадобится твоя сила, и мы хотим, чтобы на нашей стороне было как можно больше пробудившихся."
      - "Раз уж мы заговорили о твоей силе, я бы хотела пустить её в ход как можно скорее."
      - "Ты ведь можешь проникать в чужие сны, верно? У меня на примете есть один конкретный..."
