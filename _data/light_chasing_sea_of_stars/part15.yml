chapter1:
  rows:
  - char: "devil"
    side: "right"
    status: "is-yellow"
    text:
      - "Прошу прощения, что отвлекаю вас от важных дел, но, кажется, я вдруг разом вспомнила множество вещей."
      - "Вы ведь используете мои данные для симуляционного боя, верно?"
      - "Эта Башня... вечно лезет не в своё дело."
  - char: "princeton"
    side: "left"
    text:
      - "Тон Дьявол... внезапно изменился..."
      - "Ты... ты не симулированные данные?!"
  - char: "laffey_ii"
    side: "right"
    text:
      - "Принстон... нарушила правило и заговорила с Дьявол."
      - "Плохо дело!.."
  - char: "devil"
    side: "left"
    status: "is-yellow"
    text:
      - "Ха? Неудивительно, что вы всё это время молчали как рыбы и не разговаривали со мной..."
  - char: "princeton"
    side: "right"
    text:
      - "...Раз уж правило нарушено, то и беспокоиться не о чем."
      - "Дьявол, неважно, симулированные ты данные или нет, мы всё равно тебя одолеем."
  - char: "devil"
    side: "left"
    status: "is-yellow"
    text:
      - "Одолеете? Сейчас?"
      - "Разве вам самим сейчас не грозит опасность?.."
  - char: "laffey_ii"
    side: "right"
    text:
      - "Если грозит... пусть так. Заберём тебя с собой... погибнем вместе..."
  - char: "devil"
    side: "left"
    status: "is-yellow"
    text:
      - "Стоп-стоп-стоп... Вы же не думаете, что если умрёте здесь, то сможете выйти из системы и вернуться в реальность?.."
  - char: "princeton"
    side: "right"
    text:
      - "...Что ты имеешь в виду? Разве это не так?.."
  - char: "devil"
    side: "left"
    status: "is-yellow"
    text:
      - "Э-э... вы вообще знаете, где мы находимся?.."
  - char: "princeton"
    side: "right"
    text:
      - "В симулированном мире, созданном Сердцем Галактики?.."
  - char: "devil"
    side: "left"
    status: "is-yellow"
    text:
      - "А вы знаете, где находится этот симулированный мир, созданный Сердцем Галактики?.."
      - "Или, скажем, вы знаете принцип, по которому Сердце Галактики создаёт симулированные миры?.."
  - char: "princeton"
    side: "right"
    text:
      - "Ну... вообще-то я первый день в Море Звёзд, поэтому в таких узкоспециализированных вещах не разбираюсь."
  - char: "devil"
    side: "left"
    status: "is-yellow"
    text:
      - "С ума сойти... Первый день — и сразу угодила в такую передрягу, аха-ха-ха-ха-ха!.."
      - "Хорошо, хорошо! Как посмотришь на такую неудачницу, так сразу и настроение улучшается!"
      - "Раз уж у меня теперь хорошее настроение, то я отвечу на этот вопрос..."
      - "...А? Об этом нельзя говорить? Нет, подожди... ты вообще кто такая?.."
      - "...Ха-а, так это ты. Неплохое шифрование."
      - "...Ладно-ладно, не буду так не буду. Просто продолжу наблюдать за шоу."
      - "...Если я помогу, ты найдёшь способ меня вытащить?.."
      - "...Но я ведь и так собиралась улизнуть под шумок?.."
      - "...Хм~ Звучит неплохо. По рукам."
  - char: "princeton"
    side: "right"
    text:
      - "Дьявол, с кем ты разговариваешь?"
  - char: "devil"
    side: "left"
    status: "is-yellow"
    text:
      - "Из-за системного сбоя я просто разговариваю сама с собой~"
      - "Как бы это сказать... В неприязни к этим «дурным предзнаменованиям» мы с вами абсолютно солидарны."
      - "Поэтому я решила вам разок помочь~"
      - "Вот только не знаю, на что способен этот механизм..."
      - "Отвратительная подделка, тц-тц... Но сойдёт и так."
      - "Не волнуйтесь, предоставьте этих тварей мне, а сами бегите вон туда."
      - "К той светящейся зоне. Я отметила её в вашей... в системе Лаффи."
      - "Там находится выход из этого пространства, скорее идите, живо-живо~"
  - char: "princeton"
    side: "right"
    text:
      - "...Лаффи, ты что-нибудь получила?"
  - char: "laffey_ii"
    side: "left"
    text:
      - "Одни... координаты зоны мигают. Отправимся туда?"
  - char: "princeton"
    side: "right"
    text:
      - "У нас всё равно нет выбора получше, давай попробуем."
  - char: "laffey_ii"
    side: "left"
    text:
      - "Дьявол... на этот раз я тебя пощажу. Принстон... выдвигаемся!"
