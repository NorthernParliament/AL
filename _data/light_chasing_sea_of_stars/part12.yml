chapter1:
  rows:
  - text:
      - "Когда зрение вернулось, перед глазами присутствующих предстал мир, покрытый льдом и снегом."
      - "Но больше всего внимания привлекала огромная конструкция вдали, состоящая из смеси металла и льда."
      - "Она напоминала корону."
  - char: "constellation"
    side: "left"
    text:
      - "...Похоже, Линза Реальности работает нормально, мы успешно проникли в блок данных!"
      - "Дайте-ка посмотреть... Неужели это... акватория вокруг полярной Короны?!"
      - "Хм... Как неожиданно."
      - "Почему блок данных, извлечённый в Коралловом море, содержит информацию об акватории вокруг Короны..."
      - "В этом нет никакого смысла..."
  - char: "san_jacinto"
    side: "right"
    text:
      - "Констеллейшн, плохие новости. Навигатор-TБ не подключилась, мы потеряли связь с комнатой управления."
  - char: "constellation"
    side: "left"
    text:
      - "...Что? Такого не может быть внутри Линзы Реальности?.."
      - "Погоди... В той прошлой операции, когда Командир исследовал Анкоридж, я помню..."
      - "Разве тогда тоже в какой-то момент после входа Командира в Линзу не прервалась внезапно связь с комнатой управления?.."
      - "...Похоже, я была права. В этом блоке данных точно скрыто что-то важное!"
      - "Пока не обращай внимания на TБ. Сан-Хасинто, мы продолжаем разведку!"

chapter2:
  rows:
  - char: "constellation"
    side: "left"
    text:
      - "Ты заметила? Здешняя Корона отличается от той, которую мы знаем."
  - char: "san_jacinto"
    side: "right"
    text:
      - "И правда отличается... Корона вдали переполнена энергией, такое чувство, что это... активная Сингулярность?"
  - char: "constellation"
    side: "left"
    text:
      - "Вот именно! Но разве это не странно?"
      - "Всем известно! Полярная Корона — это Сингулярность, которую так и не удалось запустить."
      - "Её формирование связано с лидером Пепла, которую Сирены называют Код G — Энтерпрайз-МЕТА."
      - "После неудачной попытки запустить Корону она покинула это место."
      - "Впоследствии Корона перешла под контроль Сирен и стала важным опорным пунктом Пьюрифайер в полярном регионе."
      - "Так всё и должно было быть..."
      - "Но почему Корона в этом блоке данных продолжает работать?.."
  - char: "san_jacinto"
    side: "right"
    text:
      - "Неужели... известные нам записи ошибочны?"
  - char: "constellation"
    side: "left"
    text:
      - "...Если это так, то это просто ужасно!"
      - "Все эти годы Сирены контролировали в полярном регионе Сингулярность, которая на самом деле могла нормально функционировать?!.."
      - "Спокойно, спокойно, это неверный ход мыслей... Энергию работающей Сингулярности невозможно скрыть."
      - "Если бы Корона всё это время нормально работала, её состояние неизбежно было бы таким же, как у той Короны, что сейчас перед нами. Даже с большого расстояния можно было бы ясно увидеть её энергию."
      - "Но та Корона, которую мы знаем, совсем не такая..."
  - char: "san_jacinto"
    side: "right"
    text:
      - "Возможно ли, что Корона на самом деле не естественная Сингулярность, а искусственная, подобная Башне Мидгарда Железной Крови, и её можно свободно включать и выключать?"
      - "Или... Корона после своего появления нормально проработала какое-то время, а затем по каким-то причинам полностью отключилась?.."
  - char: "constellation"
    side: "left"
    text:
      - "Пока мы не исследуем Корону на месте, я не могу делать окончательных выводов."
      - "Однако в момент запуска искусственная Сингулярность должна излучать колоссальные энергетические волны."
      - "Но наша обсерватория на Аляске, помимо всплеска энергии, зафиксированного в момент её появления, больше ни разу не улавливала второго."
      - "Пожалуй, второе предположение более вероятно..."
      - "Но главный вопрос всё ещё остаётся: почему этот блок данных... записал именно этот момент."
      - "И... как образовались те данные с аномалиями в хронологии, о которых ранее упоминала TБ..."
  - text:
      - "БАБАХ!!!"
      - "Внезапный оглушительный звук разорвал тишину ночного неба и прервал размышления Констеллейшн."
  - char: "constellation"
    side: "left"
    text:
      - "...Ты слышала? Что это был за звук?"
  - char: "san_jacinto"
    side: "right"
    text:
      - "Это... А, смотри скорее, то, что появилось на горизонте, это чёрное торнадо!"
  - text:
      - "Не нужно было пристально вглядываться или пытаться что-то разглядеть."
      - "В мгновение ока после первого мощного раската на горизонте уже возвышалась гигантская стена чёрной бури."
      - "В этот самый момент облачный фронт разрастался с поразительной скоростью, и даже сияние Короны постепенно меркло, исчезая в буре."
  - char: "constellation"
    side: "left"
    text:
      - "Э-эта штука... надвигается прямо на нас?!.."
      - "Бежим, Сан-Хасинто, скорее бежим!!!"

chapter3:
  rows:
  - char: "tb"
    side: "left"
    text:
      - "Предупреждение: в Линзе Реальности обнаружены вредоносные данные."
      - "Предупреждение: сбой выполнения процедуры изоляции."
      - "Предупреждение: защитная система близка к критической нагрузке, существует риск утечки вредоносных данных."
      - "Предупреждение... Предупреждение..."
  - text:
      - "В комнате управления взвыли сирены, множество мигающих красных рамок на экранах подчеркивали критичность текущей ситуации."
  - char: "anchorage"
    side: "left"
    text:
      - "Ува-а-а! Покраснело... Экраны... все покраснели!.."
      - "TБ... что случилось... что нам делать!"
  - char: "tb"
    side: "right"
    text:
      - "Анкоридж, система в зоне Сердца Галактики подвергается вторжению вредоносной программы."
      - "Я завершила меры по экстренной изоляции."
      - "Однако вторжение произошло изнутри и распространяется очень быстро. Обычная система защиты вот-вот рухнет, я должна немедленно перейти в режим реагирования на кризис."
  - char: "anchorage"
    side: "left"
    text:
      - "Режим... реагирования на кризис?"
  - char: "tb"
    side: "right"
    text:
      - "Пожалуйста, как можно скорее разбей стекло на третьей панели управления..."
      - "...То есть на панели прямо под твоей правой рукой, стекло с красной рамкой. После того, как разобьёшь стекло, пожалуйста, нажми самую большую кнопку на этой панели."
  - char: "anchorage"
    side: "left"
    text:
      - "Красное стекло... красное стекло... Анкоридж... нашла!"
      - "...Разбила... нажала... готово!"
  - char: "tb"
    side: "right"
    text:
      - "Команда подтверждена, выполняется проверка..."
      - "Проверка завершена: приступаю к выполнению экстренной команды. Вся система переходит в режим реагирования на кризис..."
      - "Давайте начнём контратаку."
