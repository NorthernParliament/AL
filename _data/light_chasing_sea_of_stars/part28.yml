chapter1:
  rows:
  - char: "fortress"
    side: "right"
    text:
      - "Принстон, приближается третья сторона."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Третья сторона? Ты имеешь в виду тех, кто построил эти плавучие базы в акватории?"
      - "Мы столько времени убили на их поиск, и они так и не показались. Откуда они вылезли сейчас?"
  - char: "fortress"
    side: "right"
    text:
      - "Согласно анализу результатов разведки, они, скорее всего, только что были произведены на базе."
  - char: "fortress_1"
    side: "right"
    text:
      - "Передаю запись с разведки..."

chapter2:
  rows:
  - char: "prinston_meta"
    side: "left"
    text:
      - "Они... выглядят немного похожими на систему Антиоха... Но я никогда не видела таких моделей."
      - "Крепость, тебе они знакомы?"
  - char: "fortress"
    side: "right"
    text:
      - "Нет."
  - char: "guam"
    side: "left"
    text:
      - "Подождите... Мы знаем этих врагов!"
      - "В данных, которыми мы ранее обменялись с Железной Кровью, упоминалось, что все они — Инфорсеры, контролируемые Арбитром Влюблённые."
      - "Те, что похожи на морских ангелов, называются Энфорсеры VI «Комбинатор», они в основном отвечают за помехи и поддержку."
      - "А те другие, которые выглядят очень свирепо — это Энфорсеры VI «Аттракция», их главная огневая мощь."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Энфорсеры... Никогда не слышала этого слова. Но имя Влюблённые мне знакомо..."
      - "Это имя было в планах для нового поколения системы Антиоха..."
      - "Но это должно было быть... всего лишь планами."
      - "Крепость, ты пыталась выйти на связь?"
  - char: "fortress"
    side: "left"
    text:
      - "Пыталась, но с ними невозможно связаться, как и перехватить права доступа."
      - "Протокол, который они используют, совершенно отличается от моего."
      - "В то же время они уничтожили отправленные мной дроны, так что их можно считать враждебными."
  - char: "prinston_meta"
    side: "right"
    text:
      - "...Уничтожили? Невозможно, совершенно невозможно, должно быть, произошла какая-то ошибка."
      - "...Госпожа Серебряная Лиса?"
      - "...Да, я поняла."
  - char: "constellation"
    side: "left"
    text:
      - "Что сказала Серебряная Лиса?"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Она сказала, что, хотя эти «Сирены» не распознали нас как союзников, они сами сейчас сражаются с сущностями Предвестников."
      - "Сначала мы понаблюдаем, а когда обе стороны изрядно истощат друг друга, мы уничтожим их одним махом."
  - char: "constellation"
    side: "left"
    text:
      - "...Серебряная Лиса назвала их Сиренами?"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Да, наверное, она использовала ваше название, чтобы вам было проще понять?"
      - "Раз они не союзники, то мы их уничтожим, так сказала госпожа Серебряная Лиса."
      - "...Как и ожидалось от госпожи, какая решительность."
      - "Простите за мою минутную растерянность. Давайте пока сменим позицию и спокойно понаблюдаем за боем!"
