chapter1:
  rows:
  - text:
      - "Как только группа открыла дверь и вошла в офис, автоматические датчики включили свет в этой просторной комнате, которую вполне можно было использовать как конференц-зал."
  - char: "constellation"
    side: "left"
    text:
      - "Присаживайтесь где удобно, не стесняйтесь."
  - char: "guam"
    side: "right"
    text:
      - "Фух... Не ожидала, что мы придём так рано. Остальные ещё не подошли?"
  - char: "constellation"
    side: "left"
    text:
      - "Нет... На самом деле ты пришла последней. Ещё до того, как мне удалось тебя поймать, я уже распределила задачи между сотрудниками из других отделов."
      - "Я позвала тебя в основном для того, чтобы лично объяснить суть предстоящей операции по извлечению."
      - "Это очень важно, так что не отвлекайся."
  - char: "guam"
    side: "right"
    text:
      - "А?.. Погоди-ка... Я думала, ты позвала меня из-за планового собрания..."
      - "Если это операция по извлечению, разве твой отдел не может справиться с этим самостоятельно? Я ничего не смыслю в этих технологиях, так что ничем не смогу помочь..."
  - char: "constellation"
    side: "left"
    text:
      - "Потому что сейчас... нам действительно не хватает людей. К тому же, в ходе этой операции... возможно, нам придётся вступить в «бой»."
      - "Что касается самого извлечения, просто предоставьте это Флэшер. Она уже много раз выполняла подобные задачи и является отличным специалистом."
      - "Вам с Луисвилл нужно будет лишь обеспечивать её безопасность во время процесса."
  - char: "guam"
    side: "right"
    text:
      - "Так это задание для телохранителей, прямо по моему профилю~ Тогда никаких проблем, можете смело положиться на прекрасную девушку Гуам!"
      - "Каковы время и место нашей цели?"
  - char: "constellation"
    side: "left"
    text:
      - "Коралловое море, тот самый день, когда произошло морское сражение."
      - "...Я хочу ещё раз исследовать то поле боя."
      - "Проанализировав опыт всех наших предыдущих неудач, я разработала совершенно новый план извлечения. В этот раз всё обязательно получится."
  - char: "guam"
    side: "right"
    text:
      - "Операция по извлечению, кодовое имя «В погоне за светом»..."
  - text:
      - "Гуам внимательно изучила план операции, переданный ей Констеллейшн, и её лицо постепенно посерьёзнело."
  - char: "guam"
    side: "right"
    text:
      - "...Зона извлечения в этот раз... это та самая территория, которая во всех предыдущих симуляциях была классифицирована как запретная зона, куда строжайше запрещено входить, верно?"
      - "Разве подобная операция не нарушает запрет?"
  - char: "constellation"
    side: "left"
    text:
      - "Не волнуйся, Саратога уже получила все необходимые разрешения для этой операции, так что никаких препятствий не будет."
  - char: "guam"
    side: "right"
    text:
      - "........................"
  - char: "constellation"
    side: "left"
    text:
      - "...Всё ещё сомневаешься?"
  - char: "guam"
    side: "right"
    text:
      - "Эх... ладно-ладно~ Ваша прекрасная девушка, так и быть, сходит туда ради тебя~"
  - char: "constellation"
    side: "left"
    text:
      - "...Спасибо."
      - "Что ж, Сан-Хасинто, оставляю Гуам и Луисвилл на тебя. Отведи их к Флэшер, а затем запускайте процедуру извлечения."
  - char: "san_jacinto"
    side: "right"
    text:
      - "Принято, пожалуйста, следуйте за мной~"

chapter2:
  rows:
  - text:
      - "Хотя она и называлась зоной отправления операции по извлечению, однако перед глазами присутствующих не было никакого оборудования, хоть как-то связанного со словом «извлечение»."
      - "Тем более не было абсолютно ничего, на что можно было бы сесть и что можно было бы назвать «транспортным средством»."
      - "Вместо этого там находилось гигантское устройство, похожее на врата. Будучи самой необычной вещью в лаборатории, эти «врата», естественно, приковали к себе всеобщее внимание."
  - char: "guam"
    side: "left"
    text:
      - "...Эти врата... неужели это специализированное оборудование вашего Бюро анализа глубоководных данных для входа в симулированный мир?!"
      - "Так вы всё это время проводили эксперименты с помощью этого устройства. Неудивительно, что я никогда не встречала вас в Сердце Галактики!"
  - char: "san_jacinto"
    side: "right"
    text:
      - "Хе-хе, в конце концов, наша потребность во входах в симулированный мир куда выше, чем у других отделов."
      - "Помимо нашего бюро, в Море Звёзд есть ещё несколько подобных устройств."
      - "Принципы проектирования каждой машины отличаются, наверное, это можно назвать параллельным исследованием технологий?"
      - "Кстати, позвольте представить. Рядом со мной — Флэшер."
      - "Флэшер, это — Гуам из Бюро тактических операций и Луисвилл из Бюро проектирования снаряжения."
  - char: "flasher"
    side: "left"
    text:
      - "Всем привет! Я Флэшер, специалист по извлечению из Бюро анализа глубоководных данных! Надеюсь на плодотворное сотрудничество в предстоящей операции!"
      - "Старшая сестрёнка Гуам, твои влоги о Море Звёзд такие интересные, я... я твоя фанатка!"
      - "Скажи... после завершения операции... н-не могла бы ты дать мне автограф?!"
  - char: "guam"
    side: "right"
    text:
      - "Вау~ Не ожидала встретить здесь поклонницу! Без проблем~ Когда вернёмся, я обязательно дам тебе самый большой и красивый автограф☆~"
  - char: "flasher"
    side: "left"
    text:
      - "Б-большое спасибо!"
  - char: "louisville"
    side: "right"
    text:
      - "Какой милый ребёнок... Хочешь печенья?"
  - char: "guam"
    side: "left"
    text:
      - "...А?"
  - char: "flasher"
    side: "right"
    text:
      - "Хочу... Но я ведь не зверюшка."
  - char: "louisville"
    side: "left"
    text:
      - "Ах... очень извиняюсь, я случайно задумалась. Давайте лучше сосредоточимся на задании..."
  - char: "guam"
    side: "right"
    text:
      - "...Эта её черта, неужели... она рассеянная? Или просто на своей волне?"
      - "Ху-ху-ху... чувствую, в будущем мы сможем выпустить вместе парочку интересных передач."

chapter3:
  rows:
  - text:
      - "Серия сложных команд, понятных лишь самой Сан-Хасинто, была введена в панель управления."
      - "Круглая рама врат завибрировала, издав лёгкое гудение."
      - "Через несколько секунд вибрация прекратилась, осталось лишь мерное пиканье панели управления."
      - "Мягкий световой занавес выплыл из рамы, образовав яркие, но не слепящие врата из света."
  - char: "louisville"
    side: "left"
    text:
      - "Словно сцена из научно-фантастического фильма..."
      - "Я хочу уточнить... мы ведь собираемся войти в симулированный мир, а не путешествовать во времени... верно?"
  - char: "guam"
    side: "right"
    text:
      - "Именно так. Мне кажется, такую форму выбрали просто потому, что создателям она показалась крутой."
      - "В конце концов, если вещь не выглядит достаточно круто, как пользователи поверят в её мощь~"
  - char: "louisville"
    side: "left"
    text:
      - "Логично... Но как мы собираемся «извлекать» вещи из симулированного мира?"
  - char: "guam"
    side: "right"
    text:
      - "Э-э... тут задействовано множество узкоспециализированных знаний..."
      - "И эта прекрасная девушка без понятия, эхе-хе☆~"
  - char: "flasher"
    side: "left"
    text:
      - "Хи-хи... Сестрёнки, вы обе впервые участвуете в операции по извлечению, верно?"
      - "Не волнуйтесь, просто оставьте извлечение на меня!"
  - char: "louisville"
    side: "right"
    text:
      - "Какой надёжный ребёнок..."
  - char: "flasher"
    side: "left"
    text:
      - "Н-ну... скажете тоже... хе-хе."
  - char: "san_jacinto"
    side: "right"
    text:
      - "Раз все уже готовы, может, будем выдвигаться?"
  - char: "guam"
    side: "left"
    text:
      - "Без проблем, выдвигаемся~!"
