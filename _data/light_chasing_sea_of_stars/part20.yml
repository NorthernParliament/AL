chapter1:
  rows:
  - text:
      - "Гуам и её группа плыли по этому бескрайнему водному пространству, которое уже с трудом можно было назвать морем."
      - "Опознавательные сигналы, посылаемые неизвестными силами, сменились ещё несколько раз, и Лаффи отвечала им тем же."
      - "Хотя обе стороны не могли распознать сигналы друг друга, между ними, казалось, возникло некое негласное соглашение."
      - "Наконец... миновав ещё один искусственный остров, перед их глазами предстал флот, который они так долго искали."
  - char: "louisville"
    side: "left"
    text:
      - "Мне... мне ведь не мерещится?"
      - "Кажется, у этого флота... каждый корабль парит в воздухе?"
  - char: "san_jacinto"
    side: "right"
    text:
      - "Тебе не мерещится... Каждый корабль флота впереди действительно парит над поверхностью моря."
      - "Они парят на высоте... как минимум десятка метров?"
  - char: "laffey_ii"
    side: "left"
    text:
      - "На радаре... вообще ничего не видно..."
  - char: "guam"
    side: "right"
    text:
      - "...Невидимый флот такого масштаба — это уже перебор."
      - "Ладно ещё, когда радары не видят людей из Пепла..."
      - "Но ведь это... боевые корабли длиной в сотни метров?!"
  - text:
      - "Реальности нет дела до логики. Как бы невероятно это ни казалось, флот, состоящий из сотен боевых кораблей различных типов, подходил всё ближе."
  - char: "constellation"
    side: "left"
    text:
      - "Судя по внешнему виду... я могу узнать несколько типов фрегатов, а также линкоры и авианосцы."
  - char: "guam"
    side: "right"
    text:
      - "Неужели тот самый большой корабль — флагман флота?"
  - char: "constellation"
    side: "left"
    text:
      - "Возможно... В длину он, наверное, больше тысячи метров. Прямо как какая-то воздушная крепость..."
  - char: "guam"
    side: "right"
    text:
      - "Слушай, Констеллейшн... Те корабли, что мы видели в симулированном мире NY, ведь уже считались флотом будущего, верно?"
      - "Но по сравнению с тем, что перед нами, они кажутся игрушками, отставшими на несколько поколений..."
      - "Как думаешь, что это вообще такое?.."
  - char: "constellation"
    side: "left"
    text:
      - "Звёздный флот из научно-фантастических романов... или вроде того?"
  - char: "communicator"
    side: "right"
    status: "is-yellow"
    text:
      - "*Бип... Бип...*"
  - char: "laffey_ii"
    side: "left"
    text:
      - "...Слушайте, они начали вещание."

chapter2:
  rows:
  - char: "fortress_0???"
    side: "right"
    status: "is-yellow"
    text:
      - "Внимание: флот по курсу, на связи 5-я оперативная группа Совета."
      - "Текущий статус: ваши коды опознавания не могут быть расшифрованы."
      - "Требование: назовите номер вашего флота и цель прибытия в эту зону."
  - char: "constellation"
    side: "left"
    text:
      - "Этот ледяной тон... так похож на мисс Навигатор ТБ. Неужели это их система ИИ?"
  - char: "san_jacinto"
    side: "right"
    text:
      - "Мне кажется, в мисс Навигатор всё же больше человечности."
  - char: "guam"
    side: "left"
    text:
      - "Сейчас та сторона пытается выйти на связь, что будем делать, директор Констеллейшн?"
  - char: "constellation"
    side: "right"
    text:
      - "Ситуация неясна, нам нужно больше информации."
      - "..Это не моя стихия, так что переговоры оставляю на тебя, Гуам. Постарайся вытянуть из них побольше информации."
  - char: "guam"
    side: "left"
    text:
      - "Хорошо~ Предоставьте это прекрасной девушке Гуам~"

chapter3:
  rows:
  - char: "guam"
    side: "left"
    text:
      - "Кхм-кхм... Мы из Союза Орла, эм... мы из тестовой группы Моря Звёзд!"
      - "У меня тоже есть к вам вопросы. Что это ещё за Совет? И как вы вообще сюда попали?"
  - char: "fortress_0???"
    side: "right"
    status: "is-yellow"
    text:
      - "Выполняется поиск: тестовая группа Моря Звёзд, принадлежащая Союзу Орла..."
      - "Результат поиска: совпадений в базе данных не найдено."
      - "Вопрос: являетесь ли вы секретной группой, отправленной Союзом Орла?"
  - char: "guam"
    side: "left"
    text:
      - "Существование Моря Звёзд и правда довольно секретно... Точно-точно! Так и есть!"
  - char: "fortress_0???"
    side: "right"
    status: "is-yellow"
    text:
      - "Выполняется сканирование..."
      - "Результат сканирования: аномалия."
      - "Предупреждение: обнаружены следы угрозы V класса, согласно протоколу безопасности активировано состояние боевой готовности."
  - char: "louisville"
    side: "left"
    text:
      - "...Угроза пятого класса, что это значит?"
  - char: "flasher"
    side: "right"
    text:
      - "Оно говорит о предупреждении... Кажется... дело плохо..."
  - char: "fortress_0???"
    side: "left"
    status: "is-yellow"
    text:
      - "Требование: объясните причину повреждения маяка Совета, находящегося в ваших руках."
      - "Требование: предоставьте информацию о местонахождении подразделения, которому изначально принадлежал маяк."
      - "Требование: немедленно сложить оружие и содействовать досмотру."
  - char: "guam"
    side: "right"
    text:
      - "Подождите! Эта прекрасная девушка совершенно не понимает, о чём вы говорите!"
      - "Этот маяк мы подобрали по пути. Похоже, вы знаете, что это такое, так почему бы вам не рассказать мне?"
      - "Что касается сложения оружия... даже не думайте. И вообще, кто вы такие и по какому праву требуете от нас сложить оружие?"
  - char: "fortress_0???"
    side: "left"
    status: "is-yellow"
    text:
      - "Повторяю: мы 5-я оперативная группа Совета."
      - "Требование: немедленно сложить оружие и содействовать досмотру."
  - char: "guam"
    side: "right"
    text:
      - "Да что это ещё за Совет такой!!!"
  - char: "fortress_0???"
    side: "left"
    status: "is-yellow"
    text:
      - "Результат оценки: члены целевого флота заражены угрозой V класса."
      - "Стадия: ранняя."
      - "Симптомы: галлюцинации, помутнение рассудка."
      - "Предполагаемый источник заражения: «Предвестники»."
      - "Рекомендуемый план действий: приоритетное использование нелетального оружия. После лишения цели боеспособности провести седативную очищающую терапию."
      - "Выполнение плана..."
  - char: "san_jacinto"
    side: "right"
    text:
      - "Звучит так, будто они считают, что мы подверглись какому-то заражению, и у нас появились галлюцинации и помутнение рассудка..."
  - char: "guam"
    side: "left"
    text:
      - "Это у вас галлюцинации и помутнение рассудка!"
      - "Как же меня это бесит... Что это ещё за искусственный интеллект такой... Это скорее искусственный идиот."
      - "Его способности и на сотую... нет, на тысячную долю не дотягивают до мисс Навигатор!"
  - char: "louisville"
    side: "right"
    text:
      - "Но они сказали, что будут использовать нелетальное оружие, звучит довольно вежливо..."
  - char: "guam"
    side: "left"
    text:
      - "Ну да... Стоп, тогда пусть вообще на нас не нападают!"
  - char: "laffey_ii"
    side: "right"
    text:
      - "Хотят драться — будем драться... Лаффи не боится."
  - char: "constellation"
    side: "left"
    text:
      - "Хотя у меня есть ещё много вопросов... в нынешней ситуации о них придётся забыть."
      - "Тогда в бой... Нельзя упускать возможность сразиться с таким парящим флотом."
      - "Раз уж они собираются использовать нелетальное оружие, мы тоже поумерим нашу огневую мощь. Приготовиться к бою!"
