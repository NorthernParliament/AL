chapter1:
  rows:
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "...«Сводка», которую только что прислал Командир — отправлена по его личному каналу, так что можешь читать всё, что душе угодно."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Это... столкновение с феноменом коррозии в Море Звёзд?"
      - "Как я и ожидала, скверна Предвестников распространяется."
      - "Но этот Командир оказался весьма честным, раз готов делиться с тобой столь секретной информацией."
      - "Не то что некоторые. Чтобы записать все секреты, которые они скрывают, не хватит и трёх блокнотов."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Делая выпады в мою сторону, ты делаешь выпады в свою собственную... Ты же прекрасно знаешь, что знание правды — это не всегда благо."
      - "Мне всё это наскучило. Оставшиеся зоны для реконструкции — это те, которыми будешь пользоваться ты."
      - "С этим разбирайся сама, я в таких вещах не смыслю."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ладно-ладно, хорошо-хорошо~"
      - "Впрочем, с этим можно не спешить, есть дело поважнее."
      - "У тебя будет время в ближайшие дни отправиться на загородную прогулку?"
      - "Пришло время познакомить тебя с «мисс D»."
