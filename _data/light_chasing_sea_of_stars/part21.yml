chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "laffey_ii"
    side: "left"
    text:
      - "Электронные системы Лаффи... выходят из строя..."
      - "Осторожно... избегайте радиуса взрыва этих бомб!..."
  - char: "san_jacinto"
    side: "right"
    text:
      - "Палубная авиация полностью подавлена, в воздушном бою нам не одержать верх."
      - "Это действительно просто... дроны, запущенные серийными кораблями?"
  - char: "guam"
    side: "left"
    text:
      - "То, что там летает — действительно дроны... В этом я могу быть уверена."
      - "Но вот эти военные корабли... боюсь, они созданы совсем не так, как обычные серийные модели."
  - char: "flasher"
    side: "right"
    text:
      - "Уу... противник вообще не спускается на воду..."
      - "Простите... Флэшер совершенно ничем не может помочь..."
  - char: "louisville"
    side: "left"
    text:
      - "Ничего страшного, просто в этот раз нам попалось не совсем подходящее для тебя поле боя~"
  - char: "constellation"
    side: "right"
    text:
      - "Погодите... Неужели именно поэтому этот флот предпочитает парить над водой, затрачивая столько энергии?"
      - "Даже если они действительно хотят защититься от подводных угроз... это слишком расточительно. Неужели их запасы энергии безграничны?.."
  - char: "guam"
    side: "left"
    text:
      - "Ситуация складывается не в нашу пользу. Что скажешь... будем отступать?"
  - char: "constellation"
    side: "right"
    text:
      - "Сан-Хасинто, спланируй маршрут для отступления."
      - "А пока... посражаемся ещё немного..."
      - "Раз уж противник не хочет нас убивать, мы должны этим воспользоваться..."
      - "Продолжаем бой, соберём как можно больше данных перед возвращением!"
