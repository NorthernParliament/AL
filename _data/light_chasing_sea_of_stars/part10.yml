chapter1:
  rows:
  - char: "tb_rad"
    side: "right"
    text:
      - "Ещё раз оглашаю четвёртое правило текущего тестирования: запрещается вступать в любые формы диалога с Дьявол в симулированном мире, иначе тестирование будет прервано."
      - "Пожалуйста, подтвердите ещё раз."
  - char: "princeton"
    side: "left"
    text:
      - "Поняла, мы будем строго соблюдать правила."
  - char: "tb_rad"
    side: "right"
    text:
      - "Ответ подтверждён: данные Дьявол сгенерированы в указанной зоне, симуляционный бой скоро начнётся."

chapter2:
  rows:
  - text:
      - "Вдали приближался гигантский чёрный мех."
      - "На его спине возвышался огромный резервуар, в котором неизвестная жидкая субстанция испускала пугающий красный дым."
      - "Фронтальные бронеплиты были искривлены в зловещий узор, напоминающий череп адского рыцаря."
      - "А на этом черепе сидела миниатюрная девушка."
  - char: "devil"
    side: "right"
    text:
      - "Прежде чем мы официально начнём тестирование, позвольте мне вкратце обрисовать ситуацию."
      - "Меня зовут Дьявол XV, можете называть меня просто Дьявол."
      - "Хоть я и принадлежу к новому поколению Антиоха, моя сильная сторона — это поддержка и содействие, а не штурм и лобовые столкновения."
      - "Поэтому в предстоящем тренировочном бою, пожалуйста, будьте ко мне снисходительны и не переусердствуйте."
  - char: "princeton"
    side: "left"
    text:
      - "(...Какая вежливая...)"
      - "(Кажется... она сильно отличается от того образа Сирен, что был у меня в голове...)"
  - char: "devil"
    side: "right"
    text:
      - "Хм... почему вы все молчите?"
      - "Если есть вопросы, можете смело задавать."
  - char: "laffey_ii"
    side: "left"
    text:
      - "*Пристально смотрит...*"
  - char: "devil"
    side: "right"
    text:
      - "Видимо, вы из тех, кто не любит болтать, тогда давайте..."
  - text:
      - "БАБАХ!!!"
  - char: "laffey_ii"
    side: "left"
    text:
      - "*Пристально смотрит...*"
  - char: "devil"
    side: "right"
    text:
      - "Эй! Я ведь ещё не объявила о начале учений, как ты смеешь нападать исподтишка!"
  - char: "princeton"
    side: "left"
    text:
      - "(Почему мне кажется, что она... очень милая.)"
      - "(И это действительно... смоделировано TБ на основе данных Арбитров?..)"
  - text:
      - "БАБАХ!!!"
  - char: "laffey_ii"
    side: "left"
    text:
      - "*Пристально смотрит...*"
  - char: "devil"
    side: "right"
    text:
      - "Ух!... Тогда давайте сразимся в полную силу!"
  - char: "laffey_ii"
    side: "left"
    text:
      - "Как раз то, что нужно... Режим уничтожения, запуск!"
