chapter1:
  rows:
  - text:
      - "Гуам и остальные вернулись в комнату, в которой находились до отправления."
      - "Серебряная Лиса так и не показалась. Перед всеми по-прежнему был лишь корпус Боевого протокола Крепость, выполняющий функцию ретранслятора связи."
  - char: "silver_fox"
    side: "left"
    text:
      - "В недавнем бою вы проявили большую отвагу, и я от лица Совета выражаю вам свою благодарность."
  - char: "constellation"
    side: "right"
    text:
      - "Не стоит благодарности, госпожа Серебряная Лиса."
      - "По сравнению с твоим флотом, в прошедшем бою мы сыграли лишь весьма незначительную роль..."
  - char: "silver_fox"
    side: "left"
    text:
      - "Пожалуйста, не принижайте свои заслуги. В прошлом, когда я ездила по обмену в Империю Дракона, я услышала там одну пословицу: «Из песчинок складывается башня, а капля за каплей и камень точит»."
      - "Независимо от того, сильна она или слаба, каждая крупица объединённой силы играет свою уникальную роль."
      - "Именно поэтому и была учреждена Объединённая медаль Совета."
      - "Но хватит об этом. Вы уже придумали свои вопросы?"
  - char: "constellation"
    side: "right"
    text:
      - "Да, я всё тщательно обдумала."
  - char: "silver_fox"
    side: "left"
    text:
      - "Отлично. Мне уже не терпится узнать, что именно вы спросите."
      - "Тогда пусть наша игра начнётся~"

chapter2:
  rows:
  - char: "constellation"
    side: "right"
    text:
      - "Тогда, госпожа Серебряная Лиса, вот мой первый вопрос."
      - "Почему ваш флот передвигается, паря над поверхностью моря?"
      - "Я считаю, что подобная конструкция должна быть крайне энергозатратной."
  - char: "silver_fox"
    side: "left"
    text:
      - "Верно, по сравнению с обычным плаванием по воде, режим парения действительно требует гораздо больше энергии."
      - "Однако наши военные корабли питаются от массивов Энергетических Кубов, поэтому проблем с нехваткой энергии у нас не возникает."
      - "Что же касается причины использования такой конструкции, то это потому, что прямой контакт с поверхностью моря слишком опасен."
      - "Суровая реальность преподала нам урок: потери, вызванные контактом с морем, намного превышают затраты на парение."
  - char: "constellation"
    side: "right"
    text:
      - "Вот как... Причина, по которой контакт с водой слишком опасен, как-то связана с X?.."
      - "............"
  - char: "silver_fox"
    side: "left"
    text:
      - "...Мм?"
  - char: "constellation"
    side: "right"
    text:
      - "(Эта женщина... притворяется, что не услышала, и не собирается продолжать разговор!)"
      - "Кхм... Тогда следующий, второй вопрос."
      - "Совет, о котором вы постоянно упоминаете, что это вообще за организация?"
  - char: "silver_fox"
    side: "left"
    text:
      - "Хе-хе, а я-то думала, что именно это будет вашим первым вопросом."
      - "Что ж, на этот вопрос я тоже могу ответить."
      - "Полное название Совета — Объединённый Совет (United Council). Это межфракционная организация, созданная для объединения ресурсов всего человечества в борьбе против X."
      - "Мы являемся наднациональным политическим образованием, обладающим реальной властью — то есть тем, чем в идеале должна была стать старая Организация Объединённых Наций."
      - "Естественно, мобилизационные возможности Совета не идут ни в какое сравнение с той рыхлой структурой, которой была ООН в прошлом, а контролируемая нами военная мощь отличается от военной мощи ООН как небо и земля."
  - char: "constellation"
    side: "right"
    text:
      - "...Организация чего? Это какая-то организация, похожая на Лазурный путь?"
  - char: "silver_fox"
    side: "left"
    text:
      - "Это твой третий вопрос?"
  - char: "constellation"
    side: "right"
    text:
      - "А, пожалуйста, не считай это за вопрос, я просто спросила к слову."
  - char: "silver_fox"
    side: "left"
    text:
      - "Тогда мне не нужно на него отвечать~ Задавай следующий вопрос."
  - char: "constellation"
    side: "right"
    text:
      - "(Тц... И правда ни малейшей поблажки не даёт.)"
      - "(Ну тогда попробую задать ей вопрос поострее...)"

chapter3:
  rows:
  - char: "constellation"
    side: "right"
    text:
      - "Далее следует мой третий вопрос."
      - "Тот самый X, о котором вы говорите, что это такое?"
  - char: "silver_fox"
    side: "left"
    text:
      - "X — это обозначение определённого типа врагов. На пресс-конференции такой ответ был бы вполне уместен."
      - "Однако, раз уж мы все хотим обменяться информацией, я не стану отделываться столь поверхностными фразами."
      - "Вы не знаете, что такое X, а это значит, что вы с ним ещё не сталкивались на практике."
      - "Поэтому сейчас вам лучше ничего не знать об X. Знание — это опасность, и это не пустое запугивание."
      - "Так что мой ответ на этот вопрос: без комментариев."
  - char: "constellation"
    side: "right"
    text:
      - "А что насчёт Антиоха?"
      - "Я знаю, что Антиох — это оружие, которое вы используете для борьбы с X, но что именно он из себя представляет?"
      - "Это мой четвёртый вопрос."
  - char: "silver_fox"
    side: "left"
    text:
      - "Хм..."
  - char: "constellation"
    side: "right"
    text:
      - "На это тоже нельзя отвечать?"
  - char: "silver_fox"
    side: "left"
    text:
      - "Об этом я могу рассказать. Но система Антиох настолько масштабна, что трудно дать ей краткое определение."
      - "Хм... Название «Антиох» происходит от ANTI-X. Изначально это было боевое оружие, созданное для противостояния гипотетической неизвестной угрозе."
      - "Замысел при создании Антиоха заключался в том, чтобы он не боялся потерь и мог сохранять боеспособность в любых условиях как можно дольше."
      - "Поэтому с самого момента своего создания это был абсолютно беспилотный флот. Причём как гуманоидные модели, так и военные корабли питаются от массивов Энергетических Кубов."
      - "тобы эффективнее командовать флотом, мы также разработали для системы Антиоха множество искусственных личностей, предназначенных для выполнения различных типов задач."
      - "И вот этот самый флот, плод гонки вооружений, у которого даже не было чётко определённой цели для противостояния... действительно дождался появления X."
      - "...Даже не знаю, удача это или несчастье."
      - "Тебя устраивает такой ответ?"
  - char: "constellation"
    side: "right"
    text:
      - "Это дало мне больше информации, чем я ожидала. Большое спасибо."
  - char: "silver_fox"
    side: "left"
    text:
      - "Тогда, пожалуйста, задавай следующий вопрос~"
  - char: "constellation"
    side: "right"
    text:
      - "(К настоящему моменту из четырёх заданных мной вопросов госпожа «Серебряная Лиса» ответила на три.)"
      - "(Кажется, она действительно очень хочет что-то узнать от нас...)"
      - "(Чтобы оставить себе побольше пространства для манёвра, пора задать вопрос поострее.)"

chapter4:
  rows:
  - char: "constellation"
    side: "right"
    text:
      - "Далее пятый вопрос."
      - "В чём заключается ваша миссия?"
  - char: "silver_fox"
    side: "left"
    text:
      - "На этот счёт — без комментариев."
      - "Хе-хе, оставляешь себе пространство для манёвра, девочка?"
      - "Неплохая тактика, у госпожи Лексингтон хорошая младшая сестра."
  - char: "constellation"
    side: "right"
    text:
      - "(...Сестра Лексингтон?!)"
      - "(Точно! Если спросить её о технологии оснастки типа II для сестры Лексингтон, то, возможно...)"
      - "(Нет-нет... такую сложную технологию ни за что не объяснить в двух словах.)"
      - "(Она ответит лишь, возможна ли для неё трансформация в тип II или нет...)"
      - "(Если она ответит, что возможна, то в этом вопросе нет никакого смысла. А если ответит, что невозможна... и что с того, неужели я сдамся?)"
      - "(В конце концов, она никак не может знать о нынешнем положении сестры Лексингтон...)"
      - "(Внезапно упомянула имя сестры именно сейчас... Эта старая лиса, она хочет сбить меня с толку именем сестры?)"
  - char: "silver_fox"
    side: "left"
    text:
      - "Хе-хе, ну что, девочка, хорошенько обдумала свой последний вопрос?"
  - char: "constellation"
    side: "right"
    text:
      - "(...Я уже спросила про технологию парения, Совет и что такое Антиох.)"
      - "(Если продолжу допытываться до чего-то более существенного, наверняка снова ответит «без комментариев»...)"
      - "(В таком случае, самое интригующее, то, что я хочу знать больше всего...)"
      - "Кто ты?"
      - "И это мой шестой вопрос."
  - char: "fortress_1"
    side: "left"
    text:
      - "Я ИИ флота, подчинённого Совету, Боевой протокол Крепость."
  - char: "constellation"
    side: "right"
    text:
      - "...Что?"
      - "...П-плохо дело!"
  - char: "silver_fox"
    side: "left"
    text:
      - "Хе-хе, девочка, в этом вопросе я от тебя не отделалась и не солгала, а ответила именно так, как есть на самом деле."
      - "В конце концов, строго говоря, всё это время ты задавала вопросы Крепости, и отвечала на твои вопросы тоже Крепость."
  - char: "constellation"
    side: "right"
    text:
      - "......Старая лиса."
  - char: "silver_fox"
    side: "left"
    text:
      - "И теперь ситуация такова~ Я ответила на четыре из шести твоих вопросов, значит, ты тоже должна ответить на четыре из шести моих вопросов."
      - "Таковы правила нашей игры, верно~?"
  - char: "constellation"
    side: "right"
    text:
      - "Так и есть, верно..."
  - char: "silver_fox"
    side: "left"
    text:
      - "Отлично, тогда теперь мой черёд, мисс Констеллейшн~"
