chapter1:
  rows:
  - text:
      - "Когда зрение сфокусировалось, перед глазами Лаффи предстал мир, заполненный механизмами и обломками."
  - char: "laffey_ii"
    side: "left"
    text:
      - "...Мы выбрались."
      - "Принстон, где мы?"
      - "...Принстон?"
      - "Принстон... ты где?"
  - text:
      - "На зов Лаффи не последовало никакого ответа, лишь гладкая как зеркало поверхность моря излучала безмолвную, мертвую тишину."
  - char: "laffey_ii"
    side: "left"
    text:
      - "Принстон... исчезла?"
  - char: "guam_rad"
    side: "right"
    text:
      - "Лаффи! Ты меня слышишь?"
  - char: "laffey_ii"
    side: "left"
    text:
      - "Гуам?.."
  - char: "guam_rad"
    side: "right"
    text:
      - "Фух... Мы увидели, как в небе сверкнула вспышка и приземлилась в этой стороне, поэтому поспешили сюда всё проверить."
      - "Не ожидала, что это будешь ты. А где Принстон и Нортгемптон?"
  - char: "laffey_ii"
    side: "left"
    text:
      - "Нортгемптон... покинула тестирование на полпути... и не пошла с Лаффи."
      - "Принстон... ещё совсем недавно пряталась вместе с Лаффи от бури."
      - "А потом она... исчезла."
  - char: "guam_rad"
    side: "right"
    text:
      - "Вы попали сюда, пока прятались от бури? Какое совпадение, мы тоже так сюда попали..."
      - "Погоди-ка. Принстон исчезла?!"
      - "Оставайся на месте и никуда не уходи, мы сейчас же придём за тобой!"

chapter2:
  rows:
  - char: "laffey_ii"
    side: "left"
    text:
      - "...Вот и всё, Лаффи закончила."
  - char: "louisville"
    side: "right"
    text:
      - "Звучит так... словно вы столкнулись с чем-то паранормальным."
  - char: "flasher"
    side: "left"
    text:
      - "Дьявол в симуляции внезапно обрела разум... Как страшно..."
  - char: "guam"
    side: "right"
    text:
      - "Такая необычная встреча, как жаль, что это не было снято на камеру!"
      - "Нет-нет... Гораздо важнее, почему Принстон исчезла после того, как прошла через «выход»!"
      - "И связь с ней не устанавливается. Неужели её перенесло куда-то очень далеко от нас..."
      - "У прекрасной девушки Гуам предчувствие, что случилась грандиозная катастрофа!.."

chapter3:
  rows:
  - char: "constellation"
    side: "left"
    text:
      - "Ва-а-а-а-а-а!!!"
      - "С-Сан-Хасинто, буря ведь нас не догнала?!"
  - char: "san_jacinto"
    side: "right"
    text:
      - "Фух... Кажется, нет. Мы в безопасности."
  - char: "guam"
    side: "left"
    text:
      - "...А?"
  - char: "constellation"
    side: "right"
    text:
      - "...Э-э?"
      - "Чт... что происходит? Гуам, Луисвилл... Флэшер и Лаффи? Почему вы все вместе?"
      - "...Где мы... находимся?"
  - char: "guam"
    side: "left"
    text:
      - "Ну... это долгая история!"
  - char: "laffey_ii"
    side: "right"
    text:
      - "Это значит... Лаффи должна рассказать всё ещё раз?"
  - char: "guam"
    side: "left"
    text:
      - "Э-э... будь так добра!"

chapter4:
  rows:
  - char: "constellation"
    side: "left"
    text:
      - ".....Не ожидала, что после нашего входа в Линзу Реальности произойдёт так много всего."
      - "В Сердце Галактики наверняка произошёл какой-то серьёзный сбой..."
      - "Возможно... что-то пошло не так при анализе аномального блока данных."
      - "......Мне очень жаль."
      - "Вина за случившееся лежит на мне... я слишком поторопилась..."
      - "Флэшер, прости меня... Вы все были правы."
      - "Если бы я была хоть немного осторожнее..."
  - char: "flasher"
    side: "right"
    text:
      - "Ничего страшного. Главное, что сестрёнка Констеллейшн... в порядке."
  - char: "guam"
    side: "left"
    text:
      - "Точно! Главное, что сестрёнка Констеллейшн в порядке~"
  - char: "constellation"
    side: "right"
    text:
      - "...Почему и ты меня так называешь?"
  - char: "guam"
    side: "left"
    text:
      - "Конечно же, чтобы немного разрядить обстановку☆~"
      - "То, что случилось, уже случилось, и впадать в уныние из-за этого бессмысленно."
      - "К тому же, я думаю, что это, возможно, ещё не самый худший исход."
      - "Сама подумай: раз этот аномальный блок данных смог обойти первую проверку TБ, он мог обойти и вторую."
      - "Если мы его анализируем, рано или поздно всё могло обернуться именно так."
      - "Хорошо ещё, что нас всех втянуло сюда вместе, мы можем помогать друг другу."
      - "Представь, если бы во время проверки сюда затянуло только тебя одну — разве это не было бы куда большей проблемой?"
  - char: "constellation"
    side: "right"
    text:
      - "Спасибо за утешение..."
  - char: "guam"
    side: "left"
    text:
      - "Это называется рациональный анализ~ К тому же, разве ты не приводила постоянно в пример прошлый опыт Командира?"
      - "Помнишь, Командир раньше тоже сталкивался с подобной ситуацией, верно? И что тогда сделал Командир?"
      - "Если уж хочешь брать пример с Командира, то иди до конца~"
      - "В общем, не унывай! Здесь ты лучше всех разбираешься в технологиях, да и должность у тебя самая высокая. Так что наше спасение зависит от тебя~"
  - char: "constellation"
    side: "right"
    text:
      - "...Как бы то ни было, этот кризис начался из-за меня... Я больше не имею права руководить вами."
  - char: "guam"
    side: "left"
    text:
      - "Э-э... мне-то это говорить бесполезно... Я всё равно не могу снять тебя с должности."
  - char: "san_jacinto"
    side: "right"
    text:
      - "Как и ожидалось от прекрасной девушки Гуам, сразу же нашла правильный аргумент для возражения~"
  - char: "guam"
    side: "left"
    text:
      - "Хе-хе, спасибо за комплимент~"
  - char: "flasher"
    side: "right"
    text:
      - "Сестрёнка Констеллейшн... взбодрись... Я верю, что ты обязательно сможешь провести нас через эти трудности!"
  - char: "louisville"
    side: "left"
    text:
      - "Угу... выше нос, мисс Констеллейшн!"
  - char: "laffey_ii"
    side: "right"
    text:
      - "Принстон... всё ещё числится пропавшей..."
  - char: "constellation"
    side: "left"
    text:
      - "Хм... хорошо! Сейчас и правда нет времени раскисать!"
      - "...Раз уж вы все по-прежнему готовы мне верить, я обязательно возьму на себя ответственность и верну всех домой!"
  - char: "guam"
    side: "right"
    text:
      - "Ого~ Аж дух захватывает!"
      - "Тогда протоколирование этого процесса предоставьте мне!"
      - "...Кстати говоря, в нынешней ситуации... мне ведь уже можно снимать?.."
  - char: "constellation"
    side: "left"
    text:
      - "Угу, вести записи в подобной ситуации крайне необходимо."
      - "Снимай сколько хочешь, отснятые данные потом обработает Бюро анализа глубоководных данных, гарантирую, что ты получишь их в целости и сохранности."
  - char: "guam"
    side: "right"
    text:
      - "Ура!!"
      - "Так что нам делать дальше? Директор Констеллейшн?"
  - char: "constellation"
    side: "left"
    text:
      - "Хм... Первым делом нужно обследовать окрестности."
      - "Должна быть причина тому, что мы смогли собраться здесь из разных симулированных миров..."
      - "Рассредоточиться и обыскать территорию, мы во что бы то ни стало должны её найти!.."
