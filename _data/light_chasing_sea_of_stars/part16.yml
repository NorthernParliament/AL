chapter1:
  rows:
  - text:
      - "В комнате управления противостояние TБ и вредоносных данных продолжалось."
  - char: "anchorage"
    side: "left"
    text:
      - "TБ, TБ... экраны снова мигают..."
      - "Анкоридж... готова разбить стекло!"
  - char: "tb"
    side: "right"
    text:
      - "Не волнуйся, Анкоридж."
      - "В режиме реагирования на кризис я могу абсолютно свободно распоряжаться ресурсами базы Море Звёзд."
  - char: "anchorage"
    side: "left"
    text:
      - "...Хм?"
  - char: "tb"
    side: "right"
    text:
      - "Другими словами... больше не нужно разбивать стекло."
      - "Отчёт о текущей ситуации: вредоносные данные успешно изолированы. Они помещены в безопасную песочницу."
      - "Однако пока нет возможности полностью их удалить."
      - "В то же время, поскольку их первой целью стала система связи, я полностью отключила её, чтобы обеспечить физическую изоляцию этих данных."
      - "По этой причине в данный момент вы не можете покинуть комнату управления или связаться с внешним миром. Приношу свои извинения."
  - char: "anchorage"
    side: "left"
    text:
      - "Ничего страшного, Анкоридж останется здесь..."
      - "Будет... болеть за TБ!"
      - "Будет... подбадривать TБ!"
      - "И... рисовать для TБ!"
  - char: "tb"
    side: "right"
    text:
      - "Большое спасибо."
      - "Однако, позволь задать вопрос: почему ты упомянула рисование?"
  - char: "anchorage"
    side: "left"
    text:
      - "Потому что... разве TБ тоже не рисует?"
      - "Рисунки на экране... это ведь TБ нарисовала! Очень красиво!"
  - char: "tb"
    side: "right"
    text:
      - "Рисунки на экране?"
      - "Понятно. Это не рисунки, а визуальное отображение аномальных зон."
  - char: "anchorage"
    side: "left"
    text:
      - "Но... они похожи на рисунок..."
      - "Похожи... на маяк!.."
      - "И ещё буквы... U... C..."
  - char: "tb"
    side: "right"
    text:
      - "Маяк и буквы? Запуск модуля анализа..."
      - "Вывод: совпадений не найдено."
  - char: "anchorage"
    side: "left"
    text:
      - "TБ... не видит их?.."
      - "Ничего страшного... Анкоридж... нарисует их для тебя!"
