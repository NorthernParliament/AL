chapter1:
  rows:
  - char: "flasher"
    side: "left"
    text:
      - "Сестрёнка Констеллейшн... прибор для извлечения обнаружил подозрительную цель!"
  - char: "constellation"
    side: "right"
    text:
      - "Так я и думала... Я не ошиблась. Поблизости действительно существует некая «аномальная цель», которая перенесла нас всех сюда."
  - char: "flasher"
    side: "left"
    text:
      - "Источник сигнала находится под водой... сестрёнка Констеллейшн, я нырну и посмотрю!"

chapter2:
  rows:
  - text:
      - "Спустя некоторое время миниатюрная девушка вынырнула на поверхность, держа в руках металлический предмет."
  - char: "flasher"
    side: "left"
    text:
      - "Сестрёнка Констеллейшн, я вернулась!"
      - "Смотрите все... я нашла вот это!"
  - char: "guam"
    side: "right"
    text:
      - "А?.. Разве ты не говорила раньше, что нужно просто отметить данные с помощью прибора?"
      - "Почему в этот раз ты и правда выловила... э-э... какую-то вещь?"
  - char: "flasher"
    side: "left"
    text:
      - "Потому что... эта операция вышла за рамки намеченного плана... и нельзя с уверенностью сказать, нормально ли работает служба записи данных на сервере."
      - "К тому же... он был совсем близко, поэтому Флэшер просто забрала его с собой!"
  - char: "guam"
    side: "right"
    text:
      - "Какая предусмотрительность!.."
  - char: "flasher"
    side: "left"
    text:
      - "Эхе-хе~ К тому же, сестрёнка Констеллейшн, прибор определил, что этот извлечённый предмет имеет высокую степень сходства с аномальным блоком данных, который мы обнаружили ранее!"
  - char: "constellation"
    side: "right"
    text:
      - "Как такое возможно... скорее дай мне взглянуть."

chapter3:
  rows:
  - text:
      - "Констеллейшн взяла извлечённый предмет из рук Флэшер и внимательно осмотрела его."
  - char: "constellation"
    side: "left"
    text:
      - "Хм... структурно этот предмет состоит из двух частей."
      - "Основание толщиной около десяти сантиметров, а основная конструкция длиной примерно тридцать сантиметров. Похоже, это... устройство для передачи сигнала."
      - "Очень лёгкое... все панели разбиты... электронные компоненты оголены... невозможно запустить... тц, оно уже сломано..."
      - "Номера деталей... буквы стёрты, невозможно прочитать..."
  - char: "guam"
    side: "right"
    text:
      - "Ну как, удалось что-нибудь выяснить?"
  - char: "constellation"
    side: "left"
    text:
      - "Оно слишком сильно повреждено, пока не удалось получить никакой полезной информации."
      - "Однако, судя по внешнему виду, это, похоже, устройство для передачи сигнала, которое должно было дрейфовать на поверхности моря... словно какой-то маяк."
  - char: "guam"
    side: "right"
    text:
      - "Маяк?.."
  - char: "constellation"
    side: "left"
    text:
      - "Маяк указывает путь... возможно, именно поэтому мы здесь собрались."
      - "А причина его активации... неужели это из-за того, что Линза Реальности запустила процесс анализа?.."
      - "Интересно... Неужели симулированные миры в Море Звёзд не изолированы друг от друга?.."
  - char: "guam"
    side: "right"
    text:
      - "Э-э... мисс Констеллейшн, о чём ты говоришь? Я совершенно ничего не понимаю."
  - char: "constellation"
    side: "left"
    text:
      - "Насчёт того, почему мы здесь оказались... у меня есть догадка, но это всего лишь догадка..."
      - "Раз уж у нас появились зацепки относительно того, как мы сюда попали, следующий вопрос, который предстоит выяснить, — где мы находимся."
      - "Сан-Хасинто, ты уже систематизировала данные разведки?"
  - char: "san_jacinto"
    side: "right"
    text:
      - "Угу. Если вкратце... в этой акватории и на окрестных островах нет абсолютно ничего."
      - "В воде нет рыб, на островах нет животных, нет даже растений и насекомых."
      - "К тому же, посмотрите на те возвышенности вдали, похожие на горные хребты. На самом деле это просто «мусорные кучи», образованные скоплением каких-то отходов."
      - "То же самое касается и островов — все они искусственные."
      - "Кроме того, я видела несколько крупных комплексов плавучих островов... немного напоминает стиль Сирен."
      - "Вот фотографии, посмотрите сами."
  - char: "louisville"
    side: "left"
    text:
      - "Этот архитектурный стиль... ошибки быть не может, это плавучие крепости Сирен."
  - char: "guam"
    side: "right"
    text:
      - "Посмотрите, что это за огромное пространство в углу... склады для хранения припасов?"
  - char: "constellation"
    side: "left"
    text:
      - "Похоже, Сирены занимаются в этой акватории крупномасштабной добычей ресурсов... или же процессом утилизации."
      - "Я впервые своими глазами вижу, как Сирены занимаются подобным..."
  - char: "guam"
    side: "right"
    text:
      - "Неужели это какая-то скрытая тыловая база Сирен или что-то в этом роде?.."
      - "У меня вдруг появилась одна идея, подождите минутку~"
  - text:
      - "Гуам внезапно наклонилась, зачерпнула пригоршню воды с поверхности моря и выпила её залпом."
  - char: "constellation"
    side: "left"
    text:
      - "Т-ты что делаешь?!"
  - char: "flasher"
    side: "right"
    text:
      - "Сестрёнка Гуам... если ты хочешь пить, у Флэшер есть вода..."
      - "Если будешь пить что попало, смотри, как бы живот не заболел..."
  - char: "guam"
    side: "left"
    text:
      - "...Я просто проверяла одну догадку."
      - "Сан-Хасинто, ты ведь только что провела разведку этого района палубными самолётами, можешь с уверенностью сказать, что это море?"
  - char: "san_jacinto"
    side: "right"
    text:
      - "Ну... да? К чему ты спрашиваешь?"
  - char: "guam"
    side: "left"
    text:
      - "Здешняя вода совершенно не солёная."
  - char: "constellation"
    side: "right"
    text:
      - "Что ты сказала?! Дай-ка и я попробую..."

chapter4:
  rows:
  - char: "constellation"
    side: "right"
    text:
      - ".....Ни солёная, ни горькая. У меня появилось одно нехорошее предположение."
      - "Флэшер, ты взяла с собой оборудование для анализа морской воды?"
  - char: "flasher"
    side: "left"
    text:
      - "Взяла!"
  - char: "constellation"
    side: "right"
    text:
      - "...Немедленно проведи анализ её состава."

chapter5:
  rows:
  - char: "flasher"
    side: "left"
    text:
      - "Сестрёнка Констеллейшн, результаты анализа готовы."
  - char: "constellation"
    side: "right"
    text:
      - "Так я и думала... В ней не только нет соли, но и минералов — вообще никаких минералов."
      - "Иными словами... можно с уверенностью сказать, что море у нас под ногами состоит из дистиллированной воды."
  - char: "guam"
    side: "left"
    text:
      - "Я так и знала... Я же говорила, как Сирены могли упустить такие колоссальные ресурсы, скрытые в морской воде..."
  - char: "louisville"
    side: "right"
    text:
      - "Море из дистиллированной воды? Неужели Сирены способны даже на такое..."
  - char: "communicator"
    side: "left"
    text:
      - "*Бип... бип...*"
  - char: "laffey_ii"
    side: "right"
    text:
      - "Система радиолокационного опознавания Лаффи... уловила странный сигнал..."
  - char: "guam"
    side: "left"
    text:
      - "Удалось распознать?"
  - char: "laffey_ii"
    side: "right"
    text:
      - "...Невозможно распознать."
  - char: "louisville"
    side: "left"
    text:
      - "Система радиолокационного опознавания... значит, цель, по крайней мере, находится в радиусе действия радара..."
      - "Но обстановка здесь довольно запутанная... раз сигнал такой сильный, неужели поблизости прячется флот Сирен?"
  - char: "guam"
    side: "right"
    text:
      - "Это действительно неизвестный флот, но вряд ли Сирены."
      - "Я ещё ни разу не видела, чтобы Сирены пытались запросить у нас опознавание «свой-чужой»."
  - char: "laffey_ii"
    side: "left"
    text:
      - "...Снова сигнал, на этот раз сменилась кодировка, но... по-прежнему невозможно распознать."
  - char: "san_jacinto"
    side: "right"
    text:
      - "Шлют сигналы только на систему Лаффи..."
  - char: "guam"
    side: "left"
    text:
      - "Что будем делать дальше, директор Констеллейшн?"
  - char: "constellation"
    side: "right"
    text:
      - "Ты права, Сирены не стали бы запрашивать у нас опознавание."
      - "Смена кодировки означает, что... по крайней мере, та сторона уже чётко знает о нашем «присутствии»."
      - "...Оставаться в пассивном положении слишком рискованно."
      - "Лаффи, отправь неизвестным силам наш опознавательный сигнал. Посмотрим на их реакцию."
