chapter1:
  rows:
  - text:
      - "В тёмной комнате без окон мерцал лишь слабый звёздный свет, исходящий от астрономического проектора."
      - "Девушка сидела за столом и тихо шептала."
  - char: "constellation"
    side: "left"
    text:
      - "Как ни гадай, результат всегда один и тот же..."
      - "На этот раз всё обязательно пройдёт гладко..."
      - "...сестра."

chapter2:
  rows:
  - text:
      - "В свете луны густой туман, словно серебряная вуаль, окутывал бескрайнее море."
      - "Морской ветер, проносящийся между островами, приносил знакомое тепло и влажность, но в то же время таил в себе незнакомые отголоски."
      - "В этот самый момент это место казалось перекрёстком искажённого пространства и времени. Незнакомая аура и знакомые воспоминания сплетались воедино, создавая головокружительную картину..."
  - char: "guam"
    side: "left"
    text:
      - ": ...Так это и есть симулированный мир, воссоздающий поле брани былых дней..."
  - char: "flasher"
    side: "right"
    text:
      - "Старшая сестрёнка Гуам... ты здесь впервые?"
  - char: "guam"
    side: "left"
    text:
      - "К входам в симулированные миры я уже привыкла, но из-за специфики моего отдела я в основном сражаюсь с конкретными врагами на различных симулированных полях боя."
      - "А вот попадать в места из «чьих-то воспоминаний», как сейчас... для меня в новинку."
  - char: "flasher"
    side: "right"
    text:
      - "...В таком случае, сестрёнка Гуам, пожалуйста, строго соблюдай меры предосторожности."
  - char: "louisville"
    side: "left"
    text:
      - "Насколько я помню, правила гласят... необходимо строго следовать навигационному плану и прибыть в заданный район в установленное время."
      - "...До получения разрешения на протяжении всего пути необходимо сохранять строжайшее радиомолчание, а также запрещается открывать огонь."
      - "И ещё... после начала боя мы должны продвигаться к цели исследования так далеко, как только сможем, не останавливаясь, пока нас принудительно не извлекут из симуляции... Верно?.."
  - char: "flasher"
    side: "right"
    text:
      - "Верно-верно!"
  - char: "guam"
    side: "left"
    text:
      - "Принудительное извлечение, звучит и правда опасно... В моём отделе это сочли бы за тренировку аварийныйх ситуаций."
  - char: "flasher"
    side: "right"
    text:
      - "У нас это тоже редкость... Точнее сказать, только эта операция — исключение?"
  - char: "guam"
    side: "left"
    text:
      - "Хм... Для этой операции и правда сделали слишком много исключений."
      - "Радар этой прекрасной девушки бьёт тревогу, у меня какое-то нехорошее предчувствие..."
  - char: "flasher"
    side: "right"
    text:
      - "...А? Сестрёнка Гуам плохо себя чувствует? Нужно прервать операцию?"
  - char: "guam"
    side: "left"
    text:
      - "А, ничего-ничего~ Просто атмосфера здесь уж слишком мрачная."
      - "К тому же, как подумаю о том, что должно произойти на этом поле боя... негативные эмоции сами по себе лезут наружу."
      - "Неудивительно, что Констеллейшн сама не захотела прийти..."
  - char: "flasher"
    side: "right"
    text:
      - "Так нельзя! Сестрёнка Гуам!"
      - "Это лишь созданный компьютером симулированный мир, а не наша реальность! Ни в коем случае нельзя в него «погружаться»!"
  - char: "guam"
    side: "left"
    text:
      - "Да-да, я знаю!"
      - "Тогда приготовиться к выполнению задания, камера..."
  - char: "flasher"
    side: "right"
    text:
      - "*Пристально смотрит...*"
  - char: "guam"
    side: "left"
    text:
      - "хахаха... её тоже нельзя включать... верно?"
  - char: "flasher"
    side: "right"
    text:
      - "*Кивает*"
  - char: "guam"
    side: "left"
    text:
      - "Ууу... твоя правда!"
  - char: "louisville"
    side: "right"
    text:
      - "Ну-ну, не плачь, нам пора выдвигаться~"
