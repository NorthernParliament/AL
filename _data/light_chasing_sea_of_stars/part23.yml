chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Сражение в акватории продолжалось."

chapter2:
  rows:
  - char: "guam"
    side: "left"
    text:
      - "Констеллейшн, ты видела? Все повреждённые дроны летят назад, к тому кораблю, похожему на цилиндр."
  - char: "constellation"
    side: "right"
    text:
      - "Полевой ремонтный центр... Кажется, я понимаю, для чего нужен этот странный военный корабль."
  - char: "guam"
    side: "left"
    text:
      - "Именно! Ты тоже заметила странность?"
  - char: "constellation"
    side: "right"
    text:
      - "...Этот флот чересчур трепетно относится к боевым потерям."
  - char: "guam"
    side: "left"
    text:
      - "Точно!"
      - "После появления высшей Сирены мы открыли огонь изо всех орудий, но до сих пор не смогли потопить ни одного корабля."
      - "Было несколько явных моментов, когда противник мог бы получить урон, если бы рискнул нас преследовать, но они сразу же отводили повреждённые корабли в тыл."
  - char: "constellation"
    side: "right"
    text:
      - "Верно... Этот флот и правда как-то слишком печётся о боевых потерях."
      - "В таком случае, возможно, мы сможем найти способ заставить их отступить..."
  - char: "guam"
    side: "left"
    text:
      - "Сконцентрировать огонь на одном корабле!"
  - char: "constellation"
    side: "right"
    text:
      - "Внимание всем кораблям, сконцентрировать огонь на цели, которую я отметила!"
