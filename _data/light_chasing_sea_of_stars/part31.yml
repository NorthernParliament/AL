chapter1:
  rows:
  - text:
      - "Игра в шест вопросов продолжалась."
      - "Началась вторая половина игры..."
  - char: "constellation"
    side: "left"
    text:
      - "...Пожалуйста, задавай свои вопросы, госпожа Серебряная Лиса."
  - char: "silver_fox"
    side: "right"
    text:
      - "Что ж, мой первый вопрос."
      - "Вы знаете состав лунного грунта?"
  - char: "constellation"
    side: "left"
    text:
      - "Состав лунного грунта?.. Не знаю."
      - "Я бы тоже хотела однажды исследовать далёкое звёздное небо над головой."
      - "Но война с Сиренами истощила все наши ресурсы..."
      - "Боюсь... приоритет освоения космоса придётся отложить на неопределённый срок."
  - char: "silver_fox"
    side: "right"
    text:
      - "Вот как... Но ты упоминала, что вы прибыли с базы под названием «Море Звёзд»."
      - "Вы ещё не начали исследовать космос, но при этом явились из «Моря Звёзд»."
      - "Что из себя представляет эта база «Море Звёзд»?"
      - "Это мой второй вопрос."
  - char: "constellation"
    side: "left"
    text:
      - "Любая информация о Море Звёзд является совершенно секретной, я не имею права её разглашать."
      - ": ...Эх, на самом деле, изначально даже само название «Море Звёзд» не должно было произноситься вслух."
  - char: "guam"
    side: "right"
    text:
      - "...Правда?.."
  - char: "constellation"
    side: "left"
    text:
      - "Да... ведь для внешнего мира у нас есть официальная легенда о «Флоте внутреннего озера»."
  - char: "silver_fox"
    side: "right"
    text:
      - "Значит, на этот второй вопрос ответ «без комментариев»?"
  - char: "constellation"
    side: "left"
    text:
      - "Да, пожалуйста, задавай свой третий вопрос."
  - char: "silver_fox"
    side: "right"
    text:
      - "Мой третий вопрос."
      - "Откуда у вас Кубы Мудрости?"
  - char: "constellation"
    side: "left"
    text:
      - "На этот вопрос я могу ответить."
      - "Куб Мудрости — это научное чудо, созданное общими усилиями лучших умов всего мира после основания Лазурного пути."
      - "Он также стал поворотным моментом в нашей войне с Сиренами."
      - "Именно благодаря появлению Кубов Мудрости на свет смогли появиться мы, «кансен», и тяжёлая военная ситуация начала меняться к лучшему."
      - "Способ создания Кубов Мудрости прекрасно известен всем фракциям, и они могут производить их самостоятельно."
      - "Однако, судя по всему, из-за того, что в процессе производства используются какие-то крайне редкие минералы, в настоящее время объёмы выпуска очень малы."
      - "Это всё, что мне известно."
  - char: "silver_fox"
    side: "right"
    text:
      - "...Требуются особые минералы, и объём их производства мал... вот как."
      - "Тогда следующий, четвёртый вопрос."
      - "Какова организационная структура Сирен?"
      - "Или, точнее, с какими типами Сирен вам доводилось сражаться?"
  - char: "constellation"
    side: "left"
    text:
      - "Хм... Этот вопрос немного сложноват. Можно, Гуам вкратце всё объяснит?"
  - char: "silver_fox"
    side: "right"
    text:
      - "Без проблем."
  - char: "guam"
    side: "left"
    text:
      - "Без проблем~ Оставьте всё, что касается Сирен, на меня, командира Бюро тактических операций~"
  - char: "constellation"
    side: "right"
    text:
      - "...Не болтай лишнего."
  - char: "guam"
    side: "left"
    text:
      - "А... хорошо!"
      - "Кхм-кхм... Обычные вооружённые силы Сирен состоят из различных серийных моделей военных кораблей и Пешек."
      - "Помимо этого, ими командуют более разумные высокоранговые Сирены."
      - "Например, Пьюрифайер, Тестер, Омиттер, Компилятор, Обсервер и тому подобные."
      - "Разные типы высокоранговых Сирен специализируются на разной тактике и используют различное боевое оружие."
      - "Впрочем, Мейнфрейм Компилятора мы уже успешно уничтожили в ходе одной из наших предыдущих операций~!"
      - "Кроме того, есть ещё один тип высокоранговых Сирен, которые обладают невероятной боевой мощью и появляются словно из ниоткуда — Арбитры и контролируемые ими Энфорсеры."
      - "Силу Энфорсеров вы уже видели в недавнем бою. Что же касается Арбитров..."
      - "Даже с мощью вашего флота я бы не рекомендовала вам вступать с ними в бой... Победите — понесёте огромные убытки, проиграете... о таком и говорить не стоит."
      - "Лучше с ними вообще не сталкиваться."
  - char: "silver_fox"
    side: "right"
    text:
      - "Хм, я запомнила. Теперь мой пятый вопрос."
      - "Вы когда-нибудь слышали о проекте «Рассвет»?"
  - char: "guam"
    side: "left"
    text:
      - "...Проект «Рассвет»?"
  - char: "constellation"
    side: "right"
    text:
      - "...Гуам, на этот вопрос отвечу я."
      - "............"
  - char: "silver_fox"
    side: "left"
    text:
      - "Девочка, судя по твоему лицу, ты хочешь ответить «без комментариев»."
      - "Но в то же время ты обдумываешь, что если откажешься отвечать на этот вопрос, у тебя не останется пространства для манёвра на следующий."
      - "Поэтому на мгновение ты подумала, не соврать ли, чтобы выкрутиться, но тут же решила, что это будет нечестно."
      - "И теперь тебе остаётся лишь использовать молчание, чтобы потянуть время и дать мозгу возможность собраться с мыслями."
      - "Я права?"
  - char: "constellation"
    side: "right"
    text:
      - "..Вы сказали, что позывной «Серебряная Лиса» придумали не вы сами."
      - "В таком случае я бы хотела похвалить того, кто дал вам этот позывной... Он вам действительно подходит."
  - char: "silver_fox"
    side: "left"
    text:
      - "Ха-ха-ха, если представится возможность, я обязательно передам ему эту похвалу."
      - "Не волнуйся, девочка. Клянусь именем постоянного члена Совета, следующий вопрос совершенно не поставит тебя в тупик."
      - "Можешь смело отвечать."
  - char: "constellation"
    side: "right"
    text:
      - "...Раз так, то на этот ваш вопрос — без комментариев."
  - char: "silver_fox"
    side: "left"
    text:
      - "Тогда далее следует мой шестой вопрос, и по совместительству последний вопрос в этой игре."
      - "Учитывая, что ранее ты уже дважды отказалась отвечать, на этот вопрос ты обязана дать мне ответ."
      - "Так о чём же мне тебя спросить, чтобы и в тупик не поставить, и ответ получить~"
  - text:
      - "На мгновение Констеллейшн показалось, что она ослышалась."
      - "Голос Серебряной Лисы, которая всё это время сохраняла абсолютное спокойствие и уверенность, сейчас почему-то слегка дрожал."
      - "Это была дрожь от с трудом сдерживаемого волнения."
  - char: "constellation"
    side: "left"
    text:
      - "(Неужели этот последний вопрос, на который я обязана ответить... и был её истинной целью, ради которой она согласилась сыграть со мной в эту игру?)"
      - "Госпожа Серебряная Лиса... если это в моих силах, я обязательно вам отвечу."
  - char: "silver_fox"
    side: "right"
    text:
      - "В таком случае мой шестой вопрос..."
      - "Как обстоят дела в Свердловске?"
  - char: "constellation"
    side: "left"
    text:
      - "...Что?"
  - text:
      - "Констеллейшн строила множество догадок о том, каким же будет этот вопрос, на который она обязана ответить Серебряной Лисе."
      - "Но то, что она услышала, оказалось далеко за пределами её предположений."
  - char: "constellation"
    side: "left"
    text:
      - "Свердловск... звучит как название какого-то места на территории Северного Парламента."
      - "..Мне очень жаль, но я не слишком хорошо разбираюсь в географии Северного Парламента."
      - "...Я не слышала никаких новостей об этом месте."
  - char: "silver_fox"
    side: "right"
    text:
      - "Вот как..."
  - text:
      - "Даже в голосе, изменённом устройством, Констеллейшн всё равно уловила эмоции, в которых смешались разочарование и печаль."
  - char: "constellation"
    side: "left"
    text:
      - "...Неужели это ваша родина?"
      - "Т-тогда этот вопрос не считается! Госпожа «Серебряная Лиса», вы можете задать мне ещё один вопрос!"
  - char: "silver_fox"
    side: "right"
    text:
      - "...Девочка, делать такие большие уступки по собственной инициативе в игре не слишком благоразумно, не так ли?"
  - char: "constellation"
    side: "left"
    text:
      - "Но ведь то, что между нами происходит — это всего лишь игра, верно?"
      - "А раз это игра, разве не нормально позволить себе небольшую вольность?"
  - char: "silver_fox"
    side: "right"
    text:
      - "...Хе-хе, ты права. Тогда не буду стесняться."
  - text:
      - "В коммуникаторе повисла недолгая тишина."
  - char: "silver_fox"
    side: "right"
    text:
      - "...Я придумала. Я хочу, чтобы ты ответила мне..."
      - "Аосте, с ним всё в порядке?"
  - char: "constellation"
    side: "left"
    text:
      - "...Аосте... кто это?"
      - "Прошу прощения... Я никогда не слышала этого имени."
      - "Ничего страшного, это тоже не считается. В-вы можете задать ещё один вопрос!"
  - text:
      - "На другом конце коммуникатора воцарилась полная тишина на долгое... долгое время."
  - char: "constellation"
    side: "left"
    text:
      - "..Госпожа Серебряная Лиса?"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Эй! Вы там закончили? Я принесла медали~"
      - "А заодно принесла и хорошие новости~"

chapter2:
  rows:
  - char: "prinston_meta"
    side: "right"
    text:
      - "Хе-хе, прошу прощения за беспокойство, ваша игра уже закончилась?"
  - char: "constellation"
    side: "left"
    text:
      - "Ну..."
  - char: "silver_fox"
    side: "right"
    text:
      - "Уже закончилась. О каких хороших новостях ты говорила?"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Госпожа «Серебряная Лиса», работы по ремонту и очистке маяка полностью завершены!"
  - char: "fortress"
    side: "right"
    text:
      - "В блоке памяти этого маяка обнаружены следы искусственного вмешательства, а также была внедрена вредоносная программа."
      - "Однако я уже завершила процедуру очистки. Теперь достаточно лишь активировать его, чтобы узнать, через что прошёл этот маяк."
  - char: "guam"
    side: "left"
    text:
      - "Замечательно! Именно этот маяк стал источником всех тех аномальных событий, в которые мы оказались втянуты. Возможно, внутри найдутся зацепки, которые позволят нам вернуться домой."
      - "Скорее запускайте, давайте посмотрим~!"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Госпожа Серебряная Лиса?"
  - char: "silver_fox"
    side: "left"
    text:
      - "Запускай."
  - text:
      - "Получив разрешение, Принстон положила руку на кнопку активации маяка."
      - "И легонько нажала..."

chapter3:
  rows:
  - text:
      - "В мгновение ока Принстон META, Боевой протокол Крепость, флот Совета, море руин..."
      - "Всё, что до этого окружало их, бесследно исчезло."
      - "Словно один сон в одночасье сменился другим."
  - char: "san_jacinto"
    side: "left"
    text:
      - "Это... симуляция Кораллового моря?"
      - "Нас вернули обратно?"
  - char: "louisville"
    side: "right"
    text:
      - "Что вообще произошло... такой огромный флот исчез в мгновение ока."
  - char: "constellation"
    side: "left"
    text:
      - "...Возможно, это как-то связано с только что активированным маяком."
  - char: "laffey_ii"
    side: "right"
    text:
      - "...Я нашла... Принстон..."
  - char: "guam"
    side: "left"
    text:
      - "...А? Что ты сказала?"
  - char: "flasher"
    side: "right"
    text:
      - "И правда! Сестрёнка Гуам, сестрёнка Констеллейшн, скорее посмотрите, там на воде лежит... сестрёнка Принстон!"
  - char: "guam"
    side: "left"
    text:
      - "Эй! Принстон, ты в порядке?!"

chapter4:
  rows:
  - char: "princeton"
    side: "left"
    text:
      - "Мм... Сара-семпай... Аляска-семпай... этот приветственный банкет такой роскошный... zZZ"
      - "Аха-ха... эхе-хе... zZZ"
  - char: "constellation"
    side: "right"
    text:
      - "...Она... спит?"
  - char: "guam"
    side: "left"
    text:
      - "Вот это мастерство! Судя по всему, ей ещё и снится чудесный сон."
      - "Жаль только, что когда она проснётся, то вернётся в суровую реальность, где в Море Звёзд нет ни Саратоги, ни моей старшей сестры."
      - "Пусть поспит ещё немного. Это забота от прекрасной девушки-артистки☆~"
  - char: "constellation"
    side: "right"
    text:
      - "............"
      - "...А ведь я так и не смогла ответить на последний вопрос."
  - char: "guam"
    side: "left"
    text:
      - "Ничего страшного~ Раз ты не ответила, значит, игра ещё не окончена по-настоящему."
      - "Просто ответишь, когда мы встретимся с ними в следующий раз."
      - "В будущем мы обязательно увидимся снова, это интуиция прекрасной девушки-артистки☆~"
  - char: "constellation"
    side: "right"
    text:
      - "...Угу."
  - char: "tb_rad"
    side: "left"
    text:
      - "Говорит Навигатор-TБ, я снова зафиксировала ваш сигнал."
      - "Запрос: каков ваш текущий статус? Почему вы все вместе появились в симуляции Кораллового моря?"
  - char: "guam"
    side: "right"
    text:
      - "С нами всё в порядке... А насчёт того, что произошло — это долгая история."
  - char: "laffey_ii"
    side: "left"
    text:
      - "Лаффи... очень устала. В этот раз... пусть рассказывает Гуам."
  - char: "guam"
    side: "right"
    text:
      - "Аха-ха, поняла-поняла~ ТБ, у тебя там всё в порядке?"
  - char: "tb_rad"
    side: "left"
    text:
      - "Текущий статус: вредоносная программа, содержавшаяся в блоке данных, полностью удалена. Мейнфрейм «Сердце Галактики» вернулся в нормальный режим работы."
      - "Приступаю к выполнению процедуры эвакуации..."
  - char: "guam"
    side: "right"
    text:
      - "Замечательно~ Наконец-то мы сможем вернуться домой!"
  - char: "constellation"
    side: "left"
    text:
      - "Эх... по возвращении я как следует высплюсь."
      - "И... в этом месяце я больше не буду засиживаться допоздна!"

chapter5:
  rows:
  - char: "essex_meta???"
    side: "left"
    status: "is-yellow"
    text:
      - "...Свет маяка."
      - "...Я опоздала?"
