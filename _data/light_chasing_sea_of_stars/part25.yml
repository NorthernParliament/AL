chapter1:
  rows:
  - char: "prinston_meta"
    side: "left"
    text:
      - "Вы по сравнению с моим представлением о вас... можно сказать, и похожи, и в то же время отличаетесь..."
      - "Не знаю, как это объяснить, может быть, вы пришли из параллельного мира?"
      - "В конце концов, в старых научно-фантастических романах часто встречается такой сюжет."
  - char: "constellation"
    side: "right"
    text:
      - "Мне кажется... это ваш спустившийся с небес флот больше похож на сюжет из научно-фантастического романа."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Если в этом есть острая необходимость, скорость развития технологий на самом деле может быть очень высокой..."
      - "Это мир, в котором вы живёте?"
  - char: "guam"
    side: "right"
    text:
      - "Конечно же нет, наш мир совсем не такой безжизненный~"
      - "А вы? Для вас это ведь тоже не отправная точка."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Да, мы прибыли сюда издалека... очень издалека."
      - "Недавно во время плавания мы получили сигнал бедствия, исходящий от маяка Совета."
      - "Местоположение сигнала, которое мы тогда определили, находилось неподалёку отсюда."
      - "Но пока мы шли по курсу, нас затянуло во внезапно возникшую пространственно-временную аномалию."
      - "А после этого мы очутились в этой акватории."
      - "Так как же в итоге к вам попал маяк Совета?"
  - char: "constellation"
    side: "right"
    text:
      - "Маяк Совета — это... то самое сломанное устройство, которое мы недавно извлекли из-под воды?"
      - "Это долгая история... Гуам, я эти дни совсем не высыпалась, составляя планы... а сейчас вдруг так захотелось спать, голова совсем не соображает."
      - "Оставляю эту часть объяснений на тебя... zZZ"
  - char: "guam"
    side: "left"
    text:
      - "Эй... как ты могла и правда уснуть!.."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Хе-хе... она всегда была такой."
      - "Просто невероятно... вроде бы совершенно незнакомые люди, но кажутся такими до боли знакомыми."
      - "Тогда прошу вас всё объяснить, мисс Гуам."
  - char: "guam"
    side: "left"
    text:
      - "Э-э... всё началось с того, что сегодня утром мы поехали встречать самолёт..."

chapter2:
  rows:
  - char: "prinston_meta"
    side: "left"
    text:
      - "Честно говоря... я не поняла и десятой доли из сказанного."
      - "Не думала, что различия между параллельными мирами могут быть настолько колоссальными..."
      - "...Но одно я поняла точно — вы не имеете никакого отношения к этому маяку."
      - "(...А я уж было подумала, что наконец-то смогу вернуться домой.)"
  - char: "guam"
    side: "right"
    text:
      - "Мы уже ответили на твои вопросы, теперь не могла бы ты ответить на некоторые из наших?"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Конечно, без проблем. Спрашивайте."
  - char: "guam"
    side: "right"
    text:
      - "Скажи, когда вы прибыли, вы не видели Принстон?"
      - "Другую, ту Принстон, что прибыла вместе с нами."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Нет. Ваша спутница ведь разминулась с вами по пути сюда через маяк, верно?"
      - "Тогда, возможно, она всё ещё находится где-то в этой акватории, может быть, она тоже столкнулась с проблемами связи, как и мы, и поэтому..."
      - "Хм... мы поможем вам её найти."
      - "Крепость, оставляю поиски на тебя."
  - char: "fortress_1"
    side: "right"
    text:
      - "Приказ получен."
  - char: "guam"
    side: "left"
    text:
      - "Огромное спасибо! Э-э..."
  - char: "laffey_ii"
    side: "right"
    text:
      - "*Пристально смотрит*"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Хм? Почему ты всё время смотришь на Крепость?"
      - "Кстати говоря... вы ведь тоже сразу пошли в атаку, как только увидели Крепость."
      - "...Между вами какие-то счёты?"
  - char: "guam"
    side: "right"
    text:
      - "Слово «счёты» слишком мягко описывает наши отношения..."
      - "Я бы лучше спросила, как ты можешь сражаться плечом к плечу с Сиренами?"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Кажется, между вами возникло какое-то недопонимание. Боевой протокол Крепость — это Антиох, прошедший специальную модификацию для оказания поддержки флоту Совета."
      - "Будучи членом флота Совета, я, разумеется, сражаюсь с ней плечом к плечу."
      - "Что же касается ваших «Сирен»... кто это вообще такие?"
  - char: "guam"
    side: "right"
    text:
      - "Антиох! Я знаю это имя, это же другое название Сирен!"
      - "Антиох — это и есть Сирены, враги в нашем мире!"
  - char: "prinston_meta"
    side: "left"
    text:
      - "...Антиох — это Сирены?.. Враги вашего мира?"
      - "Э-э... Почему же вы тогда воюете с Антиохом?"
  - char: "guam"
    side: "right"
    text:
      - "Почему воюем?.. Ну конечно же... мы воюем за всё!"
      - "Сирены внезапно появились и захватили наши океаны, они — враги человечества."
      - "Мы с ними заклятые враги, бьёмся не на жизнь, а на смерть!"
  - char: "prinston_meta"
    side: "left"
    text:
      - "...Как такое может быть?"
      - "А как тогда обстоят дела с вашей битвой против X?"
      - "До этого ИИ ошибся на ваш счёт именно потому, что обнаружил на вас следы «Предвестников»."
      - "Неужели вы одновременно сражаетесь и с Антиохом, и с X?.."
  - char: "guam"
    side: "right"
    text:
      - "Э-э... что ещё за X? Мы всё это время сражались только с Сиренами."
  - char: "fortress"
    side: "left"
    text:
      - "Принстон, вызывает флагман, госпожа «Серебряная Лиса» просит тебя зайти к ней."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Хорошо, тогда здесь... хотя оставлять их на тебя, кажется, тоже не лучшая идея."
  - char: "laffey_ii"
    side: "left"
    text:
      - "*Пристально смотрит*"
  - char: "constellation"
    side: "right"
    text:
      - "Хм... Ничего страшного, иди по своим делам..."
      - "Это редкая возможность, я бы хотела рассмотреть мисс Крепость поближе... Вы же не против?"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Без проблем~ Крепость, не забудь оказать им полное содействие."
  - char: "guam"
    side: "right"
    text:
      - "Констеллейшн, почему ты проснулась? Выспалась?"
  - char: "constellation"
    side: "left"
    text:
      - "...Проголодалась."
      - "Как странно, в симулированном мире ведь не должно быть настроек, заставляющих испытывать «голод»..."
  - char: "prinston_meta"
    side: "right"
    text:
      - "...Симулированном мире?"
  - char: "constellation"
    side: "left"
    text:
      - "...Ничего."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Тогда, Крепость, иди приготовь что-нибудь поесть для наших гостей. Я тоже проголодалась, вернусь — и будем обедать~"
  - char: "fortress"
    side: "left"
    text:
      - "Хорошо."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Тогда я пока..."
  - char: "constellation"
    side: "left"
    text:
      - "И ещё одно, последнее. Мисс Принстон, не могли бы вы принести мне почитать книгу по истории вашего мира?"
      - "Чтобы скоротать время, пока готовится еда..."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Хм... книги по истории должны быть в библиотеке флота."
      - "Подождите немного, я сейчас загружу её для вас..."
      - "А? Мой запрос на доступ отклонён?.. Крепость, в чём дело?"
  - char: "fortress"
    side: "left"
    text:
      - "...Думаю, тебе лучше сначала отправиться на флагман. Возможно, госпожа «Серебряная Лиса» уже заждалась, вот и заблокировала твой доступ."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Ой, беда... эта госпожа вполне способна на такое!.."
      - "...Тогда я пошла, обо всём остальном поговорим, когда я вернусь!"

chapter3:
  rows:
  - char: "constellation"
    side: "left"
    text:
      - ".....Эх."
  - char: "guam"
    side: "right"
    text:
      - "Не вздыхай так, мы же скоро будем кушать~"
  - char: "constellation"
    side: "left"
    text:
      - "Я вздыхаю вовсе не поэтому..."
      - "Забудь, всё равно не поймёшь, даже если объясню."
  - char: "guam"
    side: "right"
    text:
      - "...Что значит «не пойму»?! Пока ты там спала, это я тут изо всех сил старалась вытянуть из неё информацию!"
  - char: "constellation"
    side: "left"
    text:
      - "Я не спала. Хотя мне действительно очень хочется..."
      - "Как думаешь, почему её доступ внезапно заблокировали?"
  - char: "guam"
    side: "right"
    text:
      - "...Системный сбой?"
  - char: "constellation"
    side: "left"
    text:
      - "Ха-а... Ход добрячки Принстон завершён."
      - "Боюсь, теперь получить ключевую информацию будет уже не так-то просто..."
