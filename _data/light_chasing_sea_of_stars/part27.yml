chapter1:
  rows:
  - text:
      - "Выйдя с базы, они увидели, что парящий флот Совета уже полностью приведён в боевую готовность."
  - char: "constellation"
    side: "left"
    text:
      - "Флот, выходящий в бой, составляет примерно десятую часть от общей численности..."
      - "Такого количества будет достаточно?"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Для борьбы с Бурей Предвестников такого масштаба этого вполне достаточно."
  - char: "guam"
    side: "left"
    text:
      - "Что нам нужно делать дальше?"
      - "Хоть мы и сказали, что будем сражаться, но нашей огневой мощи ни за что не хватит, чтобы рассеять бурю, верно?"
  - char: "prinston_meta"
    side: "right"
    text:
      - "На самом деле огневой мощи достаточно, но мы взяли с собой не так много орудий столь разрушительной силы, да и в этот раз нет нужды тратить их понапрасну."
      - "«Буря Предвестников» — это явление, которое возникает при скоплении Предвестников Коррозии."
      - "Они могут долго и стабильно существовать только в определённых условиях."
      - "Но совершенно очевидно, что эта территория не подвергалась изменениям со стороны X."
      - "Поэтому эта буря на самом деле очень хрупкая. Если её не трогать, она и сама вскоре исчезнет."
  - char: "san_jacinto"
    side: "left"
    text:
      - "...То есть нам, по сути, даже не нужно сражаться?"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Верно."
      - "Однако, учитывая, что это всё равно довольно раздражающая штука, мы должны разобраться с ней как можно скорее."
      - "Хотя прямые атаки на саму бурю не дадут особого эффекта, но сущности Предвестников, которые привели к её зарождению, вполне можно уничтожить."
      - "Если мы будем непрерывно истреблять эти сущности, то сможем ускорить процесс распада явления."
      - "Вы ведь тоже не хотите всю ночь слушать грохот орудий и плохо спать?"
  - char: "constellation"
    side: "left"
    text:
      - "Естественно... Никогда ещё я так сильно не хотела как следует выспаться, как сегодня!"
