chapter1:
  rows:
  - text:
      - "Исход этого сражения был предрешён."
      - "Согласно боевому плану, все тихо ждали вдали от поля боя."
      - "До тех пор, пока Буря Предвестников почти не рассеялась, а флот Энфорсеров не понёс тяжёлые потери..."
      - "Флот Совета с молниеносной скоростью зачистил поле боя."
      - "Весь процесс занял один час сорок две минуты."
      - "В одном из уголков поля боя..."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Эх... Этот бой и правда был каким-то странным."
      - "Ладно ещё сущности Предвестников не оставляют после себя обломков, но почему эти похожие на Антиох враги тоже ничего не оставили?"
      - "После боя всё поле совершенно чистое... не удалось собрать ни крохи полезных материалов."
      - "Однако на тех плавучих базах... кажется, осталось немало хороших вещей..."
  - char: "fortress"
    side: "right"
    text:
      - "Начать сбор материалов?"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Конечно! Нужно полностью забить трюмы, пополним припасы по полной~"
  - char: "constellation"
    side: "right"
    text:
      - "...То, что Сирены грабят — дело обычное, но чтобы грабили Сирен — такое я вижу впервые."
      - "Поразительно... просто нет слов."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Хе-хе, всё, что можно забрать, нужно забирать. С этими припасами флоту не составит труда продержаться ещё пару лет."
  - char: "guam"
    side: "right"
    text:
      - "...Ваш флот просто невероятен, раз смог так легко уничтожить Энфорсеров."
      - "Большое спасибо за то, что проявили максимальную сдержанность в недавнем бою с нами!"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Ну естественно, мы же 5-я Оперативная Группа Совета!"
      - "Таких флотов, как наш, подчиняющихся напрямую Постоянному комитету Совета, всего семь!"
      - "Мы элита из элит — понимаешь~"
      - "Но эти враги и правда оказались не такими сильными, как вы описывали до боя."
      - "Крепость, что скажешь?"
  - char: "fortress"
    side: "right"
    text:
      - "Эти вражеские цели, называемые Энфорсерами, по внешнему виду, вооружению и стилю ведения боя крайне схожи с Антиохом."
      - "Основываясь на множестве улучшений, замеченных в бою, я считаю, что их модели более продвинутые, чем моя."
      - "Однако эта конкретная группа противников, скорее всего, не относится к передовым боевым моделям."
      - "Их огневая мощь говорит о том, что эти Сирены могут принадлежать к системе логистики или второй линии обороны."
  - char: "guam"
    side: "left"
    text:
      - "Система логистики?!"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Да, я тоже так думаю. Посмотрите на эту акваторию, разве она не похожа на базу по переработке материалов?"
      - "Тогда те, кто здесь остался — это наверняка либо сборщики, либо охрана базы."
  - char: "guam"
    side: "left"
    text:
      - "Но это же флот Энфорсеров... Хоть вы и справились с ними так легко, но... нам каждый раз приходится сражаться с ними изо всех сил!"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Из ваших рассказов это действительно так, и именно это показалось нам странным."
      - "В прошлом бою я даже подумала, что вы сдерживаетесь и специально ограничиваете свою силу."
  - char: "laffey_ii"
    side: "left"
    text:
      - "*Пристально смотрит*"
  - char: "prinston_meta"
    side: "right"
    text:
      - "А, пожалуйста, не поймите меня неправильно! Я имею в виду, что с вашим составом и вооружением вы должны быть гораздо сильнее, чем сейчас."
      - "Хм... Опыт подсказывает, что с вашими Кубами Мудрости возникла какая-то проблема, что и привело к аномалиям в вашей боевой эффективности."
      - "Позволите Крепости просканировать вас и провести проверку?"
  - char: "guam"
    side: "left"
    text:
      - "Ты думаешь, что-то не так с нашими Кубами Мудрости?.."
      - "Тогда, пожалуйста, скорее проверьте! Прошу!"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Поняла~ Крепость, оставляю это на тебя!"
  - char: "fortress_1"
    side: "left"
    text:
      - "Выполняю процедуру проверки..."

chapter2:
  rows:
  - text:
      - "Спустя некоторое время..."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Результат таков... на ваших Кубах Мудрости есть следы искусственного вмешательства."
      - "Как только Куб Мудрости корабля сформирован, его уже невозможно изменить..."
      - "Поэтому это вмешательство должно было произойти до того, как он стал Кубом Мудрости корабля."
      - "Возможно, в него вмешались ещё на стадии производства..."
  - char: "constellation"
    side: "right"
    text:
      - "В наши Кубы Мудрости... кто-то вмешался?"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Именно. Хотя я не знаю, какая технология использовалась... но они определённо были модифицированы."
      - "Подобная модификация работает как своего рода стабилизатор, который ценой ограничения выходной мощности значительно повышает стабильность куба."
      - "Можно сказать, что пока ваши Кубы Мудрости не повреждены, с вами не может произойти явление META-трансформации."
  - char: "guam"
    side: "right"
    text:
      - "Я немного запуталась... но звучит так, будто в нас установили какую-то систему безопасности..."
      - "Разве то, что мы не можем стать META — это не хорошо?"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Хм?.. В принципе... да."
      - "Но избегать META-трансформации путём лишения боеспособности... это всё равно что отказываться от еды из страха подавиться."
      - "Я не очень понимаю, зачем кому-то вводить такие суровые ограничения, лишённые всякого практического смысла в бою..."
      - "Если вас уничтожит враг ещё до того, как вы станете META... разве это не хуже?"
  - char: "constellation"
    side: "right"
    text:
      - "Кстати, мисс Принстон, хоть вы и META, но вы не похожи на тех META, к которым мы привыкли."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Кажется, вы уже сталкивались со случаями экстремальной META-трансформации..."
      - "Да... такое зрелище и правда оставляет неизгладимое впечатление."
      - "о я другая. Вы знаете о том, что степень META-трансформации обратима до определённого предела?"
  - char: "constellation"
    side: "right"
    text:
      - "Да, нам это известно."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Тогда всё очень просто объяснить."
      - "У меня есть некое устройство, которое позволяет мне во время выполнения заданий стабилизировать степень META-трансформации в пределах этого обратимого диапазона."
      - "А после завершения задания с помощью процедуры очистки я возвращаюсь в нормальное состояние, не-META."
  - char: "guam"
    side: "right"
    text:
      - "...Вы используете META-трансформацию для сражений?"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Да, а почему бы и нет?"
      - "Не стоит воспринимать META как какое-то чудовище. Пока трансформация находится в обратимом диапазоне, в широком смысле она безопасна."
      - "Более того, даже если критический порог превышен, это не значит, что всё безнадёжно."
      - "Превышение порога означает лишь то, что META-трансформация становится необратимой, но у нас есть способы стабилизировать как разум, так и Куб Мудрости после трансформации."
  - char: "laffey_ii"
    side: "right"
    text:
      - "Звучит... так жутко..."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Ха-ха-ха... понимаю-понимаю, многие люди точно так же, как и вы, крайне негативно относятся к META-трансформации."
      - "Но тебе, Лаффи, не о чем волноваться. Технология оснастки типа II и технология META-трансформации — это два взаимоисключающих пути."
      - "Даже если бы мощность твоего Куба Мудрости не была ограничена, ты, уже получив оснастку типа II, всё равно не смогла бы стать META."
  - char: "laffey_ii"
    side: "right"
    text:
      - "Лаффи... спокойна..."
  - char: "constellation"
    side: "left"
    text:
      - "Это ограничение как-то можно снять?"
  - char: "guam"
    side: "right"
    text:
      - "Эй!.. Леди Констеллейшн, что ты задумала?!"
  - char: "constellation"
    side: "left"
    text:
      - "Не кипятись, я просто спросила."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Хм, этого я не знаю, нужно сначала провести анализ, чтобы понять."
      - "Крепость, ты можешь с этим разобраться?"
  - char: "fortress"
    side: "left"
    text:
      - "В настоящее время мои ресурсы сильно загружены, изменить приоритеты?"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Э-э... очистка маяка, поиск пропавшей, сбор материалов... ремонт флота. Кажется, тут нечего перестраивать."
      - "Прошу прощения, девочки... может, отложим это дело на потом?"
  - char: "constellation"
    side: "left"
    text:
      - "Хорошо..."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Точно, чуть не забыла ещё об одной вещи!"
      - "Госпожа Серебряная Лиса сказала, что хочет вручить вам всем «Объединённую медаль Совета»~"
  - char: "guam"
    side: "left"
    text:
      - "Вручить медаль?!"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Да, в знак благодарности за вашу помощь в операции Совета~"
  - char: "guam"
    side: "left"
    text:
      - "Мне кажется... мы не то чтобы сильно помогли... и даже подрались с вами из-за недоразумения..."
      - "Принимать медаль будет немного... неуместно?"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Вы помогли вернуть маяк Совета, а также оказали содействие флоту Совета в боевой операции. Вы заслужили эту медаль, так что не скромничайте."
      - "Хотите электронную или физическую версию?"
  - char: "guam"
    side: "left"
    text:
      - "...Электронную?"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Хм? А... у вас ещё нет таких вещей, да? Тогда пусть будут физические медали."
      - "Мне тоже больше нравится такой формат~"
      - "Медали уже в процессе изготовления, мы вручим их вам по возвращении."
      - "Зачистка поля боя займёт ещё какое-то время, госпожа Серебряная Лиса сказала, что вы можете возвращаться первыми."
      - "У неё ведь ещё осталась «игра», в которую она собиралась с вами сыграть~"
