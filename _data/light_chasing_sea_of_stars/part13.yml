chapter1:
  rows:
  - text:
      - "Это симулированная акватория NY, или, точнее будет сказать, теперь её уместнее переименовать в симулированную акваторию руин NY."
      - "Всего за несколько минут процветающий мегаполис NY вдали был стёрт с лица земли внезапно появившейся чёрной бурей."
  - char: "princeton"
    side: "left"
    text:
      - "Это... это тоже сгенерировано симуляционной системой Море Звёзд?"
      - "Но... зачем вообще это делать?"
      - "Атаковать зоны за пределами симулированной акватории... Разве это не нарушение правил?!"
  - char: "laffey_ii"
    side: "right"
    text:
      - "Принстон, враги... приближаются."
  - char: "princeton"
    side: "left"
    text:
      - "Враги?.."
      - "У них... неясные очертания, и невозможно определить ни тип корабля, ни их принадлежность."
      - "К тому же, они появились вместе с этой чёрной бурей..."
      - "...Неужели это те самые сущности, о которых упоминалось в отчётах командования?"
  - char: "laffey_ii"
    side: "right"
    text:
      - "Те самые сущности?.."
  - char: "princeton"
    side: "left"
    text:
      - "А... Лаффи, ты ведь их ещё не читала, верно?"
      - "Если вкратце, то эти неуловимые враги по своей сути больше похожи на проекции неких аномалий из более высоких измерений в нашем собственном."
      - "Поэтому их внешний вид и не может обрести чёткую форму в наших глазах, и мы не можем получить никаких обломков для их изучения."
  - char: "laffey_ii"
    side: "right"
    text:
      - "Понятно... значит, обойдёмся без обломков... Принстон, приготовься к бою."
