chapter1:
  rows:
  - text:
      - "Небо постепенно светлело — этот рассвет символизировал надежду, но в то же время предвещал битву, которая навсегда останется в памяти."
  - char: "guam"
    side: "left"
    text:
      - "(...Я уже бесчисленное множество раз перечитывала записи о сражении в Коралловом море.)"
      - "(Ещё до прибытия сюда я наизусть выучила всё, что должно здесь произойти...)"
      - "(Но когда переживаешь это лично, успокоиться всё равно не получается...)"
  - char: "flasher"
    side: "right"
    text:
      - "Время пришло, сестрёнки. Полный вперёд к нашей цели!"

chapter2:
  rows:
  - char: "guam"
    side: "left"
    text:
      - "Э-э... вы не заметили, что пейзаж вокруг начал размываться?"
  - char: "louisville"
    side: "right"
    text:
      - "Ой, и правда... Неужели я просто переутомила глаза?.."
  - char: "flasher"
    side: "left"
    text:
      - "Оборудование для извлечения данных выдаёт странную реакцию... В симулированном мире присутствует неизвестный источник помех!"
      - "Его координаты должны быть... как раз в той зоне, которую мы должны исследовать."
  - char: "guam"
    side: "right"
    text:
      - "Понятно. Не зря в мерах предосторожности говорилось, что нужно быть готовыми к экстренному выбросу из симуляции."
      - "Изображение вокруг уже так сильно дрожит... Если мы продолжим идти, большой вопрос, сможет ли она стабильно работать дальше."

chapter3:
  rows:
  - char: "guam"
    side: "left"
    text:
      - "....Нет, всё настолько размыто, что двигаться вперёд совершенно невозможно!"
      - "У меня так кружится голова... Я уже даже не понимаю, над водой мы сейчас или под ней..."
  - char: "louisville"
    side: "right"
    text:
      - "В воздухе, кажется, есть какие-то препятствия, которые мешают нам продвигаться..."
  - char: "guam"
    side: "left"
    text:
      - "Да, я тоже заметила, словно невидимая воздушная стена!"
      - "Раз так, позвольте прекрасной девушке Гуам пробить её силой☆~"
  - char: "flasher"
    side: "right"
    text:
      - "П-подожди... сестрёнка Гуам! Открывать огонь сейчас — нарушение правил!"
  - char: "guam"
    side: "left"
    text:
      - "Но... в нынешней ситуации и правда очень сложно продвигаться дальше~"
  - char: "flasher"
    side: "right"
    text:
      - "Ничего страшного, сестрёнка Гуам. Я уже определила местоположение источника аномальных данных и готовлюсь к извлечению."
  - char: "louisville"
    side: "left"
    text:
      - "Готовишься к извлечению... Но я не вижу ни цели для извлечения, ни тросов для этого."
  - char: "flasher"
    side: "right"
    text:
      - "«Извлечение» — это просто метафора, сестрёнка Луисвилл!"
      - "Извлечение в Море Звёзд на самом деле означает использование оборудования в симулированном мире для отметки ценных предметов, анализа и записи данных об их структуре..."
      - "Затем на сервере производится их сбор и обработка, и они конвертируются в независимые пакеты данных для использования исследовательскими отделами."
  - char: "louisville"
    side: "left"
    text:
      - "Поразительно..."
  - char: "guam"
    side: "right"
    text:
      - "Верно-верно~ К тому же, иногда инженерный отдел даже воссоздаёт извлечённые предметы в реальности~"
      - "Ха-ха, но я впервые вблизи наблюдаю за процессом «извлечения данных»."
      - "Мне правда нужно просто стоять здесь и смотреть?"
  - char: "flasher"
    side: "left"
    text:
      - "Угу~ На самом деле я уже запустила процедуру извлечения."
      - "Если сестрёнке Гуам скучно, хм... держи, можешь поиграть с этой игрушечной рыбкой."
  - char: "guam"
    side: "right"
    text:
      - "Вау... какая милая! Ты сама её сделала?"
      - "Нет-нет, с чего это ребёнок относится ко мне, как к ребёнку!"
      - "Не беспокойся обо мне! Твоя старшая сестра просто тихо постоит в сторонке, а ты сосредоточься на своей работе!"
