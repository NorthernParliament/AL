chapter1:
  rows:
  - char: "princeton"
    side: "left"
    text:
      - "Мы ехали на монорельсе... целых двадцать минут, чего ещё ожидать от базы Море Звёзд..."
      - "Каковы же на самом деле её размеры..."
  - char: "northampton_ii"
    side: "right"
    text:
      - "Хе-хе, сейчас мы находимся примерно в центральной части базы Моря Звёзд, и до Сердца Галактики, расположенного в изолированном секторе на самом дне, ещё довольно далеко."
      - "Дальше нам нужно дойти пешком до лифтов, вы двое, прошу сюда."

chapter2:
  rows:
  - char: "seattle"
    side: "left"
    text:
      - "Вау, это же Нортгемптон! Доброе утро~"
  - char: "northampton_ii"
    side: "right"
    text:
      - "Доброе утро, Сиэтл, Кирсардж. Вы двое только что закончили тестирование?"
  - char: "kearsarge"
    side: "left"
    text:
      - "Плановый осмотр, а также проверка состояния Анкоридж."
  - char: "seattle"
    side: "right"
    text:
      - "Ты привела новичков на тестирование? Тогда поспешите, Сердце Галактики сейчас как раз свободно~"
  - char: "kearsarge"
    side: "left"
    text:
      - "У нас ещё есть другие дела, до встречи."
  - char: "northampton_ii"
    side: "right"
    text:
      - "До скорого."

chapter3:
  rows:
  - char: "princeton"
    side: "left"
    text:
      - "Эти двое... Я никогда их раньше не видела."
  - char: "northampton_ii"
    side: "right"
    text:
      - "Угу... Из соображений секретности, за пределами Моря Звёзд о их существовании знает довольно ограниченный круг лиц."
      - "Но вы, должно быть, знаете Джорджию, которая ранее участвовала в боевых операциях вместе с Командиром."
      - "Сиэтл и Кирсардж, как и она, являются нашими кораблями-прототипами. Они приписаны к Треугольнику — Бюро перспективных исследований кораблей."
  - char: "princeton"
    side: "left"
    text:
      - "Подумать только... Это место ещё и наш исследовательский центр кораблей-прототипов... Море Звёзд полностью оправдывает свою репутацию."
  - char: "northampton_ii"
    side: "right"
    text:
      - "Дальше нам нужно будет проехать ещё немного на монорельсе, и мы прибудем в наш пункт назначения — Сектор X."
  - char: "laffey"
    side: "left"
    text:
      - "...Как же долго."
  - char: "princeton"
    side: "right"
    text:
      - "Держись, остался последний рывок~!"

chapter4:
  rows:
  - char: "tb"
    side: "left"
    text:
      - "Доступ: Сердце Галактики. Полномочия: Зарегистрированы. Добро пожаловать, Принстон и Лаффи. Навигатор-TБ приветствует вас."
      - "В ходе этого симуляционного тестирования ваши цели таковы:"
      - "Цель миссии номер один: вступить в бой с Арбитром Дьявол и собрать данные."
      - "Цель миссии номер два: проверить надежность и боеспособность оснастки типа II Лаффи."
      - "Цель миссии номер три: проверить целесообразность текущего плана тестирования оснастки типа II для Лаффи."
  - char: "laffey"
    side: "right"
    text:
      - "...У Лаффи нет оснастки типа II."
  - char: "tb"
    side: "left"
    text:
      - "Ответ: развертывание будет осуществлено в режиме «симуляции»."
      - "Инструктаж: согласно новейшему руководству, проводится ознакомление участников, впервые принимающих участие в симуляционном тестировании, с содержанием и процессом текущего тестирования."
      - "Площадка: симулированный мир «NY». Набор тренировочных данных: «Будущее». Поставщик набора данных: Командир."
      - "Включает: планировку местности, архитектурные стили, гражданскую продукцию, военные технологии и прочее."
  - char: "princeton"
    side: "right"
    text:
      - "Погодите... Информационные данные из будущего?!"
      - "...Если у нас есть эти данные, разве наш технологический уровень не должен совершить резкий скачок?!"
  - char: "tb"
    side: "left"
    text:
      - "Отрицательно. В наличии имеются только данные о внешнем виде, без параметров внутренней структуры, что делает полное воссоздание невозможным."
  - char: "northampton_ii"
    side: "right"
    text:
      - "Угу, просто воспринимай это как реалистичные декорации к научно-фантастическому фильму. Хоть они и выглядят правдоподобно, это лишь видимость."
  - char: "tb"
    side: "left"
    text:
      - "Утвердительно. Ценные технологии, содержащиеся в наборе данных, были интегрированы в текущее тестирование."
      - "Первый этап: бой с флотом будущего. Боевая мощь флота будущего откалибрована до приемлемого уровня. Главная цель: тест на адаптивность."
      - "Второй этап: бой с Арбитром Дьявол. Боевые характеристики Дьявол воссозданы с максимальной точностью."
      - "Цель: победить Дьявол."
      - "Важная информация. Правила текущего симуляционного тестирования. Составитель: Бюро анализа глубоководных данных — Констеллейшн."
      - "Первое. Ни при каких обстоятельствах не покидать указанную зону эксперимента, включая вылет палубной авиации за её пределы, иначе тестирование будет прервано."
      - "Второе. После входа в симулированный мир запрещается подключаться к внешним каналам связи и отправлять или получать любые сообщения. Система Навигатора будет осуществлять строгий контроль за этим."
      - "Третье. Запрещается атаковать любые цели за пределами зоны эксперимента, иначе тестирование будет прервано."
      - "Четвертое. Запрещается вступать в любые формы диалога с Дьявол в симулированном мире, иначе тестирование будет прервано."
      - "Итак, прошу всех пройти в зону ожидания, тестирование скоро начнётся..."
