chapter1:
  rows:
  - char: "anchorage"
    side: "left"
    text:
      - "Все... вернулись!"
  - char: "guam"
    side: "right"
    text:
      - "Верно, Анкоридж, мы вернулись~"
  - char: "san_jacinto"
    side: "left"
    text:
      - "...Ты была в диспетчерской и помогала ТБ справляться с кризисом?"
  - char: "anchorage"
    side: "right"
    text:
      - "Ага!"
  - char: "tb"
    side: "left"
    text:
      - "Именно благодаря важному открытию Анкоридж я смогла так быстро справиться с этим инцидентом."
      - "Она отлично поработала."
      - "Обработка извлечённых на этот раз данных потребует некоторого времени."
      - "Как только обработка будет завершена и я подтвержу отсутствие рисков, данные будут отправлены на сервер Гидры."
  - char: "constellation"
    side: "right"
    text:
      - "Угу, рассчитываю на тебя."
  - char: "guam"
    side: "left"
    text:
      - "Э-э... Откуда у нас данные для извлечения?"
  - char: "constellation"
    side: "right"
    text:
      - "Конечно же, их собрали мы с Флэшер."
  - char: "flasher"
    side: "left"
    text:
      - "Хе-хе... Мы с сестрёнкой Констеллейшн всё это время помечали и собирали информацию о ключевых целях!"
  - char: "guam"
    side: "right"
    text:
      - "Разве не говорили, что на военной базе запрещено фотографировать?!"
  - char: "constellation"
    side: "left"
    text:
      - "Этот процесс называется не «съёмкой», а «извлечением данных»."
  - char: "tb"
    side: "right"
    text:
      - "Далее, что касается отчёта о данном инциденте..."
  - char: "constellation"
    side: "left"
    text:
      - "Ах да... ещё же и это."
      - "Как вы можете видеть... я не спала уже несколько дней и больше просто не могу держаться... zZZ"
  - char: "san_jacinto"
    side: "right"
    text:
      - "Ох, похоже, пока мисс Констеллейшн не проснётся, мне придётся взять на себя руководство Бюро анализа глубоководных данных."
  - char: "princeton"
    side: "left"
    text:
      - "Э-э... на самом деле я с середины операции вообще ничего не помню."
      - "Я пропустила всё самое интересное, у-у-у..."
  - char: "guam"
    side: "right"
    text:
      - "А? То есть ты хочешь сказать?.."
      - "Что весь отчёт придётся писать мне?!"
  - char: "constellation"
    side: "left"
    text:
      - "Удачи."
  - char: "guam"
    side: "right"
    text:
      - "Не-е-е-е-е-ет!.."
