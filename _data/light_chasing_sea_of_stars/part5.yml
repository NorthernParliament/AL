chapter1:
  rows:
  - text:
      - "Это самая загадочная комната в Море Звёзд."
      - "Она славится тем, что может воплотить всё что угодно в реальность, и тех, кто обладает истинными правами доступа сюда, можно пересчитать по пальцам."
      - "Однако сегодня, помимо TБ, наблюдающей за потоком экспериментальных данных, в комнате находилась ещё одна девушка."

chapter2:
  rows:
  - char: "anchorage"
    side: "left"
    text:
      - "TБ, TБ! Лаффи... стала... не такой, как раньше!"
  - char: "tb"
    side: "right"
    text:
      - "Ответ: в ходе данного симуляционного тестирования Лаффи будет вести бой, используя оснастку типа II."
      - "Ознакомление: оснастка типа II Лаффи использует стандартный технологический маршрут для типа II. Ключевые особенности: маневренность, средства радиоэлектронной борьбы, беспилотники."
  - char: "anchorage"
    side: "left"
    text:
      - "Новое снаряжение! Но... у Принстон... его нет."
  - char: "tb"
    side: "right"
    text:
      - "Подтверждаю. К сожалению, для лёгких авианосцев типа «Индепенденс» пока нет готового проекта оснастки типа II, доступного для проведения тестирования с перезаписью."
      - "Тем не менее, данное тестирование предоставит ключевые данные, которые позволят сократить цикл разработки и снизить стоимость оснастки типа II."
  - char: "anchorage"
    side: "left"
    text:
      - "Вау... как здорово!"
      - "TБ, TБ! Смотри... все враги исчезли... и совсем ничего не оставили!"
  - char: "tb"
    side: "right"
    text:
      - "В целях оптимизации нет необходимости сохранять симулированные цели, которые были признаны уничтоженными."
  - char: "laffey_ii_rad"
    side: "left"
    text:
      - "Вражеский флот уничтожен."
      - "TБ, Лаффи очень нравится это новое снаряжение..."
      - "Но врагов слишком мало... мне маловато для драки, давай ещё."
  - char: "tb"
    side: "right"
    text:
      - "Запрос получен... Повторный анализ расчётных требований... Завершено."
      - "Вывод: в последующих боях уровень боевой мощи противника будет повышен."
  - char: "langley_ii_rad"
    side: "left"
    text:
      - "Мисс Навигатор, ты меня слышишь?"
  - char: "tb"
    side: "right"
    text:
      - "Связь чёткая. Запрос: пожалуйста, изложите свои требования, мисс Лэнгли."
  - char: "langley_ii_rad"
    side: "left"
    text:
      - "Прошу прощения, что приходится прерывать ваше тестирование."
      - "Можешь вывести Нортгемптон? Для одного внепланового тестирования у Йорктаун требуется её содействие."
  - char: "tb"
    side: "right"
    text:
      - "Оценка прав доступа... Запрос одобрен, немедленно приступаю к выполнению."

chapter3:
  rows:
  - char: "northampton_ii"
    side: "left"
    text:
      - "Хорошо, я поняла."
      - "Прошу прощения, вы двое. Я получила срочное задание, мне придётся досрочно покинуть это тестирование."
  - char: "princeton"
    side: "right"
    text:
      - "Ничего страшного, мы сами о себе позаботимся, можешь смело возвращаться к делам."
  - char: "laffey_ii"
    side: "left"
    text:
      - "Угу... ничего страшного. Раз нас на одну меньше, Лаффи сможет уничтожить больше врагов."
  - char: "northampton_ii"
    side: "right"
    text:
      - "Ахаха... Вот и славно. Но дальше вам предстоит столкнуться с Арбитром Сирен — Дьявол."
      - "Даже если это всего лишь симулированные данные, пожалуйста, ни в коем случае не теряйте бдительность."
  - char: "princeton"
    side: "left"
    text:
      - "Вообще-то, я как раз хотела спросить... Противостоять Арбитру только нашими силами — это как-то слишком самонадеянно..."
  - char: "tb_rad"
    side: "right"
    text:
      - "Принстон, в связи с изменением текущей ситуации, я изменила первую цель миссии на ознакомление с тактикой Дьявола, поэтому побеждать её не обязательно. Пожалуйста, не волнуйтесь."
      - "Сейчас я отправлю вам боевые данные Дьявол. Через три минуты тестирование официально начнётся."
  - char: "princeton"
    side: "left"
    text:
      - "Да, подтверждаю получение данных."
  - char: "laffey_ii"
    side: "right"
    text:
      - "Лаффи... тоже получила данные. Цель... Дьявол, к бою готова!"
