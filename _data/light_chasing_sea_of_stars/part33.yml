chapter1:
  rows:
  - text:
      - "На зашифрованный терминал поступил отчёт об инциденте с базы «Море Звёзд»."
  - char: "commander"
    side: "left"
    text:
      - "«Инцидент»... весьма удобный критерий для классификации."
      - "...Значит, другая сторона — это флот, называющий себя Объединённым Советом."
      - "Эмблему этого Совета я также видел во время операции в тайной комнате Святилища Арканы."
      - "Если так подумать... та сцена, которую я видел, происходила в зале заседаний Совета."
      - "А эта госпожа «Серебряная Лиса» — постоянный член Совета, и она знает о существовании Аосте..."
      - "Неужели Анзил и Аосте занимают должности в Совете?.."
      - "Я когда-то был с ними, значит, я тоже должен был занимать должность в Совете?.."
      - "...А ещё новая система Антиоха, Боевой протокол."
      - "Почему мы никогда раньше не видели появления Сирен, принадлежащих к этой системе..."
      - "Вдобавок к этому ограничения на Кубах Мудрости, контролируемая META-трансформация..."

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "............"
      - "Нет, в голове совершенно нет никакой информации."
      - "...А ведь иногда эти вспышки воспоминаний появляются вне зависимости от времени и места."
      - "К слову... каждый раз, когда я испытываю это чувство, это происходит либо в особых Зеркальных морях, либо в симуляциях Моря Звёзд..."
      - "Причём в Море Звёзд это случалось чаще всего..."
      - "Вопрос, который задала Дьявол... «Где находится симуляция, создаваемая Сердцем Галактики?»."
      - "В ответах, которые я могу найти со своим уровнем доступа, не видно никаких аномалий..."
      - "Существование этого загадочного флота Совета, возможно, является ключом к разгадке всех тайн..."
      - "Если бы только я смог встретиться с ними снова..."
      - "Но сам этот маяк... больше похож на коробку с сюрпризом, полную злого умысла."
      - "Что касается чёрной бури... то есть «Бури Предвестников» или феномена коррозии, Куин Элизабет даже специально прислала сообщение, чтобы предупредить об её опасности."
      - "...Маяк ни в коем случае нельзя восстанавливать."
      - "На данном этапе нет никакой необходимости в радикальных исследованиях. Стоит перенести центр внимания обратно на проект оснастки типа II..."
