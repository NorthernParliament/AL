chapter1:
  rows:
  - text:
      - "Это был самый дальний рубеж оборонительной системы, возведённой Арбитрами Влюблённые и Императрицей для защиты от X."
      - "Куда ни глянь, взору представало ослепительное множество орудий и бескрайние скопления крепостей."
      - "Суша, поверхность моря, небеса — хоть это и называлось линией обороны, скорее оно походило на стальную великую стену, уходящую в самую высь."
      - "Флоты Антиоха роились вдоль линии обороны, словно пчёлы, в ожидании прихода настоящей войны."
      - "Подобно этим безмолвным крепостям, флотилии также заняли море, сушу и небо."
      - "Командиром этой оборонительной системы была девушка, никогда не считавшая себя таковой."
      - "Вместе со всей этой оборонительной системой она непрерывно смотрела на надвигающуюся издали тьму."

chapter2:
  rows:
  - char: "bon_omm_richard"
    side: "right"
    status: "is-lightgray"
    text:
      - "...Антиох, давно не видела, чтобы вы так расщедрились на хорошие вещички."
      - "Это что, особый приветственный подарок для меня?"
  - char: "lovers"
    side: "left"
    text:
      - "...Обнаружено приближение угрозы класса V. Единственный вариант: уничтожение."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-lightgray"
    text:
      - "Хм... А я вообще-то больше хотела поболтать о былых временах."
      - "Ты видела тот сияющий маяк только что?"
      - "Какая же это всё-таки ностальгическая вещица."
      - "Я уже отправила туда подарочек. А ты?"
  - char: "lovers"
    side: "left"
    text:
      - "...Дешёвый трюк. Я уже со всем разобралась."
      - "...Твоё поле боя здесь. Твой противник — это я."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-lightgray"
    text:
      - "Мм~ А ведь и правда, мы с тобой ещё не сражались. Кажется, ты в себе очень уверена."
      - "Дай угадаю, твой план — испытание на выносливость, хочешь измотать меня в войне на истощение?"
  - char: "lovers"
    side: "left"
    text:
      - "............"
  - char: "bon_omm_richard"
    side: "right"
    status: "is-lightgray"
    text:
      - "Хе-хе~ Открою тебе один маленький секрет."
      - "На самом деле, я на удивление терпелива."
