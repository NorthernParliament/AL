chapter1:
  rows:
  - char: "fortress"
    side: "right"
    status: "is-red"
    text:
      - "...Обнаружено, что цель предпринимает враждебные действия, переход в боевой режим."
      - "...Устранение угрозы."
  - text:
      - "БАБАХ!!!"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Какое ещё к чёрту устранение! А ну прекрати!"

chapter2:
  rows:
  - char: "laffey_ii"
    side: "left"
    text:
      - "...Спустившаяся с небес... Принстон..."
  - char: "guam"
    side: "right"
    text:
      - "Принстон уже... стала META?"
      - "И она вместе с Сиренами... Что здесь происходит?"
  - char: "constellation"
    side: "left"
    text:
      - "...Всем отступить и прекратить огонь!"

chapter3:
  rows:
  - char: "prinston_meta"
    side: "left"
    text:
      - "Честное слово, стоило системе связи на мгновение выйти из строя, как всё превратилось в такой бардак..."
      - "Крепость, разве тебя послали не для того, чтобы объявить о прекращении огня? Что ты творишь?"
  - char: "fortress"
    side: "right"
    text:
      - "...Они напали первыми."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Не ищи оправданий!"
      - "Госпожа «Серебряная Лиса» велела тебе вернуться, чтобы ты как можно скорее починила наши системы... во избежание повторения подобных ситуаций!"
  - char: "fortress"
    side: "right"
    text:
      - "...Хорошо, оставляю это на тебя."
  - char: "prinston_meta"
    side: "left"
    text:
      - "И вы! Те, кто там, живо сюда!"
  - char: "guam"
    side: "right"
    text:
      - "Э-э... это она... нам?"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Да, а кому же ещё?"
      - "Вы и правда флот Союза Орла? Как вы вообще посмели напасть на флот Совета?"
      - "Я специально попросила госпожу «Серебряную Лису» провести повторную проверку, и только тогда мы окончательно убедились, что вы не заражены."
      - "Так почему вы нападаете на всех подряд, словно умалишённые..."
      - "Кто у вас за старшего в отряде?"
  - char: "laffey_ii"
    side: "right"
    text:
      - "Принстон... жутко злится..."
  - char: "constellation"
    side: "left"
    text:
      - "*Пристально смотрит*"
  - char: "guam"
    side: "right"
    text:
      - "(Э-этот взгляд... Она хочет, чтобы я пошла и выведала у неё всё!)"

chapter4:
  rows:
  - char: "guam"
    side: "right"
    text:
      - "Кхм-кхм... Я CB-2 Гуам из Союза Орла, я отвечаю за этот флот."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Гуам... хе-хе, мимо."
      - "За этот флот отвечает леди Констеллейшн, которая стоит позади, не так ли?"
  - char: "constellation"
    side: "right"
    text:
      - "...Как ты догадалась?"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Просто сделала вывод из опыта. Не думала, что угадаю."
  - char: "guam"
    side: "right"
    text:
      - "А?! Неужели ты и правда Принстон?!"
  - char: "prinston_meta"
    side: "left"
    text:
      - "«И правда?», у вас тоже очень странные вопросы..."
      - "Констеллейшн, Гуам, Лаффи, Сан-Хасинто, Луисвилл, Флэшер — я знаю имя каждой из вас."
      - "И вы знаете, что меня зовут Принстон."
      - "Но помимо этого... мы, похоже, совершенно не знаем друг друга."
      - "Мы не можем распознать ваши коды, а вы не знаете, что такое Совет и Боевой протокол."
      - "Похоже, суждение госпожи «Серебряной Лисы» было верным... нас действительно затянуло в пространственно-временную аномалию."
      - "Кажется, нам придётся задержаться здесь на какое-то время..."
      - "Крепость, готовься развернуть опорный пункт, мы остановимся здесь для перегруппировки."

chapter5:
  rows:
  - text:
      - "Вслед за приказом о развёртывании базы строй парящего в воздухе флота Совета пришёл в движение."
      - "Несколько военных кораблей, всё это время находившихся в арьергарде флота, первыми начали процедуру спуска."
      - "Оказавшись на воде, палубы этих кораблей перевернулись, обнажив скрытые под ними гигантские орудия."
      - "От одного только взгляда на калибр этих пушек в глубине души рождалось успокаивающее чувство безопасности."
      - "Вслед за этим огромный ремонтный корабль и повреждённые в недавнем бою суда также опустились на поверхность моря и приступили к ремонтным работам."
  - char: "constellation"
    side: "left"
    text:
      - "Так вот что ты имела в виду под развёртыванием опорного пункта."
      - "Эти корабли не участвовали в бою, и я всё гадала, для чего они нужны. Не ожидала, что внутри скрыты орудия главного калибра столь невероятных размеров..."
      - "Подобные корабли, видимо, можно использовать только после спуска на воду и полного развёртывания."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Верно, это корабли-крепости, которые мы используем для создания оборонительных систем базы."
      - "До прибытия сюда наш флот затянуло во внезапно возникшую пространственно-временную аномалию."
      - "Поскольку мы совершенно не были к этому готовы, множество наших электронных устройств, включая системы связи, получили повреждения."
      - "Поэтому мы не смогли вовремя всё правильно оценить и вступили с вами в непреднамеренный конфликт."
      - "Я официально приношу всем вам извинения за этот неприятный инцидент."
      - "Не волнуйтесь, мы не враги."
      - "Уверена, у нас друг к другу накопилось множество вопросов, так что давайте пройдём на базу и спокойно всё обсудим."
      - "Ах да, мисс Гуам, это закрытая военная зона, поэтому, пожалуйста, никаких фотографий."
  - char: "guam"
    side: "left"
    text:
      - "Аха-ха-ха... хорошо-хорошо, пойдёмте~"
