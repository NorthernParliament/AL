chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "laffey_ii"
    side: "left"
    text:
      - "...С ней тяжело справиться."
  - char: "devil"
    side: "right"
    text:
      - "...Лаффи, ты совершенно не тренировалась в использовании этой оснастки, верно?"
      - "Не сосредотачивайся только на артиллерийском огне и пуске торпед, используй и свои беспилотники..."
      - "И ты, Принстон. Твои атаки и прикрытие весьма искусны, но с этим снаряжением пора бы подумать о модернизации."
      - "Эх... хотя я считаю, что вам двоим ещё расти и расти, система уже засчитала мне поражение."
      - "Ладно, тестирование окончено."
  - char: "laffey_ii"
    side: "left"
    text:
      - "*Пристально смотрит...*"
  - char: "devil"
    side: "right"
    text:
      - "Э-э?.. Почему вы не уходите, у вас тут есть ещё какие-то дела?"
  - char: "princeton"
    side: "left"
    text:
      - "(Как странно... Если учения закончились, мисс Навигатор должна была сообщить нам о дальнейших планах...)"
      - "Лаффи, сохраняй бдительность, я вызову комнату управления."
  - char: "laffey_ii"
    side: "right"
    text:
      - "Хорошо."
  - char: "princeton"
    side: "left"
    text:
      - "Не выходит... никто не отвечает."
      - "(Что же теперь делать... Подобные ситуации во время симуляционных боёв в Море Звёзд считаются... нормальными?..)"
      - "(Нет-нет... Обрыв связи никак нельзя назвать нормальной ситуацией!..)"
      - "(Плохо дело... В первый же день на базе Моря Звёзд столкнуться с таким...)"
      - "(Совершенно не знаю, что делать дальше!..)"
  - char: "devil"
    side: "right"
    text:
      - "Хм? Вы, случайно, не потеряли связь со штабом учений?"
      - "Осуществляю вызов..."
      - "И правда, кажется, я тоже потеряла связь со штабом."
      - "Однако в этой акватории нет никаких помех. Неужели проблема с оборудованием на их стороне?"
  - char: "laffey_ii"
    side: "left"
    text:
      - "*Пристально смотрит...*"
  - char: "devil"
    side: "right"
    text:
      - "Даже если ты так пристально на меня смотришь..."
      - "Ладно-ладно, так и быть, подвезу вас. Я заберу вас с собой и мы вернёмся вместе."
  - char: "laffey_ii"
    side: "left"
    text:
      - "*Пристально смотрит...*"
  - char: "devil"
    side: "right"
    text:
      - "Э-э, этот взгляд явно говорит о том, что ты совершенно не хочешь садиться..."
      - "Похоже, проблему с тем, что моё снаряжение пугает детей, действительно нужно как-то решать..."
  - char: "laffey_ii"
    side: "left"
    text:
      - "*Пристально смотрит...*"
  - char: "devil"
    side: "right"
    text:
      - "...Ладно! Я сдаюсь! Тогда давайте просто сидеть здесь и ждать вместе..."
      - "Возможно, это лишь временный сбой связи, и скоро всё наладится!"
