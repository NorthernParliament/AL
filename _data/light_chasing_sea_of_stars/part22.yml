chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "guam"
    side: "left"
    text:
      - "Тц... Атаки противника и впрямь какие-то зловещие, половина орудий главного калибра уже вышла из строя."
      - "Мудрейшая мисс Констеллейшн, многоуважаемая леди Констеллейшн, надёжная директор Констеллейшн~ не кажется ли вам, что нам пора отступать?"
  - char: "constellation"
    side: "right"
    text:
      - "Честно говоря, я бы хотела ещё немного пособирать данные... но действительно, если мы сейчас не отступим, станет опасно."
      - "Сан-Хасинто уже спланировала маршрут, мы отступаем к отмеченной базе Сирен."
  - char: "guam"
    side: "left"
    text:
      - "Отступаем к базе Сирен... Отличная идея~ Они шумят гораздо сильнее нас, Сирены точно нападут на них первыми."
      - "А мы тем временем, хе-хе~ сбежим под шумок☆~"
  - text:
      - "Но как раз в тот момент, когда все решили отступить, из вражеского флота вылетел гигантский мех и приземлилась прямо перед ними."
  - char: "fortress_???"
    side: "right"
    status: "is-yellow"
    text:
      - "Лаборатория заново проанализировала данные, они не заражены!"
      - "Приказ флагмана: всем прекратить огонь!"
  - char: "constellation"
    side: "left"
    text:
      - "Хм? Этот мех... неужели?.."
  - char: "fortress"
    side: "right"
    status: "is-yellow"
    text:
      - "Рада знакомству, я Боевой протокол Крепость из 5-й Оперативной Группы Совета."
  - char: "guam"
    side: "left"
    text:
      - "Это Сирена!!!!"
  - char: "fortress"
    side: "right"
    status: "is-yellow"
    text:
      - "...А?"
  - char: "guam"
    side: "left"
    text:
      - "Констеллейшн, что нам делать!"
      - "Мы только что собирались стравить Сирен с ними! Почему Сирена появилась с их стороны?!"
  - char: "constellation"
    side: "right"
    text:
      - "Это действительно неожиданный поворот..."
      - "Ничего не поделаешь, придётся прорываться с боем."
      - "Но то, что она показалась — это даже хорошо... Ведь флотами Сирен должны управлять высшие Сирены, верно?"
      - "Если мы её одолеем, то сможем разрушить весь этот флот."
  - char: "fortress"
    side: "left"
    status: "is-yellow"
    text:
      - "Подождите..."
  - text:
      - "БАБАХ!!!"
  - char: "fortress"
    side: "left"
    status: "is-yellow"
    text:
      - "...А?"
