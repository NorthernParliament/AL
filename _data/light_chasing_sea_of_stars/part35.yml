chapter1:
  rows:
  - text:
      - "Советский Союз лежала внутри некоего механического устройства в центре зала."
      - "Голова дракона с её оснастки уже была снята, а остальные части — максимально демонтированы."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Сообразительный, Чкалов, каковы результаты проверки?"
  - char: "chkalov"
    side: "right"
    text:
      - "...Вывод всё тот же: присутствуют повреждения, причина неизвестна."
  - char: "soobrazitelny"
    side: "left"
    text:
      - "Как же странно... Я была уверена, что в этот раз модернизация оснастки точно пройдёт успешно."
      - "В конце концов, после стольких проверок до этого никаких проблем не возникало..."
  - char: "chkalov"
    side: "right"
    text:
      - "Однако во время инцидента с «Царством Божьим», после напряжённых боёв с Дилоями."
      - "...В итоге, как и прежде, возникли необратимые повреждения."
  - char: "soobrazitelny"
    side: "left"
    text:
      - "Возможно... в Кубе Мудрости товарища Союз кроется какое-то внутреннее ограничение."
      - "...Которое приводит к тому, что она никак не может быть совместима с оснасткой нового типа и вынуждена использовать только старую версию?.."
  - char: "chkalov"
    side: "right"
    text:
      - "Я тоже подозреваю это, но доказательств нет."
      - "Сейчас нам лучше сосредоточиться на улучшении материалов для производства."
      - "Надеюсь, исследования и работы по добыче в научно-исследовательском центре Антарктики принесут какой-нибудь прорыв."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Эту часть исследований я оставляю вам."
      - "По крайней мере, прочности этой оснастки уже достаточно для ведения обычных боёв."
      - "Просто подготовьте мне новую в соответствии с предыдущей конфигурацией."
      - "Сейчас времена неспокойные, я должна как можно скорее восстановить свою боеспособность..."
