chapter1:
  rows:
  - char: "northampton_ii"
    side: "left"
    text:
      - "А вы знали, что различные ведомства и отделы в Море Звёзд названы в честь созвездий?"
      - "Например, Бюро проектирования снаряжения, куда вы направляетесь, подчиняется Инженерному ведомству."
      - "Все отделы внутри Инженерного ведомства названы в честь созвездия Геркулеса, поэтому Бюро проектирования снаряжения также называют сектором Геркулеса."
      - "Или же Геркулес — Бюро проектирования снаряжения. В этом отделе служу я, и теперь будете служить вы."
      - "А вот наша прекрасная девушка Гуам... она приписана к немного жестокому Ведомству специальных операций."
  - char: "guam"
    side: "right"
    text:
      - "Что значит «жестокому»?! Когда прекрасная девушка применяет силу — это называется правосудием!"
      - "К слову, мой отдел называется Орион — Бюро тактических операций!"
  - char: "princeton"
    side: "left"
    text:
      - "Какие оригинальные и легко различимые названия, это действительно Море Звёзд, оправдывающее своё имя!"
  - char: "northampton_ii"
    side: "right"
    text:
      - "Хе-хе, верно. По той же логике, учреждения, связанные с экспериментами, в основном подчиняются Экспериментальному ведомству — созвездию Персея."
      - "Что касается медицины, логистики и разведки, то они находятся в ведении Ведомства принятия решений — семейства созвездий Небесных Вод."
      - "В Море Звёзд множество отделов, запомнить их все с первого раза действительно сложно."
      - "Но со временем, постепенно всё запомните."
  - char: "princeton"
    side: "left"
    text:
      - "Скажи, а к какому отделу приписана Саратога?"
  - char: "northampton_ii"
    side: "right"
    text:
      - "Хм, как уже говорила Гуам, Саратога действительно не служит в Море Звёзд, или, скорее... она скорее советник при управляющем комитете."
      - "В этом я не слишком разбираюсь."
  - char: "princeton"
    side: "left"
    text:
      - "Понятно... Тогда..."
  - char: "northampton_ii"
    side: "right"
    text:
      - "Что касается Аляски, она состоит в Комитете Моря Звёзд и одновременно управляет Ведомством принятия решений, которому подчиняется... Паруса, кхм, то есть Стратегическое бюро."
      - "В последнее время из-за дел, связанных с секретностью, она покинула Море Звёзд и уехала в командировку. Возможно, пройдёт несколько месяцев, прежде чем она вернётся."
      - "Пока начальства нет на месте, частота выхода передач Гуам, естественно, возрастает..."
  - char: "guam"
    side: "left"
    text:
      - "Прежде всего хочу сказать, что я получила разрешение от сестры на съёмку передач на базе!"
      - "А что касается того, что частота выпусков немного увеличилась... хе-хе..."
      - "...А, нет... погодите, это время, этот маршрут..."
      - "Дело дрянь!..."
  - char: "northampton_ii"
    side: "right"
    text:
      - "...Что значит «дело дрянь»?"
  - char: "guam"
    side: "left"
    text:
      - "Н-ничего..."
      - "Точно! Раз уж новички такие прилежные и любознательные, почему бы нам не отправиться в Сердце Галактики и не провести боевое тестирование!"
      - "Я прямо сейчас отправлю запрос мисс Навигатору ТБ."
  - char: "princeton"
    side: "right"
    text:
      - "«Провести боевое тестирование?..»"
      - "Разве такие вещи... можно решать так запросто?.."
      - "(...Неужели из-за отсутствия госпожи Аляски некому её контролировать?..)"
  - char: "guam"
    side: "left"
    text:
      - "Я всё слышала..."
      - "Хе-хе, в конце концов, это исследовательский комплекс, и пока оборудование свободно, можно смело подавать заявку на проведение тестов."
      - "Оставлять драгоценные машины простаивать — это тоже пустая трата ресурсов~"
      - "Окей~ Мисс Навигатор сообщила, что оборудование свободно, и наша заявка на тестирование одобрена."
      - "Это тестирование, которое проводится в Сердце Галактики, путешествие в «мир будущего»."
  - char: "louisville"
    side: "right"
    text:
      - "Мир будущего?.."
  - char: "guam"
    side: "left"
    text:
      - "Хе-хе, пока что оставим это в тайне."
      - "Так что, Принстон, ты идёшь или нет?.."
  - char: "princeton"
    side: "right"
    text:
      - "...Я иду!"

chapter2:
  rows:
  - text:
      - "Спустя некоторое время..."
  - char: "guam"
    side: "left"
    text:
      - "Фух... Если пойдём этим путём, то должны быть... в безопасности."
  - char: "constellation"
    side: "right"
    text:
      - "Гуам, ты меня ищешь?"
  - char: "guam"
    side: "left"
    text:
      - "К-Констеллейшн?! Ты... почему ты ждёшь здесь..."
  - char: "constellation"
    side: "right"
    text:
      - "Я погадала по звёздам."
  - char: "guam"
    side: "left"
    text:
      - "Предсказать мой маршрут, опираясь только на гадание?!.. Нет, подожди..."
      - "Неужели... Ува-а~ Сан-Хасинто..."
  - char: "san_jacinto"
    side: "right"
    text:
      - "А я ничего не говорила."
  - char: "constellation"
    side: "left"
    text:
      - "Верно, Сан-Хасинто с самого начала ничего не говорила."
      - "...Но ты забыла, что теперь все тестовые проекты, связанные с оснасткой типа II, находятся в ведении объединённой оперативной группы, которой я руковожу."
      - "Естественно, заявка на тестирование, которую ты только что отправила ТБ, была одобрена только после моего утверждения."
  - char: "guam"
    side: "right"
    text:
      - "Прекрасная девушка Гуам... в спешке совершила ошибку!..."
  - char: "princeton"
    side: "left"
    text:
      - "Простите..."
  - char: "constellation"
    side: "right"
    text:
      - "Ах, так ты старшая сестра Сан-Хасинто."
      - "Приятно познакомиться, Принстон, Луисвилл и Лаффи. Я — Констеллейшн."
      - "Я уже подготовила для вас индивидуальный план тестирования с учётом ваших показателей. Подробности вам сообщит TБ."
      - "Гуам и Луисвилл я пока заберу с собой, а остальных оставляю на тебя, Нортгемптон."
  - char: "northampton_ii"
    side: "left"
    text:
      - "Без проблем."
  - char: "louisville"
    side: "right"
    text:
      - "Э-э?.. Разве мне не нужно сначала доложить о прибытии в свой отдел и завершить процедуру перевода..."
  - char: "constellation"
    side: "left"
    text:
      - "Ничего страшного, твои данные уже внесены в систему. Оформление перевода — простая формальность, это не к спеху."
      - "Мне сейчас как раз не хватает рабочих рук, так что пойдём со мной. И ты, Гуам..."
  - char: "guam"
    side: "right"
    text:
      - "Ахаха-а... Тогда прекрасная девушка Гуам немедленно отправляется выполнять важную миссию под названием «собрание»!"
      - "Желаю всем счастливого пути! Море Звёзд безгранично, мы ещё обязательно встретимся!"

chapter3:
  rows:
  - char: "laffey"
    side: "left"
    text:
      - "Умчалась, словно порыв ветра..."
  - char: "princeton"
    side: "right"
    text:
      - "Гуам очень энергичная..."
  - char: "northampton_ii"
    side: "left"
    text:
      - "Эх... она всегда такая, к этому просто нужно привыкнуть."
      - "Дальше нам нужно будет пересесть на монорельс. Пожалуйста, следуйте за мной, идёмте."
