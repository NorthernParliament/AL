chapter1:
  rows:
  - char: "guam"
    side: "left"
    text:
      - "Ха-а... Как же скучно... Такое чувство, что прошла уже целая вечность..."
      - "Флэшер, извлечение ещё не закончилось?"
  - char: "flasher"
    side: "right"
    text:
      - "Хм... Объём данных цели оказался куда больше ожидаемого, чтобы полностью их проанализировать, потребуется много времени..."
      - "Но извлечение уже перешло в стадию отсчёта..."
      - "99.98%... 99.99%... 100%... Завершено!"
  - char: "guam"
    side: "left"
    text:
      - "Отлично! Значит, теперь мы можем как следует пошуметь и на всех парах рвануть вперёд?!"
  - char: "flasher"
    side: "right"
    text:
      - "Шуметь нельзя, но вот рвануть на всех парах... думаю, можно!"
  - char: "constellation_rad"
    side: "left"
    text:
      - "Вы меня слышите? С этого момента режим радиомолчания для флота Гуам отменяется. Приём."
  - char: "guam"
    side: "right"
    text:
      - "Констеллейшн?! С чего вдруг ты решила связаться с нами?"
  - char: "constellation_rad"
    side: "left"
    text:
      - "Я уже вижу то, что вы смогли добыть..."
      - "Ваше предположение было абсолютно верным... Этот аномальный блок данных... хотя я пока не могу с уверенностью сказать, что это такое."
      - "Но, без сомнения, в нём содержится крайне ценная цель, заслуживающая изучения."
      - "Возможно, он сможет пролить свет на правду о том, что было скрыто в этих водах в те годы..."
      - ".....Наконец-то. В нашем расследовании наконец-то наметился прогресс."
  - char: "guam"
    side: "right"
    text:
      - "Погоди, Констеллейшн! Наше извлечение только-только закончилось, как ты уже успела сделать выводы из анализа?!"
  - char: "constellation_rad"
    side: "left"
    text:
      - "О, я запустила программу анализа ещё в процессе вашего извлечения."
  - char: "flasher"
    side: "right"
    text:
      - "Э-э... в процессе извлечения? Но, сестрёнка Констеллейшн, это ведь нарушение правил «Песочницы»..."
  - char: "constellation_rad"
    side: "left"
    text:
      - "Ничего страшного. В этот раз у нас особый случай, у меня есть разрешение."
  - char: "flasher"
    side: "right"
    text:
      - "Н-но..."
  - char: "constellation_rad"
    side: "left"
    text:
      - "В любом случае, вы отлично потрудились. В этой симулированной зоне больше нет ничего ценного для извлечения, все последующие задачи отменяются."
      - "Время поджимает, нам пора приступать к следующему заданию."
  - char: "guam"
    side: "right"
    text:
      - "...Что за следующее задание?"
  - char: "constellation_rad"
    side: "left"
    text:
      - "Разумеется, исследование содержимого аномального блока данных."
      - "Что бы там ни находилось, стоит лишь поместить это в Линзу Реальности, и всё станет ясно."
  - char: "guam"
    side: "right"
    text:
      - "......Ты собираешься немедленно проанализировать эти аномальные данные неизвестного происхождения?.. Не слишком ли ты торопишься?"
  - char: "constellation_rad"
    side: "left"
    text:
      - "Не волнуйся, «происхождение» блока данных, который вы извлекли из заданной зоны симулированного мира Кораллового моря, предельно ясно."
      - "К тому же, я уже попросила TБ всё проверить. Вывод таков: если блок данных не поместить в Линзу Реальности, его невозможно будет полностью расшифровать."
      - "В то же время TБ считает, что данные не представляют «прямой угрозы»."
      - "Раз так, то следующим шагом, естественно, будет их полный анализ в Линзе Реальности!"
  - char: "tb_rad"
    side: "right"
    text:
      - "Корректировка формулировки. Результаты анализа показывают лишь то, что на поверхностном уровне аномального блока данных, извлечённого в ходе этой миссии, присутствует содержимое, не соответствующее эпохе сражения в Коралловом море."
      - "Проведённый анализ показал, что эти расхождения в данных не представляют никакой опасности."
      - "Однако уровень сжатия внутренних данных слишком высок, поэтому на данный момент невозможно оценить общую степень их угрозы."
  - char: "constellation_rad"
    side: "left"
    text:
      - "Вот именно! Что скрыто внутри, станет ясно, как только мы воспользуемся Линзой Реальности!"
      - "В прошлый раз с Анкоридж разве не так же было? После обнаружения неизвестного аномального блока данных Командир задействовал Линзу Реальности и всё уладил!"
      - "В этот раз я просто делаю то же самое, следуя той же логике и тем же процедурам!"
  - char: "guam"
    side: "right"
    text:
      - "В тот раз Командир провёл тщательную оценку рисков, так что это всё же отличается от твоей нынешней ситуации..."
  - char: "flasher"
    side: "left"
    text:
      - "Уууу... ууу..."
  - char: "guam"
    side: "right"
    text:
      - "Успокойся, давай хотя бы дождёмся нашего возвращения и обсудим, что делать дальше, хорошо?"
      - "Смотри, ты ребёнка до слёз напугала."
  - char: "constellation_rad"
    side: "left"
    text:
      - "........Ладно, я займусь этим сама."
  - char: "san_jacinto_rad"
    side: "right"
    text:
      - "Подожди, в любом случае ты не сможешь сделать это в одиночку."
      - "Констеллейшн, я пойду с тобой."
  - char: "constellation_rad"
    side: "left"
    text:
      - "Хорошо. Сан-Хасинто, за мной, к Линзе Реальности!"
  - char: "guam"
    side: "right"
    text:
      - "Эй... Отключилась..."
  - char: "flasher"
    side: "left"
    text:
      - "Ууу... сестрёнка Констеллейшн... обычно... она не такая..."
  - char: "guam"
    side: "right"
    text:
      - "Угу, я знаю..."
      - "Просто... она внезапно увидела долгожданный прорыв... и немного потеряла голову от волнения."
      - "TБ, скорее останови Констеллейшн! Не позволь ей запустить Линзу Реальности!"
  - char: "tb_rad"
    side: "left"
    text:
      - "Отрицательно. Данное тестирование было инициировано Констеллейшн с использованием протокола PR-1, и может быть изменено только после единогласного решения Комитета Моря Звёзд."
  - char: "guam"
    side: "right"
    text:
      - "PR-1?.. Разве это не высший приоритет?!.. Сколько же полномочий Саратога ей на этот раз выдала?!.."
      - "Эх! Тогда скорее вытащи нас отсюда!"
  - char: "tb_rad"
    side: "left"
    text:
      - "Приказ подтверждён, запускаю процедуру прерывания..."
      - "Предупреждение: из-за несоблюдения протокола «Песочницы» в симулированном мире присутствуют серьёзные аномалии данных. Запускаю процедуру очистки согласно плану действий в чрезвычайных ситуациях."
      - "Расчётное время завершения — 30 минут. Пожалуйста, подождите."
  - char: "guam"
    side: "right"
    text:
      - "Просто сидеть здесь и ждать полчаса?.. Да к тому времени уже будет слишком поздно!..."
  - char: "tb_rad"
    side: "left"
    text:
      - "Эта процедура очистки необходима для обеспечения безопасности системы. Пожалуйста, наберитесь терпения."
  - char: "guam"
    side: "right"
    text:
      - "Хорошо-хорошо... да-да-да... ладно-ладно..."
      - "Эх... Никогда ещё я так отчаянно не желала, чтобы сестра сейчас была в Море Звёзд..."
