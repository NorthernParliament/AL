chapter1:
  rows:
  - text:
      - "Когда зрение вернулось, перед глазами присутствующих предстал красочный мир."
  - char: "princeton"
    side: "left"
    text:
      - "Это и есть... мир будущего?"
      - "Как... как удивительно, мы оказались... в будущем?!"
  - char: "northampton_ii"
    side: "right"
    text:
      - "Успокойся, Принстон, мы всё ещё в Море Звёзд. Помнишь, что я говорила? Это просто как реалистичные декорации к фильму."
  - char: "princeton"
    side: "left"
    text:
      - "(Реалистичные декорации к фильму... реалистичные декорации к фильму...)"
      - "(Ува-а... Чего ещё ожидать от базы Море Звёзд! Кажется, слухи о том, что их технологии опережают время на тридцать лет, были ещё весьма скромными...)"
  - char: "laffey_ii"
    side: "right"
    text:
      - "...Лаффи чувствует, что стала сильнее... Что это за снаряжение?"
  - char: "princeton"
    side: "left"
    text:
      - "...А? Лаффи, твоя оснастка... она стала совершенно не такой, как до того, как мы сюда вошли?!"
      - "Это снаряжение... оснастка типа II? Это и есть тот новый план тестирования, о котором ранее говорила мисс Навигатор?"
  - char: "tb_rad"
    side: "right"
    text:
      - "Подтверждаю. Текущий статус: построение симулированного мира — всё в норме. Перезапись данных оснастки типа II — проходит успешно."
      - "Воспроизведение: «Дамы, добро пожаловать в сегодняшний симулированный мир NY~☆». Автор записи: Гуам."
  - char: "princeton"
    side: "left"
    text:
      - "Ахаха... Так что такое перезапись данных оснастки?.."
  - char: "northampton_ii"
    side: "right"
    text:
      - "На этот вопрос отвечу я."
      - "Поскольку производство оснастки типа II требует огромных затрат ресурсов, а цикл её создания очень велик."
      - "Множество предыдущих неудач вынудило отдел исследований и разработок начать применять новый метод тестирования — симуляционное тестирование с перезаписью."
      - "Его принцип заключается в том, что в симулированном мире, созданном в Сердце Галактики, данные оснастки типа II напрямую перезаписываются поверх данных кораблей, участвующих в симуляции."
      - "Так как данные оснастки типа II для Лаффи на данный момент являются наиболее близким к теоретическому успеху вариантом из тех, что у нас есть, Лаффи и перевели на базу Моря Звёзд для содействия в тестировании."
      - "Пожалуйста, не волнуйтесь, перезапись в рамках эксперимента — это лишь вычислительная операция с данными, симулированная оснастка типа II не имеет физической связи с Кубом Мудрости."
      - "Ни при каких обстоятельствах это не окажет реального негативного воздействия на организм Лаффи."
  - char: "princeton"
    side: "left"
    text:
      - "(То, что они могут проводить симуляции такой точности, означает, что сами данные оснастки уже весьма проработаны, и её можно запускать в производство в любой момент... Скорость разработок в Море Звёзд и правда поражает!)"
  - char: "laffey_ii"
    side: "right"
    text:
      - "...Лаффи совершенно ничего не поняла."
      - "Но... сила возросла... теперь можно лучше сражаться."
      - "TБ, когда начнётся бой?"
  - char: "tb_rad"
    side: "left"
    text:
      - "Пожалуйста, подождите, идёт генерация данных симулированного противника..."

chapter2:
  rows:
  - text:
      - "Вслед за командой TБ на горизонте из ниоткуда появился флот."
      - "Каждый корабль в этом флоте выглядел настолько передовым, что Принстон никогда прежде не видела ничего подобного."
  - char: "princeton"
    side: "left"
    text:
      - "Невиданные военные корабли... и невиданное оружие... неужели это и есть флот будущего?!"
  - char: "northampton_ii"
    side: "right"
    text:
      - "Внешне — да. Этот флот тоже воссоздан из данных, которые ранее добыл Командир."
      - "К сожалению, из этих данных мы смогли восстановить лишь их внешний вид, состав флота, боевую тактику, а также ту боевую мощь, которой они должны обладать."
      - "Что до других деталей... угу, их просто нет, не говоря уже о возможности их реального производства."
  - char: "laffey_ii"
    side: "left"
    text:
      - "...Немного похоже на игру?"
  - char: "northampton_ii"
    side: "right"
    text:
      - "Верно, очень похоже."
  - char: "princeton"
    side: "left"
    text:
      - "Понятно..."
      - "Тот самый огромный корабль в строю — это флагман флота?"
  - char: "tb_rad"
    side: "right"
    text:
      - "Подтверждаю. Флагман флота OFS, глубоководный разведывательный корабль «Эпиметей»."
      - "Примечание: баланс сил был отрегулирован на основе сопоставления боевой мощи."
      - "Важно: пожалуйста, неукоснительно соблюдайте правила тестирования."
      - "Симуляционный бой официально начнётся через одну минуту..."
