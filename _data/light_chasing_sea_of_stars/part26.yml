chapter1:
  rows:
  - text:
      - "Принстон вернулась с флагмана только спустя час."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Прошу прощения, заставила всех ждать!"
  - char: "constellation"
    side: "right"
    text:
      - "Проблема с ошибкой доступа решена?"
  - char: "prinston_meta"
    side: "left"
    text:
      - "В... вроде того... Как и с системой связи до этого, возникла временная неполадка... простите за это недоразумение."
      - "Уже темнеет, давайте ужинать~"
  - text:
      - "Принстон подошла к обеденному столу, и её взгляду тут же предстала целая гора закусок."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Эта упаковка... классическая кола?!"
      - "А ещё сырные кукурузные чипсы... и чипсы со столькими вкусами?!"
      - "Это... всё принесли вы?!"
  - char: "guam"
    side: "right"
    text:
      - "Ага~ Ваша еда — это питательные, но совершенно безвкусные армейские пайки, так что мы порылись в наших запасах и достали немного закусок, чтобы скрасить жизнь~"
  - char: "prinston_meta"
    side: "left"
    text:
      - "...А это нормально, что вы берёте такое на поле боя, занимая место в трюмах?"
  - char: "guam"
    side: "right"
    text:
      - "Э-э... вообще-то, мы изначально не готовились к выходу на задание."
      - "К тому же, это ни в какое сравнение не идёт со стандартами флотского питания, верно?"
      - "Ваш флот ведь тоже можно считать военно-морским... так? С каких пор стандарты питания стали такими."
  - char: "prinston_meta"
    side: "left"
    text:
      - "...Всё-таки мы на боевом задании, приходится перебиваться синтетической едой."
      - "Честно говоря... я не ела таких закусок уже много лет..."
  - text:
      - "Принстон посмотрела на банку колы на столе, и в её глазах промелькнул блеск."
  - char: "constellation"
    side: "left"
    text:
      - "Мисс Принстон, не стесняйтесь, угощайтесь."
      - "Закусок и колы у нас сколько угодно."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Правда?.. Тогда не буду стесняться!"

chapter2:
  rows:
  - char: "prinston_meta"
    side: "right"
    text:
      - "Ха-а... Именно такой у неё и должен быть вкус!.."
      - "Как я и думала, после изменения рецепта, как ни пытайся его воссоздать, вкус всё равно будет отличаться."
  - char: "constellation"
    side: "left"
    text:
      - "А зачем было менять рецепт колы?"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Эх... оригинальный рецепт колы был утерян во время великой войны."
  - char: "constellation"
    side: "left"
    text:
      - "Великая война?.."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Ой... кхм, ничего! Ничего!"
  - char: "constellation"
    side: "left"
    text:
      - "Так я и думала... тебе велели держать язык за зубами."
  - char: "prinston_meta"
    side: "right"
    text:
      - "Как и ожидалось от мисс Констеллейшн, от тебя ничего не утаишь..."
      - "В нашем флоте есть один невероятно выдающийся учёный."
      - "Она только что сказала мне, что при столкновении с пространственно-временными аномалиями необходимо проявлять крайнюю осторожность."
      - "Во избежание эффекта бабочки она строго ограничила то, что я могу спрашивать и отвечать."
  - char: "constellation"
    side: "left"
    text:
      - "Этот учёный... неужели это та самая госпожа «Серебряная Лиса» с флагмана?"
  - char: "prinston_meta"
    side: "right"
    text:
      - "Э-э........."
      - "Кхм... госпожа «Серебряная Лиса» передаёт вам всем привет. Крепость, переведи связь с флагмана сюда."
  - char: "fortress_1"
    side: "left"
    text:
      - "Переадресация вызова..."
  - char: "silver_fox"
    side: "right"
    text:
      - "Здравствуйте, путешественники, рада встрече. Я один из постоянных членов Совета, зовите меня «Серебряной Лисой»."
  - char: "constellation"
    side: "left"
    text:
      - "Имя «Серебряная Лиса» — это, должно быть, оперативный позывной? Полагаю, он связан с тем, что у тебя серебристые волосы, и ты хитра как лиса?"
  - char: "silver_fox"
    side: "right"
    text:
      - "Хе-хе, это позывной. Этот позывной придумала не я, поэтому насчёт лисы мне трудно сказать, но значение слова «серебряная» ты угадала верно."
      - "Да, у меня серебристые волосы."
  - char: "constellation"
    side: "left"
    text:
      - "Можем ли мы поговорить с тобой лично?"
  - char: "silver_fox"
    side: "right"
    text:
      - "Эпоха, в которой я нахожусь... эпоха, свидетельницей которой я была — для вас это вовсе не прекрасное время."
      - "Поэтому из соображений осторожности нам лучше не встречаться."
      - "И конечно, нам всем лучше перестать выпытывать друг у друга информацию, так будет безопаснее всего."
  - char: "constellation"
    side: "left"
    text:
      - "Серебряная Лиса, ты веришь в судьбу?"
  - char: "silver_fox"
    side: "right"
    text:
      - "Если под судьбой ты подразумеваешь, что «во Вселенной есть некое высшее существо, которое уже давно сплело для каждого предопределённый путь»..."
      - "Я в это не верю."
  - char: "constellation"
    side: "left"
    text:
      - "А как насчёт чудес, которые рождаются случайно, от столкновения жизненных путей?"
  - char: "silver_fox"
    side: "right"
    text:
      - "Подобное иногда случается, но ведь это очень далеко от понятия судьбы, верно?"
  - char: "constellation"
    side: "left"
    text:
      - "Перед отправлением я погадала, и результат показал, что эта поездка обязательно принесёт плоды."
      - "А потом мы встретились."
      - "Это случайное столкновение, о котором никто не знал заранее, но оно кажется предначертанным судьбой, не так ли?"
  - char: "silver_fox"
    side: "right"
    text:
      - "Тот, кто предсказывает судьбу, также обладает правом её толковать."
      - "До встречи с нами вы пережили череду происшествий и даже разлучились со своей спутницей."
      - "И как ты тогда расценивала результат этого гадания?"
  - char: "constellation"
    side: "left"
    text:
      - "Насчёт этого..."
  - char: "silver_fox"
    side: "right"
    text:
      - "К тому же, причиной нашей встречи стала не простая случайность, а маяк Совета."
      - "Этот маяк не только получил физические повреждения, но и уцелевшие в нём данные также подверглись заражению."
      - "Я уже начала попытки восстановления и очистки, но не могу гарантировать результат."
      - "Судя лишь по имеющейся информации, в этой встрече, хоть и есть доля случайности, ощущается и некий оттенок спланированности."
      - "Мне нужно больше информации, чтобы сделать окончательные выводы."
  - char: "constellation"
    side: "left"
    text:
      - "В этом мы солидарны."
      - "В этом маяке, возможно, скрыты зацепки, которые позволят нам вернуться домой."
  - char: "silver_fox"
    side: "right"
    text:
      - "Домой... значит."
  - char: "constellation"
    side: "left"
    text:
      - "Поэтому давайте отбросим беспочвенные тревоги и сосредоточимся на настоящем."
      - "У нас всех есть информация, которую мы хотим получить друг от друга, не так ли?"
  - char: "silver_fox"
    side: "right"
    text:
      - "Да, но я не хочу рисковать."
  - char: "constellation"
    side: "left"
    text:
      - "Э-э... какая же ты упрямая."
  - char: "silver_fox"
    side: "right"
    text:
      - "Хе-хе, мне часто это говорят."
  - char: "guam"
    side: "left"
    text:
      - "А как насчёт такого: давайте решим всё с помощью игры?"
  - char: "silver_fox"
    side: "right"
    text:
      - "Игры?.."
  - char: "guam"
    side: "left"
    text:
      - "Угу~ Игра в вопросы и ответы. Мы спрашиваем, ты отвечаешь."
      - "На наши вопросы ты можешь либо ответить, либо отказаться отвечать."
      - "После того, как ты ответишь, ты сможешь задать вопрос нам."
      - "На сколько вопросов ответишь ты, на столько вопросов ответим и мы."
      - "Таким образом, инициатива будет полностью в твоих руках, и ты сможешь тщательно контролировать то, какой информацией мы обмениваемся~"
      - "Ну как, сыграем в эту игру?"
  - char: "silver_fox"
    side: "right"
    text:
      - "..."
      - "Раз уж это игра, у неё должно быть завершение."
      - "Вас шестеро, так что давайте ограничимся шестью вопросами."
  - char: "guam"
    side: "left"
    text:
      - "Договорились~"
  - char: "constellation"
    side: "right"
    text:
      - "Эти правила... Гуам, иногда тебе и правда приходят в голову неплохие идеи."
  - char: "guam"
    side: "left"
    text:
      - "Хе-хе, не стоит недооценивать силу прекрасной девушки-артистки☆~"
  - char: "silver_fox"
    side: "right"
    text:
      - "Однако... игру с вопросами придётся ненадолго отложить."
      - "...Появилось «небесное явление Предвестников», то, что вы называете чёрной бурей."
  - char: "louisville"
    side: "left"
    text:
      - "Неужели... она и правда последовала за нами по следам маяка?"
  - char: "san_jacinto"
    side: "right"
    text:
      - "И правда не отстаёт ни на шаг, преследует как назойливый призрак..."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Крепость, сосредоточься на защите базы, я поведу флот, чтобы с этим разобраться."
  - char: "guam"
    side: "right"
    text:
      - "Позвольте и нам помочь~!"
  - char: "prinston_meta"
    side: "left"
    text:
      - "Госпожа Серебряная Лиса, можно взять их с собой?"
  - char: "silver_fox"
    side: "right"
    text:
      - "Пусть идут."
  - char: "prinston_meta"
    side: "left"
    text:
      - "Хорошо. Все за мной, приготовиться к бою!"
