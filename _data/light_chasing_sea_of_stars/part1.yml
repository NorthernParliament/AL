chapter1:
  rows:
  - char: "guam"
    side: "left"
    text:
      - "Ракурс... готов."
      - "Настройка параметров... завершена."
      - "Запись... запущена."

chapter2:
  rows:
  - char: "guam"
    side: "left"
    text:
      - "Доброе утро, коллеги, усердно трудящиеся в Море Звёзд! Сейчас четыре часа десять минут утра..."
      - "Хм... Для десяти минут пятого «доброе утро» звучит немного странно..."
      - "Но, э-э... когда вы увидите эту передачу, уже точно будет утро!"
      - "Так что «доброе утро» вполне уместно!"
      - "Но если подумать, вдруг что-то пойдёт не так, и когда видео выйдет, будет непонятно, который час... Неужели придётся ставить таймер публикации на завтрашнее утро?"
      - "Это же всё с ног на голову перевернёт, полный провал... Ладно, вырежу это и начну заново!"
      - "Здравствуйте, коллеги, усердно трудящиеся в Море Звёзд!"
      - "С вами ваша подруга, прекрасная девушка-айдол, CB-2 Союза Орла — Гуам!"
      - "Сейчас четыре часа десять минут утра. В обычно оживлённом ангарном отсеке нет ни души, и, возможно, во мраке скрываются жуткие призраки и монстры!"
      - "Думаю, дорогие зрители уже всё поняли..."
      - "«Неужели знаменитая звезда Гуам сейчас собирается расследовать слухи о привидениях?!»"
      - "И ответ... верный!"
      - "Говоря о недавних слухах о привидениях в Море Звёзд, возможно, кто-то ещё не в курсе, но на самом деле..."
  - char: "northampton_ii"
    side: "right"
    text:
      - "Кхм... Гуам, мы ведь здесь, чтобы встретить самолёт."
      - "И что ещё за слухи о привидениях, почему я никогда о них не слышала?"
  - char: "guam"
    side: "left"
    text:
      - "Ах да~ Мы же пришли встречать самолёт, эхе-хе."
      - "Верно, на самом деле слухи о привидениях в Море Звёзд абсолютно беспочвенны. Верьте в науку, не верьте слухам и не распространяйте их."
  - char: "northampton_ii"
    side: "right"
    text:
      - "...То, что ты на полном серьёзе всё это объясняешь, делает ситуацию только более подозрительной."
  - char: "guam"
    side: "left"
    text:
      - "Эхе-хе~ Я специально."
  - char: "northampton_ii"
    side: "right"
    text:
      - "...Самолёт уже прибыл, пора бы выключить камеру."
  - char: "guam"
    side: "left"
    text:
      - "Ну уж нет~ Я специально выбрала этот ракурс, чтобы заснять, как мы её встречаем."
      - "Сан-Хасинто лично попросила меня об одолжении, чтобы я записала на видео момент, когда её сестрёнка Принстон впервые прибудет в Море Звёзд."
      - "Сказала что-то вроде: «Ты обязательно сможешь заснять тот момент, когда моя вечно серьёзная сестра превратится в любопытного ребёнка», — и она хочет сохранить это в своей коллекции."
      - "Конечно~ Это честная сделка!"
      - "Взамен я выудила у Сан-Хасинто сегодняшнее расписание Констеллейшн, так что сегодня она меня ни за что не поймает и не затащит на очередное собрание..."
  - char: "northampton_ii"
    side: "right"
    text:
      - "...Кажется, я услышала то, чего не должна была."
  - char: "guam"
    side: "left"
    text:
      - "Ничего страшного, когда я буду монтировать видео, то всё это чистенько вырежу☆~"
      - "Тсс, слышишь..."

chapter3:
  rows:
  - char: "princeton"
    side: "left"
    text:
      - "...Если верить навигатору, нам нужно идти в эту сторону."
      - "Подумать только, мы лишь дошли до края ангара... Для ангара, вырубленного в скале, его размеры просто абсурдны..."
      - "Дальше нам спускаться вниз?.. Или сначала нужно пройти по этому коридору? Настоящий лабиринт..."
      - "Лаффи, держись рядом, заблудиться здесь будет той ещё проблемой."
  - char: "laffey"
    side: "right"
    text:
      - "Угу..."
  - char: "princeton"
    side: "left"
    text:
      - "Чего ещё ожидать от Моря Звёзд, здесь даже вход такой просторный... Как для сооружения, выкопанного внутри горы, это уж слишком роскошно..."
      - "Материал этих стен тоже выглядит очень передовым, неужели... это какие-то высокотехнологичные стройматериалы?"
      - "Но из-за этого сильно возрастает риск заблудиться, надо найти кого-нибудь, кто покажет дорогу..."
      - "Как раз вовремя, давай спросим у той девушки впереди... Простите..."
      - "А? Луисвилл? Ты тоже в Море Звёзд?"
  - char: "louisville"
    side: "right"
    text:
      - "А, это вы, Принстон и Лаффи... Какие-то проблемы?"
  - char: "princeton"
    side: "left"
    text:
      - "Слушай, не подскажешь, как пройти в Бюро проектирования снаряжения... эм, то есть в сектор Геркулес?"
  - char: "louisville"
    side: "right"
    text:
      - "Прости, меня саму только-только перевели в Море Звёзд, я ещё плохо знаю здешние дороги."
      - "Впрочем, мне тоже нужно в Бюро."
  - char: "princeton"
    side: "left"
    text:
      - "Кажется, нам по пути. Давай искать вместе~"

chapter4:
  rows:
  - char: "guam"
    side: "left"
    text:
      - "Это голос Луисвилл. Похоже, та, кого ты ждала, тоже прибыла."
      - "Хм... судя по звуку, они вот-вот должны выйти из-за угла."
      - "Раз, два, сюрприз пошёл..."
  - text:
      - "*Бах-бах-бах* (Звук взорвавшихся хлопушек)"
  - char: "louisville"
    side: "right"
    text:
      - "А-а-а-а-а!..."
  - char: "princeton"
    side: "left"
    text:
      - "Что происходит?!.."
  - char: "guam"
    side: "right"
    text:
      - "Добро! Пожаловать! В Море Звёзд!!"
      - "Я выступающая в Море Звёзд прекрасная девушка-айдол с множеством талантов, Гуам, а это рядом со мной — Нортгемптон~ Вас ведь перевели на службу на базу Моря Звёзд, верно?"
  - char: "princeton"
    side: "left"
    text:
      - "Так точно! Второй корабль типа «Индепенденс», Принстон, только что переведена из командования NY. С сегодняшнего дня я приписана к базе Море Звёзд."
      - "Рядом со мной Лаффи, а также..."
  - char: "louisville"
    side: "right"
    text:
      - "Луисвилл. Рада встрече с вами."
  - char: "northampton_ii"
    side: "left"
    text:
      - "Добро пожаловать на базу Море Звёзд. Вы, должно быть, устали с дороги, так что дальше мы покажем вам путь."
  - char: "princeton"
    side: "right"
    text:
      - "Отлично! Да, кстати, а эта камера рядом... вы снимаете какой-то проморолик?"
  - char: "guam"
    side: "left"
    text:
      - "Да!"
  - char: "northampton_ii"
    side: "right"
    text:
      - "Нет!"
  - char: "guam"
    side: "left"
    text:
      - "Это очень важная передача!"
  - char: "northampton_ii"
    side: "right"
    text:
      - "Это просто хобби Гуам."
  - char: "guam"
    side: "left"
    text:
      - "Пожалуйста, обязательно посодействуйте съёмкам!"
  - char: "northampton_ii"
    side: "right"
    text:
      - "Не обращайте на неё внимания, пойдёмте."
  - char: "princeton"
    side: "left"
    text:
      - "......?.."
  - char: "guam"
    side: "right"
    text:
      - "Ахахаха... Точно-точно, вы ведь только прибыли в Море Звёзд, вам наверняка нужен гид, так?"
      - "Я здесь уже, можно сказать, ветеран, каждый уголок Моря Звёзд знаю как свои пять пальцев!"
      - "Будь то назначение комплексов или секретные байки, мне известно всё."
      - "Можете смело задавать мне любые вопросы!.."
  - char: "princeton"
    side: "left"
    text:
      - "...В таком случае, у меня действительно есть один вопрос."
      - "Подскажите, когда я смогу увидеться с Саратогой?"
  - char: "guam"
    side: "right"
    text:
      - "Хм?.. Саратога не служит в Море Звёзд, вообще-то."
  - char: "princeton"
    side: "left"
    text:
      - ".........А?"
      - "Т-тогда... директор Аляска?"
  - char: "guam"
    side: "right"
    text:
      - "...Директор Аляска? Хм? Моя старшая сестра действительно состоит в управляющем комитете, но у неё другая должность..."
      - "А... впрочем, неважно. Информация снаружи всегда немного искажена."
      - "Но к сожалению, сестра сейчас в командировке по долгу службы, поэтому её пока нет в Море Звёзд."
  - char: "princeton"
    side: "left"
    text:
      - ".........А?"
      - "К-как же так..."
  - char: "guam"
    side: "right"
    text:
      - "Твоё разочарование видно невооружённым глазом... Неужели ты прибыла сюда специально ради Саратоги и моей сестры?"
  - char: "princeton"
    side: "left"
    text:
      - "Н-нет... Меня перевели сюда исключительно из-за приказа. Цель — содействие в исследовании целесообразности оснастки типа II для класса «Принстон»."
      - "Фух... Раз уж так вышло, могу я попросить вас ответить на несколько вопросов касательно самой работы?"
      - "Вот вопросы, которые я составила после получения материалов, взгляните, пожалуйста."
  - char: "guam"
    side: "right"
    text:
      - "Это же............ блокнот, исписанный мелким почерком от корки до корки?!"
      - "Плохо дело... Это тот самый суперсерьёзный и старательный тип, с которым прекрасная девушка Гуам совершенно не умеет справляться!"
      - "Каждому своё дело. Нортгемптон, так что поручаю ответы тебе☆~"
  - char: "northampton_ii"
    side: "left"
    text:
      - "И кто же только что говорил, что ей можно смело задавать любые вопросы."
  - char: "guam"
    side: "right"
    text:
      - "Это была прекрасная девушка Гуам~ Задавать вопросы можно, но это ведь не значит, что на них обязательно ответят!"
      - "Ладно-ладно~ Давайте не будем просто стоять на одном месте~"
      - "Дальше Гуам будет отвечать за видеосъёмку, а Нортгемптон возьмёт на себя роль гида и всё объяснит по пути."
      - "Мы чётко разделили обязанности, каждая занимается своим делом, так что вперёд к цели~!"
