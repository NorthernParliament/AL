chapter1:
  rows:
  - text:
      - "Глядя на утреннее солнце, я невольно зевнул."
      - "Закономерным итогом минувшей ночи, разумеется, стало то, что я так и не сомкнул глаз."
  - char: "commander"
    side: "left"
    text:
      - "Какое счастье, что сегодня на конференции перерыв..."
      - "Тоже мне, «приятных снов»... И как она только могла такое сказать."
      - "...Ладно. План моих дальнейших действий уже почти сформирован."
      - "Пора воплощать его в жизнь."

chapter2:
  rows:
  - text:
      - "Это некое пространство под зданием штаб-квартиры Трибунала."
      - "Зал, которого не существует ни на одних чертежах."
  - char: "clemenceau"
    side: "right"
    status: "is-yellow"
    text:
      - "Командир, добро пожаловать в штаб-квартиру Трибунала. Могу я узнать причину твоего сегодняшнего визита?"
  - char: "commander"
    side: "left"
    text:
      - "Ты ведь уже обо всем догадалась, не так ли?"
      - "Иначе зачем бы тебе выбирать для встречи столь скрытное место?"
  - char: "clemenceau"
    side: "right"
    status: "is-yellow"
    text:
      - "Вовсе нет, выбор пал на это место исключительно из соображений безопасности."
      - "Сейчас к тебе приковано бесчисленное множество глаз, и если с тобой здесь хоть что-нибудь случится, я не смогу объясниться перед другими фракциями."
  - char: "commander"
    side: "left"
    text:
      - "Вчерашняя конференция и так вымотала все силы, поэтому давай сегодня будем говорить прямо."
      - "Мы в столице Ортодоксии Ирис, на главной базе Трибунала, и я абсолютно уверен в вашей компетентности."
      - "Так что цель моего визита должна быть тебе предельно ясна."
  - char: "clemenceau"
    side: "right"
    status: "is-yellow"
    text:
      - "Хе-хе, рабочие навыки мисс Мемфис и впрямь выдающиеся, однако её способность к домыслам работает слишком уж бурно."
      - "Я считаю, что высказанные ей в отчёте догадки — чистой воды вздор."
      - "То, что мисс Мемфис сочла аномальной мобилизацией флота Трибунала в тот день, было лишь спектаклем, разыгранным мной для содействия Марко Поло."
      - "В этом нет ничего заслуживающего особого внимания."
  - char: "commander"
    side: "left"
    text:
      - "...Клемансо, тот отчёт Мемфис читал только я, и я не планирую, чтобы о нём узнал кто-то ещё."
      - "У меня нет ни малейшего намерения угрожать тебе или Трибуналу."
      - "Я лишь хочу в обмен на это попросить тебя о двух одолжениях."
  - char: "clemenceau"
    side: "right"
    status: "is-yellow"
    text:
      - "..."
      - "...В тот день на территории Всемирной выставки ты принял верное решение касательно флота Святого Престола."
  - char: "clemenceau"
    side: "right"
    text:
      - "Хорошо, я готова поверить тебе... Ты можешь встретиться с ней."
      - "Какова вторая просьба?"
  - char: "commander"
    side: "left"
    text:
      - "Помоги мне распространить одну новость среди Железной Крови и Северного Парламента."
      - "Это должна быть информация «из неизвестного источника», но при этом звучать правдоподобно, ты понимаешь, о чём я."
  - char: "clemenceau"
    side: "right"
    text:
      - "О? Звучит так, будто ты задумал нечто весьма интересное."
      - "Хе-хе, я согласна. «Компетентность» Трибунала тебя не разочарует."
      - "Излагай свой план, Командир..."
