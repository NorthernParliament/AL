chapter1:
  rows:
  - text:
      - "Когда в окна заглянули лучи заходящего солнца, на невероятно затянувшейся и выматывающей все нервы конференции наконец-то был объявлен перерыв."
      - "Чтобы немного проветрить уставший мозг, я не пошел сразу в банкетный зал, а решил немного побродить по зданию."
      - "Сам того не замечая, я вышел на открытую террасу возле комнаты отдыха, откуда открывался прекрасный вид."
  - char: "memphis"
    side: "left"
    text:
      - "Замок Ирис в лучах заката выглядит так же прекрасно, как на живописной картине."
      - "Ты отлично потрудился на сегодняшней конференции, Командир."
  - char: "commander"
    side: "right"
    text:
      - "Ты тоже отлично потрудилась, проведя со мной весь день в этом зале."
  - char: "memphis"
    side: "left"
    text:
      - "Ха-ха..."
  - text:
      - "Мемфис сухо рассмеялась и указала на бейджик с надписью «Секретарь» на своей груди."
  - char: "memphis"
    side: "left"
    text:
      - "Это всего лишь моя обязанность~"
      - "Держи, это яблоко я только что стащила из вазы с фруктами. Выглядит свежим и сладким, не хочешь немного перекусить перед ужином?"
  - char: "commander"
    side: "right"
    text:
      - "блоко?.. Думаю, сейчас мне куда больше пригодился бы бодрящий лимон."
  - char: "memphis"
    side: "left"
    text:
      - "Аха-ха... Это и правда был крайне утомительный день."
      - "Представители всех фракций без умолку болтали целый день, но при этом казалось, что они вообще друг друга не слышат. Просто голова кругом."
  - char: "commander"
    side: "right"
    text:
      - "Да уж... А ведь изначально я остался здесь только ради того, чтобы согласовать вопрос возвращения Ортодоксии Ирис в Лазурный путь."
      - "Кто же знал, что этот с виду простой вопрос в итоге обернется такой морокой..."
  - char: "memphis"
    side: "left"
    text:
      - "В конце концов, Багровая Ось не стала бы просто сидеть сложа руки."
      - "Поэтому вопрос незаметно перерос из «вернется ли Ирис в Лазурный путь» в «стоит ли объединиться Лазурному пути и Багровой Оси»."
  - char: "commander"
    side: "right"
    text:
      - "...«Объединение альянсов». Если подумать, возможно, это и было тем самым «основным блюдом», о котором верховное командование изначально умолчало."
      - "После того как замысел Сирен и их попытки использовать «реконструкции» для стравливания фракций между собой стали достоянием общественности, вопрос о том, стоит ли нам продолжать вражду на радость Сиренам, наконец-то можно было открыто вынести на повестку."
      - "Эта конференция была созвана по инициативе Империи Сардиния и организована совместно с Ортодоксией Ирис, да и гости на ней присутствовали весьма влиятельные."
      - "Очевидно, что по крайней мере эти две фракции были едины в своём стремлении продвинуть идею объединения."
  - char: "memphis"
    side: "left"
    text:
      - "Но даже при этом Ирис предпочёл в этот раз спрятаться за спиной Империи Сардиния..."
      - "Что же касается позиций остальных фракций... Эх."
      - "Со стороны Лазурного пути, за исключением Союза Орла, который открыто выразил поддержку объединению, позиции Королевского Флота и Северного Парламента несколько... неоднозначны."
      - "Империя Дракона, как всегда, придерживается принципа уважения мнений всех сторон и поддерживает мирное урегулирование путём переговоров..."
      - "Со стороны Багровой Оси, Империя Сакуры чётко выразила своё несогласие, тогда как Империя Сардиния, напротив, открыто выступила «за»."
      - "Идеальной гармонией тут и не пахнет, скорее уж полным расхождением взглядов."
      - "Железная Кровь, выступающая в качестве лидера, также занимает двойственную позицию... отказываясь дать чёткий ответ."
      - "Ох... Если все фракции продолжат так тянуть одеяло на себя, когда же всё это закончится."
  - char: "commander"
    side: "right"
    text:
      - "Такое чувство, будто мы вернулись во времена перед решающей битвой крупномасштабной операции в Северной Атлантике."
  - char: "memphis"
    side: "left"
    text:
      - "Хе-хе, это уж точно."
      - "Тогда мы тоже в мгновение ока погрязли в бесконечных заседаниях..."
  - char: "commander"
    side: "right"
    text:
      - "Мемфис, а что ты думаешь по поводу объединения альянсов?"
  - char: "memphis"
    side: "left"
    text:
      - "Хм, что я думаю?"
      - "Безусловно, быть едиными и сплочёнными намного лучше."
      - "Но это единство и сплочённость должны быть реальными, а не просто формальностью."
      - "Альянс «для галочки», напротив, приведёт к тому, что эффект будет «один плюс один меньше двух» из-за неравномерных усилий и того, что фракции будут только мешать друг другу."
      - "А ты, Командир, что думаешь?"
  - char: "commander"
    side: "right"
    text:
      - "Я с тобой согласен."
      - "В принципе, единый альянс, разумеется, был бы предпочтительнее."
      - "Только вот в текущей ситуации, даже если мы договоримся и формально объединимся, насколько это изменит положение дел по факту..."
      - "Одно лишь название без реального единства... Мы просто пойдём по старому пути Лазурного пути."
      - "...Одни лишь разговоры за столом переговоров ни к чему не приведут."
      - "Чтобы выйти из тупика, мы должны сначала найти точку опоры за пределами этого зала..."
  - char: "memphis"
    side: "left"
    text:
      - "Раз так, есть один документ, с которым я хотела бы, чтобы ты ознакомился."
  - text:
      - "На терминал пришёл файл от Мемфис..."
  - char: "commander"
    side: "right"
    text:
      - "...Мм?"
      - "Анализ инцидента с Божьим Царством, а также исследовательский отчёт о текущем состоянии флота Трибунала Ирис?.."
  - char: "memphis"
    side: "left"
    text:
      - "Угу. Разбирая тот инцидент, в который оказалось втянуто всё Средиземное море, я обнаружила кое-какие необычные обстоятельства."
      - "Эти находки, возможно, смогут объяснить, почему Ирис и Сардиния внезапно выступили единым фронтом."
      - "А также... предоставят тебе ту самую внешнюю точку опоры, необходимую для выхода из тупика."
  - char: "commander"
    side: "right"
    text:
      - "...Если правда действительно такова, как ты предполагаешь в отчёте, мне нужно будет выделить время и всё тщательно обдумать."
      - "Уже поздно, давай сначала отправимся на банкет."
  - char: "memphis"
    side: "left"
    text:
      - "Хорошо-хорошо~ Я слышала, что главный козырь, который приготовила Империя Сардиния в этот раз, ждёт нас именно на банкете."
      - "Давай скорее пойдём~!"
