chapter1:
  rows:
  - char: "observer"
    side: "left"
    text:
      - "...Как я и думала, сюда прибыли не только три Арбитра."
      - "Арбитр Императрица III... а она и правда умеет прятаться."
      - "В конце концов, мои терпение и осторожность сыграли на пользу."
      - "Хе-хе-хе... Раз уж ты вступила в игру, то больше не сможешь скрываться в тени."
      - "Раз не могу бросить вызов, то могу просто спрятаться~"
      - "Теперь я наконец-то могу продолжить работу над планом."

chapter2:
  rows:
  - char: "akagi_rad"
    side: "right"
    text:
      - "...Это ты?"
  - char: "observer"
    side: "left"
    text:
      - "Давно не виделись, Акаги~ Как поживаешь? Как сон? Как аппетит?"
  - char: "akagi_rad"
    side: "right"
    text:
      - "...Звонишь посреди ночи, только чтобы подействовать на нервы? Я кладу трубку."
  - char: "observer"
    side: "left"
    text:
      - "Тцк, так не разговаривают с теми, кого просят об одолжении~"
  - char: "akagi_rad"
    side: "right"
    text:
      - "...Просят об одолжении? Ничего, что ты уже давно исчезла?"
      - "Да и если мне не изменяет память, наши отношения строятся на взаимовыгоде."
  - char: "observer"
    side: "left"
    text:
      - "Я ничего не могла поделать с непреодолимыми обстоятельствами."
      - "Что до взаимовыгоды... мне всё равно, кто откроет Сингулярность, лишь бы она открылась. Это вовсе не обязательно должна быть ты."
      - "Но без моей помощи, хватит ли тебе «вычислительных мощностей», чтобы исполнить своё заветное желание?"
  - char: "akagi_rad"
    side: "right"
    text:
      - "..."
  - char: "observer"
    side: "left"
    text:
      - "Ладно, не хмурься~ В последнее время я тоже не сидела сложа руки. Посмотри на это."
  - char: "akagi_rad"
    side: "right"
    text:
      - "...Что это за данные, которые ты прислала?"
  - char: "observer"
    side: "left"
    text:
      - "В терминологии Империи Сакуры это, наверное, называется... «схемой ритуала»?"
      - "Ты хочешь использовать выстроенную мной систему «Священного Древа», чтобы многократно усилить способности Ватацуми, но как ты собираешься сделать это без руководства по эксплуатации?"
      - "Или же ты собиралась положиться на ту игрушку, которую вы с Мусаси соорудили до этого?"
      - "Та штука даже на уровень новичка не тянет, а этот проект я разработала специально для твоей операции~"
      - "Отдаю совершенно бесплатно, не благодари~"
  - char: "akagi_rad"
    side: "right"
    text:
      - "...Тогда я без стеснения приму это."
  - char: "observer"
    side: "left"
    text:
      - "Кстати, ты уже придумала название для плана операции?"
  - char: "akagi_rad"
    side: "right"
    text:
      - "Пока не было времени думать о таких мелочах, а что?"
  - char: "observer"
    side: "left"
    text:
      - "Что скажешь насчёт названия «Ороти»?"
  - char: "akagi_rad"
    side: "right"
    text:
      - "Ороти... Ямата-но Ороти."
      - "Хех... Проект «Ороти», пусть так и называется."
  - char: "observer"
    side: "left"
    text:
      - "И да, не забудь достать Первородный Куб из той игрушки и поместить его в ядро системы. Ты ведь понимаешь, о каком дереве речь?"
  - char: "akagi_rad"
    side: "right"
    text:
      - "Могла бы и не говорить."
      - "...*Шум*... подготовить... *Шум*... расстановку... *Шум*...."
      - "...*Шум*.... выдвигаемся... *Шум*...."
  - char: "communicator"
    side: "right"
    text:
      - "Шшшшшшш...."
  - char: "observer"
    side: "left"
    text:
      - "Эй, Акаги?"
      - "Эй?.."
  - char: "communicator"
    side: "right"
    text:
      - "..."
  - char: "observer"
    side: "left"
    text:
      - "А?"
      - "Проблемы со связью?"
      - "Она ведь использует оборудование, которое я ей дала?.."
      - "У моего оборудования, на моём же испытательном полигоне, вдруг возникли проблемы со связью?"
      - "Это просто немыслимо!.."
