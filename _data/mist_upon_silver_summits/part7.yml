chapter1:
  rows:
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Антарктика... снова Антарктика?"
  - char: "peter_strasser"
    side: "left"
    text:
      - "Да. Хотя Обсервер уже довольно давно залегла на дно."
      - "Однако, благодаря проведённым за последнее время операциям методом исключения, направленным на проверку высокоранговых Сирен в других акваториях..."
      - "...я могу практически с уверенностью заявить, что мейнфрейм Обсервер находится в одной из четырех акваторий: в океане SA, центральной части Тихого океана, Средиземном море или в Южном океане."
      - "Учитывая расчётливость и коварство Обсервер, а также её привычку никогда не вступать в бой лично, безлюдный Южный океан, который при этом соединяется с несколькими другими океанами, несомненно, является для неё наиболее оптимальным выбором."
      - "Именно поэтому я считаю, что вероятность нахождения её мейнфрейма в Южном океане наиболее высока."
      - "...Могу я узнать, что ты имеешь в виду под словом «снова»?"
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "На самом деле, я тоже получила разведывательные данные, связанные с Антарктикой."
      - "Позавчера пришло сообщение от Трибунала. Их разведывательная сеть выяснила, что Северный Парламент и Союз Орла в последнее время, похоже, ведут какую-то игру вокруг Антарктики."
  - char: "peter_strasser"
    side: "left"
    text:
      - "...Неужели они тоже ищут мейнфрейм Обсервер?"
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Боюсь, что нет."
      - "Вчера я связалась с нашей исследовательской станцией и поручила им выяснить, почему Антарктика так сильно заинтересовала Союз Орла и Северный Парламент."
      - "Затем я получила отчёт: исследовательская группа обнаружила в горах несколько аномальных зон таяния льда."
      - "А также извлекла оттуда образцы некоего минерала, который, судя по всему, способен резонировать с оснасткой."
      - "Предварительные исследования показали, что при возникновении резонанса боевая эффективность оснастки заметно повышается."
      - "А после этого связь со станцией прервалась."
  - char: "peter_strasser"
    side: "left"
    text:
      - "Связь со станцией прервалась?.."
      - "Действия Союза Орла и Северного Парламента в Антарктике наверняка как-то связаны с этой находкой."
      - "Но потеря связи с нашей исследовательской станцией... боюсь, это не их рук дело."
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Я тоже так думаю. В данный момент, когда идёт конференция, у них нет ни причин, ни мотивов для подобных действий."
      - "Подобный метод — вбросить «переменную», чтобы посеять раздор между фракциями... напротив, напоминает мне кое-кого."
  - char: "peter_strasser"
    side: "left"
    text:
      - "Обсервер... Понятно. Это дело и правда может быть связано с ней."
      - "Однако... если мейнфрейм Обсервер действительно находится в Южном океане, разве флоты Союза Орла и Северного Парламента не окажутся в опасности?"
  - char: "bismarck_z_rad"
    side: "right"
    text:
      - "Возможно. Немедленно подготовь флот и отправляйся в Антарктику, чтобы выяснить причину потери связи со станцией."
      - "А дальше — действуй по обстоятельствам в зависимости от развития ситуации."
  - char: "peter_strasser"
    side: "left"
    text:
      - "Слушаюсь."
