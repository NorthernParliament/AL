chapter1:
  rows:
  - char: "sovetsky_soyuz_old_rad"
    side: "left"
    text:
      - "Товарищ Память Меркурия, и ты, товарищ Аврора, вы отлично потрудились на этой конференции."
      - "Такой результат неудивителен, не стоит волноваться."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Ход конференции... напоминает вязкое болото."
  - char: "avrora"
    side: "left"
    text:
      - "Империя Сардиния всё-таки слишком наивна, если надеется с помощью дипломатических соглашений склеить расколотый альянс."
      - "Причина раскола Лазурного пути, помимо подстрекательства Сирен... кроется, что куда важнее, в изначально существовавших идеологических разногласиях."
      - "И эта проблема до сих пор не решена."
      - "Даже если такие разные группы объединятся в одну на основе хрупкого договора."
      - "В конечном счете это станет лишь подготовкой ко второму расколу."
      - "...Уж лучше разрушить всё до основания и возродить уже из пепла."
  - char: "sovetsky_soyuz_old_rad"
    side: "right"
    text:
      - "Кхм... На территории Трибунала даже зашифрованные каналы связи не могут гарантировать стопроцентную безопасность, товарищ Аврора..."
  - char: "avrora"
    side: "left"
    text:
      - "Ах..."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Кхм-кхм..."
      - "Н-но я никак не ожидала, что Ирис согласится подыграть Сардинии в этих глупостях, да ещё и сам предоставит место и оплатит половину расходов!"
  - char: "sovetsky_soyuz_old_rad"
    side: "left"
    text:
      - "Угу... Я бы не стала так просто называть это «глупостями»."
      - "После воссоединения Ирис его принадлежность к однму из двух крупных альянсов стала крайне щекотливым вопросом."
      - "И если эту проблему игнорировать, она будет лишь усугубляться."
      - "Выбрав для себя важную роль на этой конференции, Ирис тем самым демонстрирует попытку разрешить данный вопрос."
      - "А вот сам исход этой конференции для них отходит на второй план."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Выходит, Империя Сардиния — единственная сторона, которая искренне верит в то, что эта конференция принесет хоть какую-то пользу."
  - char: "sovetsky_soyuz_old_rad"
    side: "left"
    text:
      - "Ну... Это же Империя Сардиния."
      - "Тем не менее, то, что все крупные фракции проявили к ним уважение, говорит о том, что предыдущая Всемирная выставка прошла не зря."
      - "Только вот вам придётся ещё немного потерпеть и позаниматься этим делом."
      - "Хоть конференция и утомляет, любое дело нужно доводить до конца."
  - char: "avrora"
    side: "right"
    text:
      - "Разумеется, можешь спокойно доверить нам дела здесь, в Ирис."
  - char: "sovetsky_soyuz_old_rad"
    side: "left"
    text:
      - "Кроме того, есть ещё один вопрос, на который вам стоит обратить внимание."
      - "Кронштадт недавно заметила, что в переписке между различными ведомствами Трибунала резко возросла частота упоминаний слова «Антарктика»."
      - "Учитывая, что у Ирис нет научно-исследовательских баз в Антарктике, мы предполагаем, что, возможно, Железная Кровь нашла там что-то и поделилась этой информацией с Трибуналом."
      - "Я уже поручила нашему персоналу, дислоцированному в Антарктике, начать расследование, а вы тоже проследите за действиями Трибунала и Железной Крови."
  - char: "avrora"
    side: "right"
    text:
      - "Направление на Антарктику, значит... Поняла, оставь это нам."
