chapter1:
  rows:
  - char: "libeccio"
    side: "left"
    text:
      - "Ага, столы и стулья в зале полностью расставлены♪"
  - char: "nicoloso_da_recco"
    side: "right"
    text:
      - "Вау... Потрясающе! Предметы на столах расставлены так аккуратно!.."
  - char: "libeccio"
    side: "left"
    text:
      - "Я выверяла всё по линейке!"
  - char: "nicoloso_da_recco"
    side: "right"
    text:
      - "И правда!.. При таком подходе всё действительно выглядит идеально ровно!"
  - char: "libeccio"
    side: "left"
    text:
      - "Хе-хе, мы не можем ударить в грязь лицом, когда речь заходит о гостеприимстве Империи Сардиния."
      - "Впрочем, наша работа на этом не окончена!"
      - "Банкет после собрания пройдёт в банкетном зале~"
      - "Так что его оформление — это тоже крайне важная задача."
  - char: "maestrale"
    side: "right"
    text:
      - "Угу... Это действительно приоритет, здесь нельзя допускать оплошностей."
      - "Особенно что касается ингредиентов... Из-за того, что сроки поджимают, Триесте даже лично возглавила отряд отвечающий за закупки."
      - "Надеюсь, им удастся купить всё необходимое..."
  - char: "nicoloso_da_recco"
    side: "left"
    text:
      - "Кстати, всё это кажется таким странным!"
      - "Эта конференция проводится от имени нашей Империи Сардиния, так почему она проходит в Ортодоксии Ирис?!"
      - "Если бы не это, нам бы не пришлось ломать голову над поиском местных заменителей для наших ингредиентов."
  - char: "libeccio"
    side: "right"
    text:
      - "Действительно странно. Маэстрале, ты ведь много знаешь, тебе известна причина?"
  - char: "maestrale"
    side: "left"
    text:
      - "Эм... Возможно, дипломатические соображения?.. Я не очень в этом разбираюсь..."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Хе-хе, за всем этим и правда стоят довольно сложные причины."
      - "Однако, хотя Ирис и предоставили место проведения, а также взяли на себя половину расходов, конференция проводится исключительно от нашего имени."
      - "Так что, в конечном счете, это далеко не самая плохая сделка."
  - char: "maestrale"
    side: "left"
    text:
      - "Понятно..."
  - char: "nicoloso_da_recco"
    side: "right"
    text:
      - "Ах, леди Венето, ты вернулась!"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Только что закончила со своими делами и решила заодно заглянуть, проверить, как у вас идут дела с подготовкой."
      - "Угу, зал выглядит чистым и опрятным, а выбранные украшения отлично отражают стиль нашей Сардинии. Отличная работа."
  - char: "littorio_rad"
    side: "right"
    text:
      - "Сестра, я со своей стороны всё закончила. Как дела у тебя?"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Триесте недавно прислала сообщение. При поддержке Ирис закупки прошли крайне удачно."
      - "Кажется, за завтрашний банкет можно не волноваться."
      - "И подготовка зала тоже вступила в завершающую стадию."
      - "Уверена, завтра мы сможем устроить для гостей из всех фракций великолепный банкет, пропитанный истинным духом Империи Сардиния."
  - char: "littorio_rad"
    side: "right"
    text:
      - "Отлично, а то я уже была готова перебрасывать ингредиенты по воздуху."
      - "А как продвигается подготовка к твоей завтрашней вступительной речи?"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "В-вступительной речи..."
      - "Точно... После открытия конференции должна прозвучать речь от принимающей стороны..."
      - "Эм... В этом деле, сейчас... ещё остались кое-какие нерешённые моменты."
  - char: "littorio_rad"
    side: "right"
    text:
      - "Аха-ха, звучит немного тревожно..."
      - "...Я сейчас же вернусь, жди меня!"
