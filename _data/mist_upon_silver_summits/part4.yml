chapter1:
  rows:
  - text:
      - "Первое, что предстало перед глазами... ослепительная звёздная река."
  - char: "commander"
    side: "left"
    text:
      - "(…Если мне не изменяет память, я уже лёг спать.)"
      - "(А значит, сейчас я нахожусь в собственном сне.)"
      - "(Или же... моё сознание снова кто-то похитил и перенёс куда-то?..)"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "И первое, и второе~"
      - "Давно не виделись, Командир~"
  - char: "commander"
    side: "left"
    text:
      - "Хелена?!"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Угу, это я."
  - char: "commander"
    side: "left"
    text:
      - "Какое счастье. В прошлый раз ты так быстро ушла, что я даже не успел поблагодарить тебя за всё, что случилось в Средиземном море."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Не стоит благодарности, я сделала лишь то, что должна была."
      - "Но надо же... твоя первая реакция оказалась именно такой."
      - "Я думала, ты удивишься чуть сильнее..."
  - char: "commander"
    side: "left"
    text:
      - "В конце концов, я попадаю в подобную ситуацию далеко не в первый раз..."
      - "К тому же, я верю, что ты не причинишь мне вреда, не так ли?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Угу, я ни за что не причиню тебе вреда."
      - "Давай перейдём к делу."
      - "Сегодня ночью я связалась с тобой таким образом главным образом из соображений безопасности."
      - "В месте, о котором ты не знаешь, но которое находится буквально в двух шагах отсюда, прямо сейчас разворачивается ожесточённое сражение."
      - "Информация об этой битве — не то, о чём тебе сейчас стоит беспокоиться, поэтому я ничего тебе не расскажу."
      - "Однако из-за последствий этого сражения сегодня мне пришлось прибегнуть к такому, более осторожному способу встретиться с тобой."
      - "Режим передачи данных, вызов и исполнение..."
  - text:
      - "Вокруг Хелены вспыхнул синий свет, который в то же мгновение рассыпался на осколки, устремившиеся прямо на меня бурным потоком."
  - char: "commander"
    side: "left"
    text:
      - "Э-это!.."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Это тоже метод передачи информации, выбранный из соображений безопасности."
      - "Не отворачивайся, прими это."
      - "Ты должен об этом узнать."

chapter2:
  rows:
  - text:
      - "Свет устремился прямо на меня..."
      - "А затем в моём сознании из ниоткуда появилась информация."
  - char: "commander"
    side: "left"
    text:
      - "На Южном полюсе обнаружили минерал с уникальными свойствами, который, возможно, поможет преодолеть застой в исследованиях нового поколения оснастки..."
      - "Узнав об этом, командование NY мобилизует флот для проведения специальной операции в Антарктике..."
      - "Операцией напрямую руководит Саратога, кодовое название «Ледяной ангел»... А я об этом даже не знал."
      - "..."

chapter3:
  rows:
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ничего не поделаешь."
      - "Когда дело касается Лексингтон, даже такая хладнокровная девушка, как Саратога, может потерять голову от эмоций."
      - "Что ты об этом думаешь?"
  - char: "commander"
    side: "left"
    text:
      - "Командование NY и главнокомандующий Лазурного пути относятся к разным структурам. Они действительно могут при необходимости мобилизовать подведомственный им флот."
      - "Вот только... во всём этом есть что-то неладное."
      - "Оставим пока в стороне источник информации об этом минерале."
      - "Само то, что это происходит именно в тот момент, когда фракции только-только отбросили предубеждения и попытались воссоздать альянс, совсем не похоже на совпадение."
      - "...Напротив, это очень в духе Сирен — устраивать подобные провокации."
      - "Если операция Союза Орла по монополизации этого ресурса действительно увенчается успехом, а Обсервер затем какими-нибудь путями распространит эту новость, будут посеяны семена нового витка хаоса между фракциями."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я думаю точно так же."
      - "Ты хочешь продвинуть альянс на шаг вперёд, а я хочу подтолкнуть на шаг вперёд тебя."
      - "Я передала тебе информацию, и как бы ты ни решил действовать дальше, я поддержу тебя."
      - "Исход той битвы решит судьбу всего Испытательного полигона Бета, то есть твоего мира."
      - "Поэтому с некоторыми вещами лучше разобраться и принять решение как можно раньше."
  - char: "commander"
    side: "left"
    text:
      - "...Что ты имеешь в виду?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Угадай."
      - "Ну, пока-пока~ Желаю тебе приятных снов в оставшуюся часть ночи~"
