chapter1:
  rows:
  - text:
      - "Старинная армиллярная сфера, дорогой астрономический телескоп, нарисованная на бумаге карта звёздного неба, голографическая проекция созвездий."
      - "Чувство искажения пространства и времени накатывает в тот самый миг, когда открываешь дверь."
      - "Словно входишь в классический музей, но его куратор почему-то обожает современный стиль."
  - char: "yat_sen"
    side: "left"
    text:
      - "Обстановка здесь, как всегда, весьма необычная."
  - char: "huan_chang"
    side: "right"
    text:
      - "Спасибо за комплимент, угощайся чаем. О чём ты хотела спросить сегодня?"
  - char: "yat_sen"
    side: "left"
    text:
      - "Хуань Чан, что ты думаешь о недавних событиях?"
  - char: "huan_chang"
    side: "right"
    text:
      - "«Событиях» — ты о чём?"
  - char: "yat_sen"
    side: "left"
    text:
      - "О том, что происходит в мире."
  - char: "huan_chang"
    side: "right"
    text:
      - "Хм... Завтра будет ясно, солнечно и безветренно."
      - "Отличная погода для прогулок и сушки одеял."
  - char: "yat_sen"
    side: "left"
    text:
      - "Хе-хе, это и впрямь полезная информация."
      - "Ты уже столько дней торчишь в обсерватории и не бывала дома. Может, завтра мне заодно просушить и твоё одеяло?"
  - char: "huan_chang"
    side: "right"
    text:
      - "Ничего страшного... В ближайшее время я всё равно не собираюсь возвращаться. Посушишь сейчас, а потом придётся сушить снова."
      - "Ладно, шутки в сторону... Вот собранная сводка солнечной активности за последние полгода."
      - "Держи."
  - text:
      - "Хуань Чан достала из-под чертежей с гексаграммами блокнот, полностью исписанный данными."
  - char: "yat_sen"
    side: "left"
    text:
      - "Угу... Судя по всему, за последние полгода солнечная активность становится всё более интенсивной."
      - "И великий шторм тоже начал ослабевать полгода назад... Как думаешь, между двумя этими событиями есть связь?"
  - char: "huan_chang"
    side: "right"
    text:
      - "Пока нельзя утверждать наверняка. Однако возросшая солнечная активность действительно помогла мне в анализе великого шторма."
      - "Скоро мы сможем вырваться из оков этого шторма."
  - char: "yat_sen"
    side: "left"
    text:
      - "Наконец-то мы сможем воспользоваться нашими морскими путями..."
  - char: "huan_chang"
    side: "right"
    text:
      - "Это верно. Чэнь Хай и остальным было совсем не просто добраться до Всемирной выставки."
  - char: "yat_sen"
    side: "left"
    text:
      - ": Кстати об этом, что ты думаешь о недавних «самовольных действиях» Чэнь Хай?"
  - char: "huan_chang"
    side: "right"
    text:
      - "То же, что и ты."
  - char: "yat_sen"
    side: "left"
    text:
      - "Я ведь ещё ничего не сказала."
  - char: "huan_chang"
    side: "right"
    text:
      - "Но я знаю."
      - "«Несчастье — это опора счастья, а счастье — это укрытие несчастья. Кто знает, где их предел?»"
      - "Разве не так?"
  - char: "yat_sen"
    side: "left"
    text:
      - "Именно так."
  - text:
      - "Ят Сен встала, взяла блокнот и приготовилась уйти."
  - char: "huan_chang"
    side: "right"
    text:
      - "Уже уходишь?"
  - char: "yat_sen"
    side: "left"
    text:
      - "Угу, впереди ещё одна встреча, с которой нужно разобраться. Есть что-то ещё?"
  - char: "huan_chang"
    side: "right"
    text:
      - "Прошлой ночью я составила гексаграмму. Хочешь послушать?"
  - char: "yat_sen"
    side: "left"
    text:
      - "И что показало гадание?"
  - char: "huan_chang"
    side: "right"
    text:
      - "«Лазурный дракон заточён в громе и огне, Киноварная птица падает с девяти небес»."
  - char: "yat_sen"
    side: "left"
    text:
      - "...Я поняла. Как только закончится собрание, я сделаю соответствующие приготовления."
  - char: "huan_chang"
    side: "right"
    text:
      - "Прости за хлопоты, провожать не буду..."

chapter2:
  rows:
  - char: "trento"
    side: "left"
    text:
      - "Епископ Клемансо, в сновидениях произошли изменения."
  - char: "clemenceau"
    side: "right"
    text:
      - "И что же тебе приснилось?"
  - char: "trento"
    side: "left"
    text:
      - "«Над ледниками поёт костяная раковина»."
  - char: "clemenceau"
    side: "right"
    text:
      - "Командир оказался прав в своей осторожности, она и вправду ещё не сдалась..."
      - "В Антарктике действительно творится нечто странное. Остаётся лишь надеяться, что те фракции, которые решили ввязаться в это дело, смогут выстоять."
  - char: "trento"
    side: "left"
    text:
      - "Что же нам делать?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Сделаем то, что в наших силах, а затем — будем спокойно ждать исхода."
