chapter1:
  rows:
  - text:
      - "Благодаря помощи Обсервер, глобальная связь стала стабильнее, чем когда-либо."
      - "С момента появления Сингулярности Нарака, Сингулярность в Северной Атлантике также увеличила свою активность."
      - "Пока флот Энтерпрайз разбирался с Наракой в Тихом океане, Нью-Джерси и фракциям Европы оставалось лишь обороняться от нее."

chapter2:
  rows:
  - char: "richelieu"
    side: "left"
    text:
      - "Жанна и Алжири, вы двое поведете флот Ортодоксии для поддержки операций в центральной части Северной Атлантики."
      - "Нью-Джерси командует тамошними силами. Вы будете работать с ней, чтобы подавить Сингулярность и выиграть время для миссии Командира."
  - char: "jeanne_d_arc"
    side: "right"
    text:
      - "Поняла, Кардинал. Мы выдвинемся, как только флот будет собран."
  - char: "algerie"
    side: "left"
    text:
      - "Настало время показать миру мощь Святых Рыцарей объединенного Ириса."
  - char: "richelieu"
    side: "right"
    text:
      - "Остальная часть флота догонит вас уже на поле боя. Как только вы и другие доступные в данный момент силы будете готовы, немедленно отправляйтесь."
      - "Сегодня время имеет решающее значение."
      - "Позже Жан Бар приведет к вам не готовую на данный момент часть флота."
  - char: "jeanne_d_arc"
    side: "left"
    text:
      - "Слушаемся!"
  - char: "algerie"
    side: "right"
    text:
      - "Слушаемся!"

chapter3:
  rows:
  - char: "bismarck_z"
    side: "left"
    text:
      - "Тирпиц. Флоты метрополии Железной Крови и Северного моря должны сражаться в Северной Атлантике."
      - "Выиграйте для Командира столько времени, сколько вообще возможно."
  - char: "tirpitz_rad"
    side: "right"
    text:
      - "Я тебя не разочарую."

chapter4:
  rows:
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Соберите Средиземноморский флот, А ТАКЖЕ флоты, дислоцированные в Таранто, Александрии, Венеции и близлежащих портах!"
      - "И столичный флот, наши серийные корабли... о, и наши военно-воздушные силы тоже!"
      - "Флот Ортодоксии отправляется. Я запрошу разрешение на использование их открытых доков для обслуживания и наших кораблей."
      - "Литторио, Сардиния присоединится к этой славной битве, чтобы во всей красе продемонстрировать свою мощь!"
      - "Тайный кукловод за кулисами может страшиться нашего великолепия, но сегодняшняя история не только о нас."
      - "Мы должны доказать Командиру и всему миру, что мы являемся крупной державой на мировой арене!"
  - char: "littorio_rad"
    side: "right"
    text:
      - "Услышала тебя,  Венето! Пришло наше время поразить как друзей, так и врагов!"

chapter5:
  rows:
  - char: "clemenceau"
    side: "left"
    text:
      - "Ирис, Союз Орла, Железная Кровь, Сардиния и даже Пепел... Ох, а вот Королевский Флот еще не предпринял никаких действий."
      - "Киров утверждает, что все Сингулярности могут выйти из-под контроля, однако Врата Авалона, похоже, пока что стабильны."
      - "Похоже, Её Величество извлекла уроки из прошлых ошибок. Хи-хи."
      - "И всё же, так жаль видеть, что они остались в стороне..."
      - "Королевский Флот, сакуранский флот Синано... Мне бы хотелось увидеть вас должным образом мобилизованными ради Командира."
