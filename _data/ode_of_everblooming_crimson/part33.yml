chapter1:
  rows:
  - text:
      - "Изысканный сад парил посреди огромного, бескрайнего пространства."
  - char: "arizona_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Приступить к выполнению Запасного плана F."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Почему? Случилось что-то плохое?"
  - char: "arizona_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Оборонительная линия в Тихом океане вот-вот рухнет. Командир решил закрыть Сингулярность Нарака."
      - "Иными словами, нужен другой путь к отступлению."
  - char: "vestal_meta"
    side: "left"
    status: "is-purple"
    text:
      - "...Нам следует воспользоваться постоянной сингулярностью в океане NA?"
  - char: "arizona_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Да. Хелена уже прислала мне маршрут. Мы должны немедленно начать приготовления."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Они, должно быть, спятили, раз пытаются пойти в обход через Нараку!"
      - "Никогда не знаешь, где окажешься, пытаясь пройти через подобное место! У нас нет ни секунды на промедление!"
  - char: "yorktown_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Погодите. Я тоже пойду."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "...Погоди, Йорктаун? Я думала, тебе всё ещё не разрешено встречаться с Командиром."
  - char: "yorktown_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Я буду... просто наблюдать издалека."
      - "Даже Хелена не в силах рассчитать полную степень опасностей Нараки."
      - "...Я должна идти."
      - "Дождись меня, Командир."
