chapter1:
  rows:
  - text:
      - "Её сознание, казалось, всё глубже погружалось в мрачную пелену."
  - char: "amagi"
    side: "left"
    text:
      - "Снова это чувство."
      - "Последние несколько дней мне постоянно снится один и тот же сон... Может, я просто накручиваю себя?"
  - text:
      - "Амаги позволила своим мыслям блуждать и растворяться в пустом пространстве, пытаясь отыскать хоть какую-то полезную информацию."
  - char: "amagi"
    side: "left"
    text:
      - "Как и прежде, ничего... Хм? Стоп..."
  - text:
      - "<img src='../../img/bg/r/4.png' class='inline-img' alt=''>"
  - text:
      - "Когда она сосредоточилась на новом ощущении, что-то упало ей в руку словно из ниоткуда."
  - char: "amagi"
    side: "left"
    text:
      - "Это... амулет магатама?"

chapter2:
  rows:
  - text:
      - "Она увидела мир, объятый пламенем."
      - "Две знакомые фигуры постепенно поглощал огонь прямо у неё на глазах."
  - char: "amagi_rad"
    side: "left"
    text:
      - "Что это?.."
  - char: "akagi"
    side: "right"
    text:
      - "Кхе... кхе..."
      - "Я не могу..."
      - "Принять такой конец..."
      - "Никогда... Ни за что!"
      - "Амаги..."
  - char: "observer"
    side: "left"
    status: "is-red"
    text:
      - "Появление Командира привело к тому, что результаты сильно разошлись с симуляциями."
      - "Но я возлагала на это такие большие надежды, что готова допустить подобный уровень отклонений."
      - "Я просто верну всё в нужное русло, стерев вас двоих прямо здесь."
  - char: "amagi_rad"
    side: "right"
    text:
      - "Стерев?.. Я тебе не позволю!"
  - char: "observer"
    side: "left"
    status: "is-red"
    text:
      - "Акаги... светится? Что это за амулет?"

chapter3:
  rows:
  - char: "observer"
    side: "right"
    status: "is-red"
    text:
      - "Погоди, эта сила... это то, о чем я думаю?!"

chapter4:
  rows:
  - text:
      - "Под увядшим деревом сакуры стояли две знакомые фигуры."
  - char: "akagi_m"
    side: "left"
    status: "is-meta"
    text:
      - "Я так близка... Так близка... Я почти чувствую тебя!"
      - "Но почему? Почему, почему последний шаг так..."
  - char: "amagi_rad"
    side: "right"
    text:
      - "Это... ритуал?"
  - char: "akagi_m"
    side: "left"
    status: "is-meta"
    text:
      - "Кага... Ты знаешь её так же хорошо, как и я. Вот почему мы — идеальный обмен на последний фрагмент её души..."
      - "Ты должна понять. Как только всё закончится, Амаги вернется к нам."
      - "Поэтому..."
      - "Просто пойдем со мной, хорошо?"
  - char: "kaga"
    side: "right"
    text:
      - "...Хорошо."
      - "Пойдем, Акаги. К последней стадии этого ритуала."
      - "«Из Нараки в преисподнюю»."
  - text:
      - "Мертвая ветвь, до этого выглядевшая безобидно, внезапно метнулась к девушкам из их слепой зоны."
  - char: "amagi_rad"
    side: "left"
    text:
      - "Акаги, Кага! Берегитесь!"

chapter5:
  rows:
  - char: "amagi"
    side: "left"
    text:
      - "Ха-а... ха-а..."
  - text:
      - "Проснувшись, она снова увидела всё тот же потолок спальни."
  - char: "amagi"
    side: "left"
    text:
      - "Сон?.."
      - "Нет, это было слишком реально. Слишком реально для простого кошмара..."
      - "Должно быть, это... предзнаменование."
      - "Акаги..."
      - "Жизнь и смерть невозможно избавить от оков судьбы."
      - "Моя болезнь проистекает из изъянов в моем корпусе... Я уже приняла свою судьбу."
      - "Действительно приняла, но..."
  - text:
      - "*тук тук*"
  - char: "jintsuu"
    side: "right"
    text:
      - "Амаги, к тебе гостья."
  - char: "amagi"
    side: "left"
    text:
      - "Прямо сейчас? Интересно, Кага пришла за очередной партией в шахматы?"
  - char: "jintsuu"
    side: "right"
    text:
      - "На самом деле, именно за этим."
  - char: "amagi"
    side: "left"
    text:
      - "Хи-хи. Хорошо. Мне нужно сначала привести себя в порядок, так что займи её пока чем-нибудь, пожалуйста."
  - char: "jintsuu"
    side: "right"
    text:
      - "Поняла."
  - char: "amagi"
    side: "left"
    text:
      - "......"
      - "Тот амулет... Хм."
