chapter1:
  rows:
  - text:
      - "Когда я снова открываю глаза и возвращаюсь в реальность, то вижу над собой потолок своего командного корабля и обеспокоенную Мемфис рядом."
  - char: "memphis"
    side: "left"
    text:
      - "Ты закончил разговор с Хеленой?"
  - text:
      - "Чтобы избежать непредвиденных ситуаций, я заранее предупредил Мемфис, что в какой-то момент буду связываться с Хеленой МЕТА."
      - "Разумеется, некоторые детали я опустил — например, встречу с Обсервер и то, что мы заручились ее помощью в решении проблемы с Сингулярностью."
  - char: "commander"
    side: "left"
    text:
      - "Да. Теперь я хорошо понимаю, насколько опасна Нарака, и у меня есть идея, как с ней справиться."
      - "Мы столкнулись с куда большей угрозой, чем я предполагал изначально."
  - char: "memphis"
    side: "right"
    text:
      - "Все еще хуже, чем мы думали? ТБ назвала это «катастрофическим» явлением, которое «опаснее Сингулярности в Северной Атлантике». Настолько все плохо?"
  - char: "commander"
    side: "left"
    text:
      - "Именно так."
      - "Мне нужно будет отдать ряд распоряжений, но у меня не будет времени подробно всё объяснять."
      - "Но я надеюсь, что ты — и все остальные — поверите мне на слово: это наш лучший шанс на успех."
  - char: "memphis"
    side: "right"
    text:
      - "Конечно. В наших рядах нет никого, кто стал бы сомневаться в твоих приказах."
  - char: "commander"
    side: "left"
    text:
      - "У тебя готова ручка?"
  - char: "memphis"
    side: "right"
    text:
      - "Ага!"
  - char: "commander"
    side: "left"
    text:
      - "Первое — прекратить анализ Зеркального Моря Тестер и сосредоточить вычислительные мощности Моря Звезд и Небесной Башни на анализе Нараки."
      - "Второе — всем подразделениям вокруг Зеркального Моря Тестер направиться к точке сбора, координаты которой я передам. Там они будут готовиться к боевой операции против Нараки."
      - "Третье..."

chapter2:
  rows:
  - text:
      - "Вскоре после этого флот завершает отступление с территории вокруг мейнфрейма Тестер."
      - "Однако относительное затишье длится недолго. Из ниоткуда воздух внезапно разрывает оглушительный грохот."
      - "На поверхности океана возникает сооружение из темного металла, окруженное городом из светящихся зданий — башня, в которой находится мейнфрейм Тестер, вновь материализуется в реальном мире."
      - "На мгновение мейнфрейм и сияющий город безмятежно замирают над поверхностью воды."
      - "Но затем..."

chapter3:
  rows:
  - text:
      - "В мгновение ока «несокрушимая» башня поглощается всепожирающим взрывом."
      - "Всего день назад Тихий океан был крепко зажат в её хватке. Теперь же источник её существования навсегда исчез из этого мира."
