chapter1:
  rows:
  - text:
      - "После того как группа Командира ушла, Тихоокеанский флот начал свою собственную битву."
  - char: "enterprise"
    side: "left"
    text:
      - "Ибуки, насколько восстановился сакуранский флот?"
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Флот наших серийных кораблей... честно говоря, совсем не готов. Даже по самым оптимистичным оценкам, боеспособность наших девушек-кораблей составляет 50%, и это включая тех, кто едва может сражаться."
  - char: "enterprise"
    side: "left"
    text:
      - "Командир не шутил. Я развернула несколько плавучих доков в тылу — можете свободно ими пользоваться."
      - "Подлечите и отремонтируйте раненых. Используйте все необходимые припасы."
      - "Переформируйте свой флот, и я снова свяжусь с вами. Главное, чтобы вы восстановились настолько, чтобы позже поддержать нас."
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Моя искренняя благодарность. Я немедленно сообщу остальным о плавучих доках."
      - "Тоса и Хосё сейчас переформировывают флот, так что об этом можете не беспокоиться."
      - "Но вот еще что... Может ли сакуранский флот по-прежнему отвечать за прокладку пути от разлома к ядру ритуала?"
      - "Мы знаем ситуацию на родине и то, какие враги впереди, лучше, чем кто-либо другой."
  - char: "enterprise"
    side: "left"
    text:
      - "Правда? Вы только что выбрались из опасности и собираетесь лезть обратно?"
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Дело не в этом. Это представляет экзистенциальную угрозу для нашего народа, и мы желаем избавиться от неё."
  - char: "enterprise"
    side: "left"
    text:
      - "Хорошо. Сакуранский флот может возглавить авангард, но на всякий случай я отправляю с вами флот который в лучшем состоянии."
      - "Не то чтобы мы вам не доверяем — просто на случай, если всё пойдет по худшему сценарию."
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Поняла. Спасибо за вашу заботу."
  - char: "enterprise"
    side: "left"
    text:
      - "Хорнет, могу я поручить тебе сопровождать сакуранский флот?"
  - char: "hornet_ii"
    side: "right"
    text:
      - "Кончено! Какая ещё может быть лучшая возможность испытать оснастку II типа, которую я получила от Командира?"
  - char: "enterprise"
    side: "left"
    text:
      - "Только не зазнавайся. Ты и сакуранский флот — ключ ко всей этой миссии."
  - char: "hornet_ii"
    side: "right"
    text:
      - "Без проблем, без проблем. Ты тоже будь осторожна, Энти!"
  - char: "kirov_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я тоже пойду. Мы не можем оставить места для ошибок, тем более когда против нас Сингулярность."
  - char: "enterprise"
    side: "right"
    text:
      - "Спасибо, Киров."
      - "Наш флот здесь, плюс девочки, проходящие ремонт и лечение, займутся разломом."
      - "Остальные из нас займут позиции вокруг Сингулярности согласно планам Командира."
      - "Союз — на севере, Харбин — на западе, Банкер Хилл — на востоке, а Питтсбург — на юге. Вы знаете свои позиции, так что выдвигайтесь."
      - "Сингулярность со временем будет только усиливаться, что означает вероятность появления новых разломов. Каждому флоту нужно сражаться осмотрительно — никогда не знаешь, в какой момент можешь оказаться в затяжном бою."
      - "Ситуация тяжелая, но подкрепление уже в пути."
      - "Военно-морская база Сан-Диего, военно-морская база Нью-Йорка и другие гарнизоны присылают своих лучших бойцов. Северный Парламент тоже вносит свой вклад."
      - "Мы будем крепко держать оборону здесь, пока Командир не выполнит свою работу!"
      - "Как бы ни было трудно, как бы долго ни длился бой, в конце концов мы вырвем победу!"
  - char: "all"
    side: "left"
    text:
      - "Есть!"

chapter2:
  rows:
  - char: "zuihou"
    side: "left"
    text:
      - "Майя, возьми этот номерок и иди отдыхать! Твоя очередь на ремонт подойдет совсем скоро!"
  - char: "maya"
    side: "right"
    text:
      - "Спасибо."
  - char: "zuihou"
    side: "left"
    text:
      - "Без проблем! Ой! Судзунами, ты тоже ранена?"
  - char: "suzunami"
    side: "right"
    text:
      - "Всего лишь мелкая царапина. Что мне действительно нужно, так это пополнение боезапаса, если можно."
  - char: "zuihou"
    side: "left"
    text:
      - "Запиши своё имя здесь и иди туда, тебя пополнят в кратчайшие сроки!"
  - char: "suzunami"
    side: "right"
    text:
      - "Фух... Спасибо, Дзуйхо!"
  - char: "vestal"
    side: "left"
    text:
      - "Впечатляет, Дзуйхо... Ещё пару минут назад здесь был полнейший бардак, но ты всё быстро организовала."
  - char: "zuihou"
    side: "right"
    text:
      - "Чирик~♪ Мне было легко, так как толпа поредела."
      - "Ты закончила со своими, Вестал?"
  - char: "vestal"
    side: "left"
    text:
      - "Ну, у меня были кое-какие дела в доке 5... Я просто решила проверить, как тут дела, на обратном пути."
      - "Здесь тоже было много раненых девочек, верно?.."
  - char: "zuihou"
    side: "right"
    text:
      - "Да... Были. Но я отправила их в пятый док, как ты и просила."
      - "Иди помоги им за нас, Вестал!"
  - char: "vestal"
    side: "left"
    text:
      - "Не волнуйся. Я позабочусь о них♪"
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "vestal"
    side: "left"
    text:
      - "О? Алло, это Вестал."
      - "Дзуйхо? Она прямо рядом со мной, здесь, в доке 3... Хм? Хорошо, поняла."
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "zuihou"
    side: "left"
    text:
      - "Вестал? Что происходит?"
  - char: "vestal"
    side: "right"
    text:
      - "Ничего серьезного. Сакуране искали тебя, поэтому я просто сказала им, где ты находишься."
  - char: "hatakaze"
    side: "left"
    text:
      - "Дзуйхо! Ты здесь? Идзумо ищет тебя!"
  - char: "ayase"
    side: "right"
    text:
      - "И-извините нас..."
  - char: "zuihou"
    side: "left"
    text:
      - "О! Хатакадзэ, Аясэ! Прости, Вестал, ничего, если я сейчас пойду?"
  - char: "vestal"
    side: "right"
    text:
      - "Иди. Управление доком — это моя работа, так что я просто рада, что ты облегчила мне задачу."

chapter3:
  rows:
  - text:
      - "Дзуйхо спрыгнула с дока 3 и подбежала к своим товарищам. Однако по пути она заметила слабый блеск в глазах Хатакадзэ."
  - char: "zuihou"
    side: "left"
    text:
      - "Хатакадзэ? Что это было?"
  - char: "hatakaze"
    side: "right"
    text:
      - "Что было?"
  - char: "zuihou"
    side: "left"
    text:
      - "Эм... Ничего! Наверное, мне просто показалось!"
      - "Лучше не заставлять Идзумо ждать. Пойдем!"
