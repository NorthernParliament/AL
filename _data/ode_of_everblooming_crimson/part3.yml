chapter1:
  rows:
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "commander"
    side: "left"
    text:
      - "Надо ответить..."
  - char: "soobrazitelny_rad"
    side: "right"
    text:
      - "О! Наконец-то пробилась!"
      - "Товарищ Командир! Как слышно?"
  - char: "commander"
    side: "left"
    text:
      - "Слышу отлично, госпожа гениальный механик. Ты ведь рядом с Зимней Короной, верно?"
  - char: "soobrazitelny_rad"
    side: "right"
    text:
      - "Точно! Я следила за Короной с тех пор, как там начали происходить эти странные явления!"
      - "Я хотела связаться с тобой раньше, но в этом районе были сильные помехи."
      - "В любом случае, помехи только что исчезли, поэтому я сразу же вышла на связь!"
  - char: "commander"
    side: "left"
    text:
      - "Помехи? Если за этим стояли Сирены, то беспокоиться не о чем."
  - char: "soobrazitelny_rad"
    side: "right"
    text:
      - "С чего ты взял? Ты разработал способ сделать их глушилки совершенно бесполезными?"
      - "Впрочем, пока забудь об этом — есть более насущная проблема!"
  - char: "commander"
    side: "left"
    text:
      - "Омиттер уничтожила Зимнюю Корону?"
  - char: "soobrazitelny_rad"
    side: "right"
    text:
      - "Представь себе, да. И..."
  - char: "commander"
    side: "left"
    text:
      - "И её мейнфрейм вдруг появился из ниоткуда и взорвался сам по себе, так?"
  - char: "soobrazitelny_rad"
    side: "right"
    text:
      - "Да! Откуда ты узнал? Ты не мог просто угадать!"
      - "Ты за нами шпионишь, не так ли?"
  - char: "commander"
    side: "left"
    text:
      - "Нет. Ну... Скажем так, мне сообщил один из моих источников."
  - char: "soobrazitelny_rad"
    side: "right"
    text:
      - "А, источник! Ну конечно! У тебя ведь везде есть связи!"
  - char: "commander"
    side: "left"
    text:
      - "(Я всё объясню позже, обещаю...)"
      - "О чём я и хотел сказать — тебе не нужно беспокоиться об Омиттер, как и о любой другой Сирене в Арктике."
      - "Что более срочно, мне нужно, чтобы ты связалась с Россией и сказала ей привести свой флот на помощь с Сингулярностью Нарака!"
  - char: "soobrazitelny_rad"
    side: "right"
    text:
      - "Что за Сингулярность Нарака?"
  - char: "commander"
    side: "left"
    text:
      - "Нет времени объяснять! Я пришлю сводку по заданию позже!"
  - char: "soobrazitelny_rad"
    side: "right"
    text:
      - "Вас поняла, вас поняла!"

chapter2:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "(Уже два мейнфрейма уничтожены. Обсервер и правда работает быстро.)"
      - "(Обещание новой жизни, должно быть, действительно побудило её к действию.)"
