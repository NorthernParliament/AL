chapter1:
  rows:
  - char: "tower"
    side: "left"
    text:
      - "...Спать хочется. Наконец-то всё позади."
      - "Идеальный, счастливый финал... Поистине пресно. Вот каков уровень работы, когда режиссирую не я."
      - "Но, не будь Командира..."

chapter2:
  rows:
  - char: "tower"
    side: "left"
    text:
      - "Для Микасы и Мусаси нет запасного плана. Флот Империи Сакуры, не имея возможности вырваться из Сингулярности, полностью уничтожен."

chapter3:
  rows:
  - char: "tower"
    side: "left"
    text:
      - "Даже если Ямато удастся извлечь данные и отправить их в мир сновидений, если Синано не пробудится, их товарищи будут вечно блуждать как души в темноте."

chapter4:
  rows:
  - char: "tower"
    side: "left"
    text:
      - "Оставшись в одиночестве, Нагато не имеет иного выбора, кроме как обратиться к своим МЕТА-силам, и вскоре её поглощает существо, рожденное из одержимости Сингулярности."

chapter5:
  rows:
  - char: "tower"
    side: "left"
    text:
      - "Амаги не удается воскресить. Флот Империи Сакуры целиком поглощается коррозией, навсегда затерявшись во времени."

chapter6:
  rows:
  - char: "tower"
    side: "left"
    text:
      - "Кага жертвует собой, чтобы вернуть Акаги рассудок, но уже слишком поздно."

chapter7:
  rows:
  - char: "tower"
    side: "left"
    text:
      - "Если позволить коррозии распространиться из Нараки, даже если кому-то удастся спастись, 70% всех кансен погибнут уже в первой волне."

chapter8:
  rows:
  - char: "tower"
    side: "left"
    text:
      - "После этого Акаги собственными глазами наблюдает за разрушением мира."

chapter9:
  rows:
  - char: "tower"
    side: "left"
    text:
      - "Сплетение бесчисленных совпадений, неизбежностей и удачных поворотов судьбы — чудо, сделавшее невозможное возможным."
      - "И всё это ради предотвращения трагичной судьбы, даже если для этого придется пойти наперекор правилам и логике самой вселенной."
      - "Блаженное будущее, о котором мечтают кансен, идеальный мир, где благодать равно нисходит на всех."
      - "Таков счастливый финал, желанный Командиром."

chapter10:
  rows:
  - char: "tower"
    side: "left"
    text:
      - "Похоже, зрители начинают расходиться."
      - "Осталось лишь грызунам подобрать объедки."
      - "Полагаю, мне тоже пора уходить."
