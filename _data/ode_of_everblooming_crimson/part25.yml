chapter1:
  rows:
  - text:
      - "Другой сегмент мира, сгенерированный мейнфреймом Тестер и соединенный с тем, что создала Обсервер."
      - "Здесь текла расколотая река, дороги не имели никакого смысла, а камни были разбросаны как попало. Всё было сломано, разваливалось на части и казалось слепленным воедино без всякой логики и смысла."
      - "Среди всего этого буйно разрослась растительность, виднелись островки с аккуратно выстроенными зданиями, хотя они и встречались крайне редко."
  - char: "kagabb"
    side: "left"
    text:
      - "Какое жуткое место. Акаги правда где-то здесь?"
  - char: "zuikaku"
    side: "right"
    text:
      - "Мой радар ничего не может разобрать..."
  - char: "observer_rad"
    side: "left"
    text:
      - "(Это незавершенный сегмент мира, и большая его часть вряд ли чем-то отличается от территории Нараки. Ваши радары здесь бесполезны.)"
  - char: "commander_rad"
    side: "right"
    text:
      - "(Почему бы тебе не сказать это прямо Дзуйкаку?)"
  - char: "observer_rad"
    side: "left"
    text:
      - "(Потому что ты передашь сообщение за меня. Тебе следует быть благодарным за предупреждение.)"
  - char: "commander_rad"
    side: "right"
    text:
      - "(...Есть новости о том, где Акаги?)"
  - char: "helena_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "(Поторапливайся, Обсервер.)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(Ладно, ладно. Должна сказать, впечатляет, что она проделала всё это с мейнфреймом Тестер за такое короткое время.)"
      - "(Тем не менее, для меня сделать то же самое было бы детской забавой.)"
  - char: "shinano"
    side: "left"
    text:
      - "Я чувствую мириады эмоций повсюду..."
      - "Амаги, как ты себя чувствуешь?"
  - char: "amagi_cv"
    side: "right"
    text:
      - "Я в порядке. Просто еще не привыкла управлять этими самолетами."
  - char: "shinano"
    side: "left"
    text:
      - "Хочешь сказать, что это не дается тебе естественно?"
  - char: "zuikaku"
    side: "right"
    text:
      - "(Эй, это напоминает мне...)"

chapter2:
  rows:
  - char: "akagi"
    side: "left"
    text:
      - "Это лишь догадка, но я вижу в этом явный признак того, что тем девочкам никогда не предназначалось носить эту оснастку."
  - char: "friedrich_der_grosse"
    side: "right"
    text:
      - "Хе-хе. Какая же ты проницательная."
      - "Представление о том, что Куб создает оснастку на основе корпуса конкретного корабля, не совсем верно. Хотя во многих случаях так и происходит, это скорее ориентир, нежели жесткое правило."
      - "Мы узнали это в ходе наших исследований. Всё, что я здесь сделала, — это нашла этому хорошее применение."
      - "Позволь напомнить тебе, Акаги, что наше рондо всё еще продолжается."
      - "Пожалуйста, наберись терпения и досмотри его до конца. Уверяю, ты не будешь разочарована."

chapter3:
  rows:
  - char: "zuikaku"
    side: "left"
    text:
      - "Я вспомнила! Всё в порядке, Амаги."
      - "Я слышала, что оснастка связана с твоим корпусом, так что ты довольно скоро освоишься со сражениями в роли авианосца!"
  - char: "amagi_cv"
    side: "right"
    text:
      - "Вот как? Спасибо, что сказала."
  - char: "ryuuhou"
    side: "left"
    text:
      - "Если хочешь, я могу поделиться знаниями, полученными на тренировках!"
  - char: "zuikaku"
    side: "right"
    text:
      - "У меня тоже есть подобная информация прямо здесь, если хочешь взглянуть!"
  - char: "amagi_cv"
    side: "left"
    text:
      - "Хи-хи. Вы обе слишком добры. Я с радостью выслушаю знания, которыми могут поделиться более опытные авианосцы."
  - char: "zuikaku"
    side: "right"
    text:
      - "Хе-хе. И пока ты ещё учишься, мы можем взять на себя разведку и бой!"
  - char: "ryuuhou"
    side: "left"
    text:
      - "Да! Будь уверена, мы защитим Командира и спасем Акаги!"
  - char: "observer"
    side: "right"
    text:
      - "(Нашла её. Вот только... Что ж, вас ждут неприятности.)"
  - char: "commander"
    side: "left"
    text:
      - "(С Акаги? О нет. Я  этого и боялся...)"
  - char: "zuikaku"
    side: "right"
    text:
      - "Самолеты-разведчики, взлет..."
  - char: "commander"
    side: "left"
    text:
      - "Дзуйкаку, стой! Я знаю, где Акаги!"
  - char: "zuikaku"
    side: "right"
    text:
      - "Знаешь? О-ого, хорошо!"
  - char: "observer"
    side: "left"
    text:
      - "(Ну и? Что ты собираешься делать? На данном этапе она по сути превратилась в МЕТА.)"
  - char: "commander"
    side: "right"
    text:
      - "(Это очевидно. Даже если Акаги обратилась, я спасу её.)"
