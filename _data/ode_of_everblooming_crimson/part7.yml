chapter1:
  rows:
  - char: "nagato_rad"
    side: "right"
    text:
      - "Я понимаю твои чувства, Акаги, но твоя безопасность превыше всего."
  - char: "akagi"
    side: "left"
    text:
      - "...Да, госпожа Нагато. Я понимаю."
  - char: "nagato_rad"
    side: "right"
    text:
      - "Не считай, что всё это только твоя вина. Я тоже отчасти виновата, что не остановила тебя. Однако, если сомневаешься, неукоснительно следуй приказам Командира."
  - char: "akagi"
    side: "left"
    text:
      - "...Да, госпожа Нагато. Я понимаю."
  - char: "nagato_rad"
    side: "right"
    text:
      - "Я жду, что ты благополучно вернешь Рюхо и Дзуйкаку домой."
  - char: "akagi"
    side: "left"
    text:
      - "...Да, госпожа Нагато. Я понимаю."
  - char: "nagato_rad"
    side: "right"
    text:
      - "Я... просто беспокоюсь о тебе, вот и всё."
  - char: "akagi"
    side: "left"
    text:
      - "Но это ведь не всё, правда? Ты переживаешь, что во время этой операции жизнь Командира будет в опасности, не так ли?"
  - char: "nagato_rad"
    side: "right"
    text:
      - "...Да."

chapter2:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "Хм? Командир, что за волшебную ободряющую беседу ты только что провел с Акаги?"
      - "Раньше боевой дух был на нуле, а сейчас все выглядят совершенно нормально. Как?"
  - char: "commander"
    side: "right"
    text:
      - "Известие о сегменте мира, вероятно, сыграло главную роль."
  - char: "memphis"
    side: "left"
    text:
      - "И этого оказалось достаточно, чтобы так сильно всё изменить? Не знаю, чему удивляться больше — твоей дальновидности или её стойкости."
      - "Эххх... Возможно, именно такая сила и нужна, чтобы занимать видное положение в Империи Сакуры."
  - char: "commander"
    side: "right"
    text:
      - "Возможно. Может, ты этого еще не понимаешь, но Акаги делает всё, что в её силах."
      - "(У меня такое чувство, что это и есть настоящая Акаги — не обремененная тяжестью своей одержимости.)"

chapter3:
  rows:
  - char: "ryuuhou"
    side: "left"
    text:
      - "Акаги, мы готовы."
  - char: "akagi"
    side: "right"
    text:
      - "Хорошо. Всё идет гладко."
  - char: "zuikaku"
    side: "left"
    text:
      - "Ты уверена, что мне можно пойти с тобой? После того, что я наговорила тебе в барьере..."
  - char: "akagi"
    side: "right"
    text:
      - "Не ожидала такого от кого-то из Пятой дивизии авианосцев. Забудь обо мне — выпадет ли когда-нибудь лучшая возможность помочь Командиру?"
      - "(К тому же... Когда мы наконец встретимся с моей сестрой, мне нужно, чтобы она увидела, на что способно наше чудесное молодое дарование.)"
      - "Кхм... Командир! Мы официально готовы!"

chapter4:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "Она нас торопит, Командир."
  - char: "helena"
    side: "right"
    text:
      - "Не буду жаловаться на её новообретенную энергию, но мне интересно, не перетягивает ли она на себя слишком много внимания..."
  - char: "commander"
    side: "left"
    text:
      - "Ну-ну. Дай ей проверить свои лидерские качества."
      - "(В конце концов, нам нужна её помощь, чтобы выполнить задачу Ямато.)"

chapter5:
  rows:
  - char: "minazuki"
    side: "left"
    text:
      - "«Если я смогу защитить души сакуран, потерянные в ритуальном барьере, а Сингулярность будет уничтожена, тогда их можно будет вернуть... но не все они со мной»."
      - "«Осталась одна»."
      - "«Кага, та, кто стала заменой для Акаги»."
      - "«Её затянуло в Нараку, из-за чего я не могу восстановить её душу»."
      - "«Как и в случае с Амаги, её душу необходимо найти, прежде чем она сможет вернуться»."
      - "«Спаси Амаги, Кагу, Империю Сакуры и сам этот мир...»"
      - "«Я верю, что ты сможешь сотворить такое чудо»."

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Вот так. Только спася всех и вернув всё в норму, я смогу сдержать свое обещание...)"
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "commander"
    side: "left"
    text:
      - "Энтерпрайз. После того, как я войду в Нараку с флотом Нагато, ты будешь руководить операцией в Тихом океане."
      - "Я заранее связался с лидерами других фракций. Они не должны доставить тебе никаких проблем."
      - "Как мы уже обсуждали, твоя задача — проложить путь от разлома в барьере к ядру ритуала и подготовиться к уничтожению Сингулярности снаружи."
      - "Тебе также придется уничтожать и очищать любых врагов, которым удастся вырваться из барьера."
      - "Море Звёзд и Небесная Башня следят за ситуацией на случай появления новых разломов."
      - "Сделай всё, что в твоих силах, чтобы остановить дальнейшее распространение коррозии до моего возвращения!"
  - char: "enterprise_rad"
    side: "right"
    text:
      - "Поняла. Предоставь эту часть мне."
      - "И, Командир... Будь там осторожен."

chapter7:
  rows:
  - text:
      - "Тем временем ударная группа Сингулярности готовилась к бою против фальшивых слияний."
  - char: "shoukaku"
    side: "left"
    text:
      - "Госпожа Нагато, пожалуйста, передумайте. Это слишком опасно."
  - char: "nagato"
    side: "right"
    text:
      - "Моё решение твердо. Это больше не обсуждается."
  - char: "kawakaze"
    side: "left"
    text:
      - "Позвольте хотя бы мне пойти с вами! Пожалуйста!"
  - char: "nagato"
    side: "right"
    text:
      - "Абсолютно исключено. Тебе не хватает совместимости с Ватацуми, поэтому у тебя нет возможности взаимодействовать с ним. Я справлюсь сама."
  - char: "jintsuu_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Будь уверена, я доставлю её в целости и сохранности."
  - char: "kawakaze"
    side: "right"
    text:
      - "Уверена, ты то же самое говорила о Мусаси."
  - char: "jintsuu_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Тогда, как бы нагло это ни звучало, я воспользуюсь этой возможностью, чтобы искупить прошлые ошибки. Когда всё это закончится, я извинюсь перед ней лично."
  - char: "kawakaze"
    side: "right"
    text:
      - "...Я ловлю тебя на слове."
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Моя госпожа, пора. Вы готовы?"
  - char: "nagato"
    side: "right"
    text:
      - "Всегда."
  - char: "shoukaku"
    side: "left"
    text:
      - "Коррозия ведь не причинит необратимого вреда? Очищение всё исправит... верно?"
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Защитные механизмы Куба Мудрости могут в определенной степени выдержать МЕТА-коррозию."
      - "С помощью некоторых корректировок на поверхности корпуса мы можем на короткое время полностью свести на нет эффекты МЕТА-трансформации."
      - "Хотя доверять нам или нет — это уже личный выбор каждой."
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Клянусь именем Фу, что госпожа Нагато вернется в целости и сохранности..."
  - char: "shoukaku"
    side: "right"
    text:
      - "Касуми... Хорошо. Я доверяю тебе."

chapter8:
  rows:
  - text:
      - "Поскольку Ватацуми послужил основой для формирования Сингулярности, нам нужно было взаимодействовать с реликвией, чтобы найти фальшивые слияния."
      - "Однако коррозия внутри Сингулярности настолько сильна, что без защитных мер девушки-корабли внутри потеряют рассудок, как это случилось с Хиё и Дзюнъё."
      - "И наоборот, намеренно подвергнувшись МЕТАморфозу заранее и взяв с собой средство очищения, девушки-корабли смогут войти туда без страха."
      - "К такому выводу мы пришли совместными усилиями с Хеленой."
      - "Таким образом, мы решили, что к миссии Нагато присоединится минимальный флот в составе МЕТА Дзинцу и Касуми."
      - "Касуми должна была ввести Нагато в состояние контролируемого МЕТАморфоза."

chapter9:
  rows:
  - char: "nagato"
    side: "left"
    text:
      - "Давай начнем, Касуми."
  - char: "kasumi_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Поняла, моя госпожа."

chapter10:
  rows:
  - text:
      - "Касуми прижала синее пламя к груди Нагато."
      - "Пламя охватило её, и её сознание погружалось всё глубже и глубже..."

chapter11:
  rows:
  - text:
      - "Огонь вырывается наружу, и из него появляется Нагато, поддерживаемая силой МЕТА."
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Фух... Так сойдет?"
  - char: "kasumi_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Как вы себя чувствуете?"
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Немного кружится голова. Кажется... у меня были зрительные и слуховые галлюцинации..."
  - char: "kasumi_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Хм? Дайте-ка я взгляну..."
      - "Хм..."
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что-то пошло не так?"
  - char: "kasumi_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Нет, не думаю. На самом деле вы справляетесь гораздо лучше, чем я ожидала."
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хорошо."
  - char: "kasumi_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Как и планировалось, сосредоточьтесь на поиске фальшивых слияний, когда мы войдем. Предоставьте сражения нам, чтобы сберечь свои силы."
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Очень хорошо. Отправляемся немедленно."
