chapter1:
  rows:
  - text:
      - "С тех пор как Куин Элизабет отправила Вангард согласно приказам Командира и использовала Камелот для прорыва в Нараку, она всё это время оставалась на подземном уровне."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Хелена МЕТА... Союзница, которая помогла Командиру вернуть Камелот во время предыдущей охоты..."
      - "Та, кому удалось завоевать доверие как Командира, так и даже моей «другой» я."
      - "Но в этой женщине есть что-то опасное."
      - "Правда, что она выполняет приказы Командира... но невозможно сказать, что скрывается за этой её улыбкой."
      - "Боже правый. Какая же сомнительная компания, все до единой..."
  - text:
      - "Прошло еще несколько минут, и её мысли вернулись к Камелоту."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Странно... Почему это занимает так много времени? Они уже должны были вернуться..."

chapter2:
  rows:
  - char: "strange_machine"
    side: "right"
    text:
      - "БИП-БИП-БИП... БУП-БУП-БУП..."
      - "ДЗИНЬ-ДЗИНЬ-ДЗИНЬ... ТУК..."
      - "ЛЯЗГ-ЛЯЗГ-ЛЯЗГ... ПШШШШШ..."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "(Коммуникатор Мисс D?)"
      - "Вангард! Что случилось? Что-то не так?!"
  - char: "vanguard_rad"
    side: "right"
    text:
      - "Никак нет, Ваше Величество! Операция проходит гладко!"
      - "Спасательная операция в Сингулярности Нарака завершена, а Нагато и Хиэй были очищены от МЕТА-коррозии!"
      - "Но возникла небольшая проблема... Похоже, мы не можем вернуться через Врата Авалона..."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Значит ли это, что защитный механизм всё ещё действует?.."
      - "Но со своей стороны я не вижу никаких ошибок в данных, и Камелот всё ещё активен..."
      - "(Если только... не существует какого-то другого фактора помимо Нараки, способного спровоцировать срабатывание защитного механизма?)"
      - "(Нет, это должно быть невозможно... Это просто НЕВОЗМОЖНО.)"
      - "А пока, пожалуйста, укройтесь по координатам, которые я вам сейчас отправлю. Это особое место, которое подготовила для вас моя МЕТА-версия."
      - "Как только я улажу проблему со своей стороны, я снова свяжусь с вами, чтобы вернуть вас домой."
  - char: "vanguard_rad"
    side: "right"
    text:
      - "Вас поняла!"
