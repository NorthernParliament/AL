chapter1:
  rows:
  - text:
      - "Кроваво-красный цвет Нараки становится отчетливо виден на горизонте по мере того, как мой командный корабль подходит всё ближе."
      - "Благодаря Мусаси на её поверхности появилась трещина, достаточно большая, чтобы через неё смогли выбраться несколько сакуранских девушек-кораблей. Они объединились с нашим флотом."
      - "Их отчеты предоставили мне достаточно разведданных, чтобы понять, что происходит внутри."
  - char: "commander"
    side: "left"
    text:
      - "(Акаги пыталась возродить Амаги, но её тоска была искажена неведомой силой и использована для открытия Сингулярности Нарака.)"
      - "(Увидев, насколько далеко распространилась коррозия, Микаса и Мусаси немедленно перешли к запасному плану и отвели людей на Якумояму ради их безопасности.)"
      - "(Однако потери оказались колоссальными. Кага исчезла, треть их девушек-кораблей, включая Микасу и Мусаси, недееспособны, а почти все серийные корабли были уничтожены или поглощены коррозией.)"
      - "(Это мало чем отличается от прогнозируемого худшего сценария... Если бы только я узнал об этом раньше.)"

chapter2:
  rows:
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Действительно, флоты Империи Сакуры понесли катастрофический урон."
      - "Это самая непосредственная угроза, исходящая от Сингулярности Нарака."
      - "К счастью, кто-то в их высших эшелонах сумел предвидеть эту ситуацию."
  - char: "commander"
    side: "left"
    text:
      - "Ты имеешь в виду...?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ямато."
      - "Неудивительно, что Дзинцу МЕТА так высоко о ней отзывалась."
      - "Конечно, Микаса и Мусаси тоже разработали экстренные планы, но она оказалась на шаг впереди даже их."
      - "«На шаг впереди» — это даже мягко сказано. Обладая ограниченными разведданными, она сделала почти всё правильно до и после появления Нараки."
      - "Именно благодаря ей те, кто оказался в ловушке Нараки, смогли спастись."
  - char: "commander"
    side: "left"
    text:
      - "Спастись? В смысле, от коррозии корпуса?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Когда базовый корпус получает слишком много повреждений, данные внутри него рассеиваются, что в конечном итоге приводит к смерти девушки-корабля как вместилища и как «личности»."
      - "Но что, если все эти данные — их чувства и воспоминания — иными словами, их «душу», можно было бы надежно сохранить?"
  - char: "commander"
    side: "left"
    text:
      - "К чему ты клонишь? Что пока сохраняется их индивидуальность, их можно исцелить? Этого не может быть."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Это именно то, чем является «душа». И это то, что Акаги пыталась использовать в своем ритуале."
      - "Союз между концепцией судна и воспоминаниями человека. Используя эту информацию как основу для «души», можно воссоздать сущность, известную как Амаги."
      - "И в этом кроется суть проблемы. Всё, что связано с Наракой, имеет отношение к существованию Амаги."
      - "Так что, пока план идет гладко, всё остальное встанет на свои места."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Затем мы проработали детали плана по устранению Нараки...)"

chapter4:
  rows:
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "В этом плане есть три критически важных элемента, Командир. Ты, Обсервер и Сингулярность Нарака."
      - "Видишь ли, Нарака была создана с помощью силы Первородного Куба, используя Ватацуми в качестве ядра."
      - "Следовательно, она обладает теми же свойствами, что и Ватацуми — теми же свойствами, что и метеорит, упавший на Северный Парламент давным-давно. Она обладает силой сливаться с окружением и превращать сны в реальность."
      - "Мы можем использовать это в наших интересах. Акаги была на верном пути, поэтому мы применим тот же метод, что и она."
      - "Только мы будем использовать куда более сложные и надежные данные, а не поврежденную коррозией душу, с которой ей пришлось работать."
      - "За все годы борьбы с Сиренами, ты уже должен быть знаком с Системой Натуральных Вычислений, верно?"
      - "Это бьющееся сердце плана Магистра и самое важное оборудование Антиоха."
      - "Обсервер Зеро лично контролирует её использование, и никто не знает, где на самом деле находится сама машина."
      - "Однако каждая Обсервер имеет разрешение подключаться к ней. Именно так она получает полный контроль над тестовыми полигонами, за которыми наблюдает."
      - "Когда Обсервер не обращается к системе, она заканчивает так же, как та, что в вашей ветви."
      - "Я отвлекаюсь. Вкратце, мы заново подключим Обсервер к Системе Натуральных Вычислений, чтобы создать сегмент мира, основанный на записях прошлого."
      - "Затем мы спроецируем этот сегмент мира в Нараку."
      - "Это значит, что при входе в Нараку мы сможем шагнуть в этот сегмент мира."
      - "Оттуда, в этом застывшем во времени царстве, мы извлечем информацию, необходимую для восстановления души Амаги."
  - char: "commander"
    side: "left"
    text:
      - "Звучит достаточно просто."
      - "Если это сработает для Амаги, сможем ли мы сделать то же самое для остальных, чьи корпуса подверглись коррозии или были повреждены?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Боюсь, что нет."
      - "Действующие здесь факторы — Нарака, Ватацуми, Первородный Куб, и прежде всего, сильные эмоции Акаги — придают форму тому, что вообще возможно."
      - "Амаги — главная навязчивая идея Акаги. Конечно, можно возразить, что это распространяется и на других людей, которые ей небезразличны."
      - "Но в конечном итоге это не то, что можно сделать для каждого."
      - "Более того, именно ты лично должен восстановить её данные и провести флот через то, что находится внутри."
      - "И последнее, но не менее важное: если ты не разберешься с Наракой, притянутая ею коррозия просочится сквозь Первозданный Барьер и в конечном итоге поглотит всю твою ветвь."
      - "Пока ты будешь внутри восстанавливать данные, тем, кто снаружи Сингулярности, придется охранять бреши, чтобы предотвратить распространение коррозии. Даже если это будет стоить им жизней."
      - "Кроме того, тебе также нужно будет повести отдельный флот в Нараку, чтобы победить искаженные слияния Амаги, рожденные внутри Сингулярности, и «освободить» её концепцию раз и навсегда."
      - "Имей в виду, что Акаги уже успешно отменила смерть Амаги в этой ветви. Стереть из памяти людей воспоминания о самозванке больше невозможно."
      - "Чтобы истинная Амаги вернулась, тебе придется уничтожить эту концепцию целиком и полностью."
      - "...Нам повезло, что Акаги питает к тебе слабость."
      - "Если бы тебя здесь не было, шансы вашей ветви выглядели бы не так оптимистично."
      - "Кхм... Я соберу флот, чтобы помочь тебе справиться со слияниями. А тем временем собери команду, которую планируешь взять с собой в Нараку."

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Сдержать коррозию, уничтожить фальшивые версии Амаги и восстановить данные корпуса настоящей Амаги. Такова операция, которую мы разработали.)"
      - "(Тот факт, что мы будем использовать мощь Системы Натуральных Вычислений для входа в наложенный сегмент мира, все еще кажется почти немыслимым...)"
      - "(А еще моя роль во всем этом. Как именно я должен собрать эти данные корпуса и восстановить концепцию истинной Амаги?)"
      - "(По-прежнему слишком много неопределенностей.)"
  - text:
      - "*тук-тук*"
  - char: "memphis"
    side: "right"
    text:
      - "Командир, всё в порядке?"
  - char: "commander"
    side: "left"
    text:
      - "Да. Как там Акаги?"
  - char: "memphis"
    side: "right"
    text:
      - "Намного спокойнее, чем раньше, но всё ещё отказывается от очищения от коррозии."
  - char: "commander"
    side: "left"
    text:
      - "Должно быть, ей сейчас очень тяжело, раз уж она не пришла ко мне."
  - char: "memphis"
    side: "right"
    text:
      - "Да, похоже на то."
  - char: "с"
    side: "left"
    text:
      - "...Давай пока дадим ей немного времени."
  - char: "memphis"
    side: "right"
    text:
      - "И ещё кое-что. Ранее, собирая показания Акаги и Нагато, мы заметили, что часть информации не сходится."
      - "Например, Нагато упомянула, что на неё напали в Тихом океане, и вместо неё похитили Хиэй, но Акаги отрицала, что знала об этом, и сказала, что не приказывала атаковать."
      - "Акаги также заявила, что ничего не знает о попытке самозванцев захватить мейнфрейм Тестер."
  - char: "commander"
    side: "left"
    text:
      - "Другими словами, они не являются отражением воли Акаги..."
      - "Нам нужно будет проявить особую осторожность, когда мы столкнемся с ними."
  - char: "memphis"
    side: "right"
    text:
      - "Слушай, кстати... Это правда хорошая идея — работать с Обсервер?"
      - "Бисмарк и Акаги тоже однажды так сделали, и посмотри, чем всё для них обернулось."
      - "Я ни в чем тебя не обвиняю, просто беспокоюсь."
  - char: "commander"
    side: "left"
    text:
      - "(Мемфис не одинока в этом мнении. Остальные тоже выглядели обеспокоенными, когда я ввел их в курс дела.)"
      - "Не то чтобы я доверял Обсервер. Она мне не союзник."
      - "Однако я доверяю Хелене МЕТА и верю, что эта сделка с Обсервер спасет нас."
      - "Да, это рискованная сделка, но именно это нам сейчас и нужно."
  - char: "memphis"
    side: "right"
    text:
      - "Ладно, но тебе лично действительно нужно входить в Сингулярность?"
  - char: "commander"
    side: "left"
    text:
      - "Да. Это должен быть я."
  - char: "memphis"
    side: "right"
    text:
      - "Почему? Потому что так сказала Хелена?"
  - char: "commander"
    side: "left"
    text:
      - "Это не единственная причина. Акаги и многие сакуране рассчитывают на меня."
  - char: "memphis"
    side: "right"
    text:
      - "......"
      - "Хелена, Хелена, Хелена... Почему ты так сильно ей доверяешь?"
  - char: "commander"
    side: "left"
    text:
      - "Прости?"
  - char: "memphis"
    side: "right"
    text:
      - "<h2> Ой, извини! Я хотела сказать, что я доверяю тебе, Командир!</h2>"
  - char: "communicator"
    side: "left"
    text:
      - "БИП-БИП!"
  - char: "memphis"
    side: "right"
    text:
      - "Вызов?  И, из всех возможных вариантов, от Минадзуки..."
      - "Почему она звонит тебе? Как она связалась с твоим командным кораблем?"
  - char: "commander"
    side: "left"
    text:
      - "По всей вероятности, это Ямато говорит через Минадзуки."
  - char: "memphis"
    side: "right"
    text:
      - "А, понятно. Мне сообщить об этом Акаги?"
  - char: "commander"
    side: "left"
    text:
      - "Что ж, если речь зашла о ней..."

chapter6:
  rows:
  - char: "nagato_rad"
    side: "left"
    text:
      - "Акаги, я соединяю тебя с Командиром."
      - "Командир, это Нагато. Я спасла Акаги и Дзуйкаку."
  - char: "commander"
    side: "right"
    text:
      - "Акаги? Ты меня слышишь? Ты в порядке?"
  - char: "akagi_rad"
    side: "left"
    text:
      - "Коман...дир..."
      - "Прости меня... Я совершила ужасную ошибку... Я никогда..."
      - "Я... Должно быть, ты питаешь ко мне отвращение за всё, что я сделала..."
  - char: "commander"
    side: "right"
    text:
      - "Успокойся, я никуда не уйду. Я иду к тебе."
  - char: "akagi_rad"
    side: "left"
    text:
      - "Кага исчезла... Амаги никогда не вернется... И теперь мне даже некуда будет возвращаться..."
      - "Я предала всех и вся... только чтобы открыть эту Сингулярность. Теперь уже слишком поздно. Даже для такого человека, как ты..."
      - "Прости меня... Всё, чего я хотела, это..."
      - "Пожалуйста... Положи конец этому кошмару..."
  - char: "commander"
    side: "right"
    text:
      - "Обещаю."

chapter7:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Я постарался утешить её как мог, но слова мало чем могут помочь душевным ранам.)"
      - "(К сожалению, всё, что я могу сделать, — это быть рядом с ней, пока она переживает свою собственную травму.)"
      - "Позже я снова попытаюсь убедить её очиститься от коррозии. Слишком опасно оставлять её без контроля."
  - char: "memphis"
    side: "right"
    text:
      - "Поняла."
  - char: "commander"
    side: "left"
    text:
      - "(С чего бы Ямато связываться со мной сейчас? Случилось что-то непредвиденное?)"
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "commander"
    side: "left"
    text:
      - "Минадзуки, это я. Не могла бы ты передать слово Ямато?"
