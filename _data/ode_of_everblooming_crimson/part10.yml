chapter1:
  rows:
  - text:
      - "Девушка плыла по океану, окутанная темным клубящимся дымом."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я не чувствую присутствия сущностей коррозии, да и этой самозванки нигде не видно..."
      - "Даже не знаю, повезло мне или нет, что меня выбросило в таком безжизненном месте."
      - "Глядя на свое тело, глупо отрицать, что я стала МЕТА..."
      - "И всё же, я не чувствую ничего похожего на тех МЕТА, о которых слышала и которых видела."
      - "Почему-то мне спокойно, нет никакой тяги к разрушению... Напротив, сейчас я чувствую себя даже спокойнее, чем до превращения."
      - "Эта новая сила тоже кажется чем-то естественным... Как будто она была со мной уже очень, очень давно."
      - "Я даже чувствую себя... моложе. Легкой как пушинка..."
      - "Нет, что я такое говорю? Я еще не НАСТОЛЬКО старая!"
      - "Успокойся, успокойся..."
      - "Соберись. Мне нужно найти выход отсюда и немедленно доложить госпоже Нагато."
      - "Но где? Где этот выход?"
      - "Полагаю, придется просто осмотреться, пока что-нибудь не найду..."
