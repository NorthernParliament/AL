chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Фух. Легкая прогулка."
      - "Раз уж это место — источник коррозии, я ожидала большего сопротивления."
      - "Это и есть сила МЕТАморфоза? Или просто изменилось моё мышление?"
      - "Что же дает мне это чувство безопасности и уверенности, но при этом такую легкость в голове?"
  - text:
      - "БАБАХ!!!"
  - text:
      - "Тут она услышала гул моторов неподалеку от себя."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Авиация? Здесь?"
      - "Должно быть, здесь в ловушке есть кто-то еще."
      - "Я должна немедленно им помочь!"

chapter2:
  rows:
  - text:
      - "Хиэй прорвалась сквозь черный туман, и её окружение полностью изменилось, как если бы её перебросило в совершенно новое место."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Темные тучи, гром, пылающее море... Может, это и не по-настоящему, но ощущается именно так."
      - "Полагаю, иллюзия захватила и это место тоже."
  - text:
      - "Она посмотрела в небо и ясно увидела силуэты эскадрильи самолетов."
  - text:
      - "<img src='../../img/bg/r/8.png' class='inline-img' alt=''>"
  - text:
      - "БАБАХ!!!"
  - text:
      - "В мгновение ока феникс нанес ответный удар, сбив их всех в воздухе."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Жаль самолеты... Этот феникс сражается так, как я еще никогда не видела."
      - "Откуда взялось это чудовище?"
  - text:
      - "Звуки боя стихли."
      - "Воздушная атака оказалась бессмысленной, и обломки самолетов теперь были разбросаны по морю."
  - text:
      - "БАБАХ!!!"
  - char: "hatakaze"
    side: "right"
    text:
      - "Это еще не конец... Пока нет!"
      - "Я разгадала источник твоей силы!"
      - "Даже если этот мир уже не спасти, я всё равно смогу отправить тебя в самые глубины ада!"
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хатакадзэ?"
      - "Она тяжело ранена... Так она пойдет ко дну!"
  - text:
      - "Хотя сама Хиэй вряд ли находилась в выгодном положении, её тело среагировало быстрее, чем мозг."
  - text:
      - "БАБАХ!!!"
  - text:
      - "Прогремели залпы орудий, и она уклонилась от летящих снарядов. У неё не было иного выбора, кроме как помочь Хатакадзэ одолеть чудовище."

chapter3:
  rows:
  - char: "hiei_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Исчезни, словно туча в небе!"
  - text:
      - "БАБАХ!!!"
  - text:
      - "Атака Хиэй поразила феникса из черного тумана, прятавшегося среди облаков, развеяв его в небытие."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Держись, Хатакадзэ!"
  - char: "hatakaze"
    side: "right"
    text:
      - "Хиэй? Я думала, мы потеряли тебя... Я сплю?"
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ну, полагаю, это можно назвать своего рода сном."
      - "Сон или нет, но я не отвернусь от товарища."
      - "Враги скоро настигнут нас, поэтому нам лучше уйти. Пойдем со мной."
      - "Что бы ни случилось дальше, нам просто придется с этим разобраться!"
