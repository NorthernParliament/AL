chapter1:
  rows:
  - text:
      - "Когда свет возвращается, Акаги уже нигде нет."
  - char: "kagabb"
    side: "left"
    text:
      - "Нет... Как такое могло..."
  - char: "amagi"
    side: "right"
    text:
      - "Акаги?!"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Хелена, где она?!)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Её больше нет в этом сегменте мира. Я всё ещё ищу, но, честно говоря, даже не уверена, жива ли она...)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Пожалуйста, продолжай искать. Обсервер, что это только что была за атака?)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(В сегмент проникло сразу несколько сил. Одна из них и атаковала вас.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Ты сказала «несколько»? Значит, это не только коррозия?)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(Именно. Ты даже не представляешь, насколько ты популярен, да?)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(На кону жизни моих друзей. Обойдемся без шуток, пожалуйста!)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(Хе-хе, остынь. Я точно знаю, кто именно на вас напал.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Тогда говори.)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(Это было то самое нечто, которое создала Акаги.)"
      - "(Конечно, полагаю, на данном этапе их уже нельзя назвать самозванками...)"
      - "(Изначально эти твари приняли концепцию Амаги, но после того, что сделали твои приятели, они больше не являются ею.)"
      - "(Вот только одно но...)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Выкладывай уже.)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(Не-а. Мои отношения с тобой начинаются и заканчиваются возрождением Амаги. Я не обязана отвечать на твои вопросы.)"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "(А что, если вместо него спрошу я?)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(Угх... Ладно.)"
      - "(Изначально они были рождены из одержимости Акаги. Теперь, когда они утратили концепцию Амаги, они снова стали Акаги.)"
      - "(Точнее говоря, её МЕТА-версией.)"
      - "(Атака на тебя, атака на Амаги — всё это было обманным маневром. Всё это время они охотились за самой Акаги.)"
      - "(Но концепция, которую они приняли для себя, ещё нестабильна. Вот почему они хотели забрать её у оригинала.)"
      - "(Блин, неудивительно, что она не запаниковала при атаке. Она знала, что иначе эта МЕТА продолжит нападать на тебя и её сестру!)"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "(На этом пока хватит болтовни. Отследи координаты, которые я тебе отправила.)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(Да-да. Кстати, Командир, прямо в эту секунду к тебе направляется ещё кое-кто.)"

chapter2:
  rows:
  - text:
      - "После того как я отключаю связь, на воде появляются врата тории."
      - "Изнутри вырывается калейдоскоп светящихся бабочек, и появляется серебряноволосая девушка."
  - char: "shinano"
    side: "left"
    text:
      - "Командир?"
      - "Значит, последним сном был ты..."
  - char: "commander"
    side: "right"
    text:
      - "(Сном? Я думал, этот сегмент мира реален?)"
      - "Синано? Как ты сюда попала?"
  - char: "shinano"
    side: "left"
    text:
      - "Командир?! Ты видишь меня?.."
  - char: "commander"
    side: "right"
    text:
      - "......"
  - text:
      - "Я с трудом представляю, как вообще объяснить ей всю эту неразбериху."

chapter3:
  rows:
  - text:
      - "Потребовалось некоторое время, чтобы всё как следует объяснить."
      - "Впрочем, к счастью, Синано, кажется, всё поняла."
      - "Я также рассказал ей о том, что Амаги и Кага отправляются с нами."
      - "После этого мы решили отступить к особняку Амаги и подождать, пока Обсервер не обеспечит нам безопасный путь к отступлению."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Короче говоря, Ямато связалась с Синано и привела всё в движение."
      - "Она использовала пещеру снов, чтобы поместить туда души павших сакуранок в виде бабочек, и создала сны, сквозь которые Синано могла путешествовать..."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Звучит вполне правдоподобно."
      - "Значит, Ямато уже докопалась до истины о Кубах тестового полигона Бета..."
  - char: "commander"
    side: "left"
    text:
      - "Я знал, что Синано может путешествовать по снам, но не думал, что она способна использовать их для мгновенной телепортации."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Не совсем так. Это была не настоящая Синано — скорее симуляция, созданная из её данных."
  - char: "commander"
    side: "left"
    text:
      - "О? Значит ли это, что она была воссоздана в этом сегменте так же, как Амаги и Кага?"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Именно."
  - char: "commander"
    side: "left"
    text:
      - "Тогда зачем Ямато перенесла её сюда? Похоже, она и сама этого не знает."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Нам придется подумать об этом в другой раз. Сейчас есть дело поважнее — у нас появились новости об Акаги."
  - char: "observer_rad"
    side: "left"
    text:
      - "Хе-хе, хочешь угадать, как у неё сейчас дела?"
      - "Бе. Не похоже, что ты настроен подыгрывать."
      - "Во-первых, она жива. Но застряла в компании своей МЕТА-копии."
      - "Они находятся в месте, похожем на этот сегмент мира, но оно меньше и менее детализировано."
      - "Гарантирую, она создала его с помощью данных, украденных из мейнфрейма Тестер."
      - "Впрочем, вернемся к теме: эта МЕТА подготовила то место заранее. Она с самого начала планировала сбежать туда."
      - "Я бы не рекомендовала туда соваться."
  - char: "commander"
    side: "right"
    text:
      - "Почему нет?"
  - char: "observer_rad"
    side: "left"
    text:
      - "Очевидно, это слишком опасно. Этот сегмент уже нестабилен, и если ты продолжишь терять время, весь твой план рухнет."
      - "Не думаешь, что в приоритете должны быть выход из Нараки и возрождение Амаги?"
      - "Я понимаю, что она тебе небезразлична, но она сама сделала этот выбор. Моё мнение? Оставь её пока."
  - char: "commander"
    side: "right"
    text:
      - "Будто я могу так поступить. Это я привел её сюда, и я несу ответственность за то, чтобы вернуть её домой целой и невредимой."
  - char: "observer_rad"
    side: "left"
    text:
      - "а ладно тебе, Хелена. Вразуми уже своего босса."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "...Командир, ты действительно собираешься спасти её?"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Да."

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Это не обсуждается."

chapter7:
  rows:
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Хорошо."
      - "В одном Обсервер права — этот сегмент мира не получится поддерживать еще долго."
      - "Извлеченные из него души нужно быстро поместить в хранилище, иначе они будут заражены коррозией Нараки. Но если ты выйдешь ради этого сейчас, спасать Акаги будет уже слишком поздно."
      - "Если ты хочешь спасти её... тогда тебе придется возродить Амаги и Кагу прямо здесь и сейчас."
  - char: "commander"
    side: "left"
    text:
      - "Здесь? Как?"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Все материалы, необходимые для создания девушек-кораблей, уже здесь."
      - "Данные их душ, Ватацуми, способный материализовать эти данные в тела, и ресурсы, необходимые для этого процесса."
      - "Ресурсы раздобыть достаточно легко. А души и Ватацуми находятся прямо перед тобой."
  - char: "commander"
    side: "left"
    text:
      - "Ты имеешь в виду амулет Синано?"
      - "Но ведь это просто копия, созданная этим сегментом мира, верно? Он ненастоящий."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Настоящий или нет, Ватацуми есть Ватацуми."
  - char: "commander"
    side: "left"
    text:
      - "Ты ведь не хочешь сказать..."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Реальность, в которую ты веришь, станет истиной."
  - char: "observer_rad"
    side: "left"
    text:
      - "«Реальность и истина — не всегда одно и то же. Реальность может стать истиной только в том случае, если в неё вложено достаточно веры»."
  - char: "commander"
    side: "right"
    text:
      - "Скажи мне кое-что. Если мы воскресим Амаги с теми данными, что у нас есть сейчас, у неё всё ещё останется дефект корпуса?"
  - char: "helena_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Останется. По сути, это просто перезапустит текущее состояние её корпуса. Мы не сможем его устранить."
  - char: "commander"
    side: "right"
    text:
      - "...Она должна была пройти модернизацию в авианосец."
      - "Если бы мы смогли закрепить за её душой концепцию «Амаги, модернизированной в авианосец», исправило бы это дефект в её корпусе?"
  - char: "helena_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Я не могу ответить на этот вопрос. Такого ещё ни разу не пробовали ни на одном тестовом полигоне."
  - char: "commander"
    side: "right"
    text:
      - "Значит, ты говоришь, что попробовать стоит."
      - "В записях Обсервер должны быть подробности плана модернизации."
  - char: "helena_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "..Они там есть. Сейчас же их отправлю."
  - char: "observer_rad"
    side: "right"
    text:
      - "Ты ведь не собираешься напрямую модифицировать данные её корпуса, да?!"
  - char: "commander"
    side: "left"
    text:
      - "Ещё как собираюсь. И для этого я воспользуюсь ресурсами Системы Натуральных Вычислений."
      - "Демон Лапласа способен симулировать будущее. Уж наверняка он сможет рассчитать такую простую вещь, разве нет?"
  - char: "observer_rad"
    side: "right"
    text:
      - "Даже если и сможет, ты правда думаешь, что у тебя получится интегрировать это в существующие данные её корпуса?"
  - char: "commander"
    side: "left"
    text:
      - "Конечно. Хелена, ты ведь можешь изменить чью-то внешность, используя вычисленные Башней данные?"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Не скажу, что не могу, но это будет лишь иллюзией. Тебе всё равно придется как-то связать её с реальностью..."
  - char: "commander"
    side: "left"
    text:
      - "Да, я это знаю."
  - char: "observer_rad"
    side: "right"
    text:
      - "А ты уже всё продумал, не так ли?"
      - "И что будет после того, как ты возродишь Амаги? Как ты собираешься спасать Акаги, а?"
      - "Если этот сегмент мира рухнет, мы потеряем возможность вмешиваться в дела Нараки. Ты готов сражаться с МЕТА в одиночку?"
  - char: "helena_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "...Всё будет хорошо. Я верю в Командира."
  - char: "commander"
    side: "right"
    text:
      - "Спасибо, Хелена."
  - char: "observer_rad"
    side: "left"
    text:
      - "Отлично. Ну, развлекайся, важная шишка. Мне-то какое дело."
  - char: "commander"
    side: "right"
    text:
      - "Хорошая попытка, Обсервер. Но так просто ты пока не отвертишься."
      - "Время не ждет, и нам понадобится любая доступная помощь."
