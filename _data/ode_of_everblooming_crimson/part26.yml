chapter1:
  rows:
  - text:
      - "<img src='../../img/bg/r/9.png' class='inline-img' alt=''>"
  - char: "roaring_beast_b"
    side: "right"
    status: "is-red"
    text:
      - "КРААААААР! КРАААААААР!"
  - text:
      - "<img src='../../img/bg/r/10.png' class='inline-img' alt=''>"
  - char: "roaring_beast_r"
    side: "right"
    status: "is-red"
    text:
      - "КРААААААР! КРАААААААР!"
  - char: "helena"
    side: "left"
    text:
      - "Еще враги!"
  - char: "memphis"
    side: "right"
    text:
      - "Они все наступают... У нас нет на это времени!"
  - char: "observer"
    side: "left"
    text:
      - "(Похоже, она уже поняла, как использовать свои силы. Впрочем, моя бывшая соратница умна.)"
      - "(Она явно создала этих духов-сикигами на основе данных душ, к которым у нее тоже есть доступ.)"
  - char: "commander"
    side: "right"
    text:
      - "(Красный явно принадлежит Акаги, но синий? Неужели она использовала душу Каги?)"
  - char: "observer"
    side: "left"
    text:
      - "Посмотрите-ка на этого умника. Да, все верно.)"
  - char: "amagi_cv"
    side: "right"
    text:
      - "Эти сикигами были созданы на основе душ Акаги и Каги..."
  - char: "kagabb"
    side: "left"
    text:
      - "Это... сделано из моей версии авианосца?"
  - char: "amagi_cv"
    side: "right"
    text:
      - "(Возможно, это даст нам шанс возродить именно ту Кагу, которая пожертвовала собой...)"
      - "Командир, я освоила азы боя на авианосцах. Могу я возглавить атаку?"
      - "К тому же, ты выглядишь так, будто хотел мне что-то сказать..."
  - char: "commander"
    side: "left"
    text:
      - "Хорошо, бери командование на себя."
  - char: "roaring_beast_r"
    side: "right"
    status: "is-red"
    text:
      - "КРААААААР! КРАААААААР!"
  - char: "amagi_cv"
    side: "left"
    text:
      - "Очень хорошо. Поговорим после того, как расправлюсь с этими врагами."

chapter2:
  rows:
  - text:
      - "БАБАХ!"
  - char: "akagi_meta"
    side: "right"
    status: "is-red"
    text:
      - "Вы уничтожили моих сикигами... Так не принято приветствовать друг друга."
      - "Вы ужасно грубые гости, вы это знаете?"
  - char: "ryuuhou"
    side: "left"
    text:
      - "Скажи нам, где Акаги, чудовище! Немедленно!"
  - char: "akagi_meta"
    side: "right"
    status: "is-red"
    text:
      - "Акаги? Ах, да, видела я одну самовлюбленную лисичку."
  - char: "ryuuhou"
    side: "left"
    text:
      - "Отпусти ее сейчас же, иначе!.."
  - char: "akagi_meta"
    side: "right"
    status: "is-red"
    text:
      - "Иначе что? Она уже ушла. По собственной воле."
      - "Она сказала, что хочет исчезнуть, поэтому я исполнила ее желание!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Ты сделала ЧТО?!"
  - char: "akagi_meta"
    side: "right"
    status: "is-red"
    text:
      - "Вам нужны подробности, не так ли?"
      - "Акаги мертва. Так достаточно ясно?"
  - char: "ryuuhou"
    side: "left"
    text:
      - "Ты гнилая тварь... Ты за это поплатишься!"
  - char: "zuikaku"
    side: "right"
    text:
      - "Я отомщу за тебя, Акаги!"

chapter3:
  rows:
  - char: "amagi_cv"
    side: "left"
    text:
      - "......"
  - char: "kagabb"
    side: "right"
    text:
      - "Это ужасно, я знаю, но не срывайся. Ты не сможешь отомстить, если потеряешь самообладание."
      - "Теперь я понимаю, почему ты сделала меня ее сестрой. Если бы я знала, насколько опасна эта женщина, я бы отдала свою жизнь, чтобы защитить Акаги."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Я в порядке, Кага."
      - "Просто..."
  - char: "memphis"
    side: "right"
    text:
      - "Не могу поверить, что Акаги действительно стала МЕТА..."
      - "Командир, что нам с ней делать?"
  - char: "commander"
    side: "left"
    text:
      - "(Это действительно она. Она стала МЕТА...)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(Да, именно это я и говорила ранее.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Что ж, на этот раз я ценю твою честность.)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(Я приношу тебе дурные вести, а ты за это благодарен?)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Я благодарен за то, что ты дала мне уверенность в том, что я смогу ее спасти.)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(О? И как же ты планируешь это сделать?)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Увидишь.)"
  - char: "commander"
    side: "left"
    text:
      - "Все в порядке. Еще есть способ спасти ее."
      - "Ты понимаешь, о чем я, Амаги?"
  - char: "amagi_cv"
    side: "right"
    text:
      - "Да. Способ определенно есть."
  - char: "commander"
    side: "left"
    text:
      - "Но сначала нам нужно ее усмирить."
  - char: "amagi_cv"
    side: "right"
    text:
      - "Это правда. Я знаю, что нужно сделать."
      - "Для этого, я полагаю, мне следует занять позицию в авангарде."
  - char: "commander"
    side: "left"
    text:
      - "Безусловно."
  - char: "amagi_cv"
    side: "right"
    text:
      - "Рюхо, Дзуйкаку, вы готовы?"
  - char: "zuikaku"
    side: "left"
    text:
      - "Только не делай никаких глупостей, ладно? Я знаю, что ты, должно быть, чувствуешь."
  - char: "ryuuhou"
    side: "right"
    text:
      - "Давайте покончим с ней."

chapter4:
  rows:
  - char: "akagi_meta"
    side: "left"
    status: "is-red"
    text:
      - "Покончить со мной? Вы правда думаете, что сможете?"
      - "Думаю, вместо этого я сожгу вас дотла!"

chapter5:
  rows:
  - text:
      - "БАБАХ!"
  - text:
      - "Акаги продолжает взывать к своим огромным силам, не обращая внимания на раны."
      - "Однако Амаги и ее флот постепенно получают все большее и большее преимущество."
      - "И по мере того, как битва затягивается, силы Акаги в конечном итоге иссякают."
  - char: "akagi_meta"
    side: "right"
    status: "is-red"
    text:
      - "Кхе... Хех... Значит, это и есть та сила... дарованная тебе Командиром..."
      - "Это пламя, очищающее все грехи... достойный конец для меня."
  - text:
      - "Темная аура, окружающая Акаги, внезапно вспыхивает, но пламя Амаги оказывается на шаг быстрее."
      - "Зловещий туман поглощается, исчезая без следа. И Акаги, такая гордая и внушительная всего несколько мгновений назад, падает на землю."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Все, пожалуйста, оставайтесь позади. Позвольте мне... побыть с сестрой до самого конца."
  - text:
      - "Торжественно кивнув, Амаги медленно направляется к поверженной Акаги."
  - char: "zuikaku"
    side: "left"
    text:
      - "Погоди, Амаги!"
  - char: "kagabb"
    side: "right"
    text:
      - "Позволь ей самой разобраться. Если кто и имеет право разобраться с этим человеком, так это она."
  - char: "shinano"
    side: "left"
    text:
      - "Пламя, очищающее все грехи? Это... истинная сила Амаги?"
  - char: "commander_rad"
    side: "right"
    text:
      - "(Нет, это просто МЕТА-маскировка рассеялась сама по себе. Это никак не было связано с пламенем.)"
  - char: "observer_rad"
    side: "left"
    text:
      - "(Интересно. Тебе даже это удалось понять?)"
      - "(Все верно. Акаги намеренно замаскировалась с помощью временного состояния МЕТА.)"
      - "(Удобный трюк, который она переняла у Хелены.)"
  - char: "sp_s_c"
    side: "right"
    text:
      - "(......)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Обсервер?)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Мои извинения. Мне нужны были ее силы, чтобы обеспечить путь к отступлению, поэтому мне пришлось сначала отключить связь.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Меня это устраивает. В любом случае, тебе я доверяю больше.)"
      - "(Так как там сейчас Акаги?)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Ну, это зависит от тебя. Она станет тем, кем ты захочешь ее видеть.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(А что насчет Амаги?)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Становимся немного жадными, не так ли?)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Кхм... Я имел в виду состояние ее корпуса.)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Все еще провожу анализ, но пока все выглядит довольно неплохо. Твой план, похоже, сработал даже лучше, чем ожидалось.)"
      - "(Мне все еще нужно обезопасить путь к отступлению. Поговорим позже.)"
  - text:
      - "На этом Хелена резко обрывает звонок."
  - char: "commander"
    side: "left"
    text:
      - "(Опять она за свое... Хотя к концу она была более резкой, чем обычно.)"
  - char: "memphis"
    side: "right"
    text:
      - "Командир... Ты уверен, что тоже не хочешь подойти?"
  - char: "commander"
    side: "left"
    text:
      - "Все будет в порядке. Если кто-то и способен сейчас что-то изменить, так это Амаги."
