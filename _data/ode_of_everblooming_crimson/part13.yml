chapter1:
  rows:
  - text:
      - "Сквозь одни тории за другими, сквозь бесчисленные фрагменты снов."
      - "Все они трагичны, все заканчиваются разлетающимися золотыми бабочками."
      - "Но постепенно Синано поняла значение этих снов."
  - char: "shinano"
    side: "left"
    text:
      - "Мое присутствие порождает больше бабочек, и эти бабочки превращают трагичные финалы во что-то лучшее..."
      - "В таком случае... я должна стать свидетелем их всех, должна собрать этих бабочек..."
  - text:
      - "Пока Синано продвигалась сквозь сон за сном, она приближалась к концу дороги из врат тории, и количество золотых бабочек, собравшихся вокруг неё, росло."
      - "Наконец, остались лишь одни врата."

chapter2:
  rows:
  - char: "shinano"
    side: "left"
    text:
      - "Те, что впереди — последние..."
      - "Ах, какая же трагедия ждет впереди?.."
  - char: "fusou_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Синано, ты должна остановиться. Ты не должна видеть то, что кроется в этом сне."
  - text:
      - "В пещере сновидений появилась неожиданная фигура и преградила ей путь вперед."
  - char: "shinano"
    side: "left"
    text:
      - "Ты... Фусо?"
  - char: "fusou_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Здравствуй, Синано."
  - char: "shinano"
    side: "left"
    text:
      - "Почему ты преграждаешь мне путь?"
  - char: "fusou_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Праведный путь — почитать Ватацуми и, следовательно, держаться от него подальше."
      - "Оставь священную реликвию, пожалуйста, а вместе с ней и этот мир снов. То, что здесь находится, не предназначено для твоих рук."
  - char: "shinano"
    side: "left"
    text:
      - "Командиру нужна моя сила..."
      - "Какова бы ни была причина... я не могу медлить..."
  - char: "fusou_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ты никогда не меняешься, Синано."
      - "Если ты так настаиваешь на этом, то увидишь, что всё закончится точно так же, как и раньше."
      - "Ненавидь меня, если хочешь, но я должна тебя остановить."

chapter3:
  rows:
  - text:
      - "Фусо подняла руку и установила багровый барьер на последних вратах тории. Затем она исчезла так же внезапно, как и появилась."
  - char: "shinano"
    side: "left"
    text:
      - "Такая сложная структура... Потребуется время, чтобы её распутать..."
      - "Значит, сила — единственный выход..."
  - text:
      - "Синано сосредоточилась, материализуя свою силу в виде синих бабочек."
      - "Когда она подняла руку, золотые бабочки собрались позади синих."
  - char: "shinano"
    side: "left"
    text:
      - "Я не могу позволить себе потерять ни секунды..."
  - text:
      - "Две группы бабочек закружились в танце, всё быстрее и быстрее, пока не превратились в двухцветный шторм."
      - "Однако, прежде чем она успела высвободить свою силу, Синано ощутила в пещере ещё кого то."

chapter4:
  rows:
  - char: "unzen"
    side: "right"
    text:
      - "Синано, постой. Позволь мне."
  - text:
      - "Знакомый голос."
  - char: "shinano"
    side: "left"
    text:
      - "Ундзэн?!"
  - char: "unzen"
    side: "right"
    text:
      - "Меч, отрази моё сердце..."
      - "И разруби!"

chapter5:
  rows:
  - text:
      - "Одним спокойным взмахом клинок золотого света опустился сверху и разрубил барьер на ториях надвое."
  - char: "unzen"
    side: "right"
    text:
      - "Поспеши, Синано."
  - char: "shinano"
    side: "left"
    text:
      - "Спасибо тебе, Ундзэн, и Ямато тоже!"

chapter6:
  rows:
  - text:
      - "Когда барьер был разрушен, золотые бабочки засияли ярче, чем когда-либо прежде."
      - "Без колебаний Синано шагнула в свет."
