chapter1:
  rows:
  - text:
      - "Наконец, мы отправились к особняку Амаги."
      - "Теперь, полная решимости, Акаги направилась прямиком к своей цели, не сворачивая ни на шаг."
      - "Напряжение между сакуранками и девушками-кораблями из других фракций, похоже, немного спало."
      - "В конце концов, не каждый день удается попасть в столь идеально воссозданный фрагмент жизни."
      - "Другой причиной могла быть та аура решимости, что теперь исходила от Акаги."
      - "Под её предводительством мы шли по усыпанной лепестками дороге, пока не добрались до места назначения — дома Амаги."
      - "Пройдя через ворота, несколько коридоров и веранду у внутреннего двора, Акаги останавливается."
  - char: "akagi"
    side: "left"
    text:
      - "Мы на месте."

chapter2:
  rows:
  - text:
      - "Из-за раздвижной двери слышны два голоса."
      - "Один спокойный, а другой — разочарованный и свирепый."
  - char: "amagi"
    side: "left"
    text:
      - "Хи-хи... Я победила."
  - char: "kagabb"
    side: "right"
    text:
      - "Черт... Как я продолжаю попадаться на твои уловки?"
      - "Ещё раз! Я требую реванша!"
  - text:
      - "Услышав голос победительницы, Акаги замирает, словно её ноги налились свинцом."
  - char: "commander"
    side: "left"
    text:
      - "Акаги, хочешь сначала побыть с ними наедине?"
  - char: "akagi"
    side: "right"
    text:
      - "Командир? Я-я..."
  - char: "zuikaku"
    side: "left"
    text:
      - "Ничего страшного, если мы подождем снаружи, да?"
  - char: "memphis"
    side: "right"
    text:
      - "А?"
  - char: "commander"
    side: "left"
    text:
      - "Согласен. Давайте дадим Акаги немного личного пространства."

chapter3:
  rows:
  - text:
      - "БАХ!"
  - text:
      - "Акаги рывком распахивает раздвижную дверь, прерывая их игру."
      - "Их лица, то, как они сидят, их ауры... Всё в точности так, как она помнит."
  - char: "akagi"
    side: "left"
    text:
      - "Я скучала по тебе. Я так сильно по тебе скучала...)"
      - "Сестра..."
      - "Амаги!"
  - text:
      - "Одного лишь имени сестры оказалось достаточно, чтобы лишить её всех сил."
      - "Всё, что она держала в себе — её любовь, её надежды и её слезы — вырывается наружу в одночасье."

chapter4:
  rows:
  - char: "kagabb"
    side: "left"
    text:
      - "Акаги? Какого черта?!"
      - "Я знала, что ты плакса, но ты ведь должна помнить о базовых манерах."
  - char: "akagi"
    side: "right"
    text:
      - "*шмыгает носом и всхлипывает*"
  - char: "kagabb"
    side: "left"
    text:
      - "Эм... Т-ты в порядке? Кто-то наговорил тебе гадостей?"
  - char: "amagi"
    side: "right"
    text:
      - "Акаги?"
  - char: "akagi"
    side: "left"
    text:
      - "Амаги... Моя дорогая сестра..."
      - "Ох, я так по тебе скучала..."
      - "Ваааааа!"
  - text:
      - "Не в силах сдержать рыдания, она бросается в объятия своей любимой сестры."
      - "Никогда прежде она не позволяла никому видеть, как она так плачет."
      - "Ни когда Амаги была рядом, ни после того, как потеряла её, и даже не тогда, когда фантазировала о том, чтобы увидеть её снова."
      - "Никакое облегчение, радость, сожаление или скорбь не могли сравниться с этим моментом неподдельных эмоций."
      - "Такая пылкая одержимость, такая недолговечная мечта. Вечно теряя, вечно обретая вновь, водоворот нестабильности."
      - "В этот момент, однако, всё это не имело никакого значения."
  - char: "akagi"
    side: "left"
    text:
      - "Амаги... Я так сильно по тебе скучала."
      - "*всхлип*... Так сильно... Я даже не могу..."
      - "Пожалуйста, никогда больше не оставляй меня..."
      - "Амаги... Никогда не бросай свою бедную младшую сестренку..."
      - "*шмыгает носом и всхлипывает*"
  - char: "amagi"
    side: "right"
    text:
      - "Всё будет хорошо, Акаги."
      - "Я здесь, с тобой. Я никуда не уйду, обещаю."
  - text:
      - "Амаги держит младшую сестру в объятиях, с любовью поглаживая её по волосам."
      - "Она в равной степени удивлена и сбита с толку, но не задает никаких вопросов."
      - "Плач её сестры так горестен, словно её сердце разорвали надвое."
      - "Даже Амаги, давно смирившаяся с тем, что её конец как девушки-корабля неизбежен, жалеет бедную девочку."
  - char: "kagabb"
    side: "left"
    text:
      - "*вздох* Что ж, я явно пришла не вовремя."
      - "Я умею читать атмосферу. Пожалуй, пойду-ка я отсюда."
  - text:
      - "Понимая, насколько она здесь неуместна, Кага встает, чтобы уйти."
      - "Но прежде чем она успевает выйти, Акаги бросается к ней и удерживает на месте."
  - char: "akagi"
    side: "left"
    text:
      - "Кага... Не уходи, пожалуйста."
      - "Я больше не позволю тебе уйти!"
      - "Никогда... Я больше никогда не позволю тебе сделать нечто подобное!"
  - char: "kagabb"
    side: "right"
    text:
      - "Ладно, о чем вообще болтает эта девчонка? Она ударилась головой, или типа того?"
      - "Угх... Контролируй свою сестру, Амаги!"
      - "Пусть твоя маленькая тень липнет к тебе сколько влезет, но я не собираюсь в этом участвовать!"
  - char: "akagi"
    side: "left"
    text:
      - "*шмыгает носом и всхлипывает*"
      - "Пожалуйста, просто не уходи..."
  - text:
      - "Почувствовав, как сильно бьется сердце девочки, Кага понимает, что это не просто детская шалость."
  - char: "kagabb"
    side: "left"
    text:
      - "(Что на неё нашло?)"
      - "Да, да, я никуда не ухожу. Теперь довольна?"
      - "Если собираешься плакать, иди вон туда. Ты мне всю одежду измазала слезами и соплями."
  - char: "akagi"
    side: "right"
    text:
      - "Хорошо..."
  - text:
      - "Акаги послушно возвращается в объятия сестры."
      - "Воссоединение, о котором она так мечтала, кажется, будет длиться целую вечность."
