chapter1:
  rows:
  - text:
      - "Громко рассмеявшись, Акаги МЕТА растворилась в воздухе."
      - "Нагато велела Касуми осмотреть Хиэй, после чего возобновила преследование врага."
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Хм?"
  - char: "hiei_meta"
    side: "right"
    status: "is-meta"
    text:
      - "В чем дело? Моя коррозия настолько сильна, как я и боялась?"
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Нет. Как раз наоборот."
      - "Коррозия не только остановилась, но и на удивление стабильна."
      - "Точь-в-точь как у Нагато."
      - "Так происходит со всеми с Тестового полигона Бета?"
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Нет. Хиё и Дзюнъё тоже временно стали МЕТА, но МЕТАморфоз радикально их изменил."
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Это так странно..."
  - char: "hiei_meta"
    side: "right"
    status: "is-meta"
    text:
      - "В любом случае, я рада, что и госпожа Нагато, и я в порядке."
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Ага. Нужно лишь очистить поверхностную коррозию, и ты придешь в норму. Если, конечно, сама этого хочешь."
  - char: "hiei_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Разумеется, хочу. Какой бы невероятной ни была эта новая сила, мне не нравится, как она влияет на мой разум."
      - "Я бы чувствовала себя куда спокойнее, вернувшись в свое обычное состояние."
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Ты в этом уверена?"
  - char: "hiei_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Да, уверена."
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "...Понятно."
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Я слышала, ранее слияния похитили тебя. Если не трудно, не могла бы ты рассказать, что произошло?"
      - "Например, как тебе удалось сбежать?"
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Это долгая история... Эм, я находилась в иллюзии вместе с госпожой Нагато, как вдруг..."

chapter2:
  rows:
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Так я пошла туда, куда мне указала Хатакадзэ, а затем внезапно услышала звуки боя."
      - "Я пошла на звук и обнаружила, что госпожа Нагато и та МЕТА Акаги сражаются, поэтому вмешалась так быстро, как только смогла."
      - "И если та Хатакадзэ не была простой галлюцинацией, я бы очень хотела представить её госпоже Нагато. Увы, она исчезла, стоило мне отвести взгляд."
      - "Вот так мы и оказались здесь."
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Разве эта Хатакадзэ не была МЕТА?"
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ну, выглядела она иначе."
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Ни одна обычная девушка-корабль не смогла бы долго выжить внутри Нараки, и уж тем более найти выход из иллюзорного пространства..."
      - "Должно быть, в ней кроется нечто большее, чем она показала."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Возможно, так и есть, но мне она показалась совершенно обычной."
  - char: "kasumi_meta"
    side: "right"
    status: "is-purple"
    text:
      - "...Тебе стоит быть с ней осторожнее."
  - char: "jintsuu_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Касуми."
  - char: "kasumi_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Верно... Прости. Забудь, что я это сказала."
  - char: "jintsuu_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Угх... Стабильность этой области стремительно падает. Наверняка эта Акаги что-то сделала."
      - "Госпожа Нагато, нам следует немедленно эвакуироваться."
  - char: "nagato_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Погодите. Эта Акаги опасна и всё ещё может представлять угрозу для флота Командира."
  - char: "jintsuu_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Концепция Амаги была освобождена. Нам нет нужды задерживаться здесь, если у Командира всё идет по плану."
      - "Пожалуйста, послушай меня и поступи так, как будет лучше для твоего же состония."
  - char: "kasumi_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Кстати, кто-нибудь знает, как мы вообще должны отсюда выбраться?"
  - char: "jintsuu_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Командир всё предусмотрел. Я вызову союзников, которые нас вытащат."

chapter3:
  rows:
  - text:
      - "По мере приближения времени эвакуации, перед девушками без предупреждения возник замок, сияющий золотом."
  - char: "vanguard_rad"
    side: "left"
    text:
      - "Я Вангард, дворцовый страж Королевских Рыцарей!"
      - "По указу Её Величества, мы доставили сюда Камелот, чтобы эвакуировать вас!"
  - char: "kasumi_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Это устройство... Тестовый полигон Бета — это и впрямь аномалия..."
      - "Пойдем, госпожа Нагато."
