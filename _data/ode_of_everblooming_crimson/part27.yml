chapter1:
  rows:
  - text:
      - "Сестры снова встречаются на поле красных паучьих лилий."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Ну что, ты выговорилась?"
  - char: "akagi_meta"
    side: "right"
    status: "is-red"
    text:
      - "Почему... ты не добила меня?"
  - char: "amagi_cv"
    side: "left"
    text:
      - "Хи-хи. Всё просто. Я всё еще хотела поболтать с моей младшей сестренкой."
  - char: "akagi_meta"
    side: "right"
    status: "is-red"
    text:
      - "Хех. Что, хочешь во всех кровавых подробностях узнать, как я ее убила?"
  - char: "amagi_cv"
    side: "left"
    text:
      - "Нет, меня больше интересуют... все те лишения, которые ты переносила в одиночестве всё это время."
  - char: "akagi_meta"
    side: "right"
    status: "is-red"
    text:
      - "Твоей сестры больше нет. Но если ты всё еще хочешь меня выслушать... я не против рассказать."
      - "Акаги, твоя сестра, сама связалась с Сиренами и тайно поручила им построить в Империи Сакуры экспериментальный комплекс, известный как «Святилище»."
      - "Развращенное своими новыми «богами», руководство Империи Сакуры преданно исполняло Реконструкции Сирен, начав внезапную атаку на Союз Орла и с головой окунувшись в болото войны."
      - "В последовавшей за этим жестокой борьбе за власть она стремилась устранить любую оппозицию, чтобы укрепить свой авторитет."
      - "Даже ее младшие товарищи попали под влияние ее махинаций и были вынуждены участвовать в экспериментах Сирен."
      - "Но она не остановилась и на этом. Чтобы исполнить свои эгоистичные желания, она переступила через всех, кто уже пал из-за ее планов, и всё это в отчаянной попытке провести обреченный ритуал воскрешения."
      - "Злоупотребив силой Изначального Куба и Ватацуми, она подвергла Империю Сакуры — нет, весь мир — смертельной опасности."
      - "И чего же она добилась в итоге? Не смогла воскресить сестру, потеряла Кагу и сожгла за собой все мосты."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Но мне кажется... что всё это ты делала из любви."
  - char: "akagi_meta"
    side: "right"
    status: "is-red"
    text:
      - "...Ты идиотка?"
  - char: "amagi_cv"
    side: "left"
    text:
      - "Эй, Акаги. Я хочу, чтобы ты мне кое-что сказала."
  - char: "akagi_meta"
    side: "right"
    status: "is-red"
    text:
      - "Я же уже говорила, я не твоя Акаги. Она уже мертва."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Ты не честна со мной. Старшая сестра всегда может понять, когда ее младшая сестренка лжет~"
  - char: "akagi_meta"
    side: "right"
    status: "is-red"
    text:
      - "Тогда ты должна знать... что я говорю правду."

chapter2:
  rows:
  - char: "akagi"
    side: "right"
    text:
      - "......"
      - "Теперь ты это видишь, Амаги? Я та Акаги, которую ты никогда раньше не встречала."
      - "Всё, что я сделала, все совершенные мной грехи... никогда не смыть."
      - "И хотя я в ловушке и искажена своей одержимостью, я всё равно не могу заставить себя отпустить ее."
      - "Вот почему я должна умереть здесь. Вместе со своей одержимостью."
      - "Я больше не буду бежать. Я хочу умереть как твой враг, от рук тех, кто мне дорог."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Это всё еще побег. Ты должна искупить свои собственные грехи так, как сочтешь нужным."
      - "Однако ты не должна нести на себе тяжесть грехов, которые не принадлежат тебе."
  - char: "akagi"
    side: "right"
    text:
      - "На данном этапе, кто вообще может сказать... какие грехи мои, а какие нет? В конце концов, я... стольким людям причинила боль."
      - "Мэриленд, Вест Вирджиния, Колорадо, Аризона..."
      - "Саратога, Йорктаун, Энтерпрайз, Хорнет..."
      - "Сёкаку, Дзуйкаку, Хьюга, Исе, Новаки..."
      - "Нагато, Муцу, Кавакадзэ, Микаса, Конго, Хиэй..."
      - "Синано, Мусаси, Тоса, Ямасиро, Рюхо... и Кага..."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Верно, даже Кага..."
  - char: "akagi"
    side: "right"
    text:
      - "Кага, моя драгоценная... сестра..."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Но несмотря на это, даже если ты строила против них козни — твои друзья и товарищи всё равно пришли. Они здесь, чтобы помочь тебе."
  - char: "akagi"
    side: "right"
    text:
      - "Я промыла им мозги... Ничего больше."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Все люди, которым ты причинила боль, сейчас сражаются там ради тебя."
  - char: "akagi"
    side: "right"
    text:
      - "Они сражаются за Командира! Не за меня!"
  - char: "amagi_cv"
    side: "left"
    text:
      - "И прежде всего, сестра, ради спасения которой ты отдала всё... сейчас сражается за тебя, чтобы дать тебе еще один шанс на жизнь."
  - char: "akagi"
    side: "right"
    text:
      - "......"
  - char: "amagi_cv"
    side: "left"
    text:
      - "Совершенные тобой ошибки, Акаги, не заслуживают наказания смертью."
      - "Твои одержимости, какими бы извращенными они ни были, всё еще не вышли полностью из-под твоего контроля."
      - "Я, как твоя сестра, помогу тебе нести это бремя."
  - char: "akagi"
    side: "right"
    text:
      - "Амаги, я..."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Успокойся. Прямо сейчас тебе не нужно беспокоиться о Каге. Я бы хотела, чтобы ты сначала ответила на мой вопрос."
  - char: "akagi"
    side: "right"
    text:
      - "...На какой?"
  - char: "amagi_cv"
    side: "left"
    text:
      - "Эти тени Каги и меня самой, что плавают сейчас вокруг нас — это ведь наши души из того мира, откуда ты пришла, верно?"
      - "Иными словами, они также являются драгоценными частями того, кем мы являемся — теми, кого ты когда-то знала, да?"
  - char: "akagi"
    side: "right"
    text:
      - "Верно... Она оставила их мне перед тем, как исчезнуть."
      - "Я не знаю, как она это сделала, или зачем..."
  - char: "amagi_cv"
    side: "left"
    text:
      - "В конце концов, она всё равно была отражением твоего сердца. В глубине души она бы не сделала того, чего ты не хотела."
  - char: "akagi"
    side: "right"
    text:
      - "Она была рождена из моей одержимости... Даже если я сотру ее, однажды она просто вернется..."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Я бы не стала так сильно об этом беспокоиться."
  - char: "akagi"
    side: "right"
    text:
      - "А? Что ты имеешь в виду?"
  - char: "amagi_cv"
    side: "left"
    text:
      - "Кто знает~? Кое-кто однажды сказал мне: «Отдай мне всю ее одержимость! Я смогу ее исправить!»"
  - char: "akagi"
    side: "right"
    text:
      - "О чем ты вообще..."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Хи-хи. Тебе уже лучше? Давай возвращаться, пока остальные не начали терять терпение."
  - char: "akagi"
    side: "right"
    text:
      - "...Угу."
      - "Пойдем... дорогая сестра."

chapter3:
  rows:
  - text:
      - "Опираясь на плечо старшей сестры, младшая медленно начинает идти."
      - "Пока сегмент мира рушится, опадающие лепестки красных паучьих лилий подхватываются ветром и начинают кружиться в воздухе."
