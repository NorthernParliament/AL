chapter1:
  rows:
  - text:
      - "По мере того как боевая обстановка продолжала ухудшаться, Энтерпрайз задействовала последние резервы."
  - text:
      - "БАБАХ!"
  - char: "yorktown_ii"
    side: "left"
    text:
      - "Главный барьер, сдерживающий расширение Нараки, становится всё слабее и слабее..."
      - "Я только что получила сообщение от ТБ. До судного дня у нас осталось меньше часа."
      - "Но мне интересно... сможет ли наша оборона вообще продержаться так долго."
  - char: "enterprise"
    side: "right"
    text:
      - "Одиннадцатый час, значит..."
  - char: "yorktown_ii"
    side: "left"
    text:
      - "Энтерпрайз, пора. Активируй систему экстренной связи и скажи Командиру немедленно эвакуироваться из Нараки."
  - char: "enterprise"
    side: "right"
    text:
      - "...Да."
  - text:
      - "БАБАХ!"
  - char: "enterprise"
    side: "right"
    text:
      - "Внимание всем флотам! По плану, Командир вернётся ровно через час!"
      - "Мы БУДЕМ держать оборону до самого последнего момента!"

chapter2:
  rows:
  - char: "yat_sen_rad"
    side: "right"
    text:
      - "Энтерпрайз, это Ят Сен."
  - char: "enterprise"
    side: "left"
    text:
      - "...Ят Сен?"
  - char: "yat_sen_rad"
    side: "right"
    text:
      - "Я прекрасно осведомлена о бедственном положении, в котором вы сейчас находитесь, а также о том, как трудно продержаться еще один час."
      - "В настоящее время мы спешим к вашим позициям со всем основным флотом Империи Дракона. Мы должны добраться до района операции в течение двадцати минут."
      - "Пожалуйста, командуй нами так, как сочтешь нужным."
      - "Кроме того, это также является разрешением на свободное использование имеющегося в нашем распоряжении высокотехнологичного оборудования для удержания линии фронта."
      - "А после, пожалуйста, прикажи своим флотам эвакуироваться из этого района, как только мы прибудем."
      - "Мы находимся в процессе отключения Небесной Башни и переключения Системы Пинфэн в режим дальних бомбардировок."
  - char: "enterprise"
    side: "left"
    text:
      - "Поняла. Спасибо за вашу поддержку. Это битва, которую мы не можем позволить себе проиграть, поэтому сражайтесь от всего сердца, Империя Дракона."
  - char: "yat_sen_rad"
    side: "right"
    text:
      - "Именно так. Для нас на кону тоже стоит слишком многое. Поражение недопустимо!"

chapter3:
  rows:
  - text:
      - "Рядом с Наракой ситуация, казавшаяся безвыходной, быстро менялась к лучшему."
  - char: "an_shan_kai"
    side: "left"
    text:
      - "Разрешение подтверждено. Передовое оборудование разблокировано!"
      - "Сгиньте, мерзкие демоны! Тысячерукий Бодхисаттва изгонит вас!"
  - text:
      - "БАБАХ!"
  - char: "peter_strasser"
    side: "left"
    text:
      - "Это что... управляемые ракеты корабельного базирования?!"
  - char: "an_shan_kai"
    side: "right"
    text:
      - "Именно они! Однако это оборудование невероятно дорого в использовании и обслуживании, поэтому пройдет не меньше трех месяцев, прежде чем я смогу запустить их снова."
      - "Вот почему получить разрешение на этот момент было таким важным делом!"
      - "А теперь, мисс Штрассер, пожалуйста, отведите свой флот назад!"
      - "Клянусь честью Четырех Несокрушимых, мы позаботимся о том, чтобы ни один враг не прошел в течение оставшегося часа!"
  - char: "peter_strasser"
    side: "left"
    text:
      - "Ваша помощь очень ценна. Тем не менее, я продолжу оказывать вам поддержку."
      - "(Технологии, необходимые для интеграции ракет в корабельную оснастку... Никогда бы не подумала, что Империя Дракона первой достигнет этой технологической вехи...)"
      - "(Теперь вы меня заинтересовали!)"

chapter4:
  rows:
  - text:
      - "На другом фронте осажденный флот отступал."
      - "Коррозийная скверна стремительно распространялась по океану, превращая всё новые территории в дополнительные плацдармы для своего безудержного роста."
      - "И вдруг с неба пролился золотой свет, мгновенно испепеляя всех врагов в округе."

chapter5:
  rows:
  - char: "implacable"
    side: "left"
    text:
      - "Стена Авроры..."
      - "...И её Третье Писание тоже?"
  - text:
      - "Столбы света продолжали сыпаться с неба дождем, не оставляя врагам ни единого безопасного убежища для отступления."
      - "В лучах этого ослепительного сияния фронт, обреченный на проигрыш, получил небольшую передышку."
