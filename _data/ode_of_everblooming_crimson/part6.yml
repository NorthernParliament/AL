chapter1:
  rows:
  - char: "observer"
    side: "left"
    text:
      - "Хи-хи, всё идет гладко. Теперь у тебя есть то, что ты хотела."
      - "Всё, что тебе нужно сделать — это спроецировать это в назначенную область Нараки."
      - "Мы действовали так открыто, и всё же мой мейнфрейм ни о чем не подозревает."
      - "Твои методы кажутся мне всё более интригующими, даже с учётом того, что тебе помогает башня."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Оставь это праздное любопытство, Обсервер."
  - char: "observer"
    side: "left"
    text:
      - "Да-да. Твой Командир тоже впечатляет, раз способен работать с Акаги, учитывая её состояние."
      - "Ты знаешь, что происходит в Нараке, и знаешь, насколько малы шансы на успех, но всё равно отправляешь туда Командира..."
      - "Что заставляет тебя идти на такие риски, м?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Повторяю — оставь это праздное любопытство."
  - char: "observer"
    side: "left"
    text:
      - "Оу, как скучно."
      - "Ладно. Я начну подготовку проекции этого сегмента мира."
      - "Мне нужно будет поддерживать соединение с моим мейнфреймом, так что позаботься о моей безопасности, хорошо?"
