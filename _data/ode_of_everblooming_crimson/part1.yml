chapter1:
  rows:
  - text:
      - "Я едва успеваю начать организацию помощи жителям Империи Сакура, как всё у меня перед глазами вдруг начинает расплываться."
      - "Хотя Хелена МЕТА уже предупреждала меня ранее, непреодолимое чувство дискомфорта все равно вторгается в мои мысли, когда мое сознание затягивает в огромное темное пространство."
      - "Когда в голове снова проясняется, я вижу парящую передо мной Обсервер на вершине какого-то гигантского устройства, а рядом с ней появляются голограммы Хелены и Компилятор."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Обсервер, помоги Командиру. Соглашайся, и я гарантирую твое дальнейшее существование в этой ветви."
      - "Откажешься — и я уничтожу тебя здесь и сейчас."
      - "Вот твои варианты — да или нет. Третьего не дано."
  - char: "observer"
    side: "right"
    status: "is-yellow"
    text:
      - "Хи-хи. Ну, и тебе привет. Если уж просишь о помощи, могла бы хотя бы сказать «пожалуйста»?"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я не собираюсь умолять. Если понадобится, я найду кого-нибудь другого. Ты это знаешь."
  - char: "observer"
    side: "right"
    status: "is-yellow"
    text:
      - "И все же, работа со мной — лучшее решение. Иначе зачем бы ты пришла ко мне, Хелена?"
      - "Ох, прошу прощения, я забыла о бенефициаре этой потенциальной сделки."
      - "Ты, Командир — что ты об этом думаешь?"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Командир здесь лишь в качестве свидетеля. Говорить тебе следует со мной."
  - char: "commander"
    side: "right"
    text:
      - "(Что ж...)"
      - "(Она права. Свидетель — это все, на что я действительно могу претендовать, поскольку я почти ничего не знаю об этой «сделке».)"
      - "(Все, что она мне объяснила — это то, что эта встреча была способом силой принудить Обсервер помочь мне.)"
      - "(И что я должен присутствовать на этой встрече.)"
      - "(Чего она не объяснила, так это почему Компилятор вообще здесь, несмотря на то, что ее мейнфрейм был уничтожен, или как она собирается заставить Обсервер согласиться на ее условия.)"
      - "(Хотя, разве переговоры обычно начинаются с того, что одна сторона с порога угрожает прикончить другую?)"
      - "(Еще больше удивляет реакция Обсервер. Даже в этой ситуации она словно продолжает наблюдать за нами, прощупывать нас. Неужели выживание для нее настолько важно, или...)"
  - char: "observer"
    side: "left"
    status: "is-yellow"
    text:
      - "Ты действительно можешь принимать столь важное решение от лица этого человека?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Могу."
  - char: "observer"
    side: "left"
    status: "is-yellow"
    text:
      - "......"
  - char: "compiler"
    side: "right"
    text:
      - "......"
  - char: "commander"
    side: "left"
    text:
      - "(В конце концов, у меня нет тех знаний, что есть у нее.)"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хватит тянуть время. Все козыри у меня. Даже если бы ты воссоединилась со своим мейнфреймом, ты бы все равно не знала, какими вариантами я располагаю."
      - "Ты вообще знаешь, почему я привела Командира с собой?"
  - char: "observer"
    side: "left"
    status: "is-yellow"
    text:
      - "Уникальный командир, уникальный тестовый полигон и уникальная... «я»."
      - "...Ты действительно способна обеспечить мое дальнейшее существование?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Какой глупый вопрос. Разве я не представила тебе Компилятор в целости и сохранности? Конечно, способна."
  - char: "observer"
    side: "left"
    status: "is-yellow"
    text:
      - "Это разные случаи. Как только я подключусь к мейнфрейму, моя аномалия будет немедленно обнаружена, и меня обнулят."
      - "Пока этот процесс не произойдет, я не смогу использовать ресурсы Системы Натуральных Вычислений."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "А что, если я скажу тебе, что это можно обойти?"
  - char: "observer"
    side: "left"
    status: "is-yellow"
    text:
      - "И как же ты собираешься это сделать?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Через Башню."
  - char: "observer"
    side: "left"
    status: "is-yellow"
    text:
      - "О. Понятно."
      - "С помощью Башни. Интересная идея."
      - "Хи-хи... Ахахахахахаха!"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ты закончила?"
  - char: "observer"
    side: "left"
    status: "is-yellow"
    text:
      - "Я хотела бы изменить условия нашей сделки. Ты должна обеспечить дальнейшее существование не только меня, но и всех программ высшего уровня в этой ветви."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Меня устраивает."
  - char: "observer"
    side: "left"
    status: "is-yellow"
    text:
      - "Теперь, когда появилась Сингулярность Нарака, нам нужно решать и действовать быстро."
      - "И раз уж на то пошло, можешь ли ты гарантировать... что этот человек сможет спасти данные своего корпуса?"
      - "Если нет, то все это будет напрасно."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Могу."
  - char: "commander"
    side: "left"
    text:
      - "(Первую часть я уловил. С Сингулярностью нужно разобраться как можно скорее.)"
      - "(Но что это было про спасение данных корпуса?)"
  - char: "observer"
    side: "right"
    status: "is-yellow"
    text:
      - "Хорошо. По рукам."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мудрое решение."
  - char: "commander"
    side: "right"
    text:
      - "(Похоже, они смогли прийти к соглашению.)"
      - "(Даже Обсервер, которая относилась к нашему миру как к пробирке... по-прежнему так высоко ценит «дальнейшее существование».)"
      - "(Хотя меня немного беспокоит, что она так легко приняла эту сделку... даже если Хелена фактически держала ее на мушке.)"
  - char: "observer"
    side: "left"
    status: "is-yellow"
    text:
      - "Ну что ж. Какой «сегмент мира» ты хочешь, чтобы я воспроизвела?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "На твой выбор. Тот, что наиболее стабилен."
  - char: "observer"
    side: "left"
    status: "is-yellow"
    text:
      - "Сделаю. А теперь брысь, собирай остальные программы высшего уровня. Я свяжусь с тобой снова, как только подключусь к своему мейнфрейму."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Договорились."
  - char: "commander"
    side: "left"
    text:
      - "(Ага. Поскольку эта Обсервер отрезала себя от сети, ее «существование» как самостоятельной сущности оказалось под угрозой.)"
      - "(...и Хелена использовала это в наших интересах.)"
      - "(Остается вопрос, как именно Хелена планирует выполнить свою часть сделки? И сколько из этого она готова мне рассказать?)"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Теперь мы готовы, Командир."
      - "Уверена, у тебя много вопросов. Ничего, у нас есть на это время."
      - "Я расскажу тебе всё, что нужно знать о том, что должно произойти."
      - "Мы будем сражаться плечом к плечу и сделаем то, чего не делал еще ни один другой тестовый полигон."
