chapter1:
  rows:
  - text:
      - "Девушки-корабли плыли по Нараке под предводительством Нагато."
      - "Силы Нагато легко справлялись с врагами, которые нападали на них по пути. Её МЕТА-союзницам даже не было нужды вмешиваться."
      - "Враги мало заботили её — что действительно беспокоило, так это чувство одержимости, которое она время от времени ощущала исходящим из Нараки."

chapter2:
  rows:
  - char: "amagi_false_m"
    side: "right"
    status: "is-red"
    text:
      - "Амаги должна быть возвращена к жизни."
      - "Почему? Потому что она лучше, чем кто-либо другой, подходит на роль лидера нашей страны."
      - "Никто не сможет меня остановить. Ни ты, ни даже сама Амаги."
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я так и знала... Ты заимствуешь свою личность у Акаги."

chapter3:
  rows:
  - char: "amagi_false_m"
    side: "right"
    status: "is-red"
    text:
      - "Где есть причина, там есть и следствие, и наоборот."
      - "Фальшивка — это следствие, оригинал — причина. Это вполне логично."
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Как бы то ни было, подделка никогда не станет оригиналом."
      - "Всё, что ты создала — это пустые оболочки, пленники концепции."

chapter4:
  rows:
  - char: "amagi_false_m"
    side: "right"
    status: "is-red"
    text:
      - "Стала. У меня её внешность, воспоминания, личность, образ мышления, даже её манеры."
      - "Амаги — это всё, чем я являюсь."
      - "В прошлом я бы НИКОГДА так не поступила. Однако ты говоришь с моей будущей версией."
      - "Да... Я и есть Амаги."
      - "Я сестра Акаги и та, кто больше всего достойна возглавить Империю Сакуры."
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты лишь обманываешь себя, разжигаешь свою одержимость и идешь по пути безумия."

chapter5:
  rows:
  - char: "amagi_false_m"
    side: "right"
    status: "is-red"
    text:
      - "Нашей стране нужен истинный лидер. Возрождение Амаги станет первым шагом к достижению этой цели."
      - "Нарака, внемли моему зову и поглоти всё!"
  - text:
      - "БАБАХ!"
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Довольно. Твои попытки обмануть меня напрасны."

chapter6:
  rows:
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "(Акаги не создавала Нараку по собственной воле. Ею просто манипулировали фальшивые слияния.)"
      - "(Акаги так долго плела интриги, только чтобы оказаться пешкой в руках монстра, порожденного её собственной одержимостью.)"
      - "(Затем монстр воспользовался нашими же разумами...)"
      - "(Какой ужасный поворот.)"
  - text:
      - "БАБАХ!"
  - char: "kasumi_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Приближается группа врагов. Кажется, они нас засекли."
  - char: "jintsuu_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Похоже, слияния способны подключаться к Ватацуми. Должно быть, именно так они могут свободно управлять окружением в Нараке."
  - char: "nagato_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Они знают, что бежать некуда, поэтому идут прямо на нас."
      - "Скоро появится и кукловод..."

chapter7:
  rows:
  - char: "amagi_false_m"
    side: "right"
    status: "is-red"
    text:
      - "Ну-ну. Вот и вы, слетелись, как мотыльки на пламя."
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я знаю, что ты такое. Твой блеф больше не работает."
  - char: "amagi_false_m"
    side: "right"
    status: "is-red"
    text:
      - "О?"
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты существо, рожденное из одержимости. И ты несешь эту одержимость в себе."
      - "Ты отвергла существование Амаги и зашла так далеко, что попыталась заменить её концепцию, «возродив её»."
      - "Ты больше не будешь присваивать себе концепцию Амаги, мерзкий монстр!"
  - char: "amagi_false_m"
    side: "right"
    status: "is-red"
    text:
      - "Кажется, ты услышала это от Нараки."
      - "Тогда ты уже должна знать, что меня не остановить."
      - "Я СТАНУ Амаги. На самом деле, меня уже признают как Амаги."
      - "Тех, кто меня не признает, вроде тебя, нужно просто стереть."
      - "Тогда никто не усомнится в том, что я — Амаги."
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты безнадежна."
      - "Я жалею, что вообще заговорила с тобой."
      - "Ты — воплощение одержимости и должна исчезнуть, как и подобает тебе!"
  - char: "amagi_false_m"
    side: "right"
    status: "is-red"
    text:
      - "Давай! Тогда заставь меня исчезнуть, мелкая соплячка!"
      - "Ахахахахаха!"

chapter8:
  rows:
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "О громовая лиса, скачи меж мирами духов!"
  - text:
      - "БАБАХ!"
  - char: "amagi_false_m"
    side: "right"
    status: "is-red"
    text:
      - "Гха! Как?! Откуда у простой временной МЕТА такая сила?!"
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Проигравший не заслуживает знания победителя."
      - "Скажу тебе лишь одно — Амаги будет возрождена. Не тобой, а Командиром."
      - "Присвоив её концепцию и притворяясь ею, ты лишь отсрочила её возрождение!"
  - char: "amagi_false_m"
    side: "right"
    status: "is-red"
    text:
      - "......"
      - "Какая чушь..."
      - "Я лучше, чем кто-либо другой, знаю, что всё не так просто, как ты это преподносишь!"
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты полностью открыта!"
  - text:
      - "БАБАХ!"

chapter9:
  rows:
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хиэй?! Это правда ты?"
      - "Что с тобой случилось?"
  - char: "hiei_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я в порядке, моя госпожа! Давайте сначала сосредоточимся на том, чтобы одолеть её!"
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Да. Следующий удар положит этому конец!"
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Постойте, госпожа Нагато! С ней что-то не так!"
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Её концепция... она меняется. Она перестала быть Амаги."
      - "Тогда почему... она всё ещё здесь?"

chapter10:
  rows:
  - char: "amagi_false_m_rad"
    side: "right"
    status: "is-red"
    text:
      - "Хе-хе-хе... Хахахахаха!"

chapter11:
  rows:
  - char: "akagi_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хочешь столкнуться с корнем этой одержимости, да?"
      - "Отлично! Тогда позволь мне исполнить твое желание!"
      - "Как тебе это? Теперь ты довольна?"
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Неужели... неужели она использовала Ватацуми, чтобы воплотить собственную концепцию?"
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Никогда прежде не видела ничего подобного..."
  - char: "nagato_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Эти фантомы рядом с тобой..."
      - "Нет... У тебя есть как остатки души Амаги, ТАК И душа Каги!"
  - char: "akagi_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хи-хи. О чем это ты сейчас?"
      - "Амаги больше нет. Моей сестры больше нет."
      - "Она больше никогда не вернется, так почему же ты до сих пор жива?"
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "А? Что это за логический скачок такой?"
  - char: "nagato_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Не трать время на попытки понять воплощение одержимости, Хиэй."
  - char: "akagi_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хи-хи... Амаги больше нет в этом мире, поэтому я любезно отправлю вас всех на тот свет!"
      - "Как только с этим будет покончено... я присоединюсь к вам."
      - "Тогда всё встанет на свои места."

chapter12:
  rows:
  - char: "akagi_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хахахаха! АХАХАХАХАХА!"
