chapter1:
  rows:
  - text:
      - "Я прибываю в точку сбора вместе с сакуранками. Мы пересекаемся с отрядом Сэндай, которому только что удалось оторваться от нападавших."
  - char: "sendai"
    side: "left"
    text:
      - "Прости, Амаги. Я недооценила их огневую мощь и ничего не смогла им сделать..."
  - char: "amagi"
    side: "right"
    text:
      - "Главное, что вы все в порядке. Они застали вас врасплох — здесь вообще не должно быть врагов."
  - char: "sendai"
    side: "left"
    text:
      - "Спасибо на добром слове. Так кто эти люди?"
  - char: "amagi"
    side: "right"
    text:
      - "Наши гости и наше надежное подкрепление."
  - char: "sendai"
    side: "left"
    text:
      - "У тебя снаряжение авианосца, прямо как у Хосё... Ты?.."
  - char: "akagi"
    side: "right"
    text:
      - "Да. Я авианосец, как и Дзуйкаку с Рюхо."
      - "Я потрясена, что коррозия добралась даже до мира Амаги..."
      - "Дзуйкаку, Рюхо, покажите им, на что способен наш авианосный флот!"
  - char: "zuikaku"
    side: "left"
    text:
      - "Есть!"
  - char: "ryuuhou"
    side: "right"
    text:
      - "Есть!"
  - char: "akagi"
    side: "left"
    text:
      - "Сэндай, забери тяжелораненых и отведи их в тыл. Они не годятся для этого боя."
      - "Дзинцу, ты возглавишь флот сопровождения. Не отходите слишком далеко и следите за угрозами как над водой, так и под ней."
      - "Кага, ты идешь со мной. Я не подпущу ни одну из этих тварей к тебе."
      - "Наконец, пусть девочки из других фракций объединятся с флотом сопровождения. Такой план годится, Командир?"
  - char: "helena"
    side: "right"
    text:
      - "(Она полностью вернулась в свое прежнее состояние.)"
  - char: "memphis"
    side: "left"
    text:
      - "(Но разве она должна раздавать приказы? Это ведь ТВОЙ флот, Командир.)"
  - char: "commander"
    side: "right"
    text:
      - "Всё в порядке. Реальные они или нет, это воды сакуранцев, и Акаги знакома с ними лучше меня."
      - "Она может взять на себя командование в этом бою."
  - char: "akagi"
    side: "left"
    text:
      - "О, Командир!"

chapter2:
  rows:
  - char: "kagabb"
    side: "left"
    text:
      - "Она ведет нас в бой? Эта навязчивая женщина?"
  - char: "sendai"
    side: "right"
    text:
      - "Черт... Прости, Амаги. Тело среагировало быстрее головы."
  - char: "akagi"
    side: "left"
    text:
      - "Угх..."
      - "Прости меня, сестра... Я никуда в этом не гожусь..."
  - char: "amagi"
    side: "right"
    text:
      - "Нет, ты отлично справляешься. Это великолепное построение."
  - char: "akagi"
    side: "left"
    text:
      - "Правда?"
  - char: "amagi"
    side: "right"
    text:
      - "Помни слова Командира. Ты командуешь этим боем."
      - "Сейчас твой звездный час. Покажи нам, как сражаются авианосцы будущего."
  - char: "akagi"
    side: "left"
    text:
      - "Хорошо! Я покажу!"
      - "Приготовиться всем! Бой начинается прямо сейчас!"

chapter3:
  rows:
  - text:
      - "БАБАХ!"
  - char: "akagi"
    side: "left"
    text:
      - "Ха! Обратитесь в пепел!"
      - "Осталась только южная группа. Эти бесформенные сгустки коррозии просто жалки."
  - char: "naka"
    side: "right"
    text:
      - "Огооо... Ты невероятна, Акаги!"
  - char: "matsukaze"
    side: "left"
    text:
      - "Да, её словно подменили в одночасье."
  - char: "oite"
    side: "right"
    text:
      - "Мощь авианосца внушает благоговейный трепет."

chapter4:
  rows:
  - text:
      - "Вскоре все вторгшиеся порождения коррозии оказываются уничтожены."
      - "Настроение Акаги изменилось на сто восемьдесят градусов — она улыбается, поворачиваясь ко мне и Амаги в ожидании одобрения."
      - "Но тут случается трагедия..."

chapter5:
  rows:
  - char: "helena"
    side: "left"
    text:
      - "Засада! Берегись!"
  - char: "commander"
    side: "right"
    text:
      - "Откуда они взялись?!"

chapter6:
  rows:
  - text:
      - "Издалека прямо к моему командному кораблю несется багровое свечение."
  - char: "memphis"
    side: "left"
    text:
      - "Командир!"

chapter7:
  rows:
  - text:
      - "Девочки тут же бросаются наперерез, преграждая путь объекту."
  - char: "akagi"
    side: "left"
    text:
      - "Эта аура... Неужели это?.."
  - text:
      - "БАБАХ!"
  - char: "kagabb"
    side: "left"
    text:
      - "Трусы! Прибегли к грязным уловкам, да?!"

chapter8:
  rows:
  - text:
      - "Кага наводит свои орудия и дает залп, но багровый свет меняет курс и уклоняется."
      - "Он наводится на новую цель — Амаги — и ускоряется."
  - char: "akagi"
    side: "left"
    text:
      - "Я знала, что это ты! Я не позволю тебе причинить им вред!"

chapter9:
  rows:
  - text:
      - "Акаги бросается к сестре и встает между ней и багровым светом, закрывая её собственным телом."

chapter10:
  rows:
  - text:
      - "Прежде чем она успевает произнести хоть слово, сегмент мира мгновенно окутывает тьма."
      - "И всё же до моих ушей доносится слабый голос."
  - char: "akagi_rad"
    side: "right"
    text:
      - "Командир... Прости меня..."
      - "По крайней мере, это достойный конец для той, кто совершил столь тяжкие грехи во имя одержимости."
      - "Спасибо... Спасибо, что был добр ко мне до самого конца..."
      - "Защити... их..."
      - "Кагу, Амаги и всех остальных... Защити их..."

chapter11:
  rows:
  - text:
      - "Когда свет возвращается, Акаги уже нигде нет."
