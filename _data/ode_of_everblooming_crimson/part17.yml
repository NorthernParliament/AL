chapter1:
  rows:
  - text:
      - "Когда Акаги успокоилась, она организовала встречу для них и для меня , на верхнем этаже особняка."
      - "Я велю остальной части флота подождать в гостевой комнате, а сам поднимаюсь по лестнице вместе с  Акаги."
      - "Наша миссия — вопрос жизни и смерти: мы должны восстановить данные корпуса Амаги и нейтрализовать Сингулярность Нарака."

chapter2:
  rows:
  - text:
      - "Амаги занимает главное место. По бокам от неё сидят Акаги и линкор Кага."
  - char: "commander"
    side: "left"
    text:
      - "(Что касается Амаги этого мира, для неё мы с ней совершенно чужие люди.)"
      - "(И всё же почему-то у меня возникает чувство, что она знает, кто я такой.)"
  - char: "amagi"
    side: "right"
    text:
      - "Должно быть, ты и есть... Командир. Спасибо, что проделал весь этот путь."
      - "Хотя Акаги рассказала мне, откуда вы прибыли, она ещё не упомянула, в чем именно заключается цель вашего путешествия."
      - "Мне сказали, что ты здесь, чтобы «спасти меня», но, если позволишь спросить, что это значит?"
  - char: "commander"
    side: "left"
    text:
      - "Спасибо, что рассказала ей, Акаги. Так мы можем перейти сразу к делу."
      - "Амаги, ты страдаешь от дефекта корпуса, который невозможно исцелить. Однажды он унесет твою жизнь, не так ли?"
  - char: "amagi"
    side: "right"
    text:
      - "......"
      - "Да. Твои слова — правда."
  - char: "kagabb"
    side: "left"
    text:
      - "Что?! Амаги! Ты говорила мне, что у тебя просто слабое здоровье!"
      - "Что ещё за «дефект корпуса», который «однажды унесет твою жизнь»? Ты никогда ничего подобного не говорила!"
  - char: "amagi"
    side: "right"
    text:
      - "Я надеялась, что смогу сохранить это в тайне."
      - "Очевидно, в том мире, откуда вы пришли, эта тайна в итоге раскрылась."
  - char: "akagi"
    side: "left"
    text:
      - "Сестра... Ты всё это время знала, насколько всё плохо."
  - char: "amagi"
    side: "right"
    text:
      - "Прости меня, Акаги."
      - "Я знала, что от судьбы не уйти. Я лишь хотела уладить кое-какие дела ради тебя перед своим уходом. Я не пыталась утаить от тебя правду."
  - char: "commander"
    side: "left"
    text:
      - "Кроме того, этот мир нереален. Это искусственно созданный сегмент внутри Сингулярности, прозванной «Нарака»."
      - "Мы с Акаги пришли сюда ради двух вещей — возродить вас обеих и спасти мир."
      - "Если всё пройдет хорошо, ты, Амаги, сможешь жить в новом будущем."
  - char: "amagi"
    side: "right"
    text:
      - "......"
  - char: "kagabb"
    side: "left"
    text:
      - "Погоди-ка. Этот мир — какая-то фальшивая копия? И что ещё за «Сингулярность»?"
      - "Ты ведь просто дуришь нас, да?"
  - char: "akagi"
    side: "right"
    text:
      - "Нет, Кага. Всё, что сказал Командир — правда."
  - char: "kagabb"
    side: "left"
    text:
      - "Пф. В этом нет никакого смысла, и я даже не хочу его искать."
      - "Даже если это правда, мне плевать. Я ухожу."
  - char: "commander"
    side: "right"
    text:
      - "Постой. Останься и послушай ещё немного."
  - char: "kagabb"
    side: "left"
    text:
      - "Да поняла я. Я никому об этом не расскажу."
  - char: "commander"
    side: "right"
    text:
      - "Я хотел сказать не это. Я хочу, чтобы с нами отправились вы обе — и Амаги, И ты."
  - char: "kagabb"
    side: "left"
    text:
      - "Чего?"
      - "«Отправились с вами»?"
  - char: "akagi"
    side: "right"
    text:
      - "Да. В нашем мире ты пожертвовала своей жизнью в надежде вернуть мне рассудок."
  - char: "amagi"
    side: "left"
    text:
      - "Кага, пожалуйста, давай выслушаем то, что они хотят сказать. К тому же, у меня есть вопросы. Решим уже после этого."
  - char: "kagabb"
    side: "right"
    text:
      - "Ладно. Будь по-твоему."
  - char: "amagi"
    side: "left"
    text:
      - "Командир, ты говоришь, что хочешь спасти меня и Кагу. Что именно это подразумевает?"
  - char: "commander"
    side: "right"
    text:
      - "Говоря простым языком,  мы собираемся забрать вас с собой из этого места."
      - "(Хелена, как слышно? Мне понадобится твоя помощь, чтобы объяснить наш план.)"
  - char: "helena_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "(Громко и четко. Продолжай говорить и посмотрим, куда зайдет беседа.)"
  - char: "amagi"
    side: "right"
    text:
      - "Боюсь, я не совсем понимаю. Минуту назад ты сказал, что этот мир нереален — что это всего лишь «сегмент»."
      - "Если мы тоже лишь вымысел, как вы собираетесь перенести нас в реальный мир?"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Сразу в корень проблемы... Стоит ли мне сначала рассказать о её корпусе?)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Корпус можно создать одним из двух способов — либо с помощью одного только Куба Мудрости, либо с помощью Ватацуми в паре с Кубом Мудрости.)"
      - "(При использовании только Куба, если у тебя есть данные для связи с концепцией, сам Куб должен обеспечивать энергию для тела.)"
      - "(Это значит, что если ты подключаешься к данным с помощью одного лишь Куба для воплощения корпуса, используемый тобой Куб должен быть неповрежденным.)"
      - "(С другой стороны, если использовать и Куб, и Ватацуми, всё, что нужно Кубу — это данные для связи с концепцией.)"
      - "(Иными словами, Куб создает душу, а Ватацуми берет на себя всё остальное — тело.)"
      - "(Что касается нашего случая, те, кто покинут этот сегмент, будут извлечены в виде данных. Иными словами — в виде душ.)"
      - "(Поместив их души в специальное вместилище, можно использовать Ватацуми для создания тел, в которые эти души будут помещены, что позволит им снова жить как девушкам-кораблям.)"
      - "(По сути, это и есть их возрождение.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Это СЛИШКОМ большой объем информации за один раз.)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Амаги проницательна. Она поймет, если ты упустишь детали.)"
      - "(Если только... ты не имел в виду, что не всё из этого уловил.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Нет, всё в порядке. Я запомнил.)"
  - char: "commander"
    side: "left"
    text:
      - "Прежде всего, давай поговорим о том, как создается корпус."

chapter3:
  rows:
  - char: "amagi"
    side: "left"
    text:
      - "Теперь я понимаю. Мои данные — мою душу — можно пересадить в новое тело, созданное в вашем мире, чтобы подарить мне новую жизнь."
  - char: "akagi"
    side: "right"
    text:
      - "Именно! Это сработает!"
  - char: "amagi"
    side: "left"
    text:
      - "Надеюсь на это. Раз уж вы взяли на себя труд воссоздать целый мир, вы, должно быть, более чем готовы ко всему, что влечет за собой эта операция."
      - "Однако, судя по твоим словам, разве у меня не останутся воспоминания лишь о том, что произошло до сегодняшнего дня?"
      - "Учитывая, что мне в этом мире осталось недолго, для меня это не проблема..."
      - "Но в случае с Кагой, разве она не будет практически чужим человеком по сравнению с той, которую вы знали и бок о бок с которой сражались?"
  - char: "commander"
    side: "right"
    text:
      - "(Это всё равно что перенести себя из прошлого в будущее, пропустив всё, что произошло за это время.)"
      - "(Наша цель — возродить Кагу, но если мы сделаем это таким образом, она не будет тем же человеком, каким была в день своей гибели.)"
      - "Нам понадобилась бы душа из времени после гибели Амаги..."
  - char: "akagi"
    side: "left"
    text:
      - "Нет, Командир, такой вариант на самом деле может быть даже лучше."
      - "Для Каги будет лучше... если она забудет о времени, проведенном со мной."
  - char: "zuikaku"
    side: "right"
    text:
      - "Ты правда так думаешь? То есть, она же твоя сестра, она..."
  - char: "akagi"
    side: "left"
    text:
      - "Достаточно, Дзуйкаку. Кага и так отдала мне слишком много за одну жизнь."
  - char: "amagi"
    side: "right"
    text:
      - "Твоя... сестра..."
      - "Не могла бы ты рассказать мне, как Кага лишилась жизни?"
  - char: "akagi"
    side: "left"
    text:
      - "......"
  - char: "ryuuhou"
    side: "right"
    text:
      - "Ну, это... Я не уверена, стоит ли..."
  - char: "akagi"
    side: "left"
    text:
      - "Всё в порядке, Рюхо. Я сама всё ей расскажу."
      - "Я проводила ритуал с целью возродить тебя, Амаги. А затем..."

chapter4:
  rows:
  - char: "kagabb"
    side: "right"
    text:
      - "...Что?"
      - "Я это сделала? Человек, которого ты описываешь — это действительно была я?"
      - "Хех... Интересно. Даже представить себе не могу, что произошло за время между этим моментом и тем."
  - char: "amagi"
    side: "left"
    text:
      - "Пораженный коррозией ритуал под увядшей Священной Сакурой..."
      - "Сказать по правде, вчера мне приснился именно такой сон."
  - char: "akagi"
    side: "right"
    text:
      - "Правда? Но... Как такое вообще возможно?.."
  - char: "amagi"
    side: "left"
    text:
      - "Я не знаю."
  - char: "commander_rad"
    side: "right"
    text:
      - "(Что это значит, Обсервер? Разве ты не говорила, что этот сегмент основан на реальных данных?)"
  - char: "observer_rad"
    side: "left"
    text:
      - "(Говорила. Система Натуральных Вычислений сгенерировала этот сегмент со стопроцентной точностью, ничего не добавляя и не убавляя.)"
  - char: "commander_rad"
    side: "right"
    text:
      - "(В этом нет смысла. Как Амаги могла увидеть во сне то, что произойдет в будущем? Она не Синано — она не черпает силу из Ватацуми.)"
  - char: "helena_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "(Я изучу этот вопрос. Продолжай миссию.)"
  - char: "amagi"
    side: "right"
    text:
      - "В таком случае, вполне логично предположить..."
      - "Если сон, который я видела вчера, был видением из вашего будущего, значит ли это, что и все остальные мои сны тоже были видениями?"
      - "Командир, я должна спросить — мы никогда не встречались раньше?"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(У Амаги... бывают вещие сны?)"

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Амаги... уже встречала меня где-то раньше?)"

chapter7:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Амаги... знала всё с самого начала?)"

chapter8:
  rows:
  - char: "amagi"
    side: "right"
    text:
      - "Хи-хи. Твоя способность сохранять спокойствие поистине заслуживает изучения."
      - "Что ж, я задала все свои вопросы."
      - "Вы прошли через все эти трудности, чтобы вернуть меня к жизни, и я с радостью принимаю это."
      - "Я доверяю вам обоим — Командир, Акаги."
      - "Кага, я бы хотела, чтобы ты пошла со мной."
      - "Под чем я подразумеваю, что ты просто обязана пойти. Боюсь, у тебя нет выбора."
  - char: "kagabb"
    side: "left"
    text:
      - "Ха. Быстро же ты им поверила."
      - "Ты всё это время просто прикидывалась незнающей, чтобы втянуть меня в это дело."
  - char: "amagi"
    side: "right"
    text:
      - "Прошу тебя, ты слишком много надумываешь. Я приняла это решение только сейчас."
  - char: "kagabb"
    side: "left"
    text:
      - "Ладно. К тому же, зная, что поставлено на карту, ты бы наверняка потащила меня за собой, даже если бы я отказалась."
  - char: "amagi"
    side: "right"
    text:
      - "Хи-хи. Значит, мы пришли к соглашению, Командир."

chapter9:
  rows:
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "naka_rad"
    side: "right"
    text:
      - "Амаги, у нас проблемы! Странные враги атакуют тренировочную зону!"
  - char: "amagi"
    side: "left"
    text:
      - "Странные враги? Какова обстановка?"
  - char: "naka_rad"
    side: "right"
    text:
      - "Мы отбиваемся, отступая! Сэндай ранена!"
  - char: "amagi"
    side: "left"
    text:
      - "Поняла. Продолжайте отступать."
  - char: "naka_rad"
    side: "right"
    text:
      - "Вас поняла!"

chapter10:
  rows:
  - char: "commander_rad"
    side: "left"
    text:
      - "(Теперь ещё и враги появились? Опасный же это сегмент мира.)"
  - char: "observer_rad"
    side: "right"
    text:
      - "(Они не являются его частью. Граница сегмента была прорвана.)"
      - "(Они — как и коррозия — вторгаются из Нараки. На твоем месте я бы поскорее отступила, потому что сегмент долго не продержится.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Черт... Хелена, как там остальные?)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Ситуация патовая. Пока что их положение не выглядит критическим.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Хорошо... Тогда я собираюсь спасти их.)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Ладно. Давай сделаем по-твоему.)"
  - char: "amagi"
    side: "left"
    text:
      - "Подумать только, это случилось как раз тогда, когда мы собирались уходить..."
      - "Акаги, как бы ты поступила в этой ситуации?"
  - char: "akagi"
    side: "right"
    text:
      - "Этот мир — всего лишь вымысел. Как только мы уйдем, он исчезнет."
      - "Наши главные цели — спасти тебя и Кагу, разобраться с Сингулярностью и избегать любых ненужных сражений. Однако..."
  - char: "amagi"
    side: "left"
    text:
      - "......"
  - char: "akagi"
    side: "right"
    text:
      - "Я вела за собой нашу страну, и здесь с нами Командир. Я не собираюсь поворачиваться спиной к друзьям, нуждающимся в помощи."
  - char: "amagi"
    side: "left"
    text:
      - "Это хорошо. Командир, а что думаешь ты?"
  - char: "commander"
    side: "right"
    text:
      - "То, кем я являюсь, не меняется от того, нахожусь ли я в реальном мире или фальшивом."
      - "То же самое касается моих друзей и союзников."
      - "Мои моральные принципы не прогибаются просто потому, что мне так удобно."
      - "Я стремлюсь сделать всё, что в моих силах, даже если в конечном счете результат не будет идеальным."
      - "Короче говоря — я хочу им помочь."
  - char: "amagi"
    side: "left"
    text:
      - "Спасибо. Это чудесный ответ."
      - "(Мы те, кто мы есть, независимо от того, фальшивый наш мир или реальный, а значит, мы должны помочь.)"
      - "(Именно такой склад ума делает тебя тобой. И именно поэтому Акаги так к тебе привязана.)"
      - "Идем, Командир."
