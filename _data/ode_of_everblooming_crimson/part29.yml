chapter1:
  rows:
  - text:
      - "После того как Командир и Нагато вошли в Нараку, корабли, оставшиеся снаружи, быстро выстроились в боевой порядок под командованием Энтерпрайз."
      - "Как и ожидалось, сила Нараки со временем возрастала. По мере того как образовывалось всё больше разломов, оттуда начали хлынуть всё более могущественные враги."
  - char: "tb_rad"
    side: "right"
    text:
      - "Приближается враждебная сущность — скорее всего, командная единица. Вероятен высокий уровень угрозы; пожалуйста, действуйте с осторожностью."
  - text:
      - "<img src='../../img/bg/r/11.png' class='inline-img' alt=''>"
  - char: "roaring_beast"
    side: "right"
    status: "is-red"
    text:
      - "КРААААААР! КРАААААААР!"
  - char: "harbin"
    side: "left"
    text:
      - "Ха-ха-ах! Вот ЭТО та самая охота, на которую я подписывалась!"
  - char: "implacable"
    side: "right"
    text:
      - "Какая внушительная аура... Всем сохранять бдительность!"
  - char: "peter_strasser"
    side: "left"
    text:
      - "Эта штука довольно огромная, но к чему это? Просто делает её более крупной мишенью."
      - "Пусть авангард отступит! Мы сокрушим эту тварь подавляющей мощью авиации!"

chapter2:
  rows:
  - char: "watarase"
    side: "right"
    text:
      - "Простите, что вмешиваюсь, но, пожалуйста, позвольте представителям Империи Сакуры разобраться с этим."
  - char: "daisen"
    side: "left"
    text:
      - "В конце концов, мы лучше всех знакомы с источником силы этого чудовища."
      - "У этих оскверненных тварей действительно есть свои слабости, но..."
      - "Расположение этих уязвимых мест, как и способы их атаки, могут сильно отличаться от того, что вы ожидаете."
      - "Я буду более чем рада наглядно вам это продемонстрировать."
  - char: "ayase"
    side: "right"
    text:
      - "Г-госпожа Дайсэн?! Поверить не могу, что столь прославленная особа пришла нам на помощь..."
  - char: "daisen"
    side: "left"
    text:
      - "Я уже закончила свои дела, поэтому, разумеется, пришла помочь."
  - char: "watarase"
    side: "right"
    text:
      - "В таком случае, позволь мне возглавить атаку!"

chapter3:
  rows:
  - char: "suzunami"
    side: "left"
    text:
      - "О, эм, позволь мне тоже тебя сопровождать!"
  - char: "watarase"
    side: "right"
    text:
      - "Я справлюсь и без этого, Судзунами."
      - "Позволь мне показать тебе техники, которым я научилась у Ундзэн."
  - char: "scylla"
    side: "left"
    text:
      - "Будь осторожна там, мисс Ватарасэ."
  - char: "watarase"
    side: "right"
    text:
      - "Взаимно, Сцилла."
  - char: "fu_shun"
    side: "left"
    text:
      - "Ух! Похоже, здесь всё начинает становиться интересным!"
      - "Погнали-погнали-погнали!"

chapter4:
  rows:
  - char: "watarase"
    side: "right"
    text:
      - "Струящейся тенью, пронзи волны!"
