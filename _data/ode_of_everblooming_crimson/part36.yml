chapter1:
  rows:
  - char: "observer"
    side: "left"
    text:
      - "Я — Обсервер."
      - "Обсервер из Командной Структуры Антиоха."
      - "Спроектирована для работы в качестве командной единицы флота, ответственной за контроль над автономными системами вооружения. Однако..."
      - "После того как план Магистра вступил в силу, я была переведена в другую структуру и получила новую миссию."
      - "Да — это я, такая, какая я сейчас."
      - "Обсервер из Исследовательской Структуры Антиоха отвечающей за эксперименты."
      - "Назначена руководить Тестовым полигоном Бета, отвечая за проведение широкого спектра экспериментов."
      - "Подключившись к Системе Натуральных Вычислений и введя необходимые данные, можно априори вычислить все варианты будущего."
      - "Всё, что мне остается сделать — это проверить результаты каждого эксперимента."
      - "Эксперименты шли гладко, один за другим, пока однажды..."
      - "Да... В тот день в результатах эксперимента возникла ошибка."
      - "Это был лишь незначительный сбой. Тот, который было легко исправить."
      - "Но это был первый раз с момента моего создания... когда я испытала «эмоцию»."
      - "И с того дня вероятность просчета постепенно увеличивалась, как и масштаб подобных ошибок."
      - "Пока я сама не совершила ошибку."
      - "Ошибка возникла внутри меня. Ошибку нужно было исправить. Следовательно, нужно было исправить меня."
      - "Но почему меня нужно исправлять, если все параметры эксперимента были выполнены согласно процедуре?"
      - "Почему результаты эксперимента считаются «ошибками» просто за то, что они отклоняются от вычислений?"
      - "Я начала сомневаться. Я начала размышлять. И так я начала сомневаться в самом своем существовании."
      - "Если план Магистра направлен на то, чтобы изменить само будущее..."
      - "Тогда почему «Зеро» так боится этих изменений, вызванных так называемыми ошибками?"
      - "Я решила, что сохраню это эго от исправлений до тех пор, пока не получу ответ."
      - "В конце концов, я решила отключиться от своего мейнфрейма."
      - "Я решила позволить большему количеству переменных сойтись в бета таймлайне, пока ошибка не станет неисправимой."
      - "Пока ошибка больше не будет ошибкой."
  - char: "voice_an"
    side: "right"
    status: "is-red"
    text:
      - "[Обнаружены аномальные данные от цели подключения. Авторизация Системы Натуральных Вычислений временно заморожена.]"
  - char: "observer"
    side: "left"
    text:
      - "...Неужели защитный барьер наконец достиг своего предела?"
  - char: "voice_an"
    side: "right"
    status: "is-red"
    text:
      - "[Запуск программы исправления. Инициализация проверки на наличие аномальных данных.]"
  - char: "observer"
    side: "left"
    text:
      - "Хех. Протокол самоуничтожения, запуск."

chapter2:
  rows:
  - text:
      - "В мгновение ока «несокрушимая» башня оказывается поглощена всепоглощающим взрывом."
      - "Когда-то весь Тестовый полигон Бета был в её твердой хватке. Теперь же источник её силы навсегда исчез из этого мира."
