chapter1:
  rows:
  - text:
      - "Хиэй повела Хатакадзэ обратно тем же путем, прорезая туман и возвращаясь в тот безжизненный мир."
      - "Хотя сквозь туман слабо доносился рев чудовищ, они не стали преследовать двух девушек-кораблей."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Похоже, они не могут пересечь границу иллюзии."
      - "Кстати говоря, как ты здесь очутилась? Снаружи иллюзии?"
  - char: "hatakaze"
    side: "right"
    text:
      - "«Иллюзия»? Где мы? Сплю я или нет?"
      - "...Полагаю, ты и сама не знаешь, судя по твоему взгляду."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Боюсь, что так. А пока позволь мне перевязать твои раны."
  - char: "hatakaze"
    side: "right"
    text:
      - "Аргх..."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Пожалуйста, потерпи. Это не займет много времени, обещаю."
  - char: "hatakaze"
    side: "right"
    text:
      - "Боль... Значит, я точно не сплю."
      - "Раз уж это не сон, думаю, стоит сказать, что ты появилась словно чудо на исходе безнадежной битвы."
      - "Скажи мне... Ты меня не боишься?"
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "С чего бы мне?"
  - char: "hatakaze"
    side: "right"
    text:
      - "Из-за этой силы, что у меня есть. Ты наверняка её чувствуешь."
      - "На данном этапе я вряд ли чем-то отличаюсь от тех чудовищ снаружи."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Это вовсе не так. Сила не может быть изначально хорошей или плохой — всё зависит от того, как ты её используешь."
      - "Например, только что я использовала свою МЕТА-силу, чтобы спасти тебя. Мне не нужно бояться силы."
  - char: "hatakaze"
    side: "right"
    text:
      - "Ты не понимаешь. Моя сила куда страшнее, чем сила МЕТА."
  - char: "hiei_meta"
    side: "left"
    text:
      - "Тогда твою силу должны бояться твои враги, а не союзники, разве нет?"
  - char: "hatakaze"
    side: "right"
    text:
      - "Ты и правда умеешь подбирать слова, прямо как Конго. А что, если я скажу, что я не та Хатакадзэ, которую ты знаешь?"
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Возможно, и не та. Возможно, на самом деле я никогда не встречала тебя раньше."
      - "И всё же, ты — это по-прежнему ты."
      - "Я доверяю Хатакадзэ, и при условии, что в глубине души ты всё ещё она, я доверяю и тебе."
  - char: "hatakaze"
    side: "right"
    text:
      - "Хе-хе. Понятно... Скажи, ты действительно подверглась МЕТАморфозу?"
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я и сама не уверена. Это состояние ничуть не похоже на МЕТАморфоз в моем понимании."
      - "Ты не знаешь, что это может быть?"
  - char: "hatakaze"
    side: "right"
    text:
      - "Нет. Ни малейшего понятия."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ахаха... Ничего страшного. Разберемся, когда вернемся домой."
      - "Сказать по правде, я, эм... Я оказалась здесь случайно, и мне нужно немедленно вернуться."
      - "Госпожа Нагато, должно быть, с ума сходит от беспокойства за меня, поэтому поиск выхода сейчас — моя первостепенная задача."
  - char: "hatakaze"
    side: "right"
    text:
      - "......"
      - "Отталкиваясь от того направления, куда ты сейчас смотришь, поверни направо на 47,5 градусов и иди прямо."
      - "Сделай это, и ты сможешь покинуть это место."
  - char: "hiei_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Погоди, правда? Откуда ты это знаешь?"
  - char: "hatakaze"
    side: "right"
    text:
      - "Инстинкт."
      - "Моя сила говорит мне об этом — на инстинктивном уровне."
