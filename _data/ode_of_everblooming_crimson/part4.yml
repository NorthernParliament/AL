chapter1:
  rows:
  - char: "purifier"
    side: "left"
    text:
      - "*зевает*... Тааак скучно..."
      - "Сослали в гребаную поддержку, и это сразу после того дерьма в Антарктиде..."
      - "О чем Обсервер только думает? Наконец-то решила взять все в свои руки после того, как её мейнфрейму стали угрожать?"
      - "Да... Не-а. Не могу представить, чтобы она вообще вступила в настоящий бой."
      - "А, пофиг. У нее свои методы. Лучше не тратить силы на раздумья об этом."
      - "Вот бы она только не отменяла все тесты, а то теперь мне вообще нехрен делать."
      - "Грааах! Черт возьми!"
      - "Дайте мне уже сразиться! Ненавижу сидеть на заднице и бить баклуши!"
  - text:
      - "Пьюрифайер беспокойно каталась туда-сюда по ковру, но затем резко остановилась и вскочила, о чем-то вспомнив."
  - char: "purifier"
    side: "left"
    text:
      - "Точно! Посмотрим, что там происходит в Тихом океане!"
      - "Тестер лучше не облажаться в этот раз, потому что они выкатили большую... А?"
      - "Кто-то читает данные в моей базе?"
      - "Нет, погодите... Их не читают! Их переносят!"
      - "Прекрати, ублюдок! Я не давала на это согласия!"
  - text:
      - "В спешке она зашла в свою базу данных и увидела, как вся информация удаляется прямо у нее на глазах."
  - char: "purifier"
    side: "left"
    text:
      - "Половина всего уже пропала! Но если осталось только 50%... как я еще жива?"
      - "Использование ресурсов в норме... Какого черта происходит, и куда уходят мои данные?!"
  - text:
      - "Она отправляла одну команду за другой, чтобы исправить ситуацию, но всё впустую. Её данные продолжали переноситься."
      - "Затем, как только процесс завершился, она сама получила команду — на самоуничтожение."
  - char: "purifier"
    side: "left"
    text:
      - "Что?! Стой, не..."

chapter2:
  rows:
  - text:
      - "Вот так мейнфрейм Пьюрифайер превратился во впечатляющий фейерверк."
      - "Всего день назад на юге Тихого океана трепетали от ее имени. Теперь же ее личность больше не была частью этого мира."
