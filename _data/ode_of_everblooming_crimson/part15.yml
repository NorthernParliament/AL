chapter1:
  rows:
  - text:
      - "В реконструированном фрагменте памяти внутри Нараки развернулась сцена из прошлого Империи Сакуры."
      - "Это было настоящее море весенних цветов — разительный контраст с пораженной коррозией Сингулярностью."
  - char: "akagi"
    side: "left"
    text:
      - "Командир, это..."
      - "Воспоминание о времени, проведенном с Амаги..."
      - "Ах... Она где-то в этом мире..."
  - text:
      - "На глаза Акаги, больше не затуманенные безумием коррозии, навернулись слезы."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Командир, доложите обстановку. Вы уже в сегменте?)"
  - char: "observer_rad"
    side: "left"
    text:
      - "(Разве ты не видишь по нашим приборам слежения? Зачем вообще спрашивать?)"
  - text:
      - "По связи я слышу перепалку Хелены и Обсервер — врага, ставшего временным союзником."
      - "Я подготовил специальный канал связи только для нас троих, чтобы обеспечить бесперебойную работу операции."
  - char: "commander_rad"
    side: "left"
    text:
      - "(Пока всё идет хорошо. Сейчас мы в лесу цветущей сакуры, но должны быть близко к цели.)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Хорошо. Будьте осторожны и оставайтесь на связи.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Конечно.)"

chapter2:
  rows:
  - text:
      - "После разговора с Хеленой я позволил Акаги вести нас."
  - char: "akagi"
    side: "left"
    text:
      - "Это всегда было идеальным местом для любования цветами. Мы с Амаги часто сюда приходили."
      - "Империя Сакуры тоже проводила здесь столько праздников... В любом случае, нам лучше идти."
  - char: "zuikaku"
    side: "right"
    text:
      - "(До этого Акаги была в таком отвратительном настроении. Командир так легко её приободрил?)"
  - char: "ryuuhou"
    side: "left"
    text:
      - "(Может, она просто надеется, что скоро снова увидит Амаги и Кагу. Даже если это не было её полным намерением, она всё же... ну, ты понимаешь.)"
      - "Ох. Кстати говоря, разве это место не было когда-то твоим домом?"
      - "Трудно поверить, что тренировочная площадка, на которую я так часто ходила, раньше была такой красивой..."
  - char: "akagi"
    side: "right"
    text:
      - "После того как моя сестра покинула нас, я потеряла желание ухаживать за этим местом."
      - "Вместо того чтобы смотреть, как увядают эти прекрасные цветы, я решила, что с таким же успехом могу сровнять всё с землей и сделать это место полезным.."
      - "Прошу прощения. Хватит разговоров о тяжёлых временах... Идем, Командир."

chapter3:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "Всё ещё поражает, как быстро меняется её настроение."
  - char: "helena"
    side: "right"
    text:
      - "Она совсем не похожа на ту Акаги, которую мы знали."
  - char: "memphis"
    side: "left"
    text:
      - "Да. Я всегда думала, что она более... одержимая? Или, может, корыстная?"
      - "Для нее это может быть похоже на визит к родственникам, но как долго она собирается таскать нас за собой?"
  - char: "commander"
    side: "right"
    text:
      - "Она делает всё возможное, по-своему."
  - char: "memphis"
    side: "left"
    text:
      - "...Думаешь?"
  - char: "commander"
    side: "right"
    text:
      - "(Думаю, она пытается быть той Акаги, которую помнила бы Амаги, в качестве искупления.)"
      - "Не волнуйся. Позволь ей делать своё дело."

chapter4:
  rows:
  - char: "akagi"
    side: "left"
    text:
      - "Это главное место для любования цветами. Люди садились и отдыхали в беседке."
      - "На самом деле, это идеальное место для любого времени года. Отсюда открывается прекрасный вид на поместье Амаги..."
      - "Командир... Не посидишь со мной, хотя бы минутку?"
  - char: "ryuuhou"
    side: "right"
    text:
      - "Акаги..."
  - char: "akagi"
    side: "left"
    text:
      - "Рюхо, пожалуйста..."
  - char: "ryuuhou"
    side: "right"
    text:
      - "...Хорошо, я не возражаю. Командир, что думаешь?"
  - text:
      - "Я принимаю её предложение, и мы все делаем небольшой перерыв."
      - "Сакуране и девочки из других флотов естественным образом разделяются на две отдельные группы, поэтому я сажусь прямо между ними."
      - "Если не считать Дзуйкаку и Рюхо, те из нас, кто менее знаком с делами сакуранцев, кажутся беспокойными — особенно учитывая положение дел за пределами Сингулярности."
  - char: "commander"
    side: "left"
    text:
      - "(Я понимаю чувства Акаги, но это серьезная ситуация. Мы не можем прохлаждаться весь день, и сомневаюсь, что сакуранки захотят долго ей потакать.)"
      - "(Ладно. Думаю, мне пора вмешаться.)"
      - "Акаги."
  - char: "akagi"
    side: "right"
    text:
      - "Командир?"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ты боишься встречи с Амаги?"

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Считаешь себя недостойной?"

chapter7:
  rows:
  - char: "akagi"
    side: "right"
    text:
      - "Не то чтобы я..."
  - char: "commander"
    side: "left"
    text:
      - "Подойди сюда, пожалуйста."
  - text:
      - "Дзуйкаку и Рюхо встают, освобождая место рядом со мной."
  - char: "akagi"
    side: "right"
    text:
      - "Ты не поймешь. Ты не знаешь, что значит для меня Амаги... Какие ужасные вещи я натворила..."
  - char: "commander"
    side: "left"
    text:
      - "Потому я и здесь — чтобы убедиться, что ты встретишься со своей сестрой, и чтобы проследить, что все выберутся отсюда целыми и невредимыми."
      - "Даже сейчас так много флотов изо всех сил стараются отбить атаки коррозии."
      - "Сейчас, как никогда, нам нужно, чтобы ты была лидером."
  - char: "akagi"
    side: "right"
    text:
      - "Командир... Хорошо. Но мне нужно еще немного времени."
  - char: "commander"
    side: "left"
    text:
      - "Меня это устраивает."
  - char: "akagi"
    side: "right"
    text:
      - "Спасибо. Как только я допью этот чай, мы сможем идти..."
  - char: "naka"
    side: "left"
    text:
      - "Акаги? Доброе утро!"
  - char: "akagi"
    side: "right"
    text:
      - "Нака и Хатакадзэ? Вы куда-то идете?"
  - char: "hatakaze"
    side: "left"
    text:
      - "Да, мы думали выйти в море на тренировку. Кстати, кто это там рядом с тобой?"
  - char: "akagi"
    side: "right"
    text:
      - "Просто гости, пришедшие навестить Амаги."
  - char: "naka"
    side: "left"
    text:
      - "О, она играет в го с Кагой в гостиной. Хочешь, я предупрежу Дзинцу?"
  - char: "akagi"
    side: "right"
    text:
      - "В этом нет необходимости. Вы вдвоем можете просто идти на свою тренировку, спасибо."
  - char: "naka"
    side: "left"
    text:
      - "Так и сделаем!"
  - text:
      - "Пока они уходили, в глазах Хатакадзэ промелькнул слабый блеск — однако никто из гостей этого не заметил."

chapter8:
  rows:
  - char: "akagi"
    side: "left"
    text:
      - "Эхх... Ладно. Отправляемся."
      - "Пришло время... встретиться с Амаги."
