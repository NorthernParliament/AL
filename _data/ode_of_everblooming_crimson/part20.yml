chapter1:
  rows:
  - text:
      - "Я без промедления рассказал Амаги и Каге об изменении планов."
      - "Первая, разумеется, с готовностью согласилась спасти свою сестру."
      - "Кагу тоже не пришлось долго уговаривать. Она согласилась помочь нам в своем нынешнем облике."
      - "Поздно ночью мы завершили приготовления."
      - "Пока Синано вносила последние штрихи на импровизированной конструкторской площадке, Амаги заглянула ко мне в комнату."
      - "Несмотря на волнение, она была полна решимости спасти сестру."

chapter2:
  rows:
  - char: "amagi"
    side: "left"
    text:
      - "Прошу прощения, что беспокою тебя так поздно, Командир."
  - char: "commander"
    side: "right"
    text:
      - "Всё в порядке. Мне тоже стоит извиниться — прости, что свалил всё это на тебя так внезапно."
  - char: "amagi"
    side: "left"
    text:
      - "Ничего страшного. Хотя в глубине души мне всё же немного не по себе."
  - char: "commander"
    side: "right"
    text:
      - "Из-за того, что план может провалиться?"
  - char: "amagi"
    side: "left"
    text:
      - "Нет. Командир... Действительно ли изменение судьбы — это к лучшему?"
  - char: "commander"
    side: "right"
    text:
      - "Если это означает превращение печали в радость, то, думаю, да."
  - char: "amagi"
    side: "left"
    text:
      - "Но что, если изменение судьбы впоследствии принесет ещё большие страдания?"
      - "Быть может, мы делаем мир хуже, чем он должен был быть изначально..."
  - char: "commander"
    side: "right"
    text:
      - "Тогда мы продолжим менять его до тех пор, пока в нем не останется места для грусти."
  - char: "amagi"
    side: "left"
    text:
      - "Ты веришь, что такой мир может существовать?"
  - char: "commander"
    side: "right"
    text:
      - "А ты нет?"
  - char: "amagi"
    side: "left"
    text:
      - "...Хи-хи. Полагаю, лучше верить."
      - "Ты, Акаги и все остальные здесь изменили мою судьбу."
      - "И теперь мой черед сделать всё возможное, чтобы изменить всё к лучшему для других."
      - "Пока мир не станет счастливым. Миром без печали."
  - char: "commander"
    side: "right"
    text:
      - "Да. И всё начинается со спасения Акаги."
  - char: "amagi"
    side: "left"
    text:
      - "Согласна. Ради меня она пала в самую темную бездну, и настало время мне вытащить её обратно к свету."
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "shinano_rad"
    side: "right"
    text:
      - "Командир, я готова."
  - char: "amagi"
    side: "left"
    text:
      - "Хи-хи... Я как раз вовремя укрепила свою решимость."
  - char: "commander"
    side: "right"
    text:
      - "Спасибо, Амаги. Давай создадим новое будущее вместе."
