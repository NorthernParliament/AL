chapter1:
  rows:
  - text:
      - "Сгущались темные тучи, бушевали волны. С каждым орудийным раскатом казалось, будто небо и море сливаются воедино."
      - "Шло время, Сингулярность продолжала набирать силу, и ситуация в центральном секторе океана NA с каждой минутой становилась всё более угрожающей."
  - char: "ticonderoga"
    side: "left"
    text:
      - "Похоже, Арбитров теснят. Начинают появляться целые полчища врагов."
  - char: "shangri_la"
    side: "right"
    text:
      - "Они и так выиграли нам много времени и проредили ряды противника."
  - char: "essex"
    side: "left"
    text:
      - "У меня было время сравнить данные о противнике с разведданными, полученными от Командира."
      - "Судя по тому, что я вижу, то, с чем мы сражаемся, имеет те же показатели, что и твари, вылезающие из Нараки."
  - char: "new_jersey"
    side: "right"
    text:
      - "Думаете, эти две Сингулярности связаны? Хотя не уверена, как именно это работает..."

chapter2:
  rows:
  - char: "new_jersey"
    side: "right"
    text:
      - "Внимание всем, мы повышаем уровень боевой готовности!"
      - "Я уже скорректировала развертывание наших сил на западной линии обороны. Всем флотам, пожалуйста, продолжайте действовать согласно нашим текущим планам!"
  - char: "king_george_v_rad"
    side: "left"
    text:
      - "Не бойтесь. Во имя Её Величества Королевы, ни один враг не пройдет!"
  - char: "littorio_rad"
    side: "right"
    text:
      - "Восточная и южная линии полностью под контролем!"
      - "Мы сформировали несокрушимый оборонительный строй при поддержке флотов Железной Крови и Ортодоксии!"
  - char: "tirpitz_rad"
    side: "left"
    text:
      - "В этой операции Железная Кровь оказывает вам полную поддержку."
  - char: "jean_bart_rad"
    side: "right"
    text:
      - "Похоже, Сардиния развернула почти все свои боевые силы..."
      - "Хех... Посмотрим, хватит ли у тебя навыков для командования."
  - char: "littorio_rad"
    side: "left"
    text:
      - "Ха-ха! Да, всё верно — любуйтесь нами вдоволь! Сардиния никогда не обманет ожиданий своих союзников!"
  - char: "jean_bart_rad"
    side: "right"
    text:
      - "Звучит-то красиво, да слова ничего не стоят. Если ты облажаешься и ситуация на поле боя ухудшится, мы будем действовать по-своему."
  - char: "tirpitz_rad"
    side: "left"
    text:
      - "То же касается и Железной Крови. Достижение наших оперативных целей остается главным приоритетом. Мы готовы понести потери ради их выполнения."
  - char: "littorio_rad"
    side: "right"
    text:
      - "Ну конечно! Но как союзники, которые теперь стоят плечом к плечу, давайте соберемся вместе, чтобы полностью продумать наши планы, вплоть до мельчайших деталей!"
  - char: "hakuryuu_rad"
    side: "left"
    text:
      - "Ого, впишите и меня в эти ваши планы, а? Поставьте себя на мое место — это чертовски отстойно отсиживаться здесь, в резерве!"
  - char: "shimakaze_rad"
    side: "right"
    text:
      - "Если вам потребуется моя сила, я буду там быстрее, чем дует ветер и бьет молния!"
  - char: "new_jersey"
    side: "left"
    text:
      - "Ха-ха, не волнуйтесь об этом! Я позабочусь о том, чтобы у всех вас был шанс блеснуть!"

chapter3:
  rows:
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Ах!"
  - char: "ticonderoga"
    side: "right"
    text:
      - "Что не так, Хирю? Что-то не так с нашим построением?"
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Нет, дело не в этом... Пришел ответ на идентификационный сигнал! Пепел приближается!"
