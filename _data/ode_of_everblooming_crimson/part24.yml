chapter1:
  rows:
  - char: "amagi_cv"
    side: "left"
    text:
      - "Я, авианосец Амаги, переродилась, обретя новую силу и новое тело."
      - "Хотя прошло много времени, мой дух остался неизменным."
      - "авай же сражаться плечом к плечу, Командир, за то будущее, которого ты желаешь."

chapter2:
  rows:
  - text:
      - "Сегмент мира, казалось, вот-вот должен был исчезнуть с минуты на минуту. Где-то внутри него две девушки-корабля наблюдали за возрождением Амаги."
      - "Предначертанная ей смерть была отменена, и давняя одержимость, сводившая Акаги с ума, угасла."
      - "Теперь, когда Акаги оказалась лицом к лицу со своей МЕТА-копией, мысли роились в её голове."
  - char: "akagi"
    side: "left"
    text:
      - "(Теперь моя сестра будет возрождена, Кага переродится, а мир будет спасен...)"
      - "(Более того, Амаги больше не суждено пасть жертвой дефекта своего корпуса.)"
      - "(Спасибо вам... Командир, Амаги и Кага...)"
      - "(Вы помогли мне искупить мои грехи.)"
  - text:
      - "Она укрепила свою решимость, затем открыла глаза и уставилась на свою противницу."
  - char: "akagi_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Все фигуры расставлены по местам. Чего ты надеешься достичь на данном этапе?"
  - char: "akagi"
    side: "left"
    text:
      - "...Почему ты охотилась за мной?"
  - char: "akagi_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Более подходящий вопрос — почему ты позволила мне похитить тебя?"
  - char: "akagi"
    side: "left"
    text:
      - "Потому что, не сделай я этого, я не смогла бы спасти Амаги и Командира."
  - char: "akagi_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ха. Неужели только поэтому?"
      - "Именно твоя одержимость создала меня. Ты могла бы хоть ЧТО-ТО сделать, чтобы отразить мою атаку."
      - "Вместо этого ты предпочла быть стертой. Почему?"
  - char: "akagi"
    side: "left"
    text:
      - "Я не обязана тебе ничего говорить."
  - char: "akagi_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хи-хи. Хорошо, тогда я отвечу за тебя. Ты хотела благородно умереть ради Амаги, не так ли?"
      - "Ты причинила боль своим близким, ты подвергла весь мир риску уничтожения — это факты. Думаешь, пожертвовав собой, ты сможешь хотя бы в какой-то мере искупить свою вину, да?"
  - char: "akagi"
    side: "left"
    text:
      - "......"
  - char: "akagi_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ты творила поистине безумные вещи, чтобы воскресить её, а затем возжелала смерти, когда дело было сделано."
      - "Ты ПРАВДА думаешь, что всё решится само собой, если ты умрешь? Что они будут жить долго и счастливо?"
      - "Или что, ты молишься, чтобы Амаги ответила тем же и затем возродила уже тебя?"
  - char: "akagi"
    side: "left"
    text:
      - "...Заткнись."
  - char: "akagi_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ох, ты, безнадежная маленькая лисица. Ты создала меня, и даже мне за тебя стыдно."
      - "То, что ты натворила, просто так не забудется. Это факт, так почему бы просто не принять его?"
      - "Вид живой Амаги снова превратил тебя в плаксу, м?"
      - "Или ты просто снова стала маленькой слабачкой теперь, когда рядом есть кто-то по-настоящему надежный?"
  - char: "akagi"
    side: "left"
    text:
      - "...Хватит. Заткнись."
  - char: "akagi_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Заткнуться? Я — это твои чувства. Я — твоя одержимость. Я — та, кем ты была всё это время."
      - "Можешь отрицать это сколько угодно, но фактов не изменишь!"
      - "Ты никогда не заслуживала любви. Единственное, чего ты теперь заслуживаешь — это жестокий конец."
  - char: "akagi"
    side: "left"
    text:
      - "ДОВОЛЬНО!"

chapter3:
  rows:
  - char: "akagi_meta_rad"
    side: "right"
    text:
      - "Из твоего сердца я родилась, и в твое сердце я вернусь."
      - "Вместе с одержимостью, от которой ты отказалась, прошлым, которое ты хочешь стереть, и силой, от которой ты пытаешься отречься!"
      - "Ты можешь избавиться от меня, но ты никогда не сможешь избавиться от того, чем являюсь я — от самой себя!"
      - "Твои спасители уже в пути. Тебе стоит с нетерпением ждать вашего трогательного воссоединения!"
      - "Вопрос лишь в том — узнают ли тебя твоя дорогая сестра и твои спутники, когда увидят?"
      - "Ахахахахахаха!"

chapter4:
  rows:
  - text:
      - "Смех стих, и осталась лишь одна багровая лиса."
  - char: "akagi_meta"
    side: "left"
    status: "is-red"
    text:
      - "......"
      - "Амаги..."
      - "Кага..."
      - "Хи-хи... Ха-ха-ха... Аха-ха-ха..."
      - "Ахахахахахаха!"
