chapter1:
  rows:
  - text:
      - "Медленно, но верно, сестры Амаги возвращаются к нам."
  - char: "commander"
    side: "left"
    text:
      - "Удалось всё обсудить?"
  - char: "akagi"
    side: "right"
    text:
      - "Командир..."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Хи-хи. И правда, всё хорошо, что хорошо кончается. Спасибо за твое время и понимание, Командир."
  - char: "commander"
    side: "right"
    text:
      - "Кстати о времени, его-то у нас как раз немного."
  - char: "amagi_cv"
    side: "left"
    text:
      - "В таком случае, пожалуйста, отдавай свои приказы~В таком случае, пожалуйста, отдавай свои указания~В таком случае, пожалуйста, отдавай свои приказы~"
  - char: "kagabb"
    side: "right"
    text:
      - "Акаги? Ты жива?!"
  - char: "ryuuhou"
    side: "left"
    text:
      - "Амаги... Что вообще происходит?"
      - "Я думала, Акаги была поглощена своей МЕТА-версией..."
  - char: "amagi_cv"
    side: "right"
    text:
      - "Нет. Это всё та же Акаги, которую мы всегда знали."
      - "То состояние «МЕТА», что мы видели, было лишь временным. Без концепции, за которую можно было бы зацепиться, оно не может поддерживаться долго."
      - "Вот почему оно завладело Акаги и взяло под контроль её волю."
      - "Но после того, как его сила истощилась в ходе битвы, сознание Акаги естественным образом вернулось..."
      - "И благодаря этому я смогла выполнить план Командира и вернуть её к нам."
  - char: "akagi"
    side: "left"
    text:
      - "Товарищи... мне так, так жаль..."
  - char: "zuikaku"
    side: "right"
    text:
      - "Ничего себе, вот это безумный поворот событий! Но сейчас я просто рада, что ты вернулась целой и невредимой!"
  - char: "ryuuhou"
    side: "left"
    text:
      - "И Амаги тоже!"
  - char: "shinano"
    side: "right"
    text:
      - "Значит, это было твое очищающее пламя..."
  - char: "commander"
    side: "left"
    text:
      - "(Эм, прости, Синано, но тут вышло небольшое недоразумение...)"
  - char: "amagi_cv"
    side: "right"
    text:
      - "(Хи-хи. Не волнуйся, Командир. Я всё объясню ей позже.)"
      - "Ах да, Командир. Я кое-что нашла, когда очищала остатки МЕТА-коррозии..."
      - "Может, это тебе пригодится?"
  - text:
      - "Амаги изящно взмахивает руками, и из её рукавов начинают струиться две нити света."
  - char: "commander"
    side: "left"
    text:
      - "Что это..."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Данные, относящиеся к душам Амаги и Каги. С их помощью мы сможем полностью восстановить их со всеми их прежними воспоминаниями и опытом.)"
      - "(Теперь всё сходится. Так вот почему эта МЕТА нацелилась на мейнфрейм Тестер.)"
      - "(Сохрани их где-нибудь в надежном месте. Я займусь восстановлением их корпусов позже.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Похоже, чудеса и правда случаются, да?)"
      - "(Кстати, как продвигаются дела с путем к отступлению?)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Всё выглядит отлично. Дай мне ещё десять минут.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Отлично, ещё одно доброе дело в копилку. Пора домой!)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Поддерживаю.)"
