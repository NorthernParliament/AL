chapter1:
  rows:
  - text:
      - "Всем сообщили о нашем плане эвакуации. Как раз когда мы собирались выдвигаться..."
  - char: "akagi"
    side: "left"
    text:
      - "Мы наконец-то можем вернуться домой, Амаги..."
      - "Как только Сингулярность закроется и мир снова вернется на нашу родину, я уверена, ты поразишься тому, как сильно изменилась Империя Сакуры."
  - char: "amagi_cv"
    side: "right"
    text:
      - "Угу. Жду этого с нетерпением."
  - char: "akagi"
    side: "left"
    text:
      - "Но, Кага... Если я использую эту информацию, сокрытую в твоей душе, нынешняя версия тебя исчезнет..."
  - char: "kagabb"
    side: "right"
    text:
      - "Хех. Не переживай. Ты довольно скоро вернешь себе младшую сестренку, хотя мне действительно немного жаль Тосу."
      - "И всё же, я надеюсь, что ты сохранишь эти воспоминания — обо «мне», а также об Амаги."
      - "Естественно, я сама буду сожалеть, если исчезну, так и не увидев того же будущего, что и Амаги."
  - char: "akagi"
    side: "left"
    text:
      - "Кага... Спасибо тебе огромное, за всё..."
  - char: "commander"
    side: "right"
    text:
      - "Хотя и было несколько неожиданных поворотов, нам удалось выполнить наши задачи."
  - char: "memphis"
    side: "left"
    text:
      - "Полагаю, это считается счастливым концом?"
      - "Боже, кажется, всякий раз, когда ты берешь командование на себя, даже самые безвыходные ситуации раз за разом оборачиваются чудесами."
  - char: "helena"
    side: "right"
    text:
      - "Прости, не думаю, что на этот раз я сделала что-то полезное..."
  - char: "commander"
    side: "left"
    text:
      - "Не говори так, Хелена. Ты принесла больше пользы, чем думаешь, просто находясь рядом со мной."
  - char: "akagi"
    side: "right"
    text:
      - "Командир..."
      - "Эм... Ещё раз, спасибо тебе, от всего сердца."
      - "Как только мы вернемся домой, после того как всё закончится..."
      - "Думаешь, мы могли бы, эм... поговорить по душам наедине?"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Конечно. Жду этого с нетерпением."
  - char: "akagi"
    side: "right"
    text:
      - "Что бы ни ждало меня по возвращении... я должна начать свой путь искупления."
      - "И я верю, что в конце концов он непременно приведет меня к тебе."
  - char: "commander"
    side: "left"
    text:
      - "......"
      - "Я тоже. Я буду ждать тебя."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Командир, возникла проблема.)"

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Я понимаю, что ты чувствуешь."
      - "Но тебе не стоит так сильно об этом переживать. Всё не так уж плохо или непоправимо, как тебе может казаться."
  - char: "akagi"
    side: "right"
    text:
      - "Командир... У меня нет слов..."
  - char: "commander"
    side: "left"
    text:
      - "Однако если ты действительно благодарна, тебе стоит разделить это чувство со всеми твоими родными и близкими, а не только со мной."
  - char: "akagi"
    side: "right"
    text:
      - "Разумеется, Командир. Я приму твои слова близко к сердцу."
  - char: "commander"
    side: "left"
    text:
      - "Вот и отлично. Я рад, что ты вернулась, Акаги."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Командир, возникла проблема.)"

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Тебе будет достаточно просто разговора?"
  - char: "akagi"
    side: "right"
    text:
      - "Ну, эм... Это определенно было бы отличным началом. Уверена, нам... очень о многом нужно будет поговорить, а после этого..."
  - char: "commander"
    side: "left"
    text:
      - "После этого?"
  - char: "akagi"
    side: "right"
    text:
      - "Ты сможешь сам решить, к чему мы перейдем дальше."
  - char: "commander"
    side: "left"
    text:
      - "Хм, пожалуй, я поймаю тебя на слове. Всегда хотел совершить экскурсию по некоторым скрытым жемчужинам Островов Сакуры."
  - char: "akagi"
    side: "right"
    text:
      - "Как только всё закончится, если я когда-нибудь позволю себе такую роскошь... буду рада отвести тебя куда угодно."
  - char: "commander"
    side: "left"
    text:
      - "Тебе не стоит так сильно об этом переживать. Всё не так уж плохо или непоправимо, как тебе может казаться."
  - char: "akagi"
    side: "right"
    text:
      - "Понимаю... Тогда я буду с нетерпением ждать этого дня."
  - char: "commander"
    side: "left"
    text:
      - "Я тоже."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Давайте пока отложим планы на свидание. У нас проблема.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Хелена? Что случилось?)"

chapter5:
  rows:
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Я сказала им, что мы вернемся через час, но, похоже, Главный Барьер столько не продержится.)"
      - "(Если Главный Барьер рухнет, Сингулярность Нарака спровоцирует апокалипсис на Тестовом полигоне Бета.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Тогда давай немедленно закроем Сингулярность. Теперь, когда мы вернули Акаги и Амаги, мы должны быть в состоянии разрушить место проведения ритуала.)"
      - "(Полагаю, вопрос в том... Как нам выбраться?)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Есть один способ.)"
      - "(Помнишь, когда открылась Нарака, был риск, что все остальные Сингулярности станут активными одновременно?)"
      - "(Причина этого кроется в том, что все активные Сингулярности на этом тестовом полигоне взаимосвязаны.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Так почему бы нам просто не сбежать из Нараки через другую Сингулярность?)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Лучший маршрут — через Сингулярность в центре океана NA.)"
      - "(Это с самого начала учитывалось в качестве запасного экстренного плана, так что встроить его в наш маршрут будет несложно.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Погоди. Если мы выберем этот вариант, успех будет зависеть от того, сумели ли наши союзники там удержать оборону.)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Кто знает. Хотя я подозреваю, что в ближайшие несколько месяцев там может быть довольно спокойно благодаря помощи кое-кого из «дружелюбных соседей».)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Так много времени? Давай действовать по этому плану.)"
      - "(Хелена, немедленно свяжись с Энтерпрайз. Пусть она разрушит место ритуала и закроет Сингулярность.)"
      - "(Силы Нью-Джерси продолжат держать оборону.)"
      - "(Но погоди, в этом есть кое-что, что кажется неправильным...)"
      - "(Если все Сингулярности взаимосвязаны, даже если мы сможем закрыть Нараку, что нам делать со всеми остальными местами, которые с ней связаны?)"
      - "(Разве это не значит, что коррозия продолжит изливаться из всех остальных Сингулярностей?)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Справедливо, но пока Нарака — эпицентр — закрыта, я уверена, что смогу придумать какой-нибудь способ разобраться с остальными последствиями.)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Вечно ты не раскрываешь все карты, да?)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(В смысле, я могла бы тебе рассказать, но ты уверен, что именно в этот момент настроен на двенадцатичасовую лекцию?)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Если подумать, я, пожалуй, откажусь. А теперь давайте выдвигаться. Нью-Джерси всё ещё ждёт нас.)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(«Приказы получены. Вам нужно от меня что-нибудь ещё?» ...Командир?)"
  - char: "commander_rad"
    side: "left"
    text:
      - "(Кхе... А, эм, конец связи.)"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "(Хи-хи. Поездка прямиком домой начнётся сию же минуту.)"
