chapter1:
  rows:
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Я привела сюда флот, как только получила твоё сообщение, Курск. Зимняя Корона в порядке?"
  - char: "kursk"
    side: "right"
    text:
      - "Всё выглядит не очень хорошо. Показатели Короны продолжают быстро изменяться"
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Как такое возможно? Насколько я знаю, Код G однажды пыталась активировать Сингулярность, но ей это не удалось."
  - char: "kursk"
    side: "right"
    text:
      - "Я тоже не знаю. Знаю только, что дела плохи."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Я свяжусь с Чкалов. Возможно, она знает что-то, чего не знаем мы."
  - char: "kursk"
    side: "right"
    text:
      - "Тем временем я подготовлюсь к повторному захвату сингулярности."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Хорошо. Нашему плану по укреплению Тихого Океана придётся подождать."
      - "Чкалов, ты меня слышишь? Это Советская Россия."
  - char: "communicator"
    side: "right"
    text:
      - "БЗЗЗТ... БЗЗЗТ..."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Глушат сигнал? Где..."
  - text:
      - "Она не смогла закончить фразу, потому что то, что она увидела в следующее мгновение, повергло её в трепет."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Корона, она светится!"
      - "Что происходит?!"

chapter2:
  rows:
  - text:
      - "Взгляды всех кансен устремились на светящуюся Корону.  Её свет становился всё ярче."
  - char: "kursk"
    side: "right"
    text:
      - "Половина электроники, которую я привезла, начала давать сбои."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Всем отрядам, отойдите от Короны! Мы немедленно эвакуируемся из этого района!"
      - "Не знаю как, но Корона, скорее всего, была активирована!"

chapter3:
  rows:
  - char: "omitter_rad"
    side: "right"
    status: "is-red"
    text:
      - "Да, всё верно! Бегите, поджав хвосты!"
      - "Бегите как можно дальше!"
  - text:
      - "Совершенно неожиданный голос ворвался в канал связи."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Омиттер! Это она!"
  - char: "kursk"
    side: "right"
    text:
      - "Ты не показывалась с тех пор, как мы одолели тебя в операции «Ледяной дождь. Наконец-то набралась смелости снова показать своё лицо, да?"
  - char: "omitter_rad"
    side: "left"
    status: "is-red"
    text:
      - "Что-что? Вы думаете, я ИСПУГАЛАСЬ вас, жалких придурков?"
      - "Так вы думаете, да? Это вы хотите сказать?!"
      - "Забудьте! Просто отойдите и смотрите, как я покажу вам свою НАСТОЯЩУЮ силу!"
  - text:
      - "С этими словами волна абсолютного холода прокатилась по океану."
      - "От Зимней Короны разошлась рябь, замораживая всю воду на своём пути и изменяя даже облака на небе."
      - "Без какого-либо предупреждения повалил сильный снег, дождь и град, загремел гром и задули штормовые ветра. По замёрзшей поверхности пронеслись даже недолговечные торнадо."
      - "Однако эти силы природы не были нацелены на кансен — они ударили по сингулярности."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Она... атакует Корону?"
  - char: "kursk"
    side: "right"
    text:
      - "Похоже на то. Хотя эта первоначальная заморозка, вероятно, была самой эффективной атакой."
      - "Все остальные погодные изменения... сомневаюсь, что они сильно ей навредят."
  - char: "sovetskaya_rossiya"
    side: "left"
    text:
      - "Тогда зачем всё это? Она просто красуется?"
  - char: "kursk"
    side: "right"
    text:
      - "......"
  - text:
      - "Как только исчез последний торнадо, оркестр аномальной погоды наконец-то затих."
      - "Зимняя Корона ответила на провокацию: она вспыхнула и выпустила ударную волну, которая мгновенно разнесла лёд вокруг неё вдребезги, словно насмехаясь над Омиттер."
      - "А затем, в следующее мгновение..."

chapter4:
  rows:
  - text:
      - "Мир поглотила белизна."
      - "Прямо перед тем, как всё померкло, девушки из Северного Парламента увидели, как с неба появился луч света и пронзил Корону."

chapter5:
  rows:
  - text:
      - "Когда к ним вернулось зрение, всё исчезло — Омиттер, луч света, даже сама Зимняя Корона."
      - "Всё, что осталось — это участок почти кипящей воды."
