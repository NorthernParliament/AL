chapter1:
  rows:
  - text:
      - "После того как Куин Элизабет завершила свою задачу по рассеиванию иллюзий, она вернулась в Скапа-Флоу, где провела полдня."
      - "Вангард и её команда всё ещё числились пропавшими без вести, и из Камелота не было ни единой весточки."
      - "Затем, после поиска возможных причин, которые могли привести к неисправности врат..."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "...Это не была неисправность. Сработал защитный механизм врат."
      - "Вот и всё. Это единственное объяснение."
      - "Моя версия META настроила его так, чтобы он активировался только в том случае, если внешняя угроза вторгается на Тестовый полигон Бета, или если кто-то с Тестового полигона Бета входит в Сингулярность..."
      - "У меня нет возможности проверить, так ли это в первом случае, но, возможно, дело во втором — кто-то из этой ветви вторгся в Камелот."
      - "Неужели такое возможно? Неужели одна из этих иллюзий пробралась внутрь?"
      - "Но тогда защита должна была отключиться теперь, когда с иллюзиями покончено..."
      - "Однако этого не произошло."
      - "В то же время, моя версия META никак не могла установить неисправную систему. Куин Элизабет не совершает ошибок!"
      - "Значит, методом исключения остается только одно объяснение..."
      - "Внешняя угроза проникла на Тестовый полигон Бета."
      - "И, конечно же, моя версия META отправилась на охоту за этим чертовым китом, когда нашей ветви угрожает опасность! Угх!"
      - "Это больше не терпит отлагательств. Мне нужно немедленно с ней связаться!"
  - text:
      - "Королева в тревоге закрыла глаза и активировала устройство связи, которое ей оставила её версия META."
      - "В следующее мгновение она почувствовала, словно её разум перенёсся из Скапа-Флоу прямиком на «Свет Королевы»."

chapter2:
  rows:
  - char: "queen_elizabeth_rad"
    side: "left"
    text:
      - "Черт возьми... Впечатляет."
      - "Эй! Другая Элизабет! Где ты? Мне нужно с тобой поговорить!"
  - char: "miss_d"
    side: "right"
    text:
      - "Вау! Это ты! Королева Тестового полигона Бета!"
      - "Как ты сюда попала?.."
  - char: "queen_elizabeth_rad"
    side: "left"
    text:
      - "Неважно. Где она? Активировался защитный механизм моих врат, и я должна её об этом расспросить."
  - char: "miss_d"
    side: "right"
    text:
      - "О, она в кабине машиниста! Я сейчас её позову!"

chapter3:
  rows:
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Защитный механизм сработал? Да, это довольно скверно."
      - "Ты входила во врата и видела, что происходит на другой стороне?"
  - char: "queen_elizabeth_rad"
    side: "right"
    text:
      - "Если бы я могла это сделать, я бы не пришла к тебе за помощью!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что ж, сейчас не самое подходящее время... Мы решили отправиться на эту охоту спонтанно, и это займёт немало времени."
      - "Что ещё хуже, мы не успели доделать устройство связи для безопасного режима перед отъездом."
  - char: "queen_elizabeth_rad"
    side: "right"
    text:
      - "Так что ты хочешь сказать? Что даже ТЫ не можешь связаться с командой Вангард, пока врата в безопасном режиме?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Как раз наоборот! Мы могли не только связаться с ними, но и телепортироваться прямо к ним!"
  - char: "queen_elizabeth_rad"
    side: "right"
    text:
      - "Тогда возвращайтесь сюда и сделайте это!"
  - char: "miss_d"
    side: "left"
    text:
      - "Ну уж нет! Она помогает мне поймать моего кита!"
      - "Я НЕ позволю ей развернуть этот поезд сейчас, когда мы наконец-то его догнали!"
      - "Тебе ведь нужно просто поговорить с людьми там, так? Я знаю, как это сделать!"
  - char: "queen_elizabeth_rad"
    side: "right"
    text:
      - "Что ж, почему ты не сказала этого раньше? Выкладывай!"
  - char: "miss_d"
    side: "left"
    text:
      - "Просто используй динь-динь звоночек, который я тебе дала!"
  - char: "queen_elizabeth_rad"
    side: "right"
    text:
      - "Что... Что?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Она имеет в виду плюшевого кита, которого ты получила."
  - char: "queen_elizabeth_rad"
    side: "right"
    text:
      - "Прошу прощения? ЭТО может с ними связаться?"
  - char: "miss_d"
    side: "left"
    text:
      - "Ещё как может! Я положила его в твою комнату, прежде чем уйти через врата!"
      - "Всё, что тебе нужно сделать, это взять его и набрать бип-буп-динь-динь!"
      - "Люди на той стороне должны ответить, когда услышат тебя!"
  - char: "queen_elizabeth_rad"
    side: "right"
    text:
      - "Что ты ИМЕЕШЬ В ВИДУ под «набрать бип-что-бы-ты-там-ни-сказала»?"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Это плюшевая игрушка, которую она оставила по ту сторону врат."
  - char: "queen_elizabeth_rad"
    side: "right"
    text:
      - "Прошу прощения? И ЭТО может с ними связаться?"
  - char: "miss_d"
    side: "left"
    text:
      - "Это всё? Тогда отключайся, чтобы мы могли сосредоточиться! Мы вообще-то пытаемся тут поймать кита!"

chapter4:
  rows:
  - text:
      - "Разум Элизабет вернулся в её тело. Она открыла глаза и снова очутилась на подземном уровне."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Хорошо, что я сохранила этого плюшевого кита."
      - "Посмотрим... Я просто нажимаю на это, верно?"
  - char: "strange_machine"
    side: "right"
    text:
      - "БИП-БИП-БИП!"
      - "БУП-БУП-БУП!"
      - "ДИНЬ-ДИНЬ-ДИНЬ!"
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "......"
  - char: "strange_machine"
    side: "right"
    text:
      - "Что происходит? Почему плюшевая игрушка Мисс D издаёт эти звуки?"
      - "Подождите-ка... Это был рингтон?"
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Вангард! Ты меня слышишь?"
  - char: "strange_machine"
    side: "right"
    text:
      - "А?.. Это вы, Ваше Величество?.."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Да, это я! Я в коридоре, прямо перед входом во врата!"
      - "Подойди к пульту управления и в точности следуй моим инструкциям!"
      - "Я должна немедленно выяснить, что случилось с вратами!"
