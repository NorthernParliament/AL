chapter1:
  rows:
  - text:
      - "Когда-то эти воды таили в себе множество опасностей. Однако после поражения Компилятор активность Сирен в этом районе пошла на спад, и на море вернулось некое спокойствие."
      - "Даже бушующую в самом её сердце Сингулярность после той грандиозной битвы стали считать менее опасной."
      - "Однако после событий в Тихом Океане и появления сингулярности Нарака, кансен вновь начали массово собираться в этом районе."
  - char: "new_jersey"
    side: "left"
    text:
      - "Похоже, показатели угрозы бури возросли, хотя сам он внешне никак не изменился."
      - "Пусть каждый флот докладывает свои показатели каждые пять минут. И ещё, никому не позволено входить в бурю без разрешения!"
  - char: "ticonderoga"
    side: "right"
    text:
      - "Я уже всех оповестила, так что не переживай об этом."
      - "Боже, и без того хватает проблем с этими аномалиями по всему миру..."
      - "А теперь ещё и шторм в Океане NA становится нестабильным. В самое неподходящее время."
  - char: "boise_rad"
    side: "left"
    text:
      - "Нью-Джерси! Только что были замечены две кансен, выходящие из шторма! Они движутся к нашей позиции!"
  - char: "new_jersey"
    side: "right"
    text:
      - "Что? Но я ничего не вижу на радаре."
      - "О, подожди! Это ОНИ!"
  - char: "boise_rad"
    side: "left"
    text:
      - "Ты имеешь в виду... Пепел?"
  - char: "new_jersey"
    side: "right"
    text:
      - "Пропустите их. Раз они прошли сюда через шторм, то наверняка знают, что происходит."
      - "На самом деле, давайте подготовим для них немного припасов."
  - char: "boise_rad"
    side: "left"
    text:
      - "Поняла. Выполняю."
  - text:
      - "После завершения Операции «Сирена», Хирю и Арк Роял META пристально следили за Сингулярностью в Океане NA."
      - "Они помогали этому миру не только в Операции «Сирена», но и во время инцидента с почти случившимся наложением, и соответственно отношение людей к ним улучшилось."
      - "Настолько, что Командир приказал расквартированному в этом районе флоту снабжать двоих из Пепла припасами, если они им понадобятся."
      - "В общем и целом, отношение Союза Орла к ним изменилось на все сто восемьдесят градусов."
      - "Две представительницы Пепла с готовностью приняли добрую волю Командира и без колебаний взяли предложенные им припасы."
      - "Обе стороны делились не только ресурсами, но и едой, и даже обменивались информацией."
      - "Они начинали с враждебности друг к другу — а теперь словно стали соседями по Океану NA, находящимися в хороших отношениях."

chapter2:
  rows:
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Видя, сколько вас здесь собралось, смею предположить, что вы уже знаете, что происходит внутри Сингулярности."
  - char: "ticonderoga"
    side: "right"
    text:
      - "Допустим, мы не знаем. Не могла бы ты рассказать нам, что там творится?"
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Конечно. На самом деле, рассказать вам об этом было одной из причин нашего прихода сюда."
      - "К сожалению, у меня две плохие новости."
      - "Первая — аномалия не возникла сама по себе."
      - "Какая-то аномалия высшего порядка пытается проникнуть в Сингулярность и вторгнуться на Тестовый полигон Бета."
      - "Вторая — внутри бури снова появились Арбитры Отшельник, Сила и Умеренность."
      - "Я подозреваю, что вскоре они нацелятся на ваш Тестовый полигон."
      - "Хотя обе новости плохие, у меня есть и одна хорошая."
  - char: "new_jersey"
    side: "right"
    text:
      - "Дай угадаю — Арбитры и эта «аномалия» начали сражаться друг с другом, верно?"
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Верно. Арбитры распознали в ней опасность для целых ветвей, поэтому её устранение стало для них приоритетом номер один."
  - char: "ticonderoga"
    side: "right"
    text:
      - "ак значит... Шторм внезапно разбушевался из-за того, что они сражаются?"
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Да."
  - char: "new_jersey"
    side: "right"
    text:
      - "Враг моего врага и всё такое, но разве мы не окажемся в серьёзной беде независимо от того, чья сторона победит?"
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Окажетесь. Именно поэтому я бы предложила закрыть Сингулярность как можно скорее."
  - char: "new_jersey"
    side: "right"
    text:
      - "Если бы мы знали, КАК её закрыть, мы бы сделали это уже давным-давно."
      - "Эй, разве не ваша Энтерпрайз изначально создала эту Сингулярность? Разве ты не можешь попросить её о помощи?"
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я бы попросила, но я не могу с ней связаться."
      - "Боюсь, она могла даже забыть обо мне, ведь прошло так много времени с тех пор, как я отправилась в эту ветвь."
  - char: "ark_royal_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хирю, прекращай."
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я знаю, что ты собираешься сказать. Послушай меня — на этот раз настала НАША очередь просить ИХ о помощи."
  - char: "ark_royal_meta"
    side: "right"
    status: "is-meta"
    text:
      - "......"
  - char: "ticonderoga"
    side: "left"
    text:
      - "Без обид, но я удивлена, что вы, Пепел, смогли выжить так долго при такой слабой организации."
  - char: "hiryuu_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Наши участницы невероятно сильны, вот почему. В особенности Энтерпрайз. Её сила превосходит силу любой из нас."
      - "К тому же у нас развилось острое шестое чувство на опасность, и мы поняли, что работа в отряде на самом деле усложняет адаптацию к ситуации."
      - "Говорите что хотите о наших отдельных участницах, но сам Пепел — это не какая-то холодная и безразличная организация."
      - "Другие придут нам на выручку, если мы окажемся в самом эпицентре этого кошмара."
      - "(Ну, наверное...)"
      - "(Единственная, на кого мы можем рассчитывать, это Хелена.)"
      - "В любом случае, паника никому не поможет. Пока что нам остается только ждать, смотреть, как будет разворачиваться битва, и действовать по ситуации."
  - char: "ticonderoga"
    side: "left"
    text:
      - "Верно. Это лучше, чем спешно придумывать план."
      - "Возвращаясь немного назад, ранее ты сказала, что «рассказать вам об этом было одной из причин нашего прихода сюда». Есть и другие причины?"
  - char: "hiryuu_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Какая ты наблюдательная. Вторая причина заключается в том, что мы поняли, к чему всё идёт, и убрались оттуда, пока была возможность."
