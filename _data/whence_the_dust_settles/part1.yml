chapter1:
  rows:
  - text:
      - "Иллюзии прокатились по всему миру, поймав всех, кто оказался в их радиусе, в ловушку могущественного сна. Тем временем в Империи Сакуры Акаги создала Сингулярность, известную как Нарака."
      - "С некоторой помощью Союза Орла, Империя Дракона одолела Шторм, что так долго преграждал им путь в море. Выполнив свои задачи, они встретились с флотом Нагато."
      - "Теперь, когда почти со всеми иллюзиями по всему миру было покончено, Сингулярность Нарака представляла собой новую проблему. Она накрыла собой всю Империю Сакуры целиком."
  - char: "nagato"
    side: "left"
    text:
      - "Командир, я узнаю форму этой Сингулярности... Она похожа на Изначальный Барьер, который защищает нашу страну."
      - "Должно быть, Сингулярность возникла внутри барьера, и барьер не дал ей разрастись за его пределы."
      - "Раз так, то Изначальный Барьер, по всей вероятности, всё ещё держится."
      - "Это значит, что худший сценарий для нашей страны ещё не наступил. По крайней мере, я на это надеюсь."
      - "Мне тяжело это делать, но я должна забрать свой флот и вернуться домой."
  - char: "ryuuhou"
    side: "right"
    text:
      - "Я буду сопровождать тебя, госпожа Нагато."
  - char: "nagato"
    side: "left"
    text:
      - "Хорошо."
  - char: "commander"
    side: "right"
    text:
      - "Нет. Мы должны держаться вместе. Ты можешь думать, что это проблема только для тебя и твоих соотечественников, но это не так. Это касается всех нас."
      - "Ты отлично сработалась с флотом Энтерпрайз, когда вы разбирались с той иллюзией. Она всё ещё здесь, и я теперь тоже."
      - "Кризис ещё не миновал, поэтому мы все должны стараться действовать как одно целое."
  - char: "nagato"
    side: "left"
    text:
      - "Я понимаю твою точку зрения. Если ты настаиваешь, то я подчинюсь."
  - char: "enterprise"
    side: "right"
    text:
      - "Индиана, я хочу, чтобы ты взяла свой флот и оказала поддержку Командиру и сакуранам."
  - char: "indiana"
    side: "left"
    text:
      - "Поняла."
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я пойду с тобой."
  - char: "indiana"
    side: "left"
    text:
      - "Ты?.. Ты из Северного Парламента?.."
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Можно и так сказать. Я Киров META. Я уже некоторое время нахожусь у них в гостях."
      - "Я хочу рассмотреть эту Сингулярность Нарака поближе. Не возражаешь, если я присоединюсь?"
  - char: "commander"
    side: "left"
    text:
      - "Союз, что думаешь?"
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Если ни у тебя, ни у Нагато нет возражений, то я не против."
      - "Более того, я готова взять свой флот и сопровождать тебя в этой миссии."
  - char: "commander"
    side: "left"
    text:
      - "Тебя это устраивает, Нагато?"
  - char: "nagato"
    side: "right"
    text:
      - "Чем больше поддержки, тем лучше. Спасибо вам, Союз и Киров."
  - char: "commander"
    side: "left"
    text:
      - "Тогда у нас собираются внушительные силы."
      - "Флот Северного Парламента, флот Индианы и флот Нагато отправятся в Империю Сакуры. Остальные останутся здесь и продолжат анализировать заблокированное Зеркальное Море. Будьте начеку."
      - "Эта Сингулярность представляет собой серьёзную угрозу. Высматривайте врагов на всём пути к главному острову сакуран."

chapter2:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "Вычислительная мощность Империи снова возросла, и Море Звёзд ещё раз скорректировало прогнозируемое время завершения."
      - "Судя по темпам, всё должно быть готово через шесть часов."
      - "Процесс пойдёт ещё быстрее, если Империя предоставит нам ещё больше вычислительных ресурсов."
  - char: "commander"
    side: "right"
    text:
      - "Ого, это просто поразительно."
      - "Мне интересно, почему их вычислительная мощность увеличивается вот так постепенно. Почему бы не использовать максимум доступного с самого начала, как это делает Море Звёзд?"
  - char: "memphis"
    side: "left"
    text:
      - "Хмм. Понятия не имею."
      - "Может быть, их суперкомпьютер не работает круглосуточно, поэтому ему нужно время на разогрев?"
      - "Как бы то ни было, это даёт нам возможность наконец-то перевести дух. Тебе стоит отдохнуть, пока есть такая возможность."
      - "Если что-то случится, я сразу же дам тебе знать."

chapter3:
  rows:
  - text:
      - "Так много всего произошло за столь короткое время. Сначала совместные учения Ортодоксии, затем операция «Сокрушающий ветер ледяной дракон», потом разборки с иллюзиями по всему Тихому Океану..."
      - "Я бы с удовольствием доработал наш план насчёт этой Сингулярности, но царство снов зовёт меня. Мне нужно вздремнуть."

chapter4:
  rows:
  - text:
      - "Передо мной раскинулась необъятная галактика, усыпанная тысячами звёзд."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Извини, что вот так тревожу твой сон."

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ничего страшного."
      - "Полагаю, это должно быть что-то важное, раз ты так внезапно связываешься со мной."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "О да. Это ОЧЕНЬ важно."

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "И как ты собираешься мне это компенсировать?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Хмм... Как насчет небольшого сюрприза?"
      - "Взгляни, кто здесь."
  - char: "compiler_rad"
    side: "left"
    text:
      - "......"
  - char: "commander"
    side: "right"
    text:
      - "Компилятор?! Что она..."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я знаю, что у тебя есть вопросы, но сейчас не время."
      - "Причина, по которой я связалась с тобой, заключается в том, что мне нужно сказать тебе кое-что очень важное."

chapter7:
  rows:
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Мне нужно, чтобы ты присутствовал на встрече в Антарктиде."
      - "Эта встреча может в один миг изменить вашу ситуацию в лучшую сторону."
  - char: "commander"
    side: "left"
    text:
      - "Что? В Антарктиде? Ты имеешь в виду, прямо сейчас?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Расслабься. Это не помешает тебе командовать текущим сражением."
  - char: "commander"
    side: "left"
    text:
      - "И с кем же я встречаюсь?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "С Обсервер."
