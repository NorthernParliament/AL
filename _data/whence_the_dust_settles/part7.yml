chapter1:
  rows:
  - text:
      - "Изысканный сад раскинулся посреди совершенно безжизненной пустоши."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Эхх..."
  - char: "arizona_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Это твой 26-й вздох, Мемфис."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Ээээээх...."
  - char: "arizona_meta"
    side: "right"
    status: "is-purple"
    text:
      - "27-й."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Я не слышала от Хелены ни слова с тех пор, как она поручила нам эту миссию."
      - "Почему? Я не понимаю."
      - "Командир в такой опасности, так почему она не придёт на помощь?"
  - char: "vestal_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Уверена, у неё на это должны быть свои причины. Кроме того, разве Йорктаун не одобрила эту идею?"
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Эй, разве тебя не беспокоит тот факт, что Хелена выбрала для этой миссии Касуми, хотя и ты, и она обе подходите для этого?"
      - "Я начинаю думать, что она хочет оставить Командира только для себя."
  - char: "vestal_meta"
    side: "right"
    status: "is-purple"
    text:
      - "......"
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Эххх...."
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "О, привет, Касуми. Отправляешься так скоро?"
      - "Береги себя... И Командира тоже."
  - char: "kasumi_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Угу. Буду."
  - text:
      - "Касуми исчезла из сада во вспышке синего света."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Нет... Я не могу перестать волноваться об этом..."
      - "Дзинцу всё ещё на связи. Я пойду и дам ей несколько советов!"
  - char: "arizona_meta"
    side: "right"
    status: "is-purple"
    text:
      - "......"
  - char: "vestal_meta"
    side: "left"
    status: "is-purple"
    text:
      - "......"

chapter2:
  rows:
  - char: "yorktown_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Мнимая опасность может и не быть настоящей."
      - "Что бы ни случилось, я буду защищать тебя изо всех сил..."
      - "Будь начеку... Командир."

chapter3:
  rows:
  - text:
      - "Влюбленные и Императрица построили эту линию обороны, чтобы отразить натиск Икс в случае нападения."
      - "Затем появилась Бон Омм Ричард. С тех пор как начался её штурм, силы обороны Влюбленных увеличились в несколько раз по сравнению с первоначальным размером."
      - "Этот яростный отпор не позволял Бон Омм Ричард продвинуться ни на шаг целую неделю."
      - "А затем настал новый день..."

chapter4:
  rows:
  - char: "bon_omm_richard"
    side: "right"
    status: "is-lightgray"
    text:
      - "Что это? Твои силы больше не дают такого отпора, как раньше."
      - "Ты забираешь свой флот и отступаешь?"
      - "Ты напрашивалась на войну на истощение, а теперь просто сдаёшься?"
      - "Ахахахахахаха!"
      - "Мне было бы стыдно, если бы я сбежала после того, как так бахвалилась, как ты."
      - "Ой, поглядите-ка. На Тестовом полигоне Бета происходит что-то весёленькое."
      - "Не собираешься меня останавливать, Влюбленные? Потому что я ОБЯЗАТЕЛЬНО нанесу им визит."
  - text:
      - "Она ожидала услышать знакомый голос Влюбленных, но ответа не последовало."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-lightgray"
    text:
      - "Она и правда свернула удочки... Что ж, тогда я отправляюсь на Тестовый полигон Бета!"
  - text:
      - "Гробовая тишина продолжалась."
  - char: "bon_omm_richard"
    side: "right"
    status: "is-lightgray"
    text:
      - "Ладно, поехали!"
      - "Тестовый полигон Бета, я иду!"
