chapter1:
  rows:
  - text:
      - "Тем временем в столице Ортодоксии Синано удалилась в свою комнату на ночь, успешно завершив свою миссию."
      - "В её руке был фрагмент Ватацуми, который пробудил её от иллюзии. Она пристально смотрела на него, и внезапно её охватило странное чувство."
      - "Чувство, столь знакомое, столь давнее."
      - "Это было чувство, словно она снова погружается в сон."

chapter2:
  rows:
  - text:
      - "Кровавая луна освещала мир, окутанный тёмным туманом. Повсюду цвели бесчисленные красные паучьи лилии."
  - char: "shinano_rad"
    side: "left"
    text:
      - "Река Сандзу... Паучьи лилии..."
      - "Здесь проводится какой-то ритуал..."
  - text:
      - "Она посмотрела на небо и интуитивно поняла, что в это огромное мертвое древо в центре мира стекается энергия."
  - char: "shinano_rad"
    side: "left"
    text:
      - "Увядшее древо сакуры... Неужели это Священная Сакура?"
      - "Нет... Хоть оно и может быть связано с Ватацуми, его суть иная..."
      - "Может ли это быть сущность... СОЗДАННАЯ Ватацуми?"
  - text:
      - "Почувствовав странную энергию, пронизывающую небеса и земли, она попыталась извлечь информацию из этого сна."
      - "И тут, в этом тёмно-красном мире, в её сознании промелькнула фиолетовая вспышка."
  - char: "shinano_rad"
    side: "left"
    text:
      - "..Мусаси?"

chapter3:
  rows:
  - text:
      - "Там, в море паучьих лилий, выделялась фигура — Синано чувствовала, что это Мусаси."
  - char: "musashi"
    side: "right"
    text:
      - "Отлично... Я отвлекла на себя внимание всех врагов. Теперь ничто не должно стоять на пути Дзуйкаку."
      - "Моей единственной целью было уничтожить защитный барьер вокруг ритуала, и я даже не подозревала, что она последовала за мной... Это добавляет ещё одну переменную, которую нужно учесть."
  - char: "shinano_rad"
    side: "left"
    text:
      - "Мусаси... Твоё тело, оно... Что ты наделала?"
  - text:
      - "Мусаси не ответила. На самом деле, казалось, она совершенно не замечала присутствия Синано, вновь начав использовать силу своего секретного оружия."
  - char: "shinano_rad"
    side: "left"
    text:
      - "Мусаси!"
  - text:
      - "Синано попыталась схватить её за плечо, но её рука прошла прямо сквозь тело Мусаси, словно та была призраком."
  - char: "musashi"
    side: "right"
    text:
      - "Кхе-кхе... Даже простое поддержание этого состояния вытягивает из меня все силы... Мне нужно двигаться, и быстро..."
  - text:
      - "Мусаси оглянулась на великое древо в центре мира и снова двинулась вперёд."

chapter4:
  rows:
  - text:
      - "Вливая саму свою жизненную сущность в свой «козырь», Мусаси шагала вперёд сквозь барьер ритуала."
      - "Хотя чёрный туман атаковал её снова и снова, каждый раз она отражала удар, заставляя его рассеиваться во все стороны."
      - "Этот обмен атаками и защитой продолжался целую вечность, пока, наконец, душа Мусаси не оказалась на грани угасания."

chapter5:
  rows:
  - char: "musashi"
    side: "right"
    text:
      - "Ни единого звука."
      - "Так легко нейтрализовать волну демонов, накрывшую море..."
      - "Дзинцу не преувеличивала. И этот козырь ещё даже не завершён до конца..."
      - "Но подобное оружие неподвластно контролю кого-то одного."
      - "К счастью, на этот раз ядром была я."
      - "Синано не... смогла бы..."

chapter6:
  rows:
  - char: "shinano_rad"
    side: "left"
    text:
      - "Мусаси..."
      - "Если бы только я раньше приняла свою собственную силу и отбросила сомнения, я могла бы помочь тебе..."
      - "Нет. Ещё не слишком поздно!"
      - "Если сила типа «Ямато» действительно связана с Ватацуми, то я наверняка смогу помочь тебе..."
      - "Должен быть способ... Как-нибудь..."
      - "Думай, думай... Мне нужно что-то прямо сейчас!"
  - text:
      - "В этот момент Синано увидела, как на лице Мусаси появилась улыбка."
      - "Она знала, что Мусаси улыбается не ей, но тем не менее, это потрясло её до глубины души."
  - char: "musashi"
    side: "right"
    text:
      - "То, что наступит такой конец, было вполне естественно. У меня есть сожаления, но я не поддамся страху..."
      - "Всё живое должно умереть. В этом мире и корабли, и люди — лишь мимолетные фантомы."
      - "Хи-хи..."
  - char: "shinano_rad"
    side: "left"
    text:
      - "Нет..."
  - char: "musashi"
    side: "right"
    text:
      - "Пусть этот последний удар принесёт свет надежды в это запустение..."
  - char: "shinano_rad"
    side: "left"
    text:
      - "Подожди, Мусаси... Должен быть другой способ..."
  - char: "musashi"
    side: "right"
    text:
      - "«Разорви пелену вечности, дабы я могла стать листом, плывущим на ту сторону»."
  - char: "shinano_rad"
    side: "left"
    text:
      - "<h2>НЕЕЕЕЕТ!</h2>"

chapter7:
  rows:
  - char: "musashi"
    side: "right"
    text:
      - "«Сталь... рази!»"

chapter8:
  rows:
  - text:
      - "Внезапно Синано окружил рой золотых бабочек, сияющих, словно утреннее солнце."
      - "Они озарили море и тёмное небо."

chapter9:
  rows:
  - text:
      - "Свет отступил, и она оказалась в месте, которое видела уже столько раз."
  - char: "shinano"
    side: "left"
    text:
      - "Граница между миром яви и миром снов... Фрагментированное пространство, соединяющее сновидения..."
      - "Наконец-то... Наконец-то я вернулась сюда..."
  - text:
      - "Две волны, бесконечно бьющиеся друг о друга. Бескрайнее царство. Ничья земля, которую она видит только в своих снах."
      - "Взглянув вверх, она увидела то, чего никогда здесь прежде не видела — золотых бабочек, собирающихся вместе и улетающих вдаль."
      - "Там, вдали — красные врата тории. Врата, соединяющие разрозненные сны."
      - "Бабочки соединяли врата множеством сверкающих линий, словно направляя Синано к следующему сновидению."
