chapter1:
  rows:
  - text:
      - "Изначальный Барьер стал тёмно-красным и, вместо того чтобы защищать Империю Сакуры, теперь изолировал её. От него исходило зловещее давление."
  - char: "nagato"
    side: "left"
    text:
      - "Как такое могло случиться с барьером..."
      - "Симанто, мы с тобой начнём ритуал очищения."
      - "Мы должны как-то пробраться внутрь, пусть даже через узкую щель!"
  - char: "shimanto"
    side: "right"
    text:
      - "Поняла."

chapter2:
  rows:
  - text:
      - "Пока две сакуранки начинали ритуал, остальные отступили и стояли наготове."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Возможно, в своём нынешнем состоянии Изначальный Барьер можно рассматривать как своего рода заблокированное Зеркальное Море."
      - "Однако это весьма необычно для Зеркального Моря. Защитный барьер настолько силён, что его видно невооружённым глазом. Более того, он физически осязаем."
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Это потому, что его граница — это Сингулярность, а не обычное Зеркальное Море."
      - "Судя по тому, как она образовалась, эта самая «Нарака» — как вы её называете — обладает чертовски уникальными свойствами."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "С чего ты это взяла? Ты что-то об этом знаешь?"
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Да. Я уже видела подобную Сингулярность раньше."
      - "Она была создана, чтобы помешать Сиренам очистить Тестовый полигон."
      - "По правде говоря, она справилась со своей задачей... весьма извращённым способом."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Что ты имеешь в виду под «извращённым способом»?"
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "После её развёртывания вселенная начала буквально разрушаться вокруг них."
      - "В конце концов, Сингулярность поглотила абсолютно всё на этом Тестовом полигоне, за исключением её создателей."
      - "И под «всем» я подразумеваю в том числе и Сирен."
      - "Без Сирен их Тестовый полигон никак нельзя было очистить и перезагрузить. Так что, в этом смысле, сработало."
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Что?!"
      - "Ты считаешь... что Нарака сделает то же самое?"
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Нет. Сама по себе Сингулярность не представляет опасности."
      - "ТБ классифицировала её как «угрозу катаклизма», но, насколько я могу судить, она не настолько велика и сильна, чтобы вызвать разрушения ТАКОГО уровня."
      - "Тем не менее, появление этой штуки означает, что аномалия высшего порядка, связанная с вашим Тестовым полигоном, отличается. Интересно, уж не..."
      - "Подожди! Зимняя Корона! Эта Сингулярность всё ещё существует!"
      - "Товарищ Союз, прикажи своим войскам там проконтролировать ситуацию!"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Проконтролировать Корону? Но..."
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я знаю. Я просто хочу, чтобы они присматривали за ней и были готовы к битве, на всякий случай."
      - "В этом мире ведь есть и другие Сингулярности, так?"
      - "И неважно, естественные они, искусственные, активные или нет..."
      - "Я хочу, чтобы они все были немедленно уничтожены, если это вообще возможно!"
      - "Если полное уничтожение неосуществимо, они должны быть изолированы, и возле них должна быть выставлена охрана!"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Что ты такое говоришь? Ты считаешь, что все Сингулярности могут быть опасны?"
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Да! Именно так!"
      - "Однажды они застали мою ветвь врасплох, и это обошлось нам очень дорого..."
      - "Я не хочу, чтобы то же самое случилось с вашей!"
  - char: "sovetsky_soyuz"
    side: "left"
    text:
      - "Я поняла. Я свяжусь с товарищем Командиром и мобилизую остальные фракции."
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "indiana"
    side: "left"
    text:
      - "Похоже, Командир первым с тобой связался."
  - char: "sovetsky_soyuz"
    side: "right"
    text:
      - "Здравствуй, товарищ Командир. Мне нужно обсудить с тобой кое-что важное."
  - char: "commander_rad"
    side: "left"
    text:
      - "Я в курсе. Речь о Нараке и её последствиях, не так ли?"
      - "Я уже знаю подробности, и у меня есть план, как с этим разобраться. Тебе не о чем волноваться."
      - "Если Нагато там, я бы хотел поговорить с ней."
  - char: "ryuuhou"
    side: "right"
    text:
      - "Она полностью сосредоточена на завершении ритуала очищения. Если ты не мог связаться с ней раньше, то, возможно, именно поэтому."
  - char: "commander_rad"
    side: "left"
    text:
      - "Что ж, пожалуйста, соедини меня с ней. Это важно."
  - char: "ryuuhou"
    side: "right"
    text:
      - "К-конечно! Сию же минуту!"

chapter3:
  rows:
  - char: "nagato"
    side: "left"
    text:
      - "В чём дело, Командир?"
  - char: "commander_rad"
    side: "right"
    text:
      - "Не хочу тебя отвлекать, но я должен спросить: как ты относишься к попытке Акаги воскресить Амаги?"
  - char: "nagato"
    side: "left"
    text:
      - "Я призову её к ответу за это. Вся эта катастрофа — её рук дело."
      - "Тем не менее, я знаю, что её желание воскресить Амаги искренне. В этом я её не виню."
  - char: "commander_rad"
    side: "right"
    text:
      - "А что, если я скажу тебе, что всё будет хорошо, если Амаги удастся вернуть?"
  - char: "nagato"
    side: "left"
    text:
      - "Что? Но это невозмож..."
  - text:
      - "БАБАХ!!!"
  - text:
      - "Море сотряс грохот, и на внешней стороне Изначального Барьера появилась огромная трещина."
  - char: "shimanto"
    side: "right"
    text:
      - "Госпожа Нагато! Кто-то пытается физически уничтожить барьер изнутри!"
  - char: "nagato"
    side: "left"
    text:
      - "Грубой силой?!"
  - char: "commander_rad"
    side: "right"
    text:
      - "Нагато, я знаю, что ситуация отчаянная, но у нас ещё есть время всё исправить."
      - "Ты позволишь мне разобраться с этим?"
  - char: "nagato"
    side: "left"
    text:
      - "...Очень хорошо. Хоть у меня и есть сомнения, я доверюсь тебе."
      - "Ты прошел через множество битв. Ты сильный лидер. Ты спас Дзуйкаку и многих других..."
      - "Должна признать, порой ты смотришь на вещи шире, чем я."
      - "Так что же ты от меня хочешь?"
  - char: "commander_rad"
    side: "right"
    text:
      - "Всё просто. Позволь Амаги возродиться и разреши этот кризис."
      - "Для этого тебе понадобится твой флот и, самое главное, сотрудничество с Акаги."
      - "Используй любые средства, чтобы найти её! Когда найдешь, поговори с ней и постарайся её успокоить!"
