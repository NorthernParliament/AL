chapter1:
  rows:

    - char: tirpitz
      side: left
      text:
        - "Снова этот сон. Белоснежный снег, завывающий ветер и... звук летящих с бомбардировщиков бомб."
        - "Затем последовал оглушительный взрыв и... безграничная тьма...?"

    - char: bismarck?
      side: right
      text:
        - "Это ты?"
        - "Ты Тирпиц... Ты моя сестра..."

    - char: tirpitz
      side: left
      text:
        - "Кто ты?.."

    - char: bismarck?
      side: right
      text:
        - "...Мне жаль... Пожалуйста, прости меня..."

    - char: tirpitz
      side: left
      text:
        - "Моя сестра... Бисмарк? Нет, это невозможно... Я не помню тебя... Тебя не должно быть в моей памяти..."

    - char: bismarck?
      side: right
      text:
        - "Прости... Я сделала то, что должна была, ради Железной Крови... Я просто хочу, чтобы ты это поняла..."

    - char: tirpitz
      side: left
      text:
        - "Агх... Голова раскалывается... Оно возвращается... Это всепоглощающее чувство одиночества..."
