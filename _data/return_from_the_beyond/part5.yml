chapter1:
  rows:
  - char: "voice_an"
    side: "right"
    text:
      - "ВИИУ! ВИИУ!"
  - text:
      - "Вой сирены пробуждает меня ото сна."
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "memphis_rad"
    side: "right"
    text:
      - "Командир, это чрезвычайная ситуация! Оставайся в комнате отдыха! Я иду к тебе!"
  - char: "commander"
    side: "left"
    text:
      - "Почему подняли тревогу? Что происходит?"
  - char: "memphis_rad"
    side: "right"
    text:
      - "Враги у нас на хвосте!"
      - "По словам наших МЕТА союзников, они похожи на сущностей, порожденных коррозией, с которыми мы столкнулись в сегменте мира."
      - "Они приняли форму Акаги, вероятно, потому что мы перемещаемся на её корабле."
      - "Как бы то ни было, Акаги и Обсервер пытаются от них оторваться."
      - "Что касается всех остальных..."
  - text:
      - "БАБАХ!"
  - char: "memphis_rad"
    side: "right"
    text:
      - "О нет! Похоже, они нас догнали!"
  - char: "commander"
    side: "left"
    text:
      - "Не нужно идти ко мне! Я направляюсь на мостик!"
      - "Передай всем, что я возьму командование на себя как можно скорее!"
  - char: "memphis_rad"
    side: "right"
    text:
      - "Поняла!"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Сначала всплеск, теперь засада... Это место становится всё более и более опасным.)"
      - "(Даже если мы переживем это столкновение, нам всё еще нужно выбраться из Сингулярности...)"
  - text:
      - "ШУУРХ..."
  - char: "commander"
    side: "left"
    text:
      - "(Что?! Опять!)"
      - "(Боже, как не вовремя!)"

chapter3:
  rows:
  - text:
      - "Тьма поглощает мой разум в мгновение ока."
  - text:
      - "БАБАХ!"
  - char: "commander"
    side: "left"
    text:
      - "(Взрывы... Неужели теперь мне привидится битва?)"

chapter4:
  rows:
  - text:
      - "Во тьме одна за другой формируются нити света."
      - "Их сияние подобно северным сияниям — подобно галактикам — подобно светлым дорожкам на море."
      - "Массивные военные корабли выстраиваются в свету, храбро продвигаясь вперед стальным потоком."
  - char: "commander"
    side: "left"
    text:
      - "(Посмотрите на них, каждый длиной в километр... а их враги еще больше.)"
      - "(Что это, черт возьми, такое?)"
  - text:
      - "Их противники искажены и искривлены, словно монстры из ночного кошмара, с белой, как свежий снег, внешностью."
      - "Размахивая бесчисленными щупальцами и когтями, они останавливают строй военных кораблей, медленно, но верно сокращая их численность."
  - char: "commander"
    side: "left"
    text:
      - "(Это война на истощение, и они проигрывают...)"
  - char: "empress"
    side: "right"
    text:
      - "Это война на истощение, и мы проигрываем."
  - char: "zero"
    side: "left"
    text:
      - "Через три системных часа мы сможем покинуть эту эру. Тогда они больше не смогут нас достать."
  - char: "commander"
    side: "right"
    text:
      - "(Это... Зеро?!)"
      - "(О боже... Это флот Антиоха?)"
      - "(Если бы только я мог пошевелиться... Я даже говорить не могу!)"
  - char: "moon_luna"
    side: "left"
    text:
      - "Серия Боевых Протоколов особенно эффективна против кристаллических целей высокого уровня."
      - "У нас со Звездой больше всего юнитов, оснащенных этой серией."
      - "Полагаю, мы вдвоем лучше всего подходим для того, чтобы задержать врага."
  - char: "zero"
    side: "right"
    text:
      - "Поняла."
  - text:
      - "Голограммы Луны и Императрицы исчезают."
  - char: "zero"
    side: "right"
    text:
      - "......"
  - char: "commander"
    side: "left"
    text:
      - "(Она... Она смотрит на меня?)"
  - text:
      - "Как будто реагируя на мой стресс, пространство вокруг меня начинает дрожать."
  - char: "commander"
    side: "left"
    text:
      - "(Что теперь?!)"
  - text:
      - "Дрожь усиливается, и мой разум снова кажется готовым взорваться изнутри..."

chapter5:
  rows:
  - text:
      - "Затем дрожь снова замедляется и ослабевает, прежде чем прекратиться вовсе."
      - "Как будто кто-то предвидел это и подготовил контрмеры."
      - "Вернувшись к морю синих цветов, женщина со светлыми волосами снова показывает себя."
  - char: "commander"
    side: "left"
    text:
      - "Это... ты?!"
  - char: "yorktown_meta???"
    side: "right"
    status: "is-purple"
    text:
      - "....."
  - char: "commander"
    side: "left"
    text:
      - "Нет! Подожди!"
  - text:
      - "Белый свет затмевает цветы и женщину, не обращая внимания на мои крики."

chapter6:
  rows:
  - text:
      - "Когда ко мне возвращается зрение, я снова в комнате отдыха."
  - char: "commander"
    side: "left"
    text:
      - "Мемфис, что там происходит снаружи?"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Это первое, о чем ты спрашиваешь после обморока?"
      - "Что ж, хорошие новости. Вы благополучно оторвались от погони."
      - "Но я больше беспокоюсь о тебе. Это происходит уже в третий раз, не так ли?"
  - char: "commander"
    side: "left"
    text:
      - "Да... Я продолжаю отключаться без всякого предупреждения."
      - "Сколько времени прошло на этот раз?"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Минут двадцать, плюс-минус. С каждым разом ты в отключке дольше, чем в предыдущий."
  - char: "commander"
    side: "left"
    text:
      - "Это из-за очередного всплеска? Разве ты не говорила, что мы покинули опасную зону?"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Значит, причину вызывает что-то другое. Что-то внутри самой Нараки, о чем мы не знаем."
      - "елена сказала, что разберется с этим, но нам придется подождать и посмотреть."
  - char: "commander"
    side: "left"
    text:
      - "Хорошо. Я дам знать остальным, что я в безопасности."

chapter7:
  rows:
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Это уже третий раз... Слава богу, ты здесь."
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Хелена, аномалии внутри Нараки неестественны. Кто-то намеренно их вызывает."
      - "Они пытаются дестабилизировать ваш маршрут отступления."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Кто это делает?"
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Я не знаю."
      - "Мое единственное предположение — это может быть тот же человек, который доставил тебе неприятности в Мартириуме."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Тот же человек?"
      - "Нет, этого не может быть. Данные, собранные Башней, совершенно другие. Интенсивность и энергетические волны тоже ни на что не похожи. Не может быть, чтобы они исходили из одного источника."
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Это мало о чем говорит. Данные, которые ты получаешь из Нараки, каждый раз разные."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Да, и поэтому я подумала, что аномалии спорадические. Они..."
      - "......"
      - "Ты предполагаешь, что наш враг освоил несколько методов нападения и он сильнее нас?"
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Это просто предчувствие, но это очень вероятно."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Как бы то ни было, этот маршрут слишком опасен."
      - "К счастью, талисман Синано связывает её с Ватацуми. Мы можем использовать её как ключ, чтобы открыть запертый проход."
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Нет! Многие погибнут, если ты это сделаешь! Не только воссозданные копии из сегмента мира, но и реальные люди!"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ну и что, если они умрут?"
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Командир никогда не простит тебе этого."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "......"
      - "Командиру необязательно знать."
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Я лично расскажу всё Командиру, если ты это сделаешь."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Что же ты хочешь, чтобы я сделала? Просто рискнула?!"
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Ничего не обходится без риска. Всегда будут вещи, которые ты не сможешь контролировать."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Я НЕ ХОЧУ, чтобы что-то выходило из-под моего контроля."
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Всё в порядке, Хелена. Я могу позволить себе подождать. С Командиром всё будет хорошо."
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Подержи это для меня."
  - char: "yorktown_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Что ты делаешь?"
  - char: "helena_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Полностью концентрируюсь на навигации. Я немедленно вытаскиваю нас отсюда!"
