chapter1:
  rows:
  - text:
      - "Битва в океане NA завершилась еще до того, как мы покинули Сингулярность."
      - "По словам Хирю МЕТА, подкрепление, которое привел Пепел, закончило бой. Однако она сама не знала, кем было это подкрепление."
      - "В любом случае, лидеры всех фракций были проинформированы, когда мы покинули Сингулярность, и они быстро собрались, чтобы поприветствовать меня."
      - "Синано, конечно же, тоже была там."
      - "Мы устроили вечеринку на борту серийного корабля Нью-Джерси в честь успешного завершения миссии."

chapter2:
  rows:
  - char: "littorio"
    side: "left"
    text:
      - "Тост! За великий триумф Командира!"
  - char: "king_george_v"
    side: "right"
    text:
      - "Да! Давайте выпьем!"
  - char: "new_jersey"
    side: "left"
    text:
      - "Дорогой, окажи нам честь!"

chapter3:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Эм... Ваше здоровье."

chapter4:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "До дна!"

chapter5:
  rows:
  - text:
      - "Вечеринка выдалась довольно пышной, учитывая огромный энтузиазм кансен."
  - char: "tirpitz"
    side: "left"
    text:
      - "Командир, не мог бы ты поделиться с нами тем, что произошло внутри Нараки?"
  - char: "shimakaze"
    side: "right"
    text:
      - "Да! Пожалуйста, расскажи нам! Как ты вернул Амаги и Кагу к жизни? Мы все умираем от желания это услышать!"
  - char: "commander"
    side: "left"
    text:
      - "Хм... С чего бы начать?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Прошу прощения, но есть одна вещь, которую я хочу, чтобы ты объяснил мне в первую очередь."
  - text:
      - "Вмешиваясь в разговор, Клемансо достает небольшую брошь."
  - char: "clemenceau"
    side: "right"
    text:
      - "Ты помнишь это?"
  - text:
      - "<img src='../../img/bg/r/5.png' class='inline-img' alt=''>"
  - char: "commander"
    side: "left"
    text:
      - "Это ведь твоя брошь, не так ли?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Значит, ты ВСЁ ЖЕ помнишь. Хорошо."
      - "Вот, возьми. Убедись, что она снова не потеряется."
  - text:
      - "Она наклоняется ближе и протягивает брошь не мне, а Мемфис."
  - char: "clemenceau"
    side: "right"
    text:
      - "...В чем дело? Язык проглотила?"
  - char: "memphis"
    side: "left"
    text:
      - "Погоди, ты отдаешь её мне?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Именно. Сохрани её, хорошо?"
  - text:
      - "Похоже, Мемфис не собирается её брать, поэтому Клемансо прицеливается и бросает её ей."
  - char: "memphis"
    side: "left"
    text:
      - "Что... Эй!"
  - char: "clemenceau"
    side: "right"
    text:
      - "Хорошая скорость реакции."
  - char: "memphis"
    side: "left"
    text:
      - "(Эм... Что происходит?)"
      - "(Я думала, она собиралась отдать её Командиру?)"
      - "(Почему она отдала её мне?)"
      - "(Она что... хочет, чтобы Я отдала её Командиру?)"
      - "(Зачем делать это так окольными путями? Командир ведь прямо... там...)"
      - "Погодите... А где Командир?"
  - text:
      - "Глаза Мемфис широко открываются от шока и смятения."
  - char: "memphis"
    side: "left"
    text:
      - "К-Командир?"
      - "Хелена, куда подевался Командир?"
  - char: "helena"
    side: "right"
    text:
      - "Я не знаю... Я закрыла глаза на секунду, а потом..."
  - char: "littorio"
    side: "left"
    text:
      - "«Командир»? Какой Командир?"
      - "А, полагаю, ты имеешь в виду человека, командующего нашим объединенным флотом."
  - char: "new_jersey"
    side: "right"
    text:
      - "То есть меня, другими словами?"
  - char: "memphis"
    side: "left"
    text:
      - "А?"
  - char: "amagi_cv"
    side: "right"
    text:
      - "Это не предвещает ничего хорошего..."
  - char: "commander"
    side: "left"
    text:
      - "Девочки? В чем дело?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Хм... Какая любопытная реакция."
      - "Похоже, моя маленькая брошь не желает находиться ни в чьих руках, кроме моих или рук Командира."
      - "Возьми её, Командир, и держи при себе."
  - char: "memphis"
    side: "left"
    text:
      - "(Что... только что произошло?)"
      - "Командир, куда ты пропадал?"
  - char: "commander"
    side: "right"
    text:
      - "«Пропадал»? Я всё это время стоял прямо здесь."
  - char: "memphis"
    side: "left"
    text:
      - "Что? Но..."
  - char: "commander"
    side: "right"
    text:
      - "Ты выглядишь бледной. Тебе плохо?"
  - char: "memphis"
    side: "left"
    text:
      - "Я в порядке! Наверное, я просто слишком много выпила..."
      - "(Даже если я просто напилась, это не объясняет реакцию остальных! Что-то серьезно не так!)"
      - "(Что происходит? Даже Командир ведет себя так, будто ничего не случилось!)"
      - "Что ж, эм, ты слышал Клемансо. Тебе следует поберечь брошь."
  - text:
      - "<img src='../../img/bg/r/12.png' class='inline-img' alt=''>"
  - text:
      - "Она протягивает мне брошь. Та завернута в синий носовой платок."
  - char: "commander"
    side: "left"
    text:
      - "Разве это не твой любимый платок? Я возьму брошь, но платок оставь себе."
  - char: "memphis"
    side: "right"
    text:
      - "Нет, нет, всё в порядке. Тебе следует держать её завернутой, чтобы она не поцарапалась. Это было бы ужасно."
      - "Кроме того, ты можешь просто вернуть мне платок позже."
      - "(Погодите, что я делаю? Сосредоточься!)"
      - "(Я должна выяснить, что, черт возьми, только что произошло!)"
      - "(Начиная с того, что ни на секунду не выпущу Командира из виду...)"
  - char: "littorio"
    side: "left"
    text:
      - "Ха-ха-ха! Какая прекрасная сцена разыгралась перед нами."
      - "А теперь, если ни у кого нет больше ничего сказать, давайте вернемся к нашим напиткам!"

chapter6:
  rows:
  - text:
      - "Без всякого предупреждения, Командир снова растворился в воздухе прямо на глазах у кансен."
  - char: "amagi_cv"
    side: "left"
    text:
      - "Похоже, большинство не заметило, как и в прошлый раз."
      - "И становится еще страннее... Все признаки того, что Командир вообще когда-либо существовал, исчезают в то же время."
      - "Записи, фотографии — любые свидетельства существования Командира просто испаряются. Даже наши воспоминания."
      - "Даже реальность искривляется в соответствии с этим. Клемансо передала брошь тебе, а вместо возвращения Командира мы празднуем мое."
      - "Как будто Командир был стерт из реальности, а всё остальное было переписано, чтобы соответствовать этому изменению."
  - char: "memphis"
    side: "right"
    text:
      - "Я начала запись, чтобы понять, что происходит, и всё равно ничего..."
      - "Почему это происходит? Что нам делать?"
  - char: "akagi"
    side: "left"
    text:
      - "Для начала — не паниковать. Нам это ничем не поможет."
  - char: "amagi_cv"
    side: "right"
    text:
      - "Акаги права. Давайте постараемся сохранять спокойствие и вместе разберемся в фактах."
      - "Никто, кроме нас, не заметил, что что-то не так. Это по крайней мере доказывает, что не все здесь скомпрометированы."
      - "Это наводит меня на мысль, что Командир не исчезает сам по себе, а скорее кто-то воздействует на наше когнитивное восприятие."
  - char: "memphis"
    side: "left"
    text:
      - "......"
  - char: "helena"
    side: "right"
    text:
      - "......"
  - char: "zuikaku"
    side: "left"
    text:
      - "......"
  - char: "akagi"
    side: "right"
    text:
      - "Не смотрите на меня. Я не имею к этому никакого отношения."
      - "Зачем мне делать такое с тем, кто мне дорог?"
  - char: "amagi_cv"
    side: "left"
    text:
      - "Я не подозреваю тебя, Акаги. Мы всю ночь ходили вместе, так что ты не могла ничего сделать у меня за спиной."
      - "Однако, ты единственная среди нас, кто обладает хоть какими-то знаниями, касающимися когнитивного воздействия."
  - char: "akagi"
    side: "right"
    text:
      - "Ты не ошибаешься, и это действительно похоже на случай когнитивного воздействия."
      - "Однако почему же тогда мы не подверглись этому воздействию, хотя окружены теми, кто ему подвергся?"
      - "Я могу придумать лишь два правдоподобных объяснения."
      - "Первое — преступник находится поблизости и может избирательно контролировать, на чье восприятие он воздействует."
      - "Однако эта теория не объясняет, почему мы не пострадали."
      - "Второе — в наших телах или разуме есть что-то особенное, и поэтому мы не поддаемся этому воздействию."
      - "Другими словами, мы находимся в зоне действия, но оно просто на нас не влияет."
      - "С другой стороны, хотя мы помним Командира, мы не можем увидеть Командира собственными глазами."
      - "Это наводит на мысль, что у нас лишь частичный иммунитет."
      - "Что же касается того общего, что есть у нас и чего нет у пострадавших..."
      - "Это тот факт, что мы все вернулись из Нараки."
      - "Возможно, мы подобрали что-то внутри Нараки и неосознанно принесли с собой."
      - "Синано, тебе ничего не приходит на ум?"
  - char: "shinano"
    side: "left"
    text:
      - "Я не чувствую здесь следов сил, которые могли бы изменить когнитивное восприятие..."
      - "Увы, маловероятно, что это простой случай подобного вмешательства в разум..."
  - char: "akagi"
    side: "right"
    text:
      - "Хочешь сказать, что ситуация куда серьезнее, чем мы предполагали?"
  - char: "shinano"
    side: "left"
    text:
      - "Воистину... Ямато согласна с этой догадкой..."
  - char: "ryuuhou"
    side: "right"
    text:
      - "Как-как? Ты сказала, Ямато согласна?"
      - "Она здесь? Где?"
  - char: "shinano"
    side: "left"
    text:
      - "Ее здесь нет..."
  - char: "akagi"
    side: "right"
    text:
      - "Значит, ты с ней разговаривала, не так ли?"
  - char: "shinano"
    side: "left"
    text:
      - "Нет, мне уже давно не выпадало такой чести..."
      - "Однако до этого Ямато передала мне сообщение..."
      - "«Сохраняйте спокойствие и не позволяйте другим ничего заподозрить.»"
      - "«Отправляйтесь на Всемирную Выставку и войдите в сад павильона нашей Империи.»"
      - "«Там вы найдете способ разрешить этот кризис.»"
      - "«Не только ради нашего блага, но и ради Командира тоже.»"
  - char: "akagi"
    side: "right"
    text:
      - "Подробные инструкции от Ямато... Должно быть, всё крайне скверно."
  - char: "shinano"
    side: "left"
    text:
      - "Мы не можем позволить, чтобы Командир был забыт..."
      - "Командир не должен бесследно исчезнуть из этого мира..."
  - char: "akagi"
    side: "right"
    text:
      - "Этого не случится пока я жива."
      - "Дорогая сестра, дамы — давайте немедленно отправимся в путь!"
