chapter1:
  rows:
  - text:
      - "Дворец Дракона, место проведения ритуала, породившего Нараку, вернулся под воду."
      - "Под мистическим небом, где смешивался синий, золотой и фиолетовый свет, туда-сюда сновали сакуранские кансен."
  - char: "watarase"
    side: "left"
    text:
      - "Дамы, мы полностью разобрались с противниками, порожденными ритуалом."
      - "Дворец Дракона снова в безопасности."
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "А я закончила оценку полученного ущерба."
      - "Внешнее кольцо получило 35% повреждений, среднее кольцо — 24%, а самое внутреннее кольцо — 16%."
  - char: "daisen"
    side: "left"
    text:
      - "Это куда хуже, чем я ожидала..."
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Верно. Хорошая новость в том, что на наших складах полно припасов. Нам не придется ничего завозить для ремонта."
  - char: "daisen"
    side: "left"
    text:
      - "Отличные новости. Как думаешь, сколько времени это займет?"
  - char: "ibuki_newyear"
    side: "right"
    text:
      - "Три дня."
  - char: "daisen"
    side: "left"
    text:
      - "Целых три дня?.. Учитывая серьезные коррозийные повреждения, которые получил Изначальный Барьер, мне остается лишь молиться, чтобы больше ничего не случилось..."
  - char: "shimanto"
    side: "right"
    text:
      - "В таком случае, мне начать устанавливать краеугольный камень?"
      - "Если я начну сейчас, он будет готов к тому времени, как вы закончите ремонт."
      - "Тогда мы сможем провести ритуал вместе и использовать силу Дворца Дракона, чтобы восстановить Изначальный Барьер."
  - char: "daisen"
    side: "left"
    text:
      - "Хорошая мысль. Давай так и сделаем."
  - text:
      - "В этот момент прямо перед ними с неба ударил луч света, приняв очертания кансен."
  - char: "shimanto"
    side: "left"
    text:
      - "Ундзэн?! Ты здесь?.."
  - char: "unzen_rad"
    side: "right"
    text:
      - "Вы все отлично потрудились."
      - "Я прибыла с приказами от госпожи Ямато."

chapter2:
  rows:
  - text:
      - "Появилась золотая вспышка и в следующее мгновение поведение Ундзэн изменилось, словно в нее кто-то вселился."
  - char: "unzen_rad"
    side: "right"
    text:
      - "«В каком состоянии находится Дворец Дракона?»"
  - char: "daisen"
    side: "left"
    text:
      - "Он получил больше повреждений, чем мы надеялись. Потребуется три дня, прежде чем мы сможем начать восстановление Изначального Барьера."
  - char: "unzen_rad"
    side: "right"
    text:
      - "«Очень хорошо.»"
      - "«А что насчет того, второго дела?»"
  - char: "daisen"
    side: "left"
    text:
      - "Команда как раз сейчас собирает фрагменты."
  - char: "unzen_rad"
    side: "right"
    text:
      - "«После сборки поместите Орочи в краеугольный камень Ритуала Воскрешения.»"
  - char: "daisen"
    side: "left"
    text:
      - "Как прикажешь."
  - char: "unzen_rad"
    side: "right"
    text:
      - "Госпоже Ямато нужно подготовить Ритуал, и у меня тоже есть дела. На этом я вас покину."
  - text:
      - "Ундзэн махнула на прощание, и свет рассеялся во все стороны."
  - char: "daisen"
    side: "left"
    text:
      - "Что ж... Мы должны как можно скорее починить Изначальный Барьер, чтобы убедиться, что Ритуал Воскрешения пройдет гладко."
      - "Ладно, дамы, давайте вернемся к работе."
