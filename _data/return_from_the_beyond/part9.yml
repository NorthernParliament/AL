chapter1:
  rows:
  - text:
      - "Вой скрежещущей стали эхом разносится под звездным небом."
      - "С тех пор, как меня сюда привели, в голове крутятся две мысли."
      - "Первая — битва здесь только что закончилась. В воздухе всё еще висит запах пороха."
      - "Вторая — я Командир. Очевидно."
      - "Однако я не знаю, где я и что здесь произошло."
      - "Всякий раз, когда я пытаюсь вспомнить, мои воспоминания словно окутывает пелена тумана."
      - "Другие вещи я помню, но лишь смутно. А многое другое я не могу вспомнить вообще."
  - char: "commander"
    side: "left"
    text:
      - "Я Командир. Это я знаю наверняка."
      - "Одежда, которую я ношу, принадлежит высокопоставленному военно-морскому офицеру."
      - "Какого флота? Я не знаю. Откуда я? Я не знаю."
      - "И всё же факты о тактике ведения боя и вооружении приходят мне на ум с легкостью."
      - "Я помню Кансен, Сирен, Икс и Антиоха без каких-либо проблем."
      - "Есть также некоторые знания о Тестовом полигоне Альфа, Д-ре Анзил и Д-ре Аосте, а также о Зеро."
      - "А еще эта брошь и платок в моей руке... Их я не узнаю."
      - "Проклятье... Часть моих воспоминаний просто исчезла."
      - "Как это произошло? Почему это случилось?"
      - "Была еще та женщина с фиолетовыми волосами, с которой я говорил..."
      - "Она сказала мне свое имя... Какое оно было?"
      - "И вообще, почему я вдруг о ней вспомнил?"
  - text:
      - "Я записываю все свои мысли и воспоминания в блокнот, пока блуждаю по этому лабиринту памяти."
      - "Спустя какое-то время я собираю воедино достаточно фрагментированных воспоминаний, чтобы составить картину того, кто я такой."

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Что ж, это далеко не исчерпывающая информация, но она дает мне какое-то направление."
      - "И всё же я не имею ни малейшего понятия о том, где нахожусь."
      - "Инстинкты кричат, что нужно убраться отсюда..."
      - "Единственная проблема в том, что я не вижу выхода."
  - text:
      - "Поднявшись из руин, я достаю из кармана свой коммуникатор и пытаюсь сделать звонок. Ответа нет."
      - "Посреди моего смятения из окружающего пламени появляется девушка."

chapter3:
  rows:
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Эээ?"
      - "Почему ты здесь?"

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Адмирал... Хиппер?"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Хиппер, это ты!"

chapter6:
  rows:
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Прости? Ты знаешь, кто я?"
      - "Мы встречались раньше?"
  - char: "commander"
    side: "left"
    text:
      - "Я... не помню."
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Тогда откуда ты знаешь, кто я?"
  - char: "commander"
    side: "left"
    text:
      - "Ну... Этого я тоже не помню."
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Лааадно... Как ты вообще здесь оказался?"
  - char: "commander"
    side: "left"
    text:
      - "Не хочу звучать как заезженная пластинка, но я не помню."
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Конечно же не помнишь."
  - char: "commander"
    side: "left"
    text:
      - "Если позволишь спросить, ты знаешь, где мы?"
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Какая разница? Ты ведь всё равно не вспомнишь."
      - "Вот что тебе следует сделать — сидеть тут смирно и ждать прибытия спасателей."
  - char: "commander"
    side: "left"
    text:
      - "Спасателей? Кто придет меня спасать?"
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Какая разница? Ты ведь всё равно не вспомнишь."
  - char: "commander"
    side: "left"
    text:
      - "Прости. У меня тяжелый случай потери памяти."
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Угх..."
      - "Да, это довольно очевидно. А еще ты первый человек, который не закричал от страха при виде меня."
  - char: "commander"
    side: "left"
    text:
      - "Почему я должен тебя бояться? И не говори «какая разница»."
  - char: "admiral_hipper_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Повторяю — ты всё равно не вспомнишь, даже если я скажу."
      - "Пока."
  - text:
      - "Она грациозно разворачивается и уходит."
  - char: "commander"
    side: "left"
    text:
      - "Она ушла..."
      - "Что ж, она велела мне ждать, так что, полагаю, именно это я и сделаю."
      - "А пока я еще раз прокручу в голове то, что могу вспомнить."
      - "Проклятье... Почему я должен был всё забыть?"
