chapter1:
  rows:
  - text:
      - "Свет рассеивается,  и я оказываюсь в светлом классе."
  - char: "commander"
    side: "left"
    text:
      - "(Это что-то новенькое... Я не отключился, как в прошлый раз. Это больше похоже на то, когда Хелена подключает меня к своему секретному пространству...)"
      - "(Только на этот раз я не в пространстве со звёздами, а в учебном классе.)"
      - "(И где вообще Хелена?)"
  - char: "madam_m???"
    side: "right"
    text:
      - "Ждешь кого-то?"
  - text:
      - "Меня приветствует не Хелена, а женщина с фиолетовыми волосами, одетая в деловой костюм."
  - char: "madam_m"
    side: "right"
    text:
      - "Хи-хи. Рада встрече. Я Мадам М."

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "«М»?"
      - "Ты работаешь на Секретную службу, или?.."
  - char: "madam_m"
    side: "right"
    text:
      - "О, нет. Не в том смысле «М». Это не моя сфера деятельности."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ты подруга Мисс D?"
  - char: "madam_m"
    side: "right"
    text:
      - "Ну, можно сказать, что я ее знаю, но в то же время и нет."
      - "В любом случае, она не имеет отношения к этому разговору."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ты знаешь, где Хелена?"
  - char: "madam_m"
    side: "right"
    text:
      - "Ах, Хелена. Должно быть, она занята подготовкой к возможной четвертой атаке."
      - "Как бы то ни было, не она призвала тебя сюда. А я."
  - char: "commander"
    side: "left"
    text:
      - "Ты ведь не... несешь ответственность за те обмороки, что я пережил?"
  - char: "madam_m"
    side: "right"
    text:
      - "Отчасти. Хотя, в основном, это не имело ко мне никакого отношения."
  - char: "commander"
    side: "left"
    text:
      - "......"
      - "За какие части ответственна ты, а за какие — кто-то другой?"
  - char: "madam_m"
    side: "right"
    text:
      - "Хочешь, чтобы я просто всё рассказала? Так будет неинтересно."
  - char: "commander"
    side: "left"
    text:
      - "Я не думаю, что во всем этом есть хоть что-то «интересное»."
  - char: "madam_m"
    side: "right"
    text:
      - "Правда? Не находишь забавным искать знания в неизведанном?"
      - "Ты прошел через столько причудливых событий, и не хочешь узнать больше?"
      - "Например, кто ты такой или что ты видел?"
  - char: "commander"
    side: "left"
    text:
      - "Конечно я хочу это знать, но ты ведь мне не расскажешь, да?"
  - char: "madam_m"
    side: "right"
    text:
      - "Верно. Гораздо веселее, если ты сам найдешь ответы."
  - char: "commander"
    side: "left"
    text:
      - "Так зачем ты меня тогда призвала?"
      - "Если тебе нечего мне сказать, просто отправь меня обратно."
  - char: "zero_kid??"
    side: "right"
    text:
      - "Ты уходишь... уже?"
  - char: "commander"
    side: "left"
    text:
      - "А?!"
  - text:
      - "Сидящая рядом со мной девочка смотрит на меня любопытными глазами."
      - "Она застала меня врасплох. Она сливалась с окружением так идеально, что я её не заметил."
  - char: "commander"
    side: "left"
    text:
      - "(Я думал, мы с Мадам М здесь одни... Откуда она взялась?)"
      - "Ты... Зеро?"
  - text:
      - "Её сходство с ТБ и Зеро поразительно, хотя она явно моложе."
  - char: "madam_m"
    side: "right"
    text:
      - "О, она просто здесь учится. Не обращай на нее внимания."
  - char: "commander"
    side: "left"
    text:
      - "Учится?"
  - char: "madam_m"
    side: "right"
    text:
      - "Наблюдает, понимает, познает... Обычные вещи, которыми занимаются в классе."
  - char: "commander"
    side: "left"
    text:
      - "Да, но я имел в виду..."
      - "Погоди-ка, куда она делась?"
  - text:
      - "Когда я смотрю снова, её уже нет. Как будто она была лишь плодом моего воображения."
  - char: "madam_m"
    side: "right"
    text:
      - "Давай вернемся к нашей теме."
      - "Как ты уже догадался, я ничего тебе не расскажу."
      - "Однако, я гарантирую тебе право на поиск и на выбор."
      - "Если тебе нужны ответы, ты можешь найти их сам."
      - "Неплохое предложение, согласись?"
  - char: "commander"
    side: "left"
    text:
      - "В смысле... Я всё еще не понимаю, о чем ты."
  - char: "madam_m"
    side: "right"
    text:
      - "Поймешь. Со временем."
      - "А теперь пора уходить. И мне, и тебе."
  - char: "commander"
    side: "left"
    text:
      - "Уходить откуда? Ты имеешь в виду... из Сингулярности?"
      - "Ты правда хочешь сказать, что в реальном мире прошло три часа? Но для меня это ощущалось как пара минут..."
  - char: "madam_m"
    side: "right"
    text:
      - "В это трудно поверить, не так ли? Хи-хи."

chapter5:
  rows:
  - text:
      - "Когда свет меркнет, меня встречает потолок комнаты отдыха на борту Акаги."
  - char: "commander"
    side: "left"
    text:
      - "(Который час?)"
      - "(Быть не может... Действительно прошло ТРИ часа!)"
      - "(Ну, с другой стороны, это не ТАК уж и удивительно. В конце концов, я вздремнул.)"
  - char: "memphis"
    side: "right"
    text:
      - "Ты проснулся. Хорошо спалось?"
  - char: "commander"
    side: "left"
    text:
      - "Черт... Прости, что вот так уснул. А ведь я говорил, что пойду на мостик и всё такое."
  - char: "memphis"
    side: "right"
    text:
      - "Не переживай. Мы оторвались от наших преследователей. Остальные постоянно заходили проверить тебя."
  - char: "commander"
    side: "left"
    text:
      - "Так я просто спал? Как обычно?"
  - char: "memphis"
    side: "right"
    text:
      - "Ну, да. А почему ты спрашиваешь?"
      - "О нет... У тебя было еще одно видение во сне, не так ли?!"
  - char: "commander"
    side: "left"
    text:
      - "Нет, ничего подобного. Просто стало любопытно."
      - "(А вообще... Видел ли я ЧТО-ТО в своих снах?)"
      - "(Мог бы поклясться, что собирался о чем-то спросить Хелену...)"
      - "(Что-то там про женщину с фиолетовыми волосами? Я не знаю. Я не могу вспомнить.)"
      - "(Может, это был просто обычный сон.)"
      - "Мы уже выбрались из Сингулярности?"
  - char: "memphis"
    side: "right"
    text:
      - "Пока не совсем. Мы вышли из зоны досягаемости Нараки, но теперь мы внутри Сингулярности океана NA."
      - "Но мы покинем и её уже совсем скоро."
      - "К другим новостям — Синано исчезла в тот же момент, как мы вышли из зоны Нараки."
  - char: "commander"
    side: "left"
    text:
      - "Да. Как Хелена и говорила."
      - "Похоже, всё это время она была лишь проекцией, способной существовать только внутри Сингулярности."
      - "Хотя, учитывая её связь с Ватацуми, возможно, она видела всё произошедшее как часть сна."
  - char: "memphis"
    side: "right"
    text:
      - "И что тогда наша Синано делает сейчас?"
  - char: "commander"
    side: "left"
    text:
      - "Она, вероятно, в своей постели в консульстве Ортодоксии, и только что проснулась."
  - char: "memphis"
    side: "right"
    text:
      - "Значит, она может заниматься чем угодно, не вылезая из своей уютной постели... Какая лентяйка."
      - "Или, наверное, мне следует сказать... я завидую."
  - char: "commander"
    side: "left"
    text:
      - "Я, например, просто рад, что мы выбрались из этой передряги."
  - char: "memphis"
    side: "right"
    text:
      - "И в немалой степени благодаря тебе. Мы наконец-то возвращаемся домой!"
