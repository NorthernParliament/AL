chapter1:
  rows:
  - text:
      - "Среди обломков в Нараке женщина, облаченная в темно-красное, стояла и смотрела на давно исчезнувший кильватерный след, оставленный Акаги."
  - char: "akagi_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "......"
      - "«Мы будем менять всё до тех пор, пока не останется печали.»"

chapter2:
  rows:
  - text:
      - "БАБАХ!"
  - text:
      - "Море пламени. Воспоминание. Несколько фигур, слабо покачивающихся на залитой лунным светом поверхности моря."
  - char: "kaga"
    side: "left"
    text:
      - "Держись. Мы почти в оке бури!"
  - char: "amagi"
    side: "right"
    text:
      - "Они нас окружили. Наш враг явно был хорошо подготовлен."
      - "Даже если мы отступим в око бури, вряд ли нам удастся благополучно спастись."
  - char: "kaga"
    side: "left"
    text:
      - "Проклятье..."
  - char: "amagi"
    side: "right"
    text:
      - "Это и впрямь абсурд... Мобилизация таких огромных сил под видом «учений» никого не одурачит."
      - "Интересно, какое оправдание они придумают на этот раз, чтобы скрыть правду."
  - char: "kaga"
    side: "left"
    text:
      - "Сейчас есть о чем еще подумать! Сосредоточься!"
      - "Они ждали нас в засаде, так что почти наверняка знали о нашем плане."
      - "Если так, то мы, вероятно, не единственные их цели. Должно быть, они напали и на остальных."
  - char: "amagi"
    side: "right"
    text:
      - "Я бы не стала об этом беспокоиться."
      - "Судя по интенсивности их атак, ясно, что нам оказывают особый прием."
      - "Полагаю, это потому, что на нашей стороне больше «важных шишек»..."
      - "Несмотря ни на что, Факел будет создан, независимо от того, сможем ли мы в конце концов перегруппироваться."
      - "Жаль только, что мы так никогда и не увидим, как разгорится его пламя."
  - char: "akagi"
    side: "left"
    text:
      - "Хе-хе... Хе-хе-хе..."
      - "Они создавали и использовали нас лишь как оружие... Возлагали на нас надежды и боялись нас, и всё это — даже не спрашивая нашего мнения..."
      - "А теперь они решили, что нам пора пойти ко дну..."
      - "Хе-хе-хе..."
      - "Мы пытались принять этот мир, и вот что мы получаем?"
      - "Раз они этого хотят, пусть будет так!"

chapter3:
  rows:
  - text:
      - "Пламя взметнулось ввысь, и повсюду во множестве расцвели багровые паучьи лилии."
  - char: "akagi_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хе-хе... Хе-хе-хе... Аха-ха-ха-ха!"
      - "Тогда умрите..."
      - "Сгорите же дотла..."
      - "Если суждено погибнуть, я заберу их всех с собой!"
      - "АХА-ХА-ХА-ХА-ХА!"

chapter4:
  rows:
  - char: "akagi_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Я не помню тебя."
      - "Но я знаю, что ты не виноват в постигшей их участи."
      - "Ты просто... не смог это остановить."
      - "Многие заслуживают гибели, но ты не из их числа."
      - "«Продолжай менять всё до тех пор, пока не останется печали...»"
      - "Это то, чего ты желаешь."
      - "И что бы ни скрывалось в конце этого пути, я увижу это вместе с тобой."
  - text:
      - "В руке Акаги появился колокольчик."
      - "Она позвонила в него, пустив по воде расходящуюся рябь."

chapter5:
  rows:
  - text:
      - "Спустя некоторое время звон затих, и она бесследно исчезла."
      - "Когда не осталось никого, кто мог бы за ней наблюдать, Нарака схлопнулась внутрь себя, прежде чем исчезнуть полностью."
