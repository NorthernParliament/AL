chapter1:
  rows:
  - text:
      - "Пока Сингулярность Нарака схлопывается, одинокий корабль прорезает густую тьму на краю забвения."

chapter2:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "Какие ужасные условия... Не думала, что ты сможешь вести корабль сквозь всю эту пыль и обломки..."
  - char: "commander"
    side: "right"
    text:
      - "Прошло уже три часа с тех пор, как мы начали движение. Пока все хорошо — будем надеяться, что так и останется."
  - char: "akagi"
    side: "left"
    text:
      - "Как думаешь, сколько еще это займет времени, Командир?"
  - char: "commander"
    side: "right"
    text:
      - "Судя по расчетам Обсервер и скорости этого судна... Я бы сказал, еще часов семь."
  - char: "memphis"
    side: "left"
    text:
      - "Целых семь часов... Значит, в целом это десятичасовое путешествие."
      - "Странно, учитывая, что у тебя ушло всего мгновение, чтобы войти в сегмент мира..."
  - char: "commander"
    side: "right"
    text:
      - "В этот раз всё занимает больше времени, потому что нам пришлось пойти в обход."
      - "Кроме того, десять часов, чтобы добраться от островов Сакуры до самого сердца океана NA — это отнюдь не медленно."
  - char: "memphis"
    side: "left"
    text:
      - "Полагаю, всё так и есть."
  - char: "akagi"
    side: "right"
    text:
      - "Кстати говоря, сколько времени прошло для людей в океане NA?"
  - char: "commander"
    side: "left"
    text:
      - "Как минимум семь часов. Обсервер лишь прислала мне несколько формул и не стала ничего подробно объяснять."
      - "Хочешь взглянуть на них?"
  - char: "akagi"
    side: "right"
    text:
      - "Спасибо, но нет."
      - "К тому же, разве ты не вымотался после всех этих испытаний?"
      - "Тебе нужно немного отдохнуть. Я останусь здесь и присмотрю за всем."
  - char: "commander"
    side: "left"
    text:
      - "Пока нет. Я хочу прочувствовать, каково это — находиться на борту твоего судна."
      - "Мне любопытно, почему ты выбрала именно его. Казалось, что на судне Синано условия для экипажа были лучше."
  - char: "akagi"
    side: "right"
    text:
      - "Это правда. Судно Синано более пригодно для жизни."
      - "Просто... У меня были свои сомнения насчет того, чтобы делать его нашим командным судном."
  - char: "commander"
    side: "left"
    text:
      - "Знаешь, Обсервер сказала то же самое."
      - "С ним было что-то не так?"
  - char: "akagi"
    side: "right"
    text:
      - "Вовсе нет. Просто считай, что мой выбор этого судна — хорошее предзнаменование."
  - text:
      - "ШУУРХ..."
  - text:
      - "Внезапно я слышу звук, похожий на тасование колоды карт."

chapter3:
  rows:
  - text:
      - "Комнату начинает заполнять красный туман, обволакивая меня вместе с окружающим пространством."

chapter4:
  rows:
  - text:
      - "В ярко освещенной комнате перед школьной доской стоит женщина. Она обращается ко мне."
  - char: "anzeel"
    side: "left"
    text:
      - "Ассистент? Ты вообще меня слушаешь?"
      - "Эта часть ЧРЕЗВЫЧАЙНО важна!"
      - "Давай, просыпайся. Осталось совсем немного."
      - "АССИСТЕНТ!"

chapter5:
  rows:
  - text:
      - "Дама в несколько растрепанном виде протягивает мне визитку в просторном офисном помещении."
  - char: "collet"
    side: "left"
    text:
      - "Я Коллет из Торгового Альянса OXS."
      - "Еще раз, рада встрече с тобой, Командир."

chapter6:
  rows:
  - text:
      - "В темной комнате на мониторе появляется фигура."
  - char: "sophia???"
    side: "left"
    text:
      - "Командир! Эксперимент наконец-то принес плоды!"
      - "Твое тесное общение с Аосте действительно окупилось. Хи-хи."
      - "Это исследование действительно повергнет ту упрямую кучку в шок."

chapter7:
  rows:
  - text:
      - "В конференц-зале вокруг круглого стола сидит большая группа людей."
  - char: "eldery_voice"
    side: "left"
    text:
      - "Заседание объявляется закрытым. К сожалению, предложенная нами поправка не прошла голосование Объединенного Совета."
      - "В результате, мы продолжим действовать по нашему первоначальному плану."
      - "Пришло время принять решение, Главный Командир."

chapter8:
  rows:
  - text:
      - "Девочка в классе показывает мне рисунки в своем альбоме."
  - char: "anchorage"
    side: "left"
    text:
      - "Учитель... Я красиво нарисовала?"
      - "Ты правда... завтра уезжаешь?"
      - "Не уходи... Останься здесь..."

chapter9:
  rows:
  - text:
      - "Флот кансен ведет бой в серебристом море."
  - char: "lexington"
    side: "left"
    text:
      - "Командир?!"
      - "Что ты до сих пор здесь делаешь?"
      - "Сара! Хватай Командира и убирайтесь отсюда!"
  - text:
      - "БАБАХ!"

chapter10:
  rows:
  - char: "nop"
    side: "left"
    text:
      - "???\tКо...дир... Командир!"
  - text:
      - "Бесчисленные сцены проносятся перед моими глазами, появляясь и исчезая в одно мгновение."
  - char: "nop"
    side: "left"
    text:
      - "...ты слышишь..."
  - text:
      - "Такое чувство, будто мой мозг засунули в центрифугу, вращающуюся на максимальной скорости."
  - char: "nop"
    side: "left"
    text:
      - "Ты меня слышишь?!"
  - text:
      - "Мой разум ломается, раскалывается и погружается в водоворот."

chapter11:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "Командир!"
  - char: "commander"
    side: "right"
    text:
      - "Угх..."
      - "Что произошло?.."
  - text:
      - "Наконец-то это прекратилось. Я снова могу ясно мыслить."
      - "Я снова на борту серийного корабля Акаги, в окружении обеспокоенных мной кансен."
  - char: "memphis"
    side: "left"
    text:
      - "Боже... Ты меня так напугал."
      - "Ты отключился с широко открытыми глазами! Я звала тебя снова и снова, но ты никак не реагировал."
  - char: "commander"
    side: "right"
    text:
      - "Погоди... Я отключился? Надолго?"
  - char: "memphis"
    side: "left"
    text:
      - "Как минимум на целую минуту! ..Эй, Командир, ты уверен, что с тобой всё в порядке?"
  - char: "commander"
    side: "right"
    text:
      - "Целую минуту?"
      - "(В реальности прошла всего минута? После всего того, что я увидел?)"
      - "Наверное, ничего страшного. Должно быть, я просто устал."
  - char: "memphis"
    side: "left"
    text:
      - "Очень надеюсь, что это так. Ты жестко выпал из реальности."
  - char: "akagi"
    side: "right"
    text:
      - "Мемфис, твое беспокойство за Командира нормально, но ты не должна так терять самообладание."
      - "Ты выглядела так, будто собиралась поднять тревогу по всему судну, пока Командир не очнулся."
      - "Слава богу, я была здесь. Иначе это могло бы превратиться в огромную проблему."
  - char: "memphis"
    side: "left"
    text:
      - "Простите уж за то, что я слишком осторожна..."
  - char: "akagi"
    side: "right"
    text:
      - "А теперь, Командир, тебе действительно стоит отдохнуть."
  - char: "commander"
    side: "left"
    text:
      - "Хорошо. Так и сделаю."
      - "(Хочу знать, как и почему это только что произошло... но в то же время я совершенно не могу сейчас сосредоточиться.)"
  - char: "akagi"
    side: "right"
    text:
      - "Я попрошу Дзуйкаку принести закуски в комнату отдыха. Впереди еще много часов пути, так что используй это время, чтобы подзарядить батарейки."
  - char: "commander"
    side: "left"
    text:
      - "Спасибо. Я ценю это."
  - char: "memphis"
    side: "right"
    text:
      - "Ладно-ладно, ты просто сосредоточься на управлении судном. А я провожу Командира в комнату отдыха."
  - text:
      - "Мемфис подходит и подставляет мне плечо, чтобы я мог опереться."
  - char: "memphis"
    side: "right"
    text:
      - "Потихоньку. Пошли."
  - char: "akagi"
    side: "left"
    text:
      - "Не так быстро. С чего это вдруг именно ты должна сопровождать Командира?"
  - char: "memphis"
    side: "right"
    text:
      - "Кто-то должен это сделать. Или ты бы предпочла сделать это вместо меня?"
  - char: "akagi"
    side: "left"
    text:
      - "Не язви. Если уж берешься за это, захвати с собой те фрукты."
  - text:
      - "Акаги указывает на миску с фруктами, которую кто-то оставил на столе."
  - char: "memphis"
    side: "right"
    text:
      - "И что с ними делать?"
  - char: "akagi"
    side: "left"
    text:
      - "Очистить их и кормить Командира по одному кусочку за раз. Мне что, всё нужно тебе объяснять?"
  - char: "memphis"
    side: "right"
    text:
      - "Прошу прощения?"
  - char: "akagi"
    side: "left"
    text:
      - "Давай же. Забирай их и иди."
  - char: "memphis"
    side: "right"
    text:
      - "Угх..."
  - text:
      - "Мемфис на секунду мешкает, прежде чем забрать миску с фруктами."

chapter12:
  rows:
  - char: "memphis"
    side: "right"
    text:
      - "«Кормить Командира по кусочку за раз»... Кем она меня возомнила?"
      - "Неважно... Я не могу позволить себе заводиться из-за этого."
      - "Пойдем, Командир. Давай живо отведем тебя в комнату отдыха!"
