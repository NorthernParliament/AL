chapter1:
  rows:
  - text:
      - "Лиса-Хранительница стояла на поверхности воды, исполняя церемониальный танец."
      - "Падающие звезды проносились по небу, их хвосты менялись в струящемся свете."
      - "Две луны висели в темноте над головой, прибывая и убывая, становясь частью струящихся огней."
      - "В конце концов, в темной ночи остались лишь эти две луны."
      - "Ритуал завершился, и звезды вернулись в свои созвездия."

chapter2:
  rows:
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "...Ты готовишь Ритуал Воскрешения?"
      - "Я возвращаюсь домой, и меня тут же встречают таким зрелищем..."
      - "Я не против одолжить твою силу, но неужели нужно помогать до такой степени?"
  - char: "nagato_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Ты пострадала из-за меня. Ты достойна этого."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "......"
  - char: "nagato_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Скажи мне, как твоё «подглядывание» на этот раз?"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Всё в точности так, как ты и предвидела, госпожа Нагато."
      - "Но, какими бы сильными они ни казались, они всё еще лишь подопытные кролики в экспериментах Сирен."
  - char: "nagato_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Разве ты сама не была когда-то такой же?"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Когда-то — да. Признаешь ты это или нет... мы и они совершенно разные на экзистенциальном уровне."
  - char: "nagato_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Что ты хочешь этим сказать?"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Я хочу сказать, что даже боги не все одинаково могущественны."
      - "Оставим это. Я отказалась от своего плана мести. Однако и твой план я поддерживать не стану."
      - "А пока что я собираюсь отдохнуть."
  - char: "nagato_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Очень хорошо. Поступай как знаешь."
      - "У нас с тобой общая цель. Пусть наши пути к ней и различаются, в конце мы всё равно встретимся."

chapter3:
  rows:
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Прощай, госпожа Нагато."

chapter4:
  rows:
  - char: "houshou_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "......"
      - "Мне присматривать за ней?"
  - char: "nagato_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Нет. Она имеет право делать собственный выбор, как и любая другая."
      - "Я не могу контролировать тебя, и ты не обязана подчиняться каждому моему приказу."
  - char: "houshou_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Но, госпожа Нагато..."
  - char: "nagato_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Не напрягайся так. Я просто говорю правду."
      - "Знай, что наши дела важнее этих её планов."
      - "Я всё решила. Мы будем двигаться вперед, используя всё, что у нас есть."
      - "...Ты видела, через что прошел Тестовый полигон Бета, Хосё. Действуй с должной осторожностью."
  - char: "houshou_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Обязательно."
      - "Но, если позволишь мое любопытство... Что ты думаешь об этом «Командире»?"
  - char: "nagato_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Ты ведь не помнишь своего Командира? Как не помню и я."
  - char: "houshou_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Не помню... Сказать по правде, это очень, очень странное чувство."
  - char: "nagato_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Тем больше у нас причин для осторожности."
      - "Возможно, он замешан в секретном плане Совета..."
      - "Давай оставим этот разговор на другой раз."
  - char: "houshou_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Да, госпожа."
