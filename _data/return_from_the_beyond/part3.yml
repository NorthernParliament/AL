chapter1:
  rows:
  - text:
      - "Войдя в комнату отдыха, я вижу, что на столе уже расставлены тарелки с сакуранскими закусками."
  - char: "memphis"
    side: "left"
    text:
      - "Боже. Эти угощения довольно изысканные."
  - text:
      - "Мемфис ставит миску с фруктами рядом с тарелками и с большим любопытством разглядывает закуски."
  - char: "memphis"
    side: "left"
    text:
      - "Они сильно отличаются от того, что можно увидеть в Европе или Империи..."
      - "Интересно, все ли сакуранские закуски такие. Хочешь попробовать, Командир?"
  - text:
      - "Она протягивает мне тарелку с разноцветными маленькими шариками из теста."
  - char: "commander"
    side: "right"
    text:
      - "Что это? Данго?"
  - char: "memphis"
    side: "left"
    text:
      - "Ага!.. Сакуранские данго. Кажется, они сделаны из муки, перемолотой из риса косихикари."
      - "Что касается вкуса... Думаю, в красном начинка из пасты красных бобов."
      - "Кстати, не возражаешь, если я угощусь одним?"
  - char: "commander"
    side: "right"
    text:
      - "Нисколько. Тут на всех хватит."
  - char: "voice_an"
    side: "left"
    text:
      - "ВИИУ! ВИИУ!"
  - char: "memphis"
    side: "right"
    text:
      - "Это общекорабельная тревога?!"
      - "Ах!.. Командир, хватайся за..."
  - text:
      - "Корабль раскачивается и трясется, и я начинаю терять контроль над своим телом."
  - char: "commander"
    side: "left"
    text:
      - "(Не только над телом... Мой разум тоже ускользает...)"
  - text:
      - "ШУУРХ..."
  - char: "commander"
    side: "left"
    text:
      - "(Что? Что это был за звук?)"

chapter2:
  rows:
  - text:
      - "ДЗЫЫЫНЬ!"
      - "Оглушительный звон встряхивает меня ровно настолько, чтобы я остался в сознании."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Где я на этот раз? Какая-то... машина, движущаяся на невероятной скорости?)"
  - text:
      - "Единственное, что я вижу — это слабый синий свет."
  - char: "commander"
    side: "left"
    text:
      - "(Я не могу пошевелиться... Мои руки и ноги не двигаются...)"
      - "(И все же, нет ощущения, что я связан...)"
  - char: "distant_voice"
    side: "right"
    text:
      - "...Я не ожидала, что они так быстро нас нагонят."
  - char: "commander"
    side: "left"
    text:
      - "(Чей это голос? Звучит знакомо...)"
  - char: "second_voice"
    side: "right"
    text:
      - "Они разгадали истинную цель нашего плана?"
      - "Или их блокада просто надежнее, чем мы думали?"
  - char: "distant_voice"
    side: "left"
    text:
      - "Продолжай выпускать приманки. Рассей преследователей и уведи их по другим координатам."
      - "Мы будем в безопасности, как только покинем эту эпоху."
  - char: "second_voice"
    side: "right"
    text:
      - "Поняла."
  - text:
      - "Затем голоса замолкают."
  - char: "commander"
    side: "left"
    text:
      - "(Два отчетливых голоса... Думаю, один из них я узнал, но второй был совершенно незнаком.)"
      - "(Было трудно расслышать их из-за всего этого шума...)"
      - "(Неважно. Нужно сосредоточиться на том, чтобы вернуться в реальность.)"
  - text:
      - "Мои руки и ноги, кажется, совершенно меня не слушаются... но, по крайней мере, я всё еще могу свободно осматриваться."
      - "Я концентрируюсь изо всех сил и изучаю свое окружение."
  - char: "commander"
    side: "left"
    text:
      - "(Погодите-ка... Куда делся мой нос?)"
      - "(Обычно ты не замечаешь собственный нос, но вообще не иметь возможности его увидеть — совсем другое дело.)"
      - "(Разве что... Нет... Такого просто не может быть.)"
      - "(Что, если причина, по которой я не могу пошевелиться, в том, что... у меня нет тела, которым можно двигать...)"
  - text:
      - "Ужасающая мысль проносится у меня в голове."
      - "Словно в ответ на мою тревогу, пространство вокруг меня начинает дрожать."
      - "Дрожь усиливается и усиливается, и мой разум кажется на грани краха..."

chapter4:
  rows:
  - text:
      - "Внезапно всё замедляется, слабеет, пока не останавливается полностью."
      - "Мой разум все еще затуманен от шока, когда я вижу море синих цветов и женщину, стоящую в нём."
      - "Лепестки взмывают в лазурное небо, а серебристые волосы развеваются на ветру."
      - "Вспышка белого света окутывает всё вокруг."

chapter5:
  rows:
  - text:
      - "Когда она гаснет, передо мной появляется Мемфис МЕТА."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "С возвращением, Командир."
  - char: "commander"
    side: "right"
    text:
      - "Мемфис?.."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Это я. Хотя, я не та Мемфис, с которой ты только что говорил."
      - "Она ушла проверить, не получил ли корабль повреждений."
      - "На самом деле, бессмысленно. Небольшая встряска никак не могла его повредить."
  - char: "commander"
    side: "right"
    text:
      - "Ну, ты не можешь винить её за это желание."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Полагаю, это то, что ее успокоит."
      - "В любом случае, как ты себя чувствуешь? Тебе не плохо?"
  - char: "commander"
    side: "right"
    text:
      - "Я в порядке, спасибо."
      - "Могу я спросить, почему ты здесь?"
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Я здесь, чтобы помочь тебе, если это было не очевидно."
      - "Ох, прости. Позволь перефразировать: я рада, что наконец-то могу помочь тебе."
      - "Можешь винить в этом Хелену. Если бы не она и ее план, тебе не пришлось бы идти в обход, а мне не пришлось бы появляться."
  - char: "commander"
    side: "right"
    text:
      - "«Она и ее план»?"
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Эм... Ничего важного. Забудь, что я это сказала."
  - char: "commander"
    side: "right"
    text:
      - "Раз ты так говоришь. Ты знаешь причину этой тряски и тревоги?"
      - "Кроме того, я был очень близок к тому, чтобы снова отключиться... Что со мной происходит?"
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Всё по порядку. Во-первых, тряска произошла из-за всплеска внутри Нараки, который привел в движение множество обломков."
  - char: "commander"
    side: "right"
    text:
      - "Всплеска? Не могла бы ты уточнить?"
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Это явление, которое иногда случается внутри Нараки."
      - "Когда происходит всплеск, обломки начинают бурлить, словно поток, утягивающий всё, что в него попало, в глубины Нараки."
      - "Подозреваю, что именно это и вызвало твое отключение сознания."
      - "Но не волнуйся. Ты вне опасности."
  - char: "commander"
    side: "right"
    text:
      - "Находиться внутри Сингулярности так же опасно, как и ожидалось, хах..."
      - "Кстати, сколько времени мне потребовалось, чтобы прийти в себя после отключки?"
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Где-то от семи до восьми минут."
  - char: "commander"
    side: "right"
    text:
      - "(В первый раз говорили, что я просто «выпал из реальности», а на этот раз я полностью потерял сознание... К тому же, я был в отключке дольше.)"
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Ты выглядишь так, будто вот-вот свалишься. Разве тебе не следует отдохнуть?"

chapter6:
  rows:
  - char: "observer"
    side: "left"
    text:
      - "Это уже второй раз. Твой контроль над этим проходом ослабевает?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я перенаправлю ресурсы с Башни, чтобы стабилизировать его. Ты займись навигацией."
      - "Я выдам тебе права администратора. Используй их с умом."
  - text:
      - "Глаза Обсервер мерцают, словно звезды в небе."
  - char: "observer"
    side: "left"
    text:
      - "Погоди-ка... Это доступ к Башне?"
      - "Я бы подумала, что она подключена к Системе Натуральных Вычислений, если бы процесс верификации не был совершенно иным!.."
      - "Я слышала истории о тебе, но вау, ты нечто. Твой талант воистину всеобъемлющ."
      - "Ты могла бы даже построить новую сеть, используя силы Башни."
      - "Однако я должна спросить... Что такое Башня на самом деле?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Меньше разговоров, больше сосредоточенности."
  - char: "observer"
    side: "left"
    text:
      - "Хи-хи. Естественно!.. В кои-то веки я чувствую странную мотивацию, так что будь уверена, я сделаю свою работу."
