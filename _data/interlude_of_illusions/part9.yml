chapter1:
  rows:
  - text:
      - "Мерный стук колёс поезда постепенно замедляется. Наконец, раздаётся гудок, возвещающий о нашем прибытии на станцию."
  - char: "helena"
    side: "left"
    text:
      - "Командир. Просыпайся. Мы приехали."

chapter2:
  rows:
  - text:
      - "Я открываю глаза... но вижу лишь кромешную тьму."
  - char: "commander"
    side: "left"
    text:
      - "(На мне маска для сна?)"

chapter3:
  rows:
  - text:
      - "Я рукой стягиваю повязку. Выглянув в окно, вижу показавшуюся величественную Базилику."
  - char: "commander"
    side: "left"
    text:
      - "Откуда взялась эта маска?"
  - char: "memphis"
    side: "right"
    text:
      - "Это я на тебя её надела."
      - "Ты так громко заявлял о том, как много работы собираешься переделать в поезде, а затем закрыл глаза и мгновенно задремал."
      - "Я решила, что тебе нужен здоровый сон, поэтому прикрыла тебе глаза."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Спасибо. Я спал как убитый."
  - char: "memphis"
    side: "right"
    text:
      - "Не за что. Секретарь должна понимать, когда нужно делать подобные вещи."
      - "Знать, что ты хорошо выспался, — лучшее, о чём я могла просить."
      - "А теперь собирай вещи. Нас ждут учения!"

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Но как же мои накопившиеся дела?!"
  - char: "memphis"
    side: "right"
    text:
      - "Ты и впрямь трудоголик до мозга костей, раз начинаешь говорить о работе в ту же секунду, как проснулся..."
  - char: "helena"
    side: "left"
    text:
      - "Да, Мемфис, мы это уже слышали..."
  - char: "memphis"
    side: "right"
    text:
      - "Неважно! В любом случае я уже сделала твою работу за тебя, так что просто забудь об этом!"
      - "А теперь готовься к высадке. Нас ждут учения!"

chapter6:
  rows:
  - text:
      - "Из Базилики я наблюдаю за ходом учений через множество парящих в воздухе дронов."
      - "Кадры передаются на моё устройство, обрабатываются системой тактического анализа и транслируются мне в реальном времени."
      - "В данный момент сражаются Ортодоксия и Железная Кровь, и они идут ноздря в ноздрю."
  - char: "memphis"
    side: "left"
    text:
      - "Вот тебе и сила модернизации. Модернизируешь крейсер и выставляешь его против линейного крейсера той же эпохи, и первый заставит второго попотеть."
      - "Надеюсь, Союз Орла тоже соберёт собственный флот, ориентированный на модернизацию."
  - text:
      - "*тук тук*"
  - char: "helena"
    side: "left"
    text:
      - "Кто там?"
  - char: "brunhilde"
    side: "right"
    text:
      - "У меня послание от Бисмарк. Она говорит, что хотела бы, чтобы ты пришёл посмотреть учения вместе с ней."

chapter7:
  rows:
  - char: "bismarck"
    side: "left"
    text:
      - "Здравствуй, Командир. Чувствуй себя как дома."
      - "Конечно. Это неформальная встреча, и я рада отказаться от формальностей."
      - "Ох. Нет, с Герионом всё в порядке, и моя оснастка Цвай работает как обычно."
      - "Я нахожусь в таком виде лишь для того, чтобы выразить своё стремление к миру. Личный имидж также имеет значение в политике."
      - "Давай не будем забывать, что мы также находимся на земле Ортодоксии."
      - "Ты всё неправильно понял."
      - "Это мероприятие призвано укрепить связи между фракциями. Если я в какой-то мере не раскрою свои карты, это вызовет нежелательные спекуляции. Ты ведь считаешь так же, не правда ли?"
      - "Если бы дело было только в связях, я бы не присутствовала здесь лично. Я рассматриваю варианты создания альянса."
      - "Проницателен, как всегда."
      - "Наша война с Сиренами — или, по крайней мере, наша война с их экспериментальным подразделением — близится к завершению. Я должна начать планировать, что будет дальше."
      - "Да, это одно из дел, но не единственное."
      - "Если бы простое объединение позволило Лазурному пути процветать, Багровая Ось никогда бы не появилась."
      - "Он был у нас и тогда."
      - "Ты здесь, разговариваешь со мной именно потому, что не веришь, будто конференции в Ортодоксии будет достаточно для реформирования Лазурного пути, не так ли?"
      - "Хи-хи. Можешь не отвечать. Я знаю, о чём ты думаешь."
      - "Железная Кровь исполнит твоё желание. Чего бы это ни стоило."

chapter8:
  rows:
  - text:
      - "Медленная музыка наполняет зал, обставленный в классическом стиле Ортодоксии. На вечеринке присутствуют представители всех фракций."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Хм... Как бы мне ни было неприятно это признавать, но еда довольно вкусная."
      - "Вы устроили неплохую вечеринку, учитывая, как мало у вас было времени."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Да. Действительно создаётся ощущение, что они выложились на полную."
  - char: "richelieu"
    side: "left"
    text:
      - "Спасибо. Я польщена. С таким количеством присутствующих фракций я бы не посмела предложить своим гостям ничего, кроме самого лучшего."
  - text:
      - "Музыка стихает. Затем, откуда ни возьмись, ко мне подходит Страсбург."
  - char: "strasbourg"
    side: "left"
    text:
      - "Хи-хи. Добро пожаловать в Мон-Сен-Мишель, Командир."
      - "Ришелье сказала, что ты очень лестно обо мне отзывался."
      - "Эй, если ты свободен... могу я пригласить тебя на танец?"

chapter9:
  rows:
  - text:
      - "Это был чудесный день."
      - "Надеюсь, завтрашний день будет таким же замечательным."
