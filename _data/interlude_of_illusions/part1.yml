chapter1:
  rows:
  - text:
      - "*вой сирен*"
      - "Огонь, дым, разрушение. Мир рушится прямо на моих глазах."
      - "Сирены пронзительно воют, повсюду скрежет металла и крики, в воздухе со свистом проносятся бомбы."
      - "Святая земля Ирис превратилась в сущий ад."
  - char: "strasbourg"
    side: "left"
    text:
      - "Не может быть..."
  - text:
      - "БАБАХ!!!"
  - char: "dupleix"
    side: "left"
    text:
      - "Страсбург! Наконец-то я тебя нашла!"
  - char: "l_audacieux"
    side: "right"
    text:
      - "*тяжело дышит* Ты в порядке? Пожалуйста, скажи нам хоть что-нибудь!"
  - char: "strasbourg"
    side: "left"
    text:
      - "Я... в порядке. Кажется."
  - text:
      - "Я пытаюсь сосредоточиться, но в голове полная каша, мысли всё ещё путаются."
      - "Даже очевидные вещи ускользают от меня — кто я, где я нахожусь и что здесь делаю."
  - char: "strasbourg"
    side: "left"
    text:
      - "Я... Точно, я линейный крейсер Страсбург."
  - char: "dupleix"
    side: "right"
    text:
      - "Ну, да."
  - char: "l_audacieux"
    side: "left"
    text:
      - "Что-то не так?"
  - char: "strasbourg"
    side: "right"
    text:
      - "Нет, всё нормально. Где мы? Что вообще происходит?"
  - char: "dupleix"
    side: "left"
    text:
      - "Дело плохо, Л'Одасьёз. Кажется, она ударилась головой."
  - char: "l_audacieux"
    side: "right"
    text:
      - "Давайте сохранять спокойствие! Сделай глубокий вдох, Страсбург. Расскажи, что последнее ты помнишь."
  - char: "strasbourg"
    side: "left"
    text:
      - "Последнее..."
      - "Я помню... организацию совместных учений, а после них был банкет..."
      - "Там были цветы, изысканная еда и музыка..."
  - char: "dupleix"
    side: "right"
    text:
      - "Страс... Этот банкет был два дня назад."
  - char: "l_audacieux"
    side: "left"
    text:
      - "Понятно... Ты явно дезориентирована."
      - "Здесь опасно, и мы попадём под перекрёстный огонь, если не убежим! Поговорим позже!"
  - char: "strasbourg"
    side: "right"
    text:
      - "Мы... собираемся сбежать?"
  - char: "dupleix"
    side: "left"
    text:
      - "Да, она именно это и сказала. Давай, пошевеливайся!"
  - text:
      - "БАБАХ!!!"
      - "Поблизости падает снаряд. Взрыв поднимает в воздух камни, которые со свистом пролетают прямо перед моим лицом, и воспоминания начинают возвращаться одно за другим."
  - char: "strasbourg"
    side: "left"
    text:
      - "Ортодоксия, Королевский Флот, Железная Кровь, Империя Сардиния... Четыре главные фракции проводили совместные учения, чтобы укрепить свои связи."
      - "Но потом мы почему-то начали сражаться друг с другом..."
      - "Я думала, мы оставили эти мелкие междоусобицы в прошлом..."
      - "Мы бежали из Кебира, Тулона и даже из Мон-Сен-Мишеля..."
      - "Как долго мы будем продолжать бежать?! Как долго нам ещё придётся сражаться?!"
  - text:
      - "БАБАХ!!!"
      - "Мой бессильный, полный негодования крик тонет в оглушительном грохоте орудий."
      - "В то же время мир начинает вращаться вокруг меня."

chapter2:
  rows:
  - char: "strasbourg"
    side: "left"
    text:
      - "*фух*"
  - text:
      - "Сквозь шторы пробивается мягкий солнечный свет."
  - char: "strasbourg"
    side: "left"
    text:
      - "Я... в своей комнате..."
      - "Я всё ещё жива... Значит, это был всего лишь дурной сон..."
      - "Жутко реалистичный, но всё же сон..."
  - text:
      - "Страсбург энергично трясет головой, пытаясь об этом забыть, но воспоминания не хотят уходить."
  - char: "strasbourg"
    side: "left"
    text:
      - "Мне нужно поговорить с ними..."

chapter3:
  rows:
  - char: "l_audacieux"
    side: "left"
    text:
      - "По правде говоря... мне приснился тот же сон."
      - "Мы все сражались друг с другом, пока вокруг нас горели моря."
      - "Дюплекс и я бегали повсюду, пытаясь спасать людей, и именно тогда мы нашли тебя."
  - char: "dupleix"
    side: "right"
    text:
      - "Может, это была галлюцинация, вызванная стрессом... Хотя вероятность такого совпадения невероятно мала."
  - char: "strasbourg"
    side: "left"
    text:
      - "Тебе приснился тот же сон?"
  - char: "dupleix"
    side: "right"
    text:
      - "Да. Точно такой же."
  - char: "strasbourg"
    side: "left"
    text:
      - "Значит, нам троим приснилось одно и то же... Это должно что-то значить."
  - char: "dupleix"
    side: "right"
    text:
      - "Мне это кое-что напоминает — событие, близкое к наложению."
      - "Все присутствовавшие тогда на Всемирной выставке сообщали, что видели одно и то же. Так что, если то же самое происходит и здесь..."
  - char: "strasbourg"
    side: "left"
    text:
      - "Значит, здесь есть сущности коррозии."
  - char: "l_audacieux"
    side: "right"
    text:
      - "Нет никаких признаков, указывающих на то, что где то поблизости коррозия. По пути сюда я лично убедилась, что никаких следов коррозии нет."
      - "Если исключить это, единственная зацепка, которая у нас остаётся, — это совместные учения. Кто-нибудь из вас знает о них хоть что-нибудь?"
  - char: "dupleix"
    side: "left"
    text:
      - "Вообще ничего, прости."
  - char: "strasbourg"
    side: "right"
    text:
      - "Я тоже."
  - char: "l_audacieux"
    side: "left"
    text:
      - "Тогда мне кажется, что мы накручиваем себя на пустом месте."
      - "То, что мы видели, произошло во время этих учений, так что если учений не будет, то не будет и трагедии."
  - char: "dupleix"
    side: "right"
    text:
      - "Возможно, но действительно ли стоит списывать наш сон на одно большое совпадение?"
  - char: "strasbourg"
    side: "left"
    text:
      - "Не может всё быть так просто..."
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "strasbourg"
    side: "left"
    text:
      - "А? Сообщение от Клемансо?"
  - char: "l_audacieux"
    side: "right"
    text:
      - "Что она пишет?"
  - char: "strasbourg"
    side: "left"
    text:
      - "«Через два дня кардинал Ришелье проведёт совместные учения рядом с Мон-Сен-Мишелем. Приглашения разосланы Королевскому Флоту, Железной Крови и Империи Сардиния...»"
      - "«Помимо лидеров каждой фракции, на учениях также будет присутствовать Командир. Пожалуйста, начните подготовку к приёму наших гостей»."
  - char: "dupleix"
    side: "right"
    text:
      - "Вот оно. Четвёрка главных фракций собирается на совместные учения. Это всё-таки произойдёт."
  - char: "strasbourg"
    side: "left"
    text:
      - "Соберите всех и приступайте к подготовке. Я расскажу Клемансо о нашем сне."
  - char: "dupleix"
    side: "right"
    text:
      - "Хорошо. Будем надеяться, что ничего плохого не случится..."
