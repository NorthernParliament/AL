chapter1:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ух... Я и впрямь заспался."
      - "Судя по яркому свету из окна, уже полдень."
  - char: "memphis"
    side: "right"
    text:
      - "Ещё как. Уже время обеда."
      - "Не каждый день ты так просыпаешь. Я рада, что мы поехали в эту командировку."
  - char: "commander"
    side: "left"
    text:
      - "*зевок*"
      - "Да, правда. Я целую вечность так хорошо не спал."
      - "Слушай, Страсбург утром не заходила?"
  - char: "memphis"
    side: "right"
    text:
      - "Страсбург? Нет, её здесь не было."
  - char: "commander"
    side: "left"
    text:
      - "(Может, она тоже проспала, как и я.)"
  - char: "memphis"
    side: "right"
    text:
      - "Кстати, обед готов."
      - "Наш поезд отправляется во второй половине дня. Тем временем, если хочешь, можешь осмотреть окрестности."
  - char: "commander"
    side: "left"
    text:
      - "(Точно, нужно разобраться с делом о Ватацуми. Лучше позвать Синано.)"

chapter2:
  rows:
  - text:
      - "Я заканчиваю обедать и выхожу на улицу. По пути к Базилике я сталкиваюсь со Страсбург."
  - char: "strasbourg"
    side: "left"
    text:
      - "Ох. Доброе утро."
  - char: "commander"
    side: "right"
    text:
      - "И тебе доброе. Как спалось?"
  - char: "strasbourg"
    side: "left"
    text:
      - "Замечательно. Танец с тобой действительно помог мне проветрить голову и крепко уснуть."
  - char: "commander"
    side: "right"
    text:
      - "Подожди, танец? Со мной?"
      - "Разве ты не играла музыку всю ночь напролёт?"
  - char: "strasbourg"
    side: "left"
    text:
      - "Прости? Звучит так, будто ты всё ещё спишь на ходу."
      - "Если ты забыл, мы с тобой танцевали всю ночь напролёт после того, как я отложила инструмент."
  - char: "commander"
    side: "right"
    text:
      - "(Разве? Хм...)"
      - "Если подумать, я ДЕЙСТВИТЕЛЬНО отчётливо помню, как танцевал с ней."
      - "(Но этого не может быть...)"
  - char: "strasbourg"
    side: "left"
    text:
      - "Так или иначе, куда ты направляешься? Идёшь любоваться Базиликой?"
  - char: "commander"
    side: "right"
    text:
      - "Да. Полагаю, Клемансо тебе уже сказала. Давай зайдём за Синано, а потом отправимся туда, где хранится фрагмент."
  - char: "strasbourg"
    side: "left"
    text:
      - "Подожди-ка... сказала о чём? Я ничего от неё не слышала."
      - "И что это за «фрагмент»? Фрагмент чего?"
  - text:
      - "Внезапно меня охватывает непреодолимое чувство, что что-то не так."
      - "Это похоже на то, что было во время события, близкого к наложению, когда мои воспоминания были перезаписаны... чем-то."
      - "Я прощаюсь со Страсбург, а затем в спешке бегу к комнате Синано."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Синано!"
  - char: "shinano"
    side: "right"
    text:
      - "Ах... Отчего на твоём лице такая тревога?"
  - char: "commander"
    side: "left"
    text:
      - "Перейду сразу к делу, поскольку мы можем быть в опасности. Ты помнишь о фрагменте Ватацуми?"
  - char: "shinano"
    side: "right"
    text:
      - "Фрагменте? О каком именно ты говоришь?"
  - char: "commander"
    side: "left"
    text:
      - "Вчера вечером, помнишь? Ты сказала, что здесь, в Базилике, есть его фрагмент."
  - char: "shinano"
    side: "right"
    text:
      - "Что? С чего бы его фрагменту... находиться на землях Ортодоксии?"
      - "Насколько я помню, после вчерашнего банкета я вернулась в эту комнату... Мы с тобой не разговаривали..."
      - "Я совершенно не помню, чтобы утверждала, будто здесь есть фрагмент, как ты сейчас говоришь..."
  - char: "commander"
    side: "left"
    text:
      - "(Она не помнит? Но ложные воспоминания не повлияли на неё в прошлый раз, когда произошло нечто подобное...)"
      - "Хорошо, а как же твой амулет? Ты сказала, что он тоже сделан из фрагмента Ватацуми. Ты должна быть способна использовать его и почувствовать присутствие другого фрагмента."
  - char: "shinano"
    side: "right"
    text:
      - "Да... Когда-то у меня действительно был амулет... Однако он был сделан вовсе не из фрагмента Ватацуми, и я давно его потеряла..."
      - "Кажется, ты сегодня совсем запутался... Возможно, тебе приснился настолько яркий сон, что ты принял его за реальность?"
  - char: "commander"
    side: "left"
    text:
      - "(Мне не хочется этого признавать, но она может быть права. Впрочем, чтобы убедить меня в этом, потребуется нечто большее.)"
      - "(Понял. Клемансо здесь нет, так что, возможно, на неё это не подействовало.)"

chapter4:
  rows:
  - text:
      - "Я достаю свой коммуникатор и отправляю сообщение Клемансо. И довольно быстро получаю ответ."
  - char: "communicator"
    side: "right"
    text:
      - "«Нет никаких записей о передаче нам какого-либо фрагмента Ватацуми, поэтому нет и доказательств того, что он есть в Базилике»."
      - "«Также нет никаких записей о том, что мы с тобой разговаривали вчера»."
  - char: "commander"
    side: "left"
    text:
      - "(Даже ОНА не помнит... Неужели я всё это выдумал?)"
      - "(Как Синано заговорила о фрагменте, как Клемансо рассказала нам о нём...)"
      - "(А Страсбург никогда не приходила со мной поговорить, вместо этого мы танцевали на банкете...)"

chapter5:
  rows:
  - text:
      - "Мои сомнения и вопросы остаются без ответа, но пришло время покинуть Мон-Сен-Мишель."
      - "Прямо когда я собираюсь зайти в поезд, меня кто-то окликает."

chapter6:
  rows:
  - char: "chen_hai"
    side: "left"
    text:
      - "Здравствуй, Командир. Вы все возвращаетесь на материковую часть Ортодоксии?"
  - char: "commander"
    side: "right"
    text:
      - "Да. Наш поезд скоро отправляется. Ты остаёшься?"
  - char: "chen_hai"
    side: "left"
    text:
      - "Полагаю, да. И не только я — боюсь, вам придётся внести некоторые изменения в свои планы."
  - char: "memphis"
    side: "right"
    text:
      - "Почему?"
  - char: "chen_hai"
    side: "left"
    text:
      - "Империя Дракона просит вашего присутствия на военной базе BP для содействия в предстоящей операции."
      - "Никто не против?"
  - char: "helena"
    side: "right"
    text:
      - "Военная база BP? Я никогда там раньше не была."
  - char: "commander"
    side: "left"
    text:
      - "Я тоже. Ну, ЭТО было неожиданно..."
  - char: "memphis"
    side: "right"
    text:
      - "Империя никогда раньше не просила о помощи в операциях. По крайней мере, насколько мне известно."
  - char: "chen_hai"
    side: "left"
    text:
      - "Ну да, это вообще первый раз."
  - char: "memphis"
    side: "right"
    text:
      - "Признаюсь, ты меня заинтриговала."
      - "Однако мы должны придерживаться протоколов. Я не виню тебя, если ты не знала, ведь вы впервые о таком просите..."
      - "Но несмотря ни на что, чтобы отправить Командира в новый район выполнения задания, нужно действовать по официальным каналам и подать запрос!"
  - char: "commander"
    side: "left"
    text:
      - "Да... Прости, Чэнь Хай. Мы просто не можем менять планы на ходу."
  - char: "chen_hai"
    side: "right"
    text:
      - "Вам не нужно об этом беспокоиться. Мы уже подали запрос на перевод вашему командованию и с минуты на минуту должны получить разрешение."
  - char: "commander"
    side: "left"
    text:
      - "Ты уверена, что они оформят всё ТАК быстро?"
  - char: "helena"
    side: "right"
    text:
      - "Ни за что. Командование не работает так быстро."
  - char: "memphis"
    side: "left"
    text:
      - "Она права. У них может уйти целая вечность на обработку такого запроса."
  - char: "chen_hai"
    side: "right"
    text:
      - "Если не верите, вам следует связаться с ними и услышать это от них самих."

chapter7:
  rows:
  - text:
      - "Невероятно, но связавшись со штабом, мы получаем информацию о том, что получили разрешение на передислокацию моего отряда."
  - char: "chen_hai"
    side: "right"
    text:
      - "Формальности улажены, не так ли?"
  - char: "commander"
    side: "left"
    text:
      - "Ну дела..."
      - "Обычно на пути к удовлетворению любого запроса на перевод стоит целая тонна бюрократии."
      - "Как вам удалось так быстро получить одобрение?"
  - char: "chen_hai"
    side: "right"
    text:
      - "Полагаю, можно сказать, что нам повезло."
      - "Разве ты этого не заметил, Командир? Сегодня в воздухе витает своеобразная аура, которой не было вчера."
      - "Можно даже сказать, что единожды загаданное желание исполняется само собой."
  - char: "commander"
    side: "left"
    text:
      - "(Своеобразная аура... которой не было вчера? Империя Дракона должна знать, что здесь что-то не так!)"
      - "(Выходит, это приглашение — на самом деле просто предлог, чтобы вытащить нас отсюда, не так ли?)"
      - "Что ж, раз уж вы пошли на такие хлопоты, я никак не могу вам отказать."
      - "Хелена, Мемфис, давайте нанесём визит Империи."
  - char: "helena"
    side: "right"
    text:
      - "Вау, я... Поверить не могу, что это происходит. Погодите, это значит, что мы отправляемся из одной командировки прямиком в другую!"
  - char: "memphis"
    side: "left"
    text:
      - "Меня это вполне устраивает!"
      - "Она сказала, что мы поможем с операцией, помнишь?"
      - "Мы кансен. Мы заржавеем, если не будем время от времени участвовать в реальных боях!"
  - char: "chen_hai"
    side: "right"
    text:
      - "Я рада, что вы все согласны. Давайте поедем на машине в порт и..."
  - char: "noshiro"
    side: "left"
    text:
      - "Подождите минутку."
      - "Командир, леди Синано срочно требует твоего присутствия. Не мог бы ты пойти со мной?"
  - char: "commander"
    side: "right"
    text:
      - "Подожди, Синано?"
  - char: "chen_hai"
    side: "left"
    text:
      - "Всё в порядке. Мы подождём тебя здесь."

chapter8:
  rows:
  - text:
      - "Носиро отводит меня в тихое, уединённое место."
      - "Там, на скамейке, сидит Синано, держа в руках зелёный амулет."
  - char: "shinano"
    side: "left"
    text:
      - "После того как ты упомянул этот амулет, мысли о нём не давали мне покоя..."
      - "Я осмотрела свои вещи, и о чудо... Я вновь нашла его после столь долгого времени..."
      - "Хотя я носила его с собой неизвестно сколько времени, я и не подозревала о его присутствии..."
      - "Именно после этого ко мне вернулись воспоминания о твоём вчерашнем визите..."
      - "Странно, но этот амулет сразу же напомнил мне обо всех произошедших событиях."
      - "Наш разговор, ответ Клемансо, подтверждение того, что в Базилике скрыт фрагмент Ватацуми..."
      - "И всё же я так отчётливо помню то, чего никогда не было — как мы с сёстрами вместе любовались луной, а ты так и не пришёл ко мне..."
      - "Поэтому, пребывая в растерянности, я доверилась Носиро."
      - "Поначалу она, как и я, помнила лишь «первоначальную» версию событий..."
      - "Но когда я рассказала ей больше, она вскоре вспомнила и «альтернативную» версию."
      - "Отличить правду от вымысла было трудно для нас обеих..."
      - "Но стоило ей взять этот амулет и поговорить со мной, как правда открылась — воспоминания о твоём визите ко мне были настоящими."
  - char: "commander"
    side: "right"
    text:
      - "Если я всё правильно понял... Ты нашла амулет, к тебе вернулись воспоминания о прошлой ночи, а затем ты помогла Носиро тоже вспомнить, что произошло?"
  - char: "shinano"
    side: "left"
    text:
      - "Да. Нет никаких сомнений в том, что на Базилику наложили какое-то странное заклятие, и даже я не смогла избежать его воздействия..."
      - "Если бы ты не заговорил об амулете и если бы я его не нашла, возможно, я бы так и осталась в неведении об этом обмане разума..."
  - char: "commander"
    side: "right"
    text:
      - "Ты говорила, что твой амулет вырезан из фрагмента Ватацуми, верно?"
  - char: "shinano"
    side: "left"
    text:
      - "Именно так. Узор на нём взят из сна, который я когда-то видела..."
  - char: "commander"
    side: "right"
    text:
      - "(Значит, что бы здесь ни происходило, сны и Ватацуми как-то с этим связаны.)"
      - "Что насчёт остальных? Ты помогла кому-нибудь ещё пробудиться и узнать правду, прежде чем прийти сюда?"
  - char: "shinano"
    side: "left"
    text:
      - "Нет... Я решила, что прежде всего должна встретиться с тобой..."
  - char: "commander"
    side: "right"
    text:
      - "Возможно, это даже к лучшему. Я хочу, чтобы вы обе продолжали делать вид, будто всё идёт своим чередом."
      - "Видишь ли, ранее я написал Клемансо и выяснил, что её воспоминания тоже подверглись воздействию."
      - "По этой причине нам следует быть очень осторожными, пока мы не узнаем, насколько масштабным является это явление и кто может за ним стоять."
      - "Кукловод всё ещё прячется в тени, тогда как мы у всех на виду."
  - char: "shinano"
    side: "left"
    text:
      - "Это правда. Какие у тебя планы на данный момент?"
  - char: "commander"
    side: "right"
    text:
      - "Я отправляюсь на военную базу BP, в Империю Дракона. Они поняли, что что-то не так, и разрабатывают план действий."
      - "Пока я буду там, я хочу, чтобы ты осталась в Европе и внимательно следила за происходящим."
  - char: "shinano"
    side: "left"
    text:
      - "В таком случае тебе следует взять этот амулет... Возможно, он является ключом к пробуждению от этого сна..."
  - char: "commander"
    side: "right"
    text:
      - "Нет, оставь его себе. Есть один человек, которого я хочу, чтобы ты пробудила."
  - text:
      - "<img src='../../img/bg/r/5.png' class='inline-img' alt=''>"
  - char: "commander"
    side: "right"
    text:
      - "Возьми это. Это брошь, которую Клемансо подарила мне некоторое время назад."
      - "Садись на поезд до святой столицы и попроси её о личной встрече."
      - "Если кто-то попытается тебя остановить, покажи им эту брошь, и они тебя пропустят."
      - "Добейся встречи с Клемансо и найди способ пробудить её, если она этого ещё не сделала сама."
      - "Как только она очнётся, она поймёт, что я собираюсь делать."
  - char: "shinano"
    side: "left"
    text:
      - "Хорошо..."
  - char: "commander"
    side: "right"
    text:
      - "А теперь мне пора. Поезд вот-вот отправится. Удачи."
  - char: "shinano"
    side: "left"
    text:
      - "Взаимно... Удачи тебе."
