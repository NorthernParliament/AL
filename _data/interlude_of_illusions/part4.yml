chapter1:
  rows:
  - text:
      - "Чистое небо, спокойные воды. Флаги европейских фракций развеваются на ветру над Мон-Сен-Мишелем."
      - "Кансен и серийные корабли заняли позиции и ожидают приказов. «Мирная Интерлюдия» вот-вот начнётся."
  - char: "dupleix"
    side: "left"
    text:
      - "Ох... Пришлось безжалостно пожертвовать сном, но мы управились в самый последний момент..."
      - "По крайней мере, в процессе мы не столкнулись ни с какими серьёзными проблемами."
  - char: "strasbourg"
    side: "right"
    text:
      - "Ты заслуживаешь медали, Дюплекс."
      - "Впрочем, праздновать пока рано. Всё только начинается."
  - char: "dupleix"
    side: "left"
    text:
      - "Знаю, знаю. Мне просто нужно было немного передохнуть, прежде чем продолжать."
      - "Фух... Теперь пора сосредоточиться на самих учениях."
  - char: "l_audacieux"
    side: "right"
    text:
      - "Похоже, это будет круговой турнир, в котором каждая из фракций будет по очереди атаковать и защищаться. Интересно, что здесь нет никакой системы рейтингов."
      - "Хотя, полагаю, в ней и нет необходимости. В конце концов, это всего лишь показательный турнир, призванный укрепить связи."
      - "Хотя можно было бы подумать, что стрельба друг по другу, а не по назначенным мишеням, возымеет обратный эффект..."
  - char: "dupleix"
    side: "left"
    text:
      - "Ты смотришь на это не с той стороны."
      - "Сражения с другими кансен позволяют выяснить свои собственные сильные и слабые стороны, разве нет?"
  - char: "l_audacieux"
    side: "right"
    text:
      - "В этом есть смысл. В любом случае, нам пора выдвигаться."
      - "Наш флот выступает первым, И кардинал Ришелье наблюдает за нами. Мы должны выложиться на полную."
  - char: "strasbourg"
    side: "left"
    text:
      - "......"
  - char: "l_audacieux"
    side: "right"
    text:
      - "В чём дело?"
  - char: "strasbourg"
    side: "left"
    text:
      - "Ох, ничего. Просто задумалась."
      - "Л’Одасьёз права. Соберитесь, и давайте покажем им славу Ортодоксии."

chapter2:
  rows:
  - char: "hermione"
    side: "left"
    text:
      - "Доброго вам дня, дамы."
  - char: "strasbourg"
    side: "right"
    text:
      - "И тебе доброго дня. Добро пожаловать в Мон-Сен-Мишель."
  - char: "hermione"
    side: "left"
    text:
      - "Я столько слышала об этой величественной Базилике. Теперь, видя её своими собственными глазами, могу сказать, что она в точности так же великолепна, как о ней говорят!"
  - char: "strasbourg"
    side: "right"
    text:
      - "Она и впрямь впечатляет. Рада слышать, что она тебе так понравилась."
  - char: "dido"
    side: "left"
    text:
      - "Кхм. Гермиона, довольно пустых разговоров."
  - char: "hermione"
    side: "right"
    text:
      - "Ох, точно! Прошу меня простить."
      - "Тогда без лишних слов, давайте начнём, дамы."
  - char: "strasbourg"
    side: "left"
    text:
      - "Конечно. Удачи."

chapter3:
  rows:
  - char: "sirius"
    side: "left"
    text:
      - "Поздравляю. Мы признаём поражение."
  - char: "l_audacieux"
    side: "right"
    text:
      - "Вы сражались восхитительно. Неудивительно, что о вас, Королевских Горничных, так высоко отзываются."
      - "Благодаря вам мы лучше поняли свои сильные и слабые стороны. С нетерпением жду возможности снова сразиться с вами, поменявшись ролями."
  - char: "dido"
    side: "left"
    text:
      - "Взаимно. Будет честью вновь встретиться с вами в бою."
  - text:
      - "Эскадра Королевского Флота перегруппировалась, а затем покинула зону учений."
  - char: "strasbourg"
    side: "left"
    text:
      - "Фух... Отличная работа, девочки."
      - "Переведите дух, а затем мы отправимся навстречу Железной Крови."

chapter4:
  rows:
  - char: "koln_kai_r"
    side: "left"
    text:
      - "Боюсь, дальше вы не пройдёте."
  - char: "strasbourg"
    side: "right"
    text:
      - "У вас тут полно модернизаций. Я не видела ничего подобного в списке участников."
  - char: "koln_kai_r"
    side: "left"
    text:
      - "Возможно, насчёт модернизаций там и не было сказано, но мы есть в списке. И это не противоречит правилам."
  - char: "l_audacieux"
    side: "right"
    text:
      - "Я слышала, что Королевский Флот внедряет модернизированных кансен целыми партиями. Похоже, вам пришла в голову та же идея."
  - char: "z23_kai_r"
    side: "left"
    text:
      - "Да, хотя мы ещё никогда не сражались вместе как одна эскадра, так что для нас это будет впервые."
      - "И всё же мы не будем сдерживаться, и, надеюсь, вы тоже!"
  - char: "l_audacieux"
    side: "right"
    text:
      - "Отлично сказано! Вперёд!"

chapter5:
  rows:
  - char: "dupleix"
    side: "left"
    text:
      - "Все наши силы либо нейтрализованы, либо получили тяжёлые повреждения... Это был очень напряжённый бой."
      - "Более того... похоже, они заработали чуть больше очков, чем мы."
  - char: "l_audacieux"
    side: "right"
    text:
      - "Поразительно, насколько модернизация умножает боевую мощь. Особенно когда вы объединяете их в одну команду."
  - char: "leipzig_kai_r"
    side: "left"
    text:
      - "Я-я хочу сказать, вы все тоже были очень сильны..."
  - char: "koln_kai_r"
    side: "right"
    text:
      - "Теперь нам всем стоит немного перевести дух. Будет интересно посмотреть, как вы покажете себя в матче-реванше."
  - char: "strasbourg"
    side: "left"
    text:
      - "Согласна. В следующий раз мы вас обязательно одолеем."
  - text:
      - "Эскадра Железной Крови перегруппировалась, а затем покинула зону учений."
  - char: "dupleix"
    side: "left"
    text:
      - "На очереди — Сардиния. Они будут нашим последним противником в защите."
      - "Я знаю, что на кону ничего не стоит, но мне бы хотелось одержать сегодня хотя бы две победы."
  - char: "l_audacieux"
    side: "right"
    text:
      - "Помни, что это показательный турнир. Победа или поражение — не главное."
      - "Не стоит выдыхаться раньше времени, иначе следующие три боя в качестве обороняющихся дадутся нам с трудом."
  - char: "strasbourg"
    side: "left"
    text:
      - "Она права. Восстановите силы, а затем мы сразимся с Сардинией."

chapter6:
  rows:
  - text:
      - "*щёлк!*"
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Фотография стоит тысячи слов! Я назову её: «Эскадра Ортодоксии плывёт против ветра»."
  - char: "pompeo_magno"
    side: "right"
    text:
      - "Ого! Смотри, какие они крутые! За такое можно и Пулитцеровскую премию получить!"
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Я тоже так считаю!"
  - char: "strasbourg"
    side: "right"
    text:
      - "Ты... журналистка?"
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Не ПРОСТО журналистка — я ещё и одна из ваших противников! Меня зовут Альфредо Ориани. Это капитан Помпео, а вон там — Джузеппе Гарибальди."
  - char: "giuseppe_garibaldi"
    side: "right"
    text:
      - "Приветствую."
  - char: "pompeo_magno"
    side: "left"
    text:
      - "Готовьтесь, претенденты! Великая капитан Помпео сразится с вами!"
      - "Обнажите свои мечи и покажите мне ваши мерцающие клинки!"
  - char: "l_audacieux"
    side: "right"
    text:
      - "Что, прости?"
  - char: "pompeo_magno"
    side: "left"
    text:
      - "Да ладно, ты же понимаешь, о чём я? Разве оружие вашего Кардинала и Боевых Ангелов не светится во время атак?"
  - char: "l_audacieux"
    side: "right"
    text:
      - "Ты имеешь в виду... вот так?"
  - char: "pompeo_magno"
    side: "left"
    text:
      - "Да, именно так!"
  - text:
      - "*щёлк!*"
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Красота. «Рыцарь-храмовник обнажает свой сияющий меч». Ещё одна в коллекцию!"
  - char: "strasbourg"
    side: "right"
    text:
      - "Вы не могли бы отнестись к этому хоть НЕМНОГО серьёзнее?"
  - char: "dupleix"
    side: "left"
    text:
      - "К тому же, разве не ВЫ здесь претенденты? Вы находитесь в водах Ортодоксии, так что..."
  - char: "pompeo_magno"
    side: "right"
    text:
      - "Отлично сказано! Но хватит слов! Пора в бой!"

chapter7:
  rows:
  - char: "strasbourg"
    side: "left"
    text:
      - "Вы вообще старались?"
  - char: "pompeo_magno"
    side: "right"
    text:
      - "Я повержена! Как такое возможно?!"
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Чёрт, это было действительно близко! Вот уж точно — непреодолимая сила столкнулась с неподвижным объектом!"
  - char: "dupleix"
    side: "right"
    text:
      - "Вообще-то, судя по табло, мы разгромили вас в пух и прах."
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Эй, дело не в победе или поражении! Главное — это друзья, которых мы завели по пути!"
  - char: "giuseppe_garibaldi"
    side: "right"
    text:
      - "Ладно, Альфредо. Ты проиграла свою первую битву, так что отправляйся-ка ты обратно за парту."
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Нет, подожди! Я проиграла специально, ясно? В следующем бою я буду серьёзна, обещаю!"
      - "У меня даже есть безотказный секретный план!"
  - char: "l_audacieux"
    side: "right"
    text:
      - "Секретный план? Ты меня заинтриговала."
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "О, вам он точно понравится! Просто наберитесь терпения и сами всё увидите!"
  - char: "strasbourg"
    side: "right"
    text:
      - "Угу. Жду с нетерпением."
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Ещё бы. Увидимся позже!"
  - text:
      - "Эскадра Сардинии перегруппировалась, а затем покинула зону учений."
      - "На этом очередь Ортодоксии Ирис выступать в роли атакующей стороны подошла к концу. Теперь настало время играть в обороне."
