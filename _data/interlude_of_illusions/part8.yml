chapter1:
  rows:
  - text:
      - "Фиолетовое небо нависло над головой, пока сущности коррозии покрывали землю белизной, насколько хватало глаз. Это был сон — сон о Всемирной выставке."
  - char: "dupleix"
    side: "left"
    text:
      - "Страсбург, флот Кардинала манипулирует концептуальными якорями и прокладывает путь к святой столице."
      - "Кроме того, леди Клемансо приказала нам очистить Мон-Сен-Мишель и активировать концептуальные якоря."
  - char: "strasbourg"
    side: "right"
    text:
      - "Что ж, дамы, этот день наконец настал."
  - char: "l_audacieux"
    side: "left"
    text:
      - "Наконец-то!"
  - char: "strasbourg"
    side: "right"
    text:
      - "И лучшего времени было не найти."
      - "Мы разрушим старый мир и проложим для себя новый путь."
  - char: "l_audacieux"
    side: "left"
    text:
      - "Да. Новый путь для объединённой Ортодоксии."
  - char: "dupleix"
    side: "right"
    text:
      - "Эскадры Виши по всей стране одна за другой связываются с Кардиналом. Нам следует поступить так же?"
  - char: "strasbourg"
    side: "left"
    text:
      - "Нет. Мы не станем."
      - "Приказ леди Клемансо заключается лишь в том, чтобы очистить Базилику и активировать якоря."
      - "Что мы сейчас и сделаем."

chapter2:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Как и тогда, Страсбург прокладывала себе путь вперёд, попутно уничтожая странных врагов. Хоть внешне она и казалась спокойной, в её сердце царил разлад."
  - char: "strasbourg"
    side: "left"
    text:
      - "Я не понимаю... Чем ближе я подхожу к Базилике, тем сильнее становятся мои чувства..."
      - "Радость, гнев, счастье, сожаление... Почему я всё это чувствую?"
      - "Мы выполнили приказ и разделились, затем перегруппировались, начали заново и вернулись туда, где и должны быть..."
      - "Нет... В этом-то всё и дело, не так ли? Я была недостаточно сильна..."
      - "Если бы я только была сильнее, я бы смогла дать отпор этим Реконструкциям и отвратить эту напасть от нашей родины..."
      - "Если бы только этот день настал раньше..."
      - "Если бы всё было иначе, я была бы свободна от этого сожаления и безысходности..."
  - text:
      - "Внезапно покрытая коррозией Базилика начала сиять, как солнце, словно услышав её мольбы."

chapter3:
  rows:
  - text:
      - "Святой свет очистил коррозию, вернув ночному небу его спокойный тёмно-синий цвет."
  - char: "strasbourg"
    side: "left"
    text:
      - "Она... исчезла! Неужели святые покровители Святой Ирис услышали моё желание?"
      - "Но этого всё равно недостаточно... Нужно сделать больше, чтобы развеять вечную ночь над Ортодоксией!"
      - "Я должна добраться туда... Я должна двигаться быстрее!"
  - text:
      - "Она увеличила мощность двигателей и растворилась в свете."

chapter4:
  rows:
  - text:
      - "Занавес поднялся над сном о Кебире — месте, где пересеклись свет и тьма."
  - char: "hood_rad"
    side: "right"
    status: "is-red"
    text:
      - "Полагаю, причина нашего визита вам предельно ясна. В силу множества непредвиденных обстоятельств, мы надеемся, что в будущем вы будете более тесно координировать свои действия с нами в борьбе против Железной Крови."
      - "У вас есть четыре варианта."
      - "Первый: Немедленно выйти из порта и присоединиться к Королевскому Флоту для продолжения борьбы против Железной Крови и Багровой Оси."
      - "Второй: Разоружиться и направиться в порты нашей метрополии, где мы гарантируем вашу безопасность."
      - "Третий: Под нашим конвоем отправиться в порты Союза Орла и разоружиться там."
      - "Четвёртый: Немедленно затопить собственные корабли — исход, который нам меньше всего хотелось бы видеть."
  - char: "dunkerque"
    side: "left"
    text:
      - "Это ваш ультиматум? ...А что, если ни одно из условий для нас неприемлемо?"
  - char: "hood_rad"
    side: "right"
    status: "is-red"
    text:
      - "Тогда нам не останется ничего иного, кроме как подчиниться приказу штаба и устранить угрозу с вашей стороны силой."
      - "Надеюсь, ты всё обдумаешь и присоединишься к нашей борьбе, и что ты сделаешь правильный выбор."
  - char: "dunkerque"
    side: "left"
    text:
      - "......"
  - char: "strasbourg"
    side: "right"
    text:
      - "Что за вздор. Дюнкерк, мы НЕ ДОЛЖНЫ им уступать."
  - char: "dunkerque"
    side: "left"
    text:
      - "Согласна. Мы будем сражаться до конца, какими бы ничтожными ни были наши шансы."
  - char: "strasbourg"
    side: "right"
    text:
      - "Да. До самого конца."

chapter5:
  rows:
  - char: "amagi_m"
    side: "left"
    text:
      - "Кажется, у вас неприятности, дамы."
  - char: "strasbourg"
    side: "right"
    text:
      - "Кто ты?"
  - char: "dunkerque"
    side: "left"
    text:
      - "Я никогда не хотела втягивать тебя в это, ▇▇▇▇▇. Прости."
      - "Ты не рыцарь и не обязана сражаться на нашей стороне. Тебе следует поскорее эвакуироваться по суше."
  - char: "strasbourg"
    side: "right"
    text:
      - "(Что? Кто такая «▇▇▇▇▇»?)"
  - char: "amagi_m"
    side: "left"
    text:
      - "Нет. Я не отвернусь от вас, зная, что вы столкнулись с такой дилеммой."
      - "Есть и другой путь. Идеальный вариант, который поможет вам выбраться из этого трудного положения."
  - char: "dunkerque"
    side: "right"
    text:
      - "Правда? Пожалуйста, ▇▇▇▇▇, скажи мне, какой!"
  - char: "amagi_m"
    side: "left"
    text:
      - "Отбросить их, продемонстрировав силу. Не забывайте, что на этот раз я пришла не одна."
  - text:
      - "С оглушительным грохотом из дока появлялся один массивный корабль за другим, вклиниваясь между силами Королевского Флота и Доминиона Виши."
  - char: "strasbourg"
    side: "left"
    text:
      - "(Что это за угольно-чёрные корабли? Они всё это время были здесь?)"
  - char: "amagi_m"
    side: "right"
    text:
      - "Я привела их сюда в рамках нашего соглашения об обмене технологиями. Ты ведь помнишь это, Страсбург?"
  - char: "strasbourg"
    side: "left"
    text:
      - "Ох... Точно. Да, так и было."
  - char: "amagi_m"
    side: "right"
    text:
      - "Да. Мы все знаем, что так и было."
      - "Дюнкерк, как ты думаешь, каковы наши шансы на победу над их флотом H, если мы объединим наши силы?"
  - char: "dunkerque"
    side: "left"
    text:
      - "Думаю, у нас есть неплохие шансы."
  - char: "amagi_m"
    side: "right"
    text:
      - "А ты, Худ? Что ты об этом думаешь?"
  - char: "hood_rad"
    side: "left"
    status: "is-red"
    text:
      - "Ты совершила сегодня серьёзную ошибку, ▇▇▇▇▇ из Империи Сакуры. Мы этого не забудем."
      - "Дамы, мы отступаем."
  - char: "amagi_m"
    side: "right"
    text:
      - "Счастливого пути домой. Хи-хи."

chapter6:
  rows:
  - char: "strasbourg"
    side: "left"
    text:
      - "Я не понимаю... Моя голова... Я совсем запуталась..."
  - char: "amagi_m"
    side: "right"
    text:
      - "Что-то не так? Ты кажешься совершенно дезориентированной."
      - "Королевский Флот ушёл. О чём тебе ещё беспокоиться?"
  - char: "strasbourg"
    side: "left"
    text:
      - "Да нет, ни о чём, просто..."
  - char: "amagi_m"
    side: "right"
    text:
      - "«Просто» что? Ох, понимаю. Хи-хи. Тебе прошлой ночью приснился кошмар, не так ли?"
  - char: "strasbourg"
    side: "left"
    text:
      - "Кошмар?.."

chapter7:
  rows:
  - char: "dunkerque"
    side: "right"
    text:
      - "Рыцари с момента своего рождения клянутся в верности Кардиналу и вере. Мы не станем исполнять приказы иноземных держав!"
      - "Это касается и Железной Крови, и Империи Сардиния. Мы поклялись, что никогда не позволим использовать себя, никогда не станем клыками в пасти их агрессии!"
      - "...Неужели бывшие союзники не способны доверять даже такой клятве?"
      - "Королевский Флот не заслуживает доверия. Мы будем сражаться до последнего."

chapter8:
  rows:
  - char: "jean_bart"
    side: "left"
    text:
      - "Трагедия в Мерс-эль-Кебире уже дала нам ответ."
      - "Гордые рыцари Святой Церкви не станут смешиваться с этой грязью! Гордые дети небес никогда не склонятся перед грубой силой!"
      - "Спереди — волки, позади — тигры. Настал последний час нашего существования. Но храбрые рыцари не опустят головы! Мы не станем чьими-то марионетками!"
      - "Именем Свободы — я приказываю!"
      - "Всем кораблям в Средиземном море: немедленно затопиться!"
      - "Повторяю: всем кораблям — самозатопление!"

chapter9:
  rows:
  - char: "strasbourg"
    side: "left"
    text:
      - "Теперь я вспоминаю... Тот кошмар..."
      - "Он длился так, так долго..."
  - char: "amagi_m"
    side: "right"
    text:
      - "К счастью, теперь ты проснулась."
      - "Все кошмары, даже самые навязчивые, исчезают, когда ты просыпаешься."
  - char: "strasbourg"
    side: "left"
    text:
      - "Ты права. Теперь я проснулась, и всё в порядке..."
  - char: "amagi_m"
    side: "right"
    text:
      - "Вот именно. А теперь, пойдём? Мне не терпится послушать твоё выступление на банкете сегодня вечером."
  - char: "strasbourg"
    side: "left"
    text:
      - "Конечно. Меньше всего мне хотелось бы разочаровать Командира."
