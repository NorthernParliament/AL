chapter1:
  rows:
  - text:
      - "Из Базилики я наблюдаю за ходом учений через множество парящих в воздухе дронов."
      - "Кадры передаются на моё устройство, обрабатываются системой тактического анализа и транслируются мне в реальном времени."
      - "В данный момент сражаются Ортодоксия и Железная Кровь, и они идут ноздря в ноздрю."
  - char: "memphis"
    side: "left"
    text:
      - "Вот тебе и сила модернизации. Модернизируешь крейсер и выставляешь его против линейного крейсера той же эпохи, и первый заставит второго попотеть."
      - "Надеюсь, Союз Орла тоже соберёт собственный флот, ориентированный на ретрофит."
  - char: "commander"
    side: "right"
    text:
      - "(В этом отношении модернизации и Тип II не так уж сильно отличаются.)"
      - "(Ну, если говорить исключительно с точки зрения повышения боевого потенциала. Модернизация и разработка модулей улучшения требуют значительно меньше ресурсов, чем создание Типа II...)"
      - "(Хмм? Это... Страсбург?)"
      - "(Я слышал о ней — в равной степени как о её боевых навыках, так и о музыкальном таланте.)"
      - "(Она выглядит довольно напряжённой. Как будто она не полностью сосредоточена на битве.)"
      - "(Возможно, она так волнуется перед выступлением, зная, что за ней наблюдает Ришелье.)"
  - text:
      - "*тук-тук*"
  - char: "helena"
    side: "left"
    text:
      - "Кто там?"
  - char: "brunhilde"
    side: "right"
    text:
      - "У меня послание от Бисмарк. Она говорит, что хотела бы, чтобы ты пришёл посмотреть учения вместе с ней."
  - char: "commander"
    side: "left"
    text:
      - "(Ах. Я ждал этого приглашения, хотя и думал, что оно поступит более окольным путём.)"
      - "Конечно. Показывай дорогу."

chapter2:
  rows:
  - char: "bismarck"
    side: "left"
    text:
      - "Здравствуй, Командир. Чувствуй себя как дома."

chapter3:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Давненько не виделись."
  - char: "bismarck"
    side: "left"
    text:
      - "Да, давненько. Мы не разговаривали со времён битвы в Антарктике."

chapter4:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Спасибо. Ты тоже устраивайся поудобнее, хорошо?"
  - char: "bismarck"
    side: "left"
    text:
      - "Конечно. Это неформальная встреча, и я рада отказаться от формальностей."

chapter5:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Я смотрю, ты не в своей оснастке Цвай. Что-то не так с Герионом?"
  - char: "bismarck"
    side: "left"
    text:
      - "Ох. Нет, с Герионом всё в порядке, и моя оснастка Цвай работает как обычно."
      - "Я нахожусь в таком виде лишь для того, чтобы выразить своё стремление к миру. Личный имидж также имеет значение в политике."
      - "Давай не будем забывать, что мы также находимся на земле Ортодоксии."
  - char: "commander"
    side: "right"
    text:
      - "Одета ради мира, но настроена на победу в турнире. Мне кажется, это подаёт неоднозначные сигналы."
  - char: "bismarck"
    side: "left"
    text:
      - "Ты всё неправильно понял."
      - "Это мероприятие призвано укрепить связи между фракциями. Если я в какой-то мере не раскрою свои карты, это вызовет нежелательные спекуляции. Ты ведь считаешь так же, не правда ли?"
  - char: "commander"
    side: "right"
    text:
      - "Да, ты раскрываешь карты — но не ТОЛЬКО во имя укрепления связей, я прав?"
  - char: "bismarck"
    side: "left"
    text:
      - "Если бы дело было только в связях, я бы не присутствовала здесь лично. Я рассматриваю варианты создания альянса."
  - char: "commander"
    side: "right"
    text:
      - "Европейского наступательно-оборонительного альянса, возможно?"
  - char: "bismarck"
    side: "left"
    text:
      - "Проницателен, как всегда."
      - "Наша война с Сиренами — или, по крайней мере, наша война с их экспериментальным подразделением — близится к завершению. Я должна начать планировать, что будет дальше."
  - char: "commander"
    side: "right"
    text:
      - "Реформирование Лазурного пути, иными словами."
  - char: "bismarck"
    side: "left"
    text:
      - "Да, это одно из дел, но не единственное."
      - "Если бы простое объединение позволило Лазурному пути процветать, Багровая Ось никогда бы не появилась."
  - char: "commander"
    side: "right"
    text:
      - "Однако всё изменилось. Теперь у нас есть общий враг."
  - char: "bismarck"
    side: "left"
    text:
      - "Он был у нас и тогда."
      - "Ты здесь, разговариваешь со мной именно потому, что не веришь, будто конференции в Ортодоксии будет достаточно для реформирования Лазурного пути, не так ли?"
  - char: "commander"
    side: "right"
    text:
      - "Верно. Нам нужны не просто члены Лазурного пути, нам нужно, чтобы ВСЕ фракции объединились и смело шагнули в будущее — чтобы сражаться поистине единым фронтом."
  - char: "bismarck"
    side: "left"
    text:
      - "ОБЯЗАТЕЛЬНО ли этому альянсу называться «Лазурный путь»?"
  - char: "commander"
    side: "right"
    text:
      - "«Лазурный путь» — это больше, чем просто название. Это идея и наследие."
      - "Какую бы форму ни принял альянс, я настаиваю на этом названии."
  - char: "bismarck"
    side: "left"
    text:
      - "Я понимаю твою позицию. Спасибо, что честен со мной."
  - char: "commander"
    side: "right"
    text:
      - "Прости? Я думал, ты меня проверяешь."
  - char: "bismarck"
    side: "left"
    text:
      - "Вовсе нет. Я просто хотела посмотреть учения и поболтать с тобой."
      - "Хотя мне кое-что бросилось в глаза — ты не стал возражать, когда я сказала, что наша война с Сиренами практически подошла к концу."
  - char: "commander"
    side: "right"
    text:
      - "Я и не то чтобы не согласен. Не пойми меня неправильно, они всё ещё могущественные враги, и мы многого о них не знаем."
  - char: "bismarck"
    side: "left"
    text:
      - "С другой стороны, мы устранили Компилятора и даже выяснили, где Обсервер — их лидер — держит свой мейнфрейм."
  - char: "commander"
    side: "right"
    text:
      - "Именно. Мы вполне способны уничтожить его даже в полномасштабной лобовой атаке, если только мы все объединимся."
      - "Как только их генерал выйдет из игры, остальная элита станет лёгкой добычей, оставшись без командования."
  - char: "bismarck"
    side: "left"
    text:
      - "Это правда. Итак, как ты собираешься это сделать?"
  - char: "commander"
    side: "right"
    text:
      - "Что ты имеешь в виду?"
  - char: "bismarck"
    side: "left"
    text:
      - "Дождёшься шанса, а затем сокрушишь их раз и навсегда? Или проявишь к ним немного милосердия?"
  - char: "commander"
    side: "right"
    text:
      - "Ни за что. О том, чтобы позволить им и дальше своевольничать, не может быть и речи."
  - char: "bismarck"
    side: "left"
    text:
      - "Я знала, что ты так скажешь. Да, ЭТОТ вариант отпадает."
  - char: "commander"
    side: "right"
    text:
      - "Твой тон подсказывает, что у тебя на уме было что-то другое."
  - char: "bismarck"
    side: "left"
    text:
      - "Одно дело устранить их раз и навсегда, другое — использовать их в наших интересах. Но есть и третий вариант — заключить с ними союз."
  - char: "commander"
    side: "right"
    text:
      - "Мы оба знаем, что это нелепо."
  - char: "bismarck"
    side: "left"
    text:
      - "Нелепо, но возможно. Ты понимаешь, к чему я клоню."
      - "Сирены — или, лучше сказать, Антиох — были созданы с целью борьбы с врагом, известным как Икс."
      - "Если мы сможем переманить их на свою сторону, наши шансы в бою против Икс заметно возрастут."
      - "Ты мало что рассказывал мне об Икс, но они, должно быть, представляют собой весьма серьёзную угрозу, не так ли?"
  - char: "commander"
    side: "right"
    text:
      - "Как минимум, я обдумаю твою идею."
      - "(После моего столкновения с мимикрирующими сущностями в Мартириуме, Хелена МЕТА предложила ввести временный запрет на обмен разведданными для тех, кто видел эти сущности.)"
      - "(В свете угрозы, которую представляет Икс, и его потенциала концептуальной коррозии, все стороны согласились с этим.)"
      - "(Однако это означает, что я могу делиться со всеми лишь абсолютным минимумом информации об Икс, что меня совершенно не радует.)"
      - "Я хочу подчеркнуть, что Икс действительно настолько опасен. Чем больше ты его описываешь, тем выше вероятность, что он появится."
      - "Но однажды — обещаю, однажды я расскажу тебе всё."
  - char: "bismarck"
    side: "left"
    text:
      - "Не беспокойся об этом. Ришелье и Элизабет достаточно рассказали мне о том, насколько опасна любая информация о них."
      - "Продолжай расследование в своём собственном темпе. Уверяю тебя, Железная Кровь не станет активно вмешиваться в это дело."
  - char: "communicator"
    side: "right"
    text:
      - "БИП-БИП!"
  - char: "bismarck"
    side: "left"
    text:
      - "Сообщение от Мемфис? Неужто она переживает, что я с тобой что-то сделала."
  - char: "commander"
    side: "right"
    text:
      - "Нет, это просто по работе. Хотя мне, наверное, уже пора идти."
      - "Но перед тем, как я уйду, есть ещё кое-что..."
      - "Я должен сказать тебе кое-что в официальном качестве Командира Лазурного пути."
      - "Лидеры Лазурного пути хотят сделать официальное напоминание Железной Крови."
  - char: "bismarck"
    side: "left"
    text:
      - "Продолжай."
  - char: "commander"
    side: "right"
    text:
      - "Они просят, чтобы вы помнили о соглашениях, которые заключили в прошлом, и выполняли свои обязательства."
  - char: "bismarck"
    side: "left"
    text:
      - "Разумеется. Железная Кровь сдержит данные обещания и уже работает над освобождением оккупированных зон Реконструкций."
  - char: "commander"
    side: "right"
    text:
      - "На удивление лаконичный ответ. Я этого не ожидал."
  - char: "bismarck"
    side: "left"
    text:
      - "Ради реформы мы готовы сделать всё возможное, чтобы продемонстрировать нашу искренность и желание сотрудничать."
      - "Кроме того, это необходимо, чтобы Железная Кровь наконец по-настоящему освободилась от оков Сирен."
      - "И не только это — это также необходимо для того, чтобы наш мир смело взглянул в будущее."
      - "Мы не отступим и не сдадимся под давлением."
  - char: "commander"
    side: "right"
    text:
      - "Спасибо. Теперь мне будет что передать руководству."
  - char: "bismarck"
    side: "left"
    text:
      - "Хи-хи. Всенепременно передай."
      - "Раз уж мы дошли до этого, совершенно ясно, что в мире грядёт что-то грандиозное, и совсем скоро."
      - "Все фракции уже начали тайно готовиться к тому, что грядёт, будь то хорошее или плохое."
      - "Ох, и ещё кое-что перед тем, как ты уйдёшь — мы прибыли сюда с посланником из Тулипы."
      - "Да, Тулипа. Страна, в армии которой на протяжении долгого времени не было ни одной кансен."
      - "После завершения этих учений состоится вечеринка. Почему бы тебе не пойти со мной и не познакомиться с их представителем?"
