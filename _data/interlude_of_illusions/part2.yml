chapter1:
  rows:
  - text:
      - "Прошло два с половиной дня с тех пор, как я вернулся из Мартириума и получил сообщение от высшего руководства Союза Орла."
      - "В первый день — то есть когда я получил сообщение — пришёл последующий отчёт, в котором говорилось, что «инцидент в Тихом Океане был урегулирован, и в данный момент проводится дополнительное расследование»."
      - "На второй день все фракции получили сообщение с призывом «сосредоточиться на сборе разведданных»."
      - "И вот теперь я изучаю всю ту информацию, которую собрала Мемфис и её команда."
  - char: "commander"
    side: "left"
    text:
      - "Галлюцинации... Галлюцинации... Кошмары... Внезапный бред..."
      - "Внезапный маниакальный эпизод... Галлюцинации... Кошмары... Сбои в электронике..."
      - "Кошмары... Галлюцинации... Общий кошмар... Ещё кошмары..."
      - "Эти необъяснимые явления также наблюдались во всех фракциях вокруг Тихого Океана, а не только в Союзе Орла."
      - "Это все данные, с которыми нам предстоит работать?"
  - char: "memphis"
    side: "right"
    text:
      - "Что касается поддающихся проверке данных — да."
      - "Была ещё куча слухов, сплетен и городских легенд, но я их отсеяла."
  - char: "commander"
    side: "left"
    text:
      - "Не думаю, что они пригодятся нам в работе... но зато помогут убить время."
      - "Сделай одолжение, отправь и их тоже. Я полистаю их, пока мы не доберёмся до места назначения."
  - char: "memphis"
    side: "right"
    text:
      - "Конечно. Секунду."
  - text:
      - "Мемфис возится со своим устройством и нажимает кнопку отправки. На моём устройстве появляется ошеломляющее количество файлов."
  - char: "commander"
    side: "left"
    text:
      - "Боже, ты не шутила. Их действительно много."
  - char: "memphis"
    side: "right"
    text:
      - "Угу. Вот сколько данных получается, когда мы все работаем вместе."
  - text:
      - "Колёса поезда издают ритмичный стук по ходу нашего движения. Идеальная обстановка для чтения каких-нибудь выдумок."
      - "За окном тянутся бесконечные идиллические пастбища летней Европы."
      - "Я начинаю размышлять о том, как же мне повезло оказаться в этом поезде, а не сидеть на очередном собрании в столице Ортодоксии."
      - "Если бы не вчерашние события, возможно, я бы сейчас именно там и находился..."

chapter2:
  rows:
  - char: "helena"
    side: "left"
    text:
      - "Командир, мы получили приглашение от Ортодоксии."
  - char: "commander"
    side: "right"
    text:
      - "Что за приглашение?"
  - char: "helena"
    side: "left"
    text:
      - "Думаю, они приглашают тебя принять участие в совместных учениях на их территории."
      - "Вот. Можешь прочитать сам."
  - text:
      - "Хелена протягивает мне письмо, украшенное сургучной печатью."
  - char: "commander"
    side: "left"
    text:
      - "«Настоящим приглашаем вас на «Мирную Интерлюдию» — совместные учения между Ортодоксией Ирис, Королевским Флотом, Железной Кровью и Империей Сардиния»."
      - "«За вами будет отправлен поезд. Пожалуйста, сядьте на него 24 июля»."
  - char: "memphis"
    side: "right"
    text:
      - "Поскольку это свалилось как снег на голову, я решила во всём разобраться."
      - "Судя по всему, Ришелье и Элизабет внезапно подготовили эти учения, пока ты отсутствовал."
  - char: "commander"
    side: "left"
    text:
      - "(ОНИ? Тогда, возможно, это легенда, которую они придумали для меня, пока я был на охоте за китом.)"
      - "(Поскольку я вернулся гораздо раньше, чем они ожидали, полагаю, это значит, что теперь я ОБЯЗАН присутствовать на этих учениях.)"
      - "Что ж, это приглашение от наших союзников. Не вижу причин отказываться."
      - "В любом случае я жаждал отдохнуть от всех этих собраний. Провести немного времени с девочками пойдет мне на пользу."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Тебе случайно не удалось разузнать какие-нибудь секретные данные об этом странном инциденте?"
  - char: "memphis"
    side: "right"
    text:
      - "Секретные данные? Забавно ты иногда формулируешь мысли. Что ты хочешь знать?"
  - char: "commander"
    side: "left"
    text:
      - "Всё что угодно. Знание — сила, и я приму всё, что у тебя есть, будь то информация, напрямую связанная с инцидентом, или любые подробности того, что произошло в Тихом Океане."
  - char: "memphis"
    side: "right"
    text:
      - "К сожалению, я знаю об инциденте не больше твоего."
      - "Моим источникам тоже особо нечем поделиться. Тебе лучше расспросить Сару, если хочешь получить информацию об этом."
      - "Что касается событий в Тихом Океане... У меня тоже почти ничего нет на этот счёт."
      - "Ой, подожди, кое-что я всё-таки знаю. Это произошло примерно тогда, когда Элизабет утащила тебя... куда бы то ни было."
      - "В общем, Империя Сакуры внезапно сменила свой настрой."
  - char: "commander"
    side: "left"
    text:
      - "«Сменила настрой»? По отношению к чему?"
  - char: "memphis"
    side: "right"
    text:
      - "К реформированию Лазурного пути. Их лидеры, должно быть, наконец-то к чему-то пришли, потому что теперь они поддерживают эту идею."
      - "Ещё я слышала, что они разослали щедрые подарки многим фракциям..."
  - char: "commander"
    side: "left"
    text:
      - "Значит, Империя Сакуры заняла более позитивную позицию. Это здорово."
      - "(Хотя мне не нравится, насколько внезапным был этот поворот на 180 градусов. Надо будет позже расспросить об этом Синано.)"
  - text:
      - "*тук тук*"
  - char: "memphis"
    side: "right"
    text:
      - "Кто там?"
  - char: "guichen"
    side: "left"
    text:
      - "Гишен, твоя покорная ведьма. Кардинал Ришелье приглашает тебя присоединиться к ней за обедом."
      - "Впрочем, она сказала, что поймёт, если ты занят чем-то другим."
  - char: "commander"
    side: "right"
    text:
      - "Я бы с радостью, вот только есть одно но..."
  - char: "guichen"
    side: "left"
    text:
      - "Не волнуйся, твоим спутницам мы тоже доставим еду."
  - char: "memphis"
    side: "right"
    text:
      - "Как мило с вашей стороны. Лично я останусь здесь и буду наслаждаться видом. Иди, насладись обедом, Командир."
  - char: "helena"
    side: "left"
    text:
      - "С нами всё будет в порядке! Хорошо тебе провести время."
  - char: "commander"
    side: "right"
    text:
      - "(Хмм. Эти учения нужны не просто для смены обстановки. У неё, должно быть, есть какой-то скрытый мотив.)"
      - "(Как бы то ни было, я выслушаю, что она скажет.)"
