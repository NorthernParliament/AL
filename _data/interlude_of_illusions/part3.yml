chapter1:
  rows:
  - text:
      - "Аппетитный аромат встречает меня, как только я открываю дверь вагона."
      - "Судя по запаху, сегодня в меню кухня Сардинии."
  - char: "richelieu"
    side: "left"
    text:
      - "Спасибо, что присоединился ко мне, Командир. Пожалуйста, присаживайся."
  - text:
      - "Войдя внутрь, я обнаруживаю Ришелье и Элизабет, сидящих друг напротив друга. Рядом с Элизабет сидит Венето, а рядом с Ришелье — свободный стул."
  - char: "commander"
    side: "left"
    text:
      - "(Полагаю, он предназначен для меня.)"
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Давненько мы не встречались по такому приятному поводу, как этот."
      - "Я рада для разнообразия оставить позади эти конференц-залы и места для встреч."
      - "Кроме того, вся еда, которую ты здесь видишь, была приготовлена мной с использованием только лучших местных ингредиентов. Надеюсь, она придётся тебе по вкусу."
  - char: "commander"
    side: "left"
    text:
      - "(Почему у меня такое чувство, что не Ришелье хотела поговорить со мной, а скорее она хотела, чтобы я поговорил с Венето?)"
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Да, твоя кухня славится по всей Европе, и, очевидно, не без причины."
      - "Слуга, угощайся. Не стесняйся."
      - "Ням... Мне следует поручить своим горничным взять это на заметку. Некоторое разнообразие было бы очень кстати в моём рационе."
  - char: "commander"
    side: "left"
    text:
      - "(Звучит так, будто Элизабет пришла сюда исключительно ради еды, а тем временем... Кстати говоря, я проголодался. Приступим.)"

chapter2:
  rows:
  - text:
      - "Я присоединяюсь к девушкам за столом, наслаждаясь едой и поддерживая непринуждённую беседу."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Правда, Сардиния так многим тебе обязана, Командир. Ты предотвратил катастрофу на Всемирной выставке и помог нам закрепиться на конференции."
      - "Один только этот обед ни в коем случае не возместит тебе всего, но я надеюсь, что он послужит жестом нашей доброй воли."
      - "Чтобы мы могли сполна вернуть свой долг, не рассмотришь ли ты возможность нанести официальный визит в Сардинию?"
      - "Мы сделаем всё, что в наших силах, чтобы обеспечить тебе незабываемые римские каникулы."

chapter3:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Спасибо. Я обязательно приеду, когда появится возможность."

chapter4:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Мне нужно подумать об этом."

chapter5:
  rows:
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Эй! Ты не поедешь в Сардинию без меня и свиты Королевских Горничных!"
      - "В последнее время я питалась почти исключительно блюдами Ортодоксии и уже забыла, насколько вкусна кухня Сардинии. Возьми меня с собой!"
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Для нас будет честью принять тебя в качестве гостьи, Ваше Величество. Уверяю, мы окажем тебе лучший приём."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Отлично!"
  - char: "commander"
    side: "right"
    text:
      - "(У неё на уме действительно одна только еда...)"
      - "(Странно, что Ришелье всё это время была такой тихой. Ведь это она пригласила меня, так неужели ей нечего сказать?)"
      - "(Сейчас самое время перейти к теме, которую мы все здесь старательно обходим.)"

chapter6:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Итак, дамы, что вы думаете об этих совместных учениях? По правде говоря, у меня есть один вопрос на этот счёт."
  - char: "richelieu"
    side: "left"
    text:
      - "И какой же?"
  - char: "commander"
    side: "right"
    text:
      - "Ну, я знаю, что вам пришлось что-то придумывать из-за того, что я вернулся раньше, чем вы ожидали..."
      - "Но обязательно ли было делать их такими масштабными? Совместные учения четырёх фракций — это довольно серьёзное дело."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Мы делаем это, потому что я так хочу. Какие ещё причины тебе нужны?"
  - char: "commander"
    side: "right"
    text:
      - "Никаких, если смотреть на это со стороны. Но лично я хочу знать почему."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Хмм?"
  - char: "richelieu"
    side: "right"
    text:
      - "Я понимаю твоё любопытство. Для этого действительно есть ещё одна причина."
      - "Полагаю, ты уже слышал о недавней активности Империи Сакуры. Нам показалось, что сейчас самое подходящее время для всей Европы прийти в движение, и поэтому мы придумали эти учения."
      - "Надо признать, мы организовали их в спешке, без особой огласки и подготовки..."
      - "Несмотря на это, мы надеемся, что это покажет миру, как выглядит солидарность между кансен, когда мы вчетвером работаем вместе."
      - "Кроме того, в будущем многое станет проще, если мы сможем доказать, что Европа способна объединиться в одно целое."
  - char: "commander"
    side: "left"
    text:
      - "(Звучит как наступательно-оборонительный альянс. Это даст нам большую свободу действий как при наступлении, так и при отступлении.)"
      - "(Если Лазурный путь будет реформирован, это значительно усилит влияние европейских фракций.)"
      - "(Более того, если реформа провалится, у них есть запасной план в виде европейского альянса. Им не так уж обязательно нужно знамя Лазурного пути, чтобы двигаться вперёд.)"
      - "И вот почему вы придумали «Мирную Интерлюдию». Теперь я понимаю. В этом заложено много символического смысла."
      - "Кстати говоря, а где Бисмарк? Разве её здесь нет?"
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "Она догонит нас уже на месте проведения учений."
  - char: "richelieu"
    side: "left"
    text:
      - "Полагаю, она сочла, что добраться туда прямым маршрутом будет удобнее."
  - char: "commander"
    side: "right"
    text:
      - "(И тем не менее, её нигде не было видно на конференции, она всё это время наблюдала со стороны.)"
      - "(Интересно, что в этот раз она будет присутствовать лично.)"
      - "(Этот европейский альянс и вправду может сработать...)"
      - "(Только представьте. Совершенно новый игрок на мировой арене.)"
  - text:
      - "Наш непринуждённый обед в поезде продолжается."
