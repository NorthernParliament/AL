chapter1:
  rows:
  - text:
      - "Медленная музыка наполняет зал, обставленный в классическом стиле Ортодоксии. На вечеринке присутствуют представители всех фракций."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Хм... Как бы мне ни было неприятно это признавать, но еда довольно вкусная."
      - "Вы устроили неплохую вечеринку, учитывая, как мало у вас было времени."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Да. Действительно создаётся ощущение, что они выложились на полную."
  - char: "richelieu"
    side: "left"
    text:
      - "Спасибо. Я польщена. С таким количеством присутствующих фракций я бы не посмела предложить своим гостям ничего, кроме самого лучшего."
  - char: "commander"
    side: "right"
    text:
      - "Кто это играет музыку? Страсбург?"
  - char: "richelieu"
    side: "left"
    text:
      - "Верно. Вообще-то я хотела, чтобы она отдохнула на вечеринке, ведь она так много трудилась над организацией учений..."
      - "Однако она настояла на том, что игра на музыкальных инструментах — это её способ расслабиться, и не отступала."
  - char: "commander"
    side: "right"
    text:
      - "Понятно."

chapter2:
  rows:
  - text:
      - "Музыка Страсбург льётся по банкетному залу, словно воды кристально чистой реки."
      - "От усталости, которую я видел на её лице сегодня днём, не осталось и следа."
  - char: "commander"
    side: "left"
    text:
      - "Сразу видно, что она очень много работала. Её усилия действительно вывели этот банкет на новый уровень."
  - char: "richelieu"
    side: "right"
    text:
      - "Хи-хи. Уверена, она была бы вне себя от радости, услышав от тебя такие слова."
      - "Я знаю, что ты занятой человек, но сейчас постарайся забыть обо всех своих проблемах и просто наслаждайся вечером, хорошо?"

chapter3:
  rows:
  - text:
      - "*тук тук*"
  - char: "strasbourg"
    side: "left"
    text:
      - "Кардинал Ришелье велела мне прийти, так что... У тебя есть минутка, Командир?"
  - char: "commander"
    side: "right"
    text:
      - "Страсбург? С ней что-то случилось?"
  - char: "strasbourg"
    side: "left"
    text:
      - "Нет. Дело во мне."
      - "Мне и всем остальным в Мон-Сен-Мишеле совсем недавно приснился один и тот же кошмар."
      - "Мне сказали, что ты много знаешь о снах. К тому же есть факты того, что люди по всему Тихому Океану сталкивались с явлениями, связанными с кошмарами..."
  - char: "commander"
    side: "right"
    text:
      - "Я слышал об этом. Как давно тебе приснился этот кошмар?"
  - char: "strasbourg"
    side: "left"
    text:
      - "Всего два дня назад."
  - char: "commander"
    side: "right"
    text:
      - "(Два дня... Сегодня 25-е, значит, это случилось 23-го.)"
      - "(А отчёт касательно Тихого Океана поступил 22-го...)"
      - "(О подобных явлениях сообщали по всей Европе за несколько дней до Всемирной выставки... но на этот раз они зафиксированы в Тихом Океане. Как же это добралось досюда?)"
      - "В любом случае, заходи. Поговорим внутри."

chapter4:
  rows:
  - char: "strasbourg"
    side: "left"
    text:
      - "Вот, в общем-то, и всё."
  - char: "commander"
    side: "right"
    text:
      - "(Им ВСЕМ приснился один и тот же кошмар о катастрофе на этих учениях...)"
      - "(Да уж. Это никак не может быть совпадением.)"
      - "Спасибо, что рассказала мне об этом."
      - "Я заметил, что ты была немного рассеянна во время учений. Ты думала об этом, не так ли?"
  - char: "strasbourg"
    side: "left"
    text:
      - "Ах... Значит, ты заметил. Полагаю, от тебя ничего не ускользнёт."
  - char: "commander"
    side: "right"
    text:
      - "А ты настоящий боец. Так усердно трудиться, когда на душе лежит такой тяжёлый груз."
  - char: "strasbourg"
    side: "left"
    text:
      - "Кхм... Что ж, спасибо за комплимент."
  - char: "commander"
    side: "right"
    text:
      - "Ты, должно быть, очень устала. Предлагаю на сегодня закончить и немного поспать. Тем временем я всё расследую."
      - "А если тебе снова приснится кошмар, приходи ко мне, и я помогу тебе почувствовать себя лучше."
  - char: "strasbourg"
    side: "left"
    text:
      - "Спасибо за твою заботу. Желаю тебе сладких снов."

chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Когда дело касается снов, никто не разбирается в них лучше, чем Синано.)"
      - "(Я слышал, она здесь, в Мон-Сен-Мишеле. Пойду поговорю с ней.)"
