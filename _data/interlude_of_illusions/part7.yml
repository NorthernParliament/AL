chapter1:
  rows:
  - text:
      - "Войдя в зал ожидания, я нахожу Синано. Она собирается уходить."
  - char: "shinano"
    side: "left"
    text:
      - "Я как раз собиралась отправиться на твои поиски... Совпадения — странная вещь..."
      - "Ты хотел что-то обсудить?"
  - char: "commander"
    side: "right"
    text:
      - "Да, но ты первая. О чём ты хотела мне рассказать?"
  - char: "shinano"
    side: "left"
    text:
      - "Хорошо... С самого прибытия сюда меня не покидает странное чувство чего-то знакомого."
      - "Похоже, что в этой Базилике хранится фрагмент Ватацуми."
  - char: "commander"
    side: "right"
    text:
      - "Что? Фрагмент реликвии Сакуры? На землях Ортодоксии?"
  - char: "shinano"
    side: "left"
    text:
      - "Именно так... Вероятно, я могу чувствовать его присутствие благодаря этому украшению, ведь оно тоже сделано из фрагмента Ватацуми..."
      - "Однако его точное местоположение ускользает от меня..."
  - text:
      - "<img src='../../img/bg/r/4.png' class='inline-img' alt=''>"
  - text:
      - "С этими словами она достаёт изумрудную магатаму — драгоценный камень в форме запятой — с чётко вырезанным спереди узором в виде цветка вишни."
  - char: "commander"
    side: "left"
    text:
      - "Понятно... Тогда есть быстрый способ проверить, правда это или нет."
      - "Давай позвоним Клемансо. Она наверняка ещё не спит."

chapter2:
  rows:
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "Ах, это же Синано и Командир. Возникла какая-то проблема?"
  - char: "commander"
    side: "left"
    text:
      - "Строго говоря, не проблема. Я просто хотел кое о чём тебя спросить."
      - "Внутри Базилики в Мон-Сен-Мишеле находится фрагмент Ватацуми?"
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "О-о. Браво, Командир. Ты разгадал величайший секрет Базилики в первый же день."
      - "Откуда ты узнал?"
  - char: "commander"
    side: "left"
    text:
      - "Значит, он ЗДЕСЬ действительно есть... Это не моя заслуга. Это Синано — она говорит, что почувствовала его."
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "«Почувствовала»... А вот это уже интересно."
      - "Буду откровенна — очевидно, когда-то мы вели переговоры с Сакурой об обмене технологиями."
      - "Они передали нам этот фрагмент Ватацуми в рамках этого процесса."
  - char: "commander"
    side: "left"
    text:
      - "Бисмарк тоже говорила что-то в этом духе. Сардиния тоже участвовала в обсуждениях?"
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "Нет. Насколько мне известно, нет."
      - "Возможно, и участвовали, но это было до меня. К тому же, как ты знаешь, Трибунал не всегда были королями разведки."
  - char: "commander"
    side: "left"
    text:
      - "Звучит разумно. Синано, а ТЫ что-нибудь знаешь?"
  - char: "shinano"
    side: "right"
    text:
      - "Я... даже не знала, что Ватацуми был частью какой-либо сделки..."
  - char: "commander"
    side: "left"
    text:
      - "Всё в порядке. Твой долгий сон не позволяет тебе быть везде одновременно."
      - "(Может быть, Венето что-то знает.)"
      - "(Хотя жители Сардинии имеют привычку действовать самостоятельно... Если Сардиния ДЕЙСТВИТЕЛЬНО обсуждала обмен технологиями, велика вероятность, что Венето об этом так и не сообщили.)"
      - "К примеру, она понятия не имела о заговоре Марко Поло с целью наложения миров.)"
      - "(А Марко... Она всё ещё не пробудилась от своего сна.)"
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "Если это так важно, поручить Трибуналу заняться этим делом?"
  - char: "commander"
    side: "left"
    text:
      - "Нет нужды. Мне просто было интересно."
      - "В любом случае, я сказал всё, что хотел. Извини, что звоню так поздно. Иди спать."
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "Хи-хи. И тебе спокойной ночи."
  - char: "shinano"
    side: "left"
    text:
      - "Подожди... Клемансо, могу ли я завтра взглянуть на этот фрагмент?"
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "Это можно устроить. Я договорюсь со Страсбург."
  - char: "shinano"
    side: "left"
    text:
      - "Премного благодарна..."

chapter3:
  rows:
  - char: "shinano"
    side: "left"
    text:
      - "Спасибо за твою доброту... Итак, что ты хотел обсудить?"
  - char: "commander"
    side: "right"
    text:
      - "Ну, дело касается снов..."

chapter4:
  rows:
  - char: "shinano"
    side: "left"
    text:
      - "Кошмары... Снова..."
      - "Прошлой ночью я тоже видела кошмар."
      - "В нём будущее, свидетелем которого я была, было охвачено пламенем и рушилось... это дурное предзнаменование, грядёт грандиозное событие."
  - char: "commander"
    side: "right"
    text:
      - "Грандиозное событие... Тогда мы должны быть к нему готовы."
      - "Ты можешь показать мне свой сон напрямую?"
  - char: "shinano"
    side: "left"
    text:
      - "Нет... Я не видела снов с тех самых пор, как ко мне пришло то видение..."
      - "Хуже того, похоже, я потеряла свою способность плести сны..."
      - "В нынешнем положении, боюсь, от меня будет мало толку..."
      - "Однако я могу попросить Мусаси... Возможно, она сможет тебе помочь. Мне попросить её?"
  - char: "commander"
    side: "right"
    text:
      - "Да, пожалуйста."
      - "(Когда Синано увидела этот сон, она?.. Нет, она бы тоже не знала.)"
      - "(Она говорит, что это дурное предзнаменование, и со всеми этими кошмарами по всему Тихому Океану, я действительно думаю, что катастрофа не за горами.)"
      - "(А Хелена МЕТА занята попытками стабилизировать Родни. В этот раз я ни на кого больше не могу положиться.)"
      - "(Теперь вопрос в том... что же мне делать?)"
