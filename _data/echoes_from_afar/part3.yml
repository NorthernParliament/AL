chapter1:
  rows:
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Системы вентиляции в норме. Освещение... работает в штатном режиме."
      - "А этот ковер. Безупречно мягкий."
  - text:
      - "Гордая королева в черном наряде стояла внутри роскошно украшенного вагона поезда, любуясь каждой деталью своих владений."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Да, вагон и впрямь хорош. Ты случайно не брала за основу «Восточный экспресс»?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Только внешне и в плане дизайна интерьера. Внутреннее устройство поезда совершенно иное."
      - "Но это все мелочи. Ты не заметила, как здесь просторно?"
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Конечно, заметила. Внутри он кажется раза в два больше, чем снаружи."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Да, и при желании мы могли бы сделать его еще больше."
      - "По крайней мере, до определенной степени. Он все еще связан ограничениями, присущими самой концепции поезда."
      - "К тому же, чем он меньше, тем надежнее его защита, поэтому мы остановились на таком размере."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Поразительно, не правда ли? Чего только не сотворишь с пространственными искажениями. Ты создала эту технологию на основе той, что применяется в Зеркальных Морях?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Ха! Какое глупое сравнение. «Свет Королевы» куда совершеннее любого Зеркального Моря!"
      - "Хотя мы понимаем, почему ты так подумала. Что более важно, мы еще не дали этой технологии название."
      - "Как насчет... Да, назовем их Зеркальными Рельсами!"
      - "Эти Зеркальные Рельсы могут похвастаться куда лучшим электромагнитным экранированием, защитой и пластичностью по сравнению с Зеркальным Морем."
      - "Но это не самая впечатляющая их особенность! Видишь ли, каждому вагону или локомотиву можно присвоить собственную концепцию."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Правда? Каждому свою концепцию?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Именно. И к «Свету Королевы» привязана далеко не одна концепция."
      - "У него не одно, не два, а целых семь разных и независимых концептуальных пространств!"
      - "Иными словами, каждая секция поезда существует независимо от остальных, как свои собственные Зеркальные Рельсы."
      - "Более того, им не нужно центральное устройство управления где-то внутри своего пространства, как в случае с Зеркальными Морями."
      - "Это отличает их от технологий Сирен больше, чем что-либо другое."
      - "Кроме того, концепции каждых из этих Рельс связаны воедино еще одной концепцией — концепцией самого «Света Королевы»."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Интересно. И поскольку все вместе они воспринимаются как поезд, это усиливает их концепцию как Рельсов."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Именно так. Разве мы не гениальны?"
      - "Пока они образуют единое целое, защита каждых Рельсов также усиливается связанной с ними концепцией."
      - "Однако при необходимости Рельсы можно расцепить, и они будут функционировать независимо друг от друга."
      - "Это означает, что с точки зрения атакующего ему придется выбирать между тремя целями — поездом как единым целым, отдельными Рельсами и третьим измерением."
      - "Это делает Рельсы особенно устойчивыми к концептуальным атакам."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Понятно. Как по мне, звучит как сплошная софистика."
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Просто так работают нападение и защита на концептуальном уровне."
      - "В теории это понять несложно. Однако на практике усиление концепции — дело весьма затратное."
      - "Если предположить, что одни Рельсы стоят столько же, сколько ваши Врата Камелота, то эти затраты удваиваются с каждыми новыми добавленными Рельсами."
      - "Теоретически можно продолжать добавлять новые Рельсы, но пока что предел — 7 Рельсов."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Два в шестой степени... Это увеличивает стоимость в 64 раза!"
      - "Это полнейший абсурд. Столько времени, денег и ресурсов ради чего? Какого-то поезда?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Это НЕ ПРОСТО какой-то поезд! И вообще... Ай, забудь."
      - "Как только ты увидишь, какие мерзости там обитают, ты сама всё поймешь."
  - char: "strange_machine"
    side: "left"
    text:
      - "*БИП-БИП!*"
      - "*БИП-БИП-БИП!*"
      - "*БИП-БИП-БИП-БИП-БИП!*"
  - char: "miss_d_rad"
    side: "right"
    text:
      - "Элизабет! Запускай уже поезд!"
      - "Ну же! Я жду целую вееечность!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Не торопи нас! Мы проводим финальную проверку!"
  - char: "miss_d_rad"
    side: "right"
    text:
      - "Нет! Быстреееее! Давай уже!"
  - char: "queen_elizabeth_meta"
    side: "left"
    status: "is-meta"
    text:
      - "От того, что ты нас торопишь, ничего не изменится. Или что, ты возместишь нам ущерб за поломки, если мы отправимся неподготовленными?"
  - char: "miss_d_rad"
    side: "right"
    text:
      - "Мне такое не по карману. Лааадно."
      - "Проводите свои проверки или что там у вас, только побыстрее! Мне становится скучно!"
  - char: "strange_machine"
    side: "left"
    text:
      - "Соединение прервано. *БИИИИП...*"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Какая же она заноза. Будь у нас выбор, мы бы не стали брать её с собой."
      - "Но что есть, то есть, придётся нам с ней мириться."
      - "Итак, у тебя есть какой-нибудь багаж, который нужно успеть погрузить перед нашим отправлением?"
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Что? В смысле мы отправляемся прямо сейчас? Мы и правда идем на охоту только вдвоем?"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Мы никогда не говорили, что отправляемся на охоту. Мы лишь перемещаемся в новое место для подготовки."
      - "Скажи-ка, а почему бы нам не отправиться в твою ветвь? Твой Камелот уж точно сможет вместить один-единственный поезд."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Что?!"
      - "Погоди-ка минуту! Я никогда не говорила, что вы можете гостить у нас неизвестно сколько!"
  - char: "queen_elizabeth_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Отсутствие приглашения не помешало ТЕБЕ завалиться к НАМ, чтобы угощаться нашими чаем и печеньем! Как аукнется, так и откликнется!"
      - "А теперь цыц! Вперёд, «Свет Королевы»!"
