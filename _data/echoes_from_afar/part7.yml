chapter1:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "Фух... После всех этих проволочек они наконец-то дали ход твоему плану, Командир."
      - "Ты упорно за это боролся. Насладись этим моментом."
      - "А еще, нам, наверное, стоит..."
      - "...Ох, посмотри на время."
      - "У меня срочное собрание, на котором я должна присутствовать, так что, к сожалению, я не смогу составить тебе компанию за ужином."
      - "Но, пожалуйста, ОБЯЗАТЕЛЬНО поужинай. И слышать не хочу отговорок о том, что еда — это сплошная морока."

chapter2:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Так и сделаю."
  - char: "memphis"
    side: "left"
    text:
      - "Вот и отлично."

chapter3:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Хочешь, я оставлю немного для тебя?"
  - char: "memphis"
    side: "left"
    text:
      - "Спасибо, но не стоит. У меня такое чувство, что собрание затянется надолго."
      - "Я просто найду, чем вкусно перекусить, когда со всем закончу."

chapter4:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "Черт! Мне пора бежать. Поговорим позже, Командир!"

chapter5:
  rows:
  - text:
      - "Я провожаю Мемфис, а затем покидаю конференц-зал."

chapter6:
  rows:
  - text:
      - "Я прохожу в дверь и делаю свой первый шаг навстречу вечернему солнечному свету... как вдруг всё исчезает."
      - "Его сменил вид на космос — тот самый, что всегда появляется, когда мы с Хеленой МЕТА разговариваем."
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Добрый вечер, Командир."
  - char: "commander"
    side: "left"
    text:
      - "Мне казалось, мы договорились, что ты будешь предупреждать, прежде чем выходить на связь..."
      - "Раз ты этого не сделала, должно быть, это срочно. Я прав?"
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Да... БЗЗЗТ... Прости за это. Времени на предупреждение не было."
  - char: "commander"
    side: "left"
    text:
      - "В чем дело?"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "БЗЗЗТ... план... БЗЗЗТ... пошел не так... БЗЗЗТ..."
      - "БЗЗЗТ... Ситуация намного... БЗЗЗТ... сложнее, чем ожидалось... БЗЗЗТ..."
  - char: "commander"
    side: "left"
    text:
      - "Хелена, ты постоянно прерываешься."
      - "Связь еле держится."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Прерываюсь? БЗЗЗТ... Погоди... БЗЗЗТ... запускаю поиск... БЗЗЗТ..."
      - "БЗЗЗТ... Нет... БЗЗЗТ... источник помех, он... БЗЗЗТ..."
      - "БЗЗЗТ... в гостевой комнате... БЗЗЗТ..."
      - "БЗЗЗЗЗЗТ..."
  - char: "commander"
    side: "left"
    text:
      - "Хелена? Хелена!"
  - text:
      - "По мере того как шум усиливается, проекция Хелены всё больше искажается, пока в конце концов не сжимается в синюю точку и не исчезает."
      - "Далёкие звезды тоже, кажется, мерцают и дёргаются."
  - char: "commander"
    side: "left"
    text:
      - "Помнится, Хелена говорила, что это пространство находится где-то внутри Арбитра — Башни, если не ошибаюсь."
      - "Следовательно, почти никто не мог найти это место, не говоря уже о том, чтобы глушить здесь связь."
      - "Учитывая это, вполне вероятно, что за этим стоит кто-то из её врагов."
      - "Перед тем как связь оборвалась, она сказала что-то об «источнике помех», и что он находится в «гостевой комнате»."
      - "Вопрос в том — в какой гостевой комнате? Где?"
      - "Может, она имела в виду то место, где нахожусь я. Как вернусь, надо приказать проверить всё здание."
      - "У меня плохое предчувствие на этот счет. Та же группировка, что стояла за инцидентом с едва не случившимся наложением в Антарктиде, возможно, снова пытается застать нас врасплох..."
      - "Если это так, то катастрофа не за горами."

chapter7:
  rows:
  - char: "helena_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Очень на это надеюсь. Твоя ветвь сейчас находится под постоянной угрозой."
      - "Ты помешал ей достичь первой цели. У нее осталось еще две."
      - "Будь начеку, Командир."
      - "Битва еще не окончена."

chapter8:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "То, что произошло в Антарктиде, было лишь репетицией. Их настоящая цель — Ортодоксия."
      - "Если та же группа, что стояла за инцидентом в Антарктиде, ответственна за глушение канала связи, который Хелена установила для меня тогда, логично предположить, что они могли взломать и это виртуальное пространство."
      - "Нужно как можно скорее рассказать об этом девочкам."
  - text:
      - "Я оглядываюсь по сторонам, ожидая, что звездный пейзаж изменится, но этого не происходит."
  - char: "commander"
    side: "left"
    text:
      - "Черт. Я так и не спросил Хелену, как здесь «повесить трубку»..."
      - "Что же мне теперь делать?"
      - "......"

chapter9:
  rows:
  - text:
      - "(Закричать так громко, как только сможешь.)"
  - char: "commander"
    side: "left"
    text:
      - "ЭЙ! ЗДЕСЬ ЕСТЬ КТО-НИБУДЬ? СКАЖИТЕ, КАК ОТСЮДА ВЫБРАТЬСЯ!"
  - text:
      - "Эхо моего крика исчезает почти мгновенно. Вокруг ни души, только звезды над головой."

chapter10:
  rows:
  - text:
      - "(Поискать выход.)"
  - char: "commander"
    side: "left"
    text:
      - "(Где-то здесь должен быть выход. Лучше осмотреться.)"
  - text:
      - "Я осматриваю все сверху донизу, вдоль и поперек, но не вижу ничего, кроме галактики над головой."

chapter11:
  rows:
  - text:
      - "(Спрыгнуть с большой высоты.)"
  - char: "commander"
    side: "left"
    text:
      - "(Если ущипнуть себя во сне, то проснешься, так что...)"
  - text:
      - "Это как-то связано с отсутствием боли и осознанием того, что ты спишь. Может, если я упаду с высоты, удар вернет меня в реальность?"
      - "К сожалению, здесь нет ничего высокого, на что можно было бы забраться. Лишь бесчисленные звезды мерцают высоко вверху."

chapter12:
  rows:
  - text:
      - "(Попытаться убить себя.)"
  - char: "commander"
    side: "left"
    text:
      - "(Если ущипнуть себя во сне, то проснешься, так что...)"
      - "(Исходя из этого, если я смогу убедить себя, что умер здесь, разве это не вернет меня в реальность?)"
      - "(Нет, о чем я вообще думаю? Это не сон, и даже просто убеждать себя в собственной смерти — это риск, на который я не хочу идти.)"

chapter13:
  rows:
  - text:
      - "И тут внезапно я слышу неподалеку звон колокольчика."

chapter14:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Ах... Снова этот ветряной колокольчик.)"
  - text:
      - "В следующее мгновение передо мной появляется дверь."
  - char: "commander"
    side: "left"
    text:
      - "И снова эта дверь. Та самая, которую я видел, когда погружался в данные Анкоридж и когда говорил с Союз."
      - "Кажется, она может настигнуть меня где угодно — даже в этом виртуальном пространстве, которое ты создала, Хелена."
      - "Если только... это не аварийный выход, и его тоже создала ты?"
  - text:
      - "Ответа нет. Дверь просто стоит на месте в безмолвии."
  - char: "commander"
    side: "left"
    text:
      - "Непохоже, что есть какой-то другой выход..."
      - "Я открываю её."
