chapter1:
  rows:
  - text:
      - "Вокруг царила кромешная тьма, которую нарушал лишь тусклый свет приборной панели."
      - "Помещение гудело от электрического шума и звуков работающих машин — это была какая-то комната управления."
  - char: "scythexiii???"
    side: "left"
    text:
      - "Начать поиск..."
  - text:
      - "Бледная как кость фигура безмолвно парила во тьме."
  - char: "scythexiii???"
    side: "left"
    text:
      - "Поиск завершен. Запустить Мост Смерти."
  - text:
      - "Фигура завершила аутентификацию, а затем снова растворилась во тьме."
  - char: "death_bridge"
    side: "left"
    text:
      - "БИП-БИП-БИП!"
  - text:
      - "Раздался резкий, неестественно высокий звук уведомления, и в воздухе возникла голографическая проекция."
  - char: "devil_rad"
    side: "right"
    text:
      - "БЗЗЗТ... Ахахахаха! БЗЗЗТ... подумала, что это так забавно, что я просто обязана протянуть ей руку помощи... БЗЗЗТ..."
  - char: "scythexiii???"
    side: "left"
    text:
      - "Дьявол..."
  - char: "death_bridge"
    side: "right"
    text:
      - "БУП-БУП-БУП!"
  - char: "strength_rad"
    side: "left"
    text:
      - "БЗЗЗТ... пространственный удар, вызванный угрозой V категории... БЗЗЗТ... пересмотреть список приоритетов..."
  - char: "scythexiii???"
    side: "right"
    text:
      - "Сила..."
  - char: "death_bridge"
    side: "left"
    text:
      - "ДЗИНЬ-ДЗИНЬ-ДЗИНЬ!"
  - char: "lovers_rad"
    side: "right"
    text:
      - "БЗЗЗТ... Этого... БЗЗЗТ... совершенно недостаточно. БЗЗЗТ... Твое поле боя прямо здесь..."
  - char: "scythexiii???"
    side: "left"
    text:
      - "Влюбленные..."
  - char: "death_bridge"
    side: "right"
    text:
      - "БИП-БИП-БИП!"
  - char: "moon_rad"
    side: "left"
    text:
      - "БЗЗЗТ... Координаты слишком далеко... БЗЗЗТ... Невозможно оказать поддержку... БЗЗЗТ..."
  - char: "scythexiii???"
    side: "right"
    text:
      - "Луна..."
  - char: "death_bridge"
    side: "left"
    text:
      - "БУП-БУП-БУП!"
  - char: "empress_rad"
    side: "right"
    text:
      - "Внимание! Недостаточно прав для наблюдения! Внимание!"
  - char: "scythexiii???"
    side: "left"
    text:
      - "Императрица..."
  - char: "death_bridge"
    side: "right"
    text:
      - "ДЗИНЬ-ДЗИНЬ-ДЗИНЬ!"
  - char: "tower_rad"
    side: "left"
    text:
      - "Внимание! БЗЗЗТ..."
      - "Абонент временно недоступен. Пожалуйста, оставьте сообщение после..."
  - char: "scythexiii???"
    side: "right"
    text:
      - "Башня..."
  - char: "death_bridge"
    side: "left"
    text:
      - "БИП-БИП-БИП!"
  - char: "miss_d???_rad"
    side: "right"
    status: "is-red"
    text:
      - "БЗЗЗТ... Ну жеее! БЗЗЗТ... Быстрее! БЗЗЗТ... Запускай поезд!"
  - char: "scythexiii???"
    side: "left"
    text:
      - "...Нашла тебя."
