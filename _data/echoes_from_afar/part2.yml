chapter1:
  rows:
  - text:
      - "В доме при мягком свете потрескивал камин. На столешнице стояла миска с дымящейся горячей едой."
      - "Снаружи в окна билась ледяная метель. Но, несмотря на всю её ярость, ветрам не удавалось пронести сквозь эти четыре стены ни капли холода."
  - char: "grozny"
    side: "left"
    text:
      - "Держи — горячий суп. Он очень вкусный."
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "(Угх...)"
  - char: "grozny"
    side: "left"
    text:
      - "Он безопасный. Могу попробовать первой, если сомневаешься."
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "(Я изо всех сил старалась избежать такого сценария...)"
  - char: "grozny"
    side: "left"
    text:
      - "Ням... Видишь? Теперь ешь."
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "(Как я вообще здесь оказалась?)"
  - char: "gangut"
    side: "left"
    text:
      - "Боже. Твоя оснастка еле держится."
      - "Товарищ, скажи мне имя ублюдка, который это сделал! Я заставлю его заплатить!"
  - char: "kuybyshev"
    side: "right"
    text:
      - "Успокойся, Гангут. Сможете поговорить об этом позже."
  - char: "soobrazitelny"
    side: "left"
    text:
      - "Да, успокойся! Эта леди сбежала из адской ветви, так что избавь её на минутку от разговоров о мести!"
      - "И не волнуйся, товарищ Киров МЕТА. Гениальный механик починит твою оснастку так, что она будет как новенькая! Ты просто отдыхай и расслабляйся!"
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "(«Сбежала»? О чём она говорит?)"
  - char: "poltava"
    side: "left"
    text:
      - "Мы все удивлены видеть тебя. Твоё прибытие предсказала Память Меркурия МЕТА."
      - "По тебе видно, что ты через многое прошла."
      - "Но теперь всё позади. Здесь ты в безопасности, и наш Северный Парламент приветствует тебя как одну из нас."
      - "А пока сосредоточься на отдыхе и восстанавливай силы. Если что-нибудь нужно, ты всегда можешь поговорить с нами."
  - char: "kirov_meta"
    side: "right"
    status: "is-meta"
    text:
      - "(Память, вот же сволочь... Какой лжи ты наплела людям в этой ветви?)"
      - "(Что бы ты ни пыталась здесь провернуть, я вижу, что ты потерпела неудачу. Они бы не проявили ко мне столько доброты, если бы у тебя всё получилось.)"
      - "(А раз ты потерпела неудачу... значит, у меня еще есть время.)"
      - "(Я ещё могу кое-что сделать.)"
      - "(Товарищи...)"
      - "(Надеюсь, вы не будете против, если я немного здесь задержусь.)"
