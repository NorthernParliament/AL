chapter1:
  rows:
  - text:
      - "Дворец Дракона — легендарная твердыня, которую Империя Сакуры заполучила после ожесточенной битвы."
      - "Теперь он принадлежал Мусаси. Дворец безмолвно покоился на морском дне."
  - char: "musashi"
    side: "left"
    text:
      - "Это место всегда было моим. А теперь — официально."
      - "Дзинцу, как продвигается миссия?"
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Пока всё идет гладко."
      - "Мы будем готовы к отплытию завтра к полудню и должны достичь цели точно по графику."
  - char: "musashi"
    side: "left"
    text:
      - "Я горжусь тобой. Мы просто обязаны помочь Акаги с её планом."
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Разумеется."
  - char: "musashi"
    side: "left"
    text:
      - "Теперь, что касается нашего собственного плана..."
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Он тоже продвигается без заминок."
      - "Я уже установила всё оборудование для наблюдения и обновила защитные системы."
      - "...Если понадобится, я могу подготовить места и для гостей."
  - char: "musashi"
    side: "left"
    text:
      - "В этом нет необходимости. Главное — чтобы план Акаги увенчался успехом."
      - "Однако, если ситуация выйдет из-под контроля, мы будем вынуждены принять меры. Уверена, ты это понимаешь."
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Разумеется. Прошу прощения, я сболтнула лишнего."
  - char: "kii_rad"
    side: "left"
    text:
      - "Эй. Я тебя не отвлекаю?"
  - char: "musashi"
    side: "right"
    text:
      - "Нисколько. Что-то случилось?"
  - char: "kii_rad"
    side: "left"
    text:
      - "Дзуйкаку и Микаса заявились к твоему особняку. Что мне с ними делать?"
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "План уже вступил в завершающую стадию. Ты могла бы просто сказать им, что её нет дома."
      - "В конце концов, это чистая правда."
  - char: "musashi"
    side: "left"
    text:
      - "Против Дзуйкаку такая отговорка сработала бы, это так."
      - "Однако я не опущусь до полуправды в разговоре с Микасой."
      - "Я поступлю так — пойду навстречу Микасе. А ты в моё отсутствие останешься здесь за главную."
      - "Пока меня не будет, продолжай приготовления в обычном режиме."
      - "Если я не вернусь, или если со мной не удастся связаться — выступайте с Дворцом Дракона, как и планировалось."
  - char: "jintsuu_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Как скажешь, госпожа Мусаси."
      - "Пожалуйста, будь осторожна."
