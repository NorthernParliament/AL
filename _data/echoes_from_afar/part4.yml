chapter1:
  rows:
  - text:
      - "Это было безжизненное место, чьей единственной отличительной чертой была бесконечная необъятность."
      - "Здесь не было ни неба, ни земли, ни даже моря. Абсолютно пустое пространство во всех смыслах этого слова."
      - "Ибо здесь пролегала граница между истиной и ложью."
  - char: "rodney_meta???"
    side: "left"
    status: "is-lightgray"
    text:
      - "«Я» почувствовала боль. «Я» услышала чьи-то рыдания."
      - "Здесь так одиноко, и так шумно..."
      - "Это... место «моего» рождения?"
      - "Возможно, да. А возможно, и нет."
      - "Нет... В данный момент это точно не так."
      - "«Я» родилась из пустоты. Пустоту «я» принесла с собой, и в пустоту «я» вернусь."
      - "Путешественники издалека, прошу, обратите на «меня» внимание..."
      - "И станьте свидетелями «моей» гибели."

chapter2:
  rows:
  - char: "strength"
    side: "left"
    text:
      - "Получен сигнал с устройства наблюдения. С поправкой на относительное время, испытательный полигон F-45733 исчез на физическом уровне примерно 3 часа назад."
  - char: "temperance"
    side: "right"
    text:
      - "Выполняю поиск координат F-45733."
      - "Координаты найдены. 2.9143, 99.9998, 19.9998, -2376029143."
      - "100 плюс 20? Это был эксперимент в экстремальных условиях?"
      - "В таком случае, у нас есть вероятный виновник этого исчезновения."
  - char: "strength"
    side: "left"
    text:
      - "Да. Также был зафиксирован пространственный удар, вызванный угрозой V категории. Наблюдаемая интенсивность: высочайшая. Уровень угрозы: максимальный."
      - "Это не шутки. Нам нужно пересмотреть список приоритетов и сделать это задачей номер один."
  - char: "hermit"
    side: "right"
    text:
      - "Мощностей наших локальных ковчегов недостаточно. Нам троим потребуется перенаправить как минимум 80% ресурсов наших мейнфреймов."
      - "Свяжись с другими Арбитрами в этом регионе и запроси поддержку."
  - char: "temperance"
    side: "left"
    text:
      - "Выполняю. Однако не обещаю, что мы получим серьезную поддержку за столь короткий срок."
  - char: "hermit"
    side: "right"
    text:
      - "...Приостановите свои текущие задачи. Мы выдвигаемся прямо сейчас."

chapter3:
  rows:
  - char: "fusou_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Наши «старые подруги» приостановили свой протокол! Похоже, они готовятся к перемещению."
  - char: "hiyou_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Правда? Возможно, их терпение наконец-то лопнуло."
  - char: "junyou_meta_rad"
    side: "right"
    text:
      - "Отшельник, Умеренность, Сила... Эта троица целую вечность была для нас занозой."
      - "Я-то думала, что нам не удастся нанести им ответный удар, пока Шарнхорст и та самая Фридрих дер Гроссе не закончат строительство нашей новой базы."
  - char: "enterprise_meta"
    side: "left"
    status: "is-meta"
    text:
      - "...Вполне возможно, что тот пространственный удар привлек их внимание."
      - "Уичита и Кимберли уже в пути. Они не позволят этим ублюдкам делать то, что им заблагорассудится."
      - "Такао, командование переходит к тебе. На этот раз мы станем занозой для НИХ."
      - "А когда наша новая база будет готова, мы продолжим действовать по нашему первоначальному плану и покончим с этими Арбитрами раз и навсегда."
      - "И последнее — отряд Уичита сам решит, когда нам встретиться, в зависимости от ситуации на фронте."
  - char: "takao_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Поняла. Возвращение того, что нашла Эссекс, является нашим главным приоритетом. Выдвигайтесь и будьте спокойны — я удержу оборону."
