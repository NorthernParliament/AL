chapter1:
  rows:
  - text:
      - "Девушка-корабль сидела на подоконнике стального здания, глядя на бескрайние белые просторы, и одним большим глотком допивала свой напиток."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "А-ах... Апельсиновый сок. Вот уж сюрприз. Не думала, что у тебя найдутся нормальные напитки."
  - char: "devil"
    side: "right"
    text:
      - "Растрогана?"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Немного."
      - "Напиток волнует меня куда меньше, чем само это здание. Как тебе вообще удалось его построить?"
  - char: "devil"
    side: "right"
    text:
      - "Прости, это секрет, известный лишь Арбитрам."
      - "Тебе лучше не задерживаться здесь надолго. Эта белая пустота сведет тебя с ума."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Я знаю. Поэтому и ненавижу сюда приходить."
      - "Хватит ходить вокруг да около. Зачем ты меня вызвала?"
  - char: "devil"
    side: "right"
    text:
      - "Без особой причины. Я просто оказала кое-кому услугу."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "ТЫ оказываешь людям услуги?"
  - char: "devil"
    side: "right"
    text:
      - "Разумеется. Просто от этой особы отвернулась удача."
      - "И я имею в виду — ЕЙ КРУПНО не повезло! Ахахахаха!"
      - "Сначала у нее украли дом, а затем ее грандиозный план с треском провалился."
      - "Я случайно наткнулась на нее и подумала, что это так забавно, что я просто обязана протянуть ей руку помощи."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "О чем ты говоришь?"
  - char: "devil"
    side: "right"
    text:
      - "Будет быстрее, если ты спросишь у нее сама."
  - char: "communicator"
    side: "left"
    text:
      - "*ЩЕЛК!*"
  - char: "devil"
    side: "right"
    text:
      - "Память, я сделала то, о чем ты просила. Теперь сама с ней разговаривай."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "...Память?"
      - "Судя по тому, что сказала мне Дьявол, дела у тебя идут не очень."
  - char: "pamiat_merkuria_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "«Не очень»? Да это мягко сказано!"
      - "Ты хоть представляешь, как сильно меня подставили твои разведданные? Все оказалось СОВЕРШЕННО иначе, чем ты говорила!"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Что ты сказала?"
      - "Мои разведданные должны были быть точными. Я просто передала тебе то, что узнал мой зонд."
      - "Возможно, в них и были мелкие недочеты, но ничего такого, что могло бы сделать эти данные бесполезными."
      - "Разве что... Империя Сакуры с испытательного полигона Бета в действительности знает слишком мало."
      - "Скажи мне, что именно было не так с этой информацией?"
  - char: "pamiat_merkuria_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Слишком многое, чтобы всё перечислять! Мы проторчим здесь весь день, если я начну рассказывать о каждой мелочи! Приходи сюда и посмотри сама!"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "К сожалению, сначала мне нужно разобраться с кое-чем важным. Сама-знаешь-кто положила на это глаз, так что мои руки связаны."
  - char: "devil"
    side: "right"
    text:
      - "Ты ведь говоришь о пространственной флуктуации, не так ли?"
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Значит, ты тоже об этом знаешь."
  - char: "devil"
    side: "right"
    text:
      - "Угу. Они попросили меня прийти на помощь."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Ну и? Ты собираешься?"
  - char: "devil"
    side: "right"
    text:
      - "Возможно. Если ТЫ уходишь, сделай одолжение и прихвати меня с собой."
      - "Прыжок на такое большое расстояние в одиночку отнимет у меня слишком много сил."
  - char: "hatakaze_meta"
    side: "left"
    status: "is-lightgray"
    text:
      - "Звучит как план."
  - char: "devil"
    side: "right"
    text:
      - "Обожаю, когда есть план."
  - char: "pamiat_merkuria_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "..."
      - "В КАКОМ СМЫСЛЕ «звучит как план»?!"
      - "А как же я?"
      - "Что мне-то делать?"
  - char: "devil"
    side: "right"
    text:
      - "Расслабься. Просто держись, и решение само тебя найдет."
  - char: "pamiat_merkuria_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Ага, конечно. Даже ты сама в это не веришь."
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Кхм. Память, ты же легенда. С какими бы трудностями ты ни столкнулась, я знаю, ты их преодолеешь."
      - "Я буду у тебя сразу же, как только закончу со своими делами."
  - char: "pamiat_merkuria_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Серьезно? И сколько времени это займет?"
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Хмм... На данном этапе трудно сказать."
  - char: "devil"
    side: "left"
    text:
      - "Вы уже закончили? Я отключаюсь."
  - char: "hatakaze_meta"
    side: "right"
    status: "is-lightgray"
    text:
      - "Да, давай. Вернемся к нашему разговору."
  - char: "devil"
    side: "left"
    text:
      - "Ладненько. Пока-пока!"
  - char: "pamiat_merkuria_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Эй! Пого..."

chapter2:
  rows:
  - char: "communicator"
    side: "right"
    text:
      - "*ЩЕЛК!*"
  - char: "pamiat_merkuria_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Угх-х-х..."
      - "Значит, подкрепления не будет. Отлично. Просто отлично."
      - "Что они там говорили о «пространственной флуктуации»? Что в ней такого важного?"
      - "А, проехали. Не моё это дело."
      - "Я знаю лишь одно — она ни капельки не переживает, так что и мне не стоит."
      - "Если она хочет, чтобы я ждала, то я буду ждать на своих собственных условиях!"
      - "Как раз так совпало, что поблизости есть целая куча курортов, так что..."
      - "Устрою-ка я себе отпуск на испытательном полигоне!"
