chapter1:
  rows:
  - text:
      - "За три дня до церемонии закрытия Всемирной выставки."
      - "В комнате отдыха Фош носилась туда-сюда со шваброй в руках."
      - "Жоффр же, сидевшая у окна, не отрывалась от книги, казалось, совершенно не замечая суеты вокруг."
  - char: "foch"
    side: "left"
    text:
      - "Послушай..."
      - "Эй... Я! ГОВОРЮ! ЖЕ!"
      - "Госпожа ангел, миледи, моя многоуважаемая госпожа Жоффр, может, подсобишь?"
      - "Леди Клемансо будет жить здесь во время церемонии закрытия!"
  - char: "joffre"
    side: "right"
    text:
      - "Мне кажется, здесь и так довольно чисто."
      - "К тому же, возможно, наши старания всё равно не понадобятся."
  - char: "foch"
    side: "left"
    text:
      - "...Не понадобятся? В каком смысле? Ты что, получила какие-то инсайдерские сведения от Трибунала?"
  - char: "joffre"
    side: "right"
    text:
      - "Вовсе нет. Просто от происходящего исходит... неправильная аура."
      - "Ты знаешь, где сейчас находится леди Клемансо?"
  - char: "foch"
    side: "left"
    text:
      - "Насколько я помню... она осматривает достопримечательности на территории Империи Сардиния."
      - "По плану она должна прибыть на выставку за день до церемонии закрытия, то есть послезавтра."
  - char: "joffre"
    side: "right"
    text:
      - "Верно, но когда прибудет Керсен?"
  - char: "foch"
    side: "left"
    text:
      - "...Керсен?"
      - "По моим сведениям, она прибудет завтра, чтобы помочь нам с приготовлениями к церемонии закрытия."
  - char: "joffre"
    side: "right"
    text:
      - "То, что Керсен приедет на выставку первой, уже само по себе неправильно."
  - char: "foch"
    side: "left"
    text:
      - "Я не так хорошо с ней знакома... И что же в этом такого?"
  - char: "joffre"
    side: "right"
    text:
      - "Керсен — личный офицер разведки леди Клемансо, она никогда не действует в одиночку."
      - "Разве что..."
  - char: "foch"
    side: "left"
    text:
      - "Разве что?"
  - char: "joffre"
    side: "right"
    text:
      - "В последний раз она действовала в одиночку несколько лет назад в Тулоне."
  - char: "foch"
    side: "left"
    text:
      - "............"
  - char: "joffre"
    side: "right"
    text:
      - "И к тому же, леди Жан Бар на днях тоже была переведена леди Клемансо обратно в Тулон."
  - char: "foch"
    side: "left"
    text:
      - "Действительно, в этом есть что-то необычное... И что же нам тогда делать?"
  - char: "joffre"
    side: "right"
    text:
      - "Во-первых, прекратить уборку."
      - "А во-вторых..."
      - "«Attendre et espérer»."
      - "Ждать и надеяться."
