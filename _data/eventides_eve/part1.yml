chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Центральный узел Врат Авалона — Двор Камелота."
      - "Изначально это было красивое место, напоминавшее райский уголок."
      - "Но сейчас дым и артиллерийский огонь неумолимо сжимали кольцо вокруг замка со всех сторон."
  - char: "repulse_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Сестрёнка, эти неопознанные, похожие на призраков враги..."
      - "Разве они не похожи на тех тварей, которыми управляла мисс Ричард?!"
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Да, я тоже так думаю."
      - "Этот монстр... Она всё-таки выследила нас даже здесь."
      - "Но как именно они вторглись..."
      - "Враг не прошел через канал Камелота, они словно появились из ниоткуда в других частях Врат Авалона..."
      - "А ведь у этой искусственной сингулярности должен быть только один внешний выход."
  - char: "repulse_meta"
    side: "left"
    status: "is-meta"
    text:
      - "В таких технических вопросах, если уж ты не разбираешься, сестрёнка, то я и подавно!"
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "И то верно."
  - char: "repulse_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Хе-хе~ Сестрёнка, как обстановка на твоей стороне?"
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Зачистка идет гладко. Однако... хоть эти враги и слабы, их слишком много."
      - "Если мы не сможем выяснить, как они проникают во Врата Авалона, рано или поздно Двор Камелота окажется в опасности."
      - "Затяжной бой нам не на пользу... Что со связью?"
  - char: "repulse_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Внешняя связь полностью прервана — их коммуникаторы просто ужасны. Вот бы они могли использовать такие же, как у нас."
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "А ты умеешь их делать?"
  - char: "repulse_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Сестрёнка, если даже ты не умеешь, откуда мне-то знать!"
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "И то верно..."
  - text:
      - "БАБАХ!!!"
  - char: "vanguard"
    side: "left"
    text:
      - "Подкрепление прибыло! Леди Ринаун, леди Рипалс, простите за задержку!"
  - char: "monarch"
    side: "right"
    text:
      - "Простите, что заставили вас ждать."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Я привела силы поддержки. Как сейчас обстановка?"
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "...Ее Величество Куин Элизабет?"
      - "Как... как ты могла лично явиться в такое опасное место?!"
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Естественно, чтобы разобраться в ситуации."
      - "Я лишь получила сообщение об аномалии во Вратах Авалона, а затем внутренняя связь оборвалась."
      - "Я лучше всех знакома с этим местом, так что кто, кроме меня, должен во всем разобраться, когда что-то идет не так?"
      - "Эх... Я только после прибытия поняла, что здесь уже идёт такой сложный бой."
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "...По крайней мере, в этот раз ты догадалась взять с собой эскорт."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Врата Авалона слишком важны, чтобы я относилась к этому легкомысленно."
      - "Скорее, из-за внезапности мне пришлось взять только тех, кто оказался под рукой."
      - "Так какова обстановка на данный момент?"
  - char: "renown_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Сами по себе вторгшиеся враги не представляют особой угрозы, но способы их проникновения и намерения остаются неясными."
      - "Судя по их внешнему виду и особенностям, эта атака, вероятно, является предвестником скорого вторжения того монстра, маскирующегося под Бон Омм Ричард."
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Хм... Увидев этих тварей, я подумала о том же."
      - "Однако того жуткого торнадо, как в прошлый раз, пока не видно."
      - "Возможно, Ричард для вторжения нужно соблюсти какие-то особые условия..."
      - "Хм... Всем войти во Двор Камелота."
      - "Как и в прошлый раз, мы полностью изолируем Двор Камелота. Подготовимся к глухой обороне, а дальше будем действовать по обстоятельствам."
      - "Если это действительно вторжение Ричард... мы обязаны удержать её здесь любой ценой."
  - char: "newcastle"
    side: "right"
    text:
      - "Ваше Величество, появился белый туман, и он быстро расползается двигаясь в нашу сторону."

chapter2:
  rows:
  - char: "queen_elizabeth"
    side: "left"
    text:
      - "Белый туман?"
  - text:
      - "БАБАХ!!!"
  - char: "repulse_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Стой, кто идёт!"
  - char: "royal_oak"
    side: "right"
    text:
      - "Н-не стреляйте, свои!"
  - char: "hero"
    side: "left"
    text:
      - "О-хо-хо~! Герой выходит на сцену, получайте, силы зла!"
  - char: "argus"
    side: "right"
    text:
      - "Аргус прибыла для оказания поддержки! Ваше Величество, прости, что заставили тебя поволноваться."
  - char: "implacable"
    side: "left"
    text:
      - "Ваше Величество, это Имплакабл. Я привела флот Антарктического океана в качестве подкрепления."
      - "Позволь нам тоже внести свой вклад в предстоящем сражении."
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "..............?"
      - "Флот Антарктического океана...?"
      - "Имплакабл, как вы добрались сюда из Антарктического океана?"
  - char: "implacable"
    side: "left"
    text:
      - "Не так давно я получила сообщение о том, что ты ведешь тяжелый бой во Вратах Авалона."
      - "После этого я немедленно подготовила флот, и мы использовали ассорти микрослоёв,технологию оставленную Компилятором, чтобы создать проход и прибыть сюда!"
  - char: "queen_elizabeth"
    side: "right"
    text:
      - "...Я ведь только-только прибыла во Врата Авалона. Как ты, находясь так далеко в Антарктике, узнала об этом заранее?"
      - "И этот проход на основе ассорти микрослоёв Компилятора... Что это такое, и откуда ты об этом знаешь?"
      - "Кто тебе все это рассказал? Кто помог тебе добраться сюда?"
  - char: "implacable"
    side: "left"
    text:
      - "Эм..."
      - "......Ты сама, Ваше Величество?"
