chapter1:
  rows:
  - text:
      - "С тех пор как Компилятор была повержена, ситуация в Северной Атлантике (океане NA) с каждым днем становится всё лучше."
      - "С открытием безопасных маршрутов, позволяющих обычным судам пересекать океан c конвоем, в этих водах вновь закипела жизнь."
      - "К сожалению, воздушное пространство над океаном NA всё ещё недостаточно безопасно для свободных полетов пассажирских самолетов."
      - "В этот момент конвой двигался по безопасному маршруту, направляясь к своей цели — Империи Сардиния."
  - char: "memphis"
    side: "left"
    text:
      - "Солнышко светит, море спокойное — прекрасная погода для путешествия~"
      - "Время летит так быстро. Не успели оглянуться, как Всемирная выставка, длившаяся больше полугода, уже подходит к концу..."
      - "Мы не успели на церемонию открытия, так что во время закрытия нужно обязательно хорошенько расслабиться~"
      - "Я ведь права, а... Командир!"
      - "Хелена, конфискуй документы у Командира!"
      - "Это же отпуск, нужно строго ограничить ежедневное рабочее время!"
  - char: "helena"
    side: "right"
    text:
      - "...Ограничивать рабочее время во время отпуска — само по себе звучит странно."
  - char: "memphis"
    side: "left"
    text:
      - "Тогда скажи Командиру, чтобы он вообще не работал в отпуске, и посмотрим, что он тебе ответит."
  - char: "helena"
    side: "right"
    text:
      - "Командир, давай ты не будешь работать во время отпуска, хорошо?"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Хорошо!"
      - "Но если я не буду искать работу, разве работа не найдет меня сама?"

chapter3:
  rows:

  - char: "commander"
    side: "left"
    text:
      - "Это будет трудновато..."
      - "В конце концов, даже если я не буду специально искать работу, сообщения с рабочими поручениями всё равно будут приходить бесконечным потоком."

chapter4:
  rows:
  - char: "memphis"
    side: "right"
    text:
      - "Вот видишь, поэтому приходится прибегать к такому компромиссу."
  - char: "helena"
    side: "left"
    text:
      - "...Кажется, так оно и есть. Спасибо за твой труд, Командир."
  - char: "new_jersey_rad"
    side: "right"
    text:
      - "Давно не виделись, народ! Говорит Нью-Джерси, флагман флота Союза Орла в Северной Атлантике!"
      - "Дальше на протяжении всего вашего пути через океан NA мой флот будет обеспечивать вам полное сопровождение."
      - "Можете ни о чем не беспокоиться и просто наслаждаться своим путешествием в отпуск~"
  - char: "commander"
    side: "left"
    text:
      - "Давно не виделись, Нью-Джерси."
      - "Уже освоилась в Северной Атлантике?"
  - char: "new_jersey_rad"
    side: "right"
    text:
      - "Честно говоря, нет!"
      - "Скукотища... Сейчас здесь просто невероятно скучно."
      - "Послушай меня, Хани..."
  - char: "memphis"
    side: "left"
    text:
      - "Кхм... Это общий канал."
  - char: "new_jersey_rad"
    side: "right"
    text:
      - "...Послушай меня, Командир, всё совсем не так, как раньше!"
      - "Здесь, в океане NA, я уже десять дней подряд не видела ни одной серийной модели Сирен!"
      - "Целых десять дней подряд!"
      - "С тех пор как была уничтожена Компилятор, Сирены, которые раньше всегда появлялись, сколько бы мы их ни били, действительно начали исчезать навсегда!"
  - char: "commander"
    side: "left"
    text:
      - "...Звучит так, будто ты оплакиваешь вымирание какого-то вида."
  - char: "new_jersey_rad"
    side: "right"
    text:
      - "Что-то вроде того!"
      - "Теперь моя ежедневная работа — это чтение отчетов, патрулирование и погружение в свои мысли с пустым взглядом на море..."
      - "В Тихом Океане было куда интереснее... Знай я заранее, ни за что бы не поменялась с Энтерпрайз!"
  - char: "memphis"
    side: "left"
    text:
      - "Нью-Джерси, не забывай: океан без врагов — это то, ради чего мы сражаемся."
      - "Нынешний мир — это правильно, именно таким и должен быть наш океан."
      - "К тому же, океан NA не настолько спокоен, чтобы совсем нечем было заняться, верно?"
      - "В том инциденте с нападением на Королевский Флот масштаб задействованных сил Сирен был весьма необычным. Удалось ли выяснить, откуда взялись нападавшие и кому они подчинялись?"
  - char: "new_jersey_rad"
    side: "right"
    text:
      - "Как и ожидалось от Мемфис... сразу зришь в корень проблемы."
      - "Нет, ни малейшей зацепки!"
      - "В конце концов, они действительно напали только один раз!"
      - "Именно из-за необходимости предотвратить «второе нападение» мне и приходится оставаться здесь и без конца патрулировать..."
      - "Эх... Надеюсь, они поскорее сунутся снова. Тогда мы сможем отследить их источник и накрыть всех разом!"
  - char: "commander"
    side: "left"
    text:
      - "...Похоже, что от излишнего безделья тоже бывают свои проблемы."
  - char: "king_george_v_rad"
    side: "right"
    text:
      - "Флагман Королевского Флота в океане NA, Кинг Джордж V, приветствую всех."
      - "Добро пожаловать в Северную Атлантику, Командир."
      - "Весь твой путь через эти воды, Королевский Флот также будет обеспечивать тебе полное сопровождение, так что можешь быть спокоен."
  - char: "commander"
    side: "left"
    text:
      - "Огромное спасибо."
  - char: "king_george_v_rad"
    side: "right"
    text:
      - "Не стоит благодарности, это долг Королевского Флота."
      - "Кроме того, Её Величество просила меня передать тебе кое-что."
      - "Её Величество сказала, что после окончания церемонии закрытия павильон Королевского Флота хоть и закроет свои двери для публики, но не будет немедленно демонтирован."
      - "Она уже забронировала время специально для твоей индивидуальной экскурсии и надеется, что ты заглянешь туда, когда тебе будет удобно."
      - "Также Её Величество не сможет присутствовать на церемонии закрытия из-за государственных дел, и просила выразить тебе свои искренние сожаления по этому поводу."
      - "Однако все вопросы, касающиеся Королевского Флота на выставке, были полностью доверены леди Илластриес. Если у тебя возникнут какие-либо просьбы, Командир, можешь обращаться напрямую к ней."
  - char: "commander"
    side: "left"
    text:
      - "Немного неожиданно. Не думал, что Элизабет пропустит церемонию открытия, а теперь еще и на закрытие не успевает."
      - "Я был уверен, что она обязательно приедет поучаствовать в этом веселье."
  - char: "king_george_v_rad"
    side: "right"
    text:
      - "Её Величество тоже очень сожалеет. Она всё это время очень хотела приехать и даже подготовила немало вариантов грандиозного появления..."
      - "Как бы то ни было, Её Величество желает тебе приятно провести время на церемонии закрытия выставки."
  - char: "new_jersey_rad"
    side: "left"
    text:
      - "И я, и я того же желаю! Желаю тебе насладиться чудесным отпуском, Командир!"
  - char: "commander"
    side: "right"
    text:
      - "Вы обе слишком преувеличиваете... Большое спасибо."
  - char: "new_jersey_rad"
    side: "left"
    text:
      - "В каком месте преувеличиваем? Ты вообще помнишь, когда у тебя в последний раз был отпуск?!"
      - "Точно~ Насколько я помню, в Средиземном море всё ещё время от времени случаются нападения Сирен, верно?"
      - "А это куда опаснее, чем здесь, в океане NA!"
      - "В целях безопасности, может, мне просто сопроводить вас всю дорогу до самой выставки?"
      - "Так мы сможем гарантировать абсолютную безопасность!"
  - char: "memphis"
    side: "right"
    text:
      - "...Кхм, попрошу кое-кого не делать столь откровенных заявлений о пренебрежении своими служебными обязанностями."
  - char: "king_george_v_rad"
    side: "left"
    text:
      - "Пожалуйста, не беспокойся об этом, леди Нью-Джерси."
      - "После прохождения Гибралтарского пролива сопровождение в западной части Средиземного моря возьмет на себя Уорспайт, а затем, в центральной части и до самой выставки, конвоированием займется Илластриес."
      - "Королевский Флот обеспечит безопасность Командира на протяжении всего пребывания в Средиземном море."
  - char: "memphis"
    side: "right"
    text:
      - "К тому же, Эссекс и остальные тоже там, так что кое-кому стоит оставить мысли об отлынивании от работы и добросовестно нести службу в океане NA~"
  - char: "new_jersey_rad"
    side: "left"
    text:
      - "Э-эх... Хорошо..."
