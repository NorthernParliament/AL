chapter1:
  rows:
  - text:
      - "До слуха донесся перезвон колокольчиков."

chapter2:
  rows:
  - text:
      - "Волны мерно накатывали одна за другой."
      - "Под темным небом взору предстали врата тории, ярко выделяющиеся на общем фоне."
  - char: "shinano"
    side: "left"
    text:
      - "Пространство между иллюзией и реальностью, спокойное место, ведущее в царство снов..."
      - "Хоть обычно я погружаюсь в сновидения напрямую."
      - "Но порой случается сделать остановку и здесь..."
  - text:
      - "Оглушительный рев океана. Ураганные ветра ударили с двух противоположных сторон, заставляя вздымающиеся волны с грохотом сталкиваться друг с другом."
  - char: "shinano"
    side: "left"
    text:
      - "Это царство иллюзий. Поэтому здесь бывает то спокойно, то мрачно, то неистово."
      - "Сегодняшней ночью... оно кажется особенно беспокойным."
      - "Раз так... то дальше меня, скорее всего, ждет отнюдь не прекрасный сон."

chapter3:
  rows:
  - text:
      - "Это была полутемная комната."
      - "Из-за груды книг вдалеке донесся несколько взволнованный голос."
  - char: "marco_polo"
    side: "left"
    text:
      - "..Правда? Местонахождение Короны найдено?!"
      - "...Многие подчиняются моим приказам, но тех, кто искренне мне помогает, очень мало."
      - "Я так и знала, что на тебя можно положиться!"
      - "Не волнуйся. Раз уж я знаю, где она, я непременно добьюсь успеха."
      - "...Мм? Железная Кровь и Королевский Флот?"
      - "Ты беспокоишься, что они помешают?"
      - "Хм... В последнее время они и правда зашли слишком далеко."
      - "Но эту Бисмарк я не воспринимаю всерьез."
      - "А вот с Элизабет будет немного сложнее..."
      - "Твои опасения небезосновательны... Я найду способ сделать так, чтобы они не путались под ногами."
      - "Хе-хе... Начав с Бытия  11:1 и закончив 11:9."
      - "Как тебе?"
      - "...Ха-ха-ха, я не забуду оказанную тобой помощь."
      - "Когда исполнится мое желание, твое желание тоже непременно сбудется...."

chapter4:
  rows:
  - char: "shinano"
    side: "left"
    text:
      - "(Она не разговаривает сама с собой, это разговор по коммуникатору...?)"
      - "(Интерьер комнаты выполнен в стиле Империи Сардиния, в этом нет сомнений.)"
      - "(В таком случае, этот голос... принадлежит Марко Поло из Империи Сардиния.)"
      - "(А вот голос на другом конце коммуникатора... не разобрать.)"
      - "(Где-то Марко Поло разговаривает с кем-то... вот такой это сон?)"
      - "(Мрачный, но не неистовый... Предзнаменование, кажется, этому совершенно не соответствует.)"
      - "(Или же в этом кроется какой-то иной смысл...)"

chapter5:
  rows:
  - text:
      - "Черное солнце безмолвно пылало."
      - "Оно излучало свет, но не грело, словно ледяная черная дыра."
  - char: "shinano"
    side: "left"
    text:
      - "...Подобное зрелище я вижу во сне впервые."
      - ".....От этого поистине кровь стынет в жилах."
      - "Неужели в этом кроется источник того неистовства?"
  - text:
      - "«...Суд грядет»"
  - char: "shinano"
    side: "left"
    text:
      - "...Суд?"
      - "...О каком суде идет речь?"
  - text:
      - "«...То, что ты зришь, скоро явится»"
  - char: "shinano"
    side: "left"
    text:
      - "То, что я вижу..."

chapter6:
  rows:
  - text:
      - "«...Суд грядет»"
      - "«...Он явится»"
