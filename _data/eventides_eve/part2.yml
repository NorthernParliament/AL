chapter1:
  rows:
  - text:
      - "Мерная тряска поезда клонила Советский Союз в сон."
      - "Незаметно для неё самой её сознание куда-то уплыло."

chapter2:
  rows:
  - text:
      - "Чёрное солнце безмолвно пылало."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Я помню... я читала документы в поезде."
      - "Немного устала и решила чуть-чуть вздремнуть."
      - "Выходит... это сон?"
  - text:
      - "Никто не ответил на мысли вслух Советский Союз, лишь чёрное солнце продолжало беззвучно пылать."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "..Оно пылает так яростно, но я не чувствую ни малейшего жара."
      - "Напротив, от него веет каким-то холодом..."
      - "Что же это за видение..."
  - char: "sovetskaya_rossiya_xd"
    side: "right"
    status: "is-lightgray"
    text:
      - "▇▆▅■▎▃▌█▆▎▇█▎■▄▆▋▂▁▅▎▌█▊▇▊▇"
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Товарищ Россия...?"
  - char: "sovetskaya_rossiya_xd"
    side: "right"
    status: "is-lightgray"
    text:
      - "▅▁▂▋▄▊■▆▎▅▁▂▋▄▊■▆▎▇▆▅■"
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Прости, я не могу разобрать твои слова. Пожалуйста, повтори."
  - char: "sovetskaya_rossiya_xd"
    side: "right"
    status: "is-lightgray"
    text:
      - "……………………"

chapter3:
  rows:
  - text:
      - "Скр-р-р-р...."
      - "Под звук тормозящего поезда Советский Союз открыла глаза."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Пылающее черное солнце и бормочущая что-то невнятное Россия... какой странный сон..."
      - "Неужели правду говорят: о чем думаешь днем, то и снится «ночью»..."
      - "Эх, лучше сосредоточиться на текущих делах, поскорее со всем разобраться и вернуться."
  - text:
      - "Советский Союз привела в порядок лежащие под рукой документы, готовясь к выходу из вагона."
      - "В данный момент операция «Ледяной дождь» шла строго по плану."
      - "Изначально Советский Союз тоже должна была находиться в центральном штабе и осуществлять командование."
      - "Однако поступило сообщение от их тайного союзника — Клемансо, которая хотела как можно скорее заполучить корабль-прототип «Шампань»."
      - "В то же время технический отдел Черноморского судостроительного завода сообщил, что проект «Шампань» столкнулся с некоторыми проблемами, и существует риск срыва сроков."
      - "Именно поэтому Советский Союз была вынуждена покинуть командный центр и прибыть на Черноморскую верфь, чтобы лично во всем разобраться."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Каждый корабль-прототип абсолютно уникален, это вам не какая-то стандартная модель, которую можно с легкостью поставить на конвейер..."
  - char: "voice_an"
    side: "right"
    text:
      - "Товарищ Советский Союз, поезд прибыл на станцию."
      - "Перед выходом, пожалуйста, убедитесь, что все секретные документы при вас. Товарищ Кронштадт из Бюро безопасности уже ожидает вас."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Ладно... Поживем — увидим. Будем решать проблемы по мере их поступления."
