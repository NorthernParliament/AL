chapter1:
  rows:
  - char: "carabiniere"
    side: "left"
    text:
      - "...Фух, не ожидала, что Сирены в Серебряном океане будут всё ещё так активны."
      - "Но, раз мы прорвались сюда, можно считать, что мы в относительной безопасности."
      - "В конце концов, отделались легким испугом..."
      - "В этот раз плавание было действительно долгим: то гости из Империи Сакуры, то крепость Железной Крови..."
      - "Если немного привести мысли в порядок, получится рассказать немало захватывающих историй о наших приключениях!"
      - "Уже представляю, с каким волнением меня будут слушать Рекко и остальные~"
      - "Раз так, нужно будет как следует подержать интригу..."
      - "Хм... нет-нет, первым делом нужен отдых."
      - "Как же я соскучилась по большой купальне, мягкой постели и настоящей пицце..."
  - char: "communicator"
    side: "right"
    text:
      - "*бип* *бип*"
  - char: "carabiniere"
    side: "left"
    text:
      - "Вызывает... леди Литторио."
      - "....Неужели мне уже поручили новое задание?!"
  - char: "communicator"
    side: "right"
    text:
      - "*бип* *бип*"
  - char: "carabiniere"
    side: "left"
    text:
      - "...Ах!"
      - "Это Карабиньере, приветствую тебя, леди Литторио!"
  - char: "littorio_rad"
    side: "right"
    text:
      - "Отличная работа. Как прошло путешествие, всё гладко?"
  - char: "carabiniere"
    side: "left"
    text:
      - "В пути мы несколько раз столкнулись с патрульными флотами Сирен, но в итоге всё обошлось!"
      - "За исключением того, что запасы боеприпасов немного истощились, всё в норме!"
  - char: "littorio_rad"
    side: "right"
    text:
      - "Вот и славно. В этот раз, заставив тебя в спешке возвращаться в одиночку, я действительно подвергла тебя слишком большому риску."
      - "Хорошо, что в итоге всё обошлось... Позже я устрою банкет в твою честь, так что жди с нетерпением~"
  - char: "carabiniere"
    side: "left"
    text:
      - "А-а...?! Как я смею! Я всего лишь выполняла свой долг!"
      - "Целый банкет в качестве награды... Это кажется немного чрезмерным."
  - char: "littorio_rad"
    side: "right"
    text:
      - "А мне кажется, что банкет — это в самый раз. Ты так долго была в отъезде, должно быть, очень соскучилась по блюдам родной земли~?"
  - char: "carabiniere"
    side: "left"
    text:
      - "В таком случае, не смею отказываться!"
  - char: "littorio_rad"
    side: "right"
    text:
      - "Отлично. Но конкретные детали банкета я организую уже после того, как вернусь из Венеции в Рим."
  - char: "carabiniere"
    side: "left"
    text:
      - "Конечно, всё на твое усмотрение!"
      - "Однако... так ты сейчас не в Риме?"
      - "Разве не говорили, что в связи с приближающейся церемонией закрытия там сильно не хватает рабочих рук..."
  - char: "littorio_rad"
    side: "right"
    text:
      - "Изначально я и должна была там находиться."
      - "Но недавно мы с Венето обнаружили одну странность..."
      - "Знаешь ли ты, что Сенат использует Венецию как перевалочный пункт для сбора артефактов."
      - "И эта работа не прекращалась даже во время проведения Всемирной выставки."
      - "В ходе нашего расследования выяснилось, что в конечном итоге все эти артефакты оседают в руках Марко Поло."
      - "А затем часть из них через нее тайно рассылается по различным местам вокруг Средиземного моря."
      - "Хотя некоторые из отправленных артефактов всё же тайно попали на территорию Всемирной выставки..."
      - "Но их не выставляли в павильоне культуры. После доставки они просто бесследно исчезали."
      - "Странно, не так ли?"
  - char: "carabiniere"
    side: "left"
    text:
      - "Звучит и правда немного странно..."
      - "Возможно, у леди Марко Поло есть какие-то свои планы. Ты не пробовала спросить у нее напрямую?"
  - char: "littorio_rad"
    side: "right"
    text:
      - "Спрашивала. Она отказалась что-либо рассказывать, прикрываясь секретной операцией Сената."
      - "Поэтому мне пришлось заняться расследованием самой."
  - char: "carabiniere"
    side: "left"
    text:
      - "Вот оно как... Значит, моя следующая задача — помочь тебе расследовать, куда уходят эти артефакты?"
  - char: "littorio_rad"
    side: "right"
    text:
      - "Ах, прости-прости, на самом деле это тебя не касается. И как это я так увлеклась и отвлеклась от темы..."
      - "Твое задание немного изменилось. Вместо того чтобы отправиться на выставку для поддержания порядка, тебе предстоит обеспечивать безопасность устья Суэцкого канала."
      - "И еще одно дополнительное задание."
      - "По пути к Суэцкому каналу обращай внимание на следы флота Империи Дракона. Проверь, не находятся ли они всё еще где-то поблизости."
      - "Флот Империи Дракона заявил, что они уже отправились обратно на родину и даже не планируют присутствовать на церемонии закрытия."
      - "Но мне кажется, что далеко они не ушли... Помоги мне это выяснить."
  - char: "carabiniere"
    side: "left"
    text:
      - "Слушаюсь!"
      - "Однако у меня есть вопрос. Если я всё-таки встречу флот Империи Дракона, что мне делать дальше?"
  - char: "littorio_rad"
    side: "right"
    text:
      - "Поздоровайся как обычно, а затем постарайся втереться к ним в доверие."
      - "Если будет возможность, постарайся задержаться с ними подольше."
      - "Я хочу знать причину, по которой они отказались от участия в церемонии закрытия, но при этом не покинули Средиземное море."
  - char: "carabiniere"
    side: "left"
    text:
      - "Втереться в доверие... Хм... Слушаюсь!"
  - char: "littorio_rad"
    side: "right"
    text:
      - "Отлично, я на тебя рассчитываю."
      - "Как только будут результаты, доложи мне. У меня тут еще много дел, так что конец связи..."
