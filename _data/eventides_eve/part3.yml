chapter1:
  rows:
  - text:
      - "За четыре дня до церемонии закрытия Всемирной выставки..."
      - "Как только Ришелье закончила просматривать документы, раздался стук в дверь."
  - char: "richelieu"
    side: "left"
    text:
      - "Войдите."
  - char: "le_terrible"
    side: "right"
    text:
      - "Прости за беспокойство, леди Ришелье."
  - char: "richelieu"
    side: "left"
    text:
      - "А, это ты, Террибль. Присаживайся. Что-то случилось?"
  - char: "le_terrible"
    side: "right"
    text:
      - "Да, первый этап работ по восстановлению острова уже завершен."
      - "В целом все прошло довольно гладко. Я уже подготовила отчет, пожалуйста, взгляни."
  - char: "richelieu"
    side: "left"
    text:
      - "Отличная работа."
  - char: "le_terrible"
    side: "right"
    text:
      - "Ты тоже выглядишь довольно неплохо. Лекарства Трибунала подействовали?"
  - char: "richelieu"
    side: "left"
    text:
      - "Думаю, можно сказать, что эффект мгновенный. В последние несколько дней мне больше не снились те странные вещи."
      - "А вот ты выглядишь очень уставшей, ты в порядке?"
  - char: "le_terrible"
    side: "right"
    text:
      - "Да... просто немного не выспалась, ничего страшного."
  - char: "richelieu"
    side: "left"
    text:
      - "С инвентаризацией не нужно так торопиться, действуй постепенно, не спеша."
  - char: "le_terrible"
    side: "right"
    text:
      - "Я поняла... спасибо за твою заботу."
      - "И еще, это список той части активов Ортодоксии, с которой мы уже закончили..."
  - text:
      - "*тук* *тук*"
  - char: "richelieu"
    side: "left"
    text:
      - "Войдите."
  - char: "la_galissonniere"
    side: "right"
    text:
      - "Кардинал Ришелье~!"
      - "Я всё разузнала! Леди Клемансо уже отправилась в Сардинию, всё её внимание сосредоточено на Всемирной выставке."
      - "Если я отправлюсь на отдаленные аванпосты Трибунала для сбора информации, проблем возникнуть не должно. Шпионский план вполне осуществим!"
  - char: "le_terrible"
    side: "left"
    text:
      - "Тебе просто не сидится на месте... верно?"
  - char: "la_galissonniere"
    side: "right"
    text:
      - "Что ты имеешь в виду!"
      - "От меня всё равно никакой пользы в инвентаризации, если я останусь здесь, то буду лишь работать как чернорабочая."
      - "Уж лучше я проявлю себя в той сфере, которая мне больше подходит, правда ведь~?!"
  - char: "le_terrible"
    side: "left"
    text:
      - "...Я думаю, стоит ещё подождать."
      - "Подождать на Святой Елене ещё какое-то время... прежде чем действовать."
  - char: "richelieu"
    side: "right"
    text:
      - "Террибль, ты от нас еще что-то скрываешь?"
  - char: "le_terrible"
    side: "left"
    text:
      - "...На Святой Елене спрятана не только Корона, но и важное оборудование Трибунала."
      - "Хотя Корону и похитили, враг так и не обнаружил это оборудование."
      - "Именно оно — наш ключ к тому, чтобы переломить ситуацию."
      - "В это время мы обязаны оставаться здесь, защищать его и... ждать подходящего момента."
  - char: "richelieu"
    side: "right"
    text:
      - "Подходящего момента... Какого еще момента?"
  - char: "le_terrible"
    side: "left"
    text:
      - "Я пока не знаю точного времени..."
      - "Но если мы просто будем ждать на Святой Елене, должно произойти что-то хорошее, наверное..."
  - char: "bearn_rad"
    side: "right"
    text:
      - "Леди Ришелье, флот Союза Орла вот-вот войдет в порт Святой Елены."
      - "И еще... «Луи IX» передает тебе привет."
  - char: "richelieu"
    side: "left"
    text:
      - "Неужели этот момент настал... Наш корабль-прототип наконец-то вступит в строй!"
      - "Прошу прощения, вы двое, но мне нужно немедленно отправиться в порт и заняться этим вопросом."
  - text:
      - "Бросив короткое «Прошу меня извинить», Ришелье поспешно покинула комнату."
  - char: "le_terrible"
    side: "left"
    text:
      - "Похоже, в наших руках появился еще один острый клинок..."
      - "Ла Галиссоньер, раз уж тебе в эти дни так скучно, как насчет того, чтобы помочь кардиналу Ришелье с тренировочными боями для нашего корабля-прототипа?"
  - char: "la_galissonniere"
    side: "right"
    text:
      - "Эм... У меня не самые приятные воспоминания о кораблях-прототипах, так что найди кого-нибудь другого."
      - "А я... ну, я найду себе другое занятие!"
  - char: "le_terrible"
    side: "left"
    text:
      - "Вы всё ещё не помирились...?"
  - char: "la_galissonniere"
    side: "right"
    text:
      - "Дело не столько в примирении, сколько... ты же знаешь характер Гаскони."
      - "«Не могу осознать смысл слова примирение»."
      - "«Вердикт: в этом нет необходимости»."
      - "И как, скажи на милость, после этого с ней разговаривать?"
  - char: "le_terrible"
    side: "left"
    text:
      - "Да уж, тяжело тебе приходится..."
      - "Кстати, у тебя еще осталось то лекарство? Дай мне еще один флакон."
  - char: "la_galissonniere"
    side: "right"
    text:
      - "Ты... ведь просишь его не просто про запас, верно?"
      - "Негативные последствия чего ты пытаешься им подавить?"
  - char: "le_terrible"
    side: "left"
    text:
      - "...Пока это секрет."
