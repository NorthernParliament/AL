chapter1:
  rows:
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "………………"
      - "Командир, если говорить объективно... план Клемансо действительно является наилучшим выбором в данной ситуации."
      - "Он даже более надежен и продуман, чем тот, что я подготовила до прибытия сюда."
      - "Я склоняюсь к тому, чтобы действовать по этому плану."
      - "Что же касается того, можно ли ей доверять... Я буду внимательно следить за ней в процессе выполнения."

chapter2:
  rows:
  - text:
      - "Выслушав мнение Мемфис МЕТА и проведя краткое обсуждение с представителями фракций, все пришли к единому согласию."
      - "Сейчас во временном командном пункте то и дело раздаются звуки переговоров по коммуникаторам."
      - "Вооруженные силы по всей акватории планомерно перебрасываются для выполнения новой задачи."

chapter3:
  rows:
  - text:
      - "В таких местах, как Гибралтар, Мальта, Рим, Тулон, Таранто и Венеция, изначально были размещены гарнизонные флоты, поэтому они могут немедленно приступить к работе с оборудованием «Стены Авроры»."

chapter4:
  rows:
  - text:
      - "Что касается миланского направления, Литторио заявила, что мобилизует вооруженные силы Империи Сардиния, чтобы разобраться с узлом."

chapter5:
  rows:
  - text:
      - "На территории самого Ириса расположено множество узлов, и изначально мы планировали отправить туда флоты поддержки."
      - "Однако Ришелье сообщила, что имеющихся у неё сил более чем достаточно, поэтому эта часть задачи была полностью возложена на флот Ириса."
      - "А затем, что касается Кесарии и Карфагена..."
      - "...На самом деле, я уже замечал это раньше: на предоставленной Клемансо карте многие места обозначены своими древними названиями."
      - "Клемансо объяснила это тем, что таковы концептуальные требования для создания пространственных узлов."
      - "Поэтому на время проведения этой операции было решено использовать именно эти названия."
      - "В отношении этих двух районов приказы о переброске сил уже отданы."

chapter6:
  rows:
  - text:
      - "Узел в Алжире будет поручен Гибралтарскому флоту Королевского Флота."

chapter7:
  rows:
  - text:
      - "флот Железной Крови под командованием Ойген объединится с Мальтийским флотом Королевского Флота, после чего они вместе отправятся в Карфаген."
      - "...Настоящую проблему представляет восточная часть Средиземного моря."
      - "В этом районе находится почти треть всех ключевых узлов, но там практически нет гарнизонных флотов, на которые можно было бы опереться..."

chapter8:
  rows:
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Мне очень жаль, Командир."
      - "Помимо Средиземного моря, где находишься ты, в остальных частях этого мира также возникли чрезвычайно опасные аномалии."
      - "И с нашей стороны мы пока больше не можем отправить сюда дополнительные силы."
  - char: "essex"
    side: "right"
    text:
      - "Похоже, для решения проблемы в восточной части Средиземного моря нам придется задействовать объединенный флот с территории выставки."
      - "Но мы не можем отправить слишком много сил за один раз."
      - "Враги продолжают прибывать к выставке целыми партиями. Установить очередность и разбираться с узлами по одному — вот наш лучший план."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Эх, если бы только удалось восстановить связь с портом Александрия..."
      - "Господин Командир, я предлагаю начать именно с Александрии."
      - "Если мы сможем как можно скорее выяснить, что случилось с тамошним гарнизонным флотом... и если мы еще успеем их спасти, то силы нашего флота в восточном Средиземноморье значительно возрастут."
  - char: "commander"
    side: "right"
    text:
      - "Предложение Венето имеет смысл. Раз уж теперь позволяют условия, нет причин сидеть сложа руки и игнорировать гарнизонный флот в Александрии, с которым пропала связь."
  - char: "communicator"
    side: "left"
    text:
      - "*бип*"
  - text:
      - "Коммуникатор на приватном канале внезапно зазвонил без всякого предупреждения."
      - "И на связи была... Советский Союз?!"
  - char: "sovetsky_soyuz_old_rad"
    side: "right"
    text:
      - "Я так рада слышать твой голос в этой кризисной ситуации, товарищ Командир."
      - "Я прибыла на Черное море несколько дней назад, чтобы разобраться с проблемами на Черноморском судостроительном заводе."
      - "Никак не ожидала, что меня тоже втянет в эти события..."
      - "В данный момент проблемы на нашей стороне уже решены... Как обстановка на выставке, товарищ Командир?"

chapter9:
  rows:
  - text:
      - "Я объяснил Советский Союз всё, что произошло ранее, и изложил наш текущий план."
  - char: "sovetsky_soyuz_old_rad"
    side: "right"
    text:
      - "Вот оно как... За Константинополь и Эгейское море можете не волноваться."
      - "Я поведу флот Северного Парламента через пролив Босфор, а затем разберусь со всеми узлами, расположенными в районе Эгейского моря."
  - char: "clemenceau"
    side: "left"
    text:
      - "Прошу прощения, я вмешаюсь."
      - "Мой заказ, Советский Союз, вопрос с заказом решен?"
  - char: "sovetsky_soyuz_old_rad"
    side: "right"
    text:
      - "Разумеется, я как раз ради этого и прибыла на Черное море."
      - "Твой заказ в отличном состоянии. Однако из-за внезапности произошедшего я временно мобилизовала её в состав боевого флота. Надеюсь, ты не возражаешь."
  - char: "clemenceau"
    side: "left"
    text:
      - "Ничего страшного. Боевые условия — как раз идеальное место для проверки её характеристик."
  - char: "commander"
    side: "right"
    text:
      - "Заказ?"
  - char: "clemenceau"
    side: "left"
    text:
      - "Всего лишь продукт, созданный на фоне нашего дружественного международного сотрудничества~"
      - "Не думала, что она так скоро нам пригодится..."
  - char: "sovetsky_soyuz_old_rad"
    side: "right"
    text:
      - "Клемансо имеет в виду корабль-прототип, который мы разрабатывали совместно — Шампань."
      - "На данный момент она успешно активирована, и я временно зачислила её в ряды флота Северного Парламента."
      - "Её также можно считать полноценной боевой единицей."
      - "Что ж, Командир, я отправляюсь мобилизовывать флот для выполнения задачи. Увидимся на выставке."
  - char: "commander"
    side: "left"
    text:
      - "...Операция «Ледяной дождь» в самом разгаре, и Советский Союз, которая должна была руководить ею из штаба, внезапно оказалась на Черном море."
      - "И по счастливому совпадению... корабль-прототип как раз в этот момент вступил в строй."

chapter10:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Продолжу расспрашивать Клемансо.)"
  - char: "clemenceau"
    side: "right"
    text:
      - "Хм? Раз уж Свободный Ирис может сотрудничать с Союзом Орла в разработке кораблей-прототипов, то и я, естественно, вольна выбирать себе партнеров."
      - "Или тебя смущают временные рамки?"
      - "Намекаешь на то, что это я подстроила неполадки с кораблем-прототипом, или на то, что эти неполадки были устранены именно сейчас тоже по моей указке?"
      - "Перед нами стоят куда более насущные проблемы, не путай приоритеты, Командир~"

chapter11:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Лучше промолчу.)"
      - "(Совершенно очевидно, что Клемансо не из тех, кто так просто выложит всю правду.)"
      - "(Да и сейчас есть куда более насущные проблемы...)"


chapter12:
  rows:
  - char: "littorio"
    side: "left"
    text:
      - "Венето, я вернулась~"
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Литторио! Ты не ранена?! Дай-ка я посмотрю!"
  - char: "littorio"
    side: "left"
    text:
      - "Всё в порядке, не волнуйся, к тому же здесь столько людей..."
      - "Да и потом, разве кризис такого масштаба способен сломить меня, Литторио?~"
      - "С Венецией я уже закончила, в Милане тоже скоро всё наладится."
      - "Я уже в курсе произошедшего."
      - "Я не знаю, как обстоят дела в порту Александрия, но в районе Суэцкого канала мы отнюдь не беззащитны."
      - "Ранее я отправила Карабиньере в тот район для выполнения... одной миссии по дружественному обмену."
      - "Одолжу-ка я коммуникатор выставки и попробую с ней связаться~"
  - text:
      - "Говоря о выполнении миссии, перед словами «дружественный обмен» Литторио сделала едва заметную паузу."
      - "Впрочем, новость о том, что возле Суэцкого канала есть военно-морские силы, в любом случае радует."
      - "В то же время... прибывающее одно за другим подкрепление натолкнуло меня на одну мысль."
      - "Сейчас мы как никогда нуждаемся в боевой мощи, и есть одна сильная союзница, которая, возможно, могла бы присоединиться к битве..."

chapter13:
  rows:
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Командир, на этом нам пора расстаться. Арбитры отступили, а значит, и наше временное сотрудничество тоже подошло к концу."
      - "Если хотите покинуть Сингулярность, возвращайтесь тем же путем, я открою для вас проход."
      - "Надеюсь, при нашей следующей встрече мы не окажемся по разные стороны баррикад. Прощай~"
  - char: "commander"
    side: "right"
    text:
      - "Подожди, ты же обещала..."
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Эм... ну и память же у тебя. Ты про то, что я обещала ответить на один твой вопрос?"
      - "...Ладно, уговор дороже денег, я сдержу свое обещание."
      - "Вот только... сейчас мы совершенно не в том положении, чтобы спокойно сидеть и разговаривать..."
  - text:
      - "Я почувствовал, как она сунула что-то мне в карман куртки."
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "(Значит, договорились, свяжемся позже.)"
      - "(Это будет нашим с тобой секретом. Я знаю пароль от твоей связи и координаты твоего порта. Пожалуйста, держи это в строжайшей тайне.)"

chapter14:
  rows:
  - text:
      - "...С тех пор из-за бесконечной череды дел мы, кажется, так и не смогли связаться."
      - "Ситуация критическая... хм, стоит попробовать."
