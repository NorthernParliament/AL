chapter1:
  rows:
  - text:
      - "Вместе с падением трона Марко Поло мир в мгновение ока кардинально изменился."
      - "Под покровом пурпурного зарева в небе, на каждом лице, куда ни кинь взгляд, читались шок и тревога."
      - "Было очевидно, что внезапное поражение Марко Поло отнюдь не означало конец этого инцидента."
      - "Во тьме зарождалась куда более страшная угроза."
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "Дамы, эм... пожалуй, добрый вечер?"
      - "Вы остались довольны недавним уходом Марко Поло со сцены?"
  - char: "memphis"
    side: "left"
    text:
      - "Ты... Клемансо из Доминиона Виши?"
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "Верно, это я."
      - "Изначально мы должны были встретиться на радостной церемонии закрытия выставки."
      - "Никак не ожидала, что всё обернется подобным образом. Какая жалость."
  - char: "pamiat_merkuria"
    side: "left"
    text:
      - "Говоришь так, будто тебя это вообще не касается."
      - "Не только Марко Поло, но и ты замешана в этом деле."
      - "Когда нас атаковали эти Дирои, ты просто взяла и увела свой флот."
      - "К тому же, среди напавших на нас врагов было немало серийных кораблей, принадлежащих твоему Трибуналу!"
  - char: "essex"
    side: "right"
    text:
      - "Претензии Памяти Меркурия вполне обоснованы. Пожалуйста, дай нам внятное объяснение, Клемансо."
  - char: "clemenceau_rad"
    side: "left"
    text:
      - "Вы назвали эти Механизмы Бога «Дироями»?"
      - "Хм~ А звучит неплохо."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Пожалуйста, не уводи разговор в сторону в такой момент, госпожа Клемансо."
      - "У меня тоже накопилось много вопросов, и я надеюсь, что ты дашь нам исчерпывающее объяснение."
  - char: "clemenceau_rad"
    side: "left"
    text:
      - "Ах~ Всё, что я делала, было не более чем актерской игрой."
      - "Мне пришлось временно увести флот, потому что того требовала ситуация."
      - "Если бы я их не увела, Марко Поло с перепугу могла бы заставить их обернуться против нас прямо там. И тогда мой спектакль был бы сорван."
      - "На самом деле я отправила их на задание — уничтожить трон Марко Поло."
      - "То же самое касается и приказа об атаке, отданного флоту Суда."
      - "Атака такой силы была для вас как слону дробина, зато я смогла втереться в доверие к Марко Поло. Почему бы и не воспользоваться шансом?"
  - char: "essex"
    side: "right"
    text:
      - "То есть... ты с самого начала знала о планах Марко Поло, и всё это время лишь подыгрывала ей..."
      - "Чтобы в последний момент нанести удар в спину?"
  - char: "clemenceau_rad"
    side: "left"
    text:
      - "Именно так. Я подыгрывала ей ровно до того момента, пока в этом не отпала необходимость."
      - "Разве выстрел, сбивший трон, не был великолепен?"
  - char: "illustrious"
    side: "right"
    text:
      - "Выстрел, может, и великолепен... вот только что это за золотой механический рыцарь?"
      - "Какое отношение он имеет к этим Дироям?"
  - char: "clemenceau_rad"
    side: "left"
    text:
      - "А, это. Я называю его Судейским механизмом. Или Мехнизмом Суда."
      - "И хотя он был создан благодаря силам Марко Поло, не волнуйтесь — у меня над ним полный контроль."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Ты кажешься такой уверенной в себе..."
      - "Твое внезапное нападение действительно застало всех нас врасплох..."
      - "Но... если ты с самого начала знала о планах Марко Поло, почему ты позволила ситуации зайти так далеко?!"
      - "Ты хоть понимаешь, что снаружи потери уже достигли астрономических масштабов?!"
  - char: "clemenceau_rad"
    side: "left"
    text:
      - "Не стоит так горячиться, госпожа Венето."
      - "Пусть я и узнала о планах Марко Поло немного раньше вашего, вы сами видели, на какие чудовищные вещи она способна, обладая такой силой."
      - "Что я могла сделать, когда она так тщательно всё оберегала?"
      - "К тому же, хотя нынешнее положение и выглядит критическим, боюсь, истинная суть этой угрозы сильно отличается от того, как вы её понимаете."
      - "Хм... В двух словах это не объяснить."
      - "Обсудим всё с глазу на глаз, когда встретимся. Я уже направляюсь к выставочному павильону."
  - char: "commander"
    side: "right"
    text:
      - "Насчет флота в порту Тулон..."
      - "Данные разведки показывают, что флот Доминиона Виши в порту Тулон всё еще ведет тяжелые бои."
      - "Гибралтарский флот Королевского Флота, отправившийся им на помощь, продвигается медленно из-за столкновений с силами противника по пути."
      - "Раз уж ты решила вступить в бой, интересно, есть ли у тебя какие-то способы помочь им."
  - char: "clemenceau_rad"
    side: "left"
    text:
      - "Большое спасибо за заботу, Командир."
      - "Но, пожалуйста, не волнуйся. Раз уж я давно приняла решение сорвать заговор Марко Поло, я не могла оставить нашу территорию совершенно без защиты."
      - "Если судить по времени... хм, думаю, там уже всё должно было разрешиться."
      - "Что же касается Гибралтарского флота Королевского Флота, то пусть они лучше... впрочем, это мы тоже обсудим при встрече."
      - "Тут дорога не из легких, так что я пока отключаюсь~"
  - char: "memphis"
    side: "right"
    text:
      - "Взяла и просто отключилась... Какая своенравная особа."
  - char: "essex"
    side: "left"
    text:
      - "Да уж... Редко встретишь кого-то, кто был бы еще более своенравным, чем Принц Ойген."
  - char: "communicator"
    side: "right"
    text:
      - "Бип!"
  - char: "memphis"
    side: "left"
    text:
      - "Коммуникатор снова звонит... Неужели она забыла что-то сказать?"
  - char: "essex"
    side: "right"
    text:
      - "Вряд ли. В прошлый раз, когда она подключалась к нашей частоте, она не утруждала себя вежливыми просьбами о разрешении на передачу."
  - char: "commander"
    side: "left"
    text:
      - "Давай ответим и узнаем."
  - char: "richelieu_rad"
    side: "right"
    text:
      - "Говорит Ришелье."
      - "Командир, а также представители фракций, присутствующие на выставке, наконец-то я смогла с вами связаться."
      - "Не волнуйтесь, я только что прибыла в Тулон во главе основных сил флота Свободного Ириса."
      - "В настоящее время ситуация взята под контроль. Порт Тулон и флот Ириса в полной безопасности."

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Как ты здесь оказалась?"

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Разве ты не должна быть на острове Святой Елены?"


chapter4:
  rows:
  - char: "richelieu_rad"
    side: "right"
    text:
      - "Это долгая история."
      - "Хм... Если вкратце, то после того, как я привела флот на остров Святой Елены, я взяла под свой контроль местную крепость Трибунала."
      - "Во время инвентаризации ресурсов крепости мы обнаружили, что там находится секретный исследовательский центр Трибунала, который в основном занимается изучением технологий Сирен."
      - "Затем мы нашли комплекс оборудования, который позволяет нам использовать оставленную Компилятор... «сеть скоростных магистралей» для быстрого перемещения по акватории."
      - "Трибунал называет это устройство «Вратами», а саму сеть — «Сетью врат»."
      - "Судя по найденным нами исследовательским данным, так называемая Сеть врат представляет собой некую транспортную систему Сирен, построенную с помощью ассорти микрослоёв."
      - "В прошлом Компилятор оставила на дне различных акваторий и в Зеркальных морях огромное количество соединенных друг с другом каналов, образующих целую сеть."
      - "Именно по этой причине Сирены и их флоты всегда могли появляться из ниоткуда и наносить внезапные удары."
      - "Мы полагаем, что внезапное нападение на Королевский Флот, произошедшее ранее в Северной Атлантике, тоже было связано с этой сетью."
      - "Однако сама по себе Сеть врат нейтральна."
      - "Основываясь на результатах анализа исследований Трибунала, проведенного за это время на острове Святой Елены, мы уже нашли способ использовать эту сеть для перемещения."
      - "А потом мы получили известия о том, что в порту Тулон идут ожесточенные бои, а в Средиземном море произошли серьезные изменения."
      - "Поэтому я немедленно повела флот на помощь."
  - char: "commander"
    side: "left"
    text:
      - "(Раз уж Ришелье смогла без единого выстрела взять под контроль крепость Трибунала на острове Святой Елены, это значит...)"
      - "(Ришелье и фактическая глава Трибунала Клемансо уже давно объединили свои силы втайне от всех...)"
      - "...Выходит,  действия Клемансо, когда она сначала сделала вид, что сотрудничает с Марко Поло, а затем в критический момент нанесла удар в спину, тоже были заранее согласованы с тобой?"
  - char: "richelieu_rad"
    side: "right"
    text:
      - "Клемансо сделала... что?"
      - "Ох... Я вспомнила."
      - "Да, всё верно. Клемансо сообщила мне о своем плане перед тем, как начать действовать, и получила мое согласие."
      - "И Доминион Виши, и Свободный Ирис — это часть Ортодоксии Ирис."
      - "И перед лицом кризиса, угрожающего безопасности Европы и даже всего мира, мы, естественно, выбрали объединить наши усилия."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Хм..."
  - char: "illustrious"
    side: "right"
    text:
      - "Хм..."
  - char: "avrora"
    side: "left"
    text:
      - "Товарищ Командир, и все собравшиеся здесь боевые товарищи."
      - "И удар, который Клемансо вместе с Трибуналом нанесла в спину врагу в решающий момент, и прибытие основных сил флота Ириса под командованием Ришелье..."
      - "Всё это — невероятно ценная и своевременная поддержка в текущей обстановке в Средиземном море."
      - "Совокупная боевая мощь объединенных флотов двух Ирисов по-прежнему огромна, и они понимают нынешнюю ситуацию куда лучше нас."
      - "Я считаю, что мы должны воспользоваться этим благоприятным поворотом событий, а не терять драгоценное время на беспочвенные подозрения, позволяя ситуации ухудшаться."
  - char: "commander"
    side: "right"
    text:
      - "Аврора совершенно права."
      - "Ришелье, какой у тебя план?"
  - char: "richelieu_rad"
    side: "left"
    text:
      - "Хм, что касается нашего дальнейшего плана..."
      - "Плохо... прибыло вражеское подкрепление."
      - "Похоже, здесь бой продлится еще какое-то время."
      - "Не волнуйся, Командир. Разрешение ситуации на территории выставки я полностью доверила Клемансо."
      - "Я уверена, у неё определенно есть план...."
