chapter1:
  rows:
  - text:
      - "Внезапный удар затянул всех в еще более глубокую тьму."
  - char: "noshiro"
    side: "left"
    text:
      - "Кхм, кхм... Госпожа Синано, ты в порядке?!"
  - char: "shinano"
    side: "right"
    text:
      - "Я цела."
  - char: "hakuryuu"
    side: "left"
    text:
      - "Госпожа Синано, ситуация складывается скверно!"
      - "Нас окружает огромная толпа жутких врагов, лезущих прямо из темноты!"
  - char: "shinano"
    side: "right"
    text:
      - "...Силуэты кошмаров."
      - "Я уже видела их раньше и называла эти «сущности» именно так..."
      - "лохо. Госпожа Жанна, мы должны немедленно отступить."
  - char: "jeanne_d_arc"
    side: "left"
    text:
      - "Согласна. Сюффрен и Майе Брезе, меняйте курс и становитесь в авангард, разведайте нам путь назад."
  - char: "shinano"
    side: "right"
    text:
      - "Нельзя, флот не должен разделяться."
      - "И нет нужды во что бы то ни стало возвращаться тем же путем..."
      - "Кошмары бесформенны, но имеют границы. Нам нужно сосредоточить все силы и выбрать одно направление для прорыва."
      - "Возможно, мы столкнемся с полчищами врагов, и этот путь будет не самым оптимальным."
      - "Но мы обязательно сможем выбраться."
  - char: "jeanne_d_arc"
    side: "left"
    text:
      - "..Похоже, ты лучше знакома с подобными ситуациями, поэтому выбор направления для прорыва я оставляю за тобой."
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "«Кошмары бесформенны, но имеют границы» — какое простое и образное описание."
      - "Но у меня есть план получше."
      - "Пожалуйста, следуйте за мной. Я знаю правильный путь отсюда."
  - char: "shinano"
    side: "left"
    text:
      - "Ты..."
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Союзница Командира."
      - "Оставим любезности на потом, а сейчас — просто доверьтесь мне."
      - "Если мы не уйдем прямо сейчас, то потом уже не сможем."

chapter2:
  rows:
  - text:
      - "Спустя некоторое время..."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Смелость в исследовании неизведанного, конечно, похвальна, но одна неверная оплошность — и вас ждала бы верная гибель."
      - "К счастью, я прибыла вовремя."
      - "Не волнуйся, Командир, я спасла весь твой разведывательный флот."
      - "Сейчас они проходят процедуру очищения, чтобы окончательно избавиться от её влияния."
      - "Но пока очищение не завершено... я побоялась, что может возникнуть угроза твоей безопасности."
      - "Поэтому я пришла доложить обо всем лично вместо них."
      - "Не ожидала, что мы снова встретимся так скоро, Командир~"
      - "Хотя... обстоятельства для этого не самые подходящие."
      - "И всё равно, я очень рада!"
  - text:
      - "С момента получения сообщения о потере связи с флотом Синано и до их благополучного возвращения из опасной зоны прошло меньше часа."
      - "Кто бы мог подумать, что в этой хаотичной битве появится еще одна столь неожиданная подмога."
  - char: "memphis"
    side: "left"
    text:
      - "Так это ты... та, кто помог нам тогда в «Море Звёзд»?"
      - "Командир позже рассказывал нам о вас... и о том, что произошло."
      - "В любом случае, я очень благодарна за то, что вы тогда помогли Командиру."
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Не стоит благодарности. Твой Командир — это и мой Командир тоже."
      - "Я сделала то, что должна была."
  - char: "memphis"
    side: "left"
    text:
      - "Насколько я помню, Командир называл тебя просто Мемфис..."
      - "Тогда как мне... к тебе обращаться?"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Как тебе больше нравится."
      - "Мемфис, Мемфис МЕТА, можешь даже звать меня «той бесцеремонной дамочкой»."
      - "Бьюсь об заклад, ты наверняка уже думала назвать меня именно так, верно?"
  - char: "memphis"
    side: "left"
    text:
      - "Я... я ничего такого не думала!"
  - char: "clemenceau"
    side: "right"
    text:
      - "А я-то волновалась, что внезапно погрузившийся во тьму мир ударит по вашему боевому духу."
      - "Но видя, с какой энергией вы препираетесь друг с другом, я спокойна~"
  - text:
      - "Дверь конференц-зала снова распахнулась, и к этому принимающему всё более странный оборот разговору присоединилась женщина в черной мантии."
  - char: "memphis"
    side: "left"
    text:
      - "Ах... прошу прощения."
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Кхм... действительно стоит сначала обсудить дело. Извините, я отвлеклась."
      - "Если вкратце, ситуация из рук вон плоха."
      - "Хелена находится снаружи и пытается замедлить скорость наложения двух миров, но она уже на пределе своих сил."
      - "Мне стоило огромного труда прорваться сюда, в надежде, что я смогу хоть как-то решить проблему изнутри."
  - char: "clemenceau"
    side: "left"
    text:
      - "Ты сказала — скорость наложения двух миров?"
      - "Похоже, эта незнакомая леди прекрасно понимает суть происходящего."
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "...Я ведь еще ничего не объяснила, а ты уже понимаешь, о чем я говорю?"
      - "...Неужели ты... как-то причастна к этому?"
  - char: "clemenceau"
    side: "left"
    text:
      - "Отчасти."
      - "Ведь когда Марко Поло полная энтузиазма пришла ко мне, чтобы провернуть одно великое дело, я сделала вид, что готова помочь ей."
      - "Хотя я и не знаю, что из себя по своей сути представляет это «божество» Марко Поло."
      - "Но я знаю, в чем заключается план по его призыву, и понимаю принципы работы этого «Царства Божьего на земле», в котором мы сейчас находимся."
      - "А также — как использовать сам процесс нисхождения этого «божества» для того, чтобы нанести ответный удар."
  - text:
      - "Клемансо протянула карту."
      - "Черным маркером на карте была обведена обширная территория вокруг Средиземного моря, которая в целом совпадала с известной нам аномальной зоной."
      - "Однако на карте также были особо отмечены некоторые города, соединенные между собой множеством странных линий."
  - char: "clemenceau"
    side: "left"
    text:
      - "Эта карта представляет собой структурную схему этого особого пространства — «Царства Божьего на земле»."
      - "А отмеченные на ней точки — это расположение ключевых узлов, необходимых для поддержания существования этого пространства."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Все эти точки на карте... это...?"
  - char: "clemenceau"
    side: "left"
    text:
      - "Да, абсолютно все."
      - "Они жизненно необходимы для поддержания материализации этого так называемого «Царства Божьего на земле»."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Целей слишком много, да и расстояния между ними... колоссальные."
      - "От Парижа до Александрии, от Гибралтара до Константинополя... С этим ни за что не управиться за такое короткое время!"
  - char: "clemenceau"
    side: "left"
    text:
      - "Да. И на эту подготовку у Марко Поло ушло много времени."
      - "Что и дало мне возможность тайно вмешаться в этот процесс."
      - "А теперь взгляните на эти линии~"
  - text:
      - "Клемансо ткнула пальцем в карту и провела им вдоль линий."
  - char: "clemenceau"
    side: "left"
    text:
      - "Вы уже должны были получить известие о том, что Ришелье прибыла в Тулон во главе основных сил флота Свободного Ириса."
      - "О «Сети врат» она тоже должна была вам рассказать."
      - "Хе-хе, тогда значение этих линий должно быть совершенно ясно."
      - "В ходе моего сотрудничества с Марко Поло я тайком внесла кое-какие коррективы."
      - "Например, подключила все эти ключевые узлы к Сети врат."
      - "Или, например... установила на каждом из узлов систему «Стена Авроры»..."
      - "...которая является частью её финальной версии."
      - "«Реликвии», подготовленные Марко Поло для призыва своего божества, можно использовать в наших интересах."
      - "Если мы сможем активировать «Стену Авроры» на всех узлах, они перестанут быть опорой для удержания «Царства Божьего на земле» и превратятся в часть системы «Святое копье»."
      - "А Святое копье — символизирующее концепцию Копья Лонгина, — будет обладать силой, способной убить бога."
      - "Именно этот козырь я подготовила заранее, чтобы разрешить текущую ситуацию."
      - "В конце концов, божество Марко Поло использует эти силы для своего нисхождения. Значит, если мы обратим их вспять и сконцентрируем, это должно позволить нам уничтожить... или хотя бы значительно ослабить его."
      - "И чтобы осуществить этот план как можно быстрее, взгляните сюда."
  - text:
      - "Палец Клемансо несколько раз постучал по месту на карте, где располагалась территория выставки."
  - char: "clemenceau"
    side: "left"
    text:
      - "Разумеется, строительство павильона Доминиона Виши также велось с учетом этого плана."
      - "Поэтому я разместила внутри систему «Стена Авроры» и сделала павильон центральным узлом Сети врат Средиземного моря."
      - "Отсюда мы сможем напрямую и невероятно быстро перемещаться в каждый из узловых городов."
      - "Хоть по прибытии на место нам и не избежать ожесточенных боев, в целом это ведь весьма неплохой план, не так ли?"
  - char: "illustrious"
    side: "right"
    text:
      - "Звучит действительно осуществимо... но у меня остались кое-какие вопросы, и я надеюсь, что ты сможешь на них ответить."
      - "Судя по карте, крепости Гибралтар и Мальта тоже стали узлами."
      - "Все это... когда вы успели тайно всё это провернуть?"
  - char: "clemenceau"
    side: "left"
    text:
      - "Что касается Гибралтара, то тамошний узел, если быть точной, находится не в самом порту, а по ту сторону пролива."
      - "А что до Мальты... хе-хе, помнишь, Ле Террибль ведь бывала там несколько раз до этого?"
  - char: "illustrious"
    side: "right"
    text:
      - "...Ваши тайные операции и впрямь застают врасплох. От них просто невозможно защититься."
      - "Госпожа Венето, я должна еще раз извиниться перед тобой..."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Ничего страшного, не бери в голову... В этом деле они обвели всех нас вокруг пальца."
  - char: "clemenceau"
    side: "right"
    text:
      - "Большое спасибо всем за столь высокую оценку работы Трибунала~"
      - "Есть ли у вас еще вопросы?"
  - char: "essex"
    side: "left"
    text:
      - "Есть один самый важный вопрос, который в самом начале обошли стороной. Я надеюсь, ты на него ответишь."
      - "Что значит «наложение миров»?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Ах да... Я ведь еще этого не объяснила."
      - "В настоящее время всё, что происходит в Средиземном море, всё, что вы видите перед собой, на самом деле и реально, и иллюзорно одновременно."
      - "Царство Божье, в котором мы сейчас находимся, по своей сути является «копией», созданной прямо поверх реального мира после того, как он был скрыт."
      - "«Иллюзорным миром», порожденным искаженными желаниями Марко Поло."
      - "Все нынешние разрушения, все жертвы — это лишь действия, происходящие в «мире-копии». Для реального мира всё это — не более чем фикция."
      - "...Ровно до того момента, пока нисхождение бога не будет завершено."
      - "Процесс нисхождения бога — это не физическое перемещение в пространстве, а скорее процесс наложения двух миров друг на друга."
      - "Когда бог окончательно снизойдет, это будет означать полное слияние двух миров, и нынешняя «копия» в мгновение ока перезапишет реальный мир."
      - "И тогда иллюзия станет реальностью."
      - "Что же касается того, что представляет собой этот самый «бог», и что произойдет после завершения наложения..."
      - "Я и сама точно не знаю, да и думать об этом мне не хочется."
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "...Что именно представляет собой этот «бог» в самом центре акватории, даже мы до конца так и не поняли."
      - "Быть может, это и есть тот самый истинный ужас... с которым мы всё это время боролись!"
      - "И вы... вы по собственной воле притащили нечто подобное в свой мир?"
      - "Вы совсем спятили..."
      - "...Я тебе не доверяю."
  - char: "clemenceau"
    side: "right"
    text:
      - "Ничего страшного. Уверена, что подавляющее большинство присутствующих здесь мне тоже не доверяет."
      - "Зато я доверяю тебе."
      - "Раз уж ты понимаешь суть наложения миров, то должна понимать и то, что предложенный мной план — наилучший выбор в нынешней ситуации."
      - "Чтобы привести его в исполнение, нам нужно получить согласие одного самого важного человека."
      - "И этот важный человек... судя по всему, доверяет тебе."
      - "Я пока пойду займусь кое-какой отладкой, а уговоры оставляю на тебя, идет?"
      - "Некая «бесцеремонная дамочка»~"
