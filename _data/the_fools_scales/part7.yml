chapter1:
  rows:
  - text:
      - "Наконец, при поддержке палубной авиации мы успешно отступили внутрь «Космической Иглы»."
      - "Признаться, раньше я задавался вопросом, почему пункт экстренной эвакуации расположили именно здесь."
      - "Однако, когда мы спустились на лифте под землю, всё встало на свои места."
  - char: "essex"
    side: "left"
    text:
      - "Закрытие подземных гермодверей... успешно."
      - "Вот и всё, Командир, мы в безопасности."
  - char: "commander"
    side: "right"
    text:
      - "Этот бункер, подземное укрытие?"
  - char: "essex"
    side: "left"
    text:
      - "Хм...? Насчет этого бункера?"
      - "Когда мы получили известие о твоем визите, Саратога заодно прислала приказ от комитета о постройке убежища."
      - "Было сказано подготовиться ко всем возможным сценариям, чтобы обеспечить твою абсолютную безопасность во время пребывания на выставке."
      - "Никто и не думал, что оно действительно пригодится..."
  - char: "commander"
    side: "right"
    text:
      - "Так значит, вы построили бункер прямо под выставочным павильоном...?"
  - char: "essex"
    side: "left"
    text:
      - "А, ну конечно, существование бункера держится в секрете. Для всех остальных это преподносилось как строительство охраняемого склада для ценных экспонатов."
  - char: "memphis"
    side: "right"
    text:
      - "Я знала о существовании бункера, но даже не подозревала, что за этим стоит Саратога..."
      - "Как же она нас выручила!"
      - "Раз уж так вышло, Командир, давай пока сделаем тут наш командный центр!"
  - char: "commander"
    side: "left"
    text:
      - "Да. Раз мы временно в безопасности, теперь нужно прояснить текущую обстановку."
      - "Хелена, как продвигаются попытки установить внешнюю связь?"
  - char: "helena"
    side: "right"
    text:
      - "...Связаться со штабом в Нью-Йорке не удается, флот Нью-Джерси в Северной Атлантике тоже не отвечает."
      - "Но... сигнал связи ведет себя очень странно."
      - "Не похоже, что его глушат, скорее... он просто не может найти цель для соединения."
  - char: "essex"
    side: "left"
    text:
      - "Да, это совпадает с нашими наблюдениями."
      - "Связь внутри выставочной зоны и в прилегающих районах в целом работает исправно."
      - "Хотя из-за нападения качество связи ухудшилось, никаких мощных помех нет."
      - "Но что касается более отдаленных целей — мы вообще не можем с ними связаться... Словно адресатов на том конце просто не существует."
      - "Кстати, еще до твоего прибытия мы постарались собрать информацию о текущей ситуации."
      - "И она, честно говоря, не внушает оптимизма... Взгляни сюда."
  - text:
      - "Эссекс даёт мне планшет, с открытым на экране планом вывставочной зоны."

chapter2:
  rows:
  - char: "essex"
    side: "left"
    text:
      - "Как видишь, здесь находится «Космическая Игла», наше текущее местоположение."
      - "Наш бункер находится глубоко под павильоном, так что пока мы в безопасности."

chapter3:
  rows:
  - char: "essex"
    side: "left"
    text:
      - "Главная площадка выставки, Колизей Сардинии... как видишь, была разрушена еще в ходе первой волны атаки."
      - "В то же время как минимум десять гигантских механизмов — мы пока условно назвали их «Наблюдатели» (Gazers) — сеют хаос по всей территории выставки."
      - "И хотя палубная авиация уже нанесла по ним бомбовые удары, это принесло мало результатов. Происхождение врага и его точные боевые возможности всё ещё выясняются, свежей информации пока нет."

chapter4:
  rows:
  - char: "essex"
    side: "left"
    text:
      - "Чуть ранее нам удалось успешно установить связь с Королевским Флотом и Свободным Ирисом."

chapter5:
  rows:
  - char: "essex"
    side: "left"
    text:
      - "Павильоны обеих фракций сильно пострадали во время нападения. В данный момент они планируют собрать свои флоты и прорываться в направлении Мальты."
      - "С павильонами остальных фракций нам не удалось установить прямой контакт."

chapter6:
  rows:
  - char: "essex"
    side: "left"
    text:
      - "Однако, судя по результатам разведки, Империя Сардиния сейчас защищает свои уцелевшие павильоны и пытается организовать контратаку."

chapter7:
  rows:
  - char: "essex"
    side: "left"
    text:
      - "Флот Империи Сакуры также занял оборону в своем павильоне, и им уже удалось успешно отбить как минимум одну прямую атаку Наблюдателей."
      - "Павильон Империи Дракона, вероятно, уцелел лишь потому, что давно пустует."

chapter8:
  rows:
  - char: "essex"
    side: "left"
    text:
      - "А вот павильон Северного Парламента был разрушен. О судьбе их персонала и флота ничего не известно."

chapter9:
  rows:
  - char: "essex"
    side: "left"
    text:
      - "Вокруг островов, где расположены павильоны Железной Крови и Доминиона Виши, также обнаружены следы ожесточенных сражений."

chapter10:
  rows:
  - char: "essex"
    side: "left"
    text:
      - "Хоть мы и не знаем точной картины происходящего, учитывая, что в выставочном флоте Железной Крови находятся два корабля прототипа, у них не должно возникнуть серьезных проблем."

chapter11:
  rows:
  - char: "essex"
    side: "left"
    text:
      - "Вот вся информация, которой мы располагаем на данный момент."
      - "Попытки связаться с остальными фракциями продолжаются. Уверена, вскоре мы получим больше разведданных."

chapter12:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Спасибо за работу."
  - char: "essex"
    side: "left"
    text:
      - "Это всего лишь мой долг, не стоит благодарности."

chapter13:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Как и ожидалось от Эссекс!"
  - char: "essex"
    side: "left"
    text:
      - "Эхе-хе... Но мне еще так далеко до Энтерпрайз."
      - "Кхм... Это всего лишь мой долг, не стоит благодарности."

chapter14:
  rows:
  - char: "memphis"
    side: "right"
    text:
      - "Ситуация не внушает оптимизма, Командир..."
  - char: "commander"
    side: "left"
    text:
      - "Да... До того как произошло нападение, Империя Сардиния, будучи организатором, не смогла обеспечить раннее предупреждение."
      - "А после начала атаки Империя Сардиния так и не смогла организовать эффективное сопротивление."
      - "Из-за этого у фракций сейчас нет скоординированного командования, и каждая вынуждена сражаться сама за себя."
      - "Если так пойдет и дальше, нас разобьют поодиночке..."
  - char: "illustrious_rad"
    side: "right"
    text:
      - "Говорит Илластриес. От лица Королевского Флота и Свободного Ириса я обращаюсь ко всем фракциям, находящимся на выставке."
      - "Наш флот уже покинул павильоны и в данный момент собирается в акватории к юго-востоку от выставочной площади."
      - "Сейчас, как вы все можете видеть, могущественный враг неизвестного происхождения обрушился с небес и разрывает нашу линию обороны."
      - "Поэтому мы планируем прорваться с территории выставки и направиться к крепости на Мальте для подготовки к дальнейшим боевым действиям."
      - "Я призываю все фракции отбросить разногласия и объединить усилия перед лицом надвигающегося кризиса."
      - "Наш флот отбывает через час. Надеюсь, вы присоединитесь к нам, чтобы вместе отправиться на Мальту и собрать силы воедино."
      - "Если же у вас сейчас иные планы, знайте: на время этой операции крепость Мальты будет открыта для всех фракций."
      - "Вы сможете свободно прибыть туда, как только сочтете нужным."
      - "Повторяю..."
  - char: "commander"
    side: "left"
    text:
      - "(……Значит, Королевский Флот и Свободный Ирис планируют собрать силы и отступить на Мальту.)"
      - "(Наконец-то хоть кто-то из фракций начал действовать, вот только...)"
  - char: "shangri_la"
    side: "right"
    text:
      - "Командир, с нами связалась Илластриес из Королевского Флота. Она надеется, что ты возглавишь флот Союза Орла и откликнешься на её призыв."
      - "И отправишься вместе с объединенным флотом Королевского Флота и Свободного Ириса к крепости на Мальте."
      - "Что нам ответить?"
  - char: "commander"
    side: "left"
    text:
      - "В целом, идея собрать все силы воедино — правильная."
      - "Вот только... в условиях такой неопределенности поспешное отступление вряд ли будет лучшим решением, чем глухая оборона."
      - "Отправь приказ флотам Королевского Флота и Свободного Ириса. Потребуй от них изменить планы и прибыть в павильон Союза Орла."
      - "В то же время обеспечьте их маневры прикрытием с воздуха."
  - char: "shangri_la"
    side: "right"
    text:
      - "Слушаюсь."
  - char: "suruga"
    side: "left"
    text:
      - "Командир Лазурного пути, мы восстановили связь с госпожой Синано."
      - "Она сказала... что хочет поговорить с тобой лично."
  - text:
      - "Суруга с легким недоумением протягивает мне коммуникатор."
      - "Оно и неудивительно... в конце концов, обстоятельства нашего знакомства с Синано были слишком уж необычными, чтобы их можно было легко объяснить."
  - char: "shinano_rad"
    side: "right"
    text:
      - "Я вижу, ты цел и невредим."

chapter15:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Как обстановка в павильоне Империи Сакуры?"
  - char: "shinano_rad"
    side: "right"
    text:
      - "Пока держимся."

chapter16:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Ты в порядке?"
  - char: "shinano_rad"
    side: "right"
    text:
      - "Благодарю за заботу, я тоже цела и невредима."

chapter17:
  rows:
  - char: "shinano_rad"
    side: "right"
    text:
      - "Проснувшись, я провела кое-какие приготовления в павильоне, так что, по крайней мере, нас не застали врасплох."
      - "Однако повсюду снуют эти механизмы, они разделили выставочную площадь на части. Хотя я и хотела бы воссоединиться с тобой, пока что нам остается лишь удерживать оборону в павильоне."
      - "К счастью... моя сила по неизвестной причине значительно возросла, так что в данный момент ситуация на поле боя стабилизировалась."
      - "Возможно... это потому, что наши намерения были раскрыты."
      - "И тогда тот, кто стоит за всем этим, сам разорвал иллюзию фальшивого мира и обнажил свои клыки."
      - "Каковы твои дальнейшие планы?"
  - text:
      - "Я передаю Синано свою идею: пусть все фракции приведут свои флоты в павильон Союза Орла, чтобы мы могли сражаться вместе."
  - char: "shinano_rad"
    side: "right"
    text:
      - "Хм... Объединить силы — и впрямь хороший выбор."
  - char: "communicator"
    side: "left"
    text:
      - "Погодите-ка... Если уж собирать флоты, у меня есть куда более подходящее место на примете~"
  - char: "memphis"
    side: "right"
    text:
      - "...Нашу линию связи взломали?!"
      - "Кто это говорит?!"
  - char: "prinz_eugen_rad"
    side: "left"
    text:
      - "Ах, простите-простите. Всё произошло так внезапно, что я забыла снять маскировку. Это Принц Ойген из Железной Крови."
      - "Я всё это время слушала ваши переговоры."
      - "Железная Кровь одобряет вашу общую стратегию собрать все боевые силы в одном павильоне."
      - "По сравнению с тем, чтобы сражаться поодиночке или безрассудно идти на прорыв, собрать силы и разобраться в ситуации — это лучший выбор."
      - "Однако насчет точки сбора у меня есть вариант получше — Большой собор Доминиона Виши."
      - "Знаете ли вы, что они установили в своем павильоне полноценную систему защиты «Стена Авроры»?"
      - "Хотя изначально она предназначалась лишь для демонстрации, на поле боя она станет для нас самым надежным щитом."
      - "Ваше убежище в павильоне Союза Орла находится под землей. Хоть оно и крепкое, но там слишком тесно, и оно совершенно не подходит для вылазок флота."
      - "Другое дело павильон Доминиона Виши, расположенный на берегу: он просторный, защищенный, и оттуда легко переходить в наступление."
  - char: "kersaint_rad"
    side: "right"
    text:
      - "Да, прямо сейчас «Стена Авроры» вокруг собора уже активирована."
      - "Большой собор Виши приветствует всех вас. Давайте сражаться плечом к плечу и вместе преодолеем этот кризис."
  - char: "prinz_eugen_rad"
    side: "left"
    text:
      - "Лично я считаю, что на данный момент это наш лучший выбор. Что скажете, представители Союза Орла?"
  - char: "commander"
    side: "right"
    text:
      - "Мне кажется, для начала тебе стоило бы объяснить, как ты вклинилась в нашу связь..."
  - char: "prinz_eugen_rad"
    side: "left"
    text:
      - "А? Я просто, по нашей старой привычке, нашла способ прослушивать связь всех павильонов на выставке."
      - "Вы ведь все занимаетесь тем же самым, не так ли?"
      - "Просто наше оборудование немного лучше, и оно пока еще не вышло из строя."
      - "Ой, да не обращайте внимания на эти мелочи. Что насчет самого плана?"
  - char: "commander"
    side: "right"
    text:
      - "Если исходить исключительно из расположения и оснащения, Большой собор Доминиона Виши действительно является оптимальным вариантом для точки сбора на данный момент."
      - "Вот только..."
  - char: "essex"
    side: "left"
    text:
      - "Ты — Командир, мы доверяем тебе и полагаемся на твое решение."
  - char: "shangri_la"
    side: "right"
    text:
      - "Да, изначальной целью выставки была демонстрация мира, так что нет ничего плохого в том, чтобы сражаться вместе."
  - char: "memphis"
    side: "left"
    text:
      - "У меня, разумеется, тоже нет возражений."
  - char: "commander"
    side: "right"
    text:
      - "Раз так — Лазурный путь принимает этот план."
      - "И еще кое-что. Раз уж оборудование Железной Крови для прослушки работает нормально, ты знаешь, как обстоят дела у остальных фракций?"
  - char: "prinz_eugen_rad"
    side: "left"
    text:
      - "Знаю, конечно знаю~"
      - "Империя Сардиния в данный момент упорно защищает свои павильоны, не имеющие никаких оборонительных систем."
      - "Боже мой... Я уже не могла на это спокойно смотреть и отправила им подмогу. Я сама приведу их флот к месту сбора."
      - "Что касается Северного Парламента, то их флот после ухода с территории выставки изначально направился к позициям Королевского Флота, видимо, планируя откликнуться на призыв Илластриес."
      - "Но после того, как ты приказал Королевскому Флоту направиться к павильону Союза Орла, их флот тоже развернулся и направился к тебе."
      - "Они должны прибыть с минуты на минуту. Вы ведь дождетесь их, чтобы прийти всем вместе?"
      - "Что до Империи Дракона... Их павильон опустел еще пару дней назад."
      - "Должна признать, этой мисс Чэнь Хай просто невероятно повезло избежать всей этой катастрофы..."
      - "Это всё, что мне известно."
  - char: "commander"
    side: "right"
    text:
      - "Спасибо за информацию."
      - "Синано, тогда меняем план. Бери своих людей и направляйтесь прямиком в павильон Доминиона Виши."
  - char: "shinano_rad"
    side: "left"
    text:
      - "Поняла. Командир, я пока доверяю Суругу и Симакадзе твоей заботе."
  - char: "commander"
    side: "right"
    text:
      - "Хорошо. Будьте осторожны в пути. Встретимся в Большом соборе Виши."
  - char: "essex"
    side: "left"
    text:
      - "Командир, получен сигнал от флота Северного Парламента, соединяю."
  - char: "avrora_rad"
    side: "right"
    text:
      - "Товарищ Командир, как же хорошо видеть, что ты цел и невредим."
      - "Хотя нам и не удалось сразу же восстановить связь с павильоном Союза Орла, мы смогли связаться с Королевским Флотом."
      - "Мы уже в курсе текущей ситуации. В этом инциденте флот Северного Парламента полностью поступает в твое распоряжение."
      - "Однако, если позволишь сказать прямо, мы считаем, что павильон Союза Орла — не самое идеальное место для сбора."
      - "Сейчас выставочная площадь окружена, и каждая фракция сражается сама за себя."
      - "Я считаю, что мы должны отбросить межфракционные предрассудки и объединить все силы, чтобы справиться с этим кризисом."
      - "Поэтому..."
  - char: "commander"
    side: "left"
    text:
      - "Большой собор Доминиона Виши — это оптимальный выбор, верно?"
  - char: "avrora_rad"
    side: "right"
    text:
      - "Верно, как и ожидалось от товарища Командира."
  - char: "commander"
    side: "left"
    text:
      - "На самом деле, у Багровой Оси возникла та же мысль."
      - "Мы только что закончили переговоры с Железной Кровью, Доминионом Виши и остальными. Как только мы соберем все силы здесь, в павильоне Союза Орла, мы вместе отправимся к Большому собору Виши."
  - char: "avrora_rad"
    side: "right"
    text:
      - "Флот Северного Парламента понял, до скорой встречи."
  - char: "commander"
    side: "left"
    text:
      - "Связь с Северным Парламентом установлена, теперь очередь Королевского Флота и Свободного Ириса..."

chapter18:
  rows:
  - char: "illustrious_rad"
    side: "left"
    text:
      - "Командир, мы уже в курсе ситуации. Учитывая текущее положение дел, мы поддерживаем принятое тобой решение."
  - char: "jeanne_d_arc_rad"
    side: "right"
    text:
      - "Да, Свободный Ирис также согласен с твоим планом."

chapter19:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Фух... Вот так, наконец-то удалось связаться со всеми фракциями."
  - char: "shimakaze"
    side: "right"
    text:
      - "Как здорово... Еще минуту назад была полная неразбериха, а теперь всё идет так упорядоченно!"
      - "Так вот на что способен Командир Лазурного пути!"
  - char: "suruga"
    side: "left"
    text:
      - "Кхм..."
  - char: "shimakaze"
    side: "right"
    text:
      - "Ва-а-а, прошу прощения за то, что так внезапно вмешалась!"
  - char: "commander"
    side: "left"
    text:
      - "Ничего страшного, но в одном ты ошиблась."
      - "У нас нет полного порядка, просто появилось немного больше ясности."
      - "В этом нападении всё еще кроется множество неразгаданных тайн."
      - "И только когда флоты всех фракций объединятся в павильоне Виши, нам предстоит по-настоящему столкнуться с трудностями."
  - char: "alfredo_oriani"
    side: "right"
    text:
      - "Верно подмечено, как и ожидалось от нашего знаменитого Командира~"
  - text:
      - "Щелк! *звук затвора камеры*"
  - char: "alfredo_oriani"
    side: "right"
    text:
      - "«Командир, стремящийся объединить фракции в условиях кризиса» — пожалуй, именно так я и назову эту фотографию~"
