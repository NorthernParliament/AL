chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "shimakaze"
    side: "left"
    text:
      - "Ува-а-а-а-а! К-как близко... Госпожа Суруга, ты в порядке?!"
  - char: "suruga"
    side: "right"
    text:
      - "...Едва успела увернуться в последний момент."
      - "Что это за штуковина... откуда она вообще взялась?"
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "А-а-а-а-а-а-а! Павильон культуры... Павильон культуры разрушен!!!!!"
  - char: "shimakaze"
    side: "right"
    text:
      - "Пожалуйста, успокойся, Альфредо!"
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Д-да, точно, нужно взять себя в руки!"
  - text:
      - "Щёлк! *звук затвора камеры*"
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Хоть я и понятия не имею, что происходит, я просто обязана запечатлеть момент катастрофы!"
      - "...Дорогие гостьи, бегите скорее, а я здесь со всем разберусь!"
  - char: "shimakaze"
    side: "right"
    text:
      - "Нет, я тоже останусь! У двоих больше шансов, чем у одной!"
      - "Госпожа Суруга, скорее возвращайся и защити госпожу Синано! А мы разберемся здесь!"
  - char: "suruga"
    side: "left"
    text:
      - "……С чем вы там разберетесь, две мелкие дурёхи!"
  - text:
      - "То ли разозлившись, то ли рассмеявшись, Суруга сгребла Симакадзе и Альфредо в охапку, зажав по одной под каждой мышкой, и со всех ног рванула прочь."

chapter2:
  rows:
  - text:
      - "В следующее мгновение гигантская механическая нога рухнула с небес, подняв в воздух густую завесу пыли."
      - "Тем временем..."
  - char: "memphis"
    side: "left"
    text:
      - "Командир, почему ты остановился?"
  - char: "commander"
    side: "right"
    text:
      - "Нужно помочь этим отступающим кансен."
  - char: "memphis"
    side: "left"
    text:
      - "...Раз ты так решил, я поняла."
      - "Хелена, передай Эссекс координаты для бомбардировки."
      - "А затем..."
      - "Эй, вы трое! Скорее сюда, мы вас прикроем!"
  - text:
      - "БАБАХ!!!"
  - char: "shimakaze"
    side: "left"
    text:
      - "О-о! Огромное спасибо!"
      - "Госпожа Суруга, Альфредо, к нам прибыло подкрепление!"
  - char: "suruga"
    side: "right"
    text:
      - "Ты же... Мемфис из Союза Орла?"
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Вместе мы сильнее! Давайте пока держаться вместе с ними!"
  - char: "suruga"
    side: "right"
    text:
      - "...Да, сейчас не до раздумий, главное — вырваться из этой передряги."
