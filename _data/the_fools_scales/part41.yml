chapter1:
  rows:
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мемфис, подожди! Ты уже возвращаешься?"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Да. Исчезновение Иерофант подтверждено, я здесь больше не нужна."
      - "Большое спасибо, что откликнулась на призыв Командира и пришла на помощь в бою."
      - "Похоже, даже в рядах «Пепла» есть благоразумные люди..."
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ты... правда меня не помнишь?"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Хм? Я никогда не состояла в «Пепле», поэтому мы действительно не встречались."
      - "Ты случайно не перепутала меня с кем-то другим?"
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Вопрос первый: Командир кажется тебе знакомым, и ты чувствуешь к нему некую близость?"
      - "Или, точнее говоря, ты уверена, что Командир — это кто-то из твоих давних знакомых, верно?"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Эта информация засекречена, я не могу её разглашать."
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "А ты не задумывалась, почему ты в этом так уверена?"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "...Я не совсем понимаю, о чем ты."
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Ладно-ладно~ Тогда вопрос второй: ты знаешь Анзил и Аосте, так ведь?"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "...Эта информация засекречена, я не могу её разглашать."
      - "Я по-прежнему не понимаю цели твоих вопросов и не хочу продолжать этот разговор."
      - "Прошу меня извинить."
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Подожди, последний вопрос! На самом деле, он же и самый первый."
      - "Вспомни как следует. Ты... правда меня не помнишь?"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Я..."
  - char: "helena_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Мемфис, что-то случилось?"
      - "Твои показатели немного скачут, с тобой всё хорошо?"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Я в порядке. Просто..."
      - "Мне тут задали пару вопросов... Ничего страшного, я уже со всем разобралась."
  - char: "helena_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Хирю, а тебе разве не нужно выполнять задание, порученное «Пеплом»?"
  - char: "hiryuu_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Уже иду... уже иду. Ну, не буду вам мешать? До встречи, мисс Мемфис~"
  - char: "memphis_meta"
    side: "left"
    status: "is-purple"
    text:
      - "Да... счастливого пути."
      - "Хелена, подожди немного, я в порядке и уже возвращаюсь..."
