chapter1:
  rows:
  - text:
      - "Спустя некоторое время, после ожесточенного боя флоты всех фракций наконец-то отступили внутрь павильона Виши."
  - char: "foch"
    side: "left"
    text:
      - "Все внутри! Жоффр!"
  - char: "joffre"
    side: "right"
    text:
      - "Перезапускаю «Стену Авроры» на восточной стороне! Максимальная мощность!"
  - char: "l_indomptable"
    side: "left"
    text:
      - "Нас атакуют! Приготовиться к удару!"
  - text:
      - "БАБАХ!!!"
      - "Гигантская механическая нога одного из Наблюдателей с силой врезалась в «Стену Авроры», заставив барьер исказиться так, что это было видно невооруженным глазом."
      - "Однако затем Наблюдатель, не встретив ответного удара, просто развернулся и ушел."
      - "Увидев, что «Стена Авроры» успешно выдержала атаку, все наконец-то облегченно выдохнули."
  - char: "kersaint"
    side: "left"
    text:
      - "Не беспокойтесь, «Стена Авроры» без проблем выдержит атаку подобного уровня."
      - "К тому же, посмотрите, Наблюдатель ушел, как и в прошлый раз."
      - "Мы уже выявили эту закономерность: если его не атаковать, он не станет концентрироваться на вашем уничтожении."
  - char: "suffren"
    side: "right"
    text:
      - "У них нет цели прорвать оборону, они просто рыщут повсюду в поисках того, что можно сломать, и сеют хаос..."
      - "Совершенно непонятны боевые намерения этих штуковин..."
  - char: "guichen"
    side: "left"
    text:
      - "Наблюдатель или Дирой — так часто называют роботов в научно-фантастических произведениях. Весьма подходящее имечко."
  - char: "kersaint"
    side: "right"
    text:
      - "Пожалуйста, будьте спокойны. Даже если атака будет в пять раз сильнее предыдущей, «Стена Авроры» сможет ее выдержать."
      - "Прошу всех следовать за мной в павильон, остальные уже ждут внутри."

chapter2:
  rows:
  - text:
      - "Следуя за Керсен, я вошел в один из конференц-залов павильона."
      - "Оглядевшись, я увидел, что Витторио Венето из Империи Сардиния, Принц Ойген из Железной Крови, Синано из Империи Сакуры и многие другие уже заняли свои места."
      - "Хоть мы и находились в самом центре кризиса, тот факт, что представители всех фракций собрались в одном зале, парадоксальным образом создавал атмосферу церемонии закрытия."
  - char: "shinano"
    side: "left"
    text:
      - "Командир. *Слегка кивает*"
  - char: "prinz_eugen"
    side: "right"
    text:
      - "О, лучше один раз увидеть, чем сто раз услышать."
      - "Кажется, мы впервые встречаемся так близко, лицом к лицу, Командир~"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Я — Витторио Венето из Империи Сардиния."
      - "Не думала, что наша встреча пройдет при таких обстоятельствах... Командир Лазурного пути."
  - text:
      - "Сразу после того как я вошел, стоявшая неподалеку Синано поприветствовала меня легким кивком."
      - "А затем ко мне навстречу вышли пребывающая в приподнятом (?) настроении Принц Ойген и выглядящая совершенно подавленной Венето."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Изначально мы пригласили тебя, чтобы насладиться праздником в честь закрытия выставки, и я представить не могла, что ты окажешься в такой опасности."
      - "Это упущение Империи Сардиния... Я глубоко виню себя за это."
  - char: "prinz_eugen"
    side: "right"
    text:
      - "Ну полно, полно, Венето, смотри на вещи проще~"
      - "Что случилось, то случилось, слезами горю не поможешь. Лучше подумай о том, какую выгоду мы сможем извлечь из сложившейся ситуации."
      - "Ты только посмотри, эти гигантские механизмы просто великолепны... Если мы воспользуемся случаем и изучим их, возможно, в будущем сможем производить такие же..."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "...Тебе легко говорить, а мне еще предстоит нести ответственность за весь этот кошмар..."
      - "Вне всяких сомнений... это целенаправленная война против Империи Сардиния."
      - "..Нам нужно немедленно мобилизовать все вооруженные силы Империи."
  - char: "bolzano"
    side: "right"
    text:
      - "При условии, что мы сможем связаться хоть с какими-то вооруженными силами Империи... госпожа Венето."
      - "Не только Александрия и Таранто, даже Рим перестал выходить на связь."
      - "...Боюсь, что вся Империя сейчас увязла в подобных тяжелых боях."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Проклятье..."
  - char: "illustrious"
    side: "right"
    text:
      - "Прошу прощения, что вмешиваюсь."
      - "Хоть Империя Сардиния в этом нападении тоже является жертвой..."
      - "Тем не менее, я надеюсь, что вы сможете поделиться хоть какой-нибудь информацией об этом инциденте."
      - "Сирены провели столь масштабную подготовку к войне прямо на территории Империи Сардиния... прямо у вас под носом. Неужели вы и правда ничего не заметили?"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "…………"
  - char: "prinz_eugen"
    side: "right"
    text:
      - "Эй, погодите-ка, неправильная постановка вопроса. Еще неизвестно, Сирены ли это вообще."
      - "Кто-нибудь из вас до сегодняшнего дня видел настолько необычных врагов?"
  - char: "illustrious"
    side: "left"
    text:
      - "И то верно... Прошу прощения, я сделала поспешные выводы."
  - char: "commander"
    side: "right"
    text:
      - "Ойген права."
      - "Враги, напавшие на нас в этот раз, настолько необычны, что с первого взгляда нельзя со стопроцентной уверенностью сказать, что это дело рук Сирен."
      - "Даже при том, что кроме Сирен трудно найти кого-то еще, кто мог бы попасть под подозрения..."

chapter3:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "По пути из павильона Союза Орла я заметил, что территория выставки изменилась до неузнаваемости по сравнению с тем, как она выглядела в самом начале атаки."
      - "Спустившиеся повсюду Наблюдатели непрерывно распыляют в воздух какую-то странную субстанцию."
      - "Как только эта субстанция оседает на землю, она начинает разрастаться и распространяться."
      - "Постепенно поглощая здания, деревья и даже сами острова."

chapter4:
  rows:
  - char: "joffre_rad"
    side: "left"
    text:
      - "Прошу прощения, что прерываю ваше собрание."
      - "Боюсь, я принесла еще более дурные вести."
      - "Разведывательные самолеты со всех направлений передают одно и то же."
      - "Всё больше Наблюдателей спускается с небес по всему Средиземному морю."
      - "А эта аномальная разрастающаяся субстанция распространяется вслед за появлением Наблюдателей по всему средиземноморскому региону."
      - "И... значительная часть территории Империи Сардиния, расположенной ближе всего к выставке, уже полностью ею покрыта."
      - "Поэтому то, что госпожа Венето не может связаться с родиной... вполне закономерно."
      - "В то же время с облаками в небе, кажется, тоже творится что-то неладное."
      - "Одна эскадрилья палубных самолетов во время разведки вошла в облака, и после этого связь с ними полностью прервалась."
      - "Я попросила остальных тоже проверить, но результат оказался в точности таким же. Все самолеты, влетевшие в облака, были уничтожены каким-то аномальным образом."
  - char: "hakuryuu_rad"
    side: "right"
    text:
      - "Да, Жоффр дело говорит! Я сама проверила, и мои самолеты, стоило им влететь в облака, были просто проглочены!"
      - "Словно эти облака превратились в какое-то живое существо!"
  - char: "shangri_la_rad"
    side: "left"
    text:
      - "Хм... Хоть это и противоречит науке, но у меня такое же ощущение."
      - "Наши палубные самолеты уничтожает не что-то, скрывающееся в облаках, а сами облака."
      - "Облака стали нашими врагами."
  - char: "essex"
    side: "right"
    text:
      - "Шангри-Ла, звучит фантастично."
      - "Облака... стали нашими врагами?"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Эта аномальная белая субстанция распространяется по всей территории страны?"
      - "Как такое... как такой абсурд вообще возможен..."
  - char: "suffren"
    side: "right"
    text:
      - "Гишен, значит ли это, что наша родина тоже..."
  - char: "guichen"
    side: "left"
    text:
      - "Как же так..."
      - "Неужели это Зеркальное море..."
      - "Аномалии на море, суше и в воздухе действительно похожи на свойства Зеркальных морей."
      - "Но чтобы такие масштабы? Зеркальное море, накрывшее весь средиземноморский регион?"
      - "Существование чего-то настолько невероятного просто невозможно..."
  - char: "shinano"
    side: "right"
    text:
      - "Словно ночной кошмар, воплотившийся в реальности..."
      - "...Хм? Кошмар... Почему мне это кажется таким знакомым..."

chapter5:
  rows:
  - text:
      - "«...Всё это тщетно.»"
  - char: "nop_x1"
    side: "right"
    status: "is-lightgray"
    text:
      - "▊▇ ▊▇ ▊▇ ▊▇ ▊▇ ▊▇ ▊▎▇ ▊▇ ▊ ▊▇ ▊ ▊▇ ▊▊▊ ▊▇ ▊▇ ▊▇"

chapter6:
  rows:
  - char: "shinano"
    side: "left"
    text:
      - "Нет... Это совершенно невозможно."
      - "Как подобное зло могло явиться в этот мир..."
  - text:
      - "Несомненно, череда непрекращающихся аномалий повергла всех присутствующих в зале в смятение."
      - "А затем, атмосфера начала постепенно сменяться паникой."
  - char: "communicator"
    side: "right"
    status: "is-yellow"
    text:
      - "А-ха-ха-ха-ха-ха-ха..."
      - "Какое же поистине грандиозное зрелище..."
  - char: "memphis"
    side: "left"
    text:
      - "Опять.."
      - "Кто на этот раз взломал нашу линию связи?!"
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Погодите, этот голос..."
      - "Марко Поло?!"
  - char: "joffre_rad"
    side: "left"
    text:
      - "Верно... Прямо сейчас снаружи кое-что происходит."
      - "Думаю, вам всем лучше выйти и увидеть это своими глазами."

chapter7:
  rows:
  - text:
      - "Все выходят наружу, за стены павильона Доминиона Виши."
      - "Снаружи «Стены Авроры», под золотым небом, парит роскошный трон."
      - "Белоснежные крылья обвивают его основание, состоящее из сложных механизмов."
      - "В спинку из чистого золота инкрустирован оранжевый драгоценный камень, похожий на глаз."
      - "А на троне восседает та, кого мы все прекрасно знаем."

chapter8:
  rows:
  - char: "marco_polo"
    side: "right"
    status: "is-yellow"
    text:
      - "Доброе утро, глупые смертные."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Поло...? Это и правда ты? Что всё это значит?"
  - char: "marco_polo"
    side: "right"
    status: "is-yellow"
    text:
      - "Разве текущее положение вещей не очевидно?"
      - "«Царство Божье» уже накрыло небеса и океаны, к которым вы так привыкли."
      - "Он вот-вот снизойдет в этот заурядный мир, а я, как Его посланница, обрела высшую власть."
      - "Так что отныне, пожалуйста, обращайтесь ко мне не иначе как — благороднейшая госпожа Марко Поло!"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Ты... совсем спятила. Что за бред ты несешь?"
      - "Территория выставки — это важная дипломатическая площадка, как ты смеешь творить здесь этот беспредел!"
      - "Неужели ты не понимаешь, сколько ресурсов вложила Империя ради этого шанса на наше возрождение?"
      - "Я приказываю тебе немедленно прекратить все разрушительные действия!"
  - char: "marco_polo"
    side: "right"
    status: "is-yellow"
    text:
      - "Возрождение Империи?"
      - "Я не считаю, что детские игры смертных государств могут принести какое-то там «возрождение»."
      - "И какие еще разрушительные действия? Это тщательно спланированное великое спасение!"
      - "Вечный мир и единство уже были достигнуты."
      - "Изначально все уже разделили эту славу, купаясь в вечном блаженстве."
      - "Но, к сожалению, из-за излишней проницательности некоторых из вас, в вечном раю возникли нежелательные помехи."
      - "Поэтому, для начала, я заставлю всех вас склониться передо мной прямо здесь и сейчас!"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Ты и впрямь обезумела... Марко Поло, я предупреждаю тебя в последний раз."
      - "Твои действия — это предательство родины и объявление войны всем фракциям."
  - char: "marco_polo"
    side: "right"
    status: "is-yellow"
    text:
      - "Вот как? Меня это не волнует."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Ты... Керсен, открой «Стену Авроры», я выйду и лично уничтожу эту предательницу!"

chapter9:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "Успокойся, Венето. Оцени реальную обстановку вокруг."
      - "Если всё это действительно дело рук Марко Поло, то она и впрямь обрела силу, намного превосходящую нашу."
      - "Как лидеру, тебе следует всегда сохранять хладнокровие и не позволять эмоциям брать над собой верх."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Ты прав, Командир Лазурного пути, я потеряла самообладание..."


chapter10:
  rows:
  - char: "commander"
    side: "right"
    text:
      - "(Я лучше промолчу)"
  - char: "prinz_eugen"
    side: "left"
    text:
      - "Воу-воу, Венето, успокойся, остынь!"
      - "Хоть мне и не хочется этого признавать, но ты только посмотри вокруг."
      - "Если всё это действительно сотворила Марко Поло, то она определенно обладает силой, намного превосходящей нашу!"
      - "В такой ситуации впору прятаться, а ты собираешься сама выйти и сразиться с ней!"
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Проклятье..."

chapter11:
  rows:
  - char: "guichen"
    side: "left"
    text:
      - "Жанна, ты заметила, что надето на голове у Марко Поло?"
  - char: "jeanne_d_arc"
    side: "right"
    text:
      - "Это ведь... Корона Святого Престола?"
      - "...Сомнений нет, это она."
      - "Как Корона Святого Престола... оказалась в руках Марко Поло?"
  - char: "joffre"
    side: "left"
    text:
      - "Выходит... Марко Поло похитила Корону Святого Престола...?"
      - "Тогда... что случилось с Марсельезой?!"
      - "Эй, Марко Поло, что ты сделала с Марсельезой?!"

chapter12:
  rows:
  - char: "marco_polo"
    side: "right"
    status: "is-yellow"
    text:
      - "А-ха-ха-ха-ха-ха-ха..."
      - "Корона Святого Престола просто вернулась к своему истинному владельцу."
      - "Я, великая госпожа Марко Поло, наместница Бога на земле, — вот кто поистине достоин носить Корону Святого Престола."
      - "И вам следует счесть это за великую честь, как и самой короне."
      - "Не волнуйтесь, всё скоро завершится."
      - "Вскоре дети Божьи станут единой семьей."
      - "И будут вечно жить в идеальной утопии, свободной от войн и раздоров."
      - "Я знаю, у вас всё еще много вопросов."
      - "Однако великое дело уже свершилось."
      - "Вам нет нужды ничего знать, а мне нет нужды отвечать."
      - "Теперь остается лишь дождаться, когда весь этот назойливый шум сольется в единый хор восхваления..."
      - "«И тогда Он снизойдет»."
      - "А-ха-ха-ха!"
  - text:
      - "Под гневными и ошеломленными взглядами присутствующих Марко Поло лишь продолжала нагло и безудержно хохотать."
      - "А затем, бросив эти загадочные слова, она, словно потеряв всякий интерес, развернула трон и умчалась вдаль."
      - "И под золотыми небесами осталась лишь бескрайняя белизна..."
