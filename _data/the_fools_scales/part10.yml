chapter1:
  rows:
  - text:
      - "Звук сирены воздушной тревоги раздавался вокруг."
  - char: "york"
    side: "left"
    text:
      - "Внимание неопознанному боевому кораблю. Вы входите в нашу охраняемую зону. Пожалуйста, назовите себя."
      - "Повторяю, внимание неопознанному боевому кораблю..."
      - "Они не отвечают, госпожа Уорспайт."
      - "Однако они не демонстрируют враждебных намерений, просто молча приближаются к нам. Продолжать попытки связаться?"
  - char: "warspite"
    side: "right"
    text:
      - "Продолжай вызывать, первыми не атаковать. Для начала нам нужно больше времени, чтобы... разобраться в ситуации."
  - char: "york"
    side: "left"
    text:
      - "Слушаюсь."
  - char: "london"
    side: "right"
    text:
      - "Госпожа Уорспайт, группа невероятно высоких механических созданий высадилась на Пиренейском полуострове и в прилегающих водах."
      - "Трудно описать, насколько они огромны, ведь эти механизмы, судя по всему, способны передвигаться по мелководью на собственных ногах..."
  - char: "warspite"
    side: "left"
    text:
      - "Да... я вижу."
      - "Что насчет конкретных разведданных о них?"
  - char: "london"
    side: "right"
    text:
      - "Ничего не известно. Они не похожи ни на одно из орудий, которые когда-либо использовали Сирены, и не похоже, что какая-либо другая фракция способна создать нечто подобное..."
  - char: "warspite"
    side: "left"
    text:
      - "Понятно... А что со связью с остальными?"
  - char: "london"
    side: "right"
    text:
      - "В эфире полный хаос."
      - "Нам удалось ненадолго восстановить связь с крепостью на Мальте. Мы узнали, что они столкнулись с той же проблемой, но затем связь оборвалась."
      - "Связь с выставочной площадью и родиной восстановить так и не удалось."
      - "К тому же, мы, похоже, оказались заперты в Средиземном море."
      - "Место соединения Гибралтарского пролива с Атлантикой сейчас затянуто густым морским туманом."
      - "Этот туман стоит словно стена, простираясь от самой поверхности воды высоко в небо."
      - "Как надводные разведывательные катера, так и подводные лодки, вошедшие туда, перестали выходить на связь."
      - "Разведывательные самолеты, попытавшиеся пролететь сквозь туман, тоже пропали со связи, как только влетели в облака."
  - char: "suffolk"
    side: "left"
    text:
      - "Облака... они не такие, как обычно... стали очень опасными, словно жуткие монстры."
  - char: "london"
    side: "right"
    text:
      - "...Кому, как не Саффолк, лучше всего знать об облаках. И раз уж такое действительно произошло, я считаю, нам и правда стоит быть предельно осторожными."
  - char: "warspite"
    side: "left"
    text:
      - "Как бы невероятно это ни звучало, происходящее не оставляет мне выбора, кроме как поверить."
      - "В конце концов, эта белая субстанция, разрастающаяся по суше, уже подбирается к внешним стенам крепости..."
      - "Йорк, от того флота всё еще нет ответа?"
  - char: "york"
    side: "right"
    text:
      - "Да, по-прежнему никакой реакции."
  - char: "warspite"
    side: "left"
    text:
      - "...Значит, это враги."

chapter2:
  rows:
  - char: "warspite_kai"
    side: "left"
    text:
      - "Не буду повторять дважды: Ее Величество ждет, что мы с честью выполним свой долг."
      - "Опираясь на оборонительные сооружения крепости — к бою! Уничтожить захватчиков!"
