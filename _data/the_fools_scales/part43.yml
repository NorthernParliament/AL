chapter1:
  rows:
  - char: "littorio"
    side: "left"
    text:
      - "Реальность, подчиненная ложному богу, так и не воплотилась в жизнь, а хаос незаметно растворился без следа."
      - "Все фракции единогласно решили квалифицировать этот инцидент как нерациональные и самовольные действия Марко Поло, совершенные под влиянием Арбитров."
      - "Наша родина в безопасности, а заново проведенная церемония закрытия выставки успешно завершилась."
      - "В общем и целом, можно сказать, что всё закончилось благополучно, не так ли?"
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Поистине... мы висели на волоске."
      - "Еще бы чуть-чуть, и все наши многолетние труды пошли бы прахом."
      - "Эта Марко Поло, воистину..."
  - char: "impero_rad"
    side: "left"
    text:
      - "Венето, поиски по-прежнему не принесли никаких результатов."
  - char: "roma_rad"
    side: "right"
    text:
      - "...Прошло уже столько дней. Если бы мы могли её найти, то давно бы уже это сделали, так ведь?"
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Да... пожалуй, пора сворачивать поиски."
      - "Проведем еще один, последний заход, и отправляемся домой."
  - char: "impero_rad"
    side: "right"
    text:
      - "Есть..."
  - text:
      - "Завершив сеанс связи, Венето тяжело вздохнула."
  - char: "littorio"
    side: "left"
    text:
      - "Ты переживаешь, что мы её не найдем, или о том, что делать, если мы её всё-таки найдем?"
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Я еще не решила... наверное, и то, и другое."
      - "...Может быть, я просто хочу поговорить с ней с глазу на глаз."
      - "Если бы мы уделяли ей больше внимания, возможно, до такого бы не дошло..."
  - char: "communicator"
    side: "left"
    text:
      - "*Бип!*"
  - char: "littorio"
    side: "right"
    text:
      - "Венето, тебя вызывают."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Это Клемансо..."
      - "...Это я, Венето. Что-то случилось?"
      - "..."
      - ".........?"
      - "........................"
      - "...Договорились, пусть будет так."
  - text:
      - "Венето прервала связь, а затем отдала приказ флоту Сардинии, который вел поиски в акватории."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Внимание всем. Я получила достоверную информацию, подтверждающую, что Марко Поло была затоплена."
      - "Оценив полученный ею урон, я пришла к выводу, что у нас нет никаких шансов на её подъем и восстановление."
      - "Поисковая операция объявляется закрытой. Вы все отлично потрудились."
  - text:
      - "Венето, словно сбросив тяжелый груз с плеч, отключила коммуникатор и начала готовиться к возвращению."
  - char: "littorio"
    side: "left"
    text:
      - "..Погоди-ка. Я же отчетливо расслышала слова вроде «без сознания» и «под защитой»?"
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "...Тебе не послышалось."
      - "Поэтому мы поступим именно так. Пусть вышеупомянутое заключение станет финалом официального отчета и навсегда поставит точку в этом деле."
