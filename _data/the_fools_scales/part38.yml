chapter1:
  rows:
  - text:
      - "Открыв глаза, я увидел перед собой полутемный зал."
      - "Планировка этого зала казалась... смутно знакомой."
  - char: "hierophant_x"
    side: "right"
    status: "is-lightgray"
    text:
      - "............"
  - text:
      - "Стоявшая в стороне Иерофант слегка приподняла свой скипетр."
      - "Но прежде чем она успела атаковать, из полумрака вдалеке донеслись два голоса, которые постепенно приближались."
      - "В зале... был кто-то еще?"
  - char: "hierophant_x"
    side: "right"
    status: "is-lightgray"
    text:
      - "............"
  - text:
      - "Иерофант опустила скипетр и повернула голову, вглядываясь вдаль."

chapter2:
  rows:
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "...Учитывая то, что ситуация на фронте с каждым днем всё больше заходит в тупик, я получил приказ ускорить разработку."
      - "В настоящее время производство нового поколения Антиоха уже перешло в практическую стадию."
      - "Я назвал их системой Арбитров, в надежде, что в будущем они станут силой, способной положить конец этой войне."
      - "Но сейчас... до нашей конечной цели еще очень далеко."
      - "Позволь мне торжественно представить тебе первую участницу системы Арбитров — носящую титул «Старшего аркана», Иерофант."
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "...Первую?"
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "Ну разумеется. Ты ведь не берешь в расчет Зеро?"
      - "Она в настоящее время является независимой единицей и не включена ни в одну из систем."
      - "Но вернемся к Иерофант. Будучи первой участницей системы Арбитров, она также несет на себе ответственность выступать в роли визитной карточки всего проекта."
      - "Поэтому при её проектировании я уделил особое внимание улучшению её коммуникативных навыков и способности вызывать симпатию."
      - "Установленная в ней модернизированная система интеллектуального анализа позволяет ей лучше понимать собеседника и вести диалог так, как это делал бы настоящий человек."
      - "В ходе всех проведенных тестов ни один человек не смог понять, что на самом деле общается с ИИ. На данный момент её смело можно назвать моим самым успешным творением."
      - "Разумеется, её улучшенные коммуникативные способности этим не ограничиваются."
      - "Помимо общения с людьми, эта система также способна понимать и имитировать нечеловеческие языки."
      - "В настоящее время мы уже добились успеха с кошками, собаками и дельфинами."
      - "Я уверен, что с последующими обновлениями и итерациями показатели Иерофант в области «коммуникации» станут еще более выдающимися."
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "Станет еще более выдающейся беловолосой красавицей?..."
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "Кхм... как я уже неоднократно подчеркивал..."
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "«Улучшения на основе зрелого и стабильного шаблона» так ведь?"
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "Именно так!"
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "Хорошо... тогда второй вопрос: почему ты начал с пятого номера, «Старших арканов»?"
      - "Ты не планируешь выпускать их по порядку?"
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "Я думал об этом. Но сейчас проект находится лишь на начальной стадии, и, честно говоря, я не уверен, сможем ли мы в итоге создать все номера."
      - "К тому же в таком деле очень нужно вдохновение, поэтому, взвесив все «за» и «против», я решил начать с Иерофант."
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "Карта Иерофант несет в себе значение богатства, общения и наставничества..."
      - "Редко увидишь, чтобы ты с таким энтузиазмом разрабатывал устройство не для боевых целей."
      - "Когда ты позвал меня сюда, я уж было подумала, что мне снова предстоит смотреть на какое-нибудь новое смертоносное оружие."
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "Раз уж даже ты так думаешь... это лишь доказывает необходимость существования Иерофант."
      - "Ты и сама знаешь нынешнюю ситуацию, ресурсы сейчас невероятно ценны."
      - "Существование Иерофант поможет разрушить стереотипы общественности относительно системы Антиох."
      - "Она будет крайне полезна как для участия в политическом посредничестве, так и в борьбе за ресурсы."
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "Так вот о чем ты думал."
      - "А ты не задумывался об одной возможности?"
      - "Если эти коммуникативные способности продолжат развиваться... возможно, однажды она сможет помочь нам наладить канал связи с X."
      - "Если мы сможем общаться, у нас появится вторая опция помимо сражений, не так ли?"
      - "Особенно... учитывая текущую обстановку на фронте."
  - char: "aoste_d"
    side: "left"
    status: "is-yellow"
    text:
      - "Эх..."
  - char: "anzeel_d"
    side: "right"
    status: "is-yellow"
    text:
      - "Что это у тебя за выражение лица такое..."
      - "Ассистент, а ты что думаешь?"
  - char: "commander"
    side: "left"
    text:
      - "(............Что я думаю?!)"
      - "(Разве это не просто... воспроизведение записи?)"
  - char: "hierophant_x"
    side: "right"
    status: "is-lightgray"
    text:
      - "............"
  - text:
      - "Стоявшая в стороне Иерофант тоже посмотрела на меня, словно ожидая ответа."


chapter3:
  rows:

  - char: "commander"
    side: "left"
    text:
      - "Думаю, Анзил права."
      - "Если мы сможем общаться с врагом, возможно, мы и впрямь сумеем найти иной выход, помимо сражений."
  - char: "anzeel"
    side: "right"
    text:
      - "Хе-хе~ Я так и знала, что ассистент думает так же, как и я."
  - text:
      - "Анзил вышла из темноты. Её силуэт постепенно расплывался, но голос по-прежнему звучал ясно."
  - char: "anzeel"
    side: "right"
    text:
      - "Иерофант, ты отлично потрудилась. Тебе понравилось проводить время с ассистентом?"
  - char: "hierophant_x"
    side: "left"
    status: "is-lightgray"
    text:
      - "............"
  - text:
      - "Иерофант ничего не ответила, но в её глазах, казалось, мелькнула искра света."

chapter4:
  rows:

  - char: "commander"
    side: "left"
    text:
      - "Думаю, Аосте прав."
      - "Если мы сможем общаться с врагом, то сможем лучше узнать его слабости, а значит, нам будет проще его уничтожить."
  - char: "aoste"
    side: "right"
    text:
      - "Верно, весьма рациональный взгляд."
      - "Если в будущем мы действительно найдем способ общаться с X, эту технологию также следует использовать в войне."
      - "Кровь за кровь... мы обязаны заставить их поплатиться."
  - text:
      - "Аосте вышел из темноты. Его силуэт постепенно расплывался, но голос по-прежнему звучал громко и отчетливо."
  - char: "aoste"
    side: "right"
    text:
      - "Иерофант, твоя миссия подошла к концу, тебе пора отдохнуть."
  - text:
      - "Иерофант не сопротивлялась, просто позволив коду деактивации оболочки запуститься и вступить в силу."

chapter5:
  rows:
  - text:
      - "В лучах света Анзил, Аосте, Иерофант и всё окружающее пространство рассеялись."
      - "Вдалеке появилась дверь."
      - "До боли знакомая дверь..."
      - "Кажется, пришло время уходить..."

chapter6:
  rows:
  - text:
      - "Перед глазами предстала территория выставки."
      - "Если точнее, территория выставки, окутанная безмятежным лунным светом."
      - "Небо и земля вернулись в норму. Царство бога — мир, порожденный безумными иллюзиями Марко Поло, — исчез без следа."
      - "Сейчас здесь было так тихо, словно в любую другую из множества обычных ночей, как будто ничего и не произошло."
      - "Однако тяжесть, которую я ощущал в руках, безмолвно свидетельствовала о том, что всё пережитое было реальностью."
      - "Святыня Ортодоксии Ирис — Корона Святого Престола — сейчас тихо покоилась в моих руках."
      - "Всё, что я увидел в последний момент, и внезапное исчезновение Иерофант... всё это как-то связано с Короной Святого Престола?"
      - "Я не мог сказать наверняка, да и веских доказательств для подобных выводов у меня не было."
      - "Однако шквал запросов на связь, одновременно обрушившийся на мой коммуникатор, недвусмысленно намекал: есть и другое, более насущное дело, требующее моего внимания."
      - "Не удивительно... как-никак, я внезапно исчез на довольно приличное время."
      - "Что же касается церемонии закрытия выставки... проведем её как полагается через пару дней."
