chapter1:
  rows:
  - char: "nelson_rad"
    side: "left"
    text:
      - "Всем шевелиться!"
      - "Проверьте радары, которые еще работают, и счистите с них эту липкую дрянь!"
      - "Все выключенные радары — запустить процедуру холодного старта! Быстрее, быстрее!!!"
      - "Арк Ройял, как обстановка в прибрежных водах?"
  - char: "ark_royal"
    side: "right"
    text:
      - "Пока что в нашу сторону никто не направляется, но... вот у Империи Сардиния дела совсем плохи."
      - "Ты выяснила состав этой белой субстанции?"
  - char: "nelson_rad"
    side: "left"
    text:
      - "Похоже на какой-то растущий грибок... Но в то же время она обладает некоторыми свойствами металла: не боится огня и очень прочная."
      - "Я уже почти отчаялась..."
  - char: "ark_royal"
    side: "right"
    text:
      - "Есть пострадавшие?!"
  - char: "nelson_rad"
    side: "left"
    text:
      - "Нет, успокойся, просто эта штука жутко мерзкая..."
      - "Родни вместе с Джанус, Джервис и Форчун сейчас как раз занимаются её уборкой."
  - char: "rodney_rad"
    side: "right"
    text:
      - "Хм~? Вы обо мне говорите?"
      - "На самом деле всё не так уж и плохо. Мы только что нашли одно «секретное оружие»."
  - char: "nelson_rad"
    side: "left"
    text:
      - "Секретное оружие?"
  - char: "rodney_rad"
    side: "right"
    text:
      - "Ага, освежающий шампунь-кондиционер, который мы до этого продавали на выставке."
      - "Из-за плохих продаж у нас скопилось много излишков, поэтому часть запасов переправили к нам."
      - "В итоге, кто бы мог подумать... он неожиданно оказался весьма полезен для выведения этого белого грибка."
  - char: "nelson_rad"
    side: "left"
    text:
      - "Какое счастье. Тогда я тоже пойду помогу. Свяжемся позже, Нельсон конец связи."
  - char: "ark_royal"
    side: "right"
    text:
      - "Ну надо же, кто бы мог подумать, что эта дрянь боится обычного шампуня... Отчего-то мне даже немного смешно."
      - "Нужно как можно скорее поделиться этой информацией с остальными..."
  - char: "le_terrible"
    side: "left"
    text:
      - "Эти штуки... боятся шампуня?"
      - "Можешь дать мне образец для изучения?"
  - char: "ark_royal"
    side: "right"
    text:
      - "Разве на складе его не полно? Просто возьми... и... всё!"
      - ".......Ле Террибль?!"
  - char: "le_terrible"
    side: "left"
    text:
      - "Да, это я."
  - char: "ark_royal"
    side: "right"
    text:
      - "Кхм... Я знаю, что это ты, но откуда ты вообще взялась?"
  - char: "le_terrible"
    side: "left"
    text:
      - "Эм... Из тайного хода?"
      - "Но не в этом суть. Я пришла передать послание от кардинала Ришелье."
      - "Леди Илластриес сейчас должна быть на выставке... Значит, за крепость отвечает леди Нельсон?"
      - "Можешь отвести меня к ней?"
  - char: "ark_royal"
    side: "right"
    text:
      - "Конечно, без проблем. Но... тайный ход...?"
      - "А? Неужели в мальтийской крепости есть тайные ходы, о которых мы даже не подозревали?"
  - char: "le_terrible"
    side: "left"
    text:
      - "Остров Мальта когда-то был резиденцией одного великого рыцарского ордена, так что он и впрямь скрывает немало тайн."
      - "Во что бы то ни стало, этот остров необходимо защитить."
  - char: "ark_royal"
    side: "right"
    text:
      - "Даже если бы госпожа Ришелье не просила об этом, мы бы именно так и поступили."
      - "Но всё равно, спасибо."
  - char: "le_terrible"
    side: "left"
    text:
      - "Не за что. Позвольте и мне внести свой вклад в оборону крепости."
