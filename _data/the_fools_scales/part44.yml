chapter1:
  rows:
  - text:
      - "Средиземное море вновь покрылось бескрайней белизной."
  - char: "empress"
    side: "left"
    text:
      - "Запись: тридцать третий анализ инцидента."
      - "Что касается разросшейся белой субстанции, проведенный анализ достаточного количества образцов подтвердил..."
      - "Она связана с X."
      - "Из-за незначительной степени трансформации и наложенной маскировки, подтвердить это удалось лишь сейчас."
      - "Что касается аномальной оболочки Иерофант."
      - "Собранные образцы также доказывают, что эта аномальная оболочка связана с X."
      - "Что до того, почему Иерофант предпочла не уничтожать её сразу..."
      - "Мне так и не удалось восстановить с ней связь, поэтому подтвердить причину напрямую не представляется возможным."
      - "............"
      - "И хотя это вторжение удалось остановить на ранней стадии."
      - "Тем не менее, можно с уверенностью заявить, что Тестовый полигон бета больше не является безопасным."
      - "...Зеро, похоже, придает этому месту особое значение."
      - "Сначала доложу ей."
