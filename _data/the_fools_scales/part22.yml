chapter1:
  rows:
  - text:
      - "На рейде острова Святой Елены собирался огромный флот."
      - "Бесчисленные знамена Свободного Ириса развевались на ветру."
      - "Но не только они. Вместе с ними на ветру развевалось и давно не использовавшееся знамя, символизирующее Ортодоксию Ирис."
      - "Сколько же времени прошло с тех пор, как это знамя в последний раз развевалось на ветру?"
      - "Взгляд Ришелье переместился со знамени на далекую морскую гладь."
      - "В этот самый момент начал сгущаться плотный туман, и сквозь него смутно проступали очертания врат, формирующихся прямо над поверхностью моря."
      - "В отличие от светлых и ясных прибрежных вод острова, по ту сторону врат тянуло запахом пламени и пороха."
  - char: "richelieu"
    side: "left"
    text:
      - "(Ле Террибль, так вот какого момента ты всё это время ждала...)"
      - "(Никогда бы не подумала, что Трибунал сможет воспользоваться технологиями, оставленными Компилятором...)"
      - "(Клемансо, и насколько же ты причастна ко всему происходящему...)"
  - char: "marseillaise"
    side: "right"
    text:
      - "Кардинал Ришелье, пора."
  - char: "richelieu"
    side: "left"
    text:
      - "Да. Наконец-то... время пришло."
      - "Фух.."
  - text:
      - "Стоящая за трибуной Ришелье отпустила кнопку микрофона и тихонько выдохнула."
  - char: "richelieu"
    side: "left"
    text:
      - "Соотечественники Ириса."
  - text:
      - "Звук её голоса привлек к себе взгляды всех присутствующих, и предбоевой гомон постепенно стих."
      - "Взгляд Ришелье скользнул по лицам всех собравшихся, прошелся по развевающемуся знамени Ортодоксии Ирис, и, дождавшись полной тишины, она продолжила."
  - char: "richelieu"
    side: "left"
    text:
      - "Соотечественники Ортодоксии Ирис."
      - "Вы все видите картину, развернувшуюся по ту сторону этих врат."
      - "Это не иллюзия и не мираж, это реальность, происходящая прямо сейчас."
      - "В этот самый миг аномалия охватила горы и реки, а с небес нескончаемым потоком обрушиваются враги."
      - "Пламя войны уже полыхает."
      - "Доминион Виши ведет тяжелые бои."
      - "Наши соотечественники сражаются изо всех сил."
  - text:
      - "Ришелье указала на «врата» над поверхностью моря, и эта сотканная из тумана арка стала еще более отчетливой, чем прежде."
      - "Сквозь пороховой дым можно было смутно разглядеть вспышки артиллерийского огня, гигантские механизмы и бескрайнюю белизну."
  - char: "richelieu"
    side: "left"
    text:
      - "И Доминион Виши, и Свободный Ирис — изначально мы всегда были единым целым."
      - "Ортодоксия Ирис должна быть единой."
      - "Лишь череда несчастий в прошлом привела к этой абсурдной и жестокой реальности, в которой мы оказались сегодня."
      - "Нашу родину насильно раскололи надвое, а соотечественников заставили поднять оружие друг против друга."
      - "А затем появилось еще больше шрамов, которые ноют и по сей день."
  - text:
      - "Ришелье сделала паузу, вновь обведя взглядом собравшихся."
      - "В этот раз она не смотрела на знамя Ортодоксии Ирис, а высоко подняла знамя Свободного Ириса, которое держала в руке."

chapter2:
  rows:
  - char: "richelieu"
    side: "left"
    text:
      - "Среди тех, кто собрался здесь сегодня, есть те, кто следовал за мной от самых Королевских островов, пройдя сквозь пламя войны."
      - "А есть и те, кто присоединился к этому долгому праведному походу уже на полпути."
      - "Но вера, что поддерживает нас в бою, не зависит от того, как долго мы сражаемся."
      - "Несомненно, мы все собрались здесь сегодня ради одной-единственной цели."
      - "Ради веры в воссоединение нашей родины."
      - "Поэтому мы не можем сидеть сложа руки, пока на нашей земле полыхает пламя войны."
      - "Не можем закрывать глаза на страдания наших соотечественников."
      - "Мы сражались с Сиренами, сражались с Багровой Осью, и более того — мы не раз боролись с пораженчеством в наших собственных рядах!"
      - "А теперь родина призывает нас на битву с этим кошмарным бедствием, что пожирает саму нашу цивилизацию!"
      - "Я, кардинал Ортодоксии Ирис Ришелье, торжественно клянусь перед вами."
      - "Я поведу вас на зов родины, чтобы вступить в бой с этим подобным стихийному бедствию кошмаром."
      - "Я буду сражаться плечом к плечу с вами до самой смерти."
      - "Или же до того момента, пока мы полностью не одолеем врага, и знамя Ортодоксии Ирис вновь не взовьется над нашей родной землей!"
      - "Соотечественники Ириса... время пришло."
      - "Вниманию всего флота! Курс на родину. Сняться с якоря! Выступаем!"
  - text:
      - "Под громовые аплодисменты этот грандиозный флот корабль за кораблем начал входить в мерцающие врата."
      - "Началась самая великая экспедиция с момента основания Свободного Ириса..."

chapter3:
  rows:
  - text:
      - "Ожесточенный бой продолжался уже долгое время."
      - "Поверхность воды была усеяна горящими обломками."
      - "И хотя сейчас на море воцарилось затишье, не оставалось никаких сомнений: этот израненный флот был уже не в силах отразить следующую волну вражеских атак."
      - "Предводительница этого флота, сжимая в руках изодранное знамя, сейчас отрешенно сидела прямо на воде."
      - "От недавнего боевого пыла не осталось и следа, уступив место лишь бесконечной горечи и растерянности."
  - char: "jean_bart"
    side: "left"
    status: "is-yellow"
    text:
      - "Какое жалкое зрелище..."
      - "Неужели я просто пошла на поводу у эмоций..."
      - "Было ли мое решение ошибочным..."
      - "Неужели я снова привела флот к гибели..."
  - char: "painleve_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Госпожа Жан Бар, приближаются новые враги..."
      - "На этот раз появилось что-то новенькое — и в небе, и под водой..."
      - "Что нам... делать?"
  - char: "jean_bart"
    side: "left"
    status: "is-yellow"
    text:
      - "(И вправду, что нам делать...)"
      - "(И Ришелье, и Клемансо — обе предали нас. Что же нам теперь делать...)"
  - text:
      - "Предводительница флота не обращала внимания на доносящиеся из коммуникатора крики, продолжая всё так же потерянно сидеть на воде."

chapter4:
  rows:
  - char: "richelieu"
    side: "left"
    text:
      - "Неужели ты вот так просто сдашься, сестра?"
  - char: "jean_bart"
    side: "right"
    status: "is-yellow"
    text:
      - "Сестра?"
      - "Хех, опять предсмертные галлюцинации..."
      - "В этот раз ангел Господень принял облик моей сестры, чтобы забрать меня..."
  - char: "richelieu"
    side: "left"
    text:
      - "Жан Бар, как рыцарь Ортодоксии и как предводительница флота, как ты можешь позволять себе подобную слабость?"
      - "Если командир опустит руки, что станет с флотом, который сражается, следуя за тобой?"
      - "Если флот, идущий за тобой в бой, будет уничтожен, что станет с народом, который вы призваны защищать?"
  - char: "jean_bart"
    side: "right"
    status: "is-yellow"
    text:
      - "Если это ангел, посланный Богом, то он слишком уж строг и до боли похож на мою сестру..."
  - text:
      - "БАБАХ!!!"
      - "Залпы артиллерийских орудий разорвали недолгую тишину над морем."
      - "Враг снова приближался."
      - "Однако ожидаемой гибели так и не последовало."
  - char: "vauquelin_rad"
    side: "left"
    status: "is-yellow"
    text:
      - "Госпожа Жан Бар! Подкрепление, прибыло подкрепление!"
      - "Объединенный флот Свободного Ириса и Трибунала появился прямо посреди поля боя в яркой вспышке света!"
      - "Врагов громят, мы спасены!"
  - char: "dunkerque_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Я уж думала, что мы все здесь пойдем ко дну. Кто же знал, что ты заранее вызвала подкрепление."
      - "Получается... твоя недавняя ссора с госпожой Клемансо была всего лишь спектаклем?"
  - text:
      - "Непонятно, совершенно непонятно."
      - "Доносящиеся из коммуникатора вести привели Жан Бар в полное замешательство."
  - char: "jean_bart"
    side: "left"
    status: "is-yellow"
    text:
      - "Подкрепление от Свободного Ириса и... Трибунала?"
      - "Да что здесь вообще происходит... Неужели... ты и вправду моя сестра?"
  - char: "richelieu"
    side: "right"
    text:
      - "Наконец-то до тебя дошло?"
      - "Никогда нельзя переставать надеятся и верить."
      - "Ведь только так, когда надежда снизойдет к тебе, ты сможешь крепко ухватиться за её луч."
  - char: "jean_bart"
    side: "left"
    status: "is-yellow"
    text:
      - "...Зачем ты здесь, кардинал Ришелье?"
      - "...Пришла посмеяться над моим жалким видом?"
  - char: "richelieu"
    side: "right"
    text:
      - "Почему ты не можешь просто назвать меня сестрой?"
      - "Ведь только что у тебя это так легко вырвалось, не правда ли?"
  - char: "jean_bart"
    side: "left"
    status: "is-yellow"
    text:
      - "..."
  - char: "richelieu"
    side: "right"
    text:
      - "Мне очень понравилось, повтори-ка еще пару раз."
      - "Давай, повторяй за мной. Сест-ри-ца Ри-ше-лье."
      - "И тогда я прощу тебе твою дерзость."
  - char: "jean_bart"
    side: "left"
    status: "is-yellow"
    text:
      - "...Ах ты!"
  - char: "richelieu"
    side: "right"
    text:
      - "Ладно..."
      - "Думаю, на этом долгожданный обмен колкостями можно и закончить?"
      - "Переходим к следующему пункту. Война еще не окончена, так что соберись, моя младшая сестренка."
      - "Причина моего появления очевидна."
      - "Ты находишься в смертельной опасности, как и вся наша родина."
      - "Я сделала свой выбор, а ты?"
  - char: "jean_bart"
    side: "left"
    status: "is-yellow"
    text:
      - "...В любом случае, Клемансо уже изгнала нас из Доминиона Виши."
      - "Нам теперь некуда идти, так что, если ты согласна принять нас..."
  - char: "richelieu"
    side: "right"
    text:
      - "Конечно, сестра."

chapter5:
  rows:
  - text:
      - "Жан Бар глубоко вздохнула и поднесла микрофон коммуникатора к губам."
  - char: "jean_bart"
    side: "left"
    text:
      - "Бывшие рыцари Доминиона Виши, а ныне — свободные рыцари Ириса. Говорит Жан Бар."
      - "Отныне я присоединяюсь к кардиналу Ришелье, чтобы вместе с ней и её флотом сражаться за нашу родину."
      - "У меня больше нет права вам что-либо приказывать."
      - "Но я надеюсь, что вы присоединитесь к нам, чтобы в этот час мы сплотились и вместе уничтожили этих ненавистных врагов..."
  - char: "painleve_rad"
    side: "right"
    text:
      - "Как пожелаешь, госпожа Жан Бар!"
  - char: "vauquelin_rad"
    side: "left"
    text:
      - "Ура~ Как здорово!"
  - char: "dunkerque_rad"
    side: "right"
    text:
      - "Разумеется, без проблем. К тому же, ты по-прежнему предводительница нашего флота, госпожа Жан Бар."
  - char: "la_galissonniere"
    side: "left"
    text:
      - "Эх, ты даже упрямее Алжири! Наконец-то дождались, пока ты образумишься!"
  - char: "jean_bart"
    side: "right"
    text:
      - "...Да, на это ушло так много, так много времени."
      - "Наконец-то..."

chapter6:
  rows:
  - text:
      - "Жан Бар отбросила изодранное знамя Доминиона Виши и опустилась перед Ришелье на одно колено."
      - "Ришелье возложила знамя на плечи Жан Бар и торжественно провозгласила."
  - char: "richelieu"
    side: "left"
    text:
      - "Я, кардинал Ортодоксии Ирис, сим провозглашаю."
      - "Восстановить Жан Бар в должности командира рыцарского ордена Ортодоксии Ирис, командующей флотом Ортодоксии Ирис, а также вернуть ей все несправедливо отнятые статусы и титулы."
      - "То же самое касается и всех членов бывшего флота Доминиона Виши, находящихся под её командованием."
      - "Сражайся плечом к плечу с нами, Жан Бар."
  - char: "jean_bart"
    side: "right"
    text:
      - "…………"
      - "Как и в былые времена, я вверяю тебе свою верность."
      - "Добро пожаловать домой, кардинал Ортодоксии, моя старшая сестра."
  - char: "richelieu"
    side: "left"
    text:
      - "...Давно не виделись, моя младшая сестренка."
      - "Я вернулась."
  - text:
      - "Над поверхностью океана раздались оглушительные радостные крики."
      - "И лишь в стороне, совершенно незаметно для остальных, Гасконь тихо отплыла вдаль, исчезнув из виду."
