chapter1:
  rows:
  - text:
      - "Опасность неумолимо приближалась к порту Тулон, и флот Доминиона Виши уже покинул гавань, однако..."
  - char: "jean_bart"
    side: "left"
    status: "is-yellow"
    text:
      - "Вернуться в порт? Нет, Клемансо, ты не понимаешь, что здесь происходит!"
      - "Неизвестная белая субстанция стремительно расползается по суше, а множество спустившихся с небес причудливых механизмов сеют вокруг разрушения."
      - "Наша родина в огне, мы должны действовать!"
  - char: "clemenceau_rad"
    side: "right"
    status: "is-red"
    text:
      - "Я прекрасно понимаю ситуацию, и мой приказ предельно ясен."
      - "Флоту Тулона запрещено покидать порт."
      - "Можете готовиться к бою, если вам так угодно, но пока порт не подвергнется прямой атаке, даже если сюда залетят шальные снаряды, открывать ответный огонь категорически запрещено."
  - char: "jean_bart"
    side: "left"
    status: "is-yellow"
    text:
      - "Ты издеваешься?! В такой ситуации ты приказываешь нам просто стоять и смотреть?!"
  - char: "clemenceau_rad"
    side: "right"
    status: "is-red"
    text:
      - "Я не намерена повторять приказ в третий раз."
      - "Гасконь, убеди госпожу Жан Бар выполнить приказ."
  - char: "gascogne"
    side: "left"
    status: "is-yellow"
    text:
      - "Госпожа Жан Бар, пожалуйста, не нарушай приказ командования Доминиона."
      - "В противном случае я буду вынуждена активировать протокол реагирования на чрезвычайные ситуации."
  - char: "jean_bart"
    side: "right"
    status: "is-yellow"
    text:
      - "..............."
      - "Хех... Ну хорошо, сейчас ты здесь главная..."
  - char: "clemenceau_rad"
    side: "left"
    status: "is-red"
    text:
      - "Отлично. Если будут какие-то изменения, я снова с вами свяжусь."
  - char: "jean_bart"
    side: "right"
    status: "is-yellow"
    text:
      - "......Проклятье!"
  - text:
      - "Жан Бар со всей силы ударила кулаком по коммуникатору, оставив на его корпусе вмятину."
  - char: "dunkerque"
    side: "left"
    status: "is-yellow"
    text:
      - "Нет смысла вымещать злость на коммуникаторе. Если сломаешь, чинить его будет довольно хлопотно."
  - char: "jean_bart"
    side: "right"
    status: "is-yellow"
    text:
      - "...Если по нему и дальше будут приходить только такие приказы, то туда ему и дорога."
      - "Эх... Вы все слышали приказ. Возвращаемся в порт."
  - char: "painleve"
    side: "left"
    status: "is-yellow"
    text:
      - "Госпожа Жан Бар, пожалуйста, не злись. Возможно, у госпожи Клемансо есть на то веские причины."
      - "Ты ведь её старшая сестра, кому, как не тебе, следовало бы её понять."
  - char: "jean_bart"
    side: "right"
    status: "is-yellow"
    text:
      - "Клемансо изменилась."
      - "...Я больше не могу её понять."
  - char: "painleve"
    side: "left"
    status: "is-yellow"
    text:
      - "Тебе стоит хотя бы верить в неё..."
  - char: "jean_bart"
    side: "right"
    status: "is-yellow"
    text:
      - "Возможно... но я так больше не могу."
      - "Разве вы не чувствуете, что эта картина кажется до боли знакомой?"
      - "...Когда я покинула холодные морские пучины и вновь открыла глаза, я поклялась."
      - "В этот раз я сделаю другой выбор."
      - "Я ни за что не позволю истории повториться на моих глазах."
      - "Времена, когда флотом Ирис распоряжались как пешками и разменной монетой, должны подойти к концу..."
