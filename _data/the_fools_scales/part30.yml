chapter1:
  rows:
  - text:
      - "Пространство Сингулярности, когда-то бывшее местом решающей битвы, теперь кажется невероятно пустынным."
      - "Лишь пламя, которое, кажется, будет гореть вечно, служит доказательством произошедшей здесь жестокой битвы."
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Мы торчим здесь на страже... уже довольно приличное время."
      - "Как думаешь, Энтерпрайз случайно про нас не забыла?"
  - char: "ark_royal_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Поскольку это стабильный канал, соединяющий миры, наше пребывание здесь имеет колоссальное стратегическое значение."
      - "И к тому же... Энтерпрайз не из тех, кто может вот так просто забыть кого-то снаружи, верно?"
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Скажем так, это маловероятно, но нельзя с уверенностью сказать, что такого не может быть."
      - "Не позволяй внешности Энтерпрайз обмануть тебя."
      - "Хоть она и выглядит такой крутой и собранной, на самом деле её психика не так... стабильна, как ты думаешь."
  - char: "ark_royal_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Ты имеешь в виду, что с её Кубом Мудрости что-то не так?"
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "Вовсе нет. Даже если у всех нас возникнут проблемы, у неё — вряд ли."
      - "Я говорю о чисто... психологических проблемах."
      - "Все эти годы она постоянно заставляла себя идти вперед, и эта натянутая струна ни разу не ослабевала."
      - "На самом деле, я очень за неё переживаю."
  - char: "ark_royal_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Я не так долго сражалась с ней плечом к плечу."
      - "Но ты ведь, кажется, была с ней с самого начала... еще до того, как мы подверглись МЕТА-морфозу, верно?"
      - "Судя по твоим словам, почему тогда с твоей психикой всё в порядке?"
  - char: "hiryuu_meta"
    side: "left"
    status: "is-meta"
    text:
      - "А разве я похожа на ту, у кого всё в порядке?"
      - "Ладно... Может быть, я просто лучше умею находить способы расслабиться?"
      - "Или... я уже давно смирилась с некоторыми вещами."
      - "Знаешь, есть такое прошлое... чем больше ты пытаешься найти в нем спасение, тем сильнее в итоге ранишь саму себя."
      - "Это всё равно что пить яд, чтобы утолить жажду."
      - "Я просто отпустила... большую часть всего этого."
      - "Впрочем... если нам и дальше придется помирать здесь со скуки!"
      - "Мое душевное здоровье и правда может резко пошатнуться, и я превращусь в жуткого монстра!"
      - "Р-р-р! Гр-р-р-р!"
  - char: "ark_royal_meta"
    side: "right"
    status: "is-meta"
    text:
      - "Пожалуйста, веди себя приличнее..."
  - char: "communicator"
    side: "left"
    text:
      - "*Бип!*"
  - char: "hiryuu_meta"
    side: "right"
    status: "is-meta"
    text:
      - "...Хм? Коммуникатор?"
      - "Кто вызывает..."
      - "...Ого?"
      - "Вот и намечается кое-что интересненькое!"
