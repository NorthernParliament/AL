chapter1:
  rows:
  - text:
      - "До того как Клемансо нанесла внезапный удар по Марко Поло, ударный флот, состоящий из кораблей Империи Сакуры и Свободного Ириса, отправился в путь."
      - "Поэтому, когда началась аномалия, этот флот оказался вооруженной силой, находящейся ближе всех к эпицентру событий."
      - "Поскольку первоначальная боевая задача потеряла свою актуальность, флот решил переключиться на выполнение разведывательной миссии, чтобы как можно скорее прояснить текущую ситуацию."

chapter2:
  rows:
  - char: "suffren"
    side: "left"
    text:
      - "Всем быть осторожными, мы почти добрались до места падения трона Марко Поло."
  - char: "guichen"
    side: "right"
    text:
      - "Даже во тьме я чувствую, что тот район кажется еще более черным и непроглядным, чем всё вокруг."
      - "Даже те немногие лучи света полностью исчезают вблизи него."
  - char: "shimakaze"
    side: "left"
    text:
      - "Позвольте Симакадзэ попробовать включить прожектор!"
      - "Да будет свет!"

chapter3:
  rows:
  - text:
      - "Яркий свет прожектора озарил поверхность воды рядом со всеми, но так и не смог пробиться сквозь кромешную тьму, сгустившуюся совсем неподалеку."
  - char: "shimakaze"
    side: "left"
    text:
      - "...Ува-а-а?! Она поглотила весь свет?!"
      - "Это же прямо как черная дыра!"
  - text:
      - "Хотя свет и не смог пронзить тьму, он всё же позволил всем в общих чертах разглядеть её очертания."
  - char: "guichen"
    side: "left"
    text:
      - "Изогнутая полусфера, выступающая над водой..."
      - "Похоже, что под водой скрыта большая её часть. Словно кромешно-черный шар, который медленно всплывает на поверхность..."
  - char: "noshiro"
    side: "right"
    text:
      - "...В небе облака образовали некоего врага."
      - "На земле белая грибница сформировала некоего врага."
      - "А сейчас, в морских водах... непроглядный туман образовал некоего врага."
      - "Госпожа Синано, я думаю, что хотя внешний вид этих врагов сильно различается, принцип их формирования абсолютно одинаков."
      - "Это «коконы», состоящие из различных веществ, и именно из них зарождаются враги."
      - "Сейчас мы являемся флотом, находящимся ближе всего к этому «кокону», к тому же то, что находится внутри, еще не вылупилось окончательно..."
      - "Я считаю, что сейчас самый подходящий момент для атаки!"
  - char: "shinano"
    side: "left"
    text:
      - "Я тоже так думаю. Госпожа Жанна, что ты скажешь?"
  - char: "jeanne_d_arc"
    side: "right"
    text:
      - "Наша главная задача — разведка, однако... сейчас и правда выдалась редкая возможность для удара."
      - "Проведем пробную атаку?"
      - "Если не добьемся результатов, то немедленно отступим, что скажете?"
  - char: "shinano"
    side: "left"
    text:
      - "Так и поступим. Хакурю, приготовься к бомбардировке."
  - char: "hakuryuu"
    side: "right"
    text:
      - "Отлично, я уже давно этого ждала!"
  - text:
      - "БАБАХ!!!"
      - "Бомбы, сброшенные палубными самолетами Хакурю, успешно вызвали серию взрывов на поверхности «кокона»."
      - "Но затем изнутри кокона наружу вырвалась ударная волна черной энергии."
      - "Она поглотила свет от взрывов, а вместе с ним и Синано с остальными, которые просто не успели отступить..."

chapter4:
  rows:
  - text:
      - "За невероятно роскошным рабочим столом сидел совершенно раздавленный неудачей человек."
  - char: "marco_polo"
    side: "left"
    text:
      - "Провал..."
      - "Провал, провал, провал, провал, провал, провал, провал, провал, провал, провал, провал, провал, провал, провал, провал..."
      - "Подумать только, я... потерпела неудачу..."
      - "Хе-хе... Да что не так с этой Империей Сардиния..."
      - "Даже для одного «Возрождения» они умудрились написать несколько разных сценариев, но даже в своих мечтах не могут прийти к единому мнению..."
      - "И вдобавок ко всему эта их удручающая пассивность..."
      - "...Хех, мне больше ничего не остается... Я абсолютно бессильна..."
  - text:
      - "Марко Поло, совершенно позабыв о манерах, бессильно откинулась на спинку кресла и машинально взяла со стола какую-то безделушку."
  - char: "marco_polo"
    side: "left"
    text:
      - "...Этот старинный крест... разве он был вчера на этом столе?"
  - text:
      - "Марко Поло завороженно смотрела на крест. Казалось, в этот самый миг распятие в её руках стало единственной вещью во всем мире, достойной её внимания."

chapter5:
  rows:
  - char: "marco_polo"
    side: "left"
    text:
      - "...?!"
      - "Неужели... Божественное... Божественное откровение снизошло...?!"

chapter6:
  rows:
  - char: "marco_polo"
    side: "left"
    text:
      - "Армия Бога... наголову разбила Сирен?"
      - "Аха... аха-ха... аха-ха-ха-ха..."
      - "Оказывается... Бог — это враг Сирен!"
      - "А-ха-ха-ха-ха-ха-ха-ха-ха-ха-ха-ха-ха-ха-ха!"
