chapter1:
  rows:
  - text:
      - "Мир, казалось, был окутан странной белизной."
      - "Безудержно разрастающаяся липкая грибница продолжала расползаться, словно превращая горы и земли в некое живое существо."
      - "Помимо Дироев (Наблюдателей), на поверхности воды появилось еще больше причудливых врагов."
      - "Хотя благодаря защите «Стены Авроры» и совместным действиям объединенного флота всех фракций ситуация на выставке постепенно улучшалась."
      - "Однако в глобальном масштабе обстановка, несомненно, ухудшалась с каждой минутой."
  - char: "illustrious_rad"
    side: "left"
    text:
      - "Командир, мы только что сделали несколько новых снимков."
      - "Возможно, они проливают свет на... процесс зарождения этих бесконечно появляющихся врагов."
  - text:
      - "Илластриес прислала изображения с разведывательного самолета."
      - "На первой серии снимков были видны бесчисленные «коконы» разного размера, усеявшие покрытую белой субстанцией землю."
      - "«Коконы» соединялись между собой какой-то красной сетью прожилок, словно высасывая питательные вещества прямо из земли."
      - "А на второй серии фотографий «коконы» разрывались, и из них вылуплялись причудливые враги."
  - char: "memphis"
    side: "left"
    text:
      - "Какая мерзость... Они что... вылупляются?"
  - char: "shinano"
    side: "right"
    text:
      - "Превращают всё сущее в питательную среду, а затем вылупляются и размножаются..."
      - "Однако, Командир, я полагаю, что хоть это место и не является привычным нам Зеркальным морем, происходящее здесь также не принадлежит реальному миру."
      - "Этот кошмарный пейзаж, возможно, и впрямь лишь сон, некий особый сон."
  - char: "memphis"
    side: "left"
    text:
      - "Госпожа Синано, то, что вы говорите, звучит немного как отговорка для побега от реальности..."
  - char: "commander"
    side: "right"
    text:
      - "Синано, у тебя есть какие-то доказательства?"
  - char: "shinano"
    side: "left"
    text:
      - "Прямых доказательств нет, но есть косвенные подтверждения."
      - "С тех пор, как появились эти враги, именуемые  Наблюдателями, я ощутила бьющий ключом поток силы."
      - "Сон, способный затянуть в себя стольких людей, несомненно отличается от тех снов, по которым я обычно странствую."
      - "Но в реальном мире я никогда не обладала такой силой... Это и есть то самое подтверждение, заставляющее меня верить, что это место — мир снов."
  - char: "commander"
    side: "right"
    text:
      - "(В одной из прошлых операций Синано уже ошибочно принимала за сон особое пространство, созданное Сиренами.)"
      - "(Возможно... в этот раз всё так же.)"
      - "(Если Синано права, то это место — искусственно созданное особое пространство, а не сам реальный мир.)"
      - "(В таком случае должно существовать некое центральное устройство, поддерживающее его существование."
      - "(Точно так же, как и при борьбе с Зеркальными морями, нам нужно найти его и уничтожить. Это позволит вырваться из бесконечной войны на истощение и одним махом переломить ход событий.)"
      - "(Но для этого в первую очередь необходимо восстановить связь и объединить все силы, разбросанные по Средиземному морю.)"
      - "(Эссекс, должно быть, уже почти закончила со своей задачей... Нужно с ней связаться...)"

chapter2:
  rows:
  - char: "essex_rad"
    side: "left"
    text:
      - "Сигнал четкий, Командир."
      - "Мы успешно восстановили сигнальную матрицу «Космической Иглы»."
      - "Теперь осталось лишь запустить временную ретрансляционную матрицу, и всё будет готово."
      - "Обратный отсчет до восстановления связи. Всем приготовиться."
      - "3... 2... 1... Давай! Хелена, включай рубильник!"
  - char: "communicator"
    side: "right"
    text:
      - "[Шшш...] Крепость вызывает [Шшш...], как [Шшш...] слышно [Шшш...] прием..."
      - "Маль[Шшш...]тийская крепость вызывает Выста[Шшш....]вочную площадь, как слышно, [Шшш...] прием..."
  - text:
      - "Из долго молчавшего коммуникатора внезапно вырвался шквал шумных голосов, и в мгновение ока эфир стал оживленным, словно шумный базар."
      - "Разведданные посыпались из эфира, словно снежные хлопья."
      - "Хорошая новость: сопротивление в крепостях по всему Средиземному морю не прекратилось."
      - "Плохая новость... зона поражения этого пространства, которое Марко Поло назвала «Царством Божьим», оказалась куда обширнее и опаснее, чем мы предполагали."
  - char: "commander"
    side: "left"
    text:
      - "Необходимо как можно скорее установить стабильные каналы связи со всеми сражающимися крепостями и составить карту тактической обстановки в акватории."
  - char: "memphis"
    side: "right"
    text:
      - "Командир, я немедленно займусь этим."
  - char: "guichen"
    side: "left"
    text:
      - "Я тоже помогу. На данном этапе лишние руки нам не помешают, верно?"
  - char: "avrora"
    side: "right"
    text:
      - "Верно, вместе мы — сила. Мы с Памятью Меркурия тоже поможем."
  - char: "prinz_eugen"
    side: "left"
    text:
      - "Подобные дела — не мой конек, но у меня как раз есть та, кто в этом разбирается."
      - "Z2, иди помоги им."
  - char: "z2"
    side: "right"
    text:
      - "...Хорошо."
  - char: "shinano"
    side: "left"
    text:
      - "Носиро, ты тоже окажи содействие."
  - char: "noshiro"
    side: "right"
    text:
      - "Слушаюсь, госпожа Синано."

chapter3:
  rows:
  - text:
      - "Узнавш об обстановке на выставке, Уорспайт сообщила, что оставит часть людей для обороны крепости, а затем поведет основные силы флота нам на помощь."
      - "На Мальте ситуация оказалась куда более суровой: под натиском яростных атак противника гарнизонный флот оказался заперт в крепости."

chapter4:
  rows:
  - text:
      - "Оценив реальную обстановку, Принц Ойген согласилась с планом повести флот Железной Крови на выручку Мальте."
      - "После этого они вместе с Королевским Флотом вернутся на выставку для перегруппировки."

chapter5:
  rows:
  - text:
      - "В порту Тулон базируются основные силы Доминиона Виши."
      - "Однако по связи они давали лишь формальные ответы, отказавшись предоставлять какую-либо информацию или принимать предложение о совместных боевых действиях."
      - "Пока остается лишь наблюдать за развитием событий..."

chapter6:
  rows:
  - text:
      - "Положение Империи Сардиния также не внушает оптимизма."
      - "Кажется, перед самым началом нападения Марко Поло попыталась использовать полномочия Сената, чтобы взять флот Сардинии под свой контроль."
      - "Но в силу различных причин ей это не удалось. Теперь же, с восстановлением связи, Венето вернула себе командование."
      - "На данный момент бои в окрестностях крепости Таранто временно прекратились, и гарнизонный флот Империи Сардиния находится там в режиме ожидания."
      - "Второе лицо во флоте Империи Сардиния, Литторио, сейчас находится по делам в Венеции."
      - "Сразу после начала атаки она укрылась в безопасном бункере. И хотя она отрезана от остальных, сейчас она в относительной безопасности."

chapter7:
  rows:
  - text:
      - "Венето изначально планировала отправить флот из Таранто ей на выручку в Венецию, однако Литторио ответила, что эта помощь издалека поспеет слишком поздно, поэтому она сама найдет способ выбраться."

chapter8:
  rows:
  - text:
      - "Столица Империи Сардиния также подверглась нападению. Но благодаря своевременной реакции гарнизонного флота и подкреплениям из глубины страны, сейчас бои там подходят к концу."
      - "Рома, корабль класса «Витторио Венето», сообщила, что как только безопасность столицы будет обеспечена, она приведет свой флот на выставку для объединения сил."
      - "В то же время она передала важную информацию: трон Марко Поло в данный момент парит над одной из акваторий, излучая свет, словно проводя какой-то ритуал."

chapter9:
  rows:
  - text:
      - "Отдельного внимания заслуживает порт Александрия, где должен был базироваться один из флотов Империи Сардиния, но на вызовы они не отвечают, и ситуация там пока неизвестна."
      - "Из Таранто уже отправлены разведывательные самолеты в сторону Александрии, так что, полагаю, в скором времени мы получим более точные сведения."
      - "Все флоты Империи Сардиния, средиземноморские флоты Королевского Флота и Доминиона Виши, а также объединенный флот всех фракций, собравшийся на выставке."

chapter10:
  rows:
  - text:
      - "В целом, силы флота, втянутые в это «Царство Божье», весьма внушительны."
      - "Даже в столь невыгодном положении... пока мы сплочены и действуем сообща, у нас всё еще есть шансы на победу!"
