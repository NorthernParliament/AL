chapter1:
  rows:
  - text:
      - "На тактических мониторах командного корабля был отчетливо виден исполинский мех, возвышающийся над водой вдалеке."
      - "Перед ним в воздухе неподвижно парила девушка, взирая на взрывы и вспышки пламени — битва шла уже давно."
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Прости... Командир, все наши атаки не могут пробить её защиту."
  - char: "commander"
    side: "left"
    text:
      - "Есть какие-нибудь подвижки с установлением её личности?"
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Кое-какие действительно есть... но тут всё очень странно."
      - "После сопоставления данных выяснилось, что больше всего на ложного бога похожа модель Сирен — Арбитр Иерофант V."
      - "Но даже после ввода правильных параметров мое оборудование по-прежнему не может распознать её как Иерофант."
      - "Я подозреваю, что кто-то или что-то управляет оболочкой Иерофант..."
      - "То есть та самая сила, породившая эти аномалии, тот самый «бог», чьего сошествия так жаждала Марко Поло."
  - char: "hiryuu_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Я тоже так думаю!"
      - "В прошлом я немало сталкивалась с Иерофант, и она — одна из немногих по-настоящему разумных и умеренных в рядах Арбитров."
      - "Я тоже склоняюсь к тому, что некая сущность использует её серийную модель для своих действий."
      - "И эта сущность... вызывает у меня очень дурное предчувствие."
      - "Все эти нынешние явления, эта неизвестная белая субстанция — всё это похоже на некое «предзнаменование»..."
      - "Предзнаменования каждый раз разные, поэтому на данном этапе я не могу сказать наверняка."
      - "Но если это действительно предзнаменование... вы разозлили то, с чем лучше было бы никогда не связываться..."
  - text:
      - "Казалось, что и Мемфис, и Хирю имеют определенное представление об этом явлении, но не могут утверждать наверняка, да и не горят желанием вдаваться в подробности."
      - "Не хватает ли им информации, или же не хватает откровенности..."
      - "А может быть... само знание этой информации уже несет в себе колоссальную опасность."
  - char: "marseillaise_rad"
    side: "left"
    text:
      - "Командир Лазурного пути, когда мы начнем генеральную атаку?"
      - "В руках этого монстра находится то, что мы обязаны вернуть."
  - char: "commander"
    side: "right"
    text:
      - "...То, что мы обязаны вернуть?"
  - char: "jean_bart_rad"
    side: "left"
    text:
      - "Ах... Корона Святого Престола, этот монстр держит в руках Корону Святого Престола!"
  - char: "marseillaise_rad"
    side: "right"
    text:
      - "Верно, поэтому мы обязаны пресечь это кощунство и вернуть нашу святыню."
  - text:
      - "Утраченная святыня Ириса — Корона Святого Престола — оказалась в руках этой девушки, олицетворяющей «бога»."
      - "Я не отрывая глаз смотрел на Корону Святого Престола вдалеке, как вдруг в голове мелькнула мысль."
      - "Так называемая Корона Святого Престола изначально была частью бога, единым целым с Ним."
      - "Парящий в воздухе силуэт оставался неподвижным, однако я ощутил на себе её взгляд."

chapter2:
  rows:
  - text:
      - "Так это она... тот самый силуэт, что бесчисленное множество раз появлялся в моих кошмарах."
  - char: "memphis_rad"
    side: "left"
    text:
      - "Командир, у тебя... испарина на лбу. С тобой всё хорошо?"
  - char: "commander"
    side: "right"
    text:
      - "Этот силуэт... представляет собой колоссальную угрозу."
      - "Сосредоточить огонь, уничтожить цель!"

chapter3:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "suruga_rad"
    side: "left"
    text:
      - "Атаки на ложного бога по-прежнему не приносят результатов... Все снаряды бесследно исчезают в тот самый момент, когда касаются внешней брони. Мы вообще не можем причинить ей вреда."
  - char: "impero_rad"
    side: "right"
    text:
      - "У Имперо... немного не хватает боеприпасов. Нужно отдохнуть и пополнить запасы."
  - char: "lyon_rad"
    side: "left"
    text:
      - "Эти враги... они просто бесконечны."
      - "Стоит уничтожить одного, как в мгновение ока появляется другой... Откуда они вообще берутся?"
  - char: "sheffield_rad"
    side: "right"
    text:
      - "Из ниоткуда."
      - "Я видела очень четко. Не из-под воды и не из теней — они появляются просто из ниоткуда."
  - char: "noshiro_rad"
    side: "left"
    text:
      - "Из ниоткуда... Госпожа Синано, неужели это работает по тому же принципу, что и наши барьеры?"
  - char: "jeanne_d_arc_rad"
    side: "right"
    text:
      - "...Барьеры?"
  - char: "shinano"
    side: "left"
    text:
      - "Хм... возможно, это так."
      - "Когда кто-то выходит из скрытого барьера, для стороннего наблюдателя это действительно выглядит как появление из пустоты."
      - "Внешний вид входа в барьер — это лишь маскировка."
      - "То, что видят глаза — не есть реальность, а внутри барьера скрыто совершенно иное пространство..."
      - "Если не разрушить барьер правильным способом, а лишь атаковать вход в него... это всё равно что пытаться поразить цветок в зеркале или отражение луны в воде. Это заведомо обречено на провал."
  - char: "clemenceau"
    side: "right"
    text:
      - "Вот оно как... Враг впереди — это всего лишь очень реалистичная «тень»."
      - "Значит, её истинное тело скрывается в каком-то свернутом пространстве..."
      - "Если это так... то у меня есть один способ."
      - "Когда я ранее помогала Марко Поло с экспериментами, она использовала одно устройство. Возможно, оно поможет нам переломить нынешнюю ситуацию."
      - "Подожди немного, Командир, мне нужно время на подготовку."
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "Командир, Хелене тоже нужно больше времени, мы во что бы то ни стало должны продолжать тянуть время."
  - char: "commander"
    side: "right"
    text:
      - "Хорошо."
      - "Всем продолжать атаку!"

chapter4:
  rows:
  - char: "hierophant_x"
    side: "right"
    status: "is-lightgray"
    text:
      - "«▅■Стой▆▅»"
  - text:
      - "Бесстрастный механический женский голос прозвучал прямо в моей голове из ниоткуда."
  - char: "illustrious_rad"
    side: "left"
    text:
      - "Что это... был за голос?"
  - char: "duca_degli_abruzzi_rad"
    side: "right"
    text:
      - "Девочки, я... не могу пошевелиться."
  - char: "kronshtadt"
    side: "left"
    text:
      - "Я тоже... Командир, боюсь, это произошло со всем флотом!"
  - char: "hiryuu_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Если бы только это... кхэ-кхэ..."
      - "У меня такое чувство, будто по моей голове проехался поезд..."
  - char: "ark_royal_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "У меня тоже... я чувствую, как энергия в Кубе Мудрости выходит из-под контроля..."
      - "...Мемфис, ты в порядке?!"
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Я... в норме... еще держусь... ух."
  - text:
      - "Внезапный голос подействовал словно некая ментальная атака, затронув всех членов флота в акватории."
  - char: "shinano"
    side: "left"
    text:
      - ": Это прямо как Котодама (сила слова)... Командир, ты ведь тоже слышал этот голос?"
  - char: "commander"
    side: "right"
    text:
      - "Я слышал его очень четко, но мое тело не сковало параличом, как у остальных."
      - "Синано, ты кажется... тоже не подверглась этому влиянию?"
      - "Неужели командный корабль..."
  - char: "clemenceau"
    side: "left"
    text:
      - "Скорее всего, всё не так, как ты думаешь, Командир... Я тоже попала под удар."
  - char: "shinano"
    side: "right"
    text:
      - "Хм... Хоть мне и неясен механизм, я и вправду в полном порядке."
  - char: "prinz_rupprecht_rad"
    side: "left"
    text:
      - "Я тоже чувствую себя нормально, разве что руки и ноги немного отяжелели!"
  - char: "odin_rad"
    side: "right"
    text:
      - "Один также в хорошем состоянии и может продолжать выполнение боевой задачи."
  - char: "essex_rad"
    side: "left"
    text:
      - "Командир... наш серийный флот также подвергся лишь незначительному воздействию и может продолжать бой."
  - char: "commander"
    side: "right"
    text:
      - "А значит, серийные модели и корабли-прототипы пострадали меньше, в то время как на МЕТА это оказало куда более сильное влияние."
      - "А мы с Синано, по неизвестной причине, вообще не подверглись никакому воздействию..."
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "Могу сказать наверняка, эта атака... не была вызвана МЕТА-коррозией..."
      - "Это очень болезненное чувство, и в то же время до жути знакомое..."
  - char: "hiryuu_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Не то слово... знакомое. Я уже на девяносто процентов уверена в том, что это!"
      - "...Еще не поздно отступить?"
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "Что ты такое говоришь...? Хочешь сбежать с поля боя?!"
  - char: "hiryuu_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Эй, не кипятись... Я ведь не говорила, что брошу вас и уйду одна."
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "...Прости."
      - "Но если мы уведем Командира и отступим, боюсь, этот тестовый полигон будет уже не спасти."
  - char: "clemenceau"
    side: "right"
    text:
      - "Меня бы такой расклад сильно огорчил."
      - "Но к счастью... на корабли-прототипы это оказало не такое сильное влияние."
      - "Гасконь, действуй!"

chapter5:
  rows:
  - text:
      - "Черное солнце безмолвно пылает."
  - char: "shinano"
    side: "left"
    text:
      - "Черное солнце в небесах..."
      - "Клемансо... это и есть то самое устройство Марко Поло, о котором ты говорила?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Именно~"
      - "Как вы все себя чувствуете?"
  - char: "shimakaze"
    side: "left"
    text:
      - "Вау... о-о! Кажется, я могу двигаться!"
  - char: "memphis_meta"
    side: "right"
    status: "is-purple"
    text:
      - "Чувство дискомфорта мгновенно исчезло..."
      - "Заполнить пространство вокруг цели другой силой, чтобы экранировать её от внешнего воздействия..."
      - "Это устройство имеет ту же природу, что и некоторое оружие Арбитров."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Отлично... хоть это и устройство Марко Поло, оно всё же принесло хоть какую-то пользу."
      - "Раз так, мы можем приготовиться к..."
  - char: "hierophant_x"
    side: "right"
    status: "is-lightgray"
    text:
      - "«▅■Раз▆▅»"

chapter6:
  rows:
  - text:
      - "С тех пор как началась битва, «бог» впервые пошевелился."
      - "Она подняла свой скипетр, направила его в небо и слегка взмахнула."
      - "Вслед за этим черное солнце разлетелось на куски."
      - "Мир вновь оказался во власти «бога»."
  - char: "clemenceau"
    side: "left"
    text:
      - "Символ суда... был уничтожен так легко?!"
      - "Как такое... вообще возможно...?"
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Это оружие... принадлежит Иерофанту..."
      - "Но как... оно способно использовать уникальное вооружение Арбитра Иерофанта V?!"
      - "Осторожно! Если «Скипетр правосудия» попадет прямо в вас..."
      - "В лучшем случае вы просто испаритесь, в худшем... в любом случае, ни при каких обстоятельствах не позволяйте ему в вас попасть!"
  - char: "hiryuu_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Легко сказать... вот только мы... снова не можем пошевелиться."
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Ничего... Скипетр правосудия может нацеливаться только на одну цель за раз, к тому же у него малая дальность и долгая подготовка к выстрелу."
      - "У нас еще есть серийные модели, механические рыцари Трибунала и корабли-прототипы, которые могут продолжать бой!"

chapter7:
  rows:
  - text:
      - "В ход битвы вмешалась новая переменная."
  - char: "saint_louis_rad"
    side: "left"
    text:
      - "Обнаружена приближающаяся группа вражеских палубных самолетов, предлагаю задействовать сопоставимые авиационные силы для перехвата."
  - char: "hakuryuu_rad"
    side: "right"
    text:
      - "Ого... сколько их повылезало. Можете смело оставить их на меня!"
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "Погодите... это же, палубные самолеты Арбитра Дьявол?..."
  - text:
      - "Как уже не раз бывало, враги снова появились просто из пустоты."
      - "На этот раз вокруг «бога» появилось огромное количество палубных самолетов Дьявола."
      - "Сразу после появления они стремительно разлетелись во все стороны по акватории."
  - char: "hakuryuu_rad"
    side: "left"
    text:
      - "...Э? Они не собираются вступать со мной в бой. Что это они задумали?"
  - text:
      - "«Бог» снова поднял свой скипетр, направил его на зависший перед ним самолет и слегка взмахнул."
      - "Ослепительный золотой луч поглотил цель, но не уничтожил её."
      - "Пораженный самолет, словно ретранслятор, разделил золотой луч и рассеял его на другие самолеты."
      - "Так продолжалось до тех пор, пока все самолеты в акватории не соединились лучами, образовав единую сияющую сеть."
  - char: "hierophant_x"
    side: "right"
    status: "is-lightgray"
    text:
      - "«▅■Два▆▅»"
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "Это... синхронизация?"
      - "...Плохо дело, всем срочно уклоняться!"

chapter8:
  rows:
  - text:
      - "Благодаря своевременному предупреждению все корабли-прототипы в самый последний момент сумели уйти из-под удара."
      - "А вот все серийные корабли, включая механических рыцарей Трибунала, были уничтожены в мгновение ока."
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - ".......Теперь я всё поняла."
      - "Той, кто всё это время стояла за спиной Дьявол и поддерживала её, была Иерофант!"
      - "Или... эта «сущность», похожая на Иерофант."
      - "Мне еще тогда это показалось странным... Как Дьявол смогла бы в одиночку прорвать установленный мной барьер!"
      - "Разумеется, это она всё время следила за Командиром и вела на него охоту..."
  - char: "hiryuu_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "...Дам вам один совет из личного опыта: не пытайтесь тягаться с Арбитрами лоб в лоб в той области, в которой они сильны."
      - "Особенно когда несколько Арбитров вступают в синхронизацию."
      - "В этот раз нам повезло, она решила сначала зачистить цели, представляющие наибольшую угрозу..."
      - "Но если следующий удар будет нацелен на нас, мы уже не сможем уклониться..."
  - text:
      - "Глядя на силуэт вдалеке, я понимал: нужно во что бы то ни стало найти способ предотвратить его следующую атаку."
      - "Хотя нас разделяло огромное расстояние, я словно почувствовал на себе ответный взгляд «бога» и, кажется, увидел, как он... склонил голову набок?"
  - char: "shinano"
    side: "left"
    text:
      - "Мммм... «Бог», кажется, начал двигаться?"

chapter9:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Корабли-прототипы совместными усилиями проводили атаки, остальные корабли тоже из последних сил продолжали бой."
  - char: "essex_rad"
    side: "left"
    text:
      - "Она движется в сторону Командира!"
      - "Мы должны во что бы то ни стало... замедлить её!"
  - text:
      - "Однако атаки по-прежнему не приносили никаких результатов, и продвижение «бога» ничто не могло остановить."
      - "Он приближался, а затем вновь поднял свой скипетр."
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "...Нет, слишком поздно!!"
      - "Хелена, чего ты ждешь?!"
      - "Меняем план, немедленно вытаскивай Командира отсюда!"
  - char: "hierophant_x"
    side: "right"
    status: "is-lightgray"
    text:
      - "«▅■Три▆▅»"

chapter10:
  rows:
  - text:
      - "Свет, выпущенный из скипетра «бога», запрыгал между палубными самолетами Дьявол, вновь образуя гигантскую сеть."
      - "Однако..."

chapter11:
  rows:
  - text:
      - "БАБАХ!!!"
      - "На этот раз эскадрильи Дьявол разом взорвались в лучах света."
      - "А вокруг всех боевых единиц в акватории появился ослепительный золотой барьер."

chapter12:
  rows:
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Мемфис, разве ты не сказала всем, что я окажу поддержку?"
      - "Как же ты можешь сдаваться первой?"
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "Хелена..."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Ладно-ладно, теперь всё в порядке."
  - char: "hiryuu_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Подожди-ка... этот знакомый голос. Хелена, неужели ты..."
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Нет, не я."
      - "Спросишь еще раз, и я сниму с тебя щит."
  - char: "hiryuu_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Эй, не надо~ Ладно, ладно, не ты, так не ты!"
  - char: "helena_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "Вот и славно."
      - "Командир, проблема с Дьявол уже решена."
      - "Её настоящее тело находится далеко от вас, и она больше не сможет оказывать поддержку."
      - "Я также нашла способ снять «ограничения», наложенные Иерофант на всех вас."
      - "Пока держится барьер, вы можете свободно двигаться."
      - "Что касается времени его действия... что ж, до конца этой операции его точно хватит."
      - "Однако я до сих пор не смогла решить проблему с тем, что Иерофант невозможно атаковать напрямую."
      - "Пожалуйста, продолжайте сдерживать её действия. Мне нужно... еще немного времени."
  - char: "hiryuu_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Масштабные сражения флотов — это изначально не та область, в которой сильна Иерофант."
      - "Теперь, когда у неё нет поддержки Дьявол, а её сильнейшее оружие запечатано, мы сможем тянуть время столько, сколько потребуется~"
  - char: "vittorio_veneto_rad"
    side: "right"
    text:
      - "Это прямо как тренировка по стрельбе по мишеням."
      - "И хотя попадания по этой мишени совсем не ощущаются... я не стану сдерживаться."
  - char: "prinz_eugen_rad"
    side: "left"
    text:
      - "Командир, похоже, у нас неожиданно много союзников~"
  - text:
      - "Боевой дух флота постепенно восстанавливался."
      - "Однако скрытая угроза никуда не исчезла."
      - "Все решения о дальнейших боевых действиях строились на предположении, что перед нами всё еще Арбитр Иерофант V."
      - "Но нет никаких сомнений в том, что... Она уже превратилась в некую иную сущность."
      - "Даже сейчас меня не покидало ощущение, что Она не сводит с меня глаз."
      - "Я отчетливо чувствовал на себе... этот пристальный, сверлящий взгляд."

chapter13:
  rows:
  - char: "hierophant_x"
    side: "right"
    status: "is-lightgray"
    text:
      - "«▅■Разделение▆▅»"
  - char: "ark_royal_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Хм...? Иерофант, кажется..."
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Она ускоряется...! Командир, берегись!!"

chapter14:
  rows:
  - text:
      - "Иерофант покинула свой мех и в одиночку резко ускорилась прямо в воздухе."
      - "Казалось, ей потребовалось лишь мгновение, чтобы оказаться над командным кораблем."
      - "Кроме Синано, находившейся на палубе, не осталось никого, кто мог бы преградить Ей путь"
  - char: "shinano"
    side: "left"
    text:
      - "Я не позволю!"
  - text:
      - "До ушей донесся... звон колокольчиков?"

chapter15:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "shinano"
    side: "left"
    text:
      - "Моя атака... достигла цели?"
  - text:
      - "Эхо от звона колокольчиков всё еще отдавалось в ушах."
      - "Иерофант, которую до сих пор не могло поразить ни одно оружие, после атаки Синано замерла на месте."
  - char: "shinano"
    side: "left"
    text:
      - "...Раз так, я продолжу наступление!"
  - char: "hierophant_x"
    side: "right"
    status: "is-lightgray"
    text:
      - "«▅■Разделение▆▅»"
  - char: "shinano"
    side: "left"
    text:
      - "Двойник...?! Плохо дело..."
  - text:
      - "На глазах у изумленной Синано из ниоткуда появилась новая Иерофант."
      - "Новоявленная Иерофант, словно призрак, прошла прямо сквозь щит и оказалась передо мной."

chapter16:
  rows:
  - char: "hierophant_x"
    side: "right"
    status: "is-lightgray"
    text:
      - "«▅■▆▅▆▅»"
      - "«■▅▅▆▅■▅▅»"
  - text:
      - "Вместе с нахлынувшим чувством невесомости мое сознание погрузилось во тьму."
