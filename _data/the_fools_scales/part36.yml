chapter1:
  rows:
  - text:
      - "После того как объединенный флот покинул территорию выставки, он разделился на несколько ударных групп, чтобы окружить цель с разных направлений."
  - char: "memphis_meta_rad"
    side: "right"
    status: "is-purple"
    text:
      - "Командир. Авангард успешно отбросил вражеские силы заграждения и вот-вот вступит в бой с истинной формой «бога»."
  - char: "hiryuu_meta_rad"
    side: "left"
    status: "is-meta"
    text:
      - "Давно забытое чувство битвы вновь заставило мою кровь кипеть~ Позволь мне первой прощупать почву!"
  - char: "essex_rad"
    side: "right"
    text:
      - "В воздухе всё еще идут напряженные бои."
      - "Однако наша мощь сейчас велика как никогда. Помимо всевозможных палубных самолетов, у нас также есть... эти дирижабли."
      - "Уверена, что очень скоро мы сможем захватить господство в воздухе."
  - text:
      - "Говоря об этих дирижаблях, Эссекс сделала небольшую паузу."
      - "И это неудивительно. Когда Рома прибыла на выставку вместе со столичным гарнизонным флотом Сардинии и целой армадой дирижаблей, заполонивших небо, это вызвало настоящий переполох."
      - "Похоже, как и в случае с врагами, рожденными из кокона, флотилия дирижаблей Ромы и да Винчи была особым родом войск, способным существовать лишь в этом месте."
      - "Именно поэтому Рома, будучи линкором, в этот раз была зачислена в состав авианосного флота."
  - char: "roma_rad"
    side: "left"
    text:
      - "Не отступать и не страшиться потерь."
      - "Дирижабли Империи, сокрушите врага!"
  - char: "essex_rad"
    side: "right"
    text:
      - "Ах, мисс Рома, вы ошиблись каналом!"
      - "На этом всё, Командир, свяжемся, когда появятся новые данные."

chapter2:
  rows:
  - char: "memphis_rad"
    side: "right"
    text:
      - "Командир, ход битвы складывается для нас на удивление удачно!"
      - "Враги, которых «бог» в спешке породил вокруг себя, уже полностью уничтожены нашим авангардом."
      - "Вражеские подкрепления, прибывающие со всех сторон, вступают в бой по частям, волна за волной, и даже не могут прорваться через наши заградительные флоты."
      - "На данный момент единственной переменной остается сам ложный бог."
      - "С самого начала боя он так ни разу и не атаковал. Неизвестно, связано ли это с тем, что он получил повреждения от удара «Святого копья»..."
      - "В настоящее время мы продолжаем собирать данные."
  - char: "shinano"
    side: "left"
    text:
      - "Мои силы сейчас находятся на самом пике."
      - "Если нам предстоит лобовое столкновение с богом, то мне следует быть на передовой. Почему же я оставлена здесь?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Не торопись так, мисс Синано."
      - "Если нашим условием победы является уничтожение ложного бога, то условием нашего поражения, несомненно, станет гибель Командира."
      - "Поэтому в защите Командира нельзя допускать ни малейшей небрежности."
      - "К тому же, оставаясь здесь, ты ведь можешь помочь Командиру координировать действия флотов «Багровой Оси», не так ли?"
  - char: "shinano"
    side: "left"
    text:
      - "В этом есть смысл, пусть так и будет."
  - char: "memphis_rad"
    side: "right"
    text:
      - "Командир, авангардный флот нанес серию ударов по истинной форме ложного бога."
      - "Удары не принесли никаких результатов, но и он... по-прежнему не предпринимает никаких действий."
      - "Флоты окружения заняли свои позиции. Продолжать атаки?"
  - char: "commander"
    side: "left"
    text:
      - "Да, всем сосредоточить огонь."
      - "Мы тоже продолжим продвигаться вперед..."
