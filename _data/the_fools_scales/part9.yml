chapter1:
  rows:
  - text:
      - "Со всех сторон раздался оглушительный грохот."
      - "После ухода Марко Поло механизмы, до этого бесцельно блуждавшие вокруг выставочной площади, начали стягиваться к павильону Доминиона Виши."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Марко Поло..."
  - char: "giuseppe_garibaldi"
    side: "right"
    text:
      - "Нет времени на вздохи, госпожа Венето."
      - "Эти Наблюдатели, кажется, снова направляются в нашу сторону."
  - char: "bolzano"
    side: "left"
    text:
      - "Госпожа Марко Поло не шутила... она действительно хочет с нами покончить."
  - char: "essex"
    side: "right"
    text:
      - "Внимание всем, во внешней акватории я обнаружила крупный флот серийных кораблей, приближающийся к выставке."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Флот серийных кораблей?! Это подкрепление от Империи?!"
  - char: "essex"
    side: "right"
    text:
      - "Боюсь, что нет. Эти серийные корабли не похожи на те, что стоят на вооружении Империи Сардиния, и к тому же... по пути они совершенно не вступают в столкновения с Наблюдателями."
      - "Сейчас я поделюсь с вами разведданными."

chapter2:
  rows:
  - text:
      - "Эссекс передала изображение с разведывательного самолета, которое через временную систему боевого командования было перенаправлено всем присутствующим."
  - char: "guichen"
    side: "left"
    text:
      - "Этот флот серийных кораблей... не в стиле Сирен."
  - char: "suffren"
    side: "right"
    text:
      - "...Я тоже никогда не видела подобных серийных моделей."
      - "Нет... подождите-ка, почему мне кажется, что чем больше я на них смотрю, тем более знакомыми они выглядят?"
  - char: "jeanne_d_arc"
    side: "left"
    text:
      - "У меня такое же чувство... Кажется, я их уже где-то видела."
  - char: "foch"
    side: "right"
    text:
      - "А... это же «Боевые молитвенные корабли» Трибунала! Разве Трибунал не строил раньше такой экспериментальный корабль?!"
      - "Эта партия — той же модели, что и тот экспериментальный боевой молитвенный корабль!"
      - "Жоффр, раз уж это связано с Трибуналом... ты знаешь, что это за флот?"
  - char: "joffre"
    side: "left"
    text:
      - "Судя по всему... это действительно флот Трибунала."
      - "Но я не знаю никаких подробностей."
      - "Я никогда их не видела, и госпожа Клемансо мне ничего о них не рассказывала."
      - "Но Керсен, будучи личным офицером разведки госпожи Клемансо, наверняка что-то знает, верно?"
  - text:
      - "Жоффр намеренно выделила слово «личным», а затем развела руками, переведя всеобщее внимание на Керсен."
      - "В сложившейся ситуации всем не терпелось выяснить происхождение и истинную сущность этого флота."
  - char: "kersaint"
    side: "left"
    text:
      - "Эм... насчет этого флота..."
  - char: "clemenceau_rad"
    side: "right"
    status: "is-red"
    text:
      - "Керсен, тебе сейчас удобно говорить?"
  - char: "kersaint"
    side: "left"
    text:
      - "Госпожа Клемансо... сейчас обстановка немного, скажем так, напряженная."
  - char: "clemenceau_rad"
    side: "right"
    status: "is-red"
    text:
      - "Хм~ Значит, говорить всё-таки можно."
      - "Слушай мой приказ, Керсен. Ты должна немедленно увести всех представительниц Доминиона Виши с территории выставки."
      - "Не обращай внимания на эти механизмы в акватории, они не станут препятствовать вашей эвакуации."
      - "Приказ ясен?"
  - char: "kersaint"
    side: "left"
    status: "is-yellow"
    text:
      - "Слушаюсь, госпожа Клемансо."
  - char: "clemenceau_rad"
    side: "right"
    status: "is-red"
    text:
      - "Спасибо за службу~ Выполняй приказ."
  - text:
      - "Короткий сеанс связи прервался. На какое-то время все погрузились в молчание."
  - char: "joffre"
    side: "left"
    status: "is-yellow"
    text:
      - "...Покинуть выставку? Что это значит?"
      - "Керсен, что еще тебе известно?"
  - char: "kersaint"
    side: "right"
    status: "is-yellow"
    text:
      - "Я знаю не больше вашего..."
      - "Но раз это приказ госпожи Клемансо, мы обязаны его выполнить."
  - char: "vittorio_veneto"
    side: "left"
    text:
      - "Вы издеваетесь?.. Доминион Виши тоже причастен к предательству Марко Поло?"
  - char: "guichen"
    side: "right"
    text:
      - "Вне всяких сомнений, епископ Клемансо и Марко Поло заодно."
  - char: "jeanne_d_arc"
    side: "left"
    text:
      - "Госпожа Клемансо... как она могла пасть так низко?"
  - char: "memphis"
    side: "right"
    text:
      - "Командир, судя по текущему положению дел, Клемансо из Доминиона Виши явно как-то связана с тем, что устроила Марко Поло."
      - "А это значит... тот флот Трибунала снаружи точно не является подкреплением."
  - char: "commander"
    side: "left"
    text:
      - "(Судя по всему, так оно и есть...)"
      - "(Однако, если это просто предательство, неужели нужно было делать всё так дерзко и открыто?)"
  - char: "prinz_eugen"
    side: "right"
    text:
      - "Ого~ Какое шокирующее развитие событий. Подумать только, среди нас оказались те, кто переметнулся на сторону Марко Поло."
  - char: "kersaint"
    side: "left"
    status: "is-yellow"
    text:
      - "Мне правда очень жаль... что в такой критический момент мы не сможем сражаться с вами плечом к плечу."
      - "Но солдаты обязаны подчиняться приказам... Раз госпожа Клемансо отдала приказ, мы должны ему повиноваться."
      - "Доминион Виши не предпринимал против вас никаких враждебных действий. Надеюсь, вы проявите понимание и позволите нам уйти..."
  - char: "pamiat_merkuria"
    side: "right"
    text:
      - "Вернее сказать, «пока еще» не предпринял никаких враждебных действий."
      - "А как только вы благополучно уйдете, флот Трибунала сможет делать всё, что ему вздумается~ Таков сценарий, верно?"
  - char: "prinz_eugen"
    side: "left"
    text:
      - "Командир, я считаю, что даже если мы не станем их уничтожать, мы всё равно не должны позволять им просто так уйти."
      - "Если мы останемся без заложников, Доминион Виши сможет без малейших колебаний направить на нас свои пушки, понимаешь?"
  - char: "commander"
    side: "right"
    text:
      - "(В их словах действительно есть смысл...)"
      - "(Намерения Доминиона Виши слишком очевидны. Они чуть ли не открыто заявляют: «стоит вам нас отпустить, и мы обратим оружие против вас».)"
      - "(И именно это... кажется подозрительным.)"
      - "(Что именно задумала Клемансо?)"
      - "Керсен, вы просите лишь о том, чтобы благополучно уйти?"
  - char: "kersaint"
    side: "left"
    status: "is-yellow"
    text:
      - "Да, именно так."
  - char: "commander"
    side: "right"
    text:
      - "Тогда что ты собираешься делать с павильоном Доминиона Виши и «Стеной Авроры», которая сейчас нас защищает?"
  - char: "kersaint"
    side: "left"
    status: "is-yellow"
    text:
      - "Я не совсем понимаю, о чем ты..."
      - "Госпожа Клемансо приказала мне лишь увести флот, она ничего не говорила о том, что ты упомянул."
  - char: "commander"
    side: "right"
    text:
      - "(Как я и думал... эта дерзкая выходка Доминиона Виши не так проста, как кажется на первый взгляд.)"
      - "Я позволяю вам уйти."
  - char: "kersaint"
    side: "left"
    status: "is-yellow"
    text:
      - "Большое спасибо... Ты точно не пожалеешь об этом решении."
  - char: "prinz_eugen"
    side: "right"
    text:
      - "А? Ты и правда вот так просто их отпустишь?"
  - char: "commander"
    side: "left"
    text:
      - "Вплоть до этого момента Доминион Виши не совершил никаких враждебных действий."
      - "Возможно, на родине Доминиона Виши произошло нечто такое, о чем нельзя заявлять открыто, что и послужило причиной этого странного приказа Клемансо."
      - "Керсен всего лишь подчиняется приказу начальства и мирно уходит, у нас нет причин её останавливать."
  - char: "prinz_eugen"
    side: "right"
    text:
      - "Ты же знаешь, что ты Командир лишь Лазурного пути. У флотов Железной Крови, Империи Сакуры и Империи Сардиния нет никаких причин подчиняться твоим приказам, верно?"
  - char: "commander"
    side: "left"
    text:
      - "Да, поэтому я собираюсь вас убедить."
      - "И не только представительниц Багровой Оси, но и Лазурного пути."
      - "Я хочу, чтобы вы согласились с этим решением не потому, что это приказ, а потому, что это правильно."
      - "Кризис уже наступил, и только объединив усилия, все фракции смогут преодолеть эти трудности."
      - "Разве в такой ситуации будет правильным нападать на тех, кто еще мгновение назад был нашим союзником, а сейчас не выказывает никакой враждебности?"
  - char: "prinz_eugen"
    side: "right"
    text:
      - "Даже если они могут оказаться нашими потенциальными врагами?"
  - char: "commander"
    side: "left"
    text:
      - "Даже если они могут оказаться нашими потенциальными врагами."
  - char: "prinz_eugen"
    side: "right"
    text:
      - "Хе-хе, я поняла. Железная Кровь поддерживает это решение."
      - "И причина именно в том, о чем ты сказал: не потому, что ты Командир Лазурного пути, а потому, что это правильно."
  - char: "shinano"
    side: "left"
    text:
      - "Я тоже."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Я... тоже не возражаю. Врагов вокруг и так уже тьма-тьмущая, так какая разница, если их станет немного больше."
      - "Однако я всё же надеюсь, что Доминион Виши не окажется по другую сторону баррикад."
  - char: "kersaint"
    side: "left"
    status: "is-yellow"
    text:
      - "Большое спасибо всем за понимание... Тогда мы откланиваемся."
  - char: "jeanne_d_arc"
    side: "right"
    text:
      - "Погоди, Керсен."
      - "Ты правда в глубине души считаешь, что происходящее сейчас с Доминионом Виши — это правильно?"
  - char: "kersaint"
    side: "left"
    status: "is-yellow"
    text:
      - "Жанна... В отличие от тебя, у нас нет выбора."
      - "Жоффр, Фош, Л’Индомтабль, уходим."
  - text:
      - "Вот так, под нарастающий грохот приближающихся Наблюдателей, флот Доминиона Виши покинул нас."
