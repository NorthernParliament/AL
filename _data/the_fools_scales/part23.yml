chapter1:
  rows:
  - char: "marco_polo"
    side: "left"
    text:
      - "Фридрих дер Гроссе, ответь мне."
      - "Раз уж ситуация и так висит на волоске, зачем ты подливаешь масло в огонь и провоцируешь бесконечные распри между фракциями?"
      - "Если мы не объединимся, нас ждет лишь верная смерть."
  - char: "friedrich_der_grosse"
    side: "right"
    text:
      - "Я, разумеется, это знаю. Но твои идеи оторваны от реальности."
      - "Между фракциями изначально существуют конфликты интересов, а Сирены лишь сильнее разжигают вражду."
      - "Даже если удастся создать видимость союза, исход будет не намного лучше, чем в прошлый раз с Лазурным путем."
      - "Если сжать в кулаке горсть сухого песка, песчинки не станут плотнее, они лишь просочатся сквозь пальцы."
      - "И вот это — действительно верная смерть."
  - char: "marco_polo"
    side: "left"
    text:
      - "Хорошо, даже если мы не станем объединять фракции, мы, по крайней мере, не должны подыгрывать планам Сирен."
      - "Разве, решив подчиниться Сиренам, мы не преумножим их силы и не сделаем ситуацию еще более непоправимой?"
  - char: "friedrich_der_grosse"
    side: "right"
    text:
      - "Война — это продолжение политики."
      - "Мало кто осознает, что наша война с Сиренами... подчиняется тому же правилу."
      - "Время еще не пришло, Марко Поло, наберись терпения."
      - "У меня еще есть дела. А ты отправляйся в Империю Сардиния и напиши ту партию, что отведена тебе в этой симфонии."

chapter2:
  rows:
  - text:
      - "Фридрих дер Гроссе развернулась и ушла, оставив Марко Поло совершенно одну в огромном зале."
  - char: "marco_polo"
    side: "left"
    text:
      - "Пф... И к чему столько пафоса."
      - "Ты — корабль-прототип, но и я, Марко Поло, тоже корабль-прототип!"
      - "Высшее оружие, созданное для борьбы с Сиренами!"
      - "Тратишь силы на междоусобицы и всякие мелочи. И кто из нас после этого близорук."
      - "Сирены сильны... но всегда найдется кто-то сильнее. Неужели в этом мире нет силы, способной превзойти их?"
      - "Я не верю, что на них нет управы."
      - "Просто подождите. Однажды я стану той, кто по-настоящему решит эту проблему."
      - "Я заставлю весь мир восхищаться моими великими деяниями и рукоплескать мне!"
