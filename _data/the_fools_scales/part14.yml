chapter1:
  rows:
  - text:
      - "Спустя некоторое время флот Доминиона Виши покинул территорию выставки и вышел в спокойные воды."
      - "Как и говорила Клемансо по связи, по пути они не встретили абсолютно никакого сопротивления."
  - char: "foch"
    side: "left"
    status: "is-yellow"
    text:
      - "Глядя на всё это, я уже и сама начинаю сомневаться, а не причастны ли мы напрямую к этому нападению."
      - "Керсен, здесь сейчас нет посторонних, может, теперь ты нам всё объяснишь?"
      - "Что вообще происходит, и что задумала госпожа Клемансо?"
  - char: "kersaint"
    side: "right"
    status: "is-yellow"
    text:
      - "Эм... По правде говоря, я действительно знаю не намного больше вашего."
      - "Госпожа Клемансо лишь сказала, что у неё есть один очень, очень грандиозный план."
      - "Но... мне нельзя раскрывать детали этого плана кому бы то ни было."
      - "В общем, если все будут просто действовать согласно приказам госпожи Клемансо... план непременно увенчается успехом."
  - char: "joffre"
    side: "left"
    status: "is-yellow"
    text:
      - "Даже ты не знаешь никаких деталей, а я и вовсе впервые слышу о самом плане..."
      - "Проявлять такую осторожность даже внутри Трибунала... Это значит, что если о плане будут знать двое вместо одного, это уже создаст колоссальные риски."
      - "Госпожа Клемансо, что же вы такое делаете..."
  - char: "clemenceau_rad"
    side: "right"
    status: "is-red"
    text:
      - "Керсен, вижу, вы уже достигли первых координат."
      - "Отступление прошло гладко?"
  - char: "kersaint"
    side: "left"
    status: "is-yellow"
    text:
      - "В самом начале возникла небольшая заминка, но тот Командир оказался благоразумным человеком."
      - "Мы благополучно ушли, не вступая ни в какие конфликты."
  - char: "clemenceau_rad"
    side: "right"
    status: "is-red"
    text:
      - "Не только благоразумным, но и умным."
      - "Отлично. Сейчас я отправлю тебе вторые координаты, веди флот туда для перегруппировки."
      - "Всем приготовиться к бою. Но кого бы или что бы вы ни встретили по пути, огонь не открывать."
      - "Ждите моих дальнейших приказов."
  - char: "kersaint"
    side: "left"
    status: "is-yellow"
    text:
      - "Принято!"