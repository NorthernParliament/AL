chapter1:
  rows:
  - char: "memphis"
    side: "left"
    text:
      - "Командир, мы только что получили подтверждение: порт Тулон, где базируется флот Доминиона Виши, захлестнула волна врагов."
      - "Как странно, разве Доминион Виши... не присоединился к Марко Поло?"
  - char: "commander"
    side: "right"
    text:
      - "Действия Доминиона Виши после начала инцидента действительно заставляют задуматься."
      - "С одной стороны, их флот покинул территорию выставки и отправил эскадры серийных кораблей в наступление на неё."
      - "Но с другой стороны, ни одна из кансен так и не вступила в бой, а «Стена Авроры» павильона Виши по-прежнему не была отключена."
      - "Возможно, ситуация в Доминионе Виши схожа с той, что сложилась в Империи Сардиния, или же всё еще сложнее..."
  - char: "memphis"
    side: "left"
    text:
      - "Командир, что нам делать? Оставить всё как есть или прийти на помощь?"
  - char: "commander"
    side: "right"
    text:
      - "А ты как думаешь?"
  - char: "memphis"
    side: "left"
    text:
      - "Хм... Я думаю, что если есть такая возможность, нам всё же стоит им помочь."
      - "Твой недавний анализ был весьма точен: судя по текущей ситуации, Доминион Виши не стал полностью переходить на сторону наших врагов."
      - "А прямо сейчас они и вовсе сражаются с нашими общими врагами."
      - "Возникли ли у них внутренние разногласия, или же Клемансо пытается усидеть на двух стульях..."
      - "Как минимум... я считаю, что за них стоит побороться."
  - char: "commander"
    side: "right"
    text:
      - "Да, я тоже так думаю."
      - "Свяжи меня с Уорспайт. Гибралтарский флот Королевского Флота сейчас находится в западной части Средиземного моря, они должны справиться со спасательной миссией."
  - char: "memphis"
    side: "left"
    text:
      - "Слушаюсь!"
