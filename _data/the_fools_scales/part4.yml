chapter1:
  rows:
  - text:
      - "Отголоски звона колокольчиков всё ещё звучат в ушах."
      - "Чувство удушья исчезло. Представшее перед глазами... это довольно необычное пространство."
  - char: "commander"
    side: "left"
    text:
      - "*Присмотреться*"
  - text:
      - "Под темным небом в глаза бросаются ярко окрашенные врата тории."
      - "Шквальные ветра дуют с двух противоположных сторон, подхватывая морские волны и сталкивая их друг с другом."
      - "В небе виднеются перевернутые павильоны и башни, словно какой-то мираж."
  - char: "commander"
    side: "left"
    text:
      - "*Вглядеться*"
  - text:
      - "Я пристально вглядываюсь в парящие в небесах строения."
      - "Позади этих иллюзорных, бесплотных зданий и облаков, кажется, виднеются некие механические конструкции..."
      - "Они в точности повторяют механизмы, замеченные внутри черного солнца, и тоже представляют собой лишь крошечную вершину айсберга."
      - "……………………"
  - char: "commander"
    side: "left"
    text:
      - "*Осмотреться*"

chapter2:
  rows:
  - text:
      - "Там, на самом краю видимости, под вратами тории мерещится красно-черный силуэт."
      - "Этот силуэт, похоже, тоже заметил мой взгляд, обернулся и посмотрел в мою сторону."
      - "Кажется, возникло какое-то необъяснимое чувство ностальгии..."
      - "Но откуда же взяться этой ностальгии?"
      - "Пока я размышлял об этом, загадочный силуэт просто растворился в воздухе."

chapter3:
  rows:
  - char: "shinano"
    side: "left"
    text:
      - "Кто здесь?"
  - text:
      - "Этот голос и этот облик..."

chapter4:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Синано?"


chapter5:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Синано!"

chapter6:
  rows:
  - char: "shinano"
    side: "right"
    text:
      - "...Хм? Снова ты."
      - "Наша с тобой связь воистину удивительна... Не ожидала, что мы вновь встретимся во сне."
  - char: "commander"
    side: "left"
    text:
      - "Знаешь что нибудь о том красно-черном силуэте вдалеке?"
  - char: "shinano"
    side: "right"
    text:
      - "...Красно-черный силуэт? Я ничего подобного не видела."
      - "Вернее будет сказать, что кроме тебя я никогда не встречала здесь никого другого."
  - char: "commander"
    side: "left"
    text:
      - "...Никогда?"
  - char: "shinano"
    side: "right"
    text:
      - "Именно так. Это место — брешь между иллюзией и реальностью, комната отдыха, ведущая в царство снов."
      - "Оно для меня словно вторая родина."
      - "И хотя чаще я попадаю в сновидения напрямую, порой мне приходится ненадолго задерживаться здесь."
      - "Вот только жаль... сегодняшний сон пришел совсем не вовремя."
      - "Боюсь, я пропущу захватывающее представление на церемонии закрытия."
  - char: "commander"
    side: "left"
    text:
      - "Церемония закрытия... Неужели речь о церемонии закрытия Всемирной выставки Империи Сардиния?"
      - "Я слышал, ты прибыла туда в качестве представителя фракции Империя Сакуры."
  - char: "shinano"
    side: "right"
    text:
      - "Ты... и впрямь знаешь об этом."
      - "……Выходит, что в реальности мы с тобой находимся в одном мире?"
  - char: "commander"
    side: "left"
    text:
      - "Похоже на то... Поистине удивительно."
  - char: "shinano"
    side: "right"
    text:
      - "...Мне и в голову не приходило, что такое возможно."
      - "Если так посудить, выходит, мы с тобой даже сражались плечом к плечу."
      - "Как любопытно."
  - text:
      - "Действительно, неожиданный поворот событий."
      - "Хотя причину нашей встречи с Синано во сне еще предстоит выяснить."
      - "Однако, учитывая, что наша первая встреча произошла в особом Зеркальном море Сирен..."
      - "А в здешних небесах, кажется, тоже можно разглядеть механические устройства..."
      - "Возможно... так называемый сон — это не просто призрачная иллюзия."
      - "Конечно, на этот вопрос, похоже, не сможет ответить даже Синано. Но, возможно, у неё есть какие-то догадки насчет перезвона колокольчиков."
  - char: "shinano"
    side: "right"
    text:
      - "..Звон ветряных колокольчиков, отдающийся в ушах?"
      - "Хм... Я и правда время от времени его слышу."
      - "Этот звук подобен некоему путеводному знаку в мире снов."
      - "Часто, вслед за звоном колокольчиков, можно увидеть интересные сновидения."
      - "И благодаря ему иногда даже удается вырваться из кошмаров."
      - "Однако... то, что я увидела вчера после звона колокольчиков, было довольно пугающим."
      - "В золотом небе пылало черное солнце."
      - "Его пламя не излучало тепла, словно ледяная черная дыра, от чего мурашки бежали по коже..."
  - char: "commander"
    side: "left"
    text:
      - "Черное... солнце?!"
  - text:
      - "Я рассказываю Синано о том, что пережил до того, как оказался здесь."

chapter7:
  rows:
  - char: "shinano"
    side: "right"
    text:
      - "Ты... тоже его видел..."
      - "Это черное солнце невероятно опасно..."
      - "Ранее во сне я слышала предостережение. Грядет некая опасная сущность..."
      - "Погоди-ка... Мои воспоминания почему-то не сходятся."
      - "Я помню, как на рассвете мне приснилось черное солнце... а следующее воспоминание — я уже на площади, где проходит церемония закрытия."
      - "Странно, я совершенно не могу вспомнить... что было до начала церемонии."
      - "А ты помнишь, что происходило до начала церемонии закрытия?"
  - char: "commander"
    side: "left"
    text:
      - "Я изо всех сил напрягаю память, но могу вспомнить лишь то, как мы с Мемфис и Хеленой покидали павильон Союза Орла."
      - "А затем — мы уже на площади, слушаем речь Марко Поло."
      - "Так вот почему тогда возникло это странное ощущение, что что-то не так..."
  - char: "shinano"
    side: "right"
    text:
      - "……Подумать только, и у тебя то же самое."
      - "Похоже, дурное предзнаменование сбылось. Мы должны немедленно вырваться из этого сна."
  - char: "commander"
    side: "left"
    text:
      - "Но как нам отсюда выбраться?"
  - char: "shinano"
    side: "right"
    text:
      - "Хм... Только ждать. Ждать, пока нас не разбудят снаружи, или пока мы не проснемся сами..."

chapter8:
  rows:
  - text:
      - "Снова звон ветряных колокольчиков..."
  - char: "shinano"
    side: "right"
    text:
      - "Это чувство... время пробуждения близко."
      - "Хе-хе, похоже, нам повезло. Что ж, тогда до встречи в реальном мире, когда мы оба проснемся."
      - "Запомни, мой канал связи..."
