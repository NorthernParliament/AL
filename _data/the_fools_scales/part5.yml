chapter1:
  rows:
  - text:
      - "Последний день Всемирной выставки. Церемония закрытия."
      - "На залитой солнцем выставочной площади повсюду развеваются пестрые флаги."
      - "Весёлая музыка в исполнении оркестра разносится на километры от Колизея."
  - char: "memphis"
    side: "left"
    text:
      - "Вау... Так вот она какая, эта Всемирная выставка."
      - "Когда мы прибыли пару дней назад, здесь было довольно безлюдно. Не ожидала, что в день закрытия будет так много народу!"
      - "Я даже сама невольно заразилась этим воодушевлением!"
  - char: "helena"
    side: "right"
    text:
      - "...Редко увидишь Мемфис такой взволнованной."
  - char: "memphis"
    side: "left"
    text:
      - "Атмосфера здесь такая зажигательная, даже на меня это влияет."
  - char: "commander"
    side: "right"
    text:
      - "(Время... повернуло вспять?)"
  - char: "memphis"
    side: "left"
    text:
      - "...Хм? Командир, ты так побледнел... Ты плохо себя чувствуешь?!"
  - char: "helena"
    side: "right"
    text:
      - "Командир... ты в порядке?"
  - char: "commander"
    side: "left"
    text:
      - "Сейчас и впрямь... кажется, что-то не так."
      - "Мемфис, ты ведь собиралась пойти купить сувениры, пока церемония закрытия еще не началась?"
  - char: "memphis"
    side: "right"
    text:
      - "...Да, а как ты узнал?"
  - char: "commander"
    side: "left"
    text:
      - "На самом деле, мы все уже однажды пережили эту церемонию закрытия."
      - "Хотя я и понятия не имею... почему такое произошло."
  - char: "memphis"
    side: "right"
    text:
      - "Командир, о чем ты говоришь... Я не совсем понимаю."
  - char: "helena"
    side: "left"
    text:
      - "...Я сейчас же свяжусь с администрацией, чтобы они прислали бригаду медиков."
  - text:
      - "...Похоже, ни Мемфис, ни Хелена не помнят того, что мы уже пережили."
      - "Я пытаюсь связаться с Синано, но коммуникатор никак не может установить соединение."
  - char: "commander"
    side: "left"
    text:
      - "Хелена, Мемфис, планы меняются. Мы немедленно направляемся в павильон Империи Сакуры."
      - "А заодно свяжитесь с Эссекс, пусть все будут готовы к бою."
  - char: "memphis"
    side: "right"
    text:
      - "Э-э...? В павильон Империи Сакуры? И приготовиться к бою...?"
  - char: "helena"
    side: "left"
    text:
      - "Командир, ты... что-то заметил...?"
  - char: "commander"
    side: "right"
    text:
      - "Да, надвигается серьезный кризис."
  - char: "memphis"
    side: "left"
    text:
      - "Серьезный кризис... Поняла, немедленно прокладываю маршрут."

chapter2:
  rows:
  - text:
      - "Вместе с Хеленой и Мемфис мы пробираемся сквозь толпу, направляясь к павильону Империи Сакуры."
  - char: "suruga"
    side: "left"
    text:
      - "Ну правда, в следующий раз не убегай так далеко."
  - char: "shimakaze"
    side: "right"
    text:
      - "Мне очень жаль, госпожа Суруга, не думала, что заблужусь на выставке..."
  - char: "alfredo_oriani"
    side: "left"
    text:
      - "Аха-ха... Сегодня ведь церемония закрытия, количество людей просто не сравнить с прошлыми днями."
      - "А теперь позвольте мне проводить вас в VIP-зону Империи Сакуры."
      - "С таким проводником, как я, мы точно доберемся без происшествий!"
  - char: "suruga"
    side: "right"
    text:
      - "Тогда мы полагаемся на тебя, Альфредо."
  - char: "shimakaze"
    side: "left"
    text:
      - "Эхе-хе... Полагаемся на тебя, Альфредо!"
  - text:
      - "Неподалеку дежурный персонал выставки от Империи Сардиния, похоже, помог найти потерявшихся представительниц Империи Сакуры."
  - char: "commander"
    side: "left"
    text:
      - "Хм... Девушки из Империи Сакуры. Если спросить у них, мы сможем узнать, где находится Синано."
  - char: "memphis"
    side: "right"
    text:
      - "А? Ты собираешься просто подойти и спросить?"
      - "Они же из Багровой Оси... Если что-то пойдет не так, это может обернуться дипломатическим скандалом!"
  - char: "commander"
    side: "left"
    text:
      - "Ничего страшного. Как только мы найдем Синано, Империя Сакуры встанет на нашу сторону."
  - char: "memphis"
    side: "right"
    text:
      - "А?! Вы же с Синано ведь ни разу даже не виделись?"
  - char: "helena"
    side: "left"
    text:
      - "Нет... Командир и Синано... встречаются не впервые."
  - char: "commander"
    side: "right"
    text:
      - "Да, мы уже виделись с ней во «снах»."
  - char: "memphis"
    side: "left"
    text:
      - "В-вот как..."
      - "Тогда мы..."
  - char: "helena"
    side: "right"
    text:
      - "Командир, берегись!"

chapter3:
  rows:
  - text:
      - "Атака началась без малейшего предупреждения."
      - "игантский механизм рухнул с небес, сокрушая выставочные павильоны, а вместе с ними — радость и покой, царившие на площади."
  - char: "helena"
    side: "left"
    text:
      - "……Что это вообще такое?"
  - char: "memphis"
    side: "right"
    text:
      - "Хелена, немедленно подтверди маршрут эвакуации!"
  - char: "helena"
    side: "left"
    text:
      - "Есть…!"
  - char: "memphis"
    side: "right"
    text:
      - "Командир, ты в порядке?!"
  - char: "commander"
    side: "left"
    text:
      - "Я лишь наглотался дыма и пыли, но не ранен."
  - char: "memphis"
    side: "right"
    text:
      - "Слава богу..."
      - "Вызываю всех дежурных, черный код, черный код, необходимо немедленно эвакуировать приоритетную цель..."
      - "Повторяю, черный код..."
