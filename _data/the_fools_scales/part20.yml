chapter1:
  rows:
  - text:
      - "Везувий в этот момент по-прежнему был окутан безмятежной тишиной."
      - "Безудержно расползающаяся белая субстанция по какой-то причине предпочла обойти это место стороной."
      - "Шум сражений, гремевший повсюду, здесь тоже полностью стихал."

chapter2:
  rows:
  - char: "marco_polo_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Клемансо, где ты сейчас?"
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Я как раз направляюсь к тому тайному убежищу, которое ты нам одолжила."
      - "Флот Трибунала тоже почти на месте. Мы немного перегруппируемся и выступим к территории выставки."
  - char: "marco_polo_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Отлично, наконец-то хоть какие-то хорошие новости."
      - "Час сошествия близок, а этот раздражающий шум всё никак не утихнет... Всё-таки только на тебя и можно положиться!"
      - "Прежде чем ты вступишь в бой, у меня для тебя тоже есть хорошие новости."
      - "Хе-хе-хе, знаешь ли ты, что я специально выбрала расположение того убежища, которое тебе предоставила."
      - "Оно находится всего в одном квартале от секретного комплекса Сената."
      - "Да-да, того самого комплекса, где ведется разработка корабля-прототипа Фландр."
      - "...Наша совместная Фландр уже завершена."
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Уже завершена...? Что ж, это действительно неожиданная новость."
  - char: "marco_polo_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "А-ха-ха-ха~ Я хотела сделать тебе сюрприз, поэтому до сих пор ничего не рассказывала."
      - "Клемансо, я прямо сейчас передаю тебе полномочия для пробуждения Фландр."
      - "Прикажи ей... нет, лучше сама поведи её, а также твой флот Трибунала, прямо на выставку."
      - "Я также отправлю Тренто тебе на помощь."
      - "В этот раз вы обязаны прихлопнуть этих назойливых мух!"
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Я поняла."
      - "Не волнуйся, я позабочусь об этих неприятностях, а ты просто сосредоточься на ритуале..."
      - "...Ох, просто сбросила вызов..."

chapter3:
  rows:
  - char: "clemenceau"
    side: "left"
    text:
      - "...Раскрывать все карты так рано — это уж слишком опрометчиво."
      - "А я-то думала, что ты составишь мне компанию за игорным столом подольше..."
      - "Какая жалость."
  - text:
      - "Клемансо покачала головой, подняла руку и несколько раз коснулась экрана перед собой..."
  - char: "kersaint_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Госпожа Клемансо, мы уже находимся на заданных позициях в режиме ожидания. Что нам делать дальше?"
  - char: "clemenceau"
    side: "left"
    text:
      - "Слушай внимательно. Скоро к вам присоединится корабль-прототип по имени Фландр."
      - "Хотя она и является плодом нашего сотрудничества с Империей Сардиния, она полностью подчиняется приказам Трибунала и абсолютно надежна."
      - "Когда она прибудет, она тоже перейдет под твое командование."
      - "Затем вам нужно будет отправиться к новым координатам, которые я тебе вышлю, и приготовиться к бою."
      - "Ваша цель — Тренто META, которая вскоре должна прибыть в тот район."
      - "Когда она появится, она будет считать вас союзниками и не станет ожидать нападения."
      - "Вы должны нанести внезапный удар и захватить её."
      - "Однако топить её запрещено, достаточно просто лишить её боеспособности."
      - "После выполнения задания доложите мне, а затем ждите на месте моих дальнейших приказов."
      - "Хм... Возможно, от шока ты пропустила мимо ушей часть информации. Мне повторить приказ еще раз?"
  - char: "kersaint"
    side: "right"
    text:
      - "Нет, не нужно... Я всё запомнила, госпожа Клемансо!"
      - "Задание будет выполнено!"
  - char: "clemenceau"
    side: "left"
    text:
      - "Отлично."
  - text:
      - "Завершив сеанс связи с Керсен, Клемансо закрыла все парящие перед ней панели."
      - "Она одернула рукава и воздела ввысь свой посох."
      - "И тогда Везувий... начал извергаться."

chapter4:
  rows:
  - char: "clemenceau"
    side: "left"
    text:
      - "Судейский механизм, кодовое имя «Господство» — величайший шедевр Трибунала Ортодоксии Ирис."
      - "...Застилающий солнце густой дым, вырывающееся наружу бушующее пламя, и механический рыцарь, медленно появляющийся в его зареве."
      - "Разве можно представить себе более подходящие декорации для кульминации нашей пьесы?"
      - "Что ж, а теперь и мне пора по-настоящему отправиться в путь..."
      - "Но в одном я тебе всё-таки не солгала, Марко Поло."
      - "По дорогам, покрытым «Следами Бога», и впрямь очень тяжело передвигаться."
