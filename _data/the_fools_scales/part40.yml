chapter1:
  rows:
  - text:
      - "В безлюдном порту воздух пошел легкой рябью."
  - char: "andrea_doria"
    side: "left"
    text:
      - "............"
      - "Поистине кошмарное зрелище..."
  - text:
      - "Андреа подняла взгляд к небу, где были отчетливо видны лучи света, пронзающие ночную тьму."
  - char: "andrea_doria"
    side: "left"
    text:
      - "............"
      - "...Как я и думала, бегство не решает проблем."
  - text:
      - "Андреа покачала головой и легким движением смахнула скопившуюся на панели управления пыль."
      - "Ее действия были настолько отточенными, словно она уже давно знала о существовании здесь этого устройства и репетировала этот момент бесчисленное множество раз."
  - char: "andrea_doria"
    side: "left"
    text:
      - "...Подарить тьме свет, говорите?"
      - "Тогда я тоже внесу свою лепту."

chapter2:
  rows:
  - text:
      - "Из порта Александрии в небо взмыл луч света."
      - "Воздух снова пошел легкой рябью, и всё вновь погрузилось в безмятежную тишину."
      - "...Словно здесь никого и не было."
