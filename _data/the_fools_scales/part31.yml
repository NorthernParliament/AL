chapter1:
  rows:
  - char: "prinz_eugen"
    side: "left"
    text:
      - "Ля-ля♪ ля-ля-ля-ля♪ ля-ля, ля-ля, ля-ля, ля-ля♪"
      - "Ля-ля-ля, ля-ля, ля-ля-ля♪"
      - "Крепость Мальта~ А вот и я!"
  - char: "nelson"
    side: "right"
    text:
      - "………………"
  - char: "prinz_eugen"
    side: "left"
    text:
      - "Хм? Не стой как вкопанная, мисс Нельсон, где же приветственные слова?"
  - char: "nelson"
    side: "right"
    text:
      - "Да ты…………"
      - "Фух……"
      - "Добро-пожаловать-в-крепость-Мальта-Королевского-Флота!"
  - char: "prinz_eugen"
    side: "left"
    text:
      - "Вот так-то лучше!"
      - "Хорошо, что я догадалась заранее оставить Z2 на выставке вместе с Командиром."
      - "Иначе я бы не смогла в полной мере насладиться этим моментом без её нравоучений, а-ха-ха-ха..."
  - char: "odin"
    side: "right"
    text:
      - "Принц Ойген………………"
  - char: "prinz_rupprecht"
    side: "left"
    text:
      - "Не смотрите на меня так, я эту особу знать не знаю... честное слово, вообще не знаю..."
  - char: "nelson"
    side: "right"
    text:
      - "Ах да, спасибо Командиру!"
      - "Спасибо всем вам, подкреплению, которое Командир прислал на Мальту!"
      - "Сказать это было гораздо приятнее~"
  - char: "rodney"
    side: "left"
    text:
      - "...Как и сказала ранее госпожа Илластриес, на время этой операции двери крепости Мальта открыты для всех фракций, участвующих в битве."
      - "Пожалуйста, проходите, наше прибывшее издалека подкрепление."
      - "Добро пожаловать в крепость Мальта!"
