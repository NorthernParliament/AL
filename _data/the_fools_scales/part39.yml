chapter1:
  rows:
  - text:
      - "Глядя на разрушенный трон перед собой."
      - "Клемансо невольно вспомнила тот полдень, когда они впервые встретились..."

chapter2:
  rows:
  - text:
      - "Собрание уже давно закончилось, и в этой небольшой переговорной теперь царили пустота и тишина."
      - "Лишь две совершенно непохожие друг на друга девушки всё еще оставались на своих местах, рассеянно черкая что-то в своих блокнотах."
  - char: "marco_polo"
    side: "left"
    text:
      - "Слушай... так ты и есть та самая Клемансо из Доминиона Виши?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Да, госпожа Марко Поло, здравствуй."
  - char: "marco_polo"
    side: "left"
    text:
      - "Фридрих дер Гроссе ушла уже довольно давно, а ты чего сидишь?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Пока воспоминания свежи, я обдумываю и систематизирую суть прошедшего собрания."
  - char: "marco_polo"
    side: "left"
    text:
      - "«Обдумываешь и систематизируешь суть»... Ну ты и мастерица говорить казенным языком."
      - "На самом собрании ты и слова не проронила. Вы с Фридрих дер Гроссе тоже не ладите?"
  - char: "clemenceau"
    side: "right"
    text:
      - "Как ты могла такое подумать? Узы между Доминионом Виши и Железной Кровью нерушимы...."
  - char: "marco_polo"
    side: "left"
    text:
      - "Ладно-ладно, здесь ведь больше никого нет!"
      - "Хватит уже этих официальных речей, у меня отличная наблюдательность."
      - "Скажу тебе по секрету — я тоже."
      - "Раз уж её планы тебя не привлекают, не хочешь послушать мои?"
      - "Давай объединим усилия и вместе совершим нечто поистине грандиозное..."
