chapter1:
  rows:
  - text:
      - "Везувий — действующий вулкан, в прошлом похоронивший древний город Помпеи и по праву считающийся самым опасным вулканом Европы."
      - "В этот момент на краю обрыва стояла роскошно одетая женщина в черном плаще и смотрела на кратер, находящийся на высоте тысячи двухсот метров над уровнем моря."
      - "Бесчисленные полупрозрачные окна связи, парящие в воздухе вокруг неё, ясно давали понять, что она здесь не просто ради осмотра достопримечательностей."
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Поднимешься высоко — увидишь далеко."
      - "Свежий воздух не только помогает сохранять ясный ум, но и снимает усталость от ожидания."
      - "Всё уже готово."
      - "Пора бы уже подуть восточному ветру..."
  - char: "marco_polo_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Госпожа Клемансо! Ты меня слышишь?! Где ты сейчас?"
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "А, это ты, Марко Поло. Я уже добралась до окраин Рима."
      - "Дороги, покрытые «Следами Бога», совершенно не предназначены для передвижения, так что мне пришлось изрядно потрудиться."
  - char: "marco_polo_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Поэтому я и говорила тебе, не тяни до последней минуты!"
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "А если бы я пришла слишком рано и вызвала подозрения?"
  - char: "marco_polo_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Ладно, ладно... не буду с тобой спорить."
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "...Судя по твоему тону, план идет не так гладко, как хотелось бы?"
  - char: "marco_polo_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Там, где всё гладко — всё очень гладко, а вот там, где нет... всё из рук вон плохо!"
      - "Я просто в бешенстве! Представляешь, эти идиотки на выставке всё еще продолжают упрямо сопротивляться!"
      - "Я хотела мобилизовать флот Империи Сардиния для их подавления, но эти зашоренные тупицы только и знают, что твердить: «Венето, Венето, Венето»!"
      - "Они вообще ни во что меня не ставят, и ни одна не подчиняется моим приказам!"
      - "И что вообще не так с твоим павильоном на выставке?! Неужели нельзя дистанционно отключить эту мешающую «Стену Авроры»?!"
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Если бы её можно было так легко отключить дистанционно, её бы не называли неприступным божественным барьером."
      - "К тому же, это всё-таки подделка, лишь прикрывающаяся именем божества. Вряд ли она сможет остановить настоящие «Механизмы Бога», верно?"
  - char: "marco_polo_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Если взяться за атаку всерьез, то так оно и будет! Но, эх..."
      - "Ты же знаешь, что сейчас все мои силы уходят на ритуал."
      - "Сейчас сошествие Бога еще не завершено, я должна сосредоточиться на ритуале и не могу отвлекаться на управление Механизмами Бога."
      - "Во всём виноваты те несколько особо проницательных, которые с самого начала почуяли неладное... Иначе этот шаг вообще бы не понадобился!"
      - "Флот Доминиона Виши всё еще в режиме ожидания?"
      - "Прикажи им вступить в бой и вырвать эту занозу на выставке!"
      - "Не забывай о нашем уговоре: если сейчас мой план сорвется, то и твоим мечтам придет конец!"
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Само собой. Флот Доминиона Виши не будет сидеть сложа руки."
      - "Я сейчас же отдам приказ основным силам Доминиона, ожидающим в Тулоне, вступить в бой."

chapter2:
  rows:
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Жан Бар, ты меня слышишь?"
  - char: "jean_bart_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Клемансо...? Наконец-то приказ о выдвижении?"
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Да, наконец-то приказ о выдвижении."
      - "Ты ведь уже приготовилась к выходу, верно?"
  - char: "jean_bart_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "К чему эти вопросы? Мы тут места себе не находим, наблюдая, как эти монстры бесчинствуют снаружи."
      - "Говори, с какими врагами мы разберемся в первую очередь?"
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Выставочная площадь. Враги прямо там, на выставке."
      - "Жан Бар, я приказываю тебе повести за собой основные силы флота Доминиона и вместе с Механизмами Бога Марко Поло уничтожить всех, кто сейчас находится на территории выставки."
  - char: "jean_bart_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Что ты сказала?..."
      - "Объединиться с этими монстрами... чтобы уничтожить на выставке... всех до единого?!"
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Да. Убивать всех, никого не оставлять в живых."
      - "Не волнуйся, я заранее вывела наш собственный флот."
      - "Те, кто сейчас остался на выставке, заслуживают своей участи."
      - "Королевский Флот, Союз Орла, Северный Парламент, Свободный Ирис, Железная Кровь, Империя Сакуры, Империя Сардиния."
      - "Предавшие нас союзники, вторгшиеся к нам враги, пособники, наживающиеся на чужой беде, и зрители, хладнокровно наблюдавшие со стороны."
      - "Каждая из этих фракций приложила руку к страданиям, которые мы перенесли."
      - "А сейчас перед нами отличная возможность покончить с ними всеми одним разом, разве не так?"
      - "Неужели ты никогда об этом не думала?"
      - "О том, чтобы однажды уничтожить их флоты, а затем и стереть в порошок их государства."
      - "Поквитаться за унижения, которые мы пережили в прошлом, и отомстить за все наши страдания."
      - "Настал час вершить суд."
  - char: "jean_bart_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Клемансо... ты, кажется, заходишь слишком далеко..."
      - "Разве выплеск эмоций может заменить здравый смысл?"
      - "Даже если в прошлом между нами и ими было множество обид и конфликтов..."
      - "Но сейчас... даже мне понятно, что эти свалившиеся с неба монстры... вот наша настоящая угроза."
      - "Если мы позволим им действовать безнаказанно, они могут уничтожить наш мир, уничтожить саму нашу цивилизацию!"
      - "Даже если мы не станем сейчас объединяться со всеми фракциями, мы, по крайней мере, не должны сами провоцировать междоусобицу и заниматься... подобной низостью."
      - "А ты считаешь этих тварей своими союзниками?"
      - "Прямо в эту секунду эти монстры бесчинствуют на нашей земле!"
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Да, я это вижу."
      - "И я считаю, что они отлично справляются."
      - "Судный день настал. Все грешники предстанут перед заслуженным судом, и прячущаяся на наших землях грязь, естественно, не станет исключением."
      - "Не забывай о тех ужасах, через которые прошла Ортодоксия Ирис, а также о том, что пережила ты... что пережил наш флот."
  - char: "jean_bart_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "...Ты сошла с ума, Клемансо."
      - "Я не могу позволить твоему безумию распространяться дальше..."
      - "Поэтому я не могу подчиниться твоему приказу оставить нашу родину в огне и повести флот вместе с этими монстрами в атаку на выставку..."
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Жан Бар, ты больше не хочешь отомстить?"
  - char: "jean_bart_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Я никогда не забывала о мести. Но мы не должны превращаться в тех, кем движет слепая злоба..."
      - "Флот Ирис больше не станет чьей-то пешкой, творящей ошибки, и мы не станем покорно ждать своей смерти."
      - "Сейчас мы покинем порт и вступим в бой, чтобы защитить нашу родину."
      - "Если твои «союзники» встанут у меня на пути, я уничтожу их."
      - "Если ты встанешь у меня на пути... я уничтожу и тебя."
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Ты еще не забыла, что я — Черный Кардинал Доминиона Виши?"
  - char: "jean_bart_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Конечно. Но в то же время... ты еще и моя младшая сестра."
      - "Однако, ты сошла с ума... Рыцари Ортодоксии больше не станут подчиняться приказам безумцев."
      - "И уж тем более они не станут слушать ту жалкую клоунессу, нацепившую на себя корону Святого Престола, что прячется за твоей спиной."
  - char: "marco_polo_rad"
    side: "left"
    status: "is-yellow"
    text:
      - "Ты! Ч-ч-ч-что ты сказала?!!!!"
      - "Дерзкая нахалка! За столь чудовищное неуважение я предам тебя отлучению!"
      - "Госпожа Клемансо! Предупреждаю, даже не думай меня останавливать!"
  - char: "clemenceau_rad"
    side: "right"
    status: "is-red"
    text:
      - "Я объявляю Жан Бар, а также всех, кто примкнет к её мятежу, немедленно изгнанными из Доминиона Виши. Можешь поступать с ней как знаешь."
  - char: "jean_bart_rad"
    side: "left"
    status: "is-yellow"
    text:
      - "...Пеняй на себя, Клемансо."

chapter3:
  rows:
  - text:
      - "Из коммуникатора Клемансо одновременно раздались два щелчка прерванной связи."
  - char: "clemenceau"
    side: "left"
    status: "is-red"
    text:
      - "Хе-хе... Буря уже началась."
      - "И что же ты предпримешь дальше, Командир?"
