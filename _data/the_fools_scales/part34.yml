chapter1:
  rows:
  - text:
      - "После активации оборудования в Авиньоне Ришелье не стала сразу же отправляться к следующей цели, а вместо этого с тревогой рассматривала карту."
  - char: "richelieu"
    side: "left"
    text:
      - "Только на один Авиньон ушло столько времени..."
      - "На остальных участках всё идет гладко, мы не можем допустить, чтобы Ирис тянул всех назад..."
  - char: "lyon"
    side: "right"
    text:
      - "Госпожа Ришелье, как насчет того, чтобы выступить с речью и призвать все гарнизоны к действию?"
      - "Если они согласятся сотрудничать, это значительно ускорит наше продвижение."
  - char: "richelieu"
    side: "left"
    text:
      - "Эх... Я как раз об этом думала."
      - "Но, боюсь, мой титул кардинала сейчас не имеет особого веса на родине."
      - "К тому же... земли бывшей Ортодоксии Ирис сейчас далеко не полностью находятся под контролем наших гарнизонов."
      - "Хоть это и рискованно, но дальше нам придется разделиться."
      - "Я беру на себя направление столицы. Жан Бар, ты отвечаешь за регион Бретань, а ты, Марсельеза — за Нормандию."
  - char: "marseillaise"
    side: "right"
    text:
      - "Можете смело положиться на меня, кардинал Ришелье."
  - char: "jean_bart"
    side: "left"
    text:
      - "С моей стороны... флот Тулона не в лучшем состоянии после череды непрерывных боев. Риск заходить глубоко на вражескую территорию в одиночку слишком велик."
  - char: "richelieu"
    side: "right"
    text:
      - "В таком случае, товарищи со средними и тяжелыми повреждениями воспользуются узлом в Авиньоне, чтобы вернуться на выставку."
      - "А я попрошу Жанну возглавить выставочный флот и отправиться вместе с тобой."
  - char: "jean_bart"
    side: "left"
    text:
      - "Тогда никаких проблем."
  - char: "richelieu"
    side: "right"
    text:
      - "Отлично. Что касается остального... остается лишь надеяться, что по прибытии на места мы получим отклик и поддержку от местных вооруженных сил."
  - char: "tartu_rad"
    side: "left"
    text:
      - "Приветствую вас, кардинал Ришелье. Это Тарту. От имени сил специальных операций Доминиона приветствую ваше возвращение."
  - char: "richelieu"
    side: "right"
    text:
      - "Тарту?"
      - "Как раз вовремя. Где сейчас твой отряд и сколько сил поблизости мы можем мобилизовать?"
  - char: "tartu_rad"
    side: "left"
    text:
      - "В данный момент мы находимся в Амьенском соборе."
      - "Пять минут назад госпожа Клемансо подробно объяснила текущую ситуацию всем подконтрольным вооруженным силам как внутри страны, так и за её пределами."
      - "Она приказала нам подчиняться вашим командам и содействовать в активации «Стены Авроры» на территории нашей родины."
  - char: "richelieu"
    side: "right"
    text:
      - "Амьенский собор... А что с вооруженными силами Железной Крови?"
  - char: "tartu_rad"
    side: "left"
    text:
      - "Госпожа Клемансо просила передать вам, что она лично занимается вопросом Железной Крови. Она просит вас не волноваться об этом и сосредоточиться на решении текущей задачи."
      - "И еще... ваша речь на острове Святой Елены была великолепна, госпожа Ришелье."
  - char: "richelieu"
    side: "right"
    text:
      - "Не думала, что её будут транслировать... Ле Террибль, ну ты даешь."
      - "И сколько еще секретов ты от меня утаила? Эххх..."
  - char: "le_mars_rad"
    side: "left"
    text:
      - "Это Ле Мар, докладываю кардиналу Ришелье!"
      - "В настоящий момент «Стена Авроры» в районе Реймса активирована, я со своим отрядом ожидаю ваших дальнейших приказов."
  - char: "le_malin_rad"
    side: "right"
    text:
      - "Это Ле Мален... с узлом в районе Виши тоже покончено, жду приказов."

chapter2:
  rows:
  - text:
      - "Голоса из коммуникаторов доносились непрерывно. Золотой свет озарял один город за другим."
  - char: "marseillaise"
    side: "left"
    text:
      - "Какое прекрасное зрелище..."
      - "Кардинал Ришелье, города один за другим возвращаются под наш контроль."
      - "Мы уже почти победили..."
  - char: "richelieu"
    side: "right"
    text:
      - "Да... мы почти у цели."
      - "...Остались только Мон-Сен-Мишель и столица."
  - char: "jean_bart"
    side: "left"
    text:
      - "Насчет Мон-Сен-Мишеля можешь не волноваться."
      - "Страсбург и остальные изначально базировались поблизости, так что сейчас они, скорее всего, уже со всем разобрались."
      - "Посмотри в ту сторону, разве это не тот самый свет, который устремился к выставке после активации узла в Мон-Сен-Мишеле?"
      - "Думаю, она просто... не стала с нами связываться."
  - char: "richelieu"
    side: "right"
    text:
      - "Хм... Я её понимаю."
      - "Тогда... осталась только столица."
      - "...Похоже, это и есть конечная цель нашего пути."
      - "Передайте приказ всем отрядам: после выполнения своих задач направиться в столицу через Сеть врат."
      - "Прежде чем мы отправимся на выставку для решающей битвы, я хочу полностью объединить силы Ириса."
      - "А теперь... давайте тоже выдвигаться к столице и исполним наш долг."
