chapter1:
  rows:
  - text:
      - "Свет пронзил тьму, устремившись со всех сторон к территории выставки."
      - "Он озарил этот лишенный света мир, возвещая о прибытии надежды."
      - "Флоты, выполнившие свои задачи, один за другим прибывали на выставку через Сеть врат."
      - "Не только павильон Доминиона Виши, но и все остальные павильоны и причалы выставки превратились во временные стоянки для флота."
      - "Естественно, враги на территории выставки и в прилегающей акватории уже давно были полностью зачищены."
  - char: "clemenceau"
    side: "left"
    text:
      - "Осталось целей: три... две... одна..."
      - "Готово."
  - text:
      - "Сверкнула очередная вспышка света, означающая активацию Сети врат."
      - "Огромный флот Ириса также прибыл на выставку."
      - "В его строю эскадры Доминиона Виши и Свободного Ириса уже полностью слились воедино, став неразделимым целым."
      - "Окинув взглядом выставку, казалось, что в этот момент стерлась даже граница между «Лазурным путем» и «Багровой Осью»."
      - "Союз Орла, Королевский Флот, Железная Кровь, Империя Сакуры, Ортодоксия Ирис, Империя Дракона, Северный Парламент, Империя Сардиния, и даже прибывшие издалека МЕТА."
      - "Грандиозный флот проводил последние приготовления перед выходом в бой."
      - "В то же время система «Святое копье» также завершала последние приготовления перед залпом."
  - char: "clemenceau"
    side: "left"
    text:
      - "Уничтожим мы его или лишь ослабим — всё зависит от этого удара."
      - "Если нам повезет, этот флот даже не понадобится, представляешь?"
      - "А если не повезет... кто знает, может, ты еще пожалеешь о том, что этот флот недостаточно велик."
      - "Проверка завершена, все узлы активированы, система работает в штатном режиме. Запустить систему «Святое копье»?"
  - text:
      - "Клемансо вдруг спросила об этом с совершенно серьезным лицом, как будто у нас вообще существовал другой вариант ответа."
  - char: "clemenceau"
    side: "left"
    text:
      - "Хе-хе, нужно же добавить немного торжественности."
      - "Запуск системы «Святое копье»..."
      - "Пусть раскаленное Копье Света разобьет этот «Кокон ложного бога»..."

chapter2:
  rows:
  - text:
      - "Проходя через шпиль Великого собора, свет, собранный со всей акватории, слился в единый световой луч."
      - "Этот луч был ослепительным, словно солнце, но при этом нес в себе гнетущее чувство и мертвую тишину. От одного взгляда на него возникало удушающее ощущение."
      - "Мгновение спустя луч света ударил в черный кокон, окутывавший «бога», вызвав яростное столкновение на его поверхности."
      - "......"
      - "Прямо перед тем, как энергия оборудования иссякла, последний луч света наконец пробил внешнюю оболочку кокона."
      - "Свет исчез вместе с коконом."
      - "Однако... гнетущая атмосфера, повисшая над акваторией, никуда не делась."
  - char: "essex_rad"
    side: "left"
    text:
      - "Командир, подтверждаю: Кокон ложного бога уничтожен."
      - "Но в самом центре, там, где был кокон, появился гигантский Наблюдатель - Дирой."
      - "Кроме того, вражеские силы в акватории, похоже, наконец-то обрели единое командование."
      - "Я наблюдаю, как враги из прилегающих районов стягиваются к местоположению этого гигантского Дироя."
  - char: "illustrious_rad"
    side: "right"
    text:
      - "Да, данные моей разведки совпадают с наблюдениями Эссекс."
      - "Полагаю, этот гигантский Наблюдатель и есть истинная форма ложного бога."
      - "Клемансо, твоя система «Святое копье» может сделать еще один залп?"
  - char: "clemenceau"
    side: "left"
    text:
      - "К сожалению, энергия системы полностью исчерпана."
      - "В конечном итоге их силы просто аннулировали друг друга..."
      - "Как я и думала, всё не будет так просто. Защита ложного бога пробита, но его собственная сила никуда не делась."
  - char: "essex_rad"
    side: "right"
    text:
      - "Ничего страшного, Клемансо."
      - "Твоя система уже позволила нам застать его врасплох, так что только сейчас оно в спешке начало собирать свой флот."
      - "Командир, я считаю, что сейчас самое подходящее время для того, чтобы развить успех и нанести удар!"
  - char: "richelieu_rad"
    side: "left"
    text:
      - "Я тоже так считаю. Командир, флот Ириса полностью собран. Пожалуйста, отдай приказ о выступлении."
  - char: "illustrious_rad"
    side: "right"
    text:
      - "Как и Королевский Флот. Гибралтарский флот, флот Мальты и выставочный флот полностью в твоем распоряжении."
  - char: "sovetsky_soyuz_old_rad"
    side: "left"
    text:
      - "Флот Северного Парламента, как и всегда, поддержит любое твое решение, товарищ Командир."
  - char: "chen_hai_rad"
    side: "right"
    text:
      - "Флот Империи Дракона завершил сбор. Давай же вместе приложим все усилия ради победы, Командир."
  - char: "shinano"
    side: "left"
    text:
      - "Я тоже готова. Давайте же вместе отправимся к месту решающей битвы."
  - char: "vittorio_veneto_rad"
    side: "right"
    text:
      - "Флот Империи Сардиния также готов. Давайте преподадим хороший урок этой твари, которая решила, что ей всё дозволено!"
  - char: "memphis_meta_rad"
    side: "left"
    status: "is-purple"
    text:
      - "Похоже, этот «бог» скрывает еще какие-то тайны..."
      - "Но и наши силы не так уж малы, к тому же Хелена оказывает нам всестороннюю поддержку. Мы обязательно одержим победу в этой битве."
  - char: "hiryuu_meta_rad"
    side: "right"
    status: "is-meta"
    text:
      - "На самом деле у меня есть кое-какие догадки насчет этой штуки... но их нужно проверить в бою. В атаку!"
  - char: "clemenceau"
    side: "left"
    text:
      - "Командир, я выложила на стол все свои карты, теперь всё зависит от тебя~"
      - "Возглавь флот, чтобы сокрушить ложного бога, и приведи нас к победе!"
