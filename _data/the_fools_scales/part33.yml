chapter1:
  rows:
  - text:
      - "Бой в порту Тулона уже завершился."
      - "Флоты Ириса объединили свои силы и теперь продвигались вверх по реке, вглубь своей родины."
  - char: "lyon"
    side: "left"
    text:
      - "Не ожидала, что нас смогут переместить только к ближайшей реке."
      - "Выходит, и у техннологий Сирен есть свои ограничения."
  - char: "la_galissonniere"
    side: "right"
    text:
      - "Я бы сказала, к счастью, они не всесильны."
      - "Иначе от них было бы просто невозможно защититься."
  - char: "richelieu"
    side: "left"
    text:
      - "Беарн, как обстановка вокруг?"
  - char: "bearn"
    side: "right"
    text:
      - "Вблизи реки нет никаких следов активности противника, но я обнаружила одно заслуживающее внимания явление."
      - "Эти аномальные белые субстанции, похоже, побаиваются воды."
      - "Даже покрыв горы и равнины, и даже достигнув самых облаков, они не смеют ни на шаг ступить в воду."
  - char: "richelieu"
    side: "left"
    text:
      - "Раз уж ты заговорила об этом... похоже, так оно и есть."
      - "Будь то берег моря или реки, распространение этой аномалии прекращается прямо у кромки воды."
      - "Хоть механизм этого и неясен, возможно, нам стоит радоваться... по крайней мере, сейчас мы всё еще можем продвигаться вперед по морю и рекам."
      - "Авиньон... никак не ожидала, что узел будет расположен именно там."
  - char: "painleve"
    side: "right"
    text:
      - "Госпожа Ришелье, госпожа Жан Бар, я обнаружила прямо на нашем пути какую-то странную зону."
  - char: "bearn"
    side: "left"
    text:
      - "Странная зона... ты про тот абсолютно черный участок? Я тоже его вижу."
  - char: "jean_bart"
    side: "right"
    text:
      - "Хм... эта зона кажется весьма обширной. Если пытаться её обойти, неизвестно, сколько времени на это уйдет. Сестра, что будем делать?"
  - char: "richelieu"
    side: "left"
    text:
      - "Хм... у нас действительно нет времени на обход."
      - "«И сказал Бог: да будет свет»."
      - "«И стал свет»."
  - text:
      - "Сопровождаемое этими словами, прозвучавшими словно заклинание, знамя в руках Ришелье вспыхнуло ослепительным светом."
  - char: "jean_bart"
    side: "left"
    text:
      - "Сестра! Твое знамя светится!"
      - "Что... что происходит?"
  - char: "richelieu"
    side: "right"
    text:
      - "...Будем считать это небольшим подспорьем, которое предоставила нам наша младшая сестра."
      - "Всем держаться рядом, мы пройдем насквозь."

chapter2:
  rows:
  - text:
      - "Знамя Ришелье рассеяло тьму."
      - "При свете все заметили человеческий силуэт, окутанный черной аурой."
  - char: "marco_polo?d"
    side: "right"
    status: "is-lightgray"
    text:
      - "Наконец-то, наконец-то!"
      - "Последний кусочек головоломки моего великого деяния..."
      - "Корона Святого Престола наконец-то принадлежит мне!"
      - "Отныне все распри в мире смертных исчезнут."
      - "Великое царство... Царство, принадлежащее богу, снизойдет в этот мир!"
      - "И мир будет купаться в вечной гармонии!"
      - "Что же касается Сирен... а-ха-ха-ха-ха!"
      - "Сирены больше не проблема!"
      - "Потому что — снизойдет бог!"

chapter3:
  rows:
  - char: "marseillaise"
    side: "left"
    text:
      - "Какое... какое кощунство!"
      - "Эта Марко Поло — просто безумица..."
  - char: "jean_bart"
    side: "right"
    text:
      - "Согласна. Так вот в каком состоянии была Марко Поло, прежде чем заварить всю эту кашу..."
      - "...У неё точно с головой не в порядке, да?"
  - char: "richelieu"
    side: "left"
    text:
      - "Быть может, она сбилась с пути на полдороги..."
      - "Или же эта искаженная сила использовала её с самого начала..."
      - "С меня довольно. Пора заставить этот болтливый фантом замолчать."
  - char: "jean_bart"
    side: "right"
    text:
      - "По... подожди! Ты собираешься её прервать?"
      - "Кто знает, что случится, если прервать её прямо сейчас?!"
  - char: "richelieu"
    side: "left"
    text:
      - "Возможно, нас ждет битва. Но кто знает, сколько времени пройдет, прежде чем она закончит свою болтовню."
      - "К тому же, нет никаких гарантий, что после этого она мирно нас пропустит. Так что лучше решить всё одним махом и немного ускорить процесс."
      - "...Логично. Тогда за дело!"

chapter4:
  rows:
  - text:
      - "БАБАХ!!!"
      - "Битва была ожесточенной, но скоротечной."
  - char: "marco_polo?d"
    side: "right"
    status: "is-lightgray"
    text:
      - "И каждый раз это Ирис..."
      - "Мы разделяем одну веру, но вы всегда оказываетесь по ту сторону баррикад..."
      - "...еретики..."
      - "На моей стороне... законная власть... ах..."
  - char: "richelieu"
    side: "left"
    text:
      - "Чего стоит так называемая законная власть без поддержки людей?"
      - "«Прах к праху, пепел к пеплу»."
      - "Нас ждут важные дела. Сгинь, остаток чужой одержимости."
  - text:
      - "Фантом Марко Поло рассеялся, а вместе с ним исчезла и окружавшая их кромешная тьма."
  - char: "richelieu"
    side: "left"
    text:
      - "Путь свободен, Авиньон уже совсем близко. Выдвигаемся."
