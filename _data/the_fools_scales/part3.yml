chapter1:
  rows:
  - text:
      - "Черное солнце безмолвно пылает."
  - char: "commander"
    side: "left"
    text:
      - "………………"
      - "…………？"
      - "Это сон... или же..."
      - "Я уже проснулся..."
      - "Надо попытатся понять где я нахожусь."
  - text:
      - "Внимательно присмотревшись, я понимаю, что это черное солнце передо мной никак не может быть чем-то обыденным."
      - "Однако, в отличие от того, что я видел в своих кошмарах раньше, это черное солнце, похоже, не несет в себе никакой «угрозы»."
      - "Пылающее пламя не излучает тепла и не издает ни единого странного звука."
      - "Оно просто безжизненно висит в вышине, словно ему нет никакого дела до всего происходящего вокруг."
  - char: "commander"
    side: "left"
    text:
      - "Надо вглядеться лучше."
  - text:
      - "Я пристально вглядываюсь в далекое черное солнце."
      - "В те мгновения, когда сияние черного солнца на секунду тускнеет, мне кажется, что я вижу нечто невообразимое."
  - char: "commander"
    side: "left"
    text:
      - "Механическое солнце?!"
  - text:
      - "Внутри черного солнца... словно сокрыт какой-то исполинский механизм."
      - "Эта машина, похоже, не полностью существует в материальном мире. Подобно айсбергу, скрывающемуся под толщей воды, она обнажает лишь крошечную свою часть."
      - "В то мгновение, когда я это осознаю, меня пронзает пробирающий до костей, давящий холод."

chapter2:
  rows:
  - text:
      - "Словно я оказался на километровой глубине в океане..."
      - "Словно перенесся в давно минувшую эпоху..."
  - char: "commander"
    side: "left"
    text:
      - "(Дышать невозможно.)"
  - text:
      - "В отличие от мягкого спокойствия, что излучало черное солнце ранее, мир перед моими глазами теперь наполнен отчаянным, всепоглощающим чувством удушья."
      - "Кажется... я... сейчас задохнусь..."

chapter3:
  rows:
  - text:
      - "В последнее мгновение, прежде чем мое сознание окончательно угасает."
      - "…Мне почудился тихий перезвон колокольчиков?"
