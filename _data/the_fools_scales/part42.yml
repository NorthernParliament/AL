chapter1:
  rows:
  - text:
      - "Яркий солнечный свет лился сквозь витражи собора, озаряя убранство, насчитывающее несколько веков истории."
      - "Многолетняя пыль была сметена в ходе давно назревшей уборки, и древний собор вновь обрел новую жизнь."
      - "Прямо как и сама эта земля."

chapter2:
  rows:
  - char: "essex"
    side: "left"
    text:
      - "Кто бы мог подумать, что меня пригласят в качестве представителя Союза Орла стать свидетелем столь важного исторического момента..."
  - char: "avrora"
    side: "right"
    text:
      - "Учитывая твои заслуги в минувшем бою, мисс Эссекс, я считаю, что ты по праву заслужила эту честь."
      - "Товарищ Командир, госпожа Чэнь Хай, кто бы мог подумать, что мы не только вместе разрешим кризис в Средиземном море, но и сможем вместе стать свидетелями этого момента."
  - char: "chen_hai"
    side: "left"
    text:
      - "И всё это — всего лишь за один день. Воистину, в этом мире счастье и несчастье идут рука об руку, а всё вокруг так изменчиво."
  - char: "prinz_eugen"
    side: "right"
    text:
      - "Да уж... Проводить столь важную церемонию спустя всего один день — не слишком ли поспешно?"
      - "Хотя, конечно, я могу понять их нетерпение..."
      - "А ты что думаешь, госпожа Илластриес?"
  - char: "illustrious"
    side: "left"
    text:
      - "На церемонии такого масштаба, как коронация Ириса, по-хорошему должна была лично присутствовать Ее Величество."
      - "Но время и вправду поджимало..."
      - "Раз уж Ирис принял такое решение... мне остается лишь от имени Ее Величества передать кардиналу Ришелье и всему Ирису наши благословения."
  - char: "vittorio_veneto"
    side: "right"
    text:
      - "Хе-хе, в этот памятный день давайте все подарим Ирису наши самые искренние благословения~"
  - text:
      - "После долгого ожидания двери собора наконец распахнулись."
      - "Ришелье, облаченная в парадную мантию, медленно прошла вперед и опустилась на одно колено перед Короной Святого Престола."

chapter3:
  rows:
  - char: "clemenceau"
    side: "right"
    text:
      - "В былые дни кардинал Ришелье взяла на себя руководство в критический момент, отправившись за помощью к союзникам, когда наша родина оказалась в опасности."
      - "Из-за смуты тех времен этот тайный приказ так и остался тайной для всего мира, и не был признан последующим нелегитимным Доминионом."
      - "Однако, несмотря на бесчисленные недопонимания и осуждения, несмотря на долгие скитания вдали от дома."
      - "Кардинал Ришелье не сдалась."
      - "Именно её неустанные, многолетние и верные действия..."
      - "...позволили в самый решающий момент успешно воссоединить расколотую Ортодоксию под единым знаменем."
      - "...позволили привести нас к этой нелегкой, но поистине великой победе."
      - "Поэтому от имени Доминиона я признаю огромные заслуги кардинала Ришелье перед Ортодоксией Ирис."
      - "Настоящим я снимаю все обвинения и наказания, наложенные на кардинала Ришелье прежним нелегитимным Доминионом."
      - "Сейчас Корона Святого Престола — самая священная реликвия Ортодоксии — находится в моих руках."
      - "Кардинал Ришелье."
      - "Готова ли ты оправдать возложенные на тебя надежды и повести нашу истерзанную войной родину вперед?"
      - "Готова ли ты принять здесь священную корону Ортодоксии?"
      - "И взойти на Святой Престол Ортодоксии Ирис?"
  - text:
      - "Стоя на ступенях, Клемансо высоко подняла Корону Святого Престола и с ожиданием посмотрела сверху вниз на Ришелье."
  - char: "richelieu"
    side: "left"
    text:
      - "............"
      - "Корона. Корона..."
      - "Я всё время думала о том, чем же на самом деле является Корона Святого Престола для нас, для Ириса."
      - "Драгоценной святыней?"
      - "Памятью истории?"
      - "Символом легитимности?"
      - "Действительно, Корона Святого Престола несет в себе множество смыслов, и каждый из них невероятно важен для нас."

chapter4:
  rows:
  - char: "richelieu"
    side: "left"
    text:
      - "Но в то же время я увидела и другую Корону Святого Престола."
      - "Цель чужих амбиций."
      - "Инструмент для манипуляций."
      - "Продукт технологий Сирен."
      - "Верно, когда-то давно в прошлом наша священная Корона Святого Престола была подменена Сиренами."
      - "Всё это время мы поклонялись опасному творению Сирен как святыне."
      - "До тех пор, пока оно не ввергло нас в пучину кризиса и едва не уничтожило всё, чем мы дорожим."
      - "Поэтому я невольно задаюсь вопросом: действительно ли она нам нужна?"
      - "Я взойду на Святой Престол."
      - "Ибо я поклялась вернуть Ортодоксии её былое величие."
      - "Но возводит меня на этот престол не корона, а народ."
      - "Правитель должен сам выбирать корону, а не становиться её заложником."
      - "Поэтому..."
      - "Я выбираю «народ» своей короной!"
      - "Я выбираю «некоронованность» своей короной!"

chapter5:
  rows:
  - text:
      - "Под ошеломленными взглядами почти всех присутствующих Ришелье слегка подбросила корону в воздух и обрушила на неё свой меч."
      - "В облачке красно-черного дыма корона рассыпалась в прах, развеянный ветром."
      - "Волна потрясенных возгласов, казалось, вот-вот сокрушит каменные стены собора, но в итоге всё же улеглась."
  - char: "clemenceau"
    side: "right"
    text:
      - "...Ришелье, моя старшая сестра."
  - text:
      - "Казалось, на какое-то мгновение на губах Клемансо промелькнула едва уловимая улыбка."

chapter6:
  rows:
  - char: "richelieu"
    side: "left"
    text:
      - "Народ Ириса."
      - "После всех перенесенных нами невзгод, свобода и единство наконец-то вернулись на нашу родину."
      - "Мы пролили много слез и пролили много крови."
      - "Но сегодня мы можем с уверенностью сказать: ни одна слезинка, ни одна капля крови не были пролиты напрасно."
      - "Отныне в Ортодоксии Ирис больше нет раскола."
      - "Свободный Ирис и Доминион Виши вновь объединились под единым знаменем."
      - "Слава Ортодоксии Ирис."
      - "Да здравствует наша родина!"

chapter7:
  rows:
  - text:
      - "Под гром аплодисментов церемония коронации завершилась."
      - "Новый день для Ортодоксии Ирис — начался."
