chapter1:
  rows:
  - text:
      - "Марко Поло, сидя на своем троне, свысока смотрела на расстилающийся под ней мир, ожидая последней «аудиенции»."
      - "Сияющие светом корона и трон возвещали о том, что великий ритуал вот-вот завершится."
      - "Морские воды неистово бурлили, и казалось, будто в непостижимых глубинах некая «сущность» готовится войти в этот мир."
  - char: "marco_polo"
    side: "left"
    status: "is-yellow"
    text:
      - "Хе-хе-хе...! Какая мощь! Воистину, такой аурой может обладать лишь само божество, спустившееся к нам!"
      - "Мое великое дело вот-вот свершится!"
      - "Да начнется же новая эра!"
  - text:
      - "БАБАХ!!!"
      - "Странный шум, донесшийся издалека, прервал самодовольный монолог Марко Поло."
  - char: "marco_polo"
    side: "left"
    status: "is-yellow"
    text:
      - "..Ха? Везувий... начал извергаться прямо сейчас...?"
      - "Н-нет, подождите, из столба пепла что-то вылетело..."
      - "Это... гигантский... золотой механический рыцарь?!!"
      - "...Он и так летит по небу, зачем ему еще и верхом на лошади скакать?"
      - "Нет-нет, сейчас не об этом!"
      - "Что это за штука... и откуда она вообще взялась?"
  - text:
      - "Глядя на стремительно приближающегося механического рыцаря, Марко Поло на несколько секунд впала в ступор, прежде чем осознать, что эта махина несется прямо на неё с явным намерением убивать."
  - char: "marco_polo"
    side: "left"
    status: "is-yellow"
    text:
      - "!!!"
      - "Он выстрелил лазером... из лука?!.."
      - "Проклятье! М-мне не увернуться...!"

chapter2:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "marco_polo"
    side: "left"
    status: "is-yellow"
    text:
      - "Ува-а-а——!"
  - text:
      - "Лазерный луч прошел лишь по касательной, но и этого хватило, чтобы оставить в спинке трона пугающую дыру."
      - "От чудовищного удара парящий трон — гордость Марко Поло — яростно затрясся."
  - char: "marco_polo"
    side: "left"
    status: "is-yellow"
    text:
      - "Плохо, плохо, очень плохо! Крылья повреждены, я теряю равновесие!"
      - "Снижаться, нужно как можно скорее снижаться!"

chapter3:
  rows:
  - char: "communicator"
    side: "right"
    text:
      - "Бип!"
  - char: "marco_polo"
    side: "left"
    status: "is-yellow"
    text:
      - "Сообщение от Клемансо?!"
      - "Как здорово! Клемансо, где ты сейчас?!"
      - "Ты ведь видела того механического рыцаря, что появился вместе с извержением вулкана?!"
      - "И правда... Неужели это секретное оружие, которое приготовила Венето?"
      - "Мой трон подбит, я иду на вынужденную посадку!"
      - "Не отправляйся пока на выставку, скорее помоги мне!"
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "«Когда была снята первая печать, я увидела белого коня»"
      - "«Всадник на нём имел лук, и дан был ему венец. И вышел он как победитель, и чтобы победить»"
      - "Позволь представить тебе козырь Трибунала, Судейский механизм — «Господство», Механизм Бога, созданный простыми смертными."
      - "И разумеется, я уже нивелировала твой контроль с помощью концепции Мальтийского ордена и вернула себе командование флотом Суда."
      - "Шах и мат."
  - char: "marco_polo"
    side: "left"
    status: "is-yellow"
    text:
      - "...Такое возможно только после долгой и тщательной подготовки..."
      - "Ты с самого начала так всё и задумала?!"
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "...И только сейчас ты это поняла."
      - "Как я и думала, ты не годишься для подобных дел, Марко Поло."
  - char: "marco_polo"
    side: "left"
    status: "is-yellow"
    text:
      - "Клемансо, подумать только... даже ты предала меня."
      - "А ведь у нас были общие мечты... общие амбиции."
      - "Разве мы... не подруги?"
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "...Я прекрасно понимаю твои мечты и от всей души благодарю за помощь, которую ты оказала моему плану."
      - "Наша дружба не была фальшивкой... И даже сейчас я продолжаю считать тебя своей подругой."
      - "Именно поэтому, как подруга, я обязана остановить тебя и не дать пойти дальше по этому ложному пути."
      - "Только так можно сохранить будущее Империи Сардиния и твою жизнь..."
  - char: "marco_polo"
    side: "left"
    status: "is-yellow"
    text:
      - "Я не понимаю... почему, почему ты так поступаешь?"
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "Поэтому я и сказала, что ты не создана для подобных дел..."
      - "Твои поступки — это предательство родины и своего народа."
      - "В связи с этим вся ответственность за этот инцидент ляжет исключительно на Марко Поло, действовавшую самовольно и безрассудно."
      - "Международное положение Империи Сардиния никак не пострадает из-за твоих действий."
      - "Напротив, оно может даже укрепиться благодаря нашей активной роли в разрешении этого кризиса."
      - "Как уверенный шаг на пути к возрождению — звучит весьма неплохо, не так ли?"
  - char: "marco_polo"
    side: "left"
    status: "is-yellow"
    text:
      - "В конце концов... ты такая же, как и все простые смертные..."
  - char: "clemenceau_rad"
    side: "right"
    text:
      - "Как подруга, я обещаю тебе: я обязательно улажу последствия этого инцидента, который ты спровоцировала."
      - "Я не позволю стоящему за тобой «божеству» — той сущности, что затуманила твой разум и превратила тебя в свою пешку, — снизойти в этот мир."
      - "И я не позволю ему разрушить то, чем ты в глубине души по-настоящему дорожишь."
      - "И уж тем более не позволю тебе совершить нечто непоправимое и навсегда войти в историю как величайшая грешница..."
  - char: "marco_polo"
    side: "left"
    status: "is-yellow"
    text:
      - "Бессмысленно... В этом больше нет никакого смысла..."
      - "Почему... всё так обернулось..."
      - "А ведь... оставался всего один шаг..."
      - "Мои идеалы..."
      - "Мой мир..."

chapter4:
  rows:
  - text:
      - "Бормоча это про себя, Марко Поло оставила попытки сопротивляться и позволила себе рухнуть в воду вместе с обломками трона."
      - "Вслед за этим весь мир погрузился в безмолвие..."
