chapter1:
  rows:
  - char: "libeccio"
    side: "left"
    text:
      - "Какой кошмар! С неба сыплются грибные споры!"
  - char: "maestrale"
    side: "right"
    text:
      - "Никакие это не грибные споры! Хотя что это... я и сама не знаю."
  - char: "nicoloso_da_recco"
    side: "left"
    text:
      - "Ува-а... Никогда не слышала, чтобы Сирены во время атак сбрасывали такую мерзость..."
  - char: "aquila"
    side: "right"
    text:
      - "В окрестностях порта уже царит полный хаос, а с госпожой Венето и госпожой Литторио никак не связаться."
      - "Абруцци, что нам делать? Срочно выходить в море?"
  - char: "duca_degli_abruzzi"
    side: "left"
    text:
      - "Ситуация неясна, нам не стоит действовать опрометчиво."
      - "В этом плане мы уже получили достаточно горьких уроков."
  - char: "aquila"
    side: "right"
    text:
      - "И то верно... Возможно, когда ситуация хоть немного прояснится, нам поступят приказы."

chapter2:
  rows:
  - char: "marco_polo_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Сенат вызывает порт Таранто, кто-нибудь меня слышит?"
  - char: "aquila"
    side: "left"
    text:
      - "Этот голос... госпожа Марко Поло?"
      - "Как здорово, это Аквила! Госпожа Марко Поло, вы сейчас на выставке, верно?"
      - "Какова обстановка, что там произошло?"
  - char: "marco_polo_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Вы уже должны были заметить творящиеся аномалии."
      - "Как видите, на всей территории Империи Сардиния введено чрезвычайное положение."
      - "Ввиду сложившейся обстановки, Сенат наделил меня всеми полномочиями для урегулирования ситуации."
      - "Отныне и вплоть до отмены чрезвычайного положения все вооруженные силы Империи Сардиния, включая командование флотом, переходят под мое руководство."
      - "В связи с этим я приказываю флоту Таранто подчиниться приказу, приготовиться к бою и выдвигаться к месту проведения выставки."
  - char: "aquila"
    side: "left"
    text:
      - "Нужно спасти тех, кто на выставке? Конечно, без проблем."
      - "А как же госпожа Венето? Разве она не с вами на выставке? Почему Сенат не передал полномочия госпоже Венето в порядке субординации?"
      - "Если возможно, не могли бы вы попросить госпожу Венето выйти на связь, чтобы мы знали, что она в порядке?"
  - char: "marco_polo_rad"
    side: "right"
    status: "is-yellow"
    text:
      - "Венето, Венето, Венето... Почему везде одно и то же."
      - "Именно поэтому у меня не было иного выбора, кроме как пойти по этому пути..."
      - "Вы мне больше не интересны. Прощайте навсегда."
  - char: "aquila"
    side: "left"
    text:
      - "Э? С-связь прервалась..."
      - "Так толком и не объяснила, что происходит..."
  - char: "duca_degli_abruzzi"
    side: "right"
    text:
      - "Не могу восстановить связь... Похоже, внутри Империи происходит нечто такое, во что нам не следует вмешиваться."
      - "Однако очевидно, что в Империи действительно введено чрезвычайное положение."
      - "И эта распространяющаяся белая субстанция, похожая на грибницу... сложно представить, что она появилась с мирными намерениями."
  - char: "nicoloso_da_recco"
    side: "left"
    text:
      - "Беда!"
      - "Капитан да Рекко обнаружила гигантского трехногого робота! И он распыляет белый туман!"
      - "К тому же, кажется, он направляется прямо к нам!"
  - char: "duca_degli_abruzzi"
    side: "right"
    text:
      - "Белый туман..."
      - "Вот как. Похоже, именно из-за него этой белой субстанции становится всё больше."
  - char: "aquila"
    side: "left"
    text:
      - "Защитим нашу базу! Приготовиться к бою!"
