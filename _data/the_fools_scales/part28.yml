chapter1:
  rows:
  - char: "littorio_rad"
    side: "left"
    text:
      - "Карабиньере, наконец-то я смогла с тобой связаться. Ты в порядке? Где ты сейчас?"
  - char: "carabiniere"
    side: "right"
    text:
      - "Госпожа Литторио! Я вместе с флотом Империи Дракона совсем недавно вошла в аномальную зону!"
      - "Как ты там?! Что вообще происходит?"
  - char: "littorio_rad"
    side: "left"
    text:
      - "У нас всё хорошо. Остальное слишком сложно, чтобы объяснить в двух словах."
      - "Давай сначала о тебе. Что значит «совсем недавно вошла в аномальную зону»?"
  - char: "carabiniere"
    side: "right"
    text:
      - "Дело вот в чем, госпожа Литторио. Я и флот Империи Дракона изначально находились за пределами зоны влияния этой аномалии."
      - "Но когда мы пили чай, госпожа Чэнь Хай вдруг заметила что-то неладное и попросила меня попробовать связаться с нашей территорией."
      - "Я вызывала разные базы, но не смогла ни с кем связаться."
      - "Поэтому я попросила их пойти со мной и всё разведать, и тогда мы обнаружили... это ужасающее зрелище."
  - char: "littorio_rad"
    side: "left"
    text:
      - "Неудивительно, что я никак не могла с тобой связаться. Оказывается, ты находилась вне зоны влияния Царства Божьего."
      - "Карабиньере, соедени меня, пожалуйста, с госпожой Чэнь Хай из Империи Дракона."
      - "Командир, я установила связь. Распределяй задачи..."

chapter2:
  rows:
  - char: "chen_hai"
    side: "left"
    text:
      - "Вот оно как, ситуацию я поняла."
      - "Не волнуйся, нашей боевой мощи вполне достаточно. Оставьте Суэцкий канал и прилегающие к нему узлы нам."
      - "Да, мы обнаружили еще кое-что. Оборудование в порту Александрия было активировано еще до того, как ты вышел на связь."
      - "...Вы тоже не знаете, в чем дело?"
      - "К тому же, гарнизонный флот всё еще не выходит на связь... Я поняла."
      - "Мы начнем совместное расследование. Если появятся новые данные — мы свяжемся с тобой."
      - "Хм, и тебе удачи, Командир!"
