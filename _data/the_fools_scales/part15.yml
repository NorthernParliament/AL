chapter1:
  rows:
  - char: "littorio"
    side: "left"
    text:
      - "Ха, такой склад и вправду существует..."
      - "Похоже, это и есть тот самый перевалочный пункт Сената для сбора и транспортировки артефактов."
      - "Торричелли, что думаешь?"
  - char: "torricelli"
    side: "right"
    text:
      - "...Ничего не думаю."
      - "Прежде чем приехать сюда, я искренне и как минимум раз сто повторила... я не умею проводить экспертизу артефактов."
      - "Разве не лучше было бы притащить для такой работы да Винчи?"
  - char: "littorio"
    side: "left"
    text:
      - "Она слишком быстро бегает, мне её просто не поймать."
  - char: "torricelli"
    side: "right"
    text:
      - "А я, выходит, бегаю слишком медленно?"
      - "Ху-ху-ху... Но сейчас еще не поздно нырнуть под воду..."
  - char: "littorio"
    side: "left"
    text:
      - "Эх~ Ну пожалуйста, госпожа Торричелли~"
      - "Мы с Венето знаем, что с этим делом точно что-то не так, но никак не можем выяснить, что именно."
      - "Теперь вся надежда только на твою скрупулезность и проницательность как ученого!"
  - char: "torricelli"
    side: "right"
    text:
      - "...Госпожа Литторио, пожалуйста, не надо так."
      - "Я буду усердно работать, ладно... Но, пожалуйста, обеспечь мне спокойную рабочую обстановку."
      - "И ни в коем случае не отвлекай меня, когда я читаю документы."
      - "Всё будет, как ты пожелаешь, я сейчас же..."

chapter2:
  rows:
  - text:
      - "Черное солнце безмолвно пылало."
  - char: "littorio"
    side: "left"
    text:
      - "...Черное солнце снизошло на землю."
      - "Подобное зрелище... Хм, несомненно, это какое-то предзнаменование."
      - "Иными словами, кто-то пригласил меня посмотреть на эту картину."
      - "Интересно, кто же меня пригласил, и с какой целью..."
  - char: "clemenceau"
    side: "right"
    status: "is-red"
    text:
      - "Госпожа Литторио, надеюсь, ты в добром здравии."
  - char: "littorio"
    side: "left"
    text:
      - "Ты... госпожа Клемансо?!"
