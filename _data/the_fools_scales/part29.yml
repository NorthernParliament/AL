chapter1:
  rows:
  - text:
      - "БАБАХ!!!"
  - char: "champagne_rad"
    side: "left"
    text:
      - "Уничтожение цели завершено."
      - "Ожидаю следующих указаний."
  - char: "stremitelny_rad"
    side: "right"
    text:
      - "Товарищ Союз, нам продолжать прокладывать путь вперед?"
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Немного сбавь темп продвижения, не отрывайся от нас."
  - char: "stremitelny_rad"
    side: "right"
    text:
      - "Окей!"

chapter2:
  rows:
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Вы собрали все данные?"
  - char: "kronshtadt"
    side: "right"
    text:
      - "Да, запись полностью завершена."
      - "Эти данные определенно окажут огромную помощь в наших дальнейших исследованиях."
      - "То, что Шампань идет в авангарде, действительно сильно облегчило наше продвижение. Убили двух зайцев одним выстрелом."
      - "Но... эх, в мгновение ока мир превратился в этот сущий кошмар."
      - "Столь масштабная аномалия, вызванная таким огромным количеством узлов... Подготовка к такому проекту явно заняла не один день."
      - "И при этом я не получала заранее никаких разведданных... Похоже, за эти годы на фоне смягчения обстановки в Европе наш разведывательный отдел сильно расслабился."
      - "По возвращении придется устроить им хорошую встряску."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Нельзя винить во всем только нашу разведку."
      - "Эта женщина действительно очень опасна."
      - "Не только тебя, даже меня она обвела вокруг пальца, а Королевский Флот и Железная Кровь и вовсе сели в огромную лужу..."
      - "Хех... очень хотелось бы посмотреть на лица Куин Элизабет и Бисмарк, когда всё это закончится."
  - char: "kronshtadt"
    side: "right"
    text:
      - "Эта женщина — ты имеешь в виду Марко Поло?"
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Нет, я о Клемансо."
  - char: "kronshtadt"
    side: "right"
    text:
      - "Клемансо из Доминиона Виши... Хоть я и не общалась с ней лично, мне не раз доводилось иметь дело с её подчиненными из Трибунала."
      - "Она и впрямь непростая противница."
  - char: "sovetsky_soyuz_old"
    side: "left"
    text:
      - "Доминион Виши?"
      - "Хех, после того как этот инцидент будет исчерпан, никакого Доминиона Виши больше не будет."
      - "При условии, что всё и вправду благополучно закончится..."
