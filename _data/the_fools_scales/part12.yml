chapter1:
  rows:
  - text:
      - "В Пантеоне, в пустом зале роскошно одетая черноволосая девушка с закрытыми глазами наслаждалась тишиной."
      - "Пока этот покой не нарушил громкий голос."
  - char: "leonardo_da_vinci"
    side: "left"
    text:
      - "Госпожа Рома!"
      - "Наконец-то я тебя нашла! Почему ты сидишь здесь совсем одна?"
  - char: "roma"
    side: "right"
    text:
      - "Да Винчи?"
      - "Почему ты не на церемонии закрытия?"
  - char: "leonardo_da_vinci"
    side: "left"
    text:
      - "Это я должна тебя об этом спрашивать! Разве церемония закрытия может пройти без тебя, госпожа Рома?"
  - char: "roma"
    side: "right"
    text:
      - "Мне ведь не нужно произносить там речь."
      - "К тому же, после того, что случилось на церемонии открытия... я не хочу снова ввязываться в подобные неприятности."
      - "А вот ты так любишь шумные компании, с чего бы тебе пропускать церемонию закрытия и искать меня здесь?"
  - char: "leonardo_da_vinci"
    side: "left"
    text:
      - "Конечно же, я хочу туда пойти~!"
      - "о я обещала Альфредо, что ни за что не оставлю тебя скучать здесь в одиночестве во время церемонии!"
      - "Давай, пошли со мной~ Даже если тебя не пригласили выступать, быть просто зрителем тоже неплохо!"
  - char: "roma"
    side: "right"
    text:
      - "Насладиться церемонией закрытия как простой зритель... Я подумаю."
  - char: "leonardo_da_vinci"
    side: "left"
    text:
      - "Ура! Сейчас же свяжусь с Альфредо..."
      - "Э? ...Коммуникатор не подключается."
      - "...Линия перегружена? Плохой сигнал?"
      - "Странно, сколько бы людей ни было на выставке, это никак не должно влиять на военные каналы связи..."

chapter2:
  rows:
  - char: "communicator"
    side: "right"
    status: "is-yellow"
    text:
      - "*бип*"
  - char: "leonardo_da_vinci"
    side: "left"
    text:
      - "А, наконец-то дозвонилась... Нет, погоди-ка?! Госпожа Рома, это твой коммуникатор звонит!"
  - char: "roma"
    side: "right"
    text:
      - "..Это Рома, кто говорит?"
  - char: "marco_polo_rad"
    side: "left"
    status: "is-yellow"
    text:
      - "Рома, так ты, оказывается, отправилась в Пантеон. Я давно тебя ищу."
  - char: "roma"
    side: "right"
    text:
      - "Марко Поло? Разве ты не должна готовиться к выступлению на выставке? Зачем я тебе понадобилась?"
  - char: "marco_polo_rad"
    side: "left"
    status: "is-yellow"
    text:
      - "Ситуация изменилась, на территории выставки произошло ЧП."
      - "И не только там, в данный момент на всей территории Империи Сардиния введено чрезвычайное положение."
      - "Ввиду сложившейся обстановки, Сенат наделил меня всеми полномочиями для урегулирования ситуации."
      - "Отныне и вплоть до отмены чрезвычайного положения все вооруженные силы Империи Сардиния, включая командование флотом, переходят под мое руководство."
      - "Поэтому, Рома, немедленно бери людей и направляйся к месту проведения выставки. Приведи всех в боевую готовность и жди моих дальнейших приказов."
  - char: "roma"
    side: "right"
    text:
      - "...Венето знает об этом?"
  - char: "marco_polo_rad"
    side: "left"
    status: "is-yellow"
    text:
      - "К сожалению, из-за царящего на выставке хаоса Сенат потерял связь с Венето."
  - char: "roma"
    side: "right"
    text:
      - "Мы тоже. Связь с выставочной площадью полностью оборвалась."
      - "Однако... ты, та, кто должен был сейчас выступать с речью на выставке, находишься где-то в другом месте и вместо этого пытаешься взять под контроль вооруженные силы страны."
      - "Знаешь ли ты, Марко Поло, что даже в условиях чрезвычайного положения военно-морской флот Империи не может быть мобилизован лишь по голословному приказу одного сенатора."
  - char: "marco_polo_rad"
    side: "left"
    status: "is-yellow"
    text:
      - "......Я думала, раз ты не занимаешься политикой, то не помнишь все эти процедуры так хорошо."
  - char: "roma"
    side: "right"
    text:
      - "Это потому, что ты вызываешь у меня подозрения."
      - "Я чувствую в воздухе какую-то аномальную ауру."
      - "Присутствие богов рассеялось... Даже этот Пантеон сейчас наполнен аурой того божества, в которое веришь ты."
      - "Что ты натворила?"
  - char: "marco_polo_rad"
    side: "left"
    status: "is-yellow"
    text:
      - "Надо же, ты смогла почувствовать даже это... Всё верно, это место уже стало Царством Божьим."
      - "Когда Он снизойдет, и мир, и раздоры исчезнут навсегда."
      - "Посему ждите и преисполнитесь радостью, а-ха-ха-ха-ха."
  - text:
      - "Марко Поло прервала связь. Вслед за этим в облаках раздался приближающийся грохот."
  - char: "leonardo_da_vinci"
    side: "left"
    text:
      - "...С неба спускаются гигантские механизмы!"
      - "К-какие классные!"
      - "Н-нет, подожди!! Это же о-о-о-очень плохо!!"
  - char: "roma"
    side: "right"
    text:
      - "...Я слышу зов войны."
      - "Готовься, да Винчи, нам предстоит прорываться с боем."
