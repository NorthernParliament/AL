chapter1:
  rows:
  - text:
      - "Последний день Всемирной выставки. Церемония закрытия."
      - "На залитой солнцем выставочной площади повсюду развеваются пестрые флаги."
      - "Весёлая музыка в исполнении оркестра разносится на километры от Колизея."
      - "Церемония закрытия вот-вот начнется, и толпы людей стекаются к главной площади со всех сторон."
      - "Шум голосов накатывает волнами, и вся выставка охвачена невероятно оживленной атмосферой."
  - char: "memphis"
    side: "left"
    text:
      - "Вау... Так вот она какая, эта Всемирная выставка."
      - "Когда мы прибыли пару дней назад, здесь было довольно безлюдно. Не ожидала, что в день закрытия будет так много народу!"
      - "Я даже сама невольно заразилась этим воодушевлением!"
  - char: "helena"
    side: "right"
    text:
      - "...Редко увидишь Мемфис такой взволнованной."
  - char: "memphis"
    side: "left"
    text:
      - "Атмосфера здесь такая зажигательная, даже на меня это влияет."
      - "Точно! Командир, Хелена, давайте купим сувениров, пока церемония закрытия еще не началась!"
      - "Я просто не могу дождаться появления госпожи Марко Поло на церемонии закрытия~!"
  - char: "commander"
    side: "right"
    text:
      - "…Хм? «Госпожи» Марко Поло?"
      - "(То, что Мемфис так почтительно называет Марко Поло... это нормально?)"
  - char: "helena"
    side: "left"
    text:
      - "Командир... ты тоже это заметил?"
      - "Настроение Мемфис и атмосфера на площади... все это чересчур оживлённо."
  - text:
      - "Да... назвать это «фанатизмом» не было бы преувеличением."
      - "Глядя на радостную Мемфис и бурлящую толпу вокруг..."
      - "Кажется, что за этой веселой атмосферой выставки что-то скрывается. Смутно ощущается, что что-то... не так."
  - char: "memphis"
    side: "left"
    text:
      - "Мм? Командир, почему ты так на меня смотришь?"
      - "Сегодня праздник в честь закрытия выставки, это вполне нормально — немного порадоваться, правда?"
      - "Идем, идем~ Если мы сейчас же не поспешим, все сувениры раскупят!"

chapter2:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Успокойся, Мемфис."

chapter3:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "Что еще за «госпожа Марко Поло»?"

chapter4:
  rows:
  - text:
      - "В Колизее Марко Поло произносит приветственную речь, находясь в самом центре трибуны."
      - "Стоящая рядом Мемфис, с несколькими пакетами заранее купленных сувениров в руках, вместе с Хеленой молча её слушает."
      - "…………"
  - char: "commander"
    side: "left"
    text:
      - "(Когда мы вообще успели сюда зайти?)"

chapter5:
  rows:
  - char: "marco_polo"
    side: "left"
    text:
      - "Уважаемые гости, прибывшие издалека."
      - "Я - Марко Поло."
      - "Наместница Бога в смертном мире, Марко Поло."
      - "Сегодня поистине радостный день."
      - "Нам больше не нужно беспокоиться об угрозе Сирен."
      - "Как не нужно и погрязать в междоусобных распрях."
      - "Ибо высший порядок уже установлен, и Бог сошел в этот мир!"
      - "Прямо сейчас мы все вместе находимся в Царстве Божьем."
      - "Наступил вечный мир!"
      - "Празднуйте от всей души, свидетели, коим выпала величайшая честь!"
      - "Возрадуйтесь наступлению новой эры!"
      - "Возрадуйтесь вечному миру!"
      - "Возрадуйтесь сошествию Бога!"
      - "И славьте меня, Марко Поло!"
  - text:
      - "Абсурдная речь Марко Поло сопровождается оглушительными, похожими на раскаты грома, аплодисментами."
      - "Волна звука, кажется, вот-вот снесет крышу Колизея. Фанатизм в зале достиг пугающих, почти зловещих масштабов."

chapter6:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Надо найти способ прервать Марко Поло!)"
      - "(...Нельзя оставаться безучастным к происходящему, нужно как-то остановить эту абсурдную речь.)"
      - "(Точно! Можно использовать бортовую систему связи Мемфис, чтобы заглушить её...)"
  - char: "marco_polo"
    side: "right"
    text:
      - "Э-э...?! Как у тебя получилось..."
      - "Погодите, так не должно быть?!"
  - text:
      - "Марко Поло, чью речь внезапно прервали, выглядела совершенно растерянной."
      - "Так и знал, она прекрасно осведомлена о том, что здесь творится!"

chapter7:
  rows:
  - char: "commander"
    side: "left"
    text:
      - "(Нужно понаблюдать за развитием событий.)"
  - text:
      - "Даже находящаяся рядом Мемфис и остальные кансен оказались под каким-то воздействием."
      - "Прямо сейчас на площади выставки явно происходит нечто крайне опасное."
      - "Прежде чем действовать опрометчиво, нужно во всем разобраться. Лучше пока затаиться и посмотреть, что будет дальше."

chapter8:
  rows:
  - text:
      - "И стоило мне только об этом подумать, как на меня вдруг нахлынула сильнейшая сонливость."
      - "Мир перед глазами начал погружаться во тьму..."
