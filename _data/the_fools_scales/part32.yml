chapter1:
  rows:
  - char: "london"
    side: "left"
    text:
      - "Госпожа Уорспайт, мы только что получили известие: флот Железной Крови прибыл на Мальту."
  - char: "warspite_kai"
    side: "right"
    text:
      - "...Поистине, пути судьбы неисповедимы. Никогда бы не подумала, что флот Железной Крови войдет в нашу мальтийскую крепость вот так."
      - "Я уже прямо вижу выражение лица Ойген в этот момент... тц."
      - "Нельсон и Родни сейчас приходится несладко, ведь на их плечах еще и задача отправиться в Тунис вместе с флотом Железной Крови..."
      - "Ах да, в этом пространстве, пожалуй, более уместно будет называть его «Карфагеном»."
  - char: "london"
    side: "left"
    text:
      - "Город Тунис, на месте которого когда-то стоял древний Карфаген."
      - "Кто бы мог подумать, что именно там будет находиться ключевой узел, поддерживающий существование этого аномального пространства."
  - char: "warspite_kai"
    side: "right"
    text:
      - "Хех, похоже, Марко Поло и впрямь серьезно больна своими мечтами о Риме..."
  - char: "prinz_eugen_rad"
    side: "left"
    text:
      - "Приветик, Уорспайт. Как продвигаются дела? Помощь не нужна?"
  - char: "warspite_kai"
    side: "right"
    text:
      - "...Благодарю за то, что специально связалась с нами, чтобы поделиться своей радостью."
      - "Но не волнуйся, мы, согласно первоначальному плану, уже меняем курс и направляемся в Алжир."
  - char: "prinz_eugen_rad"
    side: "left"
    text:
      - "Вообще-то, у меня только что появилась идея получше."
      - "Тунис находится не так уж далеко от Алжира, да и количество врагов там примерно одинаковое."
      - "Мы с вашим мальтийским флотом вполне могли бы взять обе цели на себя."
      - "Не лучше ли вам развернуться и пойти на помощь кардиналу Ришелье?"
      - "Она взвалила на себя столько узлов, но, кажется... пока не особо продвинулась."
  - char: "warspite_kai"
    side: "right"
    text:
      - "...Послушай, Принц Ойген, зоны ответственности каждого флота были назначены лично Командиром."
      - "Тебе-то, может, и всё равно, но мы, как участницы «Лазурного пути», обязаны неукоснительно выполнять его боевые приказы."
      - "Нельзя менять их вот так просто... Не говоря уже о том, что задачи Королевского Флота не могут решаться силами Железной Крови."
      - "И не утруждай себя беспокойством: мы только что связывались с Ришелье, и она сообщила, что всё идет по плану и поддержка ей не нужна."
      - "Давайте просто придерживаться наших собственных боевых планов."
  - char: "prinz_eugen_rad"
    side: "left"
    text:
      - "Ой~ И правда, мне ведь совсем не обязательно следовать приказам вашего Командира."
      - "Тогда как насчет небольшой гонки?"
      - "Если не хотите, чтобы Железная Кровь увела вашу цель из-под носа, советую вам поторопиться♪"
  - char: "warspite_kai"
    side: "right"
    text:
      - "Да ты!"
      - "Хех, Железная Кровь бросает нам вызов таким образом..."
      - "Вызов принят... Всем внимание, мы увеличиваем скорость продвижения!"
